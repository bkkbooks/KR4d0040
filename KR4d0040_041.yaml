body:
  text: 章奏二十六論責降劉述等劄子再舉諌官劄子請優賞宋昌言劄子再乞資蔭人試經義劄子乞不㨂退軍置淮南劄子辭樞密副使第一劄子辭樞密副使第二劄子辭樞密副使第三劄子乞罷條例司常平使疏論責降劉述等劄子臣竊聞知雜御史劉述集賢校理丁諷審刑詳議官王師元皆以執守謀殺刑名差官取勘侍御史劉琦錢顗皆以論列政府公事除貟外郎降監酒稅中外聞之無不驚諤臣聞孔子曰守道不如守官孟子曰有言責者不得其言則去此古今之通義人臣之大節也彼謀殺巳傷自首刑名天下皆知其非今朝廷既違衆議而行之又罪守官之人臣恐重失天下之心也夫紲食鷹鸇求其鷙也鷙而烹之將何用哉陛下踐阼以來待臣下以寬仁至如皮公弼陛下明知其貪閻充國陛下明知其猥也二人皆以知縣權發遣三司判官公事及得罪而出皆為知州今琦顗所坐不過狂直止以忤犯大臣遂降為監當然則狂直之罪重於貪猥得罪大臣甚於得罪陛下也臣不勝拳拳竊恐來者側目箝口以言為諱威福移於臣下聰明有所壅蔽非國家之福也臣備位近臣親𬒳明詔覩朝廷政事之闕不敢不言伏望聖慈深察愚忠早賜指揮赦劉述等更不取勘其劉琦等别除一夲資序差遣庶幾稍息群議取進止再舉諌官劄子臣昨日靣奉聖旨令臣采訪可任諌官者密具姓名聞奏臣竊見龍圗閣直學士陳薦舊事陛下於藩邸其忠厚質直陛下必素知之直史館蘇軾制䇿入優等文學冨贍曉逹時務徑直敢言職方貟外郎王元規自少至長志操堅正所居之官皆著風迹集賢校理趙彥若師民之子強學懿行不減於父平居恂恂如不勝衣遇事剛徑人莫能奪此四人者臣所素知竊謂可備諌職伏乞聖明更賜裁擇取進止貼黃蘇軾王元規趙彥若官職臣不能審記竊慮差誤不敢訪問於人恐致漏泄趙彥若昨任淄州通判與知州解賔王爭公事見降充監當請優賞宋昌言劄子臣聞國家大政在於賞罰明當若賞罰明當功無不成臣去冬奉勑與張茂則相度二股河及生隄利害當時都水監丞宋昌言建議欲於二股河口西岸新灘上置立上約劈攔水勢令入東流候向去東流漸深北流淤淺即閉塞斷北流放出御河胡盧河下流以除恩冀深瀛以西諸州軍水患臣等因得其言尋具此利害奏聞蒙朝廷聽許令修置上約自後昌言同列提舉修生隄者以䇿非己出百端沮毀以為二股河必不可成不如併力修生隄及李立之赴闕上殿所言陛下所親聞也賴陛下聖明斷在不疑必使之修置上約今秋劈欄得水勢一併入東流其北流尋巳閉斷雖頗漂溺損近東滄德等州民田廬舍然恩冀深瀛以西州軍蒙利亦為不少其宋昌言不可謂之無功今若與同列稱二股河不可成者一例受賞臣竊恐當官之人覩之無所沮勸况昌言因去歲職當在外河決棗強獨奪一官今若止復舊官則是衆人受賞而昌言獨不得賞也設使嚮者修上約不成或背了二股併入北流其同列豈肯分昌言之罪伏望聖慈察昌言建議之功特與復舊官外更與董役之人等第别加酬奬庶使向去用心向公者知朝廷必不負之也取進止再乞資蔭人試經義劄子臣先曽起請應資蔭出身人初授差遣者更不試詩只委審官院流內銓試孝經論語大義共三道仍令主判臣僚更將所對義靣加詢問若義理精通者特保明聞奏優與差遣稍通者依常調不通者且令修學候一年外再試必須試中方得出官若年四十以上聽依舊制只寫家狀讀律自後不蒙朝廷施行臣今復差知審官院竊見資蔭人𥘉授差遣者令試詩一首實為無益不惟其間有墻靣者假手於人徒長姦偽就使自作詩得如曹劉沈宋其於立身治民有何所用古者二帝三王皆立大學之官以教公卿大夫子弟其何故哉蓋以其人將嗣守官業苟無德行道藝則必害及於民故也今若欲使公卿大夫子弟盡肄業於太學則其父兄不常在京師固難齊一若但使之習業於家而考校於初授差遣之際業不習者不得出官則不煩勸督而人人自勉於學矣此乃事之易行者也嚮若使之盡通詩書禮樂則中材以下或有所不及今伹使之習孝經論語儻能盡期年之功則無不精熟矣此乃業之易習者也然孝經論語其文雖不多而立身治國之道盡在其中就使學者不能踐履亦知天下有周公孔子仁義禮樂其為益也豈可與一首律詩為比哉臣竊以為兹事用力不勤更張甚易而為益稍大别無所損伏望聖明詳察或有可取乞檢臣前奏特賜施行取進止乞不㨂退軍置淮南劄子臣竊聞道塗之言未審虛實或云朝廷欲揀在京禁軍年四十五以上微有程切者盡減下請給兼其妻孥徙置淮南以就糧食若實有此議臣竊以為非冝何則在京禁軍及其家屬率皆生長京師親姻聮布安居樂業衣食縣官為日固久年四十五未為襄老微有呈切尚任征役一旦别無罪負減其請給徙之淮南是橫遭降配也諸軍之內沙汰甚多必恐人情惶惑大致愁怨雖國家承平無事綱紀具張此屬恟恟不安亦無能為患然詔書一下若萬一有道路流言驚動百姓朝廷欲姑務省事復為收還則頓失威重向去無以復號令驕兵若遂推而行之則衆怒難犯專欲難成意外之變不可不防梁室分魏博之兵致張彥之亂且近事之可鑑者也故臣願朝廷更當深思熟議未宜遽下此詔也夫水未至而虛為之防水雖不至亦無所害謂水不足憂而不為之防一旦水至則防無聽及矣故君子貴於思患而豫防之也且國家竭天下之財養長征兵士夲欲備禦邊陲今淮南非用武之地而多屯禁軍坐費衣食是養無用之兵置諸無用之地也又使邊陲常無事則巳異日或小有警急主兵之臣必爭求益兵京師之兵既少必須使者四出大加召募廣為㨂選將數倍多於今日所退之兵舊兵尚請衣糧未至而新兵更添衣糧是棄已教閲經戰之兵而收市井甽畒之人夲欲減冗兵而冗兵更多夲欲省大費而大費更廣竊恐非計之得者也臣愚伏願朝廷且依舊法每歲㨂禁軍有不任征戰者減充小分小分復不任執役者放充百姓聽其自便在京居止但勿使老病者尚占名籍虛費衣糧人情既安於所習皆無怨嗟國家又得其力用不為虛設冗兵既去大費自省在理甚明於事為便臣備位近臣兹事繫國家安危不敢不言取進止辭樞密副使第一劄子臣準閣門告報巳除臣樞密副使續準句當御藥院陳承禮傳宣令臣即今授勑告者臣賦分朴愚不通時務近日以來加以衰疾恪居舊職猶恐隳敗况乃技擢待之不次竊惟宥密之地日侍訏謨內訓六師外撫四海用人當否繫國安危豈臣無似所能堪稱伏望聖慈更擇賢材俾居其任聽臣且守舊職取進止辝樞密副使苐二劄子臣準句當御藥院黎永德奉宣聖旨令臣即今入見者臣屢違嚴詔當伏重誅但以聞命以來揣分巳熟自幼及長頗讀經史捨此之外一無所長當丗之務懵不通曉常日置之開官僅脫矌敗尚以屬文不工剸劇非長翰林審官每欲辝免况於樞府要地任重責大一日失職則死及之臣雖至愚粗知自愛陳力就列古人所韙是以寧冒違詔之罪不敢當竊位之譏伏望聖慈察其悃𣢾㳏非虛飾特賜寢罷新命止守舊職天地更生之惠臣莫大之幸也取進止辝樞密副使第三劄子臣前者兩次曽辝免樞密副使未奉俞旨竊慮區區之誠未能上逹須至詳悉復有奏陳臣聞人之材性各有能有不能人主量材然後授官人臣審能然後授事是以官不曠而事無敗也臣幸生承平之時家丗為儒臣自髫齓至于弱冠杜門讀書不交人事仕宦以來多在京師少歷外任故於錢榖刑獄繁劇之務皆不能為况於軍旅固所不習獨於解經述史及以愚直輔過拾遺不避怨怒則庶幾萬一或有可取是以每於拜官之際辭所不能而不辭其所能嚮者除開封府推官以繁劇曽辭後除修起居注知制誥翰林學士以文來不工曽辭除龍圖閣直學士以久在諌職無效曽辭再除翰林學士兼侍讀學士以言事未了曽辭除史館修撰以方修資治通鑑恐朝廷修國史難以兩處供職曽辭自餘除國子監直講館閣校勘史館檢討集賢校理直祕閣起居舍人同知諌院天章閣待制兼侍講知諌院權御史中丞此皆朝廷清要之職除書始下臣即時受命未嘗輒辭所以然者自度駑鈍可以䇿厲不至曠敗故也天下之人見臣屢辭恩命或以為不慕榮貴或以為飾詐邀名是皆不知臣者也臣自幼習賦詩論䇿應舉就試每三年一次投狀乞磨勘豈不慕榮貴者邪臣若隂有營求陽為辭避乃可謂之飾詐邀名陛下察臣何嘗如此豈飾詐邀名者邪臣之愚心正欲辭所不能而已今二府之任自非天下英傑之士不可輕處豈臣愚淺下材所能堪稱或遇國家大事參陪末議有毫釐之差使陛下有旰食之憂以纍知人之哲臣雖伏質橫分不足塞責加之素有目疾不能逺視近日以來頗多健忘居常供職猶懼廢闕况以衰病當兹重任是用披肝瀝膽昧冒上陳違犯詔旨至于再三觸法抵罪不自知覺伏望聖慈持賜矜察依臣前奏追還新恩俾守舊職不勝憂慙危切之誠臨𥿄叩頭俯伏俟命取進止乞罷條例司常平使疏二月二十日具官臣司馬光謹昧死再拜上疏皇帝陛下臣蒙聖恩除樞密副使仍屢遣陳承禮等趣臣就職德澤汪洋天隆地厚非臣隕身糜骨所能報稱然臣竊惟陛下所以用臣之意蓋察臣狂直庶幾有輔於國家臣所以事陛下之心亦不過竭其愚忠以禆聖德之萬一若陛下徒以祿位榮臣而不取其言則是以天官私非其人臣徒以祿位自營而不能救生民之患則是盜竊朝廷名器以私其一身誠恐上纍陛下之至公下喪微臣之素守此臣所以屢違詔命不敢祗受者也臣伏見陛下天縱英明勵精求治思得嘉謀以新美天下而建畫之臣不能仰副聖意思慮未熟講議未精徒見目前之小利不顧永久之大害憂政事之不治不能輔陛下修祖宗之令典乃更變亂先王之正刑正刑正法也患財利之不足不能勸陛下以恭儉節用乃更遣聚斂之臣誅剝齊民設官則以冗增冗立法則以苛益苛使四海危駭百姓騷然猶且堅執而行之不肯自以為非也臣先曽止疏言不當設制置三司條例司又言天下之事當委之轉運使知州知縣不當别遣使者擾亂其間又嘗因經筵侍坐言散青苗錢不便自後朝廷更遣使者四十餘人分行天下以提舉句當常平廣惠倉相度差役農田水利為名其實專使之散青苗錢臣竊自疑智識淺短不足以知天下變通之務又疑因臣之言激怒建畫之臣使行之更力由是閉口不敢復言今行之才數月中外鼎沸皆以散青苗錢為不便然後臣乃敢發言彼言青苗錢不便者大率但知所遣使者或年少位卑倚勢作威陵轢州縣騷擾百姓止論今日之害耳臣所憂者在十年之後非今日也夫民之所以有貧冨者由其材性愚智不同冨者智識差長憂深思逺寧勞筋苦骨惡衣菲食終不肯取債於人故其家常有嬴餘而不至狼狽也貧者啙窳偷生不為逺慮一醉日冨無復嬴餘急則取債於人積不能償至於鬻妻賣子凍餒填溝壑而不知自悔也是以冨者常借貸貧民以自饒而貧者常假貸富民以自存雖苦樂不均然猶彼此相資以保其生也今縣官乃自出息錢以春秋貸民民之冨者皆不願取貧者乃欲得之提舉官欲以多散為功故不問民之貧冨各隨户等抑配與之冨者與債仍多貧者與債差少多至十五緡少者不減千錢州縣官吏恐以逋欠為負必令貧冨相兼共為保甲仍以冨者為之魁首貧者得錢隨手皆盡將來粟麥小有不登二稅且不能輸况於息錢固不能償吏督之急則散而之四方冨者不去則獨償數家所負力竭不逮則官必為之倚閣春債未畢秋債復來歷年寖深負債益重或值凶年則流轉死亡幸而豐稔則州縣之吏併催積年所負之債是使百姓無有豐凶長無蘇息之期也貧者既盡冨者亦貧臣恐十年之外冨者無幾何矣冨者既盡若不幸國家有邊隅之警興師動衆凡粟帛軍須之費將從誰取之臣不知今者天下所散青苗錢凡幾千万緡若民力既竭加以水旱之災州縣之吏果有仁心愛民者安得不為之請於朝廷乞因郊赦而除之朝廷自祖宗以來以仁政養民豈可視其流亡轉死而必責其所負其勢不得不從請者之言也然則官錢幾千万緡巳放散而不返矣官錢既放散百姓又困竭但使閭胥里長於收督之際有乞取之資此可以謂之善計乎且常平倉者乃三代聖王之遺法非獨李悝耿壽昌能為之也榖賤不傷農榖貴不傷民民賴其食而官收其利法之善者無過於此比來所以隳廢者由官吏不得人非法之失也今聞條例司盡以常平倉錢為青苗錢又以榖換轉運司錢是欲盡壞常平專行青苗也國家每遇凶年供軍倉自不能足用固無羡餘以濟飢民所賴者止有常平錢榖耳今一旦盡作青苗錢散之向去若有豐年將以何錢平糴若有凶年將以何榖賙贍乎臣竊聞先帝嘗出內藏庫錢一百萬緡助天下常平倉作糴夲前日天下常平倉錢榖共約及一千餘萬貫石今無故盡散之他日若思常平之法復欲收聚何時得及此數乎臣以謂散青苗錢之害尤小而壞常平之害尤大也今國家每有大費三司所不能供者陛下輒取內藏庫物以給之彼內藏庫者乃祖宗纍丗之所蓄聚以備軍旅非常之用也使其物常如泉源流出於庫無有窮竭之時則可矣若夲皆斂之於民以實之有時而空矣昔漢文帝欲作露臺召匠計之直百金上曰百金中人十家之産也吾何以臺為太宗時兖王嘗作假山召僚屬置酒觀之翊善姚坦獨俯首不視王強使視之坦曰坦唯見血山耳不見假山王驚問其故坦曰坦在田舍時見州縣督稅里胥臨門捕人父子兄弟送縣笞撻血流滿身愁苦之聲不可忍聞此假山皆民租賦所為非血山而何是時上亦自為假山聞之遽命毀之今陛下令薜向於江淮為貿易以三百万緡卑之又散青苗錢數千萬緍其餘五十萬三十萬者固不足數爾其為露臺假山之費不亦多乎陛下聰明仁儉固不減於漢文帝及太宗然而視棄財物如糞土者蓋未知其所從來皆出於生民之肌血耳陛下若終信條例司所言推而行之不肯變更以循舊貫十年之外冨室既盡常平巳壞帑藏又空不幸有方二三千里之水旱飢殍滿野加以四夷侵犯邊境羽書狎至戎車塞路攻戰不巳轉餉不休當是之時民之羸者不轉死溝壑壯者不聚為盜賊將何之矣秦之陳勝吳廣漢之赤眉黃巾唐之黃巢皆窮民之所為也大勢既去雖有智者不能善其後矣臣竊惟太祖太宗躬擐甲胃櫛風沭雨跋履山川蒙犯矢石以為子孫成光明盛大之業如此其美也陛下試取臣所進歷年圖觀之自周末以來至于國𥘉一千三百六十有二年其間亂離板蕩則固多矣至於中外無事不見兵革百有餘年如國朝之盛者豈易得乎此臣所以尤為陛下痛惜者也書曰民不靜亦惟在王宮邦君室臣竊觀方今四夷親附邊鄙不聳五榖和熟盜賊稀簡是冝為天下和樂無事之時而中外恟恟人不自安者無他故也正由朝廷有制置三司條例司諸路有提舉句當常平廣惠倉使者爭獻謀畫各矜智巧變更祖宗法度侵奪細民常産掊斂財利以希恩寵非獨此青苗一事而巳至於欲計畒率錢雇人充役決汴水以種稻及澆溉民田及欲泄三十六陂水募人耕佃若此之類不可悉數道路之人共所非笑而條例司自以為髙竒之䇿書以授常平使者必欲行之天下恐其興作之不巳皆如青苗為害於民也故小大遑遑不敢自安苟不罷廢此局則生民必無休息之期矣陛下誠能昭然覺悟采納臣言罷制置三司條例司及追還諸路提舉句當常平廣惠倉使者其官貟並送審官院與合入差遣青苗錢巳散者令州縣候豐熟日催收夲錢更不取利未散者無得更散其常平倉錢榖依舊封椿令提點刑獄司管句則太平之業依然復故矣兹事明如白黑易如返掌陛下何憚而不為也如此臣雖盡納官爵但得為太平之民以終餘年其幸多矣苟言不足采陛下雖引而置諸二府徒使天下指臣為貪榮冒寵之人未審陛下將何所用之不勝慺慺狂愚之誠惟聖明裁處臣光昧死再拜以聞溫國文正公文集卷第四十一
