body:
  text: 碑誌一處州縉雲縣尉張君墓誌銘玉城縣君楊氏墓誌銘右騏驥副使蘇君墓碣府州軍事判官杜君墓誌銘石昌言哀辭渠州鄰水縣令吴君墓誌銘進士吴君墓誌銘彭城縣君劉氏墓誌銘贈都官郎中司馬君行狀都官郎中司馬君墓誌銘宋故處州縉雲縣尉張君墓誌銘故翰林侍讀學士張公有子曰某前公若干年卒殯楚州後若干年與公皆葬襄城時皇祐五年閏月甲申也其弟大理寺丞某以治行來求銘光獲事侍讀公爲日乆又與君之兄弟逰今也不敢以愚陋辭而不爲姑譔次其所聞納諸壙云君字仲倩其丗家郷黨見於侍讀公之碑君性嗜學年十五志節巳皦皦出人有從母嫠居將從其女於保德軍子㓜不能自致君奮曰人母子單弱如此於以渉逺我獨何以坐視之邪即白父母請送之父母疑其尚少然聞其言甚說即遣之君胃盛寒往返數千里曽不爲勞人皆嘆其仁而有立以䕃𥙷太廟齋郎及長調縉雲尉治有聲迹縣有淫祀曰五通人嚴事之歲旱君遍禱群祀不及五通吏民以爲請君不得巳強往禱且卜之巫曰不吉必無雨比歸雨大至君笑曰果然雨不雨非妖鬼事也而敢屢爲變恠以驚愚民是不可不除即部吏卒焚㓕其祠捽土偶人投江中歲亦大熟官滿歸道病或請留傳舎俟愈而行君曰吾官逺方不獲侍親之左右四年于此矣今幸歸至舎見吾親而死吾目瞑矣又何可留趣舟而行及楚州卒年二十八娶袁氏故諌議大夫煒之孫生二男絪試將作監主簿繼太常寺太祝二女其㓜者早夭𥘉侍讀公有五子光知其三人焉而不及識君三人者皆甚才然猶自謂不如也侍讀公沒兄弟寓居汝潁間食口衆無田宅以自給咸泣曰縉雲在吾屬豈憂此乎言其知力足頼而不遺其親也嗚呼使顯於朝而老所施設豈若是而巳哉銘曰苑彼嘉木煒煒其華實而未碩孰披之柯人之明果胡壽不遐思而悲者豈伊其家故玉城縣君墓誌銘并序夫人姓楊氏故尚書工部郎中直史館韓公之配也公之丗系事業龍圗閣直學士郭公誌之矣夫人之先在唐爲盛族居靖恭坊五代之亂衣冠之緒零落殆盡唯靖恭楊氏徙家于吴丗有顯人迄于今不絶考諱蛻仕至尚書司封郎中精於吏治所至著聲迹始韓公娶夫人之姉生男鑑鐸及二女不幸早丗公曰楊氏名族吾旣謀於宗而卜於廟矣不可易也迺復請昏于夫人夫人年若干歸韓氏生男鎮鉞𥘉封真定後更封玉城縣君爲人慈和淵靜不喜聲味自少及長家人伺其動靜語黙皆有常度未甞移也其撫視六子衣服飲食無絲毫薄厚六子亦相與親愛如一雖中外族婣莫知其爲異母也年三十九而喪韓公三年不茹葷自是閉閤深居曰誦佛書不復有自虞樂之意年五十以至和元年三月乙亥終其五月壬申祔于公之墓時鑑爲某官鐸爲某官鉞巳前卒鐸與光遊素乆因狀夫人之行命光爲之銘光不得辭曰允矣夫人德則均壹而行有常邪承祖之休冝于夫家而壽不將邪福禄當有餘而更不足子孫其昌邪蘇騏驥墓碣銘序爲孫器之作蘇氏之先出自重黎忿生爲周武王司㓂封於温丗爲卿士或謂之温子春秋時蘇子爲狄所滅子孫以邑爲氏歴丗乆逺散之四方在洛陽者秦厲代以口辯顯戰國丗在杜陵者建爲漢名將子武使匈奴中十九年不屈節在武功者綽仕宇文周以明法令爲某官子威隋文帝佐命功臣至唐瓌父子爲賢相比其章章尤著者也周衰温爲晉邑漢屬河内郡隋以河内爲懷州維修武之族不棄其故土留懷州不去公其後焉公諱某字某曽大父某大父某皆不仕父某贈左司衛率公㓜慷慨有逺志自力讀書不治家事宗族爭笑且怒之曰汝丗農家勤治耕桑以豊衣食汝忽棄業爲書生窮餒無日矣公曽不顧爲學益堅早䘮二親哀毀過禮郷曲稱之弱冠舉三傳科景德中契丹南侵河北盗賊蠭起公於是盡散家財糾合郷曲子弟結以信義扞禦群㓂修武由是獲全大將軍某北征公踵軍門上謁延入與語兵事大恱即奏偕行至中山㑹契丹圍城甚急用公之䇿卒拒却之於是天子曰契丹犯塞河北士子躬𬒳甲胃扞敵有功今天下貢舉巳畢朕憐夫北方賢士大夫不得以時充貢其皆召試賜第公由是解褐𥙷符離尉縣多㓂盗吏卒單弱公獎訓率厲擒馘七十餘人闔境清肅改河清主簿考滿吏民群詣轉運使所請留詔聽更留成資而去遷遂州録事叅軍本道論薦召對擢爲大理寺丞知大名縣事㝷除通判州事入朝遷太子中舎國家㳂前丗故事分文武百官爲二塗其遷次任使皆不相叅渉有願相移易者聽之以公素喜武事加習邊務遂改供備庫副使知威勝軍事繼典嵐莫石鳯䕫五州皆著聲績官歴東染院洛苑二副使其在夔州兼䕫梓兩路兵馬都監提舉諸州廵檢兵甲事乆之上表乞朝因言邊防民政諸利害稱旨遷右騏驥副使同提點湖南兩淅刑獄公事年七十四以慶暦二年十月十三日終於長沙官舎公始雖以學術爲文吏而性好勇有智略晚年夏㓂若邊諸將多敗北無功公聞之嘆曰吾以布衣起家至方伯承兩朝恩渥不可勝紀家近趙魏粗習兵略今狂虜驕嫚侵擾疆埸而吾老病不得荷戈前驅以報萬一豈非命也然卒不得盡其志嗚呼哀哉夫人張氏先公即丗子四人師古果州團練判官師顔衞州司法叅軍夢臣獲嘉縣主簿季子師說及孫孝先曽孫叔元皆三班借職餘孫若干人㓜未官公之在荆湖也夢㠯爲三班奉職以公髙年多疾求告省侍朝廷以武吏求省侍無故事不許即乞改文職歸省方許之行及苑葉間聞喪因號泣晝夜奔赴凡七日行千三百里近丗官逺方而殁者子孫多焚其柩以燼歸葬相習爲常無譏誚者夢臣獨奮曰爲人子孫忍行此豈人心也哉自長沙數千里奉柩以歸嗚呼其信知義而断不與俗流者夫古人稱善人者其身不耀必在子孫豈信然邪某年月日葬於某所先府君之兆夫人張氏祔某郷邑於公近又乆承公之知故其於公之始終治行也於佗人爲悉其諸子以碣文爲請光何敢辭謹銘銘闕故府州軍事判官杜君墓誌銘嘉祐二年秋光在京帥進士杜知臣涕泣來言曰大人昔以進士得見於先公又與子遊最乆今不幸而沒子爲我銘其墓光旣吊因辭以不文不敢爲知臣固請曰佗人知臣所不敢請也故唯子之歸光廼曰然則願聞子先君丗系治行之詳知臣退以其狀求曰君諱陟字從聖其先自成都徙長江曽大父禮大父鍔皆不仕父昭文遂州長史君少好古學無所不闚著化坊三十一篇言王者以敎化坊民之道慶暦𥘉天子詔諸州皆立學擇其士之賢有行者爲之師州人共推上君君屢舉進土有司失之卒以三禮釋褐選𤏡道尉考蒲遷府州軍事判官力於吏治轉運使提點刑獄交章薦之㑹屬官有以姦贜敗者怨恨反誣訟君坐罷官去君詣闕欲自理未果遇疾以八月巳巳終於里舎年五十有七娶譚氏生三子男知臣女長適卞宗建幼適姚申皆舉進士嗚呼杜君觀其所學與所爲書其志豈欲如是而止哉卒無遇以窮斯可哀矣知臣負其䘮歸以其年月日葬某地銘曰學之也勤守之也專仕進迍邅又不永年嗚呼孰知其然必歸之天石昌言哀辭眉山石昌言年十八州舉進士倫軰數百人昌言爲之首聲振西蜀四十三迺及第十八年知制誥又三年以疾終嗚呼少而秀冝其速成返齟齬不進晚而逹冝其壽又未老而終天道幽逺真不可得而識邪昌言爲人純素忠謹望之儼然以律度自居即之恂恂温厚善談笑令人心醉不能舎去光爲兒始執卷則聞昌言名巳而同年登進士第與昌言遊凡二十年自始得見至於永訣其間迭有進退窮通相遇如一日旣不可得而親亦不可得而踈也詩云淑人君子其儀一兮其儀一兮心如結兮昌言之謂邪於未沒數日光往見之起居固無恙一旦有人告曰昌言去夜得疾甚急未及問訊又有継至者曰昌言沒嗚呼死者人之常善惡脩短固不敢言何奪之之暴也前年光自晉陽歸昌言延我於中堂酌滑臺暑釀以飲我及往奠於畫像之前則依然昔時置酒處也嗚呼誰能睹是而不慟也哉迺爲之辭曰嗚呼昌言天旣賦以純羙兮胡有德而不年榮禄何後兮零落何先幾日不見兮邈然九泉士喪師友兮國亡俊賢緑耳顛躓兮璵璠棄捐冥冥不可求兮杳杳不可追獨行過門兮怳焉自疑車馬不見兮逺行何之忽思長逰兮涕下交頥寒暑回薄兮宿草離離哭也有終兮忘也無時宋故渠州鄰水縣令贈太常博士吴君墓誌銘君之先丗家金郷曽大父諱賁不仕大父諱豫贈太常丞始葬洛陽金谷郷之尹里父諱蒨太平興國中進士髙第以公直材敏立名朝廷數迕權貴由是不得居中連典大州官至侍御史亦葬尹里君諱元亨字子正用御史遺奏𥙷太廟齋郎遷許州司士叅軍選授永康尉歴河中府法曹叅軍馮翊令馮翊華隂以􅃮沮爲境中間洲上有美田民相與爭之五十餘年吏不能決君檄華隂令㑹境上盡案兩郷之籍徧履其田執度以度之皆得其實自是民不敢復爭時人稱之君爲人勤廉專以誠長者處官不能飾智巧以媚上故官乆不遂官滿集吏部選除鄰水令還未至家道疾抵知洛陽縣李宋卿宋卿延之縣舎以天聖九年八月二日終年四十一宋卿主辦其喪殯於永安佛室夫人聶氏秘閣校理震之女後君五年長男顥先夫人二年皆不禄獨少男幾復年未冠及幼女一人相與居家無一金之産幾復於孤貧中能自刻意爲學取進士第今爲太常愽士知蓬州事累贈君官至太常愽士夫人封仙源縣太君嫁其妹於比陽令李鵬嘉祐五年秋蓬州將之官泣謂光曰幾復先君夫人之遺體常恐不克續承祭祀今幸有禄秩室家苟完矣念先君先夫人之久未葬痛切不少忘于心况又逺宦於蜀忍置而去乎將以八月某日葬於梁縣之新豐郷西成里子與我皆聶氏甥也先君治行子皆知之其爲我譔銘光曰懼不能堪子之命敢不諾銘曰御史之賢顯大於丗及君恂恂清德不墜迨君之終家旤相継㣲蓬州之立吴氏幾廢嗚呼以君之慈良而沉抑不遂冝其有嗣宋故進士呉君墓誌銘君諱顥字某其先金郷人曽祖某贈太常丞祖某侍御史父某鄰水縣令贈太常博士鄰水府君娶於秘閣校理聶君某於某爲從母鄰水府君之没也先妣在鄭君衰絰來入門哭且拜問故又哭先妣命與某處於是時君年尚未冠爲人長大有容觀論議忼慨讀書屬文材敏過人爲進士業巳完美先妣嘆曰吾妹不幸早喪其良人今有是子也吾妹猶有望間二歳君以疾卒於蒲阪年二十一先妣聞之哭曰吾妹何負於天使至此極也巳而弟幾復負其喪殯於汝州佛舎後二十六年幾復爲太常愽士乃舉其喪葬於梁縣以從鄰水府君之兆時某年月日也銘曰特苗之秀未實而朽繫時之逢無有美醜骨兮有歸祭兮有依下從先人夫又奚悲宋故侍御史呉君夫人彭城縣君劉氏墓誌銘嘉祐五年某月日太常愽士知蓬州事呉君幾復袝其祖妣彭城縣君劉氏下祖考御史府君之墓始夫人之没蓬州生二年矣比冠而父母兄皆即丗家至貧漂泊汝洛間甞記㓜時聞其兄言夫人之殯在京師廣濟寺巳舉進士及第乃求所謂廣濟佛寺者凢有二焉在城之東西往問夫人之殯皆莫能知蓬州刻志求之積年不得一旦至西寺有僧老矣忽來訊曰君非鄰水令呉君之子邪曰然僧曰去三十載之前呉君殯其母夫人於是某爲童子手親塗之某亦呉姓也故能識之因指示其處蓬州未之敢信周視其塗圯剥且盡所餘如掌而鄰水府君之題識存焉乃奠而哭之又數年然後得合葬於洛陽之金谷郷自始没至葬四十二年矣噫㣲是孫也則夫人之柩其不可復得邪露殯積乆而題識獨存豈非鄰水府君自悼其不幸未葬而天隂相之邪乃知誠孝可以動鬼神信矣御史府君諱某鄰水府君諱某夫人平生行事不可復見其先單父人父爲尚書郎云銘曰夫人旣終呉氏中微四十餘年乃得其歸孝孫有立神實告之故處士贈尚書都官郎中司馬君行狀曽祖林祖政父炳皆不仕君諱沂陜州夏縣涑水郷髙堠里人其先出於晉安平献王至征東大將軍陽始葬於河東安邑涑水之南後魏孝文帝大和中分安邑爲夏縣遂爲夏縣人自唐以来仕宦陵夷降在畎畒然累丗兄弟未甞異居故家之食口甚衆而生業素薄无以贍之君㓜以孝謹諸父兄悉以家事委之於是治田疇繕園圃修闌笠完囷倉雖有傭保必以身先之使莫敢不盡力者夜則側板而枕之寐不至熟輒寤當是時田不加廣而家用饒又未甞爲啇賈竒衺之業一岀於田畜而巳諸父兄皆醉飽安佚而君無故不親酒肉遇郷人之匱乏者或解衣以濟之年三十二以景德三年十二月丙子終於家某年月日葬於南原待制府君常嘆曰自吾兄之亡而家遂貧豈所以資生之具减於昔勤惰不同而已矣嗚呼使天下之民皆若吾兄之爲雖古治丗何以加惜其無位而才不大施也夫人李氏同里人年二十八而寡二男詠里及一女皆㓜詠及女㝷又卒父母欲奪其志夫家尊章亦遣焉夫人自誓不許惡衣𬞞食躬執勤苦使里之四方就學姑李氏老且病常卧一榻扶然後起哺然後食夫人左右就養未甞小失其意如是積年以至於没无懈倦之色旣而里登進士第迎夫人之官夫人自㓜未甞與其母别至是思慕成疾乆之方愈里累遷爲尚書都官郎中歴典數州贈君官至尚書都官郎中夫人封永夀縣太君夫人爲人慈柔勤儉中外宗族咸慕仰之始終一無間言子爲二千石極其榮養年八十三以嘉祐五年九月甲寅終於京師其年十一月壬寅祔於君之墓光不及事君而及事夫人故得書其聞見之實以請於今之德行文辝爲人信者以表其墓庻幾傳於不朽而子孫有所法則焉謹狀嘉祐六年六月日從父弟子具位某狀宋故處士贈尚書都官郎中司馬君墓誌銘并序君諱某其先出自晋安平獻王自周隋之前家涑水之上至唐仕宦陵夷降在畎畒曽祖諱林祖諱政父煒炳累丗同㸑食口甚衆父兄以君孝謹自㓜以家事委之君晝夜服勤不遺餘力專以稼穡畜牧致饒給不事竒衺末業所獲悉以奉六親有餘則及郷人身無私焉年三十二以某年月日終某年月日葬於涑水南原先待制府君常嘆曰自吾兄之亡而家始貧使天下之民皆若吾兄之爲雖古至治之丗何以尚諸惜其無位而才不大施也夫人李氏同里人年二十八而寡父母欲奪其志夫家尊章亦遣焉夫人自誓不許惡衣𬞞食躬執勤苦敎育二子詠不幸早丗里登進士第累遷尚書都官郎中歴典數州贈君官至尚書都官郎中夫人封永壽縣太君夫人爲人孝慈勤儉中外宗族慕仰其德一無間言子爲二千石極其榮養年八十三以某年月日終於京師某月日祔於君之墓光不及事君而事夫人乆敢書間見之實而繫之以銘銘曰士不得位善無所施勤儉于躬家道以肥宗族是頼郷黨是師壽之少多命不可移有配有子後無棄基淑慝之效炤然不欺温國文正公文集卷第七十五
