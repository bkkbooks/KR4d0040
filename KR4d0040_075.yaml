body:
  text: 碑志一處州縉雲縣尉張君墓志銘玉城縣君楊氏墓志銘右騏驥副使蘇君墓碣府州軍事判官杜君墓志銘石昌言哀辭渠州鄰水縣令吳君墓志銘進士吳君墓志銘彭城縣君劉氏墓志銘贈都官郎中司馬君行狀都官郎中司馬君墓志銘宋故處州縉雲縣尉張君墓志銘故翰林侍讀學士張公有子曰某前公若干年卒殯楚州後若干年與公皆葬襄城時皇祐五年閏月甲申也其弟大理寺丞某以治行來求銘光獲事侍讀公為日久又與君之兄弟逰今也不敢以愚陋辭而不為姑撰次其所聞納諸壙云君字仲倩其丗家鄉黨見於侍讀公之碑君性嗜學年十五志節巳皎皎出人有從母嫠居將從其女於保德軍子幼不能自致君奮曰人母子單弱如此於以涉逺我獨何以坐視之邪即白父母請送之父母疑其尚少然聞其言甚説即遣之君胃盛寒往返數千里曽不為勞人皆嘆其仁而有立以蔭輔太廟齋郎及長調縉雲尉治有聲迹縣有淫祀曰五通人嚴事之歲旱君遍禱群祀不及五通吏民以為請君不得巳強往禱且卜之巫曰不吉必無雨比歸雨大至君笑曰果然雨不雨非妖鬼事也而敢屢為變怪以驚愚民是不可不除即部吏卒焚滅其祠捽土偶人投江中歲亦大熟官滿歸道病或請留傳舍俟愈而行君曰吾官逺方不獲侍親之左右四年于此矣今幸歸至舍見吾親而死吾目瞑矣又何可留趣舟而行及楚州卒年二十八娶袁氏故諌議大夫煒之孫生二男絪試將作監主簿繼太常寺太祝二女其幼者早夭𥘉侍讀公有五子光知其三人焉而不及識君三人者皆甚才然猶自謂不如也侍讀公沒兄弟寓居汝潁間食口衆無田宅以自給咸泣曰縉雲在吾屬豈憂此乎言其知力足賴而不遺其親也嗚呼使顯於朝而老所施設豈若是而巳哉銘曰苑彼嘉木煒煒其華實而未碩孰披之柯人之明果胡壽不遐思而悲者豈伊其家故玉城縣君墓志銘并序夫人姓楊氏故尚書工部郎中直史館韓公之配也公之丗系事業龍圗閣直學士郭公志之矣夫人之先在唐為盛族居靖恭坊五代之亂衣冠之緒零落殆盡唯靖恭楊氏徙家于吳丗有顯人迄于今不絶考諱蛻仕至尚書司封郎中精於吏治所至著聲迹始韓公娶夫人之姊生男鑑鐸及二女不幸早丗公曰楊氏名族吾既謀於宗而卜於廟矣不可易也乃復請昏于夫人夫人年若干歸韓氏生男鎮鉞𥘉封真定後更封玉城縣君為人慈和淵靜不喜聲味自少及長家人伺其動靜語默皆有常度未嘗移也其撫視六子衣服飲食無絲毫薄厚六子亦相與親愛如一雖中外族姻莫知其為異母也年三十九而喪韓公三年不茹葷自是閉閣深居曰誦佛書不復有自虞樂之意年五十以至和元年三月乙亥終其五月壬申祔于公之墓時鑑為某官鐸為某官鉞巳前卒鐸與光遊素久因狀夫人之行命光為之銘光不得辭曰允矣夫人德則均一而行有常邪承祖之休冝于夫家而壽不將邪福祿當有餘而更不足子孫其昌邪蘇騏驥墓碣銘序為孫器之作蘇氏之先出自重黎忿生為周武王司寇封於溫丗為卿士或謂之溫子春秋時蘇子為狄所滅子孫以邑為氏歷丗久逺散之四方在洛陽者秦厲代以口辨顯戰國丗在杜陵者建為漢名將子武使胸奴中十九年不屈節在武功者綽仕宇文周以明法令為某官子威隋文帝佐命功臣至唐瓌父子為賢相比其章章尤著者也周衰溫為晉邑漢屬河內郡隋以河內為懷州維修武之族不棄其故土留懷州不去公其後焉公諱某字某曽大父某大父某皆不仕父某贈左司衛率公幼慷慨有逺志自力讀書不治家事宗族爭笑且怒之曰汝丗農家勤治耕桑以豐衣食汝忽棄業為書生窮餒無日矣公曽不顧為學益堅早喪二親哀毀過禮鄉曲稱之弱冠舉三傳科景德中契丹南侵河北盜賊蜂起公於是盡散家財糾合鄉曲子弟結以信義扞禦群寇修武由是獲全大將軍某北征公踵軍門上謁延入與語兵事大恱即奏偕行至中山會契丹圍城甚急用公之䇿卒拒却之於是天子曰契丹犯塞河北士子躬𬒳甲胃扞敵有功今天下貢舉巳畢朕憐夫北方賢士大夫不得以時充貢其皆召試賜第公由是解褐輔符離尉縣多寇盜吏卒單弱公獎訓率厲擒馘七十餘人闔境清肅改河清主簿考滿吏民群詣轉運使所請留詔聽更留成資而去遷遂州録事參軍本道論薦召對擢為大理寺丞知大名縣事尋除通判州事入朝遷太子中舍國家沿前丗故事分文武百官為二塗其遷次任使皆不相參涉有願相移易者聽之以公素喜武事加習邊務遂改供備庫副使知威勝軍事繼典嵐莫石鳯夔五州皆著聲績官歷東染院洛苑二副使其在夔州兼夔梓兩路兵馬都監提舉諸州巡檢兵甲事久之上表乞朝因言邊防民政諸利害稱旨遷右騏驥副使同提點湖南兩淅刑獄公事年七十四以慶曆二年十月十三日終於長沙官舍公始雖以學術為文吏而性好勇有智略晚年夏寇若邊諸將多敗北無功公聞之嘆曰吾以布衣起家至方伯承兩朝恩渥不可勝紀家近趙魏粗習兵略今狂虜驕嫚侵擾疆埸而吾老病不得荷戈前驅以報萬一豈非命也然卒不得盡其志嗚呼哀哉夫人張氏先公即丗子四人師古果州團練判官師顔衛州司法參軍夢臣獲嘉縣主簿季子師説及孫孝先曽孫叔元皆三班借職餘孫若干人幼未官公之在荆湖也夢以為三班奉職以公髙年多疾求告省侍朝廷以武吏求省侍無故事不許即乞改文職歸省方許之行及苑葉間聞喪因號泣晝夜奔赴凡七日行千三百里近丗官逺方而殁者子孫多焚其柩以燼歸葬相習為常無譏誚者夢臣獨奮曰為人子孫忍行此豈人心也哉自長沙數千里奉柩以歸嗚呼其信知義而斷不與俗流者夫古人稱善人者其身不耀必在子孫豈信然邪某年月日葬於某所先府君之兆夫人張氏祔某鄉邑於公近又久承公之知故其於公之始終治行也於他人為悉其諸子以碣文為請光何敢辭謹銘銘闕故府州軍事判官杜君墓志銘嘉祐二年秋光在京帥進士杜知臣涕泣來言曰大人昔以進士得見於先公又與子遊最久今不幸而沒子為我銘其墓光既吊因辭以不文不敢為知臣固請曰他人知臣所不敢請也故唯子之歸光乃曰然則願聞子先君丗系治行之詳知臣退以其狀求曰君諱陟字從聖其先自成都徙長江曽大父禮大父鍔皆不仕父昭文遂州長史君少好古學無所不窺著化坊三十一篇言王者以教化坊民之道慶曆𥘉天子詔諸州皆立學擇其士之賢有行者為之師州人共推上君君屢舉進土有司失之卒以三禮釋褐選𤏡道尉考蒲遷府州軍事判官力於吏治轉運使提點刑獄交章薦之會屬官有以姦贓敗者怨恨反誣訟君坐罷官去君詣闕欲自理未果遇疾以八月巳巳終於里舍年五十有七娶談氏生三子男知臣女長適卞宗建幼適姚申皆舉進士嗚呼杜君觀其所學與所為書其志豈欲如是而止哉卒無遇以窮斯可哀矣知臣負其喪歸以其年月日葬某地銘曰學之也勤守之也專仕進迍邅又不永年嗚呼孰知其然必歸之天石昌言哀辭眉山石昌言年十八州舉進士倫輩數百人昌言為之首聲振西蜀四十三乃及第十八年知制誥又三年以疾終嗚呼少而秀冝其速成返齟齬不進晚而逹冝其壽又未老而終天道幽逺真不可得而識邪昌言為人純素忠謹望之儼然以律度自居即之恂恂溫厚善談笑令人心醉不能舍去光為兒始執卷則聞昌言名巳而同年登進士第與昌言遊凡二十年自始得見至於永訣其間迭有進退窮通相遇如一日既不可得而親亦不可得而踈也詩云淑人君子其儀一兮其儀一兮心如結兮昌言之謂邪於未沒數日光往見之起居固無恙一旦有人告曰昌言去夜得疾甚急未及問訊又有繼至者曰昌言沒嗚呼死者人之常善惡修短固不敢言何奪之之暴也前年光自晉陽歸昌言延我於中堂酌滑臺暑釀以飲我及往奠於畫像之前則依然昔時置酒處也嗚呼誰能睹是而不慟也哉乃為之辭曰嗚呼昌言天既賦以純美兮胡有德而不年榮祿何後兮零落何先幾日不見兮邈然九泉士喪師友兮國亡俊賢緑耳顛躓兮璵璠棄捐冥冥不可求兮杳杳不可追獨行過門兮恍焉自疑車馬不見兮逺行何之忽思長逰兮涕下交頥寒暑回薄兮宿草離離哭也有終兮忘也無時宋故渠州鄰水縣令贈太常博士吳君墓志銘君之先丗家金鄉曽大父諱賁不仕大父諱豫贈太常丞始葬洛陽金谷鄉之尹里父諱蒨太平興國中進士髙第以公直材敏立名朝廷數忤權貴由是不得居中連典大州官至侍御史亦葬尹里君諱元亨字子正用御史遺奏輔太廟齋郎遷許州司士參軍選授永康尉歷河中府法曹參軍馮翊令馮翊華隂以􅃮沮為境中間洲上有美田民相與爭之五十餘年吏不能決君檄華隂令會境上盡案兩鄉之籍遍履其田執度以度之皆得其實自是民不敢復爭時人稱之君為人勤廉專以誠長者處官不能飾智巧以媚上故官久不遂官滿集吏部選除鄰水令還未至家道疾抵知洛陽縣李宋卿宋卿延之縣舍以天聖九年八月二日終年四十一宋卿主辦其喪殯於永安佛室夫人聶氏祕閣校理震之女後君五年長男皓先夫人二年皆不祿獨少男幾復年未冠及幼女一人相與居家無一金之産幾復於孤貧中能自刻意為學取進士第今為太常博士知蓬州事纍贈君官至太常博士夫人封仙源縣太君嫁其妹於比陽令李鵬嘉祐五年秋蓬州將之官泣謂光曰幾復先君夫人之遺體常恐不克續承祭祀今幸有祿秩室家苟完矣念先君先夫人之久未葬痛切不少忘于心况又逺宦於蜀忍置而去乎將以八月某日葬於梁縣之新豐鄉西成里子與我皆聶氏甥也先君治行子皆知之其為我撰銘光曰懼不能堪子之命敢不諾銘曰御史之賢顯大於丗及君恂恂清德不墜逮君之終家禍相繼微蓬州之立吳氏幾廢嗚呼以君之慈良而沉抑不遂冝其有嗣宋故進士吳君墓志銘君諱皓字某其先金鄉人曽祖某贈太常丞祖某侍御史父某鄰水縣令贈太常博士鄰水府君娶於祕閣校理聶君某於某為從母鄰水府君之沒也先妣在鄭君衰絰來入門哭且拜問故又哭先妣命與某處於是時君年尚未冠為人長大有容觀論議慷慨讀書屬文材敏過人為進士業巳完美先妣嘆曰吾妹不幸早喪其良人今有是子也吾妹猶有望間二歲君以疾卒於蒲阪年二十一先妣聞之哭曰吾妹何負於天使至此極也巳而弟幾復負其喪殯於汝州佛舍後二十六年幾復為太常博士乃舉其喪葬於梁縣以從鄰水府君之兆時某年月日也銘曰特苗之秀未實而朽繫時之逢無有美醜骨兮有歸祭兮有依下從先人夫又奚悲宋故侍御史吳君夫人彭城縣君劉氏墓志銘嘉祐五年某月日太常博士知蓬州事吳君幾復袝其祖妣彭城縣君劉氏下祖考御史府君之墓始夫人之沒蓬州生二年矣比冠而父母兄皆即丗家至貧漂泊汝洛間嘗記幼時聞其兄言夫人之殯在京師廣濟寺巳舉進士及第乃求所謂廣濟佛寺者凡有二焉在城之東西往問夫人之殯皆莫能知蓬州刻志求之積年不得一旦至西寺有僧老矣忽來訊曰君非鄰水令吳君之子邪曰然僧曰去三十載之前吳君殯其母夫人於是某為童子手親塗之某亦吳姓也故能識之因指示其處蓬州未之敢信周視其塗圯剝且盡所餘如掌而鄰水府君之題識存焉乃奠而哭之又數年然後得合葬於洛陽之金谷鄉自始沒至葬四十二年矣噫微是孫也則夫人之柩其不可復得邪露殯積久而題識獨存豈非鄰水府君自悼其不幸未葬而天隂相之邪乃知誠孝可以動鬼神信矣御史府君諱某鄰水府君諱某夫人平生行事不可復見其先單父人父為尚書郎云銘曰夫人既終吳氏中微四十餘年乃得其歸孝孫有立神實告之故處士贈尚書都官郎中司馬君行狀曽祖林祖政父炳皆不仕君諱沂陜州夏縣涑水鄉髙堠里人其先出於晉安平獻王至征東大將軍陽始葬於河東安邑涑水之南後魏孝文帝大和中分安邑為夏縣遂為夏縣人自唐以來仕宦陵夷降在畎畒然纍丗兄弟未嘗異居故家之食口甚衆而生業素薄無以贍之君幼以孝謹諸父兄悉以家事委之於是治田疇繕園圃修闌笠完囷倉雖有傭保必以身先之使莫敢不盡力者夜則側板而枕之寐不至熟輒寤當是時田不加廣而家用饒又未嘗為啇賈竒邪之業一出於田畜而巳諸父兄皆醉飽安佚而君無故不親酒肉遇鄉人之匱乏者或解衣以濟之年三十二以景德三年十二月丙子終於家某年月日葬於南原待制府君常嘆曰自吾兄之亡而家遂貧豈所以資生之具減於昔勤惰不同而已矣嗚呼使天下之民皆若吾兄之為雖古治丗何以加惜其無位而才不大施也夫人李氏同里人年二十八而寡二男詠里及一女皆幼詠及女尋又卒父母欲奪其志夫家尊章亦遣焉夫人自誓不許惡衣𬞞食躬執勤苦使里之四方就學姑李氏老且病常卧一榻扶然後起哺然後食夫人左右就養未嘗小失其意如是積年以至於沒無懈倦之色既而里登進士第迎夫人之官夫人自幼未嘗與其母别至是思慕成疾久之方愈里纍遷為尚書都官郎中歷典數州贈君官至尚書都官郎中夫人封永夀縣太君夫人為人慈柔勤儉中外宗族咸慕仰之始終一無間言子為二千石極其榮養年八十三以嘉祐五年九月甲寅終於京師其年十一月壬寅祔於君之墓光不及事君而及事夫人故得書其聞見之實以請於今之德行文辝為人信者以表其墓庶幾傳於不朽而子孫有所法則焉謹狀嘉祐六年六月日從父弟子具位某狀宋故處士贈尚書都官郎中司馬君墓志銘并序君諱某其先出自晉安平獻王自周隋之前家涑水之上至唐仕宦陵夷降在畎畒曽祖諱林祖諱政父煒炳纍丗同㸑食口甚衆父兄以君孝謹自幼以家事委之君晝夜服勤不遺餘力專以稼穡畜牧致饒給不事竒邪末業所獲悉以奉六親有餘則及鄉人身無私焉年三十二以某年月日終某年月日葬於涑水南原先待制府君常嘆曰自吾兄之亡而家始貧使天下之民皆若吾兄之為雖古至治之丗何以尚諸惜其無位而才不大施也夫人李氏同里人年二十八而寡父母欲奪其志夫家尊章亦遣焉夫人自誓不許惡衣𬞞食躬執勤苦教育二子詠不幸早丗里登進士第纍遷尚書都官郎中歷典數州贈君官至尚書都官郎中夫人封永壽縣太君夫人為人孝慈勤儉中外宗族慕仰其德一無間言子為二千石極其榮養年八十三以某年月日終於京師某月日祔於君之墓光不及事君而事夫人久敢書間見之實而繫之以銘銘曰士不得位善無所施勤儉于躬家道以肥宗族是賴鄉黨是師壽之少多命不可移有配有子後無棄基淑慝之效照然不欺溫國文正公文集卷第七十五
