body:
  text: 書啓三荅楚州粮料胡寺丞宗愈宗愈薦歙州蕲門令丁隲荅周源同年書荅孔文仲司户書与王介甫書第二書第三書荅河陽李夷白祕校書荅齊州司法張祕校正彦書荅楚州粮料胡寺丞宗愈宗愈薦歙州蔪門令丁隲光頓首再拜前嵗承臨訪以諫局不得詣謝頃又辱賜書兼示以所著文藁京師日困俗事因循踰年尚未報謝雖感戢勤仰之心無時少忘而惰慢之罪誠無以辝於左右冝見棄絶而不録者也今兹乃復重賜以書仍告以賢者之名是不以小禮爲䟽宻而直責以古人之處也光實何人蒙期待之厚如此且愧且恐殆無容措丁君未之得見又不知其所居不獲身往受敎也唯當謹識重語無日忘之京師利名之場士大夫不知光之不肖日枉車騎過弊廬者不啻十𢾗然爲道誼而來者則難得矣丁君不屈臨迺益知足下之不妄譽人也時寒千万加愛不宣光再拜荅周源同年書十二月日具銜光謹再拜復書都官同年足下前此承賜書并示以古律詩三卷理致精奥辭氣清壯誠陋目所未甞睹如登崑丘閱衆寳顧眩驚眄心知其可貴而口不可盡名也幸甚幸甚受貺至大冝即時修報而缺然逾旬者抑有由焉光生而樸愚行能無所長自度於方今士大夫間最出其下不意朝廷過采置之侍從居常自愧今同年賜書迺欲方之汲黯夫汲黯何可當也漢武帝猜忍暴刻其近臣如莊助朱買臣吾丘壽王之徒雖平生所信愛小有過輙抵死九卿顔異對賔客微反脣以爲腹誹而誅之其視殺人族人若鋤草茅然黯當此時能犯忌諱觸盛怒直詆其非以安國家利百姓非天下賢傑能如是耶今陛下慈愛寛仁與群臣言愉愉和顔色如接賔友唯恐傷其意求規諌之言孜孜如不及雖有狂狷訐直亦能容之光於群臣中官非甚薄曽不能引古聖賢之道以少助盛德萬分之一直碌碌隨衆容身庇妻子而巳豈得爲汲黯之倫乎夫任羸者以萬鈞之重非徒不能負也且有顛仆糜碎之患焉光雖至愚猶知避顛仆糜碎之患是以戰栗汗流而不敢報也惟同年少賜矝察而寛假之不宣光惶恐再拜荅孔文仲司户書三月二十日司馬光頓首復書司戸秘校孔君足下辱書敎以孔子第門人而文學處四科之末所以然之理幸甚幸甚光愚陋無堪居常不見齒於士大夫足下徒以生之蚤而仕之乆亦從而訪焉稱褒之過而責望之重且恐且愧無以自處光昔也聞諸師友曰學者貴於行之而不貴於知之貴於有用而不貴於無用故孔子曰弟子入則孝出則悌謹而信泛愛衆而親仁行有餘力則以學文子夏曰事父母能竭其力事君能致其身與朋友交言而有信雖曰未學吾必謂之學矣此德行之所以爲四科首者也孔子又曰誦詩三百授之以政不逹使於四方不能專對雖多亦奚以爲夫國有諸侯之事而能端委束帶與賔客言以排難解紛徇國家之急或務農訓兵以扞城其民是亦學之有益於時者也故言語政事次之若夫習其容而未能盡其義誦其數而未能行其道雖敏而傳君子所不愛此文學之所以爲末者也然則古之所謂文者乃所謂禮樂之文升降進退之容絃歌雅頌之聲非今之所謂文也今之所謂文者古之辭也孔子曰辭逹而巳矣明其足以通意斯止矣無事於華藻宏辯也必也以華藻宏辯爲賢則屈宋唐景莊列楊墨蘇張范蔡皆不在七十子之後也顔子不違如愚仲弓仁而不佞夫豈尚辭哉足下所謂學積於内則文發於外積於内也深博則發於外也淳奥則夫文者雖不學焉而亦可以兼得之學不充於中而徒外事其文則文盛於外而實困於内亦將兼棄其所學斯言得之矣曽子曰尊其所聞則髙明矣行其所知則光大矣足下允蹈其言爲之無倦将與淵騫並驅爭先又况游夏尚奚足慕光方歎服企仰之不暇自視一無所有其何以爲獻不宣光頓首與王介甫書二月二十七日翰林學士兼侍讀學士右諌議大夫司馬光惶恐再拜介甫參政諌議閤下光居常無事不敢渉兩府之門以是乆不得通名於將命者春暖伏惟機政餘𥙿台候萬福孔子曰益者三友損者三友光不才不足以辱介甫爲友然自接侍以來十有餘年屢甞同僚亦不可謂之無一日之雅也雖愧多聞至於直諒不敢不勉若乃便佞則固不敢爲也孔子曰君子和而不同小人同而不和君子之道出處語嘿安可同也然其志則皆欲立身行道輔丗飬民此其所以和也曏者與介甫議論朝廷事數相違未知介甫之察不察然於光嚮慕之心未始變移也竊見介甫獨負天下大名三十餘年才髙而學冨難進而易退逺近之士識與不識咸謂介甫不起則巳起則太平可立致生民咸被其澤矣天子用此起介甫於不可起之中引參大政豈非欲望衆人之所望於介甫邪今介甫從政始朞年而士大夫在朝廷及自四方來者莫不非議介甫如出一口下至閭閻細民小吏走卒亦竊竊怨嘆人人歸咎於介甫不知介甫亦甞聞其言而知其故乎光竊意門下之士方日譽盛德而賛功業未始有一人敢以此聞逹於左右者也非門下之士則皆曰彼方得君而專政無爲觸之以取禍不若坐而待之不過二三年彼將自敗若是者不唯不忠於介甫亦不忠於朝廷若介甫果信此志推而行之及二三年則朝廷之患巳深矣安可救乎如光則不然忝備交遊之末不敢苟避譴怒不爲介甫一一陳之今天下之人惡介甫之甚者其詆毀無所不至光獨知其不然介甫固大賢其失在於用心太過自信太厚而巳何以言之自古聖賢所以治國者不過使百官各稱其職委任而責成功也其所以養民者不過輕租稅薄賦歛巳逋責也介甫以爲此皆腐儒之常談不足爲思得古人所未甞爲者而爲之於是財利不以委三司而自治之更立制置三司條例司聚文章之士及暁財利之人使之講利孔子曰君子喻於義小人喻於利樊湏請學稼孔子猶鄙之以爲不知禮義信况講商賈之末利乎使彼誠君子邪則固不能言利彼誠小人邪則固民是盡以飫上之欲又可從乎是知條例一司巳不當置而置之又於其中不次用人往往暴得美官於是言利之人皆攘臂圜視衒鬻爭進各闘智巧以變更祖宗舊法大抵所利不能𥙷其所傷所得不能償其所亡徒欲別出新意以自爲功名耳此其爲害巳甚矣又置提舉句當常平廣惠倉使者四十餘人使行新法於四方先散青苗錢次欲使比户出助役錢次又欲更搜求農田水利而行之所遣者雖皆選擇才俊然其中亦有輕佻狂躁之人陵轢州縣騷擾百姓者於是士大夫不服農啇喪業故謗議沸騰怨嗟盈路迹其本原咸以此也書曰民不靜亦惟在王宫邦君室伊尹爲阿衡有一夫不獲其所若己推而内之溝中孔子曰君子求諸己介甫亦當自思所以致其然者不可專罪天下之人也夫侵官亂政也介甫更以爲治術而先施之貸息錢鄙事也介甫更以爲王政而力行之繇役自古皆從民出介甫更欲歛民錢雇市傭而使之此三者常人皆知其不可而介甫獨以爲可非介甫之智不及常人也直欲求非常之功而忽常人之所知耳夫皇極之道施之於天地人皆不可湏臾離故孔子曰道之不明也我知之矣智者過之愚者不及也道之不行也我知之矣賢者過之不肖者不及也介甫之智與賢皆過人及其失也乃與不及之患均此光所謂用心太過者也自古人臣之聖者無過周公與孔子周公孔子亦未甞無過未甞無師介甫雖大賢於周公孔子則有間矣今乃自以爲我之所見天下莫能及人之議論與我合則善之與我不合則惡之如此方正之士何由進謟䛕之士何由逺方正日踈謟䛕日親而望万事之得其冝令名之施四逺難矣夫從諌納善不獨人君爲美也於人臣亦然昔鄭人遊于郷校以議執政之善否或謂子産毀郷校子産曰其所善者吾則行之其所惡者吾則改之是吾師也若之何毀之薳子馮爲楚令尹有寵於薳子者八人皆無禄而多馬申叔豫以子南觀起之事警之薳子懼辭八人者而後王安之趙簡子有臣曰周舎好直諌日有記月有成歲有効周舎死簡子臨朝而嘆曰千羊之皮不如一狐之腋諸大夫朝徒聞唯唯不聞周舎之鄂鄂吾是以憂也子路人告之以有過則喜鄼文終侯相漢有書過之史諸葛孔明相蜀發敎與群下曰違覆而得中猶棄弊蹻而獲珠玉然人心苦不能盡惟董幼宰參書七年事有不至至于十反孔明甞自校簿書主簿楊顒諌曰爲治有體上下不可相侵請爲明公以作家譬之今有人使奴執耕稼婢典㸑雞主司晨犬主吠盗私業無曠所求皆足忽一旦盡欲以身親其役不復付任形疲神困終無一成豈其知之不如奴婢雞狗哉失爲家主之法也孔明謝之及顒卒孔明垂泣三日吕定公有親近曰徐原有才志定公薦抜至侍御史原性忠壯好直言定公時有得失原輙諌爭又公論之人或以告定公定公嘆曰是我所以貴德淵者也及原卒定公哭之盡哀曰德淵吕岱之益友今不幸岱復於何聞過哉此數君子者所以能功成名立皆由樂聞直諌不諱過失故也若其餘驕亢自用不受忠諌而亡者不可勝數介甫多識前丗之載固不俟光言而知之矣孔子稱有一言而可以終身行之者其恕乎詩云伐柯伐柯其則不逺言以其所願乎上交乎下以其所願乎下事乎上不逺求也介甫素剛直毎議事於人主前如與朋友爭辨於私室不少降辭氣視斧鉞鼎鑊無如也及賔客僚屬謁見論事則唯希意迎合曲從如流者親而禮之或所見小異微言新令之不便者介甫輙艴然加怒或詬罵以辱之或言於上而逐之不待其辭之畢也明主寛容如此而介甫拒諌乃爾無乃不足於恕乎昔王子雍方於事上而好下佞已介甫不幸亦近是乎此光所謂自信太厚者也光昔從介甫游於諸書無不觀而特好孟子與老子之言今得君得位而行其道是冝先其所美必不先其所不美也孟子曰仁義而巳何必曰利又曰爲民父母使民盻盻然將終歳勤動不得以養其父母又稱貸而益之惡在其爲民父母也今介甫爲政首制置條例大講財利之事又命薛向行均輸法於江淮欲盡奪商賈之利又分遣使者散青苗錢於天下而収其息使人人愁痛父子不相見兄弟妻子離散此豈孟子之志乎老子曰天下神器不可爲也爲者敗之執者失之又曰我無爲而民自化我好靜而民自正我無事而民自冨我無欲而民自樸又曰治大國若烹小鮮今介甫爲政盡變更祖宗舊法生者後之上者下之右者左之成者毀之棄者取之矻矻焉窮日力継之以夜而不得息使上自朝廷下及田野内起京師外周四海士吏兵農工商僧道無一人得襲故而守常者紛紛擾擾莫安其居此豈老氏之志乎何介甫緫角讀書白頭秉政乃盡棄其所學而從今丗淺丈夫之謀乎古者國有大事謀及卿士謀及庶人成王戒君陳曰有廢有興出入自爾師虞庶言同則繹詩云先民有言詢干蒭蕘孔子曰上酌民言則下天上施上不酌民言則下不天上施自古立功立事未有專欲違衆而能有濟者也使詩書孔子之言皆不可信則巳若猶可信則豈得盡棄而不顧哉今介甫獨信數人之言而棄先聖之道違天下人之心將以致治不亦難乎近者藩鎮大臣有言散青苗錢不便者天子出其議以示執政而介甫遽悻悻然不樂引疾卧家光被旨爲批荅見士民方不安如此而介甫乃欲辭位而去殆非明主所以㧞擢委任之意故直叙其事以義責介甫意欲介甫早出視事更新令之不便於民者以福天下其辭雖樸拙然無一字不得其實者竊聞介甫不相識察頗督過之上書自辯至使天子自爲手詔以遜謝又使吕學士再三諭意然後乃出視事出視事誠是也然當速改前令之非者以慰安士民報天子之盛德今則不然更加忿怒行之愈急李正言言青苗錢不便詰責使之分析吕司封傳語祥符知縣未散青苗錢劾奏乞行取勘觀介甫之意必欲力戰天下之人與之一決勝負不復顧義理之是非生民之憂樂國家之安危光竊爲介甫不取也光近蒙聖恩過聽欲使之副貳樞府光竊惟居髙位者不可以無功受大恩者不可以不報故輙敢申明去嵗之論進當今之急務乞罷制置三司條例司及追還諸路提舉常平廣惠倉使者主上以介甫爲心未肯俯從光竊念主上親重介甫中外群臣無能及者動靜取捨唯介甫之爲信介甫曰可罷則天下之人或被其澤曰不可罷則天下之人咸𬒳其害方今生民之憂樂國家之安危唯繋介甫之一言介甫何忍必遂巳意而不恤乎夫人誰無過君子之過如日月之食過也人皆見之更也人皆仰之何損於明介甫誠能進一言於主上請罷條例司追還常平使者則國家太平之業皆復其舊而介甫改過從善之羙愈光大於前日矣於介甫何所虧喪而固不移哉光今所言正逆介甫之意明知其不合也然光與介甫趣嚮雖殊大歸則同介甫方欲得位以行其道澤天下之民光方欲辭位以行其志救天下之民此所謂和而不同者也故敢一陳其志以自逹於介甫以終益友之義其捨之取之則在介甫矣詩云周爰咨謀介甫得光書儻未賜棄擲幸與忠信之士謀其可否不可以示謟䛕之人必不肯以光言爲然也彼謟䛕之人欲依附介甫因縁改法以爲進身之資一旦罷局譬如魚之失水此所以挽引介甫使不得由直道行者也介甫柰何徇此曹之所欲而不思國家之大計哉孔子曰巧言令色鮮矣仁彼忠信之士於介甫當路之時或齟齬可憎及失勢之後必徐得其力謟䛕之士於介甫當路之時誠有順適之快一旦失勢必有賣介甫以自售者矣介甫將何擇焉國武子好盡言以招人之過卒不得其死光常自病似之而不能改也雖然於善人亦何憂之有用是故敢妄發而不疑也屬以辭避恩命未得請且病膝瘡不可出不獲親侍言於左右而布陳以書悚懼尤深介甫其受而聽之與罪而絶之或詬詈而辱之與言於上而逐之無不可者光俟命而巳不宣光惶恐再拜第二光惶恐再拜光以荷眷之乆誠不忍視天下之議論恟恟是敢輙獻盡言於左右意謂縱未棄絶其取詬辱必矣不謂介甫乃更賜之誨筆存慰温厚雖未肯信用其言亦不辱而絶之足見君子寛大之德過人逺甚也光雖未甚暁孟子至於義利之說至爲明白介甫或更有它解亦恐似用心太過也傳曰作法於凉其弊猶貪作法於貪弊將若何今四方豐稔縣官復散錢與之安有父子不相見兄弟離散之事光所言者乃在數年之後常平法旣壞内藏庫又空百姓家家於常賦之外更増息錢役錢又言利者見前人以聚歛得好官後来者必競生新意以朘民之膏澤日甚一日民産旣竭小值水旱則光所言者介甫且親見之知其不爲過論也當是之時毋罪歲而巳感發而言重有喋喋負罪益深不宣光惶恐再拜介甫參政諌議第三書某惶恐再拜重辱示諭益知不見棄外収而敎之不勝感悚感悚夫議法度以授有司此誠執政事也然當舉其大而略其細存其善而革其弊不當無大無小盡變舊法以爲新竒也且人存則政舉介甫誠能擇良有司而任之弊法自去苟有司非其人雖曰授以善法終無益也介甫所謂先王之政者豈非泉府賖貸之事乎竊觀其意似與今日散青苗錢之意異也且先王之善政多矣顧以此獨爲先務乎今之散青苗錢者無問民之貧富願與不願強抑與之歲収其什四之息謂之不征利光不信也至於闢邪說難壬人果能如是乃國家生民之福也但恐介甫之座日相與變法而講利者邪說壬人爲不少矣彼頌德賛功希意迎合者皆是也介甫偶未之察耳盤庚曰今我民用蕩析離居又曰予豈汝威用奉畜汝衆又曰無或敢伏小人之收箴又曰非廢厥謀弔由霊蓋盤庚遇水災而遷都臣民有從者有違者盤庚不忍脅以威刑故勤勞暁解其卒也皆化而從之非謂盡棄天下人之言而獨行已志也光豈勸介甫以不恤國事而同俗自媚哉盖謂天下異同之議亦當少垂意采察而巳幸恕其狂愚不宣光惶恐再拜荅河陽李夷白祕校書五月三十日光再拜司理祕校李君足下頃國家羅天下豪儁光以無似叨備有司以是得瞻見符采承接餘論其爲幸巳大違别巳來汩没俗事未遑修問信至兩蒙惠言且謂自省於中至於無愧則安爲之又謂某事之非禮固弗受恱之非道固不恱何足下自遇之厚而見期之深也愧感之外敢不頌詠美志而佩服雅言庶幾黽勉以不負所教焉至於師法非所敢當又承王事鞅掌以學之不講爲深憂某也聞諸宓子賤曰始誦之今得而行之是學益明也何費日之有盛暑未獲展晤惟加愛爲禱不宣光再拜荅齊州司法張祕校正彦書十一月七日光白司法祕校張君足下前日辱書始則諭以古之爲士易今之爲士難終則見索惡詩欲以示郡之賢守倅光實何人承雅意勤厚如此固不當辭然某素無文於詩尤拙不足以揄揚盛美取信於人况近丗之詩大抵華而不實雖壯麗如曹劉鮑謝亦無益於用光忝與足下以經術相知誠不敢以此爲獻所可獻者在於相與講明道義而巳足下所謂古之爲士者乃君子之道也所謂今之爲士者乃小人之道也自有天地以來君子小人相與並生於丗各居其半一消一息一否一泰紛然雜糅固非一日非君子之道多於古而鮮於今古則可爲而今不可爲也小人之道鮮於古而多於今古不可爲而今則可爲也顧人之取捨何如爾奚古今之異而有易有難哉足下學春秋非徒誦其文通其義而巳乃能於傳注之外凡古今治春秋之書存可見者皆徧觀而略記之評其短長靡不精當人或雜舉而猝問之醻對無滯衮衮焉如泉源之不窮年未弱冠舉明經爲天下第一今位雖卑年雖少譬如隋珠和璧委於道塗愚者猶知拾而寳之况賢守倅哉詩云鶴鳴于九臯聲聞于天魚在于渚或潜在淵孔子曰不患人之不己知求爲可知也足下當固守於古而勿流放於今汲汲於己而徐於人爲之不止光見異日爲賢公卿功業炟赫於當時名聲彰徹於後丗竹帛所不能紀金石所不能頌詩何爲哉詩何爲哉不宣光白温國文正公文集卷第六十
