body:
  text: 章奏十九上皇帝疏節用劄子乞轉對劄子尊號劄子濮王劄子乞改郊禮劄子辭直學士第一狀第二狀第三狀上皇帝疏月日具位臣光謹昧死再拜上疏皇帝陛下臣聞書曰面稽天若詩曰文王陟降在帝左右蓋言王者為天之子不敢不朝夕小心祗畏其命如在其上如在其左右也是故洪範九疇以五行為夲言王者當祗順五行之性內謹五事以治身外修八政以治國正五紀以承天序折衷於皇極之道登用三德之人參合以龜筮之謀察風雨寒燠之來以省得失知休咎導迎五福避逺六極此萬丗不易之道也臣不勝狂愚忘生觸死伏見陛下即位以來災異甚衆日有黑子江淮之水或溢或涸去夏霖雨涉秋不止京畿東南十有餘州廬舍沈於深淵浮苴棲於木末老弱流離捐瘠道路妻兒之價賤於犬豕許潁之間親戚相食積尸成丘既而歷冬無雪暖氣如春草木早榮繼以黑風今夏癘疫大作彌沒數千里病者比屋喪車交路至秋幸而豐熟百姓欣然庶獲蘇息未及收穫而暴雨大至一晝之間川澤皆溢溝渠逆流原隰丘陵悉為洪波一苗半穗蕩無子遺都城之內道路乘桴城闕摧圯官府倉廪軍壘民居覆沒殆盡死於壓溺者不可勝紀耆耊之人皆言耳目所記未嘗睹聞此乃曠古之極異非常之大災陛下安得不側身恐懼思其所以致此之咎乎臣性愚學淺不足以窺測天意竊以書曰天聰明自我民聰明天明畏自我民明威又曰天視自我民視天聽自我民聽然則災異之來不在於它苟人心和恱則天道無不順矣詩曰亹亹文王令聞不巳又曰如圭如璋令聞令望古之聖王未有不先其令名而能行其政於天下者也臣伏見陛下踐阼之初上自宰輔次及朝臣下逮閭閻細民士伍斯養無不翕然同辭稱頌聖德如出一口皆云方今皇族奉朝謁者八百餘人陛下仁孝聰明為之首冠知人疾苦識其情僞節儉愛物剛果能斷既美先帝知人之明又慶己身逢時之幸涕泣共談悲喜相半臣愚以為昔漢惠帝無子而得文帝仁儉謙恭百姓冨饒幾致刑措昭帝無子而得宣帝勤惠明斷吏畏民樂號稱中興然則國無嗣子而旁親入繼未必不為天意福祐社稷而光啓聖賢也私心自幸又甚於衆人俄而聖躬有疾上下之人思殺身為牲粉骨為藥庶祈早瘳以觀聖政不意數月之後道塗之議稍異於前頗有謗言不專稱美逮乎周歲之外則頌者益寡謗者益多臣竊伏於闕門之外日聞衆論不勝悵恨痛心疾首晝而忘食夕而忘寢為陛下深思其故終不能明意者陛下於舉動循守之間万一有所未思乎敢以愚慮言之蓋有三焉惟陛下寬其罪使得畢其辝竊以皇太后仁明之德爰自先朝布聞四方加之保育聖躬在於襁褓陛下入承大統不可謂全非皇太后之力當陛下𥘉得疾之時外間傳言皇太后於先帝梓宫之前為陛下叩頭祈請額為之傷如此豈可謂無慈愛之心於陛下哉不幸為讒賊之人交相離間遂使兩宫之情介然有隙就使皇太后有不慈於陛下陛下為人之子安可校量曲直遂生忿恨而於愛恭之心有所不備乎傳曰大德滅小怨先帝擢陛下於衆人之中自防禦使升為天子唯以一后數公主屬於陛下而梓宮在殯巳失皇太后之歡心長公主數人皆屏居間宮希曽省見臣請以小諭大設有閭里之民家有一妻數女及有十畒之田一金之産老而無子飬同宗之子以為後其人既沒其子得田産而有之遂踈母棄妹使之愁憤怨歎則鄰里鄉黨之人謂其子為何如人哉以匹夫而為此行猶見貶於鄉里况以天子之尊為四海所瞻仰哉此陛下所以失人心之始也先帝天性寬仁重違物意晚年嬰疾厭倦万機遂以天下之事悉委之兩府兩府或見有所偏或意有所私取捨黜陟未必皆當又巧設幸門進拔所愛超資越級欺罔衆人抑壓孤寒無所伸訴及陛下即位皆謂必能奮發乾剛昭明君德收取威福復還王室進賢退愚賞善罰惡使海內廓然立見太平而陛下益事謙遜深自晦匿凡百奏請不肯與奪動循舊例不顧事情謹於細務忽於大體知人之賢不能舉知人不肖不能去知事之非不能改知事之是不能從大臣専權甚於先朝率意差除無所顧忌或非材而驟進或有罪而見寬此天下所以重失望也臣聞書曰木從繩則正后從諌則聖是以堯稽于衆捨巳從人舜好問而好察邇言禹聞善言則拜湯用人猶已改過不各此四聖人者豈其才智之不足哉然猶孜孜汲汲下詢愚賤之人者蓋以四海之廣万機之衆非一人所能獨知必資天下之耳目思慮然後能曲盡其理也陛下聖質雖美亦當取法於堯舜禹湯而即政以來或意有所見執之不移如堅守嚴城禦敵外冦使群臣之言皆無自而入殆非所以納百川而成巨海也孔子曰人之言曰豫無樂乎為君唯其言而莫豫違也如其善而莫之違也不亦善乎如不善而莫之違也不幾乎一言而喪邦乎是故明君之於聽納無彼無我無親無踈無先無後唯其是而已矣若重我所有而輕彼所陳信其所親而疑其所賤主先入之言而拒後來之議則雖有是者亦不可得而見矣夫人心之所好者視醜以為美所惡者視善以為惡苟能以平心察之則是非易見矣書曰有言逆于汝心必求諸道有言遜于汝志必求諸非道若必待合於聖意則恱而從之不合則怒而棄之臣恐讒諂日進方正日踈殆非所以增社禝之福也又國家本置臺諌之官為天子耳目防大臣壅蔽朝廷政事皆大臣相與裁定然後施行而臺諌或以異議千之陛下當自以聖意察其是非可行則行可止則止今乃復付之大臣彼安肯以巳之所行為非而以它人所言為是乎此乃陛下所以獨取拒諌之名而大臣坐得專權之利者也夫以君相之重何啻泰山賤臣之輕何啻雞卵乃欲相與校其勝負臣固知其不敵矣是以四方懷忠之士願效區區者皆望風不進結舌沮氣此天下所以又失望也凡此三者在列之臣皆知其不可而上畏嚴誅下避怨怒莫敢以此極言聞於陛下使海內憤鬱之氣積而不發宜其有以感動天地之心矣臣聞天意保佑王者故為之下災異以譴告之若王者恐懼修省則非徒免一時之害又將有福祿隨之商之大戊武丁周之成宣是也若傲忽不顧非徒為害於一時又將有危亡之禍漢之成哀端聖御名靈是也今災異之來意者皇天亦將保佑陛下以成商周之美乎臣願陛下上稽天意下順人心於此三者皆留聖念奉事皇太后愈加孝謹務得歡心諸長公主時加存撫無令失所總攬大柄勿以假人選用英俊循名責實賞功罰罪捨小取大剗塞弊幸一新大政延納讜言虛心從善皆行之以至誠非特為空言而已夫至誠可以動金石而況人乎不誠不足以感匹夫而況天乎詩云無曰髙髙在上陟降厥士日監在兹天雖至髙視聽甚邇人之所為發於中心則天已知之固不待見其容貌形於聲音也陛下果能盡誠於此則聖德日新令名四逹人心既恱天道自和百榖蕃昌嘉瑞並至蠻夷率服福流子孫矣臣自知不才無𥙷朝廷然不敢遂自塞哩復有所陳惟陛下裁察臣光昧死再拜上疏節用劄子臣竊見國家公私窮窘固非一日今兹復遇大災畿內秋田蕩無子遺倉廪儲蓄率多敗壞府庫錢帛散用將盡必恐今冬饑饉甚於去年軍民嗷嗷無以賑救經費不足重以郊禮此乃國用危急之時不可不早以為憂今取之於內帑則內帑已虛收之於外方則外方巳盡斂之於下民則下民巳竭不知朝廷將何以為計臣愚以為若非陛下側身克巳痛自節約則無以應合天意感慰民心使昏墊者忘其悲愁餒死者無所怨嗟也臣聞節用之道必自近始伏望上自乘輿服御之物下至親王公主婚嫁之具悉加裁損務從儉薄勿信主者以舊例為言出六宫冗食之人使之從便罷後苑文思院所造淫巧服玩止諸處不急之役然後命有司考求在外凡百浮費之事皆一切除去群臣非有顯然功效益國利民者勿復濫加賞賜將來南郊自非犧牲王帛供神之物其餘青城儀仗之類止於奉車駕備外飾者亦令有司與禮官同共參詳减省臣聞國有凶荒則殺禮事天者貴於內誠而賤外物是故器用陶匏席用槀秸况於青城儀仗之類何為而不可减乎凡此數者唯在聖意斷而行之固不可與庸俗之人執文況例者謀之也取進止乞轉對劄子臣竊見祖宗之時纍曽令朝臣轉對或遇災異廣求直言真宗咸平景德之間詢訪尤切其詔書云涉詆訐者固可優容乏詞藻者許其直致是時群臣上書言事者曰不下百餘封每戒勑閣門令疾速進入又詔樞密直學士馮拯陳堯叟今詳定以聞所以然者不惟考時政之得失亦以觀群臣之能否也是故太宗時得冦凖真宗時得張知白皆因上書言事驟加擢用後為宰相俱著名迹景德元年六月內出朝士邊肅等二十四人姓名今於崇政殿引對在外者驛召赴闕其後稍稍進用多為名臣此皆近事易法者也陛下踐阼未久群臣能否恐未遍知𣣔乞依祖宗舊制每遇內殿起居曰常令朝臣兩人轉對其餘在京及外處臣僚有欲上書言事者所在官司皆不得壅滯彼必欣然承命各竭所懷然後陛下親加省覽必有所得若上書者稍多陛下不能一一遍觀即乞擇近臣識慮明逹用心公正者二人先次看詳但求理道切當不取文辭華美分為數等各以貼黃節出事冝置之於前然後奏御陛下更以聖意擇其善者特令引對面加詢訪若實有可采其所言之事即為施行仍於禁中籍記姓名每遇有重難公事試委之幹辦俟果有功效乃加進用如此則天下之才盡在目前可以器使雖堯舜之丗嘉言罔攸伏野無遺賢亦不是過也不然若但循故事止作虛名所上之書未必省覽亦無施設則無益於事不如不為也取進止尊號劄子九月五日既而群臣五上表終不允亦由豫當直面有開陳臣聞謙德之美尊而益光施之神人無不恱順竊見陛下將有事于南郊群臣循襲故事請上尊號以陛下睿智聰明徽柔懿恭享兹鴻名云何不可正以屬者暴雨為災五稼漂沒編户失業吁嗟之聲盈於道路迄今未息陛下當此之際正冝深自抑損以承答天譴慰釋衆心况尊號非古近出有唐陛下受而有之不足以褒大聖功推而不居足以發揮盛德所有群臣上尊號表伏乞陛下拒而勿受仍令更不得上表此亦區區微誠欲禆益萬分之一也取進止濮王劄子臣聞聖人舉事與衆同欲故能下協人心上順天意洪範曰三人占從二人言蓋國有大疑則决之於衆自上丗而然矣臣伏見嚮者詔群臣議濮安懿王合行典禮翰林學士王圭等二十餘人皆以為冝准先朝封贈期親尊屬故事凡兩次㑹議無一人異辭所以然者蓋欲奉濮王以禮輔陛下以義也而政府之意獨欲尊濮王為皇考巧飾詞說誤感聖聽不顧先王之大典蔑棄天下之公議使宗室疏屬皆已受封贈而崇奉濮王之禮至今獨未施行此衆人所以怫鬱而未為稱愜者也或者恐陛下未能知二議是非臣請更為陛下别白言之政府言儀禮令文五服年月敕皆云為人後者為其父母即出繼之子於所繼所生皆稱父母臣案禮法必須指事立文使人曉解今欲言為人後者為其父母之服若不謂之父母不知如何立文此乃政府欺罔天下之人謂其皆不識文理也又言漢宣帝光武皆稱其父為皇考臣案宣帝承昭帝之後以孫繼祖故尊其父為皇考而不敢尊其祖為皇祖考以其與昭穆同故也光武起布衣誅王莾親冒矢石以得天下名為中興其實創業雖自立七廟猶非太過況但稱皇考其謙損甚矣今陛下親為仁宗之子以承大業傳曰國無二君家無二尊若復尊濮王為皇考則置仁宗於何地乎政府若以二帝不加尊號於其父祖引以為法則可矣若謂皇考之名亦可施於今日則事理不侔矣設使仁宗尚御天下濮王亦萬福當是之時命陛下為皇子則不知謂濮王為父為伯若先帝在則稱伯沒則稱父臣計陛下必不為此行也以此言之濮王當稱皇伯又何疑矣今舉朝之臣自非挾姦佞之心欲附㑹政府誤惑陛下者皆知濮王稱皇考為不可則衆志所欲亦可知矣陛下何不試察群臣之情群臣誰不知濮王於陛下為天性至親若希旨迎合不顧禮義過有尊崇豈不於身有利而無患乎所以區區執此議者但不欲陛下失四海之心受萬丗之譏耳以此觀之群臣之忠佞邪正甚易見矣臣願陛下上稽古典下順衆志以禮崇奉濮安懿王如圭等所議此亦和天人之一事也取進止乞改郊禮劄子臣聞古者天子親祀上帝一歲有九國朝之制天子三歲一郊仍於其間改用它禮者甚衆豈奉天之意有所倦略哉蓋事有不得巳者也臣竊見國家帑藏素空重以暴雨為災圎丘之側流潦尚深青城之材頗多散失儀仗法物損敗非一今若悉加完葺恐難猝備加以冬寒將近諸營漂沒失其生業屋宇敗壞衣褐俱盡陛下儻欲别加振救亦恐失所不支昔太宗太平興國九年下詔東封尋以火災而止更用郊禮又淳化三年下詔祀圎丘亦以事故更用明年祈榖今災變至大國用不足臣謂不可不小有變更若因兹天譴隨時損益以九月十月之間於大慶殿恭謝天地亦足以展純潔之誠昭寅畏之志减省大費安慰衆心事無便於此者陛下儻以為可願决意早行之取進止辭龍圗閣直學士第一狀右臣准閣門告報已降敕命除臣依前尚書吏部郎中充龍圗閣直學士散官差遣並依舊者臣塵忝諫職於今纍年曽無絲毫禆益盛德自非聖度含容豈免誅責每自循省心不遑安向亦屢曽奏陳乞𥙷外任天聽未允黽勉至今不敢頻有祈請以取煩瀆之罪豈意大恩復加褒進慙懼失措若墜氷炭臣雖庸愚何敢膺受伏望聖慈矜憫曲從所欲許臣只以舊職知河中府或襄􅉑晉絳一州使竭其駑蹇之分以酬天地生成之施臣不勝大幸所有龍圖閣直學士敕告不敢祗受取進止辭龍圖閣直學士第二狀右臣近曽進狀乞以舊職知河中府或襄號晋絳一州所有龍圗閣直學士敕告不敢祗受自後未奉指揮者臣伏覩真宗皇帝天禧元年𥘉置諌官詔書節文候及三年或職業無聞公言同覩移授散秩仍遣監臨臣自嘉祐六年七月𥘉入諌院供職到今巳涉五年智能淺薄志氣庸懦不能闡發大猷𥙷助聖政竊祿偷安虛損歲月譴黜之典巳為後時今乃使之叨冒寵名仍留舊任臣猶自愧况於它人是以瀝懇自陳庶幾燭察若朝廷矜其愚昧未用天禧詔書特行責降伏乞依臣前奏許以舊職知河中府或襄􅉑晉絳一州所有除龍圗閣直學士敕告不敢祗受取進止辭龍圗閣直學士第三狀尋得旨免諌職餘依前降旨揮右臣近兩次進狀乞以舊職知河中府或襄􅉑晉絳一州准中書劄子奉聖旨不許辭免便令受告勑者臣承諌職首尾五年自國朝以來居此官者未有如臣之久臣資性愚戇惟知報國竭盡朴忠與人立敵前後甚衆四海之內觸處相逢常恐異曰身及子孫無容足之地以此朝夕兾望解去如處沸鼎之中思寒泉之救但以職當言路不敢無故求出盤盤聖御名強留以至今日不意朝廷更加奬擢授以美職仍居舊任既荷寵祿則卒無得出之期禍敗罪誅必不可免是以人用為喜臣獨為憂人用為榮臣獨為懼四顧徊徨無所逃竄進退失圖誠可矜哀儻不訴於君父使之何所依投伏望聖慈憫其久在諌職使得息肩於外依臣前奏只以舊職知河中府或襄􅉑晉絳一州所有新除龍圗閣直學士勑告不敢祗受取進止溫國文正公文集卷第三十四
