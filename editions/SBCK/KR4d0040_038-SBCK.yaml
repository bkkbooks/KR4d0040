body:
  text: 章奏二十三衙前劄子橫山劄子横山䟽横山上殿劄子論不得言赦前事劄子張方平第一劄子張方平第二劄子受侍讀乞先上殿劄子乞免翰林學士劄子辭免館伴劄子議謀殺巳傷案問欲舉自首狀衙前劄子臣伏見近者陛下特下詔書以州郡差使之煩使民無敢力田積榖求致厚産至有遺親背義自求安全者令中外臣庻條陳利害委官詳定以聞此誠堯舜之用心生民之盛福也臣竊見頃􅀊國家以民間苦里正之役廢罷里正置郷户衙前又以諸縣貧冨不同東郷上户家業千貫亦爲里正西郷上户家業百貫亦爲里正應副重難勞逸不均乃令立定衙前人數毎遇有闕於一縣諸郷中選物力最髙者一户補充行之到今巳逾十年民間貧困愈甚於舊議者以爲一州一縣利害各殊今一槩立法未能盡善又里正止管催稅人所願爲衙前主管官物乃有破壞家産者然則民之所苦在於衙前不在里正今廢里正而存衙前是廢其所樂而存其所苦也又曏者毎郷止有里正一人借使有上等十户一户應役則九户休息可以晏然無事專意營生其所以勞逸不均蓋由衙前一槩差遣不以家業所直爲凖􅀂使直千貫者應副十分重難直百貫者應副一分重難則自然均平今乃將一縣諸郷混同爲一選物力最髙者差充衙前如此則有物力人户常充重役自非家計淪落則永無休息之期矣有司但知選差冨户爲抑強扶弱寬假貧民殊不知冨者旣盡賦役不歸於貧者將安適矣借使今日家産直十萬者充衙前數年之後十萬者盡則九萬者必當之矣九萬者盡則八萬者必當之矣自非磨滅消秏至於窮困而爲盗賊無所止矣故置郷戸衙前巳來民益困乏不敢營生冨者返不如貧貧者不敢求冨日削月朘有減無増以此爲冨民之術不亦踈乎臣甞行於村落見農民生具之微而問其故皆言不敢爲也今欲多種一桑多置一牛蓄二年之糧藏十匹之帛鄰里巳目爲冨室指使以爲衙前矣况敢益田疇葺廬舎乎臣聞其言惄焉傷心安有聖帝在上四方無事而立法使民不敢爲乆生之計乎凡爲國者患在見目前之利不思永乆之害故􅀄置郷户衙前之時人未見其患及今然後知之􅀂因循不改日益乆則患益深矣臣愚欲望聖慈特降指揮下諸路州縣相度上件里正衙前與郷户衙前各具利害奏聞隨其所便别立條法務令百姓敢營生計則家給人足庻幾可望矣取進止横山劄子臣竊聞陜西邊臣有上言欲招納趙諒祚國内人户漸圗進取者臣竊惟諒祚驕僣之罪冝伏天誅爲日固乆今國家新遭大憂陛下初承寶命公私困匱軍政未講恐征伐四夷之事未易輕議也况諒祚雖内懷桀驁而外存臣禮方遣使者奉表吊􅀕尚未還國而遽令邊臣誘納其亡叛之民臣恐未足以虧損諒祚而失王者之體多矣伏望陛下且以拊循百姓爲先以征伐四夷爲後速詔邊臣務敦大信勿納亡叛專謹斥候防其侵軼而巳俟諒祚咎惡旣熟中國兵榖有餘然後奉辭伐罪不爲晚也取進止横山䟽九月二十四日具位臣光昧死再拜上䟽皇帝陛下臣聞王者之於戎狄或懷之以德或震之以威要在使之不犯邊境中國􅀗安則善矣不必以踰葱嶺誅大宛絶沙漠禽頡利然後爲快也竊聞有邊臣言趙諒祚部將輕泥側欲以横山之衆攻取諒祚歸命聖徳朝廷巳有指揮許令招納臣近者雖曽論列以爲非冝尚懼語言踈略未盡夲末不敢不再爲陛下陳之入進謀者伹言其利不言其害臣請試言其害雖逆盛意願陛下勿遽加棄置略賜周覧與進謀者參校其是非焉臣聞戎狄之俗自爲兒童則習􅀐射父子兄弟相與群處未甞講仁義禮樂之言也唯以詐謀攻戰相尚而巳故其民習旅用兵善忍飢渇能受辛苦樂闘死而恥病終此中國之民所不能爲也是以聖王與之校德則有天地之殊與之校力則未能保其必勝也以舜禹之明征三苗而三旬逆命商髙宗之賢伐􅀑方三年乃克漢髙祖之雄傑爲冒頓所圍七日不火食國朝以太宗之英武比舉河東南取閩浙􅀂拾地芥加之猛將如雲謀臣如雨天下新平民未忘戰當是之時継遷背誕太宗以鄭文寳爲陜西轉運使用其計䇿假之威權以討之十有餘年卒不能克發關中之民飛芻輓粟以饋靈州及清逺軍爲虜所鈔略及經沙磧飢渇死者什七八白骨蔽野號哭滿道長老至今言之猶歔欷酸鼻及真宗即位㑹継遷爲羅潘支所殺真宗因洗滌其罪吊撫其􅀌賜之節鉞使長不毛之地訖于天聖明道四十餘年爲不侵不叛之臣關中户口滋息農桑豐冨由是觀之征伐之與懷柔利害易見矣及元昊背恩國家發兵調賦以供邊役關中旣竭延及四方東自海岱南踰江淮占籍之民無不蕭然苦於科歛自其始叛以至納欵􅂊五年耳天下困弊至今未復仁宗屈己賜以誓誥􅁽爲國主歳與之物凡二十五萬豈以其罪不足誅而功可賞哉計不得巳也曏者諒祚雖時有偃蹇禮節不備或誘熟户驚擾邊民然猶稱臣奉貢未敢顯然自絶也今乃誘其叛臣以圗之縱使誠能梟諒祚之首復靈夏之􅁟以王者之兵言之猶可恥也况其成敗未可知乎臣恐邊事之興生民之苦由此而始也王者之於諸侯叛則討之服則撫之是以諸侯懷德畏討莫不率從去歳諒祚攻大順城殺掠吏民今春朝貢之使不以時至當是時不能討也今朝廷旣赦其罪與其賜物受其使者納其貢獻又從而誘其叛臣激其忿心是常欲其叛而不欲其服也信義賞罰將安在乎議者或以爲彼誘我民我誘彼臣何爲不可是特閭閻小人之語非知國家之大體者也彼僻陋小羗竊誘我民以益其衆乃欲以天子億兆之冨而效其所爲邪譬如鄰人竊己之財巳以正議責之可也豈可復竊彼之財以相報耶臣聞諒祚隂蓄姦謀爲日固乆招納不逞之人以爲謀主誘脅熟户以撤中國之藩籬常有據關中窺河東之心雖未必能然􅀂縱其毒蠚亦足以爲亭鄣之患未可以小種之羗孱弱之人待之也國家不幸比遭大憂帑藏空竭關中之民自經西事以來仍苦鐵錢財力彫弊熟户屢經殺掠亡失太半縱其在者亦懷貳心非復得如景祐寳元之時也當此之際陛下深詔邊吏敦信誓保分界嚴守備明斥候以待之猶懼諒祚狼子野心不識恩義乗我釁􅂩侵噬疆場又况彼不動而擾之不來而召之乎臣又聞虜中間諜所在甚多中國動静毫髮皆知其側自程戡在鄜廷時已有所附蓋欲自誇以求售耳未必然也借令實能舉兵以與諒祚爲敵戰而勝之則是滅一諒祚生一諒祚也􅀂其不勝必引其餘衆南奔中國諒祚悉其境内之兵以追之怒氣直辭長驅入塞當是之時非口舌文移所能解也臣恐朝延不惟失信於側也􅀂側餘衆無幾猶可以縛而送之以緩諒祚之兵然形迹巳露諒祚必叛無疑也􅀂側餘衆尚多還北不可入南不受窮無所歸必不肯如山禺束手就死將突據邊城以救其命更爲中國之患未有涯也陛下不見景侯之事乎臣聞羽翼未成不可以髙飛近者未恱不可以來逺自堯舜禹湯文武之王下至齊淵聖御名晉文之覇未有不先治其内而能立功於外者也故孔子曰善人教民七年亦可以即戎矣又曰以不教民戰是謂棄之今陛下新即大位尚未逾年朝廷之政未盡修也封域之中未盡治也内郡無一年之蓄左帑無累月之財民間貧困十室九空小有水旱則化爲流殍承平日久戎事不講將帥乏人士卒驕惰上下姑息有如兒戯教閱稍頻則愠懟怨望給賜小稽則􅀭言不遜被甲行數十里則喘汗不進遇郷邑小盗則望塵奔北此乃衆人所共知非臣敢爲欺罔兵法曰知彼知己百戰不殆不知彼知己一勝一􅀒不知彼不知己毎戰必殆陛下視今天下如此而欲謀境外之事起兵革之端挑陸梁之虜兾難立之功此臣所爲寒心者也爲今之計莫􅀂収㧞賢俊隨材受任以舉百職有功必賞有罪必罰以修庶政慎擇監司澄清守令以安百姓屏絶浮費沙汰冗食以實倉庫詢訪智略察驗武勇以選將帥申明階級翦戮桀黠以立軍法料簡驍銳罷去羸老以練士卒完整犀利變更苦窳以精器械俟百職旣舉庶政旣修百姓旣安倉庫旣實將帥旣選軍法旣立士卒旣練器械旣精然後惟陛下之所欲爲復靈夏取􅀲沙平幽薊収蔚朔無不可也今八者未有其一而欲納邊臣之狂謀信黠虜之詭辭臣恐不能得其降者數百而虜􅀐大至覆軍殺將邊城晝閉朝廷乃爲之宵衣旰食焦心勞思興兵運財以救其急使天下愁困如康定慶曆之時而已卒無可柰何然後忍恥以招之卑辭以諭之尊其名以恱之増其賂以求之其爲損也不亦多乎斯乃國之大事安危所繫非特邊境之憂而巳願陛下深留聖㤙勿爲後悔乃天下之福也彼進謀者皆非實能爲國家斬將搴旗拓土闢境建衛霍甘陳之功也伹以利口長舌虚辭大言一時誑惑聖聦欲盗陛下之官職耳他日國家有患不預其憂是豈可哉凡邊境有事則將帥遷宮士卒受賞無事則上下寂寂無因徼幸此乃人臣之利非國家之利願陛下不可不察也臣光昧死再拜以聞皇帝陛下橫山上殿劄子臣近曽上言趙諒祚即今稱臣奉貢朝廷不冝納其叛臣以興邊事未審聖意以爲如何臣之所言非謂諒祚無罪不可討也又非能保其不叛也但以國家今日内政未修不可遽謀外事故也伏望陛下察臣所言八事舉百職修庻政安百姓實倉庫選將帥立軍法練士卒精器械然後觀四夷之釁亂者取之亡者侮之何患不能復大禹之故迹雪祖宗之􅀫憤也取進止論不得言赦前事劄子臣伏覩今月二十三日手詔應官吏􅀺庻犯罪在赦前者並依前後勑條施行内外言事按察官司更不得依前舉劾具案取旨如違並科違制之罪者臣竊惟按察之官以赦前事興起獄訟枉繋平民及以輕淺之罪奏乞不原聖恩禁之誠爲大善至於言事之官事體稍異恐難以一例指揮何則御史之職夲以繩案百僚糾擿姦邪姦邪之狀固非一日所爲國家素尚寛仁數下赦令或一歳之間至于再三􅀂赦前之事皆不得言則其可言者無幾矣萬一有姦邪之臣朝廷不知誤加進用御史欲言則違今日之詔􅀂其不言則陛下何從知之臣恐因此言者得以藉口偷安姦邪得以放心不懼此乃人臣之至幸而非國家之長利也伏望聖慈追改前詔除去言事兩字勿使群臣得以壅蔽聦明也取進止張方平第一劄子臣伏見陛下用翰林學士承旨張方平參知政事方平文章之外更無所長姦邪貪猥衆所共知兩府大臣繫國安危苟非其人爲害不細臣職在繩糾不敢塞嘿伏望聖慈追寢方平新命以恊輿論取進止張方平第二劄子臣近曽上言張方平參知政事不恊衆望臣識淺材下其言固不足采曏者仁宗時包拯最名公直與臺諌官共言方平姦邪貪猥事迹甚多陛下儻欲知方平爲賢爲不肖乞盡令檢取包拯等言方平章奏及開封府陳升之兩處推勘劉保衡公案并方平在奏州所奏邊上事冝狀即知臣所言非一人之私論也今所言之事尚未蒙施行㝷聞除臣翰林學士兼侍讀學士􅀂臣所言果是則方平當罷政事􅀂其非是則臣爲譛毀忠賢亦當逺貶今兩無所問而臣復遷翰林仍加羙職臣誠愚懵未曉所謂㐲望聖慈察臣前言方平事爲是爲非早賜施行所有新命臣未敢祗受取進止受侍讀乞先上殿劄子臣累日前曽上殿論列張方平事後來續聞除臣翰林學士兼侍讀學士臣智識頑闇不逹聖心以爲朝廷大政必當辨是與非人臣事君不可辭難就易是以不勝狂狷復有奏陳今蒙聖恩曲賜手詔過加奬待諭以至意温宻纎悉提耳諄諄臣雖木石亦將開悟况含氣血得爲人􅀋自咎愚迷九死難贖伏地流汗無所容入愧感之極涕泗滂沲誠冝即時奔赴闕庭祗受詔命然臣尚有私懇須當靣陳欲望聖㤙先許上殿敷奏禀取聖旨然後遂授勑告不勝死生幸甚取進止乞免翰林學士劄子臣今日上殿曽有敷奏以聖旨令讀資治通鑑其書卷帙尚少湏日近接續編修史籍煩多恐難以應副禁林文字乞免翰林學士一職伏蒙聖㤙宣諭但令權免學士院文字臣退自惟念􅀂取學士之名以自榮而不供學士之職竊位素餐孰甚於此在臣愚分深不自安况侍讀學士與翰林學士資序一同俸給仍優伏望聖慈俯賜矜察許臣只以侍讀學士專治資治通鑑如此則材噐稍冝職業無曠遂其私願粗免愧心不勝幸甚取進止辭免館伴劄子臣近爲差館伴北朝人使曽進狀辭免今日蒙聖恩差中使宣諭以人使將至有合啇量事節令臣不得辭免早詣中書樞宻院看詳文字者臣竊惟館伴北使乃兩制常程差遣臣所以輙違詔旨再三固辭者非敢避事偷安誠以人之才性各有能否不可牽強陛下以臣講讀經史粗有可采而使之應對賔客此實非臣所長夫以鄭國區區將有諸侯之事猶使禆諶草創丗叔討論子羽修飾子産潤色然後接四方之賔客故鮮有敗事况聖朝包戈偃革專以文德懷撫北夷信使往来議論國事折衝禦侮呼吸成變一言差忒寔繫安危臣豈敢不自揣量妄居其任臣曏以名犯北朝諱元不曽接伴亦不曽奉使兩朝事體正如墻面虜中情僞分毫不知加以禀性昏戅遇事􅄶直今􅀂使之館伴恐語言之際必有遺忘差錯或漏泄機事或抵觸使人萬一如此以貽朝廷之憂雖加臣以重誅終無所益伏望聖慈矜察於兩制中别選差才敏之人館伴北使貴無闕誤取進止議謀殺巳傷案問欲舉自首狀臣竊以爲凡議法者當先原立法之意然後可以断獄􅀼詳律文其於人損傷不在自首之例注云因犯殺傷而自首者得免所因之罪仍從故殺傷法所謂因犯殺傷者言因犯他罪夲無殺傷之意事不得已致有殺傷除爲盗之外如刼囚略賣人之􅀋皆是也律意蓋以於人損傷旣不得首恐有别因餘罪而殺傷人者有司執文并其餘罪亦不許首故特加申明云因犯殺傷而自首者得免所因之罪然殺傷之中自有兩等輕重不同其處心積慮巧詐百端掩人不備者則謂之謀直情徑行略無顧慮公然殺害者則謂之故謀者􅀹重故者差輕今此人因犯他罪致殺傷人他罪雖得首原殺傷不在首例􅀂從謀殺則太重􅀂從闘殺則太輕故酌中令從故殺傷法也其直犯殺傷更無他罪者惟未傷則可首伹係巳傷皆不可首也今許遵欲將謀之與殺分爲兩事按謀殺故殺皆是殺人􅀂將謀之與殺分爲兩事則故之與殺亦是兩事也且律稱得免所因之罪故刼囚略人皆是巳有所犯因而又殺傷人故刼略可首而殺傷不原􅀂平常謀慮不爲殺人當有何罪可得首免以此知謀字止因殺字生文不得别爲所因之罪也􅀂以刼闘與謀皆爲所因之罪從故殺傷法則是闘傷自首反得加罪一等也遵所引蘇州洪祚断例案律䟽云假有因盗故殺傷人而自首者盗罪得免故殺傷罪仍科䟽旣指言故殺傷人明是因盗謀殺傷人者自從謀法當時法官誤断不可用例破條遵又引編勑謀殺人傷與不傷罪不至死者並奏取勑裁以爲謀殺已傷而罪不至死者即是自首之人案尊長謀殺卑㓜之􅀋皆是巳傷而罪不至死不必因首也遵又引律䟽問荅條云謀殺凡人乃云是舅又云謀殺之罪首盡顯是謀殺許令自首案問皆謂謀而未傷方得首免􅀂其巳傷何由可首凡議罪制刑當使重輕有叙今􅀂使謀殺巳傷者得自首從故傷法假有甲乙二人甲因闘毆人鼻中血出旣而自首猶科杖六十罪乙有怨讎欲致其人於死地暮夜伺便推落河井偶得不死又不見血􅀂來自首止科杖七十罪二人所犯絶殊而得罪相埒果然如此豈不長姦况阿云嫌夫醜陋親執􅆎刀就田野中因其睡寐斫近十刀斷其一指初不陳首至宫司執録將行拷捶􅀔不􅀗已方肯招承情理如此有何可憫朝廷貸命編管巳是寛恩而遵更稽留不斷爲之伸理欲令天下今後有似此之􅀋並作减二等斷遣竊恐不足勸善而無以懲惡開巧僞之路長賊殺之源姦邪得志良民受弊非法之善者也臣愚以爲大理寺刑部所定巳得允當難從許遵所奏作案問欲舉减等而科今來與王安石各有所見難以同共定奪伏乞朝廷特賜裁酌施行温國文正公文集卷第三十八
