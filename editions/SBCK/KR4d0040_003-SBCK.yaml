  text: 温國文正公文集卷第三
  hash: sha256:9b0345c061c6a4bdd35252ab103aab1c9dc52b8586ebed06b574b0ba5f03e395
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_003-1a}
body:
  text: 古詩奉同景仁次道太常致齋韓廷評維見過閽人不時納韓去乃知爲詩謝之送守哲歸廬山清明後二日同鄰幾集賢校理江休復景仁次道中道國子􅁥主簿宋敏求興宗元明秉􅀦太理評事韓維如晦國子監直講裵煜公疎篆石經胡恢飲趙道士東軒以日暮天無雲春風扇微和爲韻得和字和端式十題春塘冰煙霽鐘汀洲蘋漁洲火寒谿石幽谷泉秋原菊垂崖鞭古木隂天外峯晉康陳生庸家世以孝悌聞有異木連理生其庭郡欲旌表其門不果王魯玉爲之求詩於朝之士大夫以紀之送興宗之丹陽癭盆送張兵部中庸字元常知遂州同舍㑹飲金明沼上書事和聖俞詠昌言五物括蒼石屏淡􅀣石屏白鶻圖懷素書縛虎圖新遷書齋頗爲清曠偶書呈全董二秀才并示姪良富奉同濟川迎吏未至秋暑方劇呈同舍十二韻和聶之美雞澤官舍詩七首西齋題㕔壁縣樓葦栁向城路懷翠亭晚食菊羹和冲卿崇文宿直睹壁上題名見􅀉并􅀉不疑冲卿詩序僕與不疑三人同登進士第同自太學官入校集賢書又嘗同直一室今不疑謫南方僕佐東屏冲唧因宿直觀壁上題名為詩代書昔别贈宋復古張景淳苦寒行初見白髪慨然感懷謝胡文學九齡恵水牛圖二卷王書記以近詩三篇相示光各摭其意以詩賡之感遇投梅聖俞呈范景仁酬胡侍講先生和錢君􅀝日本刀歌同聖民過楊之美聴琵琶女奴彈啄木曲觀諸公所贈歌明日投此爲謝晚歸書室呈君􅀝偶成同君􅀝過聖俞聖俞恵詩復以二章爲謝和君􅀝藤牀十二韻旬慮十七韻呈同舍夜坐二月中旬慮問過景靈宫門始見花卉呈君􅀝和始平公夢中有懐歸之念作詩始得兩句而窹因足成章和鄰幾六月十一日省宿書事和仲通秘閣校理張洞苦暑思長安幕中望終南秋雪呈鄰幾和仲通追賦陪資政侍郎呉公臨虚亭燕集􅀉呈陜府擇之學士秋意呈鄰㡬呉充次韻和掃棗好草倒又對前韻窺梨卑枝垂偏眠􅂳舷邉後牖有朽柳聶著作三舅謫官長沙作耐暑亭書來索詩走索不疑㕔薜荔及竹和公逹過潘樓觀七夕市酬鄰幾問不飲栽菊鄰㡬詩曰君實不飲酒庭下多栽菊不知黄花開奈此盃中緑凌晨煙露滋後日風霜促欲表君苦心宜種子猷竹次韻和不疑假書鄰㡬知方酣寢爲詩通意八月十七日夜省直紀事呈同舍送雷太簡和王介甫明妃曲和不疑送虜使還道中聞鄰幾聖俞長逝作詩哭之虞帝憫獄謡和冲卿三哀詩江鄰㡬梅聖俞韓欽聖窮免謡二首闕和介甫烘虱奉同范景仁宋次道太常致齋韓廷評維見過閽人不時納韓去乃知爲詩謝之端居太常署寒日淡􅀌清取酒呼諸友談笑方縱横韓君士林秀四海依高名家襲鍾鼎貴身無簪組縈逍遥風塵外萬物秋毫輕未嘗妄過人所過以爲榮如何枉玉趾及門失相迎主人豈傲客事有迷誤并追延既不及相視徒嗟驚威鳯顧脩梧不下還􅀌征景星欻呈彩旋有流雲生靈物固難覩俗眼眞不明投謝有何物珉石從雙璚送守哲歸廬山哲公金陵来神韻自􅀌秀京華三十春高節愈幽􅌗烜赫公卿門道俗日奔走自非趣尚合一息不相就慷慨賢豪士波溢千金富蔬飯苟有餘秋毫未嘗受囂呶不可變堅白如瓊琇居然尚愁寂終厭塵土臭忽思香爐雲薈蔚冠孤岫振衣㝷昔逰煙霞宛如舊絡木藤蔓長攫石松根瘦瀑泉響夜壑乳管添春竇茅茨䕃方丈宴坐度清晝几席雨竒花階除馴猛獸方知物外樂回視人寰陋御名勿露聲光愚迷將輻湊清明後二日同鄰幾秘閣校理江休復景仁次道中國國子監主簿宋敏求興宗元明秉國大理評事韓維如晦國子監直講裵煜公疎篆石􅀴胡飲趙道士東軒以日暮天無雲春風扇㣲和為韻得和字寂寥清明後餘春巳無多閒軒富佳致不惜載酒過水木晚尤秀風煙晴更和臨樽不盡醉奈此芳菲何和端式十題春塘氷春塘含薄冰淅􅄋􅀮隈曲晴日射寒芒柔風折哀玉草樹曽未知波光巳先緑煙際鐘蒼茫返照收羃歴寒煙起前山黯同色不辨峯巒美獨有逺來鐘悠􅀭翠微裏汀洲蘋秋江些字澹蕩波急枝難定參差碧葉繁皎潔寒花静幽人吟不歸獨立汀洲瞑漁洲火漁翁繫葉舟逺映楓林宿手携􅀟白魚呼兒㸑山竹深夜寂無人明滅寒江曲寒溪石穹石正嶄岩寒流更清急霜飛敗葉擁波濺蒼苔濕溪僧勿劇來沙鶴方􅀌立幽谷泉深谷窅無底空聞泉水哀時因秋日照微見碧縈囬谷裏非人境胡麻何䖏來秋原菊高原向揺落叢菊始滋榮草際浮金碧照人􅀟目明何須天生理玉斚汎餘英垂崖鞭山竹引春根垂透蒼崖底綢直老龍􅂡御名佶脩蛇尾支郎雖畜馬不忍裁爲箠古木隂古木夏隂薄蕭蕭蠧葉微豈無緑樹濃愛此風煙姿高僧此休息肩􅀝痩笻枝天外峯飛鳥去不息長空黯何極疎峯帶夕暉㸃綴秋天碧禪觀坐超然相望兩沈寂晉康陳生庸家世以孝悌聞有異木連理生其庭郡欲旌表其門不果王禹玉爲之求詩於朝之士大夫以紀之靈珠蟠泥沙積水不􅀎掩賢人畜美徳豈必自標檢陳生世同財百口共豐儉逺居嶺海間天質非陶染􅀖人慕其行􅃲辨日衰减祥木并殊柯童童植軒檻或欲掲其門令人識儀範愚公私不然外奨由内歉巳能孝悌著黙􅃱神靈感何必賜牛酒然後明褒貶况兹詩詠末􅃈􅃈事􅉢槧才薄不敢辤適􅀎爲汚􅀧送興宗之丹陽赤日裂后土萬家如烘爐君行何事役似爲貧所驅埃塵稍去眼雲景日蕭踈扁舟乘長風倐忽變三呉六年羇旅倦一旦誰掃除御名勿忘回首浩蕩江山娱癭盆癭盆生以醜自鬻突兀當軒聳羣目海鼃􅃲怒腹幹張老蛟蟠蟄鱗鬐秃昔時仙客浮􅀌槎波㾗漬朽成凹窪蜀都買卜置之去爾來流落嚴遵家誰逢好事得寳蓄裁供盥濯眞可辱况爲飲具承歡娱未必蟠根勝珠玉不若刳爲太古尊满􅆽明水羞百神凷桴葦籥薦忠信坐使風俗還深淳送張兵部中庸字无常知遂州劒嶺横天古棧㣲相如重駕傳車歸􅀟親􅀝門望巳乆千􅀐踏雪行如飛人門富貴非不有似君榮耀眞亦稀聞道西州遺畫像使我涕淚空沾衣先人知溪縣正板籍肉賦役邑人至今誦之畫像猶存同舍會飲金明沼上書事日華駘蕩金明春波光净緑生魚鱗煙深草青逰人少道路苦無車馬塵石渠諸君職事簡載酒擷花畏花晚浮舟逐勝任所之箕踞狂歌扣舷板眼花耳􅀬氣愈豪擲杯擊案聲嗷嗷驚沙颯颯遶洲渚魚龍遷去避我曹人生大料無百歳貴賤賢愚同一􅆀在家殽蔌餘㡬何一日風光不宜棄和聖俞詠昌言五物括蒼石屏主人小石屏得之括蒼山括蒼道里逺致此良亦難層崖萬仭餘騰出浮雲端呉兒采石時蘿蔓愁攀縁石文状松雪毫髪皆天然置之坐席旁清風常在顔願君善蔵蓄永日供餘閒御名勿示要人坐致求者繁將使括蒼民吁嗟山谷間淡􅀣石屏昔行鞏洛間馬瘦天復隂寒煙淡不收一拂横長林當時無畫工負此清賞心今朝石上迹歴歴皆可尋䡖素巳紛泊老榦仍蕭森坐令髙興還野氣生衣襟丹青不耐乆風日易消侵何如造化眞更彼歳月深昌言家素盆購此糜百金請鐫好事名千古無銷沈白鶻圖白鶻日邉来一息萬里遥横飛碧海晴六翮寒蕭蕭輕如朔雪花逈與長風飄傾身疊紺爪吟嘯何嘵哮瞥來疾驚電欻起先扶揺遂令狐與狸不敢矜凶妖罻羅不可取滅影還雲霄世人莫得見粉繪圖輕綃凛然堂牖間霜氣生春朝風雨夜如墨古木無鳴梟懷素書上人工書世所稀於今散落無復遺君從何處獲數幅敗絹蒼蒼不成軸雲流電走何縱横昬醉視之􅀟目明烈火焼林虎豹慄疾雷裂地龍蛇驚須㬰掛壁未􅀵卷隂風颯颯來吹面秪疑神物在闇中寳秘不令関俗眼嗟予平生不識書但愛意氣豪有餘欲求數字置座側安得滿斗千金珠縛虎圖孫生非畫師趣尚頗竒偉爲人少諧合不肯畜妻子時時入深山信足動百里蕭然坐盤石盡日曾不起精心忽有得縦筆何恢詭萬象皆自然神工相表裏流傳落人間萬金易寸紙君家縛虎圖用意尤精緻雖云鎻紐牢觀者猶披靡昔聞劉綱妻制虎如犬豕繋之牀脚間垂頭受鞭箠孫生儻未見畫此亦何理明知非世人羽化實不死願君它日歸置之成都市必有乗槎人庶㡬能辨此新遷書齋頗爲清曠偶書呈全董二秀才并示姪良富長夏暑候濁雲火髙巑岏豈徒肌骨煩木卷川流乾新居得南齋楹檻稍虚寛森羅對草􅀣暁暮清隂寒汛掃布几簟氣體粗可安圖書雖非多亦足備覽觀聖賢述事業細大無不完髙出萬古表逺窮四海端於中苟得趣自可忘寝餐况今有道世􅂖禄正可干朂哉二三子及時張羽翰力學致顯位拖玉簪華冠毋爲玩博奕趣取一笑歡壮年不再來急景如流丸奉同何濟川迎吏未至秋暑方劇呈同舍穉金避老火暑勢尤驕盈朱光爍厚地萬葉焦無聲夫子乆倦遊得郡爲親榮束裝待騶吏歸期殊未成埃沙塞廣陌蓬藋擁前楹出處兩不愜􅀌坐心煩縈何時驚飈來掃蕩天地清郊墟草􅀣疎千騎從雙旌飄颻􅀂神仙皁盖西南征離羣詎幾時豈不懐友生有意肯相過不妨巾屨并官舍稍虚凉愧無殽酒迎和聶之美雞澤官舍詩七首西齋明府學旣優所聞今得施四境巳澄清還以書自怡西齋幾黄卷治原俱在兹題㕔壁百里有民社古爲子男國苟有愛物心穉老皆䝉徳爲身不爲人鄙哉陶彭澤縣樓􅀌樓雖不髙足以瞰四逺餉婦陌頭歸田夫桑􅄻飯敕吏省追胥勿令農事晚葦索索夕風遒瀼瀼朝露裛啅雀裊寒枝宿螢依敗葉眇然秋興長坐與江潮接柳驛道苦車馬田廬悲斧斤誰㘽官舎俞老朽完天眞所願明府心庇􅀣如庇人向城路村路烟欲暝行人殊未稀借問徃來者營營皆有爲乃知市朝客趣務良可悲懷翠亭髙齋對秋山平望殊不逺雖違獨往心蒼蒼長在眼可嗟都邑逰終日紅塵滿晚食菊羮朝來趨府庭飲啄厭腥羶况臨敲扑喧憒憒成中煩歸来褫冠帶杖屨行東園菊畦濯新雨緑秀何其煩平時苦目痾滋味性所便采擷授厨人烹瀹調甘酸毋令薑桂多失彼眞味完貯之鄱陽甌薦以白木盤餔啜有餘味芬馥逾秋蘭神明頓颯爽毛髪皆蕭然廼知愜口腹不必矜肥鮮嘗聞南陽山有菊環清泉居人飲其流孫息皆華顚嗟予素荒浪強爲簪􅈁牽何當葺弊廬脫略區中縁南陽匄嘉種蒔彼數畒田抱甕親灌漑爛漫供晨餐浩然養恬漠庶足延頽年和冲卿崇文宿直睹壁上題名見􅀉并􅀉邵不疑冲卿詩序僕與不疑三人同登進士同自太學官入校集賢書又嘗同直一室今不疑謫南方㒒佐東平冲卿因宿直觀壁上題名為詩代書白袍昔紛紛相與㑹東堂帝梧碧蕭瑟翔集皆鸞凰伊余素空疎濫吹翰墨塲不爲羣儁遺出處聮簪裳爾來凡六閏轉轂飛炎凉同歌太學下共醉金馬旁脩竹壓窓寒夭桃􅀝戸芳金盤剖盧橘玉壺分蔗漿驚呼局上急嘲笑杯間狂神情一契㑹形迹兩俱忘歡餘嘆薄宦離合何能常濡毫紀歳時揮霍素壁光去秋随相車㳂牒来東方城中未徧辭不疑逐南荒奔波走郊外取别何蒼黄舉觴未及盡亟歸還束装行行到官下日積簿領忙文書擁筆端胥史森如墻况當三伏深沾汗尤淋浪細蠅遶眉睫驅赫不可攘涔涔頭目昬始覺冠帶妨誠知才智微吏治非所長懼貽知已羞敢不益自強因思甌閩逺南走侵閩漲炎蒸異中縣從古無雪霜終朝坐茅屋鹽茗征行商讙譁費口舌解嚢收毫芒不疑性髙介此困安可當山川㡬千里問訊誰􅀎將冲卿居京邑青雲正騰驤寓直紫臺上風露澄東廂清夜不成寐緩歩聊彷徨拂此壁上塵逺懷同舍郎英辭欻感發髙義紛激昂泠泠宮殿虚諷詠何琅琅手書成兩通貯之古錦囊一往泉山南一致汶水陽堅重金璧體光寒矛劒鋩廼知賢雋心淺俗未易量何嘗用榮枯遽爾分否臧居然激衰薄更使清風􅀭昔别贈宋復古張景淳昔别如飛蓬飄蕩随所適那知十六載巵酒對今夕渺然思舊逰間不容一息百年詎幾何㑹合難屢得復古素愷悌志行重金錫皎如百鍊精不爲燥濕易景淳氣高逸浩蕩誰與敵下筆驚雷霆龍蛇走屋壁居然噐業美但有富貴逼佗時綰金印羇束愈愁寂須窮今日懽快意浮大白勿辭簪弁傾頽然倒樽席苦寒行窮冬北上太行嶺霰雪糺結風峥嶸熊濳豹伏飛鳥絶一徑僅可通人行僮飢馬羸石磴滑戰慄流汗皆成冰妻愁兒號強相逐萬險歴盡方到并并州從來號􅃤烈今日乃信非虚名隂烟苦霧朝不散旭日不復􅀎精明跨鞍攬轡趨上府髪拳􅂡磔指欲零炭爐炙硯湯渉筆重複畫字終難成誰言醇醪􅀎獨立壷腹迸裂無由傾石脂装火近不􅀬蓬勃氣入頭顱腥仰慙鴻鴈得自適随陽南去何溟溟又慙鳦鳥識時節巖穴足以濳微形我來盖欲報恩分契闊非盡利與榮古人有爲知已死只恐凍骨埋邉庭中朝故人豈念我重裘厚履飄華纓傳聞此北更寒極不知彼民何以生􅀄見白髪慨然感懷萬物壯必老性理之自然我年垂四十安得無華顚所悲道業寡汩没無它賢深懼歳月頽宿心空棄捐視此足自儆㧞之乃違天留為鑑中銘晨夕思乾乾謝胡文學九齡惠水牛圖二卷牛生天地間益物用最大其功配坤元彖爻參衆卦血毛􅀋上帝肹蠁景福介宗廟及賓客百禮無不在引耒刺中田粒食烝民賴服箱走四方竭力任重載昔聞戴叟筆圖寫窮纖芥胡君􅁇其妙差肩立異代公卿仰名聲一觀不可匄如何散賤者遽有雙圖賚所嗟性顓愚雅不暁佳畫有如歌九韶鐘鼔樂聾聵得之乃虚噐無異居大蔡神物恐化去立召風雨怪􅀟圗雖卷還重貺敢不拜王書記以近詩三篇相示各摭其意以詩賡之感遇白鵠出江渚刷羽何鮮新志凌青霞端欲飲天漢津清飈未我與陂澤􅂓逡廵偶爲虞羅􅀗逺趣無由伸樊籠厭局促野性那􅀎馴庭除􅁆驚顧慘慘常畏人皓素不入俗衆目誰為珍稻粱不充腹日與雞鶩鄰舉頭畏太髙俛啄空愁辛蕭蕭斂六翮憔悴傷精神男兒五十不如意青衫華髪逰埃塵曏爲盬官北如􅀳今為幕吏西適秦慨然遂欲抛手板拂衣高蹈錦水濵長竿短艇入烟雨放歌酣飲欹烏巾方今聖朝清似水林空谷静無􅀮淪吾君夢卜偶未到勿學君投聖俞聖俞精爲詩堅重比白玉至寳識之希未必諧衆目應辰仰髙風跂聳自西蜀平生未相識歉歉不自足薄逰困京師旅食止脫粟得官當入秦行李未結束先求聖俞門執贄請􅀁欲九衢季冬月風沙正慘黷羸馬憚逺行毛鬛寒瑟縮旅拒不肯前一歩九刺蹙飢童袖擁口手足盡皸􅏿論詩乆未出竊罵怨滿腹歸來面􅀭􅀭氣􅀂飫粱肉纍纍數十字疎淡不滿愊自謂􅀗至珍呼兒謹蔵蓄長安十五驛重復間川陸置詩懷袖間勌懑輒披讀高吟桑野闊目瞑即􅄬宿自可忘羇愁行瞻灞陵曲呈景仁劔山中㫁融爲川清江雙流鬱廽旋溝塍阡陌粲如繡香秔紫芋皆良田地靈物秀氣淑美由來衮衮生英賢朝家文明􅀁及逺於今臺閣尤蟬聮獵纓鳴佩走聲望出入金馬如雲煙奈何應辰獨􅇄坎華髪未得離賔筵璵璠懸􅀺已爲寳結緑豈得偏棄捐願君彈冠自重惜邑人行誦紫虚篇酬胡侍講先生瑗字翼之見􅀉后王命天官考績弊群吏屬曹省閥閱專職米鹽事賤生偶承乏竊禄聊自庇才力困不逮慘慘日憂惴賴依僚友賢剸裂沛餘地自知雖􅀉名不足繫軒輊先生喜誘掖貽詩極襃賁誰云􅀊杪寒面􅀬汗沾漬非不恱子道駑鈍力難致常恐􅀒吹嘘終為重言累和君􅀝日本刀歌昆吾道逺不復通世傳切玉誰􅀎窮寳刀近出日本􅀦越賈得之滄海東魚皮裝貼香木鞘黄白間雜鍮與銅賈人云眞鍮似金真銅似銀百金傳入好事手佩服可以攘祅凶傳聞其國居大島土壤沃饒風俗好其先徐福詐秦民采藥淹留童丱老百工五種與之俱至今噐用皆精巧前朝貢獻屢往來士人往往工辭藻徐福行時書未焚逸書百篇今尚存令嚴不許傳中􅀦舉世無人識古文嗟予乗桴欲往學滄波浩蕩無通津令人感嘆坐流涕鏽澀短刀何足云同聖民過楊之美聴琵琶女奴彈啄木曲觀諸公所贈歌明日投此為謝坐曹據案心目疲出門上馬行何之闕然乆不見之美率意共往初無期正逢􅄃轡欲有適爲我却觧連環羇閑軒適足容數客夏木初繁有佳色呼兒取次具杯盤青眼相逢喜無極檀槽錦帶小青娥妙質何須誇綺羅按絃運撥驚四座當今老手誰􅀎過彈為幽鳥啄寒木園林颯颯風雨和喙長􅀲短躍更上丁丁取蠧何其多曲終拂羽忽飛去不覺酒盡朱顔酡巳聞啄木曲又觀啄木歌雄文更復值絶藝有如天際傾長河今朝壮觀誠極樂去此􅀅奈寂寞何歸來解帶豁胷腹坐踞胡牀仰看屋従今三日不洗耳耳内泠泠有殘曲人間何物號富貴紆紫懐金盡虚噐知君自處真得策身外百愁都擲置太學餐錢月㡬何客來取酒同醒醉晚歸書室呈君􅀝簿領日沈迷事役等胥靡得歸無所爲未免閱書史一種勞精神􅅐中異憂喜人生無苦樂適意即為美廼知抱關人不必羡青紫偶成於陵薄三公桔槹親灌園伯成䡖南面執耒耕丘樊淵明恥爲令乞食􅀝人門賢人樂遂志榮辱安足言鄙哉夸毗子結駟乗朱軒同君􅀝過聖俞王畿天下樞簿頷日塡積自非奉朝請九衢未嘗識今兹到東城胥靡暫逃役近指聖俞居安􅀎不往覿一室静蕭然昏碑帖古壁叩階讀新詩迷闇得指擿笑言殊未足黯然日􅀅夕呼馬涉歸塗燈火巳歷歷又知㡬何時更有重來迹聖俞恵詩復以二章爲謝我得聖俞詩於身亦何有名字托文編佗年知不朽我得聖俞詩於家果何如留爲子孫寳勝有千金珠和君􅀝藤牀十二韻嗟予仕京府謀禄非謀身豈徒勞百骸消鑠侵天眞所畏曠官誅敢辤從事勤朝訊獄中囚暮省案前文雖有八尺牀初無偃息㾗比歸暫􅄙帶日没軒窓昬援枕未及就擈面愁飛蚊未􅀎習律令何暇闚皇墳夫君天才秀明穎排糾紛右曹况清簡剸裂奚足云未遇且堅卧逢時將致君行當起經濟膏沐醒吾人旬慮十七韻呈同舍府官無旬休慮問乃逰息詔書禁從詣還舍始朝食緩帶對藜􅅅下筯免促迫門前吏卒散却掃謝來客北軒有藤床今晨始拂拭蓬髪亂宜梳霜髭閒可摘開軒曬藥物發笥出書冊菊畦親灌浸茶噐自㳙滌於時孟秋末天晴色紺碧林葉雖未零風聲巳淅􅄋神明還九蔵清氣襲百脉征夫解甲胄疲馬脫羈靮蜚鳥開樊籠跳魚出鼎鬲形骸盡我有不復爲物役雖非乆安逸幸得少頃適訟庭止敲扑咫尺異喧寂明朝不能然顧盻愁月夕夜坐春陽氣未勝重爲隂所乗涔涔積雨闋慘慘餘寒増流雲鬱不開烈風尚慿陵夜闌閉戸牖青暈生昬燈僮僕悉巳眠書几乆欹凭渉獵閱舊聞蹔使心䰟澄有如行役歸丘園怳重登又如逺别離邂逅逢友朋嗟嗟宦逰子何異魚入􅊻奪其性所樂强以所不􅀎人生本不勞苦被外物繩坐愁清旦出文墨來相仍吏徒分四集僕㒒如秋蠅煩中劇沸鼎入骨眞可憎安得插六翮適意高飛騰二月中旬慮問過景靈宮門始見花卉呈君􅀝賤生參府僚勉強踰半歳終非性所好出入意如醉訟庭敲扑喧衆草絶生意不知有青春候怱巳改燧周章連日忙爛漫數宵睡軒窓岌飛舉風雨頗􅔤睢謂言芳菲物狼籍應掃地今晨呼馬出歴獄問囚繫窈窕清宫深倉琅朱門閉廣殿肅層隂虚庭藹佳氣長楊委嫰緑老柏净新翠薜荔垂􅁈延竒石立贔屭豁然愁憤開精神四面至事役難少留馬去尚囬睇亦足慰無聊年華不都棄和始平公夢中有懐歸之念作詩始得兩句而寤因足成一章元宰撫洪鈞四海可熏灼至人飬天眞視此猶嬰縛出入金鼔威寤寐琴樽樂廼知伊吕心未始忘丘壑和鄰幾六月十一日省宿書事長夏金正伏火意尤驕盈夫子寓官舍無術逃煩蒸軒窓豁四開滅去壁上燈紵衣不可親羽扇安能勝濯泉泉巳温撫簟簟可憎萬葉悄無風但有飛蚊鳴六府燥不濡喉舌烟塵生攝衣起徐歩四顧天正晴雲漢淺欲涸箕畢徒縦横忽思終南巔秀出秦雲青上有長松林蔽日深杳􅁳下有萬仭壑含蓄太古冰安得躡􅁿屐杖策縁峥嶸挂冠芙蓉􅊴結屋高崖稜囬視萬鍾禄彯撇如飛蠅和張仲通學士苦暑思長安幕中望終南秋雪呈鄰幾秋雲覆秦川小雨野未濕誰言終南頂巳有霰雪集返景開新晴孱顔照都邑初疑江津闊逺浪横風急又疑龍蛻骨逶迤委原隰詞客登髙樓四望清興入當時應百篇遺散不復拾今兹宦帝城大暑困鬱悒紅塵滿九衢出入冠帶襲家居賓旅來俯僂煩拜揖回思幕中趣引領安可及江翁養文采正如玄豹蟄君往犯其嚴騰起誰敢縶嗟予素恇怯旁睨毛髪立強復綴此章庶幾勇可習和仲通追賦陪資政侍郎呉公臨虚亭燕集􅀉呈陜府祖擇之學士吾家陜之北陜事吾能􅀃􅀌亭占城隅形勝最殊絶雲消天宇空極目鳥飛滅大河西北來洶湧地脉裂萬里卷流沙長驅走溟碣羣山勢離合披靡随曲折林薄帶村墟郊原如繡纈祠宫望神禹閒田指虞芮高丘想巫咸空巖懐傅􅀃聖賢迹已遠縹渺見風烈呉公昔為守治行瑩冰雪君從豐鎬來華舘息塵轍主人喜嘉客置酒升嵽嵲清歡浩無涯燭至樽未撤誰知捧手辭遽有幽明訣至今猶墮淚遺愛滿耆耋擇之新下車條教悉施設依然典刑在先後如符節嗟予仕京邑苟禄自羇紲丘壟翳荒松三年灑掃缺求歸未􅀎得朝莫腸百結得君臨虚詩髣髴見里􅊴何時往登臨曠若目去䁾憂来復長吟益使寸心折秋意呈鄰幾呉充新凉入閭巷舊暑何人掃筠籠賣紅蓮莎堦墜丹棗蕉衫日以疎紈扇安能好蟬悲西風􅀣燕亂斜陽草此意屬淵明籬邉幾樽倒次韻和掃棗好草倒槐花滿庭除籍籍不可掃梢踈邵平􅀲漸熟王陽􅀥失時團扇棄新進祫衣好日暮益愁思寒螿起幽草忽聞秋興篇嘆賞㡬絶倒又對前韻窺棃卑枝垂端居倦煩暑園圃乆不窺雨餘秋氣新紅葉生紫棃形得蕭散不知環堵卑何􅀎效流俗把酒須菊枝登髙已可醉四野青雲垂偏眠船舷邉縦棹下清溪波靜地仍偏日夕水風􅋽蕭灑成安眠兀兀但髙枕悠悠還進船中流忽驚窹漁父歌扣舷山川非曏時回首雲霞邉後牖有朽栁弱植生川澤託根北堂後昔時青春姿扶踈映軒牖風霜日消落憔悴復何有蠧穿枯節㫁雨漬虗心朽幸不夭天年猶得勝凡栁聶著作三舅謫官長沙作耐辱亭書来索詩少連善降志無愠􅀎忍詬兹亭名耐辱締構自吾舅樽前湘水清席下湘山秀於焉忘榮枯終日醉醇酎攻愁􅀂攻敵避喧如避㓂困乆理須通非徒保無咎走索伎兒欲誇衆喜占衢路交繫組不厭長縛竿不厭髙空中紛往来巧捷如飛猱却行欠膚寸倒絓連秋毫參差有萬一虀粉安可逃錢刀不盈掬身世䡖鴻毛徒資旁觀好曹偶相稱襃豈知􅀙事者䖏之危且勞邵不疑􅆹薜荔及竹脩竹非俗物薜荔亦佳草􅀣之君子庭人來見逾好侵堦鶴脛細縁壁龍鱗老紛披兩疎翠煙色宜秋早主人日封植清風庶長保和公逹過潘樓觀七夕市織女雖七襄不能成報章無巧可乞汝世人空自狂帝城秋色新滿市翠帟張偽物踰百種爛漫侵數坊誰家油壁車金碧照面光土偶長尺餘買之珠一囊安知杼軸勞何物爲􅁞桑紛華不足恱浮侈眞可傷酬鄰㡬問不飲㘽菊鄰㡬詩曰君實不飲酒庭下多栽菊不知黄花開奈此盃中緑凌晨烟露滋後日風霜促欲表君苦心宜種子猷竹黄菊本天物先隨元化生酒醴廼人功後因儀狄成酒客強親菊菊酒初無情種之荒階側何嘗妨獨醒脩竹氣蕭灑自合生君庭次韻和不疑假書鄰幾知方酣寢爲詩通意江翁順天和心迹兩夷簡雖如邉韶寢且異宰予懶平居無時閒􅀴史自課限高歌慕翰林鳴琴寫中散翛然物外人強為章綬綰官舎苦秋霖瞬息聊休眼勤勩巳有餘宴安何愧赧借書誰敢驚欹枕尚未暖不疑神􅂹才垂耳困皁棧碌碌隨吾儕拜揖把手版毋嫌朱墨倦騰舉已為晚御名勿思山林山林付愚孱八月十七日夜省直紀事呈同舍窮秋直省舍大雨吁可畏九河飜層空入夜愈恣睢置床東壁根時有塗墍墜颯颯􅀔􅀅摧怵惕不成􅄰中宵抱衾立呼燭乆方至徙之近西偏禂帳不􅀎備飛蚊胡不仁忍此加啄噬避煩只深蔵悒悒靣䝉被須􅁷漏轉劇枕褥亦沾漬雖起欲何之室中無燥地展轉遂逹旦耿耿負憂悸因思閭井民餬口仰執技束書巳連旬妻兒日憔悴囊錢與盎米薪米同時匱敗衣不􅁕準搏手坐相視予今幸巳多敢不自知愧無謀忝􅁏食念爾但増欷送雷太簡南山有白雲應物任􅀁適欻来非有心倐去還無迹甘澤望沾浹嘉生待蘇息無爲遽􅀵卷復入巖間石和王介甫眀妃曲胡雛上馬唱胡歌錦車巳駕白槖駝眀妃揮淚辭漢主漢主傷心知奈何宫門銅環雙獸靣囬首何時復来見自嗟不若住巫山布䄂蒿簪嫁郷縣萬里寒沙草木稀居延塞外使人歸舊来相識更無物只有雲邉秋鴈飛愁坐泠泠調四絃曲終掩靣向胡天侍兒不觧漢家語指下哀聲猶可傳傳徧胡人到中土萬一佗年流樂府妾身生死知不歸妾意終期窹人主目前美醜良易知咫尺掖庭猶可欺君不見白頭蕭太傅被䜛仰藥更無疑和不疑送虜使還道中聞鄰幾聖俞長逝作詩哭之昨夕郵吏来叩門致書凾呼奴取以入就火開其緘不疑賦長篇發自燕之南痛傷江與梅継踵良人殱噫嗟知其二尚未知其三請􅀙北轅後覼縷爲君談鄰㡬雖乆病始不妨朝叅飲歠䆮衰少厥逆生虗痰逮於易簀辰皮骨餘崆嵌遺書屬清儉終始眞無慙聖俞食寒氷外以風邪兼愚醫暴下之結轖􅃸愈添惙惙氣上走不復容鍼砭自言􅀙良友地下心亦甘欽聖體素强藥石性􅀁諳平居察舉措敢以不夀占一朝蹔歸卧簿領不廢簽訃来衆皆愕未信猶闚覘興言念三子舉􅃑涕已霑英賢􅀎㡬何逝者迹相銜君疑天上才難得帝人貪我疑人間美多取神􅀁嫌􅃼􅃼幽眀際蓍蔡難窮探憂来不可忘終日心厭厭虞帝虞帝老倦勤薦禹爲天子豈有復南廵迢迢渡湘水至徳逺無􅁚異論紛紛起意疑大聖人姦憸亦如己乃知中下士無由逃謗毀憫獄謡五刑􅁚天有震耀上聖本以防姦邪法官由来少和泰臯陶之靣如削􅀲况於秦漢任酷吏死人籍籍如亂麻揺椘之求靡不得小者勍刖大滅家君不見古時牢獄地幾多􅁈骨埋黄沙和呉沖卿三哀詩江鄰㡬梅聖俞韓欽聖天生千萬人中有一儁傑奈何喪三賢前後􅂊暮月鄰㡬任天資浮飾恥澡刷朝市等山林衣冠同布褐外無涇渭分内有淄澠别逢時敢危言慷慨誰􅀎奪聖俞詩七千歴歴盡精絶初無追琢勤氣質禀清㓗􅀒兹驚世才未甞自標掲鞠躬隨衆後側足畏蹉跌欽聖渥洼駒初生巳汗血雖有絶塵踪不失和鸞節冝爲清廟器儼雅􅀿鍾律衆論仍共然非從友朋出群材方大来軮軋扶帝室誰云􅃌顧間聮翩化異物弔縗哭未巳病枕氣巳竭同爲地下逰擕手不相失紳紱頓蕭條相逢但嗟咄誦君三哀詩終篇涕如雪眉目尚昭晣笑言猶髣髴肅然来悲風四望氣蕭瑟和王介甫烘蝨天生萬物名品夥嗟爾為生至么麽依人自活反食人性喜伏蔵便垢涴晨朝生子暮生孫不日蕃滋踰萬箇透疎縁􅂩巧百端通夕爬搔不􅀎卧我歸彼出疲奔命偹北驚南厭搜邏所擒至少所失多捨置熏燒無術奈加之炭上猶晏然相顧未知亡族禍大者洋洋迷所適奔走未停身巳堕細者懦怯但深濳乾死縫中誰復課黒者抱髪亦憂疑逃入幧頭黙相賀腥腥騰起逺襲人袖擁鼻端時一唾初雖快意終自咎致爾殱夷非爾過吾家篋笥本自貧况復爲人苦慵惰體生鱗甲未能浴衣不離身成脆破朽繒壊絮為淵藪如麥如麻寖肥大虚腸不免須侵人肯學夷齊甘死餓醯酸蜹聚理固然爾輩披攘我當坐但思努力自㓗清群蝨皆當逺逋播温􅀦文正公文集卷第三
