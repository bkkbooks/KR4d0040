  text: 温國文正公文集卷第五十四
  hash: sha256:eec251cd07d90ba058ce1ac68b0c1ab8f5c8972af1f802d0201c0a76551aade6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_054-1a}
body:
  text: 章奏三十九謝免北使朝見日起居狀所舉孫凖有罪自劾劄子後殿常起居乞拜劄子辭大禮使劄子上官均奏乞尚書省事􅀋分輕重某事關尚書某事關二丞某事關僕射進呈白劄子七月二十八日三省同上得旨依乞趂時収糴常平斛㪷白劄子約束州縣抑配青苗錢白劄子乞罷散青苗白劄子薦王大臨劄子乞官陳洙一子劄子乞令六曹刪減條貫劄子乞罷保甲招置長名弓手劄子謝免北使朝見日起居狀右臣伏覩中書省録黄以今月十一日北使朝見奉聖旨許臣與文彦博免赴起居仍􅃸人使升殿降階訖權歸幕次將欲賜茶即升殿臣以乆患脚􅂰逺行乆立實所未堪方欲奏陳伏蒙聖㤙差句當御藥院梁某宣諭令臣於人使見辭日更不赴臣無任感天荷聖激切屏營之至謹録奏謝以聞謹奏所舉孫凖有罪自劾劄子臣先凖詔書舉文學政事行􅁩之臣可以充館閣之選者三人臣舉通直郎孫凖近聞孫凖與妻趙氏因爭女使與妻兄趙元􅁉相論訴狀内有虚妄事罰銅六斤臣昧於知人所舉有罪理當連坐乞賜責降取進止後殿常起居乞拜劄子竊以人臣見君禮無不拜文彦博年齡位望皆逺踰於臣毎後殿起居猶湏拜伏獨臣一人㤙旨不拜忝爲臣子實不自安欲乞今後遇文彦博入朝與之同班不入朝即别爲一班依群臣例常起居况臣自揣近日筋力微増若得臣男扶掖其常起居四拜殊不爲難伏望聖慈聽許以存朝廷之禮取進止乞特賜批依辭大禮使劄子二十七日上尋改差臣先奉􅃙差充明堂大禮使伏縁臣自去冬以来􅂰脚無力拜起艱難至今年正月下旬全妨拜起遂請朝假至今首尾八箇月若無人扶掖委實獨自拜起不得毎次朝見幸蒙聖㤙許男扶掖將來大饗明堂在上帝前不可使人扶掖又隨從皇帝陟降拜伏必恐未能一一如禮欲望聖慈矜憫別賜差官充大禮使取進止上官均奏乞尚書省事􅀋分輕重某事關尚書某事關二丞某事關僕射進呈白劄子七月二十八日三省同上得旨依今欲應尚書省事舊有條例事不至大者並委六曹長官一靣專決應奏上者奏上應行下者行下其有衝改動條貫或應臨時特取旨及事體大非六曹所能專决者即申都省委僕射左右丞同商量或送中書取旨或直批判指揮所有都省常程文字並只委左右丞一靣批判施行事體稍大及有所疑者方與僕射啇量同批判所是諸色人辭狀只委左右丞一靣収接可留即留可退即退若六曹判斷不當及住滯不決即别委不干礙官定奪是非及根穷住滯因依若顯有不當及故住滯其本曹官吏即行按劾所貴上下相承各有職分行遣簡徑事務辦集乞趂時収糴常平斛㪷白劄子八月三日三省同上得旨依勘㑹舊常平倉法以豐􅀊榖賤傷農故官中比在市添價収糴使蓄積之家無由抑塞農夫須令賤糶凶􅀊榖貴傷民故官中比在市減價出糶使蓄積之家無由邀勒貧民須令貴糴物價常平公私兩利此乃三代之良法也曏者有因州縣闕常平糴本錢雖遇豐􅀊無錢収糴又有官吏怠慢厭糴糶之煩雖遇豐嵗不肯収籴又有官吏不能察知在市斛㪷實價只信慿行人與蓄積之家通同作弊當収成之初農夫要錢急糶之時故意小估價例令官中収糴不得盡入蓄積之家直至過時蓄積之家倉廪盈滿方始頓添價例中糶入官是以農夫糶榖止得賤價官中糴榖常用貴價厚利皆歸蓄積之家又有官吏雖欲趂時収糴而縣申州州申提􅀧刑獄提􅀧刑獄申司農寺取候指揮比至回報動渉累月巳是失時榖價倍貴是致州縣常平倉斛㪷有經隔多年在市價例終不及元糴之價出糶不行堆積腐爛者此乃法因人壞非法之不善也熈寧之初執政以舊常平法爲不善更糴本作青苗錢散與人户令出息二分置提舉官以督之豐􅀊則農夫糶榖什不得四五之價凶年則屠牛賣􅁏伐桑賣薪以輸錢於官錢貨愈重榖直愈輕朝廷深知其弊故罷提舉官令將累年積蓄錢榖財物盡樁作常平倉錢物委提􅀧刑獄交割主管依舊常平倉法施行今􅀊諸路除有水災州軍外其餘豐熟處多今欲時降指揮下諸路提􅀧刑獄司乗有此糴本之時委豐熟州縣官貟各體察在市斛㪷實價多添錢數以廣行収糴如闕少倉敖之處以常平倉錢添蓋仍令少糴麦豆多糴􅂖米其南方及川界卑濕之地有斛㪷難以乆貯者即委提􅀧刑獄相度逐州逐縣合銷數目抛降収糴纔候將來在市物價比元糴價稍増即行出糶不得令積壓損壞仍令州縣各勒行人將十年以來在市斛㪷價例比較立定貴賤酌中價例然後將逐色價分爲三等自幾錢至幾錢爲中等價幾錢以上爲上等價幾錢以下爲下等價令逐處臨時斟酌加減務在合冝旣約定三等價仰自今後州縣毎遇豐􅀊斛㪷價賤至下等之時即比市價相度添錢開場収糴凶年斛㪷價貴至上等之時即比市價相度減錢開場出糶若在市見價只在中等之内即不糴不糶更不申本州及上司指揮免有稽滯失時之患仍委提􅀧刑獄常切提舉􅁴察若州縣斛㪷價及下等而不収糴價及上等而不出糶及収貯不如法變轉不以時致有損壞并監官不逐日入􅂣致壅滯糶糴人户並取勘施行若州縣長吏監官能用心及時糴糶至得替時將酌中價錢與斛㪷通行比折與初到任時増剰及十分中一分以上許批書上暦子候到吏部日與升半年名次及二分以上許指射家便差遣一次所貴官吏各各用心州縣皆有儲蓄雖遇荐饑民無菜色又得官中所積之錢稍稍散在民間可使物貨流通其河北州縣有糴便司斛㪷見多及縁邊州縣轉運司見糴軍粮處更糴常平倉斛㪷若今來􅃌揮内有未盡未便事件委提􅀧刑獄司逐旋擘畫申奏施行約束州縣抑配青苗錢白劄子同前中書舎人蘇軾不肯簽臺諌亦累章乞盡罷四日再進呈後劄子檢㑹先朝初散青苗錢本爲利民故當時指揮並取人户情願不得抑配自後因提舉官速要見功務求多散諷脅州縣廢格詔書名爲情願其實抑配或舉縣句集或排門抄劄亦有無頼子弟謾昧尊長錢不入家亦有它人冒名詐僞請去莫知爲誰及至追催皆歸本户朝廷深知其弊故悉罷提舉官不復立額考較天下莫不欣戴昨於四月二十六日有勑令給常平錢榖限三月或正月只爲人户欲借請者及時得用又令半留倉庫半出給不得輙過此數至於取人户情願不得抑配一遵先朝本意慮恐州縣不暁勑意將謂朝廷復欲多散青苗錢廣収利息句集抑配督責嚴急一如曏日置提舉官時今欲續降􅃌揮下諸路提􅀧刑獄司告示州縣並湏候人户自執狀結保赴縣乞請常平錢榖之時方得勘㑹依條支給不得依前句集抄劄強行抑配仍仰提􅀧刑獄常切􅁴察如有官吏似此違法搔擾者即時取勘施行若提􅀧刑獄不切􅁴察委轉運安撫司􅁴察聞奏乞罷散青苗白劄子四日進呈得旨依昨於四月二十六日降指揮令於正月二月支散常平倉錢榖切慮州縣多不暁朝廷之意將謂却欲廣散青苗錢多収利息嚴行督責一如未罷提舉官時勘㑹青苗錢利民甚少害民極多臣民上言前後非一今欲遍行􅃌揮下諸路提􅀧刑獄司自今後其常平錢榖只令州縣依舊法趂時糴糶其青苗錢更不支俵所有舊欠二分之息盡皆除放只令提􅀧刑獄契勘逐州縣元支本錢隨見欠多少分作料次令隨稅送納薦王大臨劄子八月八日上大臨除太學録巳卒臣竊見鄆州處士王大臨通經術善講􅀃安仁樂義譽髙鄉曲貧不易志老不變節曏常有詔敦遣固辭不起伏望聖慈召致京師寘之學官爲士􅀋矜式取進止乞官陳洙一子劄子嘉祐中仁宗皇帝未有継嗣故殿中侍御史陳洙奏乞擇宗室之賢者立以爲後旣發奏狀謂家人曰我今日入一文字言社稷大計若得罪大者死小者貶􅇡汝軰當爲之備下奏狀者未返洙得疾而卒臣時爲諌官親聞見此事􅀼憐其亡身徇國継之以死而天下莫之知近見故職方貟外郎張術亦以當時乞建儲貳子申伯特􅀘太廟齋郎伏望聖慈依張術例除一子官以旌忠義取進止乞令六曹刪減條貫劄子八月十二日三省同上得㫖依勘㑹近􅀊法令􅀹為繁多凡法貴簡要令貴必行則官吏易爲檢詳咸知畏避近據中書門下後省修成尚書六曹條貫共計三千六百九十四􅁽寺監在外又據編修諸司勑式所申脩到􅃙令格式一千餘卷􅁽雖有官吏彊力勤敏者恐不能遍觀而詳覧况於備記而必行之其間條目苛宻抵梧難行者不可勝數昨者條貫初下吏部侍郎左選差注不行者數日不免再有奏陳復依舊法必料諸曹條貫皆有似此拘礙難行者今欲特降指揮下尚書六曹委長貳郎官同共看詳本曹新舊條貫内有海行巳有及全無義理於事無益防禁太繁難爲遵守者盡令刪去惟取紀綱大體切近事情朝夕不可無者方始存留作本司條貫限兩月申奏施行乞罷保甲招置長名弓手劄子臣􅀼見府界及三路保甲雖罷團敎猶冬敎一月於民有損於官無益不若盡罷之便何則比團敎之時民間勞費雖十減六七然猶有三四此所謂於民有損也朝廷毎歳遣使按閱所費金帛以百萬計而終無所用之此所謂於官無益也臣以爲不若盡罷之便自置保甲以來盗賊倍多所以然者郷村無頼子弟乍渉城市聞見紛華自恃身爲保丁坐索本家供給飲􅀶遊蕩習以成性今雖罷團敎不肯復歸南畒服田力穡逸欲旣深資用不足旣家藏利兵又身挾武藝由是邀結黨友群行攻刼父兄不能禁州縣不能制此自然之􅀔也是以數年以来年不甚飢而府界三路盗賊縱横入縣鎮殺官吏若遇蟲蝗水旱大饑之歳將若之何此不可不爲之先慮也以臣愚見莫若盡罷府界及諸路保甲據逐縣主戸數目盗賊多少委提􅀧刑獄相度每若干戸置長名弓手一人與免戸下租稅支移折變及夫役諸般差徭科配一無所預務爲優假使人歆慕毎十人置節級一貟五十人置十將一貟百人置貟寮一貟二百人以上置􅃌揮使副􅃌揮使各一貟雖不及二百人亦置指揮使副􅃌揮使名目盡管一縣弓手以爲賞功資級其節級始初且令本縣令佐依上名下次或選有部轄者􅁠管候有長行捉殺到強盗一人即􅀘充正節級替下􅁠管之人自後毎捉殺到強盗一人依此遷一級若未有闕且爲守闕不得管人候有闕日補正其累功勞遷至正􅃌揮使滿三年以上又曽捉殺到強盗三人從来不曽犯􅂍罪者仰本縣官吏結罪保明申州本州官吏結罪保明申奏乞朝廷與於三班借差内安排若遇有強惡賊人朝廷臨時别立賞格者不在此限如此則保甲内勇徤之士見前有出官之望來應募者必多除第一第二等户物力髙強合充重役不得應募外其餘但於本縣有户籍田産不以等第髙下並許投充長名弓手永無解役之期若第一第二等户情願以一丁爲弓手餘丁充重􅃥者亦聽若一人闕額有二人以上争投者即委令佐㨂試武藝髙強者充如此則本縣勇健者皆充弓手其餘怯弱者雖使之爲盗亦無能爲患若見充長名弓手人有勇力武藝衰退者許令外人􅃌名比校若勝於舊者即令充替如此則不須敎閱武藝自然長得精熟仍委本州及提􅀧刑獄常切覺察令佐有取捨不公者取勘依法施行若應募未滿見今郷差弓手之數即且令與郷差弓手相兼祗應候招到長名弓手一人即替郷差弓手一人歸農其郷差弓手願投長名者亦聽若長名弓手及百人以上即令分一半作兩畨二百人以上毎百餘人分作一畨並年終交替其上畨者隨縣尉逐捕盗賊自節級以上各令管所轄之人若所轄之人有小可過犯許一靣區分不得過小枤十下若所轄之人敢陵犯本轄人貟者杖一百歐者杖徒一年雖􅁠管亦同本轄人貟若於所轄人處取受財物並依律科罪犯􅂍罪杖者若係􅁠管即降充長行名若係正人貟即降一資自後毎捉殺到強盗三人如當一人雖許遷資並係額外不得管人不得出官若遇下畨則不相管轄亦無階級其下畨者自十將以下各隨所居之處與耆長同􅁴察本管分内曽爲強盗之人及窩藏之家凡爲強盗者不肯於本管分作過須在它處蓋恐累及本地分捕盗人無所自容故也其本地分捕盗人往往知之莫肯發舉盗旣得財分􅂍則絶迹逺遁其賊發地分捕盗人雖欲擒捕莫知其處官中雖立三限科校終無所益由此賊發地分捕盗人毎有賊發莫肯申舉若變主懦弱則多方抑塞不令聲賊變主強梁則共陪所失之財􅂆和使休是致群盗無所忌憚日益昌熾又告捕得賊多􅀍賊人讎報焚焼莊舎屠害老小其賞錢豈冝留滯而往往爲州縣沮難有司靳惜動有經年請領不得使之懈體欲乞今後應賊發地分其捕盗人更不立三限科校捕盗官亦不批罰只以擒賊多少論其功賞若敢抑塞􅀮蔽從嚴法施行仍毎州各隨大小賊盗多少借官錢千貫専充告捕賞錢毎獲強盗勘得從來住止窩藏去處候断遣巳了委本州長吏當日先以官錢支給告捕之人即移牒出賊州縣句追住止􅌪藏地分捕盗人科不覺察罪弓手杖一百耆長杖八十壯丁笞四十先籍没賊人及􅌪家財産償錢外其不足之数令捕盗人䓁第均攤限一月催足津般赴給賞州軍􅀘填官錢若路逺難以津般則各於本州官錢内閞牒折兊其強惡賊人朝廷特於常法外多立賞錢者自以省錢充不在捕盗人均攤之限如此賊盗無所容身必思改過自新若果行此法府界三路旣免教閱勞費之患無頼子弟又有所歸投得以覊縻諸路正郷村之名復國家舊制勇徤之士前有仕進之望爭討賊立功不待敎閱而弓手武藝自然不敢衰退不湏􅀧差而郷兵自足兼有所用人雖衆多而上下有綱紀不敢相侵􅁀賊發地分捕盗人不知賊處免虚受刑責出賊地分爲累及身不敢蔽匿景迹之人􅀍賊之家無人抑塞有所伸訴盗賊窮窘無所容身稍冀衰息取進止温國文正公文集卷第五十四
