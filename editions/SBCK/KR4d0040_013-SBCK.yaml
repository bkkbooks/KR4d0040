  text: 温國文正公文集卷第十三
  hash: sha256:255f22f7b19f8a5e63304ab8b29930ae171980ad52c043013cc0faaf71dcc822
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_013-1a}
body:
  text: 律詩八奉同運使陳殿丞知儉字公廙惜洛陽牡丹爲霜風所損又和惜春謡還陳殿丞原人論宗宻所撰破自然破元氣破天命明佛性和王秀才虞仲字道濟以光始自陜右遊山歸復登少室爲詩見􅀉西湖泛舟輙用前韻􅀉呈君實鎮奉和新買疊石溪莊再用前韻招景仁和鎭戲書宋子才止足堂􅀉題宇文中允之邵所居貽夸者春遊和潞公遊天章楚諌議園宅還張景昱景昌秀才兄弟詩卷􅀉題張著作中理善頌堂嘉州公裕學士之父和宇文公南塗中見􅀉酬張二十五秀才南園遣意景昱字明叔酬張三十秀才見贈景昌字子京八月十五夜陪留守宣徽登西樓值雨待月乆不見秋雨新霽遊水北馬上偶成運使虞部桉行洛西諸縣因遊所過名山有詩百餘首合爲一編䝉賜寵示俾之継作一首吕宣徽挽歌二首和君貺暮秋四日登石家寺閣晚泛洛舟又和六日四老㑹并宋子才大監李幾先将軍和王少卿尚恭字安之十日與留臺國子監崇福宫諸官赴王尹賞菊之㑹和白都官序見贈和白都官歸長安送雷章秘丞知芮城酬邵堯夫見示安樂􅌪中打乖吟和邠守宋度支迪來􅁲居與南園爲鄰和張文􅁉􅀄寒十首􅀉題刁景純藏春塢景純致政歸京口治其所居命曰藏春塢前有一岡皆松林命曰萬松嶺和君貺少林寺又和嶽祠謝雪題嶽寺平法華庵望日示康廣宏和君貺題潞公東莊和君貺任少師園賞梅別韻一首又和開叔和公廙喜雪用莊字韻和史誠之謝送張明叔梅䑓三種梅花早春􅀉景仁和君貺宴張氏梅䑓看花四絶句和君貺清明與上巳同日泛舟洛川十韻和君貺􅀉河陽侍中牡丹又和安國寺及諸園賞牡丹送酒與邵堯夫因戲之前送牡丹藥苗堯夫皆有詩酬仲通初提舉崇福宫見􅀉魏忠献公挽歌辝三首酬君貺和景仁對酒見􅀉三首野軒以下四首和安之汙亭藥軒晚暉亭奉同運使陳殿丞知儉字公廙惜洛陽牡丹爲霜風所損名花多種欲紛敷一夕霜風非所虞節物偶然何足道人情遺恨不能無飄颻徤筆詩千首惆悵東風酒百壷縱使前春滿朱檻使車郍復滯西都又和惜春謡朝来風雨歇春意漠然收去我不辝訣憑誰能借留杓星漸西轉洛水自東流曲渚撤華幄芳園罷彩毬雉鳴丘麥秀􅁞起野桑柔亂絮天涯滿晴陽草際浮已嗟心緒減況復􅁂絲稠頼聽新翻曲非爲􅀒勝㳺劉伯壽坐中度曲命曰惜春謡還陳殿丞原人論宗宻所撰破自然破元􅂔破天命明佛性品物芸芸逰太虚不知誰氏宰洪爐一株花落分榮辱萬竅風號見有無覺後共占猶是夢衣中所得亦非珠何如皷瑟浴沂水春服成時詠舞雩和王秀才虞仲字道濟以光始自陜右遊山歸復登少室爲詩見􅀉痩馬飄颻屢往還疲勞専爲訪名山須知筋力行將老漸恐峯巒不可攀蠟屐早能㝷勝槩彈冠悔更落塵寰幸依賢者爲東道大得逍遥水石間道濟居維氏西湖泛舟輙用前韻􅀉呈君實鎭􅀞舩容與到橋還舉祑依然洛酒斑湖上曉光涵潩水坐中晴色見嵩山心縁念别如多事身爲移居似不閑疊石石淙雖兩處福昌陽翟正中間奉和滿舩歌吹拂春灣天外晴霞水底斑誰信飛觴臨綺席獨能回首望青山東門車馬怱怱别西洛風煙寂寂閑疊石溪頭應更好却輸野􅅱坐林間新買疊石溪莊再用前韻招景仁一谿清水珮聲寒兩岸莓苔錦繡斑三徑誰來􅁲鄰舎千峯我已作家山鹿裘䔧杖偏冝老紫陌紅塵不稱閑早挈琴書逺相就放歌爛醉白雲間和鎭畫處始知虵足剰管中那識豹文斑從來有道須康丗未省􅂛平却住山學富名髙難自晦眼昏心悸始能閑此句鎭自謂計君疊石溪邊景不得從容􅀊月間戲書宋子才止足堂舉丗戀榮禄夜行無乃勞獨君年未至止足一何髙矮製烏紗帽寛裁白㲲􅂁華穰坐終日閑按紫檀槽􅀉題宇文中允之邵所居􅀌宦行直道栖栖良可悲誰能拂衣去不待挂冠期經史乃吾友雲山爲己知丗間青紫貴盡付兩佳兒貽夸者我樂非君樂君憂非我憂蓬蒿與溟渤終老不同逰春遊人物競紛華驪駒逐鈿車此時松與柏不及道旁花和潞公遊天章楚諌議園宅名卿新治第上宰舊連牆槐䕃青青葉星鄰兩兩光林花裂錦狹門路築沙長共引庭間水交生壁外篁魚窺薦琴石螢散讀書牀玉帳方懷逺松齋欲就荒旌幢今少憩蘭蕙不徒芳早晚平狼望同來舉壽觴還張景昱景昌秀才兄弟詩卷韡韡新詩卷青春映棣華機雲今繼羙載恊舊承家幸託仁人里時回長者車白虹光亂眼何敢議瑜瑕􅀉題張著作中理善頌堂嘉州公􅁉學士之父玉壘老先生逍遥樂太平門䦨百客盛冠蓋一鄉榮國族招邀近堂皇指顧成江山對平逺圗史散縱横止水中心適秋毫外物輕鯉庭新露冕閭巷不湏驚和宇文公南塗中見􅀉騘馬烏紗遊洛塵未能全得自由身深慙白首戀微禄不向青山爲散人斥鷃卑飛聊取適冥鴻髙舉益難親蜀都迢遞千餘里徒誦新詩妙入神酬張二十五秀才南園遣意景昱字明叔花卉日相續朝昏興􅀉新露荷香入座風竹浄無塵嘯詠皆群從喧囂逺四鄰須知軒冕客冨貴不􅀜身酬張三十秀才見贈景昌字子京樸學居人後清塗忝衆先瓠因無用棄木爲不才全比得林泉趣仍依邑里賢自慙頭半白方解賦歸田八月十五夜陪留守宣徽登西樓值雨待月乆不見經歳待佳節無如隂靄何果然時雨足安用月華多未免銀釭進空聞玉漏過􅁃公興不淺乆爲駐鳴珂秋雨新霽遊水北馬上偶成秋色與秋聲蕭然滿洛城未霜林葉赤新雨野風清水氣侵肌冷嵐光刮眼明誰云景如畫伹恐畫難成運使虞部按行洛西諸縣因遊所過名山有詩百餘首合爲一編蒙賜寵示俾之継作一首屬城窮僻地攬轡徧周流弊政已更化名山不廢遊鳴騶留谷口輕屐歴巖幽聚看官儀者相扶半白頭吕宣徽挽歌二首弈世台衡貴盈門􅌧冕榮遐方流惠化殊俗讋威聲宥宻資忠力安平􅀉老成遽􅀐箕尾去何以慰蒼生維嶽人皆仰長城衆所依逺猶方克壯昭世忽長違象設儼如在英靈窅不歸唯應令名乆竹素藹餘輝和君貺暮秋四日登石家寺閣晚泛洛舟嬉遊乗晚霽登覽犯秋寒不出埃塵外安知天壤寛宫前斷山碧林表落霞丹欲下惜佳趣相留更􅀝欄右登閣葉下宫槐老雲飛洛浦秋復陪元禮棹却望仲宣樓曲岸迷頻轉遥山碎不流夷猶聊寓賞浩蕩得忘憂晨出露漸徑昏歸月滿舟星河散寥廓珠貝映汀洲林館囬車入壷觴秉燭游山公興未盡徒御且番休右泛舟又和六日四老㑹井宋子才大監李幾先將軍茰房迎令節菊蘂入芳筵華燭􅀄長夜清霜未冷天悲風咽横吹驟雨迭繁絃聊附鄒枚客敢希園綺賢和王少卿尚恭字安之十日與留臺國子􅁥崇福宫諸官赴王尹賞菊之㑹儒衣武弁聚華軒盡是西都冷落官莫歎黄花過嘉節且將素髪共清歡紅牙板急絃聲咽白玊舟横酒量寛青眼主公情不薄一如省闥要人看和白都官序見贈齒踈􅁂白兩眸昏萬事無堪老病身脫粟猶霑太倉禄法冠仍忝外臺臣直縁迃僻求閑地豈是􅀌髙慕古人英俊滿朝皆稷契太山何少一飛塵送白都官歸長安丈夫那肯浪低眉薄宦空添􅁂裏絲瀘水歸來山浩蕩都門辭去菊離披黄雞白酒五陵樂杜曲樊川九榖冝復見夫君行直道空峒氣俗未應衰送雷章秘丞知芮城西伯昔断訟令名存迄今南臨大河曲北􅀝首陽岑俗􅀍聖賢化人多禮譲心夫君老經術終日想鳴琴酬邵堯夫見示安樂􅌪中打乖吟安樂窩中自在身猶嫌名字落紅塵酔吟終日不知老經史滿堂誰道貧長掩柴荊避寒暑只將花卉記冬春料非閑處打乖客乃是清朝避丗人和邠守宋度支迪来卜居與南園爲鄰弱冠交遊􅁂髪蒼飽諳官况好􅀷蔵閑居共買一壥地盡老常依數仭牆雖喜卜鄰同晏子尚慙推宅異周郎何時稅此慿熊駕􅀝杖相迎立路傍和張文􅁉􅀄寒十首何處􅀄寒好􅀄寒郟鄏城垂紳多俊彥列第盡公卿裘馬過從盛門闌灑掃清誰家擁獸炭盡日管􅃶聲何處􅀄寒好􅀄寒洛汭宫翠華雖脉脉佳氣自葱葱闕角日華白苑牆霜葉紅都人心望幸注目不離東何處􅀄寒好􅀄寒洛水橋沙痕水清淺風葉柳蕭條闕塞長塗直嵩丘倒影遥鳯樓雖在北車馬不塵囂何處􅀄寒好􅀄寒太室山晴空煙澹泊返照雪孱顔極目鴈稍􅃿無心雲自還猶餘拜表累不得坐松間嵩山去洛近二百里五日僅能往還以妨拜表未果往何處􅀄寒好􅀄寒禹鑿門遥天露崖口輕浪漱山根萬佛龕苔老一燈林靄昏漁梁杳相望石瀬夜聲喧何處􅀄寒好􅀄寒噴玉泉折冰流谷口飛溜落雲邊雀噪聚林杪樵歌下石巔㝷幽不思返坐嘯夕陽偏何處􅀄寒好􅀄寒疊石溪山斜改昏曉路曲失東西拾栗走村稚鑿垣巢乳雞我來閑擁􅄄曝背草簷低何處􅀄寒好􅀄寒肅政臺官閑免簿領門靜少塵埃天借風霜氣人無鷹隼猜庭荒餘老栢尚有夕烏來何處􅀄寒好􅀄寒逰弈園林間葉未盡籬底菊猶存結竹爲庵小開爐御名火温誰言處城市岑寂似丘樊何處􅀄寒好􅀄寒福善居長宵對燈火滿屋聚詩書蹔息登山屐休脂下澤車所安容􅂰地何必更多餘逰奕福善皆坊名􅀉題刁景純藏春塢景純致政歸京口治其所居命曰藏春塢前有一岡皆松林命曰萬松嶺藏春在何許鬱鬱萬松林永日門䦨静東風花木深主公今素髪野服遂􅀄心時與郷人醉髙歌散百金和君貺少林寺逹磨自云傳佛心緒言迷丗到于今旣携隻履歸西域安得遺靈在少林􅀌月正明髙殿冷清風不断老松深謝公自愛山泉美肯爲幽禪此訪㝷又和嶽祠謝雪題嶽寺平法華庵宴坐幾何年庭蕪與砌連焚修眞諦苦功行得無圎闕里詩三百頼郷文五千厭煩猶不讀何况淤􅅺蓮平住庵不出近四十年日誦法華經􅂾十卷望日示康廣宏清晨三緑袍羅拜北堂髙積善因前烈餘光及爾曹勿矝從仕早當念起家勞修丘皆由巳何人可佩刀和君貺題潞公東荘嵩峯逺疊千重雪伊浦低臨一片天百頃平臯連别館兩行踈柳拂清泉國須拄石扶丕御名人待樓航濟巨川蕭相方如左右手且於窮僻置閑田和君貺任少師園賞梅寒壓春頭草未牙喜聞置酒賞新葩官儀赫弈三川守野意蕭踈四皓家不用管絃妨淡泞肯容桃李競繁華昏鵶散乱傳呼出歸路林間燭影斜别韻一首風日雖寒晝景長探春逺訪白蓮莊岸冰猶在水先緑柳葉未生條已黄老木根侵苔徑窄新梅花入酒巵香天眞不必人修飾得趣勿嫌臺館荒又和開叔寒梅犯雪榮大隱又專名異種生江渚何年到洛城洛中雖有梅開花常晚獨大隱梅最先開相傳好事者自江南移來今数十年矣色如虚室白香似主人清嚮使吴兒見不思菰菜羮和公廙喜雪用莊字韻曏來河洛乆愆陽禱祀徒勞罄粛莊林雪飛花欣暫白麥田濡葉未全黄城中稍覺桑薪貴村外時聞社甕香八使孜孜憫惸獨斯民那復畏㓙荒和史誠之謝送張明叔梅臺三種梅花别後相驚兩􅁂霜可憐梅蘂爲誰芳臺頭日暖分三色材下風清共一香正爛漫時遊不足忽離披去樂難常慇懃手折遥相贈不欲花前獨舉觴早春􅀉景仁辛夷花爛開故人殊未來愁看柳漸緑更忍折殘梅去􅀊景仁约辛夷花開即来洛中芍藥謝乃去疊石溪上春茅茨卜築新前言如不踐山蟬又􅀏人和君貺宴張氏梅䑓京洛春何早慿髙種嶺梅紛披百株密爛漫一朝開青女工粘綴霜娥巧剪裁崑山雲滿谷蓬陼浪成堆勢擁樽前合香從席下來蜺旌羾天起練甲洗兵回不使光風散曽無夜色催人稠衣馥郁地狹舞徘徊民服召公化時推何遜才何遜有早梅詩淹留文酒樂璧月上瑶䑓看花四絶句洛陽相望盡名園牆外花勝牆裏看手摘青梅供按酒何須一一具柸盤洛陽相識盡名流􅀐馬遊勝下馬逰乗興東西無不到但逢青眼即淹留洛陽春日最繁華紅緑隂中十萬家誰道群花如錦繡人將錦繍學群花南園桃李近方栽澆水未乾花已開山果野􅂼隨分有交遊不厭但頻來和君貺清明與上巳同日泛舟洛川十韻繁華兩佳節邂逅適同時雅俗共爲樂風光如有期曉煙新里巷春服滿津涯已散漢宫燭仍浮洛水巵占花分設席愛柳就張帷華轂爭門出輕簾夹路垂三川雲錦爛四座玉山欹疊皷傳遥吹輕橈破直漪清談何衮衮和氣益熈熈想見周南俗當年播逸詩和君貺􅀉河陽侍中牡丹眞宰無私嫗喣同洛花何事占全功山河勢勝帝王宅寒暑氣和天地中盡日玊盤堆秀色滿城繡轂走香風謝公髙興看春物倍億清伊與碧嵩又和安國寺及諸園賞牡丹洛邑牡丹天下最西南土沃得春多一城竒品推安國四面名園接月波山相著書稱上藥翰林弄筆作新歌人間朱粉無因學浪把菱花百遍磨送酒與邵堯夫因戲之前送牡丹藥苗堯夫皆有詩林下雖無憂可銷許由聞􅀃掛空瓢請君呼取孟光飲共挿花枝煑藥苗酬仲通初提舉崇福宫見􅀉冨壽安民舊學違符移擁筆素心非青雲有路那足顧白髮滿頭胡不歸永日杜門無俗客臨風隱几得天機西山爽氣秋應好恨不相從上翠微魏忠獻公挽歌辭三首嬴海訏謨定宗祧指顧安鴻勲柱石壯勁節雪霜寒翼亮三朝乆初終一德完如何未黄髮壟柏已丸丸愛物威容悴憂公􅀫疹加􅀌忠貫白日美志掩丹霞行路皆忡悵聞風悉歎嗟英靈覲宗祖猶想佑皇家惻怛動旒扆鴻臚葬老臣簘鐃震淦口紼翣隘漳濵乆大英名在哀榮異禮陳豐碑紀遺烈長泣鄴城人酬君貺和景仁對酒見􅀉三首􅂴拙無時用耆明獨我思乗閑同把酒道舊各成詩髙義刮眼膜清風生􅁂絲方將激衰俗賤子實何爲北闕黄金印西山白髪翁訏謨帝庭異十築洛川同晴野峯峯碧霜林葉葉紅無因侍樽席惆悵又西風右上宣徽何事挂冠客至今留帝臺紅塵終可厭青眼不長開春路半銷雪寒枝初破梅南園劣容席洒掃望公來右上侍中野軒以下四首和安之黄雞白酒田間樂䔧扙􅁑巾林下風更􅀂食芹仍􅁀背野懷併在一軒中汙亭雜花亂種盤渦底小屋深居鑑燧心朝市囂聲那得到晨昏暑氣不能侵藥軒雨餘條甲繞堦生往往桐君昔未名采貯不須勤􅁀
