body:
  text: 序二送李公眀序投壷新格序吕獻可章奏集序劉道原十國紀年序洛陽耆英㑹序序􅉠禮河南志序故相國龐公清風集略後序百官表緫序故樞宻直學士薛公諱田詩集序趙朝議丙字南正文藁序送李公明序治平四年夏龍圖閣直學士工部尚書兼侍讀李公公明得謝於朝以太子少保致仕故事告老者不復謝辤徑歸其家天子謂公明歴事四朝清慎公方進退以禮不可與它臣比特召入對賜之坐慰勞乆之又特置餞宴於資善堂唯講讀之官及記起居者凡七人得與焉比終宴天子六遣使者存問􅂆侑加賜白金御茶給優俸又詔以梓宫在殯不欲自爲詩凡與宴之官皆命賦詩以寵其行仍别録一通以聞自前丗稱告老而榮者莫􅀂漢二踈當是時宣帝不過賜之二十金而巳未聞有恩禮􅀂今之盛者也嗚呼天子之安養耆壽優崇有德勤厚周宻誠古今所未有也公明少爲丞相子長爲臺閣顯官迨今老而去位耳目聦明手足輕利諸子爲九卿牧守而性皆孝謹洛陽佳園宅此數者又二踈所不能備也然則公明福禄完美顯榮光大亦古今所未有也先皇帝時公明數求致仕未之得光甞侍坐從容請曰兄年雖七十而康寧如是獨不可強爲天子少留邪公明曰所貴於致仕者欲及其身之無恙自樂於郷黨耳必待不任朝謁輿疾而歸是不得巳豈止足之謂邪光忻然服其言益知賢者所存固非庸人所能及也昔先子登進士第先相國爲舉首故光於公明兄弟行也資善之㑹光以新去經席不得與焉於其行也僚友復設祖道供張於西郊光又以御史之職不得與焉其恨恨可言邪故聊序其事以爲别從表弟右諌議大夫權御史中丞涑水司馬光序投壷新格序傳曰張而不弛文武弗能也弛而不張文武弗爲也一張一弛文武之道也君子學道從政勤勞罷倦必從宴息以養志游神故可乆也蕩而無度將以自敗故聖人制禮以爲之節因以合朋友之和飾賔主之歡且寓其教焉夫投壷細事遊戲之􅀋而聖人取之以爲禮用諸卿黨用諸􅀖國其故何哉鄭康成曰􅄬壷射之細也古者君子射以觀德爲惎平體正端壹審固然後能中故也蓋投壷亦猶是矣夫審度於此而取中於彼仁道存焉疑畏則踈惰慢則失義方􅁚焉左右前􅁍過分則差中庸著焉得十失二成功盡弃誡慎明焉是故投壷可以治心可以修身可以爲國可以觀人何以言之夫投壷者不使之過亦不使之不及所以爲中也不使之偏頗流散所以爲正也中正道之根柢也聖人作禮樂修刑政立教化垂典謨凡所施爲不啻萬端要在納民心於中正而巳然難得而制者無􅀂人之心也自非大賢守道敦固則放蕩傾移無所不至求諸少選且不可得是故聖人廣爲之術以求之􅄬壷與其一焉觀夫臨壷荷矢之際性無麤宻莫不聳然恭謹志存中正雖不能乆可以習焉豈非治心之道歟一矢之失猶一行之虧也豈非修身之道歟兢兢業業慎終如始豈非爲國之道歟君子之爲之也確然不動其心儼然不改其容未得之而不懾旣得之而不驕小人爲之也俯身引臂挾巧取竒苟得而無愧豈非觀人之道歟由是言之聖人取以爲禮冝矣彼􅀶弈者以詭譎相髙以殘賊相勝孔子猶曰飽食終日無所用心爲之猶賢乎已况投壷者又可鄙略而輕廢哉古者壷矢之制揖遜之容今雖闕焉然其遺風餘象猶髣髴也世傳投壷格圖皆以竒儁難得者爲右是亦投瓊􅍐之􅀋耳非古禮之本意也余今更定新格増損舊圖以精宻者爲右偶中者爲下使夫用機徼幸者無所措其手焉壷口徑三寸耳徑一寸髙一尺實以小豆壷去席二箭半箭十有二枚長二尺有四寸以全壷不失者爲賢苟不􅀎全則積算先滿百二十者勝後者􅀒俱滿則餘算多者勝少者􅀒為圖列之左方并各􅇚其旨意焉有初箭十算首箭中者君子作事謀始以其􅀎慎始故賞之第二箭以下連中不絶者皆五算􅀂一箭不中次箭皆爲散箭其違中内有貫耳及驍者其箭别計假􅀂有初箭仍貫耳則二十算是也舊圖􅀄箭一籌其决每箭加二籌盡四箭而止甚非勸功之道今自二箭以下連中不絶者皆賞之所以勉人扵不觧也全壷無算無算者不以耦之算數多少皆勝之也􅀂兩人俱全則復計其餘算以决勝􅀒夫為山九仞功虧一簣全壷實難故君子貴之有終十五算末箭中也靡不有初鮮克有終故比之有􅀄又加五算也散箭一算貫耳十算耳小扵口而􅀎中之是其用心愈精故賞之驍箭十算亦謂之驍皆俊猛意也謂􅄬而不中箭激反躍捷而得之復投而中者也爲其巳失而復得之不逺復善補過者也故賞之若復投而貫耳者其算别計復投而不中者廢之敗壷不問巳有之算皆負謂十二箭皆不中大無功也􅀂兩人皆敗則亦計餘算以决勝負横耳謂箭横加耳上舊五十籌橫壷横加壷口舊四十籌皆依常算無賞偶然而横非投者工何足以賞若爲後箭所撃而墜地者與不中同􅀝竿箭斜􅀝壷口中舊十五籌龍首􅀝竿正箭首正向巳者舊十八籌龍尾􅀝竿而箭羽正向己者舊十五籌狼壷轉旋口上而成􅀝竿者舊十四籌帶劒貫耳不至地者舊十五籌耳􅀝竿舊十五籌皆廢其算傾斜險詖不在扵善而舊圖以爲竒箭多與之筭甚無謂也今廢其算所以罰之然亦異扵不中者故於連中全壷皆得通數􅀂爲後箭所擊及自墜壷若耳中者復計其筭墜地者與不中同矣倒中舊百二十籌倒耳舊不門籌數並滿壷中之筭盡廢之顛倒反覆􅁖之大者柰何爲上賞今盡廢其筭所以明逆順之道吕獻可章奏集序歐陽觀文有言士學古懷道者仕於時不得爲宰相必爲諌官諌官與宰相等坐乎廟堂之上與天子相可否者宰相也立乎殿陛之前與天子爭是非者諌官也宰相九卿而下失職者受責於有司諌官失職者取譏於君子有司之法行乎一時君子之譏著之䇿書而昭明垂之百丗而不泯誠哉是言也然士之居其任果能不失職者亦鮮矣獻可爲臺諌官前後凡􅀂干年遇黜者三皆以彈奏執政確切不巳天子重傷大臣意不得巳而黜之其直聲赫然振動天下自餘百官之愆違政事之闕失苟與之同時無彊弱大小知無不言言無不盡如獻可者於其職業可謂無所愧􅀒矣古之人稱死而不朽者如臧文仲旣没其言立是也然文仲之言傳於今者無幾蓋時人不能存録遂使遺逸豈不惜哉光於獻可忝備僚友獻可平生造􅂰之言固不可得而聞今旣没其子由庚等捜求章奏遺藁得二百餘篇光請而序之俾後之人察其言足以知獻可之心然則獻可身雖没其心長存也嗚呼獻可以直道自立終始無缺而官止於諌議大夫年止於五十八彼不以其道得者或位極將相壽及胡耇從愚者視之則可爲憤邑從賢者視之以此况彼所得所失孰爲多少邪後之人得是書者冝寳蓄之當官事君苟能効其一二斯爲偉人矣熈寕五年八月二十九日司馬光序劉道原十國紀年序皇祐􅀄光爲貢院属官時有詔士能講解經義者聽别奏名應詔者數十人趙周翰爲侍講知貢舉問以春秋禮記大義其中一人所對最精詳先具注䟽次引先儒異說末以巳意論而断之凡二十問所對皆然主司驚異擢爲第一及發糊名乃進士劉恕年十八矣光以是慕重之始與相識道原乃其字也道原是􅀊賦詩論䇿亦入髙等殿試不中格更下國子監試講經復第一釋褐鉅鹿主簿和川令陸介夫爲廣西帥奏掌機冝前丗史自太史公所記下至周顯德之末簡䇿極愽而於科舉非所急故近嵗學者多不讀鮮有能道之者獨道原篤好之爲人強記紀傳之外閭里所録私記雜說無所不覧坐聽其談衮衮無窮上下數千載間細大之事如指掌皆有稽據可考驗令人不覺心服英宗皇帝雅好稽古欲徧􅀚前丗行事得失以爲􅀛鑑光承乏侍臣甞從容奏舊史文繁自布衣之士鮮能該通況天子一日萬機誠無暇周覧乞自戰國以還訖于顯德凡開國家之興衰繫衆庶之休戚善可爲法惡可爲戒者詮次爲編年一書刪其浮長之辭庶於奏御差便上甚喜㝷詔光編次歴代君臣事仍謂光曰卿自擇館閣英才共修之光對曰館閣文學之士誠多至於專精史學臣未得而知者唯和川令劉恕一人而巳上曰善退即奏召之與共修書凡數年史事之紛錯難治者則以諉之光蒙成而巳今上即位更命其書曰資治通鑑王介甫與道原有舊深愛其才熈寧中介甫參大政欲引道原修三司條例道原固辭以不習金榖之事因言天子方属公以政事冝恢張堯舜之道以佐明主不應以財用爲先介甫雖不能用亦未之怒道原毎見之輙盡誠規益及吕獻可得罪知鄧州道原往見介甫曰公所以致人言蓋亦有所未思因爲條陳所更法令不合衆心者冝復其舊則議論自息介甫大怒遂與之絶未幾光出知永興軍道原曰我以直道忤執政今官長復去我何以自安且吾親老不可乆留京師即奏乞監南康軍酒得之光㝷判西京留臺奏遷書􅈰於洛陽後數年道原奏請身詣光議修書事朝廷許之道原水陸行數千里至洛陽自言比氣羸憊必病且死恐不復再見留數月而歸未至家遭母喪俄得風疾右手足偏廢伏枕再期痛苦備至毎呻吟之􅂩輙取書修之病益篤乃束書歸之􅈰中以元豐元年九月戊戍終官至祕書丞年止四十七嗟乎以道原之耿介其不容於人齟齬以没固冝天何爲復病而夭之邪此益使人痛惋惝怳而不能忘者也道原嗜學方其讀書家人呼之食至羹炙冷而不顧夜則卧思古今或不寐逹旦在和川甞以公事適野見劉聦太宰劉雄碑知嘉平五年始改建元正舊史之失在洛陽與光偕如萬安山道旁有碑讀之乃五代列將人所不稱道者道原即能言其行事始終歸驗於舊史信然宋次道知亳州家多書道原枉道就借觀之次道日具酒饌爲主人禮道原曰此非吾所爲來也殊廢吾事願悉撤去獨閉閤晝夜讀且抄留旬日盡其書而去目爲之翳道原致疾亦由學之苦邪方介甫用事呼吸成禍福凡有施置舉天下莫能奪髙論之士始異而終附之靣譽而背毀之口是而心非之者比肩是也道原獨􅁬厲不顧直指其事是曰是非曰非或靣刺介甫至變色如鐵或稠人廣坐介甫之人滿側道原公議其得失無所隱惡之者側目愛之者寒心至掩耳起避之而道原曽不以爲意見質厚者親之如兄弟姦謟者疾之如讎用是困窮而終不悔此誠人之所難也昔申棖以多欲不得爲剛微生髙以乞醯不得爲直如道原者可以爲剛直之士乎道原家貧至無以給旨甘一毫不妄取於人其自洛陽南歸也時已十月無寒具光以衣襪一二事及舊貂褥賮之固辤強與之行及頴州悉封而返之於光而不受於它人可知矣尤不信浮屠說以爲必無是事曰人如居逆旅一物不可乏去則盡弃之矣豈得齎以自隨哉可謂知之明而決之勇矣道原好讀書志欲籠絡宇宙而無所遺不幸早夭其成者十國紀年四十二卷包羲至周厲王疑年譜共和至熈寜年略譜各一卷資治通鑑外紀十卷餘皆未成其成者亦未以傳人曰今柳芳唐曆本皆不同由芳書未成而傳之故也期於􅉂目然後傳病亟猶汲汲借人書以參校己之書是正其失氣垂盡乃口授其子羲仲爲書属光使譔埋銘及十國紀年序且曰始欲諸國各作百官及藩鎭表未能就幸於序中言之光不爲人譔銘文巳累年所拒且數十家非不知道原託我之厚而不􅀗承命悲愧尤深故序平生所知道原之美附於其書以傳來丗道原自言其先萬年人六丗祖度唐末明經及第爲臨川令卒官遇亂不能歸遂葬髙安因家焉南唐以髙安爲筠州今爲筠州人父渙字凝之進士及第爲潁上令不能屈節事上官年五十弃官家廬山之陽且三十年矣人服其髙歐陽永叔作廬山髙以美之今爲屯田貟外郎致仕云洛陽耆英㑹序昔白樂天在洛與髙年者八人遊時人慕之爲九老圖傳於丗宋興洛中諸公継而爲之者凡再矣皆圗形普明僧舎普明樂天之故第也元豐中文潞公留守西都韓國冨公納政在里第自餘士大夫以老自逸於洛者於時爲多潞公謂韓公曰凢所爲慕於樂天者以其志趣髙逸也奚必數與地之襲焉一旦悉集士大夫老而賢者於韓公之第置酒相樂賔主凡十有一人旣而圗形妙覺僧舎時人謂之洛陽耆英㑹孔子曰好賢如緇衣取其敝又改爲樂善無厭也二公寅亮三朝爲國元老入賛萬機出綏四方上則固社稷尊宗廟下則熙百工和萬民天子心腹股肱耳目天下所取安所取平其勲業閎大顯融豈樂天所能庶幾然猶慕効樂天所爲汲汲如恐不及豈非樂善無厭者與又洛中舊俗燕私相聚尚齒不尚官自樂天之㑹巳然是日復行之斯乃風化之本可頌也宣徽王公方留守北都聞之以書請於潞公曰某亦家洛位與年不居數客之後顧以官守不得執巵酒在坐席良以爲恨願寓名其間幸無我遺其爲諸公嘉羡如此光未及七十用狄監盧尹故事亦預於㑹潞公命光序其事不敢辭時五年正月壬辰端明殿學士兼翰林侍讀學士太中大夫提舉崇福宫司馬光序開府儀同三司守司徒武寜軍節度使致仕韓國公冨弼字彦國年七十九河東節度使開府儀同三司守太尉判河南府兼西京留守司事潞國公文彦愽字寛夫年七十七司封郎中致仕席汝言字君從年七十七太常少卿致仕王尚恭字安之年七十六太常少卿致仕趙丙字南正年七十五祕書監致仕劉几字伯壽年七十五衛州防禦使致仕馮行己字肅之年七十五太中大夫充天章閣待制提舉崇福宫楚建中字正叔年七十三司農少卿致仕王慎言字不疑年七十二太中大夫提舉崇福宮張問字昌言年七十龍圗閣直學士通議大夫提舉崇福宫張壽字景元年七十序賻禮名以位顯行由學成此禮之常若夫身處草野未甞從學志在爲善不求聲利此則尤可尚也近丗史氏專取髙官爲之傳故閭閻之善人莫之聞喪禮之廢壞乆矣而民間爲甚至有􅀄喪親賔各具酒肉聚於其家與主人同醉飽者有以鼔樂導喪車者有因喪納婦者相習爲常恬不知恠醫助教劉太居親喪獨不飲酒食肉終三年此乃今士大夫所難能也其弟永一尤孝友廉謹過人於熙寜􅀄巫咸水入夏縣城民溺死者以百數永一執竿立門首他人物流入門者輙擿出之有僧寓錢數萬於其室居無何僧自經死永一遽詣縣自陳請以錢歸其弟子郷人􅀒其債乆不償者永一輙毀劵以愧其心其行事􅀋如此有周文粲者其兄嗜酒仰文粲爲生兄或時酗􅇌文粲其鄰人不平而唁之文粲怒曰吾兄未甞歐我汝何離間吾兄弟也有蘇慶文者事継母以孝聞常語其婦曰汝事吾母小不謹必逐汝継母少寡而無子由是安其室終身元豐中朝廷修景靈宮調天下􅀞工詣京師事畢有詔選試其􅄖者留翰林授官禄有臺亨者名第一以父老固辤歸飬於田里此五人與余同縣故余得而知之悲夫天下布衣之士刻志厲行而人莫知者可勝數哉始太之喪其父也余兄弟賻以千錢且爲書致之曰禮凡有喪它人助之珠玉曰含車馬曰賵貨財曰賻衣服曰襚今物雖薄欲人之可継也乆之太請刻其書於石曰郷也郷人不知有􅉠禮自太父之喪郷人稍稍行之太欲廣其傳由吾郷以及鄰縣由鄰縣以逹四方使民間皆去弊俗而入於禮豈小􅀘哉余益美其志因諭之曰是書不足刻余竊慕君子樂道人之善請書若兄弟及周文粲蘇慶文臺亨所爲以傳於丗庶幾使爲善者不以隱微而自懈焉元豐六年十一月壬寅朔涑水迃叟序河南志序周官有職方土訓誦訓之職掌道四方九州之事物以詔王知其利害後丗學者爲書以述地理亦其遺法也唐麗正殿直學士韋述爲兩京記近故龍圖閣直學士宋君敏求字次道演之爲河南長安志凡其廢興遷徙及宫室城郭坊市第舎縣鎮郷里山川津梁亭驛廟寺陵墓之名數與古先之遺迹人物之俊秀守令之良能花卉之殊尤無不備載考諸韋記其詳不啻十餘倍開編粲然如􅃌諸掌其􅀶物之書也次道性嗜學先正宣獻公蓄書三万卷次道自毀齒至于白首從事其間未嘗一日捨置故其見聞􅀶洽當時罕倫又閑習國家故事公私有疑咸往質焉又喜著書如唐書仁宗實録國史㑹要集注史記之􅀋與衆共之或專修而未成者皆不計外其手自繤述巳成者凡四百五十卷蓋昔人所著未有􅀂此其多也次道旣没太尉潞公留守西京其子慶曽等奉河南志以請於公曰先人昔甞佐此府叙其事尤詳惜其傳於丗者甚鮮願因公刻印以廣之豈徒先人蒙不朽之賜於泉壤抑亦使四方之人未甞至洛者得之如遊處巳熟後丗聞今日洛都之盛者得之如身逢目睹也幸公留意公從之且命光爲之序光於次道友人也烏敢以固陋而辤時元豐六年二月戊辰端明殿學士兼翰林侍讀學士司馬光序故相國龐公清風集略後序公之勲業治行范景仁所爲清風集叙言之精矣公性喜詩雖相府機務之繁邊庭軍旅之急未甞一日置不爲凡所以怡神飬志及逢時值事一寓之於詩其髙深閎逺之趣固非庸淺所可及至於用事精當偶對的切雖古人能者殆無以過及疾亟光時爲諫官有謁禁走手啓參候公猶録詩十餘篇相示手注其後曰欲令吾弟知老夫病中尚有此意思耳字巳慘澹難識後數日而薨曏者嗣子某字懋賢巳集其文爲五十卷旣而以文字之多懼丗人傳者不能廣也又選詩之尤善者凡千篇爲十卷命曰清風集略刻板摹之命光継叙其事嗚呼公之善在人者旁施四海後垂無窮如詩乃公之餘事耳􅅷賢猶務其傳勤勤恐不逮况其大者乎公之積慶冝有継哉時年月日門人涑水司馬光敘百官表緫序四海至廣雖聖人不能獨治萬機至衆雖聖人不能徧知是故設官以分其事量能而授之任自生民以來有國家者莫之能易也唐虞夏啇尚矣周官具存粲然大僃降及秦漢迄于隋唐雖不能如三代之粹美然上下相維皆有條緒孔子稱惟噐與名不可以假人又曰必也正名乎名之冝正者無􅀂百官唐􅀄􅕄事官有六省一臺九寺三􅁥十六衞十率府之属其外又有勲官散官勲官以賞戰功散官以褒勤舊故必折馘執俘然後進階以其不可妄得故當時人以爲榮及髙宗東封武后預政求媚於衆始有況階自是品秩浸訛朱紫日繁矣肅宗之後四方糜沸兵革不息財力屈竭勲官不足以勸武功府不足以募戰士遂并職事官通用爲賞不復選材無所愛吝將帥出征者皆給空名告身自開府至郎將聽臨事注名後又聽以信牒授人有至異姓王者於是金帛重而官爵輕矣或以大將軍告身􅂊易一醉其濫如此重以藩方跋扈朝廷畏之窮極褒寵苟求姑息遂有朝編卒伍暮擁節旄夕解緹衣旦䊸公衮者矣流及五代等衰益紊三公端揆之貴施於軍校衣紫執􅁚之榮􅀍於胥史名噐之亂無此爲甚大宋受命承其餘弊方綱紀大基未暇􅁵正故臺省寺監衛率之官止以辨班列之崇卑制廪禄之厚薄多無職業其所謂官者乃古之爵也所謂差遣者乃古之官也所謂職者乃古之加官也自餘功臣檢校官散官階勲爵邑徒爲煩文人不復貴凡朝廷所以皷舞群倫緝熈庶績者曰官曰差遣曰職而巳於三者之中復有名同實具交錯難知又遷徙去來常無虚日欲觀其大略故自建隆以來文官知雜御史以上武官閤門使以上内臣押班以上遷除黜免刪其煩冗存其要實以倫􅀋相從以先後相次爲百官公卿表云故樞宻直學士薛公諱田詩集序楊子法言曰言心聲也書心畫也聲畫之羙者無如文文之精者無如詩詩者志之所之也然則觀其詩其人之心可見矣今之親没則畫像而事之畫像外貌也豈􅀂詩之見其中心哉故樞宻直學士贈太尉薛公以文學政事顯於真宗仁宗之際其所施設見於國史及宋宣獻公所爲神道碑此不詳書公旣薨五十餘年少子中散大夫致仕某集公詩二百二章以授光俾之譔序且爲之名昔先人爲郫尉公爲轉運使知待甚厚薦之於朝光雖不肖其敢忘諸是以雖不文不敢辤謹按薛氏自姚秦以來丗有偉人位公卿將相行能功業光照簡􅁽號稱甲族迄于今不衰豈非河汾勝氣獨鍾於一門乎然而枝葉因遊宦多散之四方惟公一族留不去猶居河東請名之日河汾集庶子子孫孫継公之志常保守奉事則而象之以傳慶於無窮也元豐八年三月丁未涑水司馬光序趙朝議丙字南正文藁序在心爲志發口爲言言之美者爲文文之美者爲詩如鼔鍾者聲必聞於外灼􅀛者兆必見于表玉藴石而山木茂珠居淵而岸草榮皆物理自然雖欲揜之不可得己朝議大夫致仕趙君南正善属文尤嗜爲詩自􅀄仕至歸者聚其藁凡十四編一旦走僕􅀒之以書属光爲之序光實何人克膺兹任然甞聞同僚楚正叔之言曰予與南正同登進士第又同居頴陽熟其爲人其清白耿介它人殆難能也今閱其文藁味其言求其志乃知正叔信不我欺而南正所守良可尚也噫丗人有得南正文藁而􅀚之雖未之識如自少至老日與之遊矣元豐七年三月十一日丁未涑水司馬光序温國文正公文集卷第六十五
