body:
  text: 温國文正公文集卷第二十二章奏七第三狀第四狀第五狀第六狀第七狀第八狀第九狀除待制舉官自代狀上殿謝官劄子謹習䟽第三狀右臣今月十四日十七日兩曽上奏辝免知制誥乞更擇人未蒙開許臣聞明主商徳而序位忠臣量能而受職是以分不乱於上能不窮於下治辨之要莫尚於斯臣自知文字􅁖陋又不敏速􅀂除拜稍多詔令填委必閣筆拱手不能供給縱復牽合鄙拙􅀹甚􅁀之四逺爲人指􅀏又貽聖朝愧耻謂之乏賢故為公家之謀則莫􅀂用其所長營一身之私則莫􅀂避其所短夕􅄰晨興慮之巳熟始敢披陳干浼天聽剖肝瀝膽莫非懇到自修注以來前後非一而昭昭之誠無由上逹屢觸報聞不蒙省察或者謂臣修起居注自應知制誥與吕公著不同公著當辝臣則當受凡自修注知制誥者非有祖宗法令著於方册特近歳相承之例耳祖宗之時但取庶官之中有辭藻者即知制誥不必皆以修注爲之其修注或改他官不必皆知制誥也夫以資塗用人不問能否比例從事不顧是非此最國家之弊法所冝革正者也又謂臣就試已畢不當復辭臣就試之日以爲公著辭未必免臣試未必中是以不辭今公著獲免而臣忝恩命則今日辭之亦未爲晚也且過而能改猶愈於迷而不復見賢思齊猶愈於受爵不讓況臣修注之􅀄已甞辭免至于四五而朝廷不􅁢伏望聖慈特賜哀察使臣服勤他􅃥惟力是視其知制誥勑告臣不敢祗受乞更賜擇人謹具狀奏聞伏候勑旨第四狀右臣昨三次上奏辭免知制誥乞更擇人奉聖旨令依累降指揮不許辭讓便授告勑臣曏者承乏諌官首曽上言以爲致治之道任官最急人之材性各有所宜雖以稷契臯夔之賢皆守一官終身不易況今群臣固非其比當度材而受任量能而施職奏牘具存事可案驗今臣自知文辭鄙野不足以充知制誥之職􅀂止以修起居注資塗相值循例序進恬而有之曽不愧畏是臣但能譏評他人曠官􅀼位而受爵不讓至于己斯亡此迺欺罔天聽靖言庸違當伏共兠之誅以清唐虞之治臣雖甚愚史不敢爲伏望聖慈察臣前後所奏特賜允從其知制誥乞别賜擇人所有勑告不敢祗受謹具狀奏聞伏候勑旨第五狀右臣先曽四次上奏乞免知制誥别賜擇人奉聖旨依累降指揮不許辭讓令便受勑臣㓜甞渉學粗知臧否豈敢以譎詐之心上欺君父顧人之材分各有所冝􅀂貪榮冒居使職業廢墜則探囊胠篋迺竊盗之微者皆不足誅也臣雖小人實不敢爲是以曏者不辭於召試之􅀄而辭於吕公著免試之後誠欲果於得請不爲虚發故也今􅀂因循苟且復徃就職則臣進退之迹自可猜惑況於世人誰不譏􅀏如是則臣出入禁闥何心自安陪接縉紳何施面目顧視僮僕何以爲容是以違犯天威不敢避死決求自免而詔命愈堅終未置捨臣誠愚瞢不識所謂意者朝廷以臣所言皆爲矯僞不足聽察邪􅀂使臣言出於矯僞當正典刑以警姦回􅀂出於至誠當從其所請使上無曠官下無竊位奈何前後奏章上者直加屏棄不復省察使區區之志何以自明􅀂以近例修起居注者必知制誥不可改易則臣􅀼觀先朝以來修起居注不因罪累譴黜及親嫌相避而去爲他官者劉騭知衡州潘慎修遷考功郎中許衮判吏部南曹劉燁改工部貟外郎兼侍御史知雜事丘雍充淮南都大制置發運使徐奭充兩浙轉運使蔡齊改禮部貟外郎兼侍御史知雜事鄭向充兩浙轉運副使髙餗罷守本官陳詁充三司户部副使葉清臣充兩浙轉運副使趙槩充天章閣待制楊察充江南轉運使蔡襄知福州以是􅀚之雖近例亦不盡知制誥也臣今悃欵迫切無以復加伏望聖慈特賜哀察􅀂使臣得遂其志是去罪辱而就顯榮雖日遷十官未足方其幸也所有知制誥􅃙告臣必不敢祗受乞别賜擇人謹具狀奏聞伏候􅃙旨第六狀右臣先曽五次上奏乞免知制誥别賜擇人奉聖旨令臣依累降指揮不許辝讓便受告勑者臣聞晉王述每受職不爲虚讓其有所辭必於不受及遷尚書令其子坦之諌以爲故事應讓述曰汝謂我不堪邪坦之曰非也但克讓自美事耳述曰旣云堪何爲復讓臣竊重􅄒知爲人臣陳力就列之體心常慕之臣自勝冠以來投牒應舉入朝求仕豈偃蹇山林不求聞逹之人邪顧力有所不任則不敢盜國家禄位恐職事廢闕䧟於刑辟耳故自度材分可以䇿勵雖髙位不敢辭不可強勉雖小官不敢受曏者蒙聖恩除館職諌官侍講皆不敢以一言飾讓蓋以館職掌比校文字諌官掌規正得失侍講掌講解經術皆不専以文辭爲職故也今臣自修起居注以來前後辭免章十餘上正爲文辭鄙惡不堪典誥命而已終未蒙朝廷賜察是以奏牘煩多喋喋不巳頗爲時人所恠其愛臣者以爲讓榮利惡臣者以爲飾虚詐要之二者皆未得臣之心夫有諸中而辭諸外然後謂之讓􅀂臣者無諸中而不敢爲者也安得謂之讓哉譬如使羸夫􅀒百鈞之重而予之千金羸夫必辭非不欲金也力不任故也夫飾者内欲之而外不取將以有求也今臣不就美官屢違詔命上怒下怪將抵罪誅尚何求哉且苟能其官而固讓不止則是朝廷百官皆無人可爲非天下之通法也臣故謂如王述能則爲之不能則止爲得其冝臣雖才非古人願附王述之志􅀂始者可愛則不􅀂勿辭亦旣辭之則不可復受伏望聖慈特加矜察其知制誥勑告臣必不敢祗受乞如前奏别賜擇人謹具狀奏聞伏候勑旨第七狀右臣先曽六次上奏解免知制誥乞更擇人奉聖旨今臣依累降指揮不許辭譲便受勑告者臣天性樸騃無他伎能惟守信誠是爲操履平居與等軰語言猶不敢欺罔況以奏牘聞於朝廷苟有毫髮不實不惟陛下睿聖憲章嚴明天地􅀑神亦所不容臣之愚意但以知制誥之職當取天下文章髙妙逾衆絶倫者以充其選如臣野陋實不堪稱喝懇自歸前後非一而聖恩􅃀然終未開察臣􅀼自傷悼幸生盛明之世而昭昭之心無以自列􅀂黽勉包羞奉承詔旨則天下之人皆謂臣已試而復辭已辭而復就蓋習知朝命重於改移因欲飾讓以盗虚名如此則臣生􅀒大罪死􅀒餘愧雖進極榮顯不􅀂啜菽飲水長爲布衣也臣今􅀂得請於朝則不肖之迹庶幾猶有以自明如其不然則矯僞之名至於身􅃿骨朽不可湔洗臣夙夜念此寢則不安食則失味進退遑遑身無所措是敢不避煩瀆冒犯天威伏望聖慈哀其窮迫特寢恩命使得服役他官以報萬一死不敢辭􅀂朝廷以臣頑蔽不恭乞治臣之罪削黜流放靡不甘心所有知制誥勑告臣必不敢祗受乞如前奏別賜擇人謹具狀奏聞伏􅃸勑旨第八狀右臣先曽七次上奏乞免知制誥奉聖旨令臣依累降指揮不許辭讓便受告勑者臣竊聞去歳權御史中丞王疇上言近年以來中外臣僚或因較量差遣或因論辨身計或因進以干譽或因罪而覬免肆爲妄談輙形奏章皆心語兩違情實交戾外示輕官爵之愛以欺於衆内實計分銖之利而爭於上遺義忘耻至於要君用詐而安爲小人之行陛下聖度慈仁包荒蓋匿悉置不問彼小人者亦豈識恩德之隆哉欲望朝廷應今後臣下有要君作僞如前所陳者並出宸断便賜聽許如此則罔上邀利者知所畏而士之行己有耻事君以誠者少勸矣奉聖旨今後臣僚所陳如有似此情渉詐慢者令中書樞宻院取旨施行凡疇所言實近歳之大弊臣亦疾之如疇之志今臣自差修起居注以來前後辭免十有三次若朝廷以臣爲誠則何惜曲回大恩從臣所欲使臣不肖之迹稍有以自明􅀂以臣爲詐則罔上邀利章奏煩多無臣爲甚臣願以身就譴謫以彰前令之必行庶爲陛下清此頽俗亦臣報國之一效也所有知制誥勑告臣必不敢祗受乞别賜擇人謹具狀奏聞伏候勑旨第九狀二十三日上㝷蒙恩改天章閣待制右臣先曽八次奏陳乞免知制誥奉聖旨令臣依累降指揮更不許辭讓便授告勑者臣以愚懇煩瀆天聽前後非一聖朝􅃀然終不聽許臣誠戇昧不識所謂豈此職非臣不可爲邪將從臣之請則隳紊綱紀敗壞風俗邪何請之之勤而拒之之堅也􅀂以爲非臣不可爲則方今辭臣滿朝英俊比肩舉而用之無不稱職􅀂以爲隳紊綱紀敗壞風俗則臣之㣲志正欲朝廷無曠官群下無竊位而已於綱紀風俗亦無所虧損不然者臣之所爲果誖理傷道朝廷令之不從諭之不入至于四五至于八九侮慢威命無此爲甚則當投之四荒以禦魑魅豈有但己者也臣不勝迫切之誠伏望聖慈察臣前後所奏或賜允從或加譴責其知制誥勑告臣必不敢祗受謹具狀奏聞伏候勑旨除待制舉官自代狀伏見三司度支判官尚書刑部郎中充集賢校理馮浩修已以謹與人以誠端良無邪恬淡不競居常處衆敦大有容臨義據正堅彊不奪乆在文館屢更任使比材量德臣實不如今舉自代謹具狀奏聞上殿謝官劄子臣光伏􅂪聖恩除天章閣待制兼侍講仍知諌院臣竊以爲方今國家之得失生民之利病大要不過擇人賞罰豐財練兵數事而已行道之人粗有智識者皆知之意在朝廷不盡聞雖聞不力行耳朝廷不盡聞此諌官之罪聞而不力行則非臣等之所及也凡此數事臣前忝諌官已甞略爲陛下言之今陛下寘臣於侍從之列留臣以諌爭之職恩施愈隆責望愈重臣有生安敢愛有言安敢隱伏願陛下擇其事之要重者特留聖心則天下幸甚不然臣雖朝夕侍前徒汚名位而費廪禄於公家之用果何益也取進止謹習䟽月日具位臣某謹昧死上䟽尊號皇帝陛下臣以駑蹇之質再爲諌官荷陛下寵禄之優責任之重夙夜震恐不遑寜處思極竭愚忠以報塞萬一顧􅃈􅃈細務皆不足以煩瀆聖聽􅀼以國家之治亂本於禮而風俗之善惡繫於習赤子之啼無有五方其聲一也及其長則言語不通飲食不同有至死莫能相爲者是無他焉所習異也至於古今亦然有服古之衣冠於今之丗則駭於州里矣服仐之衣冠於古之丗則僇於有司矣衣冠烏有是非哉習與不習而已矣夫民朝夕見之其心安焉以爲天下之事正應如此一旦驅之使去此而就彼則無不憂疑而莫肯從矣昔秦廢井田而民愁怨王莽復井田而民亦愁怨趙武靈王變華俗效胡服而群下不恱後魏孝文帝變胡服効華俗而群下亦不恱由此􅀚之丗俗之情安於所習駭所未見固其常也是故上行下效謂之風薫烝漸漬謂之化倫胥委靡謂之流衆心安定謂之俗及夫風化已失流俗已成則雖有辯智弗能諭也彊毅不能制也重賞不能􅂆也嚴刑不能止也自非聖人得位而臨之積百年之功莫之能變也周易履之象曰君子以辨上下定民志故天子之令必行於諸侯諸侯之令必行於卿大夫士卿大夫士之令必行於庻人使天下之􅀔如身之使臂臂之使指莫不率從詩曰勉勉我王綱紀四方此禮之本也昔三代之王皆習民以禮故子孫数百年享天之禄及其衰也雖以晉楚齊秦之彊不敢􅁀蔑王室豈其力不足哉知天下之不巳與也於是乎翼戴王命以威懷諸侯而諸侯莫敢不從所以然者猶有先王之遺風餘俗未絶於民故也其後曰以衰薄下陵上替晉平公之丗魯子服回如晉還謂季孫意如曰晉之公室將遂卑矣六卿彊而奢傲將因是以習習實爲常能無卑乎其後趙魏韓氏卒分晉國習於君臣之分不明故也降及漢氏雖不能􅀂三代之盛王然猶尊君卑臣敦尚名節以行義取士以儒術化民是以王莽之乱民思劉氏而卒復之赤眉雖群盜猶立宗室以從民望王郎矯託名氏而燕趙響應董卓之乱􅀽紹以誅卓爲名而州郡雲合曹操挾獻帝以令諸侯而天下莫能與之敵操之心豈不欲廢漢而自立哉然没身不敢爲者畏天下之人疾之也自魏晉以降人主始貴通才而賤守節人臣始尚浮華而薄儒術以先王之禮爲糟粕而不行以純固之士爲鄙樸而不用於是風俗曰壞入於偷薄叛君不以爲耻犯上不以爲非惟利是從不顧名節至于有唐之衰麾下之士有屠逐元帥者朝廷不能討因而撫之拔於行伍授以旄􅃏其始也取偷安一時而已及其乆也則衆庶習於聞見以爲事理當然不爲非禮不爲無義是以在上者惴惴焉畏其下在下者睽睽焉伺其上平居則酒􅁏金帛甘言屈體以相媚恱得間則銛鋒利刄很心詭計以相屠膾成者爲賢敗者爲愚不復論尊卑之序是非之理陵夷至于五代天下蕩然莫知禮義爲何物矣是以丗祚不永逺者十餘年近者四三年敗亡相屬生民塗炭及大宋受命太祖太宗知天下之禍生於無禮也於是以神武聦明躬勤萬幾征伐刑賞断於聖志然後人主之􅀔重而群臣懾服矣於是翦削藩鎮齊以法度擇文吏爲之佐以奪其殺生之柄擥其金糓之富選其麾下精銳之士聚諸京師以備宿衛制其腹心落其爪牙使不得陸梁然後天子諸侯之分明而悖亂之原塞矣於是節度使之權歸於州鎮貟之權歸於縣又分天下爲十餘路各置轉運使以察州縣百吏之臧否復漢部刺史之職使朝廷之令必行於轉運使轉運使之令必行於州州之令必行於縣縣之令必行於吏民然後上下之叙正而紀綱立矣於是申明軍法使自押官以上各有階級以相臨統小有違犯罪皆殊死然後行伍之政粛而士用命矣此皆禮之大節也故能四征不庭莫不率服汛掃九州以陟禹之迹至于真宗重之以明德継二聖之志夙夜孜孜宣布善化銷鑠惡俗以至于今治平百年頑民殄絶衆心咸安此乃曠丗難成之業陛下當戰戰栗栗守而勿失者也臣竊見陛下有中宗之嚴恭文王之小心而小大之政多謙讓不決委之臣下誠使所委之人常得忠賢則可矣萬一有姦邪在焉豈不危甚矣哉古人所謂委任而責成功者擇人而授之職業叢脞之務不身親之也至於爵禄廢置殺生子奪不由巳出不可也洪範曰惟辟作威惟辟作福臣之有作威作福害于而家㓙于而國威福之柄一失於人而習以爲常則不可復収矣此明主之所慎也又頃以西鄙用兵權置經略安撫使緫一路之兵得以便冝從事及西事已平因而不廢其河東一路緫二十二州軍曏時節度使之權不能及矣唐始置㳂邊八節度亦如是而巳以其權任太重故後丗有跋扈之臣洛誥曰毋􅀂火始燄燄厥攸灼敘弗其絶言慎其微也又將相大臣典諸州者多以貴倨自恃轉運使欲振舉職業徃徃故違戾而不肯從夫將相大臣在朝廷之時則轉運使名位固相逺矣及在外爲知州則轉運使統諸州職也烏得以一身之貴庇一州之事轉運使不得問哉漢刺史以六百石吏督察二千石豈以名位之貴賤哉又自景祐以來國家怠於乆安樂因循而務省事執事之臣頗行姑息之政於是胥史讙譁而斥逐御史中丞輦官悖慢而廢退宰相衛士凶逆而獄不窮姦澤加於舊軍人罵三司使而法官以爲非犯階級疑於用法朝廷雖特誅其人而已停之卒復収飬之其餘有一夫流言於道路而爲之變令推恩者多矣凡此數者殆非所以習民於上下之分也夫朝廷者四方之表儀也朝廷之政如是則四方必有甚者矣於是元帥畏偏禆偏禆畏將校將校畏士卒姦邪怯懦之臣至有簡省教閱使之驕惰保庇羸老使之繁冗屈撓正法使之縱恣詆訾粟帛使之憤惋甘言謟􅀏靡所不至於是士卒翕然譽之而歸怨於上矣彼旣爲之則此效之下旣言之則上從之前旣行之則後襲之茍彼爲而此不效下言而上不從前行而後不襲則怨怒聚於其身而禍亂生矣長此不已日滋月益民之耳目習而安之此有以異唐之季丗乎後魏孝明帝時征西將軍張彛子仲瑀上封事欲抑損武人不預清品羽林虎賁千餘人焚彛第殺彛父子官爲収捕凶強者八人斬之其餘大赦以安之懷朔鎮人髙歡時奉使至洛陽見之歸而散家財以結客曰朝政如此事可知矣於是始有飛􅀭之志由是觀之紀綱不立則姦雄生心矣夫祖宗苦身焦思以變衰唐之俗而陛下髙拱熟視以成後魏之風此臣之所爲陛下痛惜也臣愚以爲陛下當􅁬剛徤之志宣神明之德凡群臣奏事皆察其邪正辨其臧否熟問深思求合於道然後賞罰黜陟断而行之則天下孰不曠然恱喜詩曰君子如怒亂庶遄沮君子如祉亂庶遄已蓋言無所臧否之爲患入也經略安撫使有征討之事則置之無事則當廢之儻未能廢則軍事迫急不暇奏知者使専之可也其餘民事皆委之州縣一断於法或法重情輕情重法輕可殺可徙可宥可赦並聽夲州申奏決之朝廷何必出於經略安撫使哉轉運使規畫號令行下諸州而諸州違戾不從者朝廷當辨其曲直􅀂事理實可施行而州將侍貴勢故違之者當罪州將勿罪轉運使將校士卒之於州縣及所統之官或公卿大臣有悖慢無禮者明著階級之法使断者不疑將帥之官有廢法違道以取恱於下㱕怨於上者當隨其輕重誅竄廢黜公正無私御衆嚴整者當量其才能擢用褒賞如是則上之人難動而下用命矣上之人難動而下用命此所以尊朝廷也上下已明綱紀已定然後修儒術隆教化進敦篤退浮華使禮義興行風俗純羙則國家保萬丗無彊之休猶􅀝南山而坐平原也臣某昧死再拜上䟽温國文正公文集卷第二十二
