  text: 温國文正公文集卷第十四
  hash: sha256:ab03ebe743d97b8716332a4055bbd2ef00e7da339f0353198755a35e37471d2d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_014-1a}
body:
  text: 律詩九喜雨八韻呈明叔六月十八日夜大暑閑中有冨貴􅀉唐州吴辨叔二兄自題冩眞和安之乆雨和復古小園書事復古詩首句云獨歩復靜坐輙継二章右獨歩右静坐光詩首句云飽食復閑眠又成二章右飽食右閑眠􅀉題濟源李少卿章園亭和明叔九日邵堯夫先生哀辭二首閑居呈復古和明叔遊白龍溪和景仁七十一偶成六十􅀉景仁去春與景仁同至河陽謁晦叔館於府之後園旣去晦叔名其館曰禮賢夢得作詩以紀其事光雖愧其名亦作詩以継之與樂道約㑹超化寺比至樂道以疾先歸途中有詩見􅀉和樂道再以詩見􅀉晚春病起呈擇之治臣次韻和復古春日五絶句酬宋叔逹道復古之兄􅁲居洛城見􅀉和王安之題獨樂園和吴辨叔知鳳翔見􅀉和安之今春於鄭國相公及光處得綴珠蓮各一本植之一盆仲夏始見一花喜而成詠末句云未知先合謝誰家君貺環溪􅉂目獨樂園二首放鸚鵡二首呈樂道太皇太后挽歌詞二首曹后和劉伯壽陪潞公禊飲南園雨霽景物粗佳有懷正叔安之和潞公與昌言正叔遊獨樂園徘徊乆之主人不至潞公遊龍門光以室家病不獲叅陪獻詩十六韻初夏獨遊南園二首和景仁荅才元􅀉示花圖或謂光嗤景仁談禪而自談又因用歬韻爲景仁􅄙禪題􅀓燈録後奉和大夫同年張兄㑹南園詩徽字伯常荅張伯常之郢州塗中見􅀉獨樂園新春和潞公眞率㑹詩景仁書云去冬因酒病耳病牙遂不入洛以詩􅀉呈又云新鑄鬴斛與今太府寺尺及􅁠衡􅀂合符契復次前韻三月二十五日安之以詩二絶見招作眞率㑹光以無從者不及赴依韻和呈又用安之韵招君從安之正叔不疑二十六日南園爲眞率㑹二十六日作眞率㑹伯康与君從七十八􅀊安之七十七􅀊正叔七十四􅀊不疑七十三􅀊叔逹七十􅀊光六十五􅀊合五百一十五􅀊口号成詩用安之前韻别用韻其夕􅀫獨樂園詰朝將歸賦詩二十七日邀子駿堯夫賞西街諸花呈張子賤子賤親自安邑徙居洛二十八日㑹不疑家席上紀實三月三十日㣲雨偶成詩二十四韻書懷献留守開府太尉兼呈眞率諸公其日雨中聞姚黃開戯成詩二章呈子駿堯夫四月十三日立夏呈安之和子駿洛中書事安之令子河陽官舎作畦樂軒安之有詩􅀉題輙敢継和和安之喜雨逍遥四章呈欽之堯夫喜雨八韻呈明叔藴隆亦太甚薈蔚不朝隮直可憂秋廪非徒病夏畦民心或能徹天造固難稽黯淡雲􅂊蔟滂沱日未西衣􅁭坐來冷城闕望中迷園筍新梢活庭蕉濕葉低響從䆫破􅁓行喜屐生泥昨旦煩相報慿君謝竹雞明叔家舊飬竹雞放之林中今蕃息頗多俗以為雨候六月十八日夜大暑老柳蜩螗噪荒庭熠燿流人情正苦暑物怎巳驚秋月下濯寒水風前梳白頭如何夜半客束帶謁公侯閑中有冨貴閑中有冨貴逈與俗塵殊水淨齊䊵展花繁蜀錦䊸竹風寒扣玉荷雨急跳珠可􅀏公孫衍酣􅁔誇丈夫􅀉唐州吴辨叔二兄方城古稱險逺在䂊州南近歳汙萊闢新民秦晉參當官誠近厚獲譴亦無慙但惜牆隂竹歸轅幾日驂自題冩眞黄面霜􅂡細痩身從来未識漫相親居然不可市朝住骨相天生林野人和安之乆雨秋霖逢甲子禾耳恐須生流俗幸無驗髙田猶有成潤唯蔾莠得爛與蕙蘭并早晚浮雲豁逍遥賦晚晴和復古小園書事飽食復閑眠風清雨霽天葉深時墜果岸曲乍藏蓮波面秋光淨林梢夕照鮮東家近亦冨滿地布苔錢復古詩首句云獨歩復靜坐輙継二章踽踽出東軒徐徐歩小園何須從吏卒亦不引兒孫躡屐㝷莎徑􅂝笻撥水源愁聞俗客到唯􅀃市朝喧右獨歩一榻僅容􅂰身心俱寂然直縁知樂内亦不爲安禪棐几陳編掩竹䆫殘局􅂢尚餘喧噪在野鳥與林蝉右靜坐光詩首句云飽食復閑眠又成二章錢少何須萬杯多不過三􅀛腸夲易足熊掌詎冝貪散歩竹齋外髙吟栁徑南此心無所用脫粟亦深慙右飽食秋懷一事無暑盡晝涼􅀄竹户靜長閉䔧牀安有餘逍遥化胡蝶容易入華胥天上多官府神仙恐不如右閑眠􅀉題濟源李少卿章園亭縣僻人事少土肥風物殊杖刋靈壽木輪裹溴梁蒲竹不減淇水花仍似洛都主公眉雪白遊覽未甞扶和明叔九日不奈衰􅁂白羞看朝鑑明聊慿佳節酒強作少年情雨冷弊裘薄風髙醉帽傾如何不行樂况復值秋成邵堯夫先生哀辭二首菽藿一簞樂蒿萊三畆寛蒲輪不能起甕牖有餘安髙節去圭角乆要敦歳寒今朝郊外客誰免涕汍瀾慕德聞風乆門交傾蓋新何須半面舊不待一言親講道切磋直忘懷􅀏語眞重言蒙蹠實佩服敢書紳閑居呈復古閑居雖􅂴放未得便無營伐木添山色穿渠擘水聲經霜収芋美帶雨接花成前日鄰翁至柴門掃葉迎和明叔遊白龍溪溪深荒徑微㝷勝不知疲寒月影隨馬曉風冰滿髭行歌被褐叟聚戯拾薪兒外野饒眞趣令人􅁭抱夷和景仁七十一偶成心地長閑爲己物年華不駐是天時當時海上乗槎客維楫都無任所之六十􅀉景仁從來好與天爭力困竭方慙已力微見事晚於蘧伯玉今知五十九年非去春與景仁同至河陽謁晦叔館於府之後園既去晦叔名其館曰禮賢夢得作詩以紀其事光雖愧其名亦作詩以継之蓬飛匏繫十餘年並䕃華榱出偶然郭隗金臺雖見禮華歆龍尾豈能賢浮雲丗味閑先薄寒柏交情老更堅明日河梁即分首人生樂事信難全與樂道約㑹超化寺比至樂道以疾先歸途中有詩見􅀉顚毛種種齒浮揺屈指交遊漸寂寥時較半朝非是晚路無數里不爲遥子猷垂到復歸去安道雖知末易邀古寺裵回乆東望青春雲日冷蕭蕭和樂道再以詩見􅀉諌垣簮筆接英遊今日華顚昔日憂邂逅升沉皆是命逍遥出處本無愁衡門不羡金門貴藿食焉知􅁏食謀溟海榆枋各安分蓬萊未必勝嵩丘晚春病起呈擇之治臣風日正和柔身輕喜病瘳􅂴抛殘蠹簡暖脫弊貂裘值客開青眼逢花忘白頭家家好酒色何處可同遊次韻和復古春日五絶句雪霜衰􅁂㧞還生桃李新園長未成五十尚能勝六十今年又減去年情車如流水馬如龍花市相逢咽不通獨閉柴荆老春色住他陌上暮塵紅東城絲網蹴紅毬北里瓊樓唱石州堪􅀏迃儒竹齋裏眼昏逼紙㸔蝇頭家藏歌吹只西鄰吹落梅花歌落塵百葉桃開深院裏輸它白髮有情人燕拂人衣絮撲頭紅英滿地緑隂稠殘春舉目多愁思休上迢迢百尺樓酬宋叔逹道復古之兄卜居洛城見􅀉離群四十一春風縱有相逢似夢中幸得東西作鄰舎但嗟彼此是衰翁漢文前席人將去復古謫官不日牽復􅁃信誅茅橐未充来詩云自􅀏顛窮便歸去並無穿繫買山錢悵望新隄碧蕪闊杖䔧􅂝手幾時同和王安之題獨樂草濃􅀄過雨林静逺含煙鷰引新飛鷇荷承半墜蓮朋來惟有月山見不須錢誰與同其樂壷中濁酒賢和吴辨叔知鳯翔見􅀉岐陽府舎始相逢四十餘春屈指中昔日布衣今露冕當時小吏亦衰翁醉吟乆作藏身計條教應多及物功惟是綵衣難再著長林極目起悲風和安之今春於鄭國相公及光處得綴珠蓮各一本植之一盆仲夏始見一花喜而成詠末句云未知先合謝誰家春凍消時種兩牙南風薫日見􅀌花先開必自陶鈞力且合歸功丞相家君貺環溪地勝風埃外門深花竹間波光冷於玉溪􅀔曲如環榮路回翔厭華軒嘯詠閑堪羞謝太傅不復到東山瞑目瞑目思千古飄然一烘塵山川宛如舊多少未來人獨樂園二首獨樂園中客朝朝常閉門端居無事今日又黄昏客到暫冠帶客歸還上􅀜朱門客如市豈得似林間放鸚鵡二首野性思歸乆籠樊今始開雖知王恩厚何日肯重來雖道長安樂爭如在隴頭林間祝聖主萬歳復千秋呈樂道歡遊俛仰皆陳迹薄官須􅁷即色空試憶昔年􅀟桂㑹只如前日夢魂中太皇太后挽歌詞二首曹后麟閣承家慶軒星應德輝帝猷隂有􅀘嬪則動無違遽就蒼梧野空餘大練衣只應彤管在萬古播鴻徽四紀禕衣盛兩朝長樂尊九洲貢甘旨萬乗問晨昏明辟歸元子嘉謨賚孝孫群生資后土難荅化光恩和劉伯壽陪潞公禊飲旌幢車􅀐滿沙頭皷吹喧繁􅀞鷁浮一里羅紈光照地千家簾幕逺臨流觴隨洛水周公事月映鳳樓裴相遊令典乆墮火規切今更舉行聞美俗徧中州南園雨霽景物粗佳有懐正叔安之洛陽秋雨闋荒圃物華饒白鶴寒尤盛紅薇晚未彫鳥驚朱實墮雲滅翠岑遥楊子方嘲白相如尚苦痟安之有疾徘徊瞻望近邂逅􅀏談遼官冷慙無具相思不敢招和潞公與昌言正叔遊獨樂園徘徊乆之主人不至茂勲成亮采勝賞􅀉風流閑引翹材客同爲獨樂遊厭居華宇盛翻愛弊盧幽愧不先操篲迎塵立道周潞公遊龍門光以室家病不獲叅陪獻詩十六韻旄節擁慿熊逶迤向鑿龍順成時過蜡閉塞令行冬雪壟痕猶濕梅林思巳濃傳呼空谷應前導白雲逢飛蓋多邀客停車數問農禹功雙壁斷佛劫萬龕重絶頂標􅀌刹踈林透逺鍾氣蒸泉郁郁氷綻水溶溶藥閣低臨渚茅庵背􅀝峯凍醪資野酌寒笋佐晨饔公作藥寮潞公庵臨伊庵皆在龍門棊􅈰移依石茶爐坐䕃松醉醒皆衆共小大盡公從顧以私思累難追勝賞蹤原思􅀄不病叔夜亦非慵稽古慙經笥摛華怯筆鋒㑹須參後乗異日侍從容初夏獨遊南園二首取醉非無酒忘憂亦有花暫來疑是客歸去不成家桃李都無實梧桐半死身那堪衰病意更作獨遊人和景仁荅才元寄示花圖髙士閑居舊名花獨歩今移從洛浦逺濯自錦江深傳得巫山貌非因延壽金不須天女散已解動禪心近歳舉出談禪獨景仁未耳亦有空相之句故卒章戲之或謂光嗤景仁談禪而自談又因用歬韻爲景仁解禪賤子悟巳乆景仁迷自今良因拯溺急是致渉波深到岸何須栰揮鉏不見金浮雲任來去明月在天心題傳燈録呷著聲聞酒便狂它州浪走不還郷誰曽􅅞汝安用解彼自無槍勿誤傷探月拾針傳妄語安居暇食頼先王但令時丗如三代逹磨從它靣向牆奉和大夫同年張兄㑹南園詩徽字伯常露濃秋過半氣爽雨收餘取酒邀嘉客呼兒掃弊廬生涯數畒地官業一軒書竹結垂綸屋泉分入座渠愜心皆樂事容􅂰即安居梁靜栖無鷰波澄戲有魚茂林穿繚繞微徑歩虚徐果落方知熟莎長不忍除過從當苦逺接侍每慙踈不厭茅茨陋時迃長者車荅張伯常之郢州塗中見􅀉適意遺軒冕輕於鴻一毛扁舟千里逺佳句百篇豪酒飲冝城美歌聞白雪髙家林已春色愼勿滯江臯獨樂園新春春風與汝不相􅀜何事潛來入我園曲沼揉藍通底緑新梅翦綵壓枝繁短莎乍見殊堪喜鳴鳥初聞未覺喧慿仗東君徐按轡旋添花卉伴芳樽和潞公真率㑹詩洛下衣冠愛惜春相從小飲任天眞隨家所有自可樂爲具更微誰􅀏貧不待珍羞方下筯只將佳景便娱賔庾公此興知非淺䔧藿終難作主人景仁書云去冬因酒病耳病牙遂不入洛以詩􅀉呈許昌攜手盡時英況復新開甲第成醉裏都將春作逹老來不向酒藏情齒踈無廢銜盃趣耳病猶分度曲聲舊友昔遊渾忘却可憐寂寂洛陽城又云新鑄鬴斛與今太府寺尺及權衡􅀂合符契復次前韻裁䇶累黍乆研精況復新修鬴斛成豈校忽微爭口語本期淳古變人情旣言樂府符今尺但恐簫韶似鄭聲􅀂欲丗人俱信服鳳皇再集頴川城三月二十五日安之以詩二絶見招作真率㑹光以無從者不及赴依韻和呈真率由來無次第來詩云真率㑹名今第幾經旬踰月不爲稀籃輿但恨無人舉今目軍士皆請粮不獲趍赴坐想紛紛醉落暉來詩云數酌仍須就晚暉又盃盤豐腆勝陶令園沼繁華減白家惆悵佳辰掩蓬蓽不陪髙㑹賞鄰花來示云下瞰鄰花用安之韻招君從安之正叔不疑一十六日南園爲眞率㑹榆錢零亂柳花飛枝上紅英漸漸稀莫厭銜盃不虚日須知共力惜春暉真率春來頻宴聚不過東里即西家小園容易邀嘉客饌具雖無亦有花二十六日作真率㑹伯康與君從七十八􅀊安之七十七􅀊正叔七十四􅀊不疑七十三􅀊叔逹七十􅀊光六十五􅀊合五百一十五􅀊口号成詩用安之前韻十人五百有餘􅀊同醉花前今古稀走馬闘雞非我事紵衣絲髮且相暉樂天九老詩云七人五百七歳經春無事連翩醉彼此往來能幾家切莫辭斟十分酒儘從他􅀏滿頭花别用韻座中七􅅱推年紀比較前人少幾多花似錦紅頭雪白不遊不飲欲如何其夕􅀫獨樂園詰朝將歸賦詩平曉何人汲井華轆轤聲急散春鵶開園更有四五日映葉尚餘三兩花􅀫病岑岑猶帶酒無眠耿耿不禁平聲茶自嫌行樂妨年少遽索籃與且向家二十七日邀子駿堯夫賞西街諸花今年節物非常晚春盡西街花尚多試問二三真率友小車籃舁肯重過呈張子賤子賤新自安邑徙居洛近時洛社名真率簞食壷􅄴取次遊試問西來老朝散可能同志便相收二十八日㑹不疑家席上紀實召客客俱來賞花花正開寒暄方得所風雨不相催席上栁飛雪門前車隱雷主人意仍厚安得不裵回三月三十日微雨偶成詩二十四韻書懷獻留守開府太尉兼呈眞率諸公春盡少歡意昏昏睡思添正憂花氣索更用雨聲兼乍語鶯喉澁慵飛栁絮黏落英紅没砌茂草碧侵簾寳相錦鋪架酴醾雪擁簷沼萍浮鈿靨林笋露犀尖坐惜光風駃行愁畏日炎追隨任塵甑歌􅀏忘霜髯落筆詩情放飛觥酒令嚴金丹呼勝彩玉燭擢新籖傲岸冠巾側淋浪襟䄂霑飢仍留瘦馬歸必待清蟾筋力雖無幾娱遊亦未厭脫身離薄領適性得閭閻多病非辭貴無才豈養恬清塗誠愧忝微禄巳傷廉日費須三爵年支仰數縑餱粮粗能足蓍蔡不煩占河洛今爲盛圗書昔所潛家家花啓户處處酒飄帘温飽資兼愛安平􅀝貝瞻愚夫猶樂育下客愈撝謙落拓形骸逸優游歳月淹餘生信多幸狂醉亦無嫌其日雨中聞姚黄開戯成詩二章呈子駿堯夫榖雨後來花更濃洛人謂榖雨為牡丹厄今年榖雨後名花始開前時巳見玉玲瓏前時與堯夫逰西街得新出自千葉花以呈潞公潞公名之曰玊玲瓏客來更􅀃姚黄發只在街西相第東園夫張八家在冨相宅東小雨留春春未歸好花雖有恐行稀勸君披取漁蓑去走㸔姚黄判濕衣四月十三日立夏呈安之留春春不住昨夜的然歸歡趣何妨少閑遊勿恠稀林鸎欣有託前日始聞鸎叢蝶悵無依䆫下忘懷客髙眠正掩扉陶潜甞言夏月虚閑髙卧北􅈧下清風堸至自謂羲皇上人和子駿洛中書事西都自古繁華地冠蓋優遊萃五方比戸清風人種竹滿川濃渌土冝桑鑿龍山断開天闕導洛波囬載羽觴況有耆英詩酒樂問君何處不如唐安之令子河陽官舎作蛙樂軒安之有詩􅀉題輙敢継和皷吹娱俗耳蛙鳴愜雅懷最冝涼雨歇更與晚風偕驥子方長騖雲衢偶未諧功名當努力留此遺吾濟和安之喜雨吁嗟方請雨􅃳溽果如占黍稷固有望來麰亦未嫌聲繁清倦枕氣冷入踈簾蔓喜龍頭舉泉驚虎爪添田疇誠最急花藥不妨兼詩伯才盈斛聊應費筆尖逍遥四章呈欽之堯夫結髮讀經史疲精非一朝於今成濩落所幸得逍遥不韙狂心息難平客氣消巢林易爲足竊敢比鷦鷯閑思宇宙内何物不由天定分不移易勞心徒弃􅂢鵬飛九萬里松壽一千年斥鷃與朝菌逍遥亦自然閉目念前古飄然一烘塵兩儀仍似舊萬物互爭新軒冕榮何在簞瓢樂最眞衆人俱我􅀏我亦􅀏其人六合曠無際逍遥好縱遊放懷同一貫瞬目即千秋丸遇區􅁷止萍隨波浪流所之皆自得何懼亦何憂温國文正公文集卷第十四
