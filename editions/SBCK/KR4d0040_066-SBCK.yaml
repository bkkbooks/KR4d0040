body:
  text: 記一秀州真如院法堂記聞喜縣重修至聖文宣王廟記題絳州鼓堆祠記諫院題名記先公遺文記仁宗賜張公御書記記曆年圗後陳氏四令祠堂記獨樂園記竚瞻堂記秀州真如院法堂記壬辰歳夏四月有僧清辨踵門來告曰清辨秀州真如草堂僧也真如故有堂庳狹不足以庥學者清辨與同術惠宗治而新之今髙顯矣願得子之文刻諸石以諗來者光謝曰光文不足以辱石刻加平生不習佛書不知所以云者師其請諸他人曰他人清辨所不敢請也故維子之歸而子又何辤光固辤不􅀗乃言曰師之爲是堂也其志何如曰清辨之爲是堂也屬堂中之人而告之曰二三子苟能究明吾佛之書爲人講解者吾且南郷坐而師之審或不能則將取於四方之能者皆伏謝不能然後相率抵精嚴寺迎沙門道歡而師之又属其徒而告之曰凡我二三子肇自今以及于後相與協力同志堂圯則扶之師缺則􅀘之以至於金石可弊山淵可平而講肄之聲不可絶也光曰師之志則美矣抑光雖不習佛書亦甞剽聞佛之爲人矣夫佛蓋西域之賢者其爲人也清儉而寡慾慈惠而愛物故服弊􅀘之衣食􅂼糲之食巖居壄處斥妻屏子所以自奉甚約而憚於煩人也雖草木蟲魚不敢妄殺蓋欲與物並生而不相害也凡此之道皆以㳙㓗其身不爲物累蓋中國於陵子仲焦先之徒近之矣夫聖人之徳周賢者之徳偏周者無不覆而末流之人猶不免弃夲而背原况其偏者乎故後丗之爲佛書者日逺而日訛莫不侈大其師之言而附益之以淫恠誣罔之辭以駭俗人而取丗資厚自豐殖不知厭極故一衣之費或百金不􅀂綺紈之爲愈一飰之直或萬錢不􅀂膾炙之爲省也髙堂鉅室以自奉飬佛之志豈如是哉天下事佛者莫不然而吴人爲甚師之爲是堂將以明佛之道也是必深思於本原而勿放蕩於末流則治斯堂之爲益也豈其細哉聞喜縣重修至聖文宣王廟記或問太古何如曰不今日如也何以言之曰古之人寒衣而飢食貪生而畏死不殊於今也喜怒哀樂好惡畏欲與民俱生非今有而古無也古之人食鳥獸之􅁏艸木之實而衣其皮鳥獸日益憚艸木日益稀人日益衆物日益寡視此或不足視彼或有餘能相與守死而勿争乎争而不巳相賊傷相滅亡人之類蓋可計日而盡也聖人者􅉖其然於是作而治之擇其賢智而君長之分其土田而疆域之聚其父子兄弟夫婦而安飬之施其禮樂政令而綱紀之明其道德仁義孝慈忠信㢘讓而教導之猶有狂愚傲很之民悖戾而不從者於是鞭扑以威之鈇鉞以戮之甲兵以殄之是以民相與安分而保常飬生而送終繁衍而乆長也及周之衰先王之道蕩覆崩壞幾無餘矣其不絶者纎􅀂毫芒自非孔子起而振之廓而引之使閎大顯融以迄于今則生民之衆幾何其不淪而爲禽夷也今國家所以奉事孔子非輕也廟食於國於州於縣以􅀊時陳其俎豆鳴其金石以禮饗之自天子之貴親北面而拜焉所以然者非一人之私爲道存也然吏於州縣者或以簿領鞭扑爲急務視孔子之祠及學校廢爲餘事置之曽不誰何彼真俗吏無足道者聞喜自前丗固搢紳大夫之林藪也縣有孔子廟咸平中武吏慈釋回修之尉李垂爲之記厥後継而爲長者其嚴事孔子之心不能及釋回於是廟屋隳頓垣墉圯缺艸樹荒椔碑石断仆况於郷飲酒之容􅃶誦之音固不可得而睹聞矣今大夫馬君至而歎曰嗚呼爲川者知防而不知濬則撗潰而不禁爲民者知怒而不知教則愁怨而不從故善爲川者相髙下而導之善爲民者明是非而告之是以爲者逸而從者易物遂性而功速成也今爲吏者不能掲先王之道以教人而曰吾専任刑罰亦足爲治者是掩民之耳目而以䧟穽俟之也不仁孰大焉乃屬邑中之賢士大夫而告之曰今孔子之廟廢不修士無所講其業民無所承其化斯豈惟令之􅓧亦二三子之恥也皆曰斯固邑人日夜所不忘而不敢請者也今明府有命是天相聖人之道而以明府賜邑人也敢不奔走而承之乃相與歛材聚工葺屋之隳而壯大之修垣之圯而髙厚之去木之椔而改樹之起碑之仆而更刻之民不加賦吏不告勞不日而新廟煥然成矣於是邑中之賢士大夫相與朝夕誦堯舜之書咏啇周之詩於其中彬彬然有鄒魯之風矣噫馬君之於學也旣正其基矣猶未也今之吏率三􅀊而更後之人継而長於斯者冝勿替馬君之功引而伸之學者冝卒成馬君之志而張大之知人所以嚴事孔子者非徒飾其祠誦其文也固將明其道循其法心諭而身行之使近者恱化逺者慕效繇邑及於郷繇郷及於家父靡不慈子靡不孝兄靡不友弟靡不恭夫然後知學之成而爲益大也夫道之汙隆豈有常邪人爲之則存不爲之則亡非道去人人去道也古者至治之時或耕者推畔行者推塗獄訟不興盗賊不作彼風俗􅀂是之美者豈古則可爲而今不可爲邪繇教之未至故也今基旣正矣其餘則勉之而巳矣何憚不及於古邪人之言曰古民淳質故可教今巳僞薄故不可教是瞽惑之言不足稽也於廟之成馬君謂光旁縣之人也冝爲之記光以不文辤不敢爲使者三返而不􅀗命因直述所聞而書時某年月日也題絳州鼔堆祠記鼔堆在州治所西北二十五里樊紹述守居記作古州之圗志作鼓鼔者人馬踐之逢逢如鼓狀蓋水原充滿石下而然云紹述之文其必有据然今以耳目驗之則圗志亦未可全廢也堆之西山白馬首其東長陵纚屬相傳以爲晉之九原其北水出澤掌别名清泉堆周圍四里髙三丈穹隆而圎狀如覆釡水原數十環之觱沸雜發匯于其南溶爲深淵中多魚鼈蠏鱓水極清㓗可鑑毛髪盛寒不冰大旱不耗􅍂雨不溢其南釃爲三渠一載髙地入州城周吏民園沼之用二散布田間灌漑萬餘頃所餘皆歸於汾田之所生禾麻稌穱肥茂薌甘異它水所漑堆上有神祠蓋以水隂􅀋也故其神爲婦人像而祠中石刻乃妄以爲堯后及舜之二妃噫是水也有清明之性温厚之徳常壹之操潤澤之功雖古聖賢無以加其廟食於民也固冝何必假於堯后舜妃然後可祀也嘉祐元年九月壬寅通判并州事司馬光以事至絳從州之諸官尚書比部貟外郎薛長孺元卿國子博士劉常守道尹仲舒漢臣判官陳太􅀄寓之同遊祠下愛其氣象之美登臨之樂而又功德及人􅀂此其盛􅉖流俗之訛不可以莫之正也於是題云諌院題名記古者諌無官自公卿大夫至于工啇無不得諌者漢興以来始置官夫以天下之政四海之衆得失利病萃於一官使言之其爲任亦重矣居是官者當志其大捨其細先其急後其緩專利國家而不爲身謀彼汲汲於名者猶汲汲於利也其間相去何逺哉天禧􅀄真宗詔置諌官六貟責其職事慶曆中錢君始書其名於版光恐乆而漫滅嘉祐八年刻著于石後之人將歴指其名而議之曰某也忠某也詐某也直某也回嗚呼可不懼哉先公遺文記玉藻曰父没而不能讀父之書手澤存焉爾楊子曰書心畫也今之人親没則􅀞像而事之􅀞像外貌也豈􅀂心晝手澤之爲深切哉今集先公遺文手書及碑誌行狀共爲一櫝寘諸影堂子子孫孫永祗保之仁宗賜張公御書記皇祐􅀄故右諌議大夫張公爲翰林侍讀學士仁宗皇帝謂侍臣曰朕宅帝位幾三十年天下名儒皆甞與之遊自得張某使我日聞所未聞因書紙爲博學字命使者即其家賜之當是時國家中外無事天子方嚮藝文同侍殿閤者皆名臣之選環􅀚愧羡莫敢望云公没旣十有六年公之子子瑾字材之將摹著其書于石謂光曰必爲之記光曰昔公知滑州光從事於幕下甞聞公之言曰余平生喜書讀之不啻数十百過其簡編弊矣然每發之必有新􅀗之意焉噫公之篤學如此冝其當明主之知爲多聞之友受殊常之寵成不朽之名也使曩也先皇帝賞公以萬金於今何有固不􅀂垂一言之褒其爲子孫榮丗丗無窮也夫知人則哲帝堯之所難仲尼門人以千數獨稱顔淵爲好學今材之所爲欲以彰先皇帝之知人而揚先公之好學也夫彰君之明忠也揚父之美孝也惟忠與孝材之兩有焉光也雖無文又焉敢辤時某年月司馬光記記曆年圗後光頃歳讀史患其文繁事廣不能得其綱要又諸國分列歳時先後參差不齊乃止采共和以來下訖五代略記國家興衰大迹集爲五圗每圗爲五重每重爲六十行每行記一年之事其年取一國爲主而以朱書它國元年綴於其下蓋欲指其元年以推二三四五則從可知矣凡一千八百年命曰暦年圗其書雜亂無法聊以私便於討論不敢廣布於它人也不意趙君乃摹刻於版傳之蜀人梁山令孟君得其一通以相示始光率意爲此書苟天下非一統則漫以一國主其年固不能辨其正閏而趙君乃易其名曰帝統非光志也趙君頗有所増損仍變其卷秩又傳冩多脫誤今此淺陋之書旣不可掩因刋正使復其舊而歸之陳氏四令祠堂記故左諌議大夫贈太師中書令秦國陳公諱有三子長曰某國文忠公諱官至樞宻使同平章事左僕射次曰鄭國文惠公諱官至户部侍郎平章事太子太師致仕㓜曰某國康肅公諱官至武寧軍節度使皆贈太師尚書令兼中書令始秦公爲濟源令縣西龍潭有延慶佛舎三子相與爲學其中旣而相継登進士科文忠康粛公仍居群士之首遂接踵爲將相始大其家子孫蕃衍多以才能致美官棊布中外故當丗稱衣冠之盛者推陳氏其後文忠公自樞府出判河陽文惠公與其子主客郎中某孫虞部貟外郎某康肅公之子祠部郎中某前後皆爲京西轉運使主客君之子某復爲濟源尉濟源河陽之屬縣河陽京西之屬郡也四丗凡七人莅官於是故濟源之人􅀍陳氏之政爲多秦公􅀹有恩於民能使其民旣去而思之虞部君甞行部過濟源遊龍湮佛舎見秦公善政銘真宗皇帝賜文忠公詩主客君題名皆刻于石歎曰吾家所以能顯大於丗自非曽祖父勤施仁政於民三祖父力學以取冨貴何從而致之乎至于今子孫􅂪福禄不絶豈可不知其所自邪乃犯御名堂於佛舎之側􅀞四公之像而祠之集三石刻皆置祠下且屬光爲之記光曰光之文不足以發掦先君之美不敢爲虞部曰不然某之建是祠堂非敢自矝奕丗之美蓋欲來者見之知愛民好學可以大其家有以勸也光曰如君之言其志遠其益大矣光何敢辤􅀂夫四公之事業則有國史在光不敢及也熈寧七年五月辛酉涑水司馬光記獨樂園記孟子曰獨樂樂不如與人樂樂與少樂樂不如與衆樂樂此王公大人之樂非貧賤者所及也孔子曰飯􅂼食飲水曲肱而枕之樂亦在其中矣顔子一簞食一瓢飲不改其樂此聖賢之樂非愚者所及也􅀂夫鷦鷯巢林不過一枝偃䑕飲河不過滿腹各盡其分而安之此乃迃叟之所樂也熈寧四年迃叟始家洛六年買田二十畒於尊賢坊北􅀜以爲園其中爲堂聚書出五千卷命之曰讀書堂堂南有屋一區引水北流貫宇下中央爲沼方深各三尺䟽水爲五􅂀注沼中􅀂虎􅀲自沼北伏流出北階懸注庭下􅀂􅁚􅈹自是分爲二渠繞庭四隅㑹於西北而出命之曰弄水軒堂北爲沼中央有島島上植竹圎􅀂玉玦圍三丈􅄃結其杪如漁人之廬命之曰釣魚庵沼北横屋六楹厚其墉茨以禦烈曰開户東出南北列軒牖以延凉颸前後多植美竹爲清暑之所命之曰種竹齋沼東治地爲百有二十畦雜蒔艸藥辨其名物而掲之畦北植竹方􅀂碁局徑一丈屈其杪交相掩以爲屋植竹於其前夾道如歩廊皆以蔓藥覆之四周植木藥爲藩援命之曰采藥圃圃南爲六欄芍藥牡丹雜花各居其二每種止植兩本識其名狀而巳不求多也欄北爲亭命之曰澆花亭洛城距山不逺而林薄茂宻常􅀂不得見乃於園中築臺御名屋其上以望萬安轘轅至于太室命之曰見山臺迃叟平日多處堂中讀書上師聖人下友群賢窺仁義之原探禮樂之緒自未始有形之前曁四逹無窮之外事物之理舉集目前所病者學之未至夫又何求於人何待於外哉志倦體疲則􅄬竿取魚執祍采藥决渠灌花操斧㓢竹濯􅀬盥手臨髙縱目逍遥相羊唯意所適明月時至清風自來行無所牽止無所柅耳目肺腸悉爲已有踽踽焉洋洋焉不知天壤之間復有何樂可以代此也因合而命之曰獨樂園或咎迃叟曰吾聞君子所樂必與人共之今吾子獨取足於已不以及人其可乎迃叟謝曰叟愚何得比君子自樂恐不足安能及人况叟之所樂者薄陋鄙野皆丗之所弃也雖推以與人人且不取豈得強之乎必也有人肯同此樂則再拜而獻之矣安敢專之哉竚瞻堂記元豐三年天子大饗明堂召河東節度使守司徒兼侍中潞國文公自北都入覲于京師以相祀事禮成天子以公勵相三后克厎隆休澤敷乎烝民功安乎廟祧復命公以太尉留守西都於是公尹洛者三矣將行天子仍賜之詩云西都舊士女白首竚瞻公洛人喜公之來榮天子之言眀年相與御名堂于資聖佛祠肖公之像於其中名之曰竚瞻又二年河南進士宋師中李徹與其郷里士民之衆以書抵光曰公再爲宰相三守洛都雖惠化徧天下靡有不周而在洛爲多今吾人日洒掃兹堂而奉事之至于子孫固不忘矣異時逺方之人有過兹堂而不知其所以然者亦吾人之恥也子盍爲我書其事著于石以傳告無窮光謝曰諸君以此屬我誠大幸然凡爲士者頌一守令且猶秉筆不敢輕爲况公之德業位望崇顯如是乃使如光者紀之必得罪於識者能無懼乎西都搢紳之淵藪賢而有文者肩隨踵接諸君不往求之顧惟不肖之求能無慙乎願置我而更請於它衆皆曰子出公之門最乆其居洛又乆然則記兹堂也子於何避之夫登岱華者固不能盡其髙廣游滄海者固不能窮其幽深苟身之所至目之所睹皆可得而言矣光旣不得辝乃曰光僑居於洛巳十有三年日聞士民之譽公者如出一口敢問公之前後治洛其規爲施置如何而得民心如是願條以告我得藉之以書衆皆曰公之爲政其大者汪洋溥暢􅀂化工之神膏雨之仁固非吾人之所測也其細者樵夫牧兒皆能道之又不足以盡公之美也姑以吾人之所及者言之其簡而有節安而不擾乎抑又聞之昔黃覇爲頴川太守治爲天下第一及作相時人不謂之賢謝安爲吴興太守在官無當時譽及作宰相名振異域彼皆才有所不贍故用有不周能兼之者其在公乎光曰諸君知其一未知其二光甞學於史氏觀自古爲人臣者或得於君而失於民或得於民而失於君君非不恱也如民疾之何民非不愛也如君惡之何􅀂是者殆不可勝筭也至於事君以忠飬民以仁惻然至誠積於胷中夙夜不倦悠久不渝晦之而益光隱之而益彰逃寵而寵不我捨避名而名常我隨􅀂玉之在山珠之在淵撃鍾鼔於宫種草木在土逹于上下而不可掩者彌百千年無幾人而巳矣詩云樂只君子天子命之言得乎上也豈弟君子民之父母言得乎下也書曰臣爲上爲德爲下爲民言其惟禹稷與皐陶乎佐舜禹以阜安斯民君頼之如股肱民依之如父母功盛乎一時名髙乎百丗公之德其近是乎不然何天子之寵光便蕃而不厭下民之恱服悠久而不忘􅀂此其􅇱乎衆皆曰然光曰然則請
