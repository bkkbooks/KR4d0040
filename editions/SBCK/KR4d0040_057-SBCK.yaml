body:
  text: 表爲龐公讓明堂加恩第一表第二表爲龐相謝明堂禮成加光禄大夫行尚書户部侍郎依前樞􅁡使檢校太傅表謝生日賜羊酒米笏記夫人謝功德䟽文皇帝皇后貴妃爲文相公謝神道碑文表爲文相公求退第二表爲龐相公讓官表爲龐相公再讓宰相表爲龐相公謝官表爲文相公許州謝上表賀皇子昕建節表謝中冬衣襖表賀皇子降生表賀章獻章懿皇后祔廟表爲滑州張龍圖作進古文孝經指解表進通志表謝賜資治通鑑序表謝􅅄諭敕書并帶馬表永興謝上表遺表元豊五年秋吾若語澁疑爲中風之候恐朝夕疾作猝然不粉乃遂作遺表自書之常置卧内俟且死以授范堯夫范夢得使上之八年三月五日官車晏駕此表無用留以示子孫欲使知吾事君區區之心耳賀立皇太子表謝起居減拜表爲龐公讓明堂加恩第一表展采合宫甫成於盛禮推恩列位首冒於徽章内省空踈交深震栗云云伏念臣出於單族素乏異能遭㑹聖辰襲承義訓肩隨群士齒列具僚始更郡縣之勞遂玷閨臺之美雖慕盡公之節力自祓摩迄無髙衆之名可容稱道頃由邊􅃈進貳樞廷復參承弼之司旋緫幾微之務固巳任踰才表榮出望涯十七物之珍羞居慙厚賜三百囷之重禄坐愧素䬸雖僶勉以自安常忸怩而内訟屬國家講求闊典祗紹明禋幸千載之親逢叨一時之榮觀伏遇尊號皇帝陛下大􅂨廣覆聖道兼容不專享於神休俾下覃於朝衆謂臣職當扈蹕禮與執膰曲矝孱陋之蹤猥􅀍殊尤之澤位列元功之次邑増真食之封事與志違名非德稱惴如臨谷憂甚履氷豈可忽非據之災安無勞之賞俾衆庶有假人之議致朝廷蒙含垢之羞熟自省循誠難膺克伏望俯矝危欵曲軫睿慈特寢不貲之恩以全無似之質露誠獲允受賜益深干冒宸嚴第二表愚􅇆上列冀寢於殊恩睿志莫回必申於前命征營無措兢戰失圖中謝㐲以緫章昔王之盛節追嚴廟祏前載之美談唐虞著五府之文啇周増重屋之制乆兹曠絶未暇脩明伏遇尊號皇帝陛下祗若天常寅恭􅀕典謂五精之氣不可乆契於神􅂬三祖之霊不可弗親於宗祀若稽古訓濬發聖謨昆侖倣玉帶之圖路寢采康成之義八牎四户屬象相依萬舞九成聲明具在臣謬居機近忝助祼將庀徒護法駕之嚴􅀒璽託屬車之末奉汶上粛雝之慶無周南留滯之嗟其在惷愚固爲榮幸不可復妄膺髙位慆竊寵名况士卒有􅁀露之勞百司有供億之費欲加之賞宜用爲先臣禄秩巳豊勤劬至薄不可復加固難褒進以重愆尤伏惟天鑒崇髙下垂燭察物誠精至庻獲感通干冒宸嚴爲龐相謝明堂禮成加光禄大夫行尚書户部侍郎依前樞宻使檢校太傅表臣某言伏奉云云叨榮過分揣已非冝制命益嚴懇辤不獲中謝伏念臣顓愚無述􅀌陋寡徒起家衡茅致位機近此皆出於天幸断自宸知非才伎過絶於人豈朋援隂爲之地是以每循涯知止以寵爲憂獲一官若􅀒譴訶進一位若懷疾眚非敢厭薄髙爵希慕虚名誠以居二府之崇賛万機之大乆留不去妨廢實多况禄厚者衆之所趨勢尤者人之所疾不獨力綿任重失職是虞亦將智淺跡單處躬可畏方自謀於遜避以深逺於譏嫌豈謂伏遇尊號皇帝陛下濬發清􅇆述脩盛礼合祫天地之祀嚴配祖宗之霊茂典旣成鴻私旁洽謂臣屬當扈從與在駿奔疇其執事之勞均以受􅁵之慶遷地官之亞列増帝傅之寵名悉非庸虚所能堪稱是用力陳危欵冀寢殊思葵藿之心徒自傾而無隠雨露之澤非巳降而可收雖祗徇於詔文實内慙於霊府敢不益堅苦節愈勵撲忠當官而行蹈水火而無避惟力是視竭筋骨以爲期謝生日賜羊酒米笏記臣遭㑹聖辰謬塵機任屬是門弧之旦方慙鼎食之榮敢意睿慈重加蕃錫内循朽薄徒極悸惶夫人謝㤙功德䟽文皇帝伏以金仙妙法克賛於􅀖猷寳偈勝因有資於帝祉妾親逢熈旦祗戴鴻恩庶慿佛事之嚴仰佑皇基之固懇祈攸至慧照所臨皇后伏以坤元布德亭育群生太隂凝暉燭臨四海輙依真界恭薦微誠絜蒲塞之嘉羞敷貝多之妙偈庶資佛事以佑母儀貴妃伏以䦕雎首於國風式昭淑德軒星著於天象寔亞柔儀敢慿金偈之勝縁仰輔椒闈之多福慈明所鑒懇􅅃惟精爲文相公謝神道碑文表臣某言伏蒙聖恩詔翰林學士承㫖王某撰先臣某神道碑文降付臣者命發宸廷文成禁署澤加存􅃿榮動迩遐中謝竊以金石之傳乆而彌茂風樹之感貴而自悲諒知爲子之心咸有顯親之願伏念先臣䇿名休運接武辨朝陳力當官服勤􅃿齒臣荷析薪之業紹作室之功雖資性甚愚曽無肖似而義方未墜少逭譴尤伏遇尊號皇帝陛下過聽菲才遽加大任寘彼官師之首列於丞弼之司非藉丗榮曷膺國寵頃以歳時得􅁲宅兆圗新將論譔於豐碑用表章於大隧豈意眷明曲照優渥沓臻䊸彼神翰揭諸螭首仍詔代言之職直書傳信之辭著琬琰以無忘與松楸而並列聲光不朽永蒙庇於昆孫精爽有知潜拜嘉於幽壤荷恩益腆撫已知輕且身體髮膚皆仰資於顧復而股肱心膂敢有愛於生成未識津涯徒知涕泗爲文相公求退第二表臣某言伏奉今月某日批荅云云臣省躬甚明椯分巳熟非敢外飾以邀上知天恩留連未見識察物意專慤期於感通中謝伏念臣本以諸生親逢盛丗行能無出於萃􅀋學術不際於幾㣲所期解韋布之衣霑斗石之禄竭簿領之効免耕稼之勤安敢企踵帝庭許身王佐伏遇尊號皇帝陛下嘉其木訥亮以􅀌忠課於近小之功粗能稱旨役以煩辱之事不至敗官乃謂榱桶之才可勝棟楹之任錡釡之器足兼鼎鼐之容遠自西州驟叨重柄躋宻地則不踰中宿參大政則曽未朞年遽越等夷直登佑弼靜言遭際熟察基縁寜左右先爲之容豈朋援隂爲之地莫非眷鑒特振寒蹤雖以草木之㣲猶知雨露之澤况於有識詎敢忘恩豈欲違去旒扆之前逺離闕廷之外棄萬鍾之秩辭四輔之崇顧以義不可留情有所迫大易存覆餗之戒詩人著在梁之譏任重難勝位髙多懼雖人主含貸未賜於譴訶有司因循不加於繩治臣敢不捫心自愧顧影知非乗疵吝之未形保名迹而先退必使愆尤増積謗讟流聞致陛下失始終之仁愚臣受逺迩之責非止謀身之過抑亦􅀒國之深是用寢食震驚夙宵悸慄視金章於芒刺等黄閤於焦原苟未去身何能歉志伏望燭臨危􅅃矝恤苦言聽避位於上司得保躬於散地博求儁傑光輔休明則臣俯就下陳若􅀗九遷之喜出居外職無殊三接之榮干冒冕旒不勝惓惓切至之誠爲龐相公讓官表臣某言伏奉制命特授臣某官者恩出非常位遷不次内循空薄交集震驚中謝臣識昧踈通學非殫洽依慿時會叨假國靈荐更要劇之􅁠遂躋通顯之地陪侍惟幄參與機衡雖盡股肱之勞不遺餘力訖無毫髮之効克厭衆心居常自思敢忘内訟方且俟清間之燕竭悃欵之私力辭宥宻之聮退祈冗散之秩庶逭官責少息人言豈期志願未從寵光逾峻遽以枵踈之質猥當佑弼之司承命以還措躬無所竊以緝熈帝術寅亮國成翼戴萬機統和三極得人則群生蒙福失職則百度乖方詎可妄居豈容虚授臣雖欲冒榮不顧懷禄苟安儻衆庶責望之深成朝廷􅀝毗之失是用夙宵愧恧寤寐兢憂不知列鼎之榮怳若臨淵之懼伏望尊號皇帝陛下俯從危欵曲照􅀌蹤矝其驅䇿之勤爲日巳乆察其避議之固於心不欺俾祗服於舊官特寢除於新命旁求儁德式副輿情干冐宸嚴臣無任懇迫激切之望爲龐相公再讓宰相表伏奉某月日批荅云云需奏仰陳冀安於涯分綸言俯及未照於悃誠蹐地載驚履氷逾畏中謝臣聞量能授職者人主之通術陳力就列者臣下之令圗義或此違治何由立臣是以退居深念申旦伏思􅀼惟佑弼之崇寔繋安平之夲緫領衆職鎭撫四夷下遂萬物之冝上序三光之統凡將圖任豈易輕言至若黄覇循良朱􅀶銳敏始爲郡守皆號能臣曁陟宰司遂隳盛譽或受嗤於鶡雀或召咎於皷妖豈前智而後愚蓋任盈而量溢况臣空薄詎敢擬倫必欲使用不違才舉無敗事則莫若委之藩服俾敷寛大之條寘以邊方得奉綏懷之略庻幾展効不敢憚勤儻以服役有年居官無過而欲􅂢之草莾尚將留彼闕庭則願且守故棲未遷它職秘自寧於宻地得時望於清光忝幸已深感槩何極豈敢使巖廊曠位元鼎失和竊貪一日之榮不虞四海之責伏望尊號皇帝陛下曲垂矝恤靡賜忽遺察底裏之無欺全始終而可保特収渙命俯徇愚􅂨少安據蒺之憂尚免在梁之刺内惟懇迫期􅀗允俞爲龐相公謝官表伏奉某月日批荅云云荷恩逾分􅄋懇敷言成命莫回愧顔無􅀉中謝伏念臣賦能甚薄探道未深習詩禮以爲儒師法令而􅀘吏適際亨嘉之㑹誤膺濬哲之知亟陟顯􅂗荐膺煩使監邊則盡護群帥侍幄則恊賛萬微宻邇清光訏謨基命固巳任逾器表榮溢望涯居無終食之間少忘素䬸之責何意天恩横􅀍宸睠曲成猥掄樗液之才專委棟隆之任靡由階漸遽爾直登冠􅁽府之華資緫史臣之善志翻經演法進律加田甫聞出綍之言殆失措躬之地力陳丹慊仰黷䆳旈雖堅不奪之誠難變巳行之令威顔甚邇私願莫從俯僂若驚徜佯自失此蓋伏遇尊號皇帝陛下用人道廣愛物義深不求純備之功姑委爕調之職爰從隗始俾奉蕭規敢不祓飾厥心耀明其志識慮所及不敢顧私筋力可任期於盡瘁少􅂇緝熈之化仰醻覆燾之仁爲文相公許州謝上表伏奉制命云云巳於今月某日到任上訖避辭公鼎雖弛􅀒擔違離天閽倍深眷戀中謝伏念臣材非出􅀋識不先幾逢辰休嘉致位通顯謹司斥候亟守於邊隅䖍布教條荐更於方鎮訖無聲跡可聳傳聞伏遇尊號皇帝陛下明燭幽微仁霑䟽逖遽選掄於遐服俾陪貳於中樞曽不浹旬遂參大政未能周􅀊爰陟上司念遭際之非常求比倫之蓋寡雖濵隕越豈謝生成是用杜僥倖之門窒竒衺之徑激􅀭㢘讓抑止浮華苟有利於公家固不爲於私計然而力非其任智實有涯群心萬殊理難稱愜衆目環視動成詆訶紛如鋒矢之衝浩若波濤之沸從之則懼傷國體違之則立致身殃進退靡遑啓居無所屢以清間之侍力陳退避之誠蓋揣分之甚詳􅂲敗官而爲辱貴全終始不蹈顛危陛下察其愚衷必非縁節愍其孤迹易致怨憎俾述職於近藩得免譏於尸禄仍進天官之秩復􅂛殿幄之華禮數甚優㤙輝愈洽脫吕梁之險亟就安瀾去焦原之危更遵夷路非曲加於庇佑豈自信於保全惟許昌之奥區乃昆吾之故壤土毛豐衍民齒夥繁敢不志在拊循勤加訓導奉承寛大之詔期臻冨庶之風少副憂勤兹爲報効賀皇子昕建節表臣光言伏覩進奏院報月日皇子授忠正軍節度使檢校太尉壽國公封建夲支光隆基􅍈王室増維城之固萬方有磐石之安臣光中謝恭惟皇帝陛下仁􅀍海㝢道合天􅂨膺受純禧誕錫元胄采古昔之令典考今兹之盛務爰立藩邸恢建宏規假節秉􅃏習以戎律赤舄衮衣崇其儀望苴茅胙土訓以政治明尊尚親資忠移孝一舉而善衆美具該斯寔堂御名之逺謀􅀺苗之隆福也臣述職外方傳聞嘉喜不勝拜蹈激切之至謝中冬衣襖表臣光言伏奉詔書賜臣翠毛細錦綿旋襴一領者祗荷寵光心顔無措臣光中謝恭惟皇帝陛下皇仁溥洽衣被九圍軫念祁寒寵􅃬嘉服臣雖無似蒙澤猶均濫承安燠之榮空慙不稱之責賀皇子降生表臣光言伏覩都進奏官牒皇子降生仍令諸道不得進奉者伏以熊羆之兆載於詩雅弓韣之祥著於禮典蓋以保育􅀺元無兹爲大夲支旣茂基祚益安是故百男昌而周興五宗彊而漢熾隆替之源古今一揆臣光中謝伏惟尊號皇帝陛下純孝奉先逺䣭垂丗錫􅀋之祉乆屬群心皇穹隆休誕啓茂緒蓬矢遵吉牢具脩儀斯寔宗廟眷祐之靈􅀺庶無疆之福窮河際海聲敎所霑儻曰有心率知相慶况臣職叨近著位備列藩竊聆嘉憙奚勝踊躍官守有繫阻造闕廷賀章獻章懿皇后祔廟表爲滑州張龍圖作臣某言伏承今月九日章獻明肅皇后章懿皇后並升祔真宗皇帝廟室禮畢者聖心追逺思慕慈親陟配禰宮順成大禮臣某中賀伏以章獻明肅皇后輔佐先朝敷明隂教導􅀭末命鎭綏大業章懿皇后淑慎在躬受天元祉茂育聖神光啓丕祚而猶分祀閟宫未登太室尊號皇帝陛下濬發孝思㳂情著制采開元之令典講國家之故事涓選嘉辰咸􅂛配侑述祖宗之志成母后之尊允所謂道隆列辟法垂後丗禮行於宗廟孝通乎神明日月所臨霜露所墜抃手蹈足小大同之况臣任居藩垣職參臺閣欣豫之志倍億等夷官守所居不獲奔詣闕廷稱慶進古文孝經指解表臣光言臣聞聖人之德莫加於孝猶江河之有源草木之有本源逺則流大本固則葉繁是以由古及今臣畜四海未有孝不先隆而能宣昭功化者也臣某誠惶誠恐頓首頓首伏惟尊號皇帝陛下純孝之性發於自然動静云爲必咨訓典起居出入不忘先烈以爲滁州者太祖皇帝所以禽馘姦桀肇開王跡并州者太宗皇帝所以芟夷僣亂混壹九圍澶州者真宗皇帝所以攘却貪殘億寧華夏皆大勲懿業威霊所存遂命有司分建原廟圖繢聖容躬題扁榜嚴奉之禮備盡恭勤羽衞供帳率從豐衍兹有以見陛下尊顯祖宗之意無不至矣經曰愛恭盡於事親而德教加於百姓刑于四海夫以陛下天授之資愛恭之志而又念夫百官者祖宗之百官不可以私非其人府庫者祖宗之府庫不可以賞非其功法令者祖宗之法令不可以罰非其罪慎之重之益自儆戒如是日月基緒之固巍如泰山􅀺民乂安四夷懷服草木禽魚靡不茂豫此誠孝德之極致也臣愚幸得􅀘文館之缺以經史爲職􅀼覩秘閣所藏古文孝經先秦舊書傳注遺逸􅀌學堙微不絶如綫是敢不自揆量妄以所聞爲之指解雖才識􅄶淺無能發明庶幾因聖人之言得少􅀜省覽則糞土之臣榮願足矣其古文孝經指解一卷謹隨表奉進以聞臣光誠惶誠恐頓首頓首謹言年月日具位臣司馬光上表進通志表臣光言臣聞治亂之原古今同體載在方􅁽不可不思臣光誠惶誠恐頓首頓首臣少好史學病其煩冗常欲刪取其要爲編年一書力薄道悠乆而未就今兹伏遇皇帝陛下丕承基緒留意藝文開延儒臣講求古訓臣有先所述通志八卷起周威烈王二十三年盡秦二丗三年史記之外參以它書於七國興亡之迹大略可見文理迃䟽無足觀采不敢自匿謹繕冩隨表上進干冒宸嚴臣無任戰汗屏營之至臣光誠惶誠恐頓首頓首謹言謝賜資治通鑑序表臣光言今月九日伏蒙聖恩令臣讀所修資治通鑑仍面賜御製御書序一篇者臣性識駑鈍學問空淺偶自㓜齡粗渉群史甞欲芟去蕪雜發輝精雋窮探治亂之迹上助聖明之鑒功大力薄任重道悠徒懷寸心行將白首伏遇先皇帝若稽古道􅀶采徽言俾摭舊聞遂伸微志尚方帋墨分於奏御之餘内閣圗書從其假借之便未遑汗簡巳泣遺弓陛下祗服駿命丕承前烈臣以屬藁有緒不可不成受詔所爲不敢不上詮次無法抵捂實多仰汚覽觀伏須罪戾豈謂陛下赦其狂簡賞其專勤思所以旌異於它書焜燿於群下特發殊恩不用常例屬當勸講之始俾參經史之末迨此清間命之進讀而又序其夲原冠於篇秩發言爲典肆筆成書炳蔚􅀇變如虎豹之明灝噩無涯逾啇周之盛况復褒貶是非古人有所未至造端立意愚臣不能自言陛下一賜指陳渙然氷釋至於􅀶而得其要簡而周於事典刑之緫㑹􅁽牘之淵林臣實何人克堪斯語若乃嘉文宣以作則援正􅀚而爲師兹實生民之福豈伊微臣之幸臣某誠感誠抃頓首頓首􅀼以周之南董漢之遷固皆推髙一時播美千載未有親屈帝文特紆宸翰曲蒙􅅄飾大振輝光如臣樸􅈪小才固非先賢之比便蕃茂澤獨專後丗之榮退自揣循殆無容措遂使螢燐末照依日月以永存草木常名附天地而不朽臣不任懇欵之至謹奉表陳謝以聞臣光誠感誠抃頓首頓首謹言年月日具位臣光上表謝􅅄諭勑書并帶馬表臣光言伏蒙聖恩以二股河北流巳閉断降勑書􅅄諭仍賜衣一對金帶一條鞍轡馬一疋者聖言優渥寵錫便蕃顧循無勞何以堪稱臣光誠感誠愧頓首頓首竊以去秋積雨河決􅀥強朝廷憂勞憫兹昏蟄臣祗奏明詔相視所冝詢采衆言聞逹天聽捨短收長率由聖志處決利害昭晣如神今流􅀔東所徑趨渤碣恩冀西北公私安堵斯皆上帝儲休明主獨断勞心建䇿則有當官之人勤力奏功則有執役之士臣進無運籌之智退無負薪之勤曽何施爲膺兹貺賚辤之則渉於僞慢受之則寔爲尸素有􅌤面目無地自容臣性雖頑愚靈於草木蒙􅀍天施敢忘報効唯期竭忠庶禆萬一臣光誠感誠愧頓首頓首謹言永興謝上表臣光言昨奉敕差充永興軍一路兵馬都緫管安撫使兼知永興軍府事已於今月十四日到任訖荷恩至重任責􅀹深巡撫吏民敷宣詔令臣光誠感誠懼蝢首頓首臣識慮闇淺規爲闊踈唯知愚忠屢貢狂直奉事三世操守一心間以齒髮浸衰疾疹交集曽靡論思之効乆汚侍從之班旣無􅀘於夲朝祈自安於散地不圗睿澤更委名都雖要重之權自知不稱而煩劇之地難以固辤受命以還措躬無所朅來就道甫尔到官維此咸秦昔爲畿甸山川秀美土地膏􅃾論其平時誠爲樂土在於今日滴值凶年經夏亢陽苗青乾而不秀渉秋􅁋雨穗腐黒而無􅀵􅅒食一空家之蓋藏之粟襁􅀒相屬道有流離之人老弱懷溝壑之憂姦猾蓄􅍉蒲之志正冝安靜不可動揺譬諸烹魚勿煩擾則免於糜爛如彼種木任生殖則自然蕃滋謹當䇿勵疲駑彫磨朽鈍智力所及勤瘁無辤雖復失位危身終不病民􅀒國庶幾小􅀘用荅大恩臣無任戴天荷聖激切屏營之至謹奉奏謝以聞臣光誠感誠懼頓首頓首謹言遺表元豐五年秋吾言語澁疑爲中風之候􅂲朝夕疾作猝然不救乃豫作遺表自書之常置卧内俟且死以授范堯夫范夢得使上之八年三月五日宫車晏駕此表無用留以示子孫欲使知吾事君區區之心耳臣光言臣丗受國恩常思􅀘報伹以性識愚戇不合聖心是以比年以來屏居杜口不敢復言今衰疾日侵將填溝壑敢以平生忠懇一逹天聦庶幾陛下知臣無求於朝廷而未甞忘國家也臣光誠哀誠切頓首頓首伏惟皇帝陛下天縱睿哲燭物精敏踐阼以來銳志求治圗任竒傑恢張洪業得王安石委而信之不復疑貳聽其言從其計人有沮毀之者責而逐之雖周成王之信周公齊御名公之任管仲燕昭王之􅀝樂毅蜀先主之託諸􅁑亮殆無以及斯乃不丗出之英主曠千載而難逢者也不幸所委不得其人安石旣愚且愎不知擇祖宗之令典合天下之嘉謀以啓迪聦明佐佑丕烈乃足己自是謂古今之人皆莫己如有人與之同則喜與之異則怒喜則數年之間援引登青雲怒則黜逐擯弃終身沉草萊凡人之情誰不喜冨貴而畏刑禍於是忠直逺屏姦䛕競進爲之腹心羽翼以干禄徼利遂使中外權要之任非其黨与不得處也深疾諌者過於仇讎嚴禁誹謗甚於盗賊然後逞其胷臆變亂舊章興害除利捨是取非其尤病民傷國者略舉四條其一曰青苗錢分命使者誘以重賞強散息錢朘民求利取新償舊􅀒債􅀊多官守空簿實無所獲貨重物䡖公私两困其二曰免役錢縱冨強應役之人使家居自逸征貧弱不役之户使流離轉死凡農家所有不過榖帛与力自古賦役無出三者今皆不取專責以錢錢非私家所鑄要須貿易外求豐歳榖賤巳自傷農又迫於期限不得半價盡糶所收未能充数家之糇糧不暇更留若值凶年則又無榖可糶人人賣田無往可售遂至殺牛賣􅁏伐桑鬻薪来年生計安敢復議用此雇浮浪之人以供百役使緩則爲姦急則逃竄處事若此豈非倒置其三曰保甲自唐募長征之兵賦農民榖帛以給其衣糧農固巳困矣今榖帛稅如故又使捨耕桑事戰陣一身二任民何以堪又罷巡檢兵士及尉司弓手皆易以保甲半月一代彼畎畒之民尚未能操弓挾矢已復代去用此擒盗不亦難乎夫奪其衣食使無以爲生是驅民爲盗也使比屋習戰勸以官賞是教民爲盗也又撤去捕盗之人是縱民爲盗也謀國如此果爲利乎四曰市易遣吏坐列販賣与細民爭利下至菜果油􅋗駔儈所得皆攉而奪之使道路怨嗟逺近羞􅀏啇旅不行酒稅虧損奪彼与此得少失多又稱貸於民恣其所取使無頼子弟得醉飽之資在家父兄受督責之苦傾貲破産什有五六凡此四者皆逆人情違物理天下非之莫之肯從安石乃以峻法驅之彼十惡盗賊累更赦令猶得寛除獨違新法者不以赦降去官原免是其所犯重於十惡盗賊也安石苟欲遂其狠心無顧治體此其厲階至今爲梗也又有姦詐之臣如种諤薛向王韶李憲王中正之徒行險徼幸懷諼罔上輕動干戈妄擾蠻夷夫兵者國之大事廢興存亡於是乎在而諤等苟營一身之官賞不顧百姓之死亡國家之利病輕慮淺謀發於造次深入自潰僅同兒戯使兵夫數十萬􅁀骸於曠野資仗巨億弃􅂢於異域昔王恢爲馬邑之謀單于􅁴之遁去時漢軍無所失亡但無功耳武帝猶以爲不誅恢無以謝天下今潰敗亡失狼藉如此而建議行師之人晏然曽無愧畏或更蒙寵任竊見國家至仁重惜人命諸州論囚有法應流而誤入死者舉州官吏皆坐停廢柰何使數十萬人無罪就死反無所坐乎此所以使狂躁貪冒之人競爲常試之說而無所懲艾者也若舉事屢如此其於國家豈不可憂乎臣聞堂上不則郊草不贍曠耘是以古聖王之治天下必先内而後外安近以服逺故書曰帝乃誕敷文徳七旬有苗格詩云王猷允塞徐方旣來下至齊淵聖御名晉文亦先冨教其民然後用之陛下何不視今曰朝廷之政治何如群臣之智能何如百姓之冨樂何如士卒之精銳何如乃遽從事於四夷也臣所惜者以陛下之聖明不師虞舜周宣之德反慕秦皇漢武之所爲借使能踰葱嶺絶大漠鏖臯蘭焚龍庭又何足貴哉自古人主喜於用兵疲弊百姓致内盗蠭起或外冦窺覦者多矣申屠剛曰未至豫言固常爲虚及其巳至又無所及必若待四方糜沸如秦漢隋唐之季然後悔之固巳晚矣夫諌爭之臣人主之耳目也安可一日無之書曰若跣弗視地厥足用傷設有人閉目塞耳跣而疾趨前遇險阻安有不顛躓者哉臣竊見十年以来天下以言爲諱大臣偷安於禄位小臣苟免於罪戾閭閻之民憔悴困窮無所控告宗廟社稷危於累􅆑可爲寒心人無賢愚貴賤莫不知之而訖無一人敢發口言者陛下深居九重徒日聞䛕臣之言以爲天下家給人足太平之功十已八九成矣臣是以不勝憤懑爲陛下忍死言之庶幾陛下覽其垂盡之辭察其碩忠之志廓然發日月之明毅然􅁬乾剛之断悔旣往之失收將来之福登進忠直黜逺佞邪審黄髮之可任寤諞言之難信罷苗役廢保甲以寛農民除市易絶稱貸以惠工啇斥退聚歛之臣褒􅂋循良之吏禁約邊將不使貪功而危國制抑近習不使握兵而北亂除苛察之法以隆易簡之政變刻薄之俗以復敦樸之化使衆庶安農桑士卒保首領宗社永安傳祚無窮則臣没勝於存死榮於生瞑目九泉無所復恨矣臣不勝瞻天戀聖之至謹手書遺表以聞臣光誠哀誠切頓首頓首謹言年月日端明殿學士兼翰林侍讀學士太中大夫臣司馬光上表賀立皇太子表臣光言伏覩今月三日制書節文皇子延安郡王傭可立爲皇太子仍賜名煦者主噐惟長立􅀖家之基錫命以時爲社稷之福臣光中謝竊以天意與子人情愛親三王以來百丗不易伏惟皇帝陛下光紹前烈濬發逺猷仰尊宗廟之嚴俯眷蒸民之重寵建上嗣誕告多方离日昭布於重光震雷何啻於百里封略之内聲教所覃凡有識知孰不皷舞况臣叨居近列夙受大恩喜聞徽音逺踰庶品無任踊躍之至謹奉表陳賀以聞謝起居減拜表臣光言伏惟閤門告報今月十四日内降以臣與吕公著近各推恩轉官所有將來正謝特令兩拜起居餘免舞蹈仍於執政官班次後别作一班及自今後凡遇前殿應干大起居特令别作一班止兩拜起居恩出非常禮加異數優假太過慙􅀒愈深臣光誠感誠懼頓首頓首臣猥以􅃈才預聞機政去春以後疾疹屢生入冬以來飲食漸少迨兹􅀊序之首頓覺筋力之衰拜起絶艱朝請殆廢内惟恩紀之重天地所不能踰退思績効之微􅁝毫未甞有立欲避位則爲罪益大欲就列則強力不前朝夕爲衆目所􅀚啓處無措躬之地敢謂皇帝陛下太皇太后陛下仁霑枯朽明燭幽微特虧著定之儀曲遂形骸之便臣詢諸故老或謂有舊章然彼皆位躋宰輔之崇徳著耆明之美豈臣么麽所敢比方欲辭則寶所不支欲受則自知非分蹴踖心悸戰兢汗流惟仰頼於寵靈冀有瘳於藥物病庶遄巳禮得如􅀄期於竭忠不敢愛死謹奉表稱謝以聞臣誠感誠懼頓首頓首謹言温國文正公文集卷第五十七
