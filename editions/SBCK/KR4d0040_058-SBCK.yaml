body:
  text: 書啓一上許州呉給事書荅胙城郭太丞書與薛子立秀才書上龐副樞論貝州事冝書謝校勘啓授校勘謝龐叅政啓謝檢討啓上宋侍讀書回狀元第二第三先軰啓荅薜號州謝石硯屏書荅謝公儀啓荅聞喜馬寺丞中庸書與范景仁書與李子儀書别劉孝叔􅄂端手啓時謫知江州名述與范堯夫經略龍圖書第二書上許州呉給事書月日具官光謹再拜獻書某官執事光昔者未冠爲書生從師友間得執事所對直言䇿及後䇿􅀚之喟然嘆曰道之不明乆矣蔽於古者迂大而不可從溺於今者淺薄而不足用今執事論髙而不悖於今議實而不戻於古所譏切皆當丗之病所區畫皆應事之冝粲然虞夏商周之道可以覆手而取舉足而登也非夫深明於道之夲其孰克以致此哉由是私自誓曰異日儻得出入門下承事之間以受一言之教使皦然睹道之正渙然識道之歸事君行己知所取捨而無所疑則私願足矣及舉進士幸免黜去始敢進謁朝之公卿大夫當是時蓄才德􅀒名聲出入帝廷榮耀輝赫照人者衆矣光皆未及往見首求執事之門而叩之誠欲急於學術之明而成􅀫昔之志也并褏其所爲文以爲始見之贄執事不責其僣而辱賜之詩以振飾之且曰道爲根抵言爲華由來表裏相經緯光由是益知君子務知大者逺者則光願受學之志愈固而專矣不幸光獻文之明日西出之官自是巳來非奔走吏道則在苫􅒘衰絰之中矣東西南北﨑嶇􅇄坎過闕門上逆旅㸑未及燃巳復出外矣是以役役十年而不得卒業也去年罷滑臺從事至京師則執事旣爲天子輔弼臣矣光賤士也其敢不自分限而屢以其不肖之跡汙辱門下之塵稱道舊恩以求瞻望几杖哉必若是而爲天下之人謂之不營禄位而爲道則難矣光是以屏身退處不敢屢進以煩將命非爲輙自踈外誠懼不知者不能察其區區而有塵累於至公也今聖主以許田股肱大郡屈煩執事蹔鎮治之光然後敢復叙昔日之知而求畢其戇愚之志夫肝鬲之所崇聚而欲杼展於左右者固不可立談而盡也是敢復繕綴近所爲文凡五卷而薦之非敢以爲文也貴露下情而巳伏惟亮其狂簡之誅而矝其自幼及長企仰之意副其所以來求考正道義之誠則􅃿齒銜戴盛德永永爲執鞭秉轡門下之士矣不宣光惶懼再拜荅胙城郭太丞書光頓首再拜􅀼以前丗郡縣以来朝廷唯置太守都尉令長自他􅁺屬皆官長所自辟除供趨走治文書而已今幕府吏猶古之􅁺屬也職至輕位至微獨命於朝廷差異耳執事以老成之德任百里之重官爲三丞著籍於朝雖大君子卑遜不以自重然考之古視之今其事任位序不輕章矣而歳時月朔必以賀牘爲賜詞恭禮備若小邑長之事牧伯然此豈光之所能堪哉是以日夜鞠躬重足継爲書啓布之左右乞停此儀以安反側而執事好謙之志確然愈固雖於盛德益有光美將使無似之軀於何自置殆非所以相全愛之道也廼者韋城張祕丞亦然光具此意因書請焉韋城悟其不可幸賜惠許獨執事未炤愚􅅃祈請喋喋不垂允納每得一紙流汗霑足光聞君子與人恭而有禮固不若此也今不敢避煩再薦言庶幾髙明垂意察古今之體酌重輕之冝凡此過禮率從翦削時有惠訓手筆往来使得㤗然自安無􅀒踧踖幸之大者不宣光頓首再拜與薛子立秀才書頓首前日承不賜棄外辱以所爲文示之使得􅀼觀甫盡數篇不覺喟然置之而嘆噫士之讀書者豈專爲禄利而巳哉求得位而行其道以利斯民也國家所以求士者豈徒用印綬粟帛冨寵其人哉亦欲得其道以利民也故上之所以求下下之所以求上皆非顧其私主於民而巳矣近丗爲士者頗謬於古往往以讀書爲資身之貨耳彼又惡知所謂利民者邪顧足下之文上以薦之於宰輔下以貽之令長求盗之吏未甞不以民爲先皆閭里素所疾苦而上不獲知者深切著白使其人果舉而行之則足下雖未得位而澤固施於民矣且夫身爲布衣巳能孳孳念民若此况得位邪光􅀼有以知異日卓然爲名臣使所至之方蒙􅀍其福者非足下而誰此真古人之志也朝廷得之亦異於􅗴刻經史潤飾文采以自售施之於政而不逹者矣光是用矍然喜於今之丗而復見古之士且竦首傾耳以俟朝廷之得人而賀之也其文編不敢乆留謹奉而歸之晨起使者至門立欲返報怱怱不宣光再拜上龐副樞論貝州事冝書云云孔子曰不在其位不謀其政國有大事廟堂之上謀議素熟方略已定而復以踈賤之人狂愚之議奸與其間罪之大者也然光聞之受恩而不知報者犬彘也光雖不才獨忍爲犬彘之行忘盛德而無所裨益哉是以夙夜思之苟有以報萬分者雖䧟入大辠不敢愛也竊聞貝州軍士恩過而驕厭其久生辠求速死雖狂戇妄爲埶無所至蚤晚之間終就屠㓕若兵乆不決難乆不解萬一城中之冦未即伏誅而它變旁起不逞之人同惡相濟乗釁而動則爲朝廷之憂方此始耳此不得不爲之過慮也雖國家恩德在民淪於骨髓根深柢固萬無所慮然王者舉事固當計萬全之埶然後行之者也不則狂賊自知辠惡無狀降首亡繇獨守窮城埶不支乆則擁其徒衆盗取庫兵収載寳賄豨突而出建旗鳴鼔攻剽城邑以數千之盗散之趙魏之郊東連青徐亦足以爲齊民之患未可以旬月擒也以光之愚竊謂城中之衆未必皆有怨叛之志其造計首惡者不過數人自餘皆迫於兇威不得已而從之者也其望大軍之至赦令之降若墜塗炭者之待救紡於樹者之求解也朝廷誠以此時發近郡之兵塹環其郛勿攻勿戰使不得出而巳又隂以重賞募人入城焚其積聚壞其所恃使逃無所出守無所資然後命重臣素仁厚爲士卒所信愛者奉明詔以臨之諭以脅從之人有能捕斬首惡若唱先出降者待以不次之賞其始雖與謀而能翻然悔過從善者亦除其辠待以不死或爲惡不變敢拒官軍者戮及妻子無有所赦如是不過旬月逆卒之首必函致於闕下矣此坐支解狂賊之術也往年保州之役威罰實行今爲惡者必誑誘其徒曰汝罪巳大出城必誅保州近事足以爲戒自非賞至厚信至明則不足以破散其謀冝得先降者厚賞賜之超資越序拜以官爵錦衣駿馬徇於城下使足歆慕以焜燿其餘彼雖甚愚國家昭昭然設貴爵重賞於前峻刑嚴誅於後示以大信皦如日月安有不動心者哉書曰除惡務夲周頌曰鋪時繹思我徂維求定明聖王之誅不在快意多殺要欲布陳條理期於安而巳今誠貫其脅從之辜開以自新之塗縱未即日殄滅使其内自相猜肘腋之變紛紛數起支節散落腹心潰敗渠魁之首可指日而烹也然後分别白黒表章善惡取倡爲亂者種族誅之餘皆勿問亦足以立威而示懷矣討不失辠賞不失功士卒無傷甲兵不頓財榖不費盗賊不滋􅀼以爲最䇿之得者也或者必欲以兵力取之賊慿堅城執利兵據倉庫比其授首則河朔之力固巳困矣况加以不虞之變哉夫炎炎不絶熖熖柰何當事之微治之易耳時至不爲禍如發機今狂賊日夜喣嫗其黨出庫物奪民財以㗖之又恐喝以國家之威刑沮抑其嚮善之意不乗其衆心危疑未定之際壞敗其謀巳而日寖乆辠寖深朝廷無寛貸之令凶黨有㵕毒之威朝薫暮蒸衆志巳固然後圗則招之不來攻之不克用力百倍而功不可必也故不愛官爵金帛之重賞以壞其黨今其時也過是無益矣朝廷之議髙深幽宻今日處置爲攻爲戰爲赦爲誅非艸茅之所能知也萬一議者有欲用兵碎而不以計破者此乃愚誠區區願陳所見者也詩云先民有言詢于芻蕘夫以周公之才於天下事冝無所不知而日孜孜禮白屋之士求善言詢政治者誠欲盡衆人之思慮執事爲天子腹心之臣典樞機之任凡百籌畫得失之數必巳決於􅎍中矣而某不識分限復妄有云者誠貪於報㤙而忘其愚僣之辠也伏計執事法周公之道亦不厭芻蕘之言以􅀶觀焉謝校勘啓蒙恩充前件職者伏以聖哲之道悉載於書書之散訛道亦鬰滯是以國家開圗籍之府設校讎之官必求秀偉絶特之人使之執事誠以道爲重也光天與之分甚魯且愚徒以丗家相承習尚儒素故自免去襁褓初知語言父兄提擕授以經籍是以不執餘技而逢衣自名曽未能遊聖人之藩籬嚌六藝之糟粕遽用門䕃列於王官始舉郷舉徑叨上第常竊自恨道未至而受禄學未優而治民雖媮獲於一時終不足爲成人也巳而天降之旤服衰五年指景數刻幾無生望洎免䘮爲吏從事藩方則牒訢文移所居委塞是以舊學葢廢翦爲荆榛私心悵然毎用嘆邑不自意得承乏東序息肩薄領乃始脩勵錢鎛誅治荒􅁾庻幾克徇􅀫昔之志雖失之春芸猶得之秋獲足爲愈焉敢謂朝之輔臣不察駑朽遽列其名薦之法座上方􅀝信大臣議無不用遂發中詔引登書府使之欵朱闕蹈􅂵臺倐去蓬蒿頡頏霄漢榮耀過分不寒而栗夙夜循念罔知所來此蓋伏遇某官内竭忠力以勤王家外隆寛􅁉以延士􅀋各適其噐不遺衆才顧眄所加人増大吕之重議論所與丗劇衮章之榮俾兹妄庸濫􅀗甄采敢不益自勤敕無違率履勉服故業期於有成庶幾不辱寵靈無􅀒知鑒過此以往未知所裁授校勘謝龐參政啓蒙恩充前件職者伏以朋友道缺爲日乆矣陵夷至于近丗益以衰薄甚者旦爲好言暮而反之况於存􅃿之異貴賤之絶苟能言其姓名識其遊處斯可頌矣矧又収撫其􅀌誘掖成就使之自􅆑而翼去幽而光天下幾何人哉光質性愚陋動無可稱學古著文皆不逮衆徒以先人疇昔甞託僚寀獲友髙明道同志合出處如一分義之美近古所希光以童子獲執几杖侍見於前執事撫髫誨道俾之就學以至冒􅀼科級叨塵禄位始終之賜皆有自焉及夫上天降災旤罰崇大屏伏田里號咷待盡執事賜書吊撫俾能自存又譔著遺烈表之楸柏使其後祀焜燿無窮凡兹大恩固已無量矣而又以光樸懦自守謂其寡過毎賜祓飾多踰其實光或聞之流汗􅀍顙常懼不能堪副以累知言曁衰麻外除復從吏􅃥執事以文武才實入賛樞極薦士之奏首列光名事雖報聞勤惻愈甚間二歳進參大政則又復前奏出之扆前上方推信大臣議無不用亟命近署試其所能藝術素踈果􅁀嗤鄙方自踧踖以湏譴絀不意天恩曲成引内祕府遽使頡頑禁闥依光紫霄校讎群書參奉遊豫豈光空薄所能堪稱承命震駭征營失據靜自循度罔知所來此非先人之餘休被及後昆執事之敦篤不遺故舊糠粃小生何階自致銜恩念親涕泗横集夫以執事之忠亮純明豈其私一不肖之人使汙衊文館羞士大夫蓋將驅一丗之人使媮者日敦薄者日醇誠有以賛天子之大化非獨苟然而巳乃知大君子之舉事用志逺矣光敢不夙夜刻勵寤寐訓辭進益所長攻去所短苟使不忝前人之教訓羞知己之偁論以􅀒明詔之収擢而巳過此巳往不知所爲謝檢討啓蒙恩充前件職者仰戴寵靈俯循涯分任非才稱􅁨與愧并􅀼以帝王垂憲於典墳文武布政於方􅁽參天球赤刀之寳閟石室金匱之嚴豈繄記述之良抑亦討論之美自微貫穿前載浹洽舊聞稽古侔􅀝相之才叙事識子長之體則何以懋明得失考合異同訪逸事於名山求緒言於故老使聖哲丕績弊天壤而無窮俊乂隆名炳丹青而不朽原立官之甚重冝擇士以恪居豈容冒塵坐致隳曠如光者行能􅄶淺器質迂踈徒以儒術承家蚤用門資署吏甫任典謁巳辱聞詩愚者常專雖慕攻堅之業勤而無獲正如毁瓦之爲猥玷士科始陪賔幕􅃮雕之道未信尹何之傷實多旋屬家艱零丁苫􅒘比還官次汨􅃿道􅂗辭鋒頓而不修學殖落而亡幾分從塵役絶覬榮階俄承乏於瞽宗遂參華於天禄慶霄清晏蓬渚䆳嚴縑素牣盈率多未見英豪坌集叨與並逰顧鎻陋之無庸毎怔忪而自失所虞􅀭汰敢冀甄収何期佑弼之司誤辱褒稱之奏俾登史觀賛治信書緝記言記動之殊辨所見所聞之實詳明其故紬繹厭文竊惟累洽之辰方咏衆賢之冨弗圖嘉命遽及窳才靖究所來孰云無自此蓋伏遇某官􅅄延後進汲引下僚采其毫髮之長振以齒牙之論使不售之馬立享千金之酬無用之材或充萬乗之噐敢不劬勞從事恪慎處躬冀少荅於生成庻無慙於知遇過此以往未知所裁上宋侍讀書昔燕王有馬干里而天下無敢獻馬於燕者爲其皆不能及廏中之良也趙王有璧徑尺而天下無敢賈玉於趙者謂其皆不能及櫝中之羙也彼以物求售者誠然以道求售者則異矣請以周公言之夫周公之徳羙才智天下固無庻幾望其藩籬者然周公沐則捉髮飱則􅄍哺汲汲焉走迎天下之士惟恐一人伏於蓬萊之下者是以鍾石筦絃之音歌舞其德于今未衰曏者儻以己之才德求諸佗人則外踰四海舟車所極終無一人可収采者又安有曄曄光羙施於千載邪降及後丗賢公卿大夫未有不祖述此道而能具羙者也伏惟執事體純明以立質積學問以廣德自結聖主優游禁闥四表仰聲而響集群士希光而景附眄睞所被温於春陽咳唾所沾重於珪璧誠薦紳之表的後進之衡鑑也光才朽行僻學踈丈陋群居士林無與比數而不自屏絀妄以其技進於左右是猶獻馬於燕賈玉於趙也執事儻以二國之意遇之則光冝驅呵擯逐不得少留於門下矣以周公之道接之則光必得從七十子之後而俟見焉竊以古者見於公卿大夫必有贄今其禮亡乆矣士非文無用爲贄者是敢不自􅀮其嗤鄙雜録舊所爲文凡五卷執之立於屏外以待進退之命焉回狀元第二第三先軰啓伏蒙某官不以光之愚庸散賤親枉車􅀐辱臨其門前之以啓以將盛意恐􅋺愧懅於兹未息竊以取士之詳進賢之速視古以來冝無若今者今天下之士舉於其州用不能退者十常七八然後升之禮部禮部又如之然後升之天子之庭天子臨軒親覆之又有退者然後解其布衣而禄之如此可不謂之取士之詳歟然其以魁傑秀異在殊級者其視朝廷美官若寓物禇中不十年畢取之大抵皆至公卿如此可不謂之進賢之速歟取如是詳而能獨爲群士之先則其才可知巳進如是速而能不自隆貴以禮於愚庸散賤之人則其德可知巳才與德二者議士之所先也而皆有以過絶於人光是用不敢私賀於左右而賀於朝廷賀於衆庶知其將得賢公卿而有所瞻頼也荅薛號州謝石硯屏書光再拜啓積日前令嗣先輩訪逮出手筆并石月屏爲貺捧玩不勝愧喜比来数於都下朋從處見此屏􅀚其天質圎瑩非刻非繪如秋髙氣清逈然在望信乎天地之異氣山澤之殊寳也素心恱之無從可得豈以一旦不煩懇請坐致握中性夲踈野雅叶所欲雖受文錦十純白壁百􅀟在光之愚未爲重賜謹當縢閟箱笈不忘惠好耳􅂔序癉暑信後伏想休勝俗故怱怱乆不遑修謝􅀹増悚懼先軰注官甚便想加慰喜未期接侍倍希珍厚不宣光再拜上啓荅謝公儀啓光之得游於書府也爲日寡竊甞側聞先逹長者之言曰昔之初有職業於兹者不以位之崇卑名之􅂋晦皆摯啓以造於僚友之門誾誾焉與見於公卿貴人之禮均若是者非佗盖以凡居此官夲以禮義相先非以名位相髙也兹道之替乆矣光不及見焉常拊髀私嘆自恨生之後而進之晚不得目前人盛事又傷身之賤而名之晦不能率先士夫以振起之也不意今者某官以英偉之才􅀒天下燁燁之望始以鴻漸之翼翔集兹地獨能力探故實勤而行之雖光之愚陋輕微不足齒於僚列者皆親枉車􅀐懷啓䄂謁臨其蓬蓽一無所遺光始愧中疑终而釋然知兹禮之來非光之爲而爲臺閣之羙不可使遂委草莽而沉絶不継也伏以某官始者遊太學則冠諸生登王庭則先俊選貴名之白若列宿之羅清旻疾風之走四海凡一事一爲皆天下之所仰而趨慕而歸者也若使出於媮則後來之士無自入於敦出於敦則後來之士無自入於媮况始仕於朝天下方拭目而觀之清耳而聽之乃獨不出於媮而出於敦是則及物之利繇此其始矣光是以爲天下士大夫賀而不敢以見禮私自榮也荅聞喜馬寺丞中庸書月日光頓首再拜明府寺丞閤下光頃日雖得邂逅奉望顔色然殊未暇陪從容杼悃􅅃也今者猥蒙記存逺賜之書仍以新與邑中賢士大夫治孔子祠命爲之記何采聽之過而責望之重也且愧且恐若無所容光資性頑蔽辭藝鄙薄平居爲朝夕近用之文猶多乖僻取人嗤傲况於語先聖之道載賢令之功鐫之金石傳之將來是猶執尫人而􅀒之以千鈞之重雖欲自託於顯茂之業而貪不朽之榮獨不輕先聖而累明府羞邑中之賢士大夫乎此誠非光之所敢任也伏惟寛明當賜開察改求酣鬯於道而冨有於文者使爲之則冝與大名昭昭千古不窮矣若光􅀋者正可相與誦咏而巳不宣司馬光頓首再拜與范景仁書月日司馬光謹再拜獻書景仁足下詩云先民有言詢于芻蕘言人君不以鄙賤廢善言也又云心乎愛矣遐不謂矣言人臣不以踈逺忘忠愛也又云彼姝者子何以予之言賢者在位下樂告以善道也又云何以恤我我其収之言賢者得忠信之言無不受也光實何人明主以爲臣景仁以爲友明主方側身求諌而景仁以言事爲官光又可以嘿而已乎光聞古者士傳言諌蓋以士賤不能自通於君故因資卿大夫以傳之光曏者不知其賤且愚􅂺以宗廟社稷深逺之計冒聞朝廷誠知位卑而言髙智小而謀大觸罪皆死然死者人之所必不免也若忠於國家而死死之榮也是以剖肝􅄋膽手書緘封而進之庻幾得逹法㘴之前明主或加聽采自以聖意建萬丗不拔之基則光退就鼎鑊如蒙黼黻此光之夲心也無何自夏及秋囊書三上皆杳然若投沙礫於滄海之中莫有知其所之者夫以即日明主求諌之切詔書爛然頒於天下而光所言又非鎻鎻不急之務若幸而得閞聖聽則光所言是邪當采而行之非邪當明治其罪豈有直加棄置曽不誰何此必所言渉千里之逺歴九閽之深或棄或􅔪而不得上通也古之人有奏䟽而焚藁者蓋爲言巳施行不可掠君之羙以爲己功也若奏而不通又自焚其藁則与不言何異哉光是用中夜起坐涕泣霑衿竊惟當今朝廷諌爭之臣忠於國家敢言大事而又周旋日乆知光素心者惟景仁而巳某之言不因景仁以自通尚誰望哉且景仁爲天子耳目之臣得光之言傳於明主天下固莫得而窺也光是敢􅂺取所上奏藁獻於左右伏冀景仁察其所陳果能中於義理合於當今之務則願因進見之際爲明主開陳兹事之大所當汲汲留意不當因循簡忽以忘祖宗光羙之業及乞取光所上三奏略賜省覧知其可取可捨可矜可罪裁定其一而明賜之無使􅀌逺之臣徒懷憤嘿嘿而無所告語也昔樊噲諌漢髙祖留止奉宫奉春君請徙都長安始皆未聽得留侯言即日從之蓋人主素所信重入其言易故也今其官於千里之外爲邊州下吏景仁朝夕出入紫闥登降丹陛天下之責治亂安危者不在於光皆在景仁光雖言之終不能有益於國家止於是而巳矣若夫懇惻復熟以感寤明主成聖丗無疆之休則在景仁留意而巳如是實天下之幸非獨光之幸也不宣光惶恐再拜與季子儀書光再拜昨日值客至不克盡談宿夕思之終未能逹子儀髙遠之慮故輙復布其愚悃以聞左右未審果肯省眎否凡足下今所欲爲義邪利邪將不勝其忿苟爲詆訐以快志邪此三者皆未見其可也足下雖自信其心不爲利動然天下之人烏可戸暁萬一􅀍渉此謗於何湔洗是棄千金之璧而得腐䑕也雖一日十官豈足羡哉光辱與足下遊最乆􅀼􅀚士大夫間才行具羙如足下者能有幾人所以孳孳深更重惜不欲使有毫末之議加於全德事苟上聞不可復掩朋友雖欲從而辭之亦無及巳足下何不試察光心所以區區不避譴怒竭忠相告者亦何所利哉正爲賢者惜舉措而巳别劉孝叔雜端手啓光再拜前日暫得詣别悵戀何可勝言比􅀫起居何如舟艦具未解維果在何時恭惟道勝名立餘無可貴外物土芥固不足以滑和唯冀親近藥物益自愛重區區所禱不宣光再拜與范堯夫經略龍圖書光啓昨在洛中及至京師兩於河中遞次得所賜書值光治裝赴陳州又得旨詣闕尋又忝左省之命怱怱事多乆不修報明恕必察其非踈懈也曏承就移慶帥旣踐丗官復修舊治計堯夫必樂然就職然士論所鬱鬱者猶多也光今日忝竊皆由堯夫素加誨誘重以推挽其感戢固不在言今􅀊大暑異常邊地必稍愈觸熱飲冷更祈節慎不宣光再拜第二書光愚拙有素見事常若不敏不擇人而盡言此才性之蔽光所自知也加之閑居十五年夲欲更求一任散官守候七十即如禮致事乆絶榮進之心分當委順田里凡朝廷之事未甞挂慮况數年以來昏忘特甚誠不意一旦冒居此地蒙人主知待之厚特異於常義難力辭黽勉就職故事多所遺忘新法固皆面牆朝中士大夫百人中所識不過三四如一黄葉在烈風中幾何其不危墜也又爲丗俗妄􅀍以虚名不知其中實無所有上下責望不輕如何應副得及荷堯夫知待固非一日望深賜教督以所不及聞其短拙隨時示諭勿復形迹此獨敢望於堯夫不敢望於它人者也光再拜温國文正公文集卷第五十八
