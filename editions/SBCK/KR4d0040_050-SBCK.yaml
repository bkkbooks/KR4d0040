front:
  text: 温國文正公文集卷第五十
  hash: sha256:49a55fde5bf20f1aea05d09820066c52ce8dae11463f7f80e6294c0a838bacac
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_050-1a}
body:
  text: 章奏三十五辭不正謝劄子内批依近降指揮審取指揮劄子辭放正謝第三劄子論西夏劄子辭放正謝第四劄子乞未禁私市先救西人劄子又劄子乞堅守罷役錢勑不改更劄子辭不正謝劄子臣伏聞降聖旨在閤門宰臣執政官近遷轉巳正謝訖内有司馬光見患在假特放謝仍免赴景霊宫福寧殿恭謝臣聞命震駭無地自處豈有朝廷特遷一官卧家受之並不入謝君降異常之澤臣無一拜之勤自古以来未甞有此臣雖頑暗必不敢當伏望聖慈早賜收還今来指揮候臣疾患稍痊只依前来指揮減拜入謝及赴景霊宫福寧殿恭謝庶使賤臣粗能自安取進止内批依近降指揮審取指揮劄子臣昨日具劄子奏爲聖旨特放正謝仍免赴景靈宮福寧殿恭謝臣以自古以來未有此禮必不敢當當夜准御批依近降指揮臣勘會今月十四日内降以臣轉官所有將來正謝特令兩拜起居免舞蹈十七日又准内降所有臣將來合赴景霊宫恭謝逐殿冝止令兩拜二十八日又准入内供奉官劉永年傳宣放臣正謝及景霊宮福寧殿神御前恭謝臣未審御批依近降指揮是依十四日指揮十七日指揮依二十八日指揮須至再奏禀取進止内批依二十八日指揮辭放正謝第三劄子臣昨夜准御批指揮今早再有奏禀蒙復降御批依二十八日指揮臣承命驚惶措躬無地伏念臣忝爲人臣陛下賜之一顧賜之巵酒賜之􅀲果臣亦當稽首拜謝况進以髙位加之寵名榮動搢紳澤流苗裔豈可即安私室專飬沈痾不造王庭坐受圭組不獨爲海内之所共責有司之所直繩天威違顔不出咫尺隕越斃踣爲聖朝羞臣雖至愚粗知自愛何敢受此自納於不測之誅伏望聖慈矝閔候臣所患稍痊安日止依十四日十七日所降指揮減拜入謝及於景霊宫福寧殿神御前恭謝庶差可自安其二十八日指揮臣以死自守必不敢奉詔取進止論西夏劄子臣伏見神宗皇帝以夏國主趙秉常爲臣下所囚興兵致討􅁬􅀭天威震蕩沙漠虜􅂝其種落竄伏河外諸將收其邊地建米脂義合浮圖葭蘆吳堡安彊等塞此蓋止以藉口用爲已功皆爲其身謀非爲國計臣竊聞此數寨者皆􅀌僻單外難於應援田非肥良不可以耕墾地非險要不足以守禦中國得之徒分屯兵馬坐費芻粮有乆戍逺輸之累無拓土闢境之實此衆人所共知也王師旣收靈州不克狼狽而歸卒疲食盡失亡頗多西人知中國兵力所至自此始有輕慢之心是以明年邊臣築永樂城虜潜師掩襲覆軍殺將􅂗炭一城乆之又舉一國之衆攻圍蘭州期於必取將士堅守僅而得全虜自是銳氣小挫不敢輕犯邊矣臣聞此數寨之地中國得之雖無所利虜中失之爲害頗多何則深入其境近其腹心常慮中國一朝討襲無以支梧不敢安居是以必欲得之不肯棄捨一年前虜甞專遣使者詣闕深自辨訴請臣服如故其志無它止爲欲求其舊境而巳朝廷旣許其臣服虜來請舊境朝廷乃降指揮其前則云所以興舉甲兵夲欲執取罪人救㧞幽辱非有意侵取疆􅂣土地而巳其後乃云止將巳得些少邊土聊示削罰豈可更有陳乞還復之理此則朝旨首尾已自相違又興師本爲振㧞秉常拒命者國人之罪豈可更削秉常之地於理差似未安王者以大信御四海羗戎雖微恐未易以文辭欺也於是虜旣失望憤怒怨懟移文保安軍辭理不遜云今來賀正旦人使難議發遣自是正旦生辰乃至陛下継明皆不遣使入賀其不臣大矣然而去􅀊四遣使者詣闕吊慰􅀕奠告其母喪并進遺物禮雖不備稍示屈服臣竊料虜意不出於三一者猶冀朝廷万一赦其罪戾返其侵疆二者陽爲恭順使中國休息隂伺間􅂩入爲邊患三者乆自絶於上國其國中貧乏使者往來得賜賚之物且因爲啇販耳昔衞貳於晉晉取戚田及衞人旣服郤缺曰日衞不睦故取其地今巳睦矣可以歸之叛而不討何以示威服而不柔何以示懷非威非懷何以示德遂歸戚田于衞今西人所爲如此朝廷旣不能拒絶勿受其使又不能招納與之更始彼來則迎送館榖以賔客待之不來則一無所問日復一日將踰二年臣竊意朝廷謂西人􅀔巳衰弱心實内附故來則不拒去則不追置之度外不以爲虞殊不思去年前王師大舉深入將士所過烈於猛火割其疆􅂣屢請而不還彼怨毒欲讎報之心窺窬欲乗釁之意日夜不忘若渇者不忘飲盲者不忘視也譬如有虎狼在屋側垂頭熟寢人豈可見其不動狎而侮之循其頭躡其尾邪臣毎思之終夕寒心以臣愚慮於今爲之止有二策一者返其侵疆二者禁其私市何謂返其侵疆凡天子即位天地一新滌瑕蕩穢小大無遺昔趙佗自稱南越武帝倔強嶺南漢文帝即位赦其大罪遣單使往諭之佗稽首請服累丗爲臣李継遷俶擾西陲十有餘年􅀜中困弊真宗皇帝即位赦其大罪割霊夏等數州除其子趙德明爲定難軍節度使由是邊境安寧者四十年此乃前丗及祖宗之成法非無所依據也今秉常之罪不大於継遷也米脂等寨不多於霊夏也陛下誠能於此踰年改元之際特下詔書數其累年不來賀正旦生辰及登寳位等不備之禮嘉其吊慰􅀕奠告國母喪進遺物之勤曠然推恩盡赦前罪自今以後貢獻賜予悉如舊規廢米脂義合浮圖葭蘆呉堡安彊等寨令延慶二州悉加毀撤除省地外元係夏國舊日之境並以還之其定西城蘭州議者或謂夲花麻所居趙元昊以女妻之羈縻役属非其夲土欲且存留以爲後圖猶似有名禦夷狄者不壹而足俟其再請或留或與徐議其冝亦無所傷至於㑹州尚在化外而經略司遽稱熈河蘭㑹虜常疑中國更有闢境之心不若改爲熈河岷蘭經略司如此則西人忽􅀍德音出於意外雖禽獸木石亦將感動况其人􅀋豈得不皷舞抃蹈丗丗臣服者乎議者或曰先帝興師動衆所費億萬僅得數寨今復無故棄之此中國之恥也昔漢元帝棄朱崖詔曰朕日夜惟思議者之言羞威不行則欲誅之通於時變則憂萬民夫萬民之飢餓與逺蠻之不討危孰大焉遂棄之此乃帝王之大度仁人之用心如天地之覆燾父母之慈愛盛德之事何恥之有國家方制萬里今此尋丈之地惜而不與萬一西人積怨憤之氣逞凶悖之心悉舉犬羊之衆投間伺隙長驅深入覆軍殺將兵連禍結如曏日繼遷元昊之叛逆天下騷動當是之時雖有米脂等千寨能有益乎不唯待其攻圍自取固可深恥借使虜有一言不遜而還之傷威毀重固巳多矣故不若今日與之之爲愈也此國家大事伏望陛下留神熟慮更與執政詳議以聖意断而行之不可後時失此機㑹悔將無及何謂禁其私市西夏所居氐羗舊壤所産者不過羊馬氈毯其國中用之不盡其􅀔必推其餘與它國貿易其三靣皆戎狄鬻之不售惟中國者羊馬氊毯之所輸而茶綵百貨之所自來也故其人如嬰兒而中國乳哺之矣寳元慶暦之間元昊􅀒恩僣亂屢犯邊境大入則大利小入則小利中國未甞蹈其境破其軍禽其將屠其城有害於社稷也而首尾六年元昊遣使因縁邊吏卑辭納􅅃頓顙稱臣雖其惡積罪盈欲懷音革靣原其􅀻心亦未必不貪中國之財思私市之利故也舊制官給客人公據方聽與西人交易傳聞近􅀊法禁踈闊官吏弛慢邊民與西人交易者日夕公行彼西人公則頻遣使者啇販中國私則邊鄙小民􅀼相交易雖不獲嵗賜之物公私無乏所以得偃蹇自肆數年之間似恭似慢示不汲汲於事中國由資用饒足與事中國時無以異故也陛下誠能却其使者責以累年正旦生辰及登寳位皆不來賀何獨遣此使者拒而勿内明勑邊吏嚴禁私市俟其年嵗之間公私困弊使自謀而來禮必益恭辭必益遜然後朝廷責而赦之許通私市待之如初然邊民與西人交易爲日積乆習玩爲常一旦禁之其事甚難何則若以常法治之則有司泥文動循繩墨追問證佐逮捕傳送之人停匿之家奏裁待報動渉半年如此則徒使邊民麗刑者衆獄犴盈溢而私市終不能禁也夫三尺之限空車不能登峭故也百仭之山重載陟其上陵夷故也今必欲嚴禁邊民與西人私市須權時别立重法犯者必死無赦夲地分吏卒應巡邏者不覺透漏官貟衝替兵士降配仍許人告捉獲者賞錢若干當日内以官錢支給更不以犯事人家財充如此則㳂邊六路各行得一兩人則庶幾可以聳動人耳目令行禁止人不敢犯矣然人存政舉此事全在邊帥得人昔龐籍爲河東經略使下令禁邊民與西人私市有熟户犯禁籍斬於犯處妻孥皆送淮南編管一境凛然無敢犯者其後施昌言爲環慶路經略使亦禁私市西人發兵壓境昌言遣使問其所以來之故西人言無它事只爲交易不通使者懼其兵威輒私許之法遂復壞若邊帥未能盡得其人則此法恐未易可行不若前策道大體正萬全無失也取進止辭放正謝第四劄子今月五日准尚書省劄子以臣前奏乞候所患稍痊安日依正月十四日十七日所降指揮减拜入謝及於景靈宫福寧殿神御前恭謝今月二日三省同奉聖旨依正月二十八日指揮臣聞君待臣以惠臣奉君以恭故能上下相親道用交泰陛下念臣衰老抱疾筋力尫羸特損朝儀以從私便陛下之大惠也若不知禮體有􅌤靣目坐受優恩曽無辤避是君有惠而臣不恭上行施而下無報臣雖頑昧心豈敢安伏望聖慈如臣前奏依正月十四日十七日指揮庶使微軀有地自處取進止乞未禁私市先赦西人劄子臣於今月三日上言以西人未服中國不得無憂而備邊不敢少弛不自揆其狂妄獻二策上策欲因天子継統曠然赦之歸其侵地與之更始下策欲嚴私市俟其屈服然後赦之然禁私市甚難立法極嚴又邊帥得人然後能行不若前策之道大體正萬全無失也今􅀼聞執政用臣下策止令禁私市又立法不嚴邊帥未盡得人若邊吏拘文獲一漏百私市滔滔如故或此路禁絶而彼路放行如隄防一存一亡將何所益如此適足以激怒西人使益發悖心安肯屈服萬一微犯邊境或表牒中形不遜語至時朝廷轉難處置悔之無及不若用臣上策早相彌縫縱未欲還其侵地且下詔書責而赦之使彼此安心時難得而易失不可忽也况本欲因天子継統蕩滌其罪今日行之巳爲太晚若更遷延則赦之無名兹事繫國安危若俟執政論議僉同恐失機㑹誤國大事伏望聖意獨断行之勿復有疑天下幸甚若有執政立異議乞令其人自立文字若依從其議它日因此致引惹邊事當專執其咎取進止又劄子臣於今月十二日上言乞以天子継統曠然更始冝下詔數西人之罪而赦之縱未還其侵地且此策行以安邊境至今聞執政議尚未决臣之愚意以爲封内未安未可圖外欲急行臣前策以覊縻西人且可數年邊鄙無事朝廷得休息戍兵安飬百姓待國力完備家給人足然後􅁬􅀭天威討貳柔服何所不可若行臣前策可以萬全行臣後䇿有得有失豈可弃上䇿而用下策捨萬全而就有失也太平興國中李継遷反西陲不解甲者十餘年􅀜中困竭寳元慶暦之間趙元昊叛屢入爲冦覆軍殺將自是中國虚耗不復冨實今國家理財未得其道民力困窮於下府庫窘乏於上又新遭大喪山陵纔畢自去年十月初以來不雨雪旱􅀔甚大若萬一激怒西人㣲出一不遜語則并臣前策亦不可行矣今因天子即位未乆西人外迹未有不順故臣願朝廷旦夕汲汲行之機會難得時不可失此臣所以惓惓進言不巳者也若萬一激怒西人致生邊患兵連禍結士卒殄盡於鋒鏑生民困竭於轉餉餓殍蔽地盗賊蜂起爲國家慮豈不危哉而執政方以爲西人㣲弱不敢動數遣使來誠心内附置之度外不以爲虞今復固執先禁私市之議又立法不嚴邊帥不才者不先易去行之太早不能中節一旦禍生所忽邊鄙震驚乃始歸罪戎狄豈不害國事乎臣於今月三日上所言措置西邊事雖畫二䇿固以還其侵地責而赦之爲上策嚴私市待其數年貧困來服然後赦之爲下䇿所爲絶私市非立法至嚴帥臣智勇此法恐未易可行不若前策道大體正萬全無失非臣前後返覆静言庸違也朝廷比來擢臣於冗散之中使預聞國論蓋亦誤謂臣㣲有益於國家非徒采其虚名也臣不敢終辭亦欲竭盡疲駑少酬大恩非苟貪於禄位也今盡忠謀國而爲衆所挫臣尚留此有何所用此國大事伏望陛下早審察二議從其長者若聖意以臣言爲然乞御批依臣前䇿若降付三省樞宻院執政仍有固守已見爭之最力者乞如臣前奏令自入文字言先禁私市保得它日必不致引惹邊事如其不然身執其咎取進止乞堅守罷役錢敕不改更劄子臣近以抱病家居恐溘先朝露無以少報盛德是以力疾貪陳所見􅀼以即日爲小民病者無若免役錢欲乞悉行廢罷復祖宗差役舊法識慮愚短誠不意朝廷盡從其􅀃非陛下明断不能如是此乃天下之幸非獨㣲臣之幸也然臣聞令出惟行弗惟返彼免役錢雖於下戸困苦而上户優便行之巳近二十年人情習熟一旦變更不能不懷異同又復行差役之􅀄州縣不能不小有煩擾又提舉官專以多歛役錢爲功惟恐役錢之罷若見朝廷於今日所下勑㣲有變動必更相告曰朝廷之勑果尚未定冝且觀望必競言役錢不可罷朝廷萬一聽之則良法復壞矣伏望朝廷執之堅如金石雖有小小利害未俻俟諸路轉運司奏到徐爲改更亦未爲晚當此之際則願朝廷勿以人言輕壞利民良法取進止温國文正公文集卷第五十
