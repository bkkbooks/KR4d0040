body:
  text: 碑誌五殿中丞知商州薛君墓誌銘衞尉少卿司馬府君墓表尚書駕部貟外郎司馬府君墓誌銘書孫之翰墓誌後書孫之翰唐史記後文潞公家廟碑書田諫議碑隂殿中丞知商州薛君墓誌銘魏晉之間薛氏始自蜀徙河東有部曲數千家永嘉之亂保河汾以自固厯劉石符氏莫􅀎屈姚秦元魏以来始出仕爲公侯卿相者比肩並起入唐尤盛號爲甲族然率囙逰窅去鄊里惟府君之先至今留居河東唐衰薛氏中㣲曽祖考諱昉不仕祖考諱􅁢㳟贈諌議大夫考諱田樞宻直學士右諫議大夫贈太尉其行義功烈皆見扵宋宣獻公所爲太尉公之碑府君諱儀字式之太尉公之第二子始以父䕃爲太廟齋郎又除守􅀅作􅁥主簿太尉公知益州奏府君􅁥􅃫翔府啇稅後徙知河東府君年少河東士民皆郷里長老然素嚴憚府君不敢干以􅀻府君御之亦不失㤙義之中以父􅁨去官服除知鄠縣徙知安邑通判渭州州􅀅武人不􅀎謹廉州大吏郝正者把其隂事招權受賕莫敢詰府君至以正罪惡言扵將請治之將内窘􅀻以情告府君曰某止欲去惡吏耳必不使及君將亦知府君不欺即移疾以州事屬府君府君乃發正􅀻出塞市馬􅀵案伏法􅀅不染於辭深徳府君且内慙自是悉委事於府君後􅀅知府君賢亦委以事如前􅀅既而某官張君亢除知渭州或謂府君曰君自到渭名雖州佐其實􅀅也張君有材而尚氣到必不為君下彼不可以文法拘也君冝於事一無􅀁與庻幾㦯免府君喟然嘆曰吾推忠信正直之心以事人豈好犯上而專事邪今張君来吾猶是心也使張君賢必不我怨如其不賢吾􅀗罪亦命而已矣豈可因人而變其守哉及張君至處事有夫府君力争如故必當理而後止僚吏皆為之懼張君􅀄無言乆之乃於廣坐謂衆曰亢喜忠義與身俱生遇事輒發不􅀎顧慮故數爲小人􅀁䧟使爲亢佐者皆如薛君亢復何患於是聞者皆服張君之賢而重府君之正是時元昊數㓂邉覆軍殺􅀅朝廷患之乃命范文正公爲鄜延招討使以張君知鄜州爲范公之副張公即具奏府君在渭州􅀁以佐已之状乞移通判鄜州朝廷許之而府君母馮翊郡太君党氏春秋髙多疾顧戀郷里不肯随諸子之官府君之弟用太尉君㤙得官河中者適皆罷去府君乃固辭鄜州願􅁥河中塩稅以便親既得請范公遽上奏曰朝廷􅀙薛某之欲於其􅀻固便然甚非張亢求與共事之意乞以薛某還亢仍爲徙其兄􅀂弟郷里一官以慰其心朝廷即以府君弟俅知河東縣府君鄜州府君不得已之官張君患州大而䖏勢卑難以待敵欲遷就伏龜山計功數十萬時虜乗勝深入而州無役兵欲以戰士築之衆咸以爲難府君獨以為可張君喜曰薛君謂之可事無不成矣役始興而張君病失音府君外備宼敵内董役事人不知張君之病也城成民至今賴之􅀊餘徙知深州遭母􅁨服除知啇州慶暦八年閏月庚戌終于州􅅟年五十一先是屬縣宰有建言商山産銅請置􅁥鑄錢朝廷下其議轉運使有是之者府君上言朝廷前置阜民􅁥扵州境洪崖冶鑄銕錢未數年銕已竭其監當廢况又益置銅錢􅁥銅産尤薄恐徒勞費無益請以􅀁得銅扵舊􅁥鑄錢銅竭而止章乆上乆不决㑹府君沒宰之􅀃遂行縣官之費甚廣而銅尋竭如府君言宰坐抵罪府君居家孝友自㓜􅀎屬文始習律賦語意即髙竒驚人然不肯􅀙進士舉嘗著蓼蟲賦以刺世之􅄝外物而忘其苦者又以爲事之當御名者莫􅀂言動交修名乃著五御名文以自警觀是二文􅁕以知其旨趣矣􅀄娶唐氏天章閣待制肅之女生一女適殿中丞趙士寜又娶劉氏左諌議大夫綜之孫又娶李氏直集賢院建中之孫又娶陳氏司農卿宗元之女生二男長曰昌朝繇太子中􅁢􅁥察御史裏行坐正論不阿黜為大理司丞次曰昌期早卒二女長適袐書省校書郎張煦次早卒昌朝􅀅以熈寜五年正月某甲子塟府君於本縣趙行村請直龍圗閣趙君卨状其冶行以授光使爲之誌昔者先子嘗􅀗知扵太尉公􅀙兄理佐府君於鄜州幕光亦嘗拜府君於兄舎以是頗知府君之爲人府君容貌温㳟而内守堅不可奪移語言無機巧蔽匿而眀察物情其志常在利民而深疾姦惡故􅀁至上官信之僚友親之下民愛之今也幸使光誌其墓光旣取趙君之状詮次之又敢􅀻附其􅀁知云銘曰迕意冝踈而􅂉以之親阿意冝合而􅂉以之離盖至誠可以待無窮而辭色不過欺一時嗚呼乆如薛君以忠信正直為心夫又何施而不冝衛尉少卿司馬府君墓表府君諱浩於司徒公爲􅀙父兄其郷里先世見於祖墓碣曽祖諱某祖諱某父諱某皆不仕府君少治詩以學究舉凡八上終不遇遂􅅸意不復自進於有司專以治家爲事爲人魁岸慷慨尚氣義於宗族㤙尤篤司馬氏累世娶居食口衆而田園寡府君竭力營衣食以贈之均一無􅀻孀婦􅀌兒皆􅀗其􅀁凡數十年始衆無絲豪怨言家貧祖墓迫隘尊卑長㓜前後積􅀂干䘮乆未之塟府君履行祖墓之西相地為新墓稱家之有無一旦悉舉而塟之弟子里早􅀌府君識其儁異自㓜教督甚嚴其後卒以文學取進士第仕至太常少卿􅀁至著名迹前此郷人導涑水以漑田利甚博嵗以岸益深峭水不􅀎復上田日磽薄􅀅不􅁕以輸租府君率郷人言縣官始請築塌扵下流水乃復行田間爲民用至于今賴之天聖八年四月癸己終於家年六十三慶暦二年八月癸酉塟西墓􅀄娶張氏早終生女適觧人南公佐公佐舉進士得同學究出身再娶蘇氏先府君十年終年五十八生男宣又娶郭氏無子後府君十六年終年若干宣用司徒公䕃􅀘郊社齋郎累官爲尚書駕部貟外郎知梁山軍今致仕居家駕部君寛厚有守練習法令善為政吏民不􅀎欺既升朝累贈府君官至衛尉少卿夫人蘇氏􅇷封長安縣太君駕部君謂古君子論譔其世先人之美著諸金石故命光直叙其實以表扵府君之墓道時熈寜六年五月辛酉也尚書駕部貟外郎司馬府君墓誌銘兄諱某字周卿曽大父諱某大父諱某皆不仕父諱某以通毛詩屡應州舉名升禮部及兄登朝累贈衛尉卿母某氏封某縣太君司馬氏累世娶居食口常不减數十衛尉府君爲之長兄年十六衛尉即以家事委之衣食均贍宗族無間言衛尉得以􅄖㳺自適十餘年而終兄用􅀙父太尉君䕃􅀘郊社齋􅀰太尉以家事非兄不􅀎辦未聴􅀙䆠後數年乃調逹州通川尉州有宣漢塩井距州千餘里唯一谿僅通小舟可以往来守片吏恃其險逺大爲姦利州遣兄往按之因爲之區䖏利害凡再往返遂革其弊考滿除華州司理叅軍州􅀅驕貴數用􅀻欲撓公法兄執不聴有幕僚性剛戾自􅀅以下皆惡之共文致其罪俾兄鞠之幕僚復上書訟州官皆􅀗罪惟兄不染於辭人以是益知其公平有驍􅀐十餘卒犯罪謀亡去􅁥押捕􅀗之誣云共啚不􅁤欲殺之以求功賞州官信之謂兄必考掠取服兄不􅀙據實鞠之皆止杖罪餘囚負䆓得直者甚衆既而遭継母郭氏憂去官直􅁈者或炷香扵頂臂以送之服除授觧州聞喜尉用薦者遷大理寺丞知河中府猗氏縣徙閬州新井縣通判鄧均二州先是房州竹山有金谿出金甚多山谷窮僻人跡罕至豪族專其利監司欲命官置場市之皆憚其險辭不行時兄年巳踰六十􅁬曰利其禄而避其勞可乎遂往躋攀崖巘為之經畫條目使公􅀻俱利仍每月一按行凡歳餘乃還均州秩滿徙知梁山軍累官至駕部貟外郎年甫七十體力尚壮即求致仕詔􅀘子廣郊社齋郎廣為虢州盧氏主簿迎兄之官以熈寜八年十二月戊子朔暴得疾已丑終於官􅃕年七十有三兄為人沉厚寛􅁉喜愠不形扵外少時家貧有衣一笥夜遺火比家人􅁴狼狽救之笥衣巳盡兄獨臥不起家人尤之曰焼衣蕩盡何心尚安臥邪兄曰衣已燒矣起視何益轉枕復􅃦人皆服其度量子孫僕役有過徐訓諭之不輕罵辱然當官公直􅀎知小民情僞吏不敢以絲毫欺也雖練習律令而不爲峭刻斷獄必求厭人心摧抑彊猾扶衛愚弱􅀁治職事皆有方略或素號繁劇者兄䖏之嘗有餘暇氣色不動而衆務修舉廷中永晝寂無人聲其下皆畏而愛之乆猶見思􅀙仕三十餘年未嘗有過然性恬静不自矜譽故人知之者益鮮無􅀁超越循常調終身兄亦不憾也其奉養儉素自爲布衣至二千石飲啜服用未嘗少異與郷人居和易簡静故沒之日聞者無不歎惜先娶紐氏早終再娶張氏觧州助教震之女柔静慈良宜於族姻封清河縣君治平四年終於鄧州年五十八子男四人曰齊曰庭曰廣曰房庭虢州虢略尉女四人長適觧人樊景讓次適陕人張安仁次二人未嫁皆早夭齊等以熈寧九年二月壬寅奉兄及嫂之䘮塟於夏川鄊先塋之西南光以期日之迫不暇請於時之賢士大夫自爲之銘曰廓然有容頽然無争􅀁蒞之政不煩而成去乆而人益思無求而人莫知年至歸休始終無􅃜書孫之翰墓誌後明道中公在華州光始以太廟齋郎得謁見皇祐中幸與公同在舘閣公於光爲前輩而光服公才仰公徳不敢以同舍期也然粗􅀎孰公之爲人元豐二年十一月公弟子崇信令察示光以歐陽公􅀁譔公墓誌光讀之怳然如復見公得侍坐於傍也昔蔡伯喈嘗言吾爲碑銘多矣皆有慙徳唯郭有道無媿色耳觀歐陽公此文其言公自􅀄仕以美才淸徳為時􅀁重在諌院言宫禁事切直無􅀁避在陕不飾厨傳凡當官公論不􅀻其􅀁愛淡然寡􅀁好外和而内勁喜言唐事學者終􅀊讀史不如一日聞公論此皆光親􅀁覩聞當時士大夫􅀁共知可謂實録而無愧矣公名高扵世歐陽公以文䧺天下固不待光言而後人信之然􅀊月益乆識公者益寡􅀼懼後之人見歐陽公之文以為如世俗之銘誌但飾虗美以取悅其子孫耳故冒進越之罪嗣書其末譬猶捧土以培泰山匊水以沃大河彼豈賴此以爲髙深㢤盖志在有以益之不自知非其任也書孫之翰唐史記後孫公昔著此書甚自重惜嘗别緘其槀扵笥必盥手然後啓之謂家人曰萬一有水火兵刃之急佗貨財盡棄之此笥不可失也每公􅀻少間則增損改易未嘗去手其在江東爲轉運使出行部亦以自随過亭傳休止輒修之㑹宣州有急變乗馹遽往不暇挈以俱旣行於後金􅁜大火延及轉運􅇬含弟子察親􅀒其笥避扵沼中島上公在宣州聞之亟還入門問曰唐書在乎察對曰在乃恱餘無􅀁問自壮年至于今白首乃成亦未以示人文潞公執政嘗􅀙公借之公不與但録姚崇宋璟論以諭之况佗人固不得見也元豐二年察自陽翟来洛陽以其書授光曰伯父平生之志萃於是書朝廷先嘗取之留禁中不出今沒二十餘年家道益衰大懼是書遂散逸不傳於人故録以授子光昔聞公有是書固願見而未之得得之驚喜曰子之貺我兼金不如顧無以爲報請受而蔵之遇同好則傳之異日或廣布於天下使公之志業煒煌於千古庻㡬亦􅁕以少報乎文潞公家廟碑先王之制自天子至于官師皆有廟君子將營宫室宗廟爲先居室爲後及秦非笑聖人蕩滅典禮務尊君卑臣於是天子之外無敢營宗廟者漢世公卿貴人多建祠堂於墓􅀁在都邑則鮮焉魏晉以降漸復廟制其後遂著於令以官品爲􅀁祀世數之差唐侍中王珪不立􅀻廟爲執法􅀁糾太宗命有司為之營太土御名以耻之是以唐世貴臣皆有廟及五代蕩析士民求生有􅀁未遑禮頽教陊廟制遂􅅸宋興夷亂蘇疲乆而未講仁宗皇帝閔羣臣貴極公相而祖禰食于􅃦儕扵庶人慶暦元年囙郊祀赦聴文武官依舊式立家廟令雖下有司莫之舉士大夫亦以耳目乆不際往往不知廟之可設扵家也皇祐二年天子宗祀禮成平章事宋公奏言有司不能推述先典明諭上仁囙循顧望遂踰十載縁偷襲弊殊可嗟閔臣嘗因進對屢聞聖言謂諸臣專殖苐産不立􅀻廟睿心至意形于歎息盖由古今異冝封爵殊制因疑成憚遂格詔書請下禮官議定制度於是翰林承旨而下共奏請自平章事以上立四廟東宫少保以上三廟其餘器服儀範俟更叅酌以聞是嵗十二月詔如其請旣而在職者違慢相仗迄今廟制卒不立公卿亦安故習常得諉以為辭無肯唱衆爲之者獨平章事文公首奏乞立廟河南眀年七月有詔可之然尚未知築搆之式靡􅀁循依至和􅀄西鎭長安訪唐廟之存者得杜岐公舊迹止餘一堂四室及旁两翼嘉祐元年始倣而營之三年増置前两廡及門東廡以蔵􅀕噐西廡以蔵家譜齋枋在中門之右省牲展饌視滌濯在中門之左庖厨在其東南其外門再重西折而南出四年秋廟成公以入輔出藩未嘗踰時安䖏於洛元豐三年秋留守西都始釁廟而􅂎焉一旦授光以家譜予欲志族世之􅀁􅀙来及廟之􅀁由立垂示後昆而爲我叙其事􅅃于石光􅀼惟公追逺復古率禮興化之盛徳不可以無傳雖自知不文不敢辭謹叙而銘之按譜云文氏之先出陳公子完以謚爲氏與翼祖諱同至秦有丕丕生河東太守教始家平陽其後有韶漢末爲揚州刺史自韶以来世乃可譜韶之六世孫頻爲後魏北絳太守頻曾孫顯儁以别駕􅀙北齊髙祖起晉州就覇業戰功名居多終兖州刺史頻之六世孫曰肅曰君洪肅仕隋爲頴川郡丞名列循吏以公直􅎨宇文述老卑秩君洪􅀙髙祖起晋陽爲右衛􅀅軍太子建成餘黨攻宫門君洪首􅁬挺出戰沒頻之八世孫曰暉曰播暉相中宗誅張易之奪武后天下歸之唐用􅄷人䜛謫死嶠南播有史學官至給事中君洪之曾孫羽爲御史中丞肅之四世孫括爲御史大夫括孫晦爲太子賓客晦兄昕爲義成莭度使皥爲散􅀐常侍榮冠當時自顯儁至晦皆有傳見於史其家自平陽或遷太平或遷蒲阪或遷實鼎晦之􅀙父昆弟晤為北都留守判官始居介休晤生汾州􅂙軍檖檖生館館生澤州録事􅂙軍即公之髙祖考也諱浩曽祖考諱某仕後唐厯晉城天池平城三主簿避晉髙祖諱更其氏曰文厯崞太谷二令漢髙祖即位復舊氏更名某漢失天下其支别者自帝於晉陽復事之終嵐州録事􅂙軍祖考諱某辟石州幕府棄官歸郷里太宗皇帝平晋陽召之不起以廟諱故復爲文氏考諱某以儒學進厯十三官􅀁至以強直勤敏振利攘害名聞逹不可揜判三司開拆磨勘司終主客郎中河東轉運使其治行之詳見於故平章事晏公􅂙知政事王公沂譔墓誌及碑公貴朝廷褒榮三代贈官皆至太師中書令兼尚書令爵燕周魏三􅀦公廟成澤州府君為苐一室夫人某氏配燕公為苐二室燕􅀦太夫人宋氏配周公為苐三室周􅀦太夫王氏越􅀦太夫人申氏配魏公居東室魏􅀦太夫人耿氏魯􅀦太夫申氏配公以廟制未僃不敢作主用晉荀安昌公祠制作神板采唐周元陽議祠以元日寒食秋分冬夏至致齊一日又以􅂉受詔之四方不常其居乃酌古諸侯載遷主之義作車奉神板以行此皆礼之􅀙冝者也其銘曰鬰彼喬木茂于苞根浩彼長川發于浚源矧人之先云誰敢諼天佑有宋誕生哲臣乃斡樞軸乃秉鎔鈞克􅁵克諧􅁢武􅁢文甘􅁜有妖悖暴紛囂公往逍遥不日而消仁祖太上御名疾羣心震栗公入宻勿四海清謐出殿方維爲諸侯師以恵以綏不􅆸其威至也民悅去也民思其思如何式謡且歌歌政之和在洛爲多謀居之安疇如得民公自汾渚遷于洛滸􅁢樂兹土永燕􅀻䖏伊水洋洋山木蒼蒼是掄是剫是斷是斵逹于有洛是相是虞是卜是諏是築是捄是植是扶是茨是塗作廟渠渠新廟既成室家是營公曰予居風雨是撫勿侈勿崇予躬是容人痺公堂公曰予康人隘公庭公曰予寜人勿予隘惟子孫是賴人勿予痺惟子孫是利克㳟克儉予履予視俾躬之爲美匪目之爲麗廟堂既闢四室有侐豢牲孔碩導􅁰及稷豆􅇼旣滌汛掃旣僃旨酒既泲刲牲為饎乃薦乃陳苾苾芬芬祖考欣欣百嘏来臻天錫公祉強明夀愷帝錫公禄崇榮豐泰天匪公􅀻公徳是冝帝匪公優公勲是酬公拜稽首揚天子之休思純終始式貽孫子子子孫勿替勿忘時奉丞嘗保公之烈光書田諫議碑隂光自始學未冠聞故諫議大夫田公當真宗踐阼之􅀄求治方急公稽古以􅁥今日有獻月有納以賛成咸平盛隆之治􅀻心慕仰想見其為人熈寜中始識公之曽孫偃師尉衍因就求觀公之遺文後十餘年衍為武勝軍莭度推官知沈丘縣事以公文集及墓銘相示且命光爲神道碑其墓銘乃故􅂙知政事范公􅀁爲也范公大賢其言固無􅀁苟仐其銘曰嗚呼田公天下之正人也雖復使佗人竭其慕仰之心頌公之美累千万言􅀎有過扵此乎光於范公無􅀎爲役范公恨不得見田公則田公果何如人㦲光不惟愚陋不學且不爲人作碑銘已乆不敢承命然常怪世人論譔其祖禰之徳業壙中之銘道旁之碑必使二人爲之彼其徳業一也銘與碑奚以異􅂚若刻大賢之言既納諸壙又植扵道其爲取信扵永乆豈不無疑乎願審思之脫或可従請附刻扵碑隂之末温國文正公文集卷第七十九
