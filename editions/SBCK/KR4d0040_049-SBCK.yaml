body:
  text: 章奏三十四與晦叔同舉程頥乞裁断政事劄子議可劄子大辟貸配法草進孝經指解劄子辭特轉官第一劄子辭官第二劄子革弊劄子辭轉官第三劄子辭官第四劄子辭官第五劄子乞罷免役錢依舊差役劄子辭免醫官劄子與晦叔同舉程頥臣等􅀼見河南處士程頥力學好古安貧守節言必忠信動遵禮義年踰五十不求仕進真儒者之髙蹈聖丗之逸民伏望聖慈特加召命擢以不次足以矝式士􅀋禆益風化取進止乞裁断政事劄子臣聞兩貴之不能相事兩賤之不能相使此乃物理自然人情之常也是以聖人立爲君臣使人臣各獻其謀而人君裁决其是非若網在綱有條而不紊此國家所以治也若人君不加裁决使人臣各行其意則朝夕闘訟弱不勝強寡不勝衆不則雷同詭隨尸禄􅀼位苟且偷安以度目前此國家所以衰也然人君於是非之間亦當三思清察昭然無疑然後决之自古興衰治乱未有不由此塗出也夫人心不同各如其面雖以周公之聖召公之賢同輔成王猶有不恱况邪正忠佞各有所存者乎臣竊惟皇帝冨於春秋太皇太后親臨萬機事無大小皆委於執政垂拱仰成萬一群臣有所見不同􅀔均力敵莫能相壹者伏望陛下特留聖意審察是非若甲是而乙非當捨乙而從甲乙是而甲非當捨甲而從乙如此則群臣莫敢不服善政日新矣不然陛下雖有求治之心事功無時而成也况書曰惟辟作福作威不可使用人賞罰之柄盡歸執政人主一不得而專也取進止議可劄子臣聞古人有言謀之在多断之在獨陛下寛仁委政群下或群疑議論難一儻陛下不决其是非則爭辯紛紜無時而息事功何由可成臣謹按蔡邕獨断敘漢制有疑事公卿百官㑹議若臺閣有正處而獨執異意者曰駮議其合於上意者文報曰某官某甲議可此所以各盡臣下之所見而人主亦不失操柄也今執政之臣雖相與竭力同寅恊恭若萬一有議論必不可合者欲乞許令各具劄子奏聞望陛下精察其是非可否以聖意决之或於簾前宣諭或於禁中批出令依某人所奏若群臣猶有固爭執者則願陛下更加審察若前來處分果非則勿憚改爲若灼然無疑則决行不移耳如此再思而行庶幾得盡衆心事亦少失矣取進止大辟貸配法草應開封府諸路州軍奏到大辟罪人稱是刑名疑慮及情理可憫者仰刑部大理寺依條定断并坐疑慮可憫條送刑部看詳如刑名實有疑慮情理實有可憫因依申奏取旨若看詳得别無疑慮及可憫者即具鈔奏下夲處依法施行不得一槩將舊例貸配破却律勑正條仍委門下中書尚書省􅀧撿如有不當及用例破條奏乞取勘施行進孝經指解劄子臣竊惟自古五帝三王未有不由學以成其聖德者所謂學者非誦章句習筆扎作文辭也在於正心修身齊家治國明明德於天下也恭惟皇帝陛下肇承基緒雖年在幼冲而執喪臨朝率禮弗越體兒尊嚴舉止安重顒顒卭卭有老成之德華夷瞻仰無不愛戴此乃聖性自然不聞亦式實天祐皇家宗廟社稷生民之盛福也然玉不􅅣不成噐人不學不知道儻復資學問以成之則堯舜禹湯文武何逺之有伏見近降聖旨過冬至開講筵臣􅀼以聖人之德無以加於孝自天子至於庶人莫不始於事親終於立身揚名於後丗誠爲學所冝先也臣曏不自揆甞撰古文孝經指解皇祐中献於仁宗皇帝􅀼慮􅀊乆遺失不存今别繕冩爲一􅁽上進伏乞聖明少賜省覧取進止辭特轉官第一劄子臣伏覩中書録黄奉聖旨神宗祔廟畢執政官依故事轉遷以臣爲正議大夫者臣竊惟英宗皇帝親政之􅀄以宰臣韓􅄾等於嘉祐之末有定策大功保祐聖躬濟于艱難故各特遷一官今陛下以神宗皇帝大漸之際宰臣蔡確等啓迪聖心建立儲貳傳授大寳各特遷一官固亦其冝臣當是時方閑居西京慿几末命非所預聞豈得與確等同受褒賞且國家名位本以醻功報德不可但以祔廟禮畢檢舉故事虚有授受况臣於登極之􅀄巳􅂪覃恩改官今曾未踰年安敢再叨殊渥縱臣貪冒不知愧耻天下之人其謂臣何所有授正議大夫告身臣不敢祗受伏望聖慈特賜寢罷取進止辭官第二劄子臣於今月十一日伏覩中書録黄蒙恩除正議大夫臣於十二日具劄子奏以蔡確等啓迪神宗皇帝建立儲貳傳授大寳冝遷一官臣閑居西京非所預聞所有正議大夫告身臣不敢祗受自後未聞降出至十四日准閤門告報令臣受上件告身臣竊惟冨弼輔佐三朝名德老成當嘉祐之初亦是定策之臣但以不預顧命懇辝甚至如臣才德比於冨弼無能爲役當建儲顧命之際臣爲庶僚在外初不預聞豈敢止因祔廟隨例遷官凡爲政之要惟在賞功罰罪臣忝備執政無功受賞將何以裁抑他人所有新命伏望聖慈特賜寢罷取進止革弊劄子臣伏見陛下自臨政以來夙夜孜孜以愛百姓安國家爲事蓋善治疾者必究其所來攻其所急救之欲速去之欲盡臣􅀚今日公私耗竭逺近疲弊其原大槩出於用兵夫兵者凶噐天下之毒財用之蠹聖人除􅁀定亂不得巳而用之耳自有唐中葉藩鎮跋扈降及五代群雄角逐四海九州􅀲分糜潰兵相吞噬生民塗炭二百餘年太祖受天明命四征弗庭光啓景祚太宗継之克成厥勲然後大禹之迹悉爲宋有於是載戢干戈與民休息或自生至死年及期頥不見兵革吏守法度民安生業雞鳴狗吠煙火相望可謂太平之極致自古所罕侔矣及神宗継統材雄氣英以幽薊雲朔淪於契丹霊夏河西專於拓跋交趾日南制於李氏不得悉張置官吏収籍賦役比於漢唐之境猶有未完深用爲恥遂􅁣然有征伐開拓之志於是邊鄙武夫窺伺小利敢肆大言秪知邀功不顧國患爭賈餘勇自謂衛霍不死白靣書生披文按圖玩習陳迹不知合變競獻竒策自謂良平更生聚歛之臣捃拾財利剖析秋毫以供軍費專務市恩不恤殘民各陳遺利自謂研桑復出誤惑先帝自求榮位於是置提舉官強配青苗多収免役以聚貨泉又驅畎畆之人爲保甲使捨耒耜習弓矢又置都作院調筋皮角木以多造器甲又養保馬使賣耕牛市駔駿而農民始愁苦矣部分諸軍無間邊州内地各置將官以領之自軍州緫管鈴轄都監監押皆不得􅀜預捨祖宗教閱舊制誦射法効胡服機械陣圖競爲新竒朝晡上􅂣罕得休息而士卒始怨嗟矣置市易司強市搉取坐列販賣増啇稅色件及菜果而啇賈始貧困矣又立賖貸之法誘不肖子弟破其家又令民封狀増損以買坊􅂣致其子孫鄰保籍没貲産不能備償又増茶塩之額賤買賣貴強以配民食用不盡迫以威刑破産輸錢又設措置河北籴便司廣積粮榖於臨流州縣以備饋運教兵旣乆積財旣多然後用之而承平日乆人巳忘戰將帥愚懦行伍驕惰加以運籌决勝者乃浮躁巧偽之士不知彼已妄動輕舉是以頓兵霊武力疲食盡自潰而歸執兵之士荷粮之夫􅁀骨塞外且數十萬築堡永樂怠忽無備縱冦延敵闔城之人翦爲魚􅁏曽未足以威服戎狄而中國先自困矣先帝深悔其然厭截截諞言思畨番良士未及下哀痛之詔息兵冨民奄弃天下此臣所爲痛心疾首泣血追傷者也伏惟皇帝陛下肇承基緒太皇太后同聽庶政首戒邊吏無得妄出侵掠俾華夷兩安今契丹継好秉常納貢乾德拜章征伐開拓之議皆巳悉矣則此置提舉官散青苗歛免役錢􅀧教保甲置都作院飬保馬將官市易司封狀買坊􅂣増茶鹽額措置河北籴便司皆爲虚設陛下幸詔臣民各言疾苦其巳至者千有餘章未有不言此數事者足知其爲天下公患衆人所共知非臣一人之私言也利害著明皎如日月何所復疑而群臣猶習常安故憚於更張雖頗加裁損而監司按堵將官具存保甲猶教閱保馬猶養飼邊州屯成不减軍器造作不休茶鹽新額尚在差役舊法未復是用兵雖息而公私勞費猶未息也如此因循不知改轍數年之後萬一遇水旱大飢盗賊群起其爲國家憂患豈敢盡言哉伏願陛下断自聖志凡王安石等所立新法果能勝於舊者則存之其餘臣民以爲不如舊法之便者痛加釐革雖非一日可行之事欲乞陛下宣論執政令因臣民上封事熟議利害進呈以聖鑒裁決而行之昔夏遵禹訓商用湯法周循文武之典蓋創業垂統之王貽厥孫謀後丗所冝謹守不可失也若凡百措置率由舊章但使政事悉如熈寜之􅀄則民物熈熈海内太平更無餘事矣議者必曰革弊不可倉猝當徐徐有漸此何異使醫治疾而曰勿使遽愈且勿除其根原使盡也其爲醫者謀則善矣其爲疾者謀奚利哉取進止辭轉官第三劄子臣伏奉詔書以臣辭免恩命所請冝不允者昔英宗皇帝入承大統宰臣韓􅄾等實有定策之功又踐阼之􅀄聖躬違豫慈聖光獻皇太后權同聽政􅄾等盡忠竭力亦不爲不至及英宗皇帝專制萬機褒賞􅄾等各遷一官臣時爲諌官猶曽上言以近歳官冗賞濫兩府大臣陛下即政之􅀄冝懲革斯弊今自於朞年之間連併遷官則難以禁它人之幸進者恐宿衛將帥宗室外戚四方藩鎮内侍近臣皆有冀望至時陛下亦不能裁抑兩府亦不敢輙奏當是時英宗皇帝雖不収還恩命而冨弼亦有定策之功自以不預顧命力辭甚苦况臣旣不預定策又不預顧命豈可來自冗散之地遽與輔臣同賞且臣昔日在人則言其不可受今日在已則受而不辤顧行復言能不自愧所有告身臣不敢祗受伏望聖慈矜察特賜寢罷取進止辭官第四劄子昨蒙恩除臣正議大夫臣三具劄子及簾前面陳至懇終未賜開允臣夙夜愧恐不能自巳臣切以爲政之要惟在於賞功罰罪賞不當功則徼幸競進罰不當罪則善良憂恐亂之基也曏日神宗大漸之際臣屏居閭閻今乃與建儲受遺之臣一例遷官賞不當功何以過此陛下不知臣不肖使待罪執政執政當爲陛下抑徼幸惜官職而身自冒賞何以表率它人臣非敢私飾小廉其志欲爲國家慎重名器伏望聖慈矜察特寢罷新命所有告身臣不敢祗受取進止辭官第五劄子臣准閤門告示以臣累上章辭免新命已降批荅不許所有告身可告示早令祗受者臣􅀼惟無功受賞士之所難究觀英宗皇帝神宗皇帝即政之􅀄褒賞大臣皆以定策受遺之功非因祔廟禮畢臣旣非定䇿又不受遺實難虚受至於政事日新皆陛下聖明衆賢恊力在臣一人何能禆益而無名冐賞惟恐有玷清朝所有告身臣不敢祗受伏乞早賜寢罷取進止乞罷免役錢依舊差役劄子二十二日尋得旨依奏臣竊見免役之法其害有五舊日差􅃥之時上户雖差充􅃥次有所陪備然年滿之後却得休息數年管治家産以備後􅃥今則年年出錢無有休息或有所出錢數多於徃日充􅃥陪備之錢者此其害一也舊日差􅃥之時下戸元不充􅃥今來一例出免􅃥錢驅迫貧民剥膚椎髓家産旣盡流移無歸弱者轉死溝壑強者聚爲盗賊此其害二也舊日差􅃥之時所差皆土著良民各有宗族田産使之作公人管句諸事各自愛惜少敢大叚作過使之主守官物少敢侵盜所以然者事發逃亡有宗族田産以累其心故也今召募四方浮浪之人使之充􅃥無宗族田産之累作公人則恣爲姦僞曲法受􅂍主守官物則侵欺盗用一旦事發則挈家亡去變姓名别徃州縣投名官中無由追捕官物亦無處理索此其害三也自古農民所有不過􅂖帛與力凢所以供公賦役無出三者皆取諸其身而無窮盡今朝廷立法曰我不用汝力輸我錢我自雇人殊不知農民出錢難於出力何則錢非民間所鑄皆出於官上農之家所多有者不過莊田榖帛牛具桑柘而巳無積錢數百貫者自古豐歳榖賤巳自傷農官中更以免役及諸色錢督之則􅂖愈賤矣平時一斗直錢者不過直四五十更急則直三二十矣豐年猶可以粜榖送納官錢若遇凶年則榖帛亦無不免賣莊田牛具桑柘以求錢納官旣家家各賣如何得售惟有拆屋伐桑以賣薪殺牛以賣肉今嵗如此來歳何以爲生是官立法以殄盡民之生計此其害四也提舉常平倉司惟務多歛役錢廣積寛剰以爲功効希求進用今朝廷雖有指揮令役錢寛剰錢不得過二分切慮聚歛之臣猶依傍􅃥錢别作名目隱藏寛剰使幽逺之人不􅀍聖澤此其害五也陛下近詔臣民各上封事言民間疾苦所降出者約數千章無有不言免役錢之害者足知其爲天下之公患無疑也以臣愚見爲今之計莫若直降勑命應天下免􅃥錢一切並罷其諸色􅃥人並依熈寜元年以前舊法人數委本縣令佐親自掲五等丁産簿定差仍令刑部檢㑹􅄉寜元年見行差役條貫雕印頒下諸州所差之人若正身自願充􅃥者即令充􅃥不願充􅃥者任便選雇有行止人自代其雇錢多少私下商量若所雇人迯亡即勒正身别雇若將帯却官物勒正身陪填如此則諸色公人盡得有根祗行止之人少敢作過官中百事無不修舉其見雇役人候差到役人各放令逐便數内惟衙前一役最號重難曏日差役之時有因重難破家産者朝廷爲此始議作助役法然自後條貫優假衙前諸公使庫設厨酒庫茶酒司並差將校句當諸上京綱運及得替官貟或差使臣殿侍軍大將管押其麤色及畸零差將校或節級管押衙前若無差遣不聞更有破産之人若今日差充衙前料民間陪備亦少於曏日不至有破家産者若猶以爲衙前户力難以獨任即乞依舊法於官户僧寺道觀單丁女户有屋産每月掠錢及十五貫莊田中年所収斛斗及百石以上者並令隨貧冨分等第出助􅃥錢不及此數者與放免其餘産業並約此爲准所有助役錢今逐州樁管據所有多少數目約夲州衙前重難分數毎分合給幾錢遇衙前合當重難差遣即行支給然尚慮天下􅃥人利害逐處各有不同欲乞於今來勑内更指揮行下開封府界及諸路轉運司謄下州縣委逐縣官看詳若依今來指揮别無妨礙可以施行即便依此施行若有妨礙致施行未得即仰限勑到五日内具利害擘畫申夲州仰本州􅀋聚諸縣所申擇其可取者限勑到一月内具利害擘畫申轉運司仰轉運司􅀋聚諸州所申擇其可取者限勑到一季内具利害畫一奏聞朝廷候奏到委執政官再加看詳各隨冝修改别作一路一州一縣勑施行務要所在役法曲盡其冝取進止辭免醫官劄子臣以病在朝假伏蒙聖慈連日差中使押醫官沈士安朱有章楊文蔚陳易簡等到臣家各診候留藥臣上荷大㤙天隆地厚隕首糜軀無足論報然臣􅀼聞陳易簡見在病假近皇太后服藥亦祗應不得今以臣故特煩聖旨督迫令毎日一到臣家看候醫治臣忝爲人臣實不自安况臣私家亦湏更請一醫人毎日診候調理其陳易簡已知臣脉氣病狀欲乞特降聖旨只令臣毎日具病狀増减就易簡處取藥更不令易簡毎日到臣家診候庻於體分稍得自安取進止温國文正公文集卷第四十九
