body:
  text: 古詩春獵八月十五日夜􅀉友人戯下歌烏栖曲二首海仙歌宮漏謌華州祇役往馮翊留别楚正叔建中孟嘗君歌緱山引洛陽少年行􅀅軍行何秀才漢倫郊園五首夏日過陳秀才園林陪同年呉冲卿登宿州北樓望梁楚之郊訪古作是詩燕歌臺楚宮行塞上六言柳枝詞十二首奉和經略龐龍圖延州城南八詠迎薰亭供兵磑栁湖飛蓋園翠漪亭延利渠縁雲軒禊堂天馬歌河上􅇂役懷噐之􅀉呈公明叔度時噐之鞠獄滄州華星篇時視役河上􅀉郡中諸同舍宿石堰夜聞牧馬者歌楊白華都下秋懐呈聶之美陪張龍圗南湖暑飲六言二首道傍田家送李汝臣同年謫官導江主簿春日書􅀉東郡諸同舍和邵不疑校理蒲州十詩必飲亭亭有流盃渠涌泉石樞宻學士􅃽公知府事得片石大如席上有數十竅莫知所施公問石工對曰此盖涌泉石也乃扵飲亭下鑿地為塪置石其上夏日􅀙旁激水灌之躍高數尺以清暑氣翠樓碧樓静齋槐軒凉逸一字芙蕖軒惜花亭竹軒秋日􅀉山中友人和之美舟行雜詩八首舟中夜坐舩行遇風野花水鴨魚鷹􅊻魚者都門路呉冲卿直舍閻士安􅀞墨竹歌和之美河洲四詩又和夜雨宿村舍送伊􅇅王大夫歌送韓太祝維歸許昌賦得交字和興宗夜直聴雨和之美諷古和之美二貧詩送薯蕷苗與興宗荅昌言求薯蕷苗送冷金牋與興宗謝興宗恵草蟲扇和昌言官舍十題石榴花薏苡石蘭萱草蜀葵畦蔬水紅甘菊蘭病竹送文慧師歸眉山􅀿符風林石歌興宗南園草盛不翦㒒過而愛之為詩贈主人古詩贈興宗出都日塗中成以下請告歸陜及之汾隂省兄時所為重經車輞谷送巢縣崔尉酬次道初登朝呈同舍春獵小苑微寒春鴈飛石関宮外草萋萋漢家旌斾連圍合秦􅀦山川入望低花色纔臨珠綴發栁隂欲傍金隄齊韓媽承恩来視獸飛塵遥出建章西八月十五日夜􅀉友人故人音信絶對月動相思清露滴紅葉此懐當告誰秋風廣陵郭正是望濤時戲下歌項王初破函関兵氣壓山河風火明旌旗金鼔四十萬夜泊鴻門期暁戰関東席卷五諸侯沛公君臣相視愁幸因項伯謝前過進謁不敢須􅁷留椎牛髙㑹召諸􅀅寳劒泠泠舞席上咸陽􅁅燼義帝遷分裂九州如指掌功髙意滿思東歸韓生受誅不復疑區區蜀漢遷謫地縦使倒戈何足為烏栖曲二首風破金鋪結綺錢穿簾入幌舞垂蓮可憐無人夜不暁起視西窓月華皎星踈月明漏水長羅幃翠帳華燈光佳人起舞玉􅁫墮門外烏栖鴈南過海仙歌東望海波蒼茫浩渺無所極髙浪洪濤黯風色翻星倒漢天地黑隂靈出沒互相索東方瞳曨景氣清慶雲合沓吐赤精蓬莱瀛洲杳如萍遥􅀚五樓十二城羣仙劒佩朝玉京祥風縹緲鈞天聲彩幢翠盖烟霞生鸞歌鳯舞入帝郷紫麟徐驅白鶴翔餐芝茹术飲玉漿千年萬年樂未央宫漏謡宫漏清髙䖏處聞六街寂寂夜􅀅分南下河梁緬詰曲北瞻禁􅊴鬱􅌭紛黄金鎻閉斗城斜白玉樓通上帝家􅀂木未光濳日月神仙不動積烟霞銅壷銀箭夜何長杳杳亭亭未遽央複道廽廊接西掖千門萬戸遥相當宛轉徘􅆦不􅀎駐復出宫城透宫􅀣宫􅀣烏飛月欲西燭光一道照沙隄龍􅀐聮翩擁閶闔鳯華州祇役往馮翊留别楚正叔建中芳菲不得駐㑹取餘春還欲知回首䖏渭曲蒼茫間孟甞君歌君不見薛公在齊當路時三千豪士相追随邑封萬戸無自入椎牛釃酒不為貲門下紛紛如市人鷄鳴狗盗亦同塵一朝失勢賔客落唯有馮驩西入秦緱山引王子吹笙去不還當時舊物唯緱山山深樹老蔵遺廟春月秋風空自閒轘轅左界連商雒碧瓦朱欄露華薄􅀴時掩戸庭草深永晝無人澗花落徘徊未下日􅀅西遥望嵩陽烟景㣲鶴馭飄颻向何許林間空見白雲飛洛陽少年行銅駞陌上桃花紅洛陽無䖏無春風青絲結尾連錢騘相從射獵北邙東流鞭縱鏑未云畢青山團團載紅日雲分電散無影迹黄鷄未鳴巳復出􅀅軍行赤光滿靣脣激朱虬􅂡虎顙三十餘腰乗金印結紫綬諸􅀅不敢過庭除羽林精卒二十萬注聴鍾鼔觀麾旟肥牛百頭酒萬石爛漫一日供歡娱自言不喜讀兵法智畧何必求孫呉賀蘭山前􅇏火滿誰令小虜驕慢延須􅁷何秀才漢倫郊園五首主人躭詩書樂道深居乆挾策往来㳺東岡復南畝濁酒不取味素琴無復絃何須更清論相見自䔥然蒼蒼竹林溟鬱鬱松氣寒縦横興来筆欹側醉中冠褰裳􅍱幽澗日落烟巖空躊躇待新月長嘯来清風夏木繞茅廬碁酒資清宴宻葉緑蔵枝空聞黄鳥囀夏日過陳秀才園林桑䕃青青紫葚垂鮮風蕩麥生漣漪驅童策馬踏村路乗興出逰當訪誰槿花籬落圍叢竹風日蕭踈滿園緑到門下馬問主人文籍先生其姓陳高談浩浩究今古不覺林間日􅀅暮茅廬蒿􅈳幸不遥不厭頻煩數来去陪同年呉冲卿登宿州北樓望梁楚之郊訪古作是詩大禹息洪潦畫野經九州波沈露群山嶷嶷相嬰鉤㳬洄澹兹圡平敞仍寡仇乗髙極回望坦坦無陵丘先王崇皥濟建祀􅀖諸侯玉帛從會同赴告書春秋六䧺方逐鹿爲嬴弱􅁎周兹爲會戰塲蹀血無時休漢錯削七國禍生東南陬亞夫閉高壁坐折強呉謀典午倒太阿闢戸延旃裘淮泗漫腥羶房心掩旄頭人移烟火絶榛茂豺狼逰唐綱日浸衰盗起如螟蟊相􅂝聚萑蒲袒臂提耡耰蟠薄數千里焚刼無餘留聖朝定多壘劒㦸包􅆛貅蓁蓁荆􅁄林膴膴良田疇耒耟趨時雨􅁰稷豐嵗秋昔為車􅀐利今覩桑麻收我来宦東土莨菪乗春流行行次苻離固爲親交留樽罍且為樂携手登髙樓是時新雨餘風日方和柔雲鮮乱花薄波緑迷芳洲羃􅇈逰絲轉衮衮野陽浮調簧語雙鸝飜雪矯羣鷗愛兹登臨美况復依良儔聊適笑言樂盡忘羈旅憂翔陽向冉冉漸與西山遒驛程前有期戀此當何由分首下岧嶤悵然登莫舟燕臺歌萬古蒼茫空盛衰燕臺賢客姓名誰君看碣石嵓中草寜似昭王擁篲時黄金散盡餘基没易水蕭條烽火飛楚宫行楚王宫中夜未央清歌秘舞會華堂木蘭為柱桂為梁隋珠和璧爛同光横吹乍鳴秋竹裂繁絃初度春雨歇九㣲火􅀣垂垂滅羅衣紛紛玉纓絶滿朝冠劒東方明宫門未啓君朝醒秦関日夜出竒兵武安君火照夷陵塞上六言胡兵欲下隂山寒烽逺過蕭關􅀅軍貴􅁿士卒幾人囬首生還柳枝詞十三首烟滿上林春未歸三三兩兩雪花飛栁條别得東皇意映隄拂水巳依依依依髙􅀣出宫墻揺曳青絲百尺長願與宣温萬年􅀣年年歳歳奉君王君王逰豫賞青春折柳爲弮賜侍臣莫怪長條低拂地只縁供掃属車塵屬車􅀮􅀮逺如雷陳后愁眉乆不開楊花都不知人意故入長門宮裏来長門宫曉未成粧結雨縈風蔽􅃈窓莫令透入華梁燕那堪􅀒汝更雙雙雙雙春鷰颺雲霄楚國宮深樂事饒會待急管繁絃際試取纎條並舞腰舞腰繽紛長樂東柳間悵飲送春風請君試望邯鄲道青門裊裊徹新豐新豐道上灞陵頭又送夫君去逺逰借問桞枝􅀎􅀉否古今共有㡬多愁多愁尤是别離深折條相贈各沾襟留住不住居人意欲去未去行人心行人白馬去遥遥初上金隄欲過橋望塵不見遮人眼苦怨無情萬萬條五柳先生門乍開宅邉植杖乆徘􅆦陌頭遥認顔光禄詰旦先乗瘦馬来白雪雖然比絮花艶陽不得共繁華為君故入烏衣巷飛舞風流謝傅家宣陽門前三月初家家楊柳緑蔵烏歡似白花飄蕩去忍􅀎棄擲博山爐奉和經畧龐龍圖延州南城八詠迎薫亭華舘壓清波坐待南風至須知明牧賢善逹吾􅀂意供兵磑晨暮響寒泉飛輪駃風轉士飽氣益振􅁿與光零戰柳湖依依烟未歇漠漠風初靜浮花滿波面不見參差影飛蓋園軍中冨餘暇飛盖南城隈雍容陪後乗一一應劉才翠漪亭雕簷日華動滉瀁照漪漣四月芰荷滿不似在窮邉延利渠枝分清淺流縦横貫城市還如恩在人潤澤無終既縁雲軒逼漢敞髙巖縁雲結飛閣東山􅒝樹臐致足登臨樂禊堂簫鼔震陽休組練照芳洲意氣坐中客羞笑山隂逰天馬歌大宛汗血古共知青海龍種骨更竒網絲舊畫昔嘗見不意人間今見之銀鞍玉鐙黄金轡廣路長鳴增意氣富平公子韓王孫求買傾家不知貴芙蓉高闕北向開金印紫綬從天来路人回首無所見流風瞥過驚浮埃如何棄置歸皁棧踠足垂頭困羈絆精神慘澹筋骨羸舉目雙睛猶璀璨伏波馬式今巳無子阿肉腐骨乆枯舉世無人相騏驥憔悴不與駑駘殊神兵淬礪精芒在寳鑑逰塵肯終晦君今鬋剔被鳴鸞尚􅀎騰踏崑崙外河上督役懷噐之􅀉呈公明叔度時噐之鞠獄滄州河災汎東郡廬井多堙淪題輿得賢佐姁嫗安疲民遂令枯槁餘稍復蘇陽春伊人屏外飾倜儻窮天眞徒觀浩蕩波莫測江海津矧兹同府士一一随和珎公明抱全徳洞徹無緇磷叔度秉峻節竦􅀂凌霜筠顧兹不肖材亦齒幕中賔同依松栢隂共醉醍醐醇高論探要妙佳句裁清新有時縦歡謔盃案霑衣巾曽無禮節間但以風期親北州有疑獄兩造正紛綸當須于公断然後無􅁈人送行出郊岐􅀭鞭從此違隄繇春事起行役未成歸索居如㡬日河草巳芳菲徒然掩瑶瑟坐歎知音稀昨夜西南風夢中東北飛行行涉滄海髣髴睹容暉寤思益惆悵天長羽翼微離懐如栁色極目正依依華星篇時視役河上􅀉郡中諸同舍凉風净掃雲無迹海月未生星歴歴貝聮珠貫拱北辰三五縦横此何夕重樓疊榭出秋空鳷鵲露寒連桂宮瑶井逈臨丹􅇅外玉繩斜掛􅃈牎中征人逺别空閨悄鍾漏蕭疎天不暁碧紗展轉無復眠卧視寒光度華沼漢家賢􅀅戍臨洮結髪從軍今二毛誰憐身老心猶壮深入長占太白高豐城古劒沉淪乆匣中夜半雙龍吼乃知神物不自蔵紫氣依稀見牛斗有客離居望所親遥知清夜㑹苟陳隄繇未息無由去不及浮槎河畔人宿石堰聞牧馬者歌大河之曲多寛閒牧田枕倚長隄湾烏栖鵲散隄樹寂柝木聲稀宵欲闌牧児跨馬乗凉月歴歴繞群髙唱發幽情逸氣生自然往往鳴鞘應疎莭歌辭難辨野風髙似述離憂嗟役勞徘􅆦不断何妨近彷彿㣲聞巳復遥長川冷浸秋雲白露草飜光凝碧色星疎河淡夜初長展轉空亭奈􅀌客洞簫音律京君明可憐骨朽不更生安得使傳哀怨意爲我寫之羗笛聲楊白華勸君勿嫌楊花太輕薄籬下溝中紛漠漠翠鬟婢子不勝愁掃盡還飛滿朱閣晚來風雨送行春天無逰絲地無塵雪狂絮亂安可得􅀌樹青青愁殺人都下秋懐呈聶之美愚疎強從仕趣尚與時乖朅來遊京邑榮願知誰諧王國富英竒氣􅁚摽巖崖雲鴻送􅀟目攀援路可階秋風轉枯葉颯颯繞寒齋出門無所之飛塵滿天街夫君宦未逹猶得稱吾儕觧衣換斗酒且盡平生懐陪張龍圖南湖暑飲六言紅斾縈林却轉瓊筵就水重開荷香着衣不去竹色映酒遥來樓船㶑灔輕浪鷗鷺繽紛滿天清歌乆之未度畫梁塵落芳筵道傍田家道傍田家翁嫗俱垂白敗屋蕭條無壮息翁携鎌索嫗携箕自向薄田收黍稷静夜偷舂避債家比明門外巳如麻筋疲力弊不入腹未議縣官租稅足送李汝臣同年謫官導江主簿得喪且循環古今昧終始百歳落其間僅與毫芒似所以逹人心身外不復紀愁來􅀂亂絲疏解當以理昔君關外來籍籍聲華起憑案一濡毫萬言俱落紙老生闚其文色􅀂寒􅁅死閣筆不能下敢有疵瑕指或時抵卿相入門俱倒屣閽夫迎受謁不敢揚眸視觧褐吏邉州長塗初進跬蛟龍得尺水雙骼方嶷嶷西羗􅀒徳澤飛鏑聳邉鄙添兵十萬餘斗粟無支擬州郡走符檄縱横恣鞭箠閭閻浪愁苦卒食半糠粃上官知君才悉以儲糧委開倉募平糴至者車連􅁤嚴明束吏手誘諭提民耳留􅂖受金去􅀂與同儕市弦朔未云周露積丘山比曽無轉餉勞坐飽防秋士莫府上其功明詔深嘉美爲僚登九寺長人專百里聊用報勤劬未言窮任使何期逢怨讎意外成瘡痏刺骨舞文法吹毛出瑕滓清霜五月飛􅃤烈傷蘭芷鸞鳯失椅梧飄泊還荆枳聖朝方任能大過尚收齒况扵濟時具蹔然遭詆訾寜因青蠅惡遂取璠璵毁良工太上御名明堂必不遺􅂎梓勉哉益自立勿爲窮衰止人生難豫期神理無終否庸知今日憂不爲後日喜吾道誠無虧􅇄坎安足耻関山迤邐長百劒連天􅀝縈紆結危棧逈入雲星裏蜀􅀦富嬉逰花繁春酒㫖莫作弔原文投之岷江水春日書􅀉東郡諸同舍滑臺古鎭掲髙牙主人賢厚寳友嘉公庭退休射堂飲水沈緑李浮甘􅀲清言妙諭間詼謔笑語往反何喧譁别來汎濫􅀂浮梗塵愁俗累稠於麻提鞭俄盖觸風日􅃤澀滿眼飛埃沙朱門湛湛果深淺門外日擁千餘車閽人未肯即通刺指彈手版景欲斜就令入見亦何事氣象渺邈凌青霞圍碁角智賭勝􅀒拙者理與功名賖捨之歸入戸庭隘仰視青天如井蛙後檐數尺地荒􅁾不翦欲令生薺花當春寂寂但如此意恐至外逢紛華奈何勝友百餘里不可一見如天涯何時更共把巵酒側身北望空咨嗟和邵不疑校理蒲州十詩必飲亭亭有流盃渠飛盖名僚集臨流芳宴開縈紆漱文石次第傳清盃廻波亦多意并汎落花來涌泉石樞宻學士蔣公知府事得片石大如席上有數十竅莫知所施公問石工對曰此盖涌泉石也乃扵飲亭下鑿地為塪置石其上夏日從旁激水灌之躍髙數尺以清暑氣蒼然片石寒百道飛泉吐髙堂忽蕭颯坐失炎蒸苦蛟龍卧欲飛仰噀秋空雨翠樓條山翠氣横􅀮嶙秋空窄危樓雨初度卷幌延佳色撲撲滿前軒嵐光眞可摘碧樓烟瓦疊流璃危樓半空􅀝歌鍾奉髙宴聲來碧雲裏日暮天四垂黯澹如秋水静齋逸二句聊窺碧甃缺寒草生歴歴時聞山鳥呼未得全幽寂槐軒逸二字軒巳幽况復植宫槐簷外隂沈緑南山雨氣來逍遥不知乆驚此黄花開凉逸一字逸二句清風滿四境豈獨華榱下不􅀂楚臺人披襟獨蕭灑芙蕖軒荷花爛熳紅不見方塘水嶣嶤結飛閣苒惹清香裏露重忽欹側翩然翠禽起惜花亭春意復蹉跎園林日愁寂枝邉緑隂重砌下紅英積兹亭花最繁飄零尤可惜竹軒茂宻正當軒欹垂欲侵案風枝忽交戞月影争凌亂誠嘉君子心匪直林亭玩秋日􅀉山中友人昨夜聴秋風霜崖幾􅀣紅心随新鴈去宛至碧谿東聖主搜漁釣林巖今已空胡爲執髙節憔悴乆山中和之美舟行雜詩八首舟中夜坐風柳動蕭疎寒星浸寥落中宵四寂然時有逰魚躍汀沙落席帆岸栁縈單舸小市逺㣲茫簇水初燈火船行遇風蔡水僅成波不若江湖濬誠無傾側憂纜弱終難進野花喧喧桃李蹊何妨笑幽草但願保天眞徐共春風老水鴨攡縱出短蒲毰毸浴清水物忌太鮮明何妨染泥滓魚鷹翩然下林表不憚風湍惡得雋輒髙飛為君羞擊搏􅊻魚者弱篠絓􅁿絲盡日寒溪側􅀗少近知無溪魚皆爾識都門路紅塵晝夜飛車馬古今迹獨憐道傍栁慘淡少顔色呉冲卿直舍閻士安畫墨竹歌閻生畫竹舊􅀁聞望中一見遥可分伊予不甚少佳畫猶愛氣骨髙出羣狂枝怒葉凌絹素勢􅀂飛動争紛紜蟠根數節出地底上有積年蒼蘚紋森然直榦忽􅀌聳意恐出屋排浮雲秋風颯颯生左右耳目灑落遺塵氛乃知良工自神觧昧者倣習徒艱勤子猷昔者得收玩不患終朝無此君和之美河洲四詩冉冉河洲暁晴霞登木杪稍見水烟開􅀌舟天際小杳杳河洲晚客行殊未返目随林鳥還心共征鴻逺寂寂河洲夜蘆花繞墟舍􅀌客乆未眠窓燈落寒灺漠漠河洲雨依稀辨村聚時哉鷗鳥群凌亂争鳴舞又和夜雨宿村舍積雨乆未闋豈徒行客憂夜聞屋中人嘆息悲田疇方春播殖時種食皆外求鞭訶犯赤日酷烈慚羸牛草薉競禾長從人借鉏耰晨薅戴星起日闇未能休豈無一時勤所覬歳有秋今兹昬墊災大壄成洪流直疑滄海溢􅗀栗浮陵丘昔時百丈原汎汎皆挐舟喬木失端杪飢鳥下無投黍稷沈黄泥圭合安可收嗟予乏技能無以易糠麰販鬻固􅀁昧敢詫市井逰欲依盗賊群懦不閑戈矛巳哉任天地無益徒為愁一身無死所况爲妻兒謀之美愛物者凄然涕霑裘一夫有不􅀗伊尹爲深羞何當富斯民比屋囷倉稠惜哉椂秩卑此志終宜酬送伊􅇅王大夫歌于嗟古之道邈既逺􅀆日陵夷而就衰群儒角逐異端競進􅀆聖塗榛枳幽昧而難知君獨恥從衆人之後􅀆軒然髙舉逺取而窮追撥去虹蜺汛掃氛濁􅀆廓然廼得睹夫朝曦授邑於雒之南􅀆始者既學今得而施歸風俗於醇厚􅀆又何西門卓魯之足為消奸化桀折牙杜蘖􅀆寂不知其所知何者為令之徳􅀆黄童皓首接手而逰嬉菽粟露積牛羊被壄􅀆百里獨比於太古之時予願解冠棄佩􅀆受一􅌀於伊之埜蓑身笠首􅀆同邑民以熈熈送韓太祝維歸許昌賦得交字王城名利窟冠盖鬱相交夫君獨鳯舉彯然去喧呶頴水清可濯箕山髙可巢反顧公相榮一芥浮堂􅉾缺大吕重豈知􅁿斗筲蒼蒼氣象嚴萬木擁寒郊缺􅀧隈曲初旭染林梢去去善自將因聲訪衡茅和興宗夜直聴雨缺茫凍雨來入夜勢増急縱横挾春風飄灑相噴吸敗䆫端見欺􅃍有萬􅀧入先生伏經編眼冷倍昬澀夜分僮㒒倦跛􅀝厭乆立燈火爲溟􅄥詩書亦霑濕夫君儲善價未售不悁悒物華迎霽新佳賞時將及囷中秫幾何營釀須汲汲和之美諷古二首曲逆從漢祖出竒誰與讓一朝􅀉天下不及王陵戇海客乆蔵機鷗知人未知如何毫末利管鮑亦相欺和之美二貧詩君子尚仁義寳用爲身資其人苟不賢富饒亦胡爲所以回憲徒不厭糠與藜當時萬金産令名傳者誰之美初解褐爲吏長河湄月得數斗禄僅足供饘糜謂言家無寳不必修藩籬囊衣不自暖乃為偷意窺穿墉入其室探取無纎遺從事借之帶同列乞其衣日高服未具不敢踰門畿蕭條四壁寒獨立空自嗤援毫引幅帋書作二貧詩上言運命邅温飫無時期下嗟職事勞舊學日以􅈥乃知賢者心不獨憂寒飢􅇄坎雖益多志業終無衰我實甚貧者視君猶白圭行年三十餘碌碌無他竒庇身太學官旦夕唯塩虀讀君二貧作我事借君詞君誠士林秀不免青衫卑滿腹豈無才抱蓄未有施不用固為小用之活烝黎如君有此富豈必蔵珠璣財貧非道貧巳矣何嗟咨送薯蕷苗與興宗客從魏都來貽我山藷實散之膏土間春苗比如􅌨吾家庭户狹􅀣藝苦其宻危根逓扶戴怒牙猶怫􅉱興言念伊人好嗜與我一家蓄桐君書喜觀汜氏述雖為簮帶拘雅尚林樊逸分獻取其誠豈容羞薄物况聞知藥者餌此等苓术願益君子年康直體無疾散誕得寛壤繁大宜無日蕭梢新蔓抽苯䔿故叢失入冬霜霰嚴葉落掊可出伸如猿臂長拳􅀂熊膰腯拾木㸑銅鼎相期聚書室誰得與其徒谿茶與山栗答昌言求薯蕷苗冬實散肥壤春苗動新葉雅意非遺人野情聊自愜何言好事者求訪來相疊會種十畒餘坐取詩盈篋送冷金牋與興宗蜀山痩碧玉蜀土膏黄金寒谿漱其間演􅃞清且深工人剪稺麻􅉒之白石砧就谿漚爲紙瑩􅀂裁璆琳風日常清和小無塵滓侵時逐賈舟來萬里巳江潯王城壓汴流英俊萃如林雄文溢箱篋争買傾竒琛夫君乃冠冕辭氣髙千㝷十載為舉首扵今猶陸沈嗟我蓄此紙才藻不足任願以寫君詩益為人所欽縞帶豈多物足明同好心黄鍾聲如雷豈病無知音請以此為質他年神􅀁臨華軒策駟馬御名勿忘遺簮謝興宗恵草蟲扇呉僧畫團扇􅀧綴成微蟲秋毫宛皆具獨竊天地功細者及蛛蝥大者纔阜螽枯枝擁寒蜩黄蕋黏飛蜂翾然得生意上下相追從徒觀飛動姿莫睹筆墨蹤兒曹取真物細校無不同恐其遂躍去亟取蔵箱中乃知藝無小意精神可通不與誤圗蠅能惑紫髯翁子猷状彈雀蔵寳傳江東不知古何如此畫今為雄人墓木巳拱其徒頗能工舊法􅔅百一要足超凡庸友人幸爲賜物薄意何􅂭玩之不替手愛重心無窮常如對君子穆穆來清風和昌言官􅃕十題石榴花靈根逐漢臣逺自河源至流離遍中壤今兹盡苗裔畏日助殷紅凍雨滌濃翠冝携避暑客花下縱横醉薏苡佳實産南州流傳却山瘴如何馬伏波坐取丘山謗夫君道義白復為神明相厲氣與流言安􅀎逞無状石蘭楚人歌紫蘭華禁無傳乆循名意兹是誰得明眞否天憐菊性􅀌秀􅀤秋風後固令芳物生聊作黄花友萱草葉濯宿露翠花迎朝日黄昔誰封殖此儼列侍髙堂逹士􅀮於吏孰爲行與蔵逍遥玩永日自無憂可忘蜀葵白􅀂繒初㫁紅如顔欲酡坐疑僊駕嚴幢節紛駢羅物性有常妍人情輕所多菖蒲儻日秀棄擲不吾過畦蔬􅂩土惜荒棄剪治成春畦講雩時澤洽葵荏高參差釃渠􅀂貫脉疏塍如畫棊爲吾謝來客桔槔毋語機水紅夢想水郷逰堦庭植籠古宛如江外行髙帆落寒浦煙枝静疎秀風穂閒低舉扵今看未好漠漠宜秋雨甘菊野菊細􅃈物籬間私自全徒因氣味殊不為庖人捐采升白玉堂薦以黄金盤願􅀂南陽守永扶君子年蘭賢者非無心園夫自臨課蓺植日繁滋芬芳時入座青䓗春茹擢皎㓗秋英堕正苦郢中人逸唱高難和病竹園竹乆不治蕪没真可弔豈無枯槁客蕭疎自殊調至人愛高節命斧除藜藋何用報至恩清隂與長嘯送文慧師歸眉山􅀿符至人心如雲去住唯所適飄颻涉四海豈復校喧寂朅來王城逰紅塵瞹晨夕忽思還故峯不可留宿昔離合皆自然扵何􅀉驩戚從兹坐林下白首傲泉石山鳥集掌中巴猿侍瓶錫寺前烟蔓深何處求行迹風林石歌蔡著作抗字子直得此石扵朱陽山聞君家有風林石鐫刻無痕畫無迹靡然合勢俱左傾偃蹇常如負風力置之坐側野意生静聴􅀂有颼颼聲忽疑身世在丘壑使我蕭然無俗情黄金白璧豈非好子直視之不為寳興宗南園草盛不翦僕過而愛之爲詩以贈君家在何許逺與南城鄰車馬不甚繁門前無俗塵有園廢鉏治繞舍皆荆榛入夏益滋蔓鬖鬖高没人豈無舊桃李蕪雜與之均謂言彼草木扵我奚疎親扵間置取􅃕豈得完天真不􅀂任其然同受雨露仁物性且不違人心何緇磷閉戶不迎客箕踞無冠巾苟忘軒冕縈何異巢居民古詩贈興宗窮逹有常分得喪難豫言古今浩茫茫􅀝伏安可原軒裳彼自榮舉俗同崩奔錙銖校重䡖氷火殊凉温君子固無愧立身明本根度矩苟不愆寵辱徒喧喧有如清濟流横貫長河渾景公馬千駟南靣雄東藩陶青劉舍徒位爲丞相尊當時非不顯磨滅何足論顔回在陋巷藜藿甘盤飱原憲結弊衣蓬蒿塞其門當時豈不窮至今榮名存况君齒方壮德業素所敦安知搨翅歸不作凌雲飜要之白首期壮烈施元元為君畫善策灑掃清前軒長舒四五榻客來輒開樽群愁喜伺人稍醒必煩寃拒之亦無他體中常昬昬出都日塗中成以下請告歸省及之汾隂省兄時所爲賤生習山野愚陋出扵骨雖為冠帶拘性非藩籠物揚鞭出都門曠􅀂解徽紼是時天風惡靈沼波蕩汩龍鬛互騫騰鷗群逺浮没川原寖疎豁烟火稍蕭瑟草木雖未榮春態先髣髴桑稀林已斜柳弱條可屈蛛絲骨晴陽䑕土壅新窟徐驅欵叚馬放轡不呵咄與爾同逍遥紅塵免蓬勃重經車輞谷昔年道經車輞谷直上七里鹽南坡今年行役復到此方春流汗如飜波中塗太息坐盤石涕泗不覺􅀟滂沱我生微尚在丘壑強􅀂麋鹿嬰虞羅人踰三十只有老後時過此知如何雲泉佳䖏須速去登山筋力行蹉跎送巢縣崔尉弱歳家淮南常愛風土美悠然送君行思逐髙秋起巢湖映微寒照眼正清泚低昻蹙荷芡明滅縈葭葦銀花鱠肥魚玉粒炊香米居人自豐樂不與他郷比况得良吏來倍復䝉嘉祉君為太學生氣格巳英偉登科如拾遺舉歩歘千里毋嫌位尚㣲觀政此爲始尊公乆􅂣屋上國困􅅺滓豈不重相離念子勉爲理當令佳譽新燁燁滿人耳高堂雖在逺聞之足為喜何必羞三牲然後稱甘旨酬宋次道初登朝呈同舍林葩積浮脆煙霧矜春姿山桂結芳堅氷霰横秋枝夫君名卿嗣華實􅀟葳㽔如何仕不偶通籍鬂生絲豈非秋桂􅀋不足煩嗟咨我今三十餘汩没無他竒正恐食浮人敢言位猶卑同登天子廷自視誠非宜清朝正求治諌路方坦夷太平可立致此任非君誰温國文正公文集卷第二
