body:
  text: 章奏二十一留吴奎劄子作中丞􅀄上殿劄子乞罷詳定押班劄子留韓吕劄子御殿劄子宰臣押班第二劄子乞訪四方雨水劄子乞簡省舉御史條約劄子聽断書乞不更責降王陶劄子王廣淵劄子髙居簡劄子王廣淵第二劄子賑贍流民劄子留吴奎劄子臣竊聞王陶除樞宻直學士知陳州吴奎除資政殿學士知青州外議籍籍皆以爲奎不當去所以然者蓋由奎之名望素重於陶雖今者封還詔書徑歸私苐舉動語言頗有過差然外庭之人不知本末但見陛下爲陶之故罷奎政事其罰太重能不怪駭如此臣恐其餘大臣皆不自安各求引去陛下新登大寳先帝梓宫在殯􅀂舉朝大臣紛紛盡去則於四方觀聽殊似非冝臣愚欲望陛下収還奎青州勑告且留奎在政府以慰士大夫之望安大臣之意陛下以奎違詔而黜之威令巳行嘉奎質直而留之用意􅀹美奎始􅀒大譴懾服陛下之英断終蒙開釋銜戴陛下之深恩上下驩恱誠無所損昔漢髙帝疑蕭何受賈人金械繫於獄感王衛尉一言赦令復位君臣恩禮相待如􅀄况於出入之間何爲不可復留也陛下素知臣非朋附大臣之人故敢不避形迹極意盡言但爲朝廷惜大體耳乞賜裁察取進止作中丞􅀄上殿劄子臣聞澄其源則流清固其夲則末茂臣蒙陛下聖恩抜於衆臣之中委以風憲天下細小之事皆未足爲陛下言之敢先以人君修心治國之要爲言此誠太平之原夲也臣聞修心之要有三一曰仁二曰明三曰武仁者非嫗煦姑息之謂也修政治興教化育萬物養百姓此人君之仁也明者非煩苛伺察之謂也知道義識安危别賢愚辨是非此人君之明也武者非強亢􅁀戾之謂也惟道所在断之不疑姦不能惑佞不能移此人君之武也故仁而不明猶有良田而不能耕也明而不武猶視苗之穢而不能耘也武而不仁猶知穫而不知種也三者兼備則國治強闕一焉則衰闕二焉則危三者無一焉則亡自生民以來未之或改也治國之要亦有三一曰官人二曰信賞三曰必罰夫人之才性各有所長官之職業各有所守自古得人之盛莫􅀂唐虞之際稷契皐陶垂益伯夷䕫龍各守一官終身不易苟使之更來迭去易地而居未必能盡善也故人主誠能収采天下之英俊隨其所長而用之有功者勸之以重賞有罪者威之以嚴刑譬如乗輕車駕駿馬緫其六轡奮其鞭䇿何往而不可至哉昔仁宗皇帝之時臣􅀄爲諌官上殿首曽敷奏此語先皇帝時臣曽進歴年圖又以此語載之後序今幸遇陛下始初清明之政虚心下問之際臣復以此語爲先者誠以臣平生力學所得至精至要盡在於是願陛下勿以爲迃闊試加審察􅀂果無可取則臣無所用於聖世矣取進止乞罷詳定押班劄子臣竊聞宰臣復有文字乞下禮官詳定合與不合押班臣聞王者設官分職譬猶一躰以宰相爲股肱以臺諌爲耳目固當同心恊力以佐元首􅀂各分彼我互爭勝􅀒欲求其身之安何由可得近者御史中丞王陶請宰相依舊制赴文徳殿押班宰相􅀂從其所請豈有後來紛紜乃堅執不行迭相激發遂致王陶語言過差今王陶旣􅀘外官宰相巳赴押班臣謂朝廷可以無事矣而宰相復有此奏萬一禮官有希旨迎合者以爲宰相不合押班臺司欲黙而不言則朝廷之儀遂成􅈥廢欲辨論是非則與前日之事有何所異是闘訟之端則無時休息也陛下新即天位四方之人舉首傾耳以觀大化而朝廷不聞肅雍濟濟之風數有變色分爭之醜臣竊爲陛下惜之况今災異屢降飢饉荐臻官多而用寡兵衆而不精冗費日滋公􅀻困竭戎狄桀傲邊鄙無備百姓流亡盗賊將起朝廷夙夜所憂冝以此數者爲先而以餘事爲後伏望陛下特降聖旨令宰臣依國朝舊制押班所有下禮院文字乞更不令詳定取進止留韓吕劄子臣竊聞巳有指揮龍圖閣直學士韓維差知頴州侍御史吕景與堂除通判未知信否臣愚竊見韓維沈靜方雅於陛下疇昔官僚之中最有美譽今者無故稱病求出外人皆不知其故吕景渾厚剛直於今日言事之臣亦爲難得其人身爲臺官坐言事罰銅誠使羞辱難以立朝不􅀂得貶竄之爲快也然二人者皆陛下腹心耳目之良臣一旦俱從外􅀘二人甚爲私便臣竊爲陛下惜之伏望聖慈更賜詳度或且留之左右使拾遺補闕誠有所禆益必􅀂不可留者其臺官乞更不舉人只於舊臺官吕大防郭源明馬黙等數内斷自聖意選擇一人以補其闕所貴得質直之人克厭衆心取進止御殿劄子臣竊見今月十五日陛下以服藥不受慰群臣無不憂疑臣竊惟萬乗之主起居動靜繫天下安危况今國家多事之際􅀹冝深思逺慮􅀂來日聖體全未得安臣不敢言􅀂稍得痊愈伏望陛下勉強御前殿或後殿暫見群臣􅀂有奏事乆不退者雖諭以近新服藥難爲乆坐使之且退亦無所害但使群下略得瞻望清光則中外之心自然安帖取進止宰臣押班第二劄子臣伏覩今月七日勑文准四日手詔今後宰臣赴文德殿押班自春分後或遇辰牌上秋分後遇辰正牌上垂拱殿視事未退止令傳報宰臣更不過令御史臺一靣放班餘日並依祥符勑命指揮永爲定制所有前降下太常禮院詳定文字更不施行者臣竊見從来垂拱殿視事比于中書樞宻院及其餘臣僚奏事畢春分以後少有不過辰初秋分以後少有不過辰正自陛下臨御以來惟近因服藥曽於辰牌以前駕起入内自餘皆在辰牌以後然則自今以往無事之日宰臣永不赴文徳殿押班也臣切惟文德殿爲天子正衙宰臣爲百僚師率百僚旣在彼常朝則宰臣理當押班斯乃前世舊規自祖宗巳來未之或改今陛下即政之始事非有大利害者恐未湏更張㐲望陛下特降聖旨令宰臣一依國朝舊制押班􅀂陛下以前者巳降手詔必欲限以時刻者即乞自春分後遇辰正牌上秋分後巳牌上並依今月四日指揮施行猶庶幾此禮不至遂廢取進止乞訪四方雨水劄子臣竊見陛下近以乆旱爲災分命使者徧祈嶽瀆靡神不舉精誠感通甘雨降集誠中外之大慶然暑月􅁀雨多不廣逺臣切慮四方州縣尚有未霑足之處王者以天下爲家無有逺邇當視之如一不可使惻隱之心止於目前而巳仐者京城雖巳得雨伏望陛下不可遽以爲秋成可望怠於憂民凡内外臣僚有新自四方来者進對之際皆乞訪以彼中雨水多少苗稼如何榖價貴賤閭閻憂樂互相參考以驗虚實旣可以開益陛下聦明日新盛德又使逺方百姓皆知陛下燭見幽逺無所遺忽銜戴上㤙傾心歸附又使州縣之吏皆知陛下憫䘏􅀺元留心稼穡不敢自恃僻逺殘民害物陛下一發德音而収此三善非獨可以行之今日亦願陛下永乆行之誠天下幸甚取進止乞簡省舉御史條約劄子臣聞法制之設貴於簡要而失在煩苛官人之道以得賢爲夲而資序爲末昔東漢之襄立三互之法㛰姻之家及兩州人士不得對相監臨以是幽兾二州乆缺不􅀘蔡邕甞上䟽極陳其弊然則詳其末而遺其夲非治丗之政也伏見國家毎選御史官湏中行貟外郎以下太常慱士以上差遣湏通判資序其餘條約甚多是以百僚之中可舉者至少舉而得中者􅀹稀近日以来爲􅁦益甚蓋以屢有覃恩官品多髙而差遣未至幸而有資序相值者則又未必賢矣夫御史之職伹當求忠亮方正之人區區資序何足比較臣愚欲望朝廷自今毎舉御史其前行貟外郎以上即以夲官兼侍御史三丞以下及知縣資序即具充裏行不復更湏逐次陳請庶幾取人路廣有可選擇取進止聽断書月日具位臣某昧死再拜上書皇帝陛下臣材識駑鈍陛下過聽擢備憲司臣夙夜盡心以思厥職隕首􅂢軀無足爲報竊見近歳以來政府言職迭相攻毀分爲兩朋有如讎敵所以然者盖由人臣各務逞其私志互爭勝􅀒不顧已之是非人主不忍違逆人情兩加全護不肯判其得失是以群下紛紛曰闘於前而朝廷爲之多事者也臣伏見陛下天性聦明仁孝恭儉踐阼之初孜孜求治此誠堯舜之資群生之福也群臣幸得遭遇此時不務將順聖德紀綱治體革政事之乆弊救百姓之疾苦而各爲私闘不知窮極誠可罪也臣聞人君之尊與天地同體以剛徤爲德以重厚爲威照微當如日月發言當如雷霆昔漢武帝謂田蚡曰君除吏盡未吾亦欲除吏又謂衛青曰郭解布衣權至使將軍自言此其家不貧人主之言􅀂皆切當如此群臣安得不畏服哉夫心知其非而面徇其情口順其􅀃依違兩可此最人君之大患也今國家政事未有不先經兩府相與商議然後施行􅀜防秘宻外人莫得而知及詔令已下臺諌方得聞之􅀂事有未便從而論列陛下還復下之兩府人之常情自非大賢誰肯以已之所謀爲非而以它人之言爲是哉必須排擯沮抑以爲難從此人主之所以獨取拒諫之名而大臣私得專􅁠之便者也臣愚伏望陛下自今應有臣僚上言朝廷闕失者陛下當清心審慮自以大公至正之道決之􅀂大臣所謀果是不必顧恤言者言者所陳果當不必曲順大臣之意位無髙下言無先後唯是之從又何紛紜之足患哉必􅀂其人等固有爭執者陛下亦當再審察更以理道往返與相詰難以盡其情果有可取勿憚改爲􅀂漢宣帝之於趙充國則萬事無不當矣必􅀂理道是非顯然在目而其人執迷文過強很不巳者雖加罪黜天下豈以爲不可哉如此則豈惟事得其正亦使威福之柄盡歸帝室矣凡天下之事是非未明則不可不慎是非旣明則在陛下决而行之臣前日所謂惟道所在斷之不疑姦不能惑佞不能移者正謂此也伏惟聖明俯加裁察臣某昧死再拜乞不更責降王陶劄子臣竊聞政府以王陶上表言辭狂率恣爲詆毀多過其實欲有敷奏乞重加責降審或如此恐不可許何則自仁宗皇帝巳來委政宰輔宰輔之􅁠誠爲太重加以臺諌官被貶者多因指大臣之過失少因犯人主之顔色是威福之柄潜移於下陛下方將􅁬乹剛之盛德伸元后之威断収還利噐以救其弊今者王陶肆其􅄶心失於詳審言語不宻流布逺近雖實有罪然陶前者出知陳州陛下蓋以先帝梓宫在殯特爲大臣屈意行之今􅀂又以表文詆毀大臣重加責降臣恐人主之權益去大臣之􅀔遂成興衰之機於此乎在不可不察也臣愚伏望陛下於執政進呈王陶謝上表之際但諭以躁人之辭不足深罪前巳左遷在外豈可更加貶責􅀂其再三執奏陛下當正色語以王陶前作中丞譏切朕躬非無過當之言朕亦未甞加怒欲以開廣言路豈可觸犯卿等則必欲再三責降方爲快意邪􅀂猶執奏不已者陛下但不復應荅彼當自退所以然者非以保全王陶蓋欲使其餘臣僚知陛下英武可恃萬一它日大臣有欺罔聦明爲大罪者群臣敢言之耳凡此皆陛下聖智所能自知臣復屑屑盡言者誠荷陛下不丗之恩貪於報効不復自顧形迹之嫌故也取進止王廣淵劄子臣聞明君之政莫大於去姦忠臣之志莫先於疾邪陛下不知臣無似使待罪憲府受任以來於今踰月而寂無所糾誠􅀒大恩伏見直龍圗閣兼侍讀王廣淵以小人之質有傾巧之材苟求進身無所不至外依政府内結近習數年之間致位清顯國家夲以龍閣寵賢彦迩英待儒雅皆非廣淵所冝濫處陛下即位以來未聞放黜姦邪以警群臣廣淵於朝列之中為姦邪之􅀹者伏望陛下􅁬發乾剛首加斥逐奪去職名除一逺地監當亦足以醒天下之耳目取進止髙居簡劄子臣聞古人有言堂上不糞則郊草不瞻曠耘近者不治則不暇及逺也竊見勾當御藥院髙居簡資性姦回工䜛善佞乆處近職罪惡甚多臣謹案祖宗舊制勾當御藥院官至内殿崇班以上即湏出外蓋以日月寖乆官資稍髙則防其慿恃威靈竊弄權柄逺鍳漢唐之禍深爲子孫之慮故也陛下即位之􅀄内臣以覃恩遷官者盡􅀘外職獨留御藥院四人天下首以此一事譏陛下之失况居簡於衆人之中最爲狡猾而陛下特加寵信待以腹心中外指目大玷聖徳臣職在繩糾不敢不言伏望聖慈遵祖宗令典應句當御藥院官至崇班以上者盡授以向外差遣其髙居簡乞逺加竄逐以解天下之惑取進止王廣淵第二劄子臣近曽上言直龍圖閣兼侍讀王廣淵傾巧姦邪乞盡奪去職名除一逺地監當至今未聞指揮臣竊惟廣淵所爲布聞海内陛下昔在宫邸豈不備知何寂微臣更有詳述書曰任賢勿貳去邪勿疑此大舜所以成大功也陛下􅀂未知廣淵之爲賢與不肖尚容致疑若果知廣淵姦邪之狀則豈可復置之左右而不速去之哉夫佞人者巧於求合變故萬端雖聖賢所不能察是以帝堯畏巧言令色孔壬而孔子教顔淵以逺佞人夫尭與顔淵非不明也苟不畏而逺之則有時而惑之矣伏望陛下依臣前奏其王廣淵早賜黜逐取進止賑贍流民劄子臣竊見朝廷差官支撥粳米於永泰等門遇有河北路流民逐熟經過即大人毎人支米一斗小兒支與米五升仰子細告諭在京難以住泊今速往近便豐熟州軍存活者臣竊思之如此處置欲以爲恤人之名掩人耳目則可矣其實恐有損無益何以言之曏者或聞河北有人訛傳京師散米者民遂襁􅀒南来今􅀂實差官散米恐河北飢民聞之未移者因兹誘引皆来入京京師之米有限而河北流民無窮旣而無米可給則不免聚而餓死如前年許潁二州是也今禾苗旣傷於旱蝗蝻日益滋生秋田豐歉殊未可知一斗五升之米止可延數日之命豈能濟其飢饉之厄哉凢民之情見利則趨之見害則避之􅀂京師可以住泊雖驅之亦不肯去􅀂外州可以存活雖留之亦不肯止固非數人口舌所能告諭故臣以爲有損無益也臣聞民之夲性壞土重遷豈樂去其郷里捨其親戚棄其丘壟流離道路乞匄於人哉但以豐稔之歳粒米狼戾公家旣不肯収糴私家又不敢積蓄所収之榖隨手糜散春指夏熟夏望秋成上下偷安莫爲乆計是以稍遇水旱螽螟則糇糧巳絶公私索然無以相救仰食縣官旣不能周假貸冨室又無所得此乃失在於無事之時不在於凶荒之年也加之監司守宰多不得人視民之窮曽無矜閔増無名之賦興不急之役吏縁爲姦蠹弊百出民搏手計窮無以爲生則不免有四方之志矣意謂它處必有饒樂之郷仁惠之政可以安居遂伐其桑棗撤其廬舎殺其耕牛委其良田累丗之業一朝破之相擕就道􅀂所詣之處復無所依使之進退失望彼老弱不轉死溝壑壯者不起爲盗賊將安歸乎是以聖王之政使民安其土樂其業自生至死莫有離散之心爲此之要在於得人以臣愚見莫􅀂謹擇公正之人爲河北監司使之察災傷州縣守宰不勝任者易之然後多方那融斛斗各使賑濟夲州縣之民􅀂斛斗數少不能周徧者且湏救土著農民各據版籍先從下等次第賑濟則所給有限可以䂊約矣􅀂冨室有蓄積者官給印暦聽其舉貸量出利息候豐熟日官爲収索示以必信不可誑誘則將來百姓爭務蓄積矣如此飢民知有可生之路自然不棄舊業浮遊外郷居者旣安則行者思返􅀂縣縣皆然豈得復有流民哉臣前曽上言王者以天下爲家不可使側隱之心止於目前而已此特河北流民路過京師者耳竊聞其它災傷之處流民亦爲不少􅀂臣言可采伏望聖慈依此行之取進止温國文正公文集卷第三十六
