body:
  text: 章奏三日食遇隂雲不見乞不稱賀狀嘉祐六年五月二十八日上是嵗果大雨不見日食不復稱賀自後踵以為常右臣准太常禮院公文司天監奏今年六月朔太陽交食臣伏覩近世以來每有日食之變歴官皆先具月日時刻及所食分數奏聞至日或為隂雲所蔽或所食不滿分數公卿百官皆奉表稱賀以為大慶臣愚以為日之所照周徧華夷雲之所蔽至為近狹今若太陽實虧而有浮雲翳塞雖京師不見四方必有見者此迺天戒至深不可不察臣聞漢成帝永始元年九月日有食之四方不見京師見谷永以為沈湎于酒禍在内也二年二月日有食之四方見京師不見谷永以為百姓屈竭禍在外也臣愚以為永之所言似未恊天意夫四方不見京師見者禍尚淺也四方見京師不見者禍寖深也日者人君之象天意若曰人君為隂邪所蔽災慝明著天下皆知其憂危而朝廷獨不知也由是言之人主尤冝側身戒懼憂念社稷而群臣乃始相率稱賀豈得不謂之上下相䝉誣罔天譴哉又所食不滿分數者歴官術數之不精當治其罪亦非所以為賀也伏望陛下明勅有司若六月一日果有日食之異或四方見京師不見或所食不滿分數皆不得奉表稱賀以重皇天之怒則天下幸甚臣職在禮部掌羣臣慶賀章表不敢不言陳三徳上殿劄子得㫖留中三劄並初除諌官上臣伏䝉聖恩不以臣無似擢臣為諌官臣自㓜學先王之道意欲有益於當時是以雖在外方為他官猶願竭其愚心陳國家之所急况今立陛下之左右以言事為職陛下仁聖聪明求諌不倦羣臣雖有狂狷愚妄觸犯忌悔陛下皆含容寛貸未嘗加罪誠㣲臣千載難逢之際苟不以此時傾輸胷腹之所有以副陛下延納之意則不可以自比於人死有餘罪矣臣竊惟人君之大徳有三曰仁曰明曰武仁者非嫗煦姑息之謂也興教化修政治養百姓利萬物此人君之仁也明者非煩苛伺察之謂也知道義識安危别賢愚辨是非此人君之明也武者非彊亢暴戾之謂也惟道所在斷之不疑姦不能惑佞不能移此人君之武也故仁而不明猶有良田而不能耕也明而不武猶視苖之穢而不能耘也武而不仁猶知穫而不知種也三者兼備則國治彊闕一焉則衰闕二焉則危三者無一焉則亡自生民以來未之或改也臣不勝區區觸死忘生竊見陛下天性慈惠慎㣲接下子育元元汎愛羣生雖古先聖王之仁殆無以過然自踐阼以來垂四十年夙夜孜孜以求至治而朝廷紀綱猶有虧缺閭里窮民猶有怨歎意者羣臣不肖不能宣揚聖化將陛下之於三徳萬分之一亦有所未盡歟臣聞春秋傳曰賞慶刑威曰君臣幸得以修起居注日侍黼扆之側伏見陛下推心御物端拱淵黙羣臣各以其意有所敷奏陛下不復詢訪利害考察得失一皆可之誠使陛下左右前後股肱耳目之臣皆忠實正人則如此至善矣或出於不意有一姦邪在焉則豈可不為之寒心哉夫善惡是非相與混淆若待之如一無所别白或知其善而不能賞知其惡而不能罰則為善者日懈為惡者日勸善者懈惡者勸雖有堯舜禹湯文武之君稷契伊吕周召之臣以之求治猶鑿冰而取火適楚而北行也伏惟陛下少垂聖思以天授之至仁廓日月之融光奮乾剛之威斷善無㣲而不禄惡無細而不誅則唐虞三代之隆何逺之有此臣愚淺所見不敢不陳取進止言御臣上殿劄子得㫖送中書臣聞致治之道無他在三而已一曰任官二曰信賞三曰必罰康誥稱文王之徳曰庸庸祗祗威威顯民言用其可用祗其可祗刑其可刑也臣竊見國家所以御羣臣之道累日月以進秩循資塗而授任苟日月積乆則不擇其人之賢愚而置髙位資塗相值則不問其人之能否而居重職夫人之材性各有所冝而官之職業各有所守自古得賢之盛莫若唐虞之際然稷降播種益主山林垂為共工龍作納言契敷五教臯陶明刑伯夷典禮后䕫典樂皆各守一官終身不易苟使之更來迭去易地而居未必能盡善也今以羣臣之材固非八人之比廼使之遍居八人之官逺者三年近者數月輙已易去如此而望職事之修功業之成必不可得也非特如是而巳設有勤恪之臣悉心致力以治其職羣情未洽績效未著在上者疑之同列者嫉之在下者怨之當是時朝廷或以衆言而罰之則勤恪者無不觧體矣姦邪之臣􅃷竒以譁衆養交以市譽居官未乆聲聞四逹蓄患積弊以遺後人當是之時朝廷或以衆言而賞之則姦邪者無不爭進矣所以然者其失在於國家采名不采實誅文不誅意夫以名行賞則天下飾名以求功以文行罰則天下巧文以逃罪如是則為善者未必賞為惡者未必誅此陛下所以南面孜孜夙夜求治歴載甚乆而太平未效者也陛下誠能慱選在位之士不問其始所以進及資序所當為使有徳行者掌教化有文學者待顧問有政術者為守長有勇略者為將帥明於禮者典禮明於法者主法下至醫卜百工皆度材而授任量能而施職有功則増秩加賞而勿徙其官無功則降黜廢棄而更求能者有罪則流竄刑誅而勿加寛貸如是而朝廷不尊萬事不治百姓不安四夷不伏臣請伏面欺之誅凡臣所言皆陛下耳所厭聞心所素知然致治之要無以易此知之非艱行之惟艱顧陛下力行何如耳敢昧死陳瞽言惟陛下裁擇取進止言㨂兵上殿劄子得㫖送宻院戒揀兵臣僚臣竊聞朝廷近降指揮㨂選諸指揮兵士補填近上軍分其主兵之官惟務人多不復精加選擇其間明知羸弱悉以充數臣以耳目踈短聞之後時不能豫陳可否致事巳施行然其得失利害之明不可不盡為陛下言之徃者不可及來者猶可追也臣竊惟當今國家之患在於士卒不精故四夷昌熾財用不足故公私窘廹今縱不能澄汰衰老以省大費而又平居晏然非有警急坐増無用之衆以長無窮之患臣不知為國計者果如何也方今天下安樂無虞而府庫之積隨得隨散曽無羨餘設不幸有螽螟水旱饑饉相仍盗賊猝起戎狄内侵不知陛下將何以待之此不可不為之先慮也臣竊觀自唐室募兵以來果能得武猛材力之士猶為有益若不擇勇怯而養之臣不知其可也唐德宗以神䇿軍使白琇珪為京城召募使應募者皆市井沽販之人有名無實及涇師犯闕徳宗命琇珪以神䇿軍禦之卒無一人至者徳宗狼狽失據遂幸奉天及五代之際軍政尤紊是以叛亂接迹禍敗相尋周世宗以髙平之戰士卒不精故樊愛能何徽所部先奔歸而大閲諸軍悉簡去老弱選其精鋭以為侍衛親軍由是甲兵之盛近世無比故能南割淮甸北取闗南羣雄畏服所向無敵太祖皇帝受天明命撫有大寶當是之時戰士不過數萬北禦契丹西捍河東以其餘威開荆楚包湖湘巻五嶺吞巴蜀掃江南服吴越太宗皇帝紹丕烈奮神威遂拔晋陽一統四海堂堂之業萬世頼之今天下兵数臣不能盡知竊聞比於太祖皇帝時其多數倍然元昊𦍑戎之竪子智髙蠻獠之㣲種乃敢倔强河西横行嶺表國家發兵討之士卒或望塵奔北或迎鋒沮潰毁辱天威為四夷笑由是觀之養兵之術務精不務多也且今所選之兵升其軍分増其糧賜是冝感戴上恩人人喜悦而竊聞京城之内被選之人徃徃咨嗟悲怨父子相泣况於外方兵士違去鄉里訣别親戚其為愁苦不言可知使中外人情遑遑如此豈惟乆逺之害亦不可不以切近之憂為萬一之慮也兵者國之大事廢興之端安危之要盡在於是臣不知曽與不曽令兩府大臣相與熟議經乆利害然後行之今在京兵士已經㨂上分配諸軍者無如之何其未㨂及外州軍兵士伏望朝廷特降指揮下應係㨂軍臣僚須是一一躬親子細㨂選好人材有膂力及得等様别無羸弱方得㨂上如已經㨂中後朝廷别差不干礙官覆㨂得却有不及等様及羸弱病患之人其元㨂軍臣僚伏乞重行貶竄仍自今後每遇大叚招㨂兵士並湏先令兩府臣僚同共商量度財用豐耗及事之緩急若湏至招㨂方得聞奏施行並戒約㨂軍臣僚務精不務多一如今來指揮取進止論赦及踈決狀嘉祐六年八月十五日上右臣竊以赦者害多而利少非國家之善政也虞書曰眚災肆赦怙終賊刑謂過誤有害則赦之恃惡自終則殺之非不擇罪之有無并赦之也漢大司馬吴漢病篤光武親臨問所欲言對曰惟願陛下慎無赦而巳王符亦曰今日賊良民之甚者莫大於數赦贖赦贖數則惡人昌而善人傷矣蜀人稱諸葛亮之賢亦曰軍旅屢興而赦不妄下然則古之明君賢臣未嘗以數赦為美也國家承順天心子愛百姓發號出令必先至仁然數赦之弊猶未能去又古之赦者其出無常嚴謹周密不可前知姦民猶抵冒以待之况今國家三年一郊未嘗無赦每嵗盛夏皆有踈決猾吏貪縱大為姦利悍民暴横侵侮善良百千之中敗無一二幸而發露率皆亡匿不過周嵗必遇赦降則晏然自出復為平人徃徃指望謂之熱勅使愿慤之民憤邑惴恐㓙狡之羣志滿氣揚豈爲民父母勸善沮惡之意哉且踈決之名本以盛暑之際恐囹圄之中有滯積寃結有司不為申理使無所告愬故天子臨軒親加慮問平其枉直無辜則赦有罪則誅使乆繫之人一朝而決故能消釋沴氣迎致太和非謂不問是非一切縱之也又祖宗之時每嵗不過一次踈決死罪以下皆􅉍降一等近年以來或至再三自徒以下一切赦之今嵗五月以前踈決之令巳再行矣此所以使百職隳慢姦邪恣睢者也今縱未能盡革前弊伏望陛下特降指揮下中書今後每嵗踈決不過一次或早或晩使外人不可豫期其徒罪仍依舊降從杖或遇親祀南郊之嵗更不踈決永為定制庶幾為惡之人不敢指以自寛有所戒懼薦鄭揚庭劄子臣竊見近世以來搢紳之士專尚辭華不務經術先聖㣲言幾成廢墜臣謂苟有盡心修明六藝皆冝甄奬以勵來者伏見并州盂縣主簿鄭揚庭自少及長研精易道譔著所得成易測六巻不泥隂陽不渉怪妄專用人事指明六爻求之等倫誠難多得臣不敢隠蔽輙取進呈伏望聖慈略垂省覧苟有可取量加旌異貴使學者有所勸慕取進止薦劉廱劄子臣伏見西鄙用兵以來草萊之士談兵機獻邉䇿者不可勝紀其間夸誕迃闊不切事情鄙陋膚淺無可觀采者甚衆葢縁邉鄙之事非土著之人
