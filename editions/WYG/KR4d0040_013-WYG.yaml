body:
  text: 奉同運使陳殿丞知儉字公廙惜洛陽牡丹為霜風所損名花多種欲紛敷一夕霜風非所虞節物偶然何足道人情遺恨不能無飄颻健筆詩千首惆悵東風酒百壺縱使前春滿朱檻使車那復滯西都又和惜春謡朝來風雨歇春意漠然收去我不辭訣憑誰能借畱杓星漸西轉洛水自東流曲渚撤華幄芳園罷彩毬雉鳴坵麥秀蠶起野桑柔亂絮天涯滿晴陽草際浮已嗟心緒減况復鬢絲稠賴聽新翻曲非為負勝遊劉伯夀坐中度曲命曰惜春謡還陳殿丞原人論宗宻所撰破自然破元氣破天命明佛性品物芸芸遊太虚不知誰氏宰洪爐一株花落分榮辱萬竅風號見有無覺後共占猶是夣衣中所得亦非珠何如鼔瑟浴沂水春服成時詠舞雩和王秀才虞仲字道濟以光始自陜右遊山歸復將登少室爲詩見寄瘦馬飄颻屢徃還疲勞專為訪名山須知筋力行將老漸恐峯巒不可攀蠟屐早能尋勝槩彈冠悔更落塵寰幸依賢者為東道大得逍遥水石間和景仁西湖泛舟滿船歌吹拂春灣天外晴霞水底斑誰信飛觴臨綺席獨能回首望青山東門車馬怱怱别西洛風煙寂寂閒疊石溪頭應更好却輸野叟坐林間新買疊石溪莊再用前韻招景仁一溪清水珮聲寒兩岸莓苔錦繡斑三徑誰來卜隣舍千峯我已作家山鹿裘藜杖偏宜老紫陌紅塵不稱閒早挈琴書逺相就放歌爛醉白雲間貽夸者我樂非君樂君憂非我憂蓬蒿與溟㴾終老不同遊春遊人物競紛華驪駒逐鈿車此時松與柏不及道傍花和潞公遊天章楚諫議園宅名卿新治第上宰舊連墻槐䕃青青葉星鄰兩兩光林花裂錦狹門路築沙長共引庭間水交生壁外篁魚窺薦琴石螢散讀書牀玉帳方懐逺松齋欲就荒旌幢今少憇蘭蕙不徒芳早晚平狼望同來舉夀觴還張景昱景昌秀才兄弟韡韡新詩巻青春映棣華機雲今繼美載協舊承家幸託仁人里時回長者車白虹光亂眼何敢議瑜瑕和宇文公南塗中見寄騘馬烏紗遊洛塵未能全得自由身深慙白首戀微禄不向青山為散人斥鷃卑飛聊取適冥鴻髙舉益難親蜀都迢遞千餘里徒誦新詩妙入神酬張二十五秀才南園遣意景昱字明叔花卉日相續朝昏興寄新露荷香入坐風竹净無塵嘯詠皆羣従喧囂逺四鄰須知軒冕客富貴不關身酬張三十秀才見贈景昌字子京樸學居人後清塗忝衆先瓠因無用棄木為不才全比得林泉趣仍依邑里賢自慚頭半白方解賦歸田八月十五日夜陪留守宣徽登西樓值雨待月久不見經歳侍佳節無如隂靄何果然時雨足安用月華多未免銀缸進空聞玉漏過庾公興不淺久為駐鳴珂秋雨新霽遊水北馬上偶成秋色與秋聲蕭然滿洛城未霜林葉赤新雨野風清水􅂔侵肌冷嵐光刮眼明誰云景如畫但恐畫難成運使虞部按行洛西諸縣因遊所過名山有詩百餘首合為一篇䝉賜寵示俾之繼作一首屬城窮僻地攬轡徧周流弊政已更化名山不廢逰鳴騶留谷口輕屐歴巖幽聚看官儀者相扶半白頭和君貺暮秋四日登石家寺閣曉泛洛舟二首嬉遊乘曉霽登覽犯秋寒不出埃塵外安知在壤寛宫前斷山碧林表落霞丹欲下惜佳趣相留更倚欄右登閣葉下宫槐老雲飛洛浦秋復陪元禮棹却望仲宣樓曲岸迷頻轉遙山碎不流夷猶聊寓賞浩蕩得忘憂晨出露漸徑昏歸月滿舟星河散寥廓珠貝映汀洲林館回車入壺觴秉燭遊山公興未盡徒御且畨休右泛舟又和六日四老㑹萸房迎令節菊蘂入芳筵華燭初長夜清霜未冷天悲風咽横吹驟雨送繁絃聊附鄒枚客敢希園綺賢和王少卿尚恭字汝之十日與留臺國子監崇福宫諸官赴王尹賞菊之㑹儒衣武弁聚華軒盡是西都冷落官莫歎黄花過佳節且將素髪共清歡紅牙板急絃聲咽白玉舟横酒量寛青眼主公情不薄一如省闥要人看和白都官序見贈齒疎鬢白兩眸昏萬事無堪老病身脫粟猶霑太倉禄法官仍忝外􅄗臣直緣迂僻求閒地豈是孤髙慕古人英俊滿朝皆稷契太山何必一飛塵酬邵堯夫見示安樂窩中打乖吟安樂􅌪中自在身猶嫌名字落紅塵醉吟終日不知老經史滿堂誰道貧長掩柴荆避寒暑只將花卉記冬春料非空處打乖客乃是清朝避世人和邠守宋度支迪來卜居與南園為鄰弱冠交遊鬢髪蒼飽諳官况好深藏閒居共買一壥地盡老常依數仭墻雖喜卜鄰同晏子尚慙推宅異周郎何時税此憑熊駕倚仗相迎立路傍和張文裕初寒十首何處初寒好初寒郟鄏城垂紳多俊彦列第盡公卿裘馬過従盛門闌灑掃清誰家擁獸炭盡日管絃聲何處初寒好初寒洛汭宫翠華雖脉脉佳氣自葱葱闕角月華白苑墻霜葉紅都人心望幸注目不離東何處初寒好初寒洛水橋沙㾗水清淺風葉栁蕭條關塞長塗直嵩丘倒影遙鳯樓雖在北車馬不塵囂何處初寒好初寒太室山晴空煙澹泊返照雪孱顔極目鴈稍沒無心雲自還猶餘拜表累不得坐松間嵩山去洛近二百里五日僅能徃還以妨拜表未果徃何處初寒好初寒禹鑿門遙天露崖口輕浪漱山根萬佛龕苔老一燈林靄昏漁梁杳相望石瀨夜聲喧何處初寒好初寒噴玉泉折冰流谷口飛溜落雲邊雀噪聚林杪樵歌下石巔尋幽不思返坐嘯夕陽偏何處初寒好初寒疊石溪山斜改昏曉路曲失東西拾栗走村稚鑿垣巢乳雞我來閒擁褐曝背草簷低何處初寒好初寒肅政臺官閒免簿領門静少塵埃天借風霜氣人無鷹隼猜庭荒餘老柏尚有夕烏來何處初寒好初寒逰弈園林間葉未盡籬底菊猶存結竹為庵小開爐構火温誰言處城市岑寂似丘樊何處初寒好初寒福善居長宵對燈火滿室聚詩書暫息登山屐休脂下澤車所安容膝地何必更多餘遊弈福善皆坊名和君貺少林寺逹摩自云傳佛心緒言迷世到於今既􅂝隻履歸西域安得遺靈在少林孤月正明髙殿冷清風不斷老松深謝公自愛山泉美肯為幽禪此訪尋又和嶽祠謝雪題嶽寺平法華庵宴坐幾何年庭蕪與砌連焚修真諦苦功行得無圓闕里詩三百賴鄉文五千厭煩猶不讀何况淤泥蓮平住庵不出近四十年日誦法華經數十巻望日示康廣宏清晨三緑袍羅拜北堂髙積善因先烈餘光及爾曹勿矜従事早當念起家勞修立皆由已何人可佩刀和君貺題潞公東莊嵩峯逺疊千重雪伊浦低臨一片天百頃平皋連别館兩行踈栁拂清泉國須柱石扶丕構須人待樓航濟巨川蕭相方如左右手且於窮僻置閒田和君貺任少師園賞梅二首寒壓春頭草未芽喜聞置酒賞新葩官儀赫奕三川守野意蕭踈四皓家不用管絃妨淡泊豈容桃李競繁華昏鵶散亂傳呼出歸路林間燭影斜風日雖寒晝景長探春逺訪白蓮莊岸冰猶在水先緑栁葉未生條已黄老木根侵苔徑窄新梅花入酒巵香天真不必人修飾得趣勿嫌臺館荒又和開叔寒梅犯雪榮大隱久專名異種生江渚何年到洛城洛中雖有梅開花常晚獨大隱梅最先開相傳好事者自江南移來今數十年矣色如虛室白香似主人清嚮使吳兒見不思菰菜羮和公廙喜雪用莊字韻曏來河洛久愆陽禱祀徒勞罄肅莊林雪飛花欣暫白麥田濡葉未全黄城中稍覺桑薪貴村外時聞社甕香八使孜孜憫惸獨斯民那復畏凶荒和史誠之謝送張明叔梅臺三種梅花别後相驚兩鬢霜可憐梅蘂為誰芳臺頭日暖分三色林下風清共一香正爛漫時遊不足忽離披去樂難常慇懃手折遥相贈不欲花前獨舉觴早春寄景仁二首辛夷花爛開故人殊未來愁看栁漸緑忍更折殘梅去歳景仁約辛夷花開即來洛中芍藥謝乃去疊石溪上春茅茨卜築新前言如不踐山蟬又笑人和君貺宴張氏梅臺京洛春何早憑高種嶺梅紛披百株宻爛漫一朝開青女工黏綴霜娥巧剪裁崑山雲滿谷蓬渚浪成堆勢擁樽前合香従席下來蜺旌羾天起練甲洗兵回不使光風散曾無夜色催人稠衣馥郁地狹舞徘徊民服召公化時推何遜才何遜有早梅詩淹留文酒樂璧月上瑤臺看花四絶句洛陽相望盡名園牆外花勝牆裏看手摘青梅共挼酒何須一一具杯盤洛陽相識盡名流騎馬遊勝下馬遊乗興東西無不到但逢青眼即淹留洛陽春日最繁華紅緑隂中十萬家誰道羣花如錦繡人將錦繡學羣花南園桃李近方栽澆水未乾花已開山果野蔬随分有交遊不厭但頻來留别友生野際共為别客亭芳草新何心更執酒滿目盡傷春今古無窮路東西相背塵行行復回首不欲著鞭頻二月六日初見待漏房前栁色微緑欣然成詠宫城映出絲絲緑頓覺皇州春意逥従此不辭驅瘦馬六街終日踏塵埃垂栁天意清和二月初春風不動整如梳陶潜宅外時無此想更蕭條不易居閒居故人通貴絶相過門外真堪置雀羅我已幽慵僮更懶雨來春草一畨多中秋陪張龍圖讌射堂初夕隂雲酒行頓解喜而成詠飛葢共徘徊西園髙宴開秋雲惜明月留待庾公來貽宋四行簡迪離羣如幾辰屈指十青春不意輪蹄跡共兹京洛塵文場投漆契客路轉蓬身别易相逢闊過従莫厭頻和國子夏主簿李花有章儒官岑寂覺春閒仙李繁花重壓欄碎錦不飛蒙樹合素雲欹亞舉枝難能詩此日當推謝捧賜他年足繼桓更約雕盤薦秋實豈徒穠􅃩一朝看傳家集巻十欽定四庫全書傳家集巻十一宋司馬光撰律詩六和君貺清明與上已日泛舟洛川十韻繁華兩佳節邂逅適同時雅俗共為樂風光如有期曉煙新里巷春服滿津涯已散漢宫燭仍浮洛水巵占花分設席愛栁就張帷華轂争門去輕簾夾路垂一川雲錦爛四座玉山欹疊鼓傳遙吹輕橈破直漪清談何衮衮和氣益熙熙想見周南俗當年播逸詩和君貺寄河陽侍中牡丹真宰無私嫗煦同洛花何事占全功山河勢勝帝王宅寒暑氣和天地中盡日玉盤堆秀色滿城繡轂走香風謝公髙興看春物倍憶清伊與碧嵩又和安國寺及諸園賞牡丹洛邑牡丹天下最西南土沃得春多一城竒品推安國四面名園接月波山相著書稱上藥翰林弄筆作新歌人間朱粉無因學浪把菱花百徧磨送酒與邵堯夫因戯之前送牡丹藥苗堯夫皆有詩林下雖無憂可消許由聞説掛空瓢請君呼取孟光飲共挿花枝煮藥苗酬仲通初提舉崇福宫見寄富夀安民舊學違符移擁筆素心非青雲有路那足顧白髪滿頭胡不歸永日杜門無俗客臨風隱几得天機西山爽氣秋應好恨不相従上翠微酬君貺和景仁見寄三首嬾拙無時用耆朋獨我思乗閒同把酒道舊各成詩高義刮眼膜清風生鬢絲方將激衰俗賤子獨何為北闕黄金印西山白髪翁訏謨帝廷異小築洛川同晴野峯峯碧霜林葉葉紅無因侍樽席惆悵又秋風右上宣徽何事掛冠客至今留帝臺紅塵終可厭青眼不長開春路半消雪寒枝初破梅南園虚客席洒掃望公來右上侍郎和王安之四絶句野軒黄雞白酒田間樂藜杖葛巾林下風更若食芹仍暴背野懐併在一軒中汙亭雜花亂種盤渦底小屋深居鑑燧心朝市囂聲那得到晨昏暑氣不能侵藥軒雨餘條甲繞堦生徃徃桐君昔未名采貯不須勤暴篲秋陽日日滿簷楹晩暉亭俯臨城市厭諠譁囬顧園林景更加醉立斜陽頭似雪徃來誤認白公家樂天西樓獨立詩云身著白衣頭似雪時時獨立小樓中路人囬顧應生恠十六年來見此翁
