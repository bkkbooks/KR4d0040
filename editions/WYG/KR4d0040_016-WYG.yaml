body:
  text: 請建儲副或進用宗室第一狀至和三年六月十九日上是嵗仁宗違豫不臨朝者累月國嗣未建天下寒心中外之臣勇悍不屈素以忠直自負如唐介等皆莫言惟范景仁時為諌官首建此議光聞而繼之第一狀留中第二狀第三狀降付中書竊以人臣之進言者捨其急而議其緩則言益繁而用益寡矣人君之聽納者忽其大而謹其細則心益勞而功益淺矣故明主不惡逆耳之言以察治亂之原忠臣不避滅身之禍以論安危之本是以上下交㤗而事業光美也臣竊見陛下自首春以來聖體小有不康天下之人側足而立累氣而息恟恟憂懼若蹈冰炭間者雖已痊平而民間猶有妄為訛言以相驚動者雖有司以嚴刑束之彼口不得言中心惶惶何所不慮邪陛下胡不試思其所以然者何哉豈非儲貳者天下之根本根本未定則衆心不安也賈誼有言抱火厝之積薪之下而寢其上火未及然因謂之安當誼之時漢孝文帝春秋鼎盛有孝景以為之太子中外乂安公私冨溢誼猶有是言使誼處於今日當云何哉陛下好學多聞博覧經史試以前古之事質之治亂安危之幾何嘗不由繼嗣哉得其人則治不得其人則亂分先定則安不先定則危此明白之理皎如日月得失之機間不容髮於朝􅋝至大至急之務孰先於此而陛下晏然不以為憂羣臣愛身莫以為言此臣所以日夜痛心疾首忘其身之踈賤而不顧鼎鑊之罪者也伏惟陛下哀而察之今夫細民之家有百金之寶猶擇親戚可信任者使謹守之况天下之大乎三代之王以至二漢所以能享天之禄若是其乆者豈非皆親任九族以爲藩輔乎使親者猶不可信則踈者庸足恃乎臣竊惟陛下天性純孝振古無倫事無大小闗於祖宗者未嘗不勤身苦體小心翼翼以奉承之况所受祖宗光明盛大之基業豈可不為之深思逺慮措之於安平堅固之地以保萬世無疆之休哉臣聞天子之孝非若衆庻止於養親而已葢將慎守前人之業而傳於無窮然後為孝也故經稱天子之孝曰德教加於百姓刑于四海諸侯之孝曰保其社稷而和其民人卿大夫之孝曰守其宗廟士之孝曰保其禄位而守其祭祀庶人之孝曰謹身節用以養父母此皆聖人之言非臣之狂瞽也今陛下所以奉事祖宗其道至矣若獨於此未留睿意早定大議則曏時純孝巍巍之德皆無益矣此天下所共為陛下重惜非特愚臣而已臣聞禮大宗無子則同宗為之後為之後者為之子也故為人後者事其所後禮皆如父所以尊尊而親親也伏惟祖宗受天明命功德在人本支百世子孫千億而陛下未有皇嗣人心憂危伏望陛下深念祖宗之艱難基業之閎美神噐之大寳蒼生之重望勿聽苟且之言勿從因循之計斷自聖志昭然勿疑謹擇宗室之中聪明剛正孝友仁慈者使攝居儲貳之位以俟皇嗣之生退居藩服儻聖意未欲然者或且使之輔政或典宿衛或尹京邑亦足以鎮安天下之心如此則天神地祗宗廟社稷實共頼陛下聖明之德况羣臣兆民其誰不歡呼鼔舞乎昔魯漆室之女憂魯君老太子㓜彼匹婦也猶知憂國家之難葢以魯國有難則身必與焉故也况臣食陛下之禄立陛下之朝又得承乏典册之府比於漆室之女斯亦重矣誠不忍坐視國家至大至急之憂而隠黙不言臣誠知言責不在臣言之適足自禍然而必言者萬一冀陛下采而聽之則臣於國家譬如螻蟻而為陛下建萬世無窮之基救四海生民之命臣榮多矣願陛下勿以臣人㣲位賤謂之狂狷而忽之試以臣言自為聖意延問大臣忠於社稷者儻以為非臣請伏妄言之誅倘以為是願陛下决志而速行之焚臣此奏勿以示外足以明臣非敢徼兾毫釐之幸也虞書曰勑天之命惟時惟幾陛下當此之時變危為安變亂為治易於反掌若失時不斷使天下之人有以議陛下之純孝者則臣雖欲畢命捐軀以報陛下亦無及已臣不勝區區憤懣之誠干冒冕旒伏地待罪請建儲副或進用宗室第二狀臣先於六月十九日輙以瞽言干犯聖德伏地傾耳以俟明詔於今月餘一無所聞陛下寛仁不加誅於狂愚之臣然亦未賜采納臣竊自痛人品猥細言語吃訥不能發明國家安危大體致陛下輕而棄之此皆臣之罪也雖然臣性誠愚位誠賤而意誠忠語誠切願陛下不以人之愚賤而廢忠切之言少留聖心於宗廟社稷之至計則天下幸甚竊以為國家者政有小大事有緩急知所先後則功無不成議者或曰當今之務大而急者在於水災氾溢是大不然彼水災所傷不過汚下及濵河之民若積雨既止有司少䟽而塞之則民皆復業豈能為國家之患哉又曰然則在於糓帛窘乏是又不然夫以四海之冨治平之乆若養之有道用之有節使良有司治之糓帛不可勝用也豈能為國家之患哉又曰然則在於戎狄侵盗是又不然夫戎狄侵盗不過能驚擾邉鄙之民若禦之有道備之有謀可使朝貢相繼豈能為國家之患哉以臣之愚當今最大最急之患在於本根未建衆心危疑釋此不憂而顧憂彼三者是捨其肺腑而救其四肢也不亦左乎借有髙才之臣能復九河之道儲九年之食開千里之邉而本根未建猶無益也况復細於彼三事者烏足道哉今陛下聖體雖安四方之人未能遍知尚有疑懼者陛下不以此時早擇宗室之賢者使攝居儲副之位内以輔衛聖躬外以鎮安百姓萬一有狂妄之人出於意外喧譁驚衆雖知萬全無慮然亦豈可不過為之防哉臣竊意陛下聖智聪明洞照安危䇿慮已定而尚密之未欲宣示於外審或如此亦恐不可何則今天下之人企踵而立抉耳而聽以湏明詔之下然後人人自安又何待而宻哉若以儲副體大非造次可定者或且使之輔政或典宿衛或尹京邑亦是以遏禍難之原靖中外之意今安危之幾間不容髪日失一日貴在及時而朝廷置之意外不為汲汲朝夕所議大抵皆目前常事非甚大而急者臣恐髙拱雍容養成國家之患從而理之用力難矣此臣所以日夜區區寢不能安食不能飽不避死亡之誅進言不已者也伏望陛下察其愚衷特賜詳擇臣前日所奏及今狀内事理稍有可施行者乞决計而速行之以安天下元元之心然後理臣僣妄建言之罪不敢辭也請建儲副或進用宗室第三狀臣先於六月十九日八月一日兩曽上言乞擇宗室賢者進而用之葢以上則輔衛聖躬下則鎮安百姓迄今未聞聖朝少垂采聴臣誠愚昧不逹國家髙逺之意若臣所言非邪當明治其罪以示天下若其是邪亦謂聖心不宜棄忽豈可直以臣之愚賤不察其言若投羽毛於滄海之中杳然莫知其所之豈踈逺所望哉臣不勝憤懣敢復剖析肝膽陳布以聞雖抵罪萬死亦無怨悔臣聞書曰逺乃猷詩云猶之未逺是用大諌凡國家之弊在於樂因循而多忌諱不於治安之時豫為長逺之謀此患難所從而生也竊觀漢室以至有唐簡䇿所載帝王即位則立太子此乃古今不易之道也其或謙譲未暇則有司請之所以尊宗廟重社稷皆國家莫大之慶未聞人主以為諱惡也及唐中葉以來人主始有惡聞立嗣者羣臣莫敢發言言則刑戮隨之是以禍亂相尋不可復振殊不知本强則茂基壯則安此乃國家所當深鍳而不足以為法也今天下之人上自公卿下至庻人苟有知識忠於國家者其心皆知當今之務無此為大無此為急然而各畏忤㫖之誅莫敢進言臣獨不愛犬馬之軀為陛下言之陛下豈可不少留聖思而聽察之邪臣嘗歴觀春秋以來迨至國初積一千六百餘年其間天下混一内外無患兵寢不用者不過四百餘年而巳至如聖朝芟夷僣亂一統四海内平外順上安下和使在朝在野之人自祖及孫耳目相傳不識戰鬬葢自上世以來治平之乆未有若今之盛者也臣竊見國家於州縣倉庫斗糧尺帛未嘗不嚴固扄鐍擇人而守之况如是融明閎茂之業豈可不謹擇親戚可信任者使助陛下守之乎此則賢愚之人所共為陛下重惜者也陛下當此之時頥指如意不早决至䇿以固萬世不㧞之基獨不念太祖太宗跋履山川經營天下真宗宵衣旰食以致太平之艱難乎此臣所以夙夜遑遑起則思之卧則夢之感嘆涕泗不能自已不避煩凟之誅再三進言者也或者謂臣身賤居外而言朝廷之事侵官也臣愚以為治古諫諍無官自公卿大夫士至於庶人百工商旅矇瞍芻蕘無有不得言者所以逹下情而察國政也若置官而守之非其官者皆不得言則下情壅而不通如是則國家雖有迫切之憂行道之人皆知之而在上者莫得聞也此其為害豈不深乎况臣食陛下之禄於今三世矣先臣某以廉直恬退特為陛下所知擢自孤㣲升之侍從此恩之重子子孫孫何時敢忘而又陛下曏以水災親下明詔延訪中外勤求得失臣獨何人身逄盛際捨此大節隠而不言其餘𤨏碎豈足道哉抑又聞之元后作民父母陛下臣父也安有為人之子見危而不告其父乎伏望陛下察臣區區之心不為私其一身不惜少頃之間取臣前後所奏畧賜省覧其中萬一苟有可施行者乞以陛下之意斷而行之宣告中外使逺近渙然無復憂疑則自然神靈悦於上而災異伏衆庻喜於下而姦宄消至於草木昆蟲靡不䝉被其福其為功業豈不盛哉夫時者難得而易失惟陛下早留神詳察乞虢州第一狀嘉祐三年上
