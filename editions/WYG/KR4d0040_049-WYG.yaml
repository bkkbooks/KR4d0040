body:
  text: 革弊劄子元豐八年十二月四日上臣伏見陛下自臨政以來夙夜孜孜以愛百姓安國家為事盖善治疾者必䆒其所來攻其所急救之欲速去之欲盡臣觀今日公私耗竭逺近疲弊其原大概出於用兵夫兵者凶器天下之毒財用之蠧聖人除暴定亂不得已而用之耳自有唐中葉藩鎮䟦扈降及五代羣雄角逐四海九州𤓰分縻潰兵相吞噬生民塗炭二百餘年太祖受天明命四征弗庭光啓景祚太宗繼之克成厥勲然後大禹之迹悉為宋有於是載戢干戈與民休息或自生至死年及期頥不見兵革吏守法度民安生業雞鳴狗吠烟火相望可謂太平之極致自古所罕侔矣及神宗繼統材雄氣英以幽薊雲朔淪於契丹靈夏河西專於拓䟦交趾日南制於李氏不得悉張置官吏収籍賦役比於漢唐之境猶有未完深用為恥遂慨然有征伐開拓之志於是邊鄙武夫窺伺小利敢肆大言祗知邀功不顧國患争賈餘勇自謂衞霍不死白面書生披文按圖玩習陳迹不知合變競獻竒策自謂良平更生聚斂之臣捃拾財利剖析秋毫以供軍費專務市恩不恤殘民各陳遺利自謂研桑復出相與誤惑先帝自求榮位於是置提舉官强配青苖多収免役以聚貨泉又驅畎畆之人為保甲使捨耒耜習弓矢又置都作院調筋皮角木以多造器甲又養保馬使賣耕牛市駔駿而農民始愁苦矣部分諸軍無問邊州内地各置將官以領之自知州軍總管鈐轄都監監押皆不得關預捨祖宗教閱舊制誦射法效北服機械陳圖競為新竒朝晡上塲罕得休息而士卒始怨嗟矣置市易司强市㩁取坐列販賣増商稅色件及菜果而商賈始貧困矣又立賖貸之法誘不肖子弟破其家又令民封狀増價以買坊塲致其子孫鄰保籍没貲産不能偹償又増茶鹽之額賤買貴賣强以配民食用不盡廹以威刑破産輸錢又設措置河北糴便司廣積糧穀於臨流州縣以備饋運教兵既久積財既多然後用之而承平日久人已忘戰將帥愚懦行伍驕惰加以運籌决勝者乃浮躁巧偽之士不知彼已妄動輕舉是以頓兵靈武力疲食盡自潰而歸執兵之士荷糧之夫暴骨塞外且數十萬築堡永樂怠忽無備縱冦延敵闔城之人翦為魚肉曽未足以威服戎狄而中國先自困矣先帝深悔其然厭截截諞言思畨畨良士及下哀痛之詔息兵富民奄棄天下此臣所為痛心疾首而泣血追傷者也伏惟皇帝陛下肇承基緒太皇太后同聽庶政首戒邊吏毋得妄出侵掠俾華夷兩安今契丹繼好秉常納貢乾德拜章征伐開拓之議皆已息矣則此置提舉官散青苗斂免役錢㸃教保甲置都作院養保馬置將官市易司封狀買坊塲増茶鹽額措置河北糴便司皆為虚設陛下幸詔臣民各言疾苦其已至者千有餘章未有不言此數事者足知其為天下公患衆人所共知非臣一人之私言也利害著明皎如日月何所復疑而羣臣猶習常安故憚於更張雖頗加裁抑而監司按堵將官具存保甲猶教閱保馬猶養飼邊州屯戍不减軍器造作不休茶鹽新額尚在差役舊法未復是用兵雖息而公私勞費猶未息也如此因循不知改轍數年之後萬一遇水旱大饑盗賊羣起其為國家憂患豈敢盡言哉伏願陛下斷自聖志凡王安石等所立新法果能勝於舊者則存之其餘臣民以為不如舊法之便者痛加釐革雖非一日可行之事欲乞陛下宣諭執政令因臣民上封事熟議利害進呈以聖鑒裁决而行之昔夏遵禹訓商用湯法周循文武之典盖創業垂統之王貽厥孫謀後世所宜謹守不可失也若凡百措置率由舊章但使政事悉如熈寧之初則民物熈熈海内太平更無餘事矣議者必曰革弊不可倉猝當徐徐有漸此何異使醫治疾而曰勿使遽愈且勿除其根原使盡也其為醫者謀則善矣其為疾者謀奚利哉取進止乞罷免役錢依舊差役劄子元祐元年正月二十二日上尋得㫖依奏臣竊見免役之法其害有五舊日差役之時上戸雖差充役次有所陪備然年滿之後却得休息數年營治家産以備後役今則年年出錢無有休息或有所出錢數多於徃日充役陪備之錢者此其害一也舊日差役之時下戸亢不充役今來一例出錢免役驅廹貧民剥膚椎髓家産既盡流移無歸弱者轉死溝壑强者聚為盗賊此其害二也舊日差役之時所差皆土着良民各有宗族田産使之作公人管勾諸事各自愛惜少敢大叚作過使之主守官物少敢侵盗所以然者事發迯亡有宗族田産以累其心故也今召募四方浮浪之人充役無宗族田産之累作公人則恣為姦偽曲法受贓主守官物則侵欺盗用一旦事發則挈家亡去變易姓名往别州縣投名官中無由追捕官物亦無處理索此其害三也自古農民所有不過穀帛與力凡所以供公賦役無出三者皆取諸其身而無窮盡今朝廷立法曰我不用汝力輸我錢我自雇人殊不知農民出錢難於出力何則錢非民間所鑄皆出於官上農之家所多有者不過莊田穀帛牛具桑柘而已無積錢數百貫者也自古豐歳穀賤已自傷農官中更以免役及諸色錢督之則穀愈賤矣平時一斗直百錢者不過直四五十文更急責之則直三二十矣豐年猶可以糶穀送納官錢若遇凶年則穀帛亦無不免賣莊田牛具桑柘以求錢納官既家家各賣如何得售惟有拆屋伐桑以賣薪殺牛以賣肉今歳如此來歳何以為生是官立法以殄盡民之生計此其害四也提舉常平倉司惟務多斂役錢廣積寛剰以為功效希求進用今朝廷雖有指揮令役錢寛剰不得過二分竊慮聚斂之臣猶依傍役錢别作名目隱藏寛剰使幽逺之人不被聖澤此其害五也陛下近詔臣民各上封事言民間疾苦所降出者約數千章無有不言免役錢之害者足知其為天下之公患無疑也以臣愚見為今之計莫若直降勅命應天下免役錢一切並罷其諸色役人並依熈寧元年以前舊法人數委本縣令佐親自掲五等丁産簿定差仍令刑部檢㑹熈寧元年見行差役條貫雕印頒下諸州所差之人若正身自願充役者即令充役不願充役者任便選雇有行止人自代其雇錢多少私下商量若所雇人逃亡即勒正身别雇若將帶却官物勒正身陪填如此則諸色公人盡得有根柢行止之人少敢作過官中百事無不修舉其見雇役人候差别役人各放逐便數内惟衙前一役最號重難曏者差役之時有因重難破家産者朝廷為此始議作助役法然自後條貫優假衙前諸公庫設厨酒庫茶酒司並差將校勾當諸上京綱運召得替官員或差使臣殿侍軍大將管押其麤色及畸零之物差將校或節級管押衙前苦無差遣不聞更有破産之人若今日差充衙前料民間陪備亦少於曏日不至有破家産者若猶以為衙前戸力難以獨任即乞依舊於官戸僧寺道觀單丁女戸有屋業每月掠錢及十五貫莊田中年所収斛斗及百石以上者並令隨貧富分等第出助役錢不及此數者與放免其餘産業並約此為准所有助役錢令逐州樁管據所有多少數目約本州衙前重難分數每分合給幾錢遇衙前合當重難差遣即行支給然尚慮天下役人利害逐處各有不同欲乞於今來勅内更指揮行下開封府界及諸路轉運司謄下諸州縣委逐縣官看詳若依今來指揮别無妨礙可以施行即便依此施行若有妨礙致施行未得即仰限勅到五日内具利害擘畫申本州仰本州類聚諸縣所申擇其可取者限勑書到一月内具利害擘畫申轉運司仰轉運司類聚諸州所申擇其可取者限勅書到一季内具利害擘畫奏聞朝廷候奏到委執政官再加看詳各隨宜修改别作一路一州一縣勅施行務要所在役法曲盡其宜取進止辭免醫官劄子元祐元年正月二十三日上臣以病在朝假伏䝉聖慈連日差中使押醫官沈士安朱有章楊文蔚陳易簡等到臣家各診候留藥臣上荷大恩天隆地厚隕首糜軀無足論報然臣竊聞陳易簡見在病假近皇太后服藥亦祗應不得今以臣故特煩聖㫖督廹令每日一到臣家看候醫治臣忝為人臣實不自安况臣私家亦須更請一醫人每日診候調理其陳易簡已知臣脉氣病狀欲乞特降聖㫖只令臣每日具病狀増减就易簡處取藥更不令易簡每日到臣家診候庶於體分稍得自安取進止辭放正謝劄子元祐元年上臣伏聞降聖㫖在閤門宰臣執政官近遷轉已正謝訖内有司馬光見患在假特放謝仍免赴景靈宫福寧殿恭謝臣聞命震駭無地自處豈有朝廷特遷一官卧家受之並不入謝君降異常之澤臣無一拜之勤自古以來未嘗有此臣雖頑暗必不敢當伏望聖慈早賜収還今來指揮候臣疾患稍痊只依前來指揮减拜入謝及赴景靈宫福寧殿恭謝庶使賤臣粗能自安取進止審内批指揮劄子元祐元年正月上内批依二十八日指揮臣昨日具劄子奏為聖㫖特放正謝仍免赴景靈宫福寧殿恭謝臣以自古以來未有此禮必不敢當當夜准御批依近降指揮臣勘㑹今月十四日内降以臣轉官所有將來正謝特令兩拜起居免舞蹈十七日又准内降所有臣將來合赴景靈宫恭謝逐殿宜止令兩拜二十八日又准入内供奉官劉永年傳宣放臣正謝及景靈宫福寧殿神御前恭謝臣未審御批依近降指揮是依十四日指揮十七日指揮依二十八日指揮須至再有奏禀取進止辭放正謝第二劄子臣昨夜准御批指揮今早再有奏禀䝉復降御批依二十八日指揮臣承命驚惶措躬無地伏念臣忝為人臣陛下賜之一顧賜之巵酒賜之𤓰果臣亦當稽首拜謝况進以高位加之寵名榮動搢紳澤流苗裔豈可即安私室專飬沉疴不造王庭坐受圭組不獨為海内之所共責有司之所直䋲天威違顔不出咫尺隕越斃踣為聖朝羞臣雖至愚粗知自愛何敢受此自納於不測之誅伏望聖慈矜閔候臣所患稍痊安日止依十四日十七日所降指揮减拜入謝及於景靈宫福寧殿神御前恭謝庶使差可自安其二十八日指揮臣以死自守必不敢奉詔取進止辭放正謝第三劄子元祐元年二月上今月五日准尚書省劄子以臣前奏乞候所患稍痊安日依正月十四日十七日所降指揮减拜入謝及於景靈宫福寧殿神御前恭謝今月二日三省同奉聖㫖依正月二十八日指揮臣聞君待臣以惠臣奉君以恭故能上下相親道用交泰陛下念臣衰老抱病筋力尫羸特損朝儀以從私便陛下之大惠也臣若不知禮有靦面目坐受優恩曽無辭避是君有惠而臣不恭上行施而下無報臣雖頑昧心豈敢安伏望聖慈如臣前奏依正月十四日十七日指揮庶使㣲軀有地自處取進止傳家集巻四十九欽定四庫全書傳家集巻五十宋司馬光撰章奏三十三論西夏劄子元祐元年正月上臣伏見神宗皇帝以夏國王趙秉常為臣下所囚興兵致討奮揚天威震動沙漠虜擕其種落竄伏河外諸將収其邊地建米脂義合浮圖葭蘆吳堡安疆等寨此盖止以藉口用為已功皆為其身謀非為國計臣竊聞此數寨者皆孤僻單外難於應援田非肥良不可以耕墾地非險要不足以守禦中國得之徒分屯兵馬坐費芻糧有久戍逺輸之累無拓土闢境之實此衆人所共知也王師既収靈州不克狼狽而歸卒疲食盡失亡頗多西人知中國兵力所至自此始有輕慢之心是以明年邊臣築永樂城虜潛師掩襲覆軍殺將塗炭一城久之又舉一國之衆攻圍蘭州期於必取將士堅守僅而得全虜自是銳氣少挫不敢輕犯邊矣臣聞此數寨之地中國得之雖無所利虜中失之為害頗多何則深入其境近其腹心常慮中國一朝討襲無以支梧不敢安居是以必欲得之不肯棄捨一年前虜嘗專遣使者詣闕深自辨訴請臣服如故其志無他止為欲求其舊境而已朝廷既許其臣服虜來請舊境朝廷乃降指揮其前則云所以興舉甲兵本欲執取罪人救㧞幽辱非有意侵取疆塲土地而已其後乃云止將已得些小邉土聊示削罰豈可更有陳乞還復之理此則朝㫖首尾已自相違又興師本為振㧞秉常拒命者國人之罪豈可更削秉常之地於理差似未安王者以大信御四海羗戎雖㣲恐未易以文辭欺也於是虜既失望憤怒怨懟移文保安軍辭理不遜云今來賀正旦人使難議遣發自是正旦生辰乃至陛下繼明皆不遣使入賀其不臣大矣然而去歳四遣使者詣闕弔慰祭奠吿其母喪并進遺物理雖不備稍示屈服臣竊料虜意不出於三一者猶冀朝廷萬一赦其罪戾返其侵疆二者陽為恭順使中國休怠便隂伺間隙入為邉患三者久自絶於上國其國中貧乏使者往來得賜賚之物且因為商販耳昔衞貳於晉晉取戚田及衞人既服郤缺曰日衞不睦故取其地今已睦矣可以歸之叛而不討何以示威服而不柔何以示懐非威非懐何以示德遂歸戚田于衞今西人所為如此朝廷既不能拒絶勿受其使又不能招納與之更始彼來則迎送館穀以賔客待之不來則一無所問日復一日將踰二年臣竊意朝廷謂西人勢已衰弱心實内附故來則不拒去則不追置之度外不以為虞殊不思數年前王師大舉深入將士所過烈於猛火割其疆埸屢請而不還彼怨毒欲讐報之心窺窬欲乘釁之意日夜不忘若渇者不忘飲盲者不忘視也譬如有虎狼在屋側垂頭熟寢人豈可見其不動狎而侮之循其頭躡其尾邪臣每思之終夕寒心以臣愚慮於今為之止有二策一者返其侵疆二者禁其私市何謂返其侵疆凡天子即位天地一新滌瑕蕩穢小大無遺昔趙佗自稱南越武帝倔强嶺南漢文帝即位赦其大罪遣單使往諭之佗稽首請服累世為臣李繼遷俶擾西陲十有餘年關中困弊真宗皇帝即位赦其大罪割靈夏等數州除其子趙德明為定難軍節度使由是邉境安寧者四十年此乃前世及祖宗之成法非無所依據也今秉常之罪不大於繼遷也米脂等寨不多於靈夏也陛下誠能於此踰年改元之際特下詔書數其累年不來賀正旦生辰及登寳位等不備之禮嘉其弔慰祭奠吿國母喪進遺物之勤曠然推恩盡赦前罪自今以後貢獻賜予悉如舊規廢米脂義合浮圖葭蘆吳堡安疆等寨令延慶二州悉加毁撤除省地外元係夏國舊日之境並以還之其定西城蘭州議者或謂本花麻所居趙元昊以女妻之覊縻役屬非其本土欲且存留以為後圖猶似有名禦夷狄者不壹而足俟其再請或留或與徐議其宜亦無所傷至於㑹州尚在化外而經略司遽稱熈河蘭㑹虜常疑中國更有闢境之心不若改為熈河岷蘭經略司如此則西人忽被德音出於意外雖禽獸木石亦將感動况其人類豈得不鼓舞忭蹈世世臣服者乎議者或曰先帝興師動衆所費億萬僅得數寨今復無故棄之此中國之恥也昔漢元帝棄珠崖詔曰朕日夜惟思議者之言羞威不行則欲誅之通於時變則憂萬民夫萬民之饑餓與逺蠻之不討危孰大焉遂棄之此乃帝王之大度仁人之用心如天地之覆燾父母之慈愛盛德之事何恥之有國家方制萬里今此尋丈之地惜而不與萬一西人積怨憤之氣逞凶悖之心悉舉犬羊之衆投間伺隙長驅深入覆軍殺將兵連禍結如曏日繼遷元昊之叛逆天下騷動當是之時雖有米脂等千寨能有益乎不唯待其攻圍自取固可深恥借使虜有一言不遜而還之傷威毁重固已多矣故不若今日與之之為美也此國大事伏望陛下留神熟慮更與執政詳議以聖意斷而行之不可後時失此機㑹悔將無及何謂禁其私市西夏所居氐羌舊壤地所産者不過羊馬氊毯其國中用之不盡其勢必推其餘與他國貿易其三面皆戎狄鬻之不售惟中國者羊馬氊毯之所輸而茶綵百貨之所自來也故其民如嬰兒而中國乳哺之矣寳元慶厯之間元昊負恩僣亂屢犯邉境大入則大利小入則小利中國未嘗蹈其境破其軍禽其將屠其城有害於社稷也而首尾六年元昊遣使因縁邉吏卑辭納款頓顙稱臣雖其惡積罪盈欲懐音革面原其私心未必不貪中國之財思私市之利故也舊制官給客人公據方聽與西人交易傳聞近歳法禁踈闊官吏弛慢邉民與西人私交易者日夕公行彼西人公則頻遣使者商販中國私則邉鄙小民竊相交易雖不獲歳賜之物公私無乏所以得偃蹇自肆數年之間似恭似慢示不汲汲於事中國由資用饒足與事中國時無以異故也陛下誠能却其使者責以累年正旦生辰及登寳位皆不來賀何獨遣此使者拒而勿内明勅邉吏嚴禁私市俟其年歳之間公私困弊使自謀而來禮必益恭辭必益遜然後朝廷責而赦之許通私市待之如初然邉民與西人交易為日積久習玩為常一旦禁之其事甚難何則若以常法治之則有司泥文動循䋲墨追問證左逮捕傳送之人停匿之家奏裁待報動涉半年如此則徒使邉民麗刑者衆獄犴盈溢而私市終不能禁也夫三尺之限空車不能登峭峻故也百仭之山重載陟其上陵夷故也今必欲嚴禁邉民與西人私市須權時别立重法犯者必死無赦本地分吏卒應廵邏者不覺透漏官員衝替兵士降配仍許人吿捉獲者賞錢若干當日内以官錢支給更不以犯事人家財充如此則縁邉六路各行得一兩人則庶幾可以聳動人耳目令行禁止人不敢犯矣然人存政舉此事全在邉帥得人昔龎籍為河東經畧使下令禁邉民與西人私市有熟戸犯禁籍斬於犯處妻拏皆送淮南編管一境凛然無敢犯者其後施昌言為環慶路經略使亦禁私市西人發兵壓境昌言遣使問其所以來之故西人言無他事只為交易不通使者懼其兵威輒私許之法遂復壊若邉帥未能盡得其人則此法恐未易可行不若前策道大體正萬全無失也取進止
