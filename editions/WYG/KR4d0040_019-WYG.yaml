front:
  text: 耳目習熟則不能究明利病非學古之士歴觀成敗則不能堅定是非竊見并州鄉貢進士劉廱撰成邉議十巻援㩀古今指陳得失用意甚勤論理頗多不敢隠蔽謹具進呈伏乞少賜省覧如有可取欲乞朝廷略加甄奬
  hash: sha256:3ce3855ff04c94ee50557877268784a0122e286c2c194a4dd197c8518a2cbca6
  markers:
  - {type: page-break, offset: 70, content: '', id: KR4d0040_WYG_020-12a, image: WYG1094/WYG1094-0212c.png}
body:
  text: 論舉選狀嘉祐六年八月二十一日上右臣竊以取士之道當以德行為先其次經術其次政事其次藝能近世以來專尚文辭夫文辭者乃藝能之一端耳未足以盡天下之士也國家雖設賢良方正等科其實皆取文辭而巳近以祫享赦節文應天下士人有素敦節行兼通學術乆為鄉里所推者委轉運使提㸃刑獄同加捜訪每路各三兩人仍與本䖏長吏連署結罪保舉聞奏所舉之人朝廷命本州敦遣至則館於太學待遇甚厚考試之際不糊名謄録既而署等補官皆過所望此誠合先王取士之道臣謂國家將除積乆之弊立太平之基天下士大夫皆靡然嚮風矣行之未幾忽聞朝廷一切罷之無不悵然失望臣戇愚不識所謂若以所舉之人多非實有材行則當治舉將之罪别加捜訪豈可以一二人謬濫廢天下之舉賢是猶因溺而廢天下之舟因噎而廢天下之食也且人之毁譽或出愛憎雖復聖賢不能自免孔子曰衆好之必察焉衆惡之必察焉恐國家亦未可以此遥斷否臧遽行黜陟也就使其人平昔所行誠有虧缺古之人或舉於漁鹽或舉於盗賊豈可不容其改行自新而終身棄之乎且人之行能迭有短長若不棄瑕録用而以一節廢之則失人多矣臣愚以為天子撫有四海海内之士不可一身察之也必資舉者然後能盡天下之才既用舉者之言授之爵禄苟不嚴為禁約以防其私則請託欺罔無不至矣竊以孝者士之尊行廉者吏之首務故漢世舉士皆用孝廉行之最乆得人為多臣欲乞應天下知州府軍監任内聴舉孝亷一人大藩聴舉二人轉運使提㸃刑獄任内聴舉三人並須到任及一年以上方得奏舉夫鄉舉里選雖為古法今之為吏者不得乆於其任士之素行或不能盡知若本部無人可舉即聴舉别部之人素所知者以充其數其在京兩制以上聴嵗舉一人其舉狀逐時送下貢院置籍收掌每遇科場詔下即委貢院選擇其日以前舉主最多者取三十人申奏降指揮下本貫敦遣赴闕若舉主數同者即以發狀先後為次謂若俱有三人舉主則取第三狀日月在前者仍於進士奏名額内减三十人候到闕日或陛下臨軒親試或委中書門下試經義䇿一道時務䇿一道但以義理優長為上不取文辭華美若所對經義乖戾聖意及時務全不通曉方行黜落其及第授官並與進士第一甲同在明經之上仍於告身前列坐舉主姓名其所舉之人若犯私罪情理重及正入已贓未及第者舉主減三等已及第者減一等坐之並不以赦原其公罪及私罪情理輕者舉主不坐其未舉以前若曽犯罪除公案見在證騐明白外舉主亦不坐即因勢要屬請求舉及為人屬請并受屬請而舉之者並科違制之罪受􅂍者並以枉法論即敦遣不至者更不就除官若累經敦遣不至即乞朝廷臨時裁度特加聘召不為定制又國家置明經一科少有應者及諸科所試大義有司不以定去留葢由始者立格太髙致舉人合格者少臣欲乞今後明經所試墨義止問正文不問注䟽其所試大義不以明經諸科但能具注䟽本意講觧稍詳者為通雖不失本意而講觧踈略者為粗餘並為不通若能先具注䟽本意次引諸家雜説更以巳意裁定援據該贍義理髙逺雖文辭質直皆為優等與折二通若不能記注䟽本意但以巳見穿鑿不合正道雖文辭辯給亦降為不通其明經以六通諸科以四通以上為合格若合格人少即并取粗多者合格人多即减去通少者委試官臨時相度令合元額又舊制明經以周易尚書為小經今欲乞以周易尚書毛詩為一科三禮為一科春秋三傳為一科皆習孝經論語為帖經又説書一科議者多以為不當廢欲乞與明經並置但每次科場止取十人奏名在諸科額内試中受官並與諸科同若自以本科及第或出身者更不得就試説書如此則求賢之路廣請託之源絶浮偽之風息得人之頌興矣論移張叔詹知蔡州不當狀上乞改知衛州叔詹遂乞致仕朝廷許之右臣竊見前知壽州張叔詹因本路監司奏以本州水災叔詹非才乞别差人尋移知蔡州伏縁壽蔡之民皆陛下赤子叔詹若為政無狀於民有害移彼置此有何所殊况蔡州封部闊逺户口繁庻土饒山林素多盗賊地望之重過於壽州牧守之任尤須擇人豈有因不才被斥更得善處若叔詹實有才能惠及於民則當治本路監司罔上誣賢之罪使叔詹仍居舊任不復移易今臧否不分進退無據衆口籍籍皆云未允臣前上言為治之要在於擇人賞罰此亦擇人不精賞罰不當之一事也况叔詹資性庸下老而益昏本無片長授任過分其為忝冒人盡知之使之從政所至為害伏乞朝廷直令致仕或授以冗散之職勿使親民庶幾黜陟明白無損政體傳家集巻二十欽定四庫全書傳家集巻二十一宋司馬光撰章奏四進五規狀嘉祐六年八月十七日止右臣幸得備位諌官竊以國家之事言其大者逺者則汪洋濩落而無目前朝夕之益䧟於迃闊言其小者近者則叢脞委瑣徒足以煩凂聖聴失於苛細夙夜惶惑口與心謀渉瀝累旬乃敢自决與其受苛細之責不若取迃闊之譏伏以祖宗開業之艱難國家致治之光美難得而易失不可以不慎故作保業隆平之基因而安之者易為功頽壊之勢從而救之者難為力故作惜時道前定則不窮事前定則不困人無逺慮必有近憂故作逺謀燎原之火生於熒熒懐山之水漏於涓涓故作重㣲象龍不足以致雨畵餅不足以療饑華而不實無益於治故作務實合而言之謂之五規此皆守邦之要道當世之切務戇陋狂瞽觸冒忌諱惟知納忠不敢愛死伏望陛下以萬幾之餘㳺豫之間垂精留神特賜省覧萬一有取裁而行之則臣生於天地之間不與草木同朽矣五規保業天下重噐也得之至艱守之至艱王者始受天命之時天下之人皆我比肩也相與角智力而爭之智竭不能抗力屈不能支然後肯稽顙而為臣當是之時有智相偶者則為二力相參者則為三愈多則愈分自非智力首出於世則天下莫得而一也斯不亦得之至艱乎及夫繼體之君羣雄已服衆心已定上下之分明彊弱之勢殊則中人之性皆以為子孫萬世如泰山之不可揺也於是有驕墮之心生驕者玩兵黷武窮泰極侈神怒不恤民怨不知一旦渙然四方糜瀆秦隋之季是也惰者沈酣宴安慮不及逺善惡雜揉是非顛倒日復一日至於不振漢唐之季是也二者或失之彊或失之弱其致敗一也斯不亦守之至艱乎臣竊觀自周室東遷以來王政不行諸侯並僭分崩離析不可勝紀凡五百有五十年而合於秦秦虐用其民十有一年而天下亂又八年而合於漢漢為天子二百有六年而失其柄王莽盗之十有七年而復為漢更始不能自保光武誅除僭偽凡十有四年然後能一之又一百五十有三年董卓擅朝州郡瓦觧更相吞噬至於魏氏海内三分凡九十有一年而合於晉晉得天下纔二十年惠帝昏愚宗室皆構難羣胡乗釁濁亂中原散為六七聚為二三凡二百八十有八年而合於隋隋得天下纔二十有八年煬帝無道九州幅裂八年而天下合於唐唐得天下一百有三十年明皇恃其承平荒於酒色養其疽嚢以為子孫不治之疾於是漁陽竊發而四海横流矣肅代以降方鎮跋扈號令不從朝貢不至名為君臣實為讎敵陵夷衰㣲至於五代三綱頺絶五常殄滅懐璽未煖䖏宫未安朝成夕敗有如逆旅禍亂相尋戰争不息流血成川澤聚骸成丘陵生民之類其不盡者無幾矣於是太祖皇帝受命於上帝起而拯之躬擐甲胄櫛風沐雨東征西伐掃除海内當是之時食不暇飽寢不遑安以為子孫建太平之基大勲未集太宗皇帝嗣而成之凡二百二十有五年然後大禹之迹復混而為一黎民遺種始有所息肩矣由是觀之上下一千七百餘年天下一統者五百餘年而已其間時時小有禍亂不可悉數國家自平河東以來八十餘年内外無事然則三代以來治平之世未有若今之盛者也今民有十金之産猶以為先人所營苦身勞志謹而守之不敢失墜况於承祖宗光美之業􅍕有四海傳祚萬世可不重哉可不慎哉夏書曰予臨兆民懔乎若朽索之馭六馬周書曰心之憂危若蹈虎尾渉於春冰臣願陛下夙興夜􅄰兢兢業業思祖宗之勤勞致王業之不易援古以鍳今知太平之世難得而易失則天下生民至於鳥獸草木無不幸甚矣惜時夏至陽之極也而一隂生冬至隂之極也而一陽生故盛衰之相承治亂之相生天地之常經自然之至數也其在周易泰極則否否極則泰豐亨冝日中孔子傳之曰日中則昃月盈則食天地盈虚與時消息而况於人乎况於鬼神乎是以聖人當國家隆盛之時則戒懼彌甚故能保其令問永乆無疆也凡守太平之業者其術無他如守巨室而已今人有巨室於此將以傳之子孫為無窮之規則必實其堂基壯其柱石彊其棟梁厚其茨葢髙其垣墉嚴其闗鍵既成又擇子孫之良者使謹守之日省而月視欹者扶之敝者補之如是則雖亘千萬年無頽壊也夫民者國之堂基也禮法者柱石也公卿者棟梁也百吏者茨葢也將帥者垣墉也甲兵者闗鍵也是六者不可不朝念而夕思也夫繼體之君謹守祖宗之成法苟不隳之以逸欲敗之以讒謟則世世相承無有窮期及夫逸欲以隳之讒謟以敗之神怒於上民怨於下一旦渙然而去之則雖有仁智恭儉之君焦心勞力猶不能救陵夷之運遂至於顛沛而不振嗚呼可不鍳哉今國家以此承平之時立綱布紀定萬世之基使如南山之不朽江河之不竭可以指顧而成耳失今不為已乃頓足扼腕而恨之將何益矣詩云我日斯邁而月斯征夙興夜寐無忝爾所生時乎時乎誠難得而易失也逺謀易曰君子以思患而豫防之書曰逺乃猷詩云猷之未逺是用大諌昔聖人之教民也使之方暑則備寒方寒則備暑七月之詩是也今夫市井稗販之人猶知旱則資車水則資轍夏則儲裘褐冬則儲絺綌彼偷安苟生之徒朝醉飽而暮饑寒者雖與之俱為編户貧冨必不侔矣今為天下國家者豈可不制治於未亂保邦於未危乎詩云迨天之未隂雨徹彼桑土綢繆牖户今此下民或敢侮予孔子曰為此詩者其知道乎能治其國家誰敢侮之迨天之未隂雨者國家閒暇無災害之時也徹彼桑土者求賢於隠㣲也綢繆牖户者修敕其政事也夫桑土者鴟鴞所以固其室也賢雋者明主所以固其國也國既固巳雖有侮之者庸何傷哉臣竊見國家每邉境有急羽書相銜或一方饑饉餓殍盈野則廟堂之上焦心勞思忘寢廢食以憂之當是之時未嘗不以將帥之不選士卒之不練牧守之不良倉廪之不實追責前人以其備禦之無素也幸而烽燧息五糓登則明主舉萬壽之觴於上羣公百官歌太平縱娯樂於下晏然自以為長無可憂之事矣嗚呼使自今日已徃四夷不復犯邉水旱不復為災則可矣若猶未也則天幸安可數恃哉陛下何不試以閒暇之時思不幸邉鄙有警饑饉洊臻則將帥可任者為誰牧守可倚者為誰雖在千里之外使之常如目前至於甲兵之利鈍金糓之盈虚皆不可不前知而豫謀也若待事至而後求之則巳晩矣夫四夷水旱事之細者也抑又有大於是者陛下亦嘗留少頃之慮乎詩云維此聖人瞻言百里維彼愚人覆狂以喜此言逺謀之難知近言之易行也夫謀逺則似迃似迃則人皆忽之其為害至慘也而無切身之急為利至大也而無旦夕之驗則愚者抵掌謂之迃也冝矣國家之制百官莫得乆於其位求其功也速責其過也備是故或飬交飾譽以待遷或容身免過以待去上自公卿下及斗食自非憂公忘私之人大抵多懐苟且之計莫肯為十年之規况萬世之慮乎自非陛下惕然逺覧勤而思之日復一日長此不已豈國家之利哉此臣日夜所以痛心泣血而憂也昔賈誼當漢文帝之時以為天下之勢方病大瘇又苦􅏓盭又類辟且病痱陛下視方今國家安固公私冨貴百姓樂業孰與漢文然則天下之病無乃更甚乎失今不治必為痼疾陛下雖欲治之將無及矣治之之術非有他竒巧也在察其病之緩急擇其藥之良苦隨而攻之勿責目前之近功期於萬世治安而已矣重㣲虞書曰兢兢業業一日二日萬幾何謂萬幾幾之為言㣲也言當戒懼萬事之㣲也夫水之㣲也捧土可塞及其盛也漂木石没丘陵火之㣲也勺水可滅及其盛也焦都邑燔山林故治之於㣲則用力寡而功多治之於盛則用力多而功寡是故聖帝明主皆銷惡於未萌弭禍於未形天下隂被其澤而莫知所以然也周易坤之初六曰履霜堅冰至霜者寒之始也冰者寒之極也坤之初六於律為林鐘於厯為建未之月陽氣方盛而隂氣巳萌物未之知也是故聖人謹之曰履霜堅冰至言為人君者當絶惡於未形杜禍於未成也繫辭曰知幾其神乎君子知㣲知彰知柔知剛萬夫之望謂此道也孔子謂魯哀公曰昧爽夙興正其衣冠平旦視朝慮其危難一物失理亂亡之端君以此思憂則憂可知矣太宗皇帝命詔宣使河州團練使王繼恩討蜀平之宰相請除繼恩宣徽使太宗不許曰宣徽使位亞兩府若使繼恩為之是宦官執政之漸也宰相固請以繼恩功大他官不足以賞之太宗怒切責宰相特置宣政使以授之真宗皇帝欲與章穆皇后及後宫逰内庫后辭曰婦人之性見珍寳財貨不能無求夫府庫者國家所以飬六軍備非常也今耗散之於婦人非所以重社稷也真宗深以為然遂止由是觀之先帝以睿明卓越防㣲杜漸如此之深可不念哉昔扁鵲見齊桓侯曰君有疾在腠理不治將深桓侯不悦曰醫之好利也欲以不疾為功及在血脉在腸胃桓侯皆不信及在骨髓扁鵲望之遂逃去徐福言霍氏大盛冝以時抑制漢宣帝不從及霍氏誅人為之訟其功以為曲突徙薪無恩澤焦頭爛額為上客故未然之言常見棄忽及其已然又無所及夫晏安怠惰肇荒滛之基竒巧珍玩發奢泰之端甘言悲辭啓僥倖之塗附耳屏語開讒賊之門不惜名噐𨗳僭逼之源假借威福授陵奪之柄凡此六者其初甚㣲朝夕狎玩未覩其害日滋月益遂至深固比知而革之則用力百倍矣伏惟陛下思萬幾之至重覧大易之明戒誦孔子之格言繼先帝之聖志使扁鵲得早從事毋使徐福有曲突之嘆則可以修之於廟堂而德冒四海治之於今日而福流萬世優㳺逍遥而光烈顯大豈不美哉豈不美哉務實周書曰若作梓材既勤樸斵惟其塗丹雘此言為國家者必先實而後文也夫安國家利百姓仁之實也保基緒傳子孫孝之實也辨貴賤立綱紀禮之實也和上下親逺邇樂之實也决是非明好惡政之實也詰姦邪禁暴亂刑之實也察言行試政事求賢之實也量材能課功狀審官之實也詢安危訪治亂納諌之實也選勇果習戰鬬治兵之實也實之不存雖文之盛美無益也臣竊見方今逺方窮民轉死溝壑而屢赦有罪廵門散錢其於仁也不亦逺乎本根不固有識寒心而道宫佛廟修廣御容其於孝也不亦逺乎統紀不明名噐紊亂而彫繢文物修飾容貌其於禮也不亦逺乎羣心乖戾元元愁苦而斷竹數黍敲叩古噐其於樂也不亦逺乎是非錯繆賢不肖混殽而鈎校簿書訪尋比例其於政也不亦逺乎姦暴不誅寃結不理而拘泥㣲文紏擿細過其於刑也不亦逺乎行能之士沉淪草野而考校文辭指决聲病其於求賢不亦逺乎材任相違職業廢弛而檢勘出身比類資序其於審官不亦逺乎乆大之謀棄而不省淺近之言應時施行其於納諌不亦逺乎將帥不良士卒不精而廣聚虛數徒取外觀其於治兵不亦逺乎凡此十者皆文具而實亡本失而末在譬猶膠板為舟摶土為檝敗布為㠶朽索為維畫以丹青衣以文繡使偶人駕之而履其上以之居平陸則渙然信可觀矣若以之渉江河犯風濤豈不危哉伏望陛下撥去浮文悉敦信實選任良吏以子惠庻民深謀逺慮以保安宗廟張布綱紀使下無覦心和厚風俗使人無離怨别白是非使萬事得正誅鋤姦惡使威令必行取有益罷無用使野無遺賢進有功退不職使朝無曠官察讜言考得失使謀無不盡擇智將練勇士使征無不服如是則國家安若泰山而四維之也又何必以文采之飾歌頌之聲眩耀愚俗之耳目哉乞分十二等以進退羣臣上殿劄子嘉祐六年閏八月八日上臣竊以國家張官置吏任事乆則能否著能否著則黜陟明黜陟明則職業修職業修則萬事理此古今致治之要術也今朝廷明知任官不乆之弊然不能變更者其患有二一者仕進資途等級太繁若不踐歴無由擢用二者嵗月叙遷有増無减員少人多無地可處此所以熟視日乆而無如之何者也臣嘗不自知其愚賤私為陛下慮之竊以今之所謂官者古之爵也所謂差遣者古之官也官以任能爵以疇功今官爵混淆品秩紊亂名實不副員數濫溢是以官吏愈多而萬事益廢欲治而清之莫若於舊官九品之外别分職任差遣為十二等之制以進退羣臣謹具條列如左一十二等之制宰相第一兩府第二兩制以上第三三司副使知雜御史第四三司判官轉運使第五提㸃刑獄第六知州第七通判第八知縣第九幕職第十令録第十一判司簿尉第十二其餘文武職任差遣並以此比類為十二等若上等有闕即於次等之中擇才以補之一十二等之中舊無員數者並乞以即今人數為定員自今有闕則補不可更増一十二等之人徳行學術政事勇略錢糓刑獄文辭各隨才授任其提㸃刑獄以上皆無罷滿之期知州知縣縣令四年餘皆三年為滿未滿之間稱職有功則改官益禄賞賜奬諭仍居舊任必須上等有闕然後選擇遷補其不能稱職者則移易黜廢有罪者貶竄刑誅一同等之人雖名有尊卑事有閒劇地有逺近治有小大遇遷補之時不復以資任相壓皆合為一等選擇進用一提㸃刑獄以上伏乞陛下與執政大臣親加詳擇其知州以下委之審官院幕職以下委之流内銓遇上等有闕即於次等之中取職業修舉功利及民累經襃賞或有舉主數多者次取常調少過者以次遷補一應磨勘合改京官人且依常調差遣須候上等有闕即取有功或舉主最多者以次遷補其自幕職入知縣者並改京官一因資䕃得京官者分監當為三等初任皆入下等監當候中等上等有闕亦依簿尉令録之制取有功或舉主多者以次遷補若知縣有闕則與幕職混同遷補但不改官而巳仍自今後以資䕃授官者須歴簿尉不得直除京官一應因貪虐不公或昏懦廢職坐除免停替之人永不得復舊等差遣内别無入已贓曽經叙理得差遣或降充監當者五年之外有舉主五人以上聴復舊等差遣右十二等之制伏望裁擇或有可采乞下公卿大臣詳議然後施行取進止乞施行制䇿劄子右臣竊以國家本置六科葢欲以上觀朝政之得失下知元元之疾苦非為士人設此以為進取之階也臣昨差覆考應制舉人所試䇿竊見上等三人所陳國家大體社稷至計其間甚有可采擇者伏望陛下取正本留之禁中常置左右數加省覧以為儆戒其副本下之中書令擇其所言合於當今之務者奏而行之使四方之人皆知朝廷求直言之士非以飾虚名乃取其實用也及臣前所獻五規雖智識闇淺辭語鄙陋然皆臣夙夜盡忠竭誠以思治世之要道非指陳一事之得失於有司無所施行亦望陛下以視朝之隙時取觀之庻幾於聖政或有萬分之益取進止傳家集巻二十一欽定四庫全書傳家集巻二十二宋司馬光撰章奏五乞建儲上殿劄子嘉祐八年閏八月二十六日上臣先於至和三年通判并州事日三曽上言乞陛下早定繼嗣以遏亂源當是之時臣䟽逺在外猶不敢隠忠愛死數陳社稷至計况今日侍陛下左右官以諌諍為名竊惟國家至大至急之務無先於此若捨而不言專以冗細之事煩凟聖聴厭塞職業是臣懐姦以事陛下罪不容於葅醢伏望陛下取臣曏時所進三狀少加省察或有可取乞斷自聖志早賜施行如此則天地神祗宗廟社稷羣臣百姓並受其福惟在陛下一言而巳取進止乞建儲上殿第二劄子尋有詔以濮王子宗實知宗正寺臣近於前月二十六日上殿敷奏乞檢㑹臣在并州所奏三狀早定繼嗣事陛下聖意昭然即垂聴納凡所宣諭皆非愚臣所能及此乃天神地祗保佑皇家實萬世無疆之休也臣謂陛下朝夕當發德音宣告大臣施行其事今將近一月未有所聞豈陛下以兹事體大慎選宗室未得其人將左右之人有所間阻熒惑聖聴臣皆不得而知也臣聞為人後者為之子也著於禮律皆有明文漢孝成帝即位二十五年年四十五以未有繼嗣立弟子定陶王欣為太子今陛下即位之年及春秋皆巳過之豈可不為宗廟社稷深思逺慮哉况今亦未使之正東宫之名但願陛下自擇宗室仁孝聪明者養以為子官爵居處稍異於衆使天下之人皆知陛下意有所屬以係逺近之心俟他日皇子生復使之退歸藩邸有何所傷此誠天下安危之繫願陛下决意而速行之取進止論荒政上殿劄子臣竊聞淮南両浙今嵗水災民多乏食徃徃羣軰相聚操執兵仗販鬻私鹽以救朝夕至有與官軍拒鬭相殺傷者若浸淫不止將成大盗朝廷不可不深以為憂葢由所司㩁之太急故抵冒為姦臣聞周禮以荒政十有二聚民近者朝廷略以施行惟舎禁除盗賊二者似未留意今赤子凍餒濵於溝壑柰何尚與之爭錙銖之利豈為民父母之意哉臣謂陛下冝戒諭職司使明體朝意稍弛鹽禁而嚴督盗賊緩課利不充之罰急羣行剽刼之誅廢告捕私鹽之賞旌討擒彊暴之功棄聚斂之小得保安全之大福除惡於纎介弭亂於未形最䇿之得者也取進止論勸農上殿劄子嘉祐六年上得㫖依臣聞食者生民之大本為政之首務也饑饉之世珠玉金銀等於糞土惟糓之為寳不可一日無也今國家每下詔書必以勸農為先然而農夫日寡㳺手日繁豈非為利害所驅耶今農夫苦身勞力惡衣糲食以殖百糓賦斂萃焉徭役出焉嵗豐則賤糶以應公上之須給債家之求嵗㓙則流離異鄉轉死溝壑如是而欲使夫商賈末作之人坐漁厚利鮮衣美食者轉而縁南畮斯亦難矣然則勸農者言也害農者政也天下生之者益少食之者益多欲糓之無涸得乎哉為今之術勸農莫如重糓重糓莫如平糴使諸路轉運使及州軍長吏遇豐嵗能廣謀糴入官滿之日倉庫之實比於始至増羨多者賞之其無水旱之災益兵之費而蓄積耗減者黜之又令民能力田積糓者不以為家貲數如是則糓重而農勸雖有饑饉常無流亡盗賊之患矣今嵗河北河東㳂邉糓糴至賤此亦國家所冝留意者也取進止論臣寮上殿屏人劄子嘉祐六年九月二十八日奉聖㫖依行臣等竊聞自先帝以來應兩府臺諌官等上殿奏事左右侍臣悉皆屏退葢以君不宻則失臣臣不密則失身重愼樞機不得不爾竊見近日臣寮上殿奏事左右侍臣不遵舊制或有進至殿角板障門以裏與御坐相去不過數歩陛下徳音及羣臣敷奏之語皆可聴聞其間有機宻大事若致漏泄大為不便欲乞一依舊制今後應遇兩府臺諌官等上殿奏事其左右侍臣並於殿角板障門外踏道下祗候仍乞委都知押班於兩邊板障門外檢校如敢竊有覘聴者並具姓名聞奏勘罪施行取進止論制䇿等第狀既上而執政以􅝲所試進呈欲黜之上曰其言切直不可棄也乃降一等収之即蘇轍也右臣近䝉差赴崇政殿後覆考應制舉人試巻内􅱹􅝲両號所對策辭理俱髙絶出倫軰然􅝲所對命秩之差虚實之相養者一兩事與所出差舛臣遂與范鎮同議以􅱹為第三等􅝲為第四等詳定官巳定從覆考竊知初考官以為不當朝廷更為之差官重定復從初考以􅝲為不入等臣竊以國家置此六科本欲取材識髙逺之士固不以文辭華靡記誦雜傳為賢􅝲所試文辭臣不敢復言但見其指陳朝廷得失無所顧慮於四人之中最為切直今若以此不䝉甄收則臣恐天下之人皆以為朝廷虚設直言極諌之科而􅝲以直言被黜從此四方以言為諱其於聖王寛明之德虧損不細臣區區所憂正在於此非為臣已考為髙等苟欲遂非取勝而已也伏望陛下察臣愚心特收􅝲入等使天下之人皆曰􅝲所對事目雖有漏落陛下特以其切直收之豈不美哉乞免北使状嘉祐六年閏八月六日上右臣竊知已降勅命差臣充北朝國信使臣縁名犯北朝諱所行文字雖可以更改竊慮臨時語言不能記憶或有觸犯兼臣體羸多病性不耐寒若渉窮荒必生疾病非敢自愛恐於王事有所廢闕伏望聖慈矜憫别賜差官在於愚臣實為至幸第二狀尋改差人右臣先曽奏乞免充北朝國信使至今未奉朝㫖竊以專對之任亦須擇才臣不惟名犯北朝諱及性不耐寒兼臣不經接伴未能諳練南北事體資性拙訥恐辱王命伏望聖慈矜察早賜選差曽經接伴之人充國信使所貴臨事不至闕誤論燕飲狀嘉祐六年與王樂道同上右臣等竊見今嵗以來災異屢臻日食地震江淮騰溢風雨害稼民多菜色此正陛下側身克己眚禮蕃樂之時而道路之言皆云陛下近日宫中燕飲㣲為過差賞賚之費動以萬計耗散府庫調斂細民况酒之為物傷性敗徳禹湯所禁周公所戒殆非所以承天憂民輔養聖躬之道也陛下恭儉之徳彰信兆民議者皆以為後宫奢縱務相誇尚左右近臣利於賞賚陛下重違其請屈意從之夫天以剛健為徳君以正固為事柰何狥後宫左右之欲上忽天戒下忘民病中不為宗廟社稷深自重惜臣等愚惑竊為陛下不取也伏望陛下當此之際悉罷燕飲安神養氣後宫妃嬪進見有度左右小臣賞賚有節及厚味腊毒之物無益奉養者皆不冝數御以傷天和乃可以解皇天譴告之威慰元元困窮之望保壽命無疆之休天下羣生不勝幸甚臣等區區納忠忘死惟陛下裁察論兩府遷官狀右臣伏見朝廷因進用宰臣韓琦等凡兩府之臣盡遷一官臣愚不明大體未識所謂竊恐從此相承遂為故事凡公卿者百吏之表率今國家方以百吏繁冗思革其弊而公卿無故一切遷官將何以使三百赤芾受爵不讓者有所愧心哉况慶厯中陛下以數月不雨執政之臣皆降一官以荅天戒今嵗日食地震河及江淮汎溢横流烈風淫雨賊傷五稼四方之民墊溺流餓不可勝紀比於慶厯災害尤衆而兩府大臣無問新舊皆被褒遷殆非所以仰承天心下慰衆庻之意也竊計大臣當此之際亦必不敢受無名之賞伏望陛下因其辭讓内惟樞密使副使不可以給諌及即中為之者依舊制外其餘皆不遷官以飬大臣廉讓之節無使之負謗於海内則其為徳澤愈厚矣論夜開宫門狀有㫖劄送皇城司右臣竊聞今月二十五日十三公主薨其日宫中送殯出城留宫門及城門至夜深方閉物情駭異以為非冝雖陛下慈愛至深然門闕之禁不可不嚴若以式律言之夜開宫殿門及城門者皆須有墨勅魚符其受勅人具録所開之門并出入人帳送中書門下自監門衛大將軍以下俱詣閤覆奏御注聴即請合符門鑰監門官司先嚴門仗所開之門内外並立隊燃炬火對勘符合然後開之符雖合不勘而開若勘符不合而為開及不承勅而擅開閉若得出入者剰將人出入其刑名輕者徒流重者處絞今以乳兒出殯之故内自禁掖外逹郊野諸門洞開一如晝日車馬徃來絡繹不絶出入之人無復譏訶有如萬分之一姦險不逞之人雜處其間豈可不為之寒心哉伏望陛下深鑒安危防㣲杜漸自今宫殿門城門並須依時開閉非有急切大事勿復夜開必不得巳須至夜開者即乞陛下親降手勅加以御寳受勅之人仍冩出入人帳委宿衛當上之官衆共驗勅文真的然後覆奏候再見御批方請門鑰與監門官親自監開依帳㸃閲人數放令出入即時下鏁進納門鑰其宿衛監門官司若不見手勅及御批而輙敢開者依不承勅而擅開閉律文施行雖有手勅御批不叅驗及不親自監開㸃閲人數者依符雖合不勘而開律文施行庻可以養萬乗之威尊消姦宄於未萌也
