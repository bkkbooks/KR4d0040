front:
  text: 四劄子臣累日前上殿言勾當御藥院髙居簡自先帝時竊弄權柄陛下復寵而信之大為聖徳之累乞治其罪陛下許臣送樞宻院施行至今未聞有指揮不知居簡以何道結陛下能如此之深也居簡所能止於讒佞佞者不過巧言令色希意迎合快人主之欲以市其權使人主溺於荒宴而不自知也讒者不過離人君臣間人骨肉惑人主之心以固其恩使人主陷於傾危而不自寤也有是二者又可近乎曏使陛下即位嵗乆功業已成而有讒佞之臣始得幸天下有識者猶當寒心何則知其必為禍亂之階也况今初承大統當銳精求治之時而遽留居簡於左右仍加寵信根􅎞已牢則異日之憂可勝道哉此臣所以不避死亡而必當力争者也或聞陛下欲待居簡自求引退然後遣去臣誠戇愚未曉所謂若國之大臣耆年有徳聞望素髙一旦偶有小失未為外人所知陛下務存終始使自引去以全其名則可矣其挾姦作慝者猶宜明正刑書况居簡閨闥小臣罪惡盈積所宜肆諸市朝宣示四方以戒憸人而尚足為之隠乎且居簡姦邪播聞逺近陛下今日雖為之隠天下耳目庸可蔽乎凡居簡所以能為惡者以其自託宫禁譬如狐鼠依慿城社彼惟恐離去左右豈肯自陳求退乎伏望陛下盡出羣臣前後所言居簡事状送居簡付所司明治其罪以彰至公之道取進止
