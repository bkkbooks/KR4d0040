body:
  text: 言髙居簡第五上殿劄子當日罷居簡御藥院除供備庫使臣聞邪正不可同朝猶冰炭不可同器陛下不知臣不肖使待罪御史中丞臣四次上言勾當御藥院髙居簡工讒善佞不宜寵信置於左右所言無取不䝉省錄臣實無顔尚居風憲若陛下以臣為拙直則居簡為姦邪若以居簡為忠良則臣為讒慝臣與居簡勢難兩留況臣守官京師十有一年自先帝時累曽陳乞外任伏望聖慈罷臣御史中丞除一外任差遣取進止言王中正劄子治平四年七月二十七日上臣伏見陛下前者盡罷寄資内臣髙居簡等令補外官中外欣然無不稱頌聖徳尋聞復留陳承禮劉有方二人又以王中正勾當御藥院衆頗失望臣竊惟祖宗之意以御藥一職最為親宻過供奉官以上輒令罷去者迺以防微杜漸詒謀萬世憂深思逺誠自古帝王之所不及子孫所宜謹守不許失墜者也近歳以來左右之臣既戀權勢又貪祿位遂求闇理資序豫支俸給名曰寄資以欺誑外人此豈祖宗之意邪今陛下欲振舉紀綱一新治道必當革去乆弊一遵正法夫法如隄防常應完固迺得無患一有蟻壤泄之則漸致潰敗不可復救近習之臣朝夕在側因縁祈恩無有窮極不以祖宗舊法制之恐陛下他日亦將厭之也況王中正素聞姦猾頗好招權今處之要職是去一居簡得一居簡也伏望陛下一依前降指揮盡罷寄資者令補外官以成聖徳之美別擇内供奉以下樸直廉謹者使勾當御藥院以存祖宗之法取進止言王中正第二劄子臣竊聞陛下好令内臣采訪外事及問以羣臣能否臣愚竊以為非宜陛下内有兩府兩制臺諫外有提轉牧守皆腹心耳目股肱之臣也陛下誠能精擇其人使之各舉其職薦舉賢能糾案姦慝論政事得失述民間利病皆令列於奏牘明白啟陳其有尸祿偷安及挾私欺罔者小則罪黜大則誅竄誰敢不盡公竭誠以承休徳如此則天下之事猶一堂之上陛下何患於不知哉今若深處九重之内詢於近習之臣采道聽塗說之言納曲躬附耳之奏不騐虚實即行賞罰臣恐讒邪得以逞其愛憎而陛下為之受其譏謗也近聞王中正差徃陜西勾當公事有知涇州劉渙等曲加諂奉鄜延路鈐轄吴舜臣違失其意俄而渙等進擢舜臣降黜衆人皆言中正所為審或如此則是中正弄權已有明驗今陛下又置之肘腋委以腹心臣恐天下之人將重足一迹而畏之輿金輦璧而奉之矣外議又言山陵禮畢韓琦必求引退兩府當有遷補臣竊慮兩制以上萬一有無亷耻之人或隂結此屬以求進用者夫以尭之聦明咨於四岳衆言僉同然後用人猶失之於鯀況可决於近習之口乎凡公忠正直之士必不肯借譽左右以求自售齊威王所以賞即墨大夫而烹阿大夫正謂此也昔漢唐之衰宦官所以能壊亂綱紀傾覆國家者皆由人主與之謀議幃幄進退羣臣故也此乃治亂安危之本不可不察伏望聖慈詳思臣言凡欲知天下之事當詢訪外廷之臣其王中正不可令勾當御藥院或姦佞之臣豫設機謀以經營兩府者必不可用則天下幸甚取進止言王中正第三劄子臣伏奉手詔節文問王中正等事得之於何人可宻奏來臣以非才誤受陛下聖知擢為御史中丞惟懼曠職孤忝大恩每與賔客語言無不詢訪時事稍有毫髮禆益盛徳率皆奏陳此事臣得之於賓客前後非止一人誠恐玷累公朝所以有此論述中正有無此事惟陛下可以知之臣在闕門之外何由知其虚實若其果有此事陛下得以為戒若其無有臣敢避妄言之辜但外人有此議論臣不敢不令陛下知之萬一有益聖明皆微臣之幸也取進止言石椁劄子治平四年九月八日上臣伏見永厚陵皇堂巻軬石四重其二重並寄於枋木之上陛下孝心深逺以為異日枋木終歸朽腐石若隕墜於梓宫非便發自聖謀欲為石椁其修奉山陵都護宋守約鈐轄張若水以䇿非巳出百端沮難苟欲修飾目前自營私計不為梓宫萬世之慮為人臣子不忠如此乃敢令石匠作頭供狀稱八月二十七日進入梓宫後連夜造作計二十四時辰了畢如䝉別差人定奪却不依今來所定時辰先得了當甘軍令不辭公列奏牘誑惑朝廷是致掩閉皇堂及虞祭并木主到京之日皆曽改移臣昨充山陵儀仗使目覩内臣黄懐信用夷牀澁牀等下梓宫數刻之間安厝巳畢乃知守約若水等欺罔聰明輕侮邦憲若不懲戒則不公挾詐之人將何所忌憚伏望陛下治守約若水等罪嚴行責降若升袝畢有赦守約若水等縁修奉山陵得罪特乞不原其黄懐信等冝優與酧奬貴使賞罰明白人知聳畏取進止辭賜金劄子治平四年七月二十日上臣先奉勅充山陵儀仗使巳䝉聖恩賜絹一百匹錢二百貫文充盤纒於今月二十九日又降中使賜臣箔金五十兩并銀合重三十兩臣不敢仰違詔㫖雖巳奏謝訖然竊聞嘉祐八年永昭陵時不曽有此例私心惶恐深不自安臣聞人君不行無功之賞則羣下勸人臣不受非分之賜則亷耻立今臣等雖備位五使猶在京城跬歩之勞亦未嘗有以何勲效再受重賜況臣職在執憲當抑絶僥倖而身自為之將何以糾其他人其箔金并銀合伏望聖慈許令回納入庫庶使下臣有以自容取進止辭賜金第二劄子治平四年八月二日上臣前日䝉恩賜金五十兩并銀合臣以所賜過厚尋問永昭陵禮儀使范鎮知舊例所無不敢當受遂具奏陳乞許令回納伏䝉聖慈特降中使宣諭令受臣上荷恩遇至深至重螻蟻微命不足為報愧懼流汗無所容措然臣竊聞昔韓昭侯有弊袴命藏之侍者曰君仁君也不以賜左右而藏之昭侯曰吾聞明主愛一嚬一笑嚬有為嚬笑有為笑今袴豈特嚬笑哉吾必待有功者彼一弊袴猶不可以與無功之人況數十兩之金乎魏太祖之為政有功宜賞不吝千金無功妄施分毫不與我太祖太宗之御臣下亦然故能驅駕英豪光啟大業夫明主之不妄賞賜非吝之也誠以賜一無功則天下無功之人皆有徼覬之心有功之人皆懐怨望故也借使一人有功而人主賜之一金無功者不得其有功者必喜何則衆人不得而我獨得之是人主知我之功也其榮多矣如是則智者獻其謀勇者竭其力雖使之赴湯火猶將甘而樂之若有功者賜千金無功者亦賜千金其有功者必不恱何則彼無功而我與之均是人主待我無以異於彼也其辱深矣如是則有功者莫不解體誰肯竭其智力觸冒死亡以狥國家之急哉故官爵金帛者人主所以鼓舞羣情使之奔走左右而不自知者也然則明主愛一嚬一笑豈為過論哉仁宗皇帝天性寛仁承累世餘烈府庫充實身雖節儉而好施於人羣臣左右貪求無厭賜予之例因兹寖廣府庫之積日益减耗不幸又於五年之中再遭大喪左藏内藏奉宸等庫率皆空竭當此之時舊例所有猶宜䥴减以救其弊況可以例外横賜無功之人乎且陛下以國用不足之故永厚陵猶遵遺制比永昭陵事事裁减而所賜羣臣之物反更多於永昭陵之時臣雖小人貪昧財賄揣循此理能自安乎此臣所以夙夜憂惶無以自處者也况府庫之物迺天下萬民之物也自非有功於民者皆不宜得之臣所以仰違詔命堅辭賜物至於再三者非自以飾小廉也廼欲助陛下成治道也伏望聖慈察其誠懇依臣前奏許令將所賜金并銀合囘納入庫取進止傳家集巻三十九欽定四庫全書傳家集巻四十宋司馬光撰章奏二十三議謀殺巳傷案問欲舉而自首狀知登州許遵奏婦人阿云於母服内與韋阿大定婚成親後嫌韋阿大夜間就田中用刀斫傷縣尉令弓手勾到阿云問是你斫傷本夫實道來不打你阿云遂具實招通合作案問欲舉减二等大理寺不合作謀殺已傷絞罪㫁遣下刑部定得大理寺允當遵不服詔下光與安石定奪安石以為遵議是後朝廷竟從安石議右臣竊以為凡議法者當先原立法之意然後可以㫁獄竊詳律文其於人損傷不在自首之例注云因犯殺傷而自首者得免所因之罪仍從故殺傷法所謂因犯殺傷者言因犯他罪本無殺傷之意事不得巳致有殺傷除為盗之外如刼囚略賣人之類皆是也律意盖以於人損傷既不得首恐有别因餘罪而殺傷人者有司執文并其餘罪亦不許首故特加申明云因犯殺傷而自首者得免所因之罪然殺傷之中自有兩等輕重不同其處心積慮巧詐百端掩人不備者則謂之謀直情徑行略無顧慮公然殺害者則謂之故謀者尤重故者差輕今此人因犯他罪致殺傷人他罪雖得首原殺傷不在首例若從謀殺則太重若從闘殺則太輕故酌中令從故殺傷法也其直犯殺傷更無他罪者惟未傷則可首但係已傷皆不可首也今許遵欲將謀之與殺分為兩事案謀殺故殺皆是殺人若將謀之與殺分為兩事則故之與殺亦是兩事也且律稱得免所因之罪彼刼囚略人皆是巳有所犯因而又殺傷人故刼略可首而殺傷不原若平常謀慮不為殺人當有何罪可得首免以此知謀字止因殺字生文不得别為所因之罪也若以刼鬭與謀皆為所因之罪從故殺傷法則是鬭傷自首反得加罪一等也遵所引蘇州洪祚㫁例案律疏云假有因盗故殺傷人而自首者盗罪得免故殺傷罪仍科疏既指言故殺傷人則是因盗謀殺傷人者自從謀法當時法官誤斷不可用例破條遵又引編勅謀殺人傷與不傷罪不至死者並奏取勅裁以為謀殺已傷而罪不至死者即是自首之人按尊長謀殺卑幼之類皆是巳傷而罪不至死不必因首也遵又引律疏問答條云謀殺凡人乃云是舅又云謀殺之罪首盡顯是謀殺許令自首案彼皆謂謀而未傷方得首免若其巳傷何由可首凡議罪制刑當使重輕有叙今若使謀殺巳傷者得自首從故殺傷法假有甲乙二人甲因鬭毆人鼻中血出既而自首猶科杖六十罪乙有怨讐欲致其人於死地暮夜伺便推落河并偶得不死又不見血若來自首止科杖七十罪二人所犯絶殊而得罪相埒果然如此豈不長姦況阿云嫌夫醜陋親執腰刀就田野中因其睡寐斫近十刀斷其一指初不陳首直至官司執錄將行栲棰勢不獲已方肯招承情理如此有何可憫朝廷貸命編管已是寛恩而遵更稽留不斷為之伸理欲令天下今後有似此之類並作减二等㫁遣竊恐不足勸善而無以懲惡開巧偽之路長賊殺之原姦邪得志良民受弊非法之善者也臣愚以為大理寺刑部所定巳得允當難從許遵所奏作案問欲舉减等而科今來與王安石各有所見難以同共定奪伏乞朝廷特賜裁酌施行議貢舉狀熈寕二年五月上臣准御史臺牒准勅節文天下學校貢舉之法宜令兩府兩省待制以上御史臺三司三館臣僚各限一月具議狀聞奏者臣聞詩云無競惟人四方其訓之言欲立强於天下者無如得人得人而任之以事則四方斯順之矣臣竊惟取士之弊自古始以來未有若近世之甚者也何以言之自三代以前其取士無不以徳為本而未嘗專貴文辭也漢氏始置茂才孝廉等科皆命公卿大夫州郡舉有經術徳行者䇿試以治道然後官人故其風俗敦尚名節降及末世雖政衰於上而俗清於下由取士之術素加奬厲故也魏晋以降貴通才而賤守節習尚浮華舊俗益敗然所舉秀孝猶以經術取之州郡皆置中正以品其才行一言一動之失或終身為累士猶兢兢不敢自放隋始置進士唐益以明經等科而秀孝遂絶止有進士明經二科皆自投牒求試不復使人察舉矣進士初但試䇿及長安神龍之際加試詩賦於是進士專尚屬辭不本經術而明經止於誦書不識義理至於徳行則不復誰何自是以來儒雅之風日益頽壊為士者狂躁險薄無所不為積日既乆不勝其弊於是又設謄錄封彌之法盖朝廷苦其難制而有司急於自營也夫欲搜羅海内之賢俊而掩其姓名以考之雖有顔閔之徳苟不能為賦詩論䇿則不免於遭擯棄為窮人雖有跖蹻之行苟善為賦詩論䇿則不害於取髙第為美官臣故曰取士之弊自古始以來未有若近世之甚者非虚言也今幸遇陛下聖眀心知貢舉之極弊慨然發憤深詔羣臣使得博議利病更立新規是千載一時也議者或曰古人郷舉里選今欲知士之徳行宜委知州知縣者采察其實保而薦之臣獨以為不然古者分地建國自卿大夫士皆以其國人為之猶患處士之徳行不可得而詳也故又擇其郷之賢者使為閭胥比長自幼及長朝夕察其所為然後士之徳行美惡莫得而隠也今夫知州知縣雜四海九州之人逺者三嵗而更近者數月而更或初到官即遇科塲遽責之知所部士人之徳行誠亦難矣又應開封府舉者常不减數千人而開封府獄訟之繁知府者自旦至暮耳不暇聴目不暇視又有餘裕可使之察數千人之徳行乎議者又曰宜去封彌謄錄委有司考其文辭参以行實而取之臣獨以為不然夫士之徳行知州縣者尚不能知而有司居京師一旦集天下之士獨以何術知之其術不過以衆人之毁譽決之孔子曰衆好之必察焉衆惡之必察焉夫衆之毁譽庸詎足以盡其實乎必如是行之臣見其愛憎互起毁譽交作請託公行賄賂上流謗讟並興獄訟不息將紛然殽亂朝廷必厭苦之而復用封彌謄錄矣夫封彌謄録固為此數者而設之也譬猶築防以鄣洚水也今不絶其源而徒去其防則横流之患愈不可救矣臣雖至愚平生固嘗竭其思慮欲以少救其弊今敢陳二䇿乞陛下俯加裁擇臣聞上之所為下之所歸也國家從來以賦詩論䇿取人不問徳行故士之求仕進者日夜孜孜專以習賦詩論䇿為事惟恐不能勝人父教其子兄勉其弟不是過也今若更以徳行取人則士之力於徳行亦猶是也誠風化清濁之原歴代訛謬而不寤必待聖朝然後正之者也夫徳行修之於心藏之於身雖家人有所不知况於郷黨况於州縣况於朝廷將何從知之故必待明哲公正之臣知而舉之然後四海之士皆可得而官使也然舉薦之法既行則干求屬請誠所不能無也要在所舉非其人者國家以嚴法繩之勿加恩貸則苟且狥私之人皆知懼矣且國家既以徳行取士則彼貪猾輕躁之人依附權要枉道求進者皆為清議所貶見棄於時雖有舉者必不多矣臣愚欲乞今後應係舉人令升朝官以上嵗舉一人提㸃刑獄以上差遣者嵗舉二人諫議大夫或待制以上嵗舉三人不以所部非所部鄉里非鄉里除自已親戚及曽犯真刑或私罪情理重曽經罰贖及不孝不友盗竊淫亂明有迹狀者不得舉外其餘皆得舉之仍於舉狀内眀言臣今保舉某州某科某人有學術節行乞賜召試若舉狀既上之後却有前後諸般違礙事發其舉主並依律文貢舉非其人分故失從公私罪定斷受贓而舉者以枉法論其舉狀逐時送下禮部貢院置簿記錄若應舉人而不舉者嵗終委貢院勘㑹姓名開奏乞嚴加朝典每遇三年一開貢舉委貢院截自詔下之日勘㑹選擇舉主最多者從上取之舉主數同則以舉狀到省月日先後為次其舉主曽有􅂍罪及見停閒身亡或在合舉人數外者並不使倍於每次科塲南省奏名人數具姓名聞奏乞下本貫發遣赴闕其本貫更不考試即具申狀解送赴貢院仍出公憑給付逐人令赴貢院照㑹限十一月内取齊十二月内引見正月内委貢院考試其試官或朝廷臨時添差進士試經義䇿三道子史䇿三道時務䇿三道更不試賦詩及論明經及九經等諸科試本經及論語孝經大義共四十道明經加試時務䇿三道其帖經墨義一切皆不試對䇿及大義但取義理優長不取文辭華巧唯所對經史乖僻時務疎濶者即行黜落其奏名人數並依科塲舊制若合格者少不滿舊數亦聽至御試時進士明經各試時務䇿一道九經等諸科試本經大義十道所有名字髙下並只以舉主多者為上舉主數同則以舉狀到省月日先後為次其舉人所納家狀及授官後吏部所給告身並湏開坐元初舉主人數姓名若及第後犯私罪情理重及贓罪其舉主並减一等坐之未及第者减三等皆不以去官及赦原如此則羣臣不敢挾私妄舉士人皆崇尚經術重惜操履風俗丕變矣朝廷若不能行此保舉之法其次莫若修學校之法以取之臣伏見自慶厯以來天下諸州雖立學校大抵多取丁憂及停閒官員以為師長藉其供給以展私惠聚在仕官員及井市豪民子弟十數人遊戯其間坐耗糧食未嘗講習修謹之士多耻而不入間有二千石自謂能興學者不過盛修室屋増置莊産廣積糧儲多聚生徒以采虚名師長之人自謂能立教者不過謀其出入節其遊戯教以鈔節經史剽竊時文以夜繼晝習賦詩論䇿以取科名而已此豈先王立學之意邪於以修明聖道長育人材化民成俗固已疎矣臣欲乞自今天下州學只許置教授一人委本州長吏於本處命官中選擇無過犯有節行能講説為衆所服者舉奏補充若本州無人則奏乞下銓司選差委銓司於見在銓選人内揀選進士明經諸科出身人歴任無贓私罪能講說經書者奏補充逐州教授仍令國子監試講說經書應舉人初入學者並為外舍生唯赴聽講及公試外不得於學中宿食其教授每日講書畢取在學諸生姓名書於籖上雜置筩中抽取三人問以聽過書中疑義三條使對衆解說通者置簿記録粗者不問不者有罰每月中兩次公試各試所習舉業委教授考校定優劣等第具姓名出榜示訖亦置簿記錄其有過犯者小過則罰錢中過則降等謂自内舍髙等降為中等中等降為初等初等降為外舍生外舍生無等可降者勒出學大過則斥出學亦置簿記錄每遇春秋釋奠畢委教授選擇外舍生到學及半年以上自前次釋奠以來說書多通公試多在優等姓名近上即為優等過犯情輕少即升入内舍為初等生始聽於學中宿食又選擇初等生升為中等生中等生升為髙等生皆如外舍生之法其有二人已上比較難決者即特令說書及試所業以決之皆湏具狀申本州委知州通判更加審覆委得公當然後給牒補之如後来有過降等者其牒即行抽取毁抹其教授選擇紏舉升降等第若有不公委知州通判覺察取勘聞奏乞行衝替其開封府舉人舊無府學並令寓教於國子監其國子監舉人湏實是品官子弟方得依條入學其教試選升之法並於外州同以直講比教授判監同判監比知州通判凡國子監開封府及諸州軍内舍髙等生額並用本處解額之半解額有竒數者入髙等生額假若解額三人則以二人為髙等生額其中等倍髙等初等倍中等若人數未足則闕之不得溢額補人若遇詔下開貢舉委本處判監同判監知州通判截自其日勘㑹髙等生補及半年以上者具姓名結罪保明聞奏開封府舉人只委判監同判監保明仍給與公慿許令免解直就省試其髙等生占不盡解額方許本處其餘舉人取解其中等初等生於取解時仍别立號常比其餘舉人多取分數所有髙等生至省試亦别立號每七人中取一人奏名如此則舉人亦稍嚮經術敦行義矣夫經術深淺非程試所能知行義美惡非朝夕所能察今使之處於學校經二三年累經選擇升至髙等又占解額妨衆人進取之路若其行義少有過差必不為衆人所容矣由此觀之其髙等生經術則講說常通文藝則屢入優等過犯則全然輕少行義則為衆所服比之糊名謄錄考其一日所試賦詩論䇿偶有所長而取之者相去逺矣況近年舉人或一無行能横遇恩澤幸得免解者不可勝數今髙等生行能如此裁免一解豈足惜哉此學校之法也若朝廷又不能如此只於舊條之中毛舉數事微有更張則於取士之道並無所益徒更煩苛不若悉循舊貫之為愈也議繫宫親人鏁應狀治平元年上先准嘉祐三年八月二日中書劄子供繫宫親授班行人云云右看詳繫宫親人並是三代食祿之家有人保任方得充避比於工商雜類納財授官之人流品殊勝其中固有竒才異行可以進用豈可止以連姻帝族遂同贓私罪犯之人不得鏁㕔應舉求諸義理全無意謂欲乞今後應與宗室女為親補轉班行者如别無事節違礙科塲條貫並許依其他武臣例鏁㕔應舉以廣求賢之路傳家集巻四十欽定四庫全書傳家集卷四十一宋司馬光撰章奏二十四論
