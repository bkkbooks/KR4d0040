body:
  text: 乞矜恤陳洙遺孤狀嘉祐六年九月二十三日上右臣竊見殿中侍御史裏行陳洙資性忠果憂公忘私禀命不永奄辭聖世垂没之際猶上章奏搢紳之倫靡不嗟惜冝有旌嘉異於諸臣家素貧乏孤遺頗衆歸葬閩越道塗險逺伏望朝廷特賜矜憫依監察御史裏行張宗誼例除子男一人官及乞降朝㫖下衢信建三州候洙喪柩至彼差人防䕶津送前去亦足以示朝廷襃直勸忠終始之恩也論環州事冝狀嘉祐六年十月初一日上右臣竊知環州熟户蕃部屯聚攻刼殺傷兵民雖犬羊之衆人面獸心緩之則驕急之則叛固其常性亦由將吏恩不能懐威不能服信不能結勇不能斷平居無事則擾之使亂及其陸梁又不能制是使戎狄順服王化則侵苦不安桀驁鴟張則冨饒熾大凡邊境所以多事未有不由此也夫以屬國小醜背誕不恭而國家不能擒討使西北二敵聞之豈不益有輕漢之心伏望陛下特詔陜西不干礙監司體量蕃部所以叛亂之因若果由將吏撫御乖方所致即乞明行誅責以謝邊民更選良將能吏有方略者使之鎮遏分别蕃部善惡附順者撫而安之以壊散其黨悖逆者討而誅之使永乆懾服不然臣恐其日月浸深罪惡愈重自知不為朝廷所容將外連西夏内結諸部黨與益衆氣燄益大乃為朝廷旰食之憂非特䑕竊狗偷而巳也論蘇安静狀嘉祐六年十月初二日上右臣伏見朝廷近除帯御噐械蘇安静充内侍省押班臣竊聞國家舊制兩省押班須年五十以上方得為之安静年未五十特䝉擢用臣恐自今已後内臣求進者援以為例廼有年齒極少遂居衆首國之舊章因此隳壞竊為朝廷重之伏望陛下追寢安静勅命以存典法論張方平狀嘉祐六年十月十四日上右臣竊聞近者秦鳯路經略安撫使知秦州張方平承信邉人虚稱西夏㸃兵侵犯邉境惶擾失度閉門乗城移牒鄰路索兵自救永興以西軍馬皆被抽發使近邉之民轉相驚動關隴騷然仍飛奏上聞致朝廷憂疑已而接省皆無事實方平身為元帥繫一方安危舉措施為衆所曕倚今乃怯懦輕發一至於此萬一疆埸實有警急使方平當之豈不敗事臣竊恐敵國聞之得以闚將帥之淺深益有輕中國之心非所以壯皇威鎮殊俗也伏望朝廷治方平之罪嚴加譴謫更擇明智沈勇之人以代其任庻幾國家藩屏得禦侮之臣可以髙枕矣論張方平第二狀右臣先於今月十四日上言秦鳳路經略安撫使張方平怯懦輕易乞更擇良將以代其任未䝉朝廷采納臣聞將者成敗之機安危之本固不可以任非其人今方平舉措輕脱震駭一方傳笑天下不才之跡章灼如此而朝廷猶掩覆包含一無所問臣恐敵國聞之皆有窺窬之志吏士覩之皆有輕侮之心是國家重惜方平而輕棄秦隴也凡將帥能否患在不知既知其不能而任之如故臣誠愚戇深所未逹議者或以為方平雖失於倉猝然止於過為備禦若從而罪之恐自今守邉之臣聞有冦至皆不敢為備也臣竊以為不然所謂為備者當平居無事之時簡其將佐訓其士卒嚴其壁壘利其器械審其間諜逺其斥堠使朝夕之間常若冦至如是則雖有猛鷙之敵不能犯也萬一犯之可以安坐而制之耳何至狼狽如是哉臣聞方平在秦鳯專以貴倨自處下情壅而不通自門墻之外皆可欺也况於兵民之休戚戎狄之情偽方平安得而知之是以一旦承信虚聲惶惑失㨿内驚諸郡上動朝廷此而不責典刑安用臣所以區區獻言不已者乃責方平之無備非責其為備也伏望朝廷察臣前後所言明治方平之罪謫之逺方以儆封疆之臣使皆豫為備禦不敢驕傲懈弛如方平所為也論張方平第三狀右臣先曽上言秦鳳路經略安撫使張方平怯懦輕易乞更擇人至今未䝉朝廷施行臣竊聞拓跋寛祚年齒寖長猖狂好兵常分之外邀求無厭董氊㓙悍狡獪過其父兄朝廷官爵不滿其意頗懐怨懟與契丹結婚隂相表裏此朝廷所當旰食而憂也秦州居二邊之交為陜西四路之首軍馬民夷最號繁富而以怯懦輕易之人守之是委羔豚於虎狼之蹊也臣竊為國家危之况方平其他材識素無所長止以文辭致位至此姦險貪猥士論共知今不可使之守邉事狀昭然而朝廷掩覆其過曲加保全愛一人而失一方臣竊以為過矣伏望陛下不以邉事為細而忽之速治方平之罪嚴加譴謫更擇沈勇曉兵之人以代其任不然必待有􅇏燧之警然後易之則冦已深矣傳家集巻二十二欽定四庫全書傳家集巻二十三宋司馬光撰章奏六
