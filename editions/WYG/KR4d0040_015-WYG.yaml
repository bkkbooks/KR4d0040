seq: 15
body:
  text: 允言給鹵簿狀奉聖㫖麥允言有軍功特給鹵簿昔仲叔于奚有功於衛衛人使之繁纓以朝孔子曰惜也不如多與之邑惟器與名不可以假人夫爵位尊卑之謂名車服等威之謂器二者人主所以保畜其臣而安治其國家不可忽也今允言近習之臣非有元勲大勞過絶於人而贈以三公之官給以一品鹵簿其為繁纓不亦大乎陛下雖欲寵秩其人而適足增其罪累也何則三公之官鼎足承君上應三台鹵簿者所以褒賞元功皆非近習之臣所當得者陛下念允言服勤左右生已極其富貴死有以三事之禮為之送終鼓吹簫鐃烜赫道路是則揚其僣侈之罪使天下側目扼腕而疾之非所以為榮也惟陛下御仲叔于奚之傳垂意孔子之言則知名器之重不可加非其人況唐制羣臣於國立大功者婚葬則給鹵簿餘不在給限伏望陛下追寢前命其麥允言更不給鹵簿毋使天下之人竊敢指目以為朝廷過舉不勝幸甚乞印行荀子揚子法言狀皇祐二年上臣伏以戰國以降百家蠭起先王之道荒塞不通獨荀卿揚䧺排攘衆流張大正術使後世學者坦知去從國家愽采藝文扶翼聖化至於莊列異端醫方細伎皆命摹刻以廣其傳顧兹二書猶有所闕雖民間頗畜私本文字訛誤讀不可通誠恐賢逹之言寖成廢缺今欲乞降下崇文院將荀子揚子法言本精加考校訖雕板送國子監依諸書例印賣臣愚懵不逹大體不勝區區貪陳所見修築皇地祗壇狀皇祐三年五月上奉聖㫖依謹按唐郊祀錄方丘八角三成每等髙四尺上濶十六歩設八陛上等陛廣八尺中等陛廣一丈下等陛廣一丈二尺今皇地祗壇四角再成面廣四丈九尺縱四丈六尺上等髙四尺五寸下等髙五尺方五丈三尺陛廣三尺五寸平漫無墄大抵卑陋不與禮典相應伏以王者父天母地天地之尊禮相亞埒今圓丘之制極為崇峻獨於方丘有所闕畧未稱國家嚴恭眀察之意伏乞下有司依唐郊祀錄制度增修庶合典禮論劉平招䰟塟狀皇祐三年八月上准樞宻院批送下國子慱士劉慶孫等奏狀六月二十三日進呈奉聖㫖送太常禮院詳定聞奏臣等謹按延陵季子曰骨肉歸復于土䰟氣無所不之是故聖人作為丘壠以藏其形作為宗廟以饗其神形之不存塟將安設今劉平沒身虜廷喪柩不返其子不忍封樹之不立哀展省之無所欲虚造棺槨招䰟假塟朝廷下之禮官令檢詳故實臣等按晉世袁瓌賀循等議以為非身無棺非棺無槨苟無喪而塟招幽䰟氣於徳為愆義於禮為不物當時詔書明有禁約今劉慶孫等所請招䰟塟不可聴許所有将見贈官品定諡則乞依條例施行論張堯佐除宣徽使狀皇祐二年十二月上臣聞明主勞心力以求諌和顔色而受之士猶畏懦而不敢進又况震之以威壓之以重而望忠臣之至直言之入難矣臣之不忠言之不直而天下安萬事治者未之有也臣竊見䑓諌官屢以張堯佐事上言而陛下執之益堅拒之益固前日臺諌官等守閤請對陛下却而不内中外之人莫不駭愕以為異事昔漢元帝欲用馮昭儀兄野王為御史大夫既而疑曰吾恐後世謂吾私於後宫遂不用今堯佐有野王之嫌而無其才陛下不次用之數年間自散郎至宣徽使雖彼實有可稱天下之人安可家至户曉使謂陛下不私後宫哉抑又聞之人有種𤓰而甚愛之者盛夏日方中而灌之𤓰不旋踵而菸敗其愛之非不勤也然灌之不以其時適所以敗之也今陛下貴用堯佐逺過其分天下已側目扼腕而疾之又復摧折忠諌以重其罪是正日中而灌𤓰也臣竊為堯佐寒心而陛下獨不為之深思逺慮哉非獨如是而已前者臺諌官不得對之日隂霧㝠㝠跬歩相失寒冰著木終日不觧臣謹按洪範五行傳聴之不聰是為不謀厥咎急厥罰常寒又按京房書謂之䝉氣此皆隂氣太盛壅蔽陽明上下否塞疑惑不决之象天意昭然有如教語行道之人皆知其意陛下性資純孝嚴恭天命容納直言深明得失此非臣之䛕乃天下所共知也獨柰何以堯佐之故忽天戒而不顧棄人言而不從輕祖宗之爵祿違古今之明鑒書之簡䇿使天下之人有以議聖徳之萬一或累於光融髙大之羙此臣所以日夜痛心疾首寢不能安食不能飽深為陛下重惜者也臣聞臣之事君猶子事父也豈有父獲大謗於外而子不以告且不諌哉惟陛下亟召諌臣使竭其所聞采納其言而慰安其意以厭上天之心觧外廷之惑闢忠讜之路塞寵倖之門則天下歡然歌誦盛徳豈有窮哉昔漢明帝作徳陽殿鍾離意諌即時罷之後乃復作殿成謂羣臣曰鍾離尚書在此殿不成矣然則明帝非不欲為殿也所以屈意罷之者欲全諌臣之節而開直言之端也今臺諌官前後言堯佐者數矣陛下曾不留神省察少為末减以慰其心夫人主所欲為人臣豈能强變之哉顧自今以徃事復有大於堯佐者在列之臣噤嘿拱手視之而已矣此非朝廷之福也不然羣臣猶朽木陛下猶雷霆安可以力校哉惟陛下察之而已矣論夏竦謚狀皇祐四年七月上臣等伏覩故贈太師中書令夏竦以舊在東宫特賜諡文正臣聞大戴禮曰謚者行之迹也行出於已名生於人所以勸善沮惡不可私也臣等叨預禮官諡有得失職所當言不敢隠嘿謹按令文諸諡王公及職事官三品以上皆錄行狀申請考功勘校下太常禮院擬諡訖申省議定奏聞所以重名實示至公也陛下聖徳􅆂容如天如地哀愍舊臣恩厚無已知竦平生不恊羣望不欲委之有司槩以公議且將揜覆其短推見所長故定諡於中而後宣示于外臣等謂猶宜擇中流之諡使與行實粗相應者取以賜之亦非羣臣所敢議也今乃諡以文正二者諡之至羙無以復加雖以周公之材不敢兼取况如竦者豈易克當所謂名與實爽諡與行違傳之永乆何以為法伏以陛下叡智聰明燭見㣲逺如竦所為豈不素聞迺欲以恩澤之私强加美諡雖朝士大夫畏竦子孫方居美仕不敢顯言四方之人耳目炳然豈可揜蔽必曰夏竦之為如是而諡文正非以諡為公器也盖出於天子之恩耳此其譏評國家之失豈云細㢤臣等所以夙夜區區不敢避誅戮之辜怨讐之禍狂僣妄言正為此耳伏乞陛下留神幸察改賜一諡庶恊中外之論以為萬世之法臣等無任懇欵惶懼之至論夏竦諡第一狀奉聖㫖改諡文莊臣等近以故贈太師中書令夏竦賜諡文正輒有奏陳乞賜改更至今未奉諭㫖臣等竊以凡為人臣受祿不必多居位不必髙苟當官不言則刑戮之人也是以夙夜惶懼不敢黙黙伏惟陛下不以鄙賤而忽其言臣等竊迹諡法本意所謂道徳愽聞曰文者非聞見雜愽之謂也盖以所學所行不離於道徳也靖共其位曰正者非柔懦苟媮之謂也盖以詩云靖共爾位好是正直也今竦奢侈無度聚斂無厭内則不能制義於閨門外則不能立效於邉鄙言不副行貌不應心語其道徳則貪滛矣語其正直則回邪矣此皆天下所共聞非臣等所敢誣加也陛下乃以文正諡之臣等戇愚不逹大體不知復以何諡待天下之正人良士哉且陛下所以念竦如此之厚者以竦甞為東宫之臣故也嚮者東宫之臣死而得諡者非一陛下未嘗親有所定至於竦獨不然豈非知竦所為不合衆心邪陛下必以竦為正直無疑則何不委之有司付以公議然則陛下揜覆其短適所以彰之也陛下念竦不已則莫若厚撫其家至於諡者先王所以勸善沮惡非供恩澤之具也議者將以諡為虚名何害借人臣等請試言其害凡國家所以馭臣下者不過禍福榮辱而已若為善者生享其福死受其榮為不善者生遇其禍死蒙其辱天下雖欲不治安何可得已若有不令之臣生則盗其祿位死則盗其榮名善者不知所勸惡者不知所懼臧否顛倒不可復振此其為害可勝道哉虞書曰兢兢業業一日二日萬㡬孔安國傳曰言當戒懼萬事之㣲夫事之方㣲治之易絶及其既著誰得治之况天下之人皆知竦為大邪陛下雖諡之以正此不足以揜竦之惡而適足以傷國家之至公耳且諡法所以信於後人者為其善善惡惡無私也今以一臣之故而敗之使忠良雋傑之士䝉美諡者後世皆疑之則諡法將安用哉臣等所以冒犯天威區區不已與人父子為怨者誠惜國家勸沮大法不可因循虧廢也伏惟陛下憐察少加采擇特依前奏所陳改賜竦諡天下幸甚臣等不勝惶恐待命之至論周琰事乞不坐馮浩狀皇祐四年十二月八日上臣伏奉聖㫖以鏁㕔應舉人周琰重疊用殊字既條制未明試官不申請定奪臣與馮浩各特罰銅五斤放仰荷含貸喜懼無量然臣昨在武成王廟考試之時其周琰所用殊字浩本疑不係重疊用韻由臣愚懵鑒别不精觀琰程試不見所善又據條制但言重疊用韻不云用佗韻引而恊之者非由此堅執輒行黜落鹵莽之罪盡皆在臣今浩與臣一例受罰臣雖無似能不愧心伏望聖慈特賜矜察與免馮浩責罰於臣更加嚴譴各得其分誠不敢辭奏乞移髙禖壇狀皇祐三年十二月上准敇節文髙禖壇地下仰依典故增修今據濠寨張徳等計料填疊修築都役右具如前竊縁見今所置髙禖壇處地勢極下若就彼填疊不惟功費甚大兼夏秋霖潦四集未免浸漬謹案北齊之制髙禖為壇於南郊傍景祐四年太常禮院修定儀注約用此制今来若於南郊壇傍一二里以来别踏行髙燥地修築上件髙禖壇則功費絶少又免水患參考禮典亦無所違如允所奏云云傳家集巻十八欽定四庫全書傳家集巻十九宋司馬光撰章奏二
