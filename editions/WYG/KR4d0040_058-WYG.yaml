body:
  text: 與薛子立秀才書光頓首前日承不賜棄外辱以所為文示之使得竊觀甫盡數篇不覺喟然置之而嘆噫士之讀書者豈專為祿利而已哉求得位而行其道以利斯民也國家所以求士者豈徒用印綬粟帛富寵其人哉亦欲得其道以利民也故上之所以求下下之所以求上皆非顧其私主於民而已矣近世為士者頗謬於古往往以讀書為資身之貨耳彼又惡知所謂利民者邪觀足下之文上以薦之於宰輔下以貽之令長求盗之吏未嘗不以民為先皆閭里素所疾苦而上不獲知者深切著白使其人果舉而行之則足下雖未得位而澤固施於民矣且夫身為布衣巳能孳孳念民若此况得位邪光竊有以知異日卓然為名臣使所至之方䝉被其福者非足下而誰此真古人之志也朝廷得之亦異於􅗴刻經史潤飾文采以自售施之於政而不達者矣光是用矍然喜於今之世而復見古之士且竦首傾耳以俟朝廷之得人而賀之也文編不敢久留謹奉而歸之上龐樞密論貝州事宜書孔子曰不在其位不謀其政國有大事廟堂之上謀議素熟方略已定而復以踈賤之人狂愚之議干與其間辠之大者也然光聞之受恩而不知報者犬彘也光雖不才獨忍為犬彘之行忘盛徳而無所禆益哉是以夙夜思之苟有以報萬分者雖蹈入大辠不敢愛也竊聞貝州軍士恩過而驕厭其久生自求速死雖狂戇妄為勢無所至蚤晩之間終就屠㓕若兵久不决難久不觧萬一城中之寇未即伏誅而他變旁起不逞之人同惡相濟乗釁而動則為朝廷之憂方此始耳此不得不為之過慮也雖國家恩徳在民淪於骨髄根深柢固萬無所慮然王者舉事固當計萬全之勢然後行之者也不則狂賊自知辠惡無状降首亡由獨守窮城勢不支久則擁其徒衆盗取庫兵収載寳賄豨突而出建旗鳴皷攻剽城邑以數千之盗散之趙魏之郊東連青徐亦足以為齊民之患未可以旬月擒也以光之愚竊謂城中之衆未必皆有怨叛之志其造計首惡者不過數人自餘皆迫於兇威不得已而從之者也其望大軍之至赦令之降若墜塗炭者之待救紡於樹者之求解也朝廷誠以此時發近郡之兵塹環其郛勿攻勿戰使不得出而又隂以重賞募人入城焚其積聚壊其所恃使逃無所出守無所資然後命重臣素仁厚為士卒所信愛者奉明詔以臨之諭以脇從之人有能捕斬首惡若唱先出降者待以不次之賞其始雖與謀而能飜然悔過從善者亦除其辠待以不死或為惡不變敢拒官軍者戮及妻子無有所赦如是不過旬月逆卒之首必函致於闕下矣此乃坐支觧狂賊之術也徃年保州之役威罰實行今為惡者必誑誘其徒曰汝罪已大出城必誅保州近事足以為戒自非賞至厚信至明則不足以破散其謀宜得先降者厚賞賜之超資越序拜以官爵錦衣駿馬狥於城下使足歆慕以焜燿其餘彼雖甚愚國家昭昭然設貴爵重賞於前峻刑嚴誅於後示以大信皦如日月安有不動心者哉書曰除惡務本周頌曰鋪時繹思我徂維求定明聖王之誅不在快志多殺要欲布陳條理期於安定而已今誠貰其脇從之辜開以自新之塗縱未即日殄㓕使其内自相猜肘腋之變紛紛數起支節散落腹心潰敗則渠魁之首可指日而烹也然後分别白黒表章善惡取倡為亂者種族誅之餘皆勿問亦足以立威而示懐矣討不失辠賞不失功士卒無傷甲兵不頓財穀不費盗賊不滋竊以為最策之得者也或者必欲以兵力取之賊憑堅城執利兵據倉庫比其授首則河朔之力固巳困矣况加以不虞之變哉夫炎炎不絶熖熖柰何當事之㣲治之易耳時至不為禍如發機今狂賊日夜煦嫗其黨出庫物奪民財以㗖之又恐喝以國家之威刑沮抑其嚮善之意不乗其衆心危疑未定之際壞敗其謀巳而日濅久辠濅深朝廷無寛貸之令凶黨有慘毒之威朝薫暮蒸衆志已固然後圖之則招之不來攻之不克用力百倍而功不可必也故不愛官爵金帛之重賞以壊其黨今其時也過是無益矣朝廷之議髙深幽宻今日䖏置為攻為戰為赦為誅非草茅之所能知也萬一議者有欲用兵碎而不以計破者此乃愚誠區區願陳所見者也詩云先民有言詢于芻蕘夫以周公之才於天下事宜無所不知而日孜孜禮白屋之士求善言詢政治者誠欲盡衆人之思慮也執事為天子腹心之臣典樞機之任凡百籌畫得失之數必已决於胷中矣而光不識分限復妄有云者誠貪於報恩而忘其愚僣之辠也伏計執事法周公之道亦不厭芻蕘之言以愽觀焉回状元第二第三先輩書伏䝉某官不以光之愚庸散賤親枉車騎辱臨其門前之以啓以將盛意恐悚愧懅於兹未怠竊以取士之詳進賢之速視古以來宜無若今者今夫天下之士舉於其州用不能而退者十常七八然後升之禮部禮部又如之然後升之天子之庭天子臨軒親覆之又有退者然後觧其布衣而祿之如此可不謂之取士之詳歟然其以魁傑秀異在殊級者其視朝廷美官若寓物禇中不十年必取之大抵皆至公卿如此可不謂之進賢之速歟取如是詳而能獨為羣士之先則其才可知已進如是速而能不自隆貴以禮於愚庸散賤之人則其徳可知已才與徳二者議士之所先也而皆有以過絶於人光是用不敢私賀於左右而賀於朝廷賀於衆庶知其將得賢公卿而有所瞻頼也答薛虢州謝石月屏書日前令嗣先輩訪逮出手筆并石月屏為貺捧玩不勝愧喜比來數於都下朋從處見此屏觀其天質圓瑩非刻非繪如秋髙氣清逈然在望信乎天地之異氣山澤之殊寳也素心恱之無從可得豈意一旦不煩懇請坐至握中性本踈野雅叶所欲雖受文錦十純白璧百雙在光之愚未為重賜謹當縢閟箱笈不忘惠好耳氣序癉暑信後伏想休勝俗故怱怱久不遑修謝尤増悚懼先輩注官甚便想加慰喜未期接侍倍希珍厚答謝公儀書光之得㳺於書府也為日寡竊甞側聞先達長者之言曰昔之初有職業於兹者不以位之崇卑名之顯晦皆贄啓以造於僚友之門誾誾焉與見於公卿貴人之禮均若是者非他盖以凡居此官本以禮義相先非以名位相髙也兹道之替久矣光不及見焉常拊髀私歎自恨生之後而進之晩不得目前人盛事又傷身之賤而名之晦不能率先士夫以振起之也不意今者某官以英偉之才負天下􅂱􅂱之望始以鴻漸之翼翔集兹地獨能力探故實勤而行之雖光之愚陋輕㣲不足齒於僚列者皆親枉車騎懐啓䄂謁臨其蓬蓽一無所遺光始愧中疑終而釋然知兹禮之來非光之為而為臺閣之美不可使遂委草莽而沈絶不繼也伏以某官始者逰太學則冠諸生登王庭則先俊選貴名之白若列宿之羅清旻疾風之走四海凡一事一為皆天下之所仰而趨慕而歸者也若使出於媮則後來之士無自入於敦出於敦則後來之士無自入於媮况始仕於朝天下方拭目而觀之清耳而聴之乃獨不出於媮而出於敦是則及物之利繇此其始矣光是以為天下士大夫賀而不敢以見禮私自榮也與范景仁書詩云先民有言詢于芻蕘言人君不以鄙賤廢善言也又云心乎愛矣遐不謂矣言人臣不以踈逺忘忠愛也又云彼姝者子何以予之言賢者在位下樂告以善道也又云何以恤我我其収之言賢者得忠信之言無不受也光實何人明主以為臣景仁以為友明主方側身求諌而景仁以言事為官光又可以嘿而已乎光聞古者士傳言諌盖以士賤不能自通於君故因賢卿士大夫以傳之光曏者不自知其賤且愚輒以宗廟社稷深逺之計冒聞朝廷誠知位卑而言髙智小而謀大觸犯皆死死者人之所必不免也若忠於國家而死死之榮也是以剖肝瀝膽手書緘封而進之庶幾得達法座之前明主或皆聴采自以聖意建萬世不㧞之基則光退就鼎鑊如䝉黼黻此光之本心也無何自夏及秋囊書三上皆杳然若投沙礫於滄海之中莫有知其所之者夫以即日明主求諌之切詔書爛然頒於天下而光所言又非𤨏𤨏不急之務若幸而得闗聖聴則光所言是邪當采而行之非邪當明治其罪豈有直加棄置曽不誰何此必所言渉千里之逺歴九閽之深或棄或遺而不得上通也古之人有奏䟽而焚槀者盖為言已施行不可掠君之美以為已功也若奏而不通又自焚其槀則與不言何異哉光是用中夜起坐涕泣霑襟竊思當今朝廷諌争之臣忠於國家敢言大事而又周旋日久知光素心事惟景仁而已光之言不因景仁以自通尚誰望哉且景仁以為天子耳目之臣得光之言傳於明主天下固莫得而窺也光是敢輒取所上奏槀獻於左右伏冀景仁察其所陳果能中於義理合於當今之務則願因進見之際為明主開陳兹事之大所當汲汲留意不當因循簡忽以忘祖宗光美之業及乞取光所上三奏略賜省覽知其可取可捨可矜可罪裁定其一而明賜之無使孤逺之臣徒懷憤嘿嘿而無所告語也昔樊噲諌漢髙祖留止秦宫奉春君請徙都長安始皆未聴得留侯言即日從之盖人主素所信重入其言易故也今光官於千里之外為邉州下吏景仁朝夕出入紫闥登降丹陛天子之責治亂安危者不在於光皆在景仁光雖言之終不能有益於國家止於是而已矣若夫懇惻復熟以感寤明主成聖世無疆之休則在景仁留意而已如此實天下之幸非獨光之幸也與李子儀書嘉祐元年昨日值客至不克盡談宿夕思之終未能達子儀髙逺之慮故輒復布其愚悃以聞左右未審果肯省視否凡足下今所欲為義邪利邪將不勝其忿苟為詆訐以快志邪此三者皆未見其可也足下雖自信其心不為利動然天下之人烏可户曉萬一被渉此謗於何湔洗是棄千金之璧而得腐䑕也雖一日十官豈足羨哉光辱與足下逰㝡久竊觀士大夫間才行具美如足下者能有幾人所以孳孳深相重惜不欲使有毫末之議加於全徳事苟上聞不可復掩朋友雖欲從而辭之亦無及巳足下何不試察光心所以區區不避譴怒竭忠相告者亦何所利哉正為賢者惜舉措而已答聞喜馬寺丞中庸書月日光頓首再拜明府寺丞閣下光頃日雖得邂逅奉望顔色然殊未暇陪從容抒悃欵也今者猥䝉記存逺賜之書仍以新與邑中賢士大夫治孔子祠命為之記何采聴之過而責望之重也且愧且恐若無所容光資性頑蔽辭藝鄙薄平居為朝夕近用之文猶多乖僻取人嗤傲况於語先聖之道載賢令之功鐫之金石傳之將来是猶執尫人而負之以千鈞之重雖欲自託於顯茂之業而貪不朽之榮獨不輕先聖而累明府羞邑中之賢士大夫乎此誠非光之所敢任也伏惟寛明當賜開察改求酣鬯於道而富有於文者使為之則宜與大名昭昭千古不窮矣若光類者正可相與誦咏而已傳家集巻五十八欽定四庫全書傳家集巻五十九宋司馬光撰
