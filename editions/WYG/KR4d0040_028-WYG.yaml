body:
  text: 言奉養上殿第二劄子臣累曾上言乞陛下加意奉養躬親萬幾言辭拙訥未䝉采納臣竊惟當今切務無大於是是敢不避斧鉞重有敷陳至於奉親之禮報徳之義為君之職訪善之道臣曏來文字叙述已詳不敢復煩聖聽獨以目前利害言之陛下試詳擇焉竊以皇太后母也陛下子也皇太后母儀天下巳三十年陛下新自藩邸入承大統若萬一兩宫有隙陛下以為誰逆誰順誰得誰失又仁宗皇帝恩徳在民藏於骨髓陛下受其大業而無以報之則何以慰天下之望若陛下上失皇太后之愛下失百姓之望則雖有大寳之位將何以自安凡人主所以保國家者以有威福之柄也故民畏之如神明愛之如父母今陛下即位將近朞年而朝廷政事除拜賞罰一切委之大臣未嘗詢訪事之本末察其是非有所與奪臣恐上下之人習以為常威福之柄寖有所移則雖有四海之業將何以自固位則不安業則不固於陛下果何所利乎陛下必以為事皇太后之禮止如是亦不失矣親萬幾之務止如是亦無闕矣臣竊以為不可臣聞陛下昔在藩邸事濮王承順顔色備盡孝道凡宫中之事濮王皆委陛下幹之無不平允陛下事皇太后當一如濮王然後可視天下之政當一如宫中之事然後可況濮王之親以恩皇太后之親以義其奉養之謹非特有所加則無以取信也宫中之事小天下之事大其聽㫁之勤非特有所加則無以致治也儻奉養極其謹聽斷極其勤則陛下仁孝之名流於萬世英叡之徳逹於四表宗廟永安子孫䝉福於陛下有何所害而久不肯為哉凡此利害之明有如白黑取捨之易有如反掌陛下今日囘意易慮猶未為晩若固守所見終無變更臣恐日月寖久釁隙愈深不可復合威權巳去不可復收後雖悔之亦無及已臣受國家累世大恩不敢愛死為陛下極陳社稷之計肝膽所蓄盡此而巳伏望陛下少留意察之取進止言奉養上殿第三劄子臣近以私懇求鄉便一州伏䝉聖恩令宰臣宣諭以臣曏所言事略皆施行令臣且在諫院供職未得求出臣以駑下之質生於盛明之世得備諫官為幸已大況陛下謙恭接下容受直言此乃愚臣千載一遇畢命報國之秋豈願離去左右自棄於疎逺之地誠以父母墳墓久不展省人子之心遑遑不安所以有此陳乞今忽奉聖㫖宣諭如此臣惶恐慙懅無地自容夙夜循省進退維谷臣竊惟曏時所言欲陛下以事濮王之禮事皇太后又欲陛下延訪羣臣躬親政事今陛下雖奉事皇太后加於往日猶未及事濮王之時承顔順意曲盡歡心也雖省覽庶政猶未嘗訪問羣臣講治亂之切務也陛下若以二者為止當如此則兩宫之意無由和洽萬幾之務無由治辦禍亂之原尚在太平之期尚逺臣雖日侍丹扆有何所益陛下若奉養之禮日増月益訪求治道勤勞不倦使慈母歡欣於上百姓安樂於下則臣雖在逺方亦猶在陛下之側也臣聞為人子者事其親而親不恱不敢怨也退而自責曰我之愛不至歟愛至矣而猶不恱則曰我之禮不恭歟禮恭矣而猶不恱則曰我之誠不盡歟誠既盡矣則大孝之名逹於四海通於神明神明且猶助之而況人乎臣又聞為人君者視天下有一事不治以為已過有一民失所以為巳憂天下已安已治矣猶復思將來之患而豫防之天下未嘗無事也在人君思與不思而已矣思之則治安不思則亂危陛下儻能以此二者自勉則臣安敢廢公家之急而徇私家之務乎取進止言奉養上殿第四劄子臣伏見陛下曏者即位之初奉事皇太后䖍恭欵至皇太后撫愛陛下恩渥周備數日之間慈孝之譽逹于中外播於逺近聞者無不相慶自聖體不安旬月之間道路之人漸有異議皆云因任守忠等本不樂陛下為嗣故於皇太后之處則言陛下與中宫之短於陛下與中宫之處則言皇太后之失遂使兩宫之心互相猜貳間隙一開猝難復合今陛下奮發英斷屏黜讒邪守忠等皆降逐出外中外之人不勝忭恱然臣愚竊恐皇太后尚未能盡知姦人之情與陛下所以斥去之意伏望陛下與中宫親詣皇太后閤頓首陳謝具述從來為守忠等所誤致屢有違忤皇太后之意今守忠等既去願與皇太后母子之恩一如舊日然後朝夕與中宫侍養左右膳羞藥餌躬親進獻承順顔色皆如臣庶之家母子婦姑之禮若左右之人尚有敢相離間者願陛下立行誅竄勿復有疑如此則讒慝黜逺内外雍睦善氣興行災沴消亡宗廟永安令聞長世若失此之際兩宫之歡不能復舊則恐長無可復之期豈惟當今天下之人以陛下為非將傳於史䇿取譏萬世矣此皆聖明所自知而臣復區區進言者欲陛下深更留意取進止言永昭陵建寺劄子治平六年三月卄七日上臣竊聞近有聖旨於永昭陵側别建一寺未知信否果如此竊恐不可何則宣祖太祖太宗三陵共有一寺若獨於真宗仁宗各置一寺則是尊奉之禮踰於祖宗豈特於體理不順為朝廷闕失亦是違先帝之孝心也議者或謂三陵共在一處永定永昭相去稍逺以此須别建一寺凡臣僚之家無人守墳乃於墳側置寺啗以微利使之守護種植而已至於國家守衛山陵有司備具置寺之處何較近逺若云資薦求福則死生之際人不能知釋氏所言虚實難騐使亡者㝠然無知則資薦之事有何所益果然有知如釋氏所言則仁宗皇帝寛慈恭儉好生惡殺恩浹四海澤被萬物豈待别置一寺更度數僧然後得生天堂樂處也且仁宗皇帝晩年詔天下無名額寺屋及百間者並特與名額計創添寺額千有餘處據此功徳宜享夀考無疆之福而數月之間宫車晏駕以此驗之佛不能為人之福豈不顯然此皆皇太后與陛下所親見也今自國䘮之後支給賞賜供奉山陵帑藏空虚賦役煩多百姓罷弊京西去秋不稔春復少雨正是朝廷宵衣旰食存恤之時乃復興此無名之役不急之費誠非中外所望也若萬一有益於先帝羣臣豈敢愛惜今逆禮傷孝蠧財勞人但使僧徒監脩之人因此為名妄求恩澤以廣徼倖之路臣竊為朝廷不取也伏望陛下與皇太后深思當今切務汲汲於富國安民息此無益之事以副天下之望其永昭陵寺只乞依前來指揮更不别置取進止乞車駕早出祈雨劄子治平元年四月十七日上臣伏見權御史中丞王疇等建言乞陛下循真宗故事幸諸寺觀祈雨朝廷雖從其所請而講議選日巳踰旬浹至今車駕未出衆論狐疑皆云事恐中輟臣愚竊以陛下踐阼巳踰朞年京城百姓未聞屬車之音重以曏者聖體不安逺方之人妄造事端訛言未息若聞車駕一出則逺近釋然莫不喜恱況今春少雨麥田枯旱禾種未入倉廪虚竭閭里饑愁陛下為民父母當與之同其憂勞祈禱羣神豈可晏然視之不以疚懷況詔命已降流聞四方若復遷延久而不出則道路之人愈増猜惑不若曏時初無此議也且王者以四海為家故稱乗輿或稱行在今車駕暫出近在京城之内亦何必拘瞽史之言選揀時日而忘萬民朝夕之急殆非成湯桑林周宣雲漢之意也臣愚伏望陛下斷自聖志於一兩日之間車駕早出為民祈雨以副中外喁喁之望取進止乞今後有犯惡逆不令長官自劾劄子治平元年四月二十四日上臣竊以國家承百王之弊俗化陵夷不肖愚民犯誼侵禮無所不至此朝廷所宜留意不可忽也昔賈誼歎秦俗之薄惡以為借父耰鉏慮有徳色母取箕帚立而誶語抱哺其子與公併倨婦姑不相說則反脣而相稽以今閭巷之民旦夕所為如彼數者皆何足言近聞開封府屢有子殺父母者相繼事發以京邑之中猶有如此悖逆之民況於逺方教化之所不及哉臣竊見刑部格勑百姓間有犯惡逆以上者州縣長官量事貶降隠而不言委錄事叅軍糾察聞奏刑統叅詳條部内有犯惡逆以上罪者今後刺史以上附表自劾以敦風教責與不責並聽勑裁朝廷近年務行寛政吏有故出人罪者率皆不問或小有失入則終身廢棄以此民有謀殺及毆詈尊長者州縣之吏專務掩蔽縱釋惟恐上聞往往止從杖罪斷遣少肯處以正法葢避自劾之恥務為身謀遂使頑民益無顧憚名敦風教其實壊之王者之政當善善惡惡若寛此悖逆之民以為仁政臣實愚淺未之前聞況教化之失風俗之弊任其責者豈特州縣長吏而已若長吏隠而不言乃使錄事叅軍糾察聞奏斯亦難矣臣愚伏望朝廷今後除去上件貶降長吏及附表自劾二條更不施行在京則委糾察刑獄畿内則委府界提㸃在外則委轉運使提㸃刑獄常切覺察州縣官吏如有敢將惡逆不孝不睦等罪寛縱隠蔽不依正法勘鞫斷遣者並畫時糾舉聞奏隨其輕重各以故出人罪論若上件諸司不糾舉者委臺諫官察訪聞奏取進止貢院定奪科塲不用詩賦狀治平元年四月十四日上准中書送下天章閣待制判國子監吕公著劄子臣聞以言取人固未足以盡人之才今之科塲格之以辭賦又不足以觀言國家承平日久文物至盛學者莫不欲宗經嚮道至於浮華博習有不得巳而為之者先帝察取士之弊嘗集近臣之論形於詔文則曰本學校以教之然後可以求其行先䇿論則辨理者得盡其説簡程式則閎博者頗見其才雖丁寜申諭而有司不能奉行竊聞昨來南省考校始専用論䇿升黜議者頗以為當臣猶恐四方疎逺未知所尚有司各持所見則人無適從欲乞今來科塲更不用詩賦如未欲遽罷即乞令苐一塲試論第二塲試䇿第三塲試詩賦每遇廷試亦以論壓詩賦為先後升降之法庶成先帝之志永底人文之盛臣謬司學政盍進輿言如允所奏即乞預行告示令本院定奪聞奏者當院看詳近世取人専用詩賦其為弊法有識共知今来吕公著欲乞科塲不用詩賦委得允當然進士只試論䇿又似太簡欲乞今後省試除論䇿外更試周易尚書毛詩周禮儀禮春秋論語大義共十道為一塲其䇿只問時務所有進士帖經墨義一塲從来不曽考校顯是虚設乞今更不試御前除試論外更試時務䇿一道如此則舉人皆習經術不尚浮華若是依舊不罷詩賦之時即先試後試事歸一體别無損益今若罷去詩賦仍乞依吕公著起請預行告示使天下學者早得聞知傳家集巻三十欽定四庫全書傳家集巻三十一宋司馬光撰章奏十四言爲治所先上殿劄子治平元年五月十八日上臣伏覩皇太后手書已罷聴政陛下欽承慈㫖獨斷萬幾臣聞易曰君子以作事謀始又曰正其始萬事理差之毫釐謬以千里陛下雖踐阼朞年於國家大政猶多所謙抑雖時有處分皆常式小事非天下所以望於陛下者也曏時外間議者皆曰陛下聖體未安倦於聴覽及知聖體已安又曰陛下上畏皇太后之嚴欲盡人子之禮避專命之嫌韜藴聰明未敢施設今皇太后舉國家大柄盡付之陛下則議者無復可言唯拭目傾耳以瞻望聖政而已矣陛下當此之際治身治國舉措云爲不可不慎昔楊朱見衢塗而泣謂其可以左可以右所差甚微所失甚大也人主即政之初亦榮辱安危之衢塗也故臣願陛下留聖心焉臣聞治身莫先於孝治國莫先於公孔子曰孝徳之本也又曰不愛其親而愛佗人者謂之悖徳不敬其親而敬佗人者謂之悖禮未有根絶而葉茂源涸而流長者也仁宗皇帝以四海大業授之陛下其恩徳之大天地不足以爲比今登遐之後骨肉至親獨有皇太后與公主數人陛下所當日夜盡心竭力供承撫養以副仁宗皇帝之意曏者皇太后聽政之時左右侍衛之人不敢不恪求湏之物無敢不備既委去政柄臣竊慮有無識小人隨勢傾移侍奉懈慢供給有闕則天下之責皆歸陛下此不可不留意朝夕省察者也又若有不逞之人於兩宫之間刺探動静拾掇語言外如效忠内實求媚以相與搆間者臣願陛下逆拒其辭執付有司加之顯戮誅一人則羣邪自退納一言則百讒俱進此乃禍亂之機不可不深察也臣聞國事聴於君家事聴於親臣愚以爲陛下在外朝之時刑賞黜陟之政當自以聖心決之至於禁庭之内取捨賜予事無大小不若皆禀於皇太后而後行陛下與中宫勿有所專如此則内外之體正尊卑之序明慈母懽忻於上臣民頌咏於下矣不然皇太后歸政之後若侍衛之人稍有怠惰求須之物小失供擬加以讒邪妄興離間萬一有􅁝毫闕失流聞於外或皇太后憂思不樂内生疾疢則陛下何以勝此名於天下哉雖百善不能掩矣臣故曰治身莫先於孝也洪範於好惡偏黨之際六反言之重之至也周任曰爲政者不賞私勞不罰私怨大學曰欲明明徳於天下者必先正其心有所忿懥則不得其正有所好樂則不得其正陛下奮發宫邸入纂皇極爰自潜躍至於天飛舊恩宿怨豈能盡無然今日即政之初皆不可置於聖慮以害至正也凡人君之要道在於進賢退不肖賞善罰惡而已爵祿者天下之爵祿非以厚人君之所喜也刑罰者天下之刑罰非以快人君之所怒也是故古者爵人於朝與士共之刑人於市與衆棄之明不敢以已之私心盖天下之公議也今以四海之廣百官之衆有賢有愚有善有惡比肩接迹雜遝並進臣願陛下少留聦明詳擇其間苟有才徳髙茂合於人望者進之雖宿昔怨讎勿棄也有噐識庸下無補於時者退之雖親暱姻婭勿取也有勵行立功爲世所推者賞之雖意之所憎勿廢也有懐姦犯禁爲衆所疾者罰之雖意之所愛勿赦也如此則野無遺賢朝無曠官爲善者勸爲惡者懼上下悦服朝廷大治百姓䝉福社稷永安不然陛下若專居深宫自暇自逸威福之柄盡委大臣取適目前不爲逺慮賢愚不分善惡共貫否則所進者皆平生所親愛所退者皆平生所不快所賞者皆諂諛而無功所罰者皆忠諒而無罪如此則中外解體紀綱隳紊羣生失所天下可憂矣臣故曰治國莫先於公也此二先者榮辱之大夲安危之至要臣願陛下審思而行之詩云亹亹文王令聞不已陛下誠能行此二者則盛徳美譽滂沛洋溢近者傳誦逺者襃嘆不過旬月之間徧於天下逹於四夷後日之政如順風吹毛乗髙汱水可以不勞而成功矣取進止論皇太后
