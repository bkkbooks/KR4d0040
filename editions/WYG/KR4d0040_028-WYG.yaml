front:
  text: 臣竊聞近日陛下聖體甚安奉事皇太后昏定晨省未嘗廢闕非獨羣臣百姓之福乃宗廟社稷之福也陛下既為仁宗皇帝之後皇太后即陛下之母今濮王既没陛下平生孝養未盡之心不施之於皇太后將何所用哉臣聞君子受人一飯之恩猶不忍負之必思報荅況皇太后有莫大之徳三陛下豈可斯須忘之先帝立陛下為嗣皇太后有居中之助一也及先帝晏駕之夜皇太后決定大䇿迎立聖明二也陛下踐阼數日而得疾不省人事中外衆心惶惑失措皇太后為陛下攝理萬幾鎮安中外以俟痊復三也有此一徳者則陛下子子孫孫報之不盡況兼三徳而有之陛下所以奉飬之禮若有絲毫不備四海之人其謂陛下為如何天地鬼神其謂陛下為如何此不可以不留聖心也今陛下已能奉養如禮而臣復區區進言者誠欲陛下戒之慎之始終無倦外盡其恭内盡其愛使孝徳日新令聞四逹以叶天下之望保萬世之祿而已若萬一有無識小人以細末之事離間陛下母子不顧國家傾覆之憂而欲自營一身之利者願陛下付之有司明正其罪使天下曉然皆知陛下聖明仁孝不負大恩而讒佞不能間也取進止
