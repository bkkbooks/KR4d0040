body:
  text: 乞罷提舉官劄子元祐元年上臣聞書稱明王立政不惟其官惟其人臣少時見天聖中諸路止各有轉運使一員亦無提㸃刑獄惟河北陜西以地重事多置轉運使兩員然朝廷必擇朝士累任知州有聲迹曉錢穀者乃得為之未嘗輕以授人凡一路之事無所不總使按察官吏薦賢發姦愛飬百姓興利除害或朝廷有本路事務未能細知利害者則委之相度措置當是之時官少民安事無不舉公私饒樂海内晏清景祐初始復置提㸃刑獄其後或時置轉運判官以其冗長害事尋復廢罷自王安石執政以來欲力成新法諸路始置提舉常平廣惠農田水利官其後每事各置提舉官皆得按察官吏事權一如監司又増轉運副使判官等員數皆選年少資淺輕俊之士為之或通判知縣監當資序及選人以權發遣處之有未嘗歴親民即為監司者能順已意則不次遷擢小有乖違則送審官院與合入差遣更加責降彼年少則歴事未多資淺則衆所不服輕俊則舉措率易歴事未多故措置百事往往乖方衆所不服故依勢立威以行號令舉措率易故慮事不熟壊法害民又利禄誘於前罪戾俟於後由是往往上不顧國家事體下不恤百姓怨咨止務希合以圖進取致今日天下籍籍如此皆由此來也陛下幸念民惟邦本本固邦寧知元元困窮於國家非便欲救而安之詔青苗錢不得抑配免役錢寛剰不得過二分竊聞諸路提舉官州縣猶有於春首抑配青苗錢勒百姓供情願狀别作名目占免役寛剰錢但取文具而已如此則朝廷號令廢格不行於臣下恩澤壅塞不被於黎民徒存空文何以為政臣聞去草者絶其本救水者回其原提舉官者乃病民之本原也陛下必欲蘇息疲瘵乞盡罷諸路提舉官其轉運使除河北陜西河東外餘路只置使一員判官一員提㸃刑獄分兩路者合為一路共差文臣兩員凡本路錢穀財用事悉委轉運司刑獄常平兵甲賊盗事悉委提㸃刑獄管勾仍選知州已上資序累歴親民差遣所至有政迹聦明公正之人方得為監司聰明則知官吏賢不肖公正則黜陟無私部下官吏既皆得人事務安有不幹集百姓安有不富庶此乃國家鎮撫四方之本也若以提舉官累年積蓄錢榖財物不少恐轉運司一旦得之妄有耗散即乞盡椿作常平倉錢物委提㸃刑獄一面交割主管依常平倉法謹伺穀價賤糴貴糶及准備災傷賑貸其餘不得支用若轉運司委的窘乏須至兌那常平錢物者必須具數先奏朝廷得㫖乃得移牒支撥若以監司數少路分闊逺處廵歴及管勾不辨即乞只依舊法每歳徧廵諸州更不徧廵諸縣自非要切大事朝廷不令監司親往勾當只令選差本部官除司理司法縣尉獨員監當之類舊條不許差出外其舊條不得隔州差選人勾當差及被差之人皆有罪新條諸州管勾官及主簿當給散月分不得差出之類指揮乞更不施行所貴監司有官可差幹得事務若遇有賊盗乞朝廷只委提㸃刑獄差官或行移文字監督捕盗官捉殺察其不稱職及有可以代之者先令權攝仍奏乞替換許一面相度賊盗强弱立賞錢數目其捕盗官若立功許隨功大小保明乞轉官及升差遣或减年磨勘朝廷更不下刑部磨勘詰難住滯臨時詳酌恩澤直賜指揮賊盗自然無不敗獲不須令親出入監逐捉殺於事無益如此則監司廵歴管勾職事簡要易為辦集取進止傳家集巻五十欽定四庫全書傳家集巻五十一宋司馬光撰章奏三十四論錢榖宜歸一劄子元祐元年上臣竊以洪範八政食貨為先故古者國用必使冡宰制之祖宗之制天下錢榖自常平倉𨽻司農寺外其餘皆總於三司一文一句以上悉申帳籍非條例有定數者不敢擅支故能知其大數量入為出詳度利害變通法度分畫移用取被有餘濟此不足指揮百司轉運使諸州如臂使指朝廷常慎選健吏精於理財者為三司官如陳恕林特李參之類皆稱職有名者也其餘非通曉錢榖者亦罕得叨居其任故能倉庫充溢用度有餘民不疲乏邦家乂安自改官制以來備置尚書省六曹二十四司及九寺三監各有職事將舊日三司所掌事務散在六曹及諸寺監應支用錢物五曹得以自專有司得符即時應副而户部不能制申發帳籍又不盡歸户部户部既不得總天下財賦無由盡知錢糓出内見在之數既不盡知何由量入為出又五曹及内外百官各具理財之法申奏施行户部不得一一關預無由盡公共一利害今之户部尚書舊三司使之任也而左曹𨽻尚書右曹不𨽻尚書天下之財分而為二視彼有餘視此不足不得移用天下皆國家之財而分張如此無專主之者誰為國家公共愛惜通融措置者乎譬人家有財必使一人專主管支用若使數人主之各務已分所有者多互相侵奪又人人得取而用之財有増益者乎故利權不一雖使天下財如江海亦恐有時而竭况民力及山澤所出有限劑乎此臣所以日夜為國家深憂者也今縱未能大有更張欲乞且令尚書兼領左右曹侍郎則分職而治其右曹所掌錢物尚書非奏請得㫖不得擅支諸州錢糓金帛𨽻提舉常平倉司者每月亦須具帳申户部六曹及寺監欲支用錢物皆須先闗户部符下支撥不得一面奏乞直支應掌錢物諸司不見户部符不得應副其舊日三司所管錢榖財用事有㪚在五曹及諸寺監者並乞收歸户部若謂户部事多官少難以辦集即乞减户部冗末事務付閒曹比司兼領而通𨽻户部如此則利權歸一若更選用得人則天下之財庶㡬可理矣取進止乞申勅州縣依前勅差役劄子元祐元年上臣伏見御批指揮以臣近建明差役法慮其間未得盡備差韓維吕大防孫永范純仁專切詳定聞奏臣竊以免役錢之病民自曏日臣僚民庶上封事及日近劉摯等奏陳言之甚詳非獨出臣一人之私意也陛下幸用臣言悉罷免役錢依舊差役詔下之日中外歡呼徃來之人聞道路農民迭相慶賀云今後這囬快活也然則此令之下深合人心明白灼然無可疑者其間條目未備不能委曲盡善固須有之臣所以乞下諸路州縣官吏令㸔詳若有妨礙施行未得即具利害擘畫以次上聞誠以畎畒幽隠南北異宜自非在彼親民小官無以知其詳悉故令各具所見指陳利害所以盡下情求民瘼非謂勅書一下禁人不得復議也俟其奏到徐議添改何後之有要在早罷役錢復差役為大利而已如搆造大厦棟宇已立雖户牖未備可以徐圖今陛下令韓維等再行詳定考究利害宇補漏略成就良法固無所妨但勅下已踰半月州縣差役約以及半方行遣紛紜臣愚竊恐聞此指揮謂朝廷前日之勅改更未定或斂錢或差役尚未可知官吏惶惑不知所從衆庶失望怨嗟益甚必有本因新法得進之臣乘此間隙爭言免役錢不可罷因聚斂獲功之吏稱舊條未改督責免役錢愈急是民出湯火濯清泉復入湯火也伏望朝廷特賜申勅州縣言今來止為其間條目未備令維等詳定所有差役仰州縣依前勅一面施行候詳定到事節續降下次免致於差役中半紛紜之際令出反汗人情大揺實天下幸甚取進止隨乞宫觀表辭位劄子元祐元年上臣以病羸拜起及上下馬不得請朝假將治已及月餘旬日以來疾大勢雖退飲食亦稍進然氣體疲乏足腫生瘡歩履甚難策杖而行不出堂室况於拜起固所未易臣自料度筋力完復可以朝趨近亦數月逺則半年或過此期未可前定豈有執政之臣身據髙位坐受厚俸既不趨朝又不供職宴安偃仰養病於家何待人言獨不内愧臣是用夙宵惶愧無地自處今不免有表上瀆聖聰乞除宫觀差遣一任以養衰殘竊慮陛下怪其忽有此奏故别具劄子披瀝肝膽伏望聖慈早賜開允取進止辭位第二劄子元祐元年上臣伏䝉聖慈以臣乞宫觀差遣特命入内内侍省東頭供奉官陳衍賜臣批答不允仍斷來章者伏念臣自結髪從學講先王之道聞君子之風竊不自揆常妄有尊主庇民之志不意天幸䝉陛下誤采虚名擢於閭閻之間寘之廟堂之上禮遇過優委任至重臣非木石豈不知荷戴天恩銘心鏤骨願竭駑蹇少報萬分眷戀天庭豈肯輕去不謂一旦嬰此沉痾累月不愈害於飲食不能造朝今雖疾勢漸平飲食亦進而肌骨羸瘠氣力疲乏腫足骭痬餘毒方熾旬月之間必未能趨伏闕廷瞻望天光端居私家尸位竊禄縱陛下寛仁微臣不知廉耻中外有識之士及天下衆庻其謂臣何伏望聖慈矜察依臣前奏除宫觀差遣一任使得自安其分取進止為病未任入謝劄子元祐元年閠二月二日上臣今月二日准閤門承受范禹臣告報已降白麻除臣守尚書左僕射兼門下侍郎令當日入謝者臣先為乆病在假不能朝叅乞一宫觀差遣未奉俞㫖今忽聞制命超升左輔俾之師長百僚豈臣空踈所能堪可臣方别具悃欵辭免未敢祗受况臣即今以乆病少力足瘡未愈歩履甚艱拜起不得未任朝見乞候臣筋力稍完入覲宸扆面陳至誠取進止辭左僕射第一劄子元祐元年閠二月上臣今月二日伏聞已降白麻除臣左僕射兼門下侍郎者臣資性愚鈍學術膚淺誤䝉甄采預聞政事常懼不稱䧟于罪戾加以近嬰疾疹乆不朝參方乞宫觀以便頥養豈意天恩出於意表即長中䑓直升元宰躐等踰分近世罕倫愧赧驚懼汗流霑踵况今中外舊臣或輔佐累朝或踐揚兩府髙才碩德顯著甚多若以代臣皆出臣右又即今執政臣位在四若以次而舉亦未至臣伏望聖明歴選其人俾居斯任如臣無狀何敢克當所有新命臣不敢祗受取進止辭左僕射第二劄子元祐元年閠二月上臣今月六日伏䝉聖慈差東上閤門副使王舜封賜臣左僕射兼門下侍郎告身者臣近聞恩命自知非分不敢膺克已累有文字辭免恭俟俞旨今䝉降到告身臣未敢祗受欲乞且留在閤門取進止辭左僕射第三劄子元祐元年閏二月上臣於今月二十三日相繼有劄子辭免新除尚書左僕射恩命未奉俞旨六日又䝉聖恩差東上閤門副使王舜封就臣本家賜臣告身臣亦未敢祗受乞且留在閤門今早勾當御藥院馮宗道傳宣并降到御批早令祗受臣上戴天恩下顧無狀進退惟谷無地自處臣聞髙宗命傅說為相戒之曰若作酒醴爾惟麴糵若作和羮爾惟鹽梅夫釀酒者多麴則太苦多糵則太甘調羮者多鹽則太鹹多梅則太酸和調適冝㝡為難事故以諭良相酌寛猛之政處大小之事必平和允愜曲盡其冝然後為善臣才性長短敢不自知賦分於天樸鈍戇直至於守事君之忠懐愛民之志不為欺罔不渉佞邪如此數條臣敢自保然燭理不明見事不敏度量􅄶隘關防淺露若位以元宰委之機務分畫措置必有差違至時雖自納於刑亦無所益臣非敢愛身實恐誤國况臣之少壯猶不如人今年齒衰老目視近昏事多健忘目前所為轉首不記舉措語言動多差失自近病來耳頗重聽此皆事實衆所共見非臣以虚辭文餙如此豈可首居相位毗賛萬㡬方今老成碩德已試有效及抱道藏噐藴積未施中外之臣不為無人伏望聖慈博訪選以代臣必能稱職所有告身臣未敢祗受縁臣即日歩趨拜起皆所未能朝覲之期無由預定告身留臣本家於理非是伏乞依臣前奏早賜宣取且留在閤門候臣所患痊平堪歩趨拜起入覲天顔靣陳至誠至時若不允許祗受未晩取進止乞黄庭堅同校資治通鑑劄子元祐元年上臣先奉勅編修資治通鑑共成二百餘巻於去年九月内奉聖旨令祕書省正字范祖禹及臣男康用副本重行校定聞奏近又奉聖旨令據巳校到定本逐旋送國子監鏤板竊縁上件文字巻秩稍多其范祖禹近差充修神宗皇帝實録檢討官在彼自有職事慮恐日近校定不辦有妨鏤板臣竊見秘書省校書郎黄庭堅好學有文即日在本省别無職事欲望聖慈特差令與范祖禹及臣男康同校定上件資治通鑑所貴早得了當取進止傳家集巻五十一欽定四庫全書傳家集巻五十二宋司馬光撰章奏三十五乞令校定資治通鑑所冩稽古録劄子元祐元年上臣聞史者今之所以知古後之所以知先是故人主不可以不觀史善者可以為法不善者可以為戒自生民以來帝王之盛者無如堯舜書稱其德皆曰稽古然則治天下者安可以不師古哉伏見皇帝陛下初開經筵先講論語讀祖宗寳訓論語記孔子之言行寳訓述祖宗之聖謀誠為從學之要然國家未有天下以前帝王之事臣愚以為亦不可不知也顧以年祀悠逺載籍浩愽非一日二日所能徧閱而周知所冝提其綱目撮其精英然後可以見治亂存亡之大略也臣先於英宗皇帝時嘗采獵經史上自周威烈王二十三年下盡周世宗顯德六年略舉每年大事編次為圖年為一行六十行為一重五重為一巻凡一千三百六十二年共成五巻謂之歴年圖上之以省煩文便觀覽臣又於神宗皇帝時受詔修國朝百官公卿表臣依司馬遷法自建隆元年至治平四年各記大事於上方書成上之有詔附於國史臣今更討論經史上自伏羲下至周威烈王二十二年略序大要以補二書之闕合為二十巻名曰稽古録欲繕冩奏御而私家少得筆吏恐日近不能了畢竊見先有聖旨令秘書省正字范祖禹等就本省校定臣所編修資治通鑑見有筆吏及紙札等物伏望聖慈特降指揮許臣并上件稽古録送祖禹等令就本局繕冩校對訖先次上進候將來讀祖宗寳訓了日若别未有書可讀欲乞且取臣此書進讀仍令侍讀官隨文觧釋則前王軌轍皆可槩見庶㡬足以資稽古之萬一輔聖性之聰明取進止論
