body:
  text: 乞罷刺陜西義勇第四劄子臣近日已三次上言乞罷刺陜西義勇事未䝉朝廷采納臣欲止而不言則不忍坐視一路之民横受困苦而自圖一身之安又恐遷延日久則無及於事是以不敢避斧鉞之誅繼上封奏爲陛下極陳其害臣比日以来熟思此事誠於民有世世之害於國無分毫之利何謂於民有世世之害臣竊見河北陜西河東自景祐以前本無義勇凡州縣諸般色役並是上等有物力户人支當其鄉村下等人户除二税之外更無大段差徭自非大饑之嵗則温衣飽食父子兄弟熈熈相樂自寳元慶厯之間朝廷因趙元昊叛亂契丹壓境遂於三路鄉村人户之中不問貧富等第但有三丁之家即揀一丁充鄉弓手及强壯其時西邊事宜尤急尋將陜西一路鄉弓手盡刺面充保捷指揮正軍其河北河東事冝稍緩遂只將鄉弓手及強壯刺手背充義勇自此三路之人始騷然愁苦矣其河北河東之民比於陜西雖免離家去鄉戍邉死敵之患然一刺手背之後則終身拘綴或欲逺出幹事糴賤販貴或遇水旱㓙荒欲分房逐熟或典賣田産欲浮遊作客皆慮官中非時㸃集不敢東西又當差㸃之際州縣之吏寜無乞覔教閲之時人貟教頭寜無斂掠是於常時色役之外添此一種科徭也若果如議者之言無害於民則民皆樂從官中何必更刺其手背以防逃竄乎以此觀之義勇爲害於兩路之民已可知矣况陜西於慶厯年中民家已各喪一丁刺充保捷流落不歸今又取其次丁刺充義勇不亦甚乎朝廷近年分命朝臣徧往諸路减省諸般色役至於弓手壯丁觧子驛子之類州縣所不可闕者亦皆减放謂之寛恤民力今乃無故一旦刺一路之民十有餘萬以爲義勇何朝廷愛之於前而忍之於後憫之於小而忘之於大乎且今日既籍之後則州縣義勇皆有常數每有逃亡病死州縣必隨而補之則義勇之身既羈縻以至老死而子孫若有進丁又不免刺爲義勇是使陜西之民子子孫孫常有三分之一爲兵也臣故曰於民有世世之害也何謂於國無分毫之利太祖太宗之時未有義勇至於正軍亦不及今日十分之一然而太祖取荆湖平西川下廣南克江南太宗取兩浙克河東一統天下若振槁拾遺此豈義勇之力也哉盖由民政修治軍令嚴肅將帥得人士卒精練故也康定慶厯之間趙元昊負累朝厚恩無故逆命侮慢不恭侵犯邊境朝廷竭天下之力以奉邉鄙劉平任福葛懐敏之師相繼覆没士卒死者動以萬數正軍不足益以鄉兵外府不足繼以内帑民力困極財物殫盡終不能出一旅之衆渉區脱之地以討其罪而不免含垢忍恥假以寵名誘以重賂僅得無事當是之時三路新置鄉兵共數十萬何嘗得一人之力乎以此觀之義勇無用亦可知矣賈誼有言曰前車覆後車戒康定慶厯禦戎之䇿國家當永以爲戒今乃一一檢當時體例而行之是後車又將覆也有難臣者必曰古之兵皆出民間豈民兵可用於古而不可用於今乎臣則對曰三代之時用井田之法以出士卒車馬居則爲比閭族黨州鄉行則爲伍兩卒旅師軍爲之長者皆卿大夫也唐初府兵各有營府不屬州縣有將軍郎將折衝果毅以相統攝是以令下之日數萬之衆可以立具無敢逃亡避匿者以其綱紀素備故也今鄉兵則不然雖有軍員節級之名皆其郷黨族姻平居相與拍肩把袂飲慱鬬毆之人非如正軍有階級上下之嚴也若安寜無事之時州縣聚集教閲則亦有行陣旗鼓闗弓彍弩坐作呌噪真如可以戰敵者彼若聞敵寇大入邉兵已敗邉城不守敵騎殺掠蹂踐巻地而米則莫不迎望風聲奔波迸散其軍貟節級將鳥伏䑕竄自救之不暇豈有一人能爲縣官率士卒而待冦乎以臣觀之此正如兒戯而已安有爲國家計驚搔一路之民使之破家失業而爲兒戯之事乎臣故曰於國無分毫之利也凡此利害之明有如白黒伏望陛下不以臣愚賤而忽其言少留聴察其刺陜西義勇事早賜寢罷則一方幸甚取進止乞罷刺陜西義勇第五上殿劄子臣近者已曽四次上言乞罷刺陜西義勇别白利害極其懇惻終未䝉省察方今陜西一路之民小大老㓜如在湯火之中而朝廷晏然略無拯救之意臣職在箴諫安可塞黙不敢廣有援引以煩聖聴請以目前顯驗言之今建議以義勇爲便者必曰即日河東河北不用衣粮而得勝兵數十萬皆教閲精熟可以戰敵又兵出民間合於古制臣請言其不然彼數十萬者虚數也教閲精熟者外貎也兵出民間者名與古同而實異也何以言之河北河東州縣既承朝廷之意各㨂刺義勇只求數多據帳籍言之誠有數十萬之衆矣若萬一敵寇在近官中急欲㸃集之時則一人不可見矣豈非虛數乎平常無事州縣教閲之日觀者但見其旗號鮮明鉦鼓備具行列有序進退應節即歎美以爲真可戰敵殊不知彼皆隊舞聚戲之類若聞胡寇之来則瓦解星散不知所之矣豈非外貌乎古者兵出民間民耕桑之所得皆以衣食其家故處則富足出則精鋭今既賦斂農民之粟帛以贍正軍又籍農民之身以爲兵是一家獨任二家之事也如此民之財力安得不屈豈非名與古同而實異乎以臣愚見河北河東已刺之民猶當遣放况陜西未刺之民乎陛下欲知利害之實何不試召建議者而問之曰河北河東自置義勇以来敵寇凡幾次深入至腹内州軍用義勇拒戰而敵寇敗退今既有義勇之後三路正軍皆可廢而不用乎若果然敵寇曽深入因得義勇之力而敗退今来刺義勇之後正軍皆可廢罷此乃萬世之長策也願陛下行之勿疑若自置義勇以来未嘗經陣敵使用今来雖有義勇正軍亦未可廢罷則何忍以十餘萬無罪之赤子盡刺以爲無用之兵乎天生聖君以爲民也民今如此陛下豈可全不爲之動心乎臣之所言盡於此矣陛下若以爲稍有可采即乞早降指揮下陜西令罷刺義勇以救一方之民若以爲勅命已行不肯遽改即乞且免刺手背候邉事寜息依舊放散則民雖有一時搔擾之勞猶免終身羈縻之苦若以臣所言皆孟浪迂闊不可施行則臣之智識愚闇無以勉强變更不可久汙諫諍之列伏望聖慈特賜降黜别擇賢才而代之取進止乞罷刺陜西義勇第六劄子臣昨日上殿爲言乞罷刺陜西義勇事陛下宣諭臣以爲命令已行臣退而思之不勝鬰悒終夕不寐深痛陛下此言之失臣案周易復之初九曰不逺復無祗悔元吉祗大也盖言人誰無過雖聖賢亦不能免然聖賢皆能不逺而復故雖有小悔不至於大而終保元吉也其上六日迷復㓙有災眚用行師終有大敗以其國君凶至於十年不克征盖言失之已逺迷而不復無事不凶而人君尤甚故孔子賛之曰迷復之㓙反君道也自古明聖之君聞一善言而立爲之變更號令者多矣不可悉數惟近嵗大臣自知思慮不熟號令已失無以抑奪臺諫之言則云命令已行難以更改此乃遂非拒諫之辭陛下新臨大政當求善無厭從諫如流之時而亦有此言天下將何望焉且唐室以前諫議大夫拾遺補闕皆中書門下省屬官日與中書令侍中侍於天子之側議論大政苟事有闕失皆得隨時規正今國家凡有大政惟兩府大臣數人相與議論深嚴秘宻外廷之臣無一人知者及詔勅已下然後臺諫之官始得與知或事有未當須至論列又云命令已行難以更改則是國家凡有失政皆不可復救也如此豈惟愚臣一人無用於時諫諍之官皆可廢也以臣所見但當論其事之得失言之是非不當云命令已行不可改也今陜西一路之民小大遑遑正如在湯火之中若忽得朝廷指揮云所有義勇且住㨂刺其已刺手背者並給與公憑放令逐便是得出湯火之中死而復生也其誰不歡呼皷舞感戴聖恩豈有一人云命令已行不當復改邪陛下萬民之父母萬民陛下之赤子豈有父母誤墜其子於井而曰吾已誤矣遂忍不救邪昔舜稱堯之徳曰稽于衆舍已從人仲虺稱湯之徳曰用人惟已改過不吝臣願陛下勿以先入之言爲主虚心平意以察臣淺識五次所言果然爲是爲非若其是歟即公平降指揮罷刺陜西義勇若其非歟即乞如臣前來所奏特賜降黜别擇賢才而代之所有命令已行之言伏望陛下自今永以爲戒不可使天下聞之塞絶善言之路也取進止乞降黜第一狀治平元年十二月五日上右臣近日累曽上言乞罷刺陕西義勇事朝廷以言無可采寢而不行臣性識庸昩不違大體妄以狂瞽煩瀆聖明章奏相繼至於五六終不能少以愚誠感動天聴尸祿曠官孰甚於此臣實無顔尚居諫列伏望聖慈察其無堪早賜降黜乞降黜第二第三第四狀闕乞降黜第五狀右臣近曽四次進狀以言事不當乞賜降黜未䝉朝廷施行今伏見知制誥錢公輔因繳納王疇除樞宻副使詞頭責授滁州團練副使臣竊以公輔所坐止於柅樞宻副使恩命臣曏来所言乃是沮宰相大議公輔宻啟於詔令未出之前臣露章爭執於詔令已行之後公輔奏章止於一上臣凡六次進劄子五次進狀以此校量公輔罪輕㣲臣罪重輕罪猶蒙嚴譴重罪安可不行伏望聖慈詳臣前後所奏比錢公輔更於逺小處責降所貴聖朝刑典行之均壹乞降黜上殿劄子治平二年正月九日上臣近曽五次進狀以言事不當乞賜降黜未蒙朝廷施行陛下之意盖謂臣一言不從遽求引去太爲容易臣之愚心非敢獨爲曏來一事而已臣聞爲士者苟得位於朝必能獻可替否致君堯舜躋民仁夀今臣備位諫職三年有半不能悉心竭忠以補益明主使國家綱紀濅以隳紊百姓困窮衣食日蹙戎狄悖慢軍旅驕惰比於臣未作諫官之時未見有分毫之勝然則臣之不材較然可見豈敢不自愧恥尚竊寵榮伏望聖慈依臣前奏早賜責降取進止傳家集巻三十四欽定四庫全書傳家集巻三十五宋司馬光撰
