body:
  text: 原命子罕言命子貢稱夫子之文章可得而聞也夫子之言性與天道不可得而聞也是則天道精㣲非聖人莫能知今學者未能通人理之萬一而遽從事於天是猶未嘗操舟而欲渉海不陷溺者其幾矣昔眭孟知有王者興於㣲賤而不知孝宣乃欲求公孫氏嬗以天下翼奉知漢有中衰阨會之象而不知王莽乃云洪水為災西門君惠知劉秀當為天子而不知光武乃謀立國師劉秀秀亦更名以應之劉靈助知三月當入定州四月爾朱氏滅而不知滅爾朱者為齊神武入定州者乃其首也此五子者其於術可謂精矣皆無益於事而身為戮沒又况下此者哉夫天道窅㝠恍惚若有若亡雖有端兆示人而不可盡知也非天下之至神其孰能與於此是以聖人之教治人而不治天知人而不知天春秋記異而説不書唯恐民冒沒猖狂以趨於亂也說說𤣥予少之時聞𤣥之名而不獲見獨觀雄之自序稱𤣥盛矣及班固為雄傳則曰劉歆嘗觀𤣥謂雄曰空自苦今學者有祿利然尚不能明易又如𤣥何吾恐後人用覆醤瓿也雄笑而不應諸儒或譏以為雄非聖人而作經猶春秋吴楚之君僣號稱王盖誅絶之罪也固存此言則固之意雖愈於歆亦未謂𤣥之善如雄所云也余亦私怪雄不賛易而别為𤣥易之道其於天人之藴備矣而雄豈有以加之廼更為一書且不知其焉所用之故亦不謂雄宜為𤣥也及長學易苦其幽奥難知以為𤣥者賢人之書校於易其義必淺其文必易夫登喬山者必踐於坱埤適滄海者必㳂於江漢故願先從事於𤣥以漸而進於易庶幾乎其可跂而望也於是求之積年始得觀之初則溟涬漫漶畧不可入廼研精易慮屏人事而讀之數十過參以首尾稍得闚其梗槩然後喟然置書嘆曰嗚呼揚子雲真大儒者邪孔子既沒知聖人之道者非子雲而誰孟與荀殆不足擬况其餘乎觀𤣥之書明則極於人幽則盡於神大則包宇宙細則入毛髮合天地人之道以為一刮其根本示人所出胎育萬物而兼為之母若地履之而不可窮也若海挹之而不可竭也盖天下之道雖有善者蔑以易此矣考之於運元之初而𤣥已生察之於當今而𤣥非不行窮之於天地之季而𤣥不可亡叩之以萬物之情而不漏測之以鬼神之状而不違槩以六經之言而不悖籍使聖人復生視𤣥必釋然而笑以為得已之心矣乃知𤣥者以賛易也非别為書以與易角逐也何歆固知之之淺而過之之深也或曰易之法與𤣥異雄不遵易而自為之制安在其賛易乎且如與易同道則既有易矣何以𤣥為曰夫畋者所以為禽也網而得之與弋而得之何異書者所以為道也易網也𤣥弋也何害不既設網而使弋者為之助乎子之求道亦膠矣且揚子作法言所以準論語作𤣥所以凖易子不廢法言而欲廢𤣥不亦惑乎夫法言與論語之道庸有異乎𤣥之於易亦然大厦將傾一木扶之不若衆木扶之之為固也大道將晦一書辨之不若衆書辨之之為明也學者能專精於易誠足矣然易天也𤣥者所以為之階也子將升天而廢其階乎先儒為𤣥解者誠已善矣然子雲為文既多訓詁指趣幽邃而𤣥又其難知者也故今疑先儒之解未能盡契子雲之志世必有能通之者比老終且學焉述述國語慶厯五年作先儒多怪左丘明既傳春秋又作國語為之説者多矣皆未甚通也先君以為丘明將傳春秋乃先采集列國之史國别分之取其菁英者為春秋傳而先所采集之藁因為時人所傳命曰國語非丘明之本志也故其辭語繁重序事過詳不若春秋傳之簡直精明渾厚遒峻也又多駁雜不粹之文誠由列國之史學有厚薄才有淺深不能醇一故也不然丘明作此複重之書何為耶然所載皆國家大節興亡之本栁宗元邪佞之人智識淺短豈足以窺望古君子藩籬而妄著一書以非之竊懼後之學者惑於宗元之言而簡弃此書故述其益以張之四言銘系述元豐二年五月十七日作迂叟為四言銘見者忽之曰老生常談耳故有系述孔子稱才難夫才者所受於天非人所能強也故推十合一曰士千人曰俊萬人曰傑出於其類㧞於其萃此其所以難也聞言易悟曰聰睹事易辨曰明敢為不懼曰勇強力不屈曰健有是四者才則美矣然未足恃也自古恃才而不懃徳行以殺身䘮家亡國者踵相及也彼皆天之所與非已之所為又奚足以驕人哉君子則不然有其才必思美其行以成之盡心於人曰忠不欺於已曰信善父母曰孝善兄弟曰友夫孝友百行之先而後於忠信何也苟孝友而不忠信則非孝友矣能是四者行則美矣未及於徳也正直為正正曲為直適宜為中交泰為和正直非中和不行中和非正直不立若寒暑之相濟隂陽之相成也夫察目睫者不能見百歩瞻百歩者亦不能見目睫均是徳也執其近小而遺其逺大守其卑淺而忘其髙深是猶不免為小人焉故君子好學不厭自強不息推之使逺廓之使大聳之使髙研之使深發于心形于身裕于家施于國格于上下被于四表雖堯舜周孔莫不本於是矣嗚呼捨是而云道者皆不足學也
