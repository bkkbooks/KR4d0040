seq: 12
front:
  text: 祖擇之人生榮與辱百變似浮雲自有窮通定徒勞得喪分消愁唯有酒娛意莫如文方寸常蕭散其餘何足云
  hash: sha256:73713cb085924b42642442aaf09531c5ab0f6f46e64a6739c1a5251e1a65ac88
body:
  text: 和宋子才致仕後歳旦見贈閒官逢獻歳拜揖亦紛然須信家居日方為已有年劬勞中外徧名迹始終全伯玉空搔首蹉跎愧在前上元書懷老去春無味年年覺病添酒因脾積斷燈為目阿嫌勢位非其好紛華已久厭唯餘讀書樂暖日坐前簷喜才元過洛小詩招飲素髪各垂領舊交相見稀不唯春物好况是錦衣歸洛社凍醪熟詩春酒凍醪也伊魴􅁝鱠肥唐人諺曰洛鯉伊魴貴於牛羊南軒已灑掃命駕不須違仲庶同年兄自成都移長安以詩寄賀蠶叢龜印解鶉野隼旟新借問錦江樂何如興慶春驪歌遮去轍竹馬望行塵惠政如膏雨遥知彼此均西臺詩二十四韻翰苑昔陪侍天光辱顧瞻寵雖承渙汗功不立毫纎山鹿纓頻頓鉛刀礪不銛拭花眸子缺撚雪頷髭添跼影慚尸素胡顔處禁嚴辭盈雖免戾取少詎因亷定鼎分都異張官執法兼剡章愚懇盡出綍茂恩霑原憲非無粟胡威尚有縑求田近瀍洛買宅混閭閻地僻宜花卉兒勤付米鹽倦遊良足悔居吉不煩占裘葛膚無見囷倉飯屬饜僧居閒可借野步静無嫌行樂笻枝瘦延賓稻醴甜麥田泥試屐桑䕃㡌低簷愛竹忙猶種貪書老未厭松煙溪石潤檀燼博山尖牋啓來慵拆衣冠脫怕拈紫毫斜倚架黄巻宻垂籖涸轍猶䝉潤寒灰免附炎所憂資秩滿但願歳時淹自是散無用非為智養恬聖朝英彦富幸許一夫潜和邵堯夫年老逢春年老逢春春莫咍朱顔不肯似春囬酒因多病無心醉花不解愁隨意開荒徑倦遊從碧草空庭慵掃自蒼苔相逢談笑猶能在坐待牽車陌上來和范景仁謝寄西遊行記二首洛川秦野鬰相望風物山河舊帝鄉澗底逢人問樵徑松間繫馬宿僧房恨無同好攜三雅共講前聞醉百場李白詩痛掃鸚鵡洲與君醉百場歴徧勝遊翻悵望日邊囬首逺煙蒼八水三川路渺茫翠微深處白雲鄉目懶拭如松液領髪頻㧓似栗房林壑不嫌無用物形骸難入少年場縁苔躡蔓知多少千里歸來屐齒蒼獨步至洛濱二首拜表歸來抵寺居解鞍縱馬罷傳呼紫衣金帶盡脫去便是林間一野夫草軟波清沙徑微手􅂝笻竹著深衣白鷗不信忘機久見我猶穿岸栁飛送酒與邵堯夫紅櫻零落杏花開春物相催次第來莫作林間獨醒客任從花笑玉山頽再和邵堯夫年老逢春年老逢春猶解狂行歌南陌上東岡晴雲高鳥各自得白日遊絲相與長草色無情盡眼緑花林多思襲人香吾儕幸免簪裾累痛飲閒吟樂未央又和來韻年老逢春無用驚對花弄筆眼猶明不嫌貧舍舊來鷰喚起醉眠何處鸎一僕相隨幅巾出羣童聚看小車行人間萬事都損去莫遣胷中氣不平邵堯夫許來石閣久待不至淡日濃雲合復開碧嵩清洛逺縈逥林端高閣望己久花外小車猶未來石閣春望極目千里外川原繡畫新方知平地上見不盡青春和邵堯夫安樂窩中職事吟靈臺無事日休休安樂由來不外求細雨寒風宜獨坐暖天佳景即閒遊松篁亦足開青眼桃李何妨挿白頭我以著書為職業為君偷暇上高樓和范景仁聞蟬春林滿巖緑誰信已鳴蟬葉上正多露山中别有天心閒寧感物道合况忘年坐聽生秋思何須膝上絃和范景仁宿憩鶴寺囬廊複閣勢縈紆四嶺中涵一氣虛最愛欣欣向榮木毎來相見不相疎遊噴玉潭二首驚風動地起遊客望山行若待佳辰去應無好事名萬木吼穹谷駑駘屹不前猶勝望塵客佇立九衢邊和范景仁昨朝景氣如暑天僮僕流汗衣裘單安知向晩暴風作一變陽春成大寒比時結友尋名山伶俜徒步水石間棘刺罥衣行路難枯藤夀柏同攀援驚沙擊眼百箭攢時得閉爍窺林巒景仁年長力更孱牽衣執手幸不顛仍聞旁谷有伏虎賴得與君俱早還按律詩巻中誤編入古詩諸本皆同遊山呈范景仁景仁年六十三致仕我禄多龔舍舎為吏不過六百石輙自免去君年少孔戣戣七十致仕韓愈留之道心閒始見世路老方知山水不相厭風光難豫期嬉遊不可緩花卉即離披和范景仁遊夀安宜陽城下作遊人都為衣冠不繫身衆竅怒號成地籟也勝終日在紅塵噴玉潭千尺崖頭一𣲖清古今不絶墜峥嶸長風巻起散巖壑此日方知噴玉名疊石溪二首道傍行采藥石底卧題名溪邊有石横出下甚隘景仁卧其下題名而去野老相迎拜谿童乍見驚山鳥勸人飲山多提壺鳥山蟬笑我狂山蟬聲如笑歸時興未盡不得看斜陽和范景仁疊石溪溪邊有村落未始識紛華去縣只數里居民踰百家山腰荒徑轉谷口翠微遮老木紛無際重巒浩莫涯力窮纔到頂勢盡復成窪不定雲煙色難名藥草芽泥鈞羅比屋澗石載連車谷口多甆窰土人自女几澗采石載來賣之為油宛有淳風在誰云太古遐梁隨木性曲簷逐地形斜榛路牛呼犢叢祠雀噪蛇倚崖松偃蓋落石浪翻花安用遊青嶠何須躡紫霞好將詩筆寫還入帝城誇已買漁樵舍毋令後約差應天院朝拜囬呈景仁鷄鳴上馬過河橋何異東都赴早朝紅日已高猶熟寢比君殊未得逍遙和景仁卜居許下景仁頃見許居洛今而背之故詩中頗致其怨壯齒相知約歳寒索居今日鬢俱斑拂衣已解虞卿印築室何須謝傅山許下田園雖有素洛中花卉足供閒他年决意歸何處便見交情厚薄間喜雨三首呈景仁侍郎兼獻大尹宣徽累日增煩暑通宵結薄隂蒼茫變風色散漫作春霖野店垂楊重僧房緑篠深踈慵尤得趣閉户擁重衾漠漠春雲合爞爞旱氣收人心方有望時雨不須求豈獨老農喜仍令惡客畱洛城花未謝作意更同遊麥田正塵坌桑徑忽滂沱比屋起相吿荷鋤行且歌園林半扄鎻車馬絶經過大尹愛民物何妨喜更多亨杞下第作詩示之清白君家舊文章時態新何妨偶蹉跌未必遂沈淪莫歎科名晩惟憂道誼貧進修專在已得失盡由人孝友亦為政簞瓢足養親那將少年淚容易輙傷春景仁思歸雨未克行以詩畱之嘉客念歸程泥深未可行今朝隂又重春雨亦多情送景仁至丁正臣園寄主人客到暫開扄春蕪生滿庭主人殊不顧修竹為誰青和君貺老君廟姚黄牡丹芳菲觸目已蕭然獨著金衣奉老仙若占上春先秀發千花萬卉不成妍又和董氏東園檜屏石牀宻葉蕭森翠幕䊸暫來猶恨不長居脱冠解帶坐終日花落石牀春自如
