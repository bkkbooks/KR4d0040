body:
  text: 乞未禁私市先赦西人劄子元祐元年二月上臣於今月三日上言以西人未服中國不得無憂而邉備不敢少弛不自揆其狂妄獻二策上策欲因天子繼統曠然赦之歸其侵地與之更始下策欲嚴禁私市俟其屈服然後赦之然禁私市甚難立法極嚴又邉帥得人然後能行不若前策之道大體正萬全無失也今竊聞執政用臣下策止令禁私市又立法不嚴邉師未盡得人若邉吏拘文獲一漏百私市滔滔如故或此路禁絶而彼路放行如隄防一存一亡將何所益如此適足以激怒西人使益發悖心安肯屈服萬一㣲犯邉境或表牒中形不遜語至時朝廷轉難處置悔之無及不若用臣上策早相彌縫縱未欲還其侵地且下詔書責而赦之使彼此安心時難得而易失不可忽也况本欲因天子繼統蕩滌其罪今日行之已為太晩若更遷延則赦之無名兹事繫國安危若俟執政論議僉同恐失機㑹誤國大事伏望聖意獨斷行之勿復有疑天下幸甚若有執政立異議乞令其人自入文字若依從其議他日因此致引惹邉事當專執其咎取進止乞先赦西人第二劄子元祐元年二月上臣於今月十二日上言乞以天子繼統曠然更始宜下詔數西人之罪而赦之縱未還其侵地且行此策以安邉境至今聞執政議尚未决臣之愚意以為封内未安未可圖外故欲急行臣前策以羈縻西人且可數年邉鄙無事朝廷得休息戍兵安養百姓待國力完偹家給人足然後奮揚天威討貳柔服何所不可若行臣前策可以萬全行臣後策有得有失豈可棄上策而用下策捨萬全而就有失也本平興國中李繼遷反西陲不解甲者十餘年關中困竭寳元慶厯之間趙元昊叛屢入為冦覆軍殺將自是中國虚耗不復富實今國家理財未得其道民力困窮於下府庫窘乏於上又新遭大喪山陵纔畢自去年十月初以來不雨雪旱勢甚大若萬一激怒西人㣲出一不遜語則并臣前策亦不可行矣今因天子即位未久西人外迹未有不順故臣願朝廷旦夕汲汲行之機㑹難得時不可失此臣所以惓惓進言不已者也若萬一激怒西人致生邉患兵連禍結士卒殄盡於鋒鏑生民困竭於轉餉餓殍蔽地盗賊鋒起為國家慮豈不危哉而執政方以為西人㣲弱不敢復動數遣使來誠心内附置之度外不以為虞今復固執先禁私市之議又立法不嚴邉帥不才者不先易去行之太早不能中節一旦禍生所忽邉鄙震驚乃始歸罪戎狄豈不害國事乎臣於今月三日所上言措置西邉事雖畫二策固以還其侵地責而赦之為上策嚴禁私市待其數年貧困來服然後赦之為下策所謂絶私市非立法至嚴帥臣智勇此法恐未易可行不若前策道大體正萬全無失非臣前後返覆静言庸違也朝廷比來擢臣於冗散之中使預聞國論盖亦誤謂臣㣲有益於國家非徒采其虚名也臣之不敢終辭亦欲竭盡疲駑少酬大恩非苟貪於禄位也今盡忠謀國而為衆所挫臣尚留此有何所用此國大事伏望陛下早審察二議從其長者若聖意以臣言為然乞御批依臣前策若降付三省樞宻院執政仍有固守已見争之最力者乞如臣前奏令自入文字言先禁私市保得他日必不致引惹邉事如其不然身執其咎取進止乞不改更罷役錢敕劄子元祐元年上臣近以抱病家居恐溘先朝露無以少報盛徳是以力疾貪陳所見竊以即日為小民病者無若免役錢欲乞悉行廢罷復祖宗差役舊法識慮愚短誠不意朝廷盡從其說非陛下明斷不能如是此乃天下之幸非獨微臣之幸也然臣聞令出惟行弗惟反彼免役錢雖於下戸困苦而上戸優便行之已近二十年人情習熟一旦變更不能不懐異同又復行差役之初州縣不能不小有煩擾又提舉官專以多斂役錢為功惟恐役錢之罷若見朝廷於今日所下勅微有變動必須相吿曰朝廷之勅果尚未定宜且觀望必競言役錢不可罷朝廷萬一聽之則良法復壊矣伏望朝廷執之堅如金石雖有小小利害未偹俟諸路轉運司奏到徐為改更亦未為晩當此之際則願朝廷勿以人言輕壊利民良法取進止
