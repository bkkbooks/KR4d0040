body:
  text: 乞申明求諫詔書劄子元豐八年六月十四日上臣伏見皇帝陛下初臨太寳太皇太后陛下同斷萬幾側身虚已渇於求諫特下詔書大開言路此誠明主之先務太平之本原也竊見中間有若廼隂有所懐至是亦不得已也一節天下見者未達聖心咸以為朝廷雖名求諫實惡人論事豫設科禁有上言者皆可以此六事罪之是以盤桓猶豫未敢盡言如此則上恩不得下䆒下情不得上通上下否閉萬事乖失又前來詔書止牓朝堂所詢不廣見者甚少臣愚欲望聖慈下學士院别草詔書除去中間一節務在勤求讜言使之盡忠竭誠無有所諱仍乞徧頒天下在京於尚書省前及馬行街出牓在外諸州府軍監各於要閙處曉示不以有官無官之人應有知朝政闕失及民間疾苦者並許進實封狀言事在京則於登聞鼓院檢院投下委主判官畫時進入在外則於州府軍監投下委長吏即日附逓聞奏不得取責副本强有抑退其百姓無家業人慮有姦詐即令本州責保知在奏取指揮放令逐便候有上件實封奏狀進入至内中伏望陛下以萬幾之暇畧賜省覽其所論至當者當用其言以顯其身其是非相半者捨短取長其言無可采事不可行者亦當矜容不可加罪如此則下情無不通嘉言㒺攸伏聦明周四逺海内如指掌矣或慮奏狀繁多難以親覽即乞降付三省委三省官看詳擇其可取者用黄紙簽出再進入或乞留置左右以偹規戒或乞降付有司施行取進止看閱吕公著所陳利害劄子臣今月一日夜䝉降到吕公著劄子一道付臣看閱所陳更張利害有無兼濟之才直書當與未當具悉奏來者臣自公著到京止於都堂衆中一見自後未嘗私相見及有簡帖往來今公著所陳與臣所欲言者正相符合盖由天下之人皆欲如此臣與公著但具衆心奏聞耳臣聞書曰有廢有興出入自爾師虞庶言同則繹言國家政事欲有所改更必先謀於衆人所言皆同然後行之則無失也傳曰上酌民言則下天上施言為人上者當采酌民言從其所欲則在下之人戴上如天受其恩施也伏望陛下察公著所陳參以臣民所上實封奏狀若與之同者斷志行之勿復有疑臣見太平之功不日可成矣公著一言而天下受其利可謂有兼濟之才所言無有不當惟有保甲一事欲就農隙教習臣愚以為朝廷既知其為害於民無益於國便當一切廢罷更安用教習容臣續具劄子奏聞次其公著劄子謹同封上取進止乞罷保甲劄子元豐八年七月三日上臣竊見先帝以戎狄驕傲侵據漢唐故地有征伐開疆之志故置保甲令開封府界及河北陜西河東三路皆五日一教閱京東西兩路保甲養馬仍各置提舉官權任比監司既而有司各務張皇以希功賞其提舉官專䕶本局不顧他司事干保甲州縣皆不得關預管内百姓不得處治其廵檢指使保正保長競為侵擾蠶食無厭稍不如意擅行捶撻其保丁習於遊惰不復務農或自為刼掠或侵陵鄉里其本家耕種耘穫率皆妨廢供送不辦率斂無窮貲産耗竭無以為生弱者流移四方壯者亡為盗賊行之數年先帝浸知其弊申勅州縣令保甲應有違犯并廵教官指使違法事件並許州縣覺察施行及陛下踐阼聽政首令京東西路保甲養馬並依元降年限収買其剰買過數目並以充次年之數又令開封府界三路團教已及半年經朝廷按閱者每月併教兩日未經按閱者併教三日陜西團教未及半年者每月兩次併教三日又令見教人身材弱小或久來疾病及本家止有一丁病患不堪營作并第五等巳下地土不及二十畝者並許州縣保明提舉司審驗放免又令一縣不得放免過二分此皆聖澤矜寛民力於保甲勞費雖什减五六然保甲保馬向去㸃擇買養補填尚猶如舊其廵教指使保正保長名目猶在於所轄保甲恐不免須有陵逼侵漁其四時教閱雖减日數未免妨農臣愚以為此保甲若使之逐捕賊盗則近已有指揮廵檢縣尉及弓手兵級人數並令依保甲未上畨以前人數復置其保甲更不令管勾捕盗若使之攻討四夷則此皆畎畝白徒教閱雖熟未嘗見敵與戎狄戰鬭必望風奔潰登極詔書戒勅邉吏令不侵擾外界務要静守疆場然則此保甲保馬的實有何所用徒令府界及五路農民不堪愁苦幸賴社稷之靈適值累年豐稔猶流民甚多盗賊充斥若遇如明道年之蝗康定年之旱至和年之水則其為國家大患豈可盡言近者羣盗王冲乗保馬諸處行刼置保馬本欲逐盗今更為盗資又獲鹿縣保甲斫射毆傷提勾孫文廵檢張宗師以下陵上是乃大亂之源漸不可長凡保甲保馬有害無利天下之人莫不知之臣不知朝廷何憚而乆不廢罷伏乞斷自聖志盡罷諸處保甲保正保長使歸農依舊置耆長壯丁廵捕盗賊戸長催督稅賦其所養保馬揀擇勾収太僕寺量給價錢分配兩騏驥院坊監及諸軍召提舉官還朝其勾當公事廵檢指使並送吏部與合入差遣如此則開封府界及五路之民孰不歡呼鼓舞荷戴聖德若以保甲中武藝已成之人可惜使之歸農即乞令逐縣戸數每五十戸置弓手一人略依縁邊弓箭手法許䕃本戸田二頃與免二稅或稅輕者與免若干石斗稅及戸下諸般科役本戸田不足聽䕃親戚田務在優假使人勸慕然後召募本縣鄉村戸有勇力武藝者投充弓手計即今保甲中有勇力武藝者必多願應募若一人闕額有二人以上争投者即委本縣令佐揀試武藝高强者充若見充弓手人有勇力武藝衰退許他人指名比較若勝於舊者即令充替如此則不須教閱武藝自然常得精熟一縣之中其勇壯者既充弓手其羸弱者雖使之為盗亦無能為患仍委本州及提㸃刑獄常切按察令佐有取捨不公者重加刑典若無人投名乞更議優法若尚召募不足即且於鄉村戸上依舊雇人候有投名者即令充替若弓手數多即令分畨更互在縣祗應一年一替其餘各分定地分廵捕賊盗每獲賊勘得赦後住止及窩藏去處其本地分嚴行科責及令出賞錢與獲賊之人其賊發地分更不作三限科校只令捕賊給賞如此則賊發之處捕盗之人不復掩蔽住止窩藏之處捕盗人不肯庇匿盗賊無所容身自然稀少取進止乞罷免役錢狀元豐八年上右臣竊以百姓出力以供在上之役盖自古及今未之或改熈寧中執政者以為百姓惟苦差役破産不憚増稅乃請據家貲高下各令出錢雇人充役按因差役破産者惟鄉戸衙前有之自餘散從承符弓手手力耆戸長壯丁未聞破産者也其鄉戸衙前所以破産者盖由山野愚戇之人不能幹事使之主管官物或因水火損敗或為上下侵欺是致欠折備償不足有破産者至於長名衙前乆在公庭句當精熟每經重難差遣積累分數别得優輕場務酬奨徃徃致富何破産之有夫差役出於民錢亦出於民今使民出錢雇役何異割鼻飼口朝三暮四於民何所利哉又曏者役人皆上等戸為之其下等單丁女戸及品官僧道本來無役今更使之一槩輸錢則是賦斂愈重非所以寛之也故自行免役法以來富室差得自寛而貧者困窮日甚殆非所抑兼并哀惸獨均賦役也又監司守令之不仁者於雇役人之外多取羨餘或一縣至數萬貫以冀恩賞規進取不顧為民世世之患又國家舊制所以必差青苗戸充役人者為其有莊田家屬有罪難以迯亡故頗自重惜今雇浮浪之人充役常日恣為不法一旦事發單身竄匿何處州縣不可投名又農家所有不過穀帛與力自古賦役無出三者自行新法以來青苗免役及賦斂多責見錢錢非私家所鑄要須貿易外求豐歳穀賤已自傷農况廹於期限不得半價盡糶所収未能充數家之餱粮不暇更留若值凶年則又無穀可糶人人賣田無所可售遂至殺牛賣肉伐桑鬻薪來年生計不敢復議此農民所以重困也又錢者流通之物故謂之泉布比年以來物價愈賤而閭閻益困所以然者錢皆聚於官中民間乏錢貨重物輕借使有人鬻薪糴米米價雖賤薪價亦賤故也臣愚以為宜悉罷免役錢其州縣諸色役人並依舊制委本縣令佐掲簿定差替見雇役人其衙前先召募人投充長名召募不足然後差鄉村人戸每經歴重難差遣依舊以優輕場務充酬奨所有見在免役錢撥充州縣常平本錢以戸口為率常存三年之蓄有餘則歸轉運司凡免役之法縱富强應役之人征貧弱不役之戸利於富者不利於貧者及今耳目相接猶可復舊若更年深富者安之民不可復差役矣傳家集巻四十七欽定四庫全書傳家集巻四十八宋司馬光撰章奏三十一乞罷將官狀元豐八年上右臣伏以州縣者百姓之根本長吏者州縣之根本根本危則枝葉何以得安故自古以來凡置州郡必嚴其武備設長吏必盛其侍衛非以重其權驕其人也乃所以安百姓衛朝廷也秦懲周室幹弱枝强之弊既滅六國以為天下不復用兵雖分三十六郡置郡守更以御史監之隳名城銷兵器束以苛法舉動施為皆不得自專是以陳勝吳廣以匹夫奮臂大呼郡縣莫能制多殺長吏以應之雖由其殘虐取亡亦守令無權無兵之所致也晉武帝平吳亦以為天下既一兵無所用悉去州郡兵陶璜山濤皆言州郡武備不可廢帝不聽及永寧以後盗賊羣起州郡無備不能擒制天下遂大亂夫兵者所以威不軌而昭文德誰能去兵州縣無虞則國家安矣州縣不守則國家危矣臣切見國朝以來置總管鈐轄都監監押為將帥之官凡州縣有兵馬者其長吏未嘗不兼同管轄盖知州即一州之將知縣即一縣之將故也先帝欲征伐四夷患諸州兵官不精勤訓練士卒懈弛於是有建議者請分河北陜西河東京東京西等路諸軍若千人為一將别置將官使之專切訓練其逐州總管以下及知州知縣皆不得關預及有差使量留羸弱下軍及剥員以充本州官白直及諸般差使其餘禁軍皆制在將官專事教閱臣愚以為職事修舉在於擇人不在設官苟得其人雖總管等皆能訓練士卒不得其人雖將官亦何所為况今之將官即曏之為總管等者也豈為總管等則不能舉職為將官乃能舉職乎此徒變易其名無益事實非惟無益兼復有害凡設官分職當上下相維如身之使臂臂之使指紀綱乃立今為州縣長吏及總管等官而於所部士卒有不相統攝不得差使殆如路人者至於倉庫守宿街市巡邏亦皆乏人雖於條許差將下兵士而州縣不得直差須牒將官將官往往占䕶不肯差撥萬一有非常之變州縣長吏何以號令其衆制禦姦宄哉又頃歳以來自轉運使知州以下白直及迎送之人日朘月減出入導從太為蕭條供承荷擔有所不給觀望削弱無以威服吏民臣略舉目覩一事以證其餘西京城郭周數千里卑薄頺缺犬豕可踰又􅈆洛二水交貫其中每夜諸門扃鐍雖嚴而灘流之際人皆可以平行往來其屬水南北廵檢下所管兵士除出軍外餘數不多通判以下諸官白直來往防送倉庫守宿街市巡邏盡出其間曏者先帝建豫勅西京留守親詣嵩山起建道場其將下禁軍充白直者於條皆不得出城經宿所敢留者剰員七八人而已西京天子别都也其守禦不固如此留守前宰相重官也其侍衞單寡如此况僻小州縣其守禦之備侍衞之衆可知矣萬一有凶校之賊驅烏合之衆突入城邑或刼質戕賊畏吏以焚燒廬舎殺掠吏民將何以制之哉此特天下太平之久習俗淳厚羣心安固賊不測虚實膽智怯弱故未敢為之耳豈可忽略謂之必無而不為之備哉今獨縁邊州軍城隍完固士卒衆多可以守禦自餘腹内州縣既無深溝高城又乏士卒羣盗猝至何以責其竭節守義不棄城竄匿或以酒食迎賊以甲兵獻賊斂民財以賂賊者乎羣盗尚爾况敵人傾國大舉長驅而來者哉易曰君子安不忘危存不忘亡治不忘亂兵法曰不恃敵之不我犯恃我之不可犯國家豈可恃即日平寧晏然高枕不以為慮謂其必不敢來乎臣愚以為河北陜西河東京東京西等路腹内州縣宜以漸候豐年農閒之際委提㸃刑獄與本處長吏相度各修築所治之城州城稍高縣城次之不必廣大所以然者高則難踰小則易守故也其縁邊屯駐兵士遇春夏無事之際委經略安撫使與轉運使公共商量减放歸住營州軍或於内地就糧勿聽怯懦將帥多有虚占以自守衛其腹内州軍量其大小𦂳慢大藩常留千餘人小州亦留數百人不得差發往别州軍見兵不足即行招添悉罷將官其逐州縣禁軍並委長吏與總管等官同共提舉教閱及諸多差使其有不能精勤致士卒懈弛者委提㸃刑獄常切按察聞奏嚴行責降仍令逐縣各選有勇力武藝之人充弓手以守衞城邑討捕盗賊其州縣吏所給白直迎送之人皆如嘉祐編勑以前之數如此力可以守然後遇㓂盗之至責其棄城等罪而誅之彼亦甘心矣乞降臣民奏狀劄子元豐八年七月十四日上臣伏見陛下詔開言路至今已涉旬月必有臣寮民庶上言朝廷闕失民間疾苦奏狀已多未見有付外令三省或樞宻院商量施行者如此則徒煩聽覽何所禆益昔漢昭帝時吏民上書言便宜有異輒下杜延年平處復奏先帝初即位詔中外上言得失亦令臣與張方平同詳定選擇可取者與元奏狀同進入内或降付三省樞宻院施行臣竊計今來臣民所上文字其間是非臧否雖錯雜嘉謀長䇿不可謂無以睿明所燭諒毫髮無遺豈可一概棄置全不采用欲乞選其可從者降出施行或以萬幾之繁未暇遍加省覽即乞依臣前奏降付三省委執政官分取看詳擇其可取者用黄紙簽出再進入或留置左右或降付有司施行取進止乞降封事簽帖劄子元豐八年八月八日上臣聞舜明四目達四聦王者視四海之内皆如戸庭閭閻之間皆如指掌然後能治其天下恭惟太皇太后陛下深居九重皇帝陛下富於春秋四海之廣大閭閻之隱微未嘗身親而目覩也非采聽臣民之言雖以天縱睿智之性何由知之陛下近詔天下臣民皆得上封事言朝政闕失民間疾苦仍降出令臣與諸執政官看詳其第一次降出者三十三巻臣謹與諸執政選擇其中除無取及冗長之辭外其可取者已用黄紙簽出進入訖伏乞陛下取簽出者更賜詳覽或留置左右以備規戒或降付有司商議施行如此則忠言日進聦明日廣誠生民之厚幸社稷之盛福也曏者執政請聽臣寮上殿陛下謙退以為國家政事多未習知臣寮欲言事者自有章䟽何必上殿今臣民章䟽舉集於前若非陛下勤加省覽則朝政闕失民間疾苦何由上聞國家政事無時而習知也其間亦有一事而衆人共言者臣亦重複簽出盖欲陛下知天下所共患衆情所同欲也夫為政在順民心民之所欲者行之所惡者去之則何患號令不行民心不附國家不安名譽不榮哉惟在陛下斷志而力行之耳取進止乞省覽農民封事劄子元豐八年九月三日上臣伏覩近降農民訴疾苦實封奏狀王嗇等一百五十道除所訴重􅃨外俱已簽帖進入竊惟四民之中惟農最苦農夫寒耕熱耘霑體塗足戴星而作戴星而息􅅙婦育􅅙治繭續麻紡緯縷縷而積之寸寸而成之其勤極矣而又水旱霜雹蝗􅈮間為之灾幸而収成則公私之債交争互奪穀未離場帛未下機已非已有矣農夫􅅙婦所食者糠籺而不足所衣者綈褐而不完直以世服田畝不知捨此之外更有可生之路故其子弟遊市井者食甘服美目覩盛麗則不復肯歸南畝矣至使世俗俳諧共以農為􅅓鄙誠可哀也又况聚斂之臣於租稅之外巧取百端以邀功賞青苗則强散重斂給陳納新免役則刻剥窮民収養浮食保甲則勞於非業之作保馬則困於無益之費可不念哉夫農蠺者天下衣食之原人之所仰以生也是以聖王重之臣不敢逺引前古竊聞太宗皇帝嘗遊金明池召田婦數十人於殿上賜席使坐問以民間疾苦田婦愚戇無所隱避賜帛遣之太宗興於側㣲民間事固無不知所以然者恐富貴而忘之也故每臨朝無一日不言及稼穡真宗皇帝乳母秦國夫人劉氏本農家也喜言農家之事真宗皇帝自㓜聞之故為開封尹以善政著聞及踐大位咸平景德之治為有宋隆平之極景德農田勅至今稱為精當昔周公相成王作無逸曰先知稼穡之艱難乃逸則知小人之依盖以一盂之飯一尺之帛莫不出於艱難人主既知之則不肯用之於無益散之於無功驕侈之心無自而生矣伏惟太皇太后陛下深居九重皇帝陛下富於春秋自非今者濬發德音大開言路使畎畝之民皆得上封事則此曹疾苦何由有萬分之一得達於天聽哉其文辭鄙俚語言叢雜皆身受實患直貢其誠不可忽也伏望太皇太后陛下與皇帝陛下同賜省覽庶以開廣聦明資益聖性於民間情偽靡不周知異日太平之業由此為始矣取進止與吕公著同舉程頥劄子元豐八年九月十五日上臣等竊見河南處士程頥力學好古安貧守節言必忠信動遵禮義年踰五十不求仕進真儒者之高蹈聖世之逸民伏望聖慈特加召命擢以不次足以矜式士類禆益風化取進止乞裁斷政事劄子元豐八年十月十七日上臣聞兩貴之不能相事兩賤之不能相使此乃物理自然人情之常也是以聖人立為君臣使人臣各獻其謀而人君裁决其是非若網在綱有條而不紊此國家所以治也若人君不加裁决使人臣各行其意則朝夕鬭訟弱不勝强寡不勝衆不則雷同詭隨尸位竊禄苟且偷安以度目前此國家所以衰也然人君於是非之間亦當三思精察昭然無疑然後决之自古興衰未有不由此塗出也夫人心不同各如其面雖以周公之聖召公之賢同輔成王猶有不恱况邪正忠佞各有所存者乎臣竊惟皇帝富於春秋太皇太后親臨萬幾事無大小皆委於執政垂拱仰成萬一羣臣有所見不同勢均力敵莫能相一者伏望陛下特留聖意審察是非若甲是而乙非當捨乙而從甲乙是而甲非當捨甲而從乙如此則羣臣莫敢不服善政日新矣不然陛下雖有求治之心事功無時而成也况書曰惟辟作福作威不可使用人賞罰之柄盡歸執政人主一不得而專也取進止議可劄子元豐八年十月二十四日上臣聞古人有言謀之在多斷之在獨陛下寛仁委政羣下或政有大疑議論難一儻陛下不决其是非則争辯紛紜無時而息事功何由可成臣謹案蔡邕獨斷叙漢制有疑事公卿百官㑹議若臺閣有正處而獨執異議者曰駁議其合於上意者文報曰某官某甲議可此所以各盡羣下之所見而人主亦不失操柄也今執政之臣雖相與竭力同寅協恭若萬一有議論必不可合者欲乞許令各具劄子奏聞望陛下精察其是非可否以聖意决之或於簾前宣諭或於禁中批出令依某人所奏若羣臣猶有固争執者則願陛下更加審察若前來處分果非則勿憚改為若灼然無疑則决行不移耳如此再思而行庶幾得盡衆心事亦少失矣取進止乞不貸强盗白劄子元豐八年八月上刑部奏鈔曹州勘到百姓趙倩吕德吕文於今年三月二十三日同打刼南華縣界頓榮家財物將鎗刺頓榮一鎗腮上血出打刼得財物被弓手捉獲醫人檢得頓榮元被吕文刺傷處有血是失物傷將刼到賘估定足錢陸貫玖拾玖文本州只為頓榮被刼刺傷時不曽申官檢定痕驗遂具案申奏大理寺㑹到進奏院今年三月六日赦七日到州准律勅合决重杖一頓處死刑部檢到例擬並特貸命决脊杖二十各刺面配廣南逺惡州軍牢城門下勘㑹近年以來諸州勘到劫賊但不曽殺人放火者並作情理可愍或刑名疑慮申奏朝廷率從寛貸竊詳逐人既為刼賊情理有何可愍赦後贓滿傷人刑名有何疑慮此皆逐州官吏避見失入罪名專務便文營已無去害疾惡之心况曹州素多盜賊係重法地分如趙倩等所犯如此皆得免死則是强盗不放火殺人者盡得免死竊恐盗賊轉加恣横良民無以自存殆非懲惡勸善之道其趙倩等欲乞並令本州依法處死仍乞立法自今後應天下州軍勘到强盗情理無可愍刑名無疑慮輒敢奏聞者並令刑部舉駁重行典憲更不得似日前用例破條乞不貸故鬭殺劄子元豐八年八月十四日上竊惟王者所以治天下惟在法令凡殺人者死自有刑法以來百世莫之或改若殺人者不死傷人者不刑雖堯舜不能以致治也近見刑部奏鈔泰寧軍勘到保正家人姜齊見本都代名大保長張存捽着百姓孫遇其孫遇捽着袁貴髻子張存道此人稱是東嶽急脚子胡亂打人不伏収領齊捽着孫遇􅉍互打三二十拳解擘放却袁貴齊與張存捽倒孫遇齊行拳踢打孫遇身死齊發心共張存捉縳袁貴虚做打死元相争人申解赴縣替得償命其袁貴到縣不肯虚招齊䝉枷項隔勘方具實招通又懐州勘到百姓魏簡與郭興争賭錢拽倒郭興家棚子郭興父郭昇拽着簡使頭撞簡簡為本人年老便道你共我不是抵對休扯着我待推揢郭昇圖放却簡用力去郭昇咽喉上揢一揢其人當下倒地身死又耀州勘到百姓張志松為再從弟張小六寃執稱呪罵堂兄弟男女偉志松乘酒嗔恨張小六因此行拳打張小六當時身死上件三人於條皆合處死本州並作情理可憫奏裁耀州仍稱張志松本無殺意刑部一切檢例擬特貸命决脊二十刺配斷所牢城竊詳孫遇不合詐稱東嶽急脚子胡亂打人雖是罪人然罪不至死其姜齊等既解臂放袁貴即合申送赴官依法施行其孫遇别更不曽拒捍及走兼巳就拘執豈可更捽倒毆撃直至於死又更誣執被苦人袁貴作殺人賊欲令替自已償命如此情理有何可憫其魏簡為郭昇年老不欲相打却用力去本人咽喉上一揢至死豈不更甚于歐打又張志松只為張小六寃執呪罵事理至輕遂歐本人致死並是鬭殺於情理皆無可憫凡人因忿相争迭相歐擊其意豈皆在於殺但一人於􅇳限内死則彼一人須當償命况此三人皆即時歐殺當死無疑止是逐州避見失入罪名妄作情理可憫或刑名疑慮奏裁刑部即引舊例一切貸命若因循不改為弊甚大所以然者從來律令勅式有該説不盡之事有司無以處决引例行之今鬭殺當死自有正條而刑部不問可貸與否承例盡免死决配作奏鈔施行是殺人者不死其鬭殺律條更無所用也於殺人者雖荷寛恩其被殺者何所告訴非所以禁制凶暴保安善良也欲乞今後應諸州所奏大辟罪人並委大理寺依法定斷如情理無可憫其刑名無疑慮即仰刑部退囘本州令依法施行如委實有可憫及疑慮即仰刑部於奏鈔後别用貼黄聲說情理如何可憫刑名如何疑慮今擬如何施行令門下省省審如所擬委得允當則用繳狀進入施行如有不當及用例破條即仰門下省駁奏乞行取勘庶使畫一之法不至隳壞凶暴之人有所畏憚其姜齊等縁係未立法以前今欲先次進入大辟貸配法草元豐八年十月二十日授刑部應開封府諸路州軍奏到大辟罪人稱是刑名疑慮及情理可憫者仰大理寺依法定斷并坐疑慮可憫條送刑部看詳如刑名實有疑慮情理實有可憫因依申奏取㫖若看詳得别無疑慮及可憫者即具鈔奏下本處依法施行不得一槩將舊例貸配破却律勅正條仍委門下中書尚書省㸃檢如有不當及用例破條奏乞取勘施行傳家集巻四十八欽定四庫全書傳家集巻四十九宋司馬光撰章奏三十二進孝經指解劄子元豐八年十二月二日上臣竊惟自古五帝三王未有不由學以成其聖德者所謂學者非誦章句習筆札作文辭也在於正心修身齊家治國明明德於天下也恭惟皇帝陛下肇承基緒雖年在㓜冲而執喪臨朝率禮弗越體貌尊嚴舉止安重顒顒卭卭有老成之德華夷瞻仰無不愛戴此乃聖性自然不聞亦式實天祐皇家宗廟社稷生民之盛福也然玉不琢不成器人不學不知道儻復資學問以成之則堯舜禹湯文武何逺之有伏見近降聖旨過冬至開講筵臣竊以聖人之德無以加於孝自天子至於庶人莫不始於事親終於立身揚名於後世誠為學所宜先也臣曏不自揆嘗撰古文孝經指解皇祐中獻於仁宗皇帝竊慮歳久遺失不存今則繕冩為一冊上進伏乞聖明少賜省覽取進止辭轉官劄子元豐八年十二月十二日上臣伏覩中書録黄奉聖旨神宗祔廟畢執政官依故事轉遷以臣為正議大夫者竊惟英宗皇帝親政之初以宰臣韓琦等於嘉祐之末有定䇿大功保佑聖躬濟於艱難故各特遷一官今陛下以神宗皇帝大漸之際宰臣蔡確等啓廸聖心建立儲貳傳授大寳各特遷一官固亦其宜臣當是時方閒居在西京凴几末命非所預聞豈得與確等同受褒賞且國家名位本以醻功報德不可但以祔廟禮畢檢舉故事虚有授受况臣於登極之初已䝉覃恩改官今曽未踰年安敢再叨殊渥縱臣貪冒不知愧恥天下之人其謂臣何所有授正議大夫吿身臣不敢祗受伏望聖慈特賜寢罷取進止辭轉官第二劄子元豐八年十二月上臣於今月十一日伏覩中書録黄䝉恩除正議大夫臣於十二日具劄子奏以蔡確等啓廸神宗皇帝建立儲貳傳授大寳宜遷一官臣閒居西京非所預聞所有正議大夫吿身臣不敢祗受自後未聞降出至十四日准閤門吿報令臣受上件告身臣竊惟富弼輔佐三朝名德老成當嘉祐之初亦是定策之臣但以不預顧命懇辭甚至如臣才德比於富弼無能為役當建儲顧命之際臣為庶僚在外初不預聞豈敢止因祔廟隨例遷官凡為政之要惟在賞功罰罪臣沗備執政無功受賞將何以裁抑他人所有新命伏望聖慈特賜寢罷取進止辭轉官第三劄子元豐八年十二月上臣伏奉詔書以臣辭免恩命所請宜不允者昔英宗皇帝入承大統宰臣韓琦等實有定䇿之功又踐阼之初聖躬違豫慈聖光獻皇太后權同聽政琦等盡忠竭力亦不為不至及英宗皇帝專制萬幾襃賞琦等各遷一官臣時為諫官猶上言以近歳官冗賞濫兩府大臣陛下即政之初宜懲革斯弊今自於朞年之間連併遷官則難以禁他人之幸進者恐宿衞將軍宗室外戚四方藩鎮内侍近臣皆有冀望至時陛下亦不能裁抑兩府亦不敢執奏當是時英宗皇帝雖不収還恩命而富弼亦有定策之功自以不預顧命力辭甚苦况臣既不預定策又不預顧命豈可來自冗散之地遽與輔臣同賞且臣昔日在人則言其不可受今日在已則受而不辭顧行復言能不自愧所有吿身臣不敢祗受伏望聖慈矜察特賜寢罷取進止辭轉官第四劄子元豐八年十二月上臣昨䝉恩除臣正議大夫臣三具劄子及簾前面陳至懇終未賜開允臣夙夜愧恐不能自已臣竊以為政之要惟在於賞功罰罪賞不當功則徼幸競進罰不當罪則善良憂恐亂之基也曏日神宗皇帝大漸之際臣屏居閭閻今乃與建儲受遺之臣一例遷官賞不當功何以過此陛下不知臣不肖使待罪執政執政當為陛下抑徼幸惜官職而身自冒賞何以表率他人臣非敢私飾小亷其志欲為國家慎重名器伏望聖慈矜察特賜寢罷新命所有吿身臣不敢祗受取進止辭轉官第五劄子元豐八年十二月上臣准閣門吿示以臣累上章辭免新命已降批荅不許所有吿身可吿示早令祗受者臣竊惟無功受賞士之所難䆒觀英宗皇帝神宗皇帝即政之初襃賞大臣皆以定策受遺之功非因祔廟禮畢臣既非定策又不受遺實難虚受至於政事日新皆陛下聖明衆賢協力在臣一人何能禆益而無名冒賞惟恐有玷清朝所有吿身臣不敢祗受伏乞早賜寢罷取進止請
