seq: 79
body:
  text: 府君墓誌銘熙寕五年作魏晉之間薛氏始自蜀徙河東有部曲數千家永嘉之亂保河汾以自固歴劉石苻氏莫能屈姚秦元魏以來始出仕為公侯卿相者比肩並起入唐尤盛號為甲族然率因遊宦去郷里惟府君之先至今留居河東唐衰薛氏中㣲曽祖考諱昉不仕祖考諱允恭贈諫議大夫考諱田樞宻直學士右諫議大夫贈太尉其行義功烈皆見於宋宣獻公所為太尉公之碑府君諱儀字式之太尉公之第二子始以父䕃為太廟齋郎又除守将作監主簿太尉公知益州奏府君監鳳翔府商稅後徙知河東府君年少河東士民皆郷里長老然素嚴憚府君不敢干以私府君御之亦不失恩義之中以父憂去官服除知鄠縣徙知安邑通判渭州州将武人不能謹廉州大吏郝正者把其隂事招權受賕莫敢詰府君至以正罪惡言於将請治之将内窘私以情告府君曰某止欲去惡吏耳必不使及君将亦知府君不欺即移疾以州事屬府君府君乃發正私出塞市馬收案伏法将不染於辭深徳府君且内慙自是悉委事於府君後将知府君賢亦委以事如前将既而某官張君亢除知渭州或謂府君曰君自到渭名雖州佐其實将也張君有材而尚氣到必不為君下彼不可以文法拘也君宜於事一無所與庶幾自免府君喟然歎曰吾推忠信正直之心以事人豈好犯上而專事邪今張君來吾猶是心也使張君賢必不我怨如其不賢吾獲罪亦命而已矣豈可因人而變其守哉及張君至處事有失府君力争如故必當理而後止僚吏皆為之懼張君初無言久之乃於廣座謂衆曰亢喜忠義與身俱生遇事輒發不能顧慮故數為小人所陷使為亢佐者皆如薛君亢復何患於是聞者皆服張君之賢而重府君之正是時元昊數寇邊覆軍殺将朝廷患之乃命范文正公為鄜延招討使以張君知鄜州為范公之副張公即具奏府君在渭州所以佐已之状乞移通判鄜州朝廷許之而府君母馮翊郡太君党氏春秋高多疾顧戀郷里不肯随諸子之官府君兄弟用太尉公恩得官河中者適皆罷去府君乃固辭鄜州願監河中鹽稅以便親既得請范公遽上奏曰朝廷從薛某之欲於其私固便然甚非張亢求與共事之意乞以薛某還亢仍為徙其兄若弟郷里一官以慰其心朝廷即以府君弟俅知河東縣府君鄜州府君不得已之官張君患州城大而處勢卑難以待敵欲遷就伏龜山計功數十萬時虜乗勝深入而州無役兵欲以戰士築之衆咸以為難府君獨以為可張君喜曰薛君謂之可事無不成矣役始興而張君病失音府君外備寇敵内董役事人不知張君之病也城成民至今賴之嵗餘徙知深州遭母憂服除知商州慶歴八年閏月庚戌終於州廨年五十一先是屬縣宰有建言商山産銅請置監鑄錢朝廷下其議轉運使有是之者府君上言朝廷前置阜民監於州境洪崖冶鑄鐵錢未數年鐵已竭其監當廢况又益置銅錢監銅産尤薄恐徒勞費無益請以所得銅於舊監鑄錢銅竭而止章交上久不决㑹府君沒宰之說遂行縣官之費甚廣而銅尋竭如府君言宰坐抵罪府君居家孝友自幼能屬文始習律賦語意即高竒驚人然不肯從進士舉嘗著蓼蟲賦以刺世之嗜外物而忘其苦者又以為事之當慎者莫若言動交進名乃著五慎文以自儆觀是二文足以知其志趣矣初娶唐氏天章閣待制肅之女生一女適殿中丞趙士寧又娶劉氏左諌議大夫綜之孫又娶李氏直集賢院建中之孫又娶陳氏司農卿宗元之女生二男長曰昌朝繇太子中允監察御史裏行坐正論不阿黜為大理寺丞次曰昌期早卒二女長適祕書省校書郎張煦次早卒昌期将以熙寧五年正月某甲子𦵏府君於本縣趙行村請直龍圗閣趙君卨状其治行以授光使為之誌昔者先子嘗獲知於太尉公從兄里佐府君於鄜州幕光亦嘗拜府君於兄舍以是頗知府君之為人府君容貌溫恭而内守堅正不可奪移語言無機巧蔽匿而明察物情其志常在利民而深疾姦惡故所至上官信之僚友親之下民愛之今也幸使光誌其墓光既取趙君之状詮次之又敢私附其所知云銘曰迕意宜踈而或以之親阿意宜合而或以之離盖至誠可以待無窮而辭色不過欺一時嗚呼允如薛君以忠信正直為心夫又何施而不宜駕部貟外郎司馬府君墓誌銘熙寧九年作兄諱某字周卿曽大父諱某大父諱某皆不仕父諱某以通毛詩屢應州舉名升禮部及兄登朝累贈衛尉卿母某氏封某縣太君司馬氏累世聚居食口常不減數十衛尉府君為之長兄年十六衛尉即以家事委之衣食均贍宗族無間言衛尉得以優游自適十餘年而終兄用從父太尉府君䕃補郊社齋郎太尉以家事非兄不能辦未聴從宦後數年乃調逹州通川尉州有宣漢鹽井距州千餘里唯一谿僅通小舟可以往來守井吏恃其險逺大為姦利州遣兄往按之因為之區處利害凡再往返遂革其弊考滿除華州司理參軍州将驕貴數用私欲橈公法兄執不聴有幕僚性剛戾自将以下皆惡之共文致其罪俾兄鞫之幕僚復上書訟州官皆獲罪唯兄不染於辭人以是益知其公平有驍騎十餘卒犯罪謀亡去監押捕獲之誣云共圗不軌欲殺之以求功賞州官信之謂兄必考掠取服兄不從據實鞫之皆止杖罪餘囚負寃得直者甚衆既而􅇜繼母郭氏憂去官直寃者或炷香於頂臂以送之服除授解州聞喜尉用薦者遷大理寺丞知河中府猗氏縣徙閬州新井縣通判鄧均二州先是房州竹山有金谿出金甚多山谷窮僻人跡罕至豪族專其利監司欲命官置場市之皆憚其險辭不行時兄年已踰六十奮曰利其禄而避其勞可乎遂往躋攀崖巘為之經畫條目使公私俱利仍每月一按行凡嵗餘乃還均州秩滿徙知梁山軍累官至駕部貟外郎年甫七十體力尚壮即求致仕詔補子廣郊社齋郎廣為虢州盧氏主簿迎兄之官以熙寧八年十二月戊子朔暴得疾已丑終於官舍年七十有三兄為人沈厚寛裕喜慍不形於外少時家貧有衣一笥夜遺火比家人覺狼狽救之笥衣已盡兄獨卧不起家人尤之曰燒衣蕩盡何心尚安卧耶兄曰衣已燒矣起視何益轉枕復寝人皆服其度量子孫僕役有過徐訓諭之不輕罵辱然當官公直能知小民情偽吏不敢以絲毫欺也雖練習律令而不為峭刻斷獄必求厭人心摧抑彊猾扶衛愚弱所治職事皆有方略或素號繁劇者兄處之嘗有餘暇氣色不動而衆務修舉廷中永晝寂無人聲其下皆畏而愛之久猶見思從仕三十餘年未嘗有過然性恬静不自矜譽故人知之者亦鮮無所超越循常調終身兄亦不憾也其奉養儉素自為布衣至二千石飲啜服用未嘗少異與郷人居和易簡静故沒之日聞者無不歎惜先娶紐氏早終再娶張氏解州助敎震之女柔静慈良宜於族姻封清河縣君治平四年終於鄧州年五十八子男四人曰齊曰庭曰廣曰房庭虢州虢略尉女四人長適解人樊景讓次適陕人張安仁次二人未嫁皆早夭齊等以熙寧九年二月壬寅奉兄及嫂之喪𦵏於夏川郷先茔之西南光以期日之廹不暇請於時之賢士大夫自為之銘曰廓然有容頽然無争所蒞之政不煩而成去久而人益思無求而人莫知年至歸休始終無虧贈都官郎中司馬君墓誌銘嘉祐六年作君諱某其先出自晉安平獻王自周隋之前家涑水之上至唐仕宦陵夷降在畎畆曽祖諱林祖諱政父諱炳累世同㸑食口甚衆父兄以君孝謹自㓜以家事委之君晝夜服勤不遺餘力專以稼穡畜牧致饒給不事竒衺末業所獲悉以奉六親有餘則及鄉人身無私焉年三十二以某年月日終某年月日𦵏於涑水南原先待制府君常歎曰自吾兄之亡而家始貧使天下之民皆若吾兄之為雖古至治之世何以尚諸惜其無位而才不大施也夫人李氏同里人年二十八而寡父母欲奪其志夫家尊章亦遣焉夫人自誓不許惡衣蔬食躬執勤苦敎畜二子詠里詠不幸早世里登進士第累遷尚書都官郎中歴典數州贈君官至尚書都官郎中夫人封永夀縣太君夫人為人孝慈勤儉中外宗族慕仰其徳一無間言子為二千石極其榮養年八十二以某年月日終於京師某月日祔於君之墓光不及事君而事夫人久敢書聞見之實而繫之以銘銘曰士不得位善無所施勤儉于躬家道以肥宗族是賴郷黨是師夀之少多命不可移有配有子後無棄基淑慝之效昭然不欺蘇騏驥墓碣銘為器之作蘇氏之先出自重黎忿生為周武王司寇封於溫世為卿士或謂之溫子春秋時蘇子為狄所滅子孫以邑為氏歴世久逺散之四方在洛陽者秦厲代以口辨顯戰國世在杜陵者建為漢名将子武使匈奴中十九年不屈節在武功者綽仕宇文周以明法令為某官子威隋文帝佐命功臣至唐瓌父子為賢相此其章章尤著者也周衰溫為晉邑漢屬河内郡隋以河内為懐州維修武之族不棄其故土留懐州不去公其後焉公諱某字某曽大父某大父某皆不仕父某贈左司衛率公㓜慷慨有逺志自力讀書不治家事宗族争笑且怒之曰汝世農家勤治耕桑以豐衣食汝忽棄業為書生窮餒無日矣公曽不顧為學益堅早䘮二親哀毁過禮鄉曲稱之弱冠舉三傳科景徳中契丹南侵河北盗賊蠭起公於是盡散家財糾合郷曲子弟結以信義扞禦群寇修武由是獲全大将軍某北征公踵軍門上謁延入與語兵事大恱即奏偕行至中山㑹契丹圍城甚急用公之䇿卒拒却之於是天子曰契丹犯塞河北士子躬被甲胄扞敵有功今天下貢舉巳畢朕憐夫北方賢士大夫不得以時充貢其皆召試賜第公由是解褐補符離尉縣多寇盗吏卒單弱公奨訓率厲擒馘七十餘人闔境清肅改河清主簿考滿吏民羣詣轉運使所請留詔聴更留成資而去遷遂州録事參軍本道論薦召對擢為大理寺丞知大名縣事尋除通判州事入朝遷太子中舍國家㳂前世故事分文武百官為二塗其遷次任使皆不相參涉有願相移易者聴之以公素善武事加習邊務遂改供備庫副使知威勝軍事繼興嵐莫石鳳蘷五州皆著聲績官歴東染院洛苑二副使其在蘷州兼䕫梓兩路兵馬都監提舉諸州廵檢兵甲賊盗事久之上表乞朝因言邊防民政諸利害稱旨遷右騏驥副使同提㸃湖南兩浙刑獄公事年七十四以慶歴二年十月十三日終於長沙官舍公始雖以學術為文吏而性好勇有智略晚年夏寇苦邊諸将多敗北無功公聞之歎曰吾以布衣起家至方伯承兩朝恩渥不可勝紀家近趙魏粗習兵略今狂虜驕慢侵擾疆場而吾老病不得荷戈前驅以報萬一非命也夫然卒不得盡其志嗚呼哀哉夫人張氏先公即世子四人師古果州團練判官師顔衛州司法參軍夢臣獲嘉縣主簿季子師說及孫孝先曾孫叔元皆三班借職餘孫若干人㓜未官公之在荆湖也夢臣為三班奉職以公高年多疾求告省侍朝廷以武吏求省侍無故事不許乞改文職歸省方許之行及宛葉間聞䘮因號泣晝夜奔赴凡七日行千三百里近世宦逺方而沒者子孫多焚其柩以燼歸𦵏相習為常無譏誚者夢臣獨奮曰為人子孫忍行此豈人心也哉自長沙數千里奉柩以歸嗚呼其信知義而斷不與流俗者夫古人稱善人者其身不耀必在子孫豈信然耶某年月日𦵏於某所先府君之兆夫人張氏祔光郷邑於公近又久承公之知故其於公之始終治行也於佗人為悉其諸子以碣文為請光何敢辭謹銘曰銘闕傳家集巻七十七欽定四庫全書傳家集巻七十八宋司馬光撰誌三縉雲縣尉張君墓誌銘故翰林侍讀學士張公有子曰某前公若干年卒殯楚州後若干年與公偕𦵏襄城時皇祐五年閏月甲申也其弟大理寺丞光以治行來求銘光獲事侍讀公為日久又與君之兄弟遊今也不敢以愚陋辭而不為姑譔次其所聞納諸壙云君字仲倩其世家郷黨見於侍讀公之碑君性嗜學年十五志節已皦皦出人有從母嫠居将從其女於保徳軍子㓜不能自致君奮曰人母子單弱如此於以涉逺我獨何心坐視之邪即白父母請送父母疑其尚少然聞其言甚恱即遣之君冒盛寒往返數千里曾不為勞人皆歎其仁而有立以䕃補太廟齋郎及長調縉雲尉治有聲迹縣有滛祠曰五通人嚴事之嵗旱君徧禱群祀不及五通吏民以為請君不得已强往禱且卜之巫曰不吉必無雨比歸雨大至君笑曰果然雨不雨非妖鬼事也而敢屢為變怪以驚愚民是不可不除即部吏卒焚滅其祠捽土偶人投江中嵗亦大熟官滿歸道病或請留傳舍俟愈而行君曰吾官逺方不獲侍親之左右四年於此矣今幸歸至舍見吾親而死吾目瞑矣又何可留趣舟而前及楚州卒年二十八娶袁氏故諌議大夫煒之孫生二男絪試将作監主簿繼太常寺太祝二女其㓜者早夭初侍讀公有五子光知其三人焉而不及識君三人者皆甚才然猶自謂不如也侍讀公沒兄弟寓居汝潁間食口衆無田宅以自給咸泣曰縉雲在吾屬豈憂此乎言其知力足賴而不遺其親也嗚呼使顯於朝而老所施設豈若是而已哉銘曰苑彼嘉禾煒煒其華實而未碩孰披之柯人之明果胡夀不遐思而悲者豈伊其家大理寺丞龎之道墓誌銘嘉祐八年作龐之道名元魯故相國頴公之元子妣曰嘉興縣君邊氏其鄉里世系見於頴公之誌天聖中先君與頴公皆為群牧判官居相近光朝夕與之道遊兄事之之道時尚㓜性明頴於文辭不待力學而自能讀書初如不措意已盡得其精要前軰見之皆驚歎光年不相逺自視如土瓦之望珠玉頴公為廣南東路轉運使奏之道試祕書省校書郎及為知雜御史又奏守将作監主簿景祐五年光與之道同登進士第之道簽書懐州判官事未幾徙知河南縣事縣多豪貴家素號難治之道至繩案無所避豪貴為之斂手徙簽書河中府判官事後數年光過河南問於野人曰龐君為治何如曰明而有斷又問今宰曰不及龐君逺矣乃知野人最不可欺而論議甚公也頴公為鄜延經略安撫使奏之道書機宜文字時方用兵文書填委或中宵不得寐頴公入為樞宻副使欲奏其勞為之求升資之道辭曰将吏有功者願大人悉奏之元魯不足言也頴公喜而從之久之以大理寺丞監國子監書庫慶歴七年五月戊寅以疾終年三十二殯於薦嚴佛舍之道事繼母劉夫人撫畜諸弟始終無間言及沒哭之皆哀不自勝終頴公之世親友不敢語及之道語之頴公未嘗不悲慟始光知之道敏於為學及過河南又得其為政焉其沒也益知之道孝友之行深矣先娶孫氏故都官貟外郎道之女又娶張氏今吏部侍郎致仕存之女一女早卒遂無子嘉祐八年六月壬申弟先英遷之道之柩𦵏於雍丘頴公之墓側袝以孫氏光為之銘曰學施於治孝友兼美官不登朝沒纔壮齒如光何人榮祿及此噫才固不足言直命而已矣右班殿直傅君墓誌銘皇祐五年作熙寧二年春傅欽之遺光書曰昔我王考材氣過人宦不遂以沒堯俞幼鞠於王妣以至成人恩隐殊厚堯俞或以事夜艾未寝王妣常危坐待之及仕而之四方王妣不見再逾月則憂念氣濇而成癰逮王妣之亡竭堯俞之泣不足以償癰之血也今将以某月某日舉吾王考妣之柩𦵏於濟源吾嘗與子同在諫省子幸而知我必為我銘其墓子苟自謂不能是愛其少頃之勤而使我抱終已之恨非仁人之為也光讀之愧且懼復書曰子以義責光光何敢辭然門内之美光不得聞也子為光敘其事以來光謹條次之則可矣有間欽之以其状來曰君諱某字寶臣其先大名内黄人世為富家曽祖考諱思進始讀書為儒祖考諱凝贈虞部貟外郎考諱世隆以春秋三傳登科官至駕部貟外郎知卭州事始家於鄆君少通尚書屢舉不中第用親䕃補三班借職累遷至右班殿直初監澶州酒稅歴齊州離濟賽酒稅廬州廵檢以事去官後監趙州倉知定州新樂縣復以事去官已而監博州酒稅以疾罷歸明道元年十月十日終於家夀六十一君為人忼慨方嚴家之子弟雖甚愛之不命坐不敢坐其當官明敏果斷在新樂有西山采木卒二百人謀刼其縣大呼自南門入君率左右操白挺逆之至則叱使坐卒不意君遽出皆愕不敢動君因罵之曰餓兵欲奚為捽其為魁者數人杖之各數十而縱之皆抑首去不敢出聲然不能與世浮沉平視貴要若無人故所至齟齬且老益窮因發狂疾棄官歸卧一嵗所忽起召家人與訣語言如平生人乃疑其非狂也故相國王沂公為諸生家居未與人接君即以公輔器之已而果然人不知其何用知之也夫人霍氏國子博士致仕若拙之孫篤於孝慈其父亡夫人未之知獨視雲烟草木皆慘悽變色泣下不能自止逾月而訃至後君二十二年年八十一而終男某仕至山南東道節度推官知磁州昭徳縣事贈工部郎中二女其長者蚤世㓜適楊氏孫七人長曰堯俞字欽之今為兵部貟外郎次舜俞郊社齋郎次君俞未仕餘皆早世欽之為諌官處大議正直無所顧避朝廷不能用其言除知雜御史欽之固辭不肯拜必求得罪以去知和州聲振天下嗚呼得非承其祖之風烈邪欽之以夫人嘗至濟源愛其土風遂𦵏焉銘曰氣直志剛難進易傷善抑不揚其後必昌皆理之常府州判官杜君墓誌銘嘉祐二年作嘉祐二年秋光在京師進士杜知臣涕泣來言曰大人昔以進士得見於先公又與子遊􅇰久今不幸而沒子為我銘其墓光既吊因辭以不文不敢為知臣固請曰佗人知臣所不敢請也故惟子之歸光廼曰然則願聞子先君世系治行之詳知臣退以其状來曰君諱陟字從聖其先自成都徙長江曽大父禮大父鍔皆不仕父昭文遂州長史君少好古學無所不闚著化坊三十一篇言王者以敎化坊民之道慶歴初天子詔諸州皆立學擇其士之賢有行者為之師州人共推上君君屢舉進士有司失之卒以三禮釋褐選􅈎道尉考滿遷府州軍事判官力於吏治轉運使提㸃刑獄交章薦之㑹屬官有以姦贓敗者怨恨反誣訟君坐罷官去君詣闕欲自理不果遇疾以八月己已終於里舍年五十有七娶譚氏生三子男知臣女長適卞宗建㓜適姚申皆舉進士嗚呼杜君觀其所學與所為書其志豈欲如是而止哉卒無遇以窮斯可哀矣知臣負其䘮歸以其年月日𦵏某地銘曰學之也勤守之也専仕進迍邅又不永年嗚呼孰知其然必歸之天贈太常博士吳君墓誌銘嘉祐五年作君之先世家金鄉曽大父諱賁不仕大父諱豫贈太常丞始𦵏洛陽金谷郷之尹里父諱蒨太平興國中進士高第以公直材敏立名朝廷數忤權貴由是不得居中連典大州官至侍御史亦𦵏尹里君諱元亨字子正用御史遺奏補太廟齋郎遷許州司士參軍選授永康尉歴河中府法曹參軍馮翊令馮翊華隂以漆沮為境中間洲上有美田民相與争之五十餘年吏不能决君檄華隂令㑹境上盡案兩郷之籍徧履其田執度以度之皆得其實自是民不敢復争時人稱之君為人謹㢘専以誠長者處官不能飾智巧以媚上故官久不遂官滿集吏部選除鄰水令還未至家道疾抵知洛陽縣李宋卿延之縣舍以天聖九年八月某日終年四十一宋卿主辦其䘮殯於水安佛室夫人聶氏祕閣校理震之女後君五年長男顥先夫人二年皆不祿獨少男幾復年未冠及幼女一人相與居家無一金之産幾復於孤貧中能自刻意為學取進士第今為太常博士知蓬州事累贈君官至太常博士夫人封仙源縣太君嫁其妹於北陽令李鵬嘉祐五年秋蓬州将之官泣謂光曰幾復奉先君夫人之遺體常恐不克續承祭祀今幸有祿秩室家苟完矣念先君先夫人之久未𦵏痛切不少忘於心况又逺宦於蜀忍置而去乎将以八月某日𦵏於梁縣之新豐鄉西成里子與我皆聶氏之甥也先君治行子皆知之其為我譔銘光曰懼不能堪子之命敢不諾銘曰御史之賢顯大於世及君恂恂清徳不墜迨君之終家旤相繼㣲蓬州之立吳氏幾廢嗚呼以君之慈良而沈抑不遂宜其有嗣進士吳君墓誌銘君諱顥字某其先金鄉人曽祖某贈太常丞祖某侍御史父某鄰水縣令贈太常博士鄰水府君娶於祕閣校理聶君某於某為從母鄰水府君之沒也先妣在鄭君衰絰來入門哭且拜問故又哭先妣命與光處於是時君年尚未冠為人長大有容觀論議慷慨讀書屬文材敏過人為進士業已完美先妣歎曰吾妹不幸早䘮其良人今有是子也吾妹猶有望間二嵗君以疾卒於蒲阪年二十一先妣聞之哭曰吾妹何負于天使至此極也已而弟幾復負其䘮殯於汝州佛舍後二十六年幾復為太常博士乃舉其䘮𦵏于梁縣從鄰水府君之兆時某年月日也銘曰特苖之秀未實而朽繫時之逢無有美醜骨兮有歸祭兮有依下從先人夫又奚悲清逸處士魏君墓誌銘嘉祐八年作君諱閑字雲夫世家於陕之東郊父諱野真宗皇帝時有大名累召終不能起贈著作郎君少喜為詩學鼔琴不樂仕進一遵著作君之志皇祐二年仁宗皇帝祀明堂詔天下求遺逸草萊年耆徳茂者知府直史館李公昭遘薦君再世有高節上嘉之賜號清逸處士嘉祐八年八月癸未終於家年八十四君自始生至沒當國家隆盛偃兵無事之時家有舊田廬君謹守而治之朝廷以著作君之賢復其子孫無有所與以故沛然自足無衣食之累性不嗜酒謹潔守法度然與人和浮沈閭里不自摽揭以故其生也人樂與之遊其沒也無謗言府縣之官或時延禮亦與之往來然未嘗有毫髪之私以干之其政事失得未嘗納于耳出于口也以故皆愛重之無厭倦少好養生大要用沖澹自守不以一物累其心以故視聴步趨能老而不衰嗚呼今之名處士者多矣或力為竒譎以盗聲名萬一輩幸欲欺愚俗取美官或交游有位依其名勢乾沒射利以侵漁細民若是者雖不仕又足賢乎然則能保其福樂而免於過咎有如君者凡幾人耶君三娶曰臧氏曰趙氏曰皇甫氏子男一人曰樵女三人適進士梁軫張震左侍禁張宏孫男二人曰潜曰澤先僕射與著作君相愛如昆弟光拜君於髫齓之年今也其孤将以某年月日𦵏君於某地來求銘光何敢辭銘曰天長不息兮地大無疆人寓其中兮細於毫芒奪攘紛糾兮非愚則狂惟君之生兮遭世寧昌依承先徳兮曄然有光笥有餘衣兮廪有餘糧養生以理兮行已有方居不煩人兮遊不出郷逍遥自適兮既夀而康視彼公侯兮金朱煌煌憂勞沒齒兮或罹咎殃為得孰多兮為謀孰長鄆州處士王君墓誌銘嘉祐六年作至和中光從故丞相龎公鎮鄆州公命光典州學學生王大臨通經有行誼光特愛重之後十五年王生來見光於京師曰大臨将以今年某月某日𦵏其親於須城縣長山之麓子為我銘其墓光辭以拙於文生曰大臨逺來非有佗故唯銘之求朝士大夫以百數大臨無所諂唯子之歸子何得拒之光愧其言不敢辭因曰然則願聞先子之行生乃出其邑人試祕書省校書郎梁君燾之状以授光曰君諱惟徳字輔之始為童子父行戍於蜀君侍大父母撫諸弟以孝友聞其治家如成人大父母終君親負土成墳終䘮不嘗酒肉父自蜀歸家益富父好散施君竭力以助之有所與必稱父命以致之嘗舉三禮一試於禮部不中格喟然歸不復就舉專以養親治經為事著禮說二十巻性溫厚喜𨗳人為善鄉里謂之王君子有闘者君徐以義理辨告皆恱曰君子幸敎我我何敢違即解去不復詣吏年若干病亟歎曰死生有命恨不得終為子之道以天聖五年十一月辛亥終再娶皆楊氏其後夫人贈職方貟外郎旦之女也能成君之志順適舅姑使之終身無憂慍之容及老寝疾每祭祀猶强起執事年若干以嘉祐五年十二月已巳終子男五人長曰大順今為剡縣主簿次未名次大同皆早世次宗道次大臨女二人長適大學館學究劉應祥次亦早世君既沒家甚貧大臨以善講解為諸生師月受俸於州學錢二千積而不用滿三十萬乃舉兩世之柩而𦵏之光不及見君知其為人以其子之賢與梁君之言於是乎銘銘曰孝乎親友于其弟家有餘施及鄉里人恱其敎稱為君子嗚呼是亦為政奚必仕玉城縣君楊氏墓誌銘夫人姓楊氏故尚書工部郎中直史館韓公之配也公之世系事業龍圖閣直學士郭公誌之矣夫人之先在唐為盛族居靖恭坊五代之亂衣冠之緒零落殆盡唯靖恭楊氏徙家于吴世有顯人迄今不絶考諱蛻仕至尚書司封郎中精於吏治所至著聲迹始韓公娶夫人之姊生男鑑鐸及二女不幸早世公曰楊氏名族吾既謀於宗而卜於廟矣不可易也廼復請昏於夫人夫人年若干歸韓氏生男鎮鉞初封真定後更封玉城縣君為人慈和淵静不喜聲味自少及長家人伺其動靜語黙皆有常度未嘗移也其撫視六子衣服飲食無絲毫簿厚六子亦相與親愛如一雖中外族婣莫知其為異母也年三十九而䘮韓公三年不茹葷自是閉閤深居日誦佛書不復有自虞樂之意年五十以至和元年三月乙亥終其五月壬申祔于公之墓時鑑為某官鎮為某官鐸為某官鉞已前卒鐸與光遊素久因状夫人之行命光為之銘光不得辭曰允矣夫人徳則均一而行有常邪承祖之休宜于夫家而夀不将邪福祿當有餘而更不足子孫其昌邪彭城縣君劉氏墓誌銘嘉祐五年作嘉祐五年某月日太常博士知蓬州事吳君幾復祔其祖妣彭城縣君劉氏于祖考御史府君之墓始夫人之沒蓬州生二年矣比冠而父母兄皆即世家至貧漂泊汝洛間嘗記幼時聞其兄言夫人之殯在京師廣濟佛寺已而舉進士及第乃求所以廣濟佛寺者凡有二焉在城之東西往問夫人之殯皆莫能知蓬州刻志求之積年不置一旦至西寺有僧老矣忽來訊曰君非鄰水令吳君之子邪曰然僧曰去三十載之前吳君殯其母夫人于是某為童子手親塗之某亦吳姓也故能識之因指視其處蓬州未之敢信周視其塗圮剝且盡所餘如掌而鄰水府君之題識存焉乃奠而哭之又數年然後得合𦵏於洛陽之金谷鄉自始沒至𦵏四十二年矣噫㣲是孫也則夫人之柩其復得邪露殯積久而題識獨存豈非鄰水府君自悼其不幸未𦵏而天隂相之邪乃知誠孝可以動鬼神信矣御史府君諱某鄰水府君諱某夫人平生行事不可復見其先單父人父為尚書郎云銘曰夫人既終吳氏中㣲四十餘年乃得其歸孝孫有立神實告之程夫人墓誌銘治平三年作治平三年夏蘇府君終於京師光往弔焉二孤軾轍哭且言曰某将奉先君之柩終𦵏於蜀蜀人之祔也同壟而異壙日者吾母夫人之𦵏也未之銘子為我銘其壙光固辭不獲命因曰夫人之徳非異人所能知也願聞其略二孤奉其事状拜以授光光拜受退而次之曰夫人姓程氏眉山人大理寺丞文應之女生十八年歸蘇氏程氏富而蘇氏極貧夫人入門執婦職孝恭勤儉族人環視之無絲毫鞅鞅驕倨可譏訶状由是共賢之或謂夫人曰若父母非乏於財以父母之愛若求之宜無不應者何為甘此􅂼糲獨不可以一發言乎夫人曰然以我求於父母誠無不可萬一使人謂吾夫為求於人以活其妻子者将若之何卒不求時祖姑猶在堂老而性嚴家人過堂下履錯然有聲已畏獲􅓧獨夫人能順適其志祖姑見之必說府君年二十七猶不學一旦慨然謂夫人曰吾自視今猶可學然家待我而生學且廢生奈何夫人曰我欲言之久矣惡使子為因我而學者子苟有志以生累我可也即罄出服玩鬻之以治生不數年遂為富家府君由是得専志於學卒成大儒夫人喜讀書皆識其大義軾轍之幼也夫人親敎之常戒曰汝讀書勿効曹耦止欲以書自名而已每稱引古人名節以勵之曰汝果能死直道吾無戚焉已而二子同年登進士第又同登賢良方正科目宋興以來唯故資政殿大學士吳公育與軾制䇿入三等轍所對語尤切直驚人繇夫人素勗之也若夫人者可謂知愛其子矣始夫人視其家財既有餘廼歎曰是豈所謂福哉不已且愚吾子孫因求族姻之孤貧者悉為嫁娶振業之郷人有急者時亦賙焉比其沒家無一年之儲夫人以嘉祐二年四月癸丑終於鄉里其年十一月庚子𦵏某地年四十八軾登朝追封武陽縣君凡生六子長男景山及三女皆早夭幼女有夫人之風能屬文年十九既嫁而卒嗚呼婦人柔順足以睦其族智能足以齊其家斯已賢矣况如夫人能開發輔𨗳成就其夫子使皆以文學顯重於天下非識慮高絶能如是乎古之人稱有國有家者其興衰無不本於閨門今於夫人益見古人之可信也銘曰貧不以汚其夫之名富不以為其子之累知力學可以顯其門而直道可以榮於世勉夫敎子底於光大夀不充徳福宜施於後嗣敘清河郡君元豐六年作清河郡君張氏冀州信都人禮部尚書致仕存之女端明殿學士司馬光之妻也年十六適司馬氏夫登朝封清河縣君及為學士改郡君年六十元豐五年正月壬子晦終於洛陽三月辛巳晦𦵏涑水先塋君性和柔敦實自始嫁至於瞑目未嘗見其有忿懥之色矯妄之言人雖以非意侵加黙而受之終不與之辨曲直已亦不復貯於懐也上承舅姑旁接娣姒下撫甥姪莫不恱而安之御婢妾寛而知其勞苦無妬忌心嘗夜濯足婢誤以湯沃之爛其一足君批其頰數下而止病足月餘方愈故其沒也自族􅊚至於厮養無親踈大小哭之極哀久而不衰咸出於惻怛非外飾也内外無一人私議其短者兹豈聲音笑貌之所能致邪平居謹於財不妄用自奉甚約及余用之以賙親戚之急亦未嘗吝也始余為學官笥中衣無幾一夕盗入室盡巻以去時天向寒衾無纊絮客至無衫以見之余不能不歎嗟君笑曰但願身安財須復有余賢其言為之釋然近世墓皆有誌刻石摹其文以遺人余以為婦人無外事有善不出閨門故止敘其事存於家庶使後世為婦者有所矜式耳華隂侯仲連墓誌銘熙寧二年作華隂侯仲連字齊賢魏恭憲王元佐之曽孫郇國公允成之孫遂昭裕公宗顔之長子母曰太原郡君郭氏初除右内率府副率歴率府率右千牛衛将軍右監門衛大将軍英宗即位遷右武衛大将軍撫州刺史今上即位遷右羽林軍大将軍辰州團練使侯㓜不好弄長而樂善學尤精於漢書昭裕公素好學喜為詩藏書萬巻侯能嗣承其志目其詩曰貽慶集熙寧二年五月戊子以疾終享年三十有六上為之輟視朝一日追贈華州觀察使封華隂侯夫人長安縣君劉氏男二人長曰士轡蚤卒㓜曰士頖右内率府率女六人四早卒二未嫁以某年十一月癸酉𦵏永安縣銘曰昭裕愛子以詩書敎名而藏之志在則傚能守富貴為諸侯孝右屯衛大将軍令邦墓誌銘熙寧二年作右千牛衛大将軍令邦字安國冀康孝王惟吉之曾孫丹陽僖穆王守節之孫右龍武軍大将軍隴州防禦使世符之子也母曰南陽縣君張氏将軍生五年除太子内率府副率英宗即位遷右監門率府率今上踐阼遷右千牛衛将軍熙寧二年五月甲午遇疾卒年十九贈右屯衛大将軍治平初英宗詔宗子無㓜長皆就學差其年為大中小三品各置師以敎之将軍時年十二從父南康修孝王愛其才性命為小學録以表率群兒及年十五以新制試孝經論語於大宗正司二宗正以其誦習􅇰精屢稱歎之将軍起謝不敏拜於牀下衆益美其警悟而不伐遂升中學授左氏春秋将軍事親至孝有疾至焚香於臂以禱請然親有過未嘗不諌争其所為得禮義類皆如此不幸早世識之者無親疎共惜之二子男未名而卒女尚幼是嵗十一月癸酉𦵏於永安縣銘曰學則敏行則孝志業修宜逺到命不融衆所悼仁和縣君潘氏墓誌銘熙寧二年作皇從姪右武衛大将軍蓬州刺史令超之夫人曰仁和縣君潘氏故鄭王美之曽孫平州刺史惟熙之孫閤門祇候仁矩之子生十六年以選歸於蓬州使君封仁和縣君熙寧二年八月已未疾以卒享年二十有四生五子男子翺右内率府副率次二男未名二女早夭銘曰太勲之門克生令孫歸於帝族禀命天昏款文幽石以識塋園皇從姪右屯衛大将軍士虬墓記熙寧二年作右千牛衛将軍士虬右武衛大将軍果州團練使齊安郡公仲郃之子贈安化軍節度觀察留後高宻郡公宗望之孫贈安逺軍節度使同中書門下平章事宻國公允言之曽孫也母曰安康縣君李氏将軍生五嵗以例賜名除右内率府副率明年遷右監門率府率今上踐阼遷右千牛衛将軍㓜而秀慧不嬉戯異於常兒七嵗始就學授孝經孜孜不捨晝夜敎授劉仲章老儒生嘗於廣坐問之曰将軍誦孝經果有何得對曰事親孝故忠可移於君居家理故治可移於官此其所得也仲章驚歎曰異日成長必為徳器數年愈自修立有成人之風親親尊尊動皆應法問安視膳朝夕無倦不幸遇疾以熙寧二年五月丙戌卒年十二宗室共嗟惜之朝廷贈右屯衛大将軍其年十一月癸酉𦵏永安縣謹記傳家集巻七十八欽定四庫全書傳家集巻七十九宋司馬光撰碑河東節度使守太尉開府儀同三司潞國公文公先廟碑嘉祐二年作先王之制自天子至於官師皆有廟君子将營宫室宗廟為先居室為後及秦非笑聖人蕩滅典禮務尊君卑臣於是天子之外無敢營宗廟者漢世公卿貴人多建祠堂於墓所在都邑則鮮焉魏晉以降漸復廟制其後遂著於令以官品為所祀世數之差唐侍中王珪不立私廟為執法所糾太宗命有司為之營構以恥之是以唐世貴臣皆有廟及五代蕩析士民求生有所未遑禮頽敎侈廟制遂絶宋興夷亂蘇疲久而未講仁宗皇帝閔群臣貴極公相而祖禰食於寝儕於庶人慶歴元年因郊祀赦聴文武官依舊式立家廟令雖下有司莫之舉士大夫亦以耳目久不際往往不知廟之可設於家也皇祐二年天子宗祀禮成平章事宋公奏言有司不能推述先典明諭上仁因循顧望遂踰十載緣偷襲弊殊可嗟憫臣嘗因進對屢聞聖言謂諸臣専殖第産不立私廟睿心至意形於歎息盖由古今異宜封爵殊制因疑成憚遂格詔書請下禮官儒臣議定制度於是翰林承㫖而下共奏請自平章事以上立四廟東宫少保以上二廟其餘器服儀範俟更參酌以聞是歳十二月詔如其請既而在職者違慢相仗迄今廟制卒不立公卿亦安故習常得諉以為辭無肯唱衆為之者獨平章事文公首奏乞立廟河南明年七月有詔可之然尚未知築搆之式靡所循依至和初西鎮長安訪唐廟之存者得杜岐公舊迹止餘一堂四室及旁兩翼嘉祐元年始倣而營之三年增置前兩廡及門東廡以藏祭器西廡以藏家譜齋枋在中門之右省牲展饌視滌濯在中門之左庖厨在其東南其外門再重西折而南出四年秋廟成公以入輔出藩未嘗踰時安處於洛元豐三年秋留守西都始釁廟而祀焉一旦授光以家譜曰予欲志族世之所從來及廟之所由立垂示後昆而為我敘其事欵於石光竊惟公追逺復古率禮興化之盛徳不可以無傳雖自知不文不敢辭謹敘而銘之按譜云文氏之先出陳公子完以諡為氏與翼祖諱同至秦有丕丕生河東太守敎始家平陽其後有韶漢末為揚州刺史自韶以來世乃可譜韶之六世孫頻為後魏北絳太守頻曽孫顯儁以别駕從北齊高祖起晉州就霸業戰功居多終兖州刺史頻之六世孫曰肅曰君洪肅仕隋為潁川郡丞名列循吏以公直抗宇文述老卑秩君洪從高祖起晉陽為右衛将軍太子建成餘黨攻宫門君洪首奮挺出戰沒頻之八世孫曰暉曰播暉相中宗誅張易之奪武后天下歸之唐用仇人讒謫死嶠南播有史學官至給事中君洪之曾孫羽為御史中丞肅之四世孫括為御史大夫括孫晦為太子賔客晦兄昕為義成節度使皡為散騎常侍榮冠當時自顯儁至晦皆有傳見於史其家自平陽或遷太平或遷蒲阪或遷實鼎晦之從父昆弟晤為北都留守判官始居介休晤生汾州參軍檖檖生館館生澤州錄事參軍即公之高祖考也諱沼曽祖考諱某仕後唐歴晉城天池平城三主簿避晉高祖諱更其氏曰文歴崞太谷二令漢高祖即位復舊氏更名某漢失天下其支别者自帝於晉陽復事之終嵐州錄事參軍祖考諱某辟石州幕府弃官歸鄉里太宗皇帝平晉陽召之不起以廟諱故復為文氏考諱某以儒學進歴十三官所至以彊直勤敏振利攘害名聞達不可揜判三司開拆磨勘司終主客郎中河東轉運使其治行之詳見於故平章事晏公參知政事王公沂譔墓誌及碑公貴朝廷褒榮三代贈官皆至太師中書令兼尚書令爵燕周魏三國公廟成澤州府君為第一室夫人某氏配燕公為第二室燕國太夫人宋氏配周公為第三室周國太夫人王氏越國太夫人申氏配魏公居東室魏國太夫人耿氏魯國太夫人申氏配公以廟制未備不敢作主用晉荀安昌公祠制作神板采唐周元陽議祠以元日寒食秋分冬夏至致齋一日又以或受詔之四方不常其居乃酌古諸侯載遷主之義作車奉神板以行此皆禮之從宜者也其銘曰鬱彼喬木茂於苞根浩彼長川發於浚源矧人之先云誰敢諼天佑有宋誕生哲臣乃斡樞軸乃秉鎔鈞克釐克諧允武允文甘陵有妖悖暴紛囂公往逍遥不日而消仁祖搆疾群心震栗公入宻勿四海清謐出殿方維為諸侯師以恵以綏不廢其威至也民恱去也民思其思如何式謠且歌歌政之和在洛為多謀居之安疇如得民公自汾渚遷於洛滸允樂兹土永燕私處伊水洋洋山木蒼蒼是掄是剫是斷是斵達於有洛是相是虞是卜是諏是築是捄是植是扶是茨是塗作廟渠渠新廟既成室家是營公曰予居風雨是撫勿侈勿崇予躬是容人庳公堂公曰予康人隘公庭公曰予寧人勿予隘維子孫是賴人勿予庳維子孫是利克恭克儉予履予視俾躬之為美匪目之為麗廟堂既闢四室有侐豢牲孔碩𨗳黍及稷豆籩既滌汛掃既備㫖酒既泲刲牲為饎乃薦乃陳苾苾芬芬祖考欣欣百嘏來臻天錫公祉彊明夀愷帝錫公祿崇榮豐泰天匪公私公徳是宜帝匪公優公勲是醻公拜稽首揚天子之休思純終始式貽孫子子子孫孫勿替勿忘時奉烝嘗保公之烈光户部侍郎周公神道碑治平四年作周以國為氏漢魏以來世有顯人公之先家於益都曾祖考諱仁貴不仕祖考諱子元舉三禮登科為深州司法參軍契丹覆深州舉室罹禍朝廷哀之贈大理寺丞祖妣田氏追封仙遊縣太君考諱圭時適在外得免朝廷賜以官終太子中舍累贈尚書左僕射妣李氏累封常山縣太君公諱沆字子真舉進士一上中第除膠水縣主簿初試吏事精敏如素習上下稱其能徙諸城主簿用蔡文忠公薦遷鎮海軍節度推官知勃海縣濵州大吏恃府勢築室鄣民居害其出入民訴縣以十數前令莫敢直公立表撤室收吏扺罪豪猾惕息嵗餘召入改著作佐郎縣民詣轉運使杜祁公請留祁公為奏詔許之㑹公以母老疾求監青州稅尋以憂去職服除知嘉興縣趙元昊擾西陲詔近臣舉可通判陜西諸州者富丞相時知制誥以公名聞擢通判鳳翔府以權發遣鹽鐵判官召還改江西轉運判官公固辭願得近鄉里一官以謀𦵏乃改知沂州過京師入對言事仁宗善之賜服銀緋到官數月召還為開封府推官俄遷判官㑹湖南蠻唐盤二族殺掠居民官軍討之數不利有詔本路遣人招撫蠻輒殺之乃以公為轉運使委之經畫辭行仍服金紫公至上言蠻驟勝方驕未易懐服宜須秋冬進兵擊之蠻地險氣毒其人驍悍善用鋋盾北軍不能與之确請選邕宜融三州澄海忠敢知其山川習其伎藝者三千人入𢷬巢穴餘兵絡山足出則獵取之俟其勢窮力屈然後可招撫也朝廷用其䇿二族皆降湖南遂平是時軍旅暴興運路險澁公隨宜區處資粮豐給而民不疲病召為度支判官行未至復加直史舘知潭州兼荆湖南路安撫使先是北軍戍湖南山谿者或期年或再期乃代去再期者多死瘴癘公奏以為不均請皆以期年為斷所生全甚衆歸朝除河東路轉運使自慶歴以來河東行鐵錢民多盗鑄吏以峻法懲之抵罪者日繁終不能禁公乃命高估鐵價盗鑄者無利不禁自息入為度支副使儂智高冦掠廣南既敗走詔以公為西路安撫使天子以嶺南地惡命公非賊所殘州縣不必往公曰天子之命至仁也然逺民新罹荼毒余敢不究宣天子之澤以面慰之乎遂徧行州縣雖窮僻無不到者民避賊多棄田里逺去吏以常法滿半歳不還者皆聴人占佃公曰是豈與凶年逃租役者同乎奏更延期一年召使復業有巳為人占佃者皆奪還之仍免其一年租三年役貧者縣官貸以種粮由是嶺南民復安集又奉使契丹還加天章閣待制為陜西都轉運使未幾改河北初河自横隴西徙趨徳博後十餘年又自商胡西徙趨恩冀朝廷皆以功大遂不復塞有李仲昌者建議請自商胡口下鑿六塔渠引河東注横隴故道用功省而利大詔遣使者與公行視利害公上言國家近議塞商胡計用薪蘇一千六百四十五萬役工五百八十三萬今仲昌奏塞六塔計用薪蘇三百萬共是一河其塞之工力不容若是之殊盖仲昌故為小計以求興役殆非事實又即日河水廣二百餘步六塔渠廣四十餘歩必不能容且横隴下流自河徙以來填閼成高陸其西隄粗完東隄或在或亡前日六塔水㣲通分太河之水曽不及十分之三濵水之民䘮業者已三萬餘户就使如仲昌言全河東注必横潰汎濫齊博徳棣濵五州之民皆為魚鼈食矣今自六塔距海不啻千餘里若果欲壅河使東宜先治水所過兩隄使皆高厚仍備置吏兵分守其地多積薪蘇以防衝决乃可為也然其勞費甚大恐未易可辦以臣度之六塔實不可塞朝廷卒用仲昌議塞之既塞不終朝復决齊博等州果大被水害朝廷乃竄仲昌於嶺南諸阿附其議者亦扺罪衆始知公議為是公又上言民罹水災皆結廬隄冡粮乏可哀臣欲輒發近倉賑之顧大恩當自上出臣不敢竊取為名願亟遣使者案視收恤之朝廷從之未幾徙河東都轉運使踰年遷龍圗閣直學士知慶州兼環慶路經略安撫使邉民多䦨出塞販青鹽抵重法公請損官鹽之價犯者稍衰入判三班監兵部太常寺通進銀臺司仁宗山陵為鹵簿使又以遺留物奉使契丹公以二使皆有厚賚不欲専之因託以力不能兼辭使契丹不行士大夫美之英宗初即位契丹遣使賀乾元節公為館伴詔取書入置柩前使者固請見上曰取書非故典也上以方衰絰不許使者執書不肯授閤門公曰昔北朝有䘮南使至栁河而還今朝廷重鄰好聴君前至京師達命於先帝恩禮厚矣奈何更以取書為嫌乎使者立授書是時朝廷未知契丹主之年公從容雜佗語以問使者使者出不意􅃍以實對既而悔之相顧愕眙曰今復應兄事南朝矣頃之遷樞宻直學士知成徳軍兼真定府路安撫使土俗多棄親事浮圖公案籍閱其不知法者皆斥還其家凡斥數千人在真定數年以疾辭位治平四年以户部侍郎致仕其年八月丁未朔薨於公家年六十九公為人荘重動止皆有法不妄笑語居家孝友甚至而當官謹嚴始終如一鉏姦衛良摧彊撫弱去嘉興二十年人有過其縣聞民間猶思咏之以為前後無有罷潭州民遮道不得行公諭解不能却乃旋鞚而南曰當與汝歸耳衆喜奔呼争先道稍開躍馬北去追至境者尚數百人與僚佐議事其言當者立從之不當不面斥其短徐曰某意欲如此為安衆亦不能易也所部官屬有罪先以好言諭之不變乃誚責之懼而自改者盖十七八苟尚不變乃案致於法猶為虧除不盡繩也有死於官下其家孤貧不能自歸者必為賻斂衛送或無歸者則為存處立生業嫁其女誨其子弟視如親戚故人始望其貌皆懔然畏之久而求其心乃知實仁厚長者也先娶王氏再娶劉氏封彭城郡君皆先公即世三男莘将作監主簿百藥大理寺丞常大理評事二女適太常博士榮安道來安令江懋簡公薨之嵗十月已酉𦵏於先塋百藥暨常欲刻碑臨道俾異日郷人皆得瞻公之墓不忘公之徳請館閣校勘梁君燾状公之功行以授光命為之銘光昔通判并州事事公於河東雖自知無文不敢終辭銘曰古之君子徳盛道尊望之儼然即之也溫公正衣冠嚴不可干施之於政乃仁乃寛吏畏而悛民思不諼款銘垂美以告後昆行狀故處士贈都官郎中司馬君行状曾祖林祖政父炳皆不仕君諱沂陜州夏縣涑水鄉高堠里人其先出於晉安平獻王至征東大将軍陽始𦵏於河東安邑涑水之南後魏孝文帝太和中分安邑為夏縣遂為夏縣人自唐以來仕宦陵夷降在畎畝然累世兄弟未嘗異居故家之食口甚衆而生業素薄無以贍之君㓜而孝謹諸父兄悉以家事委之君於是治田疇繕園圃修䦨笠完圂倉雖有傭保必以身先之使莫敢不盡力者夜則側板而枕之寐不熟輒寤當是時田不加廣而家用饒又未嘗為商賈竒衺之業一出於田畜而已諸父兄皆醉飽安佚而君無故不親酒肉遇鄉人之匱乏者或解衣以濟之年三十二以景徳三年十二月丙子終於家某年月日𦵏於南原待制府君常歎曰自吾兄之亡而家遂貧豈所以資生之具减於昔日勤惰不同而已矣嗚呼使天下之民皆若吾兄之為雖古治世何以加惜其無位而才不大施也夫人李氏同里人年二十八而寡二男詠里及一女皆㓜詠女尋又卒父母欲奪其志夫家尊章亦遣焉夫人自誓不許惡衣蔬食躬執勤苦使里之四方就學姑李氏老且病常卧一榻扶然後起哺然後食夫人左右就養未嘗小失其意如是積年以至於沒無懈倦之色既而里登進士第迎夫人之官夫人自㓜未嘗與其母别至是思慕成疾久之方愈里累遷為尚書都官郎中歴典數州贈君官至尚書都官郎中夫人封永夀縣太君夫人為人慈柔勤儉中外宗族咸慕仰之始終一無間言子為二千石極其榮養年八十三以嘉祐五年九月甲寅終於京師其年十一月壬寅祔於君之墓光不及事君而及事夫人故得書其聞見之實以請於今之徳行文辭為人信者以表其墓庶幾得於不朽而子孫有所法則焉謹状墓表贈比部郎中司馬君墓表天聖元年三月作兄諱某字嘉謨陜州夏縣人其先宗支所自出見於祖墓碣曾祖諱某祖諱某父諱某皆不仕兄為人謹厚孝於親友於兄弟自㓜及長無子弟之過不幸生二十八年以天禧四年六月辛夘終於家夫人同縣王氏進士禹之女長男未名而夭次男京生未踰歳而兄沒夫人年尚少自誓不嫁京既長以叔祖天章府君䕃入官為人彊直幹敏所至吏民稱之由是累遷尚書駕部貟外郎通判潞州軍州事贈兄官至比部郎中夫人享榮祿之養幾三十年封福昌縣太君年七十九以熙寧三年七月壬寅終二女長適鄉人曹中立早卒次適進士宋輔始兄之沒光生二年矣故於兄之材行不能詳知然苟非兄力為善於其身而無祿安能有遺福及其後邪兄以天聖六年三月乙巳塟於先塋及夫人之沒以其年十月辛酉祔於兄墓京懼嵗時之久不可以莫之識也泣請於光為之表贈衛尉少卿司馬府君墓表慶厯二年作府君諱浩於司徒公為從父兄其鄉里先世見於祖墓碣曾祖諱某祖諱某父諱某皆不仕府君少治詩以學究舉凡八上終不遇遂絶意不復自進於有司専以治家為事為人魁㟁慷慨尚氣義於宗族恩尤篤司馬氏累世聚居食口衆而田園寡府君竭力營衣食以贈之均一無私孀婦孤兒皆獲其所凡數十年始終無私毫怨言家貧祖墓廹隘尊卑長㓜前後積若干䘮久未之𦵏府君履行祖墓之西相地為新墓稱家之有無一旦悉舉而𦵏之弟子里早孤府君識其儁異自㓜教督甚嚴其後卒以文學取進士第仕至太常少卿所至著名迹前此郷人𨗳涑水以溉田利甚博嵗久岸益深峭水不能復上田日磽薄将不足以輸租府君帥郷人言縣官始請築塌於下流水乃復行田間為民用至于今賴之天聖八年四月癸巳終于家年六十三慶歴二年八月癸酉𦵏西墓初娶張氏早終生女適解人南公佐公佐舉進士得同學究出身再娶蘇氏先府君十年終年五十八生男宣又娶郭氏無子後府君十六年終年若干宣用司徒公䕃補郊社齋郎累官為尚書駕部貟外郎知梁山軍今致仕居家駕部君寛厚有守練習法令善為政吏民不能欺既升朝累贈府君官至衛尉少卿夫人蘇氏追封長安縣太君駕部君謂古君子必論譔其先人之美著諸金石故命光直敘其實以表於府君之墓道時熙寧六年五月辛酉也哀辭石昌言哀辭眉山石昌言年十八州舉進士倫軰數百人昌言為之首聲振西蜀四十三乃及第及第十八年知制誥又三年以疾終嗚呼少而秀宜其速成返齟齬不進晚而達宜其夀又未老而終天道幽逺真不可得而識邪昌言為人純素忠謹望之儼然以律度自居即之恂恂溫厚善談笑令人心醉不能舍去光為兒始執巻則聞昌言名已而同年登進士第與昌言遊凡二十年自始得見至於永訣其間迭有進退窮通相遇如一日既不可得而親亦不可得而踈也詩云淑人君子其儀一兮其儀一兮心如結兮昌言之謂邪於未沒數日光往見之起居固無恙一旦有人告曰昌言去夜得疾甚急未及問訊又有繼至者曰昌言沒矣嗚呼死者人之常善惡修短固不敢言何奪之之暴也前年光自晉陽歸昌言延我於中堂酌滑臺暑釀以飲我及往奠於畫像之前則依然昔時置酒處也嗚呼誰能睹是而不慟也哉廼為之辭曰嗚呼昌言天既賦以純美兮胡有徳而不年榮祿何後兮零落何先幾日不見兮邈然九泉士䘮師友兮國亡俊賢綠耳顛躓兮璵璠棄捐冥冥不可求兮杳杳不可追獨行過門兮怳焉自疑車馬不見兮逺行何之忽思長逝兮涕下交頥寒暑回薄兮宿草離離哭也有終兮忘也無時傳家集巻七十九欽定四庫全書傳家集巻八十宋司馬光撰祭文豢龍廟祈雨文年月日宣徳郎将作監主簿權知常城縣事司馬光謹率吏民具清酌庶羞之奠致祭於豢龍之神昔者聖王設官分職畜擾神物以為人用後世䘮業神實繼之知龍嗜慾服事夏后王嘉神勞胙以此土嵗祀超忽廟貌仍存闔縣奔走春秋薦獻却災致福保佑斯人今大夏将盡而歴時不雨榖苗槁死不可復殖倉廪無儲民将何恃民實神主神實民休百姓不粒誰供神役邑長有罪神當罰之百姓無辜神當愛之天有甘澤龍實司之以時宣施神實使之稿者以榮死者以生旱氣削除化為豐登然後自邇及逺粢盛牲酒以承事神永永無斁伏惟尚饗祭齊國獻穆大長公主文為兩制諸公作惟靈襲慶皇家作嬪侯族環珮為節動顧禮文蘋藻必親無違婦職承天以順敎子以慈純素柔嘉自㤀王姬之貴肅雍明智居為里戚之規嗚呼遐福未終大期奄及去白日之昭晰歸下泉之窈㝠宸極惋傷具僚增欷祗陳薄薦庶達菲誠尚饗祭郭侍讀文維皇祐四年五月壬子尚書屯田貟外郎孫琳殿中丞司馬光太子左賛善大夫李端卿大理寺丞李杲卿前通州推官楚楷謹致祭於故侍讀學士郭公之靈嗚呼惟公之徳清夷純白恪慎匪懈勤劬朝夕文為國華行為士則抱牘拱編雍容帝側貧錫之金坐命之席絶衆逾倫恩輝備極如何不淑奄從窀穸某等庸蔽久泳公恩承乏下僚從公外藩庇其闕遺誨之話言如妷如甥心何敢諼今兹相顧失涕來門瞻望靈帷薦其蘋蘩凄風肅然髣髴如存嗚呼哀哉尚饗祭范尚書文以下二篇為兩制諸公作嗚呼天生儁賢為國之紀服休服采以翼天子冠帶立朝正色嶬嶬讜言直節奮不顧已廼率西師氐羌率俾廼賛公台緝熙物軌乃牧東夏刑清政理徳實光大才則茂矣宜其永齡享有多祉如何不淑逺塗中止輴車過都頓舍甚邇奠不手傷僣痌何巳靈底其衷歆茲馨旨尚饗祭觀文丁尚書文惟公抱素懐真含忠履厚賦才茂美逢世休嘉降集帝庭回翔禁署羽儀髦儁黼黻訓辭登賛機衡進叅台鼎物無疵癘民底又安陪侍殿帷雍容風議老成之徳中外式瞻宜享永年以毗大業如何不淑隕此哲人日月有時輴車首路興言僚舊哽涕無從薄薦醪羞式歆哀欵尚饗諸廟祈雪文竊以雪霜不時神實職之編室流亡吏當坐之今者自秋徂冬天澤未浹麰麥既寡又将槁枯意者吏不職歟民無告歟胡為困苦使至此極也惟神哀民之窮寛吏之辜使雪以時降而麥猶有收敢不牲酒鼓舞以承神休尚饗祭黄石公文維年月日具官某謹遣某官某敢以香酒告於黄石公之神惟公禀天至靈與聖同契幽賛人傑光啟漢家廟食於今千有餘祀惟是鄆土居神宇下曠冬無雪宿麥将枯舊廪既罄新場無望老穉遑遑濵於溝壑上聖夙夜苦心焦思中外百吏憂愧失圖惟神𨗳天之和寛上之慮救民之死赦吏之罪使膏澤下濟土脉僨興囘枯為榮變凶成稔敢不祇率所部逺邇之民以承事神永永無斁尚饗祭劉大卿文為始平公作維年月日具位某謹以清酌庶羞之奠致祭于同年留䑓大卿之靈昔與羣儁同登帝庭煜如春葩雜然秀發嵗陽四浹零落幾盡如何茲者又隕伊人惟君資性純和雅尚恬漠委逺繁要雍容外臺維汶之陽寔為故里間者相遇觴咏甚歡華軒西征逺送于野轍迹未滅遽以䘮歸永言痌嗟情何能極薦奠雖簿歆茲至誠尚饗諸廟祈雨文間以旱暵病于稼穡得請于神貺之甘澤來麰以登民以粒食荷神之休永久無極今兹禾黍尚穉菽麥未蓺土壤已槁霶潤無繼川澤将涸螟􅈮方熾婦子遑遑憂猶未艾神宜監民之窮憫物之沴沃灑嘉生𨗳迎和氣庶幾豐穰克終大恵敢不鼔舞以承神事尚饗諸廟謝雨文間以旱暵有謁于神神享其衷錫以嘉雨雖高下未浹逺邇未均田畆小濡民意差緩蒙神之恵不敢寕居選牲潔酒亟伸報賽惟神嗣降豐澤克終顯徳尚饗
