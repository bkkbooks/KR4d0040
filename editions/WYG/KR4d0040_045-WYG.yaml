  hash: sha256:3c4c66fdc15ad51dfa3adc7d82c4080cb659a8f85e88ca25ad0024251b4f5313
body:
  text: 申宣撫權住製造乾糧皺飯狀熈寜三年十二月一日上准都轉運司牒准宣撫使衙劄子節文製造乾糧州軍将􅔋一斗變造乾糧五斤仍量支與柴錢勘㑹近准宣撫使衙劄子節文指揮沿邉四路十四州軍并近裏永興軍河中府同耀乾州鳳翔府等州軍變造􅔋餅皺飯當司已兩次牒逐州軍疾早變造施行去訖今又准前項宣撫使衙劄子已牒逐州将􅔋一斗變造乾糧五斤仍量支與柴錢如闕􅔋即疾速計置收糴變造乾糧所是柴錢斟量支給施行去訖牒請照㑹施行者右具如前勘會先准中書劄子節文奉聖㫖今後起發義勇赴沿邉戰守並令自齎備一月口食與折将來本户稅物若不能自備只乞於起發州軍預請一月口食齎往者亦聴又勘會永興軍近准都轉運使司牒准宣撫使衙劄子近准朝㫖義勇上畨令附帯乾糧一秤至屯戍州軍須合預行變造乾糧准備支遣附帯前去右劄送陜西轉運司檢會近降義勇分畨條貫指揮㳂邉四路十四州軍并近裏永興河中同耀乾鳯翔六州府速行勘會義勇所居縣分近便省倉斛斗内有􅔋粟或白米便約義勇合附帯乾糧秤數中停變造􅔋餅皺飯如見在􅔋數不多即一色變造皺飯仍趂此時月造下兩畨令附帯數目免致非時蒸㬠易為損惡仍毎乾糧一秤破係官布造袋子封印如法收將來義勇上畨日依數附帯者光竊詳義勇戍守之時毎人逐日給米二升半其一月口食七斗五升若更加乾糧一秤并噐械衣装盤纒等物竊慮一人之力難以勝任兼今來變造乾糧皺飯須至差配百姓當此饑饉民間不易之際雖云量支柴薪亦不能全無搔擾况即今諸縣官倉􅔋米至少昨准朝㫖散支第四等第五等闕食人户各二石尚未有備若更造乾糧皺飯即将來二三月間正當闕食之際更將何物可以救濟必見大叚失所竊見慶厯年中議欲出兵討伐元昊亦曽令陜西諸州製造乾糧皺飯萬數不少後來旣不出兵其乾糧皺飯所在堆積經年朽腐不可復食盡為棄物今官中錢糓比於慶厯年尤更難得若復造此物徒使公私勞費卒無所用誠為可惜又國家備邉若止於戍守則㳂邉自有倉廪無用乾糧皺飯今來承准指揮製造上件乾糧皺飯仍令十日一申倉卒取辦竊慮百姓猜疑以為國家又欲出兵必致逺近驚憂無由觧諭至時不為便穏光已指揮本路前項五州軍且未令造乾糧皺飯更聴候宣撫衙指揮去訖謹具狀申宣撫使衙伏望裁酌早賜指揮乞罷修腹内城壁樓櫓及噐械狀熈寜四年正月三日上尋得㫖依奏准熈寜三年十一月初七日准樞宻院劄子節文檢會近為麟府路豐州及外堡寨官吏弛慢不職不修完城池樓櫓噐甲等已奉聖㫖降官等第斷遣及劄與三路轉運司徧牒轄下沿邉州軍知委去訖近又據陜西路提刑宣撫司奏華州甲仗庫弓弩不堪盖是監官并本州官貟全不用心㸃檢有誤緩急使用其鈐轄盧戭坐受優俸空占當直兵士略不營職朝廷已令鄜延路經略司舉官差替盧戭其華州甲庫弓弩不堪本州當職官貟全不用心㸃檢仍宣撫司差官取勘聞奏竊慮諸路亦有不修完城壁噐甲等去處奉聖㫖令河東河北陜西經略安撫司指揮轄下州軍委官吏子細㸃檢須管日近修完城壁樓櫓堅固噐甲精利如將來朝廷専差官㸃檢得却有未修城壁樓櫓噐甲等其應干官吏必當依此重行斷遣劄付本司者尋依准朝㫖行下本路諸州軍施行近准虢州申州司勘會本州雖係陜西路即不係近邉州軍其州城從來並不曽有敵樓戰棚為自來霖雨損壊摧塌及無兵功累年不曽修築今來亦不敢専擅役夫修築已牒在城兵馬都監吕士宣重行檢計損壊城邑去處才候檢計到合使人功物料别具狀供申乞差兵夫次及據觧州申准兵馬監押狀申准州牒備録到安撫使司牒内坐到聖㫖指揮修完城壁樓櫓等尋將帯壕寨木匠作頭等檢計外羅城面上只有更屋二十三座並係年深倒塌及城壁墜倒乆來亦不曽泥補修完伏乞據狀申上衙乞差官計料修城人工及剏添樓櫓免致將來朝廷差官檢視見並不修完城壁及剏盖樓櫓虚負責降停替州司勘會舊來城上並無樓櫓即目城面上濶處只及四五尺以來今若指揮使行剏造又縁合使人工材料數目不少今來未敢専擅剏修伏候指揮右謹具如前勘會管下永興等一十州軍城壁内有乆來已行安置樓櫓完備亦有城壁低下薄怯全未有樓櫓去處其逐州官吏旣准上項朝㫖及見麟府豐州官吏以不修完城壁櫓樓噐甲降官等第斷遣并華州官吏差替取勘仍恐朝廷非時差官㸃檢例各畏懼争欲日近興功完葺以避譴責伏縁營造樓櫓須藉城基厚濶方可安置今來觧虢兩州城壁皆稱濶處只及四五尺似此之類須是先貼築城基方可剏修樓櫓若非大叚興功無以辦濟况今本路州軍全闕廂軍應急差使官庫亦闕見錢收買材料若是差役人夫配率材料又縁陜西州軍已是去嵗夏麥薄收秋苖旱損當此饑饉人户流移之際若更如此差擾必是轉難存濟兼永興軍一路州軍盡在腹裏去沿邉絶逺設若蕃賊入冦亦未能卽到逐州軍城下其樓櫓修下數年不用不免損壊今來若盡令與沿邉州軍一例須管日近修完城壁樓櫓堅固噐甲精利顯見官私虚有勞費欲乞朝廷特降指揮其㳂邉及次邉州軍即一依近降朝㫖修完所有腹内州軍城壁樓櫓并候将來豐熟以漸營葺其噐甲即㨿不堪數目逐旋勒作院人匠依程課修整務令精利所貴公私皆得辦濟乞不添屯軍馬熈寜四年正月八日上今月七日准熈寜三年十二月二十九日陜西河東路宣撫使司劄子本司近已具奏聞乞於永興軍邠州河中府三州軍易得糧草之處别添屯軍馬選差将官専切訓練逐路不得句抽専聴宣撫司節制内一項乞於永興軍駐劄兵馬差本司准備差使莊宅使趙瑜充永興軍路都鈐轄與知府専管訓練者右具如前臣勘會永興軍所管今年正月一日見在軍糧麤細色斛斗共三十六萬九千七百石二斗四升據即目本府見駐泊及就糧并本城兵貟糧食及官僚請俸等共約支得向去一十七箇月半馬料三萬七千六百五十二石四斗二升約支得向去一十五箇月有餘稈草四十萬六千二百二十二束約支得一十三箇月半有餘此只是據見在軍馬約度即不知今來所添屯軍馬計多少數目若只添一倍之時其人粮只約支得八箇月有餘馬料只約支得七箇月有餘稈草只支得六箇月有餘所添更多所費尤廣又先准中書劄子奉聖㫖令體量應災傷人户委的飢乏不能自存者仰發省倉斛斗據第四第五以下人户各借二石今勘會永興軍諸縣第四等以下闕食人户約及十餘萬户若毎户支二石共計合支二十餘萬石其外縣雖有粮草亦是數目不多更難支充貸糧若並令在府省倉請領又更减却此數即軍糧約支更不及得上項月數况去年陜西經夏大旱入秋霖雨五糓例皆不熟其永興軍放稅多者至七八分即今毎斗白米價錢一百文足稈草毎束價錢二十七文足雖差官開場糴買只糴得白米九百餘石稈草全無兼勘會軍資庫日近雜支錢盡底支絶准轉運司牒将三司提刑司鹽馬司封樁錢盡數充雜支錢止及四萬餘貫除支毎月料錢及軍府諸般使用並不住准轉運司牒支撥往㳂邉州軍及應副收買軍期物色見今無錢支與和糴場糶買糧草豈得謂之易得糧草之處臣竊謂大凡添屯軍馬先須約度本處糧草可以贍養與否今來關中饑饉倉庫空虚贍養舊兵猶恐不足更添新者何以枝梧雖朝廷更於左藏庫内藏庫支撥銀紬絹等降下本路添助支費亦不免令州縣配賣與百姓轉増貧困况糧草是重滯之物不可從逺處興販得來須本處土地所生方可計置今饑饉如此雖多積金銀髙估物價令轉運司與州縣多方擘畫其日下所要糧草何由可得况即今民間闕食流移死亡者已為不少諸縣處處申報驚刼若至向前二三月後舊糓已盡新麥未熟民間必轉更飢乏若官中愛惜倉庫坐視不救竊恐流移轉多死亡轉衆盗賊轉煩深為不便竊以戎狄擾邉手足之疾百姓離散腹心之憂豈可重外輕内逐末忘本兹事得失所繫不細伏望朝廷先将陜西諸州軍糧草約度合贍得若干軍馬一年支費仍須於十分中量留二三分救濟目下飢民外如有剰數然後據數添屯軍馬若苦無剰數之時伏乞朝廷更不添屯儻以邉鄙未寜須至量添軍馬之時即乞分散往諸州軍就糧各委逐處兵官精加訓練不須聚在永興軍邠州河中府三處更特置都鈐轄三貟候邉事稍定即乞速發遣歸住營處所貴公私稍得辦濟若不如此先約度粮草但務添屯軍馬竊恐一旦倉庫俱竭别有不虞至時悔無所及臣職在守藩不敢不言所有先准朝㫖令第四等以下人户借支斛斗二石未審今來支與不支若支與則軍粮轉更不足不支則人户正當飢乏伏願聖慈早降指揮臣不勝廹切之誠奏乞兵官與趙瑜同訓練駐泊兵士狀熈寜四年正月十九日上右臣准今月三日宣命差下在京及外處拱聖等十四指揮計五千餘人赴永興軍權駐泊准備宣撫司抽差使及差荘宅使趙瑜充本路都鈐轄與臣専管句訓練臣本書生叨忝兩制軍旅之事素所不知加以近准宣撫司劄子坐到教閲新法令排日各習事藝臣所管永興軍一十三縣民事至多及應副㳂邉軍須物色文案填委毎日自旦至暮未甞暫閒實無餘力與趙瑜同監教閲又不可専委趙瑜獨行訓練又永興軍舊管屯駐駐泊就粮兵士自來並是鈐轄劉斌路分都監李應之同共管句今來所添兵士准宣命指揮只令趙瑜與臣専管句訓練所有舊來兵士不知趙瑜管與不管若令通管之時其新來兵士旣在永軍駐泊其劉斌李應之並是本路鈐轄都監豈可却管轄不得竊慮向去新兵士不賔服舊兵官舊兵官不應副新兵士各分彼我則致生事深為不便所有上件新差來永興軍權駐劄兵士臣欲乞令本路兵官與趙瑜同共訓練所貴公共同心管句得辦謹具状奏聞伏候勅㫖并申宣撫相公更賜敷奏乞早降指揮傳家集巻四十五欽定四庫全書傳家集巻四十六宋司馬光撰章奏二十九
