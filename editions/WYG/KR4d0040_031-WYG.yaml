body:
  text: 章奏十六言講筵劄子治平元年九月三日上臣伏覩講筵所告報奉聖㫖令自九月初五日後逐日講筵至重陽節住講候將来開春别選日講筵臣竊以國家本設經筵欲以發明道誼裨益聖徳先帝時無事常開講筵近嵗因聖體不安遂於端午及冬至以後盛暑盛寒之時權罷數月今陛下始初清明方宜鋭精學問之時而五日開講八日已罷臣恐議者以爲陛下非有意於求道但欲循故事備外事而已羣臣非有意於明道但欲塞職業求錫賚而已若果如此臣竊爲朝廷羞之且陛下近増置諸宫教授仍下詔戒朂宗室使之嚮學儻陛下不以身先之則宗室安肯奉詔哉臣愚以爲陛下若别有所爲未暇開講則且俟佗時亦未爲晩若既開講筵則恐數日之間未宜遽罷取進止乞講尚書劄子治平元年上臣伏覩經筵所講説論語將畢竊以尚書者二帝三王嘉言要道盡在其中爲政之成規稽古之先務也陛下新承大統留意萬幾欲求楷模莫盛於此臣不勝區區欲望陛下更以聖意裁酌將来論語既畢令講説尚書取進止言除盗劄子治平元年十月十日上臣竊聞降勅下京東京西災傷州軍如人户委是家貧偷盗斛斗因而盗財者與减等斷放未知虛的若果如此深爲不便臣聞周禮荒政十有二散利薄征緩刑弛力舍禁去幾率皆推寛大之恩以利於民獨於盗賊愈更嚴急所以然者盖以饑饉之嵗盗賊必多殘害良民不可不除也頃年嘗見州縣官吏有不知治體務爲小仁者或遇㓙年有刼盗斛斗者小加寛縱則盗賊公行更相刼奪鄉村大擾不免廣有収捕重加刑辟或死或流然後稍定今若朝廷明降勅文豫言偷盗斛斗因而盗財者與减等斷放是勸民爲盗也百姓乏食官中當輕徭薄賦開倉賑貸以救其死不當使之自相劫奪也今嵗府界京東京西水災極多嚴刑峻法以除賊盗猶恐春冬之交飢民嘯聚不可禁禦又况降勅以勸之臣恐國家始於寛仁而終於酷暴意在活人而殺人更多也凡號令之出不可不慎毫釐之失爲害實多若纔知其失随即更張猶勝於有害及民迷而不復者也伏望陛下速令収還此勅嚴責京東京西轉運司及州縣應災傷之處多方擘畫斛斗救濟飢民若有一人敢劫奪人斛斗者立加擒捕依法施行如此則衆知所畏不敢輕犯所以保全愚民减省刑獄之道也取進止言備邊劄子臣聞周書稱文王之徳曰大邦畏其力小邦懐其徳盖言諸侯傲狠不賔則討誅之從順柔服則保全之不避彊不陵弱此王者所以爲政於天下也臣伏見去嵗先帝登遐趙諒祚遣使者来致祭延州差指使髙宜押伴入京冝言語輕肆傲其使者侮其國主使者臨辭自訴於朝臣當時與吕誨上言乞加冝罪朝廷忽略此事不以爲意使其怨懟歸國一國之人皆以爲恥今嵗以来諒祚招誘亡命㸃集兵馬窺伺邉境攻圍堡寨驅脅熟户八十餘族殺掠弓箭手約數千人悖逆如此而朝廷乃更遣使臣齎詔撫諭彼順從則侮之傲狠則畏之無乃非文王所以令諸侯乎若使臣至彼諒祚稽首伏罪禁止侵掠猶或可赦若復拒違王命辭禮驕慢侵掠不已未知朝廷將何以待之傷威毁重孰甚於此方今公私困竭士卒驕惰將帥乏人而戎狄犯邊事之可憂孰大於此而朝廷上下晏然若無事者其故何哉豈朝廷自有其備而疎外之臣不得與知乎臣竊惑之所謂備者非但添屯軍馬積貯糧草而已也在於擇將帥而修軍政也二者皆闕何謂有備臣不勝憤懣伏望陛下博延羣臣訪以禦邊之策擇其善者而力行之方今救邊之急宜若捧漏甕沃焦釡猶恐不及豈可外示閒暇而養成大患也取進止言蓄積劄子臣聞國以民爲本民以食爲天國家近嵗以来官中及民間皆不務蓄積官中倉廪大率無三年之儲鄉村農民少有半年之食是以小有水旱則公私窮匱無以相救流移轉徙盗賊並興當是之時朝廷非不以爲憂及年糓稍豐則上下之人皆忘之矣此最當今之深弊也先帝時臣曽上言乞將諸路轉運使及諸州軍長吏官滿之日倉庫之實比於始至増减多少以爲黜陟又令民能力田積糓者皆不以爲家貲之數欲爲國家力救此弊自後不聞朝廷施行今嵗開封府界南京宿亳陳蔡曹濮濟鄆等州霖雨爲災稼穡之田悉爲洪流百姓羸弱者流轉佗方餓死溝壑強壯者起爲盗賊吏不能禁朝廷欲開倉賑貸則軍儲尚猶不足何以贍民欲括取於蓄積之家則貧者未能賑濟富者亦將乏食又使今後民間不敢蓄積不幸復有㓙年則國家更於何處取之此所以朝廷雖寒心銷志亦坐而視之無如之何者也臣竊思之盖非今日有司之罪乃曏時有司之罪也往日不可及来者猶可追陛下儻不於今日特留聖心速救此弊豐㓙之期不可豫保若向去復有水旱螟蝗之災饑饉相仍甚於今年則國家之憂何所不至乎臣又聞平糴之法必謹視年之上下故大熟則上糴三而舍一中熟則糴二下熟則糴一使民適足價平則止小飢則發小熟之所斂中飢則發中熟之所斂大飢則發大熟之所斂而糶之所以取有餘補不足也今開封府及京東京西水災之處放税多及十分是大饑之嵗也官吏往往更行収糴所給官錢既少百姓不肯自来中糴則遣人編攔搜括無以異於冦盗之鈔劫是使有糓之家愈更閉匿不敢入市糓價益貴人不聊生如此非獨天災亦由吏治顛錯之所致也臣愚欲望朝廷檢㑹臣前次及今來所奏事理更加詳酌擇其可者少賜施行指揮開封府界及京東京西災傷州軍見今官中収糴者一切止住其有常平廣惠倉斛斗之處按籍置歴出糶賑貸先救農民告諭蓄積之家許行出利借貸與人候豐熟之日官中特爲理索不令逋欠其河北陜西河東及諸路應豐稔之處委轉運司相度糓價賤者廣謀収糴價平即止如本路闕少錢物即委三司於佗處擘畫那移應副仍自今以後乞朝廷每年謹察諸路豐㓙之處依此施行臣竊料有司必言官無閒錢可以趂時収糴臣伏見國家每遇㓙荒之嵗縁邉屯軍多處常用數百錢糴米一斗若用此於豐稔之嵗可糴一碩不知有司何故於㓙荒之嵗則有錢供億至豐稔之嵗則無錢也此無佗故患在有司偷安目前以俟遷移進用不爲國家思乆逺之計而已故臣惟願陛下深留聖意取進止言階級劄子治平元年十一月十五日上臣聞治軍無禮則威嚴不行禮者上下之分是也唐自肅代以降務行姑息之政是以藩鎮跋扈威侮朝廷士卒驕横侵逼主帥下陵上替無復綱紀以至五代天下大亂運祚迫蹙生民塗炭祖宗受天景命聖徳聦明知天下之亂生於無禮也乃立軍中之制曰一階一級全歸伏事之儀敢有違犯罪至於死於是上至都指揮使下至押官長行等衰相承粲然有叙若身之使臂臂之使指莫敢不從故能東征西伐削平海内爲子孫建久大之業至今百有餘年天下太平者皆由此道也近嵗以来中外主兵臣僚往往不識大體好施大惠以盗虛名軍中有犯階級者務行寛貸是致軍校大率不敢鈐束長行甘言悦色曲加煦嫗以至懦怯兵官亦爲此態遂使行伍之間驕恣悖慢寖不可制上畏其下尊制於卑所謂下陵上替者無過於此臣聞聖王刑期於無刑今寛貸犯階級之人雖活一人之命殊不知軍法不立漸成陵替之風則所繫乃億兆人之命也臣愚欲望陛下特降詔㫖申明階級之法戒勅中外主兵臣僚令一遵祖宗之制如敢有輒行寛貸曲収衆心者嚴加罪罰以儆其餘庶幾綱紀復振基緒永安取進止言舉官上殿劄子治平元年十一月二十五日上臣聞致治之本在於得賢天下至廣羣臣至衆人主不能徧知必資薦舉若薦舉不得其實則邪巧並進官職耗廢是故設連坐之法以懲之此百王不易之道也伏見近降詔書令中外臣僚於文資官内不以職位髙下舉行實素著官政尤異可備陞擢任使之人又於諸司使以下至三班使臣内舉堪充將領及行陳任使之人此乃前世之令典當今之切務臣始聞之不勝慶抃既而議者皆言數年之前亦曽有此詔書所舉甚衆未聞朝廷曽有所陞擢今兹盖亦修故事飾虛名而已非有求賢之實也若果如此誠有何益臣愚欲望陛下盡將今来臣僚所舉之人隨逐人資叙各置一簿編其姓名留之禁中其副本降付中書樞宻院若遇文臣轉運副使提㸃刑獄轉運判官知大藩府及武臣緫管鈐轄路分都監知州軍等有闕除用舊資叙人外應係陞陟入上件差遣者並乞於今来舉官簿内次等資叙人中陛下親加選擇㸃定一人其不係今来薦舉之人不得差充上件差遣若陞陟以後佗日職事敗闕不如所舉及犯贓私罪其舉主並依法施行雖見任兩府亦乞不以恩例特放凡係舉官不當降官及降差遣者未滿三年雖遇恩赦不得牽復如此則羣臣莫敢不盡公擇人天下賢才皆可得而官使矣取進止言陳述古劄子治平二年正月十日上臣竊聞陜西都轉運使陳述古昨因巡邊妄奏朝廷稱邊鄙寜静不足爲慮後因權涇原路經略司事聞副緫管劉几稱西人㸃集將謀入冦請出兵防扞述古恐與前奏相違因此怒几奏稱不協軍情張皇生事擅移几知鳯翔府數日之間西人果大舉犯邊殺掠弓箭手及熟户蕃部述古亦不即時發兵救援致陷没數千户近者雖知朝廷已差臺官勘述古罪狀然竊聞所坐止於擅移劉几及奏狀有不實之處若以文吏議之罪不至重若以國計言之爲害實深何則國家承平日久人不習戰雖屯戍之兵亦臨敵難用唯弓箭手及熟户蕃部皆生長邉陲習山川道路知西人情偽材氣勇悍不懼戰鬬從来國家頼之以爲藩蔽今述古知西人欲来侵擾而自避飜覆之辜順成欺罔之謀抑遏將官不許救䕶遂以數千户生民委於虎口使父子流離骨肉塗炭豈惟已陷没者深可哀痛臣恐自今以後諸路弓箭手皆不敢於極邉居止熟户蕃部皆有叛國從賊之心以此觀之其害豈小哉况述古出於門䕃材氣庸鄙自歴官以来所至之處縱恣胷臆殘虐吏民不顧憲典輕侮王命驕暴狠狡天下共知屢曽坐事黜降旋復収用叨竊名位一朝至此誠過其分量故天奪之魄舉措乖謬駭人視聴陷敗民命挫辱國威内外之人無不憤疾臣聞舜誅四㓙而天下服如述古平生所爲亦可以謂之㓙人矣陛下縱不欲明加斧鉞以謝邉民亦當投之荒裔以禦魑魅庶使封疆之臣少加警懼取進止言皮公弼劄子治平二年正月十一日上臣伏覩近降詔書於初任第二任通判人中選人權發遣三司判官公事九年之後擢爲職司既使之久於其事又待以不次之位此誠用人之要術爲政之首務也然當兹選擢之初天下士大夫莫不延頸而望拭目而視若得清修孤直之人則皆勸慕爲善砥節礪行不肖者亦化爲賢矣若得貪汚諂偽之人則皆傾巧干進飾貌盗名安恬者亦變而爲躁矣此乃風俗之本原政治之樞機不可以不慎自非有竒材異績爲天下所知未可容易當此舉也竊見尚書都官員外郎皮公弼爲吏之處以貪饕致富資性狡猾善爲進取在京師則造請不倦在外則書啟相尋專用此術致舉主三十餘人一旦首膺兹選天下之人苟有知公弼所爲者但私議竊歎憤鬱喑嗚莫敢發言此豈可以稱陛下求賢之意副四方跂竦之望哉若所選之人皆如皮公弼之類乃是開此徼倖之門以爲佞邪躁進之塗恐非朝廷之福也所有皮公弼伏望聖慈追還前命勒歸本任况今中外之官本資序合入三司判官者尚不啻數十人豈得其中全無可選擇者願且選以補即目三司判官之闕俟果有竒材異績爲衆所知者然後依近降詔書舉而用之天下幸甚取進止言皮公弼第二劄子臣近曽上言乞罷皮公弼三司判官公事未聞朝廷施行臣聞周禮小宰以六計弊羣吏之治曰亷善亷能亷謹亷正亷法亷辨盖言爲吏者雖有六事皆以亷爲本也翼奉曰人誠向正雖愚爲用若乃懐邪智益爲害盖言人操心不正者雖有材能無所用也今以公弼材能求於朝士之間不爲難得若其貪汚諂偽則罕有其比陛下方欲簡㧞英賢待之不次以砥礪羣臣新美大化而得公弼之徒臣恐四方聞之無不觧體使亷正之士沈抑而不顯貪邪之人輻湊而競進其於虧損聖政敗壊風俗不爲細事伏望陛下早追還公弼前所授恩命勒歸東明本任取進止言王廣淵剳子治平二年正月十三日上臣伏見新除王廣淵直集賢院外廷之人無不怪惑偶語族談莫知其故或云廣淵以唇舌便佞遊走於公卿之門盖執政所薦也或云陛下龍潜之時廣淵以文章因陛下故人自薦逹素䝉知賞故特加㧞擢此二者臣莫知其虚實若果有其一皆非朝廷之美也夫端士進者治之表也憸人進者亂之階也臣窃聞廣淵雖薄有有文藝其餘更無所長於士大夫之間好奔競善進取稱為第一若以此獲公卿之知則其人固非端士矣曏以初任通判編排中書文字二年之間堂除知舒州搢紳已皆相與指目以為僥倖今又驟加美職安得不取外廷之怪惑乎陛下方涖政之初欲簡㧞天下賢材寘諸不次之位以率厲羣臣而執事之臣不能稱陛下之意前此用皮公弼權發遣三司判官今又用王廣淵直集賢院將何以使天下之人尚廉恥之莭崇敦厚之風乎若陛下龍潜之時廣淵果曽以文章自達於左右此尤不可昔漢文帝時景帝為太子嘗召上左右飲中郎将衛綰獨稱疾不往及即位寵待綰過於佗臣周太祖時世宗鎮澶州張美為三司吏掌州之錢穀世宗私有求假美悉力應奉及即位衆皆稱美材敏而世宗終薄其為人廣淵若當仁宗之世私以文章獻於陛下為臣忠謹者肯如是乎陛下今日當治其罪而又賞之將何以厲人臣之節也所有王廣淵新直集賢院勅伏乞追還言王廣淵第二劄子臣近曽上言乞罷王廣淵直集賢院事未聞朝廷施行外議籍籍至今未已臣備位諌職不敢塞黙竊見廣淵憸邪便佞勤於造請以此之故自幕職入京數年之間得堂除知州今又以特㫖直集賢院臣不知廣淵有何才徳過絶於人而受國家寵榮如此之速也議者皆言陛下在藩邸時廣淵因時君卿以文章筆札私有䞇獻深自結納故有今日之命若果如此大為非宜臣聞為人君者洗濯其心至公至正審察善惡明辨是非忠信者雖有怨讎而必用姦回者雖有私恩而必誅是以羣臣暁然各知所守一心同徳以事其上今廣淵若於仁宗之世私結陛下之知則陛下察其為人果為忠信果為姦回若以此獲美官則姦囘之臣欲求進身者將何所不為恐非陛下之利也自古以來惟英明之主能知此理伏望陛下追還廣淵恩命仍嚴加竄謫以懲憸巧之臣用心不一者取進止傳家集巻三十三欽定四庫全書傳家集巻三十四宋司馬光撰章奏十七乞罷陜西義勇劄子治平元年十一月二十二日上臣傳聞朝廷差陜西提㸃刑獄陳安石於本路人户三丁之内刺一丁充義勇不知虛實若果如此大爲非便臣竊意議者必以爲河北河東皆有義勇而陜西獨無近因趙諒祚寇邉故欲廣籍民兵以備緩急使之捍禦也臣伏見康定慶厯之際趙元昊叛亂王師屢敗死者動以萬數國家乏少正軍遂籍陜西之民三丁之内選一丁以爲鄉弓手尋又刺充保捷指揮差於㳂邉戍守當是之時閭里之間惶擾愁怨不可勝言耕桑之民不習戰鬭官中既費衣粮私家又須供送骨肉流離田園盪盡陜西之民比屋凋殘至今二十餘年終不復舊者皆以此也其謀策之失亦足以爲戒矣是時河北河東邉事稍緩故朝廷但籍其民以充義勇更不刺爲軍雖比之陜西保捷爲害差小然國家何甞使之捍禦戎狄得其分毫之益乎今議者但怪陜西獨無義勇不知陜西之民三丁之内已有一丁充保捷矣自西事以来陜西困於科調比於景祐以前民力減耗三分之二加之近嵗屢遭凶歉今秋方獲小稔且望息肩又值邉鄙有警衆心已揺若更聞此詔下必大致驚擾人人愁苦一如康定慶厯之時是賊寇未来而先自困弊也况即日陜西正軍甚多不至闕乏何爲遽作此有害無益之事以循覆車之轍也伏望朝廷審察利害特罷此事誠一方之大幸取進止乞罷陜西義勇第二上殿劄子臣近曽上言乞罷刺陜西義勇事未審朝廷曽與不曽别爲商量臣前次上殿乞陛下留意備邉所謂備者非但添屯軍馬積貯糧草而已在於擇將帥而修軍政今將帥不才者未聞有所更改軍政頺弊者未聞有所振舉而忽取腹内州軍之民盡刺以爲兵外人聞之無不駭愕今陜西沿邉正軍動以萬數朝廷若能擇有方略膽勇之人以爲將帥使之簡去疲弱選取精鋭勤加教習明行賞罰則雖欲取銀夏而税其地擒趙諒祚而制其命有何所難况但止其鈔盗乎今朝廷不孜孜以將帥軍政爲急而無故籍耕桑之民使之執兵徒有驚擾而實無所用臣不知誰爲陛下畫此策也昔康定慶厯之間朝廷以元昊犯邉官軍不利已曽籍陜西之民以爲鄉弓手始者明出勅牓云但欲使之守䕶鄉里必不刺充正軍屯戍邉境牓猶未収而朝廷盡刺充保捷指揮令於邉州屯戍當是之時臣丁憂在陜備見其事民皆生長太平不識金革一旦調發爲兵自陜以西閭閻之間如人人有喪户户被掠號哭之聲彌天亘野天地爲之慘悽日月爲之無色往往迯避於外官中縶其父母妻子急加追捕鬻賣田園以充購賞暨刺面之後人貟教頭利其家富百端誅剥衣糧不足以自贍須至取於私家或屯戍在邉則更須千里供送祖父財産日銷月鑠以至於盡况其平生所習者惟桑麻耒耜至於甲胄弩槊雖日加教閱不免生疎而又資性戇愚加之畏懦臨敵之際得便即思退走不惟自喪其身兼更拽動大陣自後官中知其無用遂大加沙汰給與公憑放令逐便而惰游已乆不復肯服稼穡之勞兼田産已空無所復歸皆流落凍餒不知所在長老至今言之猶長歎出涕其爲失策較然可知足以爲後来之戒而不足以爲法也今朝廷雖云所籍之民止刺手背農隙之時委州縣召集教閲只在鄉里不令戍邉而民間懲往年之事必大興訛言互相驚擾朝廷號令失信前後已多雖州縣之吏徧至民家面加曉諭亦終不肯信逃亡避匿刑獄必繁怨嗟之聲周徧一方足以動揺羣心感傷和氣若使分毫有益於國亦無所顧此有害無益顯然明白近在目前設使教習得成一旦諒祚大舉入寇邉臣不能捍禦而使之深入三輔東過潼闗乃欲驅此烏合村民以拒之不亦難乎此適足以取戎狄之笑而已伏望陛下軫念生民深察得失其刺義勇事早賜寢罷取進止乞罷刺陜西義勇第三劄子臣累日前方聞朝廷有指揮令陜西路揀鄉村百姓充義勇臣即時有奏劄子言其非便昨日又上殿具劄子面有敷陳奉聖㫖令送中書樞宻院商量臣到中書樞宻院方知此事擬議已久勅下本路已近旬日臣耳目疎淺聞之後時不能先事進言是臣之罪然臣聞之易曰不逺復無祗悔元吉説命曰無恥過作非今雖勅命已下若追而止之猶勝於遂行不顧不可避反汗之嫌而蹈迷復之凶也百姓一經刺手則終身羈縻不得左右人情畏憚不言可知康定年中㨂差鄉弓手時元不刺手後至慶厯年中刺充保捷之時冨有之家猶得多用錢財雇召壯健之人充替今一切皆刺其手則是十餘萬無罪之人永充軍籍不得復爲平民其爲害民尤甚於康定之時也臣竊料即今陜西之民已狼狽驚擾不聊生矣若朝廷晏然坐而視之曽不憫恤使赤子嗷嗷何所告訴爲民父母者固當如是乎古者國有大事謀及卿士謀及庶人謀及卜筮今籍一路之民以爲兵可謂大事矣而兩府之外朝士大夫無一人知者一旦勅書既下急如星火嚴如雷霆誰暇問其端倪况敢言其非也臣以備位諫官既聞之後不可畏避死亡不爲陛下力言之若又棄忽其言不爲改更則是今後朝廷號令有過誤者終不可復救也如此則恐非國家之福臣愚伏望聖慈速降指揮下陜西路其義勇且未得㨂刺别聴候朝廷指揮然後慱延卿士大夫更熟議其可否果然有利於國無害於民徐復行之何晩之有取進止
