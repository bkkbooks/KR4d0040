  hash: sha256:658605835bfc7ff8ff2387ba751bb7ad6b056a67df75dd0366ecbd4ecdb36c76
body:
  text: 贈書心經後贈紹鑒元豐五年十二月十三日作余嘗聞學佛者言佛書入中國經律論三藏合五千四十八巻般若經獨居六百巻學者撮其要為心經一巻為之注者鄭預最簡而明余讀鄭注乃知佛書之要盡於空一字而已或問揚子人有齊死生同貧富等貴賤何如揚子曰作此者其有懼乎此經云照見五藴皆空度一切苦厄似與揚子同指然則釋老之道皆宜為憂患之用乎世稱韓文公不喜佛常排之余觀其與孟尚書書論大顛云能以理自勝不為事物侵亂乃知文公於書無所不觀盖嘗徧觀佛書取其精粹而排其糟粕耳不然何以知不為事物侵亂為學佛者所先邪今之學佛者自言得佛心作佛事然皆不免侵亂於事物則其人果何如哉西京僧官凡六員曰録曰首座曰副首座左右街各一有缺則選僧之有行業者補之又缺則以次上遷逮左録而止崇徳僧紹鑒既為左首座矣會足有㣲疾乃嘆曰吾弃家為僧固求自安逸今已病而猶自勤於僧職豈吾本心哉即投牒自請解去時左録新物故其徒皆止之以為宜待次補鑒不聴既解去明日右録亦物故補其處者乃位於鑒下之人也其徒皆為之恨鑒處之恬然噫鑒儻不知事物之空能如是乎鄭經刻石於天寳末今頗刓缺余賢鑒能不以所重易所輕且欲勸之俾全其所得乃命吏好冩一通以贈之諭諭若訥熈寧五年熈寧六年冬光在洛陽有衢州僧若訥袖書來見曰仁宗皇帝時得召對成化殿命講所學經且作頌三篇上甚喜後數日中使賜若訥紫衣辭曰臣所為不逺千里求見明主者欲獻其所學庶幾廣之於天下今陛下乃賜臣紫衣非臣志也臣不敢奉詔使者三返終辭不受上乃飛白安净二字以賜若訥若訥然後舉首加額受而藏之若訥野僧也生江湖間一旦萬乗之主召入禁中而訪所學授以二字盖師號之類也天下僧受師號者何可勝紀有能親屈帝筆如若訥之光榮者乎若訥是以不敢忘先帝不貲之恩思有以報之向聚吾師所述之經五千餘巻合為一藏名曰報恩經藏徧請朝廷輔佐之臣譔文書石瑑而立之今又將刻所賜二字於石以傳于後子為我序其事而記之光謝之曰光儒者素不習釋氏書將何以發明上人之學與受賜之由且文辭鄙陋何敢輙寓名諸公之末自陷不知量之罪乎若訥固請不已曰若訥去冬已嘗犯寒至洛值子西適秦不克見而返今兹復來非有他求欲得文而已若訥豈不知朝廷貴人及四方能文者甚衆欲為斯記者亦不鮮若訥皆不願得而唯子之求何子拒我之深乎光甚愧其言因諭之曰上人之志於光勤且厚如此光敢無辭以為復抑仁宗皇帝既嘉上人不受命服賜以二字豈師號之謂邪盖以褒勸上人之徳也上人亦嘗深思其指乎夫安净徳之美者也既曰安矣則於物宜無求既曰净矣則物不得而間之是故安如磐石雖加减萬鈞不為之低昻净如清水有一毫入之則累矣上人既能知先帝之大恩當謹守聖言而力行之以無負先帝之所期乃所以報也經藏奚為哉况光之文又足求邪訓訓儉示康吾本寒家世以清白相承吾性不喜華靡自為乳兒長者加以金銀華美之服輙羞赧弃去之二十忝科名聞喜宴獨不戴花同年曰君賜不可違也乃簮一花平生衣取蔽寒食取充腹亦不敢服垢弊以矯俗干名但順吾性而已衆人皆以奢靡為榮吾心獨以儉素為美人皆嗤吾固陋吾不以為病應之曰孔子稱與其不遜也寧固又曰以約失之者鮮矣又曰士志於道而恥惡衣惡食者未足與議也古人以儉為美徳今人乃以儉相詬病嘻異哉近歲風俗尤為侈靡走卒類士服農夫躡絲履吾記天聖中先公為羣牧判官客至未嘗不置酒或三行五行多不過七行酒沾於市果止於梨栗棗柿之類殽止於脯醢菜羮器用甆漆當時士大夫家皆然人不相非也會數而禮勤物薄而情厚近日士大夫家酒非内法果殽非逺方珍異食非多品器皿非滿案不敢會賔友常數日營聚然後敢發書苟或不然人争非之以為鄙吝故不隨俗靡者盖鮮矣嗟乎風俗頺弊如是居位者雖不能禁忍助之乎又聞昔李文靖公為相治居第於封邱門内㕔事前僅容旋馬或言其太隘公笑曰居第當傳子孫此為宰相㕔事誠隘為太祝奉禮㕔事已寛矣參政魯公為諫官真宗遣使急召之得於酒家既入問其所來以實對上曰卿為清望官柰何飲於酒肆對曰臣家貧客至無器皿殽果故就酒家觴之上以其無隱益重之張文節為相自奉飬如為河陽掌書記時所親或規之曰公今受俸不少而乃自奉若此公雖自信清約外人頗有公孫布被之譏公宜少從衆公嘆曰吾今日之俸雖舉家錦衣玉食何患不能顧人之常情由儉入奢易由奢入儉難吾今日之俸豈能常有身豈能常存一旦異於今日家人習奢已久不能頓儉必致失所豈若吾居位去位身在身亡常如一日乎嗚呼大賢之深謀逺慮豈庸人所及哉御孫曰儉徳之共也侈惡之大也共同也言有徳者皆由儉來也夫儉則寡欲君子寡欲則不役於物可以直道而行小人寡欲則能謹身節用逺罪豐家故曰儉徳之共也侈則多欲君子多欲則貪慕富貴枉道速禍小人多欲則多求妄用敗家喪身是以居官必賄居鄉必盗故曰侈惡之大也昔正考父饘鬻以餬口孟僖子知其後必有達人季文子相三君妾不衣帛馬不食粟君子以為忠管仲鏤簋朱紘山楶藻梲孔子鄙其小器公叔文子享衞靈公史鰌知其及禍及戍果以富得罪出亡何曽日食萬錢至孫以驕溢傾家石崇以奢靡誇人卒以此死東市近世冦莱公豪侈冠一時然以功業大人莫之非子孫習其家風今多窮困其餘以儉立名以侈自敗者多矣不可徧數聊舉數人以訓汝汝非徒身當服行當以訓汝子孫使知前輩之風俗云傳家集巻六十七欽定四庫全書傳家集巻六十八宋司馬光撰序一百官表總序四海至廣雖聖人不能獨治萬機至衆雖聖人不能徧知是故設官以分其事量能而授之任自生民以來有國家者莫之能易也唐虞夏商尚矣周官具存粲然大備降及秦漢迄于隋唐雖不能如三代之粹美然上下相維皆有條緒孔子稱惟器與名不可以假人又曰必也正名乎名之宜正者無若百官唐初職事官有六省一臺九寺三監十六衞十率府之屬其外又有勲官散官勲官以賞戰功散官以褒勤舊故必折馘執俘然後賜勲積資累考然後進階以其不可妄得故當時人以為榮及髙宗東封武后預政欲求媚於衆始有汎階自是品秩寖訛朱紫日繁矣肅宗之後四方糜沸兵革不息財力屈竭勲官不足以勸武功府庫不足以募戰士遂并職事官通用為賞不復選材無所愛吝將帥出征者皆給空名告身自開府至郎將聼臨事注名後又聴以信牒授人有至異姓王者於是金帛重而官爵輕矣或以大將軍告身纔易一醉其濫如此重以藩方䟦扈朝廷畏之窮極褒寵苟求姑息遂有朝編卒伍暮擁節旄夕解緹衣旦紆公衮者矣流及五代等衰益紊三公端揆之貴施於軍校衣紫執象之榮被於胥史名器之亂無此為甚大宋受命承其餘弊方綱紀大基未暇釐正故臺省寺監衞率之官止以辨班列之崇卑制廪祿之厚薄多無職業其所謂官者乃古之爵也所謂差遣者乃古之官也所謂職者乃古之加官也自餘功臣檢校官散官階勲爵邑徒為煩文人不復貴凡朝廷所以鼓舞羣倫緝熈庶績者曰官曰差遣曰職而已於三者之中復有名同實異交錯難知又遷徙去來常無虚日欲觀其大畧故自建隆以來文官知雜御史以上武官閤門使以上内臣押班以上遷除黜免刪其煩冗存其要實以倫類相從以先後相次為百官公卿表云河南志序元豐六年作周官有職方土訓誦訓之職掌道四方九州之事物以詔王知其利害後世學者為書以述地里亦其遺法也唐麗正殿直學士韋述為兩京記近故龍圖閣直學士宋君敏求字次道演之為河南長安志凡其廢興遷徙及宫室城郭坊市第舎縣鎮鄉里山川津梁亭驛廟寺陵墓之名數與古先之遺迹人物之俊秀守令之良能花卉之殊尤無不備載考諸韋記其詳不啻十餘倍開編粲然如指諸掌真慱物之書也次道性嗜學先正宣獻公蓄書三萬巻次道自毁齒至于白首從事其間未嘗一日捨置故其見聞博洽當時罕倫又閑習國家故事公私有疑咸往質焉又喜著書如唐書仁宗實録國史會要集注史記之類與衆共之或專脩而未成者皆不計外其手自纂述已成者凡四百五十巻盖昔人所著未有若此其多也次道既沒太尉潞公留守西京其子慶曽等奉河南志以請於公曰先人昔嘗佐此府叙其事尤詳惜其傳於世者甚鮮願因公刻印以廣之豈徒先人䝉不朽之賜於泉壌抑亦使四方之人未嘗至洛者得之如遊處已熟後世聞今日洛都之盛者得之如身逢目睹也幸公留意公從之且命光為之序光於次道友人也烏敢以固陋而辭劉道原十國紀年序皇祐初光為貢院屬官時有詔士能講觧經義者聴别奏名應詔者數十人趙周翰為侍講知貢舉問以春秋禮記大義其中一人所對最精詳先具注䟽次引先儒異説末以已意論而斷之凡二十問所對皆然主司驚異擢為第一及發糊名乃進士劉恕年十八矣光以是慕重之始與相識道原乃其字也道原是嵗賦詩論䇿亦入髙等殿試不中格更下國子監試講經復第一釋褐鉅鹿主簿遷和川令陸介夫為廣西帥奏掌機宜前世史自太史公所記下至周顯徳之末簡䇿極博而於科舉非所急故近歲學者多不讀鮮有能道之者獨道原篤好之為人强記紀傳之外閭里所録私記雜説無所不覽坐聴其談衮衮無窮上下數千載之細大之事如指掌皆有稽據可驗令人不覺心服英宗皇帝雅好稽古欲徧觀前世行事得失以為龜鑑光承乏侍臣嘗從容奏舊史文繁自布衣之士鮮能該通况天子一日萬機誠無暇周覧乞自戰國以還訖于顯徳凡闗國家之興衰繫衆庶之休戚善可為法惡可為戒者詮次為編年一書刪其浮長之辭庶於奏御差便上甚喜尋詔光編次歴代君臣事迹仍謂光曰卿自擇館閣英才共脩之光對曰館閣文學之士誠多至於専精史學臣未得而知所知者惟和川令劉恕一人而已上曰善退即奏召之與共脩書凡數年間史事之紛錯難治者則以諉之道原光䝉成而已今上即位更命其書曰資治通鑑王介甫與道原有舊深愛其才熈寧中介甫參大政欲引道原脩三司條例道原固辭以不習金穀之事因言天子方屬公以政事宜恢張堯舜之道以佐明主不應以財利為先介甫雖不能用亦未之怒道原嘗見之輙盡誠規益及吕獻可得罪知鄧州道原往見介甫曰公所以致人言盖亦有所未思因為條陳所更法令不合衆心者宜復其舊則議論自息介甫大怒遂與之絶未幾光出知永興軍道原曰我以直道忤執政今官長復去我何以自安且吾親老不可久留京師即奏乞監南康軍酒得之光尋判西京留臺奏遷書局於洛陽後數年道原奏請身詣光議脩書事朝廷許之道原水陸行數千里至洛陽自言比氣羸憊必病且死恐不復得再見留數月而歸未至家遭母䘮俄得風疾右手足偏廢伏枕再朞痛苦備至每呻吟之隙輙取書脩之病益篤乃束書歸之局中以元豐元年九月戊戌終官至秘書丞年止四十七嗟乎以道原之耿介其不容於人齟齬以沒固宜天何為復病而夭之邪此益使人痛惋惝怳而不能忘者也道原嗜學方其讀書家人呼之食至羮炙冷而不顧夜則卧思古今或不寐達旦在和川時以公事適野見劉聰太宰劉雄碑嘉平五年始改建元正舊史之失在洛陽與光偕如萬安山道旁有碑讀之乃五代列將人所不稱道者道原即能言其行事始終歸驗於舊史信然宋次道知亳州家多書道原枉道就借觀之次道日具酒饌為主人禮道原曰此非吾所為來也殊廢吾事願悉撤去獨閉門晝夜讀且抄留旬日盡其書而去目為之翳道原致疾亦由學之苦邪方介甫用事呼吸成禍福凡有施置舉天下莫能奪髙論之士始異而終附之面譽而背毁之口服而心非之者比肩是也道原獨奮厲不顧直指其事是曰是非曰非或面刺介甫至變色如鐵或稠人廣坐介甫之人滿側道原公議其得失無所隠惡之者側目愛之者寒心至掩耳起避之而道原曽不以為意見質厚者親之如兄弟姦諂者疾之如仇讎由是困窮而終不悔此誠人之所難也昔申棖以多慾不得為剛㣲生髙以乞醯不得為直如道原者可以為剛直之士乎道原家貧至無以給㫖甘一毫不妄取於人其自洛陽南歸也時已十月無寒具光以衣襪一二事及舊貂褥贐之固辭強與之行及潁州悉封而返之於光而不受於他人可知矣尤不信浮屠説以為必無是事曰人如居逆旅一物不可乏去則盡棄之矣豈得齎以自隨哉可謂知之明而决之勇矣道原好著書志欲籠絡宇宙而無所遺不幸早夭其成者十國紀年四十二巻包羲至周厲王疑年譜共和至熈寧年畧譜各一巻資治通鑑外紀十巻餘皆未成其成者亦未以傳人曰今栁芳唐厯本皆不同由芳書未成而傳之故也期於瞑目然後傳病亟猶汲汲借人書以參校已之書是非其失氣垂盡乃口授其子羲仲為書屬光使譔埋銘及十國紀年序且曰始欲諸國各作百官及藩鎮表未能就幸於序中言之光不為人譔銘文已累年所拒且數十家非不知道原託我之厚而不獲承命悲愧尤深故序平生所知道原之美附於其書以傳來世道原自言其先萬年人六世祖度唐末明經及第為臨川令卒官遇亂不能歸遂葬髙安因家焉南唐以髙安為筠州今為筠州人父煥字凝之進士及第為潁上令不能屈節事上官年五十棄官家廬山之陽且三十年矣人服其髙歐陽永叔作廬山髙以美之今為屯田員外郎致仕云名苑序慶厯九年作孔子稱名不正則言不順言不順則事不成乃至於百姓無所措手足甚矣聖人重名之至也劉子政述九流有名家者流曰尹文子公孫龍子等凡七家尹文子今存其術雜黄老刑名之言耳餘書更歴久逺世鮮傳之今有孫氏釋名盖亦其類也昔者魯哀公問社於宰我宰我對曰周人以栗曰使民戰栗孔子聞之深非之曰成事不說遂事不諫既往不咎戒其後復為也兩漢以來儒者務為此態旁貫曲取紆辭蔓説至有依聲襲韻強為立理誠可閔笑者甚衆此非宰我栗社之比邪今釋名之文亦猶是矣抑亦失聖人之㫖逺哉愚嘗念之久矣間因觀經傳諸書有可以正名者因記之竊以為備萬物之體用者無過於字包衆字之形聲者無過於韻今以集韻本為正先以平上去入衆韻正其聲次以說文解字正其形次以訓詁同異辯其理次以經傳諸書之言證其實命曰名苑其有法制云為時遷物變者亦畧叙其㳂革欲人知其源流變態云爾至於魚蟲草木之類雖纎苛煩碎非慷慨君子所當用心然亦重名之一節爾至於三才道徳禮樂善惡真偽之名輔佐世治其功亦不細哉所謂文武之道未墜於地在人賢者識其大者不賢者識其小者將來君子好學樂道庶幾亦有取焉古文孝經指解序聖人言則為經動則為法故孔子與曽參論孝而門人書之謂之孝經及傳授滋久章句漫差孔氏之人畏其流蕩失真故取其先世定本雜虞夏商周之書及論語藏諸壁中苟使人或知之則旋踵散失故雖子孫不以告也遭秦滅學天下之書掃地無遺漢興河間人顔芝之子得孝經十八章儒者相與傳之是為今文及魯恭王壊孔子宅而古文始出凡二十二章當是之時今文之學已盛故古文排擯不得列於學宫獨孔安國及後漢馬融為之傳諸儒黨同疾異信偽疑真是以歴載累百而孤學沉厭人無知者隋開皇中祕書學士王逸於陳人處得之河間劉炫為之作稽疑一篇将以興墜起廢而時人已多譏笑之者及唐明皇開元中詔議孔鄭二家劉知幾以為宜行孔廢鄭於是諸儒争難蠭起卒行鄭學及明皇自注遂用十八章為定先儒皆以為孔氏避秦禁而藏書臣竊疑其不然何則秦世科斗之書廢絶已久又始皇三十四年始下焚書之令距漢興纔七年耳孔氏子孫豈容悉無知者必待恭王然後廼出盖始藏之時去聖未逺其書最真與夫他國之人轉相傳授歴世踈逺者誠不侔矣且孝經與尚書俱出壁中今人皆知尚書之真而疑孝經之偽是何異信膾之可㗖而疑炙之不可食也嗟乎真偽之明皦若日月而歴世爭論不能自伸其中異同不多然要為得正此學者所當重惜也前世中孝經多者五十餘家少者亦不減十家今秘閣所藏止有鄭氏明皇及古文三家而已其古文有經無傳案孔安國以古文時無通者故以𨽻體冩尚書而傳之然則論語孝經不得獨用古文此盖後世好事者用孔氏傳本更以古文寫之其文則非其語則是也夫聖人之經髙深幽逺固非一人所能獨了是以前世並存百家之說使明者擇焉所以廣思慮重經術也臣愚雖不足以度越前人之胷臆闚望先聖之藩籬至於時有所見亦各言爾志之義是敢輙以𨽻寫古文為之指解其今文舊注有未盡者引而伸之其不合者易而去之亦未知此之為是而彼之為非然經猶的也一人射之不若衆人射之其為取中多也臣不敢避狂僣之罪而庶幾於先王之道萬一有所禆焉洛陽􅂄英會序元豐五年正月作昔白樂天在洛與髙年者八人遊時人慕之為九老圖傳於世宋興洛中諸公繼而為之者凡再矣皆圖形普明僧舍普明樂天之故第也元豐中潞國文公留守西都韓國富公納政在里第自餘士大夫以老自逸於洛者於時為多潞公謂韓公曰凡所為慕於樂天者以其志趣髙逸也奚必數與地之襲焉一旦悉集士大夫老而賢者於韓公之第置酒相樂賔主凡十有一人既而圖形妙覺僧舍時人謂之洛陽􅂄英㑹孔子曰好賢如緇衣取其敝又改為樂善無厭也二公寅亮三朝為國元老入賛萬機出綏四方上則固社稷尊宗廟下則熈百工和萬民天子腹心股肱耳目天下所取安所取平其勲業閎大顯融豈樂天所能庶幾然猶慕效樂天所為汲汲如恐弗及豈非樂善無厭者與又洛中舊俗燕私相聚尚齒不尚官自樂天之㑹已然是日復行之斯乃風化之本可頌也宣徽工公方留守北都聞之以書請於潞公曰某亦家洛位與年不居數客之後顧以官守不得執巵酒在坐席良以為恨願寓名其間幸無我遺其為諸公嘉羡如此光未及七十用狄監盧尹故事亦預於㑹潞公命光序其事不敢辭時五年正月壬辰端明殿學士兼翰林侍讀學士太中大夫提舉崇福宫司馬光序開府儀同三司守司徒武寧軍節度使致仕韓國公富弼字彦國年七十九河東節度使開府儀同三司守太尉判河南府兼西京留守司事潞國公文彦愽字寛夫年七十七司封郎中致仕席汝言字君從年七十七太常少卿致仕王尚宫字安之年七十六太常少卿致仕趙丙字南正年七十五秘書監致仕劉凡字伯壽年七十五衞州防禦使致仕馮行己字肅之年七十五太中大夫充天章閣待制提舉崇福宫樊建中字正叔年七十三司農少卿致仕王謹言字不疑年七十五太中大夫提舉崇福宫張問字昌言年七十一龍圖閣直學士通議大夫提舉崇福宫張夀字景元年七十傳家集巻六十八欽定四庫全書傳家集卷六十九宋司馬光撰序二顔太初雜文序寳元二年作天下之不尚儒乆矣今世之士大夫發言必自稱曰儒儒者果何如哉髙冠博帶廣袂之衣謂之儒耶執簡伏冊呻吟不息謂之儒耶又况㸃墨濡翰織製綺組之文以稱儒亦逺矣捨此勿言至於西漢之公孫丞相蕭望之張禹孔光東漢之歐陽歙張酺胡廣世之所謂大儒果足以充儒之名乎魯人顔太初字醇之常憤其然讀先王之書不治章句必求其理而己矣既得其理不徒誦之以誇誑於人必也蹈而行之在其身與郷黨無餘於其外則不光不光先王之道猶翳如也廼求天下國家政理風俗之得失為詩謌洎文以宣暢之景祐初青州牧有以荒滛放蕩為事慕嵇康阮籍之為人當時四方士大夫樂其無名教之拘翕然效之寖以成風太初惡其為大亂風俗之本作東州逸黨詩以刺之詩遂上聞天子亟治牧罪又有鄆州牧怒屬令之清直與已異者誣以罪榜掠死獄中妻子弱不能自訴太初素與令善憐其寃死作哭友人詩牧亦坐是廢於時或薦太初博學有文詔用為國子監直講㑹有御史素不善太初者上言太初狂狷不可任學官詔即行所至改除河中府臨晋主簿太初為人實寛良有治行非狂人也自臨晋改應天府户曹掌南京學卒於睢陽舊制判司簿尉四者無殿負例為令録雖愚懦昏耄無所取者積以年數必得之而太初才識如此舉進士解褐近十年卒不得脱判司簿尉之列以終身死時盖年四十餘噫天喪儒者使必至於大壊乎将犬吠所怪楘楘者必見鋤也何其仕與壽兩窮如此世人見太初官職不能動人又其文多指訐有疵病者所惡聞雖得其文不甚重之故所弃失居多余止得其兩巻在同州又得其所為題名記今集而序之前世之士身不顯於時而言立於後世者多矣太初雖賤而夭其文豈必不傳異日有見之者觀其後車詩則不忘鑒戒矣觀其逸黨詩則禮義不壊矣觀其哭友人詩則酷吏愧心矣觀其同州題名記則守長知弊政矣觀其望仙驛記則守長不事厨傳矣由是言之為益豈不厚哉吕獻可章奏集序熈寕五年八月二十九日作歐陽觀文有言士學古懐道者仕於時不得為宰相必為諫官諫官與宰相等坐乎廟堂之上與天子論可否者宰相也立乎殿陛之前與天子争是非者諫官也宰相九卿而下失職者受責於有司諫官失職者取譏於君子有司之法行乎一時君子之譏著之䇿書而昭明垂之百世而不泯誠哉是言也然士之居其任果能不失職者亦鮮矣獻可為臺諫官前後凡若干年遇黜者三皆以彈奏執政確切不己天子重傷大臣意不得己而黜之其直聲赫然振動天下自餘百官之愆違政事之闕失苟與之同時無彊弱大小知無不言言無不盡如獻可者於其職業可謂無所愧負矣古之人稱死而不朽者如臧文仲既沒其言立是也然文仲之言傳於今者無㡬盖時人不能存録遂使遺逸豈不惜哉光於獻可沗備僚友獻可平生造膝之言固不可得而聞今既沒其子曰庾等捜求章奏遺槀得二百餘篇光請而序之俾後之人察其言足以知獻可之心然則獻可身雖沒其心長存也嗚呼獻可以直道自立始終無缺而官止於諫議大夫年止五十八彼不以其道得者或位極将相壽及胡耉從愚者視之則可為憤邑從賢者視之以此况彼所得所失孰為多少邪後之人得是書者宜寳蓄之當官事君苟能效其一二斯為偉人矣龐相國清風集略後序公之勲業治行范景仁所為清風集叙言之詳矣公性喜詩雖相府機務之繁邉庭軍旅之急未嘗一日置不為凡所以怡神養志及逢時值事一寓之於詩其髙深閎逺之趣固非庸淺所可及至於用事精當偶對的切雖古人能者殆無以過及疾亟光時為諫官有謁禁走手啓參候公猶録詩十餘篇相示手注其後曰欲令吾弟知老夫病中尚有此意思耳字已慘澹難識後數日而薨曏者嗣子某字􅅷賢巳集其文為五十巻既而以文字之多懼世人傳者不能廣也又選詩之尤善者凡千篇為十巻命曰清風集略刻板摹之命光繼叙其事嗚呼公之善在人者旁施四海後垂無窮如詩乃公之餘事耳懋賢猶務其傳勤勤恐不逮况其大者乎公之積慶宜有繼哉時年月日門人涑水司馬光序薛宻學田詩集序元豊八年作揚子法言曰言心聲也書心畫也聲畫之美者無如文文之精者無如詩詩者志之所之也然則觀其詩其人之心可見矣今人親沒則畫像而事之畫像外貌也豈若詩之見其中心哉故樞宻直學士贈太尉薛公以文學政事顯於真宗仁宗之際其所施設見於國史及宋宣獻公所為神道碑此不詳書公既薨五十餘年少子中㪚大夫致仕俅集公詩二百二章以授光俾之譔序且為之名昔先人為郫尉公為轉運使知待甚厚薦之於朝光雖不肖其敢忘諸是以雖不文不敢辭謹按薛氏自姚秦以來世有偉人仕公卿将相行能功業光照簡冊號稱甲族迄於今不衰豈非河汾勝氣獨鍾於一門乎然而枝葉因遊宦多散之四方惟公一族留不去猶居河東請名之曰河汾集庶㡬子子孫孫繼公之志常保守奉事則而象之以傳慶於無窮也元豐八年三月丁未涑水司馬光序趙朝議丙文槀集在心為志發口為言言之美者為文文之美者為詩如鼓鐘者聲必聞於外灼龜者兆必見於表玉藴石而山木茂珠居淵而岸草榮皆物理自然雖欲揜之不可得巳朝議大夫致仕趙君南正善屬文尤嗜為詩自初仕至歸老聚其槀凡十四編一旦走僕負之以書屬光為之序光實何人克膺兹任然嘗聞同僚楚正叔之言曰予與南正同登進士第又同居潁陽熟其為人其清白耿介佗人殆難能也今閲其文槀味其言求其志乃知正叔信不我欺而南正所守良可尚也噫世人有得南正文槀而觀之雖未之識如自少至老日與之遊矣元豐八年三月十一日丁未涑水司馬光序馮亞詩集序文章之精者盡在於詩觀人文徒觀其詩斯知其才之逺近矣陜人馮亞字希顔學詩於處士魏野偏得其道潘逍遥深重之未四十而終魏詩大行於時亞詩去魏不逺而所傳者郷曲而巳所以然者由魏之壽亞之夭歟家公知杭州亞子噩以其先人詩集請因杭工刻諸板而傳之余以世俗不能識真貴於難得而賤於飽聞不若蔵之於家有同志者就而寫之則雖欲勿傳安得不傳若刻之於版有不知文者或敢譏評其否臧衆心無常從而和之是隕夫子之盛名不果刻序而歸之王内翰贈商雒龐主簿詩後序王詩云織女峯前貧主簿黄姑巖下舊詞臣乆棲枳棘方思替謾戴貂蟬不是真六里青山雲簇簇一條丹水石磷磷春來䰟夢應相似同是帝城南畔人至道初今觀文殿大學士始平公先君子贈中書令㫺為主簿商雒王公時自中書舎人謫官商州王公以文章獨歩當世乆宦巳通顯於朝加之剛簡峭直固不妄與人交然令君以九品官與相往來王公贈詩意好欵宻則令君為人可知巳至和初始平公以前相國在鄆從容出王公詩示光曰先君嘗有徳於商雒吏民至今思之其辭牒判署猶有寳蓄存者而况今守商州為我刻王公之詩於商雒以慰吏民之心光曰諾退而序其事并詩往刻焉并州學規後序嘉祐二年作天下所以化在於學百官所以治在於法然則學為化原法為治本兹二者又可忽歟前牧韓公既徙學而廣之又取法於大學及河南大名京兆府蘇州除苛補漏以為新規今牧龐公懼學者寖乆而寖忘之也廼命刻著於石嗚呼是規也存雖屋不加多食不加豐生徒不加衆猶為學興也是規也亡雖列屋萬區糗粻如陵生徒如雲猶為學廢也後之人司是學者可不慎與張共字大成序嘉祐元年為越州張推官作天下之事未嘗不敗於專而成於共專則隘隘則睽睽則窮共則愽博則通通則成故君子脩身治心則與人共其道興事立業則與人共其功道隆功著則與人共其名志得欲從則與人共其利是以道無不明功無不成名無不榮利無不長小人則不然專巳之道而不能從善服義以自廣也專巳之功而不能任賢與能以自大也專巳之名而日恐人之勝之也專巳之利而不欲人之有之也是以道不免於蔽文不免於楛名不免於辱利不免於亡此二者君子小人之大分也陜郡張君名共才甚美行甚脩舉進士登上科今從事於浙東光辱與張君為同郡人習其為人固乆竊以為古者名於親而字於朋友字必附名而為義焉光是敢輒廣其名之義而字曰大成以勉之異日張君克充其名顯裕光大庸可量哉諸兄子字序皇祐二年作余兄子十四人大抵未字皇祐二年告歸過家徧為之字皆附其名以寓訓焉京字亢宗京大也孟子曰天爵脩而人爵從之爾姑大其徳乎然後宗有所亢矣亮字信之孔子稱去食去兵而信不可去信者行之本也禀字從之從順也君子在家則禀於親出則禀於君無所不用其順焉夫順者天之所助也元字茂善元者善之長也勉善不巳能無長乎育字􅛱之致中和天地位焉萬物育焉况其邇者乎良字希祖詩云毋念爾祖聿脩厥徳君子脩徳以為祖也可不勉乎富字希道智者富於道愚者富於賄爾其勉於智乎齊字居徳齊中也孔子曰中庸之為徳其至矣乎居徳以中奚適而不利哉方字思之方道也孔子曰道不逺人苟思之精行之勤則道何逺之有哉爽字成徳爽明也明敏辯智天之才也中和正直人之徳也天與之才必資人徳以成之與其才勝徳不若徳勝才故願爾勉於徳而已矣衮字補之君子之事上進思盡忠退思補過異日爾仕於朝當以仲山甫為法乎章字晦之君子之道闇然而日章然則欲道之章者其惟晦乎奕字襲美詩云夙興夜寐毋忝爾所生奕世之美将待爾而襲之可不勉歟裔字承之爾於昆弟中為最㓜承祖之美者捨爾尚誰任哉嗚呼朝夕不離於口耳者名字而巳爾曹苟能言其名求其義聞其字念其道庶㡬吾宗其猶不為人後乎序賻禮元豐六年十一月一日作名以位顯行由學成此禮之常若夫身處草野未嘗從學志在為善不求聲利此則尤可尚也近世史氏專取髙官為之傳故閭閻之善人莫之聞喪禮之廢壊乆矣而民間為甚至有初喪親家各具酒肉聚於其家與主人同醉飽者有以鼓樂導喪車者有因喪納婦者相習為常恬不知怪醫助教劉太居親喪獨不飲酒食肉終三年此乃今士大夫所難能也其弟永一尤孝友㢘謹過於人熈寕初巫咸水入夏縣城民溺死者以百數永一執竿立門首有佗人物流入門者輙擿出之有僧寓錢數萬於其室居無何僧自經死永一遽詣縣自陳請以錢歸其弟子郷人負其債乆不償者永一輒毁劵以愧其心其行事類如此有周文粲者其兄嗜酒仰文粲為生兄或時酗毆文粲其鄰人不平而唁之文粲怒曰吾兄未嘗毆我汝何離間吾兄弟也有蘇慶文者事繼母以孝聞嘗語其婦曰汝事吾母小不謹必逐汝繼母少寡而無子由是安其室終身元豐中朝廷脩景靈宫調天下畫工詣京師事畢有詔選試其優者留翰林授官禄有臺亨者名第一以父老固辭歸養於田里此五人與余同縣故余得而知之悲夫天下布衣之士刻志厲行而人莫知者可勝數哉始太之喪其父也余兄弟賻以千錢且為書致之曰禮凡有喪佗人助之珠玉曰含車馬曰賵貨財曰賻衣服曰襚今物雖薄欲人之可繼也乆之太請刻其書於石曰曏也郷人不知有賻禮自太父之喪郷人稍稍行之太欲廣其傳由吾郷以及鄰縣由鄰縣以逹四方使民間皆去弊俗而入於禮豈小補哉余益美其志因諭之曰是書不足刻余竊慕君子樂道人之善請書若兄弟及周文粲蘇慶文臺亨所為以傳於世庶㡬使為善者不以隠㣲而自懈焉元豐六年十一月壬寅朔涑水迂叟序傳家集巻六十九欽定四庫全書傳家集巻七十宋司馬光撰序三送即景微序送同年即兄景微歸會稽榮覲序進士此科見重於時乆矣自兩漢而下選舉之盛無與為比廼至販鬻給役之徒皆知以為美尚是以得之者矜夸滿志焜燿於物如謂天下莫巳若也亦何惑哉賢者居世㑹當蹈仁履義以徳自顯區區外名豈足恃邪即景微與余周旋甚悉余備知之其為人剛不可校柔不可犯和易以為樂節正以為禮由七品官舉進士一上中選可謂美矣然未嘗有偃蹇之容自滿之意或未識者卒然遇之尚不知其為舉人又焉知其有科級邪所謂以徳自顯者殆無過此乎家君與尊諫議景徳中同年登第在朝廷最名相善余又與景微以䕃籍同官偕舉進士送名於天府覆試於南廟以至登第未嘗異處古人有言朋友世親如我比者固不踈矣今将泛舟南下拜親於越謂余必以文序別余識荒陋非不知辭顧以非余無能紀其實美者故直書以贈之時景祐五年季夏司馬光序送李揆之序古者朋友将别必有言以相贈與處也近世多為之序序者其亦贈處之道歟然世俗失之往往崇虚辭相歎譽曽無一言以為規是豈昔人贈處之道哉愚以為朋友之道譽其善規其過專譽而不規路人而聚處飲酒於市道者耳光於揆之非直同官而已實朋友也於其行又可無言以贈之揆之名相子孫聦逹有美才習於時務觀其行能殆無所復擇矣然為之友者猶舉其毛髪之闕而告之誠欲就其全也夫人非至聖必有短非至愚必有長至愚之難值亦猶至聖之不世出也故短長雜者舉世比肩是也是以君子之取人也不求備稱其善不計其惡求其工不責其拙如此故人竭其用而恱從之怨憎不至而功業榮焉然則垢面而險眥操耒而胥靡者尚未可輕辱而易視也禹曰知人則哲惟帝其難之堯禹以為難則凡人安得謂之易人事常不可測夫又詎知操耒者不為阿衡而胥靡者不為傅説若之何其可以心目斷也竊嘗聞之夫智者攘患常於至微著而攘之則無及巳昔智伯一㑹而辱二主一臣以成鑿臺之禍以智伯之強人莫之害失一言於樽爼之際其禍章章如此况無其勢取侮易矣夏書曰一人三失怨豈在明不見是圖足下行矣慎之智或召災敏或賈禍愚不可忽鄙不可侮是皆無損於人不宜於身勉之哉時思鄙言光之贈盡此而已未知足下復何以處我也慶歴乙酉嵗二月庚戍序送李子儀序皇祐三年作寳元中光從事在蘇子儀僑居州下始得從之遊竊嘗與僚友議曰人之裕於才者或􅄶於行豐於行者或歉於才要之不能得兼若子儀者才如是行如是佗日吾屬其敢望乎間二年子儀升進士第名聲暴灼於薦紳間光聞之喜曰所期果不負矣又五年光與子儀俱官太學日夕相從講道甚樂不幸子儀遭先府君憂去職服除來還則光去遷佗官雖不得亟見然慕重其為人常若在旁也皇祐三年丞相文公出鎮許昌士大夫願從後車以自效於幕下者甚衆公無所取獨與子儀俱夫以文公之明且公而子儀獨應其選其不輕而重可知矣論者猶謂子儀不當舎中都遊外方夫玉巨用之則為璧為圭細用之則為環為玦玉能明潔潤澤而巳矣璧與圭環與玦唯工者之所為玉豈能自制哉行矣子儀君子之道猶玉也亦烏適而不見貴乎送孟翺宰宜君序天之所以賜人賢不肖之分曰心智而巳矣故佗可能也心智之叡明強識不肖者竭力無以及焉仲習為夏縣尉封域之内山澤之夷險道途之逺邇邑落之踈宻無不歴歴詳其名數吏卒數百人民踰萬室性行之善惡家貲之豐約居處之里囷倉之數皆能條例而詮次之凡人居官朞嵗不能悉吏卒之名氏而仲習小大畢舉如指諸掌抑可謂叡明而強識矣國家謂親於民事者無若令於三王之世伯子男之職也而以資秩乆次為之甚無謂乃詔二千石舉明逹政事者充其官仲習以是得宜君令夫為政者患於不知民之情偽下之得失上蔽下壅故賞罰糾紛而不治今仲習之精力乃如此以從小邑之政是猶激疾風以振鴻毛委洪波以滅炬火何足言者異日居相府立柱下總天下之圖書承明主之顧問應答如響畫地成圖亦誰得居其右哉戊寅嵗僕與仲習同登進士第辛巳嵗僕以憂去官歸鄉里日從仲習遊睹其強識未嘗不咨嗟駭服故於其行也書以贈之送丁浦江序始僕為児時家於夀之安豐浦江以年少氣雋誦書屬文聞於縣中家之父兄皆祝僕曰佗日得如丁君足矣及壮侍親之呉浦江為椽於潤州州人稱曰丁君為治精敏肅給凡州之僚吏無與比者僕乃知丁君非徒以文自髙又能以政自力信乎其才之周也謂其去此而升美仕若巨河之决駿馬之逸沛然莫之能禦也間九年復相遇於京師則猶服故時藍衫守銓門求一官礥然乆之乃得婺之浦江同時軰流及後來者仕宦率居其右僕然後喟然嘆曰才乎才乎信不足恃者邪抑又聞之天将降大任於是人也必先空乏其身行拂亂其所為浦江近是乎况浦江齒尚壮志尚鋭以斯之才而濟之以無倦則徳業之涯未易前知也於其行聊序以勸之送胡完夫序舜之取士敷納以言明庶以功車服以庸考其言中於道試之事克有功然後用之故能舉十六相恭巳不為而天下大治也近世取士不然一决之以文辭噫文辭豈能盡取士之道邪天下病是乆矣明天子知之廼詔有司自今進士髙第皆先試之小官使知為下之勞而熟於民之疾苦然後察其功而舉之雖置以為卿相無不可者嗚呼此誰發哉乃大舜之業也晋陵胡完夫以進士貢於州試於有司覆於天子之庭第其名未嘗在一二人之後則完夫之文辭可知矣其試於有司也光不佞尸其事得竊觀其論䇿盖非特文辭之美也廼能發明聖人之淵源叶於古而適於今信乎其言能中於道者邪既中於道矣自今日以往天子将又試之以事異日完夫能擴其道以充其言則天子将引而置之卿相之位庶㡬乎元凱之功復見於今日矣嗚呼天子一更法度復古之道其功業之歸廼巍巍如是豈不偉歟噫是道也不難至在完夫勉之而巳矣送通山令郝戭序通山郝明府年四十餘父嘗舉進士老而無成以其志之不獲也雖子登進士第仕至長吏終歉歉不自足明府亦以親之不怡也不以仕為榮乃詣闕上書請致仕而為其親匃一官朝廷雖嘉其意以無故事不之許明府将之官戚戚若受謫者且曰通山道險逺吾親必不肯行将留妻子侍吾親而單車之官至則復請期於成吾志焉明府於光母黨也光聞其言瞿然慙曰嘗聞古之人仕以為親非為身也若明府之仕其真無意於身者邪如光者禄既不及於親而又無補於君役役然耗廩食以飽妻子乆留而不能去得不為君子之罪人邪嗚呼明府誠可頌而礪世人矣嘉祐八年八月十六日涑水司馬光序送李公明序東之李相廸之子治平四年夏龍圖閣直學士工部尚書兼侍讀李公公明得謝於朝以太子少保致仕故事告老者不復謝辭徑歸其家天子謂公明歴事四朝清慎公方進退以禮不可與佗臣比特召入對賜之坐慰勞乆之又特置餞宴於資善堂唯講讀之官及記起居者凡七人得與焉比終宴天子六遣使者存問勸侑加賜白金御茶給優俸又詔以梓宫在殯不欲自為詩凡與宴之官皆命賦詩以寵其行仍别録一通以聞自前世稱告老而榮者莫若漢二踈當是時宣帝不過賜之二十金而巳未聞有恩禮若今之盛者也嗚呼天子之安養耆壽優崇有徳勤厚周宻誠古今所未有也公明少為丞相子長為臺閣顯官迄今老而去位耳目聦明手足輕利諸子為九卿牧守而性皆孝謹洛陽佳園宅此數者又二踈所不能備也然則公明福禄完美顯榮光大亦古今所未有也先皇帝時公明數求致仕未之得光嘗侍坐從容請曰近年雖七十而康寧如是獨不可強為天子少留邪公明曰所貴於致仕者欲及其身之無恙自樂於鄉黨耳必待不任朝謁輿疾而歸是不得巳豈止足之謂邪光忻然服其言益知賢者所存固非庸人所能及也昔先子登進士第先相國為舉首故光於公明兄弟行也資善之㑹光以新去經席不得與焉於其行也僚友復設祖道供張於西郊光又以御史之職不得與焉其恨恨可言邪故聊序其事以為別從表弟右諫議大夫權御史中丞涑水司馬光序傳家集巻七十欽定四庫全書傳家集巻七十一宋司馬光撰記仁宗賜張公御書記皇祐初故右諫議大夫張公為翰林侍讀學士仁宗皇帝謂侍臣曰朕宅帝位㡬三十年天下名儒皆率與之遊自得張某使我日聞所未聞因書紙為博學字命使者即其家賜之當是時國家中外無事天子方嚮藝文同侍殿閣者皆名臣之選無不環觀愧羨莫敢望云公既沒十有六年公之子子瑾字材之将摹著其書於石謂光曰必為之記光曰昔公知滑州光從事於幕下嘗聞公之言曰余平生喜書讀之不啻數十百過其簡編弊矣然毎發之必有新獲之意焉噫公之篤學如此宜其當明主之知為多聞之友受殊常之寵成不朽之名也使曩也先皇帝賞公以萬金於今何有固不若垂一言之褒其為子孫光榮世世無窮也夫知人則哲帝堯之所難仲尼門人以千數獨稱顔淵為好學今材之所為欲以彰先皇帝之知人而揚先公之好學也夫彰君之明忠也揚父之美孝也惟忠與孝材之兩有焉光也雖無文又焉敢無一言以表著其實乎韓魏公祠堂記元豐七年作沒而祠之禮也由漢以來牧守有恵政於民者或為之生祠雖非先王之制皆發於人之去思亦不可廢也然年時寖逺人寖忘之惟唐狄梁公為魏州刺史屬契丹㓂河北梁公省徹戰守之備撫綏彫弊之民民安而虜自退魏人祠之至今血食熈寜初河北水溢地大震官寺民居蕩覆者大半詔以淮南節度使司徒兼侍中韓魏公為河北安撫使判大名府兼北京留守公既愛民如愛子治民如治家去其疾忘巳之疾閔其勞忘已之勞未㡬居者以安流者以還饑者以充乏者以足羣心既和嵗則屢豐在魏五年徙判相州魏人泣涕遮止數日乃得去魏人思公而不得見也相與立祠於熈寜禪院塐公像而事之後二年公薨於相州魏人聞之争奔走哭祠下雲合而雷動連日乃稍息自是毎嵗公生及違世之日皆來致祠作佛事未嘗少懈噫公之徳及一方功施一時者魏人固知之矣至於徳及海内功施後世者亦嘗知之乎公為宰相十年當仁宗之末英宗之初朝廷多故公臨大節處危疑苟利國家知無不為若湍水之赴深壑無所疑憚或諫曰公所為如是誠善萬一蹉跌豈惟身不自保恐家無處所殆非明哲之所尚也公嘆曰此何言也凡為人臣者盡力以事君死生以之顧事之是非何如耳至於成敗天也豈可豫憂其不成遂輟不為哉聞者愧服其忠勇如此故能光輔三后大濟艱難使中外之人餔啜嬉遊自若曽無驚視傾聽竊語之警坐置天下於太寧公之力也嗚呼公與狄梁公皆有恵政於魏故魏人祠之然其為逺近所尊慕年時雖逺而不毁非有大功於社稷為神祗所相佑能如是乎况梁公之功顯天下皆知之魏公之功隠天下或未能盡知也然則魏公不又賢乎宜其與梁公之祠並立於魏享祀無窮公薨後九年魏人以状抵西京俾光為記将刻於石竊惟梁公二記乃李邕馮宿之文光實何人敢不自量顧魏人之美意不可抑又欲以其所未知者諗之故不敢辭陳氏四令祠堂記故左諫議大夫贈太師中書令秦國陳公某有三子長曰某國文忠公某官至樞宻使同平章事左僕射次曰鄭國文恵公某官至户部侍郎平章事太子太師致仕㓜曰某國康肅公某官至武寜軍節度使皆贈太師尚書令兼中書令始秦公為濟源令縣西龍潭有延慶佛舍三子相與為學其中既而相繼登進士科文忠康肅公仍居羣士之首遂接踵為将相始大其家子孫蕃衍多以才能致美官棊布中外故當世稱衣冠之盛者推陳氏其後文忠公自樞宻出判河陽文恵公與其子主客郎中某孫虞部員外郎某康肅公之子祠部郎中某前後皆為京西轉運使主客君之子某復為濟源尉濟源河陽之屬縣河陽京西之屬郡也四世凡七人莅官於是故濟源之人被陳氏之政為多秦公尤有恩於民能使其民既去而思之虞部君嘗行部過濟源遊龍潭佛舎見秦公善政銘真宗皇帝賜文忠公詩主客君題名皆刻於石歎曰吾家所以能顯大於世自非曽祖父勤施仁政於民三祖父力學以取富貴何從而致之乎至於今子孫䝉福禄不絶豈可不知其所自邪乃搆堂於佛舎之側畫四公之像而祠之集三石刻皆置祠下且屬光為之記光曰光之文不足以發揚先君之美不敢為虞部曰不然某之建是祠堂非敢自矜奕世之美盖欲來者見之知愛民好學可以大其家有以勸也光曰如君之言其志逺其益大矣光何敢辭若夫四公之事業則有國史在光不敢及也先公遺文記元豐三年三月十日作玉藻曰父沒而不能讀父之書手澤存焉爾揚子曰書心畫也今之人親沒則畫像而事之畫像外貌也豈若心畫手澤之為深切哉今集先公遺文手書及碑誌行状共為一櫝寘諸影堂子子孫孫永祗保之諫院題名記嘉祐八年作古者諫無官自公卿大夫至於工商無不得諫者漢興以來始置官夫以天下之政四海之衆得失利病萃於一官使言之其為任亦重矣居是官者當志其大捨其細先其急後其緩專利國家而不為身謀彼汲汲於名者猶汲汲於利也其間相去何逺哉天禧初真宗詔置諌官六員責以職事慶歴中錢君始書其名於版光恐乆而漫滅嘉祐八年刻著於石後之人将歴指其名而議之曰某也忠某也詐某也直某也回嗚呼可不懼哉聞喜縣脩文宣王廟記嘉祐元年作或問太古何如曰不今日如也何以言之曰古之人寒衣而饑食貪生而畏死不殊於今也喜怒哀樂好惡畏欲與民俱生非今有而古無也古之人食鳥獸之肉草木之實而衣其皮鳥獸日益殫草木日益稀人日益衆物日益寡視此或不足視彼或有餘能相與守死而勿争乎争而不巳相賊傷相滅亡人之類盖可計日而盡也聖人者愍其然於是作而治之擇其賢智而君長之分其土田而疆域之聚其父子兄弟夫婦而安養之施其禮樂政令而綱紀之明其道徳仁義孝慈忠信㢘譲而教𨗳之猶有狂愚傲狠之民悖戾而不從者於是鞭朴以威之鈇鉞以戮之甲兵以殄之是以民相與安分而保常養生而送終繁衍而乆長也及周之衰先王之道蕩覆崩壊㡬無餘矣其不絶者纎若毫芒自非孔子起而振之廓而引之使閎大顯融以迄于今則生民之衆㡬何其不淪而為禽夷也今國家所以􅆢事孔子非輕也廟食於國於州於縣以嵗時陳其俎豆鳴其金石以禮饗之自天子之貴親北面而拜焉所以然者非一人之私為道存也然吏於州縣者或以簿領鞭朴為急務視孔子之祠及學校廢為餘事置之曽不誰何彼真俗吏無足道者聞喜自前世固搢紳大夫之林藪也縣有孔子廟咸平中武吏慈釋回脩之尉李垂為之記厥後繼而為長者其嚴事孔子之心不能及釋回於是廟屋隳頓垣墉圯缺草樹荒椔碑石斷仆况於鄉飲酒之容絃誦之音固不可得而睹聞矣今大夫馬君至而嘆曰嗚呼為川者知防而不知濬則横潰而不禁為民者知怒而不知教則愁怨而不從故善為川者相髙下而導之善為民者明是非而告之是以為者逸而從者易物遂性而功速成也今為吏者不能掲先王之道以教人而曰吾專任刑罰亦足為治者是掩民之耳目而以䧟穽俟之也不仁孰大焉乃屬邑中之賢士大夫而告之曰今孔子之廟廢而不脩士無所講其業民無所承其化斯豈惟令之辠亦二三子之恥也皆曰斯固邑人日夜所不忘而不敢請者也今明府有命是天相聖人之道而以明府賜邑人也敢不奔走而承之乃相與斂材聚工葺屋之隳而壮大之脩垣之圯而髙厚之去木之椔而改樹之起碑之仆而更刻之民不加賦吏不告勞不日而新廟煥然成矣於是邑中之賢士大夫相與朝夕誦堯舜之書咏商周之詩於其中彬彬然有鄒魯之風矣噫馬君之於學也既正其基矣猶未也今之吏率三嵗而更後之人繼而長於斯者宜勿替馬君之功引而伸之學者冝卒成馬君之志而振大之知人所以嚴事孔子者非徒飾其祠誦其文也固将明其道循其法心諭而力行之使近者恱化逺者慕效繇邑及於鄉繇鄉及於家父靡不慈子靡不孝兄靡不友弟靡不恭夫然後知學之成而為益大也夫道之汚隆豈有常邪人為之則存不為之則亡非道去人人去道也古者至治之時或耕者推畔行者推塗獄訟不興盗賊不作彼風俗若是之美者豈古則可為而今不可為邪繇教之未至故也今基既正矣其餘則勉之而巳矣何憚不及於古邪人之言曰古民淳質故可教今民偽薄故不可教是瞽惑之言不足稽也於廟之成馬君謂光旁縣之人也冝為之記光以不文辭不敢為使者三返而不獲命因直述所聞而書秀州真如院法堂記皇祐四年作壬辰嵗夏四月有僧清辨踵門來告曰清辨秀州真如草堂僧也真如故有講堂庳狹不足以庥學者清辨與同術恵宗治而新之今髙顯矣願得子之文刻諸石以諗來者光謝曰光文不足以辱石刻加平生不習佛書不知所以云者師其請諸佗人曰佗人清辨所不敢請也故惟子之歸而子又何辭光固辭不獲乃言曰師之為是堂也其志何如曰清辨之為是堂也屬堂中之人而告之曰二三子苟能究明吾佛之書為人講解者吾且南鄉坐而師之審或不能則将取於四方之能者皆伏謝不能然後相率抵精嚴寺迎沙門道歡而師之又屬其徒而告之曰凡我二三子肇自今以及於後相與恊力同志堂圯則扶之師缺則補之以至於金石可弊山淵可平而講肄之聲不可絶也光曰師之志則美矣抑光雖不習佛書亦嘗剽聞佛之為人矣夫佛盖西域之賢者其為人也清儉而寡慾慈恵而愛物故服弊補之衣食蔬糲之食巖居壄處斥妻屏子所以自奉甚約而憚於煩人也雖草木蟲魚不敢妄殺盖欲與物並生而不相害也凡此之道皆以㳙潔其身不為物累盖中國於陵仲子焦光之徒近之矣夫聖人之徳周賢者之徳偏周者無不覆而末流之人猶不免弃本而背原况其偏者乎故後世之為佛書者日逺而日訛莫不侈大其師之言而附益之以滛怪誣罔之辭以駭俗人而取世資厚自豐殖不知饜極故一衣之費或百金不若綺紈之為愈也一飯之直或萬錢不若膾炙之為省也髙堂鉅室以自奉養佛之志豈如是哉天下事佛者莫不然而吴人為甚師之為是堂将以明佛之道也是必深思於本源而勿放蕩於末流則治斯堂之為益也豈其細哉竚瞻堂記元豐六年作元豐三年天子大饗明堂召河東節度使守司徒兼侍中潞國文公自北都入覲於京師以相祀事禮成天子以公勱相三后克底隆休澤敷乎烝民功安乎廟祧復命公以太尉留守西都於是公尹洛者三矣将行天子仍賜之詩云西都舊士女白首竚瞻公洛人喜公之來榮天子之言明年相與構堂於資聖佛祠肖公之像於其中名之曰竚瞻又二年河南進士宋師中李徹與其鄉里士民之衆以書抵光曰公再為宰相三守洛都雖恵化徧天下靡有不周而在洛為多今吾人日灑掃兹堂而奉事之至於子孫固不忘矣異時逺方之人有過兹堂而不知其所以然者亦吾人之耻也子盍為我書其事著於石以傳告無窮光謝曰諸君以此屬我誠大幸然凡為士者頌一守令且猶秉筆不敢輕為况公之徳業位望崇顯如是乃使如光者紀之必得罪於識者能無懼乎西都搢紳之淵藪賢而有文者肩隨踵接諸君不往求之顧惟不肖之求能無慙乎願置我而更請於佗衆皆曰子出公之門最乆其居洛又乆然則記兹堂也子於何避之夫登岱華者固不能盡其髙廣遊滄海者固不能窮其幽深苟身之所至目之所睹皆可得而言矣光既不得辭乃曰光僑居於洛巳十有三年日聞士民之譽公者如出一口敢問公之前後治洛其規為施置如何而得民心若是願條以告我得藉之以書衆皆曰公之為政其大者汪洋溥暢若化工之神膏雨之仁固非吾人之所測也其細者樵夫牧兒皆能道之又不足以盡公之美也姑以吾人之所及者言之其簡而有節安而不擾乎抑又聞之昔黄霸為潁川太守治為天下第一及作相時人不謂之賢謝安為吴興太守在官無當時譽及作宰相名振異域彼皆才有所不贍故用有所不周能兼之者其在公乎光曰諸君知其一未知其二光嘗學於史氏觀自古為人臣者或得於君而失於民或得於民而失於君君非不恱也如民疾之何民非不愛也如君惡之何若是者殆不可勝算也至於事君以忠養民以仁惻然至誠積於胸中夙夜不倦悠乆不渝晦之而益光隠之而益彰逃寵而寵不我捨避名而名常我隨若玉之在山珠之在淵擊鐘鼓於宫種草木在土逹于上下而不可掩者彌百千年無㡬人而巳矣詩云樂只君子天子命之言得乎上也豈弟君子民之父母言得乎下也書曰臣為上為徳為下為民言其上下得也上下得者其惟禹稷與臯陶乎佐舜禹以阜安斯民君頼之如股肱民依之如父母功盛乎一時名髙乎百世公之徳其近是乎不然何天子之寵光便蕃而不厭下民之恱服悠乆而不忘若此其備乎衆皆曰然光曰然則請書此為之記獨樂園記熈寜六年作孟子曰獨樂樂不如與人樂樂與少樂樂不如與衆樂樂此王公大人之樂非貧賤者所及也孔子曰飯蔬食飲水曲肱而枕之樂亦在其中矣顔子一簞食一瓢飲不改其樂此聖賢之樂非愚者所及也若夫鷦鷯巢林不過一枝鼴䑕飲河不過滿腹各盡其分而安之此乃迂叟之所樂也熈寜四年迂叟始家洛六年買田二十畒於尊賢坊北闢以為園其中為堂聚書出五千巻命之曰讀書堂堂南有屋一區引水北流貫宇下中央為沼方深各三尺䟽水為五𣲖注沼中状若虎爪自沼北伏流出北階懸注庭下状若象鼻自是分為二渠繞庭四隅㑹於西北而出命之曰弄水軒堂北為沼中央有島島上植竹圓周三丈状若玉玦攬結其杪如漁人之廬命之曰釣魚庵沼北横屋六楹厚其墉茨以禦烈日開户東出南北列軒牖以延凉颸前後多植美竹為清暑之所命之曰種竹齋沼東治地為百有二十畦雜塒草藥辨其名物而掲之畦北植竹方徑丈状若棊局屈其杪交相掩以為屋植竹於其前夾道如歩廊皆以蔓藥覆之四周植木藥為藩援命之曰采藥圃圃南為六欄芍藥牡丹雜花各居其二毎種止植兩本識其名状而巳不求多也欄北為亭命之曰澆花亭洛城距山不逺而林薄茂宻常苦不得見乃於園中築臺搆屋其上以望萬安轘轅至於太室命之曰見山臺迂叟平日多處堂中讀書上師聖人下友羣賢窺仁義之原探禮樂之緒自未始有形之前暨四逹無窮之外事物之理舉集目前所病者學之未至夫又何求於人何待於外哉志倦體疲則投竿取魚執袵采藥决渠灌花操斧剖竹濯熱盥手臨髙縱目逍遥徜徉唯意所適明月時至清風自來行無所牽止無所柅耳目肺腸悉為已有踽踽焉洋洋焉不知天壌之間復有何樂可以代此也因合而命之曰獨樂園或咎迂叟曰吾聞君子所樂必與人共之今吾子獨取足於巳不以及人其可乎迂叟謝曰叟愚何得比君子自樂恐不足安能及人况叟之所樂者薄陋鄙野皆世之所棄也雖推以與人人且不取豈得強之乎必也有人肯同此樂則再拜而獻之矣安敢專之哉記歴年圖後光頃嵗讀史患其文繁事廣不能得其綱要又諸國分列嵗時先後參差不齊乃上采共和以來下訖五代略記國家興衰大迹集為五圖毎圖為五重毎重為六十行毎行紀一年之事其年取一國為主而以朱書佗國元年綴於其下盖欲指其元年以推二三四五則從可知矣凡一千八百年命曰歴年圖其書雜亂無法聊以私便於討論不敢廣布於佗人也不意趙君摹刻於板傳之蜀人梁山令孟君得其一通以相示始光率意為此書苟天下非一統則漫以一國主其年固不能辨其正閏而趙君乃易其名曰帝統非光志也趙君頗有所増損仍變其巻秩又所為多脫誤今此淺陋之書既不可掩因刋正使復其舊而歸之傳家集巻七十一欽定四庫全書傳家集巻七十二宋司馬光撰傳范景仁傳范景仁名鎮益州華陽人少舉進士善文賦場屋師之為人和易脩敕故叅知政事薛簡肅公端明殿學士宋景文公皆噐重之補國子監生及貢院奏名皆第一故事殿廷唱第過三人則為奏名之首者必抗聲自陳以祈恩雖考校在下天子必擢賞上列以吴春卿歐陽永叔之耿介猶不免從衆景仁獨不然左右與並立者屢趣之使自陳景仁不應至七十九人始唱名及之景仁出拜退就列訖無一言衆皆服其安恬自是人始以自陳為耻舊風遂絶釋褐新安主簿到官數旬時宋宣獻公留守西京不欲使與下吏共勞辱召置國子監使教諸生秩滿又薦於朝為東監直講未㡬宋景文公奏同脩唐書又用叅知政事王公薦召試學士院詩用彩霓字學士以沈約郊居賦雌霓連蜷讀霓為入聲謂景仁為失韻由是除館閣校勘殊不知約賦但取聲律便美非霓不可讀為平聲也當時有學者皆為景仁憤􅉱而景仁處之晏然不自辨為校勘四年應遷校理丞相龐公薦景仁有美才不汲汲於進取特除直祕閣未㡬以起居舎人知諫院仁宗性寛仁言事者兢為激訐以采名或縁愛憎汚人以帷箔不可明之事景仁獨引大體自非關朝廷安危繫生民利病皆闊略不言陳恭公為相嬖妾張氏笞殺婢御史劾奏欲逐去之不能得乃誣之云私其女景仁上言朝廷設臺諫官使人除讒慝非使之為讒慝也審如御史所言則執中可斬如其不然御史亦可斬御史怒共劾景仁以為阿附宰相景仁不顧力為辨其不然深救當時之弊識者韙之仁宗即位三十五年未有繼嗣嘉祐初暴得疾旬日不知人中外大小之臣無不寒心而畏避嫌疑相倚仗莫敢發言景仁獨奮曰天下事尚有大於此者乎捨此不言顧惟抉擿細微以塞職是真負國吾不忍也即上言太祖捨其子而立太宗周王既薨真宗取宗室子養之宫中陛下冝為宗廟社稷計早擇宗室賢者優其禮數試之以政與圖天下之事以繫天下人心章累上寝不報景仁因闔門家居自求誅譴執政或諭以奈何效干名希進之人景仁上執政書言繼嗣不定将有急兵鎮義當死朝廷之刑不可死亂兵之下此乃鎮擇死之時尚安暇顧干名希進之嫌而不為去就之决哉又奏稱臣竊原大臣之意恐行之而事有中變故畏避而為容身之計也萬一兵起大臣家族首領顧不可保其為身計亦巳踈矣就使事有中變而死陛下之職與其死於亂兵不猶愈乎乞陛下以臣此章示大臣使其自擇死所聞者為之股栗尋除兼侍御史知雜事景仁固辭不受乞解言職就散地執政復諭以上之不豫諸大臣亦嘗建此䇿今姦言巳入為之甚難景仁復上執政書云但當論事之是非不當問其難易况事早則濟緩則不及此聖賢所以貴機㑹也諸公謂今日難於前日安知佗日不難於今日乎謂今日姦言巳入不可弭佗日可弭乎凡見上面陳者三奏章者十有七朝廷不能奪乃罷諫職改集賢殿脩撰頃之拜知制誥遷翰林學士英宗即位中書奏請追尊濮安懿王事下兩制議以為冝稱皇伯髙官大國極其尊榮大迕執政意更下尚書省集百官議之意朝士必有迎合者既而䑓諫争上言為人後者為之子不得顧私親今陛下既為仁宗後若復推尊濮王是貳統也殆非所以報仁宗之盛徳衆論鼎沸執政欲緩其事乃下詔罷百官集議曰當令禮官檢詳典禮以聞景仁時判太常寺即具列為人後之禮及漢魏以來論議得失悉奏之與兩制臺諫議合執政怒召景仁詰責之曰詔書云當令檢詳奈何遽列上邪景仁曰有司得詔書不敢稽留即以聞乃其職也奈何更以為罪乎㑹宰相遷官景仁當草制坐失於考按不合故事改侍讀學士出知陳州今上即位復召還翰林王介甫叅知政事置三司條例司變更祖宗法令專以聚斂為務斥逐忠直引進奸佞景仁上䟽極言其不可朝廷不報景仁時年六十三因上言即不用臣言臣無顔復居位食禄願聴臣致仕章累上語益切直介甫大怒自草制書極口醜詆使以本官户部侍郎致仕凡所應得恩例悉不之與於是當時在位者皆自愧景仁名益重於天下介甫雖詆之深人更以為榮焉景仁既退居有園第在京師專以讀書賦詩自娱客至無貴賤皆野服見之不復報謝故人或為具召之雖權貴不拒也不召則不往見之或時乘輿出遊則無逺近皆往嘗乘籃輿歸蜀與親舊樂飲賑施其貧者周覽江山窮其勝賞朞年然後返年益老而視聴尤聦明支體尤堅強嗚呼曏使景仁枉道希世以得富貴䝉屈辱任憂患豈有今日之樂邪然則景仁所失甚少所得殊多矣詩云愷悌君子神所勞矣又曰樂只君子遐不眉壽景仁有焉客有問今世之勇於迂叟者叟曰有范景仁者其為勇人莫之敵客曰景仁長僅五尺循循如不勝衣奚其勇叟曰何哉而所謂勇者而以瞋目裂眥髪上指冠力曵九牛氣陵三軍者為勇乎是特匹夫之勇耳勇於外者也若景仁勇於内者也自唐宣宗以來不欲聞人言立嗣萬一有言之者輒切齒疾之與背畔無異而景仁獨唱言之十餘章不巳視身與宗族如鴻毛後人見景仁無恙而繼為之者則有矣然景仁首冒不測之淵無勇者能之乎人之情孰不畏天子與執政親愛之至隆者孰若父子執政欲尊天子之父而景仁引古義以争之無勇者能之乎禄與位皆人所貪或老且病前無可冀猶戀戀不忍捨去况景仁身巳通顯有聲望視公相無跬歩之逺以言不行年六十三即拂衣歸終身不復起無勇者能之乎凡人有所不能而人或能之無不服焉如吕獻可之先見范景仁之勇决皆余所不及也余心誠服之故作范景仁傳圉人傳慶歴五年作汧侯有馬悍戾不可乘服以為無用將弃之野愛其疾足募有能馴之者禄以百金有圉人叩門而告曰臣能馴之汧侯使養馬數月馬益調服歩驟緩速折還左右唯人所志汧侯喜賞以百金之禄拜為圉師衆騶疾之謁於侯曰侯馬今馴矣彼何功而徒費侯金臣請代之侯逐圉人居數月馬復悍戾如故侯乃召圉人而謝曰子能使悍馬馴子去而馬復悍敢問何術也對曰臣賤夫也不知異術而惟養馬之知夫馬太肥則陸梁太瘠則不能任重䇿之急則駭而難馴緩則不肯盡力善為圉者渇之飢之飲之秣之視其肥瘠而豐殺其菽粟緩之以盡其材急之以禁其逸鞭䇿以警其怠恩隠以馴其心使之得其宜適而不勞亦不使有遺力焉其術甚㣲得於心應於手巳不能傳之於人人亦不能從巳傳也如此故馬之材在馬馬之性在我雖悍戾何傷哉汧侯曰善圉人曰是術也豈特養馬而巳抑治國亦猶是也夫材智之士治國者之悍馬也捨之則不能以興功業御之不以道則不獲其利而桀黠不可制故明君者能用材智之士而以爵禄賞罸御之是以爵太髙則驕禄太豐則墮驕墮之臣雖有智力君不得而使也制之急則不得盡其能制之緩則不肯宣其用不任恩渥一驅之以威則愁怨而離心故明君者節其爵禄裁其緩急恩澤足以結其心威嚴足以服其志則士生死貴賤之命在於君矣雖慓悍何憂哉汧侯恱位為上卿任以國政用其術推而行之汧國大治張行婆傳行婆張氏濰州昌樂人父為虎翼軍校張氏生七年繼母潜使儈者鬻之紿其父云失之父哭之一日失明由是落軍籍為民儈者鬻於故尚書左丞范公家字曰菊花范氏以媵其女適泗州人三班借職金士則張氏勤謹其主家愛之與父别凡二十一年一旦遇之於范氏之門而識之遂辭范氏與父俱歸父怒繼母欲毆而逐之張氏曰兒非母不得入貴人家母乃有徳於兒又何怨焉今頼天之力得復見父若兒歸而母逐兒何安焉父乃止父時年且八十無佗子家甚貧鬻薪為業昌樂有故田園為人所據張氏乃與父母歸鄉里訟於州而得之未㡬父卒張氏養繼母盡子道母老不能行所適稍逺則張氏負之母卒張氏嫁為里民王祐妻生一男二女祐早卒諸孤皆幼張氏鞠之不從人既長畢婚嫁乃謂其子曰吾素愛浮屠法里中有古寺廢已乆吾當帥里人脩之弃家處其中不復為爾母矣里人聞之争助以財不日立堂殿厨廡塑繪佛像營儲㣥皆備毎戒其子毋得至寺曰寺有衆人之財将以興佛事吾一毫不敢私也汝來使吾無以自明金士則之妹余嫂也元豐中張氏自濰之泗省金氏又自泗之陜省余嫂徒歩數千里曰吾故時主家不可忘也嫂置諸園門之傍獨處一室日一􅂼食讀佛書毎與女僕語專誨以忠勤有不受而詬之者輒拜謝不與校遇勞辱之事則以身先之與之錢刀衣服固辭強之不得已辭多受少見尺薪寸帛不忍弃必拾以歸愛之如已物女僕之㓜者則為之櫛沐紉縫視之如已女至於猴犬飲食以時無不馴服張氏去輒數日悲鳴不食余熟察其所為而異之因諭之曰嫗已老幸有子不與之居以終其身而栖栖汲汲周遊四方竟何為乎張氏曰凡學佛者先應斷愛彼雖吾子乆已捨之不復思也嗚呼世之服儒衣冠讀詩書以君子自名者其忠孝㢘譲能如張氏者㡬希豈得以其㣲賤而忽之邪聞其風者能無作乎曏使生於劉子政之前使子政得而傳之雖古烈女何以尚之惜乎為浮屠所蔽不得入於禮義之塗然其處心有可重者余是敢私記之猫虪傳元豐七年作仁義天徳也天不獨施之於人凡物之有性識者咸有之顧所賦與有厚薄耳余家有猫曰虪毎與衆猫食常退處於後俟衆猫飽盡去然後進食之有復還者又退避之佗猫生子多者虪輒分置其栖與巳子並乳之愛視踰於巳子有頑猫不知其徳於巳乃食虪之子虪亦不與校家人以白澤圖云畜自食其子不祥見虪在旁以為共食之痛箠而斥之以畀僧舎僧飼之不食匿竇中近旬日餓且死家人憐而返之至家然後食家人毎得稺猫輒令虪母之嘗為佗猫子摶犬犬噬之㡬死人救獲免後老且病不復執䑕於家為長物余不忍弃常自飼之及死余命貯簏中瘞於西園時元豐七年十月甲午也自生至死近二十年昔韓文公作猫相乳説以為北平王之徳感應召致及余家有虪乃知物性各於其類自有善惡韓子之說㡬於諂耳嗟乎人有不知仁義貪冒争奪病人以利巳者聞虪所為得無愧哉司馬相如稱物有同類而殊能者故力稱烏獲㨗言慶忌人誠有之獸亦宜然昔余通判鄆州有猫曰山賔生數月遇鼷得巨䑕方食之前與鼷闘嚙鼷走奪䑕以歸後因汚余書余以畀都監常鼎始縶之跳擲髙數尺不可牽制乃囊盛以授之兩廨相距二里許後數日山賔復來歸余又囊以授之鼎命婢牢縶之山賔既識路即時歸䋲約滿身鼎責羣婢曰汝曹雖為人曽不及彼猫一心於其主余以既畀之不可復留卒囊以授之遂不復歸不知其為死為生也山賔非虪之比余獨嘉其不忘舊主故録之附於虪傳之末傳家集巻七十二欽定四庫全書傳家集巻七十三宋司馬光撰題跋題綘州鼓堆祠嘉祐元年九月作鼓堆在州治所西北二十五里樊紹述守居記作古州之圖志作鼓鼓者人馬踐之逢逢如鼓状盖水原充滿石下而然云紹述之文其必有據然今以耳目驗之則圖志亦未可全廢也堆之西山白馬首其東長陵纚屬相傳以為晋之九原其北水出澤堂别名清泉堆周圍四里髙三丈穹隆而圓状如覆釡水原數十環之觱沸雜發匯於南溶為深淵中多魚鱉蠏鱓水極清潔可鑑毛髪盛寒不氷大旱不耗霪雨不溢其南釃為三渠一載髙地入州城周吏民園沼之用二散布田間灌溉萬餘頃所餘皆歸於汾田之所生禾麻稌􅀈肥茂薌甘異佗水所溉堆上有神祠盖以水隂類也故其神為婦人像而祠中石刻乃妄以為堯后及舜之二妃噫是水也有清明之性温厚之徳常壹之操潤澤之功雖古聖賢無以加其廟食於民也固宜何必假於堯后舜妃然後可祀也嘉祐元年九月壬寅通判并州事司馬光以事至綘州從州之諸官尚書比部貟外郎薛長儒元卿國子博士劉常守道尹仲舒漢臣判官陳太初寓之同遊祠下愛其氣象之美登臨之樂而又功徳及人若此其盛愍流俗之訛不可以莫之正也於是題云書孫之翰唐史記後元豐二年作孫公昔著此書甚自重惜嘗别緘其槀於笥必盥手然後啓之謂家人曰萬一有水火兵刃之急佗貨財盡棄之此笥不可失也毎公私少間則増損改易未嘗去手其在江東為轉運使出行部亦以自随過亭傳休止輒取脩之㑹宣州有急變乘馹遽往不暇挈以俱既行於後金陵大火延及轉運廨舍弟子察親負其笥避於沼中島上公在宣州聞之亟還入門問曰唐書在乎察對曰在乃恱餘無所問自壮年至於白首乃成亦未以示人文潞公執政嘗從公借之公不與但録姚崇宋璟論以與之况佗人固不得見也元豐二年察自陽翟來洛陽以其書授光曰伯父平生之志萃於是書朝廷先嘗取之留禁中不出今沒二十餘年家道益衰大懼是書遂散逸不傳於人故録以授子光昔聞公有是書固願見而未之得得之驚喜曰子之貺我兼金不如顧無以為報請受而藏之遇同好則傳之異日或廣布於天下使公之志業煒煌於千古庶㡬亦足以少報乎書田諫議錫碑隂光自始學未冠聞故諫議大夫田公當真宗踐阼之初求治方急公稽古以監今日有獻月有納以賛成咸平盛隆之治私心慕仰想見其為人熈寜中始識公之曽孫偃師尉衍因就求觀公之遺文後十餘年衍為武勝軍節度推官知沈丘縣事以公文集及墓銘相示且命光為神道碑其墓銘乃故叅知政事范公所為也范公大賢其言固無所苟今其銘曰嗚呼田公天下之正人也雖復使佗人竭其慕仰之心頌公之美累千萬言能有過於此乎光於范公無能為役范公恨不得見田公則田公果何如人哉光不惟愚陋不學且不為人作碑銘巳乆不敢承命然常怪世人論譔其祖禰之徳業壙中之銘道旁之碑必使二人為之彼其徳業一也銘與碑奚以異曷若刻大賢之言既納諸壙又植於道其為取信於永乆豈不無疑乎願審思之脫或可從請附刻於碑隂之末書孫之翰墓誌後元豐二年十二月作明道中公在華州光始以太廟齋即得謁見皇祐中幸與公俱在館閣公於光為前軰而光服公才仰公徳不敢以同舎期也然粗能熟公之為人元豐二年十二月公弟子崇信令察示光以歐陽公所譔公墓誌光讀之怳然如復見公得侍坐於旁也昔蔡伯喈嘗言吾為碑銘多矣皆有慙徳唯郭有道無愧色耳觀歐陽公此文其言公自初仕以美才清徳為時所重在諫院言宫禁事切直無所避在陜不飾厨傳凡當官公論不私其所愛淡然寡所好外和而内勁喜言唐事學者終嵗讀史不如一日聞公論此皆光親所睹聞當時士大夫所共知可謂實録而無愧矣公名髙於世歐陽公以文雄天下固不待光言而後人信之然嵗月益乆識公者益寡竊懼後之人見歐陽公之文以為如世俗之銘誌但飾虚美以取恱其子孫耳故冒進越之罪嗣書其末譬猶捧土以培泰山匊水以沃大河彼豈頼此以為髙深哉盖志在有以益之不自知非其任也疑孟伯夷隘桞下恵不恭元豐五年作疑曰孟子稱所願學者孔子然則君子之行孰先於孔子孔子歴聘七十餘國皆以道不合而去豈非非其君不事乎孺悲欲見孔子孔子辭以疾豈非非其友不友乎陽虎為政於魯孔子不肯仕豈非不立於惡人之朝乎為定哀之臣豈非不羞汙君乎為委吏為乘田豈非不卑小官乎舉世莫知之不怨天不尤人豈非遺佚而不怨乎飲水曲肱樂在其中豈非阨窮而不憫乎居鄉黨恂恂似不能言豈非由由與之偕而不自失乎是故君子邦有道則見邦無道則隠事其大夫之賢者友其士之仁者非隘也和而不同遯世無悶非不恭也苟毋失其中雖孔子由之何得云君子不由乎陳仲子避兄離母疑曰仲子以兄之禄為不義之禄盖謂不以其道事君而得之也以兄之室為不義之室盖謂不以其道取於人而成之也仲子盖甞諫其兄矣而兄不用也仲子之志以為吾既知其不義矣然且食而居之是口非之而身享之也故避之居於於陵於陵之室與粟身織屨妻辟纑而得之也非不義也豈當更問其築與種之者誰邪以所食之鵝兄所受之饋也故哇之豈以母則不食以妻則食之邪君子之責人當探其情仲子之避兄離母豈所願邪若仲子者誠非中行亦狷者有所不為也孟子過之何其甚與孟子將朝王元豐五年正月二十七日作疑曰孔子聖人也定哀庸君也然定哀召孔子孔子不俟駕而行過位色勃如也足躩如也過虚位且不敢不恭况召之有不往而佗適乎孟子學孔子者也其道豈異乎夫君臣之義人之大倫也孟子之徳孰與周公其齒之長孰與周公之於成王成王㓜周公負之以朝諸侯及長而歸政北面稽首畏事之與事文武無異也豈得云彼有爵我有徳齒可慢彼哉孟子謂蚳鼃居其位不可以不言言而不用不可以不去已無官守無言責進退可以有餘裕疑曰孟子居齊齊王師之夫師者𨗳人以善而救其惡者也豈得謂之無官守無言責乎若謂之為貧而仕邪則後車數十乘從者数百人仰食於齊非抱關擊柝之比也詩云彼君子兮不素餐兮夫賢者所為百世之法也余懼後之人挾其有以驕其君無所事而貪禄位者皆援孟子以自况故不得不疑沈同問伐燕元豐五年正月二十八日作疑曰孟子知燕之可伐而必待能行仁政者乃可伐之齊無仁政伐燕非其任也使齊之君臣不謀於孟子孟子勿預知可也沈同既以孟子之言勸王伐燕孟子之言尚有懐而未盡者安得不告王而止之哉夫軍旅大事也民之死生國之存亡皆繫焉苟動而不得其宜則民殘而國危仁者何忍坐視其終委乎父子之間不責善元豐五年作疑曰經云當不義則子不可不諍於父傳云愛子教之以義方孟子云父子之間不責善不責善是不諫不教也而可乎性猶湍水元豐八年作疑曰告子云性之無分於善不善猶水之無分於東西此告子之言失也水之無分於東西謂平地也使其地東髙而西下西髙而東下豈決𨗳所能致乎性之無分於善不善謂中人也瞽叟生舜舜生商均豈陶染所能變乎孟子云人無有不善此孟子之言失也丹朱商均自㓜及長日所見者堯舜也不能移其惡豈人之性無不善乎生之謂性元豐八年作疑曰孟子云白羽之白猶白雪之白白雪之白猶白玉之白告子當應之云色則同也性則殊矣羽性輕雪性弱玉性堅而告子亦皆然之此所以來犬牛人之難也孟子亦可謂以辯勝人矣齊宣王問卿疑曰禮君不與同姓同車與異姓同車嫌其偪也為卿者無貴戚異姓皆人臣也人臣之義諫於君而不聴去之可也死之可也若之何其以貴戚之故敢易位而處也孟子之言過矣若有大過無若紂紂之卿士莫若王子比干箕子㣲子之親且貴也㣲子去之箕子為之奴比干諫而死孔子曰商有三仁焉夫以紂之過大而三子之賢猶且不敢易位也况過不及紂而賢不及三子者乎必也使後世有貴戚之臣諫其君而不聴遂廢而代之曰吾用孟子之言也非篡也義也其可乎或曰孟子之志欲以懼齊王也是又不然齊王若聞孟子之言而懼則将愈忌惡其貴戚聞諫而誅之貴戚聞孟子之言又将起而蹈之則孟子之言不足以格驕君之非而適足以為篡亂之資也其可乎所就三所去三疑曰君子之仕行其道也非為禮貌與飲食也昔伊尹去湯就桀桀豈能迎之以禮哉孔子栖栖遑遑周逰天下佛肸召欲往公山弗擾召欲往彼豈為禮貌與飲食哉急於行道也今孟子之言曰雖未行其言也迎之有禮則就之禮貌衰則去之是為禮貌而仕也又曰朝不食夕不食君曰吾大者不能行其道又不能從其言也使饑餓於我土地吾耻之周之亦可受也是為飲食而仕也必如是是不免於鬻先王之道以售其身也古之君子之仕也殆不如此堯舜性之也湯武身之也五覇假之也疑曰所謂性之者天與之也身之者親行之也假之者外有之而内實亡也堯舜湯武之於仁義也皆性得而身行之也五霸則強焉而巳夫仁義者所以治國家而服諸侯也皇帝王霸皆用之顧其所以殊者大小髙下逺近多寡之間耳假者文具而實不從之謂也文具而實不從其國家且不可保况能霸乎雖乆假而不歸猶非其有也瞽叟殺人疑曰虞書稱舜之徳曰父頑母嚚象傲克諧以孝烝烝乂不格姦所貴於舜者為其能以孝和諧其親使其進退以善自治而不至於惡也如是則舜為子瞽叟必不殺人矣若不能止其未然使至於殺人執於有司乃棄天下竊之以逃狂夫且猶不為而謂舜為之乎是特委巷之言也殆非孟子之言也且瞽叟既執於臯陶矣舜惡得而竊之雖負而逃於海濵臯陶猶可執也若曰臯陶外雖執之以正其法而内實縱之以予舜是君臣相與為偽以欺天下也惡得為舜與臯陶哉又舜既為天子矣天下之民戴之如父母雖欲遵海濵而處民豈聴之哉是臯陶之執瞽叟得法而亡舜也所亡益多矣故曰是特委巷之言殆非孟子之言也史剡并序愚觀前世之史有存之不如其亡者故作史剡其細𤨏䌓蕪固不可悉數此言其卓卓為士大夫所信者云虞舜堯以二女妻舜百官牛羊事舜於畎畆之中瞽叟與象猶欲殺之使舜塗廪而縱火舜以兩笠自扞而下又使舜穿井而實以土舜為匿空出佗人井剡曰頑嚚之人不入徳義則有矣其好利而畏害則與衆不殊也或者舜未為堯知而瞽叟欲殺之則可矣堯巳知之四岳舉之妻以二女養以百官方且試以百揆而禪天下焉則瞽叟之心豈得不利其子之為天子而尚欲殺之乎雖欲殺之亦不可得巳藉使得而殺之瞽叟與象将隨踵而誅雖甚愚人必不為之此特閭父里嫗之言而孟子信之過矣後世又承以為實豈不過甚矣哉舜南廵守崩於蒼梧之野𦵏於江南九嶷是為零陵剡曰昔舜命禹曰朕耄期倦于勤汝惟不怠揔朕師是以天子為勤故老而使禹攝也夫天子之職莫勤於廵守而舜猶親之卒死於外而葬焉惡用使禹攝哉是必不然或曰虞書稱舜陟方乃死孔安國以為升道南方巡守而死禮記亦稱舜葬於蒼梧之野皆如太史公之言予獨以為不然何如曰傳記之言固不可据以為實藉使有之又安知無中國之蒼梧而必在江南邪虞書陟方云者言舜在帝位治天下五十載升於至道然後死耳非謂巡守為陟方也嗚呼遂使後世愚悖之人或疑舜禹而非聖人豈非孔安國與太史公之過也哉夏禹禹以天下授益益避啓於箕山之陽禹子啓賢天下皆去益而歸啓啓遂即天子位剡曰父之位傳歸於子自生民以來如是矣堯以朱不肖故授舜舜以均不肖故授禹禹子啓果賢足以任天下而禹授益使天下自擇啓而歸焉是飾偽也益知啓之賢得天下心巳不足以間而受天下於禹是竊位也禹以天下授益啓以違父之命而為天子是不孝也惡有飾偽竊位不孝而謂之聖賢哉此為傳者之過明矣夏桀桀走鳴條遂放而死桀謂人曰吾悔不遂殺湯於夏臺使至此剡曰是言也存為後世之懲勸其可乎周文王崇侯譛西伯於紂曰西伯積善累徳諸侯皆嚮之將不利於帝紂乃囚西伯於羑里云云既出乃獻洛西之地以請紂去炮烙之刑紂許之剡曰紂疑文王之得民故囚之既釋而又獻地以止其虐刑是正信崇侯虎之譛於紂也豈所謂遵養時晦以䝉大難者哉且紂惟不勝其淫虐之心故為炮烙之刑若能自止而不為則不待受西伯之地若不能自止雖受地於西伯而為之如故誰能禁之哉由余戎王使由余於秦秦穆公問曰中國以詩書禮樂法度為政然尚時亂今我夷無此何以為治由余笑曰此乃中國所以亂也夫自上聖作為禮樂法度僅以小治及其後世阻法度之威以督責於下下罷極則以仁義怨望於上上下交争怨而相簒弑夫戎狄不然上含淳徳以遇其下下懐忠信以事其上此真聖人之治也穆公以為賢乃離間戎之君臣卒得由余而用之遂霸西戎剡曰所貴乎有賢者為其能治人國家也治人國家舎詩書禮樂法度無由也今由余曰是六者中國之所以亂也不如我戎夷無此六者之為善如此而穆公以為賢而用之則雖亡國無難矣若之何其能霸哉是特老荘之徒設為此言以詆先王之法太史公遂以為實而載之過矣孔子齊景公欲以尼谿田封孔子晏嬰進曰夫儒者滑稽而不可軌法倨傲自順不可以為下㳺說乞貸不可以為國云云剡曰晏嬰忠信以有禮愛君而樂善於晋恱叔向於鄭悦子皮於吴悦季札豈於孔子獨不知而毁之乎楚昭王将以書社地七百里封孔子令尹子西曰文武百里之君卒王天下今孔丘得據土壌賢弟子為佐非楚之福也乃止剡曰子西楚之賢令尹也楚國賴之亡而復存危而復安其志猶晏嬰也其言豈容鄙淺之如是哉季布季布聞曹丘生招權顧金錢與竇長君書使絶之曹丘聞之往見布揖曰使僕逰揚足下名於天下顧不美乎何拒僕深也布大恱留數月為上客厚遣之剡曰曹丘與長君善而布與書使絶之是以曹丘為小人也及曹丘見以毁譽動巳而巳善之是養小人以自利也夫以毁譽動人及養小人以自利皆姦人之道也果如是則布惡得為賢大夫蕭何營未央宫蕭何作未央宫髙祖見宮闕壮甚怒何曰天下方未定故可因遂就宫室且天子以四海為家非壮麗無以重威且無令後世有以加也髙祖乃恱剡曰是必非蕭何之言審或有之何惡得為賢相哉天下方未定為之上者拊循煦嫗之不暇又安可重為煩費以壮宫室哉古之王者明其徳刑而天下服未聞宫室可以重威也創業埀統之君致其恭儉以訓子孫子孫猶滛靡而不可禁况示之以驕侈乎孝武卒以宫室靡弊天下惡在其無以加也是皆庸人之所及而謂蕭相國肯為此言乎傳家集巻七十三欽定四庫全書傳家集巻七十四宋司馬光撰迃書迃書序嘉祐二年作余生六齡而父兄教之書雖誦之不能知其義又七年始得稍聞聖人之道朝誦之夕思之至於今二十有七年矣雖其性之昏愚憊而不能進然勤亦至矣時有所獲書以示人人之論高者則曰子之書庸而無奇衆人所同知也論卑者則曰子之書迃而難用於世無益也嘻我窮我之心以求古之道力之所及者則取之庸與迃惟人之所名也我安得知之故命其書曰庸書亦曰迃書云釋迃或謂迃夫曰子之言太迃於世無益也迃夫曰子知迃之無益而不知其為益且大也子知迃之有益而不知其為損亦大也子不見夫樹木者乎樹之一年而伐之則足以給薪蘇而巳二年而伐之則足以為桷五年而伐之則足以為楹十年而伐之刖足以為棟夫豈非收功愈逺而為利愈大乎古之人惟其道閎大而不能狹也其志邃奥而不能邇也其言崇高而不能庳也是以所適齟齬而或窮為布衣貧賤困苦以終其身然其遺風餘烈數百千年而人猶以為法曏使其人狹道以求容邇志以取合庳言以趨功雖當時貴為卿相利止於其躬榮盡於其生惡得餘澤以及後世哉如余者患不能迃而巳矣迃何病哉辨庸或謂迃夫曰子之言甚庸衆人之所及也惡足貴哉迃夫曰然余學先王之道勤且久矣惟其性之惛也苦心勞神而不自知猶未免夫庸也雖然古之天地有以異於今乎古之萬物有以異於今乎古之性情有以異於今乎天地不易也日月無變也萬物自若也性情如故也道何為而獨變哉子之於道也將厭常而好新譬夫之楚者不之南而之北之齊者不之東而之西信可謂殊於衆人矣得無所適失其所求愈勤而愈逺邪嗚呼孝慈仁義忠信禮樂自生民以來談之至今矣安得不庸哉如余者懼不能庸而巳矣庸何病哉士則或曰為士何如迃夫曰士者事天以順交人以謹謹司其分不敢失隕而巳矣或曰為士者亦事天乎曰是何言也天者萬物之父也父之命子不敢逆君之言臣不敢違父曰前子不敢不前父曰止子不敢不止臣之於君亦然故違君之言臣不順也逆父之命子不孝也不順不孝者人得而刑之順且孝者人得而賞之違天之命者天得而刑之順天之命者天得而賞之或曰何謂違天之命曰天使汝窮而汝强通之天使汝愚而汝强智之若是者必得天刑或曰何謂天刑曰人之刑賞刑賞其身天之刑賞刑賞其神故天之所賞者其神間靜而佚樂以考終其命天之所刑者其神勞苦而愁困以夭折其生彼雖僂然而白首猶貳負之臣桎梏而處諸石下雖踰千嵗惡足稱壽哉或曰夫士者當美國家利百姓功施當時澤及後世豈獨齪齪然謹司其分不敢失隕而巳乎曰非謂其然也智愚勇怯貴賤貧富天之分也君明臣忠父慈子孝人之分也僣天之分必有天災失人之分必有人殃堯舜禹湯文武勤勞天下周公輔相致太平孔子以詩書禮樂教洙泗顔淵簞食瓢飲安於陋巷雖徳業異守出處異趣如此其逺也何嘗捨其分而妄為哉言戒迃夫曰言不可不重也子不見鐘鼓乎夫鐘鼓叩之然後鳴鏗訇鏜􅝅人不以為異也若不叩自鳴人孰不謂之祅邪可以言而不言猶叩之而不鳴也亦為廢鐘鼓矣䘌齒迃夫病䘌齒呻吟之聲達於四鄰通夕不寐有道士過之問曰子知病之所來乎曰不知也道士曰病來自天天且取子之齒以食食骨之蟲而子拒之以違天也夫天者子之所受命也若之何拒之其必與之迃叟曰諾於是以齒與蟲惽然而寐一夕而愈蠆祝迃夫夜立於庭拊樹而蠆螫其手捧手吟呼痛徹於心家人呼祝師祝之祝師曰子姑勿以蠆為慘烈以為凡蟲而藐之曰是惡能苦我哉則痛巳矣從之少選而痛息迺謝祝師曰爾何術而能攘蠆之毒如是其速也祝師曰蠆不汝毒也汝自召之余不汝攘也汝自攘之夫召與攘皆非我術之所能及也子自為之也於是迃夫嘆曰嘻利害憂樂之毒人也豈直蠆尾而巳哉人自召之人自攘之亦若是而巳矣飯車天雨迃夫出見飯車息於高蹊者指謂其徒曰是車也將覆不久矣行未十步聞讙聲顧見其車巳覆其徒問曰子何由知之迃夫曰吾以人事知之夫天雨道濘而蹊獨不濡又狹而高是衆人之所趣也而車不量其力固狹擅高久留不去以妨衆人之欲進者其能無覆乎禍有鉅於此者奚飯車之足云拾樵迃夫見童子拾樵於道約曰見樵先呼者得之後毋得爭也皆曰諾既而行相與笑語戲狎至驩也瞲然見横芥於道其一先呼而衆童子爭之遂相撻擊有傷者迃夫惕然亟歸而嘆曰必天下之利大於横芥者多矣吾不知戒而日與人遊恃其驩而信其約一旦有先呼而鬭者能無傷乎知非嘉祐三年五月二十五日作或曰蘧伯玉五十而知四十九年非信乎曰何啻其然也古之君子好學者有垂死而知其未死之前所為非者況五十乎夫道如山也愈升而愈高如路也愈行而愈逺學者亦盡其力而止耳自非聖人有能窮其高逺者哉天人熙寧七年三月十六日作迃叟曰天力之所不及者人也故有耕耘斂藏人力之所不及者天也故有水旱螟蝗無怪迃叟曰有兹事必有兹理無兹理必無兹事世人之怪怪所希見由明者視之天下無可怪之事理性元豐二年十月二十八日作易曰窮理盡性以至於命世之高論者競為幽僻之語以欺人使人跂懸而不可及憒瞀而不能知則盡而捨之其實奚逺哉是不是理也才不才性也遇不遇命也事親元豐四年作迃叟事親無以踰人能不欺而巳矣其事君亦然事神元豐四年正月十六日作或問迃叟事神乎曰事神或曰何神之事曰事其心或曰其事之何如曰至簡矣不黍稷不犧牲惟不欺之為用君子上戴天下履地中函心雖欲欺之其可得乎寛猛元豐四年十月作迃叟曰寛而疾惡嚴而原情政之善者也回心或問子能無心乎迃叟曰不能若夫回心則庶㡬矣何謂回心曰去惡而從善捨非而從是人或知之而不能徙以為如制駻馬如斡磻石之難也靜而思之在我而巳如轉戸樞何難之有無益元豐六年二月十七日作迃叟曰言而無益不若勿言為而無益不若勿為余久知之病未能行也學要元豐六年五月二日作迃叟曰學者所以求治心也學雖多而心不治安以學為治心元豐六年六月二十三日作迃叟曰小人治迹君子治心文害元豐六年七月十八日作或謂迃叟子於道則得其一二矣惜乎無文以發之迃叟曰然君子有文以明道小人有文以發身夫變白以為黑轉南以為北非小人有文者孰能之道大元豐六年八月一日作迃叟曰聖人之道如天地天地之間靡所不有衆人之道如山川如陵谷如鳥獸如艸木如蟲沙各盡其分不知其外天地則無不包也無不徧也毋我知孔子曰殷有三仁焉蓋孔子之前為比干者則非微子矣為微子者則非比干矣為箕子者則非比干與微子矣至孔子然後人知三子者皆仁人也孔子曰微管仲吾其被髮左衽矣如其仁如其仁孟荀氏之言曰仲尼之門五尺童子羞稱五伯以是觀之孟荀氏之道槩諸孔子其隘甚矣道同元豐六年作迃叟曰合天下而君之之謂王王者必立三公三公分天下而治之曰二伯一公處乎内皆王官也周衰二伯之職廢齊桓晉文糾合諸侯以尊天子天子因命之為侯伯修舊職也伯之語轉而為霸霸之名自是興自孟荀氏而下皆曰由王道而王由伯道而霸道豈有二哉得之有淺深成功有小大耳譬諸水為畎為澮為谷為谿為川為瀆若所鍾則海也大夫士畎澮也諸侯谿谷也州牧川也方伯瀆也天子海也小大雖殊水之性奚以異哉絶四元豐六年作或問子絶四何以始於毋意迃叟曰吉凶悔吝未有不生乎事者也事之生未有不本乎意者也意必自欲欲既立於此矣於是乎有從有違從則有喜有樂有愛違則有怒有哀有惡此人之常情也愛實生貪惡實生暴貪暴惡之大者也是以聖人除其萌塞其源惡奚自而至哉或曰毋意於惡既聞矣敢問聖人亦毋意於善乎曰不然聖人之為善豈有意乎其間哉事至而應之以禮義耳禮者履也循禮則事無不行義者宜也守義則事無不得聖人執禮義以待事不為善而善至矣聖人豈有意乎其間哉或曰然則聖人之心其猶死灰乎曰不然聖人之心如宿火耳夫火宿之則晦發之則光引之則然鼓之則熾既而復掩之則乃晦矣深而不消久而不滅者其宿火乎聖人之心亦然治其心以待物物至而應事至而辨豈若死灰哉灰死則不復然矣奚所用哉或曰毋固毋必奚以異乎曰在我為固在人為必聖人出處語黙惟義所在無可無不可奚其固成敗禍福繫命所遭誰得而知之奚其必或曰然則何以終於毋我曰有意有必有固則有我有我則私私實生蔽是故泰山觸額而不見雷霆破柱而不聞無意無必無固則無我無我則公公實生明是故秋毫過目無不見也飛蚊厯耳無不聞也其得失豈不逺哉求用元豐六年作或曰士不好富貴則為士者不得其用刑賞不行矣迃叟曰小人有才必求用於世以利其身不賞不勸不刑不懲君子有才亦求用於世以行其道勸不待賞懲不待刑自古亂臣賊子未有不出於好富貴者也為上者亦何利焉負恩元豐七年四月二十八日作迃叟曰受人恩而不忍負者其為子必孝為臣必忠羨厭元豐七年三月十五日作迃叟曰人情苦厭其所有羨其所不可得未得則羨巳得則厭厭而求新則為惡無不至矣老釋元豐七年十二月二日作或問老釋有取乎迃叟曰有或曰何取曰釋取其空老取其無為自然捨是無取也或曰空則人不為善無為則人不可治奈何曰非謂其然也空取其無利欲之心善則死而不朽非空矣無為取其因任治則一日萬㡬有為矣鑿龍門辨元豐七年十二月二日作或問禹鑿龍門闢伊闕有諸迃叟曰龍門伊闕天所為也禹治之耳非山横其前水壅其流禹始鑿而闢之然後通也或曰何以知之曰孟子云禹之行水行其所無事若鑿山以通水不可謂之無事矣無為賛元豐八年正月十九日作學黄老者以心如死灰形如稿木為無為迃叟以為不然作無為賛治心以正保躬以靜進退有義得失有命守道在巳成功則天夫復何為莫非自然聖窮聖人専以利人為心於術無不知也穀而可辟則不教人耒耜矣死而可違則不教人棺槨矣夫豈非天使民食且死雖聖人不能違乎諱有人之情諱有而不諱無離婁之明人謂之瞽不愠矣栁下惠之和人謂之汚不怍矣斥莊或曰莊子之文人不能為也迃夫曰君子之學為道乎為文乎夫唯文勝而道不至者君子惡諸是猶朽屋而塗丹雘不可處也眢井而羃綺繢不可履也烏喙而漬飴糖不可嘗也而子獨嗜之乎或曰莊子之辨雖當世宿學不能自解迃夫曰然則佞人也堯之所畏舜之所難孔子之所惡是青蠅之變白黑者也而子獨悦之乎辨揚或曰揚子之諂也以王莽為可以繼周公軼阿衡迃夫曰得巳哉揚子之為書也品藻當世蜀莊子真仲元靡不及焉莽宰天下而自況於伊周敢遺諸子何鮑之死不可不畏也雖然莽自況伊周則與之況黄虞則不與也其志將曰為伊周而止斯可矣不止而至於簒伊周豈然哉無黨或曰吾子擯莊而引揚或者為黨乎曰無黨也使莊為揚書斯與之矣揚為莊言斯拒之矣孰黨哉兼容或曰甚矣子道之隘也奚容之不兼迃夫曰沱潛之於江也榛楛之於山也兼容焉可也莠之於苖也冰之於火也欲兼得乎哉指過或曰有人於此人指其過而告之則喜何如迃夫曰君子也或曰曷若無過而指諸迃夫曰君子履中正而行者也故有過則人得而指諸若夫不中不正之人終日所為皆過也又安得而指之難能或曰堯舜之徳何以為難能迃夫曰舜自修於畎畝之中而聞於堯此舜之難也舜在畎畝之中而堯知之此堯之難也三欺迃夫曰鞠躬便辟不足為恭長號流涕不足為哀弊衣糲食不足為儉三者以之欺人可矣感人則未也君子所以感人者其惟誠乎欺人者不旋踵人必知之感人者益久而人益信之官失迃叟曰世之人不以耳視而目食者鮮矣聞者駭曰何謂也迃叟曰衣冠所以為容觀也稱體斯美矣世人捨其所稱聞人所尚而慕之豈非以耳視者乎飲食之物所以為味也適口斯善矣世人取果餌而刻鏤之朱綠之以為盤案之玩豈非以目食者乎天人迃叟曰天之所不能為而人能之者人也人之所不能為而天能之者天也稼穡人也豐歉天也傳家集巻七十四欽定四庫全書傳家集巻七十五宋司馬光撰格投壺新格熙寧五年作傳曰張而不弛文武弗能也弛而不張文武弗為也一張一弛文武之道也君子學道從政勤勞罷倦必從容宴息以養志游神故可久也蕩而無度將以自敗故聖人制禮以為之節因以合朋友之和飾賔主之歡且寓其教焉夫投壺細事遊戲之類而聖人取之以為禮用諸鄉黨用諸邦國其故何哉鄭康成曰投壺射之細也古者君子射以觀徳為其心平體正端壹審固然後能中故也蓋投壺亦猶是矣未審度於此而取中於彼仁道存焉疑畏則疎惰慢則失義方象焉左右前却過分則差中庸著焉得十失二成功盡棄誡慎明焉是故投壺可以治心可以修身可以為國可以觀人何以言之夫投壺者不使之過亦不使之不及所以為中也不使之偏頗流散所以為正也中正道之根柢也聖人作禮樂修刑政立教化垂典謨凡所施為不啻萬端要在納民心於中正而巳然難得而制者無若人之心也自非大賢守道敦固則放蕩傾移無不至求諸少選且不可得是故聖人廣為之術以求之投壺與其一焉觀夫臨壺發矢之際性無麤宻莫不聳然恭謹志存中正雖不能久可以習焉豈非治心之道歟一矢之失猶一行之虧也豈非修身之道乎兢兢業業慎終如始豈非為國之道歟君子之為之也確然不動其心儼然不改其容未得之而不懾既得之而不驕小人之為之也俯身引臂挾巧取奇苟得而無愧豈非觀人之道歟由是言之聖人取以為禮宜矣彼博奕者以詭譎相高以殘賊相勝孔子猶曰飽食終日無所用心為之猶賢乎巳況投壺者又可鄙略而輕廢哉古者壺矢之制揖讓之容今雖闕焉然其遺風餘象猶彷彿也世傳投壺格圖皆以奇雋難得者為右是亦投瓊探􅍐之類耳非古禮之本意也余今更定新格増損舊圖以精宻者為右偶中者為下使夫用機徼倖者無所措其手焉壺口徑三寸耳徑一寸高一尺實以小豆壺去席二箭半箭十有二枚長二尺有四寸以全壺不失者為賢苟不能全則積算先滿百二十者勝後者負俱滿則餘算多者勝少者負為圖列之左方并各釋其指意焉有初箭十算首箭中者君子作事謀始以其能慎始故賞之第二箭以下連中不絶者皆五算若一箭不中次箭皆為散箭其違中内有貫耳及驍者其箭別計假若有初箭仍貫耳則二十算是也舊圖初箭一籌其次每箭加二籌盡四箭而止甚非勸功之道今自二箭以下連中不絶者皆賞之所以勉人於不解也全壺無算無算者不以耦之算數多少皆勝之也若兩人俱全則復計其餘算以次勝負夫為山九仞功虧一簣全壺實難故君子貴之有終十五算末箭中也靡不有初鮮克有終故比之有初又加五算也散箭一算貫耳十算耳小於口而能中之是其用心愈精故賞之驍箭十算何謂之驍皆俊猛意也謂投而不中箭激反躍捷而得之復投而中者也為其巳失而復得之不逺復善補過者也故賞之若復投而貫耳者其算別計復投而不中者廢之敗壺不問巳有之算皆負謂十二箭皆不中大無功也若兩人皆敗則亦計餘算以決勝負横耳謂箭横加耳上舊五十籌横壺横加壺口舊四十籌皆依常算無賞偶然而横非投者工何足以賞若為後箭所擊而墜地者與不中同倚竿箭斜倚壺口中舊十五籌龍首倚竿正箭首正向已者舊十八籌龍尾倚竿而箭羽正向已者舊十五籌狼壺轉旋口上而成倚竿者舊十四籌帶劒貫耳不至地者舊十五籌耳倚竿舊十五籌皆廢其算傾邪險詖不在於善而舊圖以為奇箭多與之算甚無謂也今廢其算所以罰之然亦異於不中者故於連中全壺皆為通數若為後前所擊及同自墜壺若耳中者復計其算墜地者與不中倒中舊百二十籌倒耳舊不問籌數並滿壺中之算盡廢之顛倒反覆惡之大者奈何以為上賞今盡廢其算所以明逆應之道䇿問學士院試李清臣等䇿問一首熙寧三年三月二十八日王介甫言於上以為天命不足畏祖宗不足法流俗不足恤故因䇿目以此三事質於所試者范景仁復至曰流俗不足恤一事我巳為䇿目矣遂刋之明日禁中以紙帖其上别出䇿目試清臣等問先王之治盛矣其遺文餘事可見於今者詩書而巳矣詩曰文王陟降在帝左右書曰面稽天若蓋言王者造次動靜未嘗不考察天心而嚴畏之也詩曰毋念爾祖聿修厥徳書曰有典有則貽厥子孫蓋言三代嗣王未有不遵禹湯文武之法而能為政者也詩曰先民有言詢於芻蕘書曰有廢有興出入自爾師虞庶言同則繹蓋言與衆同欲則令無不行功無不成也今之論者或曰天地與人了不相關薄食震揺皆有常數不足畏忌祖宗之法未必盡善可革則革不足循守庸人之情喜因循而憚改為可與樂成難與慮始紛紜之議不足聽采意者古今異宜詩書陳迹不可盡信邪將聖人之言深微高逺非常人所能知先儒之解或未得其㫖邪願聞所以辨之賢良䇿問一首為邵興宗作皇祐四年問
