body:
  text: 請更張新法劄子元豐八年五月二十八日上臣聞詩云毋念爾祖聿修厥德故夏遵禹訓商奉湯典周守文武之法漢循高祖之律唐行太宗之制子孫享有天禄咸數百年國家受天明命太祖太宗撥亂返正混一區夏規模宏逺子孫承之百有餘年四海治安風塵無警自生民以來罕有其比其法可謂善矣先帝以睿智之性切於求治而王安石不達政體專用私見變亂舊章誤先帝任使遂致民多失職閭里怨嗟陛下深知其弊即政之初變其一二歡呼之聲已洋溢於四表則人情所苦所願灼然可知陛下何憚而不并其餘悉更張哉譬如有人誤飲毒藥致成大疾苟知其毒斯勿飲而已矣豈可云姑少少减之俟積以歳月然後盡捨之哉臣曏曽上言教閱保甲公私勞費而無所用之斂免役錢寛富而困貧以飬浮浪之人使農民失業窮愁無吿將官專制軍政州縣無權無以偹倉猝萬一饑饉盗賊羣起國家可憂此皆所害者大所及者衆先宜變更借令皇帝陛下獨覽權綱猶當早發號令以解生民之急救國家之危収萬國之歡心復祖宗之令典况太皇太后陛下同斷國事捨非而取是去害而就利於體甚順何為而不可哉取進止乞改求諫詔書劄子元豐八年上臣先於三月三十日上言乞下詔書廣開言路不以有官無官之人並許進實封狀仍頒下諸路州軍於要閙處出榜曉示鼓院檢院州軍長吏不得抑退臣昨奉聖㫖令入見於今月二十三日到京䝉降中使以五月五日詔書賜臣看閱臣狂瞽妄言曲荷采納豈獨微臣之幸抑亦天下之幸此乃聖主之先務太平之本原也然臣伏讀詔書其間有愚心未安者不敢不冒萬死極竭以聞竊見詔書始末之言固盡善矣中間有云若乃隂有所懐犯非其分或扇揺機事之重或迎合已行之令上則觀望朝廷之意以徼倖希進下則􅃷惑流俗之情以干取虚譽審出於此苟不懲艾必能亂俗害治然則黜罰之行是亦不得已也臣聞明主推心以待其下而無所疑忌忠臣竭誠以事其上而無所畏避故情無不通言無不盡今詔書求諫而又逆以六事防之臣以為人臣惟不上言上言則皆可以六事罪之矣其所言或於羣臣有所褒貶則可以謂之隂有所懐本職之外微有所涉則可以謂之犯非其分陳國家安危大計則可以謂之扇揺機事之重或與朝㫖暗合則可以謂之迎合已行之令言新法之不便當改則可以謂之觀望朝廷之意言民間之愁苦可閔則可以謂之􅃷惑流俗之情然則天下之事無復可言者矣是詔書始於求諫而終於拒諫也臣恐天下之士益箝口結舌非國家之福也又止令御史臺出牓朝堂自非趨朝之人莫之得見所詢者狹伏望聖明於詔書中删去中間一節如臣三月三十日所奏頒布天下使天下之人曉然知陛下務在求諫無拒諫之心各盡所懐不憂黜罰如此則中外之事逺近之情如指諸掌矣取進止辭門下侍郎劄子元豐八年五月二十八日上臣准閤門告報已降吿命除臣守門下侍郎者臣先於熈寧三年䝉先帝除臣樞宻副使臣以才力短拙固辭得免自是至今十有六年臣齒􅄠愈衰精力愈耗忽被恩詔力少任重非所克堪豈敢愛身實恐累國伏望聖慈特寢新命聽臣赴陳州本任所有吿身臣不敢祗受取進止辭門下侍郎第二劄子是日中使梁惟簡賜手詔云賜卿手詔深體予懐更不多免嗣君年德未高吾當同處萬務所賴方正之士賛佐邦國想宜知悉再宣諭前日所奏乞引對上殿訖赴任其日已降指揮除卿門下侍郎切要與卿商量軍國政事早來所奏偹悉卿意再降詔開言路俟卿供職施行遂止不上臣伏䝉聖恩差御藥吳靖方宣詔臣令受新除門下侍郎吿身者聖恩重複惶愧愈深臣性質愚魯學術淺短徒以素仗忠信竊慕公直偶為時俗被以虚名誤䝉累朝甄奨承乏侍臣熈寧初王安石說導先帝置三司條例司始議新法臣以為財聚則民散下怨則上危力曽開陳稱其不可言語拙訥不能感悟㝷䝉聖恩除樞宻副使臣貪愛富貴無異於人顧以君無虚授臣無虚受先帝用臣必以為有益國家苟言無足采臣何敢叨居其位是以累上章奏終辭不拜既而請補外郡又乞散官兩任留臺四任崇福臣區區之心惟望先帝察其何故辭貴就賤一賜召對訪以新法於民間果為利害臣得輸肝瀝膽極竭以聞退就鼎鑊死且不朽飲食寤寐不忘此志幽明難欺天實知之不圖先帝奄棄天下臣隕心泣血謂積年所懐生死莫伸及來奔國喪伏䝉太皇太后特降中使宣諭令無惜奏章臣不意愚誠復有所攄發千載一遇不勝踊躍遂首以開言路為請及其他新法之不便者略舉數條今䝉恩差知陳州又詔令過闕入覲到城之日䝉降中使以開言路詔書賜示臣芻蕘之言遽荷采納且喜且懼無地自容然詳讀詔書中間六事有所未安似名為求諫其實拒諫恐士民見者未達聖意莫敢進言方欲上殿論列不意忽奉恩命俾貳左省臣以非才未敢祗受及以言路不通新法為患皆當今切務遂於今早入一劄子辭免恩命并所准偹上殿劄子二道同於通進司投下未審聖意以臣前後所言果為何如若稍有可采乞特出神斷力賜施行則臣可以策勵疲駑少佐萬一若皆無可采則是臣狂愚無識不知為政豈可以汚高位尸重任使朝廷獲曠官之譏微臣受竊位之責他日有誤國事罪不容誅伏望聖慈特寢新命使得自安其分取進止
