seq: 11
front:
  text: 司馬光撰
  hash: sha256:20c74d74fbfe6f29e5765267ee259ecf851ced80b15d41aaa03d3763e63a1d6d
body:
  text: 古詩二和王勝之雪霽借馬入局偶書勝之家本公侯貴弱冠英才已驚世雒陽多士誰敢倫千古比肩唯賈誼昔遭絳灌深切齒奔走十年為下吏近方抆拭出泥塗稍學和光匿鋒銳㑹計之官豈足為黽勉簿書聊自庇王城九衢臘月尾風雪數朝窮恣睢櫪間款段疲且病借馬於人亦疲曳揚鞭掣轡趨省廷刺蹙不前泥没鼻慨然遂有勞者歌滿紙雄文欻軒輊人生榮遇有早晩視此錙銖勿闗意況君卓犖髙出羣異日青雲終自致鮮車大盖擁驊騮莫忘今朝乗小駟齊山詩呈王學士哲字㣲之江上有竒山羣峯矗如翦昔聞齊刺史置酒升絶巘其人有惠政嘉名自兹逺君來踵其迹詞牒日清簡驪駒時入谷勝地窮搜選問俗復懷人非徒事遊衍吹簫古人吹簫者以和虞韶聲後世不復貴給䘮仍賣餳和始平公見寄嚮來從後車雍容鎮藩垣政成簿書簡終日侍清樽今兹備言職不得登朱門違離詎幾時風色變寒温忽聆吉甫什穆如承話言安得六翮生隨意逺飛翻垂耳倦新羈蹀足思華軒諒無伯樂顧疲勞安敢論又和并寄楊樂道聖主樂忠諫曲從如轉圜玉色粹陽春至仁生自然所慙羣臣愚無以稱開延賤生何為者側足青規前頑石不可鍊安能補髙天狂簡昧大體所依官長賢有如驂之靷左右隨周旋庶幾助山甫衮職無尤愆􅃡思老成人阻親函丈筵豈不寸心勞動為纒徽牽何當執壽巵跪起得差肩相顧藐無期瞻望徒悁悁朝雞贈王樂道小雞距短雙翅垂廣場勇鬬無所施清曉長鳴獨先衆朝者恃此能知時星河滿天月光白東望扶桑悄無色一聲髙舉耳目醒四逺羣隂俱辟易陋巷人踈煙火稀永夜沈沈鐘鼔㣲聞之徐起就盥櫛顛倒不復憂裳衣君家逈居北城曲阿閣嶕嶢日鳴玉蕭蕭風雨得司晨不使無功啄君粟謝始平公以近詩一巻賜示皇家駿命承蒼穹烝民之傑生維嵩聖賢㑹合若符契坐致四海登熈隆三階清平九鼎重指麾拱揖安華戎人情誰不樂將相徃徃皓首忘疲癃北平飲乳尚懷印千秋乗車猶入宫唯公致政年甫至耳目明利志氣充幡然脫去萬鍾禄羽儀髙逺如翔鴻靈臺不復絓塵務至德恬淡含黄中英華純粹積不發事業轉為文字工大篇短韻間金石逺追吉甫流清風刻雕衆物非用意黙與元化參神功應劉鮑謝事竒巧細瑣豈足誇才雄祼圭夷玉清廟器肯與環玦爭玲瓏絳帳生徒東閣客㣲官拘縶如樊籠言詩何敢望商賜幸得誦詠袪童䝉昏花病目不自惜服膺盥手書一通千金之産不可易子孫寳蓄傳無窮早春戱作呈范景仁閏餘春意早卉木先有思嚶嚶羣鳥翔東西各求類伊予忝諌垣動息抱憂悸衮職曠不補言責眞可畏況復禁過從陋巷若囚繫茅茨庇風雨偏隘無餘地時於壞垣隙歴歴生新薺君侯乃比鄰跬歩難自致常思去嵗初西軒學歌吹座客皆故人歡笑無拘忌平生不喜酒是日成爛醉豈言長揖歸良㑹難再值東風忽復來時華一何駛叢竹固無恙夭桃作花異朝廷正清明詎肯容竊位何當遂廢放歡飲還自恣夏夜溽暑鬱不開矗矗雲萬疊長風巻地來凍雨不濡葉雖無潤物功涼泠得所惬須臾號怒息清月照壁頰小冠簮短髪衣裾輕獵獵欹傾依曲几暫爾蘇疲苶坐乆不思眠草間㣲露浥和范景仁西圻野老西郊廣路浮壤黄上天雨泣寒雲蒼鸞旗闟㦸紛晻靄扈從威神歸帝鄉田家老父眉睫白杖藜匍匐泣路傍且云生逢至仁主蠲租罷役嵗為常蠺收百箔桑蔽野麻麥極望無邉疆去年翠華出賽雨錦繡綿絡墟里光拜迎六馬負縑帛孫扶嫗接歸揚揚自分謳歌畢餘景一朝縞素安可防哀聲澒洞徹四極草木慘淡顔色傷螻蟻衰齡不足贖淚如飛雪空霑裳河縈洛貫嵩峯足泉底寰瀛日月長羨門已閉屬車返軛上空瞻金鳯凰種竹種竹南牆隂竹生皆北嚮苟非陽在北竹性安可强乃知就陽意草木皆有情園葵最柔弱獨取傾心名和王介甫巫山髙巫山髙巫山之髙髙不極寒江西來曳練長羣峰森羅十二㦸清狖悲號裂翠崖老蛟怒鬭摧丹壁輕生重利三巴客一葉直衝髙浪白船頭吟嘯坐自如仰視長天不盈尺叢祠象設儼山椒巫祝紛紛非一朝云是髙唐神女之所處至今暮雨常蕭蕭我聞神理明且直興亡唯觀惡與德安肯來從楚國君憑依夢寐為滛昏襄王之心自荒惑引領日望陽臺雲獨不思懷王西行不復返甲光照地屯秦軍蠺食黔中下荆門陵園宗廟皆燒焚社稷飄零不復存嗟嗟若敖蚡冒時篳路藍縷皆辛勤昔予嘗權宰韋城今重過之二十五年矣慨然有懷二十五年南北走遺愛寂然民記否昔日嬰兒今壯夫昔日壯夫今老叟秋懷呈范景仁二首草木正蕃廡孰知天地秋況兹宿雨餘景氣益和柔消揺愧簮紱夢想懷林丘兹志乆未果素髪今已稠仰視白日光浩蕩浮雲流安得黄鶴羽陵風千里逰疇昔共登仕爾来三十秋常晞絲繩直竊恥鴟夷柔蹄涔學鉅海螘垤依崇丘行之不自疑親寡憎怨稠於今不亟去淪胥恐同流努力買良田逺追沮溺逰贈道士陳景元酒籬根委餘菊堦角擁殘葉清言乆不悒何以慰疲苶朋樽涵太和髙興雅所愜誰云居室逺風味自可接范景仁召飲東園呈陳彦升宋次道李才元蘇子容去冬辱嘉招寒風方贔屭今秋侍髙宴晴日正澄麗雖無花蘤繁且有丘樊思雖無山泉樂蹔違塵土氣僕休散城邑馬縱脫羈轡讙呼笑言適散誕冠帶棄殊勝禁掖嚴進止有常地虞帝虞帝老倦勤薦禹為天子豈有復南廵迢迢渡湘水至德逺無象異論紛紛起意疑大聖人姦憸亦如已乃知中下士何由逃謗毁聶著作三舅謫官長沙作耐辱亭書來索詩少連善降志無恤能忍詬兹亭名耐辱締構自吾舅樽前湘水清席下湘山秀於焉忘榮枯終日醉醇酎攻愁若攻敵避喧如避寇困乆理須通非徒保無咎走索伎兒欲誇衆喜占衢路交繫組不厭長縛竿不厭髙空中紛徃來巧㨗如飛猱却行欠膚寸倒絓連秋毫參差有萬一虀粉安可逃錢刀不盈掬身世輕鴻毛徒資旁觀好曹偶相稱襃豈知從事者處之危且勞邵不疑㕔薜荔及竹脩竹非俗物薜荔亦嘉草樹之君子庭人來見逾好侵堦鶴脛細縁壁龍鱗老紛披兩踈翠煙色冝秋早主人日封植清風庶長保和公逹過潘樓觀七夕市織女雖七襄不能成報章無巧可乞汝世人空自狂帝城秋色新滿市翠帟張偽物踰百種爛漫侵數坊誰家油壁車金碧照面光土偶長尺餘買之珠一囊安知杼軸勞何物為􅅙桑紛華不足恱浮侈眞可傷酬江鄰幾問不飲栽菊鄰幾詩曰君實不飲酒庭下多栽菊不知黄花開奈此杯中緑凌晨煙露滋後日風霜促欲表君苦心冝種子猷竹黄菊本天物先隨元化生酒醴廼人功後因儀狄成酒客强親菊菊酒初無情種之荒階側何嘗妨獨醒脩竹氣蕭灑自合生君庭次韻和邵不疑假書江鄰幾知方酣寢為詩通意江翁順天和心迹兩夷簡雖如邉韶寢且異宰予懶平居無時閒經史自課限髙歌慕翰林鳴琴冩中散翛然物外人强為章綬綰官舎苦秋霖瞬息聊休眼勤勩已有餘宴安何愧赧借書誰敢驚欹枕尚未暖不疑神驥才垂耳困皁棧碌碌隨吾儕拜揖把手版毋嫌朱墨倦騰舉已為晚慎勿思山林山林付愚孱八月十七日夜省直紀事呈同舎窮秋直省舎大雨吁可畏九河飜層空入夜愈恣睢置牀東壁根時有塗塈墜颯颯勢將摧怵惕不成寐中宵抱衾立呼燭乆方至徙之近西偏禂帳不能備飛蚊胡不仁忍此加啄噬避煩只深藏悒悒面蒙被須臾漏轉劇枕褥亦沾漬雖起欲何之室中無燥地展轉遂逹旦耿耿負憂悸因思閭井民餬口仰執技束手已連旬妻兒日憔悴嚢錢與盎米薪木同時匱敗衣不足準搏手坐相視予今幸已多敢不自知愧無謀忝肉食念爾但増欷送雷太簡南山有白雲應物任所適欻來非有心倐去還無迹甘澤望霑浹嘉生待蘇息無為遽收巻復入巖間石和王介甫烘蝨天生萬物名品夥嗟爾為生至么麽依人自活反食人性喜覆藏便垢涴晨朝生子暮生孫不日蕃滋踰萬箇透踈縁隙巧百端通夕爬搔不能卧我歸彼出疲奔命備北驚南厭搜邏所擒至少所失多捨置薫燒無術奈加之炭上猶晏然相顧未知亡族禍大者洋洋迷所適奔走未停身已墮細者懦怯但深潜乾死縫中誰復課黒者抱髪亦憂疑逃入幧頭黙相賀腥煙騰起逺襲人袖擁鼻端時一唾初雖快意終自咎致爾殱夷非爾過吾家篋笥本自貧況復為人苦慵惰體生鱗甲未能浴衣不離身成脆破朽繒壞絮為淵藪如麥如麻寖肥大虛膓不免須侵人肯學夷齊甘死餓醯酸蜹聚理固然爾軰披攘我當坐但思努力自㓗清群蝨皆當逺邇播和呉冲卿三哀詩江鄰幾梅聖俞韓欽聖天生千萬人中有一雋傑奈何喪三賢前後纔朞月鄰幾任天資浮飾恥澡刷朝市等山林衣冠同布褐外無涇渭分内有淄澠别逢時敢危言慷慨誰能奪聖俞詩七千歴歴盡精絶初無追琢勤氣質禀清㓗負兹驚世才未嘗自標掲鞠躬隨衆後側足畏蹉跌欽聖渥洼駒初生已汗血雖有絶塵蹤不失和鸞節宜為清廟噐儼雅應鐘律衆論誠共然非從友朋出羣才方大來軮軋扶帝室誰云指顧間聨翩化異物弔縗哭未已病枕氣已竭同為地下遊攜手不相失紳紱頓蕭條相逢但嗟咄誦君三哀詩終篇涕如雪眉目尚昭晣笑言猶髣髴肅然來悲風四望氣蕭瑟和邵不疑送虜使還道中聞江鄰幾梅聖俞長逝作詩哭之昨夕郵吏來叩門致書函呼奴取以入就火開其緘不疑賦長篇發自燕之南痛傷江與梅繼踵良人殱噫嗟知其二尚未知其三請從北轅後覼縷為君談鄰幾雖乆病始不妨朝參飲歠寖衰少厥逆生虛痰逮於易簀辰皮骨餘崆嵌遺書屬清儉終始眞無慙聖俞食寒冰外以風邪兼愚醫暴下之結轖候愈添惙惙氣上走不復容鍼砭自言從良友地下心亦甘欽聖體素彊藥石性所諳平居察舉措敢以不壽占一朝蹔歸卧簿領不廢簽訃來衆皆愕未信猶闚覘興言念三子舉袂涕已霑英賢能幾何逝者迹相銜君疑天上才難得帝所貪我疑人間美多取神所嫌茫茫幽明際蓍蔡難窮探憂來不可忘終日心厭厭和梅聖俞詠昌言五物括蒼石屏主人小石屏得之括蒼山括蒼道里逺致此良亦難層崕萬仞餘騰出浮雲端呉兒采石時蘿蔓愁攀縁石文狀松雪毫髪皆天然置之坐席旁清風常在顔願君善藏蓄永日供餘閒慎勿示要人坐致求者繁將使括蒼民吁嗟山谷間淡樹石屏昔行鞏洛間馬瘦天復隂寒煙淡不收一拂横長林當時無畫工負此清賞心今朝石上迹歴歴皆可尋輕素已紛泊老榦仍蕭森坐令髙興還野氣生衣襟丹青不耐乆風日易消侵何如造化眞更彼嵗月深昌言家素貧購此糜百金請鐫好事名千古無消沈白鶻圖白鶻日邉來一息萬里遥横飛碧海晴六翮寒蕭蕭輕如朔雪花逈與長風飄傾身疊紺爪吟嘯何嘵哮瞥來疾驚電欻起先扶揺遂令狐與狸不敢矜凶妖罻羅不可取滅影還雲霄世人莫得見粉繪圖輕綃凛然堂牖間霜氣生春朝風雨夜如墨古木無鳴梟懷素書上人工書世所稀於今散落無復遺君從何處獲數幅敗絹蒼蒼不成軸雲流電走何縱横昏醉視之雙目明烈火燒林虎豹慄疾雷裂地龍蛇驚須臾掛壁未收巻隂風颯颯來吹面秪疑神物在闇中寳秘不令闗俗眼嗟余平生不識書但愛意氣豪有餘欲求數字置座側安得滿斗千金珠縛虎圖孫生非畫師趣尚頗竒偉為人少諧合不肯畜妻子時時入深山信足動百里蕭然坐盤石盡日曽不起精心忽有得縱筆何恢詭萬象皆自然神工相表裏流傳落人間萬金易寸紙君家縛虎圖用意尤精緻雖云鎖紐牢觀者猶披靡昔聞劉綱妻制虎如犬豕繫之牀脚間垂頭受鞭箠孫生儻未見畫此亦何理明知非世人羽化實不死願君佗日歸置之成都市必有乗槎人庶幾能辨此獨樂園七詠讀書堂吾愛董仲舒窮經守幽獨所居雖有園三年不遊目邪說逺去耳聖言飽充腹發䇿登漢庭百家始消伏釣魚庵吾愛嚴子陵羊裘釣石瀨萬乗雖故人訪求失所在三公豈非貴不足易其介奈何夸毗子斗䘵窮百態采藥圃吾愛韓伯休采藥賣都市有心安可欺所以價不二如何彼女子已復知姓字驚逃入窮山深畏名為累見山臺吾愛陶淵明拂衣遂長徃手辭梁主命犧牛憚金鞅愛君心豈忘居山神可養輕舉向千齡髙風猶尚想弄水軒吾愛杜牧之氣調本髙逸結亭侵水際揮弄消永日洗硯可抄詩泛觴冝促膝莫取濯冠纓紅塵汙清質種竹齋吾愛王子猷借宅亦種竹一日不可無蕭灑常在目雪霜徒自白柯葉不改緑殊勝石季倫珊瑚滿金谷澆花亭吾愛白樂天退身家履道釀酒酒初熟澆花花正好作詩邀賔朋欄邉長醉倒至今傳畫圖風流稱九老和利州鮮于轉運侁字子駿公居八詠桐軒朝陽升東隅照此庭下桐菶菶復萋萋居然古人風踈柯青玉聳宻葉翠羽䝉午景凝餘清夕照當殘紅雨響甍棟外風生户牖中主人政多暇步賞常從容終當致威鳯覧德鳴噰噰又將施五絃解愠歌帝宫竹軒兹軒最灑落歴歴種琅玕正晝簿書稀蕭蕭風雨寒翠隂涼宴坐踈韻承清歡錦籜裁夏扇玉筍供春槃晴蝸潜葉底暝雀投林端幽興遇物愜髙懷隨處安且免一日無何須千畆寛柏軒凜然凌霜色本自生丘壑徙之君子庭栽培固不薄靜夜聲飂飂清晝隂漠漠秀氣逼簷楹翠影通簾箔知君梁棟材大匠偶未度但守嵗寒心閒軒亦不惡巽堂華堂選形勝地直巽之隅主人心㓗齊公閒此燕居西來故鄉客東過朝大夫時逢志所愜下榻同歡娯琴碁間壺觴賦詠雜歌呼民間既羲皇席上宜華胥每思就一醉幸無官守拘奈何三千里風埃與泥塗山齋幽蹊入桃李危棧蟠林麓行行忽虛敞髙齋出山腹園圃近指掌郊郭紛盈目春老酴醿香夏淺篔簹緑條横喜罥衣笋迸乍穿屋秋江澄可巻冬嶺翠如撲煙間漁艇小塞外村居獨燒轉望畬田響答聆伐木驚麏挺走險鳴禽嚶出谷物華時變更興趣日相續誰知使者尊常著野人服肯以駟馬榮區區詫鄉族閒燕亭吏治正倥傯夫君何燕閒繭􅁝既云寡符移皆可删子駿奏減役錢幾半朝廷是之印封從事散躡屐升東山放杖坐危亭清嘯出雲間無私席賔少忘機林鳥還野人瞻翠㣲稽首雙眉斑㑹景亭景物浩無窮兹為一都㑹之人心若鑑萬狀盡相對喬林擁砌底脩嶺倚牕背流雲過席上去鳥出天外徐徐杖屨征藹藹郊原晦來徃亦何為逍遥眞樂内寳峯亭孤亭冠山椒下視物不隔六合縱心賞萬家窮目力髻鬟烏奴翠衣帶嘉陵碧霞生白水尾日没九隴脊煙凝朝夕市塵飛徃來驛雖復對紛紜何嘗改岑寂實兼觀風逺非徒選勝適巴峽少平田每苦天宇窄及兹伏櫺檻坐瞰南北極先君昔乗軺名題古寺壁侍行尚垂髫孤露今戴白讀君登臨詩舊遊皆歴歴永無膝下歡終篇涕霑臆光天聖中侍先君為利州路轉運使題名諸寺子駿皆為之刻石遊壽安詩十首噴玉泉蒼崖雙起秋雲齊亂峯迸出如攅犀石稜澀不容馬蹄下馬步入荆榛蹊瀑泉沃雪拖白霓落潭横引成清溪老木長藤咫尺迷興䦨欲出忘東西神林谷二首石下泉聲蔓草深石上露濃蒼蘚徧山禽驚起飛且鳴葉墜空林人不見雞幘竒峯雲外横青壁千尋不可上却羨樵兒輕險巇腰繩操斧常來徃遊神林谷寄邵堯夫山人有山未嘗遊俗客逺來仍乆留白雲滿眼望不見可惜宜陽一片秋靈山寺流泉去寺猶一里隔林聞水聲安知客乗興山下逺相迎且遊遊人戀山水日晏澹忘歸但愛雲煙好那知僕馬饑永濟渡二首洛水寒可涉長汀桞飛葉節物先無期自與幽懷愜清波見白鷗靜林聞啄木泉細入平沙雲閒出幽谷靈山寺神林興盡謀早歸草間露裛行徑微忽思靈山去不逺馬首欲東還向西垂鞭縱轡尋山足洛水逶迤過數曲漸聞林下飛泉鳴未到已覺神骨清入門拂去衣上土先愛娑羅隂滿庭庭下雙渠走清澈羅縠成紋日光徹寒聲淅瀝入肝髓亂影彯蕭動毛􅄠寺僧引我觀泉源堂東周廻百步寛碧頗梨色湛無底想象必有虬龍蟠泉南髙山名鳯翅宛轉抱泉張逺勢岸旁脩竹踰萬竿颯颯長含風雨氣寺門下望情豁然桑柘紛披滿一川嵩髙女几列左右王屋太行來掌前昔為孔氏懸泉莊巖洞猶存荆棘荒到今其下多怪石熊蹲豹攫爭軒昻嗟予歸來苦不早汩没朝市行欲老捫蘿躡屣須數遊筋力支離難自保藏珠石疊石溪東山下有墜石銜九徑二尺餘其崖上脫處猶存水齧東山根土色渥如丹危峯忽摧脫半崖銜石丸隂陽昔融結神化不可原初疑偓佺養靈藥魑魅觸之無故落又疑蛟龍伏巨卵雷電擊之從此􅖁或者女媧補天餘却下青冥遺耳珠不然盤古戲為樂聊取天弧彈朱雀物理萬狀終難知巧心推求徒自疲不如引客坐石上好竒且醉手中巵八月十五日夜寄友人故人音信絶對月動相思清露滴紅葉此懷當告誰秋風廣陵郭正是望濤時華州祗役徃馮翊留别楚正叔建中芳菲不得駐㑹取餘春還欲知回首處渭曲蒼茫間何秀才漢倫郊園五首主人耽詩書樂道深居乆挾䇿徃來遊東岡復南畆濁酒不取味素琴無復絃何須更清論相見自蕭然蒼蒼竹林暝鬱欝松氣寒縱横興來筆欹側醉中冠褰裳涉幽澗日落煙巖空躊躇待新月長嘯来清風夏木繞茅廬碁酒資清宴密葉緑藏枝空聞黄鳥囀夏日過陳秀才園林桑䕃青青紫葚垂鮮風蕩麥生漣漪驅童䇿馬踏村路乗興出遊當訪誰槿花籬落圍叢竹風日蕭踈滿園緑到門下馬問主人文籍先生其姓陳髙談浩浩究今古不覺林間日將暮茅廬蒿徑幸不遥不厭頻煩數來去陪同年呉沖卿登宿州北樓望梁楚之郊訪古作是詩大禹息洪潦畫野經九州波沈露羣山嶷嶷相嬰鉤㳬洄澹兹土平敞誠寡仇乗髙極回望坦坦無陵丘先王崇皡濟建祀邦諸侯玉帛從㑹同赴告書春秋六雄方逐鹿為嬴弱姬周兹為㑹戰場蹀血無時休漢錯削七國禍生東南陬亞夫閉髙壁坐折彊呉謀典午倒太阿闢户延旃裘淮泗漫腥羶房心掩旄頭人移煙火絶榛茂豺狼遊唐綱日寖衰盗起如螟蟊相攜聚􅍉蒲袒臂提鉏耰蟠薄數千里焚刼無餘留聖朝定多壘劒㦸包貔貅蓁蓁荆棘林膴膴良田疇耒耜趣時雨黍稷豐嵗秋昔為車騎利今睹桑麻收我來宦東土莨菪乗春流行行次符離固為親交留樽罍且為樂攜手登髙樓是時新雨餘風日方和柔雲鮮亂花薄波緑迷芳洲羃羃㳺絲轉衮衮野陽浮調篁語雙鸝飜雪矯群鷗愛兹登臨美況復依良儔聊適笑言樂盡忘羇旅憂翔陽何冉冉漸與西山遒驛程前有期戀此當何由分首下岧嶤悵然登暮舟塞上六言胡兵欲下隂山寒烽逺過蕭闗將軍貴輕士卒幾人回首生還奉和經略龐龍圖延州南城八詠迎薫亭華館壓清波坐待南風至須知明牧賢善逹吾君意供兵磑晨暮響寒泉飛輪駛風轉士飽氣益振輕與先零戰桞湖依依煙未歇漠漠風初靜浮花滿波面不見參差影飛盖園軍中富餘暇飛盖南城隈雍容陪後乗一一應劉才翠漪亭雕簷日華動滉瀁照漪漣四月芰荷滿不似在窮邉延利渠枝分清淺流縱横貫城市還如恩在人潤澤無終既縁雲軒逼漢敞髙巖縁雲結飛閣東山草樹曛致足登臨樂禊堂簫鼔震陽休組練照芳洲意氣坐中客羞笑山隂遊河上督役懷噐之寄呈公明叔度時器之鞫獄滄州河災汎東郡廬井多堙淪題輿得賢佐姁嫗安疲民遂令枯槁餘稍復蘇陽春伊人屏外飾倜儻窮天眞徒觀浩蕩波莫測江海津矧兹同府士一一隨和珍公明抱全德洞澈無緇磷叔度秉峻節竦若凌霜筠顧兹不肖材亦齒幕中賔同依松柏隂共醉醍醐醇髙論探要妙佳句裁清新有詩縱歡謔杯案霑衣巾曽無禮節間但以風期親北州有疑獄兩造正紛綸當須于公斷然後無寃人送行出郊岐揚鞭從此違隄繇春事起行役未成歸索居如幾日河草已芳菲徒然掩瑶瑟坐歎知音稀昨夜西南風夢中東北飛行行涉滄海髣髴睹容暉寤思益惆悵天長羽翼㣲離懷如桞色極目正依依華星篇時視役河上寄郡中諸同舍凉風淨掃雲無迹海月未生星歴歴貝聨珠貫拱北辰三五縱横此何夕重樓疊榭出秋空鳷鵲露寒連桂宫瑶井逈臨丹闕外玉繩斜掛瑣牕中征人逺别空閨悄鐘漏蕭踈天不曉碧紗展轉無復眠卧視寒光度華沼漢家賢將戍臨洮結髪從軍今二毛誰憐身老心猶壯深入長占太白髙豐城古劒沉淪乆匣中夜半雙龍吼乃知神物不自藏紫氣依稀見牛斗有客離居望所親遥知清夜㑹荀陳隄繇未息無由去不及浮槎河畔人宿石堰聞牧馬者歌大河之曲多寛閒牧田枕倚長隄灣烏栖鵲散隄樹寂柝木聲稀宵欲䦨牧兒跨馬乗涼月歴歴繞羣髙唱發幽情逸氣生自然徃徃鳴鞘應踈節歌辭難辨野風髙似述離憂嗟役勞徘徊不斷何妨近髣髴㣲聞已復遥長川冷浸秋雲白露草飜光凝碧色星踈河淡夜初長展轉空亭奈孤客洞簫音律京君明可憐骨朽不更生安得使傳哀怨意為我冩之羌笛聲楊白華勸君勿嫌楊花太輕薄籬下溝中紛漠漠翠鬟婢子不勝愁掃盡還飛滿朱閣晩來風雨送行春天無遊􅁝地無塵雪狂絮亂安可得孤樹青青愁殺人傳家集巻三欽定四庫全書傳家集巻四宋司馬光撰古詩三都下秋懐呈聶之美愚踈強從仕趣尚與時乖朅來遊京邑榮願知誰諧王國富英竒氣象標巖崖雲鴻送雙目攀援路可階秋風轉枯葉颯颯繞寒齋岀門無所之飛塵滿天街夫君宦未達猶得稱吾儕解衣換斗酒且盡平生懐陪張龍圖南湖暑飲六言紅斾縈林却轉瓊筵就水重開荷香著衣不去竹色映酒遥來樓船㶑灔輕浪鷗鷺繽紛滿天清歌乆之未度畫梁塵落芳筵道傍田家道傍田家翁嫗俱垂白敗屋蕭條無壯息翁攜鎌索嫗攜箕自向薄田収黍稷静夜偷舂避債家比明門外已如麻筋疲力敝不入腹未議縣官租稅促送李汝臣同年謫官導江主簿得喪互循環古今昧終始百歳落其間僅與毫芒似所以達人心身外不復紀愁來若亂絲䟽解當以理昔君關外來籍籍聲華起憑案一濡毫萬言俱落紙老生闚其文色若寒灰死閣筆不能下敢有玼瑕指或時抵卿相入門俱倒屣閽夫迎受謁不敢揚眸視解褐吏邉州長塗初進跬蛟龍得尺水雙骼方嶷嶷西羌負德澤飛鏑聳邉鄙添兵十萬餘斗粟無支擬州郡走符檄縱横恣鞭箠閭閻浪愁苦卒食半糠粃上官知君才悉以儲糧委開倉募平糴至者車連軌嚴明束吏手誘諭提民耳留穀受金去若與同儕市弦朔未云周露積丘山比曽無轉餉勞坐飽防秋士幕府上其功明詔深嘉美為僚登九寺長人專百里聊用報勤劬未言窮任使何期逢怨讎意外成瘡痏刺骨舞文法吹毛出瑕滓清霜五月飛慘烈傷蘭芷鸞鳯失椅梧飄泊還荆枳聖朝方任能大過尚収齒况於濟時具蹔然遭詆訾寧因青蠅惡遂取璵璠毁良工構明堂必不遺杞梓勉哉益自立勿為窮衰止人生難豫期神理無終否庸知今日憂不為後日喜吾道誠無虧壈坎安足恥闗山迤邐長百劍連天倚縈紆結危棧逈入雲星裏蜀國富嬉遊花繁春酒㫖莫作弔原文投之岷江水春日書寄東郡諸同舎滑䑓古鎮掲高牙主人賢厚賓友嘉公庭退休射堂飲水沈緑李浮甘𤓰清言妙諭間詼謔笑語往反何喧譁别來汎濫若浮梗塵愁俗累稠於麻提鞭俄葢觸風日慘澁滿眼飛埃沙朱門湛湛果深淺門外日擁千餘車閽人未肯即通刺指彈手版景欲斜就令入見亦何事氣象渺邈凌青霞圍碁角智賭勝負拙者理與功名賖捨之歸入戸庭隘仰視青天如井蛙後檐數尺地荒穢不翦欲令生薺花當春寂寂但如此意恐至外逢紛華奈何勝友百餘里不可一見如天涯何時更共把巵酒側身北望空咨嗟秋日寄山中友人昨夜聽秋風霜崖幾樹紅心隨新鴈去宛至碧谿東聖主搜漁釣林巖今已空胡為執高節憔悴乆山中和之美舟行雜詩八首舟中夜坐二首風栁動蕭踈寒星浸寥落中宵四寂然時有遊魚躍汀沙落席㠶岸栁縈單舸小市逺微茫簇水初燈火船行遇風蔡水僅成波不若江湖濬誠無傾側憂纜弱終難進野花喧喧桃李蹊何妨笑幽草但願保天真徐共春風老水鴨䙰褷出短蒲毰毸浴清水物忌太鮮明何妨染泥滓魚鷹翩然下林表不憚風湍惡得雋輒高飛為君羞擊搏􅊻魚者弱篠絓輕絲盡日寒溪側獲少近知無溪魚皆爾識都門路紅塵晝夜飛車馬古今迹獨憐道傍栁慘淡少顔色和之美河洲四詩冉冉河洲曉晴霞登木杪稍見水煙開孤舟天際小杳杳河洲晩客行殊未返目隨林鳥還心共征鴻逺寂寂河洲夜蘆花繞墟舎孤客乆未眠窓燈落寒灺漠漠河洲雨依稀辨村聚時哉鷗鳥羣凌亂争鳴舞又和夜雨宿村舎積雨乆未闋豈徒行客憂夜聞屋中人歎息悲田疇方春播殖時種食皆外求鞭訶犯赤日酷烈慙羸牛草薉競禾長從人借鉏耰晨薅戴星起日闇未能休豈無一時勤所覬歳有秋今兹昏墊災大埜成洪流直疑滄海溢繭栗浮陵丘昔時百丈原汎汎皆挐舟喬木失端杪飢鳥下無投黍稷沉黄泥圭合安可收嗟予乏技能無以易糠麰販鬻固所昧敢託市井遊欲依盗賊羣懦不閑戈矛已哉任天地無益徒為愁一身無死所況為妻兒謀之美愛物者凄然涕霑裘一夫有不獲伊尹為深羞何當富斯民比屋囷倉稠惜哉禄秩卑此志終宜酬送韓太祝維歸許昌賦得交字王城名利窟冠葢􅉱相交夫君獨鳯舉彯然去喧呶潁水清可濯箕山高可巢反顧公相榮一芥浮堂􅉾逸二字大吕重豈知輕斗筲蒼蒼氣象嚴萬木擁寒郊逸二字㸃隈曲初旭染林梢去去善自將因聲訪衡茅和興宗夜直聽雨逸一字茫凍雨來入夜勢増急縱横挾春風飄灑相噴吸敗忩端見欺遽有萬㸃入先生伏經編眼冷倍昏澁夜分童僕倦跛倚厭乆立燈火為溟濛詩書亦霑濕夫君儲善價未售不悁悒物華迎霽新佳賞時將及囷中秫幾何營醸須汲汲花庵詩寄邵堯夫時任西京留䑓廨舎東新開小園無亭榭乃構木揷竹多種酴醿寳相及牽牛扁豆諸蔓延之物使䝉羃其上如棟宇之狀以為遊涉休息之所名曰花庵洛陽四時常有花雨晴顔色秋更好誰能相與共此樂坐對年華不知老自然天物勝人為萬葉無風緑四垂猶恨簮紳未離俗荷衣蕙帶始相宜康定中予過洛橋南得詩兩句於今三十二年矣再過其處足成一章銅駝陌上桃花紅洛陽無處無春風重來羞見水中影鬢毛蕭颯如秋蓬寳鑑貽開叔流塵集寳鑑塵昏鑑不昏纎泥落清水泥渾非水渾人能辨二物相與自忘言二物不能辨悠悠何足論無為捨其内逐外取煩寃謝王道濟惠古詩古石器緱氏古城裏好古王道濟作詩有古風讀書知古意朝來遣僕夫遺我古石器結從天地初生自一拳際工倕創規摹般輸施剞劂㵸茗北忩下坐有羲皇思嗟予性迂鄙齟齬居今世忝官汚䑓省曽無益時智退藏又濡滯尚不離朝市闕地避煩暑頗與營窟類新構西齋中鑿地為室謂之凉洞誠非古人比拜賜得無愧題太原通判楊郎中希元新買水北園洛陽名園不勝紀門巷相連如櫛齒修竹長楊深徑迂令人邑邑氣不舒愛君買園中橋北堂壓崖端跨空碧滿川桃李皆目前近水逺山一朝得曾陪尊兄此高會豁然如出樊籠外蹔遊尚爾況乆居勝氣清風日相對易生畫筆世所珍麞猿滿壁皆逼真并州近胡沙塵惡終更早來為主人首夏呈諸鄰二章首夏木隂薄清和自一時筍抽八九尺荷生三四枝新服裁蟬翼舊扇拂蛛􅁝莎徑熱未劇晨昏往來宜爞爞久旱天颯颯昨宵雨塵頭清過轍水脉生新渚豈徒滋杞菊亦可望禾黍勿笑盤蔬陋時來一觴舉酬王安之謝藥栽二章洛人栽花不栽藥吾屬好尚何其偏服之雖能已百􅍚愛閒成僻無由痊䕶根帶土我親移荷挿汲泉君自種恱目寧將惡草殊扶危或比兼金重雨中過王安之所居不謁以詩寄之萬木含涼雨驅馬有餘清長街帶短蕪舊潦駢新蓱高齋彼誰居雅尚推名卿汙亭雖地卑躡屐未妨行野服踞藜牀蕭㪚臨前楹纂纂棗林繁欣欣藥畹榮過門不敢叩自視慙冠纓素與安之約不以公服相過送藥栽與王安之盛夏移藥栽及雨方可種為君著屐取呼童執傘送到時雲已開枝軟葉猶重夕陽宜屢澆又須煩抱甕張明叔兄弟雨中見過弄水軒投壺賭酒薄暮而散詰朝以詩謝之喜君午際來涼雨正紛泊呼奴掃南軒壺席謹量度軒前紅薇開壺下鳴泉落虎爪泉上覆之以板每投壺板上設榻繞之榻去壺各二矢半必争如五射有禮異六博求全怯垂成倒置畏反躍新格倒中者壺中之筭盡廢之雖無百驍巧且有一笑樂交飛觥酒滿强進盤餐薄苟非興趣同珍殽徒綺錯小雨雲日互出没數朝飛雨清曈曨似欲止廉纎還未晴映空輕絲亂著物細珠明葉端危未落荷心重忽傾喜涼高鷰舞便濕羣蛙鳴於予亦有得藥畹胡麻生園中書事二絶芳洲晚日鮮曲岸新雨好紅薇㸃圓荷金䔲出幽草坐嗅白蓮蘃卧看青竹枝閒齋不成寐起讀聖俞詩送劉仲通知涇州四載一相逢相逢遽為别儕軰日蕭條與君俱白髮巵酒不暇執舊遊那復說忽忽無他言暑行戒飢渇和宋復古大雨積隂連日作鬱蒸長雲飛天勢如鵬白雨四注垂萬絙坐間斗寒衣可増雷公推車電施鞭飛騰九澤舞百川須㬰開晴萬物鮮仰視白日當青天見山臺晝卧偶成移牀獨上高臺卧颯颯涼風吹面過林蟬忽噪驚薄夢手執殘書幅巾墮修酴醿架貧家不辦構堅木縛竹立架擎酴醿風揺雨漬不耐乆未及三載俱離披往來遂復廢此徑舉頭礙冠行絓衣呼奴改作豈得已抽新換故拆四籬來春席地還可飲日色不到香風吹螢林塘荒濕地向夕已飛螢月没蛩吟砌露涼人在庭隨風疑落燼過水亂踈星學子燈前寢誰將爾照經張明叔家瑞蓮君家得蓮種逺自浙江湄明燭然深盌濃朱畫細絲盛開尤菡萏到落不離披豈獨夏花好仍兼秋實竒味長包石蜜殻嫩剥燕脂況復芬芳乆霜前殊未衰蓮房蓮房前後熟供噉不須齊肉嫩山蜂子稜深天馬蹄尚連餘蘂在深映亂荷低脆美知新采近根猶帶泥不寐長年睡益少氣耗非神清昨朝多啜茶況以思慮并中煩枕屢移展轉何時明蘇秦六國印力取鴻毛輕白圭萬金産運智立可營如何五更夢百方終不成苦雨今春憂亢陽引領望雲族首夏忽滂沲意為蒼生福自爾無虛日高原亦霑足連年困饑饉此際庶和熟如何涉秋序沈隂仍慘黷長簷㵼潺湲晝夜浩相續喧豗流潦怒突兀壊垣秃駕牛泥没鼻跨馬水平腹瓦欹松漫白道廢草濃緑汙萊閔下田漏濕憐破屋縱横委地麻狼藉卧隴榖怯聞飢嬰啼愁聽寡婦哭閒官雖無責飽食愧有禄世紛乆去心物役奈經目欝陶聊秉筆狂簡已盈幅八月十五日夜宿南園懐王君貺昔公在洛師未嘗棄嘉節今宵秋半分空羨西園月天色湛澄清風聲冷騷屑笑言不可親引領望金闕賴有篋中詩端居數披閱八月十六日過天街懐范景仁秋潦収四野晴雲無一斑忽驚龍門缺逺見鳴臯山涼飈入毛髮顥氣清心顔悠然念吾友逍遥城闕間思陪籃輿尾共此登臨閒宿南園頃來興味少旬日不為詩昏昏但思眠疲病知吾衰豈無籬邊菊不欲拈酒巵絡緯爾何苦終夕鳴聲悲九月十一日夜雨宿南園韓秉國寄酒兼見招以詩謝之雨多秋草盛濃緑擁寒階吾廬奥且曲退縮如晴蝸小園已自隘欲往泥霑鞋體羸畏風冷室處門常䦱空媧切九日古所重負此時節佳緬想使君宴綺席臨高齋肥羜堆玉盤飛觴酒如淮楚舞陵湖波茱茰落金釵神醒鼓吹喧百疊疑傾崖歡餘忽我思牙兵星火差潩泉恥獨醉醇味相與偕我飲雖不多和氣浩無涯梧子拾為果拒霜伐為柴沼中數寸魚烹煎足為鮭吳人謂魚肉為鮭誰言無以侑繞渚多鳴蛙交道乆衰薄巋然見吾儕奈何數舎遥晤語積年乖況乃辱嘉招私心豈不懐轘轅石道澁重以隂雲埋雖有果下馬款段非渥洼臨風徒竦踊志願焉能諧狂詩寄一笑聊用當詼俳古墳茫茫野田平極目歴歴古墳如夏屋碑板無文荆棘深石獸沈淪松栢秃問人雖不知姓名昔皆高官仍厚禄子孫流落何所之凶吉當年非不卜我來正值寒食天祭膰不設無人哭酬趙少卿丙字南正藥園見贈鄙性苦迂僻有園名獨樂滿城争種花治地惟種藥栽培親荷鍤購買屢傾槖縱横百餘區所識恨不博身病尚未攻何論療民瘼登封龎國博元常字懋徳年三十八自云欲棄官隱嵩山作吏隱庵於縣寺俾光賦詩勉率塞命懋德負長才全牛不足剸纔為百里宰驥足殊未展齒髮方盛彊趣尚已高逺結庵睋二室志欲巢絶巘賢人心如雲無迹有舒巻不須驚俗目卓犖乃求顯旣知吏可隱何必遺軒冕暮春同劉伯壽史誠之飲宋叔達園絮狂飛作團梅小不多酸共惜春餘好更窮今日歡清流入花底翠嶺出林端嫩筍玉縈筯新櫻珠照盤邀迎嘉客易㑹合故人難寄語門前僕驊騮任解鞍用前韻再呈舊友今餘幾追思鼻可酸休論身外事且盡目前歡薜荔垂隄面酴醿擁席端舞精抽繭緒絃妙落珠盤醇酒囬春易靈丹却老難扶歸不復記酩酊上金鞍示道人天覆地載如洪鑪萬物死生同一塗其中松柏與龜鶴得年稍乆終摧枯借令真有蓬萊山未免亦居天地間君不見太上老君頭似雪世人浪說駐童顔謝王君貺中秋見招不及赴不侍庾公宴月華虛四秋幸逢東閣開又阻西園遊清輝散廣坐孤影隨行輈衮衣如未歸志願終可酬乆雨效樂天體雨多雖可厭氣涼還可喜欲語口慵開無眠身􅂴起一榻有餘寛一飯有餘美想彼廟堂人正應憂燮理聞范景仁遷居許昌為詩寄之天衢名利場塵泥繼朝昏況兹辭榮乆厭苦車馬喧慨然忽高舉翩若黄鵠翻朝賣西城宅暮理南行轅回首豈無懐眷眷望國門想象解装初完美未可論縱横置老屋缺剥周短垣臧獲念去故炊㸑假甖盆㓜穉喜就新階庭走諸孫幸有克家子生事不日温許昌昔名都於今亦雄藩先賢雖已逺風迹凜猶存况復多巨公分義素所敦丞相辭黄閣學士乗朱轓青雲司禁省白首㑹山樊潩水湛寒光盡眼清心魂華堂臨曲渚畫舫承芳樽高談金石諧逸筆風雨奔得朋誠多歡孤陋未可諼時當惠好音獨樂慰荒園送張伯常同年移居郢州楚江白逶迤楚山碧參差玉炊稻粒長縷切魚腴肥羨君盡室行飄然無所羈伐竹營茅茨種橘為藩籬荒坡無四垣但以荷塘圍官雖朝大夫身世已相遺野老坐争席林叟談忘歸猶嫌沮溺徒名字為人知南園飲罷留宿詰朝呈鮮于子駿范堯夫彛叟園僻青春深衣寒積雨闋中宵酒力散卧對滿窓月旁觀萬象寂逺聽羣動絶只疑玉壺氷未足比明潔自用前韻耿耿寐不成迢迢夜未闋良朋悔不留負此當軒月懐想空鬰陶眺聽轉清絶佗時重見過餘樽猶可潔不寐思夢久不效良夜行已䦨此心如杯水擾易澄苦難百年能㡬何萬慮誰能殫棄置勿復尋専取形神安招鮮于子駿范堯夫虚牖延朝光高林散晴靄深夏猶清和閒齋亦爽塏離羣纔宿昔跂佇心已痗楸枰頗光潔置設儼相待軒車能朅来雞黍足充餒和家兄喜晴用王安之韻象龍雖得請躍蜧亦須占既有膏苗益寧無漂麥嫌餘霏方映戸反照忽通簾羇旅愁懐闋農家喜色添田間拾穗滿陌上荷鋤兼預想三川逈秋場萬庾尖病中鮮于子駿見招不往兼呈楚正叔范堯夫時正叔約次日為㑹衰朽拙自將藴積成中病掩扉卧小榻安養惟便静遥知良友集欝若荀陳盛獻醻屏浮飾簡率任真性雖無束帶苦實憚把酒併開囊檢藥物不與樽罍稱筋骸幸復常佗時掃三徑和鮮于子駿秋意好風自逺來小雨初濡地雖當朱夏半已有清秋意新蟬乍孤吟病葉或先墜頓覺愈沉疴蹔喜濯炎熾彩筆動高興瑶徽發幽思賤子獨何為宵涼甘熟寐龍門石樓臨晴空南眺出千里人憐山氣佳予歎禹功美想彼未鑿時極目皆洪水誰知耕桑民幸免魴與鯉坐中呈鮮于子駿范堯夫六言微雨雖妨行樂薄寒却解留花今日且遊小圃明朝更向誰家和范景仁緱氏别後見寄求決樂議雖用其韻而不依次盖以景仁才力高逸步驟絶羣非駑拙所能追故也至樂存要眇失易求之難昔從周道衰疇人曠其官聲律乆無師文字多缺漫仁皇閔崩壊廣庭集危冠紛紜鬭筆舌異論誰能殫或欲狥陳迹竅厚潛鎪剜或欲立私意妄取舊史刊古今互齟齬大抵皆欺讕景仁信其說墨守不可干賤子欲面從誰與換膽肝必求此議決深谷為崇巒何如兩置之試就中和㸔天地育萬物生成適暄寒聖人保四海皇極致阜安樂理亦如此炳煥猶朱丹嘽緩與噍殺折𠂻遺兩端兹道苟不由芒刄難嬰髖魯樂最為備雍徹施三桓齊韶猶肄習太公避陳完唐民聽伴侣不復含悲酸乃知樂有源鐘鼓皆波瀾昨者清明初榆火始改鑚景仁從許來傾都咸聚觀諸公競邀迓非獨惜春殘議樂不復對晝夕且窮歡來時桃李穠去日芍藥䦨三旬只須㬰駛若阪上丸轘轅逢雨别惝怳歸騎單東西步步逺囘首祝加餐仍冀勉中和心廣體自胖和韓秉國招范景仁飲景仁不至云方作書與光論樂小桃佳李實如拳西湖盡眼鋪芳蓮景仁不從鄉賢飲為此樂論方窮研周衰官失疇人散鐘律要眇誰能傳近人欺衆出私意最可閔笑房生顚如光初不辨宫羽是非得失安敢專每煩教諭累百紙頑如鐡石不可鐫王李阮胡相詆毁各執所學何妨偏景仁家居鑄鬴斛欲除民瘼恐未然要須中和育萬物始見大樂之功全同鮮于子駿題和樂亭春禽弄晴朝秋蟲吟雨夕風和振蘭芳露寒滋菊色萬物苟得所隨時各有適矧伊人最靈胡為長慼慼聖人垂大訓燦爛著方册至樂和無聲大禮簡無跡心專守中庸身不蹈邪僻造次常在前須㬰不離側窮通雖百變何往不自得兹亭聊寓名和樂在胸臆王君貺宣徽垂示嵩山祈雪詩十章合為一篇以醻之今秋少雨冬不雪麥寄浮埃根欲絶聖主焦心閔萬民負扆不怡常膳撤詔書朝下徧九州岳瀆百神俱禱求西都留守䖍君命促駕不敢須㬰留嵩高萬仞蟠地中海内衆山無與雄前驅大斾擁千騎波騰雲涌來祠宫牲肥酒香籩豆潔盛服齋明薦毛血有司執事皆肅然寳帳神來風窣屑公心猶畏九閽遥丹誠不能通青霄分留導從屯林麓别張醮具登山椒山椒迢遰峻無極行挽枯藤蹋危石萬室嗷嗷愁死飢敢憚劬勞愛餘力天門上出俄坦平下視一世塵杳冥焚香拜手傾懇惻左右前後皆列星公今三守三川地咫尺嵩高未嘗至詰朝旣畢祠事嚴暫轉鳴珂歴諸寺少林昔為達摩居達摩英靈今有無瘦辭流散滿天下競以兩手捫空虚法王魏氏離宫舊玉刻狻猊曏猶有子孫宗廟皆塵灰止見伽藍存不朽㑹善庭隅千歳松一根二股凌寒空勢如鼎足争秀出泠泠永夜吟霜風少室先生樂閒暇棄官來家玉峯下昔為浪泊據鞍人今結東陵賣瓜舎溪上有堂名掛冠四垣重複皆林巒呼兒掃地喜公到隨分絃歌留盡歡周王太子名聞乆相傳羽化緱山首鶴飛笙逺窅無迹遺廟今人空瀝酒公來本不事遨嬉周流閭里詢疲羸親呼令長囑赤子勿貪榮利窮鞭笞境中羣望無不走回轡仍過鑿龍口奉先暮投林日曛浥澗晨征轍氷厚歸來新詩盈一編明珠大貝相屬聯此行雖不從公後歴歴勝遊皆目前酬吳仲庶龍圖終南山詩泰山魯所瞻終南乃秦望西侵井絡闊北壓鶉野曠條梅韞名材金玉富珍藏飄風何烈烈萬物盡揺蕩屹立不傾倚勢與厚坤壯有如牧伯賢斯民䝉保障雪霜舉世寒千里獨重纊病夫伏閭里非能事微尚顧無孤高實藻飾安可强景行雖不忘詎敢承嘉貺酬永樂劉祕校庚四洞詩貧居苦湫隘無術逃炎曦穿地作幽室頗與朱夏宜寛者容一席狹者分三支芳草植中唐嘉卉周四垂詎堪接賔宴適足供兒嬉自問安取法前脩果慕誰非如太古民營窟避寒威又非學射人空石專致思又非沮漆俗陶復習西夷又非楚司馬金奏相賔儀又非鄭伯有壑谷甘糟醨又非越王子丹宂免憂危又非張巨和崇巖立師資所慕於陵子欲效蚓所為微竅足藏身槁壤足充飢養生旣無憾此外安敢知唯祈膏澤布歌嘯樂餘滋豈羞泥塗賤甘受高明嗤何言清尚士善頌形聲詩困剥固未嘗井復敢終辭傳家集巻四欽定四庫全書傳家集巻五宋司馬光撰古詩四瞻彼南山詩瞻彼南山有梌有棠維葉牂牂君子之燕籩豆洋洋鼎俎將將百羞阜昌上下樂康邦家之光君子萬年撫有四荒受禄無疆瞻彼南山有椐有栩維葉湑湑君子之燕清酒有藇壺樽有楚酌言賜之命之釂之上下以序君子萬年永綏兆民受天之祜瞻彼南山有杞有樅維葉逢逢君子之燕管絲噰噰奏鼓􅣨􅣨自堂徂庭上下肅雍靡有不恭君子萬年令德高明高明有融赫赫明明天命有嚴命我祖考九土是監倭馯之東蠻蜑之南享獻允時靡敢不詹閟兹餘文複閣巖巖萬世是承四方是瞻帝曰卿士左右之臣四方無虞矜爾之勤式觀且遊從予一人于壼于閎于堂于陳金石之符翰墨之珍匪予汝夸祖考之勲多士庶尹羣公百辟拜手稽首答揚休德旣醉旣飽慎思爾職罔顧爾私罔愛爾力惇忠祗敕永奉丕則立民之極載祀千億杕柏寄傅欽之彼杕者柏生于崇巒其葉丸丸君子爰處爰處爰遊匪憂勿憂其樂休休彼郁者蘭生於幽涯其葉菲菲君子爰處爰處爰嬉靡適弗宜忘其渇飢洋洋者舟汎彼中流于渚于洲思其可思知其可知其逝勿追其來勿期園櫻園櫻傷老也園有繁櫻圃有肥菁我酒旣清我殽旣馨我友戾止聊以娛情今我不樂日月其征園有穠李圃有肥杞我酒旣旨我殽旣美我友戾止改憂為喜今我不樂年其有幾園有弱栁圃有肥韭我酒旣有我殽旣阜載笑載歌以宴我友今我不樂年其無乆悠悠汎舟載縱載横白日將傾飄風載驚嗟我老矣髪脫齒零胡為百憂勞此餘生戲下歌項王初破函關兵氣壓山河風火明旌旗金鼓四十萬夜泊鴻門期曉戰關東席巻五諸侯沛公君臣相視愁幸因項伯謝前過進謁不敢須㬰留椎牛高㑹召諸將寳劔泠泠舞席上咸陽灰燼義帝遷分裂九州如指掌功高意滿思東歸韓生受誅不復疑區區蜀漢遷謫地縱使倒戈何足為海仙歌東望海波蒼茫浩渺無所極高浪洪濤黯風色翻星倒漢天地黒隂靈出没互相索東方曈曨景氣清慶雲合沓吐赤精蓬萊瀛洲杳如萍遥觀五樓十二城羣仙劔佩朝玉京祥風縹渺鈞天聲彩幢翠葢煙霞生鸞歌鳯舞入帝鄉紫麟徐驅白鶴翔餐芝茹术飲玉漿千年萬年樂未央孟甞君歌君不見薛公在齊當路時三千豪士相追隨邑封萬戸無自入椎牛釃酒不為貲門下紛紛如市人雞鳴狗盗亦同塵一朝失勢賔客落唯有馮驩西入秦燕臺歌萬古蒼茫空盛衰燕臺賢客姓名誰君看碣石嵓中草寧似昭王擁篲時黄金散盡餘基没易水蕭條烽火飛吳沖卿直舎閻士安畫墨竹歌閻生畫竹舊所聞望中一見遥可分伊予不甚曉佳畫猶愛氣骨高出羣狂枝怒葉凌絹素勢若飛動争紛紜蟠根數節出地底上有積年蒼蘚紋森然直榦忽孤聳意恐出屋排浮雲秋風颯颯生左右耳目灑落遺塵氛乃知良工自神解昧者倣習徒艱勤子猷昔者得収玩不患終朝無此君送伊闕王大夫歌于嗟古之道邈旣逺兮日陵夷而就衰羣儒角逐異端競進兮聖塗榛枳幽昧而難知君獨恥從衆人之後兮軒然高舉逺取而窮追撥去虹蜺汛掃氛濁兮廓然廼得睹夫朝曦授邑於雒之南兮始者旣學今得而施歸風俗於醇厚兮又何西門卓魯之足為消奸化桀折牙杜蘖兮寂不知其所之何者為令之德兮黄童皓首接手而遊嬉菽粟露積牛羊被壄兮百里獨比於太古之時予願解冠棄佩兮受一㕓於伊之埜蓑身笠首兮同邑民以熈熈和錢君倚日本刀歌昆吾道逺不復通世傳切玉誰能窮寳刀近出日本國越賈得之滄海東魚皮装貼香木鞘黄白間雜鍮與銅賈人云真鍮似金真銅似銀百金傳入好事手佩服可以攘祅凶傳聞其國居大島土壤沃饒風俗好其先徐福詐秦民采藥淹留童丱老百工五種與之俱至今器用皆精巧前朝貢獻屢往來士人往往工辭藻徐福行時書未焚逸書百篇今尚存令嚴不許傳中國舉世無人識古文嗟予乘桴欲往學滄波浩蕩無通津令人感嘆坐流涕鏽澁短刀何足云風林石歌蔡著作抗字子直得此石於朱陽山聞君家有風林石鐫刻無㾗畫無迹靡然合勢俱左傾偃蹇常如負風力置之坐側野意生静聽若有颼颼聲忽疑身世在丘壑使我蕭然無俗情黄金白璧豈非好子直視之不為寳天馬歌大宛汗血古共知青海龍種骨更竒網絲舊畫昔嘗見不意人間今見之銀鞍玉鐙黄金轡廣路長鳴増意氣富平公子韓王孫求買傾家不知貴芙蓉高闕北向開金印紫綬從天來路人回首無所見流風瞥過驚浮埃如何棄置歸皁棧踠足垂頭困羈絆精神慘澹筋骨羸舉目雙睛猶璀璨伏波馬式今已無子阿肉腐骨乆枯舉世無人相騏驥憔悴不與駑駘殊神兵淬礪精芒在寳鑑遊塵肯終晦君今鬋剔被鳴鸞尚能騰踏崑崙外苦寒行窮冬北上太行嶺霰雪糺結風崢嶸熊潛豹伏飛鳥絶一逕僅可通人行僮飢馬羸石磴滑戰慄流汗皆成氷妻愁兒號强相逐萬險歴盡方到并并州從來號惨烈今日乃信非虛名隂煙苦霧朝不散旭日不復能精明跨鞍䌫轡趨上府髪拳鬚磔指欲零炭爐炙硯湯涉筆重複畫字終難成誰言醇醪能獨立壺腹迸裂無由傾石脂装火近不熱蓬勃氣入頭顱腥仰慙鴻鴈得自適隨陽南去何溟溟又慙鳦鳥識時節巖穴足以潜微形我來葢欲報恩分契闊非狥利與榮古人有為知已死只恐凍骨埋邊庭中朝故人豈念我重裘厚履飄華纓傳聞此北更寒極不知彼民何以生楚宫行楚王宫中夜未央清歌祕舞㑹華堂木蘭為柱桂為梁隨珠和璧爛同光横吹乍鳴秋竹裂繁絃初度春雨歇九微火樹垂垂滅羅衣紛紛玉纓絶滿朝冠劔東方明宫門未啓君朝醒秦關日夜出竒兵武安君火照夷陵洛陽少年行銅駞陌上桃花紅洛陽無處無春風青絲尾結連錢驄相從射獵北邙東流鞭縱鏑未云畢青山團團載紅日雲分電散無影迹黄雞未鳴巳復出將軍行赤光滿面脣激朱虬鬚虎顙三十餘腰垂金印結紫綬諸將不敢過庭除羽林精卒二十萬注聽鉦鼓觀麾旟肥牛百頭酒萬石爛漫一日供歡娛自言不喜讀兵法智略何必求孫吳賀蘭山前烽火滿誰令小虜驕慢延須㬰緱山引王子吹笙去不還當時舊物唯緱山山深樹老藏遺廟春月秋風空自閒轘轅左界連商雒碧瓦朱欄露華薄經時掩戸庭草深永晝無人澗花落徘徊未下日將西遥望嵩陽煙景微鶴馭飄颻向何許林間空見白雲飛烏栖曲二首風透金鋪結綺錢穿簾入幌舞垂蓮可憐無人夜不曉起視西窓月華皎星踈月明漏水長羅帷翠帳華燈光佳人起舞玉釵墮門外烏棲鴈南過和王介甫明妃曲胡雛上馬唱胡歌錦車已駕白橐駝明妃揮淚辭漢主漢主傷心知奈何宫門銅環雙獸面回首何時復來見自嗟不若住巫山布袖蒿簮嫁鄉縣萬里寒沙草木稀居延塞外使人歸舊來相識更無物只有雲邊秋鴈飛愁坐泠泠調四絃曲終掩面向胡天侍兒不解漢家語指下哀聲猶可傳傳徧胡人到中土萬一佗年流樂府妾身生死知不歸妾意終期寤人主目前美醜良易知咫尺掖庭猶可欺君不見白頭蕭太傅被䜛仰藥更無疑憫獄謡五刑象天有震耀上聖本以防姦邪法官由來少和泰臯陶之面如削瓜況於秦漢任酷吏死人籍籍如亂麻捶楚之求靡不得小者勍刖大滅家君不見古時牢獄地幾多寃骨埋黄沙宫漏謡宫漏清高處處聞六街寂寂夜將分南下河梁緬詰曲北瞻禁闕鬱繽紛黄金鎖閉斗城斜白玉樓通上帝家若木未光潜日月神仙不動積煙霞銅壺銀箭夜何長杳杳亭亭未遽央複道廻廊接西掖千門萬戸遥相當宛轉徘徊不能駐復出宫城透宫樹宫樹烏飛月欲西燭光一道照沙隄龍騎聮翩排閶闔鳯帷岑寂對狻猊廣庭肅肅延冠帶劔佩峥嶸百神㑹施政發令四海春廟堂垂衣天㝢泰窮兎謡二首鶻翅崩騰來九霄兎命廹窄無所逃秋毫就死忽背躍鶻拳不中還飛高安知韓盧復在後力屈但作嬰兒號少年只取一快樂誰念草根腥血毛兎營三窟定何在棘間塹底高丘巔却行百步方躍入未免餘蹤留雪田少年何為無惻隱解鷹縱犬薫以煙人言兎狡非兎狡窘急偷生真可憐張子厚先生哀辭名載先生負材氣弱冠遊窮邊麻衣揖鉅公決策期萬全謂言叛羌背坐可執而鞭意趣小參差萬金莫留連中年更折節六籍事精研羲農訖周孔上下皆貫穿造次循繩墨儒行無少愆師道乆廢闋模範幾無傳先生力振起不絶尚聯綿教人學雖博要以禮為先庶幾百世後復覩三王前釋老比尤熾羣倫將蕩然先生論性命指示令知天聲光動京師名卿争薦延寘之石渠閣豈徒修簡編丞相正自用立有榮枯權先生不可屈去之歸卧堅孤嫠聚滿室餬口耕無田欣欣茹藜藿皆不思肥鮮近因詔書起㝷取病吿旋舊廬不能到丹旐風翩翩人生㑹歸盡但問愚與賢借令陽虎壽詎足驕顔淵況於朱紫貴飄忽如雲煙豈若有清名高出太白巔門人俱絰帶雪涕㑹松阡厚終信為美繼志仍須專讀經守舊學勿為利禄遷好禮效古人勿為時俗牽修内勿修外執中勿執偏當令洙泗風郁郁滿秦川先生儻有知無憾歸重泉景福殿東廂詩皇祐元年作皇祐元年秋八月皇帝臨䇿賢良方正及武舉進士僕與范景仁受詔讎校䇿巻寓直於景福殿東廂凡三日得詩十三首編之左方夜意清夜四無譁深嚴上帝家星翻珠網白斗挂玉樓斜風静虚成韻霜輕未作花還疑漢津客浩蕩寄流槎即日枍栺留深殿倉琅祕九門日長人對直風逈鷰高翻林有蕭踈意雲無片縷㾗鈞天真自到不獨暫飛魂柏落落抱高節秀出青雲端無言磵谷幽自致宫庭難芳風襲玉宇餘露分銅槃不使萬年木嘉名高歳寒御溝萬戸鬱相鉤枝分瑟瑟流縈紆通桂觀隱見帶龍樓碧映千林曙紅飄一葉秋寒波長不竭歳歳奉宸遊賜酒和氣盈金榼恩光湛玉觴應知北山羽猶怯上林霜醇味囘秋色清都近醉鄉山茅霑雨露誓極寸心長菊瑣瑣南陽菊秋潭歳自開孤根擁紅葉落蘂媚蒼苔正以參靈藥因之植紫臺願兼金掌露同入柏梁杯賜果南海荔枝來别館蒲萄成匪頒浹下陳捧拜同驩榮置黍敢先食臨槃多未名懐核待歸種復愁千歳生賜書上聖固天縱英藝皆絶倫時乘萬幾閒翰動如有神用之當豫遊不忘安四民匪頒及羣下絡繹來中宸毰毸靈鳯翔欝怒虬龍振清若四海秋熈如天下春愚臣土芥微亦受雨露均願推賜書意直以古義陳士本學先王所求誼與仁農當服稼穯昏作􅎌畆勤百工備用器不治刺繡文萬商遷有無不通珠翠珍四業旣交修坐令風化純人和衣食豐天應殊祥臻皇心正在此非以能高人怪石昔去江湖鄉來與松桂接圭角老龍脊鋒稜秋劔鋏歴亂枯苔㸃交横敗莎葉㑹使成都人更取神蓍揲未開木芙蓉木末采芙蓉騷人歌所無何言霜花艷不與水芝殊香苞麝臍結茂葉桐隂敷豈若龜巢類飄零老五湖讀武士策漢家求猛士雲集未央宫天外胡星淡山西將種空竒謀紛並進壯節凜生風八陣縱横勢依然見目中觀試騎射閶闔風正清觚稜日初媚材雄集便殿玉座親臨視三河俠少兒初識天子貴天山汗血騮蹀躞金鐶轡揚鞭秋雲高顧盼有餘銳縈回勢可觀罄控動如志毫釐應心目審固參身臂鳴絃電雹驚寸的氷瓦碎龍顔薄笑春喜色連傍侍旦為徒步人暮作彯纓使揚揚出九門親友生意氣須知天地德愼勿忘所自黠羌猶旅拒獫狁方繁熾求為忠義臣無負搜羅意同范景仁寄修書諸同舎烈火非不猛不耗百鍊金寒霜非不嚴不彫竹柏林小人勢利合傾覆無常心君子道德親白首猶視今諸君閨臺秀相得如璆琳離羣一昔期乃爾動悲吟古風乆已衰交道日頺侵願名思友操播之清徽琴和聶之美諷古曲逆從漢祖出竒誰與讓一朝寄天下不及王陵戇海客乆藏機鷗知人未知如何毫末利管鮑亦相欺和之美二貧詩君子尚仁義寳用為身資其人苟不賢富饒亦胡為所以囘憲徒不厭糠與藜當時萬金産令名傳者誰之美初解褐為吏長河湄月得數斗禄僅足供饘糜謂言家無寳不必修藩籬囊衣不自暖乃為偷意窺穿墉入其室探取無纎遺從事借之帶同列乞其衣日高服未具不敢踰門畿蕭條四壁寒獨立空自嗤援毫引幅紙書作二貧詩上言運命邅温飫無時期下嗟職事勞舊學日以隳乃知賢者心不獨憂寒飢􅇄坎雖益多志業終無衰我實甚貧者視君猶白圭行年三十餘碌碌無佗竒庇身太學官旦夕唯鹽虀讀君二貧作我事借君詞君誠士林秀不免青衫卑滿腹豈無才抱蓄未有施不用固為小用之活蒸黎如君有此富豈必藏珠璣財貧非道貧已矣何嗟咨送薯預苗與興宗客從魏都來貽我山藷實散之膏土間春苗比如櫛吾家庭戸狹樹藝苦其宻危根遞扶戴怒牙猶拂欝興言念伊人好嗜與我一家蓄桐君書喜觀氾氏述雖為簮帶拘雅尚林樊逸分獻取其誠豈容羞薄物況聞知藥者餌此等苓术願益君子年康直體無疾散誕得寛壤繁大宜無日蕭梢新蔓抽苯䔿故叢失入冬霜霰嚴葉落掊可出伸如猿臂長拳若熊膰腯拾木㸑銅鼎相期聚書室誰得與其徒谿茶與山栗答昌言求薯預苗冬實散肥壤春苗動新葉雅意非遺人野情聊自愜何言好事者求訪來相疊㑹種十畆餘坐取詩盈篋送冷金牋與興宗蜀山瘦碧玉蜀土膏黄金寒谿漱其間演􅃞清且深工人剪穉麻擣之白石砧就溪漚為紙瑩若裁璆琳風日常清和小無塵滓侵時逐賈舟來萬里巴江潯王城壓汴流英俊萃如林雄文溢箱篋争買傾竒琛夫君乃冠冕辭氣高千尋十載為舉首於今猶陸沉嗟我蓄此紙才藻不足任願以冩君詩益為人所欽縞帶豈多物足明同好心黄鐘聲如雷豈病無知音請以此為質佗年神所臨華軒策駟馬慎勿忘遺簮和端式十題春塘冰春塘含薄冰淅瀝隱隈曲晴日射寒芒柔風折哀玉草樹曽未知波光已先緑煙際鐘蒼茫返照収羃歴寒煙起前山黯同色不辨峯巒美獨有逺來鐘悠揚翠微裏汀洲蘋秋江逸一字澹蕩波急枝難定參差碧葉繁皎潔寒花静幽人吟不歸獨立汀洲瞑漁洲火漁翁繫葉舟逺映楓林宿手携雙白魚呼兒爨山竹深夜寂無人明滅寒江曲寒溪石穹石正嶄岩寒流更清急霜飛敗葉擁波濺蒼苔濕谿僧勿劇來沙鶴方孤立幽谷泉深谷窅無底空聞泉水哀時因秋日照微見碧縈囘谷裏非人境胡麻何處來秋原菊高原向揺落叢菊始滋榮草際浮金碧照人雙目明何須夭生理玉斝泛餘英垂崖鞭山竹引春根垂透蒼崖底綢直老龍鬚佶屈修蛇尾支郎雖畜馬不忍裁為箠古木隂古木夏隂薄蕭蕭蠧葉微豈無緑樹濃愛此風煙姿高僧此休息肩倚瘦笻枝天外峯飛鳥去不息長空黯何極踈峯帶夕暉㸃綴秋天碧禪觀坐超然相望兩沈寂和聶之美雞澤官舎詩七首西齋明府學旣優所聞今得施四境已澄清還以書自怡西齋幾黄巻治原俱在兹題㕔壁百里有民社古為子男國苟有愛物心穉老皆䝉德為身不為人鄙哉陶彭澤縣樓孤樓雖不高足以瞰四逺餉婦陌頭歸田夫桑廕飯敇吏省追胥勿令農事晚葦索索夕風遒瀼瀼朝露裛啅雀裊寒枝宿螢依敗葉眇然秋興長坐與江潮接栁驛道苦車馬田廬悲斧斤誰栽官舎前老朽完天真所願明府心庇樹如庇人向城路村路煙欲暝行人殊未稀借問往來者營營皆有為乃知市朝客趣務良可悲懐翠亭高齋對秋山平望殊不逺雖違獨往心蒼蒼長在眼可嗟都邑遊終日紅塵滿超然臺詩寄子瞻學士使君仁智心濟以忠義膽嬰兒手自撫猛虎鬚可攬出牧為龔黄廷議乃陵黯萬鍾何所加甔石何所减用此始優游當官免阿諂曏時守高密民安吏手斂投閒為小臺節物得周覽容膝常有餘縱目皆不掩山川逺布張花卉近綴㸃筵賔殽核旅燕居兵衛儼比之在陋巷為樂亦何歉可笑夸者愚中天猶慘慘今古路行出門道路多縱横不我測我今欲逺行須問曽行客徐徐逢路人咨問青松側客曰君何往答曰遊京邑客乃指要路而言行有益古路雖大道不如今路直但行今人路猶如假羽翼彼客别我去獨自踟蹰立為見今古路無乃須差忒今路足輪蹄古路饒荆棘欲行今人路恐背古人迹擬行古人路今人笑迂僻又擬不出門奈有飢寒逼哀哀於此情悠悠蒼天色不避今人嫌路須行古陌古陌雖然逺且保無厥失勉哉自勉哉前古難知識不復見楊朱萬古凝愁魄憶同尋上陽故宫路上陽門外雲連草車馬遥遥往來道昔王遊豫幾何年今人豈識當時好明珠翠羽已成塵道上行人幾畨老當時秋天落宫槐今此婆娑皆合抱秋意呈鄰幾冲卿新凉入閭巷舊暑何人掃筠籠賣紅蓮莎堦墜丹棗蕉衫日以踈紈扇安能好蟬悲西風樹燕亂斜陽草此意屬淵明籬邊幾樽倒傳家集巻五欽定四庫全書傳家集巻六宋司馬光撰律詩一御製後苑賞花釣魚奉聖㫖次韻馺娑蜚亷次第開鳴鞘傳蹕自天來雲隨綵仗低臨幄栁壓金隄翠入杯檻倚柔風絲縹渺花飜麗日影徘徊上林春色長如舊玉輦嬉遊歳歳陪奉和御製龍圖等閣觀三聖御書嘉祐七年十二月二十七日上積厚丕丕業重光郁郁文寳書垂列宿玉字切浮雲散帙鳴鑾駐充庭雜珮分願移天縱藝似續聖功勤資善堂宴餞應詔士論歸清德皇心重老成陳謨侍經席得謝解塵纓坐密金章並行徐玉醴清都門昔供帳疏傅未為榮賞花釣魚二首飛亷通上苑鳷鵲帶天淵樹色含春霧波光静曉烟香飄仙仗外花舞御巵前籊籊文竿裊簁簁素鮪鮮誤陪金馬籍愧奉栢梁篇願獻南山壽宸遊侍億年日麗芙蓉闕春榮太液波苑門鳴玉集輦路翠華過芳樹周阿宻嘉魚在渚多浮英入樽斚頒首出蒲荷人樂熈熈德臣賡旦旦歌萬生同鼓舞相與醉天和邇英閣讀畢後漢書䝉恩賜御筵赤伏開興運昆陽定壮圖官儀還舊物郊兆建新都杲日羣隂破油雲萬類蘇鑾輿陟喬嶽璽綬撫匈奴厚禄優諸將嘉猷訪大儒重明紹堂構奕葉奉規摹叔世條綱紊遺風節義扶袁安空隕涕揚震卒䝉􅇳佞指車前鹿人瞻屋上烏炎精盡河渚黄眚兆當塗青簡傳良直金華侍燕娛興衰炳轍迹淑慝粲龜符赫赫天光照孳孳睿思紆方齊建武治不啻永平俱化盛文明正恩隆飲食需晞陽慙杞棘濡咮愧鵜鶘帝力生成大臣功報效無先民誠可監願不忘斯須奉和江鄰幾文德殿觀文武百官等上尊號十五韻六月七日舜禹曽何與羲農實强名含靈徒叶賛造物始無情閶闔非煙澹觚稜曉氣清葳蕤大衢隘殷轔外朝盈鮮旭分衣繪薫風拂佩瓊華顚方内集殊俗海隅傾棨㦸金閨奥囊書赭案横敷言齊列位稽首從羣卿不報乾坤施難圖日月明仁心由性得治體與時行金石皆中欵丹青豈外榮功歸元首重澤及草茅輕業業冲虚意區區愛戴誠何為猶讓德不以慰懐生退復歌天保期於采頌聲和宋次道大慶殿上元迎駕鳯律年華到尚新九重氣象已成春曉雲低拂羽林仗宿雨先清紫陌塵玉殿鳴鞘傳警蹕彤庭委珮集簮紳闕前無復魚龍戲自有驩謡億萬人寒食御筵口號二首雨意沉沉潑火餘䕫龍盛集退朝初酒殽絡繹來丹禁冠劔参差下玉除紫鳯歸飛雲爛漫黄鸝新囀栁扶踈麥禾滿野邊烽息佳節何妨賦樂胥聖主襃優鼎軸臣金觴玉醴照青春萬家煙火朝來静九陌風光雨後新高鷰飜飛驚紫綬餘光㸃綴託朱輪問牛因得觀民俗不獨嬉遊惜令辰春祠致齋寄呈范景仁宋次道比日聚官舎笑言曽未厭暫成揮手别各有侍祠嚴晴景朝朝麗春容物物添解齋當共醉莫遣此期淹和王道粹春寒趨館馬上口占殘臘尚要春清寒更著人雪華猶惜别物意倍添新雲壓宫城重風調玉漏勻行遊宜結轡九陌未多塵同宋次道元日宿尚書省聽戒誓寄常州卲不疑去年是日次道同不疑齋直椒花獻歳新瑄玉侍祠頻此夕同華省非才愧後塵江風迎茜斾沙雨待朱輪不比齋宫冷端居棄擲春正月三日與廣淵同出南薫門分趨齋宫塗中成並轡出都門蔥蘢日欲昕野寒餘宿雪樹闇濕春雲未望郊宫近先愁馬首分一朝猶戀戀可復乆離羣二月二日太常致齋晨起呈范景仁宋次道二同舎官舎春蕭瑟朝來尚薄寒人雖繁陌上塵不近門端已負踏青約同舎先有是約仍無舉白歡從次道求酒不獲故云慿君御溝上試折栁條看和王道粹垂拱早朝王范二直閣班列在前戲成小詩霽日扶霜仗祥煙覆曉班帝居囘北斗天闕竦南山紫殿鴻鸞肅金門虎豹環蓬萊兩仙伯逈立白雲間和宋子才郎中孟秋省直夜乆殘暑盡好風來滿襟牀空唯置枕冠小不施簮竹影亂凉月林梢轉曉參人心有喧寂何必卧雲岑八月五日夜省直大火已西落温風猶襲人留連惜紈扇散誕脫紗巾蟾影夜色淺蛩聲秋意新圖書足自適何物更關身八月七日夜省直苦雨三首夜色槐隂重雨聲官舎寒野農安敢問環堵未能完盡日流雲度何時大塊乾正愁開霽晚霜霧滿紅欄悵望中秋月於今已上弦明生圭様小影露桂花偏幽思邈難致浮雲去不還何當出隂翳清徹照中天菊蘂如排粟青青見葉心未嘗窺白日何以散黄金欹側踈籬短綿延蔓草深寒蛩爾何與終夕亦悲吟次韻和江鄰幾九月五日省直羣騶布路散瘦馬解鞌廻雨闋蟲聲樂秋深菊意催圖書紛自適僚友邈誰陪何以消寒夜殘醪不滿杯和宋次道奉慈齋宫見寄去住邈如霄與塵依依欲别更相親雖知洛邑饒英俊莫忘齋廬並直人次韻和王勝之十二月十五日朝退馬上作瓦溝微白雪光清闕角初紅海日騰塵息長街千騎入鞘鳴深殿六龍昇雲巖有客空囘首圭蓽何人尚曲肱自笑鯫生章綬縛不容逃去正如􅊻又和雪四簷冰管未全晞一夕隂風雪又飛客卧牛衣憂死别人留玉塞望生歸公車歳晩憐東郭遼海雲深失令威頗憶當年映書否物華如舊鬢毛非和王粹道雪夜直宿天禄凝嚴近紫臺書幃夜對雪華開層樓直倚寒空出清漏還從深殿來薄夢不成氷柱折曉光先到玉花催兎園終是諸侯事虚費相如能賦才館宿遇雨懐諸同舎佳雨濯煩暑翛然生暁涼森沉殿瓦碧羃歴井苔蒼院静杉篁秀人閒鐘鼓長憑誰同把酒清興窅相望寒食南宫夜飲積旬留省署容易度春華芳草踏青晚長楸行樂賖雲踈時送雨風細暗飛花直有黄金百無因過酒家和范景仁夜讀試卷案前官燭墮花頻滿目高文妙入神勇氣先登勢無敵巧心後發語尤新好賢何啻三薫貴求寳方知百汰真愚魯自非憑驥髪崑山千里到無因代叔禮作使北詩人主愛民物心無彼此情約歡同一國䝉福徧羣生玉帛遥相望風波寂不驚熈熈南北海所至盡升平又擊毬肅奉乘軺命仍陪戲馬遊朋分初逈出勢合復相収顧盼華星激縈囘紫電流良因重嘉好禮接使臣優同宋次道陪讌瓊林冠葢連翩數里塵帝家全借上林春鵷行不動煙霞秀龍角正高雷雨新喜氣晴曛宫樹緑飛花醉墮玉巵頻蒲萄盧橘應相識半是當年舉酒人是日在席同年七人寄題興州晁都官仲約東沼沼上有唐鄭都官詩刻石名郎遊勝地心跡繼風流昔為題詩著今因好事修四山相照映五馬屢淹留想見波光淨依然一片秋鄭詩云徹底千峯影無風一片秋和趙子輿龍州吏隱堂四望逶迤萬疊山微通雲棧落塵寰誰知吏道自可隱未必仙家有此閒酒熟何人能共醉詩成無事復相關浮生適意即為樂安用腰金鼎鼐間寄題錢君倚明州重修衆樂亭公輔横橋通廢島華宇出荒榛風日逢知已湖山得主人使君如獨樂衆庶必深顰何以知家給笙歌滿水濵題楊中正供奉洗心堂崇勲之孫閥閱盛山西朱門颺㦸衣雅知名教樂深笑宴遊非一室琴書隘三年園圃稀異時論事業肯復讓輕肥寄題李舎人偉蒲中新齋隴上家聲勇氣殊邊庭卧鼔欲安居非同王翦私求宅更似甘寧晩好書劔倚寒窓風淅瀝門無雜客栁蕭踈蒲州風土平生愛為問旁鄰地有餘寄題常州東山亭二首謝傅英聲高可攀結茅積土想東山常憂勝槩一朝盡豈信風流千古還麈尾蒲葵供永日酒樽碁局奉歡顔賢侯心迹遥相望不使蘭陵風月閒閥閱崔嵬動四方入門鸞鶴自成行青緺舊已臨佳郡墨客新歸耀故鄉醉舞幾應摧屐齒對碁正欲賭香囊階庭玉樹寒相照更使東山逸氣長王金吾北園丞相後園天籞鄰年年分借上林春目前但識禽魚樂門外何妨車馬塵花蘤祗疑名品盡圖書方驗古今貧將軍朝下無餘事端為風煙作主人寄題傅欽之濟源别業縣郭遥相望脩篁百畆餘林間清濟水門外太行車道勝隨宜足身閒與世踈何時容命駕采蕨釣肥魚遊李衛公平泉莊相國已何在空山餘故林曏時堪炙手今日但傷心陵谷尚未改門䦨不可尋誰知荆棘地鶴盖舊成隂寄題李水部庠滻水别業茅茨臨素滻沃野帶長林日永一堂静草生三逕深消憂何用酒為樂不須琴擾擾市朝客無人知此心寄題濟源李少卿章園亭縣僻人事少土肥風物殊杖刊靈壽木輪裹溴梁蒲竹不減淇水花仍似洛都主公眉雪白遊覽未嘗扶寄題宇文中允之邵所居孤宦行直道栖栖良可悲誰能拂衣去不待掛冠期經史乃吾友雲山為已知世間青紫貴盡付兩佳兒戲書宋子才止足堂舉世戀榮禄夜行無乃勞獨君年未至止足一何高矮製烏紗帽寛裁白㲲袍華榱坐終日閒按紫檀槽寄題張著作中理善頌堂嘉州公裕學士之父玉壘老先生逍遥樂太平門䦨百客盛冠盖一鄉榮國族招邀近堂皇指顧成江山對平逺圖史散縱横止水中心適秋毫物外輕鯉庭新露冕閭巷不須驚寄題刁景純藏春塢景純致政歸京口治其所居命曰藏春塢前有一崗皆松林命曰萬松嶺藏春在何許欝欝萬松林永日門䦨静東風花木深主公今素髪野服遂初心時與鄉人醉高歌散百金遊瀍上劉氏園日暖孤臺逈露濃幽逕微茅齋舉白飲沙溆踏青歸照水清滿眼穿林香濕衣莫言春尚淺已有杏花飛題致仕李太傅園亭漢家飛將種氣槩耿清秋解去金貂貴來從洛社遊清商擁高宴華館帶長流可笑班超老﨑嶇萬里侯太行象帝胚渾散愚公轍跡開横行四極外蟠據九河隈岪欝天關近峥嶸地軸囘陽崖明草樹隂壑轉風雷波沓羣峰涌雲奔峭壁來猿嵓垂磊落龍窟鬭喧豗噴雨驚湍灑跳壘巨石頽平途憂屐折跬步戒輪摧覆頂千春雪縁潭萬古苔谷盤容國士髓裂餌仙才晉市飛樵札燕郊落燒煤棊圖分冀野蟻壤認叢臺在昔王塗塞嘗聞霸略恢嚴關隂伏甲間道夜銜枚挾詐揮金斗貪功襲墨縗戰場空爝火京觀悉蒿萊險易曽何變興亡只可哀隆平方恃德襟帶自崔嵬漁父楚岸橘花香扁舟泛渺茫短蓑衝密雨素髪淨秋霜煙外鳴桹逺波間擲線長無人識名姓擊楫入滄浪早春璿霄轉斗車春意逼梅花熟寐侵街鼓閒情到酒家晴陽浮地末寒色斂天涯歸鴈空餘迹朝來印浦沙山中早春山木欣欣意春光次第催欹巾望歸鴈伏檻聽新雷巖静聞冰折巢空喜鷰來澗花從寂寞亦向草堂開贈學仙者微逕透重巒茅堂竹葉冠方瞳映骨靜秀氣逼人寒夜火裝丹竈晴霜醮石壇不須驚淺俗輕舉入雲端入塞萬騎入榆關臯蘭苦戰還摧鋒佩刀缺蹋血馬蹄殷鐃吹來風外牛羊出霧間須知沙塞惡壯士變衰顔田家未塞豪人奪何言公賦収皇心雖惻隱蓬戸或焦愁為吏空多禄無人能此憂知君坐公府佗日富民侯和人葦花葭菼迷河曲高秋一畨榮齊紈張野白楚練照川明不夜月長皎踰時雪未晴萬仙霓帔合千畝玉苗生漠漠波瀾偃茫茫沙磧平際空鹽海竭垂地塞雲横日暖鷗無色風高鶴有聲逢君得嘲賦豈愧束薪并華清宫新豐雞犬稀薊北馬秋肥金殿翠華去玉階紅葉飛荒林上路廢温谷舊流微嗟此非人事何須問是非虎牢關天險限西東難知造化功路邀三晉㑹勢壓兩河雄餘雪霑枯草驚飈巻斷蓬徒觀争戰處今古索然空梧桐紫極宫庭闊扶踈四五栽初聞一葉落知是九秋來實滿風前地根添雨後苔羣仙儻來㑹靈鳯必徘徊秋日登觀信亭西風連夜雨草樹已蕭條宿靄稍零落寒山更寂寥林紅猶帶日岸白欲生潮新鴈來何處離離天際遥湖上村家萬頃寒煙外茅茨枕碧流楓林巢乳鶴沙溆亂鳴鷗漠漠菰蒲晩蒼蒼蘆荻秋欲過南浦去籬下出漁舟雙竹草木類同而種殊者竹為多杭州廣巖寺有雙竹相比而生舉林皆然其尤異者生枯樹腹中自其頂出森然駢竦樹如龍蛇相縈矯首砑然予見而賦之雙榦標枯腹青青凡幾霜龍騰雙角直鯨噴兩鬚長但欲尋支遁安能問辟疆屢來非别意未與此君忘南湖二首宋都南野水花栁媚名園鳥起沙留迹魚驚浪結痕朱橋通别島白路出荒村城邑雖云邇常無車馬喧海鴈長橋北乘閒日日來遊魚自應樂宿鳥不相猜弱栁週遭合芳花次第開梁王昔遊集後乘列鄒枚西谿公讌二首五馬非從樂西城念勸功翠帷低映水紅斾不勝風葉脫青山静雲歸碧落空淹留盡佳興新月漸朦朧謝守愛山水軍城況不賖魚驚避落葉鳥倦立浮查古柏依岡逺垂楊帶岸斜秋風吹急管一曲度荷花西湖佳麗三吳國湖光蕩日華魚驚動蘋葉鷰喜掠楊花雲過山腰黒風驅雨脚斜煙波遥盡處髣髴見漁家夏日西齋書事榴花映葉未全開槐影沉沉雨勢來小院地偏人不到滿庭鳥迹印蒼苔過故洛陽城二首四合連山繚繞青三川滉􅃞素波明春風不識興亡意草色年年滿故城煙愁雨嘯奈華生宫闕簮蕖舊帝京若問古今興廢事請君只看洛陽城初春登興國寺塔雨過風清露氣勻林花變色栁條新為君作意登高處試望皇州表裏春和李殿丞倉中對菊三首高士寄朝市逈然心迹殊秋風太倉裏黄菊滿庭隅陶令成詩後王公送酒無遥知厭俗事未免强躊蹰文案漸消散倉閒吏已稀庭空數蝶下夜静一螢飛愛賞忽成句淹留時忘歸高情雖不繫遇此獨依依凉風正蕭瑟好月復徘徊幽興眇不盡芳罇時一開餘英盖紅葉墜露濕蒼苔從此東籬下應忘歸去來執酒執酒勸君君盡之今朝取醉不當疑好風好景心無事閒利閒名何足知河橋春别河橋春盡送君歸又惜無歡度此時亂花滿眼遮人望不見行塵空酒旗答陳進士謂之憶江東舊遊見贈客路今東去亭臯木葉飛居然不堪恨況與賞心違顧渚煙波闊長洲草樹微江邊好春色行望錦標歸又贈謂之文藻兼名理三吳第一賢鄉心幾千里飛鴈滿秋天籬下多新菊淵明歸思長主人方愛客未得傲羲皇君念東歸日應須晝繡榮當令故關吏還識棄繻生重九日憶菊節物都何晩佳辰容易過黄花不足念當奈酒盃何客思客思倦漂泊居然感物華關頭望紅葉馬上見黄花薄宦終無定閒愁詎有涯今朝書至否幾夕夢還家前年春與楚正叔同遊陟屺寺今兹已復周歳窅然思之陟屺寺南山曽陪半日閒春來夢攜手宛在白雲間曉霽夢覺繁聲絶林光透隙來開門驚烏鳥餘滴墮蒼苔觀江上人壁許道寧畫寒林昔曽驅瘦馬衝雪過滎陽不悟當時景蕭然在此堂自都往餘杭懐聶之美閣上新文巻欲逢知已開相思不能已欹枕夢君來夢與之美為寒食遊寒食無佳賞芳菲半已空夜來逢勝友末至負東風别聶之美客宦常漂泊離懐徒自勞貧無衣換酒空有涕霑袍木葉寒猶在江湖暮更豪行舟逺不見頼有片㠶高松江吳山黯黯江水清欲雨未雨傷交情扁舟蕩􅃞泊何處紅蓼白蘋相映生秋風索索連江起暮過煙波十餘里長蘆瘦竹映漁家燈火渺茫寒照水潮水二首平江欲上潮古木自蕭蕭兩岸饒葭葦寒波浸寂寥淋淋出海門百里雪花噴坐看東歸去平沙空有痕旅宿睢陽南湖梁王棄宫館時世古今違猶有南湖水春來鴈鶩飛樓臺沈倒影林薄挂餘暉豪侈終何在行人得暫依聞龔伯建下第文章真長物堪歎又遺賢利器空埋土靈光乆照天趙錐猶未出荆璧㑹須傳道在雖窮困知君不慨然題陳秀才鳯園林劇談驚滿座音貌獨琅然可惜酈生老誰知蘇季賢青囊世外藥碧幕醉中天不佩黄金印都縁負郭田九日登麻藺坂客路逢佳節無歡更益愁前山造雲日登陟不因遊遊延安宿馬太博東館字承之高館寂無譁安閒勝在家暮煙凝塞上堠火落天涯坐乆筆生凍夜䦨燈作花主人意未盡歸路不為賖送何濟川為龎公使慶陽席上探得冬字陟幕府遥三舎傳車乘一封忠深輕逺道醉後失嚴冬圁水猶飛檄蘆闋未滅烽賢侯雖喜士難得乆從容延安道中作羇旅兼邊思川原蹀血新煙雲長帶雨草樹不知春細水淘沙骨驚飈轉路塵今朝見烽火白首太平人鄜州懐聶之美何言内外家憂患兩如麻别淚行三歳思心各一涯海邊昏霧雨塞外慘風沙安得雲飛術乘空去不遐和張推官同年師奭春隂無緒偶成澹泊輕雲寒不収未成春雨只添愁風煙寂寞幾何限盡入憑高一寸眸薄寒未去臘纔過春色先知在緑波不是宿雲能作思大都王粲自情多春曉鐘漏初傳曉滿窓風雨寒東岡行可種欹枕不成安鷺鷥清閒自合無憂累白髪何因更颯然遥望孤飛下秋水雪花一片落晴天待詔二首京洛風塵裏相逢眼盡青故人多密近誰誦四隅銘待詔乆公車囊装半已虚雄文雖雅麗未得似相如觀僧室畫山水畫精禪室冷方暑乆徘徊不盡林端雪長青石上苔心閒對巖岫目浄失塵埃坐乆清風至疑從翠澗來贈外兄吳之才挺何須親始重友分固非踈況復羈孤極同經憂患餘晩成應大器先得類凡魚逰衍陪嚴忌聲華誦子虚蒲輪詔枚叔駟馬寵相如莫忘西都日寒牕夜讀書九日懐聶之美時余在河南聶在陳州錢唐江裏扁舟上别後籬花幾度黄憂患縈心何繚繞風光滿目盡凄凉誰同鑿落盃中酒獨繫茱茰肘後囊可復無書道情素雲間空有鴈南翔太室横山蔽十里相思空復上高臺瓮頭白酒行當熟籬下黄花稍復開陶令不無同醉興孟君況有解嘲才欲憑西北高風勢飛度轘轅勸一盃飲吳之才家京洛相逢設主人富家鼎食不如貧解衣換酒同為樂知是交情百倍親晚秋洛中思歸東園不利不名空去國鴈飛葉落未歸來秋風肯待主人至籬下黄花隨意開普明寺荷塘上置酒菡萏飄零水寂寥敗荷踈栁共蕭條煙斜雨細愁無限醇酒千分不易消送孟仲習宜君令翺合抱生毫末無為厭小官政成心更逸道勝意常寛野逈山形秀雲踈雪意䦨離盃如不盡何用禦祁寒雪霽登普賢閣積雪明朝日山河坐可分嶄巖初解凍片段未歸雲濶望窮人境高尋俯鴈羣開門枝鳥散玉絮墮紛紛和陳殿丞芍藥化工餘巧惜春殘更發濃芳繼牡丹檀㸃藏心殷勝纈異香迎鼻酷如蘭瓊樓窈窕仙家宅雲葉低垂醉裏冠纈子樓子兄子醉西施皆芍藥名品自有殊功存藥録不當獨取鄭詩看到任明年㫖罷官有作恬然如一夢分竹守長安去日冰猶壯歸時花未䦨風光經目少惠愛及民難可惜終南色臨行子細看和景文議交絶句邇來友義漸隳頽直諒多聞貴不囘勢利相交何足道已知餘耳愧陳雷傳家集巻六欽定四庫全書傳家集巻七宋司馬光撰律詩二歸田詩同年張周輔嘗語及仕宦之多端因稱仲長子有言使吾有良田美宅背山臨流適意極樂誠無事於此慨然感之作歸四詩五章秋水風波大嗟嗟未可遊漁樵自應樂珪組為誰憂直木知先伐明珠忌暗投果然鈎可曲不惜取封侯紱冕誠虚器簪裳悉畏途觸機身未保好直道先孤甔石曾何有田園浪更無可能推兩耜沮溺共為徒聖哲雖云遠遺文幸未亡沈㝠觀禮樂髣髴見虞黄雞黍延三逕琴書樂一堂逍遙名教内富貴亦微茫松菊陶潛宅蓬蒿仲蔚家行遊笻杖瘦嘯傲幅巾斜屋小踈茅覆門深亂栁遮村童迎客至竹箒掃桃花桑柘緑無際田間戴勝飛清醪迎社熟鳴雉向春肥執耒時將急銜盃日漸稀四鄰能共樂招飲莫相違詠史三首不事王侯者翛然鄭子真開田谷口美荷鍤白渠春徳化移鄉曲聲光動搢紳一時鍾鼎貴磨滅彼何人延陵腰利劒上國使初通待我周遊徧逢君遣奠終晶熒繫髙樹蕭瑟動寒風誰敢欺生死蒼蒼照爾衷春風三閣上珠翠日紛紛樂飲陶江月清歌遏海雲醉中失陳國夢裡入隋軍玉樹庭花曲凄凉不可聞秋夜望月萬里氛昏歇金波秋更明星連河渚闇風繞桂枝生鳷鵲臨華館新豐落故城古今佳賞盡殊自有餘清漢宫詞苜蓿花猶短蒲萄葉未齊更衣過柏谷走馬宿棠棃逆旅聊懐璽田間共鬭雞猶思飲雲露髙舉出虹蜺讀漢武帝紀方士陳僊術飄飄意不疑雲浮仲山鼎風降壽宫祠上藥行當就殊庭庶可期蓬萊何日返五利不吾欺詠寒士洋洋泌水側蓬室苦蕭條衣薄難勝夜厨閒空過朝笑談東郭履歌誦買臣樵但問才何似無疑卿相遙野廟古廟崩榱在牆間雜樹荒依稀設餘像寂寞閟祠堂舊日牲豭地今晨狐兎鄉英靈如未滅何以度凄凉吕祿廟赤帝祚四百徒然諸吕謀出遊逢友賣未返見家收弊冢昔無託遺祠今幸留士心俱左袒何怨曲周侯梅花三首從與夫君别寒花幾度春坐愁芳樹老況乃鑑中人塞北為君戍江南是妾家遙知闗外雪只似嶺頭花驛使何時發憑君寄一枝隴頭人不識空向笛中吹雲際亭髙齊杳㝠際逈與世塵違席上山河近天邊桑柘微人間已飄灑棟裏始紛霏草樹收殘照逍遙久未歸和孫器之清風樓賢侯宴枚馬歌鼓事繁華晩吹來千里清商落萬家平原轉踈雨逺樹隔殘霞宋玉雖能賦還須念景差先春亭園林近鈴閤旦夕被仁風自得芳菲早豈將踈逺同氷開半塘綠雨借數枝紅㑹待韶光徧還應到野叢沈隂欲雪與同列㑹飲南齋簿領日沈迷從容樂事稀賓朋幸相值樽酒不須違慘澹愁雲積參差逺樹微淹留勿輕散待取雪花飛五哀詩孔子惡利口之覆邦家者甚矣讒之為害不可一二數也聊觀戰國以來楚之屈原趙之李牧漢之晁錯馬援齊之斛律光皆負不世之才竭忠於上然卒困於讒不能自脱流亡不得其所而死或者國隨以丘墟此其尤可大哀者也因即其事作五哀詩且以警後世云屈平白玉徒為潔幽蘭未謂芳窮羞事令尹踈不忘懐王寃骨消寒渚忠魂失舊鄉空餘楚辭在猶與日爭光李牧椎牛饗壯士拔距養奇材敵帳方驚避秦金已闇來旌旗移幕府荆棘蔓叢臺部曲依稀在猶能話郭開晁大夫人主恩猶盛讒夫弄舌端旋聞就斧質不得解衣冠反賊齒纔冷謀臣心盡寒晁宗噍類盡漢室泰山安馬伏波漢令班南海蠻兵避鬱林天涯柱分界徼外貢輸金坐失姦臣意誰明報國心一棺忠勇骨漂泊瘴煙深斛律丞相君臣日荒宴歌舞諱言愁老相猶當國强鄰不敢謀謠言雖未出姦謗已先流誰察忠臣意通宵抱膝憂遣興京洛紅塵裏閉門常獨居雖無守道愧終與趣時疎文舉徒飛表曹丘懶挾書誰憐從宦久不及䇿名初待兔謀真拙屠龍藝亦虚何當治歸計松菊繞吾廬閽吏弊車羸馬犯塵泥愁到朱門徧徧辭相國舍人難驟見將軍馬監豈相知因循嵗月勞何補顛倒風埃辱固宜惆悵東岡舊陂在素心空負白雲期山家林下脱雙履牕邊掛幅巾閒堂風掩户斷嶺月窺人風隴首紅旌急罇前翠幕重林端翻逺刹花外轉疎鐘夜寂清機發春䦨别意濃如何玉琴韻併欲在青松金山寺香刹冠嵳峩松門絡薜蘿風清塵不到岸闊鳥難過欲雨江聲怒新晴海氣多行舟未搖棹回望隔烟波出塞邊草荒無路星河秋夜明巻旗遮逺塞歇馬受降城霜重征衣薄風髙戰鼓鳴將軍功未厭士卒不須生古松摧頽巖壑間磊落得天頑香葉低漸水餘根倒挂山白猿窺子落黄鶴認巢還不久應為石莓苔舊已斑斑故絳城文公恢霸略征討輔周衰奕世為盟主諸侯聽㑹期山河表裏在朝市古今移欲訪虒祁處鄉人亦不知塞上四首節物正防秋闗山落葉稠霜風壯金鼔霧氣濕旌裘未得西羌滅終為大漢羞慙非班定逺棄筆取封侯鴻鴈秋先到牛羊夕未還旌旗遙背水亭堠逺依山落日銜西塞隂烟澹北闗何時獻戎㨗鞍甲一朝閒瀚海秋風至蕭蕭木葉飛如何逢漢使猶未寄征衣不歎千里逺難甘一信稀年年沙漠鴈隨意得南歸劒客蒼鷹隊將軍白虎牙分兵邏圁水縱騎獵鳴沙浪有書藏袖難憑信達家不堪聞曉角吹盡落梅花黄柑黄金綴縹蔕搖落楚江涯采助杯盤勝羞將橘柚偕時移香不變物逺味尤佳欲種滄洲樹何年此意諧晉陽三月未有春色天心均煦嫗物態異芬芳上國花應爛邊城栁未黄清明空改火元已漫浮觴仍説秋寒早年年八月霜栁溪對雪春風不勝雪散漫度龍沙密映緣谿栁爭飛亂眼花鴟夷賒美酒油壁繫輕車塞下芳菲晩聊將當物華酪羮軍厨重羊酪饗士舊風傳不數紫蓴滑徒誇素鮪鮮􅪈蠡煩挏取勺藥助烹􅋩莫與呉兒説還令笑茂先奉同道矩謝始平公惠硯爵臺今已傾飄瓦出蕪城還入縑緗用尤資筆墨精相君憐古物内史擅書名聊用飛軍檄何愁楯鼻平陪始平公燕栁谿谿光不動栁風輕玉帳森沈擁萬兵鷗入煙中閒自舞魚翻波面喜相迎樓船下視晴天碧鼓吹前驅逺陌清桃李歸時應盛發薫然和氣滿春城到并州已復數月率爾成詩忽忽此何地經時更自猜深疑醉裏得復似夢中來薄宦真何益浮生信可咍鵬蜩定有分不若寸心灰和道矩送客汾西村舍杏花盛開置酒其下田家繁杏壓枝紅逺勝桃夭與李穠何事偏宜閒處植無端復向别時逢林間暫繫黄金勒花下聊飛碼碯鍾㑹待重來醉嘉樹只愁風雨不相容北軒老杏其大十圍春色向晩止開一花予憫其憔悴作詩嘲之春木爭秀發嗟君獨不材須慙一花少强逐衆芳開頑艶人誰采微香蝶不來直為無用物空爾費栽培杏解嘲造物本非我榮枯那足言但餘良榦在何必艶花繁壯麗華林苑歡娯梓澤園芳菲如可采豈得侍君軒寄陜西提刑江學士明主矜庶獄選才從本朝鄼侯三尺律漢使一封軺郡國清名滿闗河古意饒淒涼乘障客華髪日蕭蕭從始平公城西大閲滄溟浴日照春臺組練光中玉帳開汾水騰凌金鼔震西山宛轉斾旌迴逍遙靜散晴空雨叱咤横飛逈野雷坐鎮四夷真漢相武侯空復道英才陪諸君北園樂飲浩歌縱飲任天機莫使歡娯與性違玉枕醉人從獨卧金羈倦客聽先歸須知㑹府閒時少況復邊城樂事稀花卉正濃風日好今年已不負春暉和道矩紅棃花二首繁枝細葉互低昂香敵酴醿艶海棠應為窮邊太寥落併將春色付穠芳蜀江新錦濯朝陽楚國纎腰傅薄粧何事白花零落早同時不改鬭芬芳和懋賢聞道矩小園置酒助以酒果副之以詩芙蓉幕下惜餘閒不使芳華取次殘珍果醇醪與新句併將佳味助清歡數日不至後圃今晚偶來芳物都盡率然成詩爛漫不解賞飄零空慘悽殘紅正滿地不忍踏芳蹊和樂道自河外南轅過宜芳雨晴和氣景物可愛馬上偶成京洛春應老河邊初解顔碧浮煙際草翠滴雨餘山目極褰帷外詩成攬轡間滿川桃李色共喜傳車還夏日窮邊已深夏氣色耿清秋鮮旭開山郭涼煙澹戍樓兠鈴烽火息區脱虜塵收迨此軍中暇無妨文雅遊晨發故闗寄逢吉畫㦸衣中趨絳帳驛亭門外拂征鞍已嗟漂泊三年别更負從容十日歡煖席未窮談笑樂陟岡相望滯留難揚鞭䇿馬幾多意原上秋風作曉寒中秋夜始平公命與考校諸君置酒賦詩月華秋色雨鮮新萬里澄空不受塵兎濯素毛騰浩露桂飄香實下飛輪光侵酒面寒無力清入詩豪健有神坐客何須辭醉倒相君應不惜車茵病酒呈晉州李八丈身如五嶺炎蒸裏心似三江髙浪中誰道醉鄉風土好舟車常願不相通和李八丈小雪同㑹有懐鄰幾天祿淹回徳齒尊蹔留汾曲兩朱轓閒軒坐嘯正飛雪同舍倦遊來及門空嘆髙歌如郢客愧無佳賦似文園坐中猶欠鄰幾在深負棊枰與酒樽三月晦日登豐州故城春盡蕪城天一涯白榆生莢栁生花滿川戰骨知誰罪深屬來人戒覆車寄聶之美之美時監韶州錢監去嵗雙毛白今春一齒零人生浮似葉客宦泛如萍塞上貂裘弊天涯海氣腥何當占箕潁蕭散並柴扄又寄心目悠悠逐去鴻别來容易四秋風莫嗟密密書連紙萬里經年信一通和錢學士公輔字君倚呈邵興宗霜露蒼蒼宰樹高累茵列鼎重鴻毛蒹葭自幸猶依玉髖髀何能學奏刀才薄無由禆覆燾命奇不得報劬勞光仕始周嵗二親繼喪平生念此心先亂蓼蓼難分莪與蒿曉思束帶朝尚早蓬門未脱扄短籬潜落月老樹帶孤星隠几貂裘黒開編竹簡青子雲非執㦸何以得窮經錢君倚示詩有歸呉之興為詩三十二韻以贈呉越為君土崤函是我家濯纓從吏事傾葢聚京華奕世交朋重二先君景徳二年同年進士同僚分誼加光與君倚崇文吏部開封皆同官聲光嘗耳剽臭味辱肩差選士參縣石烝髦應椓罝帝畿圍日月蓬堵積煙霞咨訪傾肝膽推褒借齒牙後來慙瓦礫旁倚愧蒹葭談論寥天一詼諧老柏槎虚舟坦莫逆璞玉瑩無瑕信美陪遊衍胡為起咄嗟勞歌盡鄉思旅夢各天涯誠厭簪紳累難堪獄訟譁缿筩朝插蝟貫索暮如麻霢霂霑朝服蜩螗沸尹衙宿姦牢窟宅弊俗費鞭撾鮆鱠思吹絮呉中食鮆魚鱠以楊花為候羊羮憶卧沙闗中美羊有卧沙細肋梅林連雨熟棃味得霜佳秋色城臨水春風路入花稻肥初斷蟹斷蟹事見笠澤叢書桑密不通鵶秦人謂桑密有鵶飛不過之語蹙衂浮盤芡鈎聮卧壠瓜江蓴半巻葉石蕨乍舒芽風物隨鄉樂山川苦道遐若人才有裕修已徳無邪正恐臨髖髀安能捨鏌鎁怒飛期寖逼肥遯迹猶賖不比溝中木微同井底蛙果能真引去誰復强邀遮旋結蝸牛舍還乗下澤車閉門常反拒醉幘任欹斜林野遊如鹿泥塗蟄似蛇故人時記憶陽羨致新茶喜張聖民得登州盡日少閒暇中宵夢亦勞符移空浩浩榜楚鎮謷謷敢説今求郡飜思昔坐曹羨君乗五馬東去一何高詩寄雲夫處士老兄兼呈知府待制八丈一鶚曽飛奏中林下鶴書今乗使君馬重到逸人居松竹過從久閭閻惠愛餘只應棠樹影比舊更扶踈和任屯田逈字元道感舊敘懐結交英俊樂如何風誼敦明寄詠歌自致青雲今有幾化為異物巳居多櫝中本自沽良價毫末安能滑至和鄰笛不堪頻嘆息酒爐那得重經過年華易度牕塵影人事難期海水波賢業著鞭猶可在況君壯齒未蹉跎次韻和沖卿中秋朧月豈無錦幄翠簾垂匝樹明燈正赫曦共惜月華方滿夜更當秋色中分時烏皮几穏風侵鬢白玉樓髙冷透肌千里浮雲何處斷北來試問鴈應知次韻和鄰幾秋雨十六韻氣象殊朝夕興居錯晦明混元初不宰霪雨浩無程蟄隘寧天意咨嗟固物情曣㬈方有望薈蔚已隨生杲杲升還隠悽悽斷復行亂莎長被徑荒蘚綠緣甍轍迹康莊絶潢汙壠畝平茅茨不足庇禾黍若為成蟋蟀頽牆泣蛜蝛壊竈盈乘時衆鷗舞得意怒蛙鳴牛馬誰分異蕭蘭已混并居閒猶叵度負重況遐征舟泊川無渚輪摧路有阬轑􅅅愁病婦煬竈擁寒嬰災不妨明徳神應格至誠淳光終下燭時藿久心傾和始平公郡齋偶書二首文武從容兩有餘公槐將幕往來居已安四海如三傑欲散千金比二䟽今日監邊親跪轂佗年入殿賜乗車武侯暫為蒼生起長憶隆中卧舊廬平安候火出雲間區脱無塵刁斗閒漢相威聲遙制敵胡兵逺迹夜開闗赤松雅意思輕舉黄閣羣心望復還玉帳牙旗空壯觀謝公髙興在東山春獵小苑微寒春鴈飛石闗宫外草萋萋漢家旌斾連圍合秦國山川入望低花色纔臨珠綴發栁隂欲傍金隄齊韓嫣承恩來視獸飛塵遙出建章西栁枝詞十三首煙滿上林春未歸三三兩兩雪花飛栁條别得東皇意映隄拂水已依依依依高樹出宫牆搖曳青絲百尺長願與宣温萬年樹年年嵗嵗奉君王君王遊豫賞青春折栁為弮賜侍臣莫怪長條低拂地只緣供掃屬車塵屬車隠隠逺如雷陳后愁眉久不開楊花都不知人意故入長門宫裏來長門宫曉未成粧結雨縈風蔽瑣牕莫令透入華梁鷰那堪負汝更雙雙雙雙春鷰颺雲霄楚國宫深樂事饒㑹待急管繁絃際試取纎條並舞腰舞腰繽紛長樂東栁間帳飲送春風請君試望邯鄲道青門裊裊徹新豐新豐道上灞陵頭又送夫君去逺遊借問栁枝能寄否古今共有幾多愁多愁尤是别離深折條相贈各沾襟留住不住居人意欲去未去行人心行人白馬去遙遙初上金堤欲過橋望塵不見遮人眼苦怨無情萬萬條五栁先生門乍開宅邊植杖久徘徊陌頭遙認顔光祿詰旦先乘瘦馬來白雪雖然比絮花艶陽不得共繁華為君故入烏衣巷飛舞風流謝傅家宣陽門前三月初家家楊栁綠藏烏歡似白花飄蕩去忍能棄擲博山爐上郡南三十里有相思亭在太山之麓二水所交平臯之上往來者徒習其名莫詳其義慶厯甲申歳余適延安過於其下于時夏虜梗邊征戍未息竊感東山采薇之義敘其情而愍其勞因作五詩庶幾不違周公之指且以釋亭之名爾慶厯四年作嶺上雙流水猶知㑹合時行人過於此那得不相思偃蹇登脩阪髙侵雲日間幾人征戍客跋馬望家山塞上春寒在東風雪滿鬚河陽機上婦知我苦辛無栁似妖饒舞花如爛漫粧那堪隴頭水嗚咽斷人腸空外遊絲轉飄揚似妾心别來今幾日髣髴近雕隂友人楚孟徳過余縱言及神仙余謂之無孟徳謂之有伊人也非誕妄者葢有以知之矣然余俗士終疑之故作遊仙曲五章以佐戲笑云神仙謂無還似有秦漢可憐空白首㑹須一躡青雲梯與子同袪千古疑仙術有無終未知眼看白髪亂如絲何時得接浮丘袂滄海横飛萬餘里若士北遊窮地角還食蛤蜊養龜殻盧敖尸骨不能飛今朝九垓何處期仙家不似人間歡瑤漿琅菜青玉盤乘醉東遊憩陽谷酒瓢閒掛扶桑木柂師知子能操舟稳過茫茫滄海流白浪駕天千萬里直令挂骨長鯨齒武成致齋奉酬呉沖卿寺丞太學宿直見寄二首廣文更直太常齋咫尺無從盡素懐不及清風得隨意夜深容易過天街雪後餘氷尚綴簷月華霜氣入踈簾難堪瓊玉驚心骨坐覺清寒幾倍添雪中尋友人不遇擁袖犯風雪驅車行詣誰朱門不可入素友復難期依世誠多拙迷方忽自悲褊心終寡合吾道易參差河邊曉望高浪崩奔捲白沙悠悠極望入天涯誰能脱落塵中意乘興東遊坐石槎早春寄東郡舊同僚樓臺帶餘雪寒色未全收久負入闗意空為同舍羞清樽接勝友飛葢從賢侯應恨春來晚烟林已數游邉將三首紅旗一簇聚山椒霽日清風看射雕脱㡌少年遥稽首漢家新將霍嫖姚月白星稀霜氣多巻旗束甲涉䓗河田家不覺官軍度夜半只聞風雨過横吹長笛千萬騎將軍塞北立功迴邊人爭出孤城望漸見旌旗天外来傳家集巻七欽定四庫全書傳家集巻八宋司馬光撰律詩三感興寄聶之美平生百無可强為一官縻世味偏予薄心期獨子知林猿愁玉瑣櫪馬患金羈年事今華髪求榮欲為誰和江鄰幾金鈴菊何處見佳菊秋風汶水陽酒浮金鐸細露泛蜜房香不謂紅塵地相逢君子堂依然故人意不減舊芬芳寄清逸魏處士鄉樹三搖落臨風歌式微徒嗟俗緣重端使素心違茅閣松杉冷山園藥草肥不能如海鷰嵗嵗一西飛贈清衍我厭俗緣苦空為薄宦牽如師真達者於世亦超然敝笠衝塵陌寒雲擁雪天崎嶇逺相顧深愧此心專夢穉子窮泉纎骨已成塵幽草閒花二十春昔日相逢猶是夢今宵夢裡更非真二月二十四日館宿興宗舍後桃花盛開偶書牖上金馬春寂寂穠桃隨意開夕風零落盡不待主人來二月三十日與同舍宴李氏園晩歸馬上賦詩歸字門前蹀􅉜金羈滿坐上連翩玉斚飛數尺遊絲留客醉一行垂栁送人歸同邀勝友時難得重到名園花已稀莫惜芳辰䞉行樂無端風雨横相違和宋次道西都元日懐不疑并見寄露冕優分竹題輿佐畫圻比年攜手樂兹日賞心違齋祀春來併娯遊别後稀誰憐從窶卒草際犯寒歸酬次道板橋晩望見寄春來曽約醉河橋深負垂楊千萬條今日都門相望處西風亂葉正蕭蕭雙井茶寄贈范景仁春睡無端巧逐人驅訶不去苦相親欲憑洪井真茶力試遣刀圭報谷神正月二十四日夜雪疊瓦浮輕雪參差粉畫難苦欺初變栁故壓未生蘭夜色微分白春容不受寒即為花卉奪猶得暫供看酬不疑雪中書懐見寄校理邵必直道免三黜敢云羞小官盤餐紅粟澁衣桁黒貂寒畫府容身易侯門曲意難荆扉盈尺雪有客問袁安答師道對雪見寄直講陳洙隂風一夕驚曉雪滿都城氣覆千家白光連萬象清戀空飛不下弄態舞相縈歴亂看無定飄颻轉未成綴垣時缺剥壓竹乍欹傾細隙過無滯寒􅐼拂有聲園林旬結練觀閣巧彫瓊草木情先喜乾坤意亦榮營魂頓踈健病目蹔虚明郢曲髙誰和羞將叩缶并苦雨積雨欲侵旬朝晡漫不分蒼涼微露日慘澹已生雲地半成泥滓天應厭垢氛時聞度鶬鴰空外自為羣酬師道雪夜見寄玉樹交横雪後天銀河沈著斗欄干筆峯微結冰絲澁燈暈初成花燼殘太學先生氊苦薄公車倦客履仍單欲吟佳句到清曉夜寂愁聞金石寒昌言有詠石髪詩三章模冩精楷殆難復加僕雖未睹兹物而已若識之久者輒復强為三詩以繼其後非敢庶幾肩差適足為前詩之輿臺耳校理石揚休萬古風濤浸石巖老苔垂足細䰐鬖傳聞海底珠無數何事從來散不簮金闕銀城仙客居欲傳消息問麻姑蓬萊無物堪為信剪寄蒼龍一握鬚琅菜來從若木邊西王母傳有碧海之琅菜非膏非沐綠宛延玉盤委積羞佳客不是陶家無饌錢錢子高有徐浩詩碑石昌言借摹其文甫及數本石有微釁懼而歸之子髙答簡有碎珊瑚之戲昌言以詩贈子髙同舍皆和司諫錢彦逺徐公精筆老生神石刻猶能妙奪真幾為通書翻喪寶愈令好事惜傳人鋒鋩半折猶能健圭璧微瑕自足珍直使盡隨如意碎石家玉樹未全貧昌言家圖書所收最多又和雪霽南宫來幾時挾纊易春衣意謂花將晩何言雪尚飛夜聲通旅枕曉色弄晴暉繼日勞王事離離鴈已歸又和二月五日夜風雪春風正豪怒夜雪復飄揚勿使羈愁亂自知清興長簾疎聲淅瀝燈冷暈微茫此夕牛衣客成名不可忘喜范景仁直秘閣延閣屹中天積書雲漢連神宗重其選國士此為偏夫子岷嶓秀聲名俊造先清標峻不極勝氣駛無前待價猶懐璧臨岐首著鞭介推不求顯張季久方遷玉檻鉤陳上丹梯北斗邊帝容瞻日角閣有太宗聖容宸翰照星躔職秩曽無貴光華在得賢公卿殊未晩尚少買臣年和伯鎮再入館甘泉獻賦人流落浙江濱自嘆三年謫歸來萬事新銓衡時進對户牖日相親明主方思賈非徒問鬼神雙竹詩上苑通丹禁脩林繞玉堂周阿紆鏤檻並􅆬擢新篁蕭灑駢瑤甃連翩拂璧璫虯騰雙角直鯨噴兩鬚長曉泊煙華重晴留雨氣涼分音成律吕齊秀待鸞凰碧借雲霞潤清依日月光物情知有謂天造固無方比節羣誠合虚心至道彰吾君愈勤徳不敢有嘉祥秦人楚旗獵獵葢山紅回首咸陽一炬空惆悵秦人虛用意幾年辛苦得山東山頭春色天意欲迴煦羣生稍鬱蒸平田猶未徧絶嶺獨先升翠色添崖柏寒聲折澗冰誰為物外友挈手共同登和子淵除夜緹室重飛玉琯灰物華全與斗杓回依依殘臘無情别歴歴新春滿眼來强取酒巵浮翠柏懶開粽葉覔楊梅男兒努力平生志肯使功名落草萊和子淵元夕神嶽嶕嶢闕角齊銀蟾無影玉繩低風傳絲管交加發燈滉星河上下迷清醴横飛金鑿落香塵不染錦鄣泥誰知此夕齋祠客近在宫城槐栁西冬夜冬夜何其永寒光四泬寥鴈横星歴歴人靜漏迢迢破屋霜應重荒庭雪未消不眠何所念達曉思無憀答劉邍父謝龎公惠炭東郭先生履半穿禦冬深愧主人賢應憐道上雪欲積意使爐中灰復然麴糵暗添寒酒力圖書共免濕薪煙茅齋斗似饒光彩客至何憂臘後天興宗許菊久之未得邵亢菊栽許送定如何庭下不堪秋草多九日無花更無酒便攜藜杖直相過得菊栽并詩黄花小墢和煙斸野興蕭蕭已相逐同來更得兼詩句久立看詩忘栽菊和同舍對菊無酒黄花倚秋色曄曄為誰開更使窺殘榼空令洗舊杯嗅香行繚繞撚蘂立徘徊盡日柴門外白衣來不來聶之美訪及不獲展奉以詩為謝昔君來闕下定館必吾廬今者雖相值依然是索居之美館於僧舍不堪休沐少便使往還疎深愧原思巷空迴長者車蘇門先生長嘯蘓門石行藏世莫知逍遙心迹逺寂寞姓名誰郷在無何有時方不可為麒麟本神物安得係而羈和沖卿喜雨偶成萬里風隨快雨來塵昏消伏旱光開物情濯熱參差喜天意為仁容易迴簾映薄寒燈有暈牕含虚白麝成煤君侯雅有江湖興蕭灑何須氣象催寄贈致仕劉都官諷張元常云諷年六十二致仕夫婦皆徙居簡州賴山中有二子皆有官其一登進士第諸孫皆好書星郎年未至辭祿一何髙目瑩棲靈氣眉疎出秀毫胷中自有樂身外盡徒勞回首紅塵地紛紛笑我曹解紱沱江外誅茅井絡邊老萊夫婦隠韋孟子孫賢浮蟻邀旁舍蹲鴟種薄田不須親几杖想望已蕭然范景仁詩云移家尚恐青雲淺隠几唯知白日長朱公綽詩云疏草焚來應見史槖金散盡只留書和呉省副中復字仲庶梅花半開招憑由張司封飲伯玉字公達帝鄉春色嶺頭梅髙壓年華犯雪開正與嘉賓思共醉不須芳物重相催從車貯酒傳呼出側弁簮花倒載迴風雨難期王事劇未知休沐幾旬來依韻和仲庶省壁畫山水畫工執筆已心遊稍稍蘅皋引杜洲堆案煩文猶倦暑滿軒新意忽驚秋天生賢者非無謂官遇明時未易休正恐怒飛朝暮事丹青難得久淹留太博同年葉兄紓以詩及建茶為貺家有蜀牋二軸輒敢繫詩二章獻於左右亦投桃報李之意也閩山草木未全春破纇真茶采擷新雅意不忘同臭味先分疇昔桂堂人西來萬里浣花牋舒巻雲霞照手鮮書笥久藏無可稱願投詩客助新編秋夕不寐呈諌長樂道龍圖雨氣生煙暈霜寒入漏聲踈籬過螢影腐葉掩蟲鳴丘壑違初願簮裾徇外榮丹心終夜苦白髪詰朝生恩與乾坤大身如草木輕何階見明主垂拱視升平始平公以光得免使北賜之以詩謹依韻酬和皇華將命得人難專對非才輒自言幸免驅車涉沙漠尚容載筆侍宣温不唯羞屈穹廬膝無奈常遊魏闕䰟衮職區區未能補何時餘論奉清樽孟嘗冠葢盈門意氣豪海魚兼雨未充庖歸來散盡三千客方悟時人市道交喜李侍郎東之得西京留臺賤子何為者栖栖今二毛滄波浮片葉大塊載秋毫利物物何補營身身已勞羨君遺世網脱屣一何高始平公新作雙樗庵命光為詩間氣生王佐多才秉國鈞棟隆憑杞梓節勁仰松筠底績承平業遺榮壽考身結廬依散木退讓樂天真忝職諌垣日負憂畏􅃡思雲夫處士老兄蕭然物外何樂如之因成浮槎詩寄獻以抒鄙懐秋水浮槎客漂如一葉輕鷗羣須㐲信鯨口幾忘生耿耿天津濶滔滔海浪驚何時還故土懐糈問君平奉和何濟川代書三十韻寄諸同舍金馬延羣㒞芸香聚衆書杳疑神境絶深與世塵踈氣逼煙霄爽光分日月餘不材叨誤選故友幸聮居雲葢森胡騎天閽謹契魚後先陪賈馬左右揖嚴徐朱閣霜清外璇題日上初辭林精采擷藝圃縱遊漁决勝楸枰暝窮歡綺席舒朝昏升紫闥咫尺待彫輿玉壘俄鄉思銅符忽詔除綵衣承几杖華轂照園廬四郭柑垂䕃千塍稻散渠壺漿迎露冕鐃吹擁高旟有徳能仁虎無欺恥怒狙道途繁揖讓犴獄絶淪胥滯穗棲場圃鳴桴靜里閭貧寧費官燭饑不茹家􅂼翁子懷青綬文園駕赤車古今相與校勝負定何如上正開宣室人方誦子虚追鋒行入謁委佩復傳臚撫已聊晞驥臨民遽起予居然耗廩禄豈不愧簮裙鵜翼顔何厚錐囊意未攄因循戀糠籺汩没老塗淤自顧徒為爾誠非益者歟俄承吕公檄遂䇿阮生驢驛騎傳巴徼詩筒達魯墟琳琅固無價燕石敢沽諸和始平公貽一二賓僚儒冠藹藹從平津東閤由來盛衆賓終始何嘗忘教育髙卑曽不間踈親共陪樽爼無虚日空喜谿山得主人白雪屢歌殊未和自知羞愧後車塵留客酒煙漠漠自生春舞袖飄颻拍拍新須信客歸絲竹散清風白月解愁人和始平公長句寄漢州何學士勢交倐忽易蕭條賴有伊人尚建標須信松筠凌雪茂肯為蒲栁望秋凋欽賢髙館三年別廣漢專城百舍遙書紙如雲詩叩玉數憑疾翼度青霄何濟川有書見貽云以親老須守逺郡以便祿養不得如光在主人幕下因以詩答千騎駸駸簇畫輈髙旌大葢五驊騮齋中酒美連翩醉湖上花繁爛漫遊雞犬相聞通故里旨甘不絶奉晨羞只應朝夕平津閤得向君前立勝籌二月十一日與一二僚友遊叔禮園亭以詩戲呈下馬久徘徊林芳殊未開春風真有意須待主翁來十四日小園置茶招宗聖應之皆辭以醉為詩贈之草樹弄春暉家家倒載歸誰憐獨醒客日暝掩雙扉同僚有獨遊東遊者小詩寄之三首車馬東城路芬芳數里塵風光不相待愁殺未遊人咫尺東園樂無如簿領何春風連夜惡聞道落花多城樓傳晩鼔稍稍訟庭稀起拂衣中土還騎款段歸小詩招僚友晩遊後園二首五陵年少競春暉肥馬銀鞍白玉羈何似松間煮新茗更來花底覆殘棊麥田小雨隴微青草樹欣欣照晚晴花下客來醒亦好猶勝閉户過清明小園晚飲賦得春字公府豐暇豫真成棄擲春招邀俱勝友爛漫醉芳辰花艶穠無敵文鋒健有神猶勝擁朱墨終日坐埃塵李花得韻同前嘉李繁相倚園林淡泊春齊紈剪衣薄呉紵下機新色與晴光亂香和露氣勻望中皆玉樹環堵不為貧東牕臨風梳短髪蕭颯晩凉新不識市朝客何如江海人沈吟憑棐几欹側帶紗巾濁世事無盡東牕聊放神奉和始平公酬大資政呉侍郎道盛經綸業文髙翰墨場雍容偃藩地密邇釣璜鄉回首紅塵逺清心白日長山形抱城堞谿影照公堂􅛉稏千塍碧芙蕖萬頃香跨波横略彴逼地亞篔簹大埜禾麻溢髙齋几席凉䕫龍屢賡唱東壁正垂光晩行後園見菊戲宜甫野菊荒無數班班初見花徑須求一醉試遣問東家野菊野菊未嘗種秋花何處來羞隨衆草没故犯早霜開寒蝶舞不去夜蛬吟更哀幽人自移席小摘泛青杯秋夜城上調秋角煙間發暝鐘風枝搖宿鳥霜草覆寒蛬久負觀書樂端愁束帶恭蹔因羣吏散還得遂幽慵再呈宜甫西家壺已倒次第向東鄰朱户如堅閉黄花惡笑人宜甫家有金鈴菊客未之識因代菊贈宜甫主人倦邀客寂寞委蒼苔此日開無益明年不復開深夜疎星映户月流天羣動收聲四寂然嗟爾寒蛬怨何事悲吟徹曙亦無眠奉和始平公喜聞昌言修注鳳口除書下九閽簮紳拭目仰殊恩曉提麟筆依華葢日就螭􅉾記聖言桃李新隂方藹藹驊騮老志更軒軒主人喜見相如達趣召鄒枚洗玉樽光與昌言俱出始平公門下昌言時年五十秋雨蕭條聞宗聖案伎應之飲酒詩呈宜甫寒風細雨未晴天密似輕塵薄似煙一室獨吟圖史亂四鄰髙㑹綺羅鮮鴈飛斜柱絃隨指蟹薦新螯酒滿船自笑不歌仍不飲昏昏只解枕牀眠宜甫東樓晚飲賓主俱歡醉高樓逈倚空形忘羈檢外酒散笑談中晚市煙初白秋園葉半紅登臨不厭數朝夕是寒風昌言謫官符離有病鶴折翼舟載以行及還修注始平公以詩問之命光同賦二首曽下青田啄玉苗泥沙病羽久蕭條謫仙不欲留塵世依舊提攜上碧霄相閤書傳紫闥深破緘先問九臯禽不令一物傷天理仁愛方知真宰心和聶之美重遊東郡二首躍馬津亭未幾何宦遊容易十年過飄颻空似隨流梗寂寞猶為掛壁梭西嶺應餘當日翠南湖真減幾分波之美云南浦比舊水涸過半輸君尚得飛征葢重向春園聽舊歌南湖重過正逢春官栁雖疎亦解新臺榭傾欹賓友散臨風愁殺獨遊人大熱山澤欲焦枯炎光滿太虚不知天地外暑氣復何如夷齊夷齊雙骨已成塵獨有清名日日新餓死溝中人不識可憐今古幾何人龍女祠後塘自生荷花數枝與史誠之更相酬和七首平湖漠漠芰荷稠水國芳春不勝秋空有棹歌人不見晩風一曲去悠悠越女行歌縱棹輕蒼茫别浦晩煙凝荷花折盡不歸去瀲灔扁舟不易勝荷底清漣照綺羅長安公子舊情多躊躇不去知君意重唱呉音白紵歌賀監家居逸興饒枝分鑑水闊容舠穿荷宜去邀漁叟共醉船頭半榼醪清江向晩採蓮稀獨倚蘭舟久未歸目斷可堪人不至斜風細雨濕羅衣素舸朱篷青竹篙棹歌風散近還遙斜陽借問歸何處家住水村郎姓蕭别殿無人梨自芳玉階朱檻繞金塘館娃寂寞無西子羞與呉宫競曉粧贈楚法曹叔度夫君能直節不恥楊曹輕道果因時屈官無當已榮松杉雖偃蹇霜霰苦崢嶸㑹有良工識終觀大器成寄揚州侯都監仲倫木落淮南樹秋風日夜高月臨揚子渡雪捲廣陵濤不得同蕭散何因破鬱陶空憑尺書速未解夣魂勞感懷昨日春冰破水邊今朝臘雪墜風前歳華過目疾飛鳥壯志如何不著鞭之美舉進士寓京師此詩寄之結髪聲華盛無疑屈未伸何妨久垂翅從此欲驚人鷹擊天風壯鵬飛海浪春行當解故褐不惜化京塵風雨數日不見叔度晩約公明共詣之二首雲雪連朝闇朋從歎坐違臨文與誰共開巻為君稀趣掃六花散聊通一徑微當攜兎園賦同映讀書幃南榮巵酒罷君返道東居坐作三朝别杳疑千里餘閒門嗟雀網深濘怯柴車向晩開簾喜彤雲稍覺踈贈呉之才勝冠自立艱難裏大器由來貴晩成松柏儻非生磊落巖崖何易出崢嶸蘇秦遊困羞妻嫂主父居貧厭弟兄六印佗年擁車騎㑹須重過洛陽城寒食許昌道中寄幕府諸君原上煙蕪淡復濃寂寥佳節思無窮竹林近水半邊綠桃樹連村一片紅盡日解鞍山店雨晩天回首酒旗風遙知幕府清明飲應笑驅馳羇旅中和叔度獨登天臺水亭郊外靈潭闊新亭占曲隄戲魚迎墜絮驚雉出荒蹊綠倒楊梢亂光飜芰葉齊雨餘纎月偃野逈斷雲低水氣常噴薄天風助慘悽何知塵外境近在郡樓西喜孫器之來自共城取友不無人愛君天性真逺尋窮巷宅未拂滿衣塵主禮貧尤重交情别更親誰家釀醇酒盡醉準衣巾和聶之美鴈汲汲復栖栖往來誰與期映雲纔可見入霧杳難追羇枕夢初斷寒閨涕已危㝠㝠逺繒繳愧爾獨知時送王太祝豫知伊闕百里驩迎新令賢儒經吏術盡家傳天開嶺阜竦雙闕地雜桑麻隘一川錦雉馴飛春陌上雪鳬髙去夕嵐邊長才久屈君無限所惜斯民受賜偏傳家集巻八欽定四庫全書傳家集巻九宋司馬光撰律詩四和何濟川漢州西湖雜詠十七首清風臺太守金閨客天朝應對才非因板輿戀寧駕使車來水鑑秋毫盡霜鋒錯節開清風偏千里不獨此髙臺佇月亭燈火動魚磯湖邊過鳥稀孤蟾久未上五馬不成歸長嘯風生座高吟露滿衣閒情無日厭岸幘對清暉藥圃三蜀膏腴地偏於藥物宜小畦千種聚春雨一畨滋山相慙多識桐君未偏知佗年似胡廣飬夀復扶衰竹塢二何迹相繼竹塢日隂森濟川詩注云前守何脩撰不伐西湖竹予亦遵之欲識飬民意先觀愛物心低垂樽爼冷宻映管絃深勿恠湖光少年來碧影侵射堋疊鼓花前急紅旌竹外髙驚飈分白羽餘響振烏號壯觀傾春陌讙聲湧夜濤因兹刑禮俗豈獨事逰遨玉徽亭房公昔漂泊置酒此鳴琴人事有憂樂山光無古今風流俱寂寞結構尚蕭森松竹含虚􅄜猶疑絃上音書樓使君有書癖記覽浩無涯况此孤楼逈端無外物譁横肱欹曲几搔首落烏紗此趣人誰識長吟牕日斜朔會堂朔旦集俺吏兹堂簪組繁舞空孤鶴下映日兩鳬翻花散東方騎萍浮北海樽須知太守貴鐃吹引朱輪浮觴亭曲水華榱下浮觴去復還浪搖花影碎日射酒缸殷滅沒遥尋客徘徊怯度灣窮歡不知醉清泚照心顔清燕亭波澄䕃羣木永日湛清華碧篠静秋色白蘋低晩花松聲工醒酒泉味最便茶外事付丞掾無妨風景嘉流芳橋橋下流芳度餘春日夕催呼人洗樽斚招客藉莓苔倚柱時流滯隨波乍徃迴仙家如不近安得此花來暁景亭簾櫳分暁色逺樹子規啼濃露侵衣冷晴煙壓水低神遊靈境徤身入畫圖迷衙吏無煩報河洲鷺正棲假山廣漢土平逺已嫌丘壑踈呼工刻巖洞應手出庭除縹渺神仙宅嵌空虎豹居人功與天力秀絶兩何如探花橋橋邊春意近五馬屢徘徊湖水旦暮渌林花早晩開􅆘因甞酒到又為賦詩来借問雙華表經過日幾回樂軒繁絃凝緑水疊皷摻漁陽風結舞初急塵飛歌正長鳬鷖争上下棟宇為低昻太守且安坐新聲未遽央坐船使君張皂蓋髙宴碧湖心苒蒻牽菱蔓夷猶泊栁隂晚風侵坐冷春浪沒篙深倒載歸何晚波間夕照沈枇杷洲周官歛珍味場人掌國之場圃而樹之果蓏珍異之物以時歛而蔵之鄭康成曰珍異蒲桃枇杷之屬漢苑結芳根初修上林苑羣臣逺方各獻名果異樹有枇杷十株何意荒洲上猶餘嘉樹存犯寒花已發迎暑實尤繁願逐蒲萄使離宫奉至尊寓泊鄭圃寄獻昌言舍人旅食緇衣館飄蓬怳自迷樹横寒霧逺山隱古原低愁暮空庭雀驚晨别墅雞故人何處在依約玉繩西奉和始平公憶東平二首相印東臨汶水陽兩看春葉與秋霜登山置酒延鄒湛上馬回鞭問葛强溪竹低垂寒滴翠露荷相倚淨交香宵衣深念長城固肯得従容傲醉鄉千􅑐秀色擁晴川萬頃陂光上下天委地魚鹽隨處市蔽空桑柘不容田訟庭虚静官曹樂儒服寛長邑里賢不為従知方負羽獨乘魚艇老風煙和運使舍人北園餞别行憇三交僧舍冐雪宿百井闗見寄驪駒北上雪孱顔䪍矢前驅度漢關僧室松杉清照眼驛亭煙火逈依山馬銜邊草枯猶瘦鴈怯胡雲冷未還賤子不須回首問鬢毛蕭颯簿書間又和留題定襄驛按節羊腸阪褰帷並塞州仁風熙愛日清德凛髙秋甘澤隨征盖華星近戍楼佗年叱馭事直筆寄歆彪又寄獻承明共直廬瞬息八年餘幸託屏星駕前迎使者車跡雖殊貴賤心不置親踈青眼披情素猶如相見初自嘲英名愧終賈髙節謝巢由直取雲山笑空為簪組羞浮沈乖俗好隱顯拙身謀惆悵臨清鑑霜毛不待秋讀頴公清風集四首伊臯垂訓皆王度周召陳詩盡國風非獨立言方不朽相君功業自無窮人生百嵗隙中光唯有髙名久不忘千古但令編簡在清風養物一何長佳城鬰鬰閟英靈幸有文章見典型開巻未終雙袖濕目前髣髴對淵庭一言華衮足為榮况託文編久愈明鄒湛不逢羊叔子世間何處復知名公集有遺光詩數章贈狄節推國賓梁公之孫天馬雲孫在終然骨相竒泥塗辱雖久霜雪志難移白髪無嗟老青衫莫厭卑為山已九仭髙節肯中衰感春積草滿春庭衡門永晝扄波頭何事白栁眼為誰青榮落浮雲度悲歡熟醉醒繁華非我物隨意任飄零不寐四逺寂然羣動收只餘嚴皷度坊樓無由更續三更夢何䖏飛来一㸃愁雞羽短籠深不得飛久留寜為稻粱肥膠膠風雨鳴何苦滿室髙眠正掩扉皇祐二年謁告歸鄉里至治平二年方得冄来愴然感懷詩以紀事十六載重歸順塗歌式微青松弊廬在白首故人稀外飾服章改流光顔貎非巫咸舊山色相見尚依依辭墳嘉祐元年通判并州因公事至絳私歸拜墳不敢至夏縣而去於今十年矣十年一展墓旬浹復東旋豈負襁褓愛横遭章綬纒更来知幾日遺恨恐終天慟哭出松徑悲風為颯然謁三門禹祠信矣禹功美獨兼人鬼謀長山忽中斷巨浸失横流迹與天地久民無魚鼈憂誰能報盛徳空爾薦醪羞贔屭青崖裂喧豗白浪豪客舟浮木葉生理脱鴻毛栢映孤峯短水際孤峯甚細而髙上有小柏耆舊相傳不知幾何年矣而止長尺餘人莫測其理銘書絶壁髙唐太宗刻銘砥柱之隂魏鄭公撰字幾盈尺殘缺僅可讀河師不耕織容易戯風濤遊三門開化寺山石古来色河流無盡聲行船自徃返羣木幾枯榮狂象調難伏空華滅復生我来何所得聊此濯塵纓三月十五日宿魏雲夫山莊二首先生嫌俗賔猶與故鄉親不惜烟霞地暫容繮鎻身林廬􅀷有徑雞犬四無鄰蓛蓛闇花墮蒼蒼古木春飯炊松粒細盤采蕨芽新静覺精神健閒知氣味真谿泉冷毛髪山翠濕衣巾竹色消酲易林聲破夢頻客輪来去轍驛路古今塵明日空回首白雲應笑人聞道山家門鎮開獨驅瘦馬出塵埃白雲明月先無約何事今宵亦此来留别逢吉君念承明臭味稀相逢惜别重依依㑹稽太守方坐嘯東郭先生還歩歸嚴助朱買臣皆為㑹稽守東郭先生孝武時待詔公車樂飲林塘留節物餞行里舎動光輝雙旌迴去行人發一帶長臯煙雨微陜城桃李零落已盡硤石山中今方盛開馬上口占西望飛花千樹暗東来芳蘂一番新行人不惜泥塗倦喜見年光兩處春自澠至洛循糓水行百餘里已煩糓水逺相送更得嵩峯遥見迎水碧峯青看未足却愁前到洛陽城田横墓在偃師西昔時南面並稱孤今日還為絳灌徒忍死祗能添屈辱偷生不足愛須臾一朝従殉傾羣客千古生風激懦夫直使强顔臣漢帝韓彭未必免同誅登平陸北山囬瞰陜城奉寄李八丈學士使君二十二韻漢家二千石體望向来尊况復嚴徐客従前益稷孫公侯貴不絶禮樂器長存符竹臨分陜聲光應列藩親闈先契重三司同僚子舎近交敦滑州同幕柏壟依仁域棠隂接故園懐歸聊露請予告入推恩荷祋煩彊候停車下郡門帷廧紛大館騶騎屈朱轓不以黎苗待還將臭味論森羅牢禮重滅裂俗儀煩霜霽威嚴息春生笑語温草微侵碧甃塵不染華軒日影揺雲棟風㾗過玉樽落塵歌逈出激楚褏雙翻雅戯象交局珍肴熊薦蹯河梁俄首路汾曲訪吹塤舉手辭雙㦸騰装改北轅烏飛城樹暁鴈泊野蕪暄耿耿清標闊涔涔宿酒昏百蟠縈阪道数里豁川原跋馬風煙外依稀鼓吹喧員村坂其東八政水即古之傅巖有傅説廟乂東北虞城古虞公之國也穹谷鬰盤紆河瀕陜北隅泉流涓不絶岡勢儼相扶初旭紛髙下空煙似有無石灘醒耳快嶠樹􅀢雲孤天霽嵐光合人稀草色蘇牧兒歌自若樵子逺相呼壊道傍連傳空城右指虞窮巖今寂寞蔓草只荒蕪野店寒餐澁山程瘦馬瘏物華供興趣亦是慰﨑嶇頃為諸生常受經於錢丈學賦於張丈今迺叨忝同為侍臣䝉錢丈置酒張丈賜詩愧悚之深言志為謝疇昔勝冠日曽為絳帳生九言聞至教一顧得虚聲不意叨嚴近於今接老成寧須詩酒賜侍坐己知榮次韻和韓子華寒食休沐與諸公同會趙令園暮歸馬上偶成冠盖連翩陌上来風光爛漫擁樓臺玉巵貯酒隨宜飲綺席尋花觸處開小雨前宵先撥火季春明日又吹灰須知勝集人間少惆悵金羈容易逥景仁招逰東園馬上口占􅃴野自可愛况逢佳主人馬穿官栁影衣拂帝城塵物外誰知樂樽前别有春年華己消歇歴歴見松筠贈河中通判朱郎中夀昌侍郎巽之子襁抱中母劉氏被出夀昌長而訪之不能得熈寧中知廣徳軍年五十三乃乞尋醫身自訪求得於同州為民黨氏妻夀昌歸奏授封邑夀昌揚州人以其母子孫俱在同州故折資通判河中陟屺今將老扶牀昔未行㫖甘無所展朱紫不為榮里巷傳呼入比鄰失涕驚方知貫金石何以易精誠蘇才翁子美有贈扶溝白鶴觀黄道士詩紀于屋壁歲久漫滅今縣宰周同年得完本於民間抵予求詩潦倒黄冠無足論白頭嗜酒住荒村狂名偶為留詩著陳迹仍因好事存金石鏘洋虚殿寂龍蛇灑落古牆昏飛黄滅沒浮雲外疲馬何能望駿奔長垣道中作極目王畿四坦然方輿如地蓋如天始知恃險不如德去殺勝殘已百年再使河北桑麥青青四月初皇華使者又脂車為臣豈得辭王事只向金鑾坐讀書河北道中作三首緑栁隂中白浪花河邊日日暗風沙解鞍縦馬悄無事隱几看書隨處家河勢東迴今幾年濃隂滿目盡桑田川原變化無終極一氣不為常寂然原上纍纍古冢高昔時意氣盡賢豪斷碑名姓已磨滅永日東風吹野蒿夜發長垣長塗暑氣劇永日卧郵亭畫伏如牆䑕宵行似野螢歇鞍沙月白拂面栁風醒歴歴瞻雲漢誰為二使星和景仁瓊林席上偶成時康與禹玉景仁次道之子同時登科在席念昔瓊林賜宴歸綵衣緑綬正相宜將雛雖復慰心喜負米翻成觸目悲殿角花猶紅勝火樽前髪自白如絲桂林衰朽何須恨幸有新枝續舊枝早朝書事太白明如李東方三丈高晨光孤照闕霧氣濕侵袍槐栁經霜慘驊騮得路豪素餐無小補俛仰愧金鼇登長安見山樓到官今十日纔得一朝閒嵗晩愁雲合登樓不見山和吴仲庶寄吴瑛比部安道之子壯年致政歸隱蘄春負米承親願已賒遭母憂服除遂致仕恥隨雞鶩啄泥沙一朝投紱真高士萬巻藏書舊世家齒髪未衰非藥物山林不返為雲霞龎眉尚有郎潜者徇禄憂生直可嗟别長安暫來還復去夢裏到長安可惜終南色臨行子細看初到洛中書懐三十餘年西復東勞生薄宦等飛蓬所存舊業惟清白不負明君有樸忠早避喧煩真得策未逢危辱好収功太平觸處農桑滿贏取閭閻鶴髪翁和景仁題崇福宫歴歴山頭雪冷冷松下風樽中亦有酒恨不與君同不獨山頭白人頭亦垂素積雪有時消青山色如故早行寒犬吠柴門荒雞鳴逺村河聲空自急月影不曾渾木末星猶白榛中露已繁客心獨惆悵四顧與誰言酬終南閻諫議詢字議道見寄齒哀心力耗揣分乞西臺㣲禄供多病閒官養不才弊廬容嘯傲清洛伴歸來故友猶相念寒光生死灰寄成都吴龍圖同年照席燭花煖隨車劔騎寒江山資秀句風月助清歡政簡坤維静仁深井絡安行歌與獨酌豈得並閒官花庵獨坐荒園才一畆意足已為多雖不居丘壑常如隱薜蘿忘機林鳥下極目塞鴻過為問市朝客紅塵深幾何秋夜浮雲一消散星斗粲長天浩露灑翠柏清香生白蓮體涼猶衣葛耳静已無蟬坐久羣動息秋空唯寂然平日逰園常䇿笻杖秋来發篋復出貂褥二物皆景仁所貺覩物思人斐然成詩笻杖攜已久貂褥展猶新漸染岷山雪拂除京國塵危扶醉歸路穩稱病來身賴此齋中物時如見故人雲晴空碧於水那得片雲飛映日成丹鳯隨風變白衣去來皆絶迹隱顯兩忘機天理誰能測終然何所歸閒来閒來觀萬物在處可逍遥魚為貪鈎得蛾因赴火焦碧梧飢鸑鷟白粒飽鷦鷯帶索誰家子行歌復採樵贈邵尭夫家雖在城闕蕭瑟似荒郊逺去名利窟自稱安樂巢雲歸白石洞鶴立碧松梢得䘮非吾事何須更解嘲花庵多牽牛清晨始開日出已瘁花雖甚美而不堪留賞望逺雲凝岫粧餘黛散鈿縹囊承曉露翠蓋拂秋煙嚮慕非葵比彫零在槿先才供少頃玩空廢日髙眠花庵二首誰謂花庵小纔容三兩人君看賓席上經月有凝塵誰謂花庵漏徒為見者嗤此中勝廣厦人自不能知和楊卿中秋月秋氣平分夜沈隂乍散天窺林初淡薄照席忽孤圓泠入詩毫健光浮醉弁偏嘉賓勿輕去桂影正姢姢樂吾心自有樂世俗豈能知不及老萊子多於榮啓期緼袍寛稱體脱粟飽隨宜乘興輙獨徃􅂝笻任所之和邵尭夫秋霽登石閣飛簷危檻出林端王屋嵩丘咫尺間獨愛髙明遊佛閣豈知憂喜滿塵寰目窮莽蒼纎毫盡身得逍遙萬象閒暇日登臨無厭數悲風殘葉已珊珊先生冬夏俱不出和河陽五宣徽拱辰字君貺九日平嵩閣宴集九日英僚集千秋勝賞同飛橋貫河渚危閣壓霜風金散黄花泛雷驚疊鼓通百峯髙鳥外萬里寸眸中檻底臨丹葉杯中倒碧嵩來雲低拂座去鴈逺沈空吹㡌陪遊阻搖旌結想叢風流免堙沒鄒湛倚羊公和任開叔觀福嚴院舊題名墨蹤塵淡鬢華新猶喜重來值故人二十二年如轉目洛陽不改舊時春柏梯寺鑿石開蹊踆登崖置閣危笑談空谷應步武白雲隨衆壑如飜浪鄰州若布棊何當遂棲隱身世兩相遺重過華下昔辭蓮幕去三十四炎凉舊物三峯雪新悲一鑷霜雲低秦野闊木落渭川長欲問當時事無人獨嘆傷和李君錫惠書及詩勉以早歸書意勤渠詩意新清如白雪暖如春西遊不盡谿山樂策馬歸來就故人和君錫雪後招探春莫嫌㣲雪壓梅芽已有歸鴻泊浦沙天上詔來難久駐直須早看洛陽花又和早春夜雪繁霙囬夜雪淩亂落春雲虗幌寒相襲華堂静不聞玉巵深可敵銀燭近微分誰念牛衣客窮經白髪紛醉厚於太古暖於春耳目無營見道真果使屈原知醉趣當年不作獨醒人雪寒取酒雪意久未就寒雲低不收飄揚挿孤幟迢遞映高樓試假賢人濁聊攻客子愁呼僮擕小榼更凖黑貂裘留别東郡諸僚友際日浮空漲海流蟲沙龍蜃各優游津涯浩蕩雖難測不見驚瀾曾覆舟白璧紫金為世寶賢愚知貴莫能名廟堂祭器杯盤物隨處得之光彩生楚國良金百鍊精深藏求售價連城豈徒豐獄吹毛利兼有秦臺照膽明祖帳飄揚堤栁邊北來飛蓋復連翩追隨不忍輕言别逥首城樓沒晩烟空府同來賢大夫短亭門外即長塗不辭爛醉樽前倒明日此歡重得無追和張學士從沂公遊廣固城蒼鵝集宋幕遊鹿上燕臺霸氣山河盡王師江漢來重圍經嵗合嚴鎻夜深開廢殿餘沙礫頽牆蘙草萊清時間千嵗良牧借三台獄市乗餘暇蕪城賦上才去歲與東郡幕府諸君同遊河亭望太行雪飲酒賦詩今冬罷歸京邑悵然有懐疇昔追清景狂吟忘苦寒河氷塞津口山雪照林端健筆千篇冨醇醪一醉歡困猶揮落麈瞑不顧歸鞍多是光隂駛離羣㑹合難誰知塵滿袖今日客長安貢院中戯從元禮求酒太常博士畢田顧我虛罍恥知君餘瀝多庭前有春雪如此薄寒何石昌言學士宰中牟日為詩見寄久未之答今冬罷武成幕来京師此詩詩謝之楊休昔年三月浪鱗翼化雲雷竹箭流俱上芙蓉幕對開揚休釋褐昌言除同州推官光華州判官潘泉揚沸渭泰華聳崔嵬捧檄容歸省飛觴復屢陪時先人知同州光以吏事時徃省覲復得與昌言遊芬芳襲芝室嘉慶侍蘭堦呉璧評殘筆隋碑讀漬苔同州龍興寺即隋文帝故宅寺有李德林撰碑國公呉道子書畫或未就而止云以俟後之能者清隂依玉樹和氣樂春臺薄宦俄成别私門忽遇災一朝捐綵服五載泣麤縗季路還從仕任安獨見哀近畿須健令劇邑試長才過目全牛解迎鋒巨枿摧雉畱乗䕃伏蝗避境苗逥時得鳴琴暇仍飛麗句來正知榮篋笥無足報璿瑰紞皷俄攀鄧安車已召枚賦成平樂館燕奉柏梁盃自顧誠駑緩于今尚草萊履穿羞路雪蓋敝怯京埃儻借餘光便炎風動死灰昌言見督詩債戯呈絶句學餒才貧杼軸勞踰年避債負詩豪倒囊不惜償虚劵未敵瓊瑤舊價髙静夜午夜空齋四悄然清寒透骨不成眠秋風故掲疎簾起正漏月華來枕前春紅桃素李競年華周偏長安萬萬家何事青青庭下柏東風吹盡亦無花寄題陟屺寺鄭南峯下寺前軒反景分明見渭川為報十年容易别於今愁悴不如先寄鄭縣史令千之前君為白馬尉廨舍前即南浦今西溪封内勝地也憐君比比得佳縣勝槩閒情雙有餘為看西溪日沈後如何南浦月生初長春宫栁逺扶疎新樹應多舊已枯蠧柱苔牆偏寄歴古亭猶有杜詩無閏正月十五日夜監直對月懐諸同舍二首霧浄金波溢天開碧幕空夜寒雖料峭春意自冲融熠熠枝上露翛翛竹杪風蹔還林野興不似畜樊籠澹泊春雲散仾昻北斗横微分漢津鴈静識建章更濁酒憐虛爵髙文憶友生前軒空不掩悵息負孤清歸鴈亦知南國稻粱肥水滿春江努力歸聞道楚人繒繳細平沙短草盡藏機傳家集巻九欽定四庫全書傳家集巻十宋司馬光撰律詩五贈
