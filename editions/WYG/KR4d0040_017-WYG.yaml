front:
  text: 右臣不避斧鉞傾瀝危懇臣本貫陜州夏縣丘壟宗族俱在彼中自先臣亡殁及臣服闋以來十有餘年守官未嘗得近鄉里止曽一次請假焚黄得展省墳墓中心念此朝夕不忘近日方欲上煩朝廷陳乞家便一官又為自判吏部南曹未及一年及陜州側近州郡俱未有闕所以未敢陳請今竊知已降勅命授臣開封府推官於臣之分誠為榮幸然臣有此私懇湏至披陳加以禀賦愚闇不閑吏事臨繁處􅇵實非所長必慮不職以煩司寇伏望聖慈特賜矜察除知虢州或慶成軍一次情願守待逺闕庻得近便灑掃光塋或上件處所無闕乞且歸館供職候有闕日特賜差除
  hash: sha256:e0cc9917fbb5e860ac18d3985fd5d63a16d7a805f749037d2973dab7321849c0
  markers:
  - {type: page-break, offset: 126, content: '', id: KR4d0040_WYG_019-11a, image: WYG1094/WYG1094-0203a.png}
body:
  text: 乞虢州第二狀右臣先䝉恩授臣開封府推官臣為乆不曽到鄉里及自知才性疲駑不任劇職曽奏乞知虢州或慶成軍一次奉聖㫖不許辭免就職以來已踰半嵗體素多病牽强不前竊知虢州即今有闕臣欲乞依前來所奏差知虢州一次或已除人即乞候主判登聞鼔院尚書省閒慢司局有闕日差除一處庻幾守官不至曠敗乞虢州第三狀右臣伏自去嵗聖恩除開封府推官以來臣以乆不到陜州鄉里及資性駑下不任劇職兩曽乞差知虢州或主判登聞鼔院及尚書省閒慢司局不䝉聽許臣以開封府重難之處不敢更有陳請今竊知已降勅命除臣判三司度支句院竊縁臣禀賦愚鈍素無才幹省府職任俱為繁劇去此就彼皆非所冝若貪榮冒居必致曠敗内省僥忝誠不自安欲乞依前來所奏差知虢州或主判登聞鼔院及尚書省閒慢司局若俱無闕則乞知綘州乾州或在京閒慢差遣一次干冒宸嚴臣無任懇切戰汗屏營之至辭修起居注第一狀右臣伏奉勅差臣同修起居注臣性識庸昧學術空淺循塗平進猶懼不稱况記注之職士林髙選若以叙進則先逹尚多若以才升則最出衆下豈敢不自揣度貪冒榮寵内猶愧怍人將謂何承命震恐殆無容措伏望聖慈俯賜矜察更擇時彦以副羣望所有勅臣不敢祗受辭修起居注第二狀右臣伏凖中書劄子不許辭免便令受勅者臣聞人主度才然後授任人臣量能然後就職是以上無曠官下無竊位臣雖愚戇粗識兹義今修注之官日侍黼扆瞻望清光仕進之塗無此為美臣非惡居顯榮樂在踈賤顧以駑下之質不相當稱苟强顔為之不惟取四方觀笑為士友所責亦恐用非其人貽朝廷羞臣愚所慮正在於此是以傾輸悃愊昧死自陳今制㫖益嚴未賜開可臣夙夜震懼不知所圖豈辭語拙訥不能著白將誠信未昭無以感發俯仰惶惑若懐冰炭是用再有披露仰逹天聪不敢避煩黷之誅庻幾逃忝冒之罪所有差同修起居注勅臣不敢祗受乞依前奏更賜擇人臣無任激切俟命之至辭修起居注第三狀右臣伏准中書劄子奉聖㫖令臣依前降指揮不許辭免便令受勅者臣區區之誠屢塵天聽言理鄙拙未䝉采納退自悼懼置躬無所臣雖愚陋豈不知非常之恩不可輕得詔命之嚴不可屢違所以冒犯雷霆祈請不已者誠以人臣之義陳力就列不能者止臣自釋褐從仕佩服斯言奉以周旋不敢失墜仕進本末皆可覆按鄉者承上庠之乏充文館之員補奉常之屬給太史之役未嘗敢以片言避免煩凂朝廷葢以觧摘章句校讎文字考尋儀典編次簡牘苟䇿勵疲駑庻幾可以逃於罪戾是以聞命之始即時就職至於修起居注自祖宗以來皆慎擇館閣之士必得文采閎富可以潤色詔命者然後為之臣自㓜及長雖粗能誦習經傳渉獵史籍至於屬文實非所長雖欲力自切劘求及等軰性有常分不可强勉儻不自惟忖貪冒榮寵異時驅䇿有所不稱使四方之人環視譏笑以為盛明之朝容有竊位之人其為聖化之累豈云細哉如是則雖伏質横分不足以補塞無狀此臣所以夙夜惶悸欲止不能者也且臣前後所陳剖心析膽莫非懇到而朝廷棄置其言曽不之省是不以情實待臣也意者使臣言出於誠陛下矜而聽之足以盡下情從物欲使臣言出於偽陛下亦因而許之足以沮姦回警媮薄臣竊為朝廷計之二者皆未為失也今臣所陳請已及再三而陛下拒之愈堅督之愈急使拳拳之志無以自明豈上下坦然推心相信之道哉臣不勝憤懣伏望聖慈依臣前奏更賜擇人所有同修起居注勅臣不敢祗受辭修起居注第四狀右臣伏䝉聖恩差臣同修起居注已三次奏陳不敢受敕更乞擇人今又准中書劄子奉聖㫖令臣依累降指揮便受勅更不得辭免詔㫖丁寜至於三四而臣偃蹇自遂是謂不恭若正典刑罪死無赦然臣知而不敢避者誠以罪有大於此者故也臣聞虞書曰無曠庻官然則官無鉅細皆分理天職王者猶不敢私非其人况人臣而敢叨居其位乎如是則雖無國討必有天刑臣雖頑愚粗知自愛雖日遷九官所不願也臣嚮辭開封府推官及判三司度支句院朝廷一有指揮不令辭兔臣即時就職豈以材力為足堪其任哉竊自惟度以為朝命已行必不可移雖章奏煩多終無所益是以黽勉從事不敢復言及覩王安石前者差修起居注力自陳愬章七八上然後朝廷許之臣乃追自悔恨曏者非朝廷不許由臣請之不堅故也臣今所以煩凟聖聽不能自巳雖加重誅所不敢逃况王安石文辭閎富當世少倫四方士大夫素所推服授以此職猶懇惻固譲終不肯為如臣空踈何足稱道比於安石相去逺甚乃敢不自愧耻以當非常之命乎使臣之才得及安石一二則臣聞命之日受而不辭今臣内自省循一無可取乃與之同被選擢比肩並進豈不玷朝廷之舉為士大夫所羞哉此臣所以彷徨尤不敢受者也伏望聖慈察臣誠心且令循守舊職更賜推擇當今俊異之人可與安石為比者使同修起居注如此則賢不肖各當其分能不能各適其宜下情獲安衆望為允所有同修起居注勅臣不敢祗受辭修起居注第五狀右臣先奉勅差同修起居注臣四曽上奏乞更擇人今又准中書劄子奉聖㫖令臣依累降指揮更不得辭譲便令受勅供職者臣要領如草芥不足以待斧鉞軀命如螻蟻不足以脂鼎鑊今屢違明詔當伏重誅然臣區區之情亦兾朝廷少賜寛察臣自知材能不足塞職歸情上聞煩凟聖聽至於四五刳肝瀝膽盈巻溢幅臣之情亦極矣臣之辭亦殫矣雖欲重複稱引無以復加而朝廷以臣賤㣲終不知聽臣晝夜憂悸無以自存俯仰三思進退維谷夫詔命至尊㣲臣至卑修注至榮罪誅至辱今臣以卑違尊去榮就辱原其本志豈有他哉正欲朝廷任官皆得其人愚臣處身不失其分而巳若聖恩矜而許之則豈惟愚臣之幸亦可以少有補於國家若章奏煩多而詔㫖不移豈惟使臣獲頑愚不䖍之罪不容於菹醢抑亦恐四方之人謂朝廷之於賢材如臣之比尚足固留也不勝廹切之情伏望聖慈依臣前奏更賜擇人所有同修起居注勑臣不敢祗受傳家集巻十九欽定四庫全書傳家集巻二十宋司馬光撰
