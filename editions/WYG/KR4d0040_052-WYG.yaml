body:
  text: 乞撫納西人劄子元祐元年三月上臣先於二月中曾上言乞因新天子繼統下詔悉赦西人之罪與之更始雖未還其侵疆且嵗給賜待之如故此道大體正萬全無失既而執政所見各有異同沮難遷延遂屏弃不行臣竊聞今來西人已有關報定使副詣闕賀登寳位國家若於此際又不下詔開而納之萬一西人蓄怨積憤肆其悖心或有一騎犯邉或於表牒中有一語不遜當是之時雖欲招納乃是畏其陸梁傷威毁重何耻如之臣之前䇿亦不可行矣伏望陛下令三省樞密院將臣三月三日十二日十六日并今來所上文字一處進呈臣愚欲為國家消患於未萌誠惜此機㑹夙夜遑遑廢寢忘食陛下若俟詢謀僉同然後施行則執政人人各有所見臣言必又屏弃凡邊境安則中國安此乃國家安危之機伏望陛下察臣所言甚易行而無後害可使華夷兩安為利甚大斷自聖旨勿復有疑取進止撫納西人詔意元祐元年三月上朕聞王者奄有四極至仁無私靡間華夷視之如一夏國主秉常世守西土藩衛中邦自其祖彛興以來沐浴皇化職貢時至率多忠勤仁宗皇帝加之寵名胙以大國錫予之數嵗則有常曏因邊臣奏陳云彼君臣失職及移文詰問曽無報應神宗皇帝乃出師命將拯彼阽危在於夏國主秉常實有大造而所部之人􅃍敢自絶侵軼我邊鄙䖍劉我吏民正旦同天皆不入賀國家包以大度置而不問但絶嵗賜以俟悛心不幸先帝違弃萬國朕嗣守令緒祗承前志夙夜寅畏迨今朞年宣廣恩澤無幽不振而夏國主秉常屢遣使者造于闕庭弔祭訃告寖修常軄朕惟江海之大來則受之豈復追念徃昔校計細故冝捨其前日之不恭取其今茲之效順曠然湔滌與之更始自今申敕將吏嚴戢兵民毋得輙規小利擾彼疆場凡嵗時頒賚命有司率由舊章必使桴皷不鳴􅇏燧無警彼此之民早眠晏起同底太寜不亦休哉可布告中外咸使聞知辭接續支俸劄子元祐元年三月上臣以假滿百日自四月以後不敢勘請俸給聞近有聖㫖特再給臣寛假將治其俸給等接續支給臣自正月二十一日以病在朝假乆而不愈亦曽陳乞宫觀以養衰殘聖恩不許更除左僕射臣惶恐失圖不敢復言自爾日望痊平入覲丹扆面陳至誠庻得極竭疲駑且供舊職以補報萬分而臓府雖寧瘡瘍未愈肌體羸瘠足力全無步履甚難拜起不得以此無由朝叅計在假不管本職公事巳及一百一十餘日入覲之期未能自定竊以百日停俸著在舊章况臣當表率百僚豈敢廢格不行臣聞孔子曰先事後得詩云不素餐兮今雖聖澤優厚曲加矜恤而使臣違先事之義重素餐之罪四海指目何以自安伏望聖慈許臣依條百日外住支請受候叅假日依舊庶使臣得安心養疾保全㣲軀取進止乞罷將官劄子元祐元年三月上臣於去年四月二十七日曽上言州縣者百姓之根本長吏者州縣之根本根本危則枝葉何以得安故自古以來置州郡必嚴其武偹設長吏必盛其侍衛所以安百姓衛朝廷也秦㓕六國以為兵不復用雖置郡守而以御史監之墮名城銷鋒鏑故陳勝呉廣起而郡縣不能制國隨以亡晉武帝平呉悉罷州郡兵陶璜山濤皆言州郡武偹不可廢及永寧以後盗賊羣起州郡無備天下遂大亂國朝置總管鈴轄都監監押為將帥之官凡州縣兵馬其長吏未嘗不同管轄葢知州則一州之將知縣則一縣之將也熈寧中謀臣建議分天下禁軍每數千為一將别置將官以領之訓練差使抽那一出其手其逐州總管以下及知州知縣皆不得關預量留羸弱下軍及剰員以充本州白直及諸般差使而已凡設官分職當上下相維如身之使臂臂之使指紀綱乃立今為州縣長及總管等官而於所部士卒有不相統攝殆如路人者至於倉庫守宿街市廵邏亦皆乏人雖於條有許差將下兵士者而州縣不得直差須牒將官將官徃徃占䕶不肯差撥萬一有非常之變州縣長吏何以號令其衆制禦姧宄哉臣目覩前宰相西京留守韓綘謁嵩山起建道埸其將下禁軍充白直者於條不得出城經宿所敢留者剰員七八人而已况僻小州縣其守禦之備侍衛之衆可知矣臣當時乞悉罷將官其逐州縣禁軍並委長吏與總管等官同共提舉教閱及諸處差使其州縣長吏所給白直皆如嘉祐編勅以前之數臣自上此文字後來不聞朝廷有所施行竊見近嵗諸處多闕雨澤盗賊頗多州縣全無武備長吏侍衛單寡禁軍盡屬將官將官多與長吏爭衡長吏勢力逺出其下萬一有如李順王倫攻城䧟邑之冦或如王均王則竊發肘腋之變豈不為朝廷旰食之憂邪王者制治於未亂保邦於未危豈可自恃太平之乆謂必無此等事邪又自祖宗以來諸軍少曽在營常分畨徃縁邊及諸路屯駐駐泊盖欲使之均勞逸知艱難識戰闘習山川自置將官以來苟非有所征討全將起發與將官偕行外其餘常在本營不復分畨屯駐駐泊飽食安坐養成驕惰之性歲月滋乆恐不可復用又每將下各有部隊將准備差遣指使之類一二十人而諸州總管鈐轄都監監押員數亦如舊設官重􅃨虚費廪禄凢將官之設有害無利天下曉軍政者莫不知之臣愚伏望朝廷如臣前奏盡罷諸路將官其禁軍各委本州縣長吏與總管鈐轄都監監押等管轄一如未置將官已前之法其諸州軍兵馬全少不足守禦之處量與立額招添其守禦有備而冦賊之發不能式遏或弃城逃避或率吏民迎賊或斂民財賂賊雖責之以死彼亦甘心今平居騶從且不能備一旦冦至責以死節不亦難哉取進止傳家集巻五十二欽定四庫全書傳家集巻五十三宋司馬光撰章奏三十六舉張舜民等充館閣劄子元祐元年上臣今月二十四日准尚書省劄子准二十二日詔書節文執政大臣冝各舉文學政事行誼之臣可以充館閣之選者三人臣竊見奉議郎張舜民材氣秀異讀書能文剛直敢言竭忠憂國通直郎孫凖學問優博文辭宏贍行義無缺乆淹下僚河南府左軍廵判官劉安世才而自晦愿而有立力學修已恬於進取其人並堪充館閣之選如後不如所舉臣甘當同罪取進止五月三日尚書省劄子光所患已安惟足瘡有妨拜跪不候叅假時放謝仍權免赴前後殿起居許乗轎子三日一至都堂聚議或門下省治事辭三日一至都堂劄子元祐元年上臣伏覩中書省録黄今月二日奉聖㫖以臣所患已安惟足瘡有妨拜跪不候參假特放正謝仍權免赴前後殿起居許乗轎子三日一至都堂聚議或門下尚書省治事者臣聞命震恐無地自處竊念臣臓腑雖安飲食如故但兩足無力瘡口未合歩履艱難拜起不得以此未果朝參至於數日一至政事堂乃唐世以來宿德元老髙年有疾朝廷尊禮特降此命豈伊微臣所敢倫擬况臣自正月二十一日請朝假至今百三十餘日豈有未見君父輒赴省供職况臣於病中除左僕射雖累具劄子辭免未􅂪開允仍􅂪就家賜以告身亦未敢祗受方俟入覲天顔面陳至懇豈可遽治尚書省事伏望聖慈俟臣歩履有力拜起得成參假了日與諸執政一例供職貴於微軀差得自安所有今月二日指揮乞賜寢罷取進止内降付中書省許肩輿至内東門扶掖入對小殿辭入對小殿劄子元祐元年上臣今月二日聞有聖㫖令臣不候參假特放正謝仍權免赴前後殿起居許乗轎子三日一至都堂聚議或門下尚書省治事臣以恩禮太優不敢輒當尋具劄子辭免今月四日又覩中書省録黄奉聖㫖依前降指揮不許辭免仍令閤門告示許肩輿至内東門外令男扶掖至小殿引對特免起居令引見前一日聞奏如此則禮數愈重尤不敢當臣竊惟富弼三世輔臣德髙望重神宗皇帝想見其人故特制此禮乃自古所無顧臣何人敢與為比况親屈乗輿特御小殿以臣勤君其罪至大縱陛下優借而天威咫尺恐隕越隨之似此異數臣决不敢受只候垂簾日於延和殿引見并乞上殿然事有不得已者雖知僭越不得不承順聖恩臣即目上下馬未得及足上有瘡深惡馬汗欲乞如今聖㫖許權乗轎子出入及入内至常時下馬處下轎子又臣兩足無力若無人扶掖委實全拜起不得欲乞今來入見及將來每遇入對並權許令臣男康入殿遇拜時扶掖候痊安日皆復舊規如此則曲成之仁已踰於天地非臣隕身䘮元所能報塞所有其餘恩禮並乞寢罷取進止三省同奉聖㫖令乗轎子至崇政殿門外於延和殿垂簾日引對餘並依前降指揮辭男康章服劄子元祐元年上臣乆在病假今月十二日於延和殿入見并辭免新命以兩足無力拜起不得聖恩特許令臣男康入殿扶掖臣既不得請臣男復賜章服父子忝竊誠不自安所有臣男恩命乞賜寢罷取進止乞與諸位徃來商量公事劄子元祐元年上臣近奉聖㫖許臣乗轎子三日一次至都堂聚議伏縁三省樞密院各有職事難以臣故必令三日一聚議檢㑹去嵗曽有指揮遇假日有公事許於東西府聚議其東西府近北舊有便門臣欲乞於近南更開一便門臣今縁足疾未愈乞遇假日或日晩執政出省後有司合商量公事許乗小竹轎子徃諸位商量其執政有欲商量公事者亦許來臣本位更不一一奏聞所貴論議詳盡事無留滯取進止
