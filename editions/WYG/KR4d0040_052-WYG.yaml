seq: 52
front:
  text: 賑濟劄子元祐元年上臣竊惟鄉村人户播殖百榖種蓺桑麻乃天下衣食之原比於餘民尤宜存恤凡人情戀土各願安居苟非無以自存豈願流移他境國家若於未流移之前早行賑濟使糧食相接不至失業則比屋安堵官中所費少而民間實受賜若於既流移之後方散米煑粥以有限之儲蓄待無窮之流民徒更聚而餓死官中所費多而民實無所濟伏覩近降朝旨令户部指揮府界諸路提㸃刑獄司體量州縣人户如委是闕食據見在義倉及常平米榖速行賑濟仍丁寧指揮州縣多方存恤無致流移失所此誠得安民之要道然所以能使民不流移者全在本縣令佐得人欲乞更令提㸃刑獄司指揮逐縣令佐專切體量鄉村人户有闕食者一靣申知上司及本州更不候回報即將本縣義倉及常平倉米榖直行賑貸仍據鄉村五等人户逐户計口出給歴頭大人日給二升小兒日給一升令各從民便或五日或十日或半月一次齎歴頭詣縣請領縣司亦置簿照㑹若本縣米榖數少則先從下户出給歴頭有餘則並及上户其不願請領者亦聽候將來夏秋成熟糧食相接日即據簿歴上所貸過糧令隨稅送納一斗只納一斗更無利息其令佐若别有良法簡易便民勝於此法者亦聽從便要在民不乏食不至流移而已仍令提㸃刑獄司常切體量逐縣令佐有能用心存恤闕食人户雖係災傷並不流移者保明聞奏優與酬奬其全不用心賑貸致户口多流移者取勘聞奏乞行停替庻使官吏有所勸沮百姓實霑聖澤取進止
  hash: sha256:e0b2df99c4365a2c3ec14f78e50d0b43984cf55556ddd86a12c981429cea6409
