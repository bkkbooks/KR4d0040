body:
  text: 韓秉國書維啟春氣斗温伏惟動止安和相見之期竟未有定殊増耿耿見與景仁書似恠鄙拙論議於公有所未盡者向讀中和論疑中字觧釋未甚明然未敢决然以為非也今試妄言煩公一閲是非幸復垂諭以觧愚蔽胷中所欲言者非可以書盡惟冀自愛重而巳謹手啟不宣秉國論中和書中之說有二對外而為言一也無過與不及一也喜怒哀樂之未發漠然無形及其既發然後見其中節與不中節也故喜怒哀樂之未發謂之中發而中節謂之和人之心虚則明塞則暗虚而明則燭理而無滯應物而不窮喜怒哀樂之發有不中節乎中節則無過與不及矣有不和乎在易之卦虚其中曰離為日為南方為火王弼觧復其見天地之心云天地以本為心者也雷動風行運變萬化寂然至無是其本也春萌夏長秋落冬閉日月之行星斗之運此天地之迹可見於外者也張官置吏發􅃅施令事功之修舉民物之茂遂此聖人治天下之迹可見於外者也若其所以迹者盖莫得而擬議也凡物莫不有此本又衆本之所自出故曰大本凡物不得其節則過與不及施於用則為蔽塞為睽乖為不行為患難無此四者和矣故曰達道明乎此者其見天地聖人之心乎傳家集巻六十二欽定四庫全書傳家集巻六十三宋司馬光撰書啓六答韓秉國書元豐八年二月二十九日作光啓丁通直来蒙貺書審起居安和至喜示諭見與景仁書似恠論議有所不同此何言哉朋友道廢乆矣光述中和論所以必欲呈秉國者正為求切磋琢磨庶㡬近是耳豈欲秉國雷同而巳雅聞秉國有論光不勝其喜故因景仁請見之何謂恠也然光至愚於秉國之論猶有所未逹者請試陳之惟秉國擇焉秉國云中之說有二對外而言一也無過與不及一也此誠如諭然中者皆不近四旁之名也指形而言之則有中有外指徳而言之則有和此書以中庸為名其所指者盖徳也非形也如秉國所諭則中庸應云喜怒哀樂之未發謂之中及其既發謂之外不則云喜怒哀樂之未發謂之虚發而皆中節謂之和乃相應也秉國又云虛則明塞則暗此誠如所諭然所謂虛者非空洞無物之謂也不以好惡利害蔽其明是也夫心動物也一息之間升天沉淵周流四海固不肯兀然如木石也惟賢者治之能止於一擇其所止莫如中庸故虞書曰惟精惟一允執厥中也凡人固有無喜怒哀樂之時當此之際其心必有所在小人則追求嗜好靡所不之帷君子􅀎自處於中庸之地不動以待事也大學曰知止而後有定定而後能靜靜而後能安安而後能慮慮而後能得又曰為人君止於仁為人臣止於敬為人子止於孝為人父止於慈與國人交止於信言所止各有在也荀子曰徳操然後能定能定然後能應能定能應夫是之謂成人亦言所定在於徳也又曰人何以知道曰心心何以知曰虚一而静心未嘗不蔵也然而有所謂虚不以所已蔵害所將受謂之虚心未嘗不兩也然而有所謂靜不以夢劇亂知謂之靜然則虛者固不為空洞無物靜者固不謂兀然而木石也凡曰虛曰靜曰定云者如大學與荀卿之言則得中而近道矣如佛老之言則失中而逺道矣光所以不好佛老者正謂其不得中道可言而不可行故也借使有人真能獨居宴坐屏物棄事以求虛無寂滅心如死灰形如槁木及有物歘然来感之必未免出應之則其喜怒哀樂未必皆能中節也曷若治心養氣専以中為事動靜語黙飲食起居未始不在乎中則物雖輻湊横至一以中待之無有不中節者矣秉國又引王輔嗣觧復其見天地之心以證虚無為衆本之所自出夫萬物之有誠皆出於無然既有則不可以無治之矣常病輔嗣好以老莊觧易恐非易之本指未足以為據也輔嗣以雷動風行運變萬化為非天之心然則為此者果誰邪夫雷風日月山澤此天地所以生成萬物者也若皆寂然至無則萬物何所資仰邪天地之有雲雷風雨猶人之有喜怒哀樂必不能無亦不可無也故易曰雲行雨施品物流形詩曰君子如怒亂庶遄沮君子如祉亂庶遄已但動靜有節隠見有時不可過與不及過與不及皆為災害必得中然後和和然後能育萬物也自有天地以来陽極則隂生隂極則陽生動極則靜靜極則動盛極則衰衰極則盛否極則泰泰極則否若循環之無端萬物莫不由之故曰一隂一陽之謂道此皆天地之心然復者陽生之卦也天地之大徳曰生故聖人賛之曰復其見天地之心乎言天地之道雖一徃一来本以好生為心也易道幽深而輒敢妄為之觧其罪甚大亦不自識其是與非也抑求之空言不若驗之實事竊聞秉國平日好習靜光不勝區區願秉國試輟習靜之心以為習中之心動靜語黙飲食起居皆在於中勿湏臾離也乆而觀其所得所失孰少孰多則秉國必自得之矣豈待光之煩言哉愚慮如此所不及者不惜更示不宣光再拜答秉國第二書元豐八年三月十五日作光啓辱四日所恵書誨以所未諭幸甚幸甚書文甚多援据甚廣光欲一一條對則恐逐枝葉而忘本根徒費紙劄視聴無益於進道是宜直指其大要而言之今光與秉國皆知中庸之為至徳而信之矣所未合者秉國以無形為中光以無過與不及為中此所謂同門而異户也夫喜怒哀樂之未發常設中于厥心豈有形於外哉荀卿太學所謂虛靜定者非寂然無思慮也虚者不以欲惡蔽其明也靜者不以怵迫亂其志也定者不以得喪易其操也中庸所謂中者動靜云為無過與不及也二者雖皆為治心之術其事則殊矣今秉國合而為一恐未然也周公思兼三王以施四事有不合者仰而思之夜以繼日孔子終日不食終夜不􅃦以思道豈得寂然無思慮哉苟為不思又不慮直情徑行雖聖人亦恐喜怒哀樂不能皆中節也中庸所謂誠者天之道言聰明睿智天所賦也誠之者人之道言好學從諫人所為也不勉而中不思而得從容中道謂聖徳之已成者也擇善而固執之愽學審問慎思明辨篤行謂賢人之好學者也人一能之已百之謂愚者之求益者也夫不歴坱埤不能登山不㳂江河不能至海聖人亦人耳非生而聖也雖聰明睿智過絶於人未有不好學從諫以求道之極致由賢以入於聖者也故孔子曰我非生而知之好古敏以求之者也又曰吾十有五而志於學至於七十然後從心所欲不踰矩以孔子之徳性猶力學五十有五年乃能成其聖况佗人不學而能之乎若謂聖人生知自天必不可及則顔子何為欲罷不能孟子何為自比於舜哉舜戒羣臣曰予違汝弼汝無面從使舜生而聖不勉而中不思而得夫又何弼哉詩稱文王不聞亦式不諫亦入言其性近於道處師弗煩在傳弗勤非謂不學而不諌也光前書論中已備矣恐秉國尚未詳覽而熟察也光前書云願秉國動靜語黙飲食起居皆在於中勿湏臾離也乆必自得之秉國亦嘗留意采其言乎今有人饋食於吾二人者吾二人未嘗而先爭之一人曰鹹一人曰酸曷若相與共嘗則知其味矣又有饋藥於吾二人者吾二人未服而先爭之一人曰寒一人曰温曷若相與共服則知其驗矣中美食也良藥也光願與秉國强勉而試行之師曠曰秉燭之明孰與夜行吾人雖老矣繼今而學猶庶㡬其有益也徃来之言奚以多為答兩浙提舉趙宣徳㞦書光頓首再拜比見邸報聞先大資少保違去盛世驚怛惋痛𠂻懐如割以道逺無便無由發疏致慰昨晚兵人来忽辱示問并鄭君所為行狀欲令光作誌文光實何人望先公名徳何啻倍蓰什百曏獲接侍之乆蒙知顧之厚今得論譔盛美自託不朽何幸如之顧以光不為人作碑誌已十餘年所辭拒者甚多徃嵗有孫令以書見屬欲令光譔其伯父之翰碑光時復書叙不可為之故頗詳是後又辭王樂道曾子固等數家皆以此書呈之去年富公初薨光往弔酹其孤朝奉在草土中號哭自擲必欲使光作墓誌又遣人来垂諭至于三四光亦以所以語孫令者告之竟辭不為今若獨為先公為之則是有所輕重厚薄足下試以尊意度之謂光敢為之乎不敢為乎此則不待光辭之畢足下必盡察之矣况先公清節直道著於海内皎如列星决不沉沒佗年所以取信於世者在國史列傳豈待光鄙陋之文然後彰彰乎然方今羣公文章髙出於衆議論為人所信者何可悉數足下不求於彼顧遣使者自衢至洛走數千里専以相委荷雅意期待如此之重乃敢仰違尊命俾使者虚返其為罪戾擢髮有餘所冀大君子聰明通恕知其非可為而不為也慙懅恐悸言不能盡答武功石令飛卿書光啓縣人来䝉示啓事千餘言大指以為明天子在上宜以時起佐萬一以澤斯民不宜専務自逸何足下期待之過而責望之重也捧讀戰悚流汗及踵光聞君子擬人必於其倫仲尼聖人也自生民以来未之有也而足下語及不肖動輒以仲尼况之此雖甚愚不辨菽麥之人亦不敢當無乃重增不肖之罪而為足下失言之累乎不可不可光自惟徳行文學言語政事一無所長在稠人間僅及下中但事君不敢欺得官非智力所任者不敢輕受此固為士者之常守無足言者而世俗閭閻之人遽相與驚恠從而譽之光聞之每踧踖發慙不自知其何以致之蓋所謂名浮於實者也性戇滯不曉時務比又苦衰疾不堪治民遂自乞冗員苟竊㣲禄以庇身養族天子憐其無佗惡直不才耳而嘗厯事三朝今雖昏耄無所用不忍棄捐俾之掌留臺道宫月給錢粟而不責以職事如疲牛老馬尚以莝豆飼之不求其任重致逺脫其紖鞅縱之林野使之徜徉自適以盡其天年此乃天子至仁雖天地之覆載滄海之涵容未足以諭而草木魚蟲無一毫之益以報盛徳乃光有負於朝廷而朝廷實無負於光也光豈敢養髙傲世釣名邀利邪光胷中何所有而足下欲迫之使立朝廷佐下風邪且明天子在上進賢退不肖褒勤黜惰皆决於掌握為人臣者身非巳有如金在鎔泥在鈞惟甄冶之所為用捨進退豈得自専邪竊恐足下誤信世俗之談而有是言也願勿以騏驥之皮䝉駑駘之背而䇿之使一日千里幸甚幸甚答懷州許奉世秀才書五月四日涑水司馬光再拜復書許君秀才足下去年十二月懷州人来䝉惠書自爾日欲因王判官寓書報謝俗事汩沒繼以國䘮奔走京師往返殊無暇稽慢之罪固無所逃光性愚魯自㓜誦諸經讀注疏以求聖人之道直取其合人情物理目前可用者而從之前賢髙竒之論皆如面牆亦不知其有内外中間為古為今也比老止成一樸儒而已曏屢聞王君具道盛美云道甚髙學甚精孝弟隆閨門名義著鄉里常延頸企踵晞仰聲采固非一日不意過聴遽詒之話言仍示以所述孝睦事迹夫孝弟者仁義之實敦睦者政化之本光以是闚足下之志固不待承顔接辭而後知之矣欽服欽服夫玉韞窮山十仞之土不能掩其光珠潜深淵岸草為之不枯足下姑進徳修業但恐大名不免彰徹於世勿病人之不已知也光屬受詔守陳不乆留於洛王君多㳂牒在外今日暫見之来旦復出輒走此布區區草率不悉仍封舊注古文孝經一冊容易上呈庶逹鄙志光頓首再拜與吕晦叔簡光啓自晦叔入都及得共事每與僚宷行坐不相離未甞得伸悃幅雖日夕接武猶隔闊千里也今不幸又在病吿杳未有展覿之期其邑邑可知光平生有國武子之疾好盡言以招人過遇庸人時或妄發以取恨怒况至交益友豈敢反懐情不盡乎晦叔自結􅄠至仕學而行之端方忠厚天下仰服垂老乃得秉國政平生所藴不施於今日將何俟乎比日以来物論頗譏晦叔慎嘿太過若此際不廷爭國事蹉跌則入彼朋矣願慎㫋慎旃光誠不肖豈敢以憂國為已任然昨日富家之諭已上聞矣光自病以来悉以身付醫家事付康惟國事未有所付今日屬於晦叔矣與吕晦叔第二簡介甫文章節義過人處甚多但性不曉事而喜遂非致忠直踈逺讒佞輻輳敗壞百度以至于此今方矯其失革其弊不幸介甫謝世反覆之徒必詆毁百端光意以謂朝廷特宜優加厚禮以振起浮薄之風苟有所得輒以上聞不識晦叔以為如何更不煩答以筆札扆前力言則全仗晦叔也答彭朝議寂書光啓辱書奬借太過期待太厚且愧且懼殆無所容光禀性甚愚求道多蔽徳行言語政事文章皆不迨人齪齪㢘謹自守而已不意時俗妄加虛名如火附螢如膏汚衣潜迯湔澣不知所避固㣲生之不幸未嘗敢取以為已有也屬者朝廷誤賜甄擢俾待罪政府辭不獲命僶俛就職每内訟非據如藉蒺藜素與足下未嘗得接聲采之熟陪從容之乆乃能不逺數千里教以所不及非光無似克堪大賜乃足下愛君仁民之志勤懇切至不暇擇其人之可否而語之也銜荷盛徳刻骨不㤀謹當寳藏時取伏讀以自警筞庶㡬少副萬分之一譬如駑馬聞騏驥嘶鳴不自量度踊躍躑躅亦欲疾歩而從之殊不知軼景遺風雖破骨絶筋而不可及也雖然朝廷近發詔書溥覃四海雖市㕓畎畒之民皆得直上封言事足下位為朝大夫任為部刺史於朝政闕失民間疾苦願不惜以時上聞俟禁中降出得與諸公評議恊同者即行之幸甚幸甚光再拜答程伯淳書光昨日承問及張子厚諡倉卒奉對以漢魏以来此例甚多無不可者退而思之有所未盡竊惟子厚平生用心欲率今世之人復三代之禮者也漢魏以下盖不足法郊特牲曰古者生無爵死無諡爵謂大夫以上者檀弓記禮所由失以謂士之有誄自縣賁父始子厚官比諸侯之大夫則已貴宜有諡矣然曾子問曰賤不誄貴㓜不誄長禮也唯天子稱天以誄之諸侯相誄猶為非禮况弟子而誄其師乎孔子之沒哀公誄之不聞弟子復為之諡也子路欲使門人為臣孔子以為欺天門人厚𦵏顔淵孔子嘆不得視猶子也君子愛人以禮今闗中諸君欲諡子厚而不合於古禮非子厚之志與其以陳文範陶靖節王文中子孟貞曜為比其尊之也曷若以孔子為比乎承闗中諸君决疑於伯淳而伯淳謙遜慱謀及於淺陋不敢不盡所聞而獻之以偹萬一惟伯淳裁擇而折𠂻之答吕由庚推官手書光再啓示諭史院所取文字光前此亦䝉􅂑禀兩朝所上章疏光以身今尚存難將諌草内授史官但答云所上䟽内多渉朝廷機宻不敢輒具録上伏乞朝廷於禁中及中書宻院檢尋如有可采者乞下史院修纂今來先中丞文字又似不同子孫正當發揮前烈垂之不朽唯於慈夀乞增奉養一事恐當諱避其餘言時政闕失彈奏大臣等事今日不録申史院則先公平生事業遂汩沒矣更希裁度光再啓貽劉道原光再拜光少時惟得髙氏小史讀之自宋訖隋正史并南北史或未甞得見或讀之不熟今因修南北朝通鑑方得細觀乃知李延夀之書亦近世之佳史也雖於禨祥談嘲小事無所不載然叙事簡徑比於南北正史無煩冗蕪穢之辭竊謂陳夀之後唯延夀可以亞之也渠亦當時見衆人所作五代史不快意故别自私著此書也但恨延夀不作志使數代制度㳂革皆沒不見道原五代長編若不費功計不日即成若與沈約蕭子顯魏收三志依隋志篇目刪次補葺别為一書與南北史隋志並行則雖正史遺逸不足患矣不知道原肯有意否其符瑞等皆無用可刪後魏釋老志􅂑其要用者附於崔浩傳後官氏志中氏族附於宗室及代初功臣傳後如此則南北史更無遺事矣今國家雖校定摹印正史天下人家共能有㡬本乆逺必不傳於世又校得絶不精只如沈約叙傳差却數板亦不寤其佗可知也以此欲告道原存録其律歷禮樂職官地里食貨刑法之大要耳不知可否如何如何光再拜答范夢得光前者削奏時將謂宫教二年改官不知新制乃須五年得無却成奉滯否慚悚慚悚夢得今来所作叢目方是將實録事目標出其實録中事應移在前後者必已注於逐事下訖假如實録貞觀二十三年李靖薨其下始有靖傳傳中自鎻告變事湏注在隋義寧元年唐公起兵時破蕭銑事湏注在武徳四年滅銑時斬輔公祐湏注在七年平江東時擒頡利湏注在貞觀四年破突厥時佗皆傚此自舊唐書以下俱未曾附注如何遽可作長編也請且將新舊唐書紀志傳及統紀補録并諸家傳記小說以至諸人文集稍干時事者皆湏依年月注所出篇巻於逐事之下實録所無者亦湏依年月日添附無日者附於其月之下稱是月無月者附於其年之下稱是嵗無年者附於其事之首尾如左傳稱初鄭武公娶于申之類及為某事張本起本者皆附事首者也如衛文公復國之初言季年乃三百乗因陳完奔齊而言完始生筮知八世之後成子得政因晋悼公即位而言其命官得人不失霸業因衛北宫文子聘於鄭而言禆諶草創子産潤色因吳亂而言吳夫槩王為棠谿氏注云傳終言之之類皆附事尾者也有無事可附者則約其時之早晚附於一年之下如左傅子罕辭玉之類必無的實年月也假使宰相有忠直姦邪事無處可附者則附於拜相時佗官則附於到官時或免卒時其有處可附者不用此法但稍與其事相渉者即注之過多不害假如唐公起兵諸列傳中有一兩句渉當時者但與注其姓名於事目之下至時雖别無事迹可取亦可以證異同者日月也嘗見道原云只此已是千餘巻書日看一兩巻亦湏二三年功夫也俟如此附注俱畢然後請從髙祖初起兵修長編至哀帝禪位而止其起兵以前禪位以後事於今来所看書中見者亦請令書吏别用草紙録出每一事中間空一行許素紙以備翦開粘綴故也隋以前者與貢父梁以後者與道原令各修入長編中盖縁二君更不看此書若足下止修武徳以後天祐以前則此等事盡成遺棄也二君所看書中有唐事亦當納足下處修入長編耳其修長編時請據事目下所該新舊紀志傳及雜史小說文集盡檢出一閱其中事同文異者則請擇一明白詳備者録之彼此互有詳畧則請左右采獲錯綜銓次自用文辭修正之一如左傳叙事之體也此並作大字寫若彼此年月事迹有相違戾不同者則請選擇一證據分明情理近於得實者修入正文餘者注於其下仍為叙述所以取此捨彼之意先注所捨者云某書云云某書云云今案某書證驗云云或無證驗則以事理推之云云今從某書為定若無以考其虚實是非者則云今兩存之其實録正史未必皆可據雜史小說未必皆無憑在髙鑒擇之凡年號皆以後来者為定假如武徳元年則從正月便為唐髙祖武徳元年更不稱隋義寧二年𤣥宗先天元年正月便不稱景雲三年梁開平元年正月便不稱唐天祐四年也詩賦等若止為文章詔誥若止為除官及妖異止於恠誕詼諧止於取笑之類便請直刪不妨或詩賦有所譏諷如中宗時回波詞諠譁竊恐非宜肅宗時李泌誦黄臺𤓰辭之類詔誥有所戒諭如徳宗奉天罪已詔李徳裕討澤潞諭河北三鎮詔之類及大政事號令四方或因功遷官以罪黜官其詔文雖非事實要知當時託以何功誣以何罪亦湏存之或文繁多節取要切者可也妖異有所儆戒凡國家災異本紀所書者並存之其本志强附時事者不湏也䜟記如李淳風言武氏之類及因而􅃱殺戮叛亂者並存之其妄有牽合如水入斗為朱字之類不湏也相貌符瑞或因此為人所忌或為人所附或人主好之而諂者偽造或實有而可信者並存之其餘不湏也妖恠或有所儆戒如􅄦書武三思門或因而生事如楊慎矜墓流血之類並存之其餘不湏也詼諧有所補益如黄幡綽謂自已兒㝡可憐石野猪謂諸相非相之類存之其餘不湏也並告存之大抵長編寧失於繁毋失於畧千萬切禱切禱今寄道原所修廣本兩巻去此即據長編録出者其長編已寄還道原恐要見式様故也甚思與足下相見熟共商𣙜無因可得企渇企渇中前寄去晋紀八巻寫净草者必已寫了其元本却告分付兒子康令帯来雖未了亦告分付盖為今夏􅉍徃南康軍路中遺失却三巻若更失此則都無本故也其寫了浄草續附􅉍来不妨曏所請出魏紀今令李永和帯去有改動者吿指揮别寫及楷改目痛燈下作此書恕其不謹光上凡有人初入長編者並告於其下注云某處人或父祖已見於前者則注云某人之子或某人之孫今更寄貢父所作長編一冊去恐要作式様並道原廣本兩巻並告存之向去不使却寄示也三省咨目光比日牽强入朝欲與諸公商議數事貢其短拙以求采擇無何上下馬不得湏至在朝假謹具咨目如左當今法度所宜最先更張者莫如免役錢不惟刻剥貧民使不聊生人雇得四方無頼浮民使供百役官不得力為今之計莫若盡罷免役錢依舊差役民間息肩者什已七八若慮逐處利害不同即委諸路轉運司及州縣具未便事理申陳朝廷更為相度别立一州一縣勅施行第一不可委提舉司相度彼雖本職藉賴役錢如魚之有水安肯放免必来沮難無疑也光見欲作一文字奏聞若降至三省望諸公同心叶力與賛成如此行之可以除乆弊蘇疲民凡法乆則難變此法行之已十五年下户雖愁苦上户頗優便常情論議已是非不一若不於此際决志改之恐異日遂為萬世膏肓之疾公家不得用民力貧民常苦富民優矣朝廷今欲整治天下蘇息疲民先湏十八路各得好監司一兩人忠厚曉事憂民忘私使之進賢退不肖興利除害朝廷於本路事有所不知問之則以實對委之措置則不至乖方然後可以倚仗為耳目股肱也苟非其人則百事倒置矣前日所草監司資格及委官薦舉文字不知諸公曽徧見未若如此可行則早告進呈施行然立格為易守格為難既出指揮以後願諸公堅執此格勿自隳壞始為有益也旱勢可懼若春更不雨必成大饑不可不豫為之備國家所賴為根本者莫若農民農民者衣食之原國家不可不先存恤也欲加存恤莫若察其乏食之初早加賑贍使各安土不至流移官費既省民不失業此上䇿也若已流移官雖多作擘畫散米煑粥徒聚為餓殍無益也為今之計莫若豫先將常平斛斗在州縣者十分中支撥一分充賑貸米委州縣樁管許一面支破常切覺察鄉村人户有闕食者許經本縣投狀據口數多少老小出給歷子每五七日一次赴縣請給口食先從下户為始縣亦置簿拘管請却之數如此救接直至成熟日方即一切住支却令還納所貸元數更不取利息如此始是實恵弋俊已獲未聞賞獲之者其將官討捕者不無搔擾宜早罷之前日蔡尹来言開封有巨盜朝廷有募人能禽之者賞以班行今既禽之止賞以錢孔子稱去食去兵無信不立聖朝政令豈當如此諸公更筭其多者范景仁當仁宗不豫未有繼嗣天下寒心莫敢啓口之時獨能首建大議以安宗廟社稷章十九上除官不拜可謂以身徇國之臣其功不在文富之下今文富重賞景仁獨不霑及太皇太后亦應知其功大願諸公進呈秉國文字時詳為敷奏乞優與推恩前日簾前宣諭上封事異等者宜畧加旌賞此乃聖朝美事光有看詳封事厯三巻官職姓名及所言事一一有之願諸公同於其間選擇才識出衆者具姓名敷奏量加襃異以成聖心宻院咨目光比日曵病入朝只為欲與諸公商議數事於簾前敷奏終不能得聚㕔今光飲食日減不能造朝未知㡬時復得瞻望顔色湏至具咨目如左吕大忠言夏虜乍恭乍驁由私市公行故也其延慶侵疆有害無用終當與之然今日未可與也俟大忠到官審察事勢先奏乞嚴禁私市不過年嵗間彼必屈服遣人来祈請然後朝廷下詔曠然歸以侵疆赦其罪戾自今貢賜徃来一切如故此筞大善請明公更召見詢訪其詳然如光愚見若只如去夏約束則大是悠悠徒為玩令一無所益湏别立法云應漢户熟户與西人私相交易者正犯人處斬妻子送江淮編管粉壁曉示許人陳告即時支係省錢五十貫充賞本地分廵檢寨主監押並衝替仍令經畧司本州常切覺察如此逐處行却一兩箇方能禁絶若西人徃年興兵壓境以脅慶州劉忱時亦莫之聴但堅壁清野使自疲弊而去河東經畧司總領二十餘州軍邉靣千餘里地接二邊帥府之重孰過於此而以吉甫處之果能稱職否且如昨者北敵侵火山地不與於初累石時更令撤去彼若放箭我射何傷仍眀據道理𦂳行文牒痛加詰責云當奏朝廷問諸北朝今朝廷亦不共理㑹示之以弱但恐春暖敵狃於得志以為南朝易與大興徒衆廣有占割朝廷亦坐視無如之何土地者國之本若虜惟意所欲無問多少要取便取成何國家此由邉帥不能防㣲杜漸故也渠自乞揚州諸公何不早許之别擇老成重厚有膽畧者以代之子厚方欲措置熈河為經乆之計而元帥乃一方頭目其人豈髙材英器憂國忘家者邪願早易之勿􅃱敗事御史所言保用罷按閱甚當宜從之彼得三時務農豈顧此㣲茫賞物而省國用不少但與逐旋置庫量留些小金帛遇冬教時委令佐選絶藝者賞以銀楪子銀盌綵叚如何又班行雖云猥賤亦是國家命官豈可如泥土與人其出等事藝及正長教人及分數欲更不與班行正長所以鞭撻保丁只為未及分數千賞故也前日見駕部来白沙苑地狭不能容京西所送騍馬且彼無牡馬徒多養騍馬何為但使之積死可惜耳欲令京西未發者皆烙退印還民已發者令沙苑估價出賣如何若可取望早指揮然監牧亦不可不一靣早差官相度興復漢唐都長安故養馬多在汧隴三輔之間國家都大梁故監牧在鄆鄭相衛許洛之間各取便於出入故也今宜且復近處一二監各有舊基故也子厚嘗言軍賞誤何時當與裁減改正邉人立小功者宜勿賞此宋璟所以安開元也封事大約已徧止有兩復吏云其籖子厚欲有去取既難得㑹議彼亦無大利害但請子厚欲去者去之餘令進入貴早結絶與三省宻院論西事簡不和西戎中國終不得髙枕光所上芻蕘果有可采否縱未欲遽以侵地歸之且下一詔數其不賀正旦生辰及登寳位臣禮不備諭以天子新即位務崇寛大曠然赦之自今貢奉賜予宜皆復舊規但不責其必来獻地分畫疆界而已令保安牒與如此則彼此相彌縫且有名又不失大體不乗此際為之萬一彼㣲為邉患或更出不遜語愈難處置願諸公筭其多者傳家集巻六十三欽定四庫全書傳家集巻六十四宋司馬光撰論一功名論嘉祐二年作自古人臣有功者誰哉愚以為人臣未甞有功其有功者皆君之功也何以言之夫地有草木天不雨露之則不能以生月有光華日不照望之則不能以眀臣有事業君不信任之則不能以成此自然之道也古者大國不過百里小國半之然皆有賢卿大夫以輔佐其君大者以王小者以霸下者猶能保其社稷世數十傳而不絶由是觀之天下烏有無士之國哉患在人主知之不明用之不固信之不専耳如是則人臣雖有才智而不得施雖有忠信而不敢效人主徒憂勞於上欲治而愈亂欲安而愈危欲榮而愈辱矣然則人主有賢不能知與無賢同知而不能用與不知同用而不能信與不用同不用賢而求功業之美名譽之白難矣昔百里奚虞人也由余戎人也商鞅魏人也而用於秦苖賁皇申公巫臣楚人也而用於晋伍員楚人也而用於吴韓信陳平項羽之人也而用於漢是五國者非無賢人也主不能知而驅之以資敵國此所謂有賢不能知與無賢同也齊桓公見郭氏之墟問於野人曰郭何故亡對曰以其善善而惡惡公曰善善而惡惡國所以興也而亡何故對曰善善而不能行惡惡而不能去所以亡也公歸以吿管仲曰君與其人俱来乎曰否管仲曰君亦一郭氏也公乃召而官之齊景公待孔子曰若季氏則吾不能以季孟之間待之齊王欲中國而授孟子室養弟子以祿萬鍾使諸大夫國人皆有所矜式是二君者非不知孔孟之為聖賢也不能行其道而徒欲尊之以為名是以孔孟以為不義而不留也洪範曰凡厥正人既富方榖汝弗能使有好于而家時人斯其辜此所謂知賢不能用與不知同也樂毅為燕伐齊下七十餘城燕王疑之使騎劫代將田單詐騎劫而敗之盡失齊地㢘頗為趙將拒秦乆而不戰趙王疑之使趙括代將白起擊趙括而虜之阬其卒四十萬項羽用范增謀彊霸諸侯圍漢王滎陽㡬㧞矣聞漢之反間而疑之范增怒而去項羽卒為漢禽夫駕車者既服騏驥矣又以駑馬參之欲其並驅而前不可得也蓻田者既樹嘉榖矣又以稂莠雜之欲其滋生而茂不可得也為國者既置賢才矣又以小人間之欲其並立而治不可得也是故宓子賤為單父宰辭於君請君之近史二人與之俱至官使二史書方書輒掣其肘書不善則從而怒之二史患之辭請歸以告魯君魯君以問孔子孔子曰宓不齊君子也其才任王霸之佐屈節治單父將以自試也意者以此為諌乎公寤太息而嘆曰此寡人之不肖寡人亂宓子之政而責其善者數矣㣲二史寡人無以知其過㣲夫子寡人無以自寤遽發所愛之使告宓子曰自今以徃單父非吾有也從子之制有便於民者子决為之五年一言其要宓子遂得行其政而單父大治大禹謨曰任賢勿貳去邪勿疑疑謀勿成百志惟熈荀子曰人主有六患使賢者為之則與不肖規之使智者慮之則與愚者論之使修士行之則與汚邪之人疑之雖欲成立得乎哉譬之是猶立直木而恐其影之枉也惑莫大焉語曰好女之色惡者之孽也公正之士衆人之痤也修乎道之人汚邪之賊也今使汚邪之人論其怨賊而求其無偏得乎哉譬之是猶立徃木而求其影之直也亂莫大焉噫人主苟不知其賢則已矣已審知其賢授之以政而復疑之何哉凢忠直之臣行其道於國家則必與夫天下之姦邪為怨敵矣非喜與之為怨也不與之為怨則君不尊國不治功不立也以一人之身日與天下之姦邪為怨更進迭毁於君前而君不能决兼聽而兩可之如是則忠直之臣求欲無危不可得也君子非愛死而不為也知其身死而功不立姦邪愈熾忠良愈恐政治愈亂國家愈危也是以君子難進易退辭貴就賤被髪佯狂逃匿山林者以此故也此所謂用賢不能専與不用同也眀主為之不然審求天下之大賢而亟用之專信之舉社稷百姓而委屬之雖有至親不能奪也雖有至貴不敢爭也雖有讒巧不能間也確然若膠漆之相合視其際而不可得見也然後賢者得竭其心而施其才不憂怨賊之口不懼猜嫌之迹人主端拱無為享其功利收其榮名而已矣古之聖帝明王用此道而光宅四海長育萬物功如天地名若日月者多矣固不待稱引而知也請言其時近而道卑者昔齊桓公得管仲三薫而三浴之觧其縲紲置以為相鮑叔桓公之傅也避太宰之位而安隨其後國子髙子天子之守卿也人率五卿而聽其政令況其餘四境之内上下之人其孰敢不戰戰栗栗從桓公而貴信之是以能九合諸侯一正天下為五霸首也陳平楚之亡將也漢髙祖得之使典護諸將綘灌之屬盡害之髙祖以平為護軍中尉盡監護諸將諸將乃不敢言韓信亡卒也髙祖用蕭何一言拔諸行伍之中以為大將諸將皆驚而不敢爭也是以五年之中滅項羽定天下創業垂統四百嵗而不絶蜀先主與闗羽張飛布衣之友周旋艱險恩若兄弟一旦得諸葛孔明待之過於闗張闗張不說先主曰孤之有孔明猶魚之有水願諸君勿復言是以能起於敗亡之中保有一方與魏吳為敵國苻永固得王景畧於處士以為丞相貴戚大臣有害之者永固輒殺之謂太子宏及長樂公丕曰汝事王公如事我也是以能東取燕西取涼南取襄陽北取拓跋奄有中原㡬平海内此五臣者從今日視之皆英傑之才也曏使四君知之不眀用之不固信之不専則管仲醢於齊庭陳平窮於户牖韓信餓於淮隂諸葛孔明老於隆中王景畧死於華山名氏埋滅不可復知烏有曄曄功烈施於後世如此哉是以大雅云徐方既同天子之功晋平公問叔向曰齊桓公之霸君之力乎臣之力乎叔向曰管仲善制割隰朋善削縫賔胥無善純縁桓公知衣而已亦其臣之力也師曠曰管仲善斷割之隰朋善煎熬之賔胥無善齊和之羮巳熟矣奉而進之而君不食誰能强之亦其君之力也魏文侯使樂羊將而攻中山三年而拔之返而論功文侯示之謗書一篋樂羊再拜稽首曰此非臣之功主君之力也由是言之人臣不能立功凡有功者皆其君之功也機權論慶厯五年作世之命機權也妄故作機權論以辨之機者弩之所以發矢者也機正於此而的中於彼差之至㣲失之甚逺故聖人之用機也似之易曰機者動之㣲吉凶之先見者也又曰君子見機而作不俟終日然則機者事之未著萌芽端兆之時聖人眇然見之能去禍而取福迎吉而禦凶所以為神也聖人之所慎無過機者故曰兢兢業業一日二日萬機也權者銓也所以平輕重者也聖人之用權也必將校輕重商緩急彼重而此輕則捨此而取彼彼緩而此急則去彼而就此取捨去就之間不離於道乃所謂權也然則機者仁之端也權者義之平也今世俗之為說者乃欲弃仁義而行機權不亦反哉夫不知機權則無以為聖人聖人未嘗斯湏不用者機權而已矣聖人精心審謹而後行之故百姓萬物皆頼焉小人不知機權之道而誣竊其名妄行誖理所以福祿不乆而禍亂及之也請問聖人機權之道曰昔紂為玉杯象箸而箕子佯狂衛靈公仰視蜚鴻而孔子行是皆知機者也夫杯箸小器飾以珠玉未為太過而箕子知其必亡國者為其奢淫泰侈之漸由此始也仰視蜚鴻失理之細者而孔子去之者知其不能用聖人而有厭怠之心不去則大禍將至也如此聖人之知機豈不偉哉伊尹放太甲㣲子去商歸周周公誅管蔡是皆知權者也夫數君子豈不知放君畔宗戮親之為不善哉誠以放君之責輕而淪喪大業之禍重畔宗之譏薄而保存宗祀之孝深戮親之嫌小而傾覆周室之害大故去彼而取此也夫太甲之初欲敗度縱敗禮苟非苦其身體勞其思慮則不能變惡遷善克終允徳成湯之業將墜於地伊尹躬受湯命阿衡王家故不得不放諸桐宫也受為不道自絶於天㣲子不去與之偕亡則祖禰不祀宗族無主故不得不抱祭器而歸周也管蔡奉廢姓伐宗國違天命逆人心傾危聖輔斵喪周室成王㓜弱周公攝政故不得不奮干戈揚斧鉞以治之盖周公非自愛而愛周室故也嚮若太甲尚可諌而改則伊尹必不放君商受苟可輔而存則㣲子必不畔宗管蔡猶可教而治則周公必不戮親夫豈不思誠不得已也是以太甲曰惟嗣王不恵于阿衡伊尹作書曰祗爾厥辟辟不辟忝厥祖是猶以辱先為戒未欲正言覆亡之禍委蛇其辭以感切之也王惟庸罔念聞伊尹乃言曰無越厥命以自覆是正言禍敗以聳動之也王未克變伊尹乃以王生而榮逸不知勞辱狎近小人積習至此非其性惡故曰茲乃不義習與性成營于桐宫宻邇先王其訓無俾世迷言積習寖乆將成其性及今猶可沮詘而改此乃伊尹盡心盡力於成湯太甲之至也㣲子之誥曰商其弗或亂正四方言受不可復正决必亡國已所以當出奔存湯後也父師若曰商其淪喪我罔為臣僕言商既亡宗族俱滅無所寄託也又曰王子弗出我乃顛隮言不可不行也此㣲子廣咨權謀輕重之審諦也大誥曰肆予沖人不卭自恤義爾邦君越爾多士尹氏御事言今東征非為巳也􅃎風曰既取我子無毁我室子以喻管蔡也室以喻周家也言管蔡輕而周家重也予羽譙譙予尾翛翛言勤瘁也予室翹翹風雨所漂揺予唯音嘵嘵言三監背誕王室阽危故我恐懼以憂之也此豈周公背公向私之志哉夫聖人之用權也如此故國家安而仁義立也後世之人昧錙銖之利以放逐其君懷芥帯之嫌以屠滅其親而亦自比於伊周曰吾用機權不亦誣哉此乃亂臣賊子所以滋多也朋黨論嘉祐三年五月二十三日作黄介夫作壞唐論五篇以為壞唐者非巢温與閹䜿乃李宗閔李徳裕朋黨之弊也是誠得其本矣雖然介夫知其一未知其二彼盜賊之興由閹竪閹竪之横由輔相則信然矣噫輔相樹立私黨更相排壓而不能正又誰咎哉夫朋黨之患不専在唐自古有之以堯之明共工驤兠相薦於朝舜臣堯既流共工又放驩兠除其邪黨然後四門穆穆百工咸熈仲虺數夏之惡曰簡賢附勢實繁有徒武王數商之惡曰朋家作仇脅權相滅是則治亂之世未嘗無朋黨堯舜聰明故能别白善惡而徳業昌明桀紂昏亂故不能區處是非而邦家覆亡由是言之興亡不在朋黨而在昏明矣洪範皇極曰無偏無詖遵王之義無有作好遵王之道無有作惡遵王之路無偏無黨王道蕩蕩無黨無偏王道平平無反無側王道正直周公戒成王曰孺子其朋孺子其朋其往無若火始燄燄厥攸灼叙弗其絶是以舜誅禹父而禹為舜佐伊尹放太甲而相之周公放蔡叔而封蔡仲公之至也夫宗閔徳裕雖為朋黨由文宗實使之文宗嘗曰去河北賊易去朝中朋黨難殊不知群臣為朋黨誰之過也由是觀之壞唐者文宗之不明宗閔徳裕不足専罪也中和論元豐七年十月三日作君子從學貴於博求道貴於要道之要在治方寸之地而已大禹謨曰人心惟危道心惟㣲惟精惟一允執厥中危則難安㣲則難明精之所以明其㣲也一之所以安其危也要在執中而已中庸曰喜怒哀樂之未發謂之中發而皆中節謂之和君子之心於喜怒哀樂之未發未始不存乎中故謂之中庸庸常也以中為常也及其既發必制之以中則無不中節中節則和矣是中和一物也養之為中發之為和故曰中者天下之大本也和者天下之逹道也智者知此者也仁者守此者也禮者履此者也樂者樂此者也政者正其不然者也刑者威其不從者也合而言之謂之道道者聖賢之所共由也豈惟人哉天地之所以生成萬物靡不由之故曰致中和天地位焉萬物育焉孔子曰君子無終食之間違仁造次必於是顛沛必於是故曰道不可湏臾離可離非道也孔子曰中庸之為徳也其至矣乎民鮮乆矣又曰回也其心三月不違仁其餘則日月至焉而已日月至焉者斯巳賢矣以是觀之能乆於中庸者盖鮮矣孔子曰智者樂仁者夀盖言知夫中和者無入而不自得能無樂乎守夫中和者清明在躬志氣如神能無夀乎小雅曰樂只君子邦家之基樂只君子萬夀無期又曰樂只君子邦家之光樂只君子萬夀無疆盖言君子有中和之徳則邦家安榮既樂且夀也孔子曰克已復禮為仁盖言禮者中和之法仁者中和之行故得禮斯得仁矣孔子閒居曰無聲之樂志氣不違以至於氣志既起樂記曰易直子諒之心生則樂以至於不言而信不怒而威盖言樂以中和為本以鐘鼔為末也商頌曰不競不絿不剛不柔敷政優優百祿是遒盖言政以中和為美也大雅曰恵此中國以綏四方無縱詭隨以謹無良盖言刑以中和為貴也子曰飯蔬食飲水曲肱而枕之樂亦在其中矣又曰回也一簞食一瓢飲不改其樂揚子曰紆朱懷金之樂也外顔氏子之樂也内盖言聖賢内守中和雖幽隠貧賤不失其樂也劉康公曰民受天地之中以生所謂命也能者養之以福不能者敗以取禍中庸曰大徳者必得其夀盖言君子動以中和為節至於飲食起居咸得其宜則隂陽不能病天地不能夭雖不𨗳引服餌不失其夀也孟子曰我善養吾浩然之氣夫志氣之帥也氣體之充也志至焉氣次焉故孟子養徳以氣言之盖能謹守中和之志不以喜怒哀樂亂其氣則志平氣順徳日新矣故曰持其志無暴其氣及夫徳之成也沛然不息確然不動挺然不屈故曰其為氣也至大至剛以直養而無害不有道義以充其内能如此乎故曰配義與道無是餒也凡人為不善能欺天下之人不能欺其心雖忌而行之於其心不能無蔕芥焉然則浩然之氣不存矣故曰行有不慊於心則餒矣君子優游從容以養其氣雖不敢忽忘亦不正以為事欲其速成故曰必有事焉而勿正心勿忘勿助長也操之則存捨之則亡乆而無怠然後自得之此其所以難言也揚子曰藏心于淵美厥靈根君子存神於内應務於外雖徃来萬變未嘗失其所守是以百骸治而徳本植焉故曰神不外也志之所至氣必輔之君子乗之以為善小人乗之以為惡故曰氣者所適善惡之馬也君子守中和之心養中和之氣既得其樂又得其夀夫復何求哉孔子曰狂者進取又曰吾黨之小子狂簡斐然成章如光之謂矣雖然此皆纂述聖賢之言非取諸􅎍臆也夫道猶的也射者莫不志於的其中否則未可知也必俟有道者乃能裁之才徳論慶厯五年作世之所謂賢者何㢤非才與徳之謂邪二者殊異不可不察所謂才者存諸天徳者存諸人智愚勇怯才也愚不可强智怯不可强勇四者有常分而不可移故曰存諸天善惡逆順徳也人苟弃惡而取善變逆而就順孰禦之㢤故曰存諸人譬之於物金可以為鐘可以為鼎玉可以為珪可以為璧此存諸人者也玉不可以為鐘鼎金不可以為珪璧此存諸天者也存諸天者聖人因而用之存諸人者聖人教而成之雖然自非上聖必有偏也厚於才者或薄於徳豐於徳者或殺於才鈞之不能兩全寧捨才而取徳昔者酆舒有三雋才恃之而不務徳晋滅之智宣子將以瑶為後智果曰不如宵也瑶之賢於人者五其不逮者一也美􅂡長大則賢射御足力則賢技藝畢給則賢巧文辯慧則賢彊毅果敢則賢如是而甚不仁以其五賢陵人而以不仁行之智宗必滅宣子弗聴智氏果亡故曰寧捨才而取徳抑又聞之為國家者進取莫若才守成莫若徳進取不以才則無功守成不以徳則不乆陳平貪汚之人也韓信無耻之士也樊噲屠者而酈食其酒徒也天下之至賤無行者也然其才皆有過人者漢祖舉而用之故蹶秦仆項而卒兼天下也魏國置相而用田文吳起不恱與之論功田文曰我戰鬬治民皆不如子若主㓜國危大臣未附百姓不信當是時屬之子乎屬之我乎吳起乃謝曰屬之子矣此言田文無佗技能唯忠厚可信也夫有徳者必不反其君故可以託六尺之孤寄百里之命為社稷臣有才者不必忠信故以羈筞御之而為徳者役也然則徳者掌也才者指也掌亡則指不可用矣是故民者田也國者苖也才耒耜也徳膏澤也進取不以才猶無耒耜而耕也雖勤灌溉不能生矣守成不以徳猶既種而無膏澤也苖槁無日矣故人主利其耒耜以墾治其民而封殖其國又引膏澤以溉之使其本根深固而枝葉葰茂故子孫謹守其畔獲而食之而已復何為㢤傳家集巻六十四欽定四庫全書傳家集巻六十五宋司馬光撰論二知人論嘉祐二年作考制度習威儀辯牢餼之等詳籩豆之數此宗人之職也察清濁别正邪恊律吕之音肄綴兆之容此太師之職也練士卒簡器械戰必勝攻必取此將帥之職也明法令審獄訟禁彊禦誅姦回此士師之職也豐衣食衍貨財通有無紆滯積此司㑹之職也便舟輿利器械守法度禁滛巧此工師之職也考龜筮占祲祥相吉凶視休咎此太卜之職也謹盖藏吝出納治文書精㑹計此府史之職也若夫選賢而進之量能而任之成功者賞敗官者誅此則人君之職也夫天下至廣也兆民至衆也萬機至繁也而天子兼而有之必將以一人之耳目智力為之則所及者寡所廢者多矣是以明主擇輔佐以論官師論官師以正羣吏正羣吏以和萬民則治約而事無曠矣益稷曰元首眀㢤股肱良㢤庶事康㢤此言君眀則臣良矣良則事康也立政曰宅乃事宅乃牧宅乃凖茲惟后矣又曰文王惟克厥宅心乃克立茲常事司牧人以克俊有徳文王罔攸兼于庶言庶獄庶慎惟有司之牧夫是訓用違庶獄庶慎文王罔敢知于茲此為人君急於知人緩於知事也魏文侯與田子方飲文侯曰鐘聲不比乎左髙田子方笑文侯曰何笑子方曰臣聞之君明樂官不明樂音今君審於音臣恐其聾於官也是以笑荀子曰治國有道人主有職若夫貫日而治詳一日而曲列之是所以使夫百吏官人為也不足以是傷遊玩安燕之樂若夫論一相以兼率之使臣下百吏莫不宿道鄉方而務是夫人主之職也人主者守至約而詳事至佚而功垂衣裳不下簟席之上而海内之民莫不願得以為帝王夫是之謂至約樂莫大焉人主者以官人為能者也匹夫者以自能為能者也人主得使人為之匹夫則無所移之百畝一守事業窮無所移之也今以一人兼聴天下日有餘而治不足者使人為之也大有天下小有一國必自為之然後可則勞苦耗悴莫甚焉如是則雖臧獲不肯與天子易勢業以是統天下一四海何故必自為之自為之者役夫之道也墨子之說也論徳使能而官施之者聖王之道也儒之所謹守也傳曰農分田而耕賈分貨而販百工分事而勸士大夫分職而聽建國諸侯之君分土而守三公揔方而議則天子恭已而已矣由是言之人君之事守莫大於知人也昔者舜𨗳百川不如禹殖百糓不如稷布五教不如契聽五刑不如臯陶典百工不如垂典山澤不如益典禮不如伯夷典樂不如䕫然而明此八者之本能知其人而任使之者舜也譬如車之有轂宫之有棟人之有心此羣聖所以為之役而歸之功也嗚呼帝王之事美矣大矣固不可得而言也齊桓公兄弟爭國暴於犲狼閨門不治甚於狗彘然獨能知管仲之賢舉國而委之一則仲父二則仲父是以兵車之㑹三乗車之㑹六指麾左右而諸侯莫敢不從後世言桓公者徒知其賢而不復知其惡也孔子言衛靈公之無道季康子曰夫如是奚而不喪子曰仲叔圉治賔客祝佗治宗廟王孫賈治軍旅夫如是奚其喪齊文宣帝荒滛狂悖甚於桀紂然而知楊愔之賢悉以國事委之時人以為主昏於上政清於下凡此皆滛昏暴亂之君也徒以能知賢人而用之大者以霸其次以安小者以存况乎以聖君而用賢臣是猶王良之御六驥逢䝉之闗繁弱孟賁之揮干將何適而不逹何射而不中何擊而不斷哉或曰人主之職在知人則既知之矣抑以堯之聖而失之四凶孔子之聖而失之宰我子羽夫人豈易知也哉曰是則然矣夫射者必志於的弓矢既調専精審固而發之雖或不中亦鮮矣與夫冥冥而射者不猶愈乎昔臯陶陳九徳曰寛而栗柔而立愿而恭亂而肅擾而毅直而温簡而㢘剛而塞彊而義彰厥有常吉哉日宣三徳夙夜浚明有家日嚴祗敬六徳亮采有邦翕受敷施九徳咸事俊乂在官百僚師師百工惟時孔子曰視其所以觀其所由察其所安人焉廋哉人焉廋哉李克曰居視其所親富視其所與逹視其所舉窮視其所不為貧視其所不取是亦知人之術也顧人主不深察而已矣三勤論揚子曰民有三勤政善而吏惡一勤也吏善而政惡二勤也政吏駢惡三勤也愚謂勤民者一未嘗有三也何則吏者民之司命吏良則民斯逸矣未有吏善而政惡者也亦未有政善而吏惡者也度吏之才而任之者君之政也形民之力而用之者吏之政也吏苟得人安有榖人不足於晝絲人不足於夜者乎故為人君者謹於擇吏而已矣佗奚足事哉十哲論慶歴二年作十哲於經無見而學者多稱之國家祀孔子十哲則祀於堂上其餘門人祀於東西廡下爼豆之數皆異焉愚竊以為過矣是十人者孔子雖以四科第之非謂門人之中唯十人為賢也至於柴也愚參也魯師也辟由也喭豈謂唯此四人為不肖邪以此觀之尊十哲非孔子意眀矣必若以一善取之則門人之賢者非止十人也以盡善取之則徳行之外未有無過者也孔子謂宰我曰朽木不可彫於予與何誅謂子貢曰賜不受命而貨殖焉億則屢中謂冉有曰求也非吾徒也小子鳴鼓而攻之可也謂子路曰由知徳者鮮矣謂子夏曰商也不及然則豈為盡善邪又十哲之外孔子之所稱譽多矣曾㸃與子路冉有俱侍坐各言其志而孔子獨曰吾與㸃也曽參以至孝顯孔子為之語孝經又謂子賤君子㢤若人然則十人之餘豈可盡誣邪且政事言語文學之髙者不足以當徳行之卑者是十人者其中固有差等矣豈可為之一槩耶四豪論慶厯二年作戰國之時天下禮義消亡下陵上替諸侯僣天子大夫僣諸侯陪臣之間有能約身抑志尊賢養士不愛煩費以樹聲名者齊有孟嘗魏有信陵趙有平原楚有春申雖不能以禮義佐其君以政教和其民合於至公槩於大道然自奮於濁世天下談士異口同舌咸謂之賢銓於四人臧否優劣亦可聞歟論者曰夫人臣者上以事君中以利國下以養民釋此三者非人臣也臣而不臣聖王當世必為誅首孟嘗君養士頼匿亡命廢公法樹私恩媮采名譽以竊國相之任迹其行事皆為身耳非能為國與民謀也至其晚節遂挾仇敵以覆宗國保薛中立自比諸侯臣而不臣孰甚於此春申君進書春宫觧楚國社稷之憂縱楚太子而自以身當不測之誅智勇忠信有足稱者至其柱石楚國權寵無貳割江東之封窮僣奢之樂十餘年間楚國益弱又納邪人之言造姦偽之謀亂其國嗣洿敗王家方諸田文罪又甚焉終為李園所襲身首屠裂則其智勇忠信果安在也平原君行事大倣孟嘗至於貪上黨之田致邯鄲之禍遂至國家大敗社稷㡬亡于以知其智謀尤出數子之下也然趙奢戮平原君之客奢諭釋以公義而平原君薦奢於朝卒著功名且平原君臣人之莭終始無􅃜此其賢於孟嘗春申逺矣信陵君以母弟之親卿相之尊抱闗鼓刀之人親執馭而事之詘而不耻勞而不倦非有髙世之材孰能如此且向使侯生朱亥皆實庸人公子雖事之如是不足稱也然公子所以降身詘志者審知二子之賢耳以區區之魏惴懼之衆當秦乗勝十倍之兵一戰却之邯鄲全六國安信陵君之功也秦乗公子之去魏急攻大梁公子一悟毛薛之言飜然易慮歸救宗國復破秦軍閉諸函谷可謂能矣魏王信讒猜阻公子公子遂滅迹酣飲全身逺害以其夀終可謂智矣智能如此而又守之以仁行之以恭必若采善於亂世論賢於俠㳺則彼三人者蔑以加其上矣故校其臧否當以信陵為首平原次之孟嘗又次之春申為其下矣或曰無忌盜國兵符矯殺晉鄙以赴平原君之私交雖有功於魏非忠臣也何以賢於三子對曰趙魏脣齒之國以虎狼之秦攻危亡之趙趙亡則魏斃理勢然矣魏王不逹事宜徒畏强秦之空言坐擁盛兵以觀成敗計之大失無過於此故無忌矯奪其軍以救趙非獨赴趙之難亦為魏謀也奚其不忠哉漢髙祖過大梁輒祠信陵君為置守冢者彼三子則皆無旌異髙祖英主也盖有以知之矣管仲論孔子稱管仲之器小哉先儒以為管仲得君如此不勉之以王而僅止於霸此其所以為小也愚以為周天子存而管仲勉齊桓公以王是教之篡也此管仲所耻而不為孔子顧欲其為之邪夫大人者顧時不用則已用則必以禮樂正天下使綱紀文章粲然有萬世之安豈直一時之功名而巳邪管仲相桓公霸諸侯禹迹所及冠帯所加未能使之皆率職也而偃然自以天下為莫已若也朱紘而鏤簋反坫而三歸此其器豈不小哉揚子曰大器其猶規矩凖繩乎先自治而後治人斯言得之矣荀息論晉獻公使荀息傳奚齊荀息曰臣竭其股肱之力不濟則以死繼之及里克殺奚齊荀息死之君子曰詩所謂白圭之玷尚可磨也斯言之玷不可為也荀息有焉杜元凱以為荀息有此詩人重言之義以愚觀之元凱失左氏之意多矣彼生與君言死而背之者是小人穿窬之行君子所不譏也夫立嫡以長正也獻公溺於嬖寵廢長立少荀息為國正卿君所倚信不能明白禮義以格君心之非而遽以死許之是則荀息之言玷於獻公未沒之前而不可救於已沒之後也然則左氏之志所以貶荀息而非所以為襃也㢘頗論慶歷五年作世稱藺相如以區區之趙抗虎狼之秦秦雖彊暴不能陵趙者相如之功也謂其賢於㢘頗愚竊疑之何則秦之所以不能陵趙者以其國治兵彊也固非口舌之間所能抗也然則國何以治兵何以彊豈非㢘頗在其位邪趙得和氏璧秦王聞而欲之請易之以土田相如奉璧銜命而徃秦王欲彊取之相如抗節不撓視死如歸卒欺秦王而歸璧於趙以是為相如之功噫又何足稱哉夫和氏之璧懷握之玩得之不足以為重失之不足以為輕而相如以死爭之以詐取之有如秦王赫然増怒肆其彊暴逞其毒螫菹醢相如移兵攻趙是為趙王愛數寸之玉喪國士之賢貪無用之器貽宗廟之憂人臣愛君果如是哉澠水之㑹秦王請趙王鼓瑟而詔史書之相如進缶於秦王秦王不可則挺劒劫之必得當而後止是何異賈竪小人矜豪恃氣不能相下者惡足言功哉昔桀為無道湯幽囚於夏臺戎狄侵豳太王避之於岐文王三分天下有其二就拘於羑里夫以幽拘之辱棄國而逃與一鼓瑟之間孰難哉然而三王忍耻行之卒蹶夏商撫綏四海相如儻能相趙王示㣲弱以驕秦忍小耻以怒趙崇徳修政以湏秦之可亡從而仆之濟黔首於塗炭救赤子於虎狼其功烈豈不煒􅂱光逺哉而於罇爼之間壇坫之上爭言暴氣取當而止英偉之士不亦可羞哉趙王不能逺觀嘉其一命之不辱賞其要劫之小䇿一旦位諸功實之上㢘頗日夜憤憤欲礪刃刺之而相如能不與之校此則賢矣然亦不可用一善掩大功世稱藺優於㢘非通論也賈生論慶歷三年作世皆以賈生聰明辯愽曉練治體若遭明主當治世誠得盡用其道三代可復帝皇可㡬不幸黜於絳灌踈廢早終可為痛惜愚以為賈生學不純正雖有儁才任之為治必不效矣何以知之觀其書而知之賈生數上䟽陳得失云可為痛哭者一流涕者二太息者六然所謂痛哭者謂侯太彊也以為指大於股脛大於要乆而不制必為國害夫為天下者患政刑之不立不患諸侯之太彊賈生言不見用然終文帝世諸侯帖服孝景初立晁錯不勝其憤而削之反者紛然響應起不踰時敗亡不救惡能為漢之大害哉所謂流涕者匈奴不賔也匈奴荒外之國與禽獸無殊天下治而不服不足損聖王之徳天下弊而得之不足為聖王之功而賈生孜孜愛其蕞爾之金絮忘其征討之大費忿其區區之禮節忽其勤民之鉅害惡在其為知治體也夫治天下之具孰先於禮義安天下之本孰先於嗣君禮義不張雖復四夷賔服彊場不聳當如内憂何儲嗣失教雖復諸侯㣲弱四方無虞其誰能守之然賈生以此二者列之於後以為餘事捨國家之紀綱遺天下之大本顧切切然以列國外夷為慮皆涕泣之可謂悖本末之統謬緩急之序謂之知治體何哉又曰仁義者人主之芒刃也法制者人主之斤斧也不能以道輔人主鎮撫諸侯緩之以徳齊之以禮而欲踈骨肉斷慈恵視仁義為虚器操刑法為利柄翦周孔之夷塗樹申商之險術由此觀之所學豈得為純正耶世人不察其所由之術苟見其材之茂學之博其言暐曄可觀而不得施於世因從而歎之不知夫駮濫刻深非吾黨也夫唯材髙而道不正者君子惡之龔君賔王莽慕龔君賔之名訹以尊爵厚祿劫以滛威重勢而必􅆀之君賔不勝逼迫絶食而死班固以薫膏之語譏焉未聞有為辨之者也可不大哀昔者紂為不道毒痡四海武王不忍天下困窮而征之斯則有道天子誅一亂政之匹夫爾於何不可而伯夷叔齊深非之義不食周粟而餓死狷隘如此仲尼猶稱之曰仁以為不殞其節而已况於王莽慿漢累世之恩因其繼嗣衰絶飾詐偽而盗之又欲誣洿清士以其臭腐之爵祿甘言諛禮期於必致不可以智免不可以義攘則志行之士舎死何以全其道哉或者謂其不能黜芳棄明保其天年然則虎豹之鞹何以異於犬羊之鞹庸人之行孰不如此又責其不詭辭曲對若薛方然然則將未免於諂豈曰能賢故君賔遭遇無道及此窮矣失節之徒排毁忠正以遂已非不察者又從而和之太史公稱伯夷叔齊不有孔子則西山之餓夫誰識知之信矣哉邴吉論邴吉為丞相出逄羣盗格鬬死傷横道過之不問見牛喘而問之以為詰禁盗賊守令之事隂陽不調此乃宰相職耳談者美之愚竊以為不然夫宰相所以治隂陽者豈拱手端署無所施設而隂陽自調盖亦佐人主治庶政安四海使和氣洋洋薄於宇宙旁暢周逹浸潤渗漉明則百姓洽幽則鬼神諧然後寒暑時至萬物阜安雖古昔聖人之治天下至於隂陽和寒暑時而至治極矣豈庸人所能致哉當邴吉為政之時政治之不得刑罰之失中不肖之未去忠賢之未進可勝紀哉釋此不慮而慮於牛喘以求隂陽不亦踈乎且京邑之内盗賊縱横政之不行孰甚於此詩云商邑翼翼四方之極近不能正如逺人何若曰守令之職守令不賢當責何人非執政者之過而又誰歟昔士㑹為政晉國之盗逃奔于秦子産為政桃李垂於街者英援若盗賊不禁而曰長安令之職風俗不和而曰三老之職刑罰不當而曰廷尉之職衣食不足而曰司農之職推而演之天下之事各有其官則宰相居於其間悉無所與而曰主調隂陽隂陽固可坐而調耶愚以為邴吉自知居其位而無益於世飾智譎問以揜其迹抑亦自欺而已矣致知在格物論元豐六年作人之情莫不好善而惡惡慕是而羞非然善且是者盖寡惡且非者實多何哉皆物誘之也物迫之也桀紂亦知禹湯之為聖也而所為與之反者不能勝其欲心故也盗跖亦知顔閔之為賢也而所為與之反者不能勝其利心故也不軌之民非不知穿窬探囊之可羞也而冒行之驅於饑寒故也失節之臣亦非不知反君事讎之可愧也而忍處之逼於刑禍故也况於學者豈不知仁義之美㢘耻之尚哉斗升之秩錙銖之利誘於前則趍之如流水豈能安展禽之黜樂顔子之貧乎動色之怒毫末之害迫於後則畏之如烈火豈能守伯夷之餓徇比干之死乎如此則何暇仁義之思㢘耻之顧哉不惟不思與不顧也抑亦莫之知也譬如逐獸者不見泰山彈雀者不覺露之霑衣也所以然者物蔽之也故水誠清矣泥沙汩之則俛而不見其影燭誠明矣舉掌翳之則咫尺不辨人眉目况富貴之汩其智貧賤之翳其心哉惟好學君子為不然已之道誠善也是也雖茹之以藜藿如粱肉臨之以鼎鑊如茵席誠惡也非也雖位之以公相如塗泥賂之以萬金如糞壤如此則視天下之事善惡是非如數一二如辨黒白如日之出無所不照如風之入無所不通洞然四逹安有不知者哉所以然者物莫之蔽故也於是依仁以為宅遵義以為路誠意以行之正心以處之修身以帥之則天下國家何為而不治哉大學曰致知在格物格猶扞也禦也能扞禦外物然後能知至道矣鄭氏以格為来或者猶未盡古人之意乎塟論元豐七年作塟者藏也孝子不忍其親之暴露故斂而藏之賫送不必厚厚者有損無益古人論之詳矣今人塟不厚於古而拘於隂陽禁忌則甚焉古者雖卜宅卜日盖先謀人事之便然後質諸蓍龜庶無後艱耳無常地與常日也今之塟書乃相山川岡畎之形勢考嵗月日時之支干以為子孫貴賤貧富夀夭賢愚皆繫焉非此地非此時不可塟也舉世惑而信之於是喪親者徃徃乆而不塟問之曰嵗月未利也又曰未有吉地也又曰遊宦逺方未得歸也又曰貧未能辦塟具也至有終身累世而不塟遂弃失尸柩不知其處者嗚呼可不令人深歎愍哉人所貴於身後有子孫者為能藏其形骸也其所為乃如是曷若無子孫死於道路猶有仁者見而殣之邪先王制禮塟期逺不過七月今世著令自王公以下皆三月而塟又禮未塟不變服食粥居倚廬哀親之未有所歸也既塟然後漸有變除今之人背禮違法未塟而除喪從宦四方食稻衣錦飲酒作樂其心安乎人之貴賤貧富夀夭繫於天賢愚繫於人固無闗預於塟就使皆如塟師之言為人子者方當哀窮之際何忍不顧其親之暴露乃欲自營福利邪昔者吾諸祖之塟也家甚貧不能具棺槨自太尉公而下始有棺槨然金銀珠玉之物未嘗以錙銖入於壙中將塟太尉公族人皆曰塟者家之大事柰何不詢隂陽此必不可吾兄伯康無如之何乃曰詢於隂陽則可矣安得良塟師而詢之族人曰近村有張生者良師也數縣皆用之兄乃召張生許以錢貳萬張生野夫也世為塟師為野人塟所得不過千錢聞之大喜兄曰汝能用吾言吾畀爾塟不用吾言將求佗師張師曰惟命是聴於是兄自以已意處嵗月日時及壙之淺深廣狹道路所從出皆取便於事者使張生以塟書縁飾之曰大吉以示族人族人皆恱無違異者今吾兄年七十九以列卿致仕吾年六十六忝備侍從宗族之從仕者二十有三人視佗人之謹用塟書未必勝吾家也前年吾妻死棺成而斂装辦而行壙成而塟未嘗以一言詢隂陽家迄今無佗故吾常疾隂陽家立邪說以惑衆為世患於喪家尤甚頃為諫官嘗奏乞禁天下塟書當時執政莫以為意今著茲論庶俾後之子孫塟必以時欲知塟具之不必厚視吾祖欲知塟書之不足信視吾家傳家集巻六十五欽定四庫全書傳家集巻六十六宋司馬光撰議不以卑臨尊議慶厯五年作大傳以為武王克商祀於牧室追王太王王季文王不以卑臨尊也夫父子之間譬猶天地之體殊君臣之位絶尊卑之分天性自然是以子雖為天子無害父之尊父雖為士子不敢先之人道之大倫古今之通義也武王纂紹前迹登隆基緒追尊先世告成王業盖以推功歸美崇戴前人非謂身臨四海之尊不可以諸侯為祖父也竊謂記禮者深於聖人之㫖失之何則太王王季文王追襃旣盛則太王之前公劉不窋之倫尚為以卑臨尊未得謂之順也然則追稱繼號終已無窮豈可行哉謹案武成曰太王肇基王迹王季其勤王家我文考文王克成厥勲又周頌曰天作髙山太王荒之大雅曰維此王季受祿無喪奄有四方至言文王受命非一不可悉著然則周之王迹肇於太王茂於王季成於文王終於武王武王既有四海追思王迹之所由興積功開業之艱難是故推三世而王之以明非已功藉祖宗之餘烈也聖人之志昭晰若此而謂之不欲以卑臨尊其為失也大矣且夫以太王之仁愛勤勞王季之孝友光明文王之布徳行化討叛懐柔三分天下之諸侯而有其二謙畏天命不輯大勲以授聖子武王因累世之基用既王之周推已亡之商而取天位臨四海朝諸侯雖以中庸之君處之猶不敢盖其祖宗之勲謂天祿由已而成徒以私意追王祖宗不使諸侯臨天子之尊而已况於武王大聖豈得爾哉泰誓曰予克受非予武惟朕文考無罪受克予非朕文考有罪惟予小子無良夫武王歸美前人之意如此追王之理豈不明與祔廟議嘉祐八年六月一日上禮天子七廟三昭三穆與太祖之廟而七太祖之廟萬世不毁其餘昭穆盡則毁示有終也自漢已來天子或起於布衣以受命之初太祖尚在三昭三穆之次故或祀四世或祀六世其太祖以上之主雖屬尊於太祖親盡則遷故漢元帝之世太上廟主瘞於寝園魏明帝之世處士廟主遷於園邑晉武帝祔廟遷征西府君惠帝祔廟又遷豫章府君自是以下大抵過六世則遷其神主盖以太祖未正東嚮之位故止祀三昭三穆若太祖已正東嚮之位則并三昭三穆為七世矣唐髙祖初立祀四世太宗増祀六世及太宗祔廟則遷洪農府君神主於夾室髙宗祔廟又遷宣皇神主於夾室皆祀六世此前世之成法也惟明皇立九室祀八世事不經見難可依據今若以太祖太宗為一世則大行皇帝祔廟之日禧祖親盡當遷於西夾室祀三昭三穆於先王典禮及近世之制無不符合太廟更不須添展一室配天議伏准中書劄子翰林學士王珪及知制誥錢公輔等奏季秋大饗明堂以仁宗皇帝配神作主事奉聖㫖令臺諫及經筵臣寮與兩制禮院同共再詳定聞奏者朝廷以祖宗事重不敢自專愽訪羣臣使各陳其意臣等愚懵不達古今但據所聞正禮以對至於取捨繫自聖明竊以孝子之心誰不欲尊其父者聖人制禮以為之極不敢踰也故祖已訓髙宗曰祀無豐于昵孔子與孟懿子論孝亦曰祭之以禮然則事親者不以數祭為孝貴於得禮而已矣祭法有虞氏禘黄帝而郊嚳祖顓頊而宗堯夏后氏禘黄帝而郊鯀祖顓頊而宗禹商人禘嚳而郊冥祖契而宗湯周人禘嚳而郊稷祖文王而宗武王先儒謂禘郊祖宗皆祭祀以配食也禘謂祭昊天於圓丘也祭上帝於南郊曰郊祭五帝五神於明堂曰祖宗故詩曰思文后稷克配彼天又我將祀文王於明堂此其證也下此皆不見於經矣前漢以髙祖配天後漢以光武配明堂以是觀之古之帝王自非建邦啓土及造有區夏者皆無配天之文故雖周之成康漢之文景明帝章帝其徳業非不美也然而子孫不敢推以配天者避祖宗也孝經曰嚴父莫大於配天則周公其人也孔子以周公有聖人之徳成太平之業制禮作樂而文王適其父也故引之以證聖人之徳莫大於孝答曽子之問而已非謂凡有天下者皆當尊其父以配天然後為孝也近世祀明堂者皆以其父配五帝此乃誤識孝經之意而違先王之禮不可以為法也景祐二年仁宗詔禮官稽案典籍辨崇配之序定二祧之位乃以太祖為帝者之祖比周之后稷太宗真宗為帝者之宗比周之文武然則祀真宗於明堂以配五帝亦未失古禮今仁宗雖豐功美徳洽於四海而不在二祧之位議者乃欲捨真宗而以仁宗配食明堂恐於祭法不合又以人情言之是絀祖而進父也夏父弗忌躋僖公先兄而後弟孔子猶以為逆祀書於春秋况維祖而進父乎必若此有之不獨乖違典禮恐亦非仁宗之意也議者又欲以太祖及三宗迭配郊丘及明堂臣等亦以為不可何則國家受天永命傳祚萬世若繼體守文之君皆得配天則子孫將有無窮之數與祖宗無别也凡為國家者制禮立法必思萬世之規不可專徇目前而已臣等竊謂宜遵舊禮以真宗配五帝於明堂行之為便宗室襲封議時在學士院朝廷以為非是兩制議者各贖銅三十斤禮部各追一官臣等竊原聖人制禮之意必使嫡長世世承襲者所以重正統而絶爭端也古者諸侯生立世子死則襲爵故令文稱諸王公侯伯子男皆子孫承嫡者傳襲若無嫡子及有罪疾立嫡孫無嫡孫以次立嫡子同母弟無母弟立庶孫曽孫以下准此皆為始薨之時應襲爵之人也其無後者則國除自唐末以來三公以下不復承襲國朝故事常封本宫最長者一人為國公陛下以為非古故於去年十一月十一日降敕節文稱宣祖太祖太宗之子皆擇其後一人為宗令世世封公補環衞之官以奉祭祀不以服屬盡故殺其恩禮又稱其非􅃝免親更不賜名授官太常禮院手奏檢詳國朝近制諸王之後皆用本宫最長一人封公繼襲今來新制既言祖宗之子皆擇其後一人為宗即與自來事體不同本院叅詳合依禮令傳嫡承襲閏十一月五日奉聖㫖祖宗之子并濮國公並令傳嫡襲封所有見今諸宫院已封公者令依舊將來即更不襲封臣等詳觀兩次詔㫖丁寧皆欲以復古禮而垂正統也今據禮院所定諸王後合襲封人内除越王曾孫世程魯王孫宗肅韓王孫宗繢吴王孫宗絳並依禮令當傳襲外其昭成太子陳王蔡王皆無後國當除宗保仲郃宗達以旁親繼襲乃是朝廷特恩為之立後紹封其國於禮典亦無乖違所有秦王之後陳薦等欲立其庶曽孫克繼韓忠彦等欲立其庶長孫承亮楚王之後陳薦等欲立其庶曽孫世逸韓忠彦等欲立其庶長孫從式魏王之後衆禮官皆欲立其嫡孫同母弟宗惠臣等看詳三王見今自有正統而承亮從式宗惠皆係旁支若此三人襲三王之封則子子孫孫常居環衛世襲爵祿與國無窮其正統子孫􅃝免以外更不賜名授官數世之後降在皁𨽻如此三人何幸而封正統何罪而絶不惟與禮令之意乖違亦非聖詔所謂為宗傳嫡者也所以然者盖緣禮令據初薨之時定為嗣之人今日於數世之後議當為後者事體有殊而專執令文所以參差不合而異論紛紜也臣等案忠彦等以為令文之制與古稍異若無嫡孫而有嫡曽孫則捨曽孫而立嫡子母弟若無母弟又立庶子以此知亦許推及旁支常以親近者為先也今令文稱無嫡孫同母弟則立庶孫以禮典與五服敕言之諸子之子除嫡長外皆為庶孫既立庶孫則當於諸旁庶孫内擇其長者一人立之盖王視庶孫恩親等也庶孫比曽孫行尊而屬近也臣等案令文皆約古禮為之安有與古不同之理借使不同朝廷方憲章稽古亦當捨令而從禮豈可棄禮而就令也况令文所謂子孫承嫡者傳襲言嫡子嫡孫相繼不絶雖經百世皆應傳襲也若不幸而絶則有立嫡子同母弟以下之事非謂有嫡曽孫捨之不立而立嫡子之母弟也晉庾純云古者所以重宗諸侯世爵士大夫世祿防其爭競故明其宗也吴商云按禮貴嫡重正所以尊祖禰繼世之正統也夫受重者不得以輕服服之是以孫及曽元其為後者皆服三年受重故也王敞云君為祖三年既為君而有父祖之喪者謂父祖並有廢疾不得受國而已受位於曽祖者也范宣云嫡孫亡無後則次子之後乃得傳重以此觀之明嫡統不絶則旁支無繼襲之道然則令文所謂子孫承嫡者傳襲自嫡曽孫以下皆包之矣所以更言若無嫡子及有罪疾立嫡孫者嫌人無嫡子即立嫡子之母弟或嫡子有罪疾并其嫡孫廢之故也又言曽孫以下凖此者謂庶孫以上皆無即立嫡曽孫之母弟無母弟即立庶弟之類是也若令文之意但以行尊屬近者為嗣則無嫡子便應立嫡子母弟及庶子何為更立庶孫也必若忠彦等所云則國家故事取本宫最長者一人封公已是行尊屬近之人便當遵行何必更有改作也彼令文所指者傳襲之人五服敕所載者䘮服之制事理各殊豈可引䘮服之庶孫證傳襲之庶孫也且造令之時王公以下薨則傳襲故必有立曽元者今諸王之薨已歴數世乃更追議當為後之人則不應捨正統而更取旁支也今欲使合於古而適於今則莫若自國初以來於其人薨沒之時定當為嗣者以至於今日則於禮令不失而亦不離正統矣案秦王以雍熈元年薨於時嫡子徳恭當立徳恭以景徳三年卒嫡長子承慶當立承慶以寳元二年卒無嫡子有庶子六人長曰克晤先卒無子次曰克繼當立楚王以某年薨嫡長子惟叙當立惟叙以大中祥符五年卒嫡子從煦當立從煦以慶厯五年卒無嫡子有庶子世逸一人當立魏王以某年薨無嫡子有庶子三人長曰允升以某年卒嫡子宗禮當立宗禮以治平二年卒嫡長子仲翹先卒無子次母弟仲髦亦先卒次母弟仲蒼當立以此考之其當為後者豈不明白矣所有承選雖是徳文之嫡子其父元非嫡長自不應承襲盖因今來承亮以庶孫得承襲故使承選有辭先王制禮皆本諸天地酌之人情譬如四支百體不可移也移之則綱紀紛亂爭端並興於承選可以見其驗矣臣等謹依古禮及令文并去年十一月十一日敕命閏十一月五日聖㫖指揮檢詳屬籍重行定奪到秦王之後合以克繼襲封楚王之後合以世逸襲封魏王之後合以仲蒼襲封其餘并如衆禮官議所定李僕射諡文恭議穆僕射禀秀美之氣涵純壹之徳剛柔得中華實兼茂越自衡泌奮飛天朝回翔禁垣遂賛大政咨命不永奄忽遷得自時迄今垂七十載令問休暢泱然未息紳弁之士流為美談謹案諡法忠信接禮曰文不懈于位曰恭夫事親盡誠與人不欺行有標的言有規括忠信接禮之謂矣光輔神宗億安四海邁其懿徳倡率士民不懈于位之謂矣請謚曰文恭錢中令謚宣靖議若水令公仁惠足以布政明智足以建功清修足以服人寛裕足以容衆與物無競執議甚堅泊乎如淵撓不可濁介乎如石重不可移信尚徳之君子全節之正人也而又講學不倦好謀而成文以美身忠以賛國謹案謚法善問周達曰宣和徳考衆曰靖令公論譔帝典發揮聖政使祖宗之烈燭耀無窮是不亦宣乎闗領樞機謀謨帷幄六師輯睦夷夏又安是不亦靖乎請謚曰宣靖趙少傅謚僖質議禎少傅體和居厚履恭涵壹言必有物動不進名矯迹衡茅濯羽雲漢入賛樞極出殿藩維謹案謚法小心恭慎曰僖言行相應曰質少傅内則造辟盡忠外則騰章建畫親昵有問應以他言可不謂僖乎歴事三朝始終一節不賁飾以譁衆不激訐以髙人可不謂質乎請謚曰僖質馮太尉謚勤威議守信昔者晉人不恭敢距大邦負固阻兵趦趄不庭太宗征之霆駭風趨狐狼之墟化為樂都混壹之勲太尉與焉獫狁孔熾整居幽冀縱騎鳴弦至于澶淵真宗一麾電巻雲披剪其酋豪馬潰麋逃底寧之功太尉在焉天下既平蜚游不驚符瑞充盈登休薦成和鸞四廵萬乘星陳東暨云亭西渉河汾警蹕之清太尉扈焉白馬之河漏為横波濟澤之阿閭殚可歌隕林仆竹薪石相屬淵吐其陸莓莓衍沃隄防之勞太尉重焉謹案謚法能修其官曰勤猛以彊果曰威迹其夙夜在公臨敵剛决榮祿昭融令問始終攷於二法可謂恊矣請謚曰勤威辯性辯治平三年正月二十日作孟子以為人性善其不善者外物誘之也荀子以為人性惡其善者聖人教之也是皆得其一偏而遺其大體也夫性者人之所受於天以生者也善與惡必兼有之是故雖聖人不能無惡雖愚人不能無善其所受多少之間則殊矣善至多而惡至少則為聖人惡至多而善至少則為愚人善惡相半則為中人聖人之惡不能勝其善愚人之善不能勝其惡不勝則從而亡矣故曰惟上智與下愚不移雖然不學則善日消而惡日滋學焉則惡日消而善日滋故曰惟聖罔念作狂惟狂克念作聖必曰聖人無惡則安用學矣必曰愚人無善則安用教矣譬之於田稻粱藜莠相與滋生善治田者耘其藜莠而養其稻粱不善治田者反之善治性者長其善而去其惡不善治性者反之孟子以為仁義禮智皆出乎性者也是豈可謂之不然乎然不知暴慢貪惑亦出乎性也是知稻粱之生於田而不知藜莠之亦生於田也荀子以為爭奪殘賊之心人之所生而有也不以師法禮義正之則悖亂而不治是豈可謂之不然乎然殊不知慈愛羞愧之心亦生而有也是知藜莠之生於田而不知稻粱之亦生於田也故揚子以為人之性善惡混混者善惡雜處於身中之謂也顧人擇而修之何如耳修其善則為善人修其惡則為惡人斯理也豈不曉然明白哉如孟子之言所謂長善者也荀子之言所謂去惡者也揚子則兼之矣韓文公解揚子之言以為始也混而今也善惡亦非知揚子者也情辯應幾有子生十年而喪之應幾悲哀甚既而自諭曰是何益哉昔者吾嘗聞於有道者矣曰死而悲哀者情也死生有時短長有命知其物理之常不足悲者道也故其始也悲不自制情勝道也及其久也悲日益衰而理可以奪道勝情也予常以為知言光辨之曰是非有道者之言也夫情與道一體也何甞相離哉始死而悲者道當然也久而寖衰者亦道當然也故始死而不悲是豺狼也悲而傷生是忘親也豺狼不可忘親亦不可是以聖人制服日逺日輕有時而除之若此者非他皆順人情而為之也夫情者水也道者防也情者馬也道者御也水不防則汎溢蕩潏無所不敗也馬不御則騰突奔放無所不之也防之御之然後洋洋焉注夫海駸駸焉就夫道由是觀之情與道何嘗交勝哉銘鐵界方銘景祐四年作質重精剛端平直方進退無私法度攸資燥濕不渝寒暑不殊立身踐道是則是傚劒銘并序或曰古者君子居常佩劒以備不虞今也無之倉卒何恃焉應之曰君子恃道不恃劒道不在焉雖劒不去體不能救其死故苟得其道則劒存可也亡可也作劒銘云昆吾之精太阿之靈深虞過防却除不祥倐忽縱横萬夫莫當用得其道利器可保道之不明器無足憑怙力弃常匹夫以亡敗徳阻兵國家以傾逆不敵順暴不犯仁上以守國下以全身長鋏蕭蕭七星炤腰不離於道神鋒可銷槃水銘嘉祐七年二月一日作槃水之盈止之則平平而後清清而後明勿使小欹小欹必傾傾不可収用毁其成嗚呼奉之可不兢兢四言銘熈寜三年五月二十一日作聰明壯勇之謂才忠信孝友之謂行正直中和之謂徳深逺髙大之謂道箴勇箴景祐四年作何為而正致誠則正何為而勇蹈正則勇孟賁之材心動則回臨義不疑嗚呼勇哉逸箴百仞之木生本秋毫徳隳於惰名立於勞宴安之娱窮乎一晝徳著名成億年不朽可貪非道可愛非時沒世無稱君子耻之昔在周公作為無逸大聖猶然况非其匹友箴余何遊乎余將遊聖之門仁之里非聖不師非仁不友可乎未可不若逰衆人之場聞善而遷觀過而改頌顔樂亭頌并序周翰孔子四十七世孫名宗翰邦直李清臣子瞻蘇軾也孔子舊宅東北可百歩有井魯人以為昔顔氏之居也周翰思其人買其地搆亭其上命曰顔樂邦直為之銘其言顔子之志盡矣無以加矣子瞻論韓子以在隠約而平寛為哲人之細事以為君子之於人必於其小焉觀之光謂韓子以三書扺宰相求官與于襄陽書謂先達後進之士互為前後以相推授如市賈然以求朝夕芻米僕賃之資又好恱人以銘誌而受其金觀其文知其志其汲汲於富貴戚戚於貧賤如此彼又烏知顔子之所為哉夫嵗寒然後知松栢之後彫士貧賤然後見其志此固哲人之所難故孔子稱之而韓子以為細事韓子能之乎光實何人敢評先賢之得失聊因子瞻之言申而盡之頌曰貧而無怨難顔子在陋巷飲一瓢食一簞能固其守不戚而安此徳之所以完賛河間獻王賛慶厯五年作周室衰道徳壊五帝三王之文飄淪散失棄置不省重以暴秦害聖典疾格言燔詩書屠術士稱禮樂者謂之狂惑述仁義者謂之妖妄必薙滅先聖之道響絶迹盡然後慊其志雖有好古君子心誦腹藏壁扃巖鐍濟秦之險以通於漢者萬無一二漢初挾書之律尚存久雖除之亦未尊録謂之餘事而已則我先王之道燄燄其不熄者無幾矣河間獻王生為帝子㓜為人君是時列國諸侯苟不以宫室相髙狗馬相尚則裒姦聚猾僣逆妄圖唯獻王厲節治身愛古愽雅專以聖人法度遺落為憂聚殘補缺校實取正得周官左氏春秋毛氏詩而立之周禮者周公之大典毛氏言詩最宻左氏與春秋為表裏三者不出六藝不明噫㣲獻王則六藝其遂曀乎故其功烈至今頼之且夫觀其人之所好足以知其心王侯貴人不好奢靡而喜書者固鮮矣不喜浮辯之書而樂正道知之明而信之篤守之純而行之勤者百無一二焉武帝雖好儒好其名而不知其實慕其華而廢其質是以好儒愈於文景而徳業後之景帝之子十有四人栗太子廢而獻王最長嚮若遵大義屬重器用其徳施其志必無神僊祠祀之煩宫室觀逰之費窮兵黷武之勞賦役轉輸之敝宜其仁豐義洽風移俗變煥然帝王之治復還其必賢於文景逺矣嗟乎天實不欲禮樂復興邪抑四海自不幸而已矣傳家集巻六十六欽定四庫全書傳家集巻六十七宋司馬光撰評子噲堯舜之聖非以其能輕天下也廼以其能重天下也夫唯重天下故必得聖人然後授之禹之傳於子非私之也苟天下無聖人以授之則非子莫之傳矣夫父之傳子非至禹而後有之也盖自生民以來有國家者無不然矣燕噲徒知慕堯舜之名不知察堯舜之實訹於姦言以䧟於死亡為天下笑豈不悲哉孟子曰以天下與人易為天下得人難豈非以燕噲而知之邪應侯罷武安君兵慶厯五年作甚矣邪臣之害國也以得為喪以成為敗保身固寵不顧國謀損公而益私仆人而立已國家喪敗不與其憂世之患此亦已久矣甘羅慶厯五年作甘羅以稚子名顯於世非有他竒略正以勢力恐張唐耳雖云慧敏然君子治世無所取焉范睢慶厯五年作穰侯相秦秦益彊宰制諸侯如嚴主之役僕夫左右前後無不如志此穣侯之功也范睢非能為秦忠謀亦非有患於穣侯也欲行其説而穰侯適妨其路故控其喉拊其背而奪之位秦王視聽之不明遂至於遷逐母弟况穰侯何有哉穰侯雖擅權未至如睢之所言孔子惡夫佞者豈以此夫秦阬趙軍慶厯五年作夫兵之設非以害人所以養人也殘暴如此其誰與之秦七世役諸侯卒兼天下然其失䇿之大者有三焉欺楚懐王而虜之不信莫大焉阬趙降卒四十萬不仁莫大焉欺與國誅已降使諸侯疑而百姓怨不智莫大焉秦所以失天下之故多矣在此三者於不信之不信不仁之不仁不智之不智是以始皇墳草未生而四海横潰宗廟為墟究其禍本兆於此矣項羽誅韓生慶厯五年作世皆以項羽不能用韓生之言棄關中之險故失天下竊謂不然夫秦據函谷東嚮以制天下然孝恵昭襄以之興而二世子嬰以之亡顧所以用之之道何如耳地形不足議也項羽放殺其君不義之名明於日月宰制天下王諸侯廢公義而任私意逐其君以置其臣其受封者爭奪不服踈斥忠良猜忌有功使臣下皆無親附之意推此道以行之雖重金襲湯不能以一日守也况三秦之險哉貫髙慶厯五年作髙祖以驕失臣貫髙以很亡君君臣之際不亦兩傷邪髙不能輔君以義不忍小恥輕慮淺謀以陷弑君之惡卒亡其國禍自髙始雖殺身破家以明張敖而令趙國社稷蕪沒宗廟邱墟所存者小所亡者大所得者少所失者多槩以大義亦烏足言哉漢髙祖斬丁公慶厯五年作漢髙祖可謂能逺謀矣臣無貳心古之命也縱君之敵以樹私恩姦莫大焉姦而為恵勿報可也若將報之其望必大為臣不忠而享大報雖無背施何以使人天下既定姦不干正盡節者賞貳心者誅君無失刑臣無貳心然後人無覬覦上下安矣宜乎子孫相承廟祀四百盖亦謀之逺矣周書曰逺乃猷此之謂也烹酈生班固稱蒯通一説而䘮三儁為其亡田横殺酈生驕韓信也以愚觀之漢王既遣酈生下齊而不止韓信之進兵是則漢王殺之非蒯通殺之也惜夫一失其信羣臣孰敢為之使諸侯孰敢為之與雖得齊而有之所亡豈不多哉戾太子敗慶厯五年作鉤弋夫人之子十四月而生孝武以為神靈命其門曰堯母當是時太子猶在東宫則孝武屬意固已異矣是以姦臣逆窺上意以傾覆冡嗣卒成巫蠱之禍天下咸被其殃然則人君用意小違文義禍亂及此可不慎哉立鉤弋子為太子慶厯五年作孝武以孝昭之生神異於人而復有早成之資違長㓜之次而立之鑒於諸吕先誅其母以絶禍源其於重天下謀子孫深逺矣然而舉襁褓之子置之萬民之上非有孝昭之明霍光之忠鮮不危哉誅趙廣漢慶厯五年作廣漢之為京兆漢興以來無能及者周禮議賢議能然則雖有罪固當宥之况廣漢之罪不及死邪斯足以為孝宣魏相之累矣張湯有後慶厯五年作或稱張湯矯偽刻薄而後嗣顯榮七葉不絶意者積善餘慶積惡餘殃近虚語耶應之曰不然所謂積者繼世相因之謂也故傳稱八元八凱世濟其美又稱三族世濟其㓙此非積善積惡之謂耶欒書有恵於晉晉人思之黶雖剛愎猶得保其宗廟至盈無徳鄉族遂亡然則黶之所以存書之餘慶也盈之所以亡黶之餘殃也祖父有徳子孫為不善未免禍敗慶何有焉祖父不善而子孫有徳福祿將集殃何有焉祖父為不善而子孫又無徳以盖前人之愆則餘殃被之是以堯舜雖至徳朱均不能免其災瞽鯀雖大惡舜禹無所虧其聖若張湯者雖險詖人也有子安世保輔漢室寔有大功子孫嗣之率皆忠恪信厚恭儉周宻邦有道不廢邦無道免於刑戮以是光顯於後彌歴永世固其宜矣又何異焉賈捐之慶厯五年作君子以正消邪捐之以邪攻邪宜乎其不濟矣京房對漢元帝慶厯五年作甚矣闇君之不可與言也天實剥䘮漢室而昏塞孝元之心使如木石不可得入至於此乎哀哉京房之言如此其深切著明也而曽不能諭何哉詩云匪面命之言提其耳匪手攜之言示之事又云誨爾諄諄聴我藐藐噫後之人可不以孝元為監乎髙順慶厯五年作或問陳登髙順皆有過人之才俱事吕布而登輸心魏祖親為反間順盡力於布與之偕死意者順賢登歟應之曰不然古者列國並立同事王室故先王制禮諸侯有王大夫有君君臣始終有死無貳漢氏平壹海内萬國一君天下之君唯帝室耳順於吕布雖備將佐無委質之分布者反覆亂人非能輔佐漢室而又彊暴無謀敗亡有證登知幾輕舉以存易亡徐豫克清百姓蘇息順託身失所迷逺不復以陷大戮易稱比之匪人豈謂順耶其才雖美未能及登以兹觀之優劣見焉魏孝武帝初立慶厯五年作甚矣髙歡之無道也其視君不如奕棋廢而置之在造次爾立君大事不詳如此取悔宜哉魏孝武帝西遷慶厯五年作周書曰天之所壊不可支也元氏失政久矣而孝武欲興之脫於髙歡得宇文黒獺其所以異者無幾耳嗚呼為人君者必制治於未亂保安於未危兢兢業業日慎一日不然怠惰荒滛使禍流子孫既亂且危然後慎之其可乎張廵嘉祐元年作天授之謂才人從而成之之謂義發而著之事業之謂功精敏辯博拳捷趫勇非才也驅市井數千之衆摧敵人百萬之師戰則不可勝守則不可㧞斯可謂之才矣死黨友存孤兒非義也明君臣之大分識天下之大義守死而不變斯可謂之義矣攻城㧞邑之衆斬首捕虜之多非功也控扼天下之咽喉蔽全天下之大半使其國家定於已傾存於既亡斯可謂之功矣嗚呼以廵之才如是義如是功如是而猶不免於流俗之毁况其曖曖者邪馮道為四代相慶厯五年作忠臣不二君賢女不二夫䇿名委質有死無貳天之制也彼馮道者存則何心以臨前代之民死則何面以見前代之君自古人臣不忠未有如此比者然而尊官重祿老以没齒何哉夫為國家者明禮義奬忠良褒義烈誅姦回以厲羣臣羣臣猶愛死而忘其君况相印將節以寵叛臣其不能永享天命宜矣然而庸愚之人往往猶稱其智盖五代披攘人主歲易羣臣失節比踵於朝因而譽之欲以自釋余恐後世以道所為為合於理君臣之道將大壊矣臣而不臣雖云其智安所用哉原原命子罕言命子貢稱夫子之文章可得而聞也夫子之言性與天道不可得而聞也是則天道精㣲非聖人莫能知今學者未能通人理之萬一而遽從事於天是猶未嘗操舟而欲渉海不陷溺者其幾矣昔眭孟知有王者興於㣲賤而不知孝宣乃欲求公孫氏嬗以天下翼奉知漢有中衰阨會之象而不知王莽乃云洪水為災西門君惠知劉秀當為天子而不知光武乃謀立國師劉秀秀亦更名以應之劉靈助知三月當入定州四月爾朱氏滅而不知滅爾朱者為齊神武入定州者乃其首也此五子者其於術可謂精矣皆無益於事而身為戮沒又况下此者哉夫天道窅㝠恍惚若有若亡雖有端兆示人而不可盡知也非天下之至神其孰能與於此是以聖人之教治人而不治天知人而不知天春秋記異而説不書唯恐民冒沒猖狂以趨於亂也說說𤣥予少之時聞𤣥之名而不獲見獨觀雄之自序稱𤣥盛矣及班固為雄傳則曰劉歆嘗觀𤣥謂雄曰空自苦今學者有祿利然尚不能明易又如𤣥何吾恐後人用覆醤瓿也雄笑而不應諸儒或譏以為雄非聖人而作經猶春秋吴楚之君僣號稱王盖誅絶之罪也固存此言則固之意雖愈於歆亦未謂𤣥之善如雄所云也余亦私怪雄不賛易而别為𤣥易之道其於天人之藴備矣而雄豈有以加之廼更為一書且不知其焉所用之故亦不謂雄宜為𤣥也及長學易苦其幽奥難知以為𤣥者賢人之書校於易其義必淺其文必易夫登喬山者必踐於坱埤適滄海者必㳂於江漢故願先從事於𤣥以漸而進於易庶幾乎其可跂而望也於是求之積年始得觀之初則溟涬漫漶畧不可入廼研精易慮屏人事而讀之數十過參以首尾稍得闚其梗槩然後喟然置書嘆曰嗚呼揚子雲真大儒者邪孔子既沒知聖人之道者非子雲而誰孟與荀殆不足擬况其餘乎觀𤣥之書明則極於人幽則盡於神大則包宇宙細則入毛髮合天地人之道以為一刮其根本示人所出胎育萬物而兼為之母若地履之而不可窮也若海挹之而不可竭也盖天下之道雖有善者蔑以易此矣考之於運元之初而𤣥已生察之於當今而𤣥非不行窮之於天地之季而𤣥不可亡叩之以萬物之情而不漏測之以鬼神之状而不違槩以六經之言而不悖籍使聖人復生視𤣥必釋然而笑以為得已之心矣乃知𤣥者以賛易也非别為書以與易角逐也何歆固知之之淺而過之之深也或曰易之法與𤣥異雄不遵易而自為之制安在其賛易乎且如與易同道則既有易矣何以𤣥為曰夫畋者所以為禽也網而得之與弋而得之何異書者所以為道也易網也𤣥弋也何害不既設網而使弋者為之助乎子之求道亦膠矣且揚子作法言所以準論語作𤣥所以凖易子不廢法言而欲廢𤣥不亦惑乎夫法言與論語之道庸有異乎𤣥之於易亦然大厦將傾一木扶之不若衆木扶之之為固也大道將晦一書辨之不若衆書辨之之為明也學者能專精於易誠足矣然易天也𤣥者所以為之階也子將升天而廢其階乎先儒為𤣥解者誠已善矣然子雲為文既多訓詁指趣幽邃而𤣥又其難知者也故今疑先儒之解未能盡契子雲之志世必有能通之者比老終且學焉述述國語慶厯五年作先儒多怪左丘明既傳春秋又作國語為之説者多矣皆未甚通也先君以為丘明將傳春秋乃先采集列國之史國别分之取其菁英者為春秋傳而先所采集之藁因為時人所傳命曰國語非丘明之本志也故其辭語繁重序事過詳不若春秋傳之簡直精明渾厚遒峻也又多駁雜不粹之文誠由列國之史學有厚薄才有淺深不能醇一故也不然丘明作此複重之書何為耶然所載皆國家大節興亡之本栁宗元邪佞之人智識淺短豈足以窺望古君子藩籬而妄著一書以非之竊懼後之學者惑於宗元之言而簡弃此書故述其益以張之四言銘系述元豐二年五月十七日作迂叟為四言銘見者忽之曰老生常談耳故有系述孔子稱才難夫才者所受於天非人所能強也故推十合一曰士千人曰俊萬人曰傑出於其類㧞於其萃此其所以難也聞言易悟曰聰睹事易辨曰明敢為不懼曰勇強力不屈曰健有是四者才則美矣然未足恃也自古恃才而不懃徳行以殺身䘮家亡國者踵相及也彼皆天之所與非已之所為又奚足以驕人哉君子則不然有其才必思美其行以成之盡心於人曰忠不欺於已曰信善父母曰孝善兄弟曰友夫孝友百行之先而後於忠信何也苟孝友而不忠信則非孝友矣能是四者行則美矣未及於徳也正直為正正曲為直適宜為中交泰為和正直非中和不行中和非正直不立若寒暑之相濟隂陽之相成也夫察目睫者不能見百歩瞻百歩者亦不能見目睫均是徳也執其近小而遺其逺大守其卑淺而忘其髙深是猶不免為小人焉故君子好學不厭自強不息推之使逺廓之使大聳之使髙研之使深發于心形于身裕于家施于國格于上下被于四表雖堯舜周孔莫不本於是矣嗚呼捨是而云道者皆不足學也贈書心經後贈紹鑒元豐五年十二月十三日作余嘗聞學佛者言佛書入中國經律論三藏合五千四十八巻般若經獨居六百巻學者撮其要為心經一巻為之注者鄭預最簡而明余讀鄭注乃知佛書之要盡於空一字而已或問揚子人有齊死生同貧富等貴賤何如揚子曰作此者其有懼乎此經云照見五藴皆空度一切苦厄似與揚子同指然則釋老之道皆宜為憂患之用乎世稱韓文公不喜佛常排之余觀其與孟尚書書論大顛云能以理自勝不為事物侵亂乃知文公於書無所不觀盖嘗徧觀佛書取其精粹而排其糟粕耳不然何以知不為事物侵亂為學佛者所先邪今之學佛者自言得佛心作佛事然皆不免侵亂於事物則其人果何如哉西京僧官凡六員曰録曰首座曰副首座左右街各一有缺則選僧之有行業者補之又缺則以次上遷逮左録而止崇徳僧紹鑒既為左首座矣會足有㣲疾乃嘆曰吾弃家為僧固求自安逸今已病而猶自勤於僧職豈吾本心哉即投牒自請解去時左録新物故其徒皆止之以為宜待次補鑒不聴既解去明日右録亦物故補其處者乃位於鑒下之人也其徒皆為之恨鑒處之恬然噫鑒儻不知事物之空能如是乎鄭經刻石於天寳末今頗刓缺余賢鑒能不以所重易所輕且欲勸之俾全其所得乃命吏好冩一通以贈之諭諭若訥熈寧五年熈寧六年冬光在洛陽有衢州僧若訥袖書來見曰仁宗皇帝時得召對成化殿命講所學經且作頌三篇上甚喜後數日中使賜若訥紫衣辭曰臣所為不逺千里求見明主者欲獻其所學庶幾廣之於天下今陛下乃賜臣紫衣非臣志也臣不敢奉詔使者三返終辭不受上乃飛白安净二字以賜若訥若訥然後舉首加額受而藏之若訥野僧也生江湖間一旦萬乗之主召入禁中而訪所學授以二字盖師號之類也天下僧受師號者何可勝紀有能親屈帝筆如若訥之光榮者乎若訥是以不敢忘先帝不貲之恩思有以報之向聚吾師所述之經五千餘巻合為一藏名曰報恩經藏徧請朝廷輔佐之臣譔文書石瑑而立之今又將刻所賜二字於石以傳于後子為我序其事而記之光謝之曰光儒者素不習釋氏書將何以發明上人之學與受賜之由且文辭鄙陋何敢輙寓名諸公之末自陷不知量之罪乎若訥固請不已曰若訥去冬已嘗犯寒至洛值子西適秦不克見而返今兹復來非有他求欲得文而已若訥豈不知朝廷貴人及四方能文者甚衆欲為斯記者亦不鮮若訥皆不願得而唯子之求何子拒我之深乎光甚愧其言因諭之曰上人之志於光勤且厚如此光敢無辭以為復抑仁宗皇帝既嘉上人不受命服賜以二字豈師號之謂邪盖以褒勸上人之徳也上人亦嘗深思其指乎夫安净徳之美者也既曰安矣則於物宜無求既曰净矣則物不得而間之是故安如磐石雖加减萬鈞不為之低昻净如清水有一毫入之則累矣上人既能知先帝之大恩當謹守聖言而力行之以無負先帝之所期乃所以報也經藏奚為哉况光之文又足求邪訓訓儉示康吾本寒家世以清白相承吾性不喜華靡自為乳兒長者加以金銀華美之服輙羞赧弃去之二十忝科名聞喜宴獨不戴花同年曰君賜不可違也乃簮一花平生衣取蔽寒食取充腹亦不敢服垢弊以矯俗干名但順吾性而已衆人皆以奢靡為榮吾心獨以儉素為美人皆嗤吾固陋吾不以為病應之曰孔子稱與其不遜也寧固又曰以約失之者鮮矣又曰士志於道而恥惡衣惡食者未足與議也古人以儉為美徳今人乃以儉相詬病嘻異哉近歲風俗尤為侈靡走卒類士服農夫躡絲履吾記天聖中先公為羣牧判官客至未嘗不置酒或三行五行多不過七行酒沾於市果止於梨栗棗柿之類殽止於脯醢菜羮器用甆漆當時士大夫家皆然人不相非也會數而禮勤物薄而情厚近日士大夫家酒非内法果殽非逺方珍異食非多品器皿非滿案不敢會賔友常數日營聚然後敢發書苟或不然人争非之以為鄙吝故不隨俗靡者盖鮮矣嗟乎風俗頺弊如是居位者雖不能禁忍助之乎又聞昔李文靖公為相治居第於封邱門内㕔事前僅容旋馬或言其太隘公笑曰居第當傳子孫此為宰相㕔事誠隘為太祝奉禮㕔事已寛矣參政魯公為諫官真宗遣使急召之得於酒家既入問其所來以實對上曰卿為清望官柰何飲於酒肆對曰臣家貧客至無器皿殽果故就酒家觴之上以其無隱益重之張文節為相自奉飬如為河陽掌書記時所親或規之曰公今受俸不少而乃自奉若此公雖自信清約外人頗有公孫布被之譏公宜少從衆公嘆曰吾今日之俸雖舉家錦衣玉食何患不能顧人之常情由儉入奢易由奢入儉難吾今日之俸豈能常有身豈能常存一旦異於今日家人習奢已久不能頓儉必致失所豈若吾居位去位身在身亡常如一日乎嗚呼大賢之深謀逺慮豈庸人所及哉御孫曰儉徳之共也侈惡之大也共同也言有徳者皆由儉來也夫儉則寡欲君子寡欲則不役於物可以直道而行小人寡欲則能謹身節用逺罪豐家故曰儉徳之共也侈則多欲君子多欲則貪慕富貴枉道速禍小人多欲則多求妄用敗家喪身是以居官必賄居鄉必盗故曰侈惡之大也昔正考父饘鬻以餬口孟僖子知其後必有達人季文子相三君妾不衣帛馬不食粟君子以為忠管仲鏤簋朱紘山楶藻梲孔子鄙其小器公叔文子享衞靈公史鰌知其及禍及戍果以富得罪出亡何曽日食萬錢至孫以驕溢傾家石崇以奢靡誇人卒以此死東市近世冦莱公豪侈冠一時然以功業大人莫之非子孫習其家風今多窮困其餘以儉立名以侈自敗者多矣不可徧數聊舉數人以訓汝汝非徒身當服行當以訓汝子孫使知前輩之風俗云傳家集巻六十七欽定四庫全書傳家集巻六十八宋司馬光撰序一百官表總序四海至廣雖聖人不能獨治萬機至衆雖聖人不能徧知是故設官以分其事量能而授之任自生民以來有國家者莫之能易也唐虞夏商尚矣周官具存粲然大備降及秦漢迄于隋唐雖不能如三代之粹美然上下相維皆有條緒孔子稱惟器與名不可以假人又曰必也正名乎名之宜正者無若百官唐初職事官有六省一臺九寺三監十六衞十率府之屬其外又有勲官散官勲官以賞戰功散官以褒勤舊故必折馘執俘然後賜勲積資累考然後進階以其不可妄得故當時人以為榮及髙宗東封武后預政欲求媚於衆始有汎階自是品秩寖訛朱紫日繁矣肅宗之後四方糜沸兵革不息財力屈竭勲官不足以勸武功府庫不足以募戰士遂并職事官通用為賞不復選材無所愛吝將帥出征者皆給空名告身自開府至郎將聼臨事注名後又聴以信牒授人有至異姓王者於是金帛重而官爵輕矣或以大將軍告身纔易一醉其濫如此重以藩方䟦扈朝廷畏之窮極褒寵苟求姑息遂有朝編卒伍暮擁節旄夕解緹衣旦紆公衮者矣流及五代等衰益紊三公端揆之貴施於軍校衣紫執象之榮被於胥史名器之亂無此為甚大宋受命承其餘弊方綱紀大基未暇釐正故臺省寺監衞率之官止以辨班列之崇卑制廪祿之厚薄多無職業其所謂官者乃古之爵也所謂差遣者乃古之官也所謂職者乃古之加官也自餘功臣檢校官散官階勲爵邑徒為煩文人不復貴凡朝廷所以鼓舞羣倫緝熈庶績者曰官曰差遣曰職而已於三者之中復有名同實異交錯難知又遷徙去來常無虚日欲觀其大畧故自建隆以來文官知雜御史以上武官閤門使以上内臣押班以上遷除黜免刪其煩冗存其要實以倫類相從以先後相次為百官公卿表云河南志序元豐六年作周官有職方土訓誦訓之職掌道四方九州之事物以詔王知其利害後世學者為書以述地里亦其遺法也唐麗正殿直學士韋述為兩京記近故龍圖閣直學士宋君敏求字次道演之為河南長安志凡其廢興遷徙及宫室城郭坊市第舎縣鎮鄉里山川津梁亭驛廟寺陵墓之名數與古先之遺迹人物之俊秀守令之良能花卉之殊尤無不備載考諸韋記其詳不啻十餘倍開編粲然如指諸掌真慱物之書也次道性嗜學先正宣獻公蓄書三萬巻次道自毁齒至于白首從事其間未嘗一日捨置故其見聞博洽當時罕倫又閑習國家故事公私有疑咸往質焉又喜著書如唐書仁宗實録國史會要集注史記之類與衆共之或專脩而未成者皆不計外其手自纂述已成者凡四百五十巻盖昔人所著未有若此其多也次道既沒太尉潞公留守西京其子慶曽等奉河南志以請於公曰先人昔嘗佐此府叙其事尤詳惜其傳於世者甚鮮願因公刻印以廣之豈徒先人䝉不朽之賜於泉壌抑亦使四方之人未嘗至洛者得之如遊處已熟後世聞今日洛都之盛者得之如身逢目睹也幸公留意公從之且命光為之序光於次道友人也烏敢以固陋而辭劉道原十國紀年序皇祐初光為貢院屬官時有詔士能講觧經義者聴别奏名應詔者數十人趙周翰為侍講知貢舉問以春秋禮記大義其中一人所對最精詳先具注䟽次引先儒異説末以已意論而斷之凡二十問所對皆然主司驚異擢為第一及發糊名乃進士劉恕年十八矣光以是慕重之始與相識道原乃其字也道原是嵗賦詩論䇿亦入髙等殿試不中格更下國子監試講經復第一釋褐鉅鹿主簿遷和川令陸介夫為廣西帥奏掌機宜前世史自太史公所記下至周顯徳之末簡䇿極博而於科舉非所急故近歲學者多不讀鮮有能道之者獨道原篤好之為人强記紀傳之外閭里所録私記雜説無所不覽坐聴其談衮衮無窮上下數千載之細大之事如指掌皆有稽據可驗令人不覺心服英宗皇帝雅好稽古欲徧觀前世行事得失以為龜鑑光承乏侍臣嘗從容奏舊史文繁自布衣之士鮮能該通况天子一日萬機誠無暇周覧乞自戰國以還訖于顯徳凡闗國家之興衰繫衆庶之休戚善可為法惡可為戒者詮次為編年一書刪其浮長之辭庶於奏御差便上甚喜尋詔光編次歴代君臣事迹仍謂光曰卿自擇館閣英才共脩之光對曰館閣文學之士誠多至於専精史學臣未得而知所知者惟和川令劉恕一人而已上曰善退即奏召之與共脩書凡數年間史事之紛錯難治者則以諉之道原光䝉成而已今上即位更命其書曰資治通鑑王介甫與道原有舊深愛其才熈寧中介甫參大政欲引道原脩三司條例道原固辭以不習金穀之事因言天子方屬公以政事宜恢張堯舜之道以佐明主不應以財利為先介甫雖不能用亦未之怒道原嘗見之輙盡誠規益及吕獻可得罪知鄧州道原往見介甫曰公所以致人言盖亦有所未思因為條陳所更法令不合衆心者宜復其舊則議論自息介甫大怒遂與之絶未幾光出知永興軍道原曰我以直道忤執政今官長復去我何以自安且吾親老不可久留京師即奏乞監南康軍酒得之光尋判西京留臺奏遷書局於洛陽後數年道原奏請身詣光議脩書事朝廷許之道原水陸行數千里至洛陽自言比氣羸憊必病且死恐不復得再見留數月而歸未至家遭母䘮俄得風疾右手足偏廢伏枕再朞痛苦備至每呻吟之隙輙取書脩之病益篤乃束書歸之局中以元豐元年九月戊戌終官至秘書丞年止四十七嗟乎以道原之耿介其不容於人齟齬以沒固宜天何為復病而夭之邪此益使人痛惋惝怳而不能忘者也道原嗜學方其讀書家人呼之食至羮炙冷而不顧夜則卧思古今或不寐達旦在和川時以公事適野見劉聰太宰劉雄碑嘉平五年始改建元正舊史之失在洛陽與光偕如萬安山道旁有碑讀之乃五代列將人所不稱道者道原即能言其行事始終歸驗於舊史信然宋次道知亳州家多書道原枉道就借觀之次道日具酒饌為主人禮道原曰此非吾所為來也殊廢吾事願悉撤去獨閉門晝夜讀且抄留旬日盡其書而去目為之翳道原致疾亦由學之苦邪方介甫用事呼吸成禍福凡有施置舉天下莫能奪髙論之士始異而終附之面譽而背毁之口服而心非之者比肩是也道原獨奮厲不顧直指其事是曰是非曰非或面刺介甫至變色如鐵或稠人廣坐介甫之人滿側道原公議其得失無所隠惡之者側目愛之者寒心至掩耳起避之而道原曽不以為意見質厚者親之如兄弟姦諂者疾之如仇讎由是困窮而終不悔此誠人之所難也昔申棖以多慾不得為剛㣲生髙以乞醯不得為直如道原者可以為剛直之士乎道原家貧至無以給㫖甘一毫不妄取於人其自洛陽南歸也時已十月無寒具光以衣襪一二事及舊貂褥贐之固辭強與之行及潁州悉封而返之於光而不受於他人可知矣尤不信浮屠説以為必無是事曰人如居逆旅一物不可乏去則盡棄之矣豈得齎以自隨哉可謂知之明而决之勇矣道原好著書志欲籠絡宇宙而無所遺不幸早夭其成者十國紀年四十二巻包羲至周厲王疑年譜共和至熈寧年畧譜各一巻資治通鑑外紀十巻餘皆未成其成者亦未以傳人曰今栁芳唐厯本皆不同由芳書未成而傳之故也期於瞑目然後傳病亟猶汲汲借人書以參校已之書是非其失氣垂盡乃口授其子羲仲為書屬光使譔埋銘及十國紀年序且曰始欲諸國各作百官及藩鎮表未能就幸於序中言之光不為人譔銘文已累年所拒且數十家非不知道原託我之厚而不獲承命悲愧尤深故序平生所知道原之美附於其書以傳來世道原自言其先萬年人六世祖度唐末明經及第為臨川令卒官遇亂不能歸遂葬髙安因家焉南唐以髙安為筠州今為筠州人父煥字凝之進士及第為潁上令不能屈節事上官年五十棄官家廬山之陽且三十年矣人服其髙歐陽永叔作廬山髙以美之今為屯田員外郎致仕云名苑序慶厯九年作孔子稱名不正則言不順言不順則事不成乃至於百姓無所措手足甚矣聖人重名之至也劉子政述九流有名家者流曰尹文子公孫龍子等凡七家尹文子今存其術雜黄老刑名之言耳餘書更歴久逺世鮮傳之今有孫氏釋名盖亦其類也昔者魯哀公問社於宰我宰我對曰周人以栗曰使民戰栗孔子聞之深非之曰成事不說遂事不諫既往不咎戒其後復為也兩漢以來儒者務為此態旁貫曲取紆辭蔓説至有依聲襲韻強為立理誠可閔笑者甚衆此非宰我栗社之比邪今釋名之文亦猶是矣抑亦失聖人之㫖逺哉愚嘗念之久矣間因觀經傳諸書有可以正名者因記之竊以為備萬物之體用者無過於字包衆字之形聲者無過於韻今以集韻本為正先以平上去入衆韻正其聲次以說文解字正其形次以訓詁同異辯其理次以經傳諸書之言證其實命曰名苑其有法制云為時遷物變者亦畧叙其㳂革欲人知其源流變態云爾至於魚蟲草木之類雖纎苛煩碎非慷慨君子所當用心然亦重名之一節爾至於三才道徳禮樂善惡真偽之名輔佐世治其功亦不細哉所謂文武之道未墜於地在人賢者識其大者不賢者識其小者將來君子好學樂道庶幾亦有取焉古文孝經指解序聖人言則為經動則為法故孔子與曽參論孝而門人書之謂之孝經及傳授滋久章句漫差孔氏之人畏其流蕩失真故取其先世定本雜虞夏商周之書及論語藏諸壁中苟使人或知之則旋踵散失故雖子孫不以告也遭秦滅學天下之書掃地無遺漢興河間人顔芝之子得孝經十八章儒者相與傳之是為今文及魯恭王壊孔子宅而古文始出凡二十二章當是之時今文之學已盛故古文排擯不得列於學宫獨孔安國及後漢馬融為之傳諸儒黨同疾異信偽疑真是以歴載累百而孤學沉厭人無知者隋開皇中祕書學士王逸於陳人處得之河間劉炫為之作稽疑一篇将以興墜起廢而時人已多譏笑之者及唐明皇開元中詔議孔鄭二家劉知幾以為宜行孔廢鄭於是諸儒争難蠭起卒行鄭學及明皇自注遂用十八章為定先儒皆以為孔氏避秦禁而藏書臣竊疑其不然何則秦世科斗之書廢絶已久又始皇三十四年始下焚書之令距漢興纔七年耳孔氏子孫豈容悉無知者必待恭王然後廼出盖始藏之時去聖未逺其書最真與夫他國之人轉相傳授歴世踈逺者誠不侔矣且孝經與尚書俱出壁中今人皆知尚書之真而疑孝經之偽是何異信膾之可㗖而疑炙之不可食也嗟乎真偽之明皦若日月而歴世爭論不能自伸其中異同不多然要為得正此學者所當重惜也前世中孝經多者五十餘家少者亦不減十家今秘閣所藏止有鄭氏明皇及古文三家而已其古文有經無傳案孔安國以古文時無通者故以𨽻體冩尚書而傳之然則論語孝經不得獨用古文此盖後世好事者用孔氏傳本更以古文寫之其文則非其語則是也夫聖人之經髙深幽逺固非一人所能獨了是以前世並存百家之說使明者擇焉所以廣思慮重經術也臣愚雖不足以度越前人之胷臆闚望先聖之藩籬至於時有所見亦各言爾志之義是敢輙以𨽻寫古文為之指解其今文舊注有未盡者引而伸之其不合者易而去之亦未知此之為是而彼之為非然經猶的也一人射之不若衆人射之其為取中多也臣不敢避狂僣之罪而庶幾於先王之道萬一有所禆焉洛陽􅂄英會序元豐五年正月作昔白樂天在洛與髙年者八人遊時人慕之為九老圖傳於世宋興洛中諸公繼而為之者凡再矣皆圖形普明僧舍普明樂天之故第也元豐中潞國文公留守西都韓國富公納政在里第自餘士大夫以老自逸於洛者於時為多潞公謂韓公曰凡所為慕於樂天者以其志趣髙逸也奚必數與地之襲焉一旦悉集士大夫老而賢者於韓公之第置酒相樂賔主凡十有一人既而圖形妙覺僧舍時人謂之洛陽􅂄英㑹孔子曰好賢如緇衣取其敝又改為樂善無厭也二公寅亮三朝為國元老入賛萬機出綏四方上則固社稷尊宗廟下則熈百工和萬民天子腹心股肱耳目天下所取安所取平其勲業閎大顯融豈樂天所能庶幾然猶慕效樂天所為汲汲如恐弗及豈非樂善無厭者與又洛中舊俗燕私相聚尚齒不尚官自樂天之㑹已然是日復行之斯乃風化之本可頌也宣徽工公方留守北都聞之以書請於潞公曰某亦家洛位與年不居數客之後顧以官守不得執巵酒在坐席良以為恨願寓名其間幸無我遺其為諸公嘉羡如此光未及七十用狄監盧尹故事亦預於㑹潞公命光序其事不敢辭時五年正月壬辰端明殿學士兼翰林侍讀學士太中大夫提舉崇福宫司馬光序開府儀同三司守司徒武寧軍節度使致仕韓國公富弼字彦國年七十九河東節度使開府儀同三司守太尉判河南府兼西京留守司事潞國公文彦愽字寛夫年七十七司封郎中致仕席汝言字君從年七十七太常少卿致仕王尚宫字安之年七十六太常少卿致仕趙丙字南正年七十五秘書監致仕劉凡字伯壽年七十五衞州防禦使致仕馮行己字肅之年七十五太中大夫充天章閣待制提舉崇福宫樊建中字正叔年七十三司農少卿致仕王謹言字不疑年七十五太中大夫提舉崇福宫張問字昌言年七十一龍圖閣直學士通議大夫提舉崇福宫張夀字景元年七十傳家集巻六十八欽定四庫全書傳家集卷六十九宋司馬光撰序二顔太初雜文序寳元二年作天下之不尚儒乆矣今世之士大夫發言必自稱曰儒儒者果何如哉髙冠博帶廣袂之衣謂之儒耶執簡伏冊呻吟不息謂之儒耶又况㸃墨濡翰織製綺組之文以稱儒亦逺矣捨此勿言至於西漢之公孫丞相蕭望之張禹孔光東漢之歐陽歙張酺胡廣世之所謂大儒果足以充儒之名乎魯人顔太初字醇之常憤其然讀先王之書不治章句必求其理而己矣既得其理不徒誦之以誇誑於人必也蹈而行之在其身與郷黨無餘於其外則不光不光先王之道猶翳如也廼求天下國家政理風俗之得失為詩謌洎文以宣暢之景祐初青州牧有以荒滛放蕩為事慕嵇康阮籍之為人當時四方士大夫樂其無名教之拘翕然效之寖以成風太初惡其為大亂風俗之本作東州逸黨詩以刺之詩遂上聞天子亟治牧罪又有鄆州牧怒屬令之清直與已異者誣以罪榜掠死獄中妻子弱不能自訴太初素與令善憐其寃死作哭友人詩牧亦坐是廢於時或薦太初博學有文詔用為國子監直講㑹有御史素不善太初者上言太初狂狷不可任學官詔即行所至改除河中府臨晋主簿太初為人實寛良有治行非狂人也自臨晋改應天府户曹掌南京學卒於睢陽舊制判司簿尉四者無殿負例為令録雖愚懦昏耄無所取者積以年數必得之而太初才識如此舉進士解褐近十年卒不得脱判司簿尉之列以終身死時盖年四十餘噫天喪儒者使必至於大壊乎将犬吠所怪楘楘者必見鋤也何其仕與壽兩窮如此世人見太初官職不能動人又其文多指訐有疵病者所惡聞雖得其文不甚重之故所弃失居多余止得其兩巻在同州又得其所為題名記今集而序之前世之士身不顯於時而言立於後世者多矣太初雖賤而夭其文豈必不傳異日有見之者觀其後車詩則不忘鑒戒矣觀其逸黨詩則禮義不壊矣觀其哭友人詩則酷吏愧心矣觀其同州題名記則守長知弊政矣觀其望仙驛記則守長不事厨傳矣由是言之為益豈不厚哉吕獻可章奏集序熈寕五年八月二十九日作歐陽觀文有言士學古懐道者仕於時不得為宰相必為諫官諫官與宰相等坐乎廟堂之上與天子論可否者宰相也立乎殿陛之前與天子争是非者諫官也宰相九卿而下失職者受責於有司諫官失職者取譏於君子有司之法行乎一時君子之譏著之䇿書而昭明垂之百世而不泯誠哉是言也然士之居其任果能不失職者亦鮮矣獻可為臺諫官前後凡若干年遇黜者三皆以彈奏執政確切不己天子重傷大臣意不得己而黜之其直聲赫然振動天下自餘百官之愆違政事之闕失苟與之同時無彊弱大小知無不言言無不盡如獻可者於其職業可謂無所愧負矣古之人稱死而不朽者如臧文仲既沒其言立是也然文仲之言傳於今者無㡬盖時人不能存録遂使遺逸豈不惜哉光於獻可沗備僚友獻可平生造膝之言固不可得而聞今既沒其子曰庾等捜求章奏遺槀得二百餘篇光請而序之俾後之人察其言足以知獻可之心然則獻可身雖沒其心長存也嗚呼獻可以直道自立始終無缺而官止於諫議大夫年止五十八彼不以其道得者或位極将相壽及胡耉從愚者視之則可為憤邑從賢者視之以此况彼所得所失孰為多少邪後之人得是書者宜寳蓄之當官事君苟能效其一二斯為偉人矣龐相國清風集略後序公之勲業治行范景仁所為清風集叙言之詳矣公性喜詩雖相府機務之繁邉庭軍旅之急未嘗一日置不為凡所以怡神養志及逢時值事一寓之於詩其髙深閎逺之趣固非庸淺所可及至於用事精當偶對的切雖古人能者殆無以過及疾亟光時為諫官有謁禁走手啓參候公猶録詩十餘篇相示手注其後曰欲令吾弟知老夫病中尚有此意思耳字已慘澹難識後數日而薨曏者嗣子某字􅅷賢巳集其文為五十巻既而以文字之多懼世人傳者不能廣也又選詩之尤善者凡千篇為十巻命曰清風集略刻板摹之命光繼叙其事嗚呼公之善在人者旁施四海後垂無窮如詩乃公之餘事耳懋賢猶務其傳勤勤恐不逮况其大者乎公之積慶宜有繼哉時年月日門人涑水司馬光序薛宻學田詩集序元豊八年作揚子法言曰言心聲也書心畫也聲畫之美者無如文文之精者無如詩詩者志之所之也然則觀其詩其人之心可見矣今人親沒則畫像而事之畫像外貌也豈若詩之見其中心哉故樞宻直學士贈太尉薛公以文學政事顯於真宗仁宗之際其所施設見於國史及宋宣獻公所為神道碑此不詳書公既薨五十餘年少子中㪚大夫致仕俅集公詩二百二章以授光俾之譔序且為之名昔先人為郫尉公為轉運使知待甚厚薦之於朝光雖不肖其敢忘諸是以雖不文不敢辭謹按薛氏自姚秦以來世有偉人仕公卿将相行能功業光照簡冊號稱甲族迄於今不衰豈非河汾勝氣獨鍾於一門乎然而枝葉因遊宦多散之四方惟公一族留不去猶居河東請名之曰河汾集庶㡬子子孫孫繼公之志常保守奉事則而象之以傳慶於無窮也元豐八年三月丁未涑水司馬光序趙朝議丙文槀集在心為志發口為言言之美者為文文之美者為詩如鼓鐘者聲必聞於外灼龜者兆必見於表玉藴石而山木茂珠居淵而岸草榮皆物理自然雖欲揜之不可得巳朝議大夫致仕趙君南正善屬文尤嗜為詩自初仕至歸老聚其槀凡十四編一旦走僕負之以書屬光為之序光實何人克膺兹任然嘗聞同僚楚正叔之言曰予與南正同登進士第又同居潁陽熟其為人其清白耿介佗人殆難能也今閲其文槀味其言求其志乃知正叔信不我欺而南正所守良可尚也噫世人有得南正文槀而觀之雖未之識如自少至老日與之遊矣元豐八年三月十一日丁未涑水司馬光序馮亞詩集序文章之精者盡在於詩觀人文徒觀其詩斯知其才之逺近矣陜人馮亞字希顔學詩於處士魏野偏得其道潘逍遥深重之未四十而終魏詩大行於時亞詩去魏不逺而所傳者郷曲而巳所以然者由魏之壽亞之夭歟家公知杭州亞子噩以其先人詩集請因杭工刻諸板而傳之余以世俗不能識真貴於難得而賤於飽聞不若蔵之於家有同志者就而寫之則雖欲勿傳安得不傳若刻之於版有不知文者或敢譏評其否臧衆心無常從而和之是隕夫子之盛名不果刻序而歸之王内翰贈商雒龐主簿詩後序王詩云織女峯前貧主簿黄姑巖下舊詞臣乆棲枳棘方思替謾戴貂蟬不是真六里青山雲簇簇一條丹水石磷磷春來䰟夢應相似同是帝城南畔人至道初今觀文殿大學士始平公先君子贈中書令㫺為主簿商雒王公時自中書舎人謫官商州王公以文章獨歩當世乆宦巳通顯於朝加之剛簡峭直固不妄與人交然令君以九品官與相往來王公贈詩意好欵宻則令君為人可知巳至和初始平公以前相國在鄆從容出王公詩示光曰先君嘗有徳於商雒吏民至今思之其辭牒判署猶有寳蓄存者而况今守商州為我刻王公之詩於商雒以慰吏民之心光曰諾退而序其事并詩往刻焉并州學規後序嘉祐二年作天下所以化在於學百官所以治在於法然則學為化原法為治本兹二者又可忽歟前牧韓公既徙學而廣之又取法於大學及河南大名京兆府蘇州除苛補漏以為新規今牧龐公懼學者寖乆而寖忘之也廼命刻著於石嗚呼是規也存雖屋不加多食不加豐生徒不加衆猶為學興也是規也亡雖列屋萬區糗粻如陵生徒如雲猶為學廢也後之人司是學者可不慎與張共字大成序嘉祐元年為越州張推官作天下之事未嘗不敗於專而成於共專則隘隘則睽睽則窮共則愽博則通通則成故君子脩身治心則與人共其道興事立業則與人共其功道隆功著則與人共其名志得欲從則與人共其利是以道無不明功無不成名無不榮利無不長小人則不然專巳之道而不能從善服義以自廣也專巳之功而不能任賢與能以自大也專巳之名而日恐人之勝之也專巳之利而不欲人之有之也是以道不免於蔽文不免於楛名不免於辱利不免於亡此二者君子小人之大分也陜郡張君名共才甚美行甚脩舉進士登上科今從事於浙東光辱與張君為同郡人習其為人固乆竊以為古者名於親而字於朋友字必附名而為義焉光是敢輒廣其名之義而字曰大成以勉之異日張君克充其名顯裕光大庸可量哉諸兄子字序皇祐二年作余兄子十四人大抵未字皇祐二年告歸過家徧為之字皆附其名以寓訓焉京字亢宗京大也孟子曰天爵脩而人爵從之爾姑大其徳乎然後宗有所亢矣亮字信之孔子稱去食去兵而信不可去信者行之本也禀字從之從順也君子在家則禀於親出則禀於君無所不用其順焉夫順者天之所助也元字茂善元者善之長也勉善不巳能無長乎育字􅛱之致中和天地位焉萬物育焉况其邇者乎良字希祖詩云毋念爾祖聿脩厥徳君子脩徳以為祖也可不勉乎富字希道智者富於道愚者富於賄爾其勉於智乎齊字居徳齊中也孔子曰中庸之為徳其至矣乎居徳以中奚適而不利哉方字思之方道也孔子曰道不逺人苟思之精行之勤則道何逺之有哉爽字成徳爽明也明敏辯智天之才也中和正直人之徳也天與之才必資人徳以成之與其才勝徳不若徳勝才故願爾勉於徳而已矣衮字補之君子之事上進思盡忠退思補過異日爾仕於朝當以仲山甫為法乎章字晦之君子之道闇然而日章然則欲道之章者其惟晦乎奕字襲美詩云夙興夜寐毋忝爾所生奕世之美将待爾而襲之可不勉歟裔字承之爾於昆弟中為最㓜承祖之美者捨爾尚誰任哉嗚呼朝夕不離於口耳者名字而巳爾曹苟能言其名求其義聞其字念其道庶㡬吾宗其猶不為人後乎序賻禮元豐六年十一月一日作名以位顯行由學成此禮之常若夫身處草野未嘗從學志在為善不求聲利此則尤可尚也近世史氏專取髙官為之傳故閭閻之善人莫之聞喪禮之廢壊乆矣而民間為甚至有初喪親家各具酒肉聚於其家與主人同醉飽者有以鼓樂導喪車者有因喪納婦者相習為常恬不知怪醫助教劉太居親喪獨不飲酒食肉終三年此乃今士大夫所難能也其弟永一尤孝友㢘謹過於人熈寕初巫咸水入夏縣城民溺死者以百數永一執竿立門首有佗人物流入門者輙擿出之有僧寓錢數萬於其室居無何僧自經死永一遽詣縣自陳請以錢歸其弟子郷人負其債乆不償者永一輒毁劵以愧其心其行事類如此有周文粲者其兄嗜酒仰文粲為生兄或時酗毆文粲其鄰人不平而唁之文粲怒曰吾兄未嘗毆我汝何離間吾兄弟也有蘇慶文者事繼母以孝聞嘗語其婦曰汝事吾母小不謹必逐汝繼母少寡而無子由是安其室終身元豐中朝廷脩景靈宫調天下畫工詣京師事畢有詔選試其優者留翰林授官禄有臺亨者名第一以父老固辭歸養於田里此五人與余同縣故余得而知之悲夫天下布衣之士刻志厲行而人莫知者可勝數哉始太之喪其父也余兄弟賻以千錢且為書致之曰禮凡有喪佗人助之珠玉曰含車馬曰賵貨財曰賻衣服曰襚今物雖薄欲人之可繼也乆之太請刻其書於石曰曏也郷人不知有賻禮自太父之喪郷人稍稍行之太欲廣其傳由吾郷以及鄰縣由鄰縣以逹四方使民間皆去弊俗而入於禮豈小補哉余益美其志因諭之曰是書不足刻余竊慕君子樂道人之善請書若兄弟及周文粲蘇慶文臺亨所為以傳於世庶㡬使為善者不以隠㣲而自懈焉元豐六年十一月壬寅朔涑水迂叟序傳家集巻六十九欽定四庫全書傳家集巻七十宋司馬光撰序三
