seq: 57
body:
  text: 相公讓眀堂加恩第一表展采合宫用成於盛禮推恩列位首冒於徽章内省空踈交深震慄中謝伏念臣出於單族素乏異能遭㑹聖辰襲承義訓肩隨羣士齒列具僚始更郡縣之勞遂玷閨䑓之美雖慕盡公之節力自拔摩迄無髙衆之名可容稱道頃由邉𤨏進貳樞庭復參丞弼之司旋總㡬㣲之務固已任踰才表榮出望涯十七物之珍羞居慙厚賜三百囷之重祿坐愧素餐雖僶俛以自安常忸怩而内訟屬國家講求闊典祗紹明禋幸千載之親逄叨一時之榮􅀚伏遇尊號皇帝陛下天𠂻廣覆聖道兼容不専享於神休俾下覃於朝衆謂臣職當扈蹕禮與執膰曲矜孱陋之蹤猥被殊尤之澤位列元功之次邑增真食之封事與志違名非徳稱惴如臨谷憂甚履氷豈可忽非據之災安無勞之賞俾衆庶有假人之議致朝廷䝉含垢之羞熟自省循誠難膺克伏望俯矜危欵曲軫睿慈特寢不貲之恩以全無似之質露誠獲允受賜益深第二表愚𠂻上列冀寢於殊恩睿志莫回必申於前命征營無措兢戰失圖中謝伏以陟配總章昔王之盛節追嚴廟祏前載之美談唐虞著五府之文商周增重屋之制久兹曠絶未暇修明伏遇尊號皇帝陛下祗若天常寅恭祭典謂五精之氣不可久契於神歡三祖之靈不可弗親於宗祀若稽古訓濬發聖謨崑崙放玉帯之圖路寢采康成之議八窗四戸屬象相依萬舞九成聲明具在臣謬居機近忝助祼將庀徒護法駕之嚴負璽託屬車之末奉汝上肅雝之慶無周南留滯之嗟其在蠢愚固為榮幸不可復妄膺髙位叨竊寵名况七萃有暴露之勞百司有供億之費欲加之賞宜用為先臣祿秩已豐勤劬至薄豈可復膺褒進以重愆尤伏惟天鑒崇髙下垂燭察物誠精至庶獲感通為龐相公謝眀堂禮成轉官表叨榮過厚揣分非宜制命益嚴懇辭不獲中謝伏念臣顓愚無術孤陋寡徒起家衡茅致位機近此皆出於天幸斷自宸知非才伎過絶於人豈朋援隂為之地是以每循涯知止以寵為憂獲一官若負譴訶進一位若懷疾眚非敢厭薄髙爵希慕虛名誠以居三府之崇賛萬機之大乆留不去妨廢實多况祿厚者衆之所趨勢尤者人之所疾不獨力綿任重失職是虞亦將智淺跡單處躬可畏方自謀於遜避以深逺於譏嫌豈謂伏遇尊號皇帝陛下濬發清𠂻述修盛禮合祛天地之祀嚴配祖宗之靈茂典既成鴻私勞洽謂臣屬當扈從與在駿奔疇其執事之勞均以受釐之慶遷地官之亞列增帝傅之寵名悉非庸虚所能堪稱是用力陳危欵冀寢殊恩葵藿之心徒自傾而無隱雨露之澤非已降而可收雖祗徇於詔文實内慙於靈府敢不益堅苦節愈厲樸忠當官而行蹈水火而無避惟力是視竭筋骨以為期為文相公謝賜神道碑文表命發宸庭文成禁署澤加存歿榮動邇遐中謝竊以金石之傳乆而彌茂風樹之感貴而自悲諒知為子之心咸有顯親之願伏念先臣䇿名休運接武辨朝陳力當官服勤沒齒臣荷析薪之業紹作室之功雖資性甚愚曾無肖似而義方未墜少逭譴尤伏遇尊號皇帝陛下過聴菲才遽加大任寘彼官師之首列於丞弼之司非藉世榮曷膺國寵頃以嵗時得卜宅兆圖新將論譔於豐碑用表章於大隧豈意睿明曲照優渥㳫臻䊸彼神翰掲諸螭首仍詔代言之職直書傳信之辭著琬琰以無忘與松楸而並列聲光不朽永䝉庇於昆孫精爽有知潜拜嘉於幽壤荷恩益腆撫已知輕且身體􅄠膚皆仰資於顧復而股肱心膂敢有愛於生成未識津涯徒知涕泗為文相公求退第二表臣省躬甚眀揣分已熟非敢外􅎖以邀上知天恩留連未見識察物意専慤期於感通中謝伏念臣本以諸生親逄盛世行能無出於萃類學術不際於㡬㣲所期觧韋布之衣霑斗石之祿竭簿領之效免耕稼之勤安敢企踵帝庭許身王佐伏遇尊號皇帝陛下嘉其木訥亮以孤忠課於近小之功粗能稱旨役以煩縟之事不至敗官乃謂榱桷之才可勝棟楹之任錡釡之器足兼鼎鼐之容逺自西州驟叨重柄躋宻地則不踰中宿參大政則曾未期年遽越等夷直登佐弼靜言遭際熟察基縁寧左右先為之容豈朋援隂為之地莫非睿鑒特振寒蹤雖以草木之㣲猶知雨露之澤况於有識詎敢忘恩豈欲違去旒扆之前逺離闕庭之外棄萬鍾之秩辭四輔之崇顧以義不可留情有所廹大易存覆餗之戒詩人著在梁之譏任重難勝位髙多懼雖人主含貸未賜於譴訶有司因循不加於䋲治臣敢不捫心自愧顧影知非乗疵吝之未形保名迹而先退必使愆尤增積謗讟流聞致陛下失終始之仁愚臣受逺邇之責非止謀身之過抑亦負國之深是用寢食震驚夙宵悸慓視金章於芒刺等黄閤於焦原苟未去身何能歉志伏望燭臨危欵矜恤苦言聴避位於上司得保躬於㪚地博求儁傑光輔休明則臣俯就下陳若獲九遷之喜出居外職無殊三接之榮干冒冕旒不勝惓惓之至為龎相公讓官表恩出非常位遷不次内循空薄交集震驚中謝臣識昧疏通學非殫洽依憑時㑹叨假國靈荐更要劇之權遂躋通顯之地陪侍帷幄參與機衡雖盡股肱之勞不遺餘力訖無毫􅄠之效克厭衆心居常自思敢忘内訟方且俟清閒之燕竭悃欵之私力辭宥宻之聨退祈冗散之秩庶逭官責少息人言豈期志願未從寵光愈峻遽以朽踈之質猥當佑弼之司承命以還措躬無所竊以緝熈帝術寅亮國成翼戴萬機統和三極得人則羣生䝉福失職則百度乖方詎可妄居豈容濫授臣雖欲冒榮不顧懷祿苟安儻衆庶責望之深誠朝廷倚毗之失是用夙宵愧恧寤寐兢憂不知列鼎之榮恍若臨淵之懼伏望尊號皇帝陛下俯從危款曲照孤蹤矜其驅策之勤為日已乆察其避讓之固於心不欺俾祗服於舊官特寢除於新命旁求雋徳式副輿情為龎相公再讓宰相表需奏仰陳冀安於涯分綸言俯及未照於悃誠蹐地載驚履冰逾畏中謝臣聞量能授職者人主之通術陳力就列者臣下之令圖義或此違治何由立臣是以退居深念申旦伏思竊惟佑弼之崇實繫安平之本總領衆職鎮撫四夷下遂萬物之冝上序三光之統凡將圖任豈易輕言至若黄霸循良朱博銳敏始為郡守皆號能臣暨陟宰司遂隳盛譽或受嗤於鶡雀或召咎於鼔妖豈前智而後愚盖任盈而量溢況臣空薄詎敢擬倫必欲使用不違才舉無敗事則莫若委之藩服俾敷寛大之條寘以邉方得奉綏懷之畧庶㡬展效不敢憚勤儻以服役有年居官無過不欲捐之草莽尚將留彼闕庭則願且守故棲未遷佗職私自寧於宻地得時望於清光忝幸已深感槩何極豈敢使巖廊曠位元鼎失和竊貪一日之榮不虞四海之責伏望尊號皇帝陛下曲垂矜恤靡賜勿遺察底裏之無欺全始終而可保特収渙命俯徇愚𠂻少安據蒺之憂尚免在梁之刺内惟懇廹期獲允俞為龎相公謝官表荷恩逾分瀝懇敷言成命莫回愧顔無寄中謝伏念臣賦能甚薄探道未深習詩禮以為儒師法令而補吏適際亨嘉之㑹誤膺濬哲之知亟陟顯塗荐膺煩使監邉則盡護羣師侍幄則恊賛萬㣲宻邇清光訏謨基命固已任逾器表榮溢望涯居無終日之間少忘素餐之責何意天恩横被宸睠曲成猥掄樗液之才専委棟隆之任靡由階漸遽爾直登冠冊府之華資總史臣之善志翻經演法進律加田甫聞出綍之言殆失措躬之地力陳丹悃仰黷䆳旒雖堅不奪之誠難變已行之令威顔甚邇私願莫從俯僂若驚徜徉自失此盖伏遇尊號皇帝陛下用人道廣愛物義深不求純備之功姑委燮調之職爰從隗始俾奉蕭規敢不祓飾厥心耀明其志識慮所及不敢顧私筋力可任期於盡瘁小助緝熈之化仰酬覆燾之仁為文相公許州謝上表避辭公鼎雖弛負擔違離天閽倍深眷戀中謝伏念臣材非出類識不先㡬逄辰休嘉致位通顯謹司斥候亟守於邉隅䖍布教條荐更於方鎮訖無聲迹可聳傳聞伏遇尊號皇帝陛下明燭幽㣲仁霑䟽逖遽選掄於遐服俾陪貳於中樞曾不浹旬遂參大政未能周嵗爰陟上司念遭際之非常求比倫之盖寡雖濵隕越豈謝生成是用杜僥倖之門窒竒衺之徑激揚㢘讓抑止浮華苟有利於公家固不為於私計然而力非其任智實有涯羣心萬殊理難稱愜衆目環視動成詆訶紛如鋒矢之衝浩若波濤之沸從之則懼傷國體違之則立致身殃進退靡遑啓居無所屢以清閒之侍力陳退避之誠盖揣分之甚詳恐敗官而為辱貴全終始不避顛危陛下察其愚𠂻必非縁飾愍其孤迹易致怨憎俾述職於近藩得免譏於尸祿仍進天官之秩復升殿幄之華禮數甚優恩輝愈洽脫吕梁之險亟就安瀾去焦原之危更遵夷路非曲叨於庇佑豈自信於保全惟許昌之奥區乃昆吾之故壤土毛豐衍民齒夥繁敢不致在拊循勤加訓𨗳奉承寛大之詔期臻富庶之風少副憂勤茲為報效為滑州張龍圖賀章獻章懿皇后袝廟表聖心追逺思慕慈親陟配禰宫順成大禮中謝伏以章獻明肅皇后輔佐先朝敷明隂教𨗳揚末命鎮綏大業章懿皇后淑慎在躬受天元祉茂育聖神光啓丕祚而猶分祀閟宫未登太室尊號皇帝陛下濬發孝思㳂情著制采開元之令典講國家之故事㳙選嘉辰咸升配侑述祖宗之志成母后之尊允所謂道隆列辟法垂後世禮行於宗廟孝通乎神眀日月所臨霜露所墜抃手蹈足小大同之況臣任居藩垣職參臺閣欣豫之志倍億等夷官守所拘不獲奔詣闕庭稱慶謝中冬衣襖表祗荷寵光心顔無措中謝恭惟皇帝陛下皇仁溥洽衣被九圍軫念祁寒寵錫嘉服臣雖無似䝉澤猶均濫承安燠之榮空慙不稱之責無任感恩激切之至進交趾獻竒獸賦表嘉祐八年九月初三日上臣光言今月二十五日有詔詣崇政殿觀交州所獻異獸曰麒麟者臣愚不學不足以識異物竊以麟瑞獸也曠世而不可覿其於經有名而無形傳記有形而去聖乆逺衆說紛揉自非聖人莫能識其真況承學之臣固不能决其是非也臣光中謝竊以王者道盛徳至格于神明則有仁獸不召而自至不羈而自馴此其所以為瑞也今是獸也生於遐荒拘之檻櫝載之方舟輿曵萬里致於闕庭形質詭異不應經傳真偽之間未易究測儻其真也則非自然而来設其偽也徒為逺夷所笑殆非所以發揚聖朝之光輝補益治平之實效也旅獒曰不作無益害有益功乃成不貴異物賤用物民乃足犬馬非其土性不畜珎禽竒獸不育于國不寳逺物則逺人格所寳惟賢則邇人安臣竊以為宜延見使者賚之金帛賜以詔書嘉答其意歸其麒麟使復故壤然後登俊傑之才修政治之實使家給人足禮興樂行四夷賔服天瑞自至以遵旅獒之意不亦盛乎臣不勝憤悱謹述交趾獻竒獸賦一篇奉表投進以聞進瞻彼南山詩表臣光言臣聞天尊地卑道之常也而乾下坤上謂之㤗豈非陽不下隂則無以行其施君不交臣則無以得其心是以詩人歌頌其君之徳多稱飲食飫燕之豐鐘鼔筦磬之樂車服旌旂之盛幣帛錫予之多盖以君臣兄弟朋友之際舍此無以相交也雖然人君不以誠心加之則此四者雖美無益也故鹿鳴曰我有㫖酒以燕樂嘉賔之心彤弓曰我有嘉賔中心貺之此言君臣之恩不由外来也中謝伏見體天法道欽文聰武聖神孝徳皇帝陛下以十二月二十三日二十七日再幸天章閣悉召宰輔侍從之臣徧觀瑞物及先帝御書御集又幸寳文閣親為飛白書并御墨紙筆以賜羣臣又賦詩命羣臣屬和又幸羣玉殿置酒作樂比暮而罷其酒醪殽䔩羅花金器多出禁中於二十七日仍面諭羣臣以前日之燕辦於造次未盡朕心故欲重與卿等為樂今天下方無事毋惜盡醉以稱朕意是日凡為燕之具又加厚於前其所以勞徕存撫羣臣莫非出於陛下之志者是以羣臣膏沐寵光被服徳音熏蒸條鬯浹於肌膚淪於骨髓固不待飲食而先醉飽矣退而詠歌聖徳流布四方聞者無不咨嗟歎息以為陛下之於羣臣可為無負而羣臣實負陛下多矣苟有可以死於其職補益萬分莫敢愛也中謝竊以羣臣前後受陛下爵位廪祿饗燕賜予固已多矣未有如今日之歡欣感激深厚切至上下如一者其故何哉此非外物豐衍所能致也正由陛下加之誠心而已矣陛下方將推廣此心以被天下至於朝廷之政進賢退不肖賞善罰惡無不盡誠以求之臣見四海之内如殿堂之上無不沈酣於茂恩饜飫於盛徳矣不勝鼓舞抃蹈之至謹成瞻彼南山詩七章隨表上進文采鄙野不自揣度羞汚盛時伏惟陛下察其狂簡而裁其罪罰焉進古文孝經指觧表嘉祐元年作臣光言臣聞聖人之徳莫加於孝猶江河之有源草木之有本源逺則流大本固則葉繁是以由古及今臣畜四海未有孝不先隆而能宣昭功化者也中謝伏惟尊號皇帝陛下純孝之性發於自然動靜云為必咨訓典起居出入不忘先烈以為滁州者太祖皇帝所以禽馘姦桀肇開王迹并州者太宗皇帝所以芟夷僣亂混一九圍澶州者真宗皇帝所以攘却貪殘億寧華夏皆大勲懿業威靈所存遂命有司分建原廟圖繢聖容躬題扁榜嚴奉之禮備盡恭勤羽衛供帳率從豐衍茲有以見陛下尊顯祖宗之意無不至矣經曰愛敬盡於事親而徳教加於百姓形于四海夫以陛下天授之資愛敬之志而又念夫百官者祖宗之百官不可以私非其人府庫者祖宗之府庫不可以賞非其功法令者祖宗之法令不可以罰非其罪慎之重之益自儆戒如是則為無不成求無不給榮名之彰炳如日月基緒之固巍如㤗山黎民乂安四夷懷服草木禽魚靡不茂豫此誠孝徳之極致也臣愚幸得補文館之缺以經史為職竊覩祕閣所藏古文孝經先秦舊書傳注遺逸孤學堙㣲不絶如綫是以不自揆量妄以所聞為之指觧雖才識褊淺無能發明庶㡬因聖人之言得少闗省覽則糞土之臣榮願足矣其古文孝經指觧一巻謹隨表奉進以聞進通志表臣光言臣聞治亂之原古今同體載在方冊不可不思中謝臣少好史學病其煩冗常欲刪取其要為編年一書力薄道悠久而未就今茲伏遇皇帝陛下丕承基緒留意藝文開延儒臣講求古訓臣有先所述通志八卷起周威烈王二十三年盡秦二世三年史記之外參以佗書於七國興亡之迹大畧可見文理迃疏無足觀采不敢自匿謹繕寫隨表上進謝二股河北流已閉賜奨諭勅書并對衣金帯鞍轡馬表聖言優渥寵錫便蕃顧循無勞何以堪稱中謝竊以去秋積雨河决棗強朝廷憂勞憫茲昏墊臣祗奉明詔相視所詢采衆言聞逹天聴捨短收長率由聖志處決利害昭晰如神今流勢東折徑趨渤碣恩冀西北公私安堵斯皆上帝儲休明主獨斷勞心建䇿則有當官之人勠力奏功則有執役之士臣進無運籌之智退無負薪之勤曾何施為膺茲貺賚辭之則渉於偽慢受之則實為尸素有靦靣目無地自容臣性雖頑愚靈於草木䝉被天地敢忘報效唯期竭忠庶禆萬一賀皇子降生表伏以熊羆之兆載於詩雅弓韣之祥著諸典禮盖以保育黎元莫茲為大本支既茂基祚益安是故百男昌而周興五宗强而漢熾隆替之源古今一揆中謝伏惟尊號皇帝陛下純孝奉先逺猷垂世錫類之祉久屬羣心皇穹降休誕啓茂緒蓬矢遵吉牢脩具儀斯實宗廟眷佑之靈衆庶無疆之福窮河際海聲教所霑儻曰有心率知相慶况臣職叨近署位備列藩竊聆嘉喜奚勝踊躍官守有繫阻逺闕庭臣無任瞻天望聖蹈舞屏營之至賀皇子昕建節表封建本支光隆基祚王室增維城之固萬方有磐石之安中謝恭惟皇帝陛下仁被海㝢道合天𠂻膺受純禧誕錫元胄采古昔之令典考今茲之盛務爰立藩邸恢建宏規假節秉鉞習以戎律赤舄衮衣崇其儀望苴茅胙土訓以政治明尊尚親資忠移孝一舉而善衆美具該斯實堂構之逺謀黎民之隆福也臣述職外方傳聞嘉喜不勝抃蹈激切之至謝賜資治通鑑序表臣光言伏䝉聖恩令臣讀所修資治通鑑仍面賜御製御書序一篇者臣性識駑鈍學問空淺偶自㓜齡粗渉羣史常欲芟去蕪雜發揮精儁窮探治亂之迹上助聖明之鑒功大力薄任重道悠徒懷寸心行將白首伏遇先皇帝若稽古道博采㣲言俾摭舊聞遂伸㣲志尚方紙墨分於奏御之餘内閣圖書從其假借之便未遑汗簡已泣遺弓陛下祗服駿命丕承前烈臣以屬槀有緒不可不成受詔所為不敢不上銓次無法牴牾實多仰汚覽觀伏湏罪戾豈謂皇帝陛下赦其狂簡賞其専勤思所以旌異於佗書焜燿於羣下特發殊恩不用常例屬當勸講之始俾參經史之末迨此清閒命之進讀而又序其本原冠於篇帙發言為典肆筆成書炳蔚互變如虎豹之明灝噩無涯逾商周之盛况復襃貶是非古人有所未至造端立意愚臣不能自言陛下一賜指陳渙然冰釋至於博而得其要簡而周於事典刑之總㑹冊牘之淵林臣實何人克堪此語若乃嘉文宣以作則授正觀而為師兹實生民之福豈伊㣲臣之幸中謝竊以周之南董漢之遷固皆推髙一時播美千載未有親屈帝文特紆宸翰曲䝉奬飾大振輝光如臣樸􅈪小才固非先賢之比便蕃茂澤獨専後世之榮退自揣循殆無容措遂使螢燐末照依日月以永存草木常名附天地而不朽臣不任懇款之至知永興軍謝上表荷恩至重任責尤深循撫吏民敷宣詔令中謝臣識慮闇淺規為闊踈唯知愚忠屢貢狂直奉事三世操守一心間以齒􅄠寢衰疾疹交集曾靡論思之效乆汚侍從之班既無補於本朝祈自安於散地不圖睿澤更委名都雖要重之權自知不稱而煩劇之地難以固辭受命以還措躬無所朅來就道甫爾到官惟此咸秦昔為畿甸山川美秀土地膏腴論其平時誠為樂土在於今日適值凶年經夏亢陽苗青乾而不秀涉秋淫雨穂腐黑而無收廪食一空家乏盖藏之粟襁負相屬道有流離之人老弱懐溝壑之憂姦猾蓄萑蒲之志正宜安静不可動揺譬諸烹魚勿煩擾則免於糜爛如彼種木任生殖則自然蕃滋謹當策勵疲駑彫磨朽鈍智力所及勤瘁無辭雖復失位危身終不病民負國庶幾小補用答大恩臣無任戴天荷聖激切屏營之至遺表元豐五年秋吾苦語澁疑為中風之候恐朝夕疾作猝然不救乃豫作遺表自書之常置臥内俟且死以授范堯夫范夢得使上之八年三月五日宫車晏駕此表無用留以示子孫欲使知吾事君區區之心耳臣世受國恩常思補報但以性識愚戇不合聖心是以比年以來屏居杜口不敢復言今衰疾日侵將填溝壑敢以平生忠懇一達天聰庶幾陛下知臣無求於朝廷而未嘗忘國家也中謝伏惟皇帝陛下天縱睿哲燭物精敏踐祚以來鋭志求治圖任奇傑恢張洪業得王安石委而信之不復疑貳聽其言從其計人有沮毁之者責而逐之雖周成王之信周公齊桓公之任管仲燕昭王之倚樂毅蜀先主之託諸葛亮殆無以及斯乃不世出之英主曠千載而難逢者也不幸所委不得其人安石既愚且愎不知擇祖宗之令典合天下之嘉謀以啓迪聰明佐佑丕烈乃足已自是謂古今之人皆莫已如有人與之同則喜與之異則怒喜則數年之間援引登青雲怒則黜逐擯斥終身沈草莱凡人之情誰不喜富貴而畏刑禍於是忠直逺屏姦䛕競進為之腹心羽翼以干禄徼利遂使中外權要之任非其黨與不得處也深疾諫者過於仇讎嚴禁誹謗甚於盜賊然後逞其胸臆變亂舊章興害除利捨是取非其尤病民傷國者畧舉四條其一曰青苗錢分命使者誘以重賞强散息錢朘民求利取新償舊負債嵗多官守空簿實無所獲貨重物輕公私兩困其二曰免役錢縱富彊應役之人使家居自逸征貧弱不役之戸使流離轉死凡農家所有不過糓帛與力自古賦役無出三者今皆不取専責以錢錢非私家所鑄要須貿易外求豐嵗糓賤已自傷農又迫於期限不得半價盡糶所收未能充數家之餱糧不暇更留若值凶年則又無糓可糶人人賣田無徃可售遂致殺牛賣肉伐桑鬻薪来年生計安敢復議用此雇浮浪之人以供百役使緩則為姦急則逃竄處事若此豈非倒置其三曰保甲自唐募長征之兵賦農民糓帛以給其衣糧農固已困矣今糓帛稅如故又使捨耕桑事戰陳一身二任民何以堪又罷廵檢兵士及尉司弓手皆易以保甲半月一代彼畎畝之民尚未能操弓挾矢已復代去用此擒盗不亦難乎夫奪其衣食使無以為生是驅民為盜也使比屋習戰勸以官賞是教民為盜也又撤去捕盜之人是縱民為盜也謀國如此果為利乎四曰市易遣吏坐列販賣與細民爭利下至菜果油麵駔儈所得皆㩁而奪之使道路怨嗟逺近羞笑商旅不行酒稅虧損奪彼與此得少失多又稱貸於民恣其所取使無頼子弟得醉飽之資在家父兄受督責之苦傾貲破産十有五六凡此四者皆逆人情違物理天下非之莫之肯從安石乃以峻法驅之彼十惡盜賊累更赦令猶得寛除獨違新法者不以赦降去官原免是其所犯重於十惡盜賊也安石苟欲遂其狠心無顧治體此其厲階至今為梗也又有姦詐之臣如种諤薛向王韶李憲王中正之徒行險徼幸懷諼罔上輕動干戈妄擾蠻夷夫兵者國之大事廢興存亡於是乎在而諤等苟營一身之官賞不顧百姓之死亡國家之利病輕慮淺謀發於造次深入自潰僅同兒戯使兵夫數十萬暴骸於曠野資仗巨億弃捐於異域昔王恢為馬邑之謀單于覺之遁去時漢軍無所失亡但無功耳武帝猶以為不誅恢無以謝天下今潰敗失亡狼籍如此而建議行師之人晏然若無愧畏或更䝉寵任竊見國家至仁重惜人命諸州論囚有法應流而誤入死者舉州官吏皆坐停廢柰何使數十萬人無罪就死反無所坐乎此所以使狂躁貪冒之人競為甞試之說而無所懲艾者也若舉事屢如此其於國家豈可不憂乎臣聞堂上不則郊草不瞻曠芸是以古聖王之治天下必先内而後外安近以服逺故書曰帝乃誕敷文徳七旬有苖格詩云王猷允塞徐方既来下至齊桓晋文亦先富教其民然後用之陛下何不視今日朝廷之政治何如羣臣之智能何如百姓之富樂何如士卒之精銳何如乃遽從事於四夷也臣所惜者以陛下之聖眀不師虞舜周宣之徳反慕秦皇漢武之所為借使能踰葱嶺絶大漠鏖臯蘭焚龍庭又何足貴哉自古人主喜於用兵疲弊百姓致内盜蠭起或外㓂覬覦者多矣申屠剛曰未至豫言固常為虚及其已至又無所及必若待四方糜沸如秦漢隋唐之季然後悔之固已晚矣夫諫爭之臣人主之耳目也安可一日無之書曰若跣弗視地厥足用傷設有人閉目塞耳跣而疾趨前遇險阻安有不顛躓者哉臣竊見十年以来天下以言為諱大臣偷安於祿位小臣苟免於罪戾閭閻之民憔悴困窮無所控告宗廟社稷危於累卵可為寒心人無賢愚貴賤莫不知之而訖無一人敢發口言者陛下深居九重徒日聞䛕臣之言以為天下家給人足太平之功十已八九成矣臣是以不勝憤懣為陛下忍死言之庶㡬陛下覽其垂盡之辭察其願忠之志廓然發日月之明毅然奮乾剛之斷悔既徃之失収將来之福登進忠直黜逺佞邪審黄􅄠之可任寤諞言之難信罷苖役廢保甲以寛農民除市易絶稱貸以恵工商斥退聚斂之臣褒顯循良之吏禁約邉將不使貪功而危國制抑近習不使握兵而兆亂除苛察之法以隆易簡之政變刻薄之俗以復敦樸之化使衆庶安農桑士卒保首領宗社永安傳祚無窮則臣沒勝於存死榮於生瞑目九泉無所復恨矣臣不勝瞻天戀聖之至慰太皇太后上仙表臣今月二十三日蒙西京宣示二十日太皇太后遺誥者旻天降禍仙馭上賔奉訃哀惶㒺知所措伏以太皇太后作配仁祖聴政英朝洪基所以固安景命由其保祐風化形於海内徳澤結於民心宜永享東朝之尊長膺天下之養而中夀未至大期有終哀纒兩宫痛浹萬宇恭惟皇帝陛下孝心罔極號慕難居瞻内寢以如存追慈顔而靡及伏望上為宗廟之重下庇烝民之生少抑聖情俯就中制臣忝列侍從不獲奔赴闕庭瞻望宸極謝提舉崇福宫表臣光言伏奉勅命宜令再任提舉西京崇福宫者囊奏上陳始虞報罷黈聰垂徳亟沐頒恩祗荷寛優伏增兢悸伏念臣器非適用學不知方被遇三朝忝塵二禁䊸天光之顧問侍經席之從容亦甞委總憲司訖無報稱擢陪樞府不敢叨居剖竹雍都蔑聞於治效分臺洛邑幸養於沉痾仍再領於祠庭遂十更於嵗籥頃自受命先帝俾刋舊聞逮陛下之纉圖發徳音而繼至而臣􅂝槀在外奏篇未經盖簡冊之浩繁致嵗時之淹久雖官守無事慙四體之不勤而史學紬書實寸隂之是惜懼先溝壑以負恩私乆去班行顧其佗而無補坐糜禄廪嘗自訟而靡遑尚或無厭復求自便輒披私懇輕冒宸嚴豈謂皇帝陛下大徳包荒至明燭逺罔責再三之瀆曲垂開可之私盖特出於異恩故不拘於盡法乾坤至大雖萬物皆遂其生雨露新霑或一夫獨被其澤惟顓愚之無狀容僥倖以兹多臣敢不深戒宴安祗勤夙夜畢精撰述圖報生成進資治通鑑表臣光言先奉勅編集厯代君臣事迹又奉聖㫖賜名資治通鑑今已了畢者伏念臣性識愚魯學術荒疏凡百事為皆出人下獨於前史粗甞盡心自㓜至老嗜之不厭每患遷固以来文字繁多自布衣之士讀之不徧况於人主日有萬機何暇周覽臣常不自揆欲刪削冗長舉撮機要専取闗國家興衰繫生民休戚善可為法惡可為戒者為編年一書使先後有倫精粗不雜私家力薄無由可成伏遇英宗皇帝資睿智之性敷文眀之治思厯覽古事用恢張大猷爰詔下臣俾之編集臣夙昔所願一朝獲伸踊躍奉承惟懼不稱先帝仍命自選辟官屬於崇文院置局許借龍圖天章閣三館秘閣書籍賜以御書筆墨繒帛及御前錢以供果餌以内臣為承受眷遇之榮近臣莫及不幸書未進御先帝違弃羣臣陛下紹膺大統欽承先志寵以冠序錫之嘉名每開經筵常令進讀臣雖頑愚荷兩朝知待如此甚厚隕身喪元未足報塞苟智力所及豈敢有遺㑹差知永興軍以衰疾不任治劇乞就冗官陛下俯從所欲曲賜容養差判西京留司御史臺及提舉嵩山崇福宫前後六任仍聴以書局自隨給之祿秩不責職業臣既無佗事得以研精極慮窮竭所有日力不足繼之以夜徧閱舊史旁采小說簡牘盈積浩如煙海抉擿幽隠校計毫釐上起戰國下終五代凡一千三百六十二年修成二百九十四巻又畧舉事目年經國緯以備檢尋為目錄三十巻又參考羣書評其同異俾歸一塗為考異三十巻合三百五十四巻自治平開局迨今始成嵗月淹久其間牴牾不敢自保罪負之重固無所逃中謝重念臣違離闕庭十有五年雖身處于外區區之心朝夕寤寐何嘗不在陛下之左右顧以駑蹇無施而可是以専事鉛槧用酬大恩庶竭涓塵少禆海嶽臣今筋骸癯瘁目視昏近齒牙無㡬神識衰耗目前所為旋踵遺忘臣之精力盡於此書伏望陛下寛其妄作之誅察其願忠之意以清閒之燕時賜省覽監前世之興衰考當今之得失嘉善矜惡取是捨非足以懋稽古之盛徳躋無前之至治俾四海羣生咸蒙其福則臣雖委骨九泉志願永畢矣賀立皇太子表臣光言伏覩制書節文皇太子延安郡王傭可立為皇太子仍賜名煦者主器惟長立邦家之基錫命以時為社稷之福中謝竊以天意與子人情愛親三王以来百世不易伏惟皇帝陛下光紹前烈濬發逺猷仰尊宗廟之嚴俯眷烝民之重寵建上嗣誕告多方離日昭布於重光震雷何啻於百里封畛之内聲教所覃凡有識知孰不鼔舞况臣叨居近列夙受大恩喜聞徽音逺踰庶品元豐八年三月奔國喪太皇太后遣入内供奉官梁惟簡宣諭邦家不幸大行升遐嗣君冲㓜同攝國政公厯事累朝忠亮顯著毋惜奏章賛予不逮謝宣諭表元豐八年三月二十三日上臣光言今月二十二日入内供奉官梁惟簡傳太皇太后陛下宣諭以臣厯事累朝令毋惜奏章者中謝臣文學政事一無所長䝉仁宗皇帝擢寘侍臣英宗皇帝引為學士大行皇帝初登宸極召入翰林繼處憲臺又承人乏俾貳樞府臣荷累聖大恩無以為報惟竭惷愚時進狂瞽秪知推誠不識忌諱每荷矜容未甞譴黜屬者大行皇帝遘疾彌留深惟萬㡬之重請陛下權同處分上天降禍奄及大故陛下建立聖嗣綏寧中外民物咸若神祗恊從此皆陛下之淵謀羣生之厚幸臣以進懷先帝盛徳奔赴闕庭上欲一望梓宫少展臣子之哀誠即退歸洛邑復就冗官不意陛下過有聴采特降中使曲加奬飾待以耆舊許之盡言臣聞商書曰木從䋲則正后從諌則聖后克聖臣不命其承陛下實有聖徳知所先務聴政之初首開言路臣本何人齒􅄠衰朽精力昏耗有何才識克堪兹任但冀天下之士由此識陛下之心嘉言響應正論輻凑民間疾苦何患不聞國家紀綱何患不治斯乃宗廟社稷之靈四海羣生之福豈伊㣲臣獨為慶幸謝門下侍郎表臣光言近上表辭免新除門下侍郎恩命伏奉批答不允者母慈臨御嗣聖亮隂登進弼臣眷求舊物才非稱任辭不獲從中謝伏念臣出自諸生幸承素業守泥古之朴學乏經世之逺猷逮事仁皇備員諌省容逆鱗之愚直無補衮之嘉謀㑹英祖之纂承進河圖之近宻最膺異禮深亮孤忠及先皇即政之初被内相代言之命委司天憲擢貳樞鈞終獲遂於懇辭盖曲成於志守而臣㳙埃㒺效精力早衰出守無能分臺得請留連祠館荏苒嵗華不圖仙駕之升永絶清光之望伏遇皇帝陛下丕承洪緒寅御中區訪落之謀亟先於羣辟賜還之詔屢出於中宸起於林壑之中處以廟堂之上矧今始初政事綏靖邦家四方翹首以向風萬姓傾心而聴上斯乃君臣儆懼之日宗社安危之機必得非常之才以濟維新之治臣避命弗獲居寵為憂謹當承元首之明竭股肱之力庶圖薄效仰答鴻私臣無任戴天荷聖激切屏營之至上皇帝謝賜生日禮物表臣光言伏蒙聖恩以臣生日特降詔書賜臣米麵羊酒者使車傳命宸檢頒恩乃眷㣲生特推異數中謝伏念臣本由孤進厯事先朝屬睿哲之統臨承賛襄之乏使無嘉謀之云補有素食之深譏適當生育之辰倍切劬勞之感累茵列鼎思負米以難追立身揚名在顯親而何有敢煩君賜下逮家庭雖邦禮之有常在臣愚而曷稱此盖伏遇皇帝陛下寵優近列仁育羣生隆餼廪之多儀廣雲天之麗澤先事後得顧慙錫與之榮移孝為忠誓竭糜捐之節上太皇太后謝賜生日禮物表臣光言伏䝉聖慈以臣生日特降詔書賜臣米麵羊酒者至仁垂眷多物分頒拜賜惟優汗顔有靦中謝伏念臣器能淺陋術學迃踈仰膺簡注之隆進備弼諧之職適及始生之旦復叨厚下之恩及飬無因感劬勞於兹日致禮有秩䝉慶澤以自天此盖伏遇太皇太后陛下坤厚兼容母慈廣被重近司之責任推異數以勸官特加餼廪之儀以示寵光之渥所生無忝敢忘夙夜之勤来事可為益圖忠義之報上皇帝辭免正議大夫表臣光言伏奉制命特授臣正議大夫者中天霈澤近輔書勞亦及罔功豈宜虚受中謝伏念臣素無佗技唯繫孤忠誤䝉累聖之知寢服近僚之列頃因人乏進貳宰司先帝審訓羣臣靡預誓言之末陛下嗣膺大寳曾無翊戴之勤豈弗畏於名言詎敢當於懋寵矧乃方任人而立政惟即命以記功將深戒於官師宜先從於近始伏望皇帝陛下慎司名器申勸臣鄰收出綍之過恩亮循墻之愚懇爵惟馭貴免上累於至公賞必及勞盖率由於舊典上太皇太后辭免正議大夫表人惟圖舊賞貴及勞義所當辭情難冒處中謝伏念臣早縁末學被遇累朝乏稽古之令猷無致君之逺業入陪經幄乆親日月之光出領祠宫實荷雲天之庇㑹慈宸之御極登嗣聖以承祧徒膺乏使之求進預同寅之列屬寵褒於近弼特序進於文階顧無横草之勤均被出綸之渥輿情共駭内忪靡遑伏望太皇太后陛下洪造聴卑至明燭隠慎守馭臣之柄無輕出器之名昭示大公輟已行之成命少安愚分息被已之深譏上皇帝謝轉正議大夫表臣光言伏奉告命授臣正議大夫上表辭免奉批答不允仍斷来章者離明繼照兊澤旁流祗受已還震惶無措中謝臣聞以資詔爵則民興忠誼眡功為賞則下絶覬覦故徳盛者其位隆力勤者其報厚勸沮斯在授受靡虚伏念臣學不適時才非經世謬塵近列最後諸臣辱體貎之兼隆竭股肱而無補屬舉懋官之典咸疇衛上之方績用蔑聞褒章誤及雖危誠之備列終成命之莫回居寵無名在顔有靦此盖伏遇皇帝陛下馭臣惟禮厚下以仁優其進等之恩責以致身之節乾坤至大均覆載以不遺日月無私委照臨而盡及永圖報塞唯􅊎糜捐上太皇太后謝轉正議大夫表明綸誤及渙汗難收弗獲懇辭終慙冒處中謝伏念臣自陪機政無補聖猷雖夙夜以自强惟事功之匪立每流年之是惜加衰疾之所嬰敢以瘝官復當懋賞是以歴陳故實備述悃誠荐奉詔音兩紆使節對天威之咫尺煩睿訓之丁寧循走無從强顔祗受此盖伏遇太皇太后陛下至仁勤施大徳兼容推均一於鳲鳩昭忠厚於行葦體乾坤之覆育品物不遺並日月以照臨光明下濟誓殫駑力仰答鴻恩謝起居減拜表臣光言伏准閤門告報今月十四日内降以臣與吕公著近各推恩轉官所有將来正謝特令兩拜起居餘免舞蹈仍於執政官班次後别作一班及自今後凡遇前殿應于大起居特令别作一班止兩拜起居恩出非常禮加異數優假太過慙負愈深中謝臣猥以𤨏才預聞機政去春以後疾疹屢生入冬以来飲食漸少迨茲嵗序之首頓覺筋力之衰拜起絶艱朝請殆廢内惟恩紀之重天地所不能踰退思績效之㣲絲毫未嘗有立欲避位則為罪益大欲就列則强力不前朝夕為衆目所觀啓處無措躬之地敢謂皇帝陛下太皇太后陛下仁霑枯朽明燭幽㣲特虧著定之儀曲遂形骸之便臣詢諸故老或謂有舊章然彼皆位躋宰輔之崇徳著耆眀之美豈臣么麽所敢比方欲辭則實所不支欲受則自知非分踧踖心悸戰兢汗流惟仰賴於寵靈冀有瘳於藥物病庶遄已禮得如初期於竭忠不敢愛死奏彈王安石表熈寧三年御史中丞光等累次全臺上疏叅知政事王安石不合妄生姦詐熒惑聖聰及公亮等各務依違未曾辨正乞眀其罪不䝉施行竊以易喻履霜示為君制臣之術書戒作福眀凶國害家之常易書之義其知㡬乎君子見㡬不俟終日是以自古君無過失而臣不姦欺盖知其㡬而遏其端也伏遇陛下即位以来日慎一日聞過則喜從諌如流四方翹企以望太平萬俗謳謡而陶羙化其以用安石為相斯見陛下焦中心而求治急先務以濟時者也而安石備政府必當輔國以伊周之道致時為堯舜之民發政施仁俾合輿意而安石首倡邪術欲生亂階違法易常輕革朝典學非言偽王制所誅非曰良臣是為民賊而又牽合衰世文飾姦言徒有嗇夫之辨談拒塞爭臣之正論加以朋黨鱗集親舊星攅式備近畿或居重任窺伺神器専制福威人心動揺天下驚駭苟陛下不遏其端則安石為禍不小夫書易之戒正急於斯且陛下以安石有師保之尊故舊之恩俾為相臣使預政事昔漢尊桓榮徒聞設几燕貴鄒衍惟見築宫豈有俾居顯重而妄使改為若不正其罪惡亦難以順乎衆意臣職居御史身為諌官非不能希意苟合以求寵榮盖以立君朝者當勵已以去邪食君祿者必輕身而為國臣之與安石猶冰炭之不可共器若寒暑之不可同時是以屢犯天顔輒陳狂瞽心既為國寧復愛身苟今日蒙鈇鉞之誅勝異日死賊臣之手伏願陛下獨􅁬乾剛専行夬決一遵祖憲無用邪謀誅逐亂臣延納正士上以順皇太后之意下以慰億兆人之心則臣等退就誅戮亦所甘心謝賜銀絹表臣光言伏䝉聖慈以臣編修百官年表成書特降詔奬諭仍賜臣銀一百兩絹一百匹者奏篇甫上褒詔爰頒荷寵若驚省躬無措中謝伏念臣淺才末學庸識卑辭乆塵侍從之班曾乏猷為之補頃膺睿㫖俾纂舊章恭惟祖宗創業垂統之難邦國立政任官之要必表年而紀月可鑒古以驗今畧舉宏綱庶存成式淹留累嵗銓次終篇仰稽乙夜之觀方虞曠職之咎豈期温詔發自淵𠂻錫外府之兼金加丘園之賁帛載惟虚受彌切靦顔此盖皇帝陛下順考百王丕承列聖剛健而篤學緝熈於光明眷執簡之㣲勤形賛書之重奬寵踰華衮既稽首以拜嘉賜厚百朋實無功而冒賞傳家集巻十七欽定四庫全書傳家集巻十八宋司馬光撰章奏一論兩浙不宜添置弓手狀先公知杭州為作臣竊􅀚兩浙一路與佗路不同臣謹條列添置弓手不便事件如左伏惟聖恩省察少加詳擇焉當今西戎梗邉三方皆聳人心易動當務安之一旦異常詔書大加調發擐甲執兵學習戰陳置指揮使節級等名目頗似軍法以為欲傚河北陕西㳂邉郷兵謂國家以權計㸃之假名捕盜漸欲收為卒伍戌守邉防吴人輕怯易惑難曉道聴塗說衆情鼎沸至欲毁體捐生竄匿山澤臣雖明加告諭嚴行止約愚民無知不可户說誠恐􅏔㸃之後揺動生憂其不可一也吳越素不習兵以故常少盗賊不過聚結朋黨私販茶鹽時遇官司徃徃鬭敵在於兩浙最為劇賊然皆權時則合事訖則㪚不能乆相屯結又無銛利兵器止偷商稅不敢剽掠平人近年以来雖亦頗有强盗然比諸内地要自稀踈今避差㸃者若竄匿無歸必列為冦加以弓矢刀鋸之類許其私置自今以後賊盗必多及私販茶鹽之徒皆有利兵拭拒吏士益難擒討積㣲至著漸不可乆其不可二也姦吏貪饕惟利是務不畏法令不顧公議幸得因縁惟喜多事今計杭州管界當差若干人他州比卒大凡有㡬縣胥里長於兹相慶民既憂愁而又脅之煩苦不安而又擾之所規自潤豈顧其外雖朝廷重為懲禁特倍常科長吏勞心不能悉察厚利所誘死亦冒之加以版籍差誤户口異同毫釐不當互相告决追呼無時獄訟不歇則民末暇為公上給役而先困於貪吏之誅求矣此之極擾勢不能免其不可三也民皆生長畎畂天性戇愚所知不過播種之法所識不過耒耜之器加之吳人駑弱天下所知一旦使棄其所工學所不能徒煩教調終無所成就其有成不堪施用則是虚有煩費而與不添置無異其不可四也吳子夀夢以前世服於楚自申公巫臣得罪于楚逃奔于晉為晉聘吳教之乗車教之戰陳其後楚人戎車嵗駕早朝晏罷奔命不息以至吳亡自是以来號稱輕狡逺則劉濞近至錢鏐其間承風倔强無數豈唯其人之跋扈亦由習俗之樂亂也幸頼祖宗之馴致陛下之敦化至徳之釀淪於骨髓暴亂之風移變無迹此皆上天降祐前世所不能庶㡬者也今忽無故黷玩威稜狎侮危事示以逆徳弄之凶器生姧回之心啟禍患之兆臣恐以久非國家之至便所以萬全而無害其不可五也方今兩浙雖水旱稍愆未至流殍閭閻無事盗賊不添縱使有之舊来吏士隨發擒討甚有餘力不假更求正恐平居興役有害無益而已臣職忝宻近官備藩方不敢黙黙理湏上列伏望陛下特令兩浙一路更不添置或以事湏過防舊人太少則乞只依近降敇命量加添補更不立指揮使等名目閱習諸事一如舊規貴得衆情大安别無生事為孫太􅀶乞免廣南轉運判官狀臣昨自滑州簽判就除本州通判未及半嵗今又䝉恩授前件差遣於臣忝冒實踰涯分供命陳力豈宜復辭嚮若止臣一身﨑嶇困苦雖更逺役靡不甘心敢以㣲誠輕煩聖聴念臣二親垂白思戀郷里兩任滑州去家差近迎侍朝夕徃来如意甘脆供湏頗為私便一日離側倚門致念况復貪榮逺從吏道其在人子何心自安轉運判官國家近置推擇委任務在得人以臣愚疎恐難堪稱伏惟聖慈詳求幹敏授以此職令臣且充滑州通判終滿一任庶得官政無廢侍養不闕君親之際恩義兩全棄骨殫身竭云補報論屈野河西修堡狀嘉祐二年上竊以為人臣者事君不避難有罪不逃刑臣先任通判并州軍州事日准經畧司牒差徃麟州勾當公事其屈野河西一帯田土積年以来為夏虜所侵臣委曲詢訪本州當職官吏以虜之侵盗為日已久諭之以理則不肯退縮逼之以兵則動成戰闘召之重定界至則偃蹇不来春種秋穫無有已期如何區處可以不戰而得所侵之地其本州官吏為臣言州城之西臨屈野河自河以西直抵界首五六十里並無堡障斥堠以此虜得恣耕其田遊騎徃徃直至城下或過城東州人不知去嵗已於河西置一小堡以處斥堠之人亦曽申經畧司乞於其西増置二堡㑹今春以来虜騎屯聚徧滿河西經畧司牒令候西人退散别申取指揮今虜衆盡已退去自州城以西至大横水浪爽平數十里間絶無一人一騎若乗此際急於州西二十里左右増置二堡每堡不過十日可成比至虜中再行㸃集此堡已皆有備虜不能為害如此則麟州永無侵軼之虞州兵出入有所宿頓堡外先侵之田虜皆不能耕種臣之愚心亦為國家固爭屈野河西田者非少此尺寸之地盖以虜侵耕至河則麟州孤危果能成此二堡以為麟州耳目藩蔽於事誠便遂歸具以官吏所言白於龎籍籍用臣言即牒麟州令依前申修築二堡仍令精加探候廣設隄備戒諭約束莫非丁寧盖欲乗間急修故不暇取㫖俟報但曾奏知而已不期牒到之後元未興修虜衆已復大集於五月五日彼處兵官引一千許人夜開城門徑徃屈野河西前無探候後無䇿應中無部伍但齎酒食不為戰備以此逄敵如何不敗遂令所謀之事悉皆無成此乃諸将恃勇輕敵臨事無備之所致本非修堡之過况自元昊納欵以来麟州修建堡塞及出兵過屈野河西前後非一雖與虜遇未甞敗北明知今日之敗在於無備不在修堡與過河也然臣竊聞議者乃以龎籍為擅修堡寨引惹邉事臣伏自惟省本因臣與麟州官吏商量傳道其言逹於龎籍籍未甞身至河西周知利害皆臣愚戇思慮不熟輕議大事當伏重誅今乃使議者悉歸咎於龎籍臣豈敢晏然不言苟求自脫上負聖朝死有餘責臣雖小人義不忍為伏望陛下察龎籍本心欲為國家保固疆圉發於忠赤不顧身謀過聴臣言以至於此獨治臣罪以正典刑雖蹈鼎鑊亦無所恨論屈野河西修堡第二狀臣先曾奏陳為麟州修堡事乞獨治臣罪至今未奉朝㫖今竊知龐籍移知青州夏倚等各有責降臣伏自惟念若朝廷不以修堡為非龐籍等必不受責若以為非則龐籍先已指揮麟州罷修此堡因臣至彼見虜騎退散方議再修武戡夏倚等雖建此䇿因臣至彼傳道其言方得逹於龐籍由是言之修堡之事皆臣所致若治其罪臣當為首今龐籍等先受其責而臣未䝉譴罰臣實内慙無以自處况臣在并州日受經畧司牒管句本司要重公事龐籍凡處置邉事未甞不詢及於臣采用其說臣亦夙夜竭盡愚慮知無不言庶㡬恊心禆補國家有萬一之益今乃以智識淺短思慮不精上為朝廷之憂下為龐籍之累若復苟求自脫不即大誅是臣以蕞爾之軀虧國家至平之法罪釁愈重不容於死伏望聖慈察臣前後所陳本宗事理嚴賜誅譴以正刑書臣不勝幸甚論麥允言給鹵簿狀奉聖㫖麥允言有軍功特給鹵簿昔仲叔于奚有功於衛衛人使之繁纓以朝孔子曰惜也不如多與之邑惟器與名不可以假人夫爵位尊卑之謂名車服等威之謂器二者人主所以保畜其臣而安治其國家不可忽也今允言近習之臣非有元勲大勞過絶於人而贈以三公之官給以一品鹵簿其為繁纓不亦大乎陛下雖欲寵秩其人而適足增其罪累也何則三公之官鼎足承君上應三台鹵簿者所以褒賞元功皆非近習之臣所當得者陛下念允言服勤左右生已極其富貴死有以三事之禮為之送終鼓吹簫鐃烜赫道路是則揚其僣侈之罪使天下側目扼腕而疾之非所以為榮也惟陛下御仲叔于奚之傳垂意孔子之言則知名器之重不可加非其人況唐制羣臣於國立大功者婚葬則給鹵簿餘不在給限伏望陛下追寢前命其麥允言更不給鹵簿毋使天下之人竊敢指目以為朝廷過舉不勝幸甚乞印行荀子揚子法言狀皇祐二年上臣伏以戰國以降百家蠭起先王之道荒塞不通獨荀卿揚䧺排攘衆流張大正術使後世學者坦知去從國家愽采藝文扶翼聖化至於莊列異端醫方細伎皆命摹刻以廣其傳顧兹二書猶有所闕雖民間頗畜私本文字訛誤讀不可通誠恐賢逹之言寖成廢缺今欲乞降下崇文院將荀子揚子法言本精加考校訖雕板送國子監依諸書例印賣臣愚懵不逹大體不勝區區貪陳所見修築皇地祗壇狀皇祐三年五月上奉聖㫖依謹按唐郊祀錄方丘八角三成每等髙四尺上濶十六歩設八陛上等陛廣八尺中等陛廣一丈下等陛廣一丈二尺今皇地祗壇四角再成面廣四丈九尺縱四丈六尺上等髙四尺五寸下等髙五尺方五丈三尺陛廣三尺五寸平漫無墄大抵卑陋不與禮典相應伏以王者父天母地天地之尊禮相亞埒今圓丘之制極為崇峻獨於方丘有所闕畧未稱國家嚴恭眀察之意伏乞下有司依唐郊祀錄制度增修庶合典禮論劉平招䰟塟狀皇祐三年八月上准樞宻院批送下國子慱士劉慶孫等奏狀六月二十三日進呈奉聖㫖送太常禮院詳定聞奏臣等謹按延陵季子曰骨肉歸復于土䰟氣無所不之是故聖人作為丘壠以藏其形作為宗廟以饗其神形之不存塟將安設今劉平沒身虜廷喪柩不返其子不忍封樹之不立哀展省之無所欲虚造棺槨招䰟假塟朝廷下之禮官令檢詳故實臣等按晉世袁瓌賀循等議以為非身無棺非棺無槨苟無喪而塟招幽䰟氣於徳為愆義於禮為不物當時詔書明有禁約今劉慶孫等所請招䰟塟不可聴許所有将見贈官品定諡則乞依條例施行論張堯佐除宣徽使狀皇祐二年十二月上臣聞明主勞心力以求諌和顔色而受之士猶畏懦而不敢進又况震之以威壓之以重而望忠臣之至直言之入難矣臣之不忠言之不直而天下安萬事治者未之有也臣竊見䑓諌官屢以張堯佐事上言而陛下執之益堅拒之益固前日臺諌官等守閤請對陛下却而不内中外之人莫不駭愕以為異事昔漢元帝欲用馮昭儀兄野王為御史大夫既而疑曰吾恐後世謂吾私於後宫遂不用今堯佐有野王之嫌而無其才陛下不次用之數年間自散郎至宣徽使雖彼實有可稱天下之人安可家至户曉使謂陛下不私後宫哉抑又聞之人有種𤓰而甚愛之者盛夏日方中而灌之𤓰不旋踵而菸敗其愛之非不勤也然灌之不以其時適所以敗之也今陛下貴用堯佐逺過其分天下已側目扼腕而疾之又復摧折忠諌以重其罪是正日中而灌𤓰也臣竊為堯佐寒心而陛下獨不為之深思逺慮哉非獨如是而已前者臺諌官不得對之日隂霧㝠㝠跬歩相失寒冰著木終日不觧臣謹按洪範五行傳聴之不聰是為不謀厥咎急厥罰常寒又按京房書謂之䝉氣此皆隂氣太盛壅蔽陽明上下否塞疑惑不决之象天意昭然有如教語行道之人皆知其意陛下性資純孝嚴恭天命容納直言深明得失此非臣之䛕乃天下所共知也獨柰何以堯佐之故忽天戒而不顧棄人言而不從輕祖宗之爵祿違古今之明鑒書之簡䇿使天下之人有以議聖徳之萬一或累於光融髙大之羙此臣所以日夜痛心疾首寢不能安食不能飽深為陛下重惜者也臣聞臣之事君猶子事父也豈有父獲大謗於外而子不以告且不諌哉惟陛下亟召諌臣使竭其所聞采納其言而慰安其意以厭上天之心觧外廷之惑闢忠讜之路塞寵倖之門則天下歡然歌誦盛徳豈有窮哉昔漢明帝作徳陽殿鍾離意諌即時罷之後乃復作殿成謂羣臣曰鍾離尚書在此殿不成矣然則明帝非不欲為殿也所以屈意罷之者欲全諌臣之節而開直言之端也今臺諌官前後言堯佐者數矣陛下曾不留神省察少為末减以慰其心夫人主所欲為人臣豈能强變之哉顧自今以徃事復有大於堯佐者在列之臣噤嘿拱手視之而已矣此非朝廷之福也不然羣臣猶朽木陛下猶雷霆安可以力校哉惟陛下察之而已矣論夏竦謚狀皇祐四年七月上臣等伏覩故贈太師中書令夏竦以舊在東宫特賜諡文正臣聞大戴禮曰謚者行之迹也行出於已名生於人所以勸善沮惡不可私也臣等叨預禮官諡有得失職所當言不敢隠嘿謹按令文諸諡王公及職事官三品以上皆錄行狀申請考功勘校下太常禮院擬諡訖申省議定奏聞所以重名實示至公也陛下聖徳􅆂容如天如地哀愍舊臣恩厚無已知竦平生不恊羣望不欲委之有司槩以公議且將揜覆其短推見所長故定諡於中而後宣示于外臣等謂猶宜擇中流之諡使與行實粗相應者取以賜之亦非羣臣所敢議也今乃諡以文正二者諡之至羙無以復加雖以周公之材不敢兼取况如竦者豈易克當所謂名與實爽諡與行違傳之永乆何以為法伏以陛下叡智聰明燭見㣲逺如竦所為豈不素聞迺欲以恩澤之私强加美諡雖朝士大夫畏竦子孫方居美仕不敢顯言四方之人耳目炳然豈可揜蔽必曰夏竦之為如是而諡文正非以諡為公器也盖出於天子之恩耳此其譏評國家之失豈云細㢤臣等所以夙夜區區不敢避誅戮之辜怨讐之禍狂僣妄言正為此耳伏乞陛下留神幸察改賜一諡庶恊中外之論以為萬世之法臣等無任懇欵惶懼之至論夏竦諡第一狀奉聖㫖改諡文莊臣等近以故贈太師中書令夏竦賜諡文正輒有奏陳乞賜改更至今未奉諭㫖臣等竊以凡為人臣受祿不必多居位不必髙苟當官不言則刑戮之人也是以夙夜惶懼不敢黙黙伏惟陛下不以鄙賤而忽其言臣等竊迹諡法本意所謂道徳愽聞曰文者非聞見雜愽之謂也盖以所學所行不離於道徳也靖共其位曰正者非柔懦苟媮之謂也盖以詩云靖共爾位好是正直也今竦奢侈無度聚斂無厭内則不能制義於閨門外則不能立效於邉鄙言不副行貌不應心語其道徳則貪滛矣語其正直則回邪矣此皆天下所共聞非臣等所敢誣加也陛下乃以文正諡之臣等戇愚不逹大體不知復以何諡待天下之正人良士哉且陛下所以念竦如此之厚者以竦甞為東宫之臣故也嚮者東宫之臣死而得諡者非一陛下未嘗親有所定至於竦獨不然豈非知竦所為不合衆心邪陛下必以竦為正直無疑則何不委之有司付以公議然則陛下揜覆其短適所以彰之也陛下念竦不已則莫若厚撫其家至於諡者先王所以勸善沮惡非供恩澤之具也議者將以諡為虚名何害借人臣等請試言其害凡國家所以馭臣下者不過禍福榮辱而已若為善者生享其福死受其榮為不善者生遇其禍死蒙其辱天下雖欲不治安何可得已若有不令之臣生則盗其祿位死則盗其榮名善者不知所勸惡者不知所懼臧否顛倒不可復振此其為害可勝道哉虞書曰兢兢業業一日二日萬㡬孔安國傳曰言當戒懼萬事之㣲夫事之方㣲治之易絶及其既著誰得治之况天下之人皆知竦為大邪陛下雖諡之以正此不足以揜竦之惡而適足以傷國家之至公耳且諡法所以信於後人者為其善善惡惡無私也今以一臣之故而敗之使忠良雋傑之士䝉美諡者後世皆疑之則諡法將安用哉臣等所以冒犯天威區區不已與人父子為怨者誠惜國家勸沮大法不可因循虧廢也伏惟陛下憐察少加采擇特依前奏所陳改賜竦諡天下幸甚臣等不勝惶恐待命之至論周琰事乞不坐馮浩狀皇祐四年十二月八日上臣伏奉聖㫖以鏁㕔應舉人周琰重疊用殊字既條制未明試官不申請定奪臣與馮浩各特罰銅五斤放仰荷含貸喜懼無量然臣昨在武成王廟考試之時其周琰所用殊字浩本疑不係重疊用韻由臣愚懵鑒别不精觀琰程試不見所善又據條制但言重疊用韻不云用佗韻引而恊之者非由此堅執輒行黜落鹵莽之罪盡皆在臣今浩與臣一例受罰臣雖無似能不愧心伏望聖慈特賜矜察與免馮浩責罰於臣更加嚴譴各得其分誠不敢辭奏乞移髙禖壇狀皇祐三年十二月上准敇節文髙禖壇地下仰依典故增修今據濠寨張徳等計料填疊修築都役右具如前竊縁見今所置髙禖壇處地勢極下若就彼填疊不惟功費甚大兼夏秋霖潦四集未免浸漬謹案北齊之制髙禖為壇於南郊傍景祐四年太常禮院修定儀注約用此制今来若於南郊壇傍一二里以来别踏行髙燥地修築上件髙禖壇則功費絶少又免水患參考禮典亦無所違如允所奏云云傳家集巻十八欽定四庫全書傳家集巻十九宋司馬光撰章奏二請建儲副或進用宗室第一狀至和三年六月十九日上是嵗仁宗違豫不臨朝者累月國嗣未建天下寒心中外之臣勇悍不屈素以忠直自負如唐介等皆莫言惟范景仁時為諌官首建此議光聞而繼之第一狀留中第二狀第三狀降付中書竊以人臣之進言者捨其急而議其緩則言益繁而用益寡矣人君之聽納者忽其大而謹其細則心益勞而功益淺矣故明主不惡逆耳之言以察治亂之原忠臣不避滅身之禍以論安危之本是以上下交㤗而事業光美也臣竊見陛下自首春以來聖體小有不康天下之人側足而立累氣而息恟恟憂懼若蹈冰炭間者雖已痊平而民間猶有妄為訛言以相驚動者雖有司以嚴刑束之彼口不得言中心惶惶何所不慮邪陛下胡不試思其所以然者何哉豈非儲貳者天下之根本根本未定則衆心不安也賈誼有言抱火厝之積薪之下而寢其上火未及然因謂之安當誼之時漢孝文帝春秋鼎盛有孝景以為之太子中外乂安公私冨溢誼猶有是言使誼處於今日當云何哉陛下好學多聞博覧經史試以前古之事質之治亂安危之幾何嘗不由繼嗣哉得其人則治不得其人則亂分先定則安不先定則危此明白之理皎如日月得失之機間不容髮於朝􅋝至大至急之務孰先於此而陛下晏然不以為憂羣臣愛身莫以為言此臣所以日夜痛心疾首忘其身之踈賤而不顧鼎鑊之罪者也伏惟陛下哀而察之今夫細民之家有百金之寶猶擇親戚可信任者使謹守之况天下之大乎三代之王以至二漢所以能享天之禄若是其乆者豈非皆親任九族以爲藩輔乎使親者猶不可信則踈者庸足恃乎臣竊惟陛下天性純孝振古無倫事無大小闗於祖宗者未嘗不勤身苦體小心翼翼以奉承之况所受祖宗光明盛大之基業豈可不為之深思逺慮措之於安平堅固之地以保萬世無疆之休哉臣聞天子之孝非若衆庻止於養親而已葢將慎守前人之業而傳於無窮然後為孝也故經稱天子之孝曰德教加於百姓刑于四海諸侯之孝曰保其社稷而和其民人卿大夫之孝曰守其宗廟士之孝曰保其禄位而守其祭祀庶人之孝曰謹身節用以養父母此皆聖人之言非臣之狂瞽也今陛下所以奉事祖宗其道至矣若獨於此未留睿意早定大議則曏時純孝巍巍之德皆無益矣此天下所共為陛下重惜非特愚臣而已臣聞禮大宗無子則同宗為之後為之後者為之子也故為人後者事其所後禮皆如父所以尊尊而親親也伏惟祖宗受天明命功德在人本支百世子孫千億而陛下未有皇嗣人心憂危伏望陛下深念祖宗之艱難基業之閎美神噐之大寳蒼生之重望勿聽苟且之言勿從因循之計斷自聖志昭然勿疑謹擇宗室之中聪明剛正孝友仁慈者使攝居儲貳之位以俟皇嗣之生退居藩服儻聖意未欲然者或且使之輔政或典宿衛或尹京邑亦足以鎮安天下之心如此則天神地祗宗廟社稷實共頼陛下聖明之德况羣臣兆民其誰不歡呼鼔舞乎昔魯漆室之女憂魯君老太子㓜彼匹婦也猶知憂國家之難葢以魯國有難則身必與焉故也况臣食陛下之禄立陛下之朝又得承乏典册之府比於漆室之女斯亦重矣誠不忍坐視國家至大至急之憂而隠黙不言臣誠知言責不在臣言之適足自禍然而必言者萬一冀陛下采而聽之則臣於國家譬如螻蟻而為陛下建萬世無窮之基救四海生民之命臣榮多矣願陛下勿以臣人㣲位賤謂之狂狷而忽之試以臣言自為聖意延問大臣忠於社稷者儻以為非臣請伏妄言之誅倘以為是願陛下决志而速行之焚臣此奏勿以示外足以明臣非敢徼兾毫釐之幸也虞書曰勑天之命惟時惟幾陛下當此之時變危為安變亂為治易於反掌若失時不斷使天下之人有以議陛下之純孝者則臣雖欲畢命捐軀以報陛下亦無及已臣不勝區區憤懣之誠干冒冕旒伏地待罪請建儲副或進用宗室第二狀臣先於六月十九日輙以瞽言干犯聖德伏地傾耳以俟明詔於今月餘一無所聞陛下寛仁不加誅於狂愚之臣然亦未賜采納臣竊自痛人品猥細言語吃訥不能發明國家安危大體致陛下輕而棄之此皆臣之罪也雖然臣性誠愚位誠賤而意誠忠語誠切願陛下不以人之愚賤而廢忠切之言少留聖心於宗廟社稷之至計則天下幸甚竊以為國家者政有小大事有緩急知所先後則功無不成議者或曰當今之務大而急者在於水災氾溢是大不然彼水災所傷不過汚下及濵河之民若積雨既止有司少䟽而塞之則民皆復業豈能為國家之患哉又曰然則在於糓帛窘乏是又不然夫以四海之冨治平之乆若養之有道用之有節使良有司治之糓帛不可勝用也豈能為國家之患哉又曰然則在於戎狄侵盗是又不然夫戎狄侵盗不過能驚擾邉鄙之民若禦之有道備之有謀可使朝貢相繼豈能為國家之患哉以臣之愚當今最大最急之患在於本根未建衆心危疑釋此不憂而顧憂彼三者是捨其肺腑而救其四肢也不亦左乎借有髙才之臣能復九河之道儲九年之食開千里之邉而本根未建猶無益也况復細於彼三事者烏足道哉今陛下聖體雖安四方之人未能遍知尚有疑懼者陛下不以此時早擇宗室之賢者使攝居儲副之位内以輔衛聖躬外以鎮安百姓萬一有狂妄之人出於意外喧譁驚衆雖知萬全無慮然亦豈可不過為之防哉臣竊意陛下聖智聪明洞照安危䇿慮已定而尚密之未欲宣示於外審或如此亦恐不可何則今天下之人企踵而立抉耳而聽以湏明詔之下然後人人自安又何待而宻哉若以儲副體大非造次可定者或且使之輔政或典宿衛或尹京邑亦是以遏禍難之原靖中外之意今安危之幾間不容髪日失一日貴在及時而朝廷置之意外不為汲汲朝夕所議大抵皆目前常事非甚大而急者臣恐髙拱雍容養成國家之患從而理之用力難矣此臣所以日夜區區寢不能安食不能飽不避死亡之誅進言不已者也伏望陛下察其愚衷特賜詳擇臣前日所奏及今狀内事理稍有可施行者乞决計而速行之以安天下元元之心然後理臣僣妄建言之罪不敢辭也請建儲副或進用宗室第三狀臣先於六月十九日八月一日兩曽上言乞擇宗室賢者進而用之葢以上則輔衛聖躬下則鎮安百姓迄今未聞聖朝少垂采聴臣誠愚昧不逹國家髙逺之意若臣所言非邪當明治其罪以示天下若其是邪亦謂聖心不宜棄忽豈可直以臣之愚賤不察其言若投羽毛於滄海之中杳然莫知其所之豈踈逺所望哉臣不勝憤懣敢復剖析肝膽陳布以聞雖抵罪萬死亦無怨悔臣聞書曰逺乃猷詩云猶之未逺是用大諌凡國家之弊在於樂因循而多忌諱不於治安之時豫為長逺之謀此患難所從而生也竊觀漢室以至有唐簡䇿所載帝王即位則立太子此乃古今不易之道也其或謙譲未暇則有司請之所以尊宗廟重社稷皆國家莫大之慶未聞人主以為諱惡也及唐中葉以來人主始有惡聞立嗣者羣臣莫敢發言言則刑戮隨之是以禍亂相尋不可復振殊不知本强則茂基壯則安此乃國家所當深鍳而不足以為法也今天下之人上自公卿下至庻人苟有知識忠於國家者其心皆知當今之務無此為大無此為急然而各畏忤㫖之誅莫敢進言臣獨不愛犬馬之軀為陛下言之陛下豈可不少留聖思而聽察之邪臣嘗歴觀春秋以來迨至國初積一千六百餘年其間天下混一内外無患兵寢不用者不過四百餘年而巳至如聖朝芟夷僣亂一統四海内平外順上安下和使在朝在野之人自祖及孫耳目相傳不識戰鬬葢自上世以來治平之乆未有若今之盛者也臣竊見國家於州縣倉庫斗糧尺帛未嘗不嚴固扄鐍擇人而守之况如是融明閎茂之業豈可不謹擇親戚可信任者使助陛下守之乎此則賢愚之人所共為陛下重惜者也陛下當此之時頥指如意不早决至䇿以固萬世不㧞之基獨不念太祖太宗跋履山川經營天下真宗宵衣旰食以致太平之艱難乎此臣所以夙夜遑遑起則思之卧則夢之感嘆涕泗不能自已不避煩凟之誅再三進言者也或者謂臣身賤居外而言朝廷之事侵官也臣愚以為治古諫諍無官自公卿大夫士至於庶人百工商旅矇瞍芻蕘無有不得言者所以逹下情而察國政也若置官而守之非其官者皆不得言則下情壅而不通如是則國家雖有迫切之憂行道之人皆知之而在上者莫得聞也此其為害豈不深乎况臣食陛下之禄於今三世矣先臣某以廉直恬退特為陛下所知擢自孤㣲升之侍從此恩之重子子孫孫何時敢忘而又陛下曏以水災親下明詔延訪中外勤求得失臣獨何人身逄盛際捨此大節隠而不言其餘𤨏碎豈足道哉抑又聞之元后作民父母陛下臣父也安有為人之子見危而不告其父乎伏望陛下察臣區區之心不為私其一身不惜少頃之間取臣前後所奏畧賜省覧其中萬一苟有可施行者乞以陛下之意斷而行之宣告中外使逺近渙然無復憂疑則自然神靈悦於上而災異伏衆庻喜於下而姦宄消至於草木昆蟲靡不䝉被其福其為功業豈不盛哉夫時者難得而易失惟陛下早留神詳察乞虢州第一狀嘉祐三年上右臣不避斧鉞傾瀝危懇臣本貫陜州夏縣丘壟宗族俱在彼中自先臣亡殁及臣服闋以來十有餘年守官未嘗得近鄉里止曽一次請假焚黄得展省墳墓中心念此朝夕不忘近日方欲上煩朝廷陳乞家便一官又為自判吏部南曹未及一年及陜州側近州郡俱未有闕所以未敢陳請今竊知已降勅命授臣開封府推官於臣之分誠為榮幸然臣有此私懇湏至披陳加以禀賦愚闇不閑吏事臨繁處􅇵實非所長必慮不職以煩司寇伏望聖慈特賜矜察除知虢州或慶成軍一次情願守待逺闕庻得近便灑掃光塋或上件處所無闕乞且歸館供職候有闕日特賜差除乞虢州第二狀右臣先䝉恩授臣開封府推官臣為乆不曽到鄉里及自知才性疲駑不任劇職曽奏乞知虢州或慶成軍一次奉聖㫖不許辭免就職以來已踰半嵗體素多病牽强不前竊知虢州即今有闕臣欲乞依前來所奏差知虢州一次或已除人即乞候主判登聞鼔院尚書省閒慢司局有闕日差除一處庻幾守官不至曠敗乞虢州第三狀右臣伏自去嵗聖恩除開封府推官以來臣以乆不到陜州鄉里及資性駑下不任劇職兩曽乞差知虢州或主判登聞鼔院及尚書省閒慢司局不䝉聽許臣以開封府重難之處不敢更有陳請今竊知已降勅命除臣判三司度支句院竊縁臣禀賦愚鈍素無才幹省府職任俱為繁劇去此就彼皆非所冝若貪榮冒居必致曠敗内省僥忝誠不自安欲乞依前來所奏差知虢州或主判登聞鼔院及尚書省閒慢司局若俱無闕則乞知綘州乾州或在京閒慢差遣一次干冒宸嚴臣無任懇切戰汗屏營之至辭修起居注第一狀右臣伏奉勅差臣同修起居注臣性識庸昧學術空淺循塗平進猶懼不稱况記注之職士林髙選若以叙進則先逹尚多若以才升則最出衆下豈敢不自揣度貪冒榮寵内猶愧怍人將謂何承命震恐殆無容措伏望聖慈俯賜矜察更擇時彦以副羣望所有勅臣不敢祗受辭修起居注第二狀右臣伏凖中書劄子不許辭免便令受勅者臣聞人主度才然後授任人臣量能然後就職是以上無曠官下無竊位臣雖愚戇粗識兹義今修注之官日侍黼扆瞻望清光仕進之塗無此為美臣非惡居顯榮樂在踈賤顧以駑下之質不相當稱苟强顔為之不惟取四方觀笑為士友所責亦恐用非其人貽朝廷羞臣愚所慮正在於此是以傾輸悃愊昧死自陳今制㫖益嚴未賜開可臣夙夜震懼不知所圖豈辭語拙訥不能著白將誠信未昭無以感發俯仰惶惑若懐冰炭是用再有披露仰逹天聪不敢避煩黷之誅庻幾逃忝冒之罪所有差同修起居注勅臣不敢祗受乞依前奏更賜擇人臣無任激切俟命之至辭修起居注第三狀右臣伏准中書劄子奉聖㫖令臣依前降指揮不許辭免便令受勅者臣區區之誠屢塵天聽言理鄙拙未䝉采納退自悼懼置躬無所臣雖愚陋豈不知非常之恩不可輕得詔命之嚴不可屢違所以冒犯雷霆祈請不已者誠以人臣之義陳力就列不能者止臣自釋褐從仕佩服斯言奉以周旋不敢失墜仕進本末皆可覆按鄉者承上庠之乏充文館之員補奉常之屬給太史之役未嘗敢以片言避免煩凂朝廷葢以觧摘章句校讎文字考尋儀典編次簡牘苟䇿勵疲駑庻幾可以逃於罪戾是以聞命之始即時就職至於修起居注自祖宗以來皆慎擇館閣之士必得文采閎富可以潤色詔命者然後為之臣自㓜及長雖粗能誦習經傳渉獵史籍至於屬文實非所長雖欲力自切劘求及等軰性有常分不可强勉儻不自惟忖貪冒榮寵異時驅䇿有所不稱使四方之人環視譏笑以為盛明之朝容有竊位之人其為聖化之累豈云細哉如是則雖伏質横分不足以補塞無狀此臣所以夙夜惶悸欲止不能者也且臣前後所陳剖心析膽莫非懇到而朝廷棄置其言曽不之省是不以情實待臣也意者使臣言出於誠陛下矜而聽之足以盡下情從物欲使臣言出於偽陛下亦因而許之足以沮姦回警媮薄臣竊為朝廷計之二者皆未為失也今臣所陳請已及再三而陛下拒之愈堅督之愈急使拳拳之志無以自明豈上下坦然推心相信之道哉臣不勝憤懣伏望聖慈依臣前奏更賜擇人所有同修起居注勅臣不敢祗受辭修起居注第四狀右臣伏䝉聖恩差臣同修起居注已三次奏陳不敢受敕更乞擇人今又准中書劄子奉聖㫖令臣依累降指揮便受勅更不得辭免詔㫖丁寜至於三四而臣偃蹇自遂是謂不恭若正典刑罪死無赦然臣知而不敢避者誠以罪有大於此者故也臣聞虞書曰無曠庻官然則官無鉅細皆分理天職王者猶不敢私非其人况人臣而敢叨居其位乎如是則雖無國討必有天刑臣雖頑愚粗知自愛雖日遷九官所不願也臣嚮辭開封府推官及判三司度支句院朝廷一有指揮不令辭兔臣即時就職豈以材力為足堪其任哉竊自惟度以為朝命已行必不可移雖章奏煩多終無所益是以黽勉從事不敢復言及覩王安石前者差修起居注力自陳愬章七八上然後朝廷許之臣乃追自悔恨曏者非朝廷不許由臣請之不堅故也臣今所以煩凟聖聽不能自巳雖加重誅所不敢逃况王安石文辭閎富當世少倫四方士大夫素所推服授以此職猶懇惻固譲終不肯為如臣空踈何足稱道比於安石相去逺甚乃敢不自愧耻以當非常之命乎使臣之才得及安石一二則臣聞命之日受而不辭今臣内自省循一無可取乃與之同被選擢比肩並進豈不玷朝廷之舉為士大夫所羞哉此臣所以彷徨尤不敢受者也伏望聖慈察臣誠心且令循守舊職更賜推擇當今俊異之人可與安石為比者使同修起居注如此則賢不肖各當其分能不能各適其宜下情獲安衆望為允所有同修起居注勅臣不敢祗受辭修起居注第五狀右臣先奉勅差同修起居注臣四曽上奏乞更擇人今又准中書劄子奉聖㫖令臣依累降指揮更不得辭譲便令受勅供職者臣要領如草芥不足以待斧鉞軀命如螻蟻不足以脂鼎鑊今屢違明詔當伏重誅然臣區區之情亦兾朝廷少賜寛察臣自知材能不足塞職歸情上聞煩凟聖聽至於四五刳肝瀝膽盈巻溢幅臣之情亦極矣臣之辭亦殫矣雖欲重複稱引無以復加而朝廷以臣賤㣲終不知聽臣晝夜憂悸無以自存俯仰三思進退維谷夫詔命至尊㣲臣至卑修注至榮罪誅至辱今臣以卑違尊去榮就辱原其本志豈有他哉正欲朝廷任官皆得其人愚臣處身不失其分而巳若聖恩矜而許之則豈惟愚臣之幸亦可以少有補於國家若章奏煩多而詔㫖不移豈惟使臣獲頑愚不䖍之罪不容於菹醢抑亦恐四方之人謂朝廷之於賢材如臣之比尚足固留也不勝廹切之情伏望聖慈依臣前奏更賜擇人所有同修起居注勑臣不敢祗受傳家集巻十九欽定四庫全書傳家集巻二十宋司馬光撰章奏三日食遇隂雲不見乞不稱賀狀嘉祐六年五月二十八日上是嵗果大雨不見日食不復稱賀自後踵以為常右臣准太常禮院公文司天監奏今年六月朔太陽交食臣伏覩近世以來每有日食之變歴官皆先具月日時刻及所食分數奏聞至日或為隂雲所蔽或所食不滿分數公卿百官皆奉表稱賀以為大慶臣愚以為日之所照周徧華夷雲之所蔽至為近狹今若太陽實虧而有浮雲翳塞雖京師不見四方必有見者此迺天戒至深不可不察臣聞漢成帝永始元年九月日有食之四方不見京師見谷永以為沈湎于酒禍在内也二年二月日有食之四方見京師不見谷永以為百姓屈竭禍在外也臣愚以為永之所言似未恊天意夫四方不見京師見者禍尚淺也四方見京師不見者禍寖深也日者人君之象天意若曰人君為隂邪所蔽災慝明著天下皆知其憂危而朝廷獨不知也由是言之人主尤冝側身戒懼憂念社稷而群臣乃始相率稱賀豈得不謂之上下相䝉誣罔天譴哉又所食不滿分數者歴官術數之不精當治其罪亦非所以為賀也伏望陛下明勅有司若六月一日果有日食之異或四方見京師不見或所食不滿分數皆不得奉表稱賀以重皇天之怒則天下幸甚臣職在禮部掌羣臣慶賀章表不敢不言陳三徳上殿劄子得㫖留中三劄並初除諌官上臣伏䝉聖恩不以臣無似擢臣為諌官臣自㓜學先王之道意欲有益於當時是以雖在外方為他官猶願竭其愚心陳國家之所急况今立陛下之左右以言事為職陛下仁聖聪明求諌不倦羣臣雖有狂狷愚妄觸犯忌悔陛下皆含容寛貸未嘗加罪誠㣲臣千載難逢之際苟不以此時傾輸胷腹之所有以副陛下延納之意則不可以自比於人死有餘罪矣臣竊惟人君之大徳有三曰仁曰明曰武仁者非嫗煦姑息之謂也興教化修政治養百姓利萬物此人君之仁也明者非煩苛伺察之謂也知道義識安危别賢愚辨是非此人君之明也武者非彊亢暴戾之謂也惟道所在斷之不疑姦不能惑佞不能移此人君之武也故仁而不明猶有良田而不能耕也明而不武猶視苖之穢而不能耘也武而不仁猶知穫而不知種也三者兼備則國治彊闕一焉則衰闕二焉則危三者無一焉則亡自生民以來未之或改也臣不勝區區觸死忘生竊見陛下天性慈惠慎㣲接下子育元元汎愛羣生雖古先聖王之仁殆無以過然自踐阼以來垂四十年夙夜孜孜以求至治而朝廷紀綱猶有虧缺閭里窮民猶有怨歎意者羣臣不肖不能宣揚聖化將陛下之於三徳萬分之一亦有所未盡歟臣聞春秋傳曰賞慶刑威曰君臣幸得以修起居注日侍黼扆之側伏見陛下推心御物端拱淵黙羣臣各以其意有所敷奏陛下不復詢訪利害考察得失一皆可之誠使陛下左右前後股肱耳目之臣皆忠實正人則如此至善矣或出於不意有一姦邪在焉則豈可不為之寒心哉夫善惡是非相與混淆若待之如一無所别白或知其善而不能賞知其惡而不能罰則為善者日懈為惡者日勸善者懈惡者勸雖有堯舜禹湯文武之君稷契伊吕周召之臣以之求治猶鑿冰而取火適楚而北行也伏惟陛下少垂聖思以天授之至仁廓日月之融光奮乾剛之威斷善無㣲而不禄惡無細而不誅則唐虞三代之隆何逺之有此臣愚淺所見不敢不陳取進止言御臣上殿劄子得㫖送中書臣聞致治之道無他在三而已一曰任官二曰信賞三曰必罰康誥稱文王之徳曰庸庸祗祗威威顯民言用其可用祗其可祗刑其可刑也臣竊見國家所以御羣臣之道累日月以進秩循資塗而授任苟日月積乆則不擇其人之賢愚而置髙位資塗相值則不問其人之能否而居重職夫人之材性各有所冝而官之職業各有所守自古得賢之盛莫若唐虞之際然稷降播種益主山林垂為共工龍作納言契敷五教臯陶明刑伯夷典禮后䕫典樂皆各守一官終身不易苟使之更來迭去易地而居未必能盡善也今以羣臣之材固非八人之比廼使之遍居八人之官逺者三年近者數月輙已易去如此而望職事之修功業之成必不可得也非特如是而巳設有勤恪之臣悉心致力以治其職羣情未洽績效未著在上者疑之同列者嫉之在下者怨之當是時朝廷或以衆言而罰之則勤恪者無不觧體矣姦邪之臣􅃷竒以譁衆養交以市譽居官未乆聲聞四逹蓄患積弊以遺後人當是之時朝廷或以衆言而賞之則姦邪者無不爭進矣所以然者其失在於國家采名不采實誅文不誅意夫以名行賞則天下飾名以求功以文行罰則天下巧文以逃罪如是則為善者未必賞為惡者未必誅此陛下所以南面孜孜夙夜求治歴載甚乆而太平未效者也陛下誠能慱選在位之士不問其始所以進及資序所當為使有徳行者掌教化有文學者待顧問有政術者為守長有勇略者為將帥明於禮者典禮明於法者主法下至醫卜百工皆度材而授任量能而施職有功則増秩加賞而勿徙其官無功則降黜廢棄而更求能者有罪則流竄刑誅而勿加寛貸如是而朝廷不尊萬事不治百姓不安四夷不伏臣請伏面欺之誅凡臣所言皆陛下耳所厭聞心所素知然致治之要無以易此知之非艱行之惟艱顧陛下力行何如耳敢昧死陳瞽言惟陛下裁擇取進止言㨂兵上殿劄子得㫖送宻院戒揀兵臣僚臣竊聞朝廷近降指揮㨂選諸指揮兵士補填近上軍分其主兵之官惟務人多不復精加選擇其間明知羸弱悉以充數臣以耳目踈短聞之後時不能豫陳可否致事巳施行然其得失利害之明不可不盡為陛下言之徃者不可及來者猶可追也臣竊惟當今國家之患在於士卒不精故四夷昌熾財用不足故公私窘廹今縱不能澄汰衰老以省大費而又平居晏然非有警急坐増無用之衆以長無窮之患臣不知為國計者果如何也方今天下安樂無虞而府庫之積隨得隨散曽無羨餘設不幸有螽螟水旱饑饉相仍盗賊猝起戎狄内侵不知陛下將何以待之此不可不為之先慮也臣竊觀自唐室募兵以來果能得武猛材力之士猶為有益若不擇勇怯而養之臣不知其可也唐德宗以神䇿軍使白琇珪為京城召募使應募者皆市井沽販之人有名無實及涇師犯闕徳宗命琇珪以神䇿軍禦之卒無一人至者徳宗狼狽失據遂幸奉天及五代之際軍政尤紊是以叛亂接迹禍敗相尋周世宗以髙平之戰士卒不精故樊愛能何徽所部先奔歸而大閲諸軍悉簡去老弱選其精鋭以為侍衛親軍由是甲兵之盛近世無比故能南割淮甸北取闗南羣雄畏服所向無敵太祖皇帝受天明命撫有大寶當是之時戰士不過數萬北禦契丹西捍河東以其餘威開荆楚包湖湘巻五嶺吞巴蜀掃江南服吴越太宗皇帝紹丕烈奮神威遂拔晋陽一統四海堂堂之業萬世頼之今天下兵数臣不能盡知竊聞比於太祖皇帝時其多數倍然元昊𦍑戎之竪子智髙蠻獠之㣲種乃敢倔强河西横行嶺表國家發兵討之士卒或望塵奔北或迎鋒沮潰毁辱天威為四夷笑由是觀之養兵之術務精不務多也且今所選之兵升其軍分増其糧賜是冝感戴上恩人人喜悦而竊聞京城之内被選之人徃徃咨嗟悲怨父子相泣况於外方兵士違去鄉里訣别親戚其為愁苦不言可知使中外人情遑遑如此豈惟乆逺之害亦不可不以切近之憂為萬一之慮也兵者國之大事廢興之端安危之要盡在於是臣不知曽與不曽令兩府大臣相與熟議經乆利害然後行之今在京兵士已經㨂上分配諸軍者無如之何其未㨂及外州軍兵士伏望朝廷特降指揮下應係㨂軍臣僚須是一一躬親子細㨂選好人材有膂力及得等様别無羸弱方得㨂上如已經㨂中後朝廷别差不干礙官覆㨂得却有不及等様及羸弱病患之人其元㨂軍臣僚伏乞重行貶竄仍自今後每遇大叚招㨂兵士並湏先令兩府臣僚同共商量度財用豐耗及事之緩急若湏至招㨂方得聞奏施行並戒約㨂軍臣僚務精不務多一如今來指揮取進止論赦及踈決狀嘉祐六年八月十五日上右臣竊以赦者害多而利少非國家之善政也虞書曰眚災肆赦怙終賊刑謂過誤有害則赦之恃惡自終則殺之非不擇罪之有無并赦之也漢大司馬吴漢病篤光武親臨問所欲言對曰惟願陛下慎無赦而巳王符亦曰今日賊良民之甚者莫大於數赦贖赦贖數則惡人昌而善人傷矣蜀人稱諸葛亮之賢亦曰軍旅屢興而赦不妄下然則古之明君賢臣未嘗以數赦為美也國家承順天心子愛百姓發號出令必先至仁然數赦之弊猶未能去又古之赦者其出無常嚴謹周密不可前知姦民猶抵冒以待之况今國家三年一郊未嘗無赦每嵗盛夏皆有踈決猾吏貪縱大為姦利悍民暴横侵侮善良百千之中敗無一二幸而發露率皆亡匿不過周嵗必遇赦降則晏然自出復為平人徃徃指望謂之熱勅使愿慤之民憤邑惴恐㓙狡之羣志滿氣揚豈爲民父母勸善沮惡之意哉且踈決之名本以盛暑之際恐囹圄之中有滯積寃結有司不為申理使無所告愬故天子臨軒親加慮問平其枉直無辜則赦有罪則誅使乆繫之人一朝而決故能消釋沴氣迎致太和非謂不問是非一切縱之也又祖宗之時每嵗不過一次踈決死罪以下皆􅉍降一等近年以來或至再三自徒以下一切赦之今嵗五月以前踈決之令巳再行矣此所以使百職隳慢姦邪恣睢者也今縱未能盡革前弊伏望陛下特降指揮下中書今後每嵗踈決不過一次或早或晩使外人不可豫期其徒罪仍依舊降從杖或遇親祀南郊之嵗更不踈決永為定制庶幾為惡之人不敢指以自寛有所戒懼薦鄭揚庭劄子臣竊見近世以來搢紳之士專尚辭華不務經術先聖㣲言幾成廢墜臣謂苟有盡心修明六藝皆冝甄奬以勵來者伏見并州盂縣主簿鄭揚庭自少及長研精易道譔著所得成易測六巻不泥隂陽不渉怪妄專用人事指明六爻求之等倫誠難多得臣不敢隠蔽輙取進呈伏望聖慈略垂省覧苟有可取量加旌異貴使學者有所勸慕取進止薦劉廱劄子臣伏見西鄙用兵以來草萊之士談兵機獻邉䇿者不可勝紀其間夸誕迃闊不切事情鄙陋膚淺無可觀采者甚衆葢縁邉鄙之事非土著之人耳目習熟則不能究明利病非學古之士歴觀成敗則不能堅定是非竊見并州鄉貢進士劉廱撰成邉議十巻援㩀古今指陳得失用意甚勤論理頗多不敢隠蔽謹具進呈伏乞少賜省覧如有可取欲乞朝廷略加甄奬論舉選狀嘉祐六年八月二十一日上右臣竊以取士之道當以德行為先其次經術其次政事其次藝能近世以來專尚文辭夫文辭者乃藝能之一端耳未足以盡天下之士也國家雖設賢良方正等科其實皆取文辭而巳近以祫享赦節文應天下士人有素敦節行兼通學術乆為鄉里所推者委轉運使提㸃刑獄同加捜訪每路各三兩人仍與本䖏長吏連署結罪保舉聞奏所舉之人朝廷命本州敦遣至則館於太學待遇甚厚考試之際不糊名謄録既而署等補官皆過所望此誠合先王取士之道臣謂國家將除積乆之弊立太平之基天下士大夫皆靡然嚮風矣行之未幾忽聞朝廷一切罷之無不悵然失望臣戇愚不識所謂若以所舉之人多非實有材行則當治舉將之罪别加捜訪豈可以一二人謬濫廢天下之舉賢是猶因溺而廢天下之舟因噎而廢天下之食也且人之毁譽或出愛憎雖復聖賢不能自免孔子曰衆好之必察焉衆惡之必察焉恐國家亦未可以此遥斷否臧遽行黜陟也就使其人平昔所行誠有虧缺古之人或舉於漁鹽或舉於盗賊豈可不容其改行自新而終身棄之乎且人之行能迭有短長若不棄瑕録用而以一節廢之則失人多矣臣愚以為天子撫有四海海内之士不可一身察之也必資舉者然後能盡天下之才既用舉者之言授之爵禄苟不嚴為禁約以防其私則請託欺罔無不至矣竊以孝者士之尊行廉者吏之首務故漢世舉士皆用孝廉行之最乆得人為多臣欲乞應天下知州府軍監任内聴舉孝亷一人大藩聴舉二人轉運使提㸃刑獄任内聴舉三人並須到任及一年以上方得奏舉夫鄉舉里選雖為古法今之為吏者不得乆於其任士之素行或不能盡知若本部無人可舉即聴舉别部之人素所知者以充其數其在京兩制以上聴嵗舉一人其舉狀逐時送下貢院置籍收掌每遇科場詔下即委貢院選擇其日以前舉主最多者取三十人申奏降指揮下本貫敦遣赴闕若舉主數同者即以發狀先後為次謂若俱有三人舉主則取第三狀日月在前者仍於進士奏名額内减三十人候到闕日或陛下臨軒親試或委中書門下試經義䇿一道時務䇿一道但以義理優長為上不取文辭華美若所對經義乖戾聖意及時務全不通曉方行黜落其及第授官並與進士第一甲同在明經之上仍於告身前列坐舉主姓名其所舉之人若犯私罪情理重及正入已贓未及第者舉主減三等已及第者減一等坐之並不以赦原其公罪及私罪情理輕者舉主不坐其未舉以前若曽犯罪除公案見在證騐明白外舉主亦不坐即因勢要屬請求舉及為人屬請并受屬請而舉之者並科違制之罪受􅂍者並以枉法論即敦遣不至者更不就除官若累經敦遣不至即乞朝廷臨時裁度特加聘召不為定制又國家置明經一科少有應者及諸科所試大義有司不以定去留葢由始者立格太髙致舉人合格者少臣欲乞今後明經所試墨義止問正文不問注䟽其所試大義不以明經諸科但能具注䟽本意講觧稍詳者為通雖不失本意而講觧踈略者為粗餘並為不通若能先具注䟽本意次引諸家雜説更以巳意裁定援據該贍義理髙逺雖文辭質直皆為優等與折二通若不能記注䟽本意但以巳見穿鑿不合正道雖文辭辯給亦降為不通其明經以六通諸科以四通以上為合格若合格人少即并取粗多者合格人多即减去通少者委試官臨時相度令合元額又舊制明經以周易尚書為小經今欲乞以周易尚書毛詩為一科三禮為一科春秋三傳為一科皆習孝經論語為帖經又説書一科議者多以為不當廢欲乞與明經並置但每次科場止取十人奏名在諸科額内試中受官並與諸科同若自以本科及第或出身者更不得就試説書如此則求賢之路廣請託之源絶浮偽之風息得人之頌興矣論移張叔詹知蔡州不當狀上乞改知衛州叔詹遂乞致仕朝廷許之右臣竊見前知壽州張叔詹因本路監司奏以本州水災叔詹非才乞别差人尋移知蔡州伏縁壽蔡之民皆陛下赤子叔詹若為政無狀於民有害移彼置此有何所殊况蔡州封部闊逺户口繁庻土饒山林素多盗賊地望之重過於壽州牧守之任尤須擇人豈有因不才被斥更得善處若叔詹實有才能惠及於民則當治本路監司罔上誣賢之罪使叔詹仍居舊任不復移易今臧否不分進退無據衆口籍籍皆云未允臣前上言為治之要在於擇人賞罰此亦擇人不精賞罰不當之一事也况叔詹資性庸下老而益昏本無片長授任過分其為忝冒人盡知之使之從政所至為害伏乞朝廷直令致仕或授以冗散之職勿使親民庶幾黜陟明白無損政體傳家集巻二十欽定四庫全書傳家集巻二十一宋司馬光撰章奏四進五規狀嘉祐六年八月十七日止右臣幸得備位諌官竊以國家之事言其大者逺者則汪洋濩落而無目前朝夕之益䧟於迃闊言其小者近者則叢脞委瑣徒足以煩凂聖聴失於苛細夙夜惶惑口與心謀渉瀝累旬乃敢自决與其受苛細之責不若取迃闊之譏伏以祖宗開業之艱難國家致治之光美難得而易失不可以不慎故作保業隆平之基因而安之者易為功頽壊之勢從而救之者難為力故作惜時道前定則不窮事前定則不困人無逺慮必有近憂故作逺謀燎原之火生於熒熒懐山之水漏於涓涓故作重㣲象龍不足以致雨畵餅不足以療饑華而不實無益於治故作務實合而言之謂之五規此皆守邦之要道當世之切務戇陋狂瞽觸冒忌諱惟知納忠不敢愛死伏望陛下以萬幾之餘㳺豫之間垂精留神特賜省覧萬一有取裁而行之則臣生於天地之間不與草木同朽矣五規保業天下重噐也得之至艱守之至艱王者始受天命之時天下之人皆我比肩也相與角智力而爭之智竭不能抗力屈不能支然後肯稽顙而為臣當是之時有智相偶者則為二力相參者則為三愈多則愈分自非智力首出於世則天下莫得而一也斯不亦得之至艱乎及夫繼體之君羣雄已服衆心已定上下之分明彊弱之勢殊則中人之性皆以為子孫萬世如泰山之不可揺也於是有驕墮之心生驕者玩兵黷武窮泰極侈神怒不恤民怨不知一旦渙然四方糜瀆秦隋之季是也惰者沈酣宴安慮不及逺善惡雜揉是非顛倒日復一日至於不振漢唐之季是也二者或失之彊或失之弱其致敗一也斯不亦守之至艱乎臣竊觀自周室東遷以來王政不行諸侯並僭分崩離析不可勝紀凡五百有五十年而合於秦秦虐用其民十有一年而天下亂又八年而合於漢漢為天子二百有六年而失其柄王莽盗之十有七年而復為漢更始不能自保光武誅除僭偽凡十有四年然後能一之又一百五十有三年董卓擅朝州郡瓦觧更相吞噬至於魏氏海内三分凡九十有一年而合於晉晉得天下纔二十年惠帝昏愚宗室皆構難羣胡乗釁濁亂中原散為六七聚為二三凡二百八十有八年而合於隋隋得天下纔二十有八年煬帝無道九州幅裂八年而天下合於唐唐得天下一百有三十年明皇恃其承平荒於酒色養其疽嚢以為子孫不治之疾於是漁陽竊發而四海横流矣肅代以降方鎮跋扈號令不從朝貢不至名為君臣實為讎敵陵夷衰㣲至於五代三綱頺絶五常殄滅懐璽未煖䖏宫未安朝成夕敗有如逆旅禍亂相尋戰争不息流血成川澤聚骸成丘陵生民之類其不盡者無幾矣於是太祖皇帝受命於上帝起而拯之躬擐甲胄櫛風沐雨東征西伐掃除海内當是之時食不暇飽寢不遑安以為子孫建太平之基大勲未集太宗皇帝嗣而成之凡二百二十有五年然後大禹之迹復混而為一黎民遺種始有所息肩矣由是觀之上下一千七百餘年天下一統者五百餘年而已其間時時小有禍亂不可悉數國家自平河東以來八十餘年内外無事然則三代以來治平之世未有若今之盛者也今民有十金之産猶以為先人所營苦身勞志謹而守之不敢失墜况於承祖宗光美之業􅍕有四海傳祚萬世可不重哉可不慎哉夏書曰予臨兆民懔乎若朽索之馭六馬周書曰心之憂危若蹈虎尾渉於春冰臣願陛下夙興夜􅄰兢兢業業思祖宗之勤勞致王業之不易援古以鍳今知太平之世難得而易失則天下生民至於鳥獸草木無不幸甚矣惜時夏至陽之極也而一隂生冬至隂之極也而一陽生故盛衰之相承治亂之相生天地之常經自然之至數也其在周易泰極則否否極則泰豐亨冝日中孔子傳之曰日中則昃月盈則食天地盈虚與時消息而况於人乎况於鬼神乎是以聖人當國家隆盛之時則戒懼彌甚故能保其令問永乆無疆也凡守太平之業者其術無他如守巨室而已今人有巨室於此將以傳之子孫為無窮之規則必實其堂基壯其柱石彊其棟梁厚其茨葢髙其垣墉嚴其闗鍵既成又擇子孫之良者使謹守之日省而月視欹者扶之敝者補之如是則雖亘千萬年無頽壊也夫民者國之堂基也禮法者柱石也公卿者棟梁也百吏者茨葢也將帥者垣墉也甲兵者闗鍵也是六者不可不朝念而夕思也夫繼體之君謹守祖宗之成法苟不隳之以逸欲敗之以讒謟則世世相承無有窮期及夫逸欲以隳之讒謟以敗之神怒於上民怨於下一旦渙然而去之則雖有仁智恭儉之君焦心勞力猶不能救陵夷之運遂至於顛沛而不振嗚呼可不鍳哉今國家以此承平之時立綱布紀定萬世之基使如南山之不朽江河之不竭可以指顧而成耳失今不為已乃頓足扼腕而恨之將何益矣詩云我日斯邁而月斯征夙興夜寐無忝爾所生時乎時乎誠難得而易失也逺謀易曰君子以思患而豫防之書曰逺乃猷詩云猷之未逺是用大諌昔聖人之教民也使之方暑則備寒方寒則備暑七月之詩是也今夫市井稗販之人猶知旱則資車水則資轍夏則儲裘褐冬則儲絺綌彼偷安苟生之徒朝醉飽而暮饑寒者雖與之俱為編户貧冨必不侔矣今為天下國家者豈可不制治於未亂保邦於未危乎詩云迨天之未隂雨徹彼桑土綢繆牖户今此下民或敢侮予孔子曰為此詩者其知道乎能治其國家誰敢侮之迨天之未隂雨者國家閒暇無災害之時也徹彼桑土者求賢於隠㣲也綢繆牖户者修敕其政事也夫桑土者鴟鴞所以固其室也賢雋者明主所以固其國也國既固巳雖有侮之者庸何傷哉臣竊見國家每邉境有急羽書相銜或一方饑饉餓殍盈野則廟堂之上焦心勞思忘寢廢食以憂之當是之時未嘗不以將帥之不選士卒之不練牧守之不良倉廪之不實追責前人以其備禦之無素也幸而烽燧息五糓登則明主舉萬壽之觴於上羣公百官歌太平縱娯樂於下晏然自以為長無可憂之事矣嗚呼使自今日已徃四夷不復犯邉水旱不復為災則可矣若猶未也則天幸安可數恃哉陛下何不試以閒暇之時思不幸邉鄙有警饑饉洊臻則將帥可任者為誰牧守可倚者為誰雖在千里之外使之常如目前至於甲兵之利鈍金糓之盈虚皆不可不前知而豫謀也若待事至而後求之則巳晩矣夫四夷水旱事之細者也抑又有大於是者陛下亦嘗留少頃之慮乎詩云維此聖人瞻言百里維彼愚人覆狂以喜此言逺謀之難知近言之易行也夫謀逺則似迃似迃則人皆忽之其為害至慘也而無切身之急為利至大也而無旦夕之驗則愚者抵掌謂之迃也冝矣國家之制百官莫得乆於其位求其功也速責其過也備是故或飬交飾譽以待遷或容身免過以待去上自公卿下及斗食自非憂公忘私之人大抵多懐苟且之計莫肯為十年之規况萬世之慮乎自非陛下惕然逺覧勤而思之日復一日長此不已豈國家之利哉此臣日夜所以痛心泣血而憂也昔賈誼當漢文帝之時以為天下之勢方病大瘇又苦􅏓盭又類辟且病痱陛下視方今國家安固公私冨貴百姓樂業孰與漢文然則天下之病無乃更甚乎失今不治必為痼疾陛下雖欲治之將無及矣治之之術非有他竒巧也在察其病之緩急擇其藥之良苦隨而攻之勿責目前之近功期於萬世治安而已矣重㣲虞書曰兢兢業業一日二日萬幾何謂萬幾幾之為言㣲也言當戒懼萬事之㣲也夫水之㣲也捧土可塞及其盛也漂木石没丘陵火之㣲也勺水可滅及其盛也焦都邑燔山林故治之於㣲則用力寡而功多治之於盛則用力多而功寡是故聖帝明主皆銷惡於未萌弭禍於未形天下隂被其澤而莫知所以然也周易坤之初六曰履霜堅冰至霜者寒之始也冰者寒之極也坤之初六於律為林鐘於厯為建未之月陽氣方盛而隂氣巳萌物未之知也是故聖人謹之曰履霜堅冰至言為人君者當絶惡於未形杜禍於未成也繫辭曰知幾其神乎君子知㣲知彰知柔知剛萬夫之望謂此道也孔子謂魯哀公曰昧爽夙興正其衣冠平旦視朝慮其危難一物失理亂亡之端君以此思憂則憂可知矣太宗皇帝命詔宣使河州團練使王繼恩討蜀平之宰相請除繼恩宣徽使太宗不許曰宣徽使位亞兩府若使繼恩為之是宦官執政之漸也宰相固請以繼恩功大他官不足以賞之太宗怒切責宰相特置宣政使以授之真宗皇帝欲與章穆皇后及後宫逰内庫后辭曰婦人之性見珍寳財貨不能無求夫府庫者國家所以飬六軍備非常也今耗散之於婦人非所以重社稷也真宗深以為然遂止由是觀之先帝以睿明卓越防㣲杜漸如此之深可不念哉昔扁鵲見齊桓侯曰君有疾在腠理不治將深桓侯不悦曰醫之好利也欲以不疾為功及在血脉在腸胃桓侯皆不信及在骨髓扁鵲望之遂逃去徐福言霍氏大盛冝以時抑制漢宣帝不從及霍氏誅人為之訟其功以為曲突徙薪無恩澤焦頭爛額為上客故未然之言常見棄忽及其已然又無所及夫晏安怠惰肇荒滛之基竒巧珍玩發奢泰之端甘言悲辭啓僥倖之塗附耳屏語開讒賊之門不惜名噐𨗳僭逼之源假借威福授陵奪之柄凡此六者其初甚㣲朝夕狎玩未覩其害日滋月益遂至深固比知而革之則用力百倍矣伏惟陛下思萬幾之至重覧大易之明戒誦孔子之格言繼先帝之聖志使扁鵲得早從事毋使徐福有曲突之嘆則可以修之於廟堂而德冒四海治之於今日而福流萬世優㳺逍遥而光烈顯大豈不美哉豈不美哉務實周書曰若作梓材既勤樸斵惟其塗丹雘此言為國家者必先實而後文也夫安國家利百姓仁之實也保基緒傳子孫孝之實也辨貴賤立綱紀禮之實也和上下親逺邇樂之實也决是非明好惡政之實也詰姦邪禁暴亂刑之實也察言行試政事求賢之實也量材能課功狀審官之實也詢安危訪治亂納諌之實也選勇果習戰鬬治兵之實也實之不存雖文之盛美無益也臣竊見方今逺方窮民轉死溝壑而屢赦有罪廵門散錢其於仁也不亦逺乎本根不固有識寒心而道宫佛廟修廣御容其於孝也不亦逺乎統紀不明名噐紊亂而彫繢文物修飾容貌其於禮也不亦逺乎羣心乖戾元元愁苦而斷竹數黍敲叩古噐其於樂也不亦逺乎是非錯繆賢不肖混殽而鈎校簿書訪尋比例其於政也不亦逺乎姦暴不誅寃結不理而拘泥㣲文紏擿細過其於刑也不亦逺乎行能之士沉淪草野而考校文辭指决聲病其於求賢不亦逺乎材任相違職業廢弛而檢勘出身比類資序其於審官不亦逺乎乆大之謀棄而不省淺近之言應時施行其於納諌不亦逺乎將帥不良士卒不精而廣聚虛數徒取外觀其於治兵不亦逺乎凡此十者皆文具而實亡本失而末在譬猶膠板為舟摶土為檝敗布為㠶朽索為維畫以丹青衣以文繡使偶人駕之而履其上以之居平陸則渙然信可觀矣若以之渉江河犯風濤豈不危哉伏望陛下撥去浮文悉敦信實選任良吏以子惠庻民深謀逺慮以保安宗廟張布綱紀使下無覦心和厚風俗使人無離怨别白是非使萬事得正誅鋤姦惡使威令必行取有益罷無用使野無遺賢進有功退不職使朝無曠官察讜言考得失使謀無不盡擇智將練勇士使征無不服如是則國家安若泰山而四維之也又何必以文采之飾歌頌之聲眩耀愚俗之耳目哉乞分十二等以進退羣臣上殿劄子嘉祐六年閏八月八日上臣竊以國家張官置吏任事乆則能否著能否著則黜陟明黜陟明則職業修職業修則萬事理此古今致治之要術也今朝廷明知任官不乆之弊然不能變更者其患有二一者仕進資途等級太繁若不踐歴無由擢用二者嵗月叙遷有増無减員少人多無地可處此所以熟視日乆而無如之何者也臣嘗不自知其愚賤私為陛下慮之竊以今之所謂官者古之爵也所謂差遣者古之官也官以任能爵以疇功今官爵混淆品秩紊亂名實不副員數濫溢是以官吏愈多而萬事益廢欲治而清之莫若於舊官九品之外别分職任差遣為十二等之制以進退羣臣謹具條列如左一十二等之制宰相第一兩府第二兩制以上第三三司副使知雜御史第四三司判官轉運使第五提㸃刑獄第六知州第七通判第八知縣第九幕職第十令録第十一判司簿尉第十二其餘文武職任差遣並以此比類為十二等若上等有闕即於次等之中擇才以補之一十二等之中舊無員數者並乞以即今人數為定員自今有闕則補不可更増一十二等之人徳行學術政事勇略錢糓刑獄文辭各隨才授任其提㸃刑獄以上皆無罷滿之期知州知縣縣令四年餘皆三年為滿未滿之間稱職有功則改官益禄賞賜奬諭仍居舊任必須上等有闕然後選擇遷補其不能稱職者則移易黜廢有罪者貶竄刑誅一同等之人雖名有尊卑事有閒劇地有逺近治有小大遇遷補之時不復以資任相壓皆合為一等選擇進用一提㸃刑獄以上伏乞陛下與執政大臣親加詳擇其知州以下委之審官院幕職以下委之流内銓遇上等有闕即於次等之中取職業修舉功利及民累經襃賞或有舉主數多者次取常調少過者以次遷補一應磨勘合改京官人且依常調差遣須候上等有闕即取有功或舉主最多者以次遷補其自幕職入知縣者並改京官一因資䕃得京官者分監當為三等初任皆入下等監當候中等上等有闕亦依簿尉令録之制取有功或舉主多者以次遷補若知縣有闕則與幕職混同遷補但不改官而巳仍自今後以資䕃授官者須歴簿尉不得直除京官一應因貪虐不公或昏懦廢職坐除免停替之人永不得復舊等差遣内别無入已贓曽經叙理得差遣或降充監當者五年之外有舉主五人以上聴復舊等差遣右十二等之制伏望裁擇或有可采乞下公卿大臣詳議然後施行取進止乞施行制䇿劄子右臣竊以國家本置六科葢欲以上觀朝政之得失下知元元之疾苦非為士人設此以為進取之階也臣昨差覆考應制舉人所試䇿竊見上等三人所陳國家大體社稷至計其間甚有可采擇者伏望陛下取正本留之禁中常置左右數加省覧以為儆戒其副本下之中書令擇其所言合於當今之務者奏而行之使四方之人皆知朝廷求直言之士非以飾虚名乃取其實用也及臣前所獻五規雖智識闇淺辭語鄙陋然皆臣夙夜盡忠竭誠以思治世之要道非指陳一事之得失於有司無所施行亦望陛下以視朝之隙時取觀之庻幾於聖政或有萬分之益取進止傳家集巻二十一欽定四庫全書傳家集巻二十二宋司馬光撰章奏五乞建儲上殿劄子嘉祐八年閏八月二十六日上臣先於至和三年通判并州事日三曽上言乞陛下早定繼嗣以遏亂源當是之時臣䟽逺在外猶不敢隠忠愛死數陳社稷至計况今日侍陛下左右官以諌諍為名竊惟國家至大至急之務無先於此若捨而不言專以冗細之事煩凟聖聴厭塞職業是臣懐姦以事陛下罪不容於葅醢伏望陛下取臣曏時所進三狀少加省察或有可取乞斷自聖志早賜施行如此則天地神祗宗廟社稷羣臣百姓並受其福惟在陛下一言而巳取進止乞建儲上殿第二劄子尋有詔以濮王子宗實知宗正寺臣近於前月二十六日上殿敷奏乞檢㑹臣在并州所奏三狀早定繼嗣事陛下聖意昭然即垂聴納凡所宣諭皆非愚臣所能及此乃天神地祗保佑皇家實萬世無疆之休也臣謂陛下朝夕當發德音宣告大臣施行其事今將近一月未有所聞豈陛下以兹事體大慎選宗室未得其人將左右之人有所間阻熒惑聖聴臣皆不得而知也臣聞為人後者為之子也著於禮律皆有明文漢孝成帝即位二十五年年四十五以未有繼嗣立弟子定陶王欣為太子今陛下即位之年及春秋皆巳過之豈可不為宗廟社稷深思逺慮哉况今亦未使之正東宫之名但願陛下自擇宗室仁孝聪明者養以為子官爵居處稍異於衆使天下之人皆知陛下意有所屬以係逺近之心俟他日皇子生復使之退歸藩邸有何所傷此誠天下安危之繫願陛下决意而速行之取進止論荒政上殿劄子臣竊聞淮南両浙今嵗水災民多乏食徃徃羣軰相聚操執兵仗販鬻私鹽以救朝夕至有與官軍拒鬭相殺傷者若浸淫不止將成大盗朝廷不可不深以為憂葢由所司㩁之太急故抵冒為姦臣聞周禮以荒政十有二聚民近者朝廷略以施行惟舎禁除盗賊二者似未留意今赤子凍餒濵於溝壑柰何尚與之爭錙銖之利豈為民父母之意哉臣謂陛下冝戒諭職司使明體朝意稍弛鹽禁而嚴督盗賊緩課利不充之罰急羣行剽刼之誅廢告捕私鹽之賞旌討擒彊暴之功棄聚斂之小得保安全之大福除惡於纎介弭亂於未形最䇿之得者也取進止論勸農上殿劄子嘉祐六年上得㫖依臣聞食者生民之大本為政之首務也饑饉之世珠玉金銀等於糞土惟糓之為寳不可一日無也今國家每下詔書必以勸農為先然而農夫日寡㳺手日繁豈非為利害所驅耶今農夫苦身勞力惡衣糲食以殖百糓賦斂萃焉徭役出焉嵗豐則賤糶以應公上之須給債家之求嵗㓙則流離異鄉轉死溝壑如是而欲使夫商賈末作之人坐漁厚利鮮衣美食者轉而縁南畮斯亦難矣然則勸農者言也害農者政也天下生之者益少食之者益多欲糓之無涸得乎哉為今之術勸農莫如重糓重糓莫如平糴使諸路轉運使及州軍長吏遇豐嵗能廣謀糴入官滿之日倉庫之實比於始至増羨多者賞之其無水旱之災益兵之費而蓄積耗減者黜之又令民能力田積糓者不以為家貲數如是則糓重而農勸雖有饑饉常無流亡盗賊之患矣今嵗河北河東㳂邉糓糴至賤此亦國家所冝留意者也取進止論臣寮上殿屏人劄子嘉祐六年九月二十八日奉聖㫖依行臣等竊聞自先帝以來應兩府臺諌官等上殿奏事左右侍臣悉皆屏退葢以君不宻則失臣臣不密則失身重愼樞機不得不爾竊見近日臣寮上殿奏事左右侍臣不遵舊制或有進至殿角板障門以裏與御坐相去不過數歩陛下徳音及羣臣敷奏之語皆可聴聞其間有機宻大事若致漏泄大為不便欲乞一依舊制今後應遇兩府臺諌官等上殿奏事其左右侍臣並於殿角板障門外踏道下祗候仍乞委都知押班於兩邊板障門外檢校如敢竊有覘聴者並具姓名聞奏勘罪施行取進止論制䇿等第狀既上而執政以􅝲所試進呈欲黜之上曰其言切直不可棄也乃降一等収之即蘇轍也右臣近䝉差赴崇政殿後覆考應制舉人試巻内􅱹􅝲両號所對策辭理俱髙絶出倫軰然􅝲所對命秩之差虚實之相養者一兩事與所出差舛臣遂與范鎮同議以􅱹為第三等􅝲為第四等詳定官巳定從覆考竊知初考官以為不當朝廷更為之差官重定復從初考以􅝲為不入等臣竊以國家置此六科本欲取材識髙逺之士固不以文辭華靡記誦雜傳為賢􅝲所試文辭臣不敢復言但見其指陳朝廷得失無所顧慮於四人之中最為切直今若以此不䝉甄收則臣恐天下之人皆以為朝廷虚設直言極諌之科而􅝲以直言被黜從此四方以言為諱其於聖王寛明之德虧損不細臣區區所憂正在於此非為臣已考為髙等苟欲遂非取勝而已也伏望陛下察臣愚心特收􅝲入等使天下之人皆曰􅝲所對事目雖有漏落陛下特以其切直收之豈不美哉乞免北使状嘉祐六年閏八月六日上右臣竊知已降勅命差臣充北朝國信使臣縁名犯北朝諱所行文字雖可以更改竊慮臨時語言不能記憶或有觸犯兼臣體羸多病性不耐寒若渉窮荒必生疾病非敢自愛恐於王事有所廢闕伏望聖慈矜憫别賜差官在於愚臣實為至幸第二狀尋改差人右臣先曽奏乞免充北朝國信使至今未奉朝㫖竊以專對之任亦須擇才臣不惟名犯北朝諱及性不耐寒兼臣不經接伴未能諳練南北事體資性拙訥恐辱王命伏望聖慈矜察早賜選差曽經接伴之人充國信使所貴臨事不至闕誤論燕飲狀嘉祐六年與王樂道同上右臣等竊見今嵗以來災異屢臻日食地震江淮騰溢風雨害稼民多菜色此正陛下側身克己眚禮蕃樂之時而道路之言皆云陛下近日宫中燕飲㣲為過差賞賚之費動以萬計耗散府庫調斂細民况酒之為物傷性敗徳禹湯所禁周公所戒殆非所以承天憂民輔養聖躬之道也陛下恭儉之徳彰信兆民議者皆以為後宫奢縱務相誇尚左右近臣利於賞賚陛下重違其請屈意從之夫天以剛健為徳君以正固為事柰何狥後宫左右之欲上忽天戒下忘民病中不為宗廟社稷深自重惜臣等愚惑竊為陛下不取也伏望陛下當此之際悉罷燕飲安神養氣後宫妃嬪進見有度左右小臣賞賚有節及厚味腊毒之物無益奉養者皆不冝數御以傷天和乃可以解皇天譴告之威慰元元困窮之望保壽命無疆之休天下羣生不勝幸甚臣等區區納忠忘死惟陛下裁察論兩府遷官狀右臣伏見朝廷因進用宰臣韓琦等凡兩府之臣盡遷一官臣愚不明大體未識所謂竊恐從此相承遂為故事凡公卿者百吏之表率今國家方以百吏繁冗思革其弊而公卿無故一切遷官將何以使三百赤芾受爵不讓者有所愧心哉况慶厯中陛下以數月不雨執政之臣皆降一官以荅天戒今嵗日食地震河及江淮汎溢横流烈風淫雨賊傷五稼四方之民墊溺流餓不可勝紀比於慶厯災害尤衆而兩府大臣無問新舊皆被褒遷殆非所以仰承天心下慰衆庻之意也竊計大臣當此之際亦必不敢受無名之賞伏望陛下因其辭讓内惟樞密使副使不可以給諌及即中為之者依舊制外其餘皆不遷官以飬大臣廉讓之節無使之負謗於海内則其為徳澤愈厚矣論夜開宫門狀有㫖劄送皇城司右臣竊聞今月二十五日十三公主薨其日宫中送殯出城留宫門及城門至夜深方閉物情駭異以為非冝雖陛下慈愛至深然門闕之禁不可不嚴若以式律言之夜開宫殿門及城門者皆須有墨勅魚符其受勅人具録所開之門并出入人帳送中書門下自監門衛大將軍以下俱詣閤覆奏御注聴即請合符門鑰監門官司先嚴門仗所開之門内外並立隊燃炬火對勘符合然後開之符雖合不勘而開若勘符不合而為開及不承勅而擅開閉若得出入者剰將人出入其刑名輕者徒流重者處絞今以乳兒出殯之故内自禁掖外逹郊野諸門洞開一如晝日車馬徃來絡繹不絶出入之人無復譏訶有如萬分之一姦險不逞之人雜處其間豈可不為之寒心哉伏望陛下深鑒安危防㣲杜漸自今宫殿門城門並須依時開閉非有急切大事勿復夜開必不得巳須至夜開者即乞陛下親降手勅加以御寳受勅之人仍冩出入人帳委宿衛當上之官衆共驗勅文真的然後覆奏候再見御批方請門鑰與監門官親自監開依帳㸃閲人數放令出入即時下鏁進納門鑰其宿衛監門官司若不見手勅及御批而輙敢開者依不承勅而擅開閉律文施行雖有手勅御批不叅驗及不親自監開㸃閲人數者依符雖合不勘而開律文施行庻可以養萬乗之威尊消姦宄於未萌也乞矜恤陳洙遺孤狀嘉祐六年九月二十三日上右臣竊見殿中侍御史裏行陳洙資性忠果憂公忘私禀命不永奄辭聖世垂没之際猶上章奏搢紳之倫靡不嗟惜冝有旌嘉異於諸臣家素貧乏孤遺頗衆歸葬閩越道塗險逺伏望朝廷特賜矜憫依監察御史裏行張宗誼例除子男一人官及乞降朝㫖下衢信建三州候洙喪柩至彼差人防䕶津送前去亦足以示朝廷襃直勸忠終始之恩也論環州事冝狀嘉祐六年十月初一日上右臣竊知環州熟户蕃部屯聚攻刼殺傷兵民雖犬羊之衆人面獸心緩之則驕急之則叛固其常性亦由將吏恩不能懐威不能服信不能結勇不能斷平居無事則擾之使亂及其陸梁又不能制是使戎狄順服王化則侵苦不安桀驁鴟張則冨饒熾大凡邊境所以多事未有不由此也夫以屬國小醜背誕不恭而國家不能擒討使西北二敵聞之豈不益有輕漢之心伏望陛下特詔陜西不干礙監司體量蕃部所以叛亂之因若果由將吏撫御乖方所致即乞明行誅責以謝邊民更選良將能吏有方略者使之鎮遏分别蕃部善惡附順者撫而安之以壊散其黨悖逆者討而誅之使永乆懾服不然臣恐其日月浸深罪惡愈重自知不為朝廷所容將外連西夏内結諸部黨與益衆氣燄益大乃為朝廷旰食之憂非特䑕竊狗偷而巳也論蘇安静狀嘉祐六年十月初二日上右臣伏見朝廷近除帯御噐械蘇安静充内侍省押班臣竊聞國家舊制兩省押班須年五十以上方得為之安静年未五十特䝉擢用臣恐自今已後内臣求進者援以為例廼有年齒極少遂居衆首國之舊章因此隳壞竊為朝廷重之伏望陛下追寢安静勅命以存典法論張方平狀嘉祐六年十月十四日上右臣竊聞近者秦鳯路經略安撫使知秦州張方平承信邉人虚稱西夏㸃兵侵犯邉境惶擾失度閉門乗城移牒鄰路索兵自救永興以西軍馬皆被抽發使近邉之民轉相驚動關隴騷然仍飛奏上聞致朝廷憂疑已而接省皆無事實方平身為元帥繫一方安危舉措施為衆所曕倚今乃怯懦輕發一至於此萬一疆埸實有警急使方平當之豈不敗事臣竊恐敵國聞之得以闚將帥之淺深益有輕中國之心非所以壯皇威鎮殊俗也伏望朝廷治方平之罪嚴加譴謫更擇明智沈勇之人以代其任庻幾國家藩屏得禦侮之臣可以髙枕矣論張方平第二狀右臣先於今月十四日上言秦鳳路經略安撫使張方平怯懦輕易乞更擇良將以代其任未䝉朝廷采納臣聞將者成敗之機安危之本固不可以任非其人今方平舉措輕脱震駭一方傳笑天下不才之跡章灼如此而朝廷猶掩覆包含一無所問臣恐敵國聞之皆有窺窬之志吏士覩之皆有輕侮之心是國家重惜方平而輕棄秦隴也凡將帥能否患在不知既知其不能而任之如故臣誠愚戇深所未逹議者或以為方平雖失於倉猝然止於過為備禦若從而罪之恐自今守邉之臣聞有冦至皆不敢為備也臣竊以為不然所謂為備者當平居無事之時簡其將佐訓其士卒嚴其壁壘利其器械審其間諜逺其斥堠使朝夕之間常若冦至如是則雖有猛鷙之敵不能犯也萬一犯之可以安坐而制之耳何至狼狽如是哉臣聞方平在秦鳯專以貴倨自處下情壅而不通自門墻之外皆可欺也况於兵民之休戚戎狄之情偽方平安得而知之是以一旦承信虚聲惶惑失㨿内驚諸郡上動朝廷此而不責典刑安用臣所以區區獻言不已者乃責方平之無備非責其為備也伏望朝廷察臣前後所言明治方平之罪謫之逺方以儆封疆之臣使皆豫為備禦不敢驕傲懈弛如方平所為也論張方平第三狀右臣先曽上言秦鳳路經略安撫使張方平怯懦輕易乞更擇人至今未䝉朝廷施行臣竊聞拓跋寛祚年齒寖長猖狂好兵常分之外邀求無厭董氊㓙悍狡獪過其父兄朝廷官爵不滿其意頗懐怨懟與契丹結婚隂相表裏此朝廷所當旰食而憂也秦州居二邊之交為陜西四路之首軍馬民夷最號繁富而以怯懦輕易之人守之是委羔豚於虎狼之蹊也臣竊為國家危之况方平其他材識素無所長止以文辭致位至此姦險貪猥士論共知今不可使之守邉事狀昭然而朝廷掩覆其過曲加保全愛一人而失一方臣竊以為過矣伏望陛下不以邉事為細而忽之速治方平之罪嚴加譴謫更擇沈勇曉兵之人以代其任不然必待有􅇏燧之警然後易之則冦已深矣傳家集巻二十二欽定四庫全書傳家集巻二十三宋司馬光撰章奏六論公主宅内臣狀右臣近聞有聖㫖令召前管句兖國公主宅内臣二人復還本宅臣與楊畋龔鼎臣同有論列以爲非宜未䝉允納臣聞父之愛子教以義方弗納於邪公主生於深宫年齒㓜穉不更傳姆之嚴未知失得之理臣謂陛下宜導之以徳約之以禮擇淑慎長年之人使侍左右朝夕教諭納諸善道其有恃恩任意非法邀求當少加裁抑不可盡從然後慈愛之道於斯盡矣此二人嚮在主第罪惡山積當伏重誅陛下寛赦斥之外方中外之人議論方息今僅數月復令召還道路籍籍口語可畏殆非所以成公主肅雍之美彰陛下義方之訓也臣實憤悒爲陛下惜之伏望聖慈察臣愚忠追止前命無使四方指目以爲過舉虧損盛徳非細故也乞懲勸均稅官吏狀嘉祐六年十一月二十五日上右臣先奉勅與三司同共詳定均稅巳立條約下諸路監司施行去訖竊以爲國家凡欲立事當先使賞罰明白然後事無不成伏見職方員外郎秦植前通判徳州事均五縣稅皆得平允並無人户辭訟若與庸愚之人煩擾敗事同歸常調一無殿最則能吏解體必無成功伏望朝廷察其勤瘁優加酬奬并其餘均稅官吏随其功過量行懲勸則來者覩之無不盡力矣論以公使酒食遺人刑名狀嘉祐七年正月十九日上臣聞聖主之教尚忠厚而貴愷悌故詩有鹿鳴伐木旣醉行葦羙宴好之相樂刺乾餱之失徳禮有幣帛饔餼行於邦國贄獻飲酒施於卿黨是以風俗純和恊氣流通漢景帝詔曰吏受所監臨以飲食免重其更議著令丞相廷尉議曰吏及諸有秩受其官屬所監所治所行所將飲食計償費勿論卓茂爲宻令民有言部亭長受其米肉遺者茂曰凡人所以貴於禽獸者以有仁愛也鄰里饋遺此乃人道所以相親汝獨不欲修之寕能高飛逺走不在人間邪民曰然則律何故禁之茂曰律設大法禮順人情今我以禮教汝汝必無怨惡以律治汝汝一門之内小者可刑大者可殺也近嵗以來中外有司喜以微文刺舉苛細至於宴飲相從酒食相饋皆集累成過詆以峻法曏聞知鎮戎軍曹脩受鄰州所送公用酒已而自首法官處以贓罪陕西都轉運使彭思永奏據密院劄子賈漸起請除舊例送酒食外不得買置金帛作土風贈遺并省司叅詳今後以公使錢買置珍異等物及見錢送與人者並從違制定斷其收受人坐贓論其有公使錢人受還荅之物入已准盗論今曹脩因陳首雖免書罰尚負贓名使人疑惑乞明立條約朝廷命有司叅議至今未決臣竊詳舊條之意明許以酒食相遺其有公使錢人受還答之物正謂珍異見錢今曹脩所受止於樽酒隨而自首已爲刻薄法官又以贓罪加之剖析一條以爲二事不察人情不顧大體若朝廷因之遂爲著令臣恐忠厚之俗益衰媮薄之風遂長百司庻尹無所措其手足虧損聖朝堂堂之化非細故也臣今所言非爲曹脩除雪贓名欲望朝廷申明舊條應以公使錢及財物贈遺人及受者各坐贓論其監臨之官受所監臨或因使於使所及經過處受取者並准律文處分即贈遺人而受其還答入已者准盗論並湏贓滿五疋以上方得科罪其不滿五疋及以飲食之物相饋餉者皆勿論如此則人情有以相接貪吏不能爲姦百司有所循守矣論諸科試官狀右臣伏見朝廷取勘諸處發觧考試諸科官以所觧之人到省十有九不中者臣竊惟國家本設諸科以求通經之士有司專以上文下注爲問已爲弊法竊聞去嵗貢院岀義題官更於弊法之中曲爲竒巧或離合句讀故相迷誤或取巻末經注字數以爲問目雖有善記誦之人亦不能對其於設科本意不亦逺乎是則罪在貢院岀義題官不在諸處發觧官也今舉人被黜巳非其理又并發觧之官亦坐停替臣恐自此爲吏者益務竒巧從學者益棄本原殆非所以省刑罰隆經術也伏望朝廷更取本處觧發上件諸科試巻委官覆考其通粗合格者特與免罪不合格者乃依法坐之仍勅貢院將來科場選擇通經術曉大體之人充諸科岀義官依條出義毋得更如今來詭僻苛細至時如有十有九不中之人然後取勘本處觧發考試官依前後條貫施行如此則彼皆無辭於罰論者亦不以爲寃矣論上元令婦人相撲狀嘉祐七年正月二十八日上右臣竊聞今月十八日聖駕御宣徳門召諸色藝人各進技藝賜與銀絹内有婦人相撲者亦被賞賚臣愚竊以宣徳門者國家之象魏所以垂憲度布號令也今上有天子之尊下有萬民之衆后妃侍旁命婦縱觀而使婦人臝戯於前殆非所以隆禮法示四方也陛下聖徳温恭動遵儀典而所司巧佞妄獻竒技以汚瀆聰明竊恐取譏四逺愚臣區區實所重惜若舊例所有伏望陛下因此斥去仍詔有司嚴加禁約今後婦人不得於街市以此聚衆爲戯若今次上元始預百戯之列即乞取勘管句臣寮因何置在籍中或有臣寮援引奏聞因此宣召者并重行譴責庶使巧佞之臣有所戒懼不敢導上爲非禮也言張田狀嘉祐七月二月初八日上右臣竊聞朝廷差屯田員外郎張田充荆湖南路提㸃刑獄田之爲人傾邪險薄前知諌院唐介言之甚詳伏計朝廷已熟知之提㸃刑獄專按察之柄繫一方休戚今以傾邪險薄之人爲之誠未見其可况田曏者止自通判資序權發遣三司判官因罪左遷知蘄州議者已謂之太優今到任未及三年遂作監司臣竊恐士大夫爭欲效田所爲以爲進取之㨗徑不惟任使失人抑亦敗壊風俗伏望朝廷寢田新命更擇端士以代之實逺方吏民之幸言張田第二狀嘉祐七年二月二十日上尋改差知湖州右臣近曽上言張田不可充荆湖南路提㸃刑獄未蒙朝廷施行臣竊以吏者民之紀綱提㸃刑獄吏之師帥苟不得其人則一方咸受其弊又凡今之朝士自常調進用者皆自此官爲始國家尤宜慎擇其人田資性險薄色厲内荏毁譽岀其愛憎威福發於喜怒陵其可陵佞其可佞真小人之雄傑而時俗以爲賢才夫不善之人天下皆知其不善斯不足疾也惟衆人謂之賢而實不肖者君子疾之昔漢文帝欲以嗇夫爲上林令張釋之以爲嗇夫利口㨗給恐天下隨風而靡唐太宗見進士等第怪其無張昌齡王公謹名王師旦曰二人有文無行恐變陛下風雅今提㸃刑獄其爲輕重非特上林令與入等進士之比也臣願陛下必選忠厚方正實有治行者爲之其飾僞行險躁於進取如田比者皆不可用也臣今所言非專爲湖南之吏民亦爲國家重惜風俗伏惟陛下察其愚忠其荆湖南路提㸃刑獄乞别賜擇人論李瑋知衛州狀嘉祐七年二月二十八日上公主降封沂國右臣竊聞駙馬都尉李瑋出知衛州兖國公主入居禁中瑋所生母楊氏歸瑋兄璋之宅其公主宅祗應人等悉令散遣外議籍籍無不怪愕伏以陛下始者追念章懿太后選瑋使之尚主欲以申固姻戚冨貴其家今以公主之故使李氏母子離析家事流落大小憂讋殆不聊生豈始所以結婚之意哉近者章懿太后忌日陛下閲奩中之故物思平生之居處獨能無雨露之感悽愴之心乎臣愚以爲陛下冝且㽞李瑋在京師其公主宅祗應人等除作過者逺加竄逐岀外其餘並令如舊儲偫什物皆按堵不移以俟嵗月之間徐以義理曉諭公主庶幾囬意易慮率徳遵禮復歸本宅則中外之情無不釋然不然公主必無復歸李氏之志者則今日致此衆議紛紜煩瀆聖聰皆由公主縱恣胷臆無所畏憚數違君父之命陵蔑夫家豈可使李瑋獨䝉斥逐岀外而公主爵邑請受全無貶損非所以示天下至公之道也論皇城司廵察親事官劄子有㫖親事官决杖配下軍臣等伏聞皇城司親事官奏報有百姓殺人私用錢物休和事下開封府推鞫皆無事實欲勾元初廵察人照勘其皇城司庇䕶不肯交付臣等竊以祖宗開基之始人心未安恐有大姦隂謀無狀所以躬自選擇左右親信之人使之周流民間密行伺察當是之時萬一有挾私誣枉者則斧鉞隨之是以此屬皆知畏懼莫敢爲非今海内承平已踰百年上下安固人無異望世變風移宜有釐革而因循舊貫更成大弊乃至帝室姻親諸司倉庫悉委此屬亷其過失廣作威福公受貨賂所愛則雖有大惡掩而不問所憎則舉動語言皆見掎摭臣等常病國家擇天下賢才以爲公卿百官而猶不可信顧任此厮役小人以爲耳目豈足恃哉今乃妄執平民加之死罪使人幽繫囹圄横罹楚毒幸而不自誣服僅能辨明若更不聽有司詰問元初廵察之人少加懲戒臣恐此屬無復畏憚愈加恣横使京師吏民無所措其手足此豈合祖宗之意哉伏望朝廷指揮皇城司令送元初廵察人下開封府推問本情或别有仇嫌或察訪鹵莽各隨其狀依法施行仍自今後永爲定制庶可以塞欺罔之源絶侵寃之門以全國家至公之道取進止論復置豐州劄子嘉祐六年十二月十四日上臣等伏見國家復置豐州故城仍差人知州此誠河西險要之地修之甚便然其地勢孤絶外廹㓂境曏者王氏知州之時所部蕃族甚衆有永安來逺保寕三寨皆以蕃族守之慶厯初拓䟦元昊攻䧟州城州民及三寨蕃族盡爲所虜掃地無遺今州城之中但有丘墟瓦礫環城數十里皆草莽林麓而已若建以爲州則湏復設外寨備置官吏廣屯兵馬多積芻糧皆應調發内地之民以奉之勞費甚大此所謂徇虚名而受實弊也頃年朝廷欲修豐州城河東經畧司嫌其單外廼於其南數十里築永寕堡其地窪下居兩山間䟽惡難守今旣修豐州則永寕堡􅅧在腹内無所復用臣等以爲不若遷永寕堡於豐州故城其兵馬芻糧不更増益但擇使臣有材畧者使守之不必假以知州之名仍召募蕃漢之民使墾闢近城之田俟民物繁庶皆如其舊然後升以爲州亦未晩也取進止論上元遊幸劄子嘉祐七年正月十二日上臣等伏見今嵗以祈糓改日之故車駕併以十三十四日幸諸寺觀臣等竊惟上元觀燈本非典禮正以時和年豐欲與百姓同樂爲太平之榮觀而巳去嵗四方諸州多罹水旱鰥寡孤獨流離道路伏計陛下念此未嘗去心竊恐有司不明大體務循故事無所減損不稱陛下子愛元元之意又連日遊幸在扵聖體亦爲煩勞伏望陛下比之毎嵗特減逰觀之處以閔恤下民安養聖神天下幸甚取進止論正家上殿劄子嘉祐七年二月初四日上臣先曽上言爲前管句兖國公主宅内臣等過惡至大乞不召還近聞傳宣入内内侍省令押上件内臣梁懐吉赴公主宅依舊句當外議諠譁無不駭異臣聞太宗皇帝時姚坦爲兖王宫翊善王有過失坦輒盡言諌正王及左右皆患之左右教王詐疾踰月不朝太宗甚憂之召王乳母入宫問王起居狀乳母曰王本無疾但以翊善姚坦檢束太嚴王舉動不得自由鬱鬱成疾耳太宗怒曰朕選端士爲王僚屬固欲導王爲善今旣不能納用規諌而又詐疾欲朕逐去正人以求自便其可得乎且王年少不知出此皆汝輩教之耳命捽至後園杖之數十召坦慰勉之太宗非不愛其子也誠以愛之則莫若納之扵善若縱其所欲不忍譴訶適所以害之也齊國獻穆大長公主太宗皇帝之子真宗皇帝之妹陛下之姑於天下可謂貴矣然獻穆公主仁孝謙恭有如寒族奉李氏宗親備盡婦道愛重其夫無妬忌之行至今天下稱婦徳者以獻穆公主爲首獻穆公主豈不自知其身之貴哉誠以貴而不驕然後能保其福禄全其令名故也臣謂陛下教子以義冝以太宗皇帝爲法公主事夫以禮宜以獻穆公主爲法則風化流於四方聲譽施於後世今陛下曲徇公主之意不復裁以禮法使之無所畏憚䧟入於惡觸情任性以邀君父憎賤其夫不執婦道將何以形四方之風垂來世之則易曰家人嗃嗃悔厲吉婦子嘻嘻終吝此言家道尚嚴不可專用恩治也伏望陛下斥逐梁懐吉等復歸前來貶竄之處其公主左右之人欲使陛下召還梁懐吉等者皆教導公主爲不善之人也悉宜治其罪而逐之别擇柔和謹愿者以補其缺仍戒勅公主以法者天下之公噐若屡違詔命不遵規矩雖天子之子亦不可得而私庶幾有所戒懼率循善道可以永保福禄不失善名不然衆人所云甚可畏也取進止乞優老上殿劄子臣聞古之聖王尊禮黄髪屬任以政者盖以其更歴天下之事練習為治之體故也昔鬻熊年九十見文王文王曰老矣鬻熊曰君若使臣捕虎逐麋臣已老矣使臣坐而䇿國事臣年尚少也近嵗以來大臣髙年者皆不敢自安其位言事者又欲以擊摶大臣爲名從而攻之此豈爲臣盡忠至公之道哉凡言事者當爲國家進賢退不肖使其人無可取雖少壯何爲果有益於時雖老何傷也臣竊見樞宻副使張昪屢以老疾辭位臣平生與昪迹不相接無絲毫恩分然竊聞其爲人忠謹清直不可干以私臣不敢上避聖主之疑下畏世俗之謗隐忠不言以利其身伏望陛下深念宥宻之地不可任非其人先以聖意揣度若未能得賢於昪者則使昪且居其位於事亦未有曠廢也若昪必不可留則願陛下慎選徳望材噐爲衆所服知政體曉兵畧者以代之不可以不擇其人之可否使循資累叙而爲之也取進止傳家集巻二十三欽定四庫全書傳家集巻二十四宋司馬光撰章奏七辭知制誥狀嘉祐七年三月十四日上右臣近䝉中書召試制誥竊聞聖恩已除臣本官知制誥續又令兼侍講數日之間寵命相繼在人爲榮於臣甚懼竊以二職文士之髙選儒林之極致古之英雋尚或難兼况於微臣愚陋無比一身二任力所不堪豈敢冒居以取顛覆聞之震恐瞀憤失據臣自少及長章句之學粗嘗從師至於文辭實爲鄙野曏者辭免修起居注非謂不能記録言動正恐循次而進典掌誥命取嗤四方爲國大辱是以披心自歸至於四五誠慤不著不蒙開允雖黽勉就職而夙夜惶懼未嘗少安近者被召之日再欲具此奏陳又以比來朝廷擢用數人雖辭避懇至未嘗得請而或者不諒其心以爲采名恐復虚發如前所爲是以躊躇彷徨不免赴試除命旣降强顏忍耻亦欲就職以俟疵咎布彰自當退黜今者竊聞天章閣侍講吕公著與臣同時被召公著辭譲不至朝廷已除公著天章閣待制兼侍講臣廼始自悔恨輒以愚心妄意朝廷當伏重誅臣雖無知若使亷譲有耻者棄置不收貪冐苟得者進受華顯不惟虧聖朝風化亦使微臣受四海之責將不得單斃其死所有除知制誥勅告臣未敢祗受乞更擇文學兼茂與職業相稱之人以代臣庶幾克叶逺近之望寛愚臣之罪其侍講恩命臣更不敢辭辭知制誥第二狀右臣今月十四日曽有奏陳以知制誥之職非臣所堪乞更擇人未䝉允許臣夙夜惶恐不知所措臣與吕公著同時召試公著固辭得請而臣獨就職是公著亷譲而臣無愧耻也臣雖甚愚誠不忍以身居下流䝉受衆惡為世汚澤雖獲美官將何榮之有且公著沈厚淵懿士林推服文學行能非臣之比名位寵禄臣安敢先之昔施氏卜宰皇句須吉施氏之宰有百室之邑與皇句須邑使為宰以譲鮑國而致邑焉施孝叔曰子實吉對曰能與忠良吉孰大焉少室周為趙簡子之右聞牛談有力請與之戯弗勝致右焉簡子許之臣今自知不材請釋美官以授能者雖不足比迹大賢庶幾得從皇句須少室周之後其榮多矣伏望朝廷察其區區特賜矜許其除知制誥勅告臣不敢祗受乞授公著或别擇人不勝大幸辭知制誥第三狀右臣今月十四日十七日兩曽上奏辭免知制誥乞更擇人未䝉開許臣聞明主商徳而序位忠臣量能而受職是以分不亂於上能不窮於下治辯之要莫尚於斯臣自知文字惡陋又不敏速若除拜稍多詔令填委必閣筆拱手不能供給縱復牽合鄙拙尤甚暴之四逺為人指笑又貽聖朝愧耻謂之乏賢故為公家之謀則莫若用其所長營一身之私則莫若避其所短夕寐晨興慮之已熟始敢披陳干浼天聴剖肝瀝膽莫非懇到自修注以來前後非一而昭昭之誠無由上逹屡觸報聞不䝉省察或者謂臣修起居注自應知制誥與吕公著不同公著當辭臣則當受凡自修注知制誥者非有祖宗法令著於方冊特近嵗相承之例耳祖宗之時但取庶官之中有辭藻者即知制誥不必皆以修注為之其修注或改佗官不必皆知制誥也夫以資塗用人不問能否比例從事不顧是非此最國家之弊法所宜革正者也又謂臣就試已畢不當復辭臣就試之日以為公著辭未必免臣試未必中是以不辭今公著獲免而臣沗恩命則今日辭之亦未為晩也且過而能改猶愈於迷而不復見賢思齊猶愈於受爵不譲況臣修注之初已嘗辭免至於四五而朝廷不允伏望聖慈特賜哀察使臣服勤佗役惟力是視其知制誥勅告臣不敢祗受乞更賜擇人辭知制誥第四狀右臣昨三次上奏辭免知制誥乞更擇人奉聖㫖令依累降指揮不許辭譲便受告勅臣曏者承乏諌官首曽上言以為致治之道任官最急人之材性各有所宜雖以稷契臯䕫之賢皆守一官終身不易况今羣臣固非其比當度材而授任量能而試職奏牘具存事可案騐今臣自知文辭鄙野不足以充知制誥之職若止以修起居注資塗相值循例序進恬而有之曽不愧畏是臣但能譏評佗人曠官竊位而受爵不譲至於已斯亡此廼欺罔天聼静言庸違當伏共兠之誅以清唐虞之治臣雖甚愚決不敢為伏望聖慈察臣前後所奏特賜允從其知制誥乞别賜擇人所有勅告不敢祗受辭知制誥第五狀右臣先曽四次上奏乞免知制誥别賜擇人奉聖㫖依累降指揮不許辭譲令便受告勅臣㓜嘗渉學粗知臧否豈敢以譎詐之心上欺君父顧人之材分各有所宜若貪榮冒居使職業廢墜則探囊胠箧廼竊盗之微者皆不足誅也臣雖小人實不敢為是以曏者不辭於召試之初而辭於吕公著免試之後誠欲果於得請不為虚發故也今若因循苟且復徃就職則臣進退之迹自可猜惑况於世人誰不譏笑如是則臣出入禁闥何心自安陪接搢紳何施靣目顧視僮僕何以爲容是以違犯天威不敢避死决求自免而詔命愈堅終未置捨臣誠愚懵不識所謂意者朝廷以臣所言皆為矯偽不足聴察邪若使臣言岀於矯偽當正典刑以警姦囬若出於至誠當從其所請使上無曠官下無竊位柰何前後奏章上者直加屏棄不復省察區區之志何以自明若以近例修起居注者必知制誥不可改易則臣竊觀先朝以來修起居注不因罪累譴黜及親嫌相避而去為佗官者劉騭知衛一本作衡州潘慎修遷考功郎中許衮判吏部南曹劉􅂱改工部員外郎兼侍御史知雜事丘雍充淮南都大制置發運使徐奭充兩浙轉運使蔡齊改禮部員外郎兼侍御史知雜事鄭向充两浙轉運一本有副字使髙餗罷守本官陳詁充三司户部副使葉清臣充兩浙轉運一本有副字使趙槩充天章閣待制楊察充江南轉運使蔡襄知福州以是觀之雖近例亦不盡知制誥也臣今悃欵廹切無以復加伏望聖慈特賜哀察若使臣得遂其志是去罪辱而就顯榮雖日遷十官未足方其幸也所有知制誥勅告臣必不敢祗受乞别賜擇人辭知制誥第六狀右臣先曽五次上奏乞免知制誥别賜擇人奉聖㫖令臣依累降指揮不許辭譲便受告勅者臣聞晋王述每受職不為虚譲其有所辭必於不受及遷尚書令其子坦之諌以為故事應譲述曰汝謂我不堪邪坦之曰非也但克譲自美事耳述曰既云堪何爲復譲臣竊重述知為人臣陳力就列之體心常慕之臣自勝冠以來投牒應舉入朝求仕豈偃蹇山林不求聞達之人邪顧力有所不任則不敢盗國家禄位恐職事廢闕䧟於刑辟耳故自度材分可以䇿勵雖髙位不敢辭不可强勉雖小官不敢受曏者蒙聖恩除館職諌官侍講皆不敢以一言飾譲盖以館職掌比校文字諌官掌規正得失侍講掌講觧經術皆不專以文辭為職故也今臣自修起居注以來前後辭免章十餘上止為文辭鄙惡不堪典誥命而已終未䝉朝廷賜察是以奏牘頗多喋喋不已煩為時人所怪其愛臣者以為譲榮利惡臣者以為飾虚詐要之二者皆未得臣之心夫有諸中而辭諸外然後謂之譲若臣者無諸中而不敢為者也安得謂之譲哉譬如使羸夫負百鈞之重而予之千金羸夫必辭非不欲金也力不任故也夫飾者内欲之而外不取將以有求也今臣不就美官屡違詔命上怒下怪將抵罪誅尚何求哉且苟能其官而固譲不止則是朝廷百官皆無人可為非天下之通法也臣故謂如王述能則為之不能則止為得其宜臣雖才非古人願附王述之志若始者可受則不若勿辭亦既辭之則不可復受伏望聖慈特加矜察其知制誥勅告臣必不敢祗受乞如前奏别賜擇人辭知制誥第七狀右臣先曽六次上奏辭免知制誥乞更擇人奉聖㫖令臣依累降指揮不許辭譲便受勅告者臣天性樸騃無佗伎能惟守信誠是為操履平居與等輩語言猶不敢欺罔况以奏牘聞於朝廷苟有毫髪不實不惟陛下睿聖憲章嚴明天地鬼神亦所不容臣之愚意但以知制誥之職當取天下文章髙妙逾衆絶倫者以充其選如臣野陋實不堪稱竭懇自歸前後非一而聖恩確然終未開察臣竊自傷悼幸生盛明之世而昭昭之心無以自列若黽勉包羞奉承詔㫖則天下之人皆謂臣已試而復辭已辭而復就盖習知朝命重於改移因欲飾譲以盗虚名如此則臣生負大罪死負餘愧雖進極榮顯不若啜菽飲水長為布衣也臣今若得請於朝則不肖之迹庶幾猶有以自明如其不然則矯偽之名至於身没骨朽不可湔洗臣夙夜念此寢則不安食則失味進退遑遑身無所措是敢不避煩瀆冒犯天威伏望聖慈哀其窮廹特寢恩命使得服役佗官以報萬一死不敢辭若朝廷以臣頑蔽不恭乞治臣之罪削黜流放靡不甘心所有知制誥勅告臣必不敢祗受乞如前奏别賜擇人辭知制誥第八狀右臣先曽七次上奏乞免知制誥奉聖㫖令臣依累降指揮不許辭譲便受告勅者臣竊聞去嵗權御史中丞王疇上言近年以來中外臣僚或因較量差遣或因論辨身計或因進以干譽或因罪而覬免肆為妄談輒形奏章皆心語兩違情實交戾外示輕官爵之意以欺於衆内實計分銖之利而争於上遺義忘耻至於要君用詐而安為小人之行陛下聖度慈仁包荒盖慝悉置不問彼小人者亦豈識恩徳之隆哉欲望朝廷應今後臣下有要君作偽如前所陳者并岀宸斷便賜聴許如此則罔上邀利者知所畏而士之行已有耻事君以誠者少加勸矣奉聖㫖今後臣僚所陳如有似此情渉詐慢者令中書樞密院取㫖施行凡疇所言實近嵗之大弊臣亦疾之如疇之志今臣自差修起居注以來前後辭免十有三次若朝廷以臣為誠則何惜曲囬大恩從臣所欲使臣不肖之迹稍有以自眀若以臣為詐則罔上邀利章奏煩多無臣為甚臣願以身就譴謫以彰前令之必行庶為陛下清此頽俗亦臣報國之一效也所有知制誥勑告臣必不敢祗受乞别賜擇人辭知制誥第九狀尋䝉恩改天章閣待制右臣先曽八次奏陳乞免知制誥奉聖㫖令臣依累降指揮更不許辭譲便受告勅者臣以愚懇煩凟天聴前後非一聖朝確然終不聴許臣誠戇昧不識所謂豈此職非臣不可為邪將從臣之請則隳紊綱紀敗壊風俗邪何請之之勤而拒之之堅也若以為非臣不可為則方今辭臣滿朝英俊比肩舉而用之無不稱職若以為隳紊綱紀敗壊風俗則臣之微志正欲朝廷無曠官羣下無竊位而已於綱紀風俗亦無所虧損不然者臣之所為果誖理傷道朝廷令之不從諭之不入至於四五至於八九侮慢威命無此為甚則當投之四荒以禦魑魅豈有但已者也臣不勝廹切之誠伏望聖慈察臣前後所奏或賜允從或加譴責其知制誥勅告臣必不敢祗受除待制舉官自代狀伏見三司度支判官尚書刑部郎中充集賢校理馮浩修己以謹與人以誠端良無邪恬淡不競居常處衆敦大有容臨義據正堅彊不奪乆在文館屢更任使比材量徳臣實不如今舉自代上殿謝官劄子嘉祐七年五月十一日上臣光伏䝉聖恩除天章閣待制兼侍講仍知諫院臣竊以為方今國家之得失生民之利病大要不過擇人賞罰豐財練兵數事而巳行道之人粗有智識者皆知之患在朝廷不盡聞雖聞不力行耳朝廷不盡聞此諫官之罪聞而不力行則非臣等之所及也凡此數事臣前忝諫官已嘗畧為陛下言之今陛下寘臣於侍從之列留臣以諫争之職恩施愈隆責望愈重臣有生安敢愛有言安敢隐伏願陛下擇其事之要重者特留聖心則天下幸甚不然臣雖朝夕侍前徒汚名位而費廪禄於公家之用果何益也取進止上謹習䟽嘉祐七年六月二十九日上月日具位臣光謹昧死上疏尊號皇帝陛下臣以駑蹇之質再為諌官荷陛下寵禄之優責任之重夙夜震恐不遑寕處思極竭愚忠以報塞萬一顧𤨏𤨏細務皆不足以煩凟聖聴竊以國家之治亂本於禮而風俗之善惡繋於習赤子之啼無有五方其聲一也及其長則言語不通飲食不同有至死莫能相為者是無佗焉所習異也至於古今亦然有服古之衣冠於今之世則駭於州里矣服今之衣冠於古之世則僇於有司矣衣冠烏有是非哉習與不習而巳矣夫民朝夕見之其心安焉以為天下之事正應如此一旦驅之使去此而就彼則無不憂疑而莫肯從矣昔秦廢井田而民愁怨王莽復井田而民亦愁怨趙武靈王變華俗效胡服而羣下不恱後魏孝文帝變胡服效華俗而羣下亦不恱由此觀之世俗之情安於所習駭所未見固其常也是故上行下效謂之風薰蒸漸漬謂之化淪胥委靡謂之流衆心安定謂之俗及夫風化已失流俗已成則雖有辯智弗能諭也彊毅不能制也重賞不能勸也嚴刑不能止也自非聖人得位而臨之積百年之功莫之能變也周易履之象曰君子以辨上下定民志故天子之令必行於諸侯諸侯之令必行於卿大夫士卿大夫士之令必行於庶人使天下之勢如身之使臂臂之使指莫不率從詩曰勉勉我王綱紀四方此體之本也昔三代之王皆習民以禮故子孫數百年享天之禄及其衰也雖以晋楚齊秦之彊不敢暴蔑王室豈其力不足哉知天下之不已與也於是乎翼戴王命以威懐諸侯而諸侯莫敢不從所以然者猶有先王之遺風餘俗未絶於民故也其後日已衰薄下陵上替晋平公之世魯子服回如晋還謂季孫意如曰晋之公室將遂卑矣六卿彊而奢傲將因是以習習實為常能無卑乎其後趙魏韓氏卒分晋國習於君臣之分不明故也降及漢氏雖不能若三代之盛王然猶尊君卑臣敦尚名節以行義取士以儒術化民是以王莽之亂民思劉氏而卒復之赤眉雖羣盜猶立宗室以從民望王郎矯託名氏而燕趙響應董卓之亂袁紹以誅卓為名而州郡雲合曹操挾獻帝以令諸侯而天下莫能與之敵操之心豈不欲廢漢而自立哉然沒身不敢為者畏天下之人疾之也自魏晋以降人主始貴通才而賤守節人臣始尚浮華而薄儒術以先王之禮為糟粕而不行以純固之士為鄙樸而不用於是風俗日壊入於偷薄叛君不以為耻犯上不以為非惟利是從不顧名節至於有唐之衰麾下之士有屠逐元帥者朝廷不能討因而撫之㧞於行伍授以旄鉞其始也取偷安一時而已及其乆也則衆庶習於聞見以為事理當然不為非禮不為無義是以在上者惴惴焉畏其下在下者睽睽焉伺其上平居則酒肉金帛甘言屈體以相媚恱得間則銛鋒利刄狠心詭計以相屠膾成者為賢敗者為愚不復論尊卑之序是非之理陵夷至於五代天下蕩然莫知禮義為何物矣是以世祚不永逺者十餘年近者四五年敗亡相屬生民塗炭及大宋受命太祖太宗知天下之禍生於無禮也於是以神武聪明躬勤萬幾征伐刑賞斷於聖志然後人主之勢重而羣臣懾服矣於是翦削藩鎮齊以法度擇文吏為之佐以奪其殺生之柄擥其金糓之富選其麾下精銳之士聚諸京師以備宿衛制其腹心落其爪牙使不得陸梁然後天子諸侯之分明而悖亂之原塞矣於是節度使之權歸於州鎮員之權歸於縣又分天下為十餘路各置轉運使以察州縣百吏之臧否復漢部刺史之職使朝廷之令必行於轉運使轉運使之令必行於州州之令必行於縣縣之令必行於吏民然後上下之叙正而紀綱立矣於是申明軍法使自押官以上各有階級以相臨統小有違犯罪皆殊死然後行伍之政肅而士用命矣此皆禮之大節也故能四征不庭莫不率服汛掃九州以陟禹之迹至於真宗重之以明徳繼二聖之志夙夜孜孜宣布善化銷鑠惡俗以至於今治平百年頑民殄絶衆心咸安此乃曠世難成之業陛下當戰戰慄慄守而勿失者也臣竊見陛下有中宗之嚴恭文王之小心而小大之政多謙譲不決委之臣下誠使所委之人常得忠賢則可矣萬一有姦邪在焉豈不危甚矣哉古所謂委任而責成功者擇人而授之職業叢脞之務不身親之也至於爵禄廢置殺生予奪不由巳岀不可也洪範曰惟辟作威惟辟作福臣之有作威作福害於而家㓙於而國威福之柄一失於人而習以為常則不可復收矣此明主之所慎也又頃以西鄙用兵權置經畧安撫使緫一路之兵得以便冝從事及西事巳平因而不廢其河東一路緫二十二州軍曏時節度使之權不能及矣唐始置㳂邉八節度亦如是而巳以其權任太重故後世有䟦扈之臣洛誥曰毋若火始燄燄厥攸灼叙弗其絶言慎其微也又將相大臣典諸州者多以貴倨自恃轉運使欲振舉職業徃徃故違戾而不肯從夫將相大臣在朝廷之時則轉運使名位固相逺矣及在外為知州則轉運使統諸州職也烏得以一身之貴庇一州之事轉運使不得問哉漢刺史以六百石吏督察二千石豈以名位之貴賤哉又自景祐以來國家怠於乆安樂因循而務省事執事之臣頗行姑息之政於是胥史讙譁而斥逐御史中丞輦官悖慢而廢退宰相衛士凶逆而獄不窮姦澤加於舊軍人罵三司使而法官以為非犯階級疑於用法朝廷雖特誅其人而已停之卒復收養之其餘有一夫流言於道路而為之變令推恩者多矣凡此數者殆非所以習民於上下之分也夫朝廷者四方之表儀也朝廷之政如是則四方必有甚者矣於是元帥畏偏禆偏禆畏將校將校畏士卒姦邢怯懦之臣至有簡省教閱使之驕惰保庇羸老使之繁冗屈撓正法使之縱恣詆訾粟帛使之憤惋甘言謟笑靡所不至於是士卒翕然譽之而歸怨於上矣彼既為之則此效之下既言之則上從之前既行之則後襲之苟彼為而此不效下言而上不從前行而後不襲則怨怒聚於其身而禍亂生矣長此不已日滋月益民之耳目習而安之此有以異唐之季世乎後魏孝明帝時征西將軍張彛子仲瑀上封事欲抑損武人不預清品羽林虎賁千餘人焚彛第殺彛父子官為收捕凶强者八人斬之其餘大赦以安之懐朔鎮人髙歡時奉使至洛陽見之歸而散家財以結客曰朝政如此事可知矣於是始有飛揚之志由是觀之紀綱不立則姦雄生心矣夫祖宗苦身焦思以變衰唐之俗而陛下髙拱熟視以成後魏之風此臣之所為陛下痛惜也臣愚以為陛下當奮剛健之志宣神明之徳凡羣臣奏事皆察其邪正辨其臧否熟問深思求合於道然後賞罰黜陟斷而行之則天下孰不曠然恱喜詩曰君子如怒亂庶遄沮君子如祉亂庶遄已盖言無所臧否之為患大也經略安撫使有征討之事則置之無事則當廢之儻未能廢則軍事廹急不暇奏知者使專之可也其餘民事皆委之州縣一斷於法或法重情輕情重法輕可殺可徒可宥可赦並聴本州申奏決之朝廷何必出於經略安撫使哉轉運使規畫號令行下諸州而諸州違戾不從者朝廷當辨其曲直若事理實可施行而州將恃貴勢故違之者當罪州將勿罪轉運使將校士卒之於州縣及所統之官或公卿大臣有悖慢無禮者明著階級之法使斷者不疑將帥之官有廢法違道以取恱於下歸怨於上者當隨其輕重誅竄廢黜公正無私御衆嚴整者當量其才能擢用褒賞如是則上之人難動而下用命矣上之人難動而下用命此所以尊朝廷也上下已明綱紀巳定然後修儒術隆教化進敦篤退浮華使禮義興行風俗純羙則國家保萬世無疆之休猶倚南山而坐平原也臣光昧死再拜上䟽傳家集巻二十四欽定四庫全書傳家集巻二十五宋司馬光撰章奏八論因差遣例除監司劄子嘉祐七年七月九日上臣光竊以轉運使提㸃刑獄轉運判官等皆宣布國家詔令督察官吏善惡一方之民休戚所繫事任至重不可輕以授人伏見近嵗以來多以所厯差遣循例得之不問其人賢與不肖有無績效至如真楚泗州之類雖云繁劇然民事至少賔客實多大抵能飾厨傳即為稱職官滿之日徃徃擢為監司若其人實有材能政迹則雖在他州亦當擢用若無以異於庸人則不當獨以此數州為僥倖之津塗也臣欲乞應諸處知州軍有政迹尤異及功效著明者特賜勅書奬諭仍令中書記録姓名若轉運使提㸃刑獄轉運判官等有闕即采擇用之其餘諸處差遣舊例得監司者今後亦皆寢罷得替日依舊入常程差遣如此則官吏有所勸監司皆得人矣取進止論財利䟽嘉祐七年七月上月日具位臣光謹昧死上䟽尊號皇帝陛下臣聞昔楚莊王以無災為懼曰天豈棄不糓乎范文子曰唯聖人能外内無患然則嵗小不登邉鄙有警未必非國家之福也伏見今春天乆不雨陛下憂勞於内公卿惶恐於外豈不以公私之積素不充實若遇饑饉將無以相恤乎一朝京師得雨逺方未徧則君臣釋然相慶不復以民食為念陛下安知來嵗之旱不甚於今嵗乎盖天降災沴蠻夷猾夏㓂賊姦宄此堯舜所不能免也即不幸有大水大旱方二三千里戎狄乘間而窺邉細民窮困而為盜軍旅數起乆未有功府庫之蓄積已竭百姓之生業已盡陛下當此之時將以何道救之乎臣不知陛下與公卿大臣以此為必無而不足憂乎將以為有之而不為之備俟事至然後憂之也若俟事至然後憂之雖以陛下之聖明得益稷太公以為輔佐臣以為不及矣何則聖賢之治皆積以嵗月然後有功欲天下之家給人足固不可一日具也周易既濟之象曰君子以思患而豫防之思患而豫防之此其時矣失之愈逺救之愈難柰何日復一日取適目前而已乎晋武帝時何曽謂其子孫曰吾每見主上所說皆平生常語未嘗及經逺大計吾子孫其及於亂乎其後五胡搆亂中州覆沒生民塗炭幾三百年由是觀之上下偷安不為逺謀此最國家之大患也詩曰哀哉為猷匪先民是程匪大猷是經維邇言是聴維邇言是争如彼築室於道謀是用不潰于成方今之政何以異此此臣之夙夜所為痛心疾首者也古之王者藏之於民降而不能乃藏於倉􅅒府庫故上不足則取之於下下不足則資之於上此上下所以相保也今民既困矣而倉􅅒府庫又虚陛下儻不深以為憂而早為之謀臣恐國家異日之患不在於他在於財力屈竭而已矣今朝廷不循其本而救其末特置寛恤民力之官分命使者旁午四出争言便冝以變更舊制米鹽靡宻之事皆非朝廷所當預者張設科條不可勝紀或不如其舊益為民患或朝三暮四移左於右其間果能利民者不過放散縣官之物以予民耳是誠損上益下王者之仁政也然臣聞古之聖王飬之有道用之有節上有餘財然後推以予民是以上下交足而頌聲作矣今入者日寡出者日滋是所謂厭其原開其瀆其竭可立而待也公家既竭不取諸民將焉取之是徒有利民之名而無利民之實果何益哉夫寛恤民力在於擇人不在立法若守令得人則民力雖欲毋寛其可得乎守令非其人而徒立苛法適所以擾民耳自置此官以來於今累年臣訪之民間未聞其困弊小瘳於前也然則為今之術柰何曰在随材用人而乆任之在養其本原而徐取之在減損浮冗而省用之何謂隨材用人而乆任之夫人之材性各有所宜雖周孔之材不能徧為人之所為况其下乎固當就其所長而用之今朝廷用人則不然顧其出身資叙何如耳不復問其材之所堪也故在兩禁則欲其為嚴助司馬相如任將帥則欲其為衛青霍去病典州郡則欲其為龔遂黄覇尹京邑則欲其為張敞趙廣漢司財利則欲其為孔僅桑𢎞羊世豈有如此人哉故財用之所以匱乏者由朝廷不擇專曉錢糓之人為之故也國初三司使或以諸衛將軍諸司使為之判官則朝士曉錢糓者皆得為之不必用文辭之士也先朝以數路用人文辭之士寘之館閣曉錢糓者為三司判官曉刑獄者為開封府推判官三者職業不同趣舍各異莫相渉也然後人主以時引對訪問以察之使令以試之積乆以觀之覈其真偽辨其臧否考其功效然後進之退之未必厯其職者皆須進用不可復退也故羣臣各宣其用而萬事交舉矣夫官乆於其業而後明功乆於其事而後成是以古者世官相承以為氏姓先朝陳恕領三司十餘年至今稱能治財賦者以恕為首豈恕之材智獨異於人哉盖得乆從事於其職故也至於副使判官堪其事者亦未數易也是以先帝屢行大禮東封西祀廣修宫觀而財用有餘者用人專而任之乆故也近嵗三司使副使判官大率多用文辭之士為之以為進用之資塗不復問其習與不習於錢糓也彼文辭之士習錢糓者固有之矣然不能專也於是乎有以簿書為煩而不省以錢糓為鄙而不問者矣又居官者出入遷徙有如郵舍或未能盡識吏人之靣知職業之所主已捨去矣臣頃者判度支句院甫二年耳上自三司使下至檢法官改易皆徧甚者或更厯數人雖有恪勤之人夙夜盡心以治其職人情稍通綱紀粗立則捨之而去後來者意見各殊則曏之所為一皆廢壊况怠惰之人因循苟且惟思便身不顧公家者乎如此而望太倉有紅腐之粟水衡有貫朽之錢臣未知其期也凡百官莫不欲乆於其任而食貨為甚何則二十七年耕然後有九年之食今居官者不滿三嵗安得有二十七年之效乎臣愚以為朝廷宜精選朝士之曉練錢糓者不問其始所以進或進士或諸科或門䕃先使之治錢糓小事有功則使之權發遣三司判官事及三年而察之實效顯著然後得權三司判官事又三年更有實效然後得為正三司判官其無實效者退歸常調勿復収用其諸路轉運使不復以路分相壓使之乆於其任有實效者或自權為正自轉運副使為轉運使無實效者亦退歸常調勿復収用毎三司副使闕則選三司判官及諸路轉運使功效尤著者以補之三司使闕亦選於副使以補之三司使乆於其任能使用度豐衍公私富實者増其秩使與兩府同而勿改其職如此則異日財用之豐耗不離於已不得諉之他人必務為永乆之規矣其文辭之士則自有資塗不必使為錢糓之吏以輕之也何謂飬其本原而徐取之善治財者養其所自來而收其所有餘故用之不竭而上下交足也不善治財者反此夫農工商賈者財之所自來也農盡力則田善收而糓有餘矣工盡巧則噐斯堅而用有餘矣商賈流通則有無交而貨有餘矣彼有餘而我取之雖多不病矣今之有司自謂能治財者臣見之矣凍餒其民而豐積聚者也掃土以市禄位而不恤後人者也捃拾麻麥而喪丘山者也保惜一錢而費萬金者也不操白刃而為㓂攘者也姦巧簿書而罔君上者也必曰養其所自來而收其所有餘則聞者以為笑矣夫使稼穡者饒樂而惰㳺者困苦則農盡力矣堅好便用者獲利浮偽侈靡者不售則工盡巧矣公家之利捨其細而取其大散諸近而取諸逺則商賈流通矣農工商賈皆樂其業而安其富則公家何求而不獲乎夫農天下之首務也古人之所重而今人之所輕非獨輕之又困苦莫先焉何以言之彼農者苦身勞力衣麤食糲官之百賦出焉百役歸焉嵗豐則賤貿其糓以應官私之求嵗㓙則流離凍餒先衆人填溝壑如此而望浮食之民轉而縁南畆難矣彼直生而不知市井之樂耳苟或知之則去而不返矣故以今天下之民度之農者不過二三而浮食者常七八矣欲倉廪之實其可得乎臣愚以為几農民租稅之外宜無有所預衙前當募人為之以優重相補不足則以坊郭上户為之彼坊郭之民部送綱運典領倉庫不費二三而農民常費八九何則儇利戇愚之性不同故也其餘輕役則以農民為之嵗豐則官為平糴使糓有所歸嵗凶則先案籍賙贍農民而後及浮食者民有能自耕種積榖多者不籍以為家貲之数如此則榖重而農勸矣彼百工者以時俗為心者也時俗貴用物而賤浮偽則百工變而從之矣時俗者以在上之人為心者也在上好樸素而惡滛侈則時俗變而從之矣其百工在官者亦當擇人而監之以工致為上華靡為下物勒工名謹考其良苦而誅賞之取其用不取其数則器用無不精矣彼商賈者志於利而已矣今縣官数以一切之計變法更令棄信而奪之彼無利則棄業而從他縣官安能止之哉是以茶鹽棄捐征稅耗損凡以此也然則縣官之利果何得哉善治財者不然將取之必予之將斂之必散之故日計之不足而嵗計之有餘此廼白圭猗頓之所知豈國家選賢擇能以治財其用智顧不如白圭猗頓邪患在國家任之不乆責近效而遺逺謀故也夫伐薪者刈其條枚養其本根則薪不絶矣若并本根而伐之其得薪豈不多哉後無繼矣是非難知之道也然有司不為者彼其心曰吾居官不日而遷不立效扵目前以自顯顧養財以遺後之人使為功吾何頼焉是非特有司之罪也亦朝廷用人之法驅之使然也何謂減損浮冗而省用之昔太祖初得天下之時止有一百一十一州耳江南兩浙西川富饒之土皆為異域又承五代荒亂之餘府庫空竭豪傑棊布扵海内戎狄窺覦扵邉境戎車歳駕四方多虞當是之時内給百官外奉軍旅誅除僣偽賞賜鉅萬未嘗聞財用不足如今日之汲汲也陛下承祖宗之業奄有四百餘州天下一統戎狄欵塞富饒之土貢賦相屬承平積乆百姓阜安是冝財用羡溢百倍扵前柰何竭府庫之所蓄罄率土之所有當天下無事之時遑遑焉專救經費而不足萬一有不可期之災患將何以待之乎夫以國初之狹隘艱難財用冝不足而有餘今日之廣大安寕財用冝有餘而不足陛下亦嘗熟思其所以然之理乎得非太祖所養者皆有功有用之人陛下所養者未必盡有功用乎臣竊見陛下天性恭儉不好侈靡宫室苑囿皆因祖宗之舊無所更造或隳頓荒翳不加修治飲饍衣服器皿帷帳適足供用不極精華或苦惡弊綻亦不更易雖唐虞之土階三尺茅茨不翦殆無以過然左右侍御之人宗戚貴臣之家第宅園圃服食器用徃徃窮天下之珍怪極一時之鮮明惟意所欲無復分限以豪華相尚以儉陋相訾厭常而好新月異而嵗殊是以費用不足則誅求無厭匄貸不耻甚者或依慿詔令以發府庫之財假託供奉以糜縣官之物真偽莫辨多少不會陛下聖度寛仁不欲拒塞惡聞人過不加案詰至扵頒賜外廷之臣亦皆踰溢常数不循舊規如曏者皇女初生所散包子之類費用不可勝紀臣嘗聞耆舊之人言先朝公主在宫中俸錢不過月五千其餘後宫月給大抵倣此非時未嘗輕有賜予雖有賜予亦不甚豐竊聞近日俸給賜予比於先朝何啻数十倍矣漢明帝曰我子豈冝與先帝子等乎夫等猶不可又况過之是以祖宗之積窮於賜予困於浮費臣不能知其詳以外望度之什耗七八矣内藏已虚而浸滛於左藏矣夫府庫者聚天下之財以為民也非以奉一人之私也祖宗所為置内藏者以備饑饉兵革非常之費非以供陛下奉養賜予之具也今内藏庫專以内臣掌之不領於三司其出納之多少積蓄之虛實簿書之是非有司莫得而知也若皆以奉養賜予而盡之一旦有饑饉兵革之事三司經費自不能周内藏又無所仰斂之扵民則民已困竭得無狠狽而不支乎此臣夙夜所懔懔也今陛下所以有唐虞之德而無唐虞之治者其失在於不忍而好予不忍則不誅有罪好予則不待有功不誅有罪則姦邪欺罔而不忌不待有功則貪佞徼幸而無厭治道之所以不格扵上下者凡以此也昔韓昭侯有弊袴命藏之侍者曰君亦不仁者矣不賜左右而藏之昭侯曰吾聞明主愛一嚬一笑嚬有為嚬笑有為笑今袴豈特嚬笑哉吾必待有功者彼小國諸侯猶能慎賞如是而國以富彊况以四海之主不行無功徼幸之賞杜塞甘言悲辭之請則唐虞之治何逺之有哉夫府庫金帛皆生民之膏血州縣之吏鞭撻其丁壯凍餒其老弱銖銖寸寸而誅之今以富大之州終嵗之積輸之京師適足以供陛下一朝恩澤之賜貴臣一日飲宴之費陛下何獨不忍於目前之羣臣而忍之於天下之百姓乎夫以陛下恭儉之德擬乎唐虞而百姓困窮之弊鈞於秦漢秦漢竭天下之力以奉一身陛下竭天下之力以資衆人其用心雖殊其病民一也此臣之所以尤戚戚者也又宫掖者風俗之原也貴近者衆庶之法也故宫掖之所尚則外必為之貴近之所好則下必效之自然之勢也是以内自京師士大夫外及逺方之人下及軍中士伍􅎌畆農民其服食器用比於数十年之前皆華靡而不實矣曏之所有今人見之皆以為鄙陋而笑之矣夫天地之産有常而人類日繁耕者寖寡而㳺手日衆嗜欲無極而風俗日奢欲財力之無屈得乎哉又府史胥徒之屬居無廪禄進無榮望皆以㗖民為生者也上自公府省寺諸路監司州縣郷村倉場庫務之吏詞訟追呼租稅徭役出納會計凡有毫釐之事闗其手者非賂遺則不行是以百姓破家壊産者非縣官賦役獨能使之然也大半盡於吏家矣此民之所以重困者也又國家比來政令寛弛百職隳廢在上者簡倨而不加省察在下者侵盗而恣為姦利是以毎有營造貿買其所費財物十倍扵前而所收功利曽不一二此國用之所以尤不足者也又自古百官皆有常員而國家用磨勘之法滿嵗則遷日滋月益無復限極是以一官至数百人則俸禄有増而無損矣又近嵗養兵務多不務精夫兵多而不精則力用寡而衣糧費衣糧費則府庫耗府庫耗則賜賚稀是以不足者豈惟民哉兵亦貧矣䇿之失者無甚於此也凡此数者皆所以竭民財者也陛下安得熟視而無所變更邪臣愚伏願陛下觀今日之弊思將來之患深自抑損先由近始凡宗室外戚後宫内臣以至外廷之臣俸給賜予皆循祖宗舊規勿復得援用近嵗僥倖之例其踰越常分妄有干求者一皆塞絶分毫勿許若祈請不已者冝嚴加懲譴以警其餘凡文思院後苑作所為竒巧珍玩之物不急而無用者一皆罷省内自妃嬪外及宗戚下至臣庶之家敢以奢麗之物夸眩相髙及貢獻賂遺以求恱媚者亦明治其罪而焚毁其物於四達之衢專用樸素以率先天下矯正風俗然後登用亷良誅退貪殘保佑公直消除姦蠧澄清庶官選練戰士不禄無功不食無用如此行之乆而不懈臣見御府之財將朽蠧而無所容貯太倉之粟將彌漫而不可蓋藏農夫棄糧於􅎌畆商賈譲財於道路矣孰與今日汲汲以應目前之求懔懔以憂將來之困乎夫食貨者天下之急務今窮乏如是而宰相不以為憂意者以為非已之職故也臣願陛下復置緫計使之官使宰相領之凡天下金帛錢糓𨽻於三司及不𨽻三司如内藏庫奉宸庫之類緫計使皆統之小事則官長專逹大事則謀於緫計使而後行之嵗終則上其出入之数於緫計使緫計使量入以為出若入寡而出多則緫計使察其所以然之理求其費用之可省者以奏而省之必使嵗餘三分之一以為儲蓄備禦不虞凡三司使副使判官轉運使及掌内藏奉宸䓁庫之官皆委緫計使察其能否考其功狀以奏而誅賞之若緫計使乆試無效則乞陛下罷退其人更置之議者必以為宰相論道經邦爕理隂陽不當領錢糓之職是皆愚人不知治體者之言昔舜舉八愷使主后土奏庶艱食貿遷有無地平天成九功惟叙周禮冡宰以九職九賦九式九貢之法治財用唐制以宰相領鹽鐡度支户部國初亦以宰相都提舉三司水陸發運等使是則錢糓自古及今皆宰相之職也今譯經潤文猶以宰相領之豈有食貨國之大政而謂之非宰相之事乎必若府庫空竭閭閻愁困四方之民流轉死亡而曰我能論道經邦爕理隂陽非愚臣之所知也臣不勝狂愚冒犯忌諱惟陛下裁察臣光昧死冄拜上䟽傳家集巻二十五欽定四庫全書傳家集巻二十六宋司馬光撰章奏九乞施行制國用䟽上殿劄子臣近曽上䟽以即今公私財用率皆窮窘專奉目前經費猶汲汲不足萬一有大水大旱饑饉相仍戎狄侵邉盗賊羣起發兵誅討不時克定倉庫已空百姓又竭其憂患不細必當早為之謀以救斯弊乞隨材用人使乆於其任務農通商以蕃息財物節省賜予裁損浮費又以宰相領緫計使之職凡天下金帛錢糓屬於三司不屬三司者緫計使皆領之嵗終則校其出入之数若入少而出多則思其所以救補之術奏而行之常使嵗餘三分之一以備饑饉軍旅非常之費其内外錢糓官之長皆委緫計使察其能否考其功狀以奏而誅賞之此誠當今之急務伏望陛下與公卿大臣定議早賜施行取進止乞召皇姪就職上殿劄子嘉祐七年七月二十七日臣伏見陛下以皇姪宗實知宗正寺宗實辭譲多日不肯就職陛下兩次遣使者召令受勅中外之人無不欣恱以為非陛下睿智聰明深謀逺慮㫁自聖志確然不惑何以及此夫王者以大庇生民為仁安固基業為孝仁孝之道莫大於此今陛下一舉而兩有之天下聞之安得不喜又爵禄者人之所貪徃徃校量絲毫干求爭訟不顧亷耻今宗實特受陛下簡㧞恩寵殊異而以榮為懼辭譲懇切首尾十月尚未受詔其智識操行必賢於人益足彰陛下知人之明此天下所以尤喜也然陛下之於宗實屬則父也尊則君也在禮父召無諾唯而起君命召不俟駕今陛下兩遣使者召之宗實雖不受恩命亦當入見面自陳述豈可在家堅卧不起臣愚伏願陛下更遣近上内臣徃傳聖意責以禮法彼冝不敢不來來則陛下面加敦諭使知聖心懇惻發於至誠彼冝不敢不受如此則陛下仁孝之徳純粹光大本末如一無以復加此皆陛下即今所行而臣復區區進言者誠欲陛下守之益堅行之不倦故也取進止論覃恩劄子嘉祐七年七月五日上臣光等伏覩今月三日御扎取今年季秋擇日有事於明堂所有合行諸般恩賞一依南郊例施行臣等竊見皇祐二年親祀明堂是時以初行希闊之禮文武臣僚並轉一官今國家修舉舊禮乃是常典雖已誕告恩賞一依南郊例然竊慮貪冒無識之人尚有希覬流言云云動揺中外况今庶官濫溢經費窘竭豈可復踵徃嵗之失以増今日之弊伏望朝廷預先明降指揮言今嵗所行明堂之禮更不覃恩轉官使中外咸知以絶僥倖者之望取進止請早令皇子入内劄子嘉祐七年八月二十七日上臣等伏聞擇今月二十五日差内臣宣皇子曙入内而曙猶復稱病未入臣等竊以臣子有君命召不俟駕之禮使者有受命不受辭之義今曙但以恐懼不敢便當陛下非常恩寵而所差内臣亦合以臣子事君父之禮曉諭切責使即奉命豈得備禮致命黙然徃復殊不副陛下聖意其今月二十五日宣曙内臣伏乞特行責降以懲不職之罪况皇子之名本非官職無容避譲今詔命巳下二十餘日而曙既為陛下之子禮當朝夕定省偹人子之職不冝乆處外宅伏望聖慈速賜選差都知御藥諭以君父之命不可違臣子之職不可闕敦廹切責使即時入内并下太宗正司及本宫亦仰以禮敦遣不得更容遷延取進止乞直講不限年及出身劄子嘉祐七年九月一日上臣伏見國子監直講見缺数員乆而未補盖以近制須年四十以上及進士九經出身方得為之臣愚以為學官正冝取徳行經術可為師表之人不當限以苛法若不察其人之賢愚而惟年齒出身之問則雖有徳行如顔回經術如王弼皆終身不可為學官也又舊制學官皆先試講說然後就職近嵗此法亦因循不行臣欲乞今後應國子監直講有闕許本監或兩制以上舉京朝官選人有徳行經術者具姓名聞奏更不問年紀及出身其國子監所舉者委學士或舎人院試兩制以上所舉者委國子監試並須衆官聚㕔互舉疑義面試講說擇其義理精通者保明聞奏方降勅差除若徳行邪僻經術荒謬而輒敢舉薦保明者並乞嚴行朝典取進止乞復夏倚差遣劄子嘉祐七年九月十七日上臣先任通判并州事日准經畧司牒徃麟州勾當公事伏見通判本州事夏倚通敏恪勤勇於忠義苟利公家不為身謀始與臣共議於屈野河西修堡以止西夏侵耕及見管幹軍馬司公事郭恩恃勇輕敵倚與臣書稱恩萬舉萬敗經畧司方行止約恩巳覆沒倚收撫散兵孤城獲安既而倚與衆人一例獲罪降充監當及今五年兩經大赦應當時河西連累之人罪稍輕者並已復舊差遣惟倚尚合入知縣資叙比於衆人獨為困躓誠可哀憐臣竊以倚當日知恩必敗而力不能制恩之敗績實非倚罪兼其人公忠材智誠有可稱不可專以一眚掩其衆善伏望聖慈特與復通判差遣庶使任職之臣知徇公獲罪終不能乆為身累有所勸慕取進止乞推恩老臣劄子嘉祐七年九月十九日上臣伏見皇祐二年陛下親祀明堂曽召前兩府杜衍任布二人陪位及禮畢陛下推恩特賜衍布子男各一人進士出身今陛下冄舉希闊之典亦曽召前宰相龎籍陪位臣竊以籍曏守西邉宣力實多懐柔凶渠復歸皇化其在宰府屬蠻㓂慿陵震驚二廣翼賛聖謀廓清醜類及告老之年精力猶壯堅辭榮禄去位家居實朝家之碩臣方今之耆俊遇兹盛禮伏望陛下用杜衍任布前例特推恩於籍子男一人以慰其心足以示養老優賢増聖政之羙論董淑妃諡議䇿禮劄子元祐七年九月二十三日上臣伏見充媛董氏薨追贈婉儀又贈淑妃陛下親為之輟朝掛服羣臣進名奉慰又命有司為之定諡及行䇿禮於𦵏日仍給鹵簿外廷之議皆以為董氏名秩本㣲病亟之日方拜充媛今送終之禮太為崇重臣按古者婦人無諡近世唯皇后有諡及有追加䇿命者妃嬪已下未之有也鹵簿本以賞軍功未嘗施於婦人唯唐平陽公主有舉兵佐髙祖定天下之功方給鼓吹後至中宗時韋后建議始令妃主葬日皆給鼔吹非明主之令典不足法也臣愚伏念陛下恭儉寡欲近嵗以來後宫之寵絶無大盛過分著聞於外者此四方之人所以咨嗟頌詠歸仰聖徳也不意今兹以既沒之董氏而有司謟曲妄崇虚飾以隳紊制度凟慢名器使天下之人疑陛下隆於女寵甚非所以光益聖徳也况禮数既崇則凡喪事所須用度必廣今明堂大禮新畢帑藏空虚賦斂日滋元元愁困誠不宜更崇大後宫之喪以横増煩費夫亡者雖加之虚名盛飾豈能復知而足以仰累聖徳臣竊惜之伏望陛下特詔有司悉罷議諡及䇿禮事其𦵏日更不給鹵簿凡喪事所湏務從減損不必盡一品之禮以明陛下薄於女寵而厚於元元也取進止論寺額劄子嘉祐七年十月四日上臣伏覩近降赦節文應天下係帳存留寺觀院舎自來未有名額者特賜名其在四京管内者雖不係帳今日已前蓋到舎屋及百間以上者亦賜名額竊以釋老之教無益治世而聚匿㳺惰耗蠧良民此明識所共知不待臣一二言也是以國家明著法令有創造寺觀一間以上者聴人陳告科違制之罪仍即時毁撤盖以流俗戇愚崇尚釋老積弊巳深不可猝除故為之禁限不使繁滋而已今若有人公違法令擅造寺觀及百間已上則其罪已大幸遇赦恩免其罪罰可矣其棟宇瓦木猶當毁撤沒入縣官今既不毁而又明行恩命錫之寵名是勸之也臣聞為人上者洗濯其心壹以待民是以令行禁止而莫敢不從今立法以禁之於前而發赦以勸之於後則凡國家之號令將使民何信而從乎臣恐自今以徃姦滑之人將不顧法令依慿釋老之教以欺誘愚民聚斂其財以廣營寺觀務及百間以上以湏後赦冀幸今日之恩不可復禁矣方今元元貧困衣食不贍仁君在上豈可復唱釋老之教以害其財用乎事有㣲而患深令有近而害逺者此之謂也伏望陛下追改前命應天下寺觀院舎不係帳者不以舎屋多少并依前後勅條處分其昨來赦文内四京寺觀院舎雖不係帳亦賜名額一節乞更不施行庶使號令為民所信而㳺惰不能為姦也取進止言賈黯劄子嘉祐七年十月十二日上臣伏見權知開封府賈黯本以文藝進身不閑吏事曏在流内銓三班審官院已無聲迹可紀及尹京邑當繁劇之任尤非所長區斷乖方怨嗟盈路伏乞朝廷量其所能授以佗職别選差人知開封府庶合衆心取進止言王逵劄子嘉祐七年十月十九日上臣竊聞監兖州景靈宫王逵近降勅差知萊州逵暴戾凶狡陵上虐下所至為害朝野具知今年齒巳衰猶汚仕籍若復授以一州使為長吏必恣行不法殘害民物監司畏之莫敢詰問使一境之人何所控告伏望朝廷檢會逵年紀及察逵平生事迹勒令致仕或只與監當差遣永不得令親民取進止言王逵第二劄子尋改除逵西京留臺臣先曽上言新差知萊州王逵暴戾凶狡殘害民物乞檢會逵年紀及平生事迹勒令致仕或只與監當差遣至今未聞朝廷追改前命臣竊以善為政者視民如子見不仁者誅之如鷹鸇之逐鳥雀也故害民之吏患在不知知而不除使戕賊良善不愛一州而愛一酷吏豈為民父母之意哉伏望朝廷檢會臣前來所奏早賜施行取進止言陳烈劄子嘉祐七年十二月十八日上臣等伏見朝廷曏以福州處士陳烈好學篤行動遵禮法樂道養志名聞京師故舉之閭閻之中以為學官烈辭譲未至今聞福建路提刑王陶奏據福州勘到烈為妻林氏疾病瘦醜遣歸其家十年不視陶因言烈貪汚險詐行無纎完乞盡追奪前後所受恩命臣等素不識烈不知其人果為如何惟見國家常患士人不修名檢故舉烈等以奬勵風俗若烈平生操守出於誠實雖有底滯迂闊之行不能合於中道猶為守節之士亦當保而全之豈可毁壊挫辱疾之如讐書曰不恊于極不罹于咎皇則受之古人所以禮九九市駿骨蓋以此也若其内懐姦惡虧敗名教外飾詐偽沽釣聲利則朝廷曏者以為有道之士不次用之今乃醜行布於四方其為愧耻亦不細矣其始者薦舉之人安可置其罪而不問臣等欲望陛下委鄰路監司再行體量本人平生事迹善惡虚實或選差公正官吏通儒術識大體者覆勘前件公事若情理不至深重止於夫妻不相安諧則使之離絶而已湔洗其過庶幾復伸眉於後又使四方節行之士不憂橫辱得以安恬於閭里若實有醜惡之迹敗亂名教則當嚴賜刑誅并治舉者之罪以明至公論赦劄子嘉祐七年十月二十七日上臣伏見國家每下赦書輒云敢以赦前事言者以其罪罪之誠欲恩澤下究而號令必信也比見臣僚多以私意偏見奏赦前事乞不原赦或更特行編配重於不經赦之人朝廷皆從其請若其人情理巨蠧必不可赦者則國家當於約束勅及赦文内明白言之若所坐不至甚重而特不赦是恩澤有所不均而同罪之人有幸有不幸也且今刼盜殺人不死及雜犯死罪猶赦之而微罪不赦是則罪之輕重不繫於人主不刋之法令而決於人臣一人之私意也況使經赦之人仍就編配得罪重於不經赦者尤無謂也夫赦者誠非致治之道然朝廷若能永無赦令使有罪者必刑斯人知恐懼莫敢犯矣今既數下赦令而使大罪得免小罪被刑經赦者其罰重不經赦者其罰輕臧否糾紛使百姓何所取信哉臣愚欲望陛下自今犯罪之人情理巨蠧必不可赦者乞於豫降約束勅内明白言之其餘並從赦文處分其有指赦作過情狀顯然不因臣僚奏請陛下聖意特不原免者止宜依法施行亦不可使重於赦前之罪應昨赦前犯罪不至編配而赦後特行編配者並乞放令逐便庶使恩澤均一號令明信言夀星觀御容劄子嘉祐七年十二月三月上臣等前者伏覩陛下幸夀星觀奉安真宗御容當是時臣等不知事之本末未敢進言自後方知本觀舊日止有先帝時所畫夀星近因本觀管幹内臣吳知章妄有奏陳稱是先帝御容意欲張大事體廣有興修自為勞効别圖恩賞陛下天性仁孝以為崇奉祖宗重違其請遂更畫先帝御容以易夀星之像改為崇先觀知章既得御容倚以為名姦詐之心不知紀極乃更求開展觀地别建更衣殿及諸屋宇將近百閒制度宏侈計其所費踰數千萬向去增益未有窮期臣等竊以祖宗神靈之所憑依在於太廟木主而已自古帝王之孝者莫若虞舜商之髙宗周之文武未聞宗廟之外更廣為象設然後得盡至誠也唯髙宗祭祀親廟微為豐數故傅説曰黷于祭祀時謂弗欽禮煩則亂事神則難祖已曰祀無豐于昵盖規之也後至漢氏始為原廟當時醇儒達禮者靡不譏之況畫御容於道宫佛寺而又為夀星之服其為黷也甚矣且又太祖太宗御容在京師者止於興國寺啓聖院而已真宗御容已有數處今又益以崇先觀是亦豐于昵也無乃失尊尊之義乎原其所來止因知章妄希恩澤乃敢恣為誣罔興造事端致陷朝廷於非禮今既奉安御容難以變更若只就本觀舊来已修屋宇固足崇奉所有創添屋宇伏乞一切停寢止令有司以時侍奉所有知章誣罔聖聰依託御容妄有干請廣興力役乞下所司取勘窮治姦狀明正其罪論儀鸞失火劄子嘉祐七年八月十一日上臣竊聞今月九日夜大慶殿前儀鸞司房内失火煙焰已起燒及屋宇側近守宿之人知覺差早僅能救滅或聞聖恩欲寛貸失火之人竊以宫省之内火禁不可不嚴嚮使救之稍緩為災不細伏望選差不干礙官一員子細檢定火發蹤由委開封府依公盡理根勘從初失火因依應干繫人等嚴賜施行所貴戒勵後人不敢懈慢傳家集巻二十六欽定四庫全書傳家集卷二十七宋司馬光撰章奏十論后妃封贈劄子嘉祐七年十二月二十二日上臣伏聞學士院新定後宫封贈父祖制度皇后與妃皆贈三代臣竊以為不可夫禮之所慎在於尊卑之分别嫌明㣲故國君沐粱大夫沐稷士沐粱盖以大夫貴近於君故推而逺之以防僣偪之端士賤逺於君雖與之同物無所嫌也况后妃之際實治亂之本聖人於此尤兢兢焉皇后敵體至尊母儀四海六宫之内無與等夷妃品秩雖貴而皇后猶為女君今封贈之典混而為一臣實懼焉雖陛下聖明宫壼之政貴賤有倫必無僣偪之憂然非所以別嫌疑防萌兆垂法度示子孫也昔漢文帝幸郎署慎夫人與皇后同坐中郎將袁盎引却慎夫人席曰陛下既以立后慎夫人乃妾妾主豈可同坐哉文帝善其言彼少頃同席盎猶以為不可而犯顔力爭况著之典䇿以為百世之法乎臣謹按天聖中遇南郊大禮皇太后追贈三代太妃止贈二代然則妃贈三代乃近嵗之失不可以不正也議者或謂外廷之臣凡入兩府者皆贈三代妃正一品禮不可以後之臣竊以為不然聖王制禮内外異宜不可均壹自宰相樞宻副使名秩雖殊而比肩為臣共同職業俱贈三代不足為嫌皇后與妃位次相亞而有妾主之分以此尤宜分別名噐使之著明以防後世之有僣差不可鹵莽滅裂苟然而已也臣愚欲望陛下特降聖㫖改定新制自今後唯皇后得贈三代自妃以下皆不過二代若以外廷之臣封贈太優則乞自今後唯宰相樞宻使得贈三代自參知政事以下止於二代庻幾得禮之宜取進止乞以假日入問聖體劄子嘉祐七年三月二十一日上臣等竊以休假之令盖愍羣臣職事勞苦故因節序使得歸家享祀宴樂盡其私㤙今陛下聖體雖安然飲饍起居尚未復舊將來寒食節假頓經七日羣臣不奉天顔曉夕之心豈能自安欲乞自入假以後毎隔日許兩府及知雜御史以上一次問聖體仍乞召兩府入對便殿所貴中外之人盡知陛下聖體康寕各獲安心取進止乞遣告哀使劄子嘉祐八年四月九日上臣等竊見大行皇帝晏駕已近旬曰其告哀於契丹使人尚未進發兼聞不曽素戒使者對答繼嗣之辭臣等竊議深恐未便何則國家既與契丹約為兄弟遭此大喪立當訃告敵中刺探之人所在有之今天下縞素敵中豈得不知而訃告之人尚未到彼敵謂中國有何事故能不猜疑自古大宗無子則取於小宗以為後著在禮典豈為國惡若敵人有問盡以實對有何所傷今問繼嗣於使人而使人對以不知事體豈得便穏况陛下初為皇子之時詔書已布告天下敵中安得不知今若答以虗辭不足詐彼而適足取其笑侮耳國家自與契丹和親以來五十有六年生民樂業令國有大故正是鄰敵闚伺之時豈可更接之失理自生間隙臣等願朝廷早决此議令使人晝夜兼程進發若敵中問及繼嗣皆以實告孔子曰言忠信雖蠻貊之邦行矣臣等愚意竊以如此為便取進止上皇太后䟽嘉祐八年四月十三日上月日具位臣司馬光昧死再拜上䟽皇太后殿下羣生無福大行皇帝奄弃天下皇帝繼統哀毁成疾未能親政恭請殿下同决庶務臣愚伏計殿下念宗廟社禝之重為四海黎元之計不得已而臨之非中心所欲也若皇帝聖體不日康寕殿下必推而不居若藥石未效則殿下方且緫覽萬幾未暇自安故凡舉措動靜不可不戒愼留心焉方今天下之勢危於累卵小大戰戰憂慮百端若非君臣同心内外恊力夙夜勤勞以徇國家之急則禍難之生豈可勝諱哉夫安危之本在於任人治亂之機在於賞罰二者不可不察也若中外百官各得其人賢能者進不肖者退忠直者親䜛佞者踈則天下何得不安任職之臣多非其人賢能者退不肖者進忠直者踈䜛佞者親則天下何得不危賞不因喜罰不因怒賞必有所勸罰必有所懲則天下何得不治喜則濫賞怒則妄罰賞加於無功罰加於無罪則天下何得不亂然則天下安危治亂不在於佗在於人主方寸之地而已矣凡御下之道恩過則驕驕則不可不戢之以威威過則怨怨則不可不施之以恩恩威之道聖人所以制世御俗猶天地之有隂陽損之益之不失中和以生成萬物者也夫恩者欲物之親已也有時而生怨威者欲物之畏已也有時而生慢小人之性恩過則驕驕而裁之則怨矣爵禄賞賜妄加於人則其同類皆曰我與彼才相若也功相敵也彼得之而我獨不得何哉是出一恩而召羣怨也故曰恩有時而生怨也威嚴太盛則人無所容刑罰煩苛則濫及無辜則其同類皆曰是過也人誰無之彼既不免行將及我於是乎窮迫思亂為其上者乃更畏恐而求姑息是始於嚴而終於慢也故曰威有時而生慢也如是則為人上者豈不至難哉盖善為人上者不然恩必施於有功而罰必加於有罪恩雖至厚而人不敢妒者何也衆人之所與也罰雖至重而人無所怨者何也衆人之所惡也大行皇帝天性至仁羣臣之功或未足言而賞之以厚罪或不可容而罰之至輕善則善矣而小人不識大恩者或幾乎驕慢矣臣竊意殿下今兹繼而為政必將糺之以嚴糺之以嚴誠是也然天下之人􅆂濡大行皇帝聖澤日乆一旦暴加繩檢恐駭而離心伏願殿下徐以義理教之戒之有不聴從而尤無良者然後加刑罰焉則誰敢不肅此善之善者也徃者大行皇帝嗣位之初章獻明肅皇太后保䕶聖躬綱紀四方進賢退姦鎮撫中外於趙氏實有大功但以自奉之禮或崇重太過外親鄙猥之人或忝汚官職左右䜛諂之臣或竊弄權柄此所以負謗於天下也今殿下初攝大政四方之人莫不觀聴以占盛徳臣以為凡名體禮數所以自奉者皆當深自抑損不可盡依章獻明肅皇太后故事以成謙順之羙副四海之望大臣忠厚如王曽清純如張知白剛正如魯宗道質直如薛奎者殿下當信之用之與共謀天下之事鄙猥如馬季良䜛諂如羅崇勲者殿下當踈之逺之不可寵以禄位聴采其言也臣聞婦人内夫家而外父母家况后妃與國同體休戚如一若趙氏安則百姓皆安况於曹氏必世世長享富貴明矣趙氏不安則百姓塗地曹氏雖欲獨安其可得乎是故政者正也為政之道莫若至公臣願殿下熟察羣臣之中有賢才則舉之有功則賞之雖賤如厮役憎如仇讎逺在千里之外皆不可弃遺如此則人誰不勸矣羣臣之中職事不修則廢之有罪則刑之雖貴為公卿親為兄弟近在耳目之前皆不可寛假如此則人誰不懼矣夫為善者勸為惡者懼百官稱職萬民樂業天下之安猶倚㤗山而坐平原也尚何憂哉然後俟皇帝聖體平寜授以治安之業自居長樂之宫坐享天下之飬則殿下聖善之徳冠絶前古光映後來雖周之文母漢之明徳不足比也臣備國家侍從之臣以諫諍為職不勝區區之誠妄冒以聞伏惟殿下置之几席少加聴察臣光昧死再拜上䟽言遺賜劄子嘉祐八年四月十五日上臣伏覩聖恩頒賜羣臣以大行皇帝遺留物如臣所得已近千緡况名位漸髙必霑賚愈厚舉朝之内所費何啻鉅萬竊以國家用度素窘復遭大喪累世所藏幾乎掃地傳聞外州軍官庫無錢之處或借貸民錢以供賞給一朝取辦逼以捶楚當此之際羣臣何心以當厚賜况將來山陵所須全未有備國信往來又當供億萬一更有水旱軍旅之虞不知朝廷何以處之若國用不足必重斂於民民巳困窮何以供命饑寒所驅必為盗賊此乃安危之本願陛下深思熟慮勿以為細事而忽之也臣誠知乾興之際曽有此例亦恐當時所賜不至如此之多况當時帑藏最為富實今事力耗竭十無一二豈可但云舊例不思損益况委質為臣共圗國事股肱耳目譬猶一體安則俱安危則俱危豈待多得金珠然後輸忠盡力恐非所以遇士大夫之道也今天崩地坼率土哀摧羣臣各遷一官不隔磨勘恩澤已厚誠不忍更受賜物因公家之禍為私室之利伏望聖慈許令侍從之臣各随其意進奉金帛錢物以助供山陵之費如此則君恩下流臣誠上達上下相愛洽於至和既可以少紓民力又不至有傷國體取進止言遺賜第二劄子嘉祐八年四月二十一日上臣於今月十五日曽具劄子上言乞許令侍從之臣進奉金銀錢帛以助山陵之費至今未聞降出臣示曽與同輩具狀詣客省進物䝉批降指揮以乾興年中無此例不令收接其事理本末臣已於前來劄子内一一奏陳今更不敢重複有言竊以方今國家多虞人心危懼正是朝廷斟酌時宜損益變通之際豈可不究利害但詢舊例而已况所賜羣臣之物比舊例過多幾倍而羣臣有所進獻則云舊例無之雖聖恩務在優隆然羣臣有亷耻之心者何面目以自安又州縣鞭撻平民逼取錢物以濟一時之急不知乾興年中何嘗有此例也以此見國家虗實緩急逐時不同豈可專執舊文不加裁損今大喪之後内外困窮凡百在位之臣皆當焦心刻已以救其患若受此非常之賜恬然有之曽不為愧則士衆必曰我輩勞苦而所得㣲薄羣臣安坐而專享厚利其心安得不怨百姓亦曰我輩剥膚椎髄以供賦斂而浩浩入羣臣之家如泥沙不惜其心安得不怒近者怨逺者怒為國計者可以不深思逺慮乎是以臣輩區區欲輸此物非謂可以増帑藏之富助用度之急也其意盖以通上下之情慰逺近之心塞無厭之怨觧重斂之怒伏望朝廷留心省察知其為安危之本非臣誇小亷競小忠也臣今來并前來所奏劄子共二道並乞早降付中書樞宻院同共商量施行取進止上皇帝䟽嘉祐八年四月二十七日上月日具位臣司馬光昧死再拜上䟽皇帝陛下臣愚竊惟大行皇帝春秋未甚髙以宗廟社稷之重昭然逺覽確然獨斷知陛下仁孝聦明可守大業擢於宗族之中建為嗣子授以天下其恩德隆厚踰於天地固非㣲臣所能稱述今不幸奄弃萬國陛下哀慕泣血以夜繼晝過於禮制以至成疾中外聞者無不感泣知大行皇帝能為天下得人治平之期企踵可待羣臣百姓不勝大幸今者聖體痊平初臨大政四海之人拭目而視傾耳而聴舉措云為不可不慎易曰君子以作事謀始召誥曰王乃初服嗚呼若生子罔不在厥初生自貽哲命夫為政之要在於用人賞善罰惡而巳三者之得則逺近翕然嚮風從化可以不勞而成無為而治三者之失則流聞四方莫不觧體綱紀不立萬事隳頽治亂之原安危之機盡在於是臣願陛下難之慎之精心審慮如射之有的必萬全取中然後可發也陛下思念先朝欲報之徳奉事皇太后孝謹撫諸公主慈愛此誠仁厚之至過人逺甚臣願陛下雖天性得之復加聖心夙夜匪懈慎終如始以結億兆之心形四方之化則福禄流於子孫令問垂於無窮矣古者人君嗣位必踰年然後改元臣願陛下一循典禮勿有變更於中年也三年之喪自天子逹於庶人一也自漢氏以來始從權制以日易月臣願陛下雖仰遵遺詔俯徇羣情二十七日而釋服至於宫禁之中音樂逰燕吉慶之事皆俟三年然後復常以盡慎終追逺之義焉禮為人後者為之子故為所後服斬衰三年而為其父母齊衰不杖期為所後者之親皆如子而為巳之親皆降一等蓋以特重於大宗則宜降其小宗所以專志於所奉而不敢顧私親也漢宣帝自以為昭帝後終不敢加尊號於衛太子史皇孫光武起於布衣親冒矢石以得天下自以為元帝後亦不敢加尊號於鉅鹿都尉南頓君此皆徇大義明至公當時歸美後世頌聖至於哀安桓靈或自旁親入繼大統皆追尊其祖父此不足為孝而適足犯義侵禮取譏當時見非後世臣願陛下深以為鑑杜絶此議勿復聽也凡此數者伏計陛下聦明皆素知之然臣復區區進言者誠懼不幸有謟諛之臣不識大體妄有關說自求容媚陛下萬一誤加聴從聖言一出布聞於外則足以傷陛下之義虧海内之望臣雖欲捐軀爭之亦無及已是以不敢不先事而言庻幾聖德純粹完美不有秋毫之缺使一夫竊議於草萊者臣之志也輕冒宸嚴不勝悃欵惶悸之至伏兾留神裁察臣光昧死再拜上䟽言山陵擇地劄子臣竊聞大行皇帝欲以十二月一本作十月二十七日大𦵏而朝廷遣使案行山陵至今未知定處或云欲於永安縣界之外廣求吉地臣愚以為過矣夫隂陽之書使人拘而多畏至於䘮𦵏為害尤甚是以士庶之家或求塟地擇嵗月至有累世不塟者臣常深疾此風欲乞國家禁絶其書而未暇也今山陵大事當守先王之典禮至於塟書出扵世俗委巷之言司天隂陽官皆市井愚夫何足問也古者天子七月諸侯五月大夫三月士踰月塟於北方北首未甞問歳月相山岡然考其子孫之吉凶豈有異於今哉春秋書巳丑塟恭嬴雨不克塟庚寅日中而克塟丁巳塟定公雨不克塟戊午日下昃乃克塟然則雖云卜日亦當臨事制宜也周禮冢人掌公墓之地先王之塟居中以昭穆為左右明不擇地形也然而周有天下三十六王八百六十七歳盖王者受命於天期運有常國之興衰在德之美惡固不繫塟地時日之吉凶也且塟者藏也本以安祖考之形體得土厚水深髙敞堅實之地則可矣子孫豈可因以求福哉又曏者國家以謹於時日之故堅用八日大歛自爾以來聖躬有疾至今尚未平復隂陽無驗亦已明矣况國家自宣祖以來塟於永安百有餘年官司儲偫素皆有備今改卜佗所不惟縣邑官司更須創置亦恐大行皇帝神靈眷戀祖宗未肯即安於新陵也凡科率之物期日逺則民力寛而事易辦期日近則費愈多而事不集塼石之類體重難移若山陵之處不使豫先知之則有司何以供辦百姓何以輸納至時暴加迫趣則一錢之物必直十錢疲羸之民將不勝其弊矣伏望朝廷特賜指揮案行山陵使等只於永安縣界舊陵側近選擇善地旬日之内早定奪聞奏仍令有司豫先計度山陵的實合用之物降下本處寛設期限使之備辦不得大約虗數及妄立近限必使號令明信則事無不濟而民力不困矣取進止傳家集巻二十七欽定四庫全書傳家集巻二十八宋司馬光撰章奏十一論御藥寄資劄子嘉祐八年五月二十一日上臣伏見祖宗以來擇内臣謹信者勾當御藥院以其職任最為親近恐名位寢崇嵗月稍久則權勢太重不可制御故常用供奉官以下為之轉至内殿崇班則出為外官此乃祖宗深思逺慮防微杜漸髙出前古詒謀萬世者也近嵗以來頗隳舊法居此任者往往闇理官資請其俸給久而不去殊失祖宗之意深為不便今兹踐祚之初所宜革去積弊率由舊章竊見勾當御藥院劉保信等四人亦曽自陳乞因覃恩改任外官伏望皇太后殿下皇帝陛下各依逐人所請將應自來内臣闇理官資者並除正官授以外任别擇供奉官以下素知心腹忠信謹慤之人使勾當御藥院仍自今後凡轉官至内殿崇班以上者並湏出外以遵祖宗之制不得闇理官資依舊留任内廷差遣取進止乞令皇子伴讀官提舉皇子左右人劄子臣伏見陛下差直史館王陶充皇子伴讀秘閣校理孫思恭充本位說書此誠國家之首務聖哲之逺圖然臣聞三代令王置師傅保以教其子又置三少與之燕居至於左右前後侍御僕從之人皆選孝悌端良之士逐去邪人毋得在側使之日見正事聞正言然後道明而徳盛心愉而體安福被兆民功流萬世此教之所以為益也今陶等雖為皇子官屬若不日日得見或見而遽退語言不洽志意不通未嘗與之論經術之精㣲辨人情之邪正究義理之是非考行已之得失教者止於供職學者止於備禮而左右前後侍御僕從或有佞邪讒巧之人雜處其間出入起居朝夕相近誘之以非禮導之以不義納之以謟諛濟之以詐偽雖皇子資性聦明端慤難移然親近易習積乆易遷謟諛易入詐偽易感如此則雖有碩儒端士為之師傅終無益也臣聞孟子曰雖有天下易生之物一日暴之十日寒之未有能生者也吾見亦罕矣吾退而寒之者至矣又曰一齊人傅之衆楚人咻之雖日撻而求其齊亦不可得也臣愚伏望陛下多置皇子官屬博選天下有學行之士以充之使每日在皇子側與皇子居處燕逰講論道義聳善抑惡輔成懿徳其左右前後侍御僕從悉皆選小心端慤之人使所屬官司結罪保明然後得入仍專委伴讀官提舉覺察若有佞邪讒巧之人誘導皇子為非禮之事者委伴讀官糺舉施行即時斥逐不令在側若皇子自有過失再三規誨不從者亦聽以聞如此則必進德脩業日就月將善人益親邪人益疎誠天下之幸也大理評事趙彦若孝友温良謹潔正固博聞强記難進易退國子監直講李實好學有文脩身慎行祕閣校理孟恂清純愷悌始終如一此臣之所知也伏望陛下擇此三人及廣求其比以備皇子官屬臣推心盡忠不敢形迹僣越妄言伏俟譴謫取進止上兩宫疏嘉祐八年六月二十二日上月日具官臣司馬光昧死再拜上疏皇太后殿下皇帝陛下臣聞天地交謂之㤗天地不交謂之否天地者上下之象也施諸人事君仁而臣忠父慈而子孝兄愛而弟恭皆㤗也君不仁臣不忠父不慈子不孝兄不愛弟不恭皆否也㤗則上下之情通内外之志和國以之治家以之安否則上下之情塞内外之志乖國以之亂家以之危治亂安危之分不在於他在於審察否㤗之端而已矣書曰立愛惟親立敬惟長始於家邦終於四海自古聖王治天下之道未有不自孝慈始者也恭惟先帝屬籍之親凡數百人獨以天下之業傳於聖明皇太后承顧命之際鎮撫中外決定大䇿其恩徳隆厚踰於天地何可勝言皇帝至性烝烝哀以執喪恭以致飬夙夜憂勞以成疾疹其於慈孝之美可謂至矣然臣猶竊有所懼不可不過慮於萬一先事而進言者臣聞金隄千里潰於蟻壤白璧之瑕易離難合況社稷之重非特金隄也骨肉之親非特白璧也在於守之至謹執之至固完美無間然後福祿無疆也夫姦邪之人專闚主意苟有釁隙則因而乗之於是離間人君臣交構人父子使之上下相疾内外相疑已然後得奮其詐謀以盗其大權私其重利自古以來喪國敗家未有不由此者也今雖睿聖在上朝廷清明中外之臣咸懐忠良然禍福之原其來甚微舉措聴納不可不慎臣愚竊惟今日之事皇帝非皇太后無以君天下皇太后非皇帝無以安天下兩宫相恃猶頭目之與心腹也皇帝聖體平寜之時奉事皇太后承順顔色宜無不如禮若藥石未效而定省温清有不能周備者亦皇太后所宜容也孔子曰孝哉閔子騫人不間於其父母昆弟之言盖言誠信純至表裏著明而他人不能間也孟子曰父子責善賊恩之大者也葢言骨肉至親止當以恩意相原不當較錙銖之是非也臣愚伏望皇帝常思孔子之言皇太后無忘孟子之戒萬一姦人欲有開說渉於離間者當立行誅戮以明示天下使咸知讒佞之徒不能欺惑聖明也方今天地鬼神羣臣百姓鳥獸草木皆恃兩宫以為安若兩宫懽忻於上則天地鬼神得以歆其禋祀鳥獸草木得以遂其生息況羣臣百姓孰不保首領以樂太平之化哉臣狂瞽妄言不識忌諱惟知徇國不為身謀不勝區區迫切之誠臣光昧死再拜上疏論夏國入弔劄子嘉祐八年七月十四日上臣伏聞夏國所遣使人前日不肯門見固求入對朝廷不許勒歸館舍臣愚竊以陛下繼統之初四夷之人皆欲奉望天表窺覘聖徳又聞曏曽不安意謂未能視朝所以犬羊之心敢爾桀黠今若深閉固拒不聴入見則必疑有所隠避益足使之驕慢況即日陛下已御正殿臣謂何惜紫庭數歩之地使之稽首拜伏瞻仰清光庶㡬得識陛下神武之姿知必能鎮服四海歸至其國轉相告語使其蠭蟻之衆心服氣沮不敢窺邊此所謂上兵伐謀不待戰而屈敵者也取進止論進賀表恩澤劄子嘉祐八年七月二十六日上臣竊見諸路轉運使提㸃刑獄知州軍等各遣親屬進奉賀登極表至亰師朝廷不問官職髙下親屬逺近一例推恩乃至班行幕職權知州軍或所遣之人不係親屬者亦除齋郎及差使殿侍此葢國初承五代姑息藩鎮之弊故有此例後來人主嗣位之初大臣因循故事不能革正然以理推之國家爵祿本待賢才及有功效之人今使此等無故受官誠為大濫況近日官吏繁冗十倍於國初之時朝廷深知其弊所以數年前别定條制減省諸色奏䕃之數若進表之人皆得一官則併又増數百入仕之人曏來減省奏䕃悉為虛設今縱不能盡罷此等恩澤其進表人若係五服内親者或乞等第授一官其五服外親及不係親屬者並量賜金帛罷去庶幾少救濫官之失取進止乞簡省細務不必盡關聖覽上殿劄子臣聞臯陶贊於舜曰元首明哉股肱良㦲庻事康哉葢言人君明則百官得其人百官得其人則衆事無不美也又曰元首叢脞哉股肱惰哉萬事隳哉葢言人君細碎無大略則羣臣不盡力羣臣不盡力則萬事皆廢壊也此二者治亂之至要也荀子曰明主好要闇主好詳主好要則百事詳主好詳則百事荒故為人君者自有職事固不當詳察細務也然則人君之職謂何臣愚以為量材而授官一也度功而加賞二也審罪而行罰三也材有長短故官有能否功有髙下故賞有厚薄罪有小大故罰有輕重此三者人君所當用心其餘皆不足言也臣伏見國家舊制百司細事如三司鞭一胥史開封府補一廂鎮之類往往皆須奏聞崇政殿所引公事有軍人武藝國馬芻秣之類皆一一躬親閱視此葢國初艱難權時之制施於今日頗傷煩碎陛下龍興撫運聖政惟新臣愚以為宜令中書樞宻院檢詳中外百司自來公事須申奏取㫖及後殿所引公事其間不繫大體非人君所宜身親者悉從簡省委之有司陛下飬性安身以專念人君之三職足以法天地之易簡致虞舜之無為誠天下幸甚取進止乞裁決機務上殿劄子嘉祐八年八月二十七上臣聞王言惟作命不言臣下罔攸禀令陛下以明徳令望龍飛受命四海之内延頸傾耳渇聞聖政自踐阼以來於今五月而陛下深執謙遜端拱淵黙羣臣奏事一無可否中外之情深為鬰邑曏者猶謂聖體未安今御殿聽政已遵舊式出入起居皆復常度而獨於萬幾未加裁決臣竊惑之詩曰弗躬弗親庶民弗信弗問弗仕勿罔君子臣愚伏望陛下凡兩府及羣臣奏事稍留神省察詢訪利害議論是非可則行之否則却之使四方翕然瞻仰聖徳億兆羣生不勝幸甚取進止乞體量京西陜西災傷劄子嘉祐八年九月十二日上臣竊聞亰西陜西兩路自夏末以來殊少雨澤秋田豐稔者所收不過五分枯旱之處所得尤薄而官司或務為聚斂民有訴旱者不肯受接道路嗷嗷頗多怨讟已有流移就食他方者況此兩路昨來供應山陵百姓最為勞苦朝廷尤宜優恤伏望特降詔㫖下兩路體量應有災傷之處倍加存撫寛其租稅敢有抑塞旱狀不為收接者嚴加譴責庶使困窮之民有所赴訴取進止言趙滋劄子嘉祐八年九月二十三日上臣累曽上言趙滋剛愎狂妄不可管軍及守邊必將敗事近聞朝廷益加寵任令再知雄州臣愚瞽之言誠不足采然竊聞曏時本路都轉運使唐介安撫使彭思永皆曽言滋罪狀今朝廷使之再任彼二人者必不肯同心恊力以利公家但更相違戾窺伺得失雖容貎語言外相包容其中心豈能坦然全無猜忌是朝廷激之使交鬬也若監司將帥互相猜惡而欲使之安下民扞外敵臣竊以為難矣伏望朝廷念河北一路繫國家安危察滋所為皆夸誕不實授滋别路一閒慢差遣使上下之情各獲自安不唯邊境保無他慮亦滋一身之福也取進止言趙滋第二劄子臣先曽上言趙滋為人剛愎不可管軍朝廷不以為信臣亦自恐聞聽未審不敢復有所陳自後又聞滋對契丹使人禮貎驕倨不遵舊式近者又聞本路帥臣奏滋任意行事恐致引惹竊以㬌徳以前契丹未和親之時戎車嵗駕疆埸日駭乗輿暴露於澶淵敵騎慿陵於齊鄆兩河之間暴骨如莽先帝深惟安危之大體得失之至計親屈帝王之尊與之約為兄弟嵗捐金帛以餌之聘問往來待以敵國之禮陛下承統一遵故約夫豈以此為不辱哉志存生民故也是以兵革不用百姓阜安垂六十年今契丹所以事中國之禮未有闕也為邊臣者當訓卒乗繕器械以戒不虞厚饔餼慎威儀以待使者内不失備外不失好以副朝廷之意而已今滋數乗客氣以傲使人争小勝以挑强胡苟為夸大於目前以求一時之聲名而不顧國家永久之患臣恐釁隙一開則朝廷未得髙枕而臥也昔孫蒯毁缾而曹衛構難鄫人漚菅而魯國喪邑渉佗捘手而晉失諸侯女子争桑而呉師入郢故禍常起於細微而事或生於所忽凡二國所以相交之道不可以不慎也雄州當虜之衝平居則行李之所往來有事則戎馬之所出入典州之將不可不精擇其人滋禀性狂狠恐不可久置於彼乞落軍職徙之内地毋使邊將相效為國生事實天下幸甚取進止乞撤去福寜殿前尼女劄子嘉祐八年九月㫖二十九日上尋得依臣竊見大行皇帝梓宫在福寜殿自啓菆以來每日裝飾尼女置於殿前傅以粉黛衣之綺繡狀如俳優又類戯劇臣不知其說果何謂也羣臣見者無不駭異或嘆其失禮或黙有譏誚黷嫚威神莫甚於此殆非所以禆助喪容觀示萬方伏望聖慈速令撤去孔子曰𦵏之以禮此孝之大也臣願陛下因此特降聖㫖下有司應將來靈駕進發以至䘮事凡儀仗送終之物有鄙俚無稽不合禮典如此類者悉宜撤去無使四方之人有所觀笑取進止言遣奠劄子臣聞禮為人後者為之子也孔子曰人未有自致者也必也親喪乎又曰喪事不敢不勉故天子即位之初天下所以瞻仰而歸心者唯在執喪盡禮而已矣恭惟仁宗皇帝舉天下而授之陛下明睿獨斷人莫能間父母能生陛下不能使陛下貴為天子富有四海至於萬世子孫永饗天禄皆仁宗皇帝之厚徳不可忘也今靈駕發引逺就山陵天長地久永無還期痛毒惻怛無甚於此伏望陛下至日若聖體稍安行禮之際威儀容止動加矜慎擗踊哭泣過於哀毁以竭孝思之至報罔極之恩結四海之心聳萬民之望盛徳本基盡在於是不可以不嚴畏也此雖聖明所自知然臣區區尚欲以塵露之微助山海之大庶幾萬一或有所益焉取進止論後殿起居劄子臣竊見國家從來以垂拱崇政為便殿乗輿每旦先御垂拱退御崇政是以侍從近臣已於垂拱起居者非有職事奏對更不復至崇政近嵗以來乗輿間日一御垂拱有司不詳事體本末遂令學士待制及兩省官只赴垂拱不赴崇政起居近以山陵未畢乗輿不御垂拱將近旬月學士以下遂廢起居之禮豈有名為侍從近臣而動踰旬月不得瞻望黼扆臣恐朝廷之儀由此相承寖益訛謬欲乞今後應乗輿不御前殿並令學士待制及兩省官赴後殿起居或以為太煩即令兩日一次起居取進止論皇地祗劄子嘉祐八年九月十九日上臣伏見今月十九日以大行皇帝諡號奏告天地宗廟社稷皇地祗止於圓丘望告臣聞王者父天母地其尊一也是故孝經曰事父孝故事天明事母孝故事地察今社稷之祀位為上公猶特遣官奏告而皇地祗寓於南郊下同腏食失尊卑之叙乖重輕之義考諸名體竊所未安欲乞今後凡祭告皇地祗並遣兩府官一員詣北郊行事庶合禮意取進止論虞祭劄子嘉祐八年十一月三日上臣聞禮既𦵏而虞虞安也柩既藏矣孝子不忍一日離其親恐精神彷徨無所依歸故祭以安之也然則虞者孝子之事人主當親其禮非臣下所得攝也臣竊見今月三日虞祭百官皆入就位而哭而陛下不親其禮使宗正卿攝事臣竊惑之伏以永昭陵距亰師猶五頓木主還未至之時不可一日不虞故使羣臣攝事今木主已達亰師近在内殿而有司不根禮意尚如途中使羣臣行事於親疏之序有所不稱於哀恭之情有所未盡臣恐聞見之人不知有司之失而歸責於陛下今未至卒哭尚有三虞欲望自來日以後陛下親行其禮取進止論虞祭第二劄子臣昨日上言虞祭者孝子之事非臣下所能攝乞陛下親行其禮陛下不以臣言為輕以為得禮已降聖㫖依臣所奏今日禮儀既具百官在庭而陛下不出復使宗正卿攝事在列之臣無不愕然自失且昨日有司不為陛下設親祭之禮猶可謂之有司之失若今日之事則咎將誰歸此皆由臣憃愚以彰陛下之過臣之罪重惟陛下裁之臣聞易曰不逺復無祗悔元吉孔子曰過而不改是謂過矣伏望陛下來日雖聖體小有不康亦當勉强親行其禮以解中外之惑取進止傳家集巻二十八欽定四庫全書傳家集巻二十九宋司馬光撰章奏十二言醫官劄子嘉祐八年九月一日上臣伏見舊醫官宋安道等四人昨以侍先帝醫藥無狀降授諸州散官尋以陛下聖體不安大臣憂恐權留安道等診候御脉今已百有餘日陛下聖體終未平復安道等方術無驗較然可知而其人皆得罪於先帝臣謂陛下不宜赦其罪戾留在亰師並乞發遣令赴貶所僧志縁本不曉醫但以妖妄惑人於江浙别本作淮之間稱是診人六脉能知災福今亦出入禁庭叨忝章服察其療疾實無所益伏乞奪去紫衣放歸本州凡用醫之道在謹擇其人而專任之然後良工得盡其術而功效可見今聞診御脉者常以十數工拙相雜是非混殽發言進藥更相倚伏前䟦後疐左瞻右顧雖有俞扁之術將安所施於是彊者自專弱者附㑹雷同比周共為誣罔不顧聖體但為身謀俱云脉氣平和臟府無疾然而旁側衆人竊觀形證豈得為安寜復舊如醫官所言哉日月愈深根柢益固四海憂畏焦心墜膽臣愚伏望陛下思一身之安危繫羣生之禍福深自重惜不可因循博訪亰邑四方通醫術者精擇一人使之專診御脉聽用其言服食其藥若旬月之間全無應效則斥去不用别更擇人如此必遇良醫痊復有日臣不勝區區伏望聖慈少加采察天下幸甚取進止言醫官第二劄子臣先曽上言以醫官宋安道等診候御脉日久方術無驗乞行降黜别擇良醫使専其事考其功效以行賞罰自後寂然不聞朝廷施行臣以為聖體已安不復敢言今覩陛下不親虞祭乃知疾疢殊未痊平臣子之心何以自安臣竊聞宋安道等每奏皇太后及語大臣皆云陛下六脉平和體中無疾今乃疾狀如此安道等不惟方術無效論其面謾之罪亦宜誅殛矣且安道等侍先帝疾至於今日而猶免於貶竄宜其無所懲戒不肯盡心也臣不知朝廷何意再三惜此數夫不為國家正賞罰之法快天下之志也夫以四海之廣捨此數人之外豈無良醫患在上之人不求求而不得得而不使使而不專故也臣聞曏者朝廷選醫官數人皆委近臣試以難經素問考其通粗取合格者以為侍醫亦有不試而使與安道等雜處共事者夫良醫由性識敏逹以平生所治之人考其得失探其精粹得之於心未必皆讀古書也亦猶誦詩書者豈盡能治民讀孫呉者豈盡能行兵今以難經素問試之是徒得記誦之人未嘗得醫人也安道等乆在醫局專利忌前交結貴近更相黨庇使外方新進醫人與之共處豈敢展其胸臆施其方術哉是以一概混同而乆不見功也今若精擇一人使之專診御脉旬月之間考其應驗有功則加以重賞無功則俟以嚴刑則術精者得盡其力術疎者不敢濫進矣臣又聞病人能自知其病者未甚病也憎良藥而不受者病在内拒之也今竊聞陛下不安如此而常自謂無疾則病已深矣醫有良藥而陛下不服則已為病所拒矣若陛下不早覺悟而更求名醫強進良藥縱陛下不自惜奈宗廟社稷何此臣所以痛心疾首前有鼎鑊而不敢避者也伏望陛下察臣兩次所奏罷黜醫人有罪無功者召募四方名醫委大臣精選一人使之專診御脉聽用其言服食其藥以旬月之期察其能否如前所云以保養聖神為天下生民之福取進止言張茂則劄子嘉祐八年十一月七日上臣等竊聞祖宗舊制内臣年未五十不得充内侍省押班近除張茂則年方四十八今陛下踐阼之初尤宜謹守祖宗法度以御左右之臣示天下至公若茂則果有才幹可用雖更留此闕二年俟其年至然後授之又何晩也臣恐茂則一開此例則内臣攀援求進者多畫一之法從此隳壊人人相效不可禁止不若正之於事初也臣等區區所為國家重惜在此而已取進止乞放宫人劄子嘉祐八年十一月十七日上臣伏見前代帝王升遐之後後宫下陳者皆放之出宫還其親戚所以遂物情重人世省浮費逺嫌疑也竊惟先帝恭儉寡欲清約執禮後宫侍左右承寵渥者至少而饗國日久嵗増月積掖庭之間冗食頗衆陛下以哀恤之初未忍散遣今山陵祔廟大禮俱畢臣愚謂宜舉前代故事應先帝後宫非御幸有子及位號稍貴并職掌文書之人其餘皆給與粧奩放散出外各令歸其親戚或使任便適人書之史冊亦聖朝一美事也取進止上皇太后疏嘉祐八年十一月二十六日上月日具位臣光謹再拜上疏皇太后殿下臣聞聖人之德使四海之外編戸之民皆輻湊而歸之如孝子之奉父母其故何哉推仁愛惻怛之誠以加之也故詩云愷悌君子民之父母夫四海至逺也編戸至㣲也誠之至也猶可以為之父母況閨門之内血氣之親乎昔漢明徳馬皇后無子明帝使養賈貴人之子炟以為太子且謂之曰人不必自生子但患愛養不至耳后於是盡心撫育勞悴過於所生及明帝崩太子即位是為章帝章帝亦孝性淳篤㤙性天至母子慈愛始終無纎介之間前史載之以為美談恭惟仁宗皇帝憂繼嗣之不立念宗廟之至重以皇帝仁孝聪明選擢於宗室之中使承大統不幸踐阼數日遽嬰疾疹雖殿下撫視之慈無所不至然醫工不精藥石未效竊聞曏日疾勢稍増舉措言語不能自擇左右之人一一上聞致殿下以此之故不能堪忍兩宫之間微相責望羣心憂駭不寒而慄方今仁宗皇帝新棄四海皇帝久疾未平天下之勢危於累卵惟恃兩宫和睦以自安如天覆而地載也豈可效常人之家爭語言細故使有􅁝毫之隙以為宗廟社稷之憂哉臣是用日夜焦心隕涕側足累息寧前死而盡言不敢幸生而塞嘿也伏以皇帝内則仁宗同堂兄之子外則殿下之外甥壻自童幼之嵗殿下鞠育於宫中天下至親何以過此又仁宗立以為皇子殿下豈可不以仁宗之故特加愛念包容其過失耶況皇帝在藩邸之時以至踐阼之初孝謹温仁動由禮法此殿下所親見而明知也苟非疾疹亂其本性安得有此過失哉夫心者神明之主也若其有疾則精爽迷亂㝠然無知言語動作不自省記不識親疎不擇貴賤此乃有疾者之常不足怪也殿下聪明叡智天下之理無所不通豈可責有疾之人以無疾之禮邪今殿下雖日夕憂勞徒自困苦終何所益以臣愚見莫若精擇醫工一二人以治皇帝之疾旬月之間察其進退有效則加之以重賞無效則威之以嚴刑未愈之間但宜深戒左右謹於侍衛其舉措語言有不合常度者皆不得以聞庶幾不増殿下之憂憤殿下惟寛釋聖慮和神養氣以安靖國家綱紀海内俟天地垂祐聖躬痊復然後舉治平之業以授之不亦美乎古之慈母有不孝之子猶能以至誠惻隠撫存愛養使之内愧知非革心為善況皇帝至孝之性禀之於天一旦疾愈清明復初其所以報答盛德豈云細哉臣之愚慮苦言盡此而已乞殿下更賜裁擇臣光昧死再拜上疏上皇帝疏嘉祐八年十一月二十六日上月日具位臣光昧死再拜上疏皇帝陛下臣先於四月二十七日及六月二十二日皆曽上疏以陛下受仁宗皇帝之天下欲報之徳當奉事皇太后孝謹撫諸公主慈愛勿使姦邪之人有所離間致兩宫有隙以上貽宗廟之憂下為羣生之禍叩心瀝膽極其懇惻未審臣言得逹聖聽或萬幾之繁未嘗奏御也此乃成敗之端安危之本不可不察臣聞漢章帝乃賈貴人之子明帝使明徳馬皇后母養之后盡心撫育勞瘁過於所生章帝亦孝性淳篤恩性天至母子慈愛始終無纎介之間馬氏三舅皆為卿校列侯賈貴人終不加尊號賈氏親族無受寵榮者此前世美事今日所當法也詩云父兮生我母兮鞠我拊我畜我長我育我顧我復我出入腹我欲報之德昊天罔極然則父母之恩不獨以其生已也拊畜長育居其大半焉陛下自齠齔之年為皇太后所鞠育恩亦至矣又況今日為仁宗皇帝之嗣承四海之大業乎臣謂陛下宜夙興夜寐昏定晨省親奉甘㫖承順顔色無異於事濮王與夫人之時也近者道路之言頗異於是紛紛籍籍深可駭愕臣竊惟陛下孝恭之性著於平昔豈容一旦遽肯變更盖曏者聖體未安之時舉動語言或有差失不能自省而外人訛傳妄為増飾必無事實雖然此等議論豈可使天下聞之也周書曰小人怨汝詈汝則皇自欽徳古人有言曰禦寒莫如重裘弭謗莫如自脩陛下疾疹未平固無如之何若既愈之後臣愚伏望陛下親詣皇太后閤克已自責以謝前失温恭朝夕侍養左右先意承志動無違禮使大孝之美純粹光顯過於未登大位之時如此則上下咸恱宗社永安今日道路妄傳之言何能為損也古之至孝者雖有不慈之母猶能使之感悟歡恱囘心易慮況皇太后聖善之徳著聞四方自陛下有疾以來日夜泣涕禱於神祗憂勞困悴以冀陛下之安寧如耕者之望收涉者之求濟陛下豈不思有以慰安之也臣不勝區區干冒以聞乞留神采擇臣光昧死再拜上疏乞開講筵劄子嘉祐八年十一月二十七日上有㫖使開講臣伏覩講筵所告報依乾興年故事講論語讀史記續奉聖㫖直候來春臣聞傅說曰王人求多聞時惟建事學於古訓乃有獲又曰念終始典于學厥徳脩罔覺然則學者帝王之首務不可忽也況今陛下初臨大寳所宜朝夕延訪羣臣講求先王之至道覽觀前世之成敗以輔益聖徳緝熈大化不可但循近例以寒暑為辭如此使下情何以上通四方何以觀望殆非所以廣聦明宣令名也伏乞依前降聖㫖擇日開講筵取進止言程戡劄子嘉祐八年十月三十日上臣伏覩制書宣徽南院使鄜延路經略安撫使程戡加安武軍節度使令再任臣聞官以待賢才賞以勸有功官非其人則職事廢缺賞不當功則羣臣解體程戡素無才術少壯之時歴職中外猶無名迹為人所稱況今老病昏懦尤甚在鄜延苟且偷安以度日月為吏兵所慢戎狄所輕臣謂朝廷當因其歲滿授以冗秩别擇能臣以代其任今乃寵以節鉞使居舊任外廷聞者無不駭愕臣竊以兩府之外官尊祿厚無若節度使者羣臣非有大功豈可輕授臣不知程戡在鄜延曽有何功遽授此官萬一邊臣有能立大功者朝廷當復以何官處之況陛下踐阼之初四方之人拭目傾耳觀聽朝廷之賞刑以占聖政而戡首䝉濫賞臣竊為陛下惜之伏望聖慈追還前命别選賢才使守鄜延庶合中外之望取進止言程戡第二劄子臣近曾上言鄜延路經畧使程戡建節再任不合衆望乞追還前命事至今不聞施行臣竊以方今國家外患唯在西北二冦所以捍禦二冦唯在諸路經略安撫使居此任者豈可不精擇其人程戡在鄜延自以衰老畏人指目專務姑息取媚羣小僚屬軍伍尚無禀畏況於外夷固所輕侮比年以來趙諒祚數違舊制易姓建官妄有邀求不遵朝命戡不能式遏而容納其使事之可否盡諉於朝廷則禦侮之臣將何所用事君不忠孰甚於此臣愚以為凡御羣臣之道若居官稱職衆所不及則當使之再任若立功立事為人所知則當加之品秩今語其稱職則軍政不修語其立功則戎狄驕慢而朝廷寵命益優委任益厚臣恐將帥之臣宣力者無所勸而懐姦者得其志如此而望疆埸安寧四夷賔服臣竊以為難矣所有程戡新受恩命伏乞蚤賜追還取進止言後宫等級劄子嘉祐八年十二月二日上臣聞王化之興始于閨門故易基乾坤詩首關雎前世皆擇良家子以充後宫位號等級各有員數祖宗之時猶有公卿大夫之女在宫掖者其始入宫皆須年十二三以下醫工診視防禁甚嚴近嵗以來頗隳舊制内中下陳之人競置私身等級寖多無復限極監勒牙人使之僱買前後相繼無時暫絶致有軍營井市下俚婦女雜處其間不可辨識此等置之宫掖豈得為便臣嘗念此不勝憤惋今陛下即位之初百度惟新嬪嬙之官皆闕而未備臣謂宜當此之時定立制度依約古禮使後宫之人共為幾等等有幾人若未足之時且虚其員數既足之後不可更増凡初入宫皆須幼年未適人者若求乳母亦須選擇良家性行和謹者方得入宫傳之子孫為萬世法此誠治亂之本禍福之原不可以為細事而忽之取進止傳家集巻二十九欽定四庫全書傳家集巻三十宋司馬光撰章奏十三乞延訪羣臣上殿劄子嘉祐八年十二月十五日上臣聞天尊地卑道之常也而周易乾下坤上謂之㤗者葢言人君降心以接臣人臣竭忠以事君然後上下交而其志同也若人君驕亢以自專人臣怠慢以自疎則上下之情不通而否道成焉是以孔子語舜之徳曰舜好問而好察邇言其斯以為舜乎竊見祖宗之時閒居無事常召侍從近臣與之從容講論萬事至於文武朝士使臣選人凡得進見者往徃召之使前親加訪問委曲詳悉無所不至所以然者一則欲使下情上通無所壅蔽二則欲知其人能否才器所任是以黜陟取捨皆得其宜太平之業由此而致恭惟陛下潛徳藩邸踰三十年一旦龍飛奄有四海雖聖質英睿得于天縱然與當世士大夫未甚相接民間情偽未甚盡知臣謂宜詔侍從近臣每日輪一員直資善堂夜則宿於崇文院以備非時宣召若有事故請假則與以次官互換直宿其餘羣臣進見及奏事者亦望聖慈稍解嚴重細加訪問以開廣聦明禆益大政取進止乞延訪羣臣第二劄子臣先曾上言乞詔侍從近臣每日輪一員直資善堂夜則宿於崇文院以備非時宣召若有事故請假則與以次官互換直宿以開廣聦明禆益大政至今未聞施行葢陛下謙謹以皇太后同聴庶政未奉慈㫖不敢擅召羣臣與之議論今皇太后盡以四海之事歸於陛下出入起居頥指如意臣是敢重申前說乞少加采擇凡人牆之外目不見也里之前耳不聞也而天子奄有四海一日萬幾民之憂樂事之本末雖有聦明叡智之性若不問之於人何從知之是以太祖太宗雖起於側微猶日孜孜訪問羣下至於小臣卒伍亦無所間絶故能紀綱四方創業垂統陛下生為帝王子孫未嘗厯試於外天下之事豈能細知況先朝置直學士待制等職以為侍從之臣若使之不得朝夕在左右備顧問將安用之所有每夜於崇文院輪宿自是舊制近年以來因循隳廢舉而行之有何所難伏望聖慈檢㑹臣前來所奏劄子内事節特賜施行取進止乞延訪羣臣第三劄子臣前者兩次上言乞詔侍從近臣每日輪一員直資善堂夜則宿於崇文院以備非時宣召若有事故請假則與以次官互換直宿亦曾面奉德音云欲自以聖意宣諭政府施行此事自後至今未聞施行臣不避煩瀆天聴再三進言者葢以為國之要在於審察人材周知下情而已審察人材之謂明周知下情之謂聦明則百官稱其職聦則萬幾當其理百官稱其職萬幾當其理治之極也賢不肖混殽之謂昏下情不上通之謂蔽昏則百職隳曠蔽則萬幾乖戾百職隳曠萬幾乖戾亂之至也治極則安亂至則危故聦明昏蔽者治亂之大本也今陛下即政之初厲精求治而不以此事為先欲以興隆祖業垂裕後昆是猶却行而求及前人也故臣不得不勤勤懇懇為陛下再三言之書稱堯之徳曰稽於衆舍已從人稱舜之徳曰賔於四門明四目逹四聦故能咸熈庶績格于上下至今言聖人者無不以二帝為首何哉聦明故也秦二世納趙髙之謀恐譴舉不當見短於大臣而深拱禁中漢靈帝惑趙忠之言謂人君登髙則百姓散離而不敢登臺榭北齊後主志度偷懦不喜見朝士非私昵未嘗交語隋煬帝沈湎淫泆常在後宫盜賊滿天下恐人言之是以上下怨叛至於殺身滅國而終不自知後世言無道者無不以四君為首何哉昏蔽故也太祖太宗起於側微天下艱難民間情偽無不備知然南面之日延訪羣臣惟恐不及晝日不足繼之以夜下至役夫田婦無不詢察以盡其情用能創業垂統力致太平陛下以帝王子孫生長富貴朝士大夫素未相接耕織勞苦不經耳目當兹親政之始雖孜孜下問朝夕不倦以察人情猶恐不盡況深居九重非視朝之時不見羣臣羣臣非官位職事有例上殿無由進見顒卬淵黙以嚴重自居將使幽逺之民衘寃失職者何由上聞疏賤之臣懷材藴徳者何由自逹哉國家安危之所分將於此乎在臣是以不勝憤懣區區盡忠重為陛下陳之伏望陛下察為國之要觀唐虞之所以興秦漢齊隋之所以亡繼祖宗之志以守太平之業檢會臣前來所奏兩劄子内事節早賜施行實天下幸甚取進止乞延訪羣臣第四劄子治平元年八月七日上臣屢曾上言乞詔侍從之臣每日輪一員直資善堂夜則宿於崇文院以備非時宣召亦曾面奉徳音云候秋涼當頻有宣召今已秋涼尚未聞有曾被召之人臣始者上言之時竊見陛下欣然開納將謂即時施行自後遷延日乆聖意漸以為難臣竊意内外之臣必有欺惑天聴沮難此事欲陛下常居禁中不與羣下相接以壅蔽聦眀專固權寵者此豈忠臣之所為而陛下之福邪臣願陛下深察此情斷自聖志使之更直陛下每日聽政餘暇宫中無事之時特賜召對與之從容講論古今治體民間情偽使各竭其胸臆所有而陛下更加采擇是者取之非者捨之忠者進之邪者黜之如此則下情盡逹聖徳日新矣若以資善堂體例稍生則學士待制於崇文院輪宿自有舊條只乞陛下傳宣崇文院今後直宿者並須從早在彼祗候宣召其有事故請假者須與以次官互換直宿此事極不難行而所益甚大惟陛下留意取進止言奉飬上殿劄子嘉祐八年十二月上臣竊聞近日陛下聖體甚安奉事皇太后昏定晨省未嘗廢闕非獨羣臣百姓之福乃宗廟社稷之福也陛下既為仁宗皇帝之後皇太后即陛下之母今濮王既没陛下平生孝養未盡之心不施之於皇太后將何所用哉臣聞君子受人一飯之恩猶不忍負之必思報荅況皇太后有莫大之徳三陛下豈可斯須忘之先帝立陛下為嗣皇太后有居中之助一也及先帝晏駕之夜皇太后決定大䇿迎立聖明二也陛下踐阼數日而得疾不省人事中外衆心惶惑失措皇太后為陛下攝理萬幾鎮安中外以俟痊復三也有此一徳者則陛下子子孫孫報之不盡況兼三徳而有之陛下所以奉飬之禮若有絲毫不備四海之人其謂陛下為如何天地鬼神其謂陛下為如何此不可以不留聖心也今陛下已能奉養如禮而臣復區區進言者誠欲陛下戒之慎之始終無倦外盡其恭内盡其愛使孝徳日新令聞四逹以叶天下之望保萬世之祿而已若萬一有無識小人以細末之事離間陛下母子不顧國家傾覆之憂而欲自營一身之利者願陛下付之有司明正其罪使天下曉然皆知陛下聖明仁孝不負大恩而讒佞不能間也取進止言奉養上殿第二劄子臣累曾上言乞陛下加意奉養躬親萬幾言辭拙訥未䝉采納臣竊惟當今切務無大於是是敢不避斧鉞重有敷陳至於奉親之禮報徳之義為君之職訪善之道臣曏來文字叙述已詳不敢復煩聖聽獨以目前利害言之陛下試詳擇焉竊以皇太后母也陛下子也皇太后母儀天下巳三十年陛下新自藩邸入承大統若萬一兩宫有隙陛下以為誰逆誰順誰得誰失又仁宗皇帝恩徳在民藏於骨髓陛下受其大業而無以報之則何以慰天下之望若陛下上失皇太后之愛下失百姓之望則雖有大寳之位將何以自安凡人主所以保國家者以有威福之柄也故民畏之如神明愛之如父母今陛下即位將近朞年而朝廷政事除拜賞罰一切委之大臣未嘗詢訪事之本末察其是非有所與奪臣恐上下之人習以為常威福之柄寖有所移則雖有四海之業將何以自固位則不安業則不固於陛下果何所利乎陛下必以為事皇太后之禮止如是亦不失矣親萬幾之務止如是亦無闕矣臣竊以為不可臣聞陛下昔在藩邸事濮王承順顔色備盡孝道凡宫中之事濮王皆委陛下幹之無不平允陛下事皇太后當一如濮王然後可視天下之政當一如宫中之事然後可況濮王之親以恩皇太后之親以義其奉養之謹非特有所加則無以取信也宫中之事小天下之事大其聽㫁之勤非特有所加則無以致治也儻奉養極其謹聽斷極其勤則陛下仁孝之名流於萬世英叡之徳逹於四表宗廟永安子孫䝉福於陛下有何所害而久不肯為哉凡此利害之明有如白黑取捨之易有如反掌陛下今日囘意易慮猶未為晩若固守所見終無變更臣恐日月寖久釁隙愈深不可復合威權巳去不可復收後雖悔之亦無及已臣受國家累世大恩不敢愛死為陛下極陳社稷之計肝膽所蓄盡此而巳伏望陛下少留意察之取進止言奉養上殿第三劄子臣近以私懇求鄉便一州伏䝉聖恩令宰臣宣諭以臣曏所言事略皆施行令臣且在諫院供職未得求出臣以駑下之質生於盛明之世得備諫官為幸已大況陛下謙恭接下容受直言此乃愚臣千載一遇畢命報國之秋豈願離去左右自棄於疎逺之地誠以父母墳墓久不展省人子之心遑遑不安所以有此陳乞今忽奉聖㫖宣諭如此臣惶恐慙懅無地自容夙夜循省進退維谷臣竊惟曏時所言欲陛下以事濮王之禮事皇太后又欲陛下延訪羣臣躬親政事今陛下雖奉事皇太后加於往日猶未及事濮王之時承顔順意曲盡歡心也雖省覽庶政猶未嘗訪問羣臣講治亂之切務也陛下若以二者為止當如此則兩宫之意無由和洽萬幾之務無由治辦禍亂之原尚在太平之期尚逺臣雖日侍丹扆有何所益陛下若奉養之禮日増月益訪求治道勤勞不倦使慈母歡欣於上百姓安樂於下則臣雖在逺方亦猶在陛下之側也臣聞為人子者事其親而親不恱不敢怨也退而自責曰我之愛不至歟愛至矣而猶不恱則曰我之禮不恭歟禮恭矣而猶不恱則曰我之誠不盡歟誠既盡矣則大孝之名逹於四海通於神明神明且猶助之而況人乎臣又聞為人君者視天下有一事不治以為已過有一民失所以為巳憂天下已安已治矣猶復思將來之患而豫防之天下未嘗無事也在人君思與不思而已矣思之則治安不思則亂危陛下儻能以此二者自勉則臣安敢廢公家之急而徇私家之務乎取進止言奉養上殿第四劄子臣伏見陛下曏者即位之初奉事皇太后䖍恭欵至皇太后撫愛陛下恩渥周備數日之間慈孝之譽逹于中外播於逺近聞者無不相慶自聖體不安旬月之間道路之人漸有異議皆云因任守忠等本不樂陛下為嗣故於皇太后之處則言陛下與中宫之短於陛下與中宫之處則言皇太后之失遂使兩宫之心互相猜貳間隙一開猝難復合今陛下奮發英斷屏黜讒邪守忠等皆降逐出外中外之人不勝忭恱然臣愚竊恐皇太后尚未能盡知姦人之情與陛下所以斥去之意伏望陛下與中宫親詣皇太后閤頓首陳謝具述從來為守忠等所誤致屢有違忤皇太后之意今守忠等既去願與皇太后母子之恩一如舊日然後朝夕與中宫侍養左右膳羞藥餌躬親進獻承順顔色皆如臣庶之家母子婦姑之禮若左右之人尚有敢相離間者願陛下立行誅竄勿復有疑如此則讒慝黜逺内外雍睦善氣興行災沴消亡宗廟永安令聞長世若失此之際兩宫之歡不能復舊則恐長無可復之期豈惟當今天下之人以陛下為非將傳於史䇿取譏萬世矣此皆聖明所自知而臣復區區進言者欲陛下深更留意取進止言永昭陵建寺劄子治平六年三月卄七日上臣竊聞近有聖旨於永昭陵側别建一寺未知信否果如此竊恐不可何則宣祖太祖太宗三陵共有一寺若獨於真宗仁宗各置一寺則是尊奉之禮踰於祖宗豈特於體理不順為朝廷闕失亦是違先帝之孝心也議者或謂三陵共在一處永定永昭相去稍逺以此須别建一寺凡臣僚之家無人守墳乃於墳側置寺啗以微利使之守護種植而已至於國家守衛山陵有司備具置寺之處何較近逺若云資薦求福則死生之際人不能知釋氏所言虚實難騐使亡者㝠然無知則資薦之事有何所益果然有知如釋氏所言則仁宗皇帝寛慈恭儉好生惡殺恩浹四海澤被萬物豈待别置一寺更度數僧然後得生天堂樂處也且仁宗皇帝晩年詔天下無名額寺屋及百間者並特與名額計創添寺額千有餘處據此功徳宜享夀考無疆之福而數月之間宫車晏駕以此驗之佛不能為人之福豈不顯然此皆皇太后與陛下所親見也今自國䘮之後支給賞賜供奉山陵帑藏空虚賦役煩多百姓罷弊京西去秋不稔春復少雨正是朝廷宵衣旰食存恤之時乃復興此無名之役不急之費誠非中外所望也若萬一有益於先帝羣臣豈敢愛惜今逆禮傷孝蠧財勞人但使僧徒監脩之人因此為名妄求恩澤以廣徼倖之路臣竊為朝廷不取也伏望陛下與皇太后深思當今切務汲汲於富國安民息此無益之事以副天下之望其永昭陵寺只乞依前來指揮更不别置取進止乞車駕早出祈雨劄子治平元年四月十七日上臣伏見權御史中丞王疇等建言乞陛下循真宗故事幸諸寺觀祈雨朝廷雖從其所請而講議選日巳踰旬浹至今車駕未出衆論狐疑皆云事恐中輟臣愚竊以陛下踐阼巳踰朞年京城百姓未聞屬車之音重以曏者聖體不安逺方之人妄造事端訛言未息若聞車駕一出則逺近釋然莫不喜恱況今春少雨麥田枯旱禾種未入倉廪虚竭閭里饑愁陛下為民父母當與之同其憂勞祈禱羣神豈可晏然視之不以疚懷況詔命已降流聞四方若復遷延久而不出則道路之人愈増猜惑不若曏時初無此議也且王者以四海為家故稱乗輿或稱行在今車駕暫出近在京城之内亦何必拘瞽史之言選揀時日而忘萬民朝夕之急殆非成湯桑林周宣雲漢之意也臣愚伏望陛下斷自聖志於一兩日之間車駕早出為民祈雨以副中外喁喁之望取進止乞今後有犯惡逆不令長官自劾劄子治平元年四月二十四日上臣竊以國家承百王之弊俗化陵夷不肖愚民犯誼侵禮無所不至此朝廷所宜留意不可忽也昔賈誼歎秦俗之薄惡以為借父耰鉏慮有徳色母取箕帚立而誶語抱哺其子與公併倨婦姑不相說則反脣而相稽以今閭巷之民旦夕所為如彼數者皆何足言近聞開封府屢有子殺父母者相繼事發以京邑之中猶有如此悖逆之民況於逺方教化之所不及哉臣竊見刑部格勑百姓間有犯惡逆以上者州縣長官量事貶降隠而不言委錄事叅軍糾察聞奏刑統叅詳條部内有犯惡逆以上罪者今後刺史以上附表自劾以敦風教責與不責並聽勑裁朝廷近年務行寛政吏有故出人罪者率皆不問或小有失入則終身廢棄以此民有謀殺及毆詈尊長者州縣之吏專務掩蔽縱釋惟恐上聞往往止從杖罪斷遣少肯處以正法葢避自劾之恥務為身謀遂使頑民益無顧憚名敦風教其實壊之王者之政當善善惡惡若寛此悖逆之民以為仁政臣實愚淺未之前聞況教化之失風俗之弊任其責者豈特州縣長吏而已若長吏隠而不言乃使錄事叅軍糾察聞奏斯亦難矣臣愚伏望朝廷今後除去上件貶降長吏及附表自劾二條更不施行在京則委糾察刑獄畿内則委府界提㸃在外則委轉運使提㸃刑獄常切覺察州縣官吏如有敢將惡逆不孝不睦等罪寛縱隠蔽不依正法勘鞫斷遣者並畫時糾舉聞奏隨其輕重各以故出人罪論若上件諸司不糾舉者委臺諫官察訪聞奏取進止貢院定奪科塲不用詩賦狀治平元年四月十四日上准中書送下天章閣待制判國子監吕公著劄子臣聞以言取人固未足以盡人之才今之科塲格之以辭賦又不足以觀言國家承平日久文物至盛學者莫不欲宗經嚮道至於浮華博習有不得巳而為之者先帝察取士之弊嘗集近臣之論形於詔文則曰本學校以教之然後可以求其行先䇿論則辨理者得盡其説簡程式則閎博者頗見其才雖丁寜申諭而有司不能奉行竊聞昨來南省考校始専用論䇿升黜議者頗以為當臣猶恐四方疎逺未知所尚有司各持所見則人無適從欲乞今來科塲更不用詩賦如未欲遽罷即乞令苐一塲試論第二塲試䇿第三塲試詩賦每遇廷試亦以論壓詩賦為先後升降之法庶成先帝之志永底人文之盛臣謬司學政盍進輿言如允所奏即乞預行告示令本院定奪聞奏者當院看詳近世取人専用詩賦其為弊法有識共知今来吕公著欲乞科塲不用詩賦委得允當然進士只試論䇿又似太簡欲乞今後省試除論䇿外更試周易尚書毛詩周禮儀禮春秋論語大義共十道為一塲其䇿只問時務所有進士帖經墨義一塲從来不曽考校顯是虚設乞今更不試御前除試論外更試時務䇿一道如此則舉人皆習經術不尚浮華若是依舊不罷詩賦之時即先試後試事歸一體别無損益今若罷去詩賦仍乞依吕公著起請預行告示使天下學者早得聞知傳家集巻三十欽定四庫全書傳家集巻三十一宋司馬光撰章奏十四言爲治所先上殿劄子治平元年五月十八日上臣伏覩皇太后手書已罷聴政陛下欽承慈㫖獨斷萬幾臣聞易曰君子以作事謀始又曰正其始萬事理差之毫釐謬以千里陛下雖踐阼朞年於國家大政猶多所謙抑雖時有處分皆常式小事非天下所以望於陛下者也曏時外間議者皆曰陛下聖體未安倦於聴覽及知聖體已安又曰陛下上畏皇太后之嚴欲盡人子之禮避專命之嫌韜藴聰明未敢施設今皇太后舉國家大柄盡付之陛下則議者無復可言唯拭目傾耳以瞻望聖政而已矣陛下當此之際治身治國舉措云爲不可不慎昔楊朱見衢塗而泣謂其可以左可以右所差甚微所失甚大也人主即政之初亦榮辱安危之衢塗也故臣願陛下留聖心焉臣聞治身莫先於孝治國莫先於公孔子曰孝徳之本也又曰不愛其親而愛佗人者謂之悖徳不敬其親而敬佗人者謂之悖禮未有根絶而葉茂源涸而流長者也仁宗皇帝以四海大業授之陛下其恩徳之大天地不足以爲比今登遐之後骨肉至親獨有皇太后與公主數人陛下所當日夜盡心竭力供承撫養以副仁宗皇帝之意曏者皇太后聽政之時左右侍衛之人不敢不恪求湏之物無敢不備既委去政柄臣竊慮有無識小人隨勢傾移侍奉懈慢供給有闕則天下之責皆歸陛下此不可不留意朝夕省察者也又若有不逞之人於兩宫之間刺探動静拾掇語言外如效忠内實求媚以相與搆間者臣願陛下逆拒其辭執付有司加之顯戮誅一人則羣邪自退納一言則百讒俱進此乃禍亂之機不可不深察也臣聞國事聴於君家事聴於親臣愚以爲陛下在外朝之時刑賞黜陟之政當自以聖心決之至於禁庭之内取捨賜予事無大小不若皆禀於皇太后而後行陛下與中宫勿有所專如此則内外之體正尊卑之序明慈母懽忻於上臣民頌咏於下矣不然皇太后歸政之後若侍衛之人稍有怠惰求須之物小失供擬加以讒邪妄興離間萬一有􅁝毫闕失流聞於外或皇太后憂思不樂内生疾疢則陛下何以勝此名於天下哉雖百善不能掩矣臣故曰治身莫先於孝也洪範於好惡偏黨之際六反言之重之至也周任曰爲政者不賞私勞不罰私怨大學曰欲明明徳於天下者必先正其心有所忿懥則不得其正有所好樂則不得其正陛下奮發宫邸入纂皇極爰自潜躍至於天飛舊恩宿怨豈能盡無然今日即政之初皆不可置於聖慮以害至正也凡人君之要道在於進賢退不肖賞善罰惡而已爵祿者天下之爵祿非以厚人君之所喜也刑罰者天下之刑罰非以快人君之所怒也是故古者爵人於朝與士共之刑人於市與衆棄之明不敢以已之私心盖天下之公議也今以四海之廣百官之衆有賢有愚有善有惡比肩接迹雜遝並進臣願陛下少留聦明詳擇其間苟有才徳髙茂合於人望者進之雖宿昔怨讎勿棄也有噐識庸下無補於時者退之雖親暱姻婭勿取也有勵行立功爲世所推者賞之雖意之所憎勿廢也有懐姦犯禁爲衆所疾者罰之雖意之所愛勿赦也如此則野無遺賢朝無曠官爲善者勸爲惡者懼上下悦服朝廷大治百姓䝉福社稷永安不然陛下若專居深宫自暇自逸威福之柄盡委大臣取適目前不爲逺慮賢愚不分善惡共貫否則所進者皆平生所親愛所退者皆平生所不快所賞者皆諂諛而無功所罰者皆忠諒而無罪如此則中外解體紀綱隳紊羣生失所天下可憂矣臣故曰治國莫先於公也此二先者榮辱之大夲安危之至要臣願陛下審思而行之詩云亹亹文王令聞不已陛下誠能行此二者則盛徳美譽滂沛洋溢近者傳誦逺者襃嘆不過旬月之間徧於天下逹於四夷後日之政如順風吹毛乗髙汱水可以不勞而成功矣取進止論皇太后取索劄子治平元年五月十九日上臣竊聞兩府議定皇太后於諸處取索物色令本閤使臣以皇太后㫖申牒逐處有司再具牓子奏聞候見御寳即便供應臣熟思此一節事理恐未至穏便臣聞自来内中凡有所湏止用御寳合同文字於諸司庫務取索諸司庫務即時供應過後方申三司覆奏及行磨勘今来皇太后有所取索若一一湏待本閤使臣申牒逐處再行覆奏候得御寳方敢供應臣愚竊慮行遣徃復太爲迂迴萬一使者懈慢有司泥文皇太后緩急欲得藥餌什噐之類細小之物不能應時而至遷延經日有傷慈母之心則非陛下以四海奉養之意也事雖至微當此之際小有不足所繫甚大禮王及后世子之膳不㑹盖優尊者不可限以多少之數故也臣愚欲望陛下再令兩府大臣商量此事應皇太后所取物色並令本閤使臣行文字與合同司一如陛下聖旨所取出御寳合同文字下諸司庫務畫時供應仍令合同司每日將本閤使臣文字繳連實封别遣使臣進呈皇太后以防矯偽如此則尊卑之體正孝養之禮盡取進止乞后族不推恩劄子治平元年五月卄五日上臣竊聞陛下欲加曹佾使相皇太后再三不許又聞有聖㫖令皇后本家分析親的骨肉聞奏亦與推恩臣愚以爲皇太后既深執謙遜抑損外親則后族亦恐未宜襃進伏望陛下宣諭兩府后族恩澤並未可施行且俟佗時徐議其事一則示人子恭孝之心不敢使后族先於母黨二則示人君即政之初不可以爵祿待賢之具獨私椒房之親其於聖徳益有光榮取進止上皇太后疏治平元年五月卄八日上月日具位臣司馬光謹昧死再拜上疏皇太后殿下去歲仁宗皇帝捐棄萬方皇帝嗣統之初憂哀成疾殿下念社稷之重同聽庶政以安羣情今聖體復初四方無事殿下推而不居自取安逸動静之節無不合宜率土臣民孰不稱頌臣不自量度欲成殿下之全美猶以螢燭之微明仰禆日月之盛光伏惟殿下稍寛其罪而終聴其辭臣竊以治家之道貴賤雖殊人情一也嘗觀天下士民之家其長㓜羣居長者或恩意不備衣食不豐㓜者或容貌不恭語言不遜若㓜者孝恭而不怨長者慈惠而不責則上下雍睦家道以興若㓜者以爲怨長者以爲責則上下乖離家道以衰其始相失也甚微而終爲禍也甚大又加以讒人間之於是乎有父子相疑兄弟相疾亂虐並興無所不至者矣凡閨門之内子婦中有以孝恭之心至者則尊親當歡然以慈愛之心接之若其有過則當以忠厚之心教之教之備矣而猶不聴則雖責之可也罪之可也及其既改則又當復以歡心接之不可以一忤顔色而終身惡之遂不可觧謝也故骨肉之間有威怒而無憎疾有詰責而無猜忌此自古聖人所以御其親之道也臣竊惟皇帝皇后於殿下兼内外之親㓜䝉保育今日爲萬民父母享天下冨貴孰云非殿下之力臣謂殿下固冝撫存愛念情同所生周旋保䕶以終大惠不可偶以纎芥之失遂蓄乆長之怒棄生成之厚恩取疎絶之深怨愚智所同知也皇帝去嵗得疾之時禮貌言辭誠有可疑得罪於殿下者臣固已嘗言於殿下云不可責有疾之人以無疾之禮也凡醉而有過醒猶可赦况有疾之人不自省知本非意之所欲爲豈可追數以爲罪咎邪皇后自童孺之嵗朝暮遊戲於殿下之懐分甘哺果拊循煦嫗有恩無威今既正位中宫得復奉膳羞盥帨以事殿下其意恃昔日之愛不自疎外猶以童孺之心望於殿下故或有所求須不時滿意則慍懟怨望不能盡如家人婦姑之禮殿下雖怒之責之固其宜也誰曰不可但事過之後殿下若遂棄之不復収恤憎疾如仇讎則臣以爲過矣臣在闕門之外無由知禁廷之事竊聞道路之言未詳虛實皆言近日皇帝與皇后奉事殿下恭勤之禮甚加於往時而殿下遇之太嚴接之太簡或時進見殿下雖賜之坐如待疎客語言相接不過數句須㬰之間已復遣去如此母子之恩如何得逹婦姑之禮如何得施所以使之疑惑恐懼不敢自親者盖以此也臣竊惟殿下母儀天下踰三十年柔明之譽洽于中外皇帝龍潜藩邸進徳脩業仁聖之望光於逺邇先帝以至公大義選賢建嗣海内之人皆謂繼統之日慈孝之風必自家刑國誠不意閭巷之民忽有今兹異論推其本原盖由皇帝遇疾之際宫省之内必有讒邪之人造飾語言互相間搆一則欲詐效小忠以結殿下之知僥求禄利二則自知過失素多畏嗣君之嚴有所不容三則欲竊弄權柄惡長君聦明使已不得自恣是以日夜闚覘拾掇絲毫之失無不納於殿下之耳殿下雖至聦哲不能無疑雖至仁慈不能無怒皇帝以剛健之性屈於衆口無以自伸能不憤悒遂使兩宫之間介然相失乆而不觧流聞于外致朝野之士有敢竊議其是非者深可惜也今天誘其衷殿下濬發慈旨卓然逺覽舉天下之政歸之皇帝此乃宗廟之靈生民之福然臣竊料讒邪之人心如沸湯愈不自安力謀離間彼皆自營一身之私非爲國家與殿下之計也臣願殿下深察其情勿復聴納斥逺其人勿置左右召諭皇帝以嚮来紛紛皆此屬所爲自今以後母子之間當坦然無疑皇帝必涕泣拜伏感激摧謝然後兩宫之歡一皆如舊凡皇帝皇后進見之際殿下冝賜以温顔留之從容来往無時勿加限絶或置酒語笑與之欣欣相待一如家人之禮如此則殿下坐享孝養何樂如之心平氣和眉夀無疆國家乂安内外無患名譽光美垂於無窮與其信任讒慝猜防百端終日戚戚憂憤生疾國家不寜禍亂横生譏謗之言流於後世二者得失相去逺矣且殿下既能以祖宗之業付皇帝又能以大政授之而獨於恩禮之際終不能豁然囬心息怒其故何哉方今宫闈之中殿下骨肉至親止於皇帝皇后長公主及皇子公主數人而已其餘皆行路之人於殿下何有若親者尚不可結以恩信猜而逺之則踈者獨肯受殿下顧遇盡其死力終始無二乎夫貴莫貴於爲天子之母富莫富於受四海之養今殿下有此冨貴而不能自樂親其所可踈踈其所可親使受恩之子婦彷徨而不自安踧踖而不敢進雖内懐反哺之心而無以施展臣竊爲殿下惜之臣父子皆䝉先帝大恩擢於常調之中置之侍從之列心非木石豈能暫忘今先帝晏駕之後臣唯不避死亡以進忠直之言庶幾殿下母子和悦國家安寜是臣所以爲報效也不勝區區激切之誠展布以聞惟留神幸察臣光昧死再拜上疏言兩府遷官劄子治平元年閠五月四日上臣伏覩去嵗陛下即位之初兩府臣僚已各遷官今兹甫及朞年一例又加恩命雖陛下襃優大臣務從豐厚而朝野竊議以爲近来國家官爵易得恩賞太頻柱石之臣當勠力同心共救此弊今若連年之内寵數便蕃恬然有之自以爲宜則何以率正佗人抑塞僥倖因此恐大失天下之望然則陛下愛之適所以傷之也臣竊料大臣亦不敢自安必當辭避願陛下因而聴之以成其美取進止言兩府遷官第二劄子臣近曽上言兩府臣僚遷官太頻恐失天下之望乞陛下聴其辭避以成其美未䝉采納臣非憎此數人嫉其遷官乃是欲全其令名使之輔佐陛下重惜大柄耳先帝親選聖明傳以天下今陛下乃欲歸功大臣臣固知其人必不敢當也借使當日實曽賛成先帝聖意乃是欲安宗廟社稷若今日受賞則是豫邀非常之福罪孰大焉然則陛下賞之是掩其盡忠之心使爲狥利之人何榮之有臣所謂欲全其令名者此也夫爵位者人主所以御羣臣之大柄也然品秩髙下本皆虛名但以難得之故爲人所貴若其易得則爲人所賤譬如金玉珠璣若或道路階庭處處有之則與瓦礫無異矣近嵗以来官冗賞濫兩府大臣豈不素知今遇陛下即政之初所宜開導聖聦以懲革斯弊今陛下以纂紹之際及聖體未安之時中外平寜爲兩府之功加以厚賞則宿衛將帥宗室外戚四方藩鎮内侍近臣皆有冀望若一一稱滿其意則國家官爵賤於泥土將無以役使羣臣若抑而不與則人不自知更生觖望是始於推恩而終於聚怨也且輔佐之臣自於朞年之間連併遷官而欲禁止佗人之幸進誠亦難矣臣所謂欲使之輔佐陛下重惜大柄者此也或者陛下以爲曹佾無功尚加之使相况輔弼大臣當國家艱難之際輸力盡瘁不可不賞臣愚以爲不然陛下所以賞曹佾者非以爲功也乃以皇太后之徳至深至厚無以爲報故襃崇元舅以慰母心今若縁此推恩次及后族次及兩府次及佗人則是曹佾隨衆遷官不爲優異於皇太后之心何所慰哉然則陛下虛捐盛恩而衆人皆以大例遷官何足爲喜也臣豈不知陛下欲襃賞大臣而臣區區不量其力以横議千之非身之利然爲朝廷忠謀無恤其佗惟陛下察之取進止乞罷修感慈塔劄子治平元年閏五月十五日上臣伏聞感慈塔已有聖㫖坼修五層竊以開封府界京東京西河北河東陜西西川等路自去冬少雪今春少雨麥田已無所収昨得五月十三日雨方種秋田自後又經一月無雨萌芽始生隨復焦槁農民嗷嗷大率無食棄去鄉里流離道路顧妻賣子以接餱糧縣官倉廪素無蓄積贍給軍衆猶恐不足固無贏餘可以賑貸陛下當此之際所宜側身刻意降服損膳以救其患而更修此佛塔以費國財臣竊以爲失緩急先後之務矣且此塔傾欹爲日已久借使更經數年不修於僧徒有何大害若百姓飢窮朝不及夕而國家不能収恤則老弱轉死溝壑壯者聚爲盗賊當是之時雖有千塔將安用之夫府庫之財皆生民膏血苟非事不得已安可輕費今有司既諂諛苟且曽不爲陛下愛惜陛下又不以介意一皆聴之使四海蒼生將何所依仰臣愚欲望陛下親發徳音宣諭有司以今嵗旱災且罷脩此塔及其餘不急之費有似此類者皆仰有司條奏以聞一切寢罷候佗年豐稔帑藏有餘然後徐議其事於聖政之初亦足以彰愛民之意爲盛美之一事也取進止乞罷近臣恩命上殿劄子臣昨者上言近嵗官冗賞濫兩府大臣遇陛下即政之初冝開𨗳聖聦以懲革斯弊今陛下以紹纉之際及聖體未安之時中外平寜爲兩府之功加以厚賞則宿衛將帥宗室外戚四方藩鎮内侍近臣皆有冀望若一一稱滿其意則國家官爵賤如泥土將無以役使羣臣且輔佐之臣自於朞年之間連併遷官則難以禁止佗人之幸進伏䝉陛下面諭臣以兩府大臣皆有大功所以遷官佗人無功何敢輒望臣再三敷奏以陛下若寢兩府恩命則佗人自然不致僥求若見兩府遷官則誰肯自謂無功不求榮進恐至時陛下亦不能裁抑兩府亦不敢執奏當時陛下聖意確然終不開納今兩府纔受恩命竊聞入内内侍省都都知任守忠等已一例遷官臣竊料向去其餘臣僚互相形比繼續遷官猝無窮盡盖官爵者人主之利噐所以驅策羣臣制御四海今陛下曽不愛惜容易與人一至於此臣竊惜之凡政令之行必自貴近爲始前者濫恩已施之於貴臣不可復収若止之於近臣猶可救其大半所有任守忠等恩命伏望聖慈特賜追還以塞向去僥倖之路取進止傳家集巻三十一欽定四庫全書傳家集巻三十二宋司馬光撰章奏十五陳治要上殿劄子治平元年七月十八日上臣聞舜與臯陶賡歌相戒以明良爲美以叢脞爲非盖以王者奄有四海君臨億兆若事無巨細皆以身親之則所得至寡所失至多矣古語有之曰察目睫者不能見百歩察百歩者亦不能見目睫非不欲兼之勢不可也是以明王緫其大體執其樞要精選賢能任以百職有功者賞有罪者誅故處躬不勞而収功甚大用此道也臣伏見陛下自親政以来厲精求治孳孳不倦未明求衣日昃不食雖大禹之勤勞文王之懿恭無以過此然而政有本末事有細大舉其綱則百目張挈其領則衆毛理臣願陛下先其本後其末急其大緩其細擇人而任之此政之本也賞善而罰惡此事之大也陛下當先察羣臣之邪正與其材能之所堪然後思天下有某事不治者當使某人治之其公忠勤恪功效顯著者勸之以厚賞姦回惰慢無功敗事者威之以嚴刑如是則萬事無不舉兆民無不安陛下可以髙拱無爲而名配堯舜矣至於簿書之煩碎文法之㣲宻錢糓之出納體例之有無此乃羣臣百吏之所守非陛下所當留意也陛下若捨彼而取此則臣恐徒有大禹之勤勞而不獲其功文王之懿恭而不見其治也臣以獻替爲職遇陛下勤政之初虛心求諫此乃千載一時誠不敢以細末之事煩汙聦明伏望陛下深思此道乃自古及今致治之大本勿以爲迂闊陳熟之言而忽之則天下幸甚取進止言程戡施昌言劄子治平元年七月二十八日上臣竊聞近者夏國屢起事端邊境之變不可不備爲備之要在於擇帥伏見鄜延路經略使程戡資性姦回涇原路經略使施昌言老病昏昧皆以斗筲罷愞之才當折衝禦侮之任平居之時未見有闕一旦警急必敗大事譬如開門揖盗以肉餧虎臣竊爲國家危之伏望朝廷早擇智勇之將以代其任二人並除致仕以安邊境之民戒偷禄之臣取進止言任守忠劄子治平元年七月十八日上臣竊聞入内内侍省都都知任守忠擅取奉宸庫金珠數萬兩獻遺中宫自以爲功仍受中宫賞賜外議籍籍無不駭愕伏以守忠從来罪惡極多不可遽數陛下體元繼統聖政方新守忠曽無畏惮益恣巧諂公取官物自眩私恩賛𨗳椒房首爲侈靡既求權寵又分厚利姦邪之臣無大於此伏望陛下特發神斷以守忠付所司窮治所犯明正典刑以示天下取進止言任守忠第二劄子臣近曽上言任守忠姦邪事迹乞正典刑未聞施行臣案守忠懐姦罔上諂佞貪惏竊弄權柄固非一日專爲讒慝交搆兩宫狡詐反覆陛下所知若非先帝聖明皇太后仁慈則社稷可憂天位不安今又盗取庫物曲求容媚教中宫爲不順陷陛下爲不義此而不誅典刑安用據守忠罪惡臣久合奏陳但以陛下踐阼之初天威未振欲望陛下親發英斷戮此大姦使内外之臣莫不震肅今聖恩容貸已及嵗餘外議皆言守忠以諂佞之故受陛下寵遇過於先帝之時臣備位諫官不敢塞黙守忠職在宫禁久專威福若不早除恐别生事伏望陛下如臣前奏速以守忠付所司窮治所犯肆之市朝以副天下之望取進止言任守忠第三劄子次日守忠除保信軍節度副使蘄州安置臣近者兩次上言任守忠姦邪事迹乞正典刑至今未聞施行臣廹於忠懇不能自已竊見守忠早以小臣獲事先帝幸蒙奬抜榮禄俱極日侍左右不能以忠言正道補益萬分專以詼諧諂諛苟求悦媚其罪一也緫領近侍委之差遣而陵忽同列與奪自恣附已則愛悦逆意則憎疾援引親黨排抑孤寒任情狥私略無顧避其罪二也從来所受俸禄賞賜亦爲不少而資性貪惏老而益甚盗竊官物受納貨賂金帛珍玩溢於私家第宅産業甲於京師聚斂之心曽無紀極其罪三也交結朋援專權據勢縱逞胷臆妄行威福所愛者雖有大罪掩盖不言所惡者小有瑕疵紏擿成事使宫禁之内側足屏息畏憚守忠無以爲比其罪四也濮王之薨守忠監䕶𦵏事賣弄國恩輕蔑皇族乗其有喪丐奪財物所得甚多終不滿意遂誣長子宗懿以爲不孝使被譴謫感憤成疾以至没身不能自雪其罪五也先帝以春秋寖髙未有繼嗣深思宗廟生民之重屬意聖明固非一日而守忠隂蓄姦心沮壊大䇿深忌國家立長立賢自欲於倉猝之際居中建議擇㓜弱昬懦之君以邀大利如有唐之季定䇿國老門生天子頼先帝聦明卓然逺覽斷志不疑不然則太平之業幾墜於地其罪六也及陛下既爲皇子守忠内懐憂懼日於先帝之前離間百端隔絶内外進對甚希使先帝爲陛下之父不得施爲父之恩陛下爲先帝之子不得展爲子之親其罪七也及先帝晏駕陛下纉統不幸遇疾皇太后權同聴政守忠乗此之際大逞姦謀闚伺語言撰造事迹往來革面進退異辭使皇太后以文母之慈不免投杼之疑陛下以曽閔之孝立有負恩之謗交搆兩宫遂成深隙計其隂謀無所不至頼皇太后聦明確然執義不可傾移不然禍變之興豈可具道其罪八也及聖體既安皇太后恭還大政守忠不勸𨗳陛下以勤修子道承顔順意報答盛徳恢廣令譽而相時隨勢斗異炎凉欲詐輸新忠以巧遮舊惡用昔時讒陛下之計爲今日讒皇太后之辭雖陛下未必聴受而使皇太后聞之不能不以介意終日涕泣悒怏成疾守忠但欲左右反覆自爲身謀並不顧天下之人議陛下之善惡其罪九也皇后正位尚新天下聳觀令徳守忠輒爲皇后畫策並不禀問皇太后矯傳教旨開祖宗寳藏擅取金珠數萬兩以獻皇后既取悦一時又坐享厚賜逆婦姑之禮開驕侈之源使皇后受其惡名而已身収其重利爲臣姦邪孰甚於此其罪十也守忠有大罪十皆陛下所親見衆人所共知其餘欺謾爲姦恣横不法事類繁多不可勝言誠國之大賊人之巨蠹伏望陛下盡發守忠之罪明示四方斬於都市以懲姦慝取進止言内侍差遣上殿劄子治平元年上臣曏時上殿伏見陛下宣諭以内臣差遣並一切委之都知司臣當時已曽奏陳以爲非便今入内内侍省都都知任守忠恃此權勢背公立私奉之者坐獲進擢忤之者立致排擯威福之柄盡在其手遂使宫禁之中畏憚其人過於人主罪盈惡積幸頼陛下神斷已斥而去之然儻不収還威福之柄則是去一守忠生一守忠終無益也臣愚伏望陛下自今日已後除内臣常程差遣依舊令都知司定差外其勾當御藥院内東門龍圖天章閣後苑化成殿延福宫等處及非時差管勾裏外要切公事之人並乞陛下親加選擢試之以事觀其爲人忠謹有功者則加賞拔姦邪不職者則加貶退不必一一勘㑹資序檢尋體例如此則誰不懐徳畏威輸忠竭力豈獨内臣而已雖外朝之人臣亦可用此道而治也取進止貢院乞逐路取人狀治平元年上准中書批送下知封州栁材奏欲乞今後南省考試進士將開封國學鏁㕔舉人試巻衮同糊名其諸道州府舉人試巻各以逐路糊名委封彌官於試巻上題以在京逐路字用印送考試官其南省所放合格進士乞於在京逐路以分數裁定取人所貴國家科第均及中外如允所請伏乞下兩制詳定者右謹具如前當院今將簿籍勘㑹近嵗三次科場内嘉祐三年國子監得觧及免觧進士共一百一十八人及第者二十二人約五人中取一人開封府得觧及免觧進士共二百七十八人及第者四十四人約六人中取一人河北路得觧及免觧進士共一百五十二人及第者五人約三十人中取一人京東路得觧及免觧進士共一百五十七人及第者五人梓州路得觧及免觧進士共六十三人及第者二人並約三十一人中取一人廣南東路得觧及免觧進士共九十七人及第者三人約三十二人中取一人荆湖南路得觧及免觧進士共六十九人及第者二人約三十四人中取一人廣南西路得觧及免觧進士共三十八人利州路得觧及免觧進士共三十六人䕫州路得觧及免觧進士共二十八人及第者各只一人河東路得觧及免觧進士共四十四人全無人及第嘉祐五年國子監得觧及免觧進士共一百八人及第者二十八人開封府得觧及免觧進士共二百六十六人及第者六十九人並約四人中取一人京東路得觧及免觧進士共一百五十人及第者五人約三十人中取一人荆湖南路得觧及免觧進士共六十九人及第者二人約三十四人中取一人廣南東路得觧及免觧進士共八十四人及第者二人約四十二人中取一人河東路得觧及免觧進士共四十一人陜西路得觧及免觧進士共一百二十三人及第者各只一人荆湖北路得觧及免觧進士共二十四人廣南西路得觧及免觧進士共六十三人䕫州路得觧及免觧進士共三十二人並全無人及第嘉祐七年國子監得觧及免觧進士共一百一十一人及第者三十人約四人中取一人開封府得觧及免觧進士共三百七人及第者六十六人約五人中取一人荆湖南路得觧及免觧進士六十八人及第者二人約三十四人中取一人陜西路得觧及免觧進士共一百二十四人及第者二人約六十二人中取一人河北路得觧及免觧進士共一百五十四人河東路得觧及免觧進士共四十五人荆湖北路得觧及免觧進士共二十三人及第者各一人廣南東路得觧及免觧進士共七十七人廣南西路得觧及免觧進士共六十三人利州路得觧及免觧進士共二十八人並全無人及第以此比較在京及諸路舉人得失多少之數顯然大段不均盖以朝廷每次科場所差試官率皆兩制三館之人其所好尚即成風俗在京舉人追趨時好易知體面淵源漸染文采自工使僻逺孤陋之人與之爲敵混同封彌考較長短勢不侔矣孔子曰十室之邑必有忠信如丘者焉言雖微陋之處必有賢才不可誣也是以古之取士以郡國户口多少爲率或以徳行或以材能隨其所長各有所取近自族姻逺及夷狄無小無大不可遺也今或數路之中全無一人及第則所遺多矣國家用人之法非進士及第者不得美官非善爲賦詩論策者不得及第非遊學京師者不善爲賦詩論策以此之故使四方學士皆棄背鄉里違去二親老於京師不復更歸其間亦有身負過惡或隠憂匿服不敢於鄉里取觧者往往私買監牒妄冒户貫於京師取觧自間嵗開科場以来逺方舉人憚於往還只在京師寄應者比舊尤多國家雖重爲科禁至於不用䕃贖然冒犯之人嵗嵗滋甚所以然者盖由每次科場及第進士大率是國子監開封府觧送之人則人之常情誰肯去此而就彼哉夫設美官厚利進取之途以誘人於前而以苛法空文禁之於後是猶決洪河之尾而捧土以塞之其勢必不行矣書曰無偏無黨王道蕩蕩國家設賢能之科以俟四方之士豈可使京師詐妄之人獨得取之今来栁材所起請科場事件若依而行之委得中外均平事理允當可使孤逺者有望進逹僑寓者各思還本土矣難者必曰國家比設封彌謄録以盡至公其諸路舉人所以及第少於在京者自以文藝疎拙長短相形理宜黜退今若於封彌試巻上題在京逐路字號必慮試官狥私者因此得以用情是大不然國家設官分職以待賢能大者道徳噐識以弼諧教化其次明察惠和以拊循州縣其次方略勇果以扞禦外侮小者刑獄錢糓以供給役使豈可專取文藝之人欲以備百官濟萬事邪然則四方之人雖於文藝或有所短而其餘所長有益於公家之用者盖亦多矣安可盡加棄斥使終身不仕邪凡試官挾私者不過狥其親知鄉黨今雖題逐路字號若試官欲狥其親知則一路之人共聚一處不知何者是共親知若欲狥其鄉黨則一路之中所取自有分數豈敢偏於本路剰取一人以此言之雖題逐路字號試官亦無所容其私也今欲乞依栁材起請今後南省考試云云裁定取人若朝廷尚以爲有所嫌疑即乞令封彌官將國子監開封府及十八路臨時各以一字爲偏傍立號假若國子監盡用乾字開封府盡用坤字京東路盡用離字京西路盡用坎字爲偏傍其餘路分並依此例委知貢舉官於逐號之中考校文理善惡各隨其短長每十人中取一人奏名其不滿十人者六人以上亦取一人五人以下更不取人其親戚舉人别試者緣人數至少更不分别立號只依舊條衮同封彌分數取人其合該奏名者更不入南省奏名數内如允所奏乞降指揮下貢院遵守施行傳家集巻三十二欽定四庫全書傳家集巻三十三宋司馬光撰章奏十六言講筵劄子治平元年九月三日上臣伏覩講筵所告報奉聖㫖令自九月初五日後逐日講筵至重陽節住講候將来開春别選日講筵臣竊以國家本設經筵欲以發明道誼裨益聖徳先帝時無事常開講筵近嵗因聖體不安遂於端午及冬至以後盛暑盛寒之時權罷數月今陛下始初清明方宜鋭精學問之時而五日開講八日已罷臣恐議者以爲陛下非有意於求道但欲循故事備外事而已羣臣非有意於明道但欲塞職業求錫賚而已若果如此臣竊爲朝廷羞之且陛下近増置諸宫教授仍下詔戒朂宗室使之嚮學儻陛下不以身先之則宗室安肯奉詔哉臣愚以爲陛下若别有所爲未暇開講則且俟佗時亦未爲晩若既開講筵則恐數日之間未宜遽罷取進止乞講尚書劄子治平元年上臣伏覩經筵所講説論語將畢竊以尚書者二帝三王嘉言要道盡在其中爲政之成規稽古之先務也陛下新承大統留意萬幾欲求楷模莫盛於此臣不勝區區欲望陛下更以聖意裁酌將来論語既畢令講説尚書取進止言除盗劄子治平元年十月十日上臣竊聞降勅下京東京西災傷州軍如人户委是家貧偷盗斛斗因而盗財者與减等斷放未知虛的若果如此深爲不便臣聞周禮荒政十有二散利薄征緩刑弛力舍禁去幾率皆推寛大之恩以利於民獨於盗賊愈更嚴急所以然者盖以饑饉之嵗盗賊必多殘害良民不可不除也頃年嘗見州縣官吏有不知治體務爲小仁者或遇㓙年有刼盗斛斗者小加寛縱則盗賊公行更相刼奪鄉村大擾不免廣有収捕重加刑辟或死或流然後稍定今若朝廷明降勅文豫言偷盗斛斗因而盗財者與减等斷放是勸民爲盗也百姓乏食官中當輕徭薄賦開倉賑貸以救其死不當使之自相劫奪也今嵗府界京東京西水災極多嚴刑峻法以除賊盗猶恐春冬之交飢民嘯聚不可禁禦又况降勅以勸之臣恐國家始於寛仁而終於酷暴意在活人而殺人更多也凡號令之出不可不慎毫釐之失爲害實多若纔知其失随即更張猶勝於有害及民迷而不復者也伏望陛下速令収還此勅嚴責京東京西轉運司及州縣應災傷之處多方擘畫斛斗救濟飢民若有一人敢劫奪人斛斗者立加擒捕依法施行如此則衆知所畏不敢輕犯所以保全愚民减省刑獄之道也取進止言備邊劄子臣聞周書稱文王之徳曰大邦畏其力小邦懐其徳盖言諸侯傲狠不賔則討誅之從順柔服則保全之不避彊不陵弱此王者所以爲政於天下也臣伏見去嵗先帝登遐趙諒祚遣使者来致祭延州差指使髙宜押伴入京冝言語輕肆傲其使者侮其國主使者臨辭自訴於朝臣當時與吕誨上言乞加冝罪朝廷忽略此事不以爲意使其怨懟歸國一國之人皆以爲恥今嵗以来諒祚招誘亡命㸃集兵馬窺伺邉境攻圍堡寨驅脅熟户八十餘族殺掠弓箭手約數千人悖逆如此而朝廷乃更遣使臣齎詔撫諭彼順從則侮之傲狠則畏之無乃非文王所以令諸侯乎若使臣至彼諒祚稽首伏罪禁止侵掠猶或可赦若復拒違王命辭禮驕慢侵掠不已未知朝廷將何以待之傷威毁重孰甚於此方今公私困竭士卒驕惰將帥乏人而戎狄犯邊事之可憂孰大於此而朝廷上下晏然若無事者其故何哉豈朝廷自有其備而疎外之臣不得與知乎臣竊惑之所謂備者非但添屯軍馬積貯糧草而已也在於擇將帥而修軍政也二者皆闕何謂有備臣不勝憤懣伏望陛下博延羣臣訪以禦邊之策擇其善者而力行之方今救邊之急宜若捧漏甕沃焦釡猶恐不及豈可外示閒暇而養成大患也取進止言蓄積劄子臣聞國以民爲本民以食爲天國家近嵗以来官中及民間皆不務蓄積官中倉廪大率無三年之儲鄉村農民少有半年之食是以小有水旱則公私窮匱無以相救流移轉徙盗賊並興當是之時朝廷非不以爲憂及年糓稍豐則上下之人皆忘之矣此最當今之深弊也先帝時臣曽上言乞將諸路轉運使及諸州軍長吏官滿之日倉庫之實比於始至増减多少以爲黜陟又令民能力田積糓者皆不以爲家貲之數欲爲國家力救此弊自後不聞朝廷施行今嵗開封府界南京宿亳陳蔡曹濮濟鄆等州霖雨爲災稼穡之田悉爲洪流百姓羸弱者流轉佗方餓死溝壑強壯者起爲盗賊吏不能禁朝廷欲開倉賑貸則軍儲尚猶不足何以贍民欲括取於蓄積之家則貧者未能賑濟富者亦將乏食又使今後民間不敢蓄積不幸復有㓙年則國家更於何處取之此所以朝廷雖寒心銷志亦坐而視之無如之何者也臣竊思之盖非今日有司之罪乃曏時有司之罪也往日不可及来者猶可追陛下儻不於今日特留聖心速救此弊豐㓙之期不可豫保若向去復有水旱螟蝗之災饑饉相仍甚於今年則國家之憂何所不至乎臣又聞平糴之法必謹視年之上下故大熟則上糴三而舍一中熟則糴二下熟則糴一使民適足價平則止小飢則發小熟之所斂中飢則發中熟之所斂大飢則發大熟之所斂而糶之所以取有餘補不足也今開封府及京東京西水災之處放税多及十分是大饑之嵗也官吏往往更行収糴所給官錢既少百姓不肯自来中糴則遣人編攔搜括無以異於冦盗之鈔劫是使有糓之家愈更閉匿不敢入市糓價益貴人不聊生如此非獨天災亦由吏治顛錯之所致也臣愚欲望朝廷檢㑹臣前次及今來所奏事理更加詳酌擇其可者少賜施行指揮開封府界及京東京西災傷州軍見今官中収糴者一切止住其有常平廣惠倉斛斗之處按籍置歴出糶賑貸先救農民告諭蓄積之家許行出利借貸與人候豐熟之日官中特爲理索不令逋欠其河北陜西河東及諸路應豐稔之處委轉運司相度糓價賤者廣謀収糴價平即止如本路闕少錢物即委三司於佗處擘畫那移應副仍自今以後乞朝廷每年謹察諸路豐㓙之處依此施行臣竊料有司必言官無閒錢可以趂時収糴臣伏見國家每遇㓙荒之嵗縁邉屯軍多處常用數百錢糴米一斗若用此於豐稔之嵗可糴一碩不知有司何故於㓙荒之嵗則有錢供億至豐稔之嵗則無錢也此無佗故患在有司偷安目前以俟遷移進用不爲國家思乆逺之計而已故臣惟願陛下深留聖意取進止言階級劄子治平元年十一月十五日上臣聞治軍無禮則威嚴不行禮者上下之分是也唐自肅代以降務行姑息之政是以藩鎮跋扈威侮朝廷士卒驕横侵逼主帥下陵上替無復綱紀以至五代天下大亂運祚迫蹙生民塗炭祖宗受天景命聖徳聦明知天下之亂生於無禮也乃立軍中之制曰一階一級全歸伏事之儀敢有違犯罪至於死於是上至都指揮使下至押官長行等衰相承粲然有叙若身之使臂臂之使指莫敢不從故能東征西伐削平海内爲子孫建久大之業至今百有餘年天下太平者皆由此道也近嵗以来中外主兵臣僚往往不識大體好施大惠以盗虛名軍中有犯階級者務行寛貸是致軍校大率不敢鈐束長行甘言悦色曲加煦嫗以至懦怯兵官亦爲此態遂使行伍之間驕恣悖慢寖不可制上畏其下尊制於卑所謂下陵上替者無過於此臣聞聖王刑期於無刑今寛貸犯階級之人雖活一人之命殊不知軍法不立漸成陵替之風則所繫乃億兆人之命也臣愚欲望陛下特降詔㫖申明階級之法戒勅中外主兵臣僚令一遵祖宗之制如敢有輒行寛貸曲収衆心者嚴加罪罰以儆其餘庶幾綱紀復振基緒永安取進止言舉官上殿劄子治平元年十一月二十五日上臣聞致治之本在於得賢天下至廣羣臣至衆人主不能徧知必資薦舉若薦舉不得其實則邪巧並進官職耗廢是故設連坐之法以懲之此百王不易之道也伏見近降詔書令中外臣僚於文資官内不以職位髙下舉行實素著官政尤異可備陞擢任使之人又於諸司使以下至三班使臣内舉堪充將領及行陳任使之人此乃前世之令典當今之切務臣始聞之不勝慶抃既而議者皆言數年之前亦曽有此詔書所舉甚衆未聞朝廷曽有所陞擢今兹盖亦修故事飾虛名而已非有求賢之實也若果如此誠有何益臣愚欲望陛下盡將今来臣僚所舉之人隨逐人資叙各置一簿編其姓名留之禁中其副本降付中書樞宻院若遇文臣轉運副使提㸃刑獄轉運判官知大藩府及武臣緫管鈐轄路分都監知州軍等有闕除用舊資叙人外應係陞陟入上件差遣者並乞於今来舉官簿内次等資叙人中陛下親加選擇㸃定一人其不係今来薦舉之人不得差充上件差遣若陞陟以後佗日職事敗闕不如所舉及犯贓私罪其舉主並依法施行雖見任兩府亦乞不以恩例特放凡係舉官不當降官及降差遣者未滿三年雖遇恩赦不得牽復如此則羣臣莫敢不盡公擇人天下賢才皆可得而官使矣取進止言陳述古劄子治平二年正月十日上臣竊聞陜西都轉運使陳述古昨因巡邊妄奏朝廷稱邊鄙寜静不足爲慮後因權涇原路經略司事聞副緫管劉几稱西人㸃集將謀入冦請出兵防扞述古恐與前奏相違因此怒几奏稱不協軍情張皇生事擅移几知鳯翔府數日之間西人果大舉犯邊殺掠弓箭手及熟户蕃部述古亦不即時發兵救援致陷没數千户近者雖知朝廷已差臺官勘述古罪狀然竊聞所坐止於擅移劉几及奏狀有不實之處若以文吏議之罪不至重若以國計言之爲害實深何則國家承平日久人不習戰雖屯戍之兵亦臨敵難用唯弓箭手及熟户蕃部皆生長邉陲習山川道路知西人情偽材氣勇悍不懼戰鬬從来國家頼之以爲藩蔽今述古知西人欲来侵擾而自避飜覆之辜順成欺罔之謀抑遏將官不許救䕶遂以數千户生民委於虎口使父子流離骨肉塗炭豈惟已陷没者深可哀痛臣恐自今以後諸路弓箭手皆不敢於極邉居止熟户蕃部皆有叛國從賊之心以此觀之其害豈小哉况述古出於門䕃材氣庸鄙自歴官以来所至之處縱恣胷臆殘虐吏民不顧憲典輕侮王命驕暴狠狡天下共知屢曽坐事黜降旋復収用叨竊名位一朝至此誠過其分量故天奪之魄舉措乖謬駭人視聴陷敗民命挫辱國威内外之人無不憤疾臣聞舜誅四㓙而天下服如述古平生所爲亦可以謂之㓙人矣陛下縱不欲明加斧鉞以謝邉民亦當投之荒裔以禦魑魅庶使封疆之臣少加警懼取進止言皮公弼劄子治平二年正月十一日上臣伏覩近降詔書於初任第二任通判人中選人權發遣三司判官公事九年之後擢爲職司既使之久於其事又待以不次之位此誠用人之要術爲政之首務也然當兹選擢之初天下士大夫莫不延頸而望拭目而視若得清修孤直之人則皆勸慕爲善砥節礪行不肖者亦化爲賢矣若得貪汚諂偽之人則皆傾巧干進飾貌盗名安恬者亦變而爲躁矣此乃風俗之本原政治之樞機不可以不慎自非有竒材異績爲天下所知未可容易當此舉也竊見尚書都官員外郎皮公弼爲吏之處以貪饕致富資性狡猾善爲進取在京師則造請不倦在外則書啟相尋專用此術致舉主三十餘人一旦首膺兹選天下之人苟有知公弼所爲者但私議竊歎憤鬱喑嗚莫敢發言此豈可以稱陛下求賢之意副四方跂竦之望哉若所選之人皆如皮公弼之類乃是開此徼倖之門以爲佞邪躁進之塗恐非朝廷之福也所有皮公弼伏望聖慈追還前命勒歸本任况今中外之官本資序合入三司判官者尚不啻數十人豈得其中全無可選擇者願且選以補即目三司判官之闕俟果有竒材異績爲衆所知者然後依近降詔書舉而用之天下幸甚取進止言皮公弼第二劄子臣近曽上言乞罷皮公弼三司判官公事未聞朝廷施行臣聞周禮小宰以六計弊羣吏之治曰亷善亷能亷謹亷正亷法亷辨盖言爲吏者雖有六事皆以亷爲本也翼奉曰人誠向正雖愚爲用若乃懐邪智益爲害盖言人操心不正者雖有材能無所用也今以公弼材能求於朝士之間不爲難得若其貪汚諂偽則罕有其比陛下方欲簡㧞英賢待之不次以砥礪羣臣新美大化而得公弼之徒臣恐四方聞之無不觧體使亷正之士沈抑而不顯貪邪之人輻湊而競進其於虧損聖政敗壊風俗不爲細事伏望陛下早追還公弼前所授恩命勒歸東明本任取進止言王廣淵剳子治平二年正月十三日上臣伏見新除王廣淵直集賢院外廷之人無不怪惑偶語族談莫知其故或云廣淵以唇舌便佞遊走於公卿之門盖執政所薦也或云陛下龍潜之時廣淵以文章因陛下故人自薦逹素䝉知賞故特加㧞擢此二者臣莫知其虚實若果有其一皆非朝廷之美也夫端士進者治之表也憸人進者亂之階也臣窃聞廣淵雖薄有有文藝其餘更無所長於士大夫之間好奔競善進取稱為第一若以此獲公卿之知則其人固非端士矣曏以初任通判編排中書文字二年之間堂除知舒州搢紳已皆相與指目以為僥倖今又驟加美職安得不取外廷之怪惑乎陛下方涖政之初欲簡㧞天下賢材寘諸不次之位以率厲羣臣而執事之臣不能稱陛下之意前此用皮公弼權發遣三司判官今又用王廣淵直集賢院將何以使天下之人尚廉恥之莭崇敦厚之風乎若陛下龍潜之時廣淵果曽以文章自達於左右此尤不可昔漢文帝時景帝為太子嘗召上左右飲中郎将衛綰獨稱疾不往及即位寵待綰過於佗臣周太祖時世宗鎮澶州張美為三司吏掌州之錢穀世宗私有求假美悉力應奉及即位衆皆稱美材敏而世宗終薄其為人廣淵若當仁宗之世私以文章獻於陛下為臣忠謹者肯如是乎陛下今日當治其罪而又賞之將何以厲人臣之節也所有王廣淵新直集賢院勅伏乞追還言王廣淵第二劄子臣近曽上言乞罷王廣淵直集賢院事未聞朝廷施行外議籍籍至今未已臣備位諌職不敢塞黙竊見廣淵憸邪便佞勤於造請以此之故自幕職入京數年之間得堂除知州今又以特㫖直集賢院臣不知廣淵有何才徳過絶於人而受國家寵榮如此之速也議者皆言陛下在藩邸時廣淵因時君卿以文章筆札私有䞇獻深自結納故有今日之命若果如此大為非宜臣聞為人君者洗濯其心至公至正審察善惡明辨是非忠信者雖有怨讎而必用姦回者雖有私恩而必誅是以羣臣暁然各知所守一心同徳以事其上今廣淵若於仁宗之世私結陛下之知則陛下察其為人果為忠信果為姦回若以此獲美官則姦囘之臣欲求進身者將何所不為恐非陛下之利也自古以來惟英明之主能知此理伏望陛下追還廣淵恩命仍嚴加竄謫以懲憸巧之臣用心不一者取進止傳家集巻三十三欽定四庫全書傳家集巻三十四宋司馬光撰章奏十七乞罷陜西義勇劄子治平元年十一月二十二日上臣傳聞朝廷差陜西提㸃刑獄陳安石於本路人户三丁之内刺一丁充義勇不知虛實若果如此大爲非便臣竊意議者必以爲河北河東皆有義勇而陜西獨無近因趙諒祚寇邉故欲廣籍民兵以備緩急使之捍禦也臣伏見康定慶厯之際趙元昊叛亂王師屢敗死者動以萬數國家乏少正軍遂籍陜西之民三丁之内選一丁以爲鄉弓手尋又刺充保捷指揮差於㳂邉戍守當是之時閭里之間惶擾愁怨不可勝言耕桑之民不習戰鬭官中既費衣粮私家又須供送骨肉流離田園盪盡陜西之民比屋凋殘至今二十餘年終不復舊者皆以此也其謀策之失亦足以爲戒矣是時河北河東邉事稍緩故朝廷但籍其民以充義勇更不刺爲軍雖比之陜西保捷爲害差小然國家何甞使之捍禦戎狄得其分毫之益乎今議者但怪陜西獨無義勇不知陜西之民三丁之内已有一丁充保捷矣自西事以来陜西困於科調比於景祐以前民力減耗三分之二加之近嵗屢遭凶歉今秋方獲小稔且望息肩又值邉鄙有警衆心已揺若更聞此詔下必大致驚擾人人愁苦一如康定慶厯之時是賊寇未来而先自困弊也况即日陜西正軍甚多不至闕乏何爲遽作此有害無益之事以循覆車之轍也伏望朝廷審察利害特罷此事誠一方之大幸取進止乞罷陜西義勇第二上殿劄子臣近曽上言乞罷刺陜西義勇事未審朝廷曽與不曽别爲商量臣前次上殿乞陛下留意備邉所謂備者非但添屯軍馬積貯糧草而已在於擇將帥而修軍政今將帥不才者未聞有所更改軍政頺弊者未聞有所振舉而忽取腹内州軍之民盡刺以爲兵外人聞之無不駭愕今陜西沿邉正軍動以萬數朝廷若能擇有方略膽勇之人以爲將帥使之簡去疲弱選取精鋭勤加教習明行賞罰則雖欲取銀夏而税其地擒趙諒祚而制其命有何所難况但止其鈔盗乎今朝廷不孜孜以將帥軍政爲急而無故籍耕桑之民使之執兵徒有驚擾而實無所用臣不知誰爲陛下畫此策也昔康定慶厯之間朝廷以元昊犯邉官軍不利已曽籍陜西之民以爲鄉弓手始者明出勅牓云但欲使之守䕶鄉里必不刺充正軍屯戍邉境牓猶未収而朝廷盡刺充保捷指揮令於邉州屯戍當是之時臣丁憂在陜備見其事民皆生長太平不識金革一旦調發爲兵自陜以西閭閻之間如人人有喪户户被掠號哭之聲彌天亘野天地爲之慘悽日月爲之無色往往迯避於外官中縶其父母妻子急加追捕鬻賣田園以充購賞暨刺面之後人貟教頭利其家富百端誅剥衣糧不足以自贍須至取於私家或屯戍在邉則更須千里供送祖父財産日銷月鑠以至於盡况其平生所習者惟桑麻耒耜至於甲胄弩槊雖日加教閱不免生疎而又資性戇愚加之畏懦臨敵之際得便即思退走不惟自喪其身兼更拽動大陣自後官中知其無用遂大加沙汰給與公憑放令逐便而惰游已乆不復肯服稼穡之勞兼田産已空無所復歸皆流落凍餒不知所在長老至今言之猶長歎出涕其爲失策較然可知足以爲後来之戒而不足以爲法也今朝廷雖云所籍之民止刺手背農隙之時委州縣召集教閲只在鄉里不令戍邉而民間懲往年之事必大興訛言互相驚擾朝廷號令失信前後已多雖州縣之吏徧至民家面加曉諭亦終不肯信逃亡避匿刑獄必繁怨嗟之聲周徧一方足以動揺羣心感傷和氣若使分毫有益於國亦無所顧此有害無益顯然明白近在目前設使教習得成一旦諒祚大舉入寇邉臣不能捍禦而使之深入三輔東過潼闗乃欲驅此烏合村民以拒之不亦難乎此適足以取戎狄之笑而已伏望陛下軫念生民深察得失其刺義勇事早賜寢罷取進止乞罷刺陜西義勇第三劄子臣累日前方聞朝廷有指揮令陜西路揀鄉村百姓充義勇臣即時有奏劄子言其非便昨日又上殿具劄子面有敷陳奉聖㫖令送中書樞宻院商量臣到中書樞宻院方知此事擬議已久勅下本路已近旬日臣耳目疎淺聞之後時不能先事進言是臣之罪然臣聞之易曰不逺復無祗悔元吉説命曰無恥過作非今雖勅命已下若追而止之猶勝於遂行不顧不可避反汗之嫌而蹈迷復之凶也百姓一經刺手則終身羈縻不得左右人情畏憚不言可知康定年中㨂差鄉弓手時元不刺手後至慶厯年中刺充保捷之時冨有之家猶得多用錢財雇召壯健之人充替今一切皆刺其手則是十餘萬無罪之人永充軍籍不得復爲平民其爲害民尤甚於康定之時也臣竊料即今陜西之民已狼狽驚擾不聊生矣若朝廷晏然坐而視之曽不憫恤使赤子嗷嗷何所告訴爲民父母者固當如是乎古者國有大事謀及卿士謀及庶人謀及卜筮今籍一路之民以爲兵可謂大事矣而兩府之外朝士大夫無一人知者一旦勅書既下急如星火嚴如雷霆誰暇問其端倪况敢言其非也臣以備位諫官既聞之後不可畏避死亡不爲陛下力言之若又棄忽其言不爲改更則是今後朝廷號令有過誤者終不可復救也如此則恐非國家之福臣愚伏望聖慈速降指揮下陜西路其義勇且未得㨂刺别聴候朝廷指揮然後慱延卿士大夫更熟議其可否果然有利於國無害於民徐復行之何晩之有取進止乞罷刺陜西義勇第四劄子臣近日已三次上言乞罷刺陜西義勇事未䝉朝廷采納臣欲止而不言則不忍坐視一路之民横受困苦而自圖一身之安又恐遷延日久則無及於事是以不敢避斧鉞之誅繼上封奏爲陛下極陳其害臣比日以来熟思此事誠於民有世世之害於國無分毫之利何謂於民有世世之害臣竊見河北陜西河東自景祐以前本無義勇凡州縣諸般色役並是上等有物力户人支當其鄉村下等人户除二税之外更無大段差徭自非大饑之嵗則温衣飽食父子兄弟熈熈相樂自寳元慶厯之間朝廷因趙元昊叛亂契丹壓境遂於三路鄉村人户之中不問貧富等第但有三丁之家即揀一丁充鄉弓手及强壯其時西邊事宜尤急尋將陜西一路鄉弓手盡刺面充保捷指揮正軍其河北河東事冝稍緩遂只將鄉弓手及強壯刺手背充義勇自此三路之人始騷然愁苦矣其河北河東之民比於陜西雖免離家去鄉戍邉死敵之患然一刺手背之後則終身拘綴或欲逺出幹事糴賤販貴或遇水旱㓙荒欲分房逐熟或典賣田産欲浮遊作客皆慮官中非時㸃集不敢東西又當差㸃之際州縣之吏寜無乞覔教閲之時人貟教頭寜無斂掠是於常時色役之外添此一種科徭也若果如議者之言無害於民則民皆樂從官中何必更刺其手背以防逃竄乎以此觀之義勇爲害於兩路之民已可知矣况陜西於慶厯年中民家已各喪一丁刺充保捷流落不歸今又取其次丁刺充義勇不亦甚乎朝廷近年分命朝臣徧往諸路减省諸般色役至於弓手壯丁觧子驛子之類州縣所不可闕者亦皆减放謂之寛恤民力今乃無故一旦刺一路之民十有餘萬以爲義勇何朝廷愛之於前而忍之於後憫之於小而忘之於大乎且今日既籍之後則州縣義勇皆有常數每有逃亡病死州縣必隨而補之則義勇之身既羈縻以至老死而子孫若有進丁又不免刺爲義勇是使陜西之民子子孫孫常有三分之一爲兵也臣故曰於民有世世之害也何謂於國無分毫之利太祖太宗之時未有義勇至於正軍亦不及今日十分之一然而太祖取荆湖平西川下廣南克江南太宗取兩浙克河東一統天下若振槁拾遺此豈義勇之力也哉盖由民政修治軍令嚴肅將帥得人士卒精練故也康定慶厯之間趙元昊負累朝厚恩無故逆命侮慢不恭侵犯邊境朝廷竭天下之力以奉邉鄙劉平任福葛懐敏之師相繼覆没士卒死者動以萬數正軍不足益以鄉兵外府不足繼以内帑民力困極財物殫盡終不能出一旅之衆渉區脱之地以討其罪而不免含垢忍恥假以寵名誘以重賂僅得無事當是之時三路新置鄉兵共數十萬何嘗得一人之力乎以此觀之義勇無用亦可知矣賈誼有言曰前車覆後車戒康定慶厯禦戎之䇿國家當永以爲戒今乃一一檢當時體例而行之是後車又將覆也有難臣者必曰古之兵皆出民間豈民兵可用於古而不可用於今乎臣則對曰三代之時用井田之法以出士卒車馬居則爲比閭族黨州鄉行則爲伍兩卒旅師軍爲之長者皆卿大夫也唐初府兵各有營府不屬州縣有將軍郎將折衝果毅以相統攝是以令下之日數萬之衆可以立具無敢逃亡避匿者以其綱紀素備故也今鄉兵則不然雖有軍員節級之名皆其郷黨族姻平居相與拍肩把袂飲慱鬬毆之人非如正軍有階級上下之嚴也若安寜無事之時州縣聚集教閲則亦有行陣旗鼓闗弓彍弩坐作呌噪真如可以戰敵者彼若聞敵寇大入邉兵已敗邉城不守敵騎殺掠蹂踐巻地而米則莫不迎望風聲奔波迸散其軍貟節級將鳥伏䑕竄自救之不暇豈有一人能爲縣官率士卒而待冦乎以臣觀之此正如兒戯而已安有爲國家計驚搔一路之民使之破家失業而爲兒戯之事乎臣故曰於國無分毫之利也凡此利害之明有如白黒伏望陛下不以臣愚賤而忽其言少留聴察其刺陜西義勇事早賜寢罷則一方幸甚取進止乞罷刺陜西義勇第五上殿劄子臣近者已曽四次上言乞罷刺陜西義勇别白利害極其懇惻終未䝉省察方今陜西一路之民小大老㓜如在湯火之中而朝廷晏然略無拯救之意臣職在箴諫安可塞黙不敢廣有援引以煩聖聴請以目前顯驗言之今建議以義勇爲便者必曰即日河東河北不用衣粮而得勝兵數十萬皆教閲精熟可以戰敵又兵出民間合於古制臣請言其不然彼數十萬者虚數也教閲精熟者外貎也兵出民間者名與古同而實異也何以言之河北河東州縣既承朝廷之意各㨂刺義勇只求數多據帳籍言之誠有數十萬之衆矣若萬一敵寇在近官中急欲㸃集之時則一人不可見矣豈非虛數乎平常無事州縣教閲之日觀者但見其旗號鮮明鉦鼓備具行列有序進退應節即歎美以爲真可戰敵殊不知彼皆隊舞聚戲之類若聞胡寇之来則瓦解星散不知所之矣豈非外貌乎古者兵出民間民耕桑之所得皆以衣食其家故處則富足出則精鋭今既賦斂農民之粟帛以贍正軍又籍農民之身以爲兵是一家獨任二家之事也如此民之財力安得不屈豈非名與古同而實異乎以臣愚見河北河東已刺之民猶當遣放况陜西未刺之民乎陛下欲知利害之實何不試召建議者而問之曰河北河東自置義勇以来敵寇凡幾次深入至腹内州軍用義勇拒戰而敵寇敗退今既有義勇之後三路正軍皆可廢而不用乎若果然敵寇曽深入因得義勇之力而敗退今来刺義勇之後正軍皆可廢罷此乃萬世之長策也願陛下行之勿疑若自置義勇以来未嘗經陣敵使用今来雖有義勇正軍亦未可廢罷則何忍以十餘萬無罪之赤子盡刺以爲無用之兵乎天生聖君以爲民也民今如此陛下豈可全不爲之動心乎臣之所言盡於此矣陛下若以爲稍有可采即乞早降指揮下陜西令罷刺義勇以救一方之民若以爲勅命已行不肯遽改即乞且免刺手背候邉事寜息依舊放散則民雖有一時搔擾之勞猶免終身羈縻之苦若以臣所言皆孟浪迂闊不可施行則臣之智識愚闇無以勉强變更不可久汙諫諍之列伏望聖慈特賜降黜别擇賢才而代之取進止乞罷刺陜西義勇第六劄子臣昨日上殿爲言乞罷刺陜西義勇事陛下宣諭臣以爲命令已行臣退而思之不勝鬰悒終夕不寐深痛陛下此言之失臣案周易復之初九曰不逺復無祗悔元吉祗大也盖言人誰無過雖聖賢亦不能免然聖賢皆能不逺而復故雖有小悔不至於大而終保元吉也其上六日迷復㓙有災眚用行師終有大敗以其國君凶至於十年不克征盖言失之已逺迷而不復無事不凶而人君尤甚故孔子賛之曰迷復之㓙反君道也自古明聖之君聞一善言而立爲之變更號令者多矣不可悉數惟近嵗大臣自知思慮不熟號令已失無以抑奪臺諫之言則云命令已行難以更改此乃遂非拒諫之辭陛下新臨大政當求善無厭從諫如流之時而亦有此言天下將何望焉且唐室以前諫議大夫拾遺補闕皆中書門下省屬官日與中書令侍中侍於天子之側議論大政苟事有闕失皆得隨時規正今國家凡有大政惟兩府大臣數人相與議論深嚴秘宻外廷之臣無一人知者及詔勅已下然後臺諫之官始得與知或事有未當須至論列又云命令已行難以更改則是國家凡有失政皆不可復救也如此豈惟愚臣一人無用於時諫諍之官皆可廢也以臣所見但當論其事之得失言之是非不當云命令已行不可改也今陜西一路之民小大遑遑正如在湯火之中若忽得朝廷指揮云所有義勇且住㨂刺其已刺手背者並給與公憑放令逐便是得出湯火之中死而復生也其誰不歡呼皷舞感戴聖恩豈有一人云命令已行不當復改邪陛下萬民之父母萬民陛下之赤子豈有父母誤墜其子於井而曰吾已誤矣遂忍不救邪昔舜稱堯之徳曰稽于衆舍已從人仲虺稱湯之徳曰用人惟已改過不吝臣願陛下勿以先入之言爲主虚心平意以察臣淺識五次所言果然爲是爲非若其是歟即公平降指揮罷刺陜西義勇若其非歟即乞如臣前來所奏特賜降黜别擇賢才而代之所有命令已行之言伏望陛下自今永以爲戒不可使天下聞之塞絶善言之路也取進止乞降黜第一狀治平元年十二月五日上右臣近日累曽上言乞罷刺陕西義勇事朝廷以言無可采寢而不行臣性識庸昩不違大體妄以狂瞽煩瀆聖明章奏相繼至於五六終不能少以愚誠感動天聴尸祿曠官孰甚於此臣實無顔尚居諫列伏望聖慈察其無堪早賜降黜乞降黜第二第三第四狀闕乞降黜第五狀右臣近曽四次進狀以言事不當乞賜降黜未䝉朝廷施行今伏見知制誥錢公輔因繳納王疇除樞宻副使詞頭責授滁州團練副使臣竊以公輔所坐止於柅樞宻副使恩命臣曏来所言乃是沮宰相大議公輔宻啟於詔令未出之前臣露章爭執於詔令已行之後公輔奏章止於一上臣凡六次進劄子五次進狀以此校量公輔罪輕㣲臣罪重輕罪猶蒙嚴譴重罪安可不行伏望聖慈詳臣前後所奏比錢公輔更於逺小處責降所貴聖朝刑典行之均壹乞降黜上殿劄子治平二年正月九日上臣近曽五次進狀以言事不當乞賜降黜未蒙朝廷施行陛下之意盖謂臣一言不從遽求引去太爲容易臣之愚心非敢獨爲曏來一事而已臣聞爲士者苟得位於朝必能獻可替否致君堯舜躋民仁夀今臣備位諫職三年有半不能悉心竭忠以補益明主使國家綱紀濅以隳紊百姓困窮衣食日蹙戎狄悖慢軍旅驕惰比於臣未作諫官之時未見有分毫之勝然則臣之不材較然可見豈敢不自愧恥尚竊寵榮伏望聖慈依臣前奏早賜責降取進止傳家集巻三十四欽定四庫全書傳家集巻三十五宋司馬光撰章奏十八言招軍劄子治平二年二月五日上臣近聞朝廷於在京及諸路廣招禁軍其災傷之處又招饑民以充廂軍臣愚以爲國家從來患在兵不精不患不多夫兵少而精則衣糧易供公私充足一人可以當十遇敵必能取勝兵多而不精則衣糧難贍公私困匱十人不足當一遇敵必致敗北此利害之明有如白黑不爲難知也是以太祖皇帝之時天下兵數不及當今十分之一而猶日加選練簡去羸老專取精鋭故能征伐四克混壹區夏自景徳以來中國既以金帛綏懐戎狄不事征討至今六十餘年是宜官有餘積民有餘財而府庫殫竭倉廪空虛水旱小愆流殍滿野其故何哉豈非邊鄙雖安而冗兵益多之所致乎此乃天下所共知非臣一人之私言也慶厯中趙元昊叛西邊用兵朝廷廣加召募應諸州都監監押募及千人者皆特遷一官以此之故天下冗兵愈衆國力愈貧近嵗又累次大揀廂軍以補禁軍之數即目係籍之兵已爲不少矣何苦更復直招禁軍及招饑民以充廂軍臣不知建議之臣曽與不曽計較今日府庫之積以養今日舊有之兵果爲有餘爲不足乎此蓋邊鄙之臣庸愚怯懦無他材畧但求添兵在朝之臣又恐所給之兵不副所求他日邊事或有敗闕歸咎於已是以不顧國家之匱乏只知召募取其虛數不論疲軟無所他用此羣臣容身保位苟且目前之術非爲朝廷深謀遠慮經乆之畫也諺曰多求不如省費此言雖小可以喻大今以十口之家衣食僅足一旦頓増五口必不能贍若不顧囷中之粟笥中之帛所餘幾何而惟冗口是貪能無窮匱乎國家之勢何以異此羣臣既不能爲陛下忠謀陛下又不自以爲憂則誰當憂之臣恐邊臣之請兵無窮朝廷之募兵無已倉庫之粟帛有限百姓之膏血有涯不知國家長此沉瘵何時當瘳乎臣又聞即目災傷之處軍無見糧煑薄粥以飼饑民猶不能給况刺以爲兵將以何物養之終身乎且畎畝農民止因一時饑饉故流移就食若將來豐稔則各思復業今既刺以爲兵是使之終身失業也於官於民皆爲非便謀策之失孰甚於此臣願陛下斷自聖志速降指揮應在京及諸路並且罷招禁軍但選擇將帥使之訓練舊有之兵以備禦四夷不患不足其災傷之處州縣不得妄招饑民以充廂軍但據所有斛斗救接農民俟向去稍豐使各復舊業則天下幸甚臣自陛下踐阼以來不自知其狂愚見朝廷政令有未便差除有未當屢獻瞽言浼瀆天聰陛下未嘗爲之變一政令改一差除如臣者亦可以不言矣然猶區區獻言不已者誠耻居位而不言不耻多言而見厭也取進止言錢糧上殿劄子治平二年四月十九日上臣近䝉恩給假至陜州焚黄竊見縁路諸州倉庫錢糧例皆闕絶其官吏軍人料錢月糧並須遂旋收拾方能支給竊料其餘諸州臣不到處亦多如此臣聞國無三年之蓄曰國非其國今窘竭如此而朝廷曽不以爲憂若不幸有水旱蝗蝻方數千里如明道康定之時加之邊鄙有急興兵動衆不知朝廷何以待之臣伏見陳許潁亳等州止因去秋一次水災遂致骨肉相食積尸滿野此非今日官吏之罪乃曏時官吏之罪也何則曏時豐稔之嵗其人但務偷安不爲遠慮粟麥至賤不能儲蓄及至凶荒之際官私俱竭上下狼狽何由相救雖使桑羊劉晏復生亦無如之何也今春幸而得雨麥田有望朝廷已置饑饉之事於度外不復以儲蓄爲意矣萬一天下州縣復有災傷則何以異於陳許潁亳之民也若饑饉相繼盗賊必興此豈可不早爲之深慮乎臣愚伏望陛下於天下錢榖常留聖心特降詔書明諭中外應文武臣僚有熟知天下錢榖利害能使倉庫充實又不殘民害物者並許上書自言陛下勿以其人官職之踈賤文辭之鄙惡一一畧加省覽擇其理道稍長者皆賜召對從容訪問以方今食貨俱乏公私皆困何故而然如何擘畫可使上下豐足若其言無可取者則罷遣而已有可取者即爲之施行仍記録其姓名置於左右然後選其材幹出羣者以爲轉運使副判官及三司使副判官仍毎至年終令三司撮計在京府界及十八路錢帛糧草見在都數聞奏以之比較去年終見在都數若増羨稍多即令勘㑹如别無姦巧欺謾及非理賦斂而致増羨其當職之人宜量行褒賞累經褒賞者即别加進用若减耗稍多即令詰問如别無大故災傷及添屯軍馬而致减耗其當職之人宜量行責罰累經責罰者即末從黜廢誠能如此行之不懈數年之後可使天下倉皆有餘粟庫皆有餘財雖有水旱蝗蝻之災及邊鄙有急皆不足憂也言西邊上殿劄子治平二年上臣竊見近年以來趙諒祚雖外遣使人稱臣奉貢而内蓄姦謀窺伺邊境隂以官爵金帛招誘中國不逞之人及熟户蕃部聞其亡命叛去及潛與交通者已爲不少而朝廷不能一一盡知也其熟户蕃部有違拒不從者諒祚輒發兵馬公行殺掠弓箭手有住在縁邊者諒祚皆廹逐使入内地將帥之臣但坐而視之不能救援遂使其餘熟户皆畏憚兇威怨憤中國人人各有離叛之心及朝廷遣使齎詔責問則諒祚拒而不納縱有所答皆侮慢欺謾之辭朝廷亦隠忍含容不復致詰諒祚又數揚虚聲以驚動邊鄙而將帥之臣率多懦怯别無才謀以折衝禦侮只知多聚兵馬以自衛其身一路有警則三路皆聳盡抽腹内州軍下畨兵士置在麾下使之虚食糧草數月之後寂無影響然後遣還未及休息忽聞有警又復抽去如此徃還疲於道路訖無一事曽有施爲臣雖愚駑不習邊事竊以私意料之諒祚所以依舊遣使稱臣奉貢者一則利於毎嵗所賜金帛二十餘萬二則利於入京興販貿易三則欲使朝廷不爲之備也其所以招誘不逞之人者欲以采訪中國虚實之事平居則用爲謀主入冦則用爲鄉導也其所以誘脅熟户廹逐弓箭手者其意以爲東方客車皆不足畏惟熟户弓箭手生長極邊勇悍善鬭若先事翦去則邊人失其所恃入冦之時可以通行無礙也其所以數揚虛聲驚動邊鄙者欲使中國之兵疲於奔命耗散儲蓄公私貧困既而邊吏習以爲常不復設備然後乘虛入㓂也凡此諸事若不早爲之慮使姦謀得成竊恐其爲國家之患未可量也臣謂朝廷宜宵衣旰食以爲深憂而但見其遣使奉貢即以爲臣節未虧得其侮玩之語以爲恭順得其欺謾之語以爲誠實蓋朝廷非不知其本心且欲幸其未發止求目前之暫安不顧異時之深患臣日夜思之不勝憤悒何戎狄爲謀之深而中國慮事之淺也臣愚伏望陛下於邊鄙之事常留聖心特降詔書明諭中外應文武臣僚有乆歴邊任或曽經戰陣知軍中利害及戎狄情僞者並許上書自言陛下勿以其人官職之踈賤及文辭之鄙惡一一畧加省覽擇其理道稍長者皆賜召對從容詢問以即目治兵禦戎之䇿何得何失如何處置即得其宜若其言無可取者則罷遣而已有可取者即爲施行仍記録其姓名置於左右然後選其中勇畧殊衆者擢爲將帥若能稱職有功則勸之以爵賞昏懦敗事則威之以刑誅加以選練士卒留精去冗申明階級之法抑揚驕惰之氣誠能如此行之不懈數年之後俟將帥得人士卒用命然後惟陛下之所欲爲雖北取幽薊西收銀夏恢復漢唐之疆土亦不足爲難况但守今日之封畧制戎狄之侵侮豈不沛然有餘裕哉取進止論修造劄子治平二年五月十一日上臣伏見近日以來修造稍多只大内中自及九百餘間以至皇城諸門并四邊行廊及南薰門之類皆非朝夕之所急無不重修者役人極衆費財不少此蓋陛下纘極之初禁廷之中誠有破漏不可居者陛下畧命整葺理亦宜然而左右之臣便謂陛下好興土木之功遂廣有經度雖不至損壊之處亦毁拆重修務以壯麗互相誇勝外以希㫖求知内以營私規利萬一陛下更因此賞之則營造之端猝無窮已國財必竭民力必殫臣竊惟陛下新臨天下惠澤未孚於民而以好治宫室流聞四方非所以光益聖徳也修造勞費不可勝數臣請且言諸州買木一事擾民甚多衙前皆厚有産業之人毎遇押竹木綱散失陪填無有不破家者先帝躬履節儉宫室苑囿無有増飾故諸場材木皆有羨餘屢因赦恩放免買木以寛民力自頃修造倍多諸場材木漸就减耗有司於外州科買百端營致尚恐不足而工匠用之賤如糞土者漢文帝惜十家之産罷露臺而不作今諸場前後所積竹木何啻十家之産陛下至仁若察其所從來得不爲之愛惜乎况即今在京倉庫踈漏甚多皆以上件數處興功占使匠人物料未暇修葺致粟帛之類大有損敗古者將營宫室宗廟爲先廏庫爲次居室爲後今之所修緩急先後無乃未得其宜乎又皇子生而富貴年未及冠所宜示以樸素慎其所習今聞所修三位規摹侈大又復過於祖宗之時皇子所居漢明帝曰我子何得比先帝子此恐非所以納之於義方也臣愚伏望陛下特降聖㫖應大内裏外舍屋即目不至大段損壊之處及不至要切如南薫門之類並罷興修其皇子位只因舊屋夾截修整早令畢工不得過爲宏壯且令那减匠人物料修倉庫之損壊者所有諸處監修之官自是本職更不與减年磨勘及轉官酬賞以塞泰侈之源使天下皆知陛下去奢從儉仁民愛物不亦美乎取進止爲宰相韓琦等議濮安懿王合行典禮狀伏以出於天性之謂親縁於人情之謂禮雖以義制事因時適宜而親必主於恩禮不忘其本此古今不易之常道也伏惟皇帝陛下奮乾之健乘離之明擁天地神靈之休荷宗廟社稷之重即位以來仁施澤浹九族既睦萬國交歡而濮安懿王徳盛位隆宜有尊禮陛下受命先帝躬承聖統顧以大義後其私恩慎之重之事不輕發臣等忝備宰弼實聞國論謂當考古約禮因宜稱情使有以隆恩而廣愛庶幾上以彰孝治下以厚民風臣等伏請下有司議濮安懿王及譙國太夫人王氏襄國太夫人韓氏仙遊縣君任氏合行典禮詳處其當以時施行與翰林學士王珪等議濮安懿王典禮狀右臣等謹按儀禮喪服爲人後者傳曰何以三年也受重者必以尊服服之爲所後者之祖父母妻妻之父母昆弟昆弟之子若子若子者言皆如親子也又爲人後者爲其父母傳曰何以期也不貳斬也特重於大宗降其小宗也又爲人後者爲其昆弟傳曰何以大功也爲人後者降其昆弟也以此觀之爲人後者爲之子不敢復顧私親聖人制禮尊無二上若恭愛之心分施於彼則不得專壹於此故也是以秦漢以來帝王有自旁支入承大統者或推尊父母以爲帝后皆見非當時取譏後世臣等不敢引以爲聖朝法况前代入繼者多宫車晏駕之後援立之䇿或出母后或出臣下非如仁宗皇帝年齡未衰深惟宗廟之重祗承天地之意於宗室衆多之中簡㧞聖明授以大業陛下親爲先帝之子然後繼體承祧光有天下濮安懿王雖於陛下有天性之親顧復之恩然陛下所以負扆端冕富有四海子子孫孫萬世相承者皆先帝之徳也臣等愚淺不達古今竊以謂今日所以崇奉濮安懿王典禮宜一准先朝封贈期親尊屬故事髙官大國極其尊榮譙國太夫人襄國太夫人仙遊縣君亦改封太國太夫人考之古今實爲宜稱言孫長卿劄子治平二年五月十二日上臣伏聞前環慶路經畧使孫長卿加集賢院學士充河東路都轉運使長卿前在環慶不曉邊事舉措煩苛致熟户蕃部叛亡幾盡道路之人無不知之臣謂朝廷宜嚴加譴謫以儆羣帥不意今日更褒以寵名授以重任外廷聞之無不駭笑如此何以使羣臣舉職邊鄙獲安伏望聖慈速改前命數其無狀於逺小處責降庶今後封疆之臣稍有所畏取進止言孫長卿第二劄子臣近言前環慶路經畧使孫長卿守邊無狀宜加譴謫不當更加集賢院學士充河東路都轉運使不䝉朝廷省察臣竊見陛下近者面諭執政以中外臣僚多不修職業令降詔書嚴加戒諭此誠致治之本然臣愚以爲言之不如行之若言而不行徒使號令玩瀆傷威毁信不若不言之爲愈也長卿本以錢榖常才驟䝉朝廷㧞擢數年之中官爲丞郎位爲元帥智力淺薄用過其分不曉軍政不達蕃情處事煩碎衆心不附是致熟户蕃部各思離叛受趙諒祚誘脅去者極多而長卿掩蔽欺謾不一一聞奏慶厯中元昊背誕環慶所以獨不被兵者以熟户盛壯爲之蕃蔽也今因長卿失於撫御散亡殆盡居官如此可謂失職而朝廷更加寵秩委之重任賞罰如此雖復日下詔書又何益也臣愚伏望陛下黜不職之人當以長卿爲始則羣臣無不悚慄不令而行矣取進止言北邊上殿劄子冶平二年六月二十八日上臣聞明主謀事於始而慮患於㣲是以用力不勞而收功甚大竊見國家所以御北邊之道似未盡其宜當其安靖附順之時則好與之計校末節爭競細故及其桀傲暴横之後則又從而姑息不能誅討是使冦敵益有輕我國之心皆厭於柔服而樂爲背叛近者西戎之禍生於髙宜北邊之隙起於趙滋而朝廷至今終未省寤猶以二人所爲爲是而以循理守分者爲非是以邊鄙武臣皆鋭意生事或以開展荒棄之地十數里爲功勞或以殺畧老弱之敵三五人爲勇敢朝廷稱其材能驟加擢用既而敵心忿恨遂來報復屠翦熟户鈔劫邊民所喪失者動以千計而朝廷但知驚駭増兵聚糧其致冦之人既不追究而守邊之臣亦無譴責如此而望戎狄賔服疆埸無虞是猶添薪扇火而求湯之不沸也臣愚竊惟真宗皇帝親與契丹約爲兄弟仁宗皇帝赦趙元昊背叛之罪册爲國主嵗捐百萬之財分遺二敵豈樂此而爲之哉誠以屈已之愧小愛民之仁大故也今陛下嗣已成之業守既安之基而執事之臣數以爭桑之小忿不思灌𤓰之大計使邊鄙之患紛紛不息臣竊爲陛下惜之近者聞契丹之民有於界河捕魚及於白溝之南翦伐柳栽者此乃邊鄙小事何足介意而朝廷以前知雄州李中祐不能禁禦爲不材别選州將以代之臣恐新將之至必以中祐爲戒而以趙滋爲法妄殺敵民則戰鬭之端徃來無窮矣况今民力彫弊倉庫虚竭將帥乏人士卒不練夏國既有憤怨屢求侵冦禍胎已成若又加以契丹失歡臣恐國力未易支也伏望陛下嚴戒北邊將吏若契丹不循常例小小相侵如漁船柳栽之類止可以文牒整㑹道理曉諭使其官司自行禁約不可輕以矢刄相加若再三曉諭不聽則聞於朝廷雖專遣使臣至其王庭與之辯論曲直亦無傷也若又不聽則莫若博求賢才増修徳政俟公私富足士馬精强然後奉辭以討之可以驅穹廬於幕北復漢唐之土宇與其爭漁柳之勝負不亦逺哉取進止傳家集巻三十五欽定四庫全書傳家集巻三十六宋司馬光撰章奏十九上皇帝䟽治平二年八月十一日上月日具位臣光謹昧死再拜上䟽皇帝陛下臣聞書曰面稽天若詩曰文王陟降在帝左右蓋言王者爲天之子不敢不朝夕小心祗畏其命如在其上如在其左右也是故洪範九疇以五行爲本言王者當祗順五行之性内謹五事以治身外修八政以治國正五紀以承天序折衷於皇極之道登用三徳之人又参合以龜筮之謀察風雨寒燠之來以省得失知休咎導迎五福避逺六極此萬世不易之道也臣不勝狂愚忘生觸死伏見陛下即位以來災異甚衆日有黒子江淮之水或溢或涸去夏霖雨渉秋不止京畿東南十有餘州廬舍沉於深淵浮苴棲於木末老弱流離捐瘠道路妻兒之價賤於犬豕許潁之間親戚相食積尸成丘既而歴冬無雪煖氣如春草木早榮繼以黒風今夏癘疫大作彌漫數千里病者比屋喪車交路至秋幸而豐熟百姓欣然庶獲蘇息未及收穫而暴雨大至一晝之間川澤皆溢溝渠逆流原隰丘陵悉爲洪波一苗半穗蕩無孑遺都城之内道路乘桴城闕摧圯官府倉廪軍壘民居覆沒殆盡死於壓溺者不可勝紀耆耋之人皆言耳目所記未嘗暏聞此乃曠古之極異非常之大災陛下安得不側身恐懼思其所以致此之咎乎臣性愚學淺不足以窺測天意竊以書曰天聰明自我民聰明天明畏自我民明威又曰天視自我民視天聽自我民聽然則災異之來不在於佗苟人心和悦則天道無不順矣詩曰亹亹文王令聞不已又曰如珪如璋令聞令望古之聖王未有不先其令名而能行其政於天下者也臣伏見陛下踐阼之初上自宰輔次及朝臣下逮閭閻細民士伍厮養無不翕然同辭稱頌聖徳如出一口皆云方今皇族奉朝謁者八百餘人陛下仁孝聰明爲之首冠知人疾苦識其情僞節儉愛物剛果能斷既美先帝知人之明又慶已身逄時之幸涕泣共談悲喜相半臣愚以爲昔漢惠帝無子而得文帝仁儉謙恭百姓富饒幾致刑措昭帝無子而得宣帝勤惠明斷吏良民樂號稱中興然則國無嗣子而旁親入繼未必不爲天意福祐社稷而光啟聖賢也私心自幸又甚於衆人俄而聖躬有疾上下之人思殺身爲牲粉骨爲藥庶祈早瘳以觀聖政不意數月之後道塗之議稍異於前頗有謗言不專稱美逮乎周嵗之外則頌者益寡謗者益多臣竊伏於闕門之外日聞衆論不勝悵恨痛心疾首晝而忘食夕而忘寢爲陛下深思其故終不能明意者陛下於舉動循守之間萬一有所未思乎敢以愚慮言之蓋有三焉惟陛下寛其罪使得畢其辭竊以皇太后仁明之徳爰自先朝布聞四方加之保育聖躬在於襁褓陛下入承大統不可謂全非皇太后之力當陛下初得疾之時外間傳言皇太后於先帝梓宫之前爲陛下叩頭祈請額爲之傷如此豈可謂無慈愛之心於陛下哉不幸爲䜛賊之人交相離間遂使兩宫之情介然有隙就使皇太后有不慈於陛下陛下爲人之子安可校量曲直遂生忿恨而於愛恭之心有所不備乎傳曰大徳滅小怨先帝擢陛下於衆人之中自防禦使升爲天子唯以一后數公主屬於陛下而梓宫在殯已失皇太后之歡心長公主數人皆屛居閒宫希曽省見臣請以小喻大設有閭里之民家有一妻數女及有數畆之田一金之産老而無子養同宗之子以爲後其人既沒其子得田産而有之遂踈母棄妺使之愁憤怨歎則鄰里鄉黨之人謂其子爲何如人哉以匹夫而爲此行猶見貶於鄉里况以天子之尊爲四海所瞻仰哉此陛下所以失人心之始也先帝天性寛仁重違物意晩年嬰疾厭倦萬幾遂以天下之事悉委之兩府兩府或見有所偏或意有所私取捨黜陟未必皆當又巧設倖門進㧞所愛超資越級欺罔衆人抑壓孤寒無所伸愬及陛下即位皆謂必能奮發乾剛昭明君徳收取威福復還王室進賢退愚賞善罰惡使海内廓然立見太平而陛下益事謙遜深自晦匿凡百奏請不肯與奪動循舊例不顧事情謹於細務忽於大體知人之賢不能舉知人不肖不能去知事之非不能改知事之是不能從大臣專權甚於先朝率意差除無所顧忌或非材而驟進或有罪而見寛此天下所以重失望也臣聞書曰木從繩則正后從諫則聖是以堯稽於衆舍已從人舜好問而好察邇言禹聞善言則拜湯用人惟已改過不吝此四聖人者豈其才智之不足哉然猶孜孜汲汲下詢愚賤之人者蓋以四海之廣萬幾之衆非一人所能獨知必資天下之耳目思慮然後能曲盡其理也陛下聖質雖羙亦當取法於堯舜禹湯而即政以來或意有所見執之不移如堅守嚴城禦敵外冦使羣臣之言皆無自而入殆非所以納百川而成巨海也孔子曰人之言曰予無樂乎爲君唯其言而莫予違也如其善而莫之違也不亦善乎如不善而莫之違也不幾乎一言而喪邦乎是故明君之於聼納無彼無我無親無踈無先無後唯其是而已矣若重我所有而輕彼所陳信其所親而疑其所賤主先入之言而拒後來之議則雖有是者亦不可得而見矣夫人心之所好者視醜以爲羙所惡者視善以爲惡苟能以平心察之則是非易見矣書曰有言逆于汝心必求諸道有言遜于汝志必求諸非道若必待合於聖意則悦而從之不合則怒而棄之臣恐䜛諂日進方正日踈殆非所以増社稷之福也又國家置臺諫之官爲天子耳目防大臣壅蔽朝廷政事皆大臣相與裁定然後施行而臺諫或以異議干之陛下當自以聖意察其是非可行則行可止則止今乃復付之大臣彼安肯以已之所行爲非而以佗人所言爲是乎此乃陛下所以獨取拒諫之名而大臣坐得專權之利者也夫以君相之重何啻泰山賤臣之輕何啻鷄卵乃欲相與校其勝負臣固知其不敵矣是以四方懐忠之士願效區區者皆望風不進結舌沮氣此天下所以又失望也凡此三者在列之臣皆知其不可而上畏嚴誅下避怨怒莫敢以此極言聞於陛下使海内憤欝之氣積而不發宜其有以感動天地之和矣臣聞天意保佑王者故爲之下災異以譴告之若王者恐懼修省則非徒免一時之害又將有福禄隨之商之太戊武丁周之成宣是也若傲忽不顧非徒爲害於一時又將有危亡之禍漢之成哀桓靈是也今災異之來意者皇天亦將保佑陛下以成商周之美乎臣願陛下上稽天意下順人心於此三者皆留聖念奉事皇太后愈加孝謹務得驩心諸長公主時加存撫無令失所總挈大柄勿以假人選用英俊循名責實賞功罰罪捨小取大剗塞弊倖一新大政延納讜言虛心從善皆行之以至誠非特爲空言而已夫至誠可以動金石而况人乎不誠不足以感匹夫而况天乎詩云無曰髙髙在上陟降厥士日監在兹天雖至髙視聽甚邇人之所爲發於中心則天已知之固不待見其容貌形於聲音也陛下果能盡誠於此則聖徳日新令名四達人心既悦天道自和百榖蕃昌嘉瑞並至蠻夷率服福流子孫矣臣自知不才無補朝廷然不敢遂自塞嘿復有所陳惟陛下裁察臣光昧死再拜上䟽乞節用上殿劄子治平二年八月十四日上臣竊見國家公私窮窘固非一日今兹復遇大災畿内秋田蕩無孑遺倉廪儲蓄率多敗壊府庫錢帛散用將盡必恐今冬饑饉甚於去年軍民嗷嗷無以賑救經費不足重以郊禮此乃國用危急之時不可不早以爲憂今取之於内帑則内帑已虛收之於外方則外方已盡斂之於下民則下民已竭不知朝廷將何以爲計臣愚以爲若非陛下側身克已痛自節約則無以應答天意感慰民心使昏墊者忘其悲愁餒死者無所怨嗟也臣聞節用之道必自近始伏望上自乘輿服御之物下至潁王公主婚嫁之具悉加裁損務從儉薄勿信主者以舊例爲言出六宫冗食之人使之從便罷後苑文思院所造滛巧服玩止諸處不急之役然後命有司考求在外凡百浮費之事皆一切除去羣臣非有顯然功效益國利民者勿復濫加賞賜將來南郊自非犧牲玉帛供神之物其餘青城儀仗之類止於奉車駕備外飾者亦令有司與禮官同共參詳减省臣聞國有凶荒則殺禮事天者貴於内誠而賤外物是故噐用陶匏席用槀秸况於青城儀仗之類何爲不可减乎凡此數者唯在聖意斷而行之固不可與庸俗之人執文泥例者謀之也取進止乞令朝臣轉對劄子臣竊見祖宗之時累曽令朝臣轉對或遇災異更廣求直言真宗咸平景徳之間詢訪尤切其詔書云渉詆訐者固可優容乏詞藻者許其直致是時羣臣上書言事者日不下百餘封每戒敕閤門令疾速進入詔樞宻直學士馮拯陳堯叟令詳定以聞所以然者不惟考時政之得失亦以觀羣臣之能否也是故太宗時得冦凖真宗時得張知白皆因上書言事驟加擢用後爲宰相俱著名迹景徳元年六月内出朝士邊肅等二十四人姓名令於崇政殿引對在外者驛召赴闕其後稍稍進用多爲名臣此皆近事易法者陛下踐阼未乆羣臣能否恐未徧知欲乞依祖宗舊制毎遇内殿起居日常令朝臣兩人轉對其餘在京及外處臣僚有欲上書言事者所在官司皆不得壅滯彼必欣然承命各竭所懐然後陛下親加省覽必有所得若上書者稍多陛下不能一一徧觀即乞擇近臣識慮明達用心公正者二人先次看詳但求理道切當不取文辭華羙分爲數等各以貼黄節出事宜置之於前然後奏御陛下更以聖意擇其善者特令引對靣加詢訪若實有可采其所言之事即爲施行仍於禁中籍記姓名毎遇有重難公事試委之幹辦後果有功效乃加進用如此則天下之才盡在目前可以噐使雖堯舜之世嘉言罔攸伏野無遺賢亦不是過也不然若但循故事止作虚名所上之書未必省覽雖復省覽亦無施設則無益於事不如不爲也取進止乞不受尊號劄子治平二年九月五日上由是羣臣五上表終不允臣聞謙徳之羙尊而益光施之神人無不悦順竊見陛下將有事于南郊羣臣循襲故事請上尊號以陛下叡智聰明徽柔懿恭享兹鴻名云何不可正以屬者暴雨爲災五稼漂沒編户失業吁嗟之聲盈於道路迄今未息陛下當此之際正宜深自抑損以承答天譴慰釋衆心况尊號非古近出有唐陛下受而有之不足以褒大聖功推而不居足以發揮盛徳所有羣臣上尊號表伏乞陛下拒而勿受仍令更不得上表此亦區區㣲誠欲禆益萬分之一也取進止言濮王典禮劄子治平二年八月十七日上臣聞聖人舉事與衆同欲故能下協人心上順天意洪範曰三人占從二人言蓋國有大疑則决之於衆自上世而然矣臣伏見曏者詔羣臣議濮安懿王合行典禮翰林學士王珪等二十餘人皆以爲宜准先朝封贈期親尊屬故事凡兩次㑹議無一人異辭所以然者蓋欲奉濮王以禮輔陛下以義也而政府之意獨欲尊濮王爲皇考巧飾詞説誤惑聖聽不顧先王之大典蔑棄天下之公議使宗室踈屬皆已受封贈而崇奉濮王之禮至今猶未施行此衆人所以怫欝而未爲稱愜者也或者恐陛下未能决知二議是非臣請更爲陛下别白言之政府言儀禮令文五服年月勅皆云爲人後者爲其父母即出繼之子於所繼所生皆稱父母臣按禮法必須指事立文使人曉解令欲言爲人後者爲其父母之服若不謂之父母不知如何立文此乃政府欺罔天下之人謂其皆不識文理也又言漢宣帝光武皆稱其父爲皇考臣按宣帝承昭帝之後以孫繼祖故尊其父爲皇考而不敢尊其祖爲皇祖考以其與昭帝昭穆同故也光武起布衣誅王莽親冒矢石以得天下名爲中興其實創業雖自立七廟猶非太過况但稱皇考其謙損甚矣今陛下親爲仁宗之子以承大業傳曰國無二君家無二尊若復尊濮王爲皇考則置仁宗於何地乎政府若以二帝不加尊號於其父祖引以爲法則可矣若謂皇考之名亦可施於今日則事理不侔矣設使仁宗尚御天下濮王亦萬福當是之時命陛下爲皇子則不知謂濮王爲父爲伯若先帝在則稱伯沒則稱父臣計陛下必不爲此行也以此言之濮王當稱皇伯又何疑矣今舉朝之臣自非狹姦佞之心欲附㑹政府誤惑陛下者皆知濮王稱皇考爲不可則衆志所欲亦可知矣陛下何不試察羣臣之情羣臣誰不知濮王於陛下爲天性至親若希㫖迎合不顧禮義過有尊崇豈不於身有利而無患乎所以區區執此議者但不欲陛下失四海之心受萬世之譏耳以此觀之羣臣之忠佞邪正甚易見矣臣願陛下上稽古典下順衆志以禮崇奉濮安懿王如王珪等所議此亦和天人之一事也取進止乞改郊禮劄子治平二年八月上臣聞古者天子親祀上帝一嵗有九國朝之制天子三嵗一郊仍於其間改用他禮者甚衆豈奉天之意有所倦畧哉蓋事有不得已者也臣竊見國家帑藏素空重以暴雨為災圓丘之側流潦尚深青城之材頗多散失儀仗法物損敗非一今若悉加完葺恐難猝備加以冬寒將近諸營漂沒失其生業屋宇敗壞衣褐俱盡陛下儻欲别加振救亦恐力所不支昔太宗太平興國九年下詔東封尋以火災而止更用郊禮又淳化三年下詔祀圓丘亦以事故更用明年祈穀今災變至大國用不足臣謂不可不小有變更若因兹天譴隨時損益以九月十月之間於大慶殿恭謝天地亦足以展純潔之誠昭寅畏之志減省大費安慰衆心事無便於此者陛下儻以為可願決意早行之辭龍圖閣直學士狀治平二年十月六日上右臣准閣門告報已降勅命除臣依前尚書吏部郎中充龍圖閣直學士散官差遣並依舊者臣塵忝諫職於今累年曾無絲毫裨益盛徳自非聖度含容豈免誅責毎自循省心不遑安曏亦屢曾奏陳乞補外任天聽未允黽勉至今不敢頻有祈請以取煩瀆之罪豈意大恩復加褒進慙懼失措若墜冰炭臣雖庸愚何敢膺受伏望聖慈矜憫曲從所欲許臣只以舊職知河中府或襄虢晉絳一州使竭其駑蹇之分以酬天地生成之施臣不勝大幸所有龍圖閣直學士勅告不敢祇受辭龍圖閣直學士第二狀右臣近曾進狀乞以舊職知河中府或襄虢晉絳一州所有龍圖閣直學士勅告不敢祗受自後未奉指揮者臣伏覩真宗皇帝天禧元年初置諫官詔書節文侯及三年或職業無聞公言罔覩移授散秩仍遣監臨臣自嘉祐六年七月初入諫院供職到今已渉五年智能淺薄志氣庸懦不能闡發大猷補助聖政竊禄偷安虚損歲月譴黜之典已為後時今乃使之叨冒寵名仍留舊任臣猶自愧况於佗人是以瀝懇自陳庶㡬燭察若朝廷矜其愚昧未用天禧詔書特行責降伏乞依臣前奏許以舊職知河中府或襄虢晉絳一州所有除龍圖閣直學士勅告不敢祇受辭龍圖閣直學士第三狀尋得㫖免諫職餘依前降指揮右臣近兩次進狀乞以舊職知河中府或襄虢晉絳一州准中書劄子奉聖㫖不許辭免便令受告勅者臣承乏諫職首尾五年自國朝以來居此官者未有如臣之久臣資性愚戇惟知報國竭盡朴忠與人立敵前後甚衆四海之内觸處相逢常恐異日身及子孫無容足之地以此朝夕冀望解去如處沸鼎之中思寒泉之救但以職當言路不敢無故求出盤桓强留以至今日不意朝廷更加奬擢授以美職仍居舊任既荷寵禄則猝無得去之期禍敗罪誅必不可免是以人用為喜臣獨為憂人用為榮臣獨為懼四顧徊徨無所伏竄進退失圖誠可矜哀儻不訴於君父使之何所依投伏望聖慈憫其久在諫職使得息肩於外依臣前奏則以舊職知河中府或襄虢晉絳一州所有新除龍圖閣直學士勅告更不敢祇受傳家集巻三十六欽定四庫全書傳家集巻三十七宋司馬光撰章奏二十乞經筵訪問上殿劄子治平二年十月上臣以駑朽得侍勸講竊見陛下天性好學孜孜不倦然於經席之中未嘗發言有所詢問臣愚意陛下欲䕶羣臣之短恐於應對之際倉猝失據不能開陳稠人之中受其愧怍此誠聖心仁恕之極羣臣捐軀無以報塞然臣聞易曰君子學以聚之問以辨之論語曰疑思問中庸曰有弗問問之弗知弗措也有弗辯辯之弗明弗措也以此言之學非問辨無由發明今陛下若皆黙而識之不加詢訪雖爲臣等踈淺之幸竊恐無以宣暢經㫖禆助聖性伏望陛下自今講筵或有臣等講解未盡之處乞賜詰問或慮一時記憶不能詳備者許令退歸討論次日别具劄子敷奏庶幾可以輔稽古之志成日新之益取進止乞令選人試經義上殿劄子治平二年十二月十七日上臣竊見國家舊制資䕃出身人初授差遣者並令審官院流内銓試省格詩或賦或論一首或五經墨義十道各從其便其賦論墨義徒有其名無人願試大率皆乞試詩其間甚有假手於人真僞難辨就使自能作詩辭采髙妙施於治民亦無所用不可以此便爲殿最臣欲乞今後應資䕃出身人初授差遣者並委審官院流内銓試孝經論語大義共三道仍令主判臣僚更將所對義面加詢問使之口説若義理精通者特爲一等并所試大義巻子保明聞奏京官與减一任監當選人並與家便差遣合入家便者與先次其義理稍通者依常調不通者且令修學候一周年外再試必須試中方得出官若年四十以上者即聽依舊制只寫家狀讀律如此則公卿大夫子弟皆嚮學知道亦近於先王教胄子之術也取進止論追尊濮安懿王爲安懿皇劄子治平三年正月二十三日上臣聞諸道路未知信否或言朝廷欲追尊濮安懿王爲安懿皇審或如此竊恐不可陛下既爲仁宗後於禮不得復顧私親臣先時言之已熟不敢復煩聖聽今臣不知陛下之意固欲追尊濮王者欲以爲榮耶以爲利耶以爲有益於濮王耶前世帝王以旁支入繼追尊其父爲皇者自漢哀帝爲始其後安帝桓帝靈帝亦爲之哀帝追尊其父定陶恭王爲恭皇今若追尊濮安懿王爲安懿皇是正用哀帝之法也陛下有堯舜禹湯不以爲法而法漢之昏主安足以爲榮乎仁宗恩澤在人淪於骨髓海内之心所以歸附陛下者爲親受仁宗之命爲之子也今陛下既得天下乃加尊號於濮王海内聞之孰不解體又安足以爲利乎夫生育之恩昊天罔極誰能忘之陛下不忘濮王之恩在陛下之中心不在此外飾虛名也孝子愛親則祭之以禮今以非禮之虛名加於濮王而祭之其於濮王果有何益乎三者無一可而陛下行之臣竊惑之此蓋政府一二臣自以曏者建議之失已負天下之重責仍欲文過遂非不顧於陛下之徳有所虧損陛下從而聽之臣竊以爲過矣臣又聞政府之謀欲託以皇太后手書及不稱考而稱親雖復巧飾百端要之爲負先帝之恩虧陛下之義違聖人之禮失海内之心政府之臣祗能自欺安能欺皇天上帝與天下之人乎臣願陛下急罷此議勿使流聞達於四方則天下幸甚臣今雖不爲諫官然曏日已曽奏聞身備近臣遇國家有大得失不敢不言取進止留吕誨等劄子治平三年三日八日上臣聞人主患在不聞其過人臣患在不能盡忠是故忠直敢言之臣國家之至寳也夫以人主之尊下臨羣臣和顔色以求諫重爵賞以勸之羣臣猶畏懦而不敢進又况憚之以威懲之以刑則嘉言何從而至哉竊聞侍御史知雜事吕誨侍御史范純仁監察御史裏行吕大防因言濮王典禮事盡被責降中外聞之無不駭愕臣觀此三人忠亮剛正憂公忘家求諸羣臣罕見其比今一旦以言事太切盡從竄逐臣竊爲朝廷惜之臣聞人君所以安榮者莫大於得人心今陛下徇政府一二人之情違舉朝公議尊崇濮王過於禮制天下之人已知陛下爲仁宗後志意不專悵然失望今又取言事之臣羣軰逐之臣恐累於聖徳所損不細閭里之間腹非竊歎者多矣况純仁大防皆陛下簡㧞於衆人之中任以爲耳目之臣蓋取其忠直非取其阿諛也純仁大防亦欲竭誠盡節以報陛下之知故敢不附政府侃然正論今更以此獲罪則陛下於羣臣之中尚誰親哉若使忠直日退阿諛日進則陛下何以復知臣下之善惡政事之得失如此殆非國家之福也伏望聖慈亟令誨等還臺供職則天下翕然皆歌陛下之聖明雖禹之樂聞善言湯之改過不吝不是過矣不則且爲之别改近地一官亦可以少慰外人之心也取進止留傅堯俞等劄子治平三年三月八日上臣近曽上殿䝉聖恩宣諭以濮王稱親事云此親字官家亦本不欲稱假使只稱濮王與仙遊縣君有何不可臣乃知陛下至公本無過厚於私親之意直爲政府所誤以致外議紛紜必謂旦夕下詔罷去親名其已出臺官當别有除改見在臺官亦優加撫諭使之就職昨日忽聞侍御史知雜事傅堯俞知和州侍御史趙鼎通判淄州趙曕通判汾州中外之人無不驚愕此蓋政府欲閉塞來者使皆不敢言然後得專秉大權逞其胷臆臣竊惟陛下春秋方壯聖徳欽明而今日獨取拒諫之名受孤恩之謗違天下之望失人主之權止於遂政府數人狠心而已不知於陛下有何所利而爲之臣不勝區區深爲陛下痛惜伏望陛下勿復詢於政府特發宸斷召還堯俞等下詔更不稱親如此則可以立使天下憤懣之氣化爲驩欣誹謗之語更爲謳歌矣取進止乞與傅堯俞等同責降上殿劄子治平三年三月十一日上臣昨任諫官日與其餘臺官等同共論列濮王典禮不宜稱尊號及皇考事前後非一臣等䝉恩改龍圖閣直學士臣屢曽辭免乞以舊職知河中府等一處朝廷不許止免諫職今同知諫院傅堯俞侍御史知雜事吕誨侍御史范純仁趙鼎趙瞻監察御史裏行吕大防並已責降若所言濮王事合於典禮則堯俞等不當竄逐若所言非是則臣不宜獨免况同時臺諫官竄逐已盡臣實無顔尚居故位同罪異罰有累公朝伏乞與傅堯俞等一例責降取進止乞責降第二劄子治平三年三月十四日上臣於今月十一日上殿以先任諫官日論列濮王事不當乞賜責降陛下令納下劄子不送中書臣以負罪在身不可苟免若不得臣劄子中書無以進呈行遣遂於次日具録劄子副本繳申中書臣又有此固違聖㫖之罪乞付外施行早賜責降取進止乞責降第三劄子臣於今月十一日上殿乞與傅堯俞等一例責降十三日又曽自陳固違聖㫖之罪至今未奉指揮臣曏於陛下即位之年四月二十七日已曽上䟽豫戒追尊祖父之事及政府請議濮王典禮陛下令候過仁宗大祥别取㫖臣與傅堯俞甫過大祥即詣政府白以爲人後者不得顧私親之議及詔兩制禮官同共詳定之日臣又獨爲衆人手撰奏章若治其罪臣當爲首其吕誨等並係後來論列已䝉譴逐况如臣者豈宜容恕縱陛下至仁特加保庇臣能不愧於心伏望聖慈依臣前奏早賜責降其曏所上䟽竊慮年月稍乆禁中遺失今别録進呈取進止乞責降第四劄子次日中使劉温直宣赴邇英閣上面諭令供職臣自今月十一日以來已曽三次奏乞與傅堯俞等一例責降未䝉開允今又准中書劄子以侍講錢象先奏乞催臣依舊赴經筵供職奉聖㫖令疾速朝叅供職者臣仰荷大恩所宜奔走奉承詔㫖然臣退循義理有所未安是以不敢苟貪榮禄須至重有敷陳臣與傅堯俞等七人同爲臺諫官共論濮王典禮凡堯俞等所坐臣大約皆曽犯之今堯俞等六人已䝉聖恩盡得外補獨臣一人尚留闕下使天下之人皆謂臣始則唱率衆人共爲正論終則顧惜禄位苟免刑章臣雖至愚粗惜名節受此指目何以爲人非徒如是而已又使譏謗上流謂國家行法有所偏頗臣是用晝則忘餐夕則忘寢入則愧朝廷之士出則慙道路之人藐然一身措之無地雖知違犯天威負罪愈重豈敢更復朝叅供職伏望聖慈曲垂矜察依臣前奏早賜責降取進止請不受尊號劄子治平三年十一月十七日上臣聞王者父天母地子育黎元嚴恭鬼神畏懼災異故能安靖國家饗有多福自生民以來不易之道也天雖至髙視聽甚邇朝夕不離王者左右順吉逆凶應若影響此乃詩書所載聖人所言豈可謂之漠然無知而簡忽不顧哉臣伏見陛下踐阼以來太陽侵色中有黒子大風晝晦冬温無氷連年大水漂沒廬田以至今嵗災異尤甚彗星彰見光炎隆熾朝東暮西連月乃滅飛蝗害稼日有食之加之陜西河東夏秋乏雨禾既不收麥仍未種婦子恓惶流離滿路西戎内侮邊鄙未安當此之際羣臣宜勸導陛下以祗畏天命勤恤民隠克已謙約博求至言以消復變咎延致善祥而朝廷晏然曽不爲意或以爲自有常數非闗人事或以爲景星嘉瑞更當有福今者又有佞臣建議請上尊號其爲欺蔽上天罔誣海内孰甚於此是使上帝鬼神怫鬰不懌自拜表以來陛下嬰此疾疹乆而未愈此皆羣臣諂諛之罪陛下豈得不省寤而深思哉臣不勝區區忘生觸死伏望陛下自以聖意止羣臣所上表章却尊號而勿受更下詔書深自咎責咨謀四方廣開言路求所以事天養民轉災爲福之道俟聖體康復政化流通天時豐穰人心悦豫然後推崇徽稱何晩之有如此庶幾上帝收還威怒福禄大來聖躬和平勿藥有喜羣生百姓莫不幸甚况陛下曏者郊禮之前辭尊號不受天下稱誦盛徳至今未已然則是棄虚名而得實名捨虚美而取實美也於陛下何損焉臣荷國大恩承乏侍從誠見近日羣臣皆以言爲諱入則拜手稽首請加鴻名出則錯立族談腹非竊笑終無一人爲陛下正言其不可者臣竊痛之是敢妄進狂瞽惟聖明采察取進止議祧遷狀治平四年閏三月上右臣准學士院告報以大行皇帝神主祔廟僖祖神主當遷夾室准朝㫖令待制以上同議者臣先於禧祐八年仁宗祔廟之時已曽與龍圖閣直學士盧士宗上言僖祖當遷夾室當時議臣皆不以爲然朝廷遂從衆議臣謹按王制稱天子七廟三昭三穆與太祖之廟而七明太祖之外止有三昭三穆而已是以前代帝王於太祖未正東嚮之時大率所祀不過六世若僖祖於今日方議祧遷則是太祖之外更有四昭三穆與太祖之廟而八不合先王典禮難以施於後世臣愚以爲仁宗祔廟之時僖祖已當遷於夾室今大行皇帝祔廟順宗亦當遷於夾室臣既承詔㫖令得與議不敢不盡所見以對伏乞朝廷更賜詳擇今録嘉祐八年奏議一本謹具狀繳連奏聞辭翰林學士第一狀治平四年閏三月二十九日上右臣竊聞已降勅告在閤門除臣翰林學士者臣聞人臣之義陳力就列不能者止臣自從仕以來佩服斯言不敢失墜頃事仁宗皇帝䝉恩除知制誥臣以平生拙於文辭不敢濫居其職瀝懇固辭仁宗皇帝察其至誠遂賜開許今翰林學士比於知制誥職任尤重固非愚臣所能堪稱聞命震駭無地自處况臣於先皇帝時以乆宦京師私門多故累曽進狀乞知河中府或襄虢晋絳一州後值國有大故及所修君臣事迹並未經奏御以此未敢更上文字日近方欲再有陳乞不意忽叨如此恩命臣雖頑鄙粗能自知非分之榮必不敢受伏望聖慈察臣非才不堪此任特賜哀矜遂其㣲志許以舊職知河中府或襄虢晋絳一州若此數處未有闕即乞於京西陜西路除一知州差遣如此則上不累公朝之明下不失私家之便誠爲大幸干冒宸嚴臣無任惶恐懇切之至辭免翰林學士第二狀右臣近於閏三月二十九日曽進狀辭免新除翰林學士恩命乞一知州差遣至今未奉朝㫖者臣竊以唐室以來士人所重清要之職無若翰林自非天下英才聲稱第一詳識典故富有文章雖欲冒居豈厭衆意臣禀賦頑鈍百無所堪在於屬辭尤爲鄙拙安敢强顔輒爲此職人雖不言能不内愧是用輸肝瀝膽貢實自歸惟仁聖鑒其中悃力少任重慙懼交攻坐炭履氷未足爲諭特遂所志使之自安天地至恩無以過此所有翰林學士勅告臣不敢祗受伏乞依臣前奏只以舊職於晋絳或京西陜西路除一知州差遣干冒宸嚴無任惶恐懇切之至辭免翰林學士上殿劄子治平四年四月十三日上臣近䝉聖恩除翰林學士已曽兩次進狀辭免乞一知州差遣奉聖㫖不允令便受勅告者臣非不知羙官難得詔㫖難違然所以須至再三煩瀆天聴者誠以人之材性各有短長人君當量能授官人臣當陳力就列如此則事無曠廢上下得宜臣自㓜小以來雖稍曽讀書而禀性愚鈍拙於文辭若使之解經述史或粗有所長至於代言視草最其所短今若苟貪榮寵妄居此職萬一朝廷有大號令或除拜稍多臣才思竭涸必至閣筆縱使勉强得成其鄙惡必甚以之宣布四方使共傳笑豈惟彰㣲臣之醜亦恐爲朝廷之羞此臣所以寧犯譴怒之誅而不敢當清華之選者也陛下若察其至誠知非矯飾特賜哀矜寢罷新命則是掩臣所短全臣所長生成之恩孰大於此况臣自通判幷州得替住京十有餘年去嵗兄里身亡孤遺無人照管臣累曽奏先帝乞家便一官亦䝉聖恩許候修書畧成規矩即除外任無何先帝奄棄天下臣哀荒失圖未敢叙陳近方欲具所修前漢紀三十巻先次進呈然後以私懇上干陛下聖聽不期忽有今兹恩命誠非愚臣本心所願憂惶跼蹐無所容措伏望聖慈依臣前奏只以舊職於晋絳州或京西陜西路除一知州差遣所有翰林學士勅告臣不敢祗受取進止乞王陶只除舊職劄子治平四年四月二十二日上臣昨日召對䝉恩賜示以吳奎所上劄子爲直除王陶翰林學士家居待罪事臣尋已曽據所見敷奏陛下始欲止還陶舊職後又欲與陶侍讀學士臣當時怱遽未有以對退爲陛下經宿思之侍讀學士與翰林學士資級畧同若授陶此職臣恐奎尚未肯起陛下新即尊位大臣屢有不安其位者奎素有質直之名萬一因此激發舉動更有過當若亟行罷免則深失士大夫之望若屢詔不起則愈損陛下之威况陶本以言事不聽辭免臺職待罪之際若更加以美官臣竊料陶亦不敢受欲望聖慈止還陶未作御史中丞時舊職則奎前者已經商量不敢不起陶既是舊職受之亦安庶免更有紛紜重傷朝廷大體臣䝉陛下虚已下問愚慮竊以此爲便不敢不奏乞賜詳擇取進止傳家集巻三十七欽定四庫全書傳家集巻三十八宋司馬光撰章奏二十一留吳奎劄子治平四年四月二十四日上臣竊聞王陶除樞宻直學士知陳州吳奎除資政殿學士知青州外議籍籍皆以爲奎不當去所以然者蓋由奎之名望素重於陶雖今者封還詔書徑歸私第舉動語言頗有過差然外廷之人不知本末但見陛下爲陶之故罷奎政事其罰太重能不怪駭如此臣恐其餘大臣皆不自安各求引去陛下新登大寳先帝梓宫在殯若舉朝大臣紛紛盡去則於四方觀聽殊似非宜臣愚欲望陛下收還奎青州勅告且留奎在政府以慰士大夫之望安大臣之意陛下以奎違詔而黜之威令已行嘉奎質直而留之用意尤美奎始負大譴懾服陛下之英斷終䝉開釋銜戴陛下之深恩上下驩悦誠無所損昔漢髙帝疑蕭何受賈人金械繫於獄感王衛尉一言赦令復位君臣恩禮相待如初况於出入之間何爲不可復留也陛下素知臣非朋附大臣之人故敢不避形迹極意盡言但爲朝廷惜大體耳乞賜裁察取進止初除中丞上殿劄子臣聞澄其原則流清固其本則末茂臣䝉陛下聖恩㧞於衆臣之中委以風憲天下細小之事皆未足爲陛下言之敢先以人君修心治國之要爲言此誠太平之原本也臣聞修心之要有三一曰仁二曰眀三曰武仁者非嫗煦姑息之謂也修政治興教化育萬物養百姓此人君之仁也眀者非煩苛伺察之謂也知道義識安危别賢愚辨是非此人君之眀也武者非强亢暴戾之謂也惟道所在斷之不疑姦不能惑佞不能移此人君之武也故仁而不眀猶有良田而不能耕也眀而不武猶視苖之穢而不能耘也武而不仁猶知穫而不知種也三者兼備則國治强闕一焉則衰闕二焉則危三者無一焉則亡自生民以來未之或改也治國之要亦有三一曰官人二曰信賞三曰必罰夫人之才性各有所長官之職業各有所守自古得人之盛莫若唐虞之際然稷契臯陶垂益伯夷䕫龍各守一官終身不易苟使之更來迭去易地而居未必能盡善也故人主誠能收採天下之英俊隨其所長而用之有功者勸之以重賞有罪者威之以嚴刑譬如乗輕車駕駿馬總其六轡奮其鞭䇿何徃而不可至哉昔仁宗皇帝之時臣初爲諫官得上殿首曽敷奏此語先皇帝時臣曽進歴年圖又以此語載之後序今幸遇陛下始初清眀之政虚心下問之際臣復以此語爲先者誠以臣平生力學所得至精至要盡在於是願陛下勿以爲迂闊試加審察若果無可取則臣無所用於聖世矣取進止乞罷詳定宰臣押班劄子治平四年上臣竊聞宰臣復有文字乞下禮官詳定合與不合押班臣聞王者設官分職譬猶一體以宰相爲股肱以臺諫爲耳目固當同心協力以佐元首若各分彼我互爭勝負欲求其身之安何由可得近者御史中丞王陶請宰相依舊制赴文徳殿押班宰相若從其所請豈有後來紛紜乃堅執不行迭相激發遂致王陶語言過差今王陶既補外官宰相已赴押班臣謂朝廷可以無事矣而宰臣復有此奏萬一禮官有希㫖迎合者以爲宰相不合押班臺司欲黙而不言則朝廷之儀遂成隳廢欲辨論是非則與前日之事有何所異是鬭訟之端無時休息也陛下新即天位四方之人舉首傾耳以觀大化而朝廷不聞肅雍濟濟之風數有變色分爭之醜臣竊爲陛下惜之况今災異屢降饑饉洊臻官多而用寡兵衆而不精冗費日滋公私困竭戎狄桀傲邊鄙無備百姓流亡盗賊將起朝廷夙夜所憂宜以此數者爲先而以餘事爲後伏望陛下特降聖㫖令宰臣依國朝舊制押班所有下禮院文字乞更不令詳定取進止留韓維吕景劄子治平四年五月十二日上臣竊聞已有指揮龍圖閣直學士韓維差知潁州侍御史吕景與堂除通判未知信否臣愚竊見韓維沈靜方雅於陛下疇昔宫僚之中最有美譽今者無故稱病求出外人皆不知其故吕景渾厚剛直於今日言事之臣亦爲難得其人身爲臺官坐言事罰銅誠使羞辱難以立朝不若得貶竄之爲快也然二人者皆陛下腹心耳目之良臣一旦俱從外補於二人甚爲私便臣竊爲陛下惜之伏望聖慈更賜詳度或且留之左右使拾遺補闕誠有所禆益必若不可留者其臺官乞更不舉人只於舊臺官吕大防郭源眀馬黙等數内斷自聖意選擇一人以補其闕所貴得質直之人克厭衆心取進止乞御殿劄子治平四年五月十五日上臣竊見今月十五日陛下以服藥不受慰羣臣無不憂疑臣竊惟萬乗之主起居動靜繫天下安危况今國家多事之際尤宜深思逺慮若來日聖體全未得安臣不敢言若稍得痊愈伏望陛下勉强御前殿或後殿暫見羣臣若有奏事乆不退者雖諭以近新服藥難爲乆坐使之且退亦無所害但使羣下畧得瞻望清光則中外之心自然安帖取進止論宰臣押班劄子臣伏覩今月七日勅文准四日手詔今後宰臣赴文徳殿押班自春分後或遇辰牌上秋分後遇辰正牌上垂拱殿視事未退止令傳報宰臣更不過令御史臺一靣放班餘日並依祥符勅命指揮永爲定制所有前降下太常禮院詳定文字更不施行者臣竊見從來埀拱殿視事比至中書樞宻院及其餘臣僚奏事畢春分以後少有不過辰初秋分以後少有不過辰正自陛下臨御以來惟近因服藥曽於辰牌以前駕起入内自餘皆在辰牌以後然則自今以徃無事之日宰臣永不赴文徳殿押班也臣竊惟文徳殿爲天子正衙宰臣爲百僚師率百僚既在彼常朝則宰臣理當押班斯乃前世舊規自祖宗以來未之或改今陛下即位之始事非有大利害者恐未須更張伏望陛下特降聖㫖令宰臣一依國朝舊制押班若陛下以前者已降手詔必欲限以時刻者即乞自春分後遇辰正牌上秋分後已牌上並依今月四日指揮施行猶庶幾此禮不至遂廢取進止乞訪四方雨水劄子冶平四年五月十九日上臣竊見陛下近以乆旱爲災分命使者徧祈嶽瀆靡神不舉精誠感通甘雨降集誠中外之大慶然暑月暴雨多不廣逺臣竊慮四方州縣尚有未霑足之處王者以天下爲家無有逺邇當視之如一不可使惻隠之心止於目前而已今者京城雖已得雨伏望陛下不可遽以爲秋成可望怠於憂民凡内外臣僚有新自四方來者進對之際皆乞訪以彼中雨水多少苗稼如何榖價貴賤閭閻憂樂互相參考以驗虛實既可以開益陛下聰眀日新盛徳又使逺方百姓皆知陛下燭見幽逺無所遺忽銜戴上恩傾心歸附又使州縣之吏皆知陛下憫恤黎元留心稼穡不敢自恃僻逺殘民害物陛下一發徳音而收此三善非獨可以行之今日亦願陛下永乆行之誠天下幸甚取進止乞簡省舉御史條約上殿劄子治平四年五月二十二日上臣聞法制之設貴於簡要而失在煩苛官人之道以得賢爲本而資序爲末昔東漢之衰立三互之法婚姻之家及兩州人士不得對相監臨以是幽冀二州乆缺不補蔡邕嘗上疏極陳其弊然則詳其末而遺其本非治世之政也伏見國家毎選御史官須中行員外郎以下太常博士以上差遣須通判資序其餘條約甚多是以百僚之中可舉者至少舉而得中者尤稀近日以來爲弊益甚蓋以屢有覃恩官品多髙而差遣未至幸而有資序相值者則又未必賢矣夫御史之職但當求忠亮方正之人區區資序何足比較臣愚欲望朝廷自今毎舉御史其前行員外郎以上即以本官兼侍御史三丞以下及知縣資序即且充裏行不復更須逐次陳請庶幾取人路廣有可選擇取進止上聽斷書治平四年五月二十四日上月日具位臣光昧死再拜上書皇帝陛下臣材識駑鈍陛下過聼擢備憲司臣夙夜盡心以思厥職隕首捐軀無足爲報竊見近嵗以來政府言職迭相攻毁分爲兩朋有如讎敵所以然者蓋由人臣各務逞其私志互爭勝負不顧已之是非人主不忍違逆人情兩加全䕶不肯判其得失是以羣下紛紛日鬭於前而朝廷爲之多事者也臣伏見陛下天性聰眀仁孝恭儉踐阼之初孜孜求治此誠堯舜之資羣生之福也羣臣幸得遭遇此時不務將順聖徳紀綱治體革政事之乆弊救百姓之疾苦而各爲私鬭不知窮極誠可罪也臣聞人君之尊與天地同體以剛健爲徳以重厚爲威照㣲當如日月發言當如雷霆昔漢武帝謂田蚡曰君除吏盡未吾亦欲除吏又謂衛青曰郭解布衣權至使將軍自言此其家不貧人君之言若皆切當如此羣臣安得不畏服哉夫心知其非而靣徇其情口順其説依違兩可此最人君之大患也今國家政事未有不先經兩府相與商議然後施行闗防祕宻外人莫得而知及詔令已下臺諫方得聞之若事有未便從而論列陛下還復下之兩府人之常情自非大賢誰肯以已之所謀爲非而以他人之言爲是哉必須排擯沮抑以爲難從此人主之所以獨取拒諫之名而大臣私得專權之便者也臣愚伏望陛下自今應有臣僚上言朝廷闕失者陛下當清心審慮自以大公至正之道决之若大臣所謀果是不必顧恤言者言者所陳果當不必曲順大臣之意位無高下言無先後惟是之從又何紛紜之足患哉必若其人等固有爭執者陛下亦當再加審察更以理道徃返與相詰難以盡其情果有可取勿憚改爲若漢宣帝之於趙充國則萬事無不當矣必若理道是非顯然在目而其人執迷文過彊很不已者雖加罪黜天下豈以爲不可哉如此則豈惟事得其正亦使威福之柄盡歸帝室矣凡天下之事是非未眀則不可不慎是非既眀則在陛下决而行之臣前日所謂惟道所在斷之不疑姦不能惑佞不能移者正謂此也伏惟聖眀俯加裁察臣光昧死再拜乞更不責降王陶劄子治平四年上臣竊聞政府以王陶謝上表言辭狂率恣爲詆毁多過其實欲有敷奏乞重加責降審或如此恐不可許何則自仁宗皇帝以來委政宰輔宰輔之權誠爲太重加以臺諫官被貶者多因指大臣之過失少因犯人主之顔色是威福之柄潛移於下陛下方將奮乾剛之盛徳伸元后之威斷收還利噐以救其弊今者王陶肆其􅄶心失於詳審言語不宻流布逺近雖實有罪然陶前者出知陳州陛下蓋以先帝梓宫在殯特爲大臣屈意行之今若又以表文詆毁大臣重加責降臣恐人主之權益去大臣之勢遂成興衰之機於此乎在不可不察也臣愚伏望陛下於執政進呈王陶謝上表之際但諭以躁人之辭不足深罪前已左遷在外豈可更加貶責若其再三執奏陛下當正色語以王陶前作中丞譏切朕躬非無過當之言朕亦未嘗加怒欲以開廣言路豈可觸犯卿等則必欲再三責降方爲快意耶若猶執奏不已者陛下但不復應答彼當自退所以然者非以保全王陶蓋欲使其餘臣僚知陛下英武可恃萬一他日大臣有欺罔聰眀爲大罪者羣臣敢言之耳凡此皆陛下聖智所能自知臣復屑屑盡言者誠荷陛下不世之恩貪於報効不復自顧形迹之嫌故也取進止言王廣淵劄子治平四年六月三日上臣聞明君之政莫大於去姦忠臣之志莫先於疾邪陛下不知臣無似使待罪憲府受任以來於今踰月而寂無所糾誠負大恩伏見直龍圖閣兼侍讀王廣淵以小人之質有傾巧之材苟求進身無所不至外依政府内結近習數年之間致位清顯國家本以龍閣寵賢彦邇英待儒雅皆非廣淵所宜濫處陛下即位以來未聞放黜姦邪以警羣臣廣淵於朝列之中爲姦邪之尤者伏望陛下奮發乾剛首加斥逐奪去職名除一逺地監當亦足以醒天下之耳目取進止言王廣淵第二劄子臣近曽上言直龍圖閣兼侍讀王廣淵傾巧姦邪乞盡奪去職名除一逺地監當差遣至今未聞指揮臣竊惟廣淵所爲布聞海内陛下昔在宫邸豈不備知何假㣲臣更有詳述書曰任賢勿貳去邪勿疑此大舜所以成天功也陛下若未知廣淵之爲賢與不肖尚容致疑若果知廣淵姦邪之狀則豈可復置之左右而不速去之哉夫佞人者巧於求合變故萬端雖聖賢所不能察是以帝堯畏巧言令色孔壬而孔子教顔淵以逺佞人夫堯與顔淵非不眀也苟不畏而逺之則有時而惑之矣伏望陛下依臣前奏其王廣淵早賜黜逐取進止言王廣淵第三劄子臣前兩次上言王廣淵傾巧姦邪乞盡奪去職名與逺地監當近聞本人帶舊職知齊州仍賜章服如此乃是賞之非黜之也曏使廣淵自改京官以來謹身守分不爲姦諂以至今日不過作第二任通判今所得乃如此豈可謂爲姦諂無益哉孔子稱惟噐與名不可以假人今之章服所謂噐也職名所謂名也二者皆無用之物然而天下貴之者爲其非賢才則不能得之故也唐宣宗重惜章服不輕以與人有司製緋紫衣以備賜與經年不用三兩領故當時服緋紫者人以爲貴夫名噐者譬如珠玉若使之易得如瓦礫尚安足貴乎近嵗兩次覃恩服緋紫者已爲汎濫今又如陳鑄王廣淵軰皆賜章服是使今後受賜章服者皆以爲耻不以爲榮也且陛下使廣淵出補外官者必已知其姦邪之迹也今又復以職名章服寵之是勸人使效廣淵所爲也臣竊恐非國家之福伏望聖斷依臣前奏盡奪去廣淵職名幷比來章服與逺地監當使賞善罰惡皦然眀白取進止言郭昭選劄子治平四年上臣竊聞陛下曏時直省官郭昭選等四人近有特㫖並除閤門祗候衆言籍籍頗謂僥忝國初草創天歩尚艱故祖宗即位之始必㧞擢左右之人以爲腹心羽翼豈以爲永世之法哉乃遭時不得已而然也自後嗣君守承平之業繼聖考之位亮隂未言之間有司因循踵爲故事凡東宫僚吏一槩超遷謂之隨龍以此昭選之徒得自厮役直除班行其爲幸已多矣乃敢妄有攀援邀求無已曽不自省有何功勲小人之心終無厭極不可縱也且閤門祗候祖宗所以蓄養賢才以待任使之地也其班序差遣事事不同譬諸文臣則館閣之流也豈可使厮役之人爲之哉况東宫其餘吏卒甚衆苟一人得之則皆有冀望之心此書所謂啟寵納侮者也陛下既承大統則率土之濵誰不爲臣而獨私於東宫之人則所與親者至狹矣臣昨除御史中丞初上殿之日首以官人賞罰爲言誠以三者致治之本自上世以來不易之道也今昭選等以賤𨽻而叨美職是官不擇人也無横草之勞而數月之間恩命相繼是無功受賞也姦慝眀著如髙居簡等尚保而庇之是有罪不罰也陛下始初清眀方勵精求治而乃輕其官爵慢其賞罰如此將以興太平之功猶適楚而北轅也今臣所以區區進言者但爲陛下惜此而已所有昭選等新除閤門祗候乞賜追寢取進止貼黄或聞昭選等因告昌王入言得此特㫖未知虛的審或如此尤爲不可陛下之於昌王但當極其友愛至於官爵刑賞乃陛下政柄須决之聖心昌王亦不當闗預陛下亦不當聼從如此則兄弟之恩全君臣之分正矣漢館陶公主爲子求郎眀帝不許賜錢十萬曰郎官上應列宿出宰百里有非其人民受其殃是以難之彼爲其子猶不可况爲他人乎傳家集巻三十八欽定四庫全書傳家集巻三十九宋司馬光撰章奏二十二言賑贍流民劄子治平四年六月十七日上臣竊見朝廷差官支撥粳米於永泰等門遇有河北路流民逐熟經過即大人每人支與米一斗小人支與米五升仰子細告諭在京難以住泊令速徃近便豐熟州軍存活者臣竊思之如此處置欲以為恤民之名掩人耳目則可矣其實恐有損無益何以言之曏者或聞河北有人訛傳京師散米者民遂襁負南來今若實差官散米恐河北饑民聞之未流移者因兹誘引皆來入京京師之米有限而河北流民無窮旣而無米可給則不免聚而餓死如前年許潁二州是也今禾苗旣傷於旱蝗蝻日益滋生秋田豐歉殊未可知一斗五升之米止可延數日之命豈能濟其饑饉之厄哉凡民之情見利則趨之見害則避之若京師可以住泊雖驅之亦不肯去若外州可以存活雖留之亦不肯止固非數人口舌所能告諭故臣以為有損無益也臣聞民之本性懐土重遷豈樂去其鄉里捨其親戚棄其丘壟流離道路乞丐於人哉但以豐稔之歳粒米狼戾公家既不肯收糴私家又不敢積蓄所收之榖隨手糜散春指夏熟夏望秋成上下偷安莫為乆計是以稍遇水旱螽螟則糇糧已絶公私索然無以相救仰食縣官旣不能周假貸富室又無所得此乃失在於無事之時不在於凶荒之年也加之監司守宰多不得人視民之窮曽無矜憫増無名之賦興不急之役吏緣為姦蠧弊百出民摶手計窮無以為生則不免有四方之志矣意謂他處必有饒樂之鄉仁惠之政可以安居遂伐其桑棗撤其廬舍殺其耕牛委其良田累世之業一朝破之相携就道若所詣之處復無所依使之進退失望彼老弱不轉死溝壑壯者不起為盗賊將安歸乎是以聖王之政使民安其土樂其業自生至死莫有離散之心為此之要在於得人以臣愚見莫若謹擇公正之人為河北監司使之察災傷州縣守宰不勝任者易之然後多方那融斛斗各使賑濟本州縣之民若斛斗數少不能周徧者且須救土著農民各據版籍先從下等次第賑濟則所給有限可以豫約矣若富室有蓄積者官給印厯聽其舉貸量出利息候豐熟日官為收索示以必信不可誑誘則將來百姓爭務蓄積矣如此饑民知有可生之路自然不棄舊業浮逰外鄉居者旣安則行者思返若縣縣皆然豈得復有流民哉臣前曽上言王者以天下為家不可使惻隠之心止於目前而巳此特河北流民路過京師者耳竊聞其他災傷之處流民亦為不少若臣言可采伏望聖慈依此行之取進止言施行封事上殿劄子治平四年六月十七日上臣伏以大舜舉賢敷納以言明試以功漢武帝詳延特起之士待以不次之位終獲其用威加胡越真宗皇帝總覽羣臣章奏用其言而顯其身以成咸平景徳之治凡察言所以知人知人所以立政自古及今其道一也今陛下即政之初首開言路令中外臣民皆得上封事海内欣欣咸畢精竭思以承休徳若於此際能采其嘉謀舉其賢材而用之則太平之基可指日而望也若徒備外飾廢其言而不用棄其人而不取則天下頺弊之事當何時而振起乎臣與張方平先受詔詳定中外所上封事雖巳盡心料簡合於義理可施行者一一奏聞更望陛下擇其精者决自聖意必令行之其有識慮稍出於衆者願陛下特賜召對面加詢訪考其虚實果有可采宻籍姓名遇有差遣隨材授任俟其實有顯效然後可以不次拔擢如此則嘉言㒺攸伏野無遺賢矣取進止言髙居簡劄子治平四年六月十一日上臣聞古人有言堂上不糞則郊草不贍曠芸言近者不治則不暇及逺也竊見勾當御藥院髙居簡資性姦回工讒善佞乆處近職罪惡甚多臣謹按祖宗舊制勾當御藥院官至内殿崇班以上即湏出外盖以日月寖乆官資稍髙則防其慿恃威靈竊弄權柄逺鑒漢唐之禍深為子孫之慮故也陛下即位之初内臣以覃恩遷官者盡補外職獨留御藥院四人天下首以此一事譏陛下之失况居簡於衆人之中最為狡猾而陛下特加寵信待以腹心中外指目大玷聖徳臣職在繩紏不敢不言伏望聖慈遵祖宗令典應勾當御藥院官至崇班以上者盡授以向外差遣其髙居簡乞逺加竄逐以解天下之惑取進止言髙居簡第二劄子臣近曽上言勾當御藥院髙居簡工讒善佞乞逺加竄逐未䝉施行昔周公以立政戒成王至虎賁綴衣趣馬小尹左右􅂝僕百司庶府亦皆擇人穆王命伯冏為大僕正曰昔在文武侍御僕從㒺匪正人又曰慎簡乃僚無以巧言令色便辟側媚其惟吉士僕臣正厥后克正僕臣諛厥后自聖自古聖帝明王雖左右小臣未嘗不謹擇端良之人以自防逸豫之生也况陛下嗣膺寳命聖徳惟新善惡興衰於此乎分而使讒佞如居簡者旦夕常在左右又寵而信之此乃異日禍亂之根腹心之疾也臣職在去邪不敢不再三上言伏望聖明依祖宗舊制應勾當御藥院官至崇班以上者並令出外其髙居簡仍乞逺加竄逐取進止言髙居簡第三上殿劄子臣近曽兩次上言勾當御藥院髙居簡工讒善佞乞逺加竄逐至今不䝉降出施行居簡頃在先朝巳竊弄權柄依慿城社玷辱聖明物論洶洶切齒側目及陛下繼統必謂首行誅竄以警邪臣不意居簡狡猾多端先自結於陛下使陛下寵愛信任更過於先帝之時朝廷公忠之士無不憤懣深為陛下惜之方今内侍之臣小小謹慎可以備陛下左右使令者何可勝數陛下足以擇而用之何必違祖宗舊典負天下譏謗獨保䕶居簡堅如金石臣竊惑之伏望聖慈取䑓諫官前後所言居簡文字盡付所司明治其罪以彰至公之義順合衆心其餘勾當御藥院者亦乞遵舊制官至内殿崇班以上並授以向外差遣取進止言髙居簡第四劄子臣累日前上殿言勾當御藥院髙居簡自先帝時竊弄權柄陛下復寵而信之大為聖徳之累乞治其罪陛下許臣送樞宻院施行至今未聞有指揮不知居簡以何道結陛下能如此之深也居簡所能止於讒佞佞者不過巧言令色希意迎合快人主之欲以市其權使人主溺於荒宴而不自知也讒者不過離人君臣間人骨肉惑人主之心以固其恩使人主陷於傾危而不自寤也有是二者又可近乎曏使陛下即位嵗乆功業已成而有讒佞之臣始得幸天下有識者猶當寒心何則知其必為禍亂之階也况今初承大統當銳精求治之時而遽留居簡於左右仍加寵信根􅎞已牢則異日之憂可勝道哉此臣所以不避死亡而必當力争者也或聞陛下欲待居簡自求引退然後遣去臣誠戇愚未曉所謂若國之大臣耆年有徳聞望素髙一旦偶有小失未為外人所知陛下務存終始使自引去以全其名則可矣其挾姦作慝者猶宜明正刑書况居簡閨闥小臣罪惡盈積所宜肆諸市朝宣示四方以戒憸人而尚足為之隠乎且居簡姦邪播聞逺近陛下今日雖為之隠天下耳目庸可蔽乎凡居簡所以能為惡者以其自託宫禁譬如狐鼠依慿城社彼惟恐離去左右豈肯自陳求退乎伏望陛下盡出羣臣前後所言居簡事状送居簡付所司明治其罪以彰至公之道取進止言髙居簡第五上殿劄子當日罷居簡御藥院除供備庫使臣聞邪正不可同朝猶冰炭不可同器陛下不知臣不肖使待罪御史中丞臣四次上言勾當御藥院髙居簡工讒善佞不宜寵信置於左右所言無取不䝉省錄臣實無顔尚居風憲若陛下以臣為拙直則居簡為姦邪若以居簡為忠良則臣為讒慝臣與居簡勢難兩留況臣守官京師十有一年自先帝時累曽陳乞外任伏望聖慈罷臣御史中丞除一外任差遣取進止言王中正劄子治平四年七月二十七日上臣伏見陛下前者盡罷寄資内臣髙居簡等令補外官中外欣然無不稱頌聖徳尋聞復留陳承禮劉有方二人又以王中正勾當御藥院衆頗失望臣竊惟祖宗之意以御藥一職最為親宻過供奉官以上輒令罷去者迺以防微杜漸詒謀萬世憂深思逺誠自古帝王之所不及子孫所宜謹守不許失墜者也近歳以來左右之臣既戀權勢又貪祿位遂求闇理資序豫支俸給名曰寄資以欺誑外人此豈祖宗之意邪今陛下欲振舉紀綱一新治道必當革去乆弊一遵正法夫法如隄防常應完固迺得無患一有蟻壤泄之則漸致潰敗不可復救近習之臣朝夕在側因縁祈恩無有窮極不以祖宗舊法制之恐陛下他日亦將厭之也況王中正素聞姦猾頗好招權今處之要職是去一居簡得一居簡也伏望陛下一依前降指揮盡罷寄資者令補外官以成聖徳之美別擇内供奉以下樸直廉謹者使勾當御藥院以存祖宗之法取進止言王中正第二劄子臣竊聞陛下好令内臣采訪外事及問以羣臣能否臣愚竊以為非宜陛下内有兩府兩制臺諫外有提轉牧守皆腹心耳目股肱之臣也陛下誠能精擇其人使之各舉其職薦舉賢能糾案姦慝論政事得失述民間利病皆令列於奏牘明白啟陳其有尸祿偷安及挾私欺罔者小則罪黜大則誅竄誰敢不盡公竭誠以承休徳如此則天下之事猶一堂之上陛下何患於不知哉今若深處九重之内詢於近習之臣采道聽塗說之言納曲躬附耳之奏不騐虚實即行賞罰臣恐讒邪得以逞其愛憎而陛下為之受其譏謗也近聞王中正差徃陜西勾當公事有知涇州劉渙等曲加諂奉鄜延路鈐轄吴舜臣違失其意俄而渙等進擢舜臣降黜衆人皆言中正所為審或如此則是中正弄權已有明驗今陛下又置之肘腋委以腹心臣恐天下之人將重足一迹而畏之輿金輦璧而奉之矣外議又言山陵禮畢韓琦必求引退兩府當有遷補臣竊慮兩制以上萬一有無亷耻之人或隂結此屬以求進用者夫以尭之聦明咨於四岳衆言僉同然後用人猶失之於鯀況可决於近習之口乎凡公忠正直之士必不肯借譽左右以求自售齊威王所以賞即墨大夫而烹阿大夫正謂此也昔漢唐之衰宦官所以能壊亂綱紀傾覆國家者皆由人主與之謀議幃幄進退羣臣故也此乃治亂安危之本不可不察伏望聖慈詳思臣言凡欲知天下之事當詢訪外廷之臣其王中正不可令勾當御藥院或姦佞之臣豫設機謀以經營兩府者必不可用則天下幸甚取進止言王中正第三劄子臣伏奉手詔節文問王中正等事得之於何人可宻奏來臣以非才誤受陛下聖知擢為御史中丞惟懼曠職孤忝大恩每與賔客語言無不詢訪時事稍有毫髮禆益盛徳率皆奏陳此事臣得之於賓客前後非止一人誠恐玷累公朝所以有此論述中正有無此事惟陛下可以知之臣在闕門之外何由知其虚實若其果有此事陛下得以為戒若其無有臣敢避妄言之辜但外人有此議論臣不敢不令陛下知之萬一有益聖明皆微臣之幸也取進止言石椁劄子治平四年九月八日上臣伏見永厚陵皇堂巻軬石四重其二重並寄於枋木之上陛下孝心深逺以為異日枋木終歸朽腐石若隕墜於梓宫非便發自聖謀欲為石椁其修奉山陵都護宋守約鈐轄張若水以䇿非巳出百端沮難苟欲修飾目前自營私計不為梓宫萬世之慮為人臣子不忠如此乃敢令石匠作頭供狀稱八月二十七日進入梓宫後連夜造作計二十四時辰了畢如䝉別差人定奪却不依今來所定時辰先得了當甘軍令不辭公列奏牘誑惑朝廷是致掩閉皇堂及虞祭并木主到京之日皆曽改移臣昨充山陵儀仗使目覩内臣黄懐信用夷牀澁牀等下梓宫數刻之間安厝巳畢乃知守約若水等欺罔聰明輕侮邦憲若不懲戒則不公挾詐之人將何所忌憚伏望陛下治守約若水等罪嚴行責降若升袝畢有赦守約若水等縁修奉山陵得罪特乞不原其黄懐信等冝優與酧奬貴使賞罰明白人知聳畏取進止辭賜金劄子治平四年七月二十日上臣先奉勅充山陵儀仗使巳䝉聖恩賜絹一百匹錢二百貫文充盤纒於今月二十九日又降中使賜臣箔金五十兩并銀合重三十兩臣不敢仰違詔㫖雖巳奏謝訖然竊聞嘉祐八年永昭陵時不曽有此例私心惶恐深不自安臣聞人君不行無功之賞則羣下勸人臣不受非分之賜則亷耻立今臣等雖備位五使猶在京城跬歩之勞亦未嘗有以何勲效再受重賜況臣職在執憲當抑絶僥倖而身自為之將何以糾其他人其箔金并銀合伏望聖慈許令回納入庫庶使下臣有以自容取進止辭賜金第二劄子治平四年八月二日上臣前日䝉恩賜金五十兩并銀合臣以所賜過厚尋問永昭陵禮儀使范鎮知舊例所無不敢當受遂具奏陳乞許令回納伏䝉聖慈特降中使宣諭令受臣上荷恩遇至深至重螻蟻微命不足為報愧懼流汗無所容措然臣竊聞昔韓昭侯有弊袴命藏之侍者曰君仁君也不以賜左右而藏之昭侯曰吾聞明主愛一嚬一笑嚬有為嚬笑有為笑今袴豈特嚬笑哉吾必待有功者彼一弊袴猶不可以與無功之人況數十兩之金乎魏太祖之為政有功宜賞不吝千金無功妄施分毫不與我太祖太宗之御臣下亦然故能驅駕英豪光啟大業夫明主之不妄賞賜非吝之也誠以賜一無功則天下無功之人皆有徼覬之心有功之人皆懐怨望故也借使一人有功而人主賜之一金無功者不得其有功者必喜何則衆人不得而我獨得之是人主知我之功也其榮多矣如是則智者獻其謀勇者竭其力雖使之赴湯火猶將甘而樂之若有功者賜千金無功者亦賜千金其有功者必不恱何則彼無功而我與之均是人主待我無以異於彼也其辱深矣如是則有功者莫不解體誰肯竭其智力觸冒死亡以狥國家之急哉故官爵金帛者人主所以鼓舞羣情使之奔走左右而不自知者也然則明主愛一嚬一笑豈為過論哉仁宗皇帝天性寛仁承累世餘烈府庫充實身雖節儉而好施於人羣臣左右貪求無厭賜予之例因兹寖廣府庫之積日益减耗不幸又於五年之中再遭大喪左藏内藏奉宸等庫率皆空竭當此之時舊例所有猶宜䥴减以救其弊況可以例外横賜無功之人乎且陛下以國用不足之故永厚陵猶遵遺制比永昭陵事事裁减而所賜羣臣之物反更多於永昭陵之時臣雖小人貪昧財賄揣循此理能自安乎此臣所以夙夜憂惶無以自處者也况府庫之物迺天下萬民之物也自非有功於民者皆不宜得之臣所以仰違詔命堅辭賜物至於再三者非自以飾小廉也廼欲助陛下成治道也伏望聖慈察其誠懇依臣前奏許令將所賜金并銀合囘納入庫取進止傳家集巻三十九欽定四庫全書傳家集巻四十宋司馬光撰章奏二十三議謀殺巳傷案問欲舉而自首狀知登州許遵奏婦人阿云於母服内與韋阿大定婚成親後嫌韋阿大夜間就田中用刀斫傷縣尉令弓手勾到阿云問是你斫傷本夫實道來不打你阿云遂具實招通合作案問欲舉减二等大理寺不合作謀殺已傷絞罪㫁遣下刑部定得大理寺允當遵不服詔下光與安石定奪安石以為遵議是後朝廷竟從安石議右臣竊以為凡議法者當先原立法之意然後可以㫁獄竊詳律文其於人損傷不在自首之例注云因犯殺傷而自首者得免所因之罪仍從故殺傷法所謂因犯殺傷者言因犯他罪本無殺傷之意事不得巳致有殺傷除為盗之外如刼囚略賣人之類皆是也律意盖以於人損傷既不得首恐有别因餘罪而殺傷人者有司執文并其餘罪亦不許首故特加申明云因犯殺傷而自首者得免所因之罪然殺傷之中自有兩等輕重不同其處心積慮巧詐百端掩人不備者則謂之謀直情徑行略無顧慮公然殺害者則謂之故謀者尤重故者差輕今此人因犯他罪致殺傷人他罪雖得首原殺傷不在首例若從謀殺則太重若從闘殺則太輕故酌中令從故殺傷法也其直犯殺傷更無他罪者惟未傷則可首但係已傷皆不可首也今許遵欲將謀之與殺分為兩事案謀殺故殺皆是殺人若將謀之與殺分為兩事則故之與殺亦是兩事也且律稱得免所因之罪彼刼囚略人皆是巳有所犯因而又殺傷人故刼略可首而殺傷不原若平常謀慮不為殺人當有何罪可得首免以此知謀字止因殺字生文不得别為所因之罪也若以刼鬭與謀皆為所因之罪從故殺傷法則是鬭傷自首反得加罪一等也遵所引蘇州洪祚㫁例案律疏云假有因盗故殺傷人而自首者盗罪得免故殺傷罪仍科疏既指言故殺傷人則是因盗謀殺傷人者自從謀法當時法官誤斷不可用例破條遵又引編勅謀殺人傷與不傷罪不至死者並奏取勅裁以為謀殺已傷而罪不至死者即是自首之人按尊長謀殺卑幼之類皆是巳傷而罪不至死不必因首也遵又引律疏問答條云謀殺凡人乃云是舅又云謀殺之罪首盡顯是謀殺許令自首案彼皆謂謀而未傷方得首免若其巳傷何由可首凡議罪制刑當使重輕有叙今若使謀殺巳傷者得自首從故殺傷法假有甲乙二人甲因鬭毆人鼻中血出既而自首猶科杖六十罪乙有怨讐欲致其人於死地暮夜伺便推落河并偶得不死又不見血若來自首止科杖七十罪二人所犯絶殊而得罪相埒果然如此豈不長姦況阿云嫌夫醜陋親執腰刀就田野中因其睡寐斫近十刀斷其一指初不陳首直至官司執錄將行栲棰勢不獲已方肯招承情理如此有何可憫朝廷貸命編管已是寛恩而遵更稽留不斷為之伸理欲令天下今後有似此之類並作减二等㫁遣竊恐不足勸善而無以懲惡開巧偽之路長賊殺之原姦邪得志良民受弊非法之善者也臣愚以為大理寺刑部所定巳得允當難從許遵所奏作案問欲舉减等而科今來與王安石各有所見難以同共定奪伏乞朝廷特賜裁酌施行議貢舉狀熈寕二年五月上臣准御史臺牒准勅節文天下學校貢舉之法宜令兩府兩省待制以上御史臺三司三館臣僚各限一月具議狀聞奏者臣聞詩云無競惟人四方其訓之言欲立强於天下者無如得人得人而任之以事則四方斯順之矣臣竊惟取士之弊自古始以來未有若近世之甚者也何以言之自三代以前其取士無不以徳為本而未嘗專貴文辭也漢氏始置茂才孝廉等科皆命公卿大夫州郡舉有經術徳行者䇿試以治道然後官人故其風俗敦尚名節降及末世雖政衰於上而俗清於下由取士之術素加奬厲故也魏晋以降貴通才而賤守節習尚浮華舊俗益敗然所舉秀孝猶以經術取之州郡皆置中正以品其才行一言一動之失或終身為累士猶兢兢不敢自放隋始置進士唐益以明經等科而秀孝遂絶止有進士明經二科皆自投牒求試不復使人察舉矣進士初但試䇿及長安神龍之際加試詩賦於是進士專尚屬辭不本經術而明經止於誦書不識義理至於徳行則不復誰何自是以來儒雅之風日益頽壊為士者狂躁險薄無所不為積日既乆不勝其弊於是又設謄錄封彌之法盖朝廷苦其難制而有司急於自營也夫欲搜羅海内之賢俊而掩其姓名以考之雖有顔閔之徳苟不能為賦詩論䇿則不免於遭擯棄為窮人雖有跖蹻之行苟善為賦詩論䇿則不害於取髙第為美官臣故曰取士之弊自古始以來未有若近世之甚者非虚言也今幸遇陛下聖眀心知貢舉之極弊慨然發憤深詔羣臣使得博議利病更立新規是千載一時也議者或曰古人郷舉里選今欲知士之徳行宜委知州知縣者采察其實保而薦之臣獨以為不然古者分地建國自卿大夫士皆以其國人為之猶患處士之徳行不可得而詳也故又擇其郷之賢者使為閭胥比長自幼及長朝夕察其所為然後士之徳行美惡莫得而隠也今夫知州知縣雜四海九州之人逺者三嵗而更近者數月而更或初到官即遇科塲遽責之知所部士人之徳行誠亦難矣又應開封府舉者常不减數千人而開封府獄訟之繁知府者自旦至暮耳不暇聴目不暇視又有餘裕可使之察數千人之徳行乎議者又曰宜去封彌謄錄委有司考其文辭参以行實而取之臣獨以為不然夫士之徳行知州縣者尚不能知而有司居京師一旦集天下之士獨以何術知之其術不過以衆人之毁譽決之孔子曰衆好之必察焉衆惡之必察焉夫衆之毁譽庸詎足以盡其實乎必如是行之臣見其愛憎互起毁譽交作請託公行賄賂上流謗讟並興獄訟不息將紛然殽亂朝廷必厭苦之而復用封彌謄錄矣夫封彌謄録固為此數者而設之也譬猶築防以鄣洚水也今不絶其源而徒去其防則横流之患愈不可救矣臣雖至愚平生固嘗竭其思慮欲以少救其弊今敢陳二䇿乞陛下俯加裁擇臣聞上之所為下之所歸也國家從來以賦詩論䇿取人不問徳行故士之求仕進者日夜孜孜專以習賦詩論䇿為事惟恐不能勝人父教其子兄勉其弟不是過也今若更以徳行取人則士之力於徳行亦猶是也誠風化清濁之原歴代訛謬而不寤必待聖朝然後正之者也夫徳行修之於心藏之於身雖家人有所不知况於郷黨况於州縣况於朝廷將何從知之故必待明哲公正之臣知而舉之然後四海之士皆可得而官使也然舉薦之法既行則干求屬請誠所不能無也要在所舉非其人者國家以嚴法繩之勿加恩貸則苟且狥私之人皆知懼矣且國家既以徳行取士則彼貪猾輕躁之人依附權要枉道求進者皆為清議所貶見棄於時雖有舉者必不多矣臣愚欲乞今後應係舉人令升朝官以上嵗舉一人提㸃刑獄以上差遣者嵗舉二人諫議大夫或待制以上嵗舉三人不以所部非所部鄉里非鄉里除自已親戚及曽犯真刑或私罪情理重曽經罰贖及不孝不友盗竊淫亂明有迹狀者不得舉外其餘皆得舉之仍於舉狀内眀言臣今保舉某州某科某人有學術節行乞賜召試若舉狀既上之後却有前後諸般違礙事發其舉主並依律文貢舉非其人分故失從公私罪定斷受贓而舉者以枉法論其舉狀逐時送下禮部貢院置簿記錄若應舉人而不舉者嵗終委貢院勘㑹姓名開奏乞嚴加朝典每遇三年一開貢舉委貢院截自詔下之日勘㑹選擇舉主最多者從上取之舉主數同則以舉狀到省月日先後為次其舉主曽有􅂍罪及見停閒身亡或在合舉人數外者並不使倍於每次科塲南省奏名人數具姓名聞奏乞下本貫發遣赴闕其本貫更不考試即具申狀解送赴貢院仍出公憑給付逐人令赴貢院照㑹限十一月内取齊十二月内引見正月内委貢院考試其試官或朝廷臨時添差進士試經義䇿三道子史䇿三道時務䇿三道更不試賦詩及論明經及九經等諸科試本經及論語孝經大義共四十道明經加試時務䇿三道其帖經墨義一切皆不試對䇿及大義但取義理優長不取文辭華巧唯所對經史乖僻時務疎濶者即行黜落其奏名人數並依科塲舊制若合格者少不滿舊數亦聽至御試時進士明經各試時務䇿一道九經等諸科試本經大義十道所有名字髙下並只以舉主多者為上舉主數同則以舉狀到省月日先後為次其舉人所納家狀及授官後吏部所給告身並湏開坐元初舉主人數姓名若及第後犯私罪情理重及贓罪其舉主並减一等坐之未及第者减三等皆不以去官及赦原如此則羣臣不敢挾私妄舉士人皆崇尚經術重惜操履風俗丕變矣朝廷若不能行此保舉之法其次莫若修學校之法以取之臣伏見自慶厯以來天下諸州雖立學校大抵多取丁憂及停閒官員以為師長藉其供給以展私惠聚在仕官員及井市豪民子弟十數人遊戯其間坐耗糧食未嘗講習修謹之士多耻而不入間有二千石自謂能興學者不過盛修室屋増置莊産廣積糧儲多聚生徒以采虚名師長之人自謂能立教者不過謀其出入節其遊戯教以鈔節經史剽竊時文以夜繼晝習賦詩論䇿以取科名而已此豈先王立學之意邪於以修明聖道長育人材化民成俗固已疎矣臣欲乞自今天下州學只許置教授一人委本州長吏於本處命官中選擇無過犯有節行能講説為衆所服者舉奏補充若本州無人則奏乞下銓司選差委銓司於見在銓選人内揀選進士明經諸科出身人歴任無贓私罪能講說經書者奏補充逐州教授仍令國子監試講說經書應舉人初入學者並為外舍生唯赴聽講及公試外不得於學中宿食其教授每日講書畢取在學諸生姓名書於籖上雜置筩中抽取三人問以聽過書中疑義三條使對衆解說通者置簿記録粗者不問不者有罰每月中兩次公試各試所習舉業委教授考校定優劣等第具姓名出榜示訖亦置簿記錄其有過犯者小過則罰錢中過則降等謂自内舍髙等降為中等中等降為初等初等降為外舍生外舍生無等可降者勒出學大過則斥出學亦置簿記錄每遇春秋釋奠畢委教授選擇外舍生到學及半年以上自前次釋奠以來說書多通公試多在優等姓名近上即為優等過犯情輕少即升入内舍為初等生始聽於學中宿食又選擇初等生升為中等生中等生升為髙等生皆如外舍生之法其有二人已上比較難決者即特令說書及試所業以決之皆湏具狀申本州委知州通判更加審覆委得公當然後給牒補之如後来有過降等者其牒即行抽取毁抹其教授選擇紏舉升降等第若有不公委知州通判覺察取勘聞奏乞行衝替其開封府舉人舊無府學並令寓教於國子監其國子監舉人湏實是品官子弟方得依條入學其教試選升之法並於外州同以直講比教授判監同判監比知州通判凡國子監開封府及諸州軍内舍髙等生額並用本處解額之半解額有竒數者入髙等生額假若解額三人則以二人為髙等生額其中等倍髙等初等倍中等若人數未足則闕之不得溢額補人若遇詔下開貢舉委本處判監同判監知州通判截自其日勘㑹髙等生補及半年以上者具姓名結罪保明聞奏開封府舉人只委判監同判監保明仍給與公慿許令免解直就省試其髙等生占不盡解額方許本處其餘舉人取解其中等初等生於取解時仍别立號常比其餘舉人多取分數所有髙等生至省試亦别立號每七人中取一人奏名如此則舉人亦稍嚮經術敦行義矣夫經術深淺非程試所能知行義美惡非朝夕所能察今使之處於學校經二三年累經選擇升至髙等又占解額妨衆人進取之路若其行義少有過差必不為衆人所容矣由此觀之其髙等生經術則講說常通文藝則屢入優等過犯則全然輕少行義則為衆所服比之糊名謄錄考其一日所試賦詩論䇿偶有所長而取之者相去逺矣況近年舉人或一無行能横遇恩澤幸得免解者不可勝數今髙等生行能如此裁免一解豈足惜哉此學校之法也若朝廷又不能如此只於舊條之中毛舉數事微有更張則於取士之道並無所益徒更煩苛不若悉循舊貫之為愈也議繫宫親人鏁應狀治平元年上先准嘉祐三年八月二日中書劄子供繫宫親授班行人云云右看詳繫宫親人並是三代食祿之家有人保任方得充避比於工商雜類納財授官之人流品殊勝其中固有竒才異行可以進用豈可止以連姻帝族遂同贓私罪犯之人不得鏁㕔應舉求諸義理全無意謂欲乞今後應與宗室女為親補轉班行者如别無事節違礙科塲條貫並許依其他武臣例鏁㕔應舉以廣求賢之路傳家集巻四十欽定四庫全書傳家集卷四十一宋司馬光撰章奏二十四論衙前劄子治平四年九月上臣伏見近者陛下特下詔書以州郡差役之煩使民無敢力田積穀求致厚産至有遺親背義自求安全者令中外臣庶條陳利害委官詳定以聞此誠尭舜之用心生民之盛福也臣竊見頃嵗國家以民間苦里正之役廢罷里正置鄉户衙前又以諸郷貧富不同東郷上户家業千貫亦為里正西郷上户家業百貫以為里正應副重難勞逸不均乃立定衙前人數毎遇有闕於一縣諸郷中選物力最髙者一户補充行之到今已逾十年民間貧困愈甚於舊議者以為一州一縣利害各殊今一概立法未能盡善又里正止管催税人所願為衙前所管官物乃有破壊家産者然則民之所苦在於衙前不在里正今廢里正而存衙前是廢其所樂而存其所苦也又曏者每郷止有里正一人借使有上等十户一户應役則九户休息可以晏然無事專意營生其所以勞逸不均盖由衙前一概差遣不以家業所直為凖若使直千貫者應副十分重難直百貫者應副一分重難則自然均平今乃將一縣諸鄉混同為一選物力最髙者差充衙前如此則有物力人户常充重役自非家計淪落則永無休息之期矣有司但知選差富户為抑强扶弱寛假貧民殊不知富者既盡賦役不歸於貧者將安適矣借使今日家産直十萬者充衙前數年之後十萬者盡則九萬者必當之矣九萬者盡則八萬者必當之矣自非磨㓕消耗至於困窮而為盗賊無所止矣故置郷户衙前以來民益困乏不敢營生富者返不如貧貧者不敢求冨日削月朘有减無増以此為富民之術不亦疎乎臣嘗行於村落見農民生具之微而問其故皆言不敢為也今欲多種一桑多置一牛蓄二年之糧藏十匹之帛鄰里已目為冨室指抉以為衙前矣况敢益田疇葺廬舍乎臣聞其言惄焉傷心安有聖帝在上四方無事而立法使民不敢為乆生之計乎凡為國者患在見目前之利不思永乆之害故初置鄉户衙前之時人未見其患及今然後知之若因循不改日益乆則患益深矣臣愚欲望聖慈特降指揮下諸路州縣相度上件里正衙前鄉户衙前各具利害奏聞隨其所便別立條法務令百姓敢營生計則家給人足庶㡬可望矣取進止言横山劄子治平四年九月十七日上臣竊聞陜西邊臣有上言欲招納趙諒祚國内人户漸圗進取者臣竊惟諒祚驕僣之罪宜伏天誅為日固乆今國家所遭大憂陛下初承寳命公私困匱軍政未講恐征伐四夷之事未易輕議也況諒祚雖内懐桀驁而外存臣禮方遣使者奉表弔祭尚未還國而遽令邊臣誘納其亡叛之民臣恐未足以虧損諒祚而失王者之體多矣伏望陛下具以拊循百姓為先以征伐四夷為後速詔邊臣務敦大信勿納亡叛專謹斥候防其侵軼而已候諒祚咎惡既熟中國兵榖有餘然後奉辭伐罪不為晩也取進止論横山疏治平四年九月二十四日上月日具位臣光昧死再拜上疏皇帝陛下臣聞王者之於戎狄或懐之以徳或震之以威要在使之不犯邊境中國獲安則善矣不必以踰葱嶺誅大宛絶沙漠禽頡利然後為快也竊聞有邊臣言趙諒祚部將輕泥噮側欲以横山之衆攻取諒祚歸命聖徳朝廷已有指揮許令招納臣近者雖曽論列以為非宜尚懼語言疎略未盡本末不敢不再為陛下陳之今進謀者但言其利不言其害臣請試言其害雖逆盛意願陛下勿遽加棄置略賜周覽與進謀者参校其是非焉臣聞戎狄之俗自為兒童則習騎射父子兄弟相與羣處未嘗講仁義禮樂之言也唯以詐謀攻戰相尚而已故其民習於用兵善忍饑渇能受辛苦樂鬭死而耻病終此中國之民所不能為也是以聖王與之校徳則有天地之殊與之校力則未能保其必勝也以舜禹之明征三苖而三旬逆命商髙宗之賢伐鬼方三年乃克漢髙祖之雄傑為冒頓所圍七日不火食國朝以太宗之英武北舉河東南取閩浙若拾地芥加之猛將如雲謀臣如雨天下新平民未忘戰當是之時繼遷背誕太宗以鄭文寳為陜西轉運使用其計䇿假之威權以討之十有餘年卒不能克發関中之民飛芻輓粟以饋靈州及清逺軍為虜所鈔略及經沙磧饑渇死者什七八白骨蔽野號哭滿道長老至今言之猶歔欷酸􅈹及真宗即位㑹繼遷為羅潘友所殺真宗因洗滌其罪弔撫其孤賜之節鉞使長不毛之地訖於天聖明道四十餘年為不侵不叛之臣関中户口滋息農桑豐富由是觀之征伐之與懐柔利害易見矣及元昊背恩國家發兵調賦以供邉役闗中既竭延及四方東自海岱南踰江淮占籍之民無不蕭然苦於科斂自其始叛以至納欵纔五年耳天下困弊至今未復仁宗屈己賜以誓誥冊為國主嵗與之物凡二十五萬豈以其罪不足誅而功可賞哉計不得已也曏者諒祚雖時有偃蹇禮節不備或誘掠熟户驚擾邉民然猶稱臣奉貢未敢顯然自絶也今乃誘其叛臣以圖之縱使誠能梟諒祚之首復靈夏之土以王者之兵言之猶可耻也況其成敗未可知乎臣恐邉事之興生民之苦由此而始也王者之於諸侯叛則討之服則撫之是以諸侯懐徳畏討莫不率從去歳諒祚攻大順城殺掠吏民今春朝貢之使不以時至當是時不能討也今朝廷既赦其罪與其賜物受其使者納其貢獻又從而誘其叛臣激其忿心是常欲其叛而不欲其服也信義賞罰將安在乎議者或以為彼誘我民我誘彼臣何為不可是特閭閻小人之語非知國家大體者也彼僻陋小羌竊誘我民以益其衆乃欲以天子億兆之富而效其所為邪譬如鄰人竊已之財已以正議責之可也豈可復竊彼之財以相報邪臣聞諒祚隂蓄姦謀為日固久招納不逞之人以為謀主誘脅熟户以撤中國之藩籬常有據闗中窺河東之心雖未必能然若縱其毒蠚亦足以為亭彰之患未可以小種之羌孱弱之人待之也國家不幸比遭大憂帑藏空竭闗中之民自經西事以来仍苦鐵錢財力彫弊熟户屢經殺掠亡失大半縱其在者亦懐貳心非復得如景祐寳元之時也當此之際陛下深詔邉吏敦信誓保分界嚴守偹明斥堠以待之猶懼諒祚狼子野心不識恩義乘我釁隙侵噬疆場又況彼不動而擾之不来而召之乎臣又聞虜中間諜所在甚多中國動静毫髪皆知其噮側自程戡在鄜延時已有聲聞云欲歸降自是至今已經數年朝廷屢召邊臣與之謀議外人往徃知之亦有邸吏傳報四方安有虜中獨不覺寤寂然無事曽無誅討之意乎臣竊疑其内挟詐謀未可信也或者諒祚久懐逆計以朝廷待之恩禮優厚無因而發故遣其部將詐降以卜之若朝廷受之則將歸曲而責直得以為背叛之名或者使其部將詐言勢孤力微不能獨制諒祚乞朝廷遣將出師為助而隂設伏兵以徼大利此二者皆未可知也若萬一有之則今日受之正墮其計中矣縱使噮側實有降心葢亦私有忿恨或别負罪惡反側不安欲倚大國之威以逼其主其所部之民未必肯盡從也雖其自言權勢之强甲兵之盛有謀善戰為民所附盡欲自誇以求售耳未必然也借令實能舉兵以與諒祚為敵戰而勝之則是滅一諒祚生一諒祚也若其不勝必引其餘衆南奔中國諒祚悉其境内之兵以追之怒氣直辭長驅入塞當是之時非口舌文移所能解也臣恐朝廷不惟失信於諒祚又將失信於噮側也若噮側餘衆無㡬猶可以縳而送之以緩諒祚之兵然形迹已露諒祚必叛無疑也若噮側餘衆尚多還北不可入南不受窮無所歸必不肯如山遇束手就死將突據邉城以救其命更為中國之患未有涯也陛下不見侯景之事乎臣聞羽翼未成不可以髙飛近者未恱不可以來逺自尭舜禹湯文武之王下至齊桓晉文之霸未有不先治其内而能立功於外者也故孔子曰善人教民七年亦可以即戎矣又曰以不教民戰是謂棄之今陛下新即大位尚未逾年朝廷之政未盡修也封域之中未盡治也内郡無一年之蓄左帑無累月之財民間貧困十室九空小有水旱則化為流殍承平日久戎事不講將帥乏人士卒驕惰上下姑息有如兒戯教閱稍頻則愠懟怨望給賜小稽則揚言不遜被甲行數十里則喘汗不進遇鄉邑小盗則望塵奔北此乃衆人所共知非臣敢為欺㒺也兵法曰知彼知已百戰不殆不知彼知已一勝一負不知彼不知已每戰必殆陛下視今天下如此而欲謀境外之事起兵革之端挑陸梁之虜兾難立之功此臣所為寒心者也為今之計莫若收抜賢俊隨材受任以舉百軄有功必賞有罪必罰以修庶政慎擇監司澄清守令以安百姓屏絶浮費沙汰冗食以實倉庫詢訪智略察騐武勇以選將帥申明階級剪戮桀黠以立軍法料簡驍銳罷去羸老以練士卒完整犀利變更苦窳以精器械俟百軄既舉庶政既修百姓既安倉庫既實將帥既選軍法既立士卒既練器械既精然後惟陛下之所欲為復靈夏取𤓰沙平幽薊收蔚朔無不可也今八者未有其一而欲納邊吏之狂謀信黠虜之詭辭臣恐不能得其降者數百而虜騎大至覆軍殺將邊城晝閉朝廷乃為之宵衣旰食焦心勞思興兵運財以救其急使天下愁困如康定慶厯之時已而卒無可奈何然後忍耻以招之卑辭以諭之尊其名以恱之増其賂以求之其為損也不亦多乎斯乃國之大事安危所繫非特邊境之憂而已願陛下深留聖思勿為後悔乃天下之福也彼進謀者皆非能實為國家斬將搴旗拓土闢境建衛霍甘陳之功也但以利口長舌虚辭大言一時誑惑聖聦欲盗陛下之官職耳他日國家有患不預其憂是豈可哉凡邊境有事則將帥遷官士卒受賞無事則上下寂寂無因徼幸此乃人臣之利非國家之利陛下不可不察也臣光昧死再拜上疏言横山上殿劄子治平四年九月二十七日上臣近曽上言趙諒祚即今稱臣奉貢朝廷不宜納其叛臣以興邊事未審聖意以為如何臣之所言非謂諒祚無罪不可討也又非能保其不叛也但以國家今日内政未修不可遽謀外事故也伏望陛下察臣所言八事舉百職修庶政安百姓實倉庫選將帥立軍法練士卒精器械然後觀四夷之釁亂者取之亡者侮之何患不能復大禹之故迹雪祖宗之宿憤也取進止論不得言赦前事上殿劄子治平四年九月二十七日上臣伏覩今月二十二日手詔應官吏黎庶犯罪在赦前者並依前後勅條施行内外言事按察官司更不得依前舉劾具案取㫖如違並科違制之罪者臣竊惟按察之官以赦前事興起獄訟枉繫平民及以輕淺之罪奏乞不原聖恩禁之誠為大善至於言事之官事體稍異恐難以一例指揮何則御史之職本以繩案百僚糾摘姦邪姦邪之狀固非一日所為國家素尚寛仁數下赦令或一歲之間至於再三若赦前之事皆不得言則其可言者無幾矣萬一有姦邪之臣朝廷不知誤加進用御史欲言則違今日之詔若其不言則陛下何從知之臣恐因此言者得以箝口偷安姦邪得以放心不懼此乃人臣之至幸而非國家之長利也伏望聖慈追改前詔除去言事兩字勿使羣臣得以壅蔽聦明也取進止言張方平劄子治平二年九月二十七日上臣伏見陛下用翰林學士承㫖張方平参知政事方平文章之外更無所長姦邪貪猥衆所共知兩府大臣繫國安危苟非其人為害不細臣職在繩糾不敢塞嘿伏望聖慈追寢方平新命以恊輿論取進止言張方平第二劄子治平四年十月一日上臣近曽上言張方平参知政事不恊衆望臣識淺材下其言固不足采曏者仁宗時包拯最名公直與臺諫官共言方平姦邪貪猥事迹甚多陛下倘欲知方平為賢為不肖乞盡令檢取包拯等言方平章奏及開封府陳升之兩處推勘劉保衡公案并方平在秦州所奏邊上事宜狀即知臣所言非一人之私論也今所言之事尚未䝉施行尋聞除臣翰林學士兼侍讀學士若臣所言果是則方平當罷政事若其非是則臣為譛毁忠賢亦當逺貶今兩無所問而臣復遷翰林仍加美職臣誠愚懵未暁所謂伏望聖慈察臣前言方平事為是為非早賜施行所有新命未敢祗受取進止除兼侍讀學士乞先次上殿劄子治平四年十月二日上臣累日前曽上殿論列張方平事後來續聞除臣翰林學士兼侍讀學士臣智識頑闇不逹聖心以為朝廷大政必當辨是與非人臣事君不可辭難就易是以不勝狂狷復有奏陳伏䝉聖恩曲賜手詔過加奬待諭以至意温宻纎悉提耳諄諄臣雖木石亦將開悟況含氣血得為人類自咎愚迷九死難贖伏地流汗無所容入愧感之極涕泗滂沱誠宜即時奔赴闕廷祗受詔命然臣尚有私懇湏當面陳欲望聖恩先許上殿敷奏禀取聖㫖然後退受勅告不勝死生幸甚取進止乞免翰林學士劄子治平四年十月二日上臣今日上殿曽有敷奏以聖㫖令讀資治通鑑其書巻帙尚少湏至日逐接續編修史籍煩多恐難以應副禁林文字乞免翰林學士一職伏䝉聖恩宣諭但令權免學士院文字臣退自惟念若取學士之名以自榮而不供學士之職竊位素餐孰甚於此在臣愚分深不自安況侍讀學士與翰林學士資序一同俸給仍優伏望聖慈俯賜矜察許臣只以侍讀學士專修資治通鑑如此則材器稍宜職業無曠遂其私願粗免愧心不勝幸甚取進止傳家集巻四十一欽定四庫全書傳家集巻四十二宋司馬光撰章奏二十五辭免館伴劄子熈寕元年二月二十一日上臣近為差館伴北朝人使曽進狀辭免今日䝉聖恩差中使宣諭以人使將至有合商量事節令臣不得辭免早詣中書樞宻院看詳文字者臣竊惟館伴北使乃兩制常程差遣臣所以輒違詔㫖再三固辭者非敢避事偷安誠以人之才性各有能否不可牽強陛下以臣講讀經史粗有可采而使之應對賔客此實非臣所長夫以鄭國區區將有諸侯之事猶使禆諶草創世叔討論子羽修飾子産潤色然後接四方之賔客故鮮有敗事況聖朝包戈偃革專以文德懐撫北朝信使往來議論國事折衝禦侮呼吸成變一言差忒實繫安危臣豈敢不自揣量妄居其任臣曏以名犯北朝諱元不曽接伴亦不曽奉使兩朝事體正如牆面彼中情偽分毫不知加以禀性昏戇遇事褊直今若使之館伴恐語言之際必有遺忘差錯或漏泄機事或抵觸使人萬一如此以貽朝廷之憂雖加臣以重誅終無所益伏望聖慈矜察於兩制中别選差才敏之人館伴北使貴無闕誤取進止辭免裁减國用劄子熈寕元年四月三日上有㫖只委三司差官臣近曽乞别選差官裁减國用奉聖㫖不許辭免臣以非材叨忝美職月受厚俸常自愧恐無有報稱若果能有益於國臣何敢辭竊惟方今國用所以不足者在於用度太奢賞賜不節宗室繁多官職冗濫軍旅不精此五者必須陛下與兩府大臣及三司官吏深思其患力救其弊積以歲月庶幾有效固非愚臣一朝一夕所能裁减也若但欲知慶厯二年裁减國用制度比見今支費不同數目只下三司令供祈聞奏立可盡見臣愚以為不必更差官置局專領此事况臣所修資治通鑑委實文字浩大朝夕少暇難以更兼錢榖差遣取進止請不受尊號劄子熈寜元年七月十七日上臣今月十七日准内降曽公亮等上尊號第三表檢㑹舊例合降不允批答已具牓子審取聖㫖去訖臣竊惟上尊號之禮非先王令典起於唐武后中宗之世遂為故事因循至今伏見太祖開寳元年羣臣上尊號有一統太平字太祖以燕晉未平却而不受以是見聖人之志苟無其實終不肯有其名也太宗端拱二年詔自前所加尊號盡從省去且曰以理言之皇帝二字亦未可兼稱朕欲稱王但不可與諸子同耳羣臣懇請乃受法天崇道四字而已其後終身遂不復増益先帝治平二年辭尊號不受天下莫不稱頌聖徳不幸次年有諂諛之臣建言國家與契丹常有往來書彼有尊號中國獨無臣為深耻於是羣臣復以非時上尊號論者甚為朝廷惜之昔漢文帝遺單于書以尺一牘單于答以尺二寸牘自稱天地所生日月所置匈奴大單于未聞文帝復為勝大之名以加之也學者至今稱文帝謙徳之美未嘗以為可耻也此乃不識大體之言誠不足信耳今羣臣以故事上尊號臣愚以為陛下聦明睿智雖宜享有鴻名然踐阼未久又在亮隂之中考之事體似未宜受陛下誠能斷以聖意推而不居既不允所請仍令更不得上表則頌嘆之聲將洋溢四海此所謂一謙四益後其身而身先可以捨虚名而得實譽者也伏望陛下更加詳擇取進止手詔覽卿來奏深諒忠誠朕方以頻日淫雨甲申地震天威彰著日虞傾禍實憂被此鴻名有慙面目况在亮隂亦難當是盛典誠如卿言今已批降指揮可善為答辭使中外知朕至誠實乃内顧慚懼非是欺衆以邀虚名批答省表具之朕荷祖宗之休撫有四海永惟燭理之不明舉措之不中元元困窮未獲厥所夙夜悼懼如渉春冰屬以美報之禮不敢墮曠故欲躬執犧牲祗見上帝固非昭告成功自營福祿也羣公卿士猥見襃譽欲歸以溢羙増其徽稱抗章勤請至於再三朕乏馨香之徳不能媚于神祗乃甲申地震淫雨為災天威彰著日虞罪悔尚何盛烈之可述鴻名之敢當心焉愧惕流汗霑足況尚在諒闇哀素未忘何宜此時亟舉盛典若斯之議非所敢聞宜體子至誠勿復為奏所請宜不允仍斷來請乞聽宰臣等辭免郊賜劄子熈寕元年八月九日上臣伏覩宰臣曽公亮等奏以河朔菑沴調用繁冗欲望將来大禮畢兩府臣寮更不賜銀絹奉聖㫖送學士院取旨議者或以為兩府所賜無多納之不足以富國而於待遇大臣之禮太薄頗為傷體臣愚竊以為不然古者冡宰制國用視年之豐耗量入以為出固不可於饑饉之時守豐登之法也是故嵗凶年榖不登君膳不祭肺大夫不食梁士飲酒不樂明君臣上下皆當深自貶損以救民急也臣竊惟國家帑藏素已空虚重以今歳河北之地災害特甚曏者慶厯之末河决商胡民田雖傷官倉無損而河北父子相食饑殍蔽野今河决之外加以地震官府民居蕩為糞壤繼以霖雨倉粟腐朽軍食且乏何暇及民冬春之交民必大困甚於慶厯之時國家豈可坐而視之不加賑救乎況復城櫓須脩河防應塞百役並興所費不貲當此之際朝廷上下安得不同心恊力痛加裁損以狥一方之急凡宣布惠澤則宜以在下為先撙節用度則宜以在上為始今欲裁損諸費不先於貴者近者則疎逺之人安肯甘心而無怨乎必若為臣有大勲于天下雖錫之山川土田附庸何為不可若止因郊禮陪位而受數百萬之賞臣竊有所不安矣臣前所謂賞賜無節者此亦其一也雖臣下不辭猶應裁减況其自辭裁之何損乎倘若但務因循姑息度日欲裁損乗輿供奉之物則曰减於制度大為削弱非所以華國欲裁損大臣無功之賞則曰所減無多虧傷大體非所以養賢欲裁損羣下浮冗之費則曰人情不恱恐致生事非所以安衆如此則是國用永無可省之日下民永無蘇息之期必至於涸竭窮極然後止也且君子之所尚者義也小人之所狥者利也為國者當以義襃君子以利恱小人今大臣以災害之故辭錫賚以佐百姓之急義之可襃者也陛下從而聽之乃所以為厚非所以為薄也雖然兩府銀絹止於二萬匹兩未足以救今日之災又國家舊制每遇郊禋大賚四海下逮行伍無不霑洽不可於公卿大夫全無賜予臣愚以為文臣自大兩省以上武臣及宗室自正任刺史以上内臣自押班以上將來大禮畢所賜並宜減半俟他年豐稔自依舊制其文武朝臣以下一切更不減似為酌中臣亦知此物未能富國誠冀國家因此漸思減損其餘浮費自今日為始耳臣素愚戇識慮膚淺所言者皆目前之實狀非竒偉之髙論也伏望陛下更賜裁察若果有可取乞㫁自聖志勿為衆言所移則天下幸甚取進止舉諫官劄子熈寕元年八月十一日上臣今日面奉聖㫖令臣采訪可為諫官者宻具姓名聞奏臣辭不獲命退而惶恐黙自思忖凡擇言事官當以三事為先第一不愛富貴次則重惜名節次則曉知治體具此三者誠亦難材臣愚何足以識别賢能竊謂已試之人差為可信伏見三司鹽鐡副使吕誨累居言職不畏强禦再經謫降執節不囘侍御史吕景外貎和厚内守堅正見得知耻臨義不疑於臣所知之中此兩人似堪其選更乞陛下博訪衆臣裁以聖意取進止論召陜西邊臣劄子熈寜二年六月臣曏任御史中丞日聞國家招納夏國降民曽上言方今百職未舉庶政未修百姓未安倉庫未實將帥未選軍法未立士卒未練器械未精八事不完不可興兵智慮迃疎不合聖心俄而种諤等起綏州之役楊定為夏虜所殺陜西騷然困於餽戍朝廷悔前之失故謫降种諤等以謝夏虜再三招撫方能得其稱臣奉表復遵舊約朝廷特遣使者以誓詔册命及金帛雜物賜之尚未返命今竊聞陛下復召种諤等詣闕引對不知陛下欲何所興為中外聞者無不寒心夫布衣不守信義猶見輕於鄉黨況王者臨御四方當叛則威之服則懐之使信義之明皎如日月若外域幸而臣服無故擾之及其背誕則從而嫗煦之得其臣服又從而擾之其於信義威懐如何哉國家以信義威懐邊庭百有餘年前日种諤等舉而棄之興兵掩其不備以邀一時之功僅能得不食之地百餘里饑虜萬餘人耳今地則歸之虜庭民則逃散略盡朝廷有何所得而發兵守衛轉粟饋餉公私之費以鉅萬計其為失䇿豈不昭然今瘡痍未復憂患未弭臣前所言八事一無所脩虜疑忌中國警偹巳嚴怨毒之心蓄而未發諤等乃欲復為前日所為臣見其無復綏州之功而必有大敗覆沒之事兵連禍結不可救解公私困竭盗賊將生此乃社稷之憂非獨邉鄙之患也孔子曰過而不改是謂過矣伏望陛下留神深念至於再至於三當先脩内政未可輕議用兵實天下幸甚取進止論風俗劄子熈寜二年六月上臣聞國之致治在於審官官之得人在於選士士之嚮道在於立教教之歸正在于擇術是知選士者治亂之樞機風俗之根原也竊見近歳公卿大夫好為髙竒之論喜誦老莊之言流及科場亦相習尚新進後生未知臧否口傳耳剽翕然成風至有讀易未識卦爻巳謂十翼非孔子之言讀禮未知篇數已謂周官為戰國之書讀詩未盡周南召南已謂毛鄭為章句之學讀春秋未知十二公已謂三傳可束之髙閣循守注疏者謂之腐儒穿鑿臆說者謂之精義且性者子貢之所不及命者孔子之所罕言今之舉人發口秉筆先論性命乃至流蕩忘返遂入老莊縱虚無之談騁荒唐之辭以此欺惑考官獵取名第祿利所在衆心所趨如水赴壑不可禁遏彼老莊棄仁義而絶禮學非堯舜而薄周孔死生不以為憂存亡不以為患乃匹夫獨行之私言非國家教人之正術也魏之何晏晉之王衍相與祖述其道宅心事外選舉者以此為賢仕官者以此為業遂使紀綱大壊胡夷並興生民塗炭神州陸沈今若於選士之際用此為術臣懼向去任官之士皆何晏玊衍之徒則政事安得不隳風俗安得不壊正始永嘉之弊將復見於今矣伏望朝廷特下詔書以此戒勵内外公卿大夫仍指揮禮部貢院豫先曉示進士將來程試若有僻經妄說其言渉老莊者雖復文辭髙妙亦行黜落庶幾不至疑誤後學敗亂風俗取進止論責降劉述等劄子熈寜二年九月十一日上臣竊聞知雜御史劉述集賢校理丁諷審刑詳議官王師元皆以執守謀殺刑名差官取勘侍御史劉琦錢顗皆以論列政府公事除員外郎降監酒稅中外聞之無不驚愕臣聞孔子曰守道不如守官孟子曰有言責者不得其言則去此古今之通義人臣之大節也彼謀殺已傷自首刑名天下皆知其非今朝廷既違衆議而行之又罪守官之人臣恐重失天下之心也夫紲食鷹鸇求其鷙也鷙而烹之將何用哉陛下踐阼以來待臣下以寛仁至如皮公弼陛下明知其貪閻充國陛下明知其猥也二人皆以知縣權發遣三司判官公事及得罪而出皆為知州今錢顗所坐不過狂直止以迕犯大臣遂降為監當然則狂直之罪重於貪猥得罪大臣甚於得罪陛下也臣不勝拳拳竊恐來者側目箝口以言為諱威福移於臣下聦明有所壅蔽非國家之福也臣備位近臣親被明詔覩朝廷政事之闕不敢不言伏望聖慈深察愚衷早賜指揮赦劉述等更不取勘其劉琦等别除一般資序差遣庶幾稍息羣議取進止再舉諫官劄子熈寕二年十月七日上臣昨日面奉聖㫖令臣采訪可任諫官者宻具姓名聞奏臣竊見龍圖閣直學士陳薦舊事陛下於藩邸其忠厚質直陛下必素知之直史館蘇軾制䇿入優等文學富贍曉逹時務勁直敢言職方貟外郎王元規自少至長志操堅正所居之官皆著風迹集賢校理趙彦若師民之子強學懿行不減於父平居恂恂如不勝衣遇事剛勁人莫能奪此四人者臣所素知竊謂可偹諫職伏乞聖明更賜裁擇取進止乞優賞宋昌言劄子熈寕二年十月七日上臣聞國家大政在於賞罰若賞罰明當功無不成臣去冬奉勅與張茂則相度二股河及生隄利害當時都水監丞宋昌言建議欲於二股河口西岸新灘上置立土約擗欄水勢令入東流候向去東流漸深北流淤淺即閉塞㫁北流放出御河胡蘆河下流以除恩冀深瀛以西諸州軍水患臣等因得其言尋具此利害奏聞䝉朝廷聴許令修置土約自後昌言同列提舉脩生隄者以䇿非已出百端沮毁以為二股河必不可成不如併力修生隄及李立之赴闕上殿所言陛下所親聞也頼陛下聖明斷在不疑必使之修置土約今秋擗欄得水勢一併入東流其北流尋已閉斷雖頗漂溺損近東滄徳等州民田廬舍然恩冀深瀛以西州軍蒙利亦為不少其宋昌言不可謂之無功今若與同列稱二股河不可成者一例受賞臣竊恐當官之人覩之無所沮勸況昌言因去嵗職當在外河決棗强獨奪一官今若止復舊官則是衆人受賞而昌言獨不得賞也設使曏者修置土約不成或背了二股併入北流其同列豈肯分昌言之罪伏望聖慈察昌言建議之功特與復舊官外更與董役之人等第别加酧奬庶使向去用心向公者朝廷必不負之也取進止再乞資䕃人試經義劄子熈寕三年二月六日上臣先曽起請應資䕃出身人初授差遣者更不試詩只委審官院流内銓試孝經論語大義共三道仍令主判臣僚更將所對義面加詢問若義理精通者特保明聞奏優與差遣稍通者依常調不通者且令脩學候一周年外再試必湏試中方得出官若年四十以上聴依舊制只冩家狀讀律自後不蒙朝廷施行臣今復差知審官院竊見資䕃人初授差遣者令試詩一首實為無益不惟其間有牆面者假手於人徒長姦偽就使自作詩得如曹劉沈宋其於立身治民有何所用古者二帝三王皆立太學之官以教公卿大夫子弟其故何哉盖以其人將嗣守官業苟無徳行道藝則必害及於民故也今若欲使公卿大夫子弟盡肄業於大學則其父兄不常在京師固難齊壹若但使之習業於家而考校於初授差遣之際業不習者不得出官則不煩勸督而人人自勉於學矣此乃事之易行者也嚮若使之盡通詩書禮樂則中材以下或有所不及今若使之習孝經論語倘能盡朞年之功則無不精熟矣此乃業之易習者也然孝經論語其文雖不多而立身治國之道盡在其中就使學者不能踐履亦知天下有周公孔子仁義禮樂其為益也豈可與一首律詩為比哉臣竊以為兹事用力不勤更張甚易而為益稍大别無所損伏望聖慈詳察或有可取乞檢臣前奏特賜施行取進止乞不揀退軍置淮南劄子熈寕三年二月十一日上臣竊聞道塗之言未審虚實或云朝廷欲揀在京禁軍年四十五以上微有呈切者盡減下請給并其妻孥徙置淮南以就糧食若實有此議臣竊以為非宜何則在京禁軍及其家屬率皆生長京師親姻聨布安居樂業衣食縣官為日固乆年四十五未為衰老微有呈切尚任征役一旦别無罪負減其請給徙之淮南是横遭降配也諸軍之内沙汰甚多必恐人情惶惑大致愁怨雖國家承平無事綱紀具張此屬恟恟不安亦無能為患然詔書一下若萬一有道路流言驚動百姓朝廷欲姑務省事復為收還則􅉐失威重向去無以復號令驕兵若遂推而行之則衆怒難犯專欲難成意外之變不可不防梁室分魏博之兵致張彦之亂此近事之可鑑者也故臣願朝廷更當深思熟議未宜遽下此詔也夫水未至而虚為之防水雖不至亦無所害謂水不足憂而不為之防一旦水至則防無所及矣故君子貴於思患而豫防之也且國家竭天下之財養長征兵士本欲備禦邊陲今淮南非用武之地而多屯禁兵坐費衣食是養無用之兵置諸無用之地也又使邊陲常無事則已異日或小有警急主兵之臣必争求益兵京師之兵既少必須使者四出大加召募廣為揀選將數倍多於今日所退之兵舊兵尚請衣糧未去而新兵更添衣糧是棄已教閱經戰之兵而收市井甽畆之人本欲減冗兵而冗兵更多本欲省大費而大費更廣竊恐非計之得者也臣愚伏願朝廷且依舊法每嵗減禁軍有不任征戰者減充小分小分復不任執役者放充百姓聽其自便在京居止但勿使老病者尚占名籍虛費衣糧人情既安於所習皆無怨嗟國家又得其力用不為虚設冗兵既去大費自省在理甚明於事為便臣備位近臣兹事繫國安危不敢不言取進止邇英奏對熈寕元年八月十一日上熈寜元年八月十一日邇英進讀已上問河北災變何以救之光對曰河北大水倉廪漂沒所難得者莫先於食朝廷若降金帛令配賣於民以糴穀則重増煩擾且禾稼蕩盡糴之亦無所得故饑饉之嵗金帛無所用惟食不可一日無耳上曰已令漕五十萬石以賑之可足乎對曰臣聞瀛州所損自百五十萬石所漕者裁能補瀛州三分之一耳上曰然則奈何對曰臣聞河北東西路水所不及州縣頗稔可糴又汴流未絶宜多漕江淮之穀以濟之上又問諫官難得人誰可者對曰臣賤官何敢薦人上固問之對曰臣倉猝不能記容臣退而宻奏上因論治道言州縣長吏多不得人政府不能精擇對曰人不易知天下三百餘州責其精擇誠難但能擇十八路監司使之擇所部知州而進退之知州擇所部知縣而進退之得人多矣今之提轉古方伯州牧之任繫一路休戚當慎擇天下賢才不可但取資叙及酬奬為之也上又問兩府辭郊賚劄子何不呈對以同僚有假故上問兹事何如對曰臣已有奏狀臣所見止如此更乞博訪近臣裁以聖意上曰誰不同對曰獨臣有此愚見他人皆不以為然上曰朕意亦與卿同聽其辭賞乃所以成其美非薄之也然減半無益大臣懇辭不若盡聽之對曰今郊賚下至卒伍皆有之而公卿更無恐於體未順上曰已有帶馬矣對曰求盡納者人臣之志賜其半者人主之恩也後數日光與王珪禹玉王安石介甫同進呈郊賚劄子於延和殿光言方今國用不足災害荐臻節省冗費當自貴近為始宜聴兩府辭賞為便介甫曰國家富有四海大臣郊賚所費無幾而惜不之與未足富國徒傷大體昔常衮辭賜饌時議以為衮自知不能當辭禄今兩府辭郊賚正與此同耳且國用不足非方今之急務也光曰常衮辭禄位猶知亷恥與夫固位且貪禄者不猶愈乎國家自真廟之末用度不足近嵗尤甚何得言非急務邪介甫曰國用不足由未得善理財之人故也光曰善理財之人不過頭會箕斂以盡民財如此則百姓困窮流離為盗豈國家之利耶介甫曰此非善理財者也善理財者民不加賦而國用饒光曰此乃桑羊欺漢武帝之言司馬遷書之以譏武帝之不明耳天地所生貨財百物止有此數不在民間則在公家桑羊能致國用之饒不取於民將焉取之果如所言武帝末年安得羣盗蜂起遣繡衣使者逐捕之乎非民疲極而為盗邪此言豈可據以為實介甫曰太祖時趙普等為相賞賚或以萬數今郊賚匹兩不過三千豈足為多光曰普等運籌幃幄平定諸國賞以萬數不亦宜乎今兩府助祭不過奏中嚴外辦沃盥奉帨巾有何功勤而得比普等乎與介甫爭論乆之禹玉曰司馬光言省費自貴近始光言是也王安石言所費不多恐傷國體安石言亦是也惟陛下裁之上曰朕亦與司馬光同今且以不允答之可也是日適㑹介甫當制遂以上前所言意章批答引常衮事以責兩府兩府亦不復辭明日邇英講讀罷上獨留介甫與語兩府不敢先出以俟之至晡後乃出不數日介甫参知政事傳家集巻四十二欽定四庫全書傳家集巻四十三宋司馬光撰章奏二十六上體要疏熈寜二年八月五日上月日具位臣司馬光謹昧死再拜上疏皇帝陛下臣准御史臺牒伏奉四月二十日詔勅傳曰近臣盡規以其榮恥休戚與上同也今在此位者視朕過失與朝廷政事之闕黙而不言乃或私議竊歎若以為其責不在已夫豈皆習見成俗以為當然其亦有含章懐寳待唱而發者也今日百度隳弛風俗偷惰薄惡災異譴告不一此誠忠賢助朕憂惕以剏制改法救弊除患之時宜令侍從官自今視朕過失與朝廷政事之闕無有巨細各具章奏極言無隠噫言善而不用朕有厥咎導之而弗言爾為不恭朕將用此考察在位所以事君之實明黜陟焉臣以駑下之材自仁宗皇帝時䝉擢在侍從服事三朝恩隆徳厚隕身喪元不足為報雖訪問所不及猶將披肝瀝膽以効其區區之忠況聖意采納之勤督責之嚴諄諄如此臣敢營私避怨匿情愛已不為陛下别白當今之切務庶㡬少補萬分之一邪臣聞為政有體治事有要自古聖帝明王垂拱無為而天下大治者凡用此道也何謂為政有體君為元首臣為股肱上下相維内外相制若網之有綱絲之有紀故詩云勉勉我王綱紀四方又云豈弟君子四方之綱古之王者設三公九卿二十七大夫八十一元士以綱紀其内設方伯州牧卒正連帥屬長以綱紀其外尊卑有叙若身之使臂臂之使指莫不率從此為政之體也何謂治事有要夫人智有分而力有涯以一人之智力兼天下之衆務欲物物而知之日亦不給矣是故尊者治衆卑者治寡治衆者事不得不約治寡者事不得不詳約則舉其大詳則盡其細此自然之勢也益稷曰元首明哉股肱良哉庶事康哉言君明則能擇臣臣良則能治事也又曰元首叢脞哉股肱惰哉萬事墯哉言君親細務則臣不盡力而事廢壊也立政曰文王㒺攸兼於庶言庶獄庶慎惟有司之牧夫是訓用違庶獄庻慎文王㒺敢知于兹言文王擇有司而任之其餘皆不足知也康誥曰庸庸祗祗威威顯民言文王用其可用祗其可祗刑其可刑專明此道以示民也是故王者之職在於量材任人賞功罰罪而已苟能謹擇公卿牧伯而屬任之則其餘不待擇而精矣謹察公卿牧伯之賢愚善惡而進退誅賞之則其餘不待進退誅賞而治矣然則王者所擇之人不為多所察之事不為煩此治事之要也臣竊見陛下日出視朝繼以經席將及日中乃還宫禁入宫之後竊聞亦不自閒省閲天下奏事羣臣章疏逮至昏夜又御燈火研味經史博觀羣書雖中宗髙宗之不敢荒寕文王之日昊不食臣以為不能及也然自踐阼以來孜孜求治於今三年而功業未著者殆未得其體要故也祖宗創業垂統為後世法内則設中書樞宻院御史臺三司審官審刑等在京諸司外則設轉運使知州知縣等衆官以相統御上下有叙此所謂綱紀者也今陛下好使大臣奪小臣之事小臣侵大臣之職是以大臣解體不肯竭忠小臣諉上不肯盡力此百官所以弛廢而萬事所以隳頽者也而陛下方用為致治之本此臣之所大惑也臣微賤不得盡知朝廷之事且以耳目所接近日數事臣所知者言之其餘陛下可以類求也昔漢文帝問陳平天下一嵗决獄及錢榖出入㡬何平曰陛下即問決獄責廷尉問錢榖責治粟内史必也使卿大夫各得任其職此乃宰相事也若平者可謂能知治體矣今之兩府皆古宰相之任也中書主文樞宻主武若乃百官之長非其人刑賞大政失其宜此兩府之責也至於錢榖之不充條例之不當此三司之事也陛下苟能精選曉知錢榖憂公忘私之人以為三司使副判官諸路轉運使各使久於其任以盡其能有功則進無功則退名不能亂實偽不能掩真安民勿擾使之自富處之有道用之有節何患財利之不豐哉今乃使兩府大臣悉取三司條例别置一局聚文士數人與之謀議改更制置三司皆不與聞臣恐所改更者未必勝於其舊而徒紛亂祖宗成法考古則不合適今則非宜吏縁為姦農商失業數年之後府庫耗竭於上百姓愁困於下衆心離駭將不復振矣且兩府於天下之事無所不緫若百官之職皆使兩府治之則在上者不勝其勞而在下者為無所用矣又監牧使主飬馬四園苑主課利今乃使監牧使不屬羣牧司四園苑不屬三司提舉司則在下者各得專權自恣而在上者為無所用矣陛下方欲納天下於大治而使百官在上者不委其下在下者不禀其上能為治乎若此之類臣竊恐似未得其體也凡天下之事在一縣者當委之知縣在一州者當委之知州在一路者當委之轉運使在邊鄙者當委之將帥然後事乃可集何則久任其位識其人情知其物宜賞罰之權足以休戚所部之人使之信服故也今朝廷毎有一事不委之將帥監司守宰使之自為方略責以成效而施其刑賞常好别遣使者銜命奔走旁午於道所至徒有煩擾之弊而於事未必有益不若勿遣之為愈也夫事之利害吏之能否皆非使者所能素知不免臨時詢采於人所詢者或遇公明忠信之人猶僅能得其一二或遇私闇姦險之人則是非為之倒置矣此二者交集於前而使者不能猝辨也是以往徃害事而少能為益非將帥監司守宰皆賢而使者皆愚也累嵗之講求與一朝之議論積久之采察與目前之毁譽精粗詳略其勢不同故也其有居官累嵗而不知利害臨人積久而不知能否或雖知利害而不能變更雖知能否而不能黜陟此乃愚昧私曲之人朝廷當察而去之更擇賢者以代其位不當數遣使者擾亂其間使不得行其職業也又庸人之情苟䇿非已出則媢嫉沮壊惟恐其成官吏若是者十常五六借使使者所規畫曲盡其宜在彼之日其當職之人已怏怏不恱不肯同心以助其謀恊力以成其事曰朝廷自遣專使治之我何敢與知及返命之日彼必敗之於後曰使者既謀而授我我今竭力而成之功悉歸於首謀之人我何有哉此所以謂不若毋遣使者而屬任當職之人為愈也夫使者所以通逺邇之情固不可無然今之轉運使即古使者之任苟得人而委之賢於暫遣使者逺矣若監司自為姦慝貪縱或有所隠蔽欺㒺或為部内之人所訟或所謀畫之事未得其宜朝廷欲察其罪惡審其虚實判其曲直決其是非然後别遣使者案之若案得其實監司有罪則當刑不才則當廢豈有但已者也今毎有一事朝廷輒自亰師遣使者往治之是在外之官皆無所用也使者既代之治事而當職之人亦無所利無所廢是只使之拱手旁觀偷安竊祿者矣若此之類臣竊恐似未得其體也今朝廷之士左右之臣皆曰陛下聪明剛斷威福在已太平之功可指日而致臣愚竊獨以為未也臣聞古之聖帝明王聞人之言則能識其是非故謂之聰觀人之行則能察其邪正故謂之明是非既辨邪正既分姦不能惑佞不能移故謂之剛取是而捨非誅邪而用正確然無所疑故謂之斷誅一不善而天下不善者皆懼故謂之威賞一有功而天下有功者喜故謂之福今陛下聦眀剛㫁則誠體之矣欲收威福之柄則誠有其志矣然於所以為之之道尚或有所未盡故臣以為太平之功未可期也夫帝王之道當務其逺者大者而略其近者小者國之大事當與公卿議之而不當使小臣参之四方之事當委牧伯察之而不當使左右覘之倘公卿牧伯尚不能擇賢者而任之小臣左右獨能得賢者而使之乎若苟為不賢則險詖私謁無不為已今陛下好於禁中出手詔指揮外事非公卿所薦舉牧伯所糾劾或非次遷官或無故廢罷外人疑駭不知所從此豈非朝廷之士左右之臣所謂聪明剛斷威福在已者邪陛下聞其言而信之臣竊以為過矣夫公卿所薦舉牧伯所糾劾或謂之賢者而不賢謂之有罪而無罪皆有迹可見責有所歸故不敢大為欺㒺若姦臣宻白陛下令陛下自為聖意以行之則威福集於私門怨謗歸於陛下矣安得謂之威福在陛下邪且陛下曏時中詔所指揮者率非大事至於兩禁美官邊藩將帥省府職任諸路監司此皆衆人之所希求治亂之所繫屬當除授之際竊恐未必一一出聖志也若乃姦邪貪猥之人陛下所明知而黜去者或更改官而升資或不久復進用然則威福之柄果不在陛下而陛下偶未之思也以此觀之面譽陛下聦明剛㫁威福在已太平可立致者非愚則諛不可不察也陛下必欲威福在已曷若謹擇公卿大臣明正忠信者留之愚昧阿私者去之在位者既皆得其人矣然後凡舉一事則與之公議於朝使各言其志陛下清心平慮擇其是者而行之非者不得復奪也凡除一官亦與之公議于朝使各舉所知陛下清心平慮擇其賢者而用之不肖者不能復爭也如此則謀者舉者雖在公卿大臣而行之用之皆在陛下安得謂之威福不在已邪陛下此之不為而顧彼之久行臣竊恐似未得其要也夫三人羣居無所統一不散則亂是故立君以司牧之羣臣百姓勢均力敵不能相治故從人君決之人君者固所以決是非行刑賞也若人君復不肯決當使從誰決之乎夫人心不同如其面焉國家凡舉一事朝野之人必或以為是或以為非凡用一人必或以為賢或以為不肖此固人情之常自古而然不足怪也要在人主審其是非而取捨之取是而捨非則安榮取非而捨是則危辱此乃安危榮辱之所以分也是以聖王重之故博謀羣臣下及庶人然而終決之者要在人君也古人有言曰謀之在多㫁之在獨謀之多故可以觀利害之極致斷之獨故可以定天下之是非若知謀而不知斷則羣下人人各欲逞其私志斯衰亂之政也詩云謀夫孔多是用不集發言盈庭誰敢執其咎如匪行邁謀是用不得於道哀哉為猷匪先民是程匪大猷是經維邇言是聴維邇言是争如彼築室於道謀是用不潰於成此言周室之衰人臣不知先王之大道務争近小之事人君不能定其可否而事終無成也漢世國家有大典禮大政令大刑獄大征伐必下公卿大夫博士議郎議其議者固不能一必有参差不齊者矣於是天子稱制決之曰丞相議是或曰廷尉當是而羣下厭然無有不服者矣今陛下聴羣臣各盡其情以議事此誠善矣然終不肯以聖志裁決遂使羣臣有尚勝者以巧文相攻辯口相擠至於再至於三互相反覆無有限極臣愚深恐虧朝廷之政體損陛下之明徳流聞四方取輕夷狄非嘉事也夫天下之事有難決者以先王之道揆之若權衡之於輕重規矩之於方圓錙銖毫忽不可欺矣是以人君務明先王之道而不習律令知本根既殖則枝葉必茂故也近者登州婦人阿云謀殺其夫重傷垂死情無可愍在理甚明已傷不首於法無疑中材之吏皆能立斷事已經審刑院大理寺刑部斷為死罪而前知登州許遵文過飾非妄為巧說朝廷命兩制定奪者再命兩府定奪者再勅出而復收者一收而復出者一争論縱横至今未定夫以田舍一婦人有罪在於四海之廣萬㡬之衆其事之細何啻秋毫之末朝廷欲斷其獄委一法吏足矣今乃紛紜至此設更有可疑之事大於此者將何以決之夫執條據例者有司之職也原情制義者君相之事也分争辨訟非禮不決禮之所去刑之所取也阿云之事陛下試以禮觀之豈難決之獄哉彼謀殺為一事為二事謀為所因不為所因此苛察繳繞之論乃文法俗吏之所争豈明君賢相所當留意邪今議論嵗餘而後成法終於棄百代之常典悖三綱之大義使良善無告姦凶得志豈非狥其枝葉而忘其本根之所致邪若此之類臣竊恐似未得其要也此皆衆人之所私議竊嘆而莫敢明言者臣獨以受恩深重不顧斧鉞為陛下言之惟聖明裁察臣光昧死再拜上疏辭樞宻副使劄子熈寕三年二月十二日上臣准閤門告報已除臣樞宻副使續准勾當御藥院陳承禮傳宣令臣即今受勅告者臣賦分樸愚不通時務近日以來加以衰疾恪居舊職猶恐隳敗況乃拔擢待之不次竊惟宥宻之地日侍訏謨内訓六師外撫四海用人當否繫國安危豈臣無似所能堪稱伏望聖慈更擇賢材俾居其任聴臣且守舊職取進止辭樞宻副使第二劄子熈寕三年二月十二日上臣准勾當御藥院黎永德奉宣聖㫖令臣即今入見者臣屢違嚴詔當伏重誅但以聞命以來揣分已熟自幼及長頗讀經史捨此之外一無所長當世之務懵不通曉常日置之閒官僅脫曠敗尚以屬文不工剸劇非長翰林審官每欲辭免況於樞府要地任重責大一日失職則死及之臣雖至愚粗知自愛陳力就列古人所韙是以寜冒違詔之罪不敢當竊位之譏伏望聖慈察其悃欵決非虚飾特賜寢罷新命止守舊職天地更生之惠下臣莫大之幸也取進止辭樞宻副使第三劄子熈寕三年二月十九日上臣前者兩曽辭免樞宻副使未奉俞㫖竊慮區區之誠未能上逹須至詳悉復有奏陳臣聞人之材性各有能有不能人主量材然後授官人臣審能然後受事是以官不曠而事無敗也臣幸生承平之時家世為儒臣自髫齔至於弱冠杜門讀書不交人事仕宦以來多在亰師少厯外任故於錢穀刑獄繁劇之務皆不能為況於軍旅固所不習獨於解經述史及以愚直補過拾遺不避怨怒則庻幾萬一或有可取是以每於拜官之際辭所不能而不辭其所能曏者除開封府推官以繁劇曽辭後除修起居注知制誥翰林學士以文采不工曽辭除龍圖閣直學士以久在諫職無效曽辭再除翰林學士兼侍讀學士以言事未了曽辭除史館修撰以方修資治通鑑恐朝廷修國史難以兩處供職曽辭自餘除國子監直講館閣校勘史館檢討集賢校理直祕閣起居舍人同知諫院天章閣待制兼侍講知諌院權御史中丞此皆朝廷清要之職除書始下臣即時受命未甞輒辭所以然者自度駑鈍可以䇿勵不至曠敗故也天下之人見臣屢辭恩命或以為不慕榮貴或以為飾詐邀名是皆不知臣者也臣自幼習賦詩論䇿應舉就試每三年一次投狀乞磨勘豈不慕榮貴者邪臣若隂有營求陽為辭避乃可謂之飾詐邀名陛下察臣何嘗如此豈飾詐邀名者邪臣之愚心正欲辭所不能而已今二府之任自非天下英傑之士不可輕處豈臣愚淺下材所能堪稱或遇國家大事叅陪末議有毫釐之差使陛下有旰食之憂以累知人之哲臣雖伏質横分不足塞責加之素有目疾不能逺視近日以來頗多健忘居常供職猶懼廢闕況以衰病當兹重任是用披肝瀝膽昧冐上陳違犯詔㫖至於再三觸法抵罪不自知覺伏望聖慈特賜矜察依臣前奏追還新恩俾守舊職不勝憂慙危切之誠臨紙叩頭俯伏俟命取進止辭樞宻副使第四劄子熈寕三年二月二十一日上臣准勾當御藥院陳承禮傳宣令臣即今入見者臣仰煩聖恩重沓如此雖頑如木石亦當遷變然臣固守愚志不移者誠以荷盛徳者必有以酧報居重位者不可以無功臣自惟立朝材器短淺一無所用獨有補過拾遺可裨萬一方今為天下患者唯有制置三司條例司及諸路提舉勾當常平廣惠倉使者若陛下朝發一詔罷之則夕無事矣故臣不量力勢輕用上陳倘陛下以臣言為是乞早賜施行若以為非則臣乃狂愚之人於今英俊滿朝而擢用狂愚之人使汚宥宻之地豈不為聖政之累也伏望聖慈追還樞宻副使恩命令臣且供舊職取進止辭樞宻副使第五劄子熈寕三年二月二十二日上臣准勾當御藥院李舜舉傳宣令臣即今赴閤門受勅告者陛下聖恩無窮愚臣辭避不已盡下之徳愈盛慢上之罪愈深憂惶失圖無地自處臣竊惟陛下今兹不次用臣必以識慮為小有可采臣亦以受陛下非常之知不可以全無報效是以乞罷制置三司條例司及諸路提舉勾當常平廣惠倉使者若陛下果能行此勝於用臣為兩府臣若得此言果行勝於居兩府之位倘或所言皆無可采臣獨何顔敢當重任伏望聖慈矜察更不復遣使臣宣召追還樞宻副使恩命庶使賤臣差獲自安取進止貼黄李舜舉傳聖㫖諭臣以樞宻院本兵之地各有職分不當更引他事為辭臣今若已受樞宻副使勅告即誠如聖㫖不敢更言軄外之事今未受恩命猶是侍從之臣於朝廷闕失無不可言者所以區區貪進小忠庻㡬少補聖政之萬一況所言二事並是去年已曽上言以其無效所以不敢當今日新恩非為侵官乞聖明裁察兼臣右膝下見患一瘡有妨拜起入見未得伏望聖慈更不差使臣宣召臣只候膝瘡稍愈自乞入見面奏懇誠辭樞宻副使第六劄子熈寕三年二月二十七日上尋得㫖聴許臣伏准勾當御藥院劉有方傳宣撫問兼問臣取幾日入見令早入者聖恩深厚不忘微賤存恤勤至臣螻蟻之命無足報塞惶恐無措伏念臣即今膝瘡雖稍減可尚未全愈有妨拜起未知可以入見之日不獨如此兼為臣近曽上疏言乞罷制置三司條例司及追還諸路常平廣惠倉使者未聞朝廷少賜采錄但聞條例司愈用事催散青苗錢愈急中外人情愈遑遑不安臣當此際獨以何心敢當髙位故寜被嚴譴未敢輒出臣聞古者國有大事謀及卿士謀及庶民叅酌下情與衆同欲是以事無不當令無不行未嘗有四海之内卿士大夫農商工賈異口同辭咸以為非獨信二三人之偏見而能成功致治者也伏望陛下出臣近所上疏宣示中外臣庻使共決是非若臣言果是乞早賜施行若臣言果非乞更不差使臣宣召早收還樞宻副使勅告治臣妄言及違慢之罪明正刑書庻使是非不至混殽㣲臣進退有地不為天下之所疑怪取進止傳家集巻四十三欽定四庫全書傳家集巻四十四宋司馬光撰章奏二十七乞罷條例司常平使䟽熈寜三年二月二十日上月日具位臣司馬光謹昧死再拜上䟽皇帝陛下臣䝉聖㤙除樞密副使仍屢遣陳承禮等趣臣就職徳澤汪洋天隆地厚非臣隕身糜骨所能報稱然臣竊惟陛下所以用臣之意盖察臣狂直庶幾有補於國家臣所以事陛下之心亦不過竭其愚衷以禆聖徳之萬一若陛下徒以禄位榮臣而不取其言則是以天官私非其人臣徒以禄位自榮而不能救生民之患則是盗竊朝廷名噐以私其一身誠恐上累陛下之至公下䘮㣲臣之素守此臣所以屢違詔命不敢祗受者也臣伏見陛下天縱英明厲精求治思得嘉謀以新美天下而建畫之臣不能仰副聖意思慮未熟講議未精徒見目前之小利不顧永乆之大害憂政事之不治不能輔陛下修祖宗之令典乃更變亂先王之正刑患財利之不足不能勸陛下以恭儉節用乃更遣聚斂之臣誅剥齊民設官則以冗増冗立法則以苛益苛使四海危駭百姓騷然猶且堅執而行之不肯自以為非也臣先曽上䟽言不當設制置三司條例司又言天下之事當委之轉運使知州知縣不當别遣使者擾亂其間又甞因經筵侍坐言散青苗錢不便自後朝廷更遣使者四十餘人分行天下以提舉勾當常平廣惠倉相度差役農田水利為名其實專使之散青苗錢臣竊自疑智識淺短不足以知天下變通之務又疑因臣之言激怒建畫之臣使行之更力由是閉口不敢復言今行之纔數月中外鼎沸皆以散青苗錢為不便然後臣乃敢發口復言彼言青苗錢不便者大率但知所遣使者或年少位卑倚勢作威陵轢州縣搔擾百姓止論今日之害耳臣所憂者乃在十年之後非今日也夫民之所以有貧冨者由其材性愚智不同冨者智識差長憂深思逺寜勞筋苦骨惡衣菲食終不肯取債於人故其家常有贏餘而不至狼狽也貧者啙窳偷生不為逺慮一醉日冨無復贏餘急則取債於人積不能償至於鬻妻賣子凍餒填溝壑而不知自悔也是以冨者常假貸貧民以自饒而貧者常假貸冨民以自存雖苦樂不均然猶彼此相資以保其生今縣官乃自出息錢以春秋貸民民之冨者皆不願取貧者乃欲得之提舉官欲以多散為功故不問民之貧冨各隨户等抑配與之冨者與債仍多貧者與債差少多者至十五緍少者不減千錢州縣官吏恐以逋欠為負必令貧冨相兼共為保甲仍以冨者為之魁首貧者得錢隨手皆盡將来粟麥小有不登二稅且不能輸况於息錢固不能償吏督之急則散而之四方冨者不去則獨償數家所負力竭不逮則官必為之倚閣春債未畢秋債復来歴年寖深債負益重或值凶年則流轉死亡幸而豐稔則州縣之吏併催積年所負之債是使百姓無有豐凶長無蘇息之期也貧者既盡冨者亦貧臣恐十年之外冨者無幾何矣冨者旣盡若不幸國家有邉隅之警興師動衆凡粟帛軍須之費將從誰取之臣不知今者天下所散青苗錢凡幾千萬緡若民力旣竭加以水旱之災州縣之吏果有仁心愛民者安得不為之請於朝廷乞因郊赦而除之朝廷自祖宗以来以仁政養民豈可視其流亡轉死而必責其所負其勢不得不從請者之言也然則官錢幾千萬緡已放散而不返矣官錢旣放散而百姓又困竭但使閭胥里長於收督之際有乞取之資此可以謂之善計乎且常平倉者乃三代聖王之遺法非獨李悝耿夀昌能為之也糓賤不傷農糓貴不傷民民頼其食而官收其利法之善者無過於此比来所以隳廢者由官吏不得人非法之失也今聞條例司盡以常平倉錢為青苗錢又以其糓換轉運司錢是欲盡壊常平専行青苗也國家每遇凶年供軍倉自不能足用固無羨餘以濟飢民所頼者止有常平倉錢糓耳今一旦盡作青苗錢散之向去若有豐年將以何錢平糴若有凶年將以何糓賙贍乎臣竊聞先帝甞出内藏庫錢一百萬緡助天下常平倉作糴本前日天下常平倉錢糓共約一千餘萬貫石今無故盡散之佗日若思常平之法復欲收聚何時得及此數乎臣以謂散青苗錢之害猶小而壊常平倉之害尤大也今國家每有大費三司所不能供者陛下輒取内藏庫物以給之彼内藏庫者乃祖宗累世之所蓄聚以備軍旅非常之用也使其物常如泉源流出於庫無有窮竭之時則可矣若本皆斂之於民以實之則有時而空矣昔漢文帝欲作露臺召匠計之直百金上曰百金中人十家之産也吾何以臺為太宗時兖王甞作假山召僚屬置酒觀之翊善姚坦獨俛首不視王强使視之坦曰坦惟見血山耳不見假山王驚問其故坦曰坦在田舍時見州縣督稅里胥臨門捕人父子兄弟送縣笞撻血流滿身愁苦之聲不可忍聞此假山皆民租賦所為非血山而何是時上亦自為假山聞之遽命毁之今陛下令薛向於江淮為貿易以三百萬緡畀之又散青苗錢數千萬緡其餘五十萬三十萬者固不足數爾其為露臺假山之費不亦多乎陛下聦明仁儉固不減於漢文帝及太宗然而視棄財物如糞土者盖未知其所從来皆出於生民之膏血耳陛下若終信條例司所言推而行之不肻變更以循舊貫十年之外冨室旣盡常平已壊帑藏又空不幸有方二三千里之水旱餓殍滿野加以四夷侵犯邉境羽書猝至戎車塞路攻戰不已轉餉不休當是之時民之羸者不轉死溝壑壮者不聚為盗賊将何之矣秦之陳勝呉廣漢之赤眉黄巾唐之黄巢皆窮民之所為也大勢旣去雖有智者不能善其後矣臣竊惟太祖太宗躬擐甲胄櫛風沐雨䟦履山川䝉犯矢石以為子孫成光明盛大之業如此其羙也陛下試取臣所進歴年圖觀之自周末以来至于國初一千三百六十有二年其間亂離板蕩則固多矣至於中外無事不見兵革百有餘年如國朝之盛者豈易得乎此臣所以尤為陛下痛惜者也書曰民不静亦惟在王宫邦君室臣竊觀方今四夷親附邉鄙不聳五糓和熟盗賊稀簡是冝為天下和樂無事之時而中外恟恟人不自安者無佗故也正由朝廷有制置三司條例司諸路有提舉勾當常平廣惠倉使者争獻謀畫各矜智巧變更祖宗法度侵奪細民常産掊斂財利以希恩寵非獨此青苗一事而已至於欲計畝率錢顧人充役決汴水以種稻及澆漑民田及欲洩三十六陂水募人耕佃若此之類不可悉數道路之人共所非􅀏而條例司自以為髙竒之策書以授常平使者必欲行之天下恐其興作之不已皆如青苗為害於民也故小大遑遑不敢自安苟不罷廢此局則生民必無休息之期矣陛下誠能昭然覺悟采納臣言罷制置三司條例司及追還諸路提舉勾當常平廣惠倉使者其官貟並送審官院與合入差遣青苗錢已散者令州縣候豐熟日催收本錢更不取利未散者母得更散其常平倉錢糓依舊封樁令提㸃刑獄司管勾則太平之業依然復故矣兹事明如白黒易如反掌陛下何憚而不為也如此臣雖盡納官爵但得為太平之民以終餘年其幸多矣苟言不足采陛下雖引而寘諸二府徒使天下指臣為貪榮冒寵之人未審陛下将何所用之不勝慺慺狂愚之誠惟聖明裁處臣光昧死再拜上䟽請自擇臺諫劄子熈寜三年四月十六日上臣竊見近日臺諌上言制置三司條例司害民及吕惠卿姦邪者率被責降或更加以惡名如吕公著告辭云乃誣方鎮有除惡之謀中外聞者無不駭愕竊惟朝廷之意無佗止欲懲戒來者使不敢復言耳國家置臺諌官以為天子耳目唯恐政事有闕失百姓有疾苦大臣專恣左右姦邪天子深居九重不能得聞故也今臺諫官稍有懐剛直之志畏天下公議憂念朝廷哀閔百姓忤犯大臣刺譏左右者陛下輒罪而逐之更使大臣自擇所親以代其任萬一又為公論則又逐之是必得庸懦阿諛不知廉耻附下罔上背公死黨之人然後止耳若言路皆此等之人則禁闥之外陛下耳目之所不及者雖有至大之事廹切之禍陛下何從知之如此豈宗廟社稷之福也晏子曰君所謂可臣亦曰可君所謂否臣亦曰否若以水濟水誰能食之今陛下使大臣自擇臺諫官大臣又取同於已者存之異於已者去之然則陛下獨與大臣為天下足矣何必更置臺諫官也且條例司之害民吕惠卿之姦邪天下之人誰不知之獨陛下與王安石未之寤耳豈可更為之黜逐臺諫以長其威福成其氣勢臣竊為陛下寒心今臺諌官已被逐者臣不敢留唯願陛下自擇公正剛直者布之言路以明四目逹四聦勿使為羣下所欺蔽則天下幸甚臣受陛下過分之恩不敢塞黙雖死怨讎之手猶賢於竊禄偷生者也取進止論李定劄子熈寜三年五月二日上臣竊見近者朝廷除秀州推官李定為監察御史裏行知制誥李大臨蘇頌等累次封還詞頭數日来外間皆言朝廷已為之寝罷今日復聞劄下舍人院須令草詞臣竊意朝廷知大臨等旣累次封還詞頭今復草之則為反覆必難奉詔因欲以違命之罪罪之使今後凡朝廷所行政令羣下無敢立異者若果如此則百執事之人自非偷合苟容者皆不得立於朝政令或有得失陛下復何從知之晏嬰所謂以水濟水賈山引秦之季世以戒漢文帝者正患其如此耳臣前論逐臺諌官今又論大臨等非敢私此數人正為國家惜言路之絶耳伏望陛下審思而慎行之勿使聦明遂至壅蔽則天下幸甚取進止貼黄國家不次用人固無常法然必使衆心厭服然後為羙是以堯舜非不聦明也其命官皆先謀岳牧旣衆言僉同復明試以功而後用之故舉不失能而上下雍熈也臣素不識李定實不知其行能何如陛下果知其賢何不且試之以漸俟其功效顯著衆皆知之然後不次擢用則誰曰不可何必今日與臣下力較勝負殆非人君廣大之體也乞免永興軍路苗役錢劄子熈寜三年十一月二日上臣奉勅差充永興軍一路安撫使臣竊見陜西百姓自城綏州以来供應諸般科配及支移稅賦往近邉州軍日近復有環慶事宜加之今年亢旱五稼不熟人户流移者已間不少國家所冝汲汲存恤使人户安集臣伏見先所散青苗錢貧破百姓為患不細臣已曽累次上言不敢重煩聖聼今又聞議者欲令州縣将諸色役人一時放罷官為顧人祗應却令人户均定免役錢隨二稅送納乃至單丁女户客户寺觀等並令均出若果行此法其為害必又甚於青苗錢何則上等人户自来更互充役有時休息今嵗嵗出錢是常無休息之期也下等人户及單丁女户等從来無役今盡使之出錢是孤貧鰥寡之人俱不免役也若錢少則不足以顧人若錢多則須重斂於民顧人不足則公家闕事重斂於民則衆心愁怨自古以来徭役皆出於民今一旦變之未見其利也且受顧者皆浮浪之人使之主守官物則必侵盗使之幹集公事則必為姦事發則挺身逃亡無有田宅宗族之累建議者亦自知其不可乃云若顧召人不足即依例輪差支與逐䖏所定顧錢足了役事則自當有人應募今既無人應募必是錢少不足充役是徒有免役之名而役猶不免但無故普増數倍之稅也彼青苗錢以債與民可取其息已是困民之法今又使横出數倍之稅民安有不困蹙者哉以冨庶之域猶不能堪况陜西累嵗奉邉民力彫弊豈可復為無益之事以擾之乎伏望聖慈特免永興軍一路青苗免役錢以愛惜民力專奉邉費其餘路分則繫自朝廷裁酌取進止乞不令陜西義勇戍邉及刺充正兵劄子熈寜三年十一月上臣先任諌官日伏見國家棟刺陜西義勇臣累曽論列以為徒使百姓愁苦無益於用近聞環慶路用義勇與西賊戰鬭望風奔潰死傷甚多致主将陷没此義勇不可用之明騐也臣竊聞議者猶欲教閲義勇以抗西賊若止令州縣教閲守䕶郷土猶於人情不至大擾若發以戍邉或如慶厯中刺為正兵則衆人覩環慶二敗譬如無罪往就死地恐於人情大有不安國家旣重賦斂以盡其財又逼之戰鬭以絶其命是驅良民使為盗賊也彼為官軍則惜生故望風退走彼為盗賊則必死自可以一敵百臣恐今日教之挽射擊刺乃佗日為盗之資也廟堂之議臣所不得知萬一有之詔下之日臣論列不及况當逺離朝廷故不得不先事而言也取進止乞留諸州屯兵劄子熈寜三年十一月上臣奉勅充永興軍一路兵馬都緫管安撫使臣竊聞本路十州所管屯駐禁軍至少大率皆是縁邉就糧兵士常時分為上下畨有一半在逐州或遇邉上稍有警急則盡皆抽去逐州並無守把兵士臣竊惟天下事不可忽必須思患豫防戎狄犯邉雖當竭力捍禦然腹内州軍豈可全無武備况逐州皆有軍資甲仗市邑民居萬一犬羊奔突間諜内應或盗賊乗虚姦人竊發其本州官吏手下無兵雖有智勇将安所施臣愚以為逐州冝各添一指揮禁軍屯駐内永興軍為關中根本冝添兩指揮若朝廷别無兵士可以差撥只乞於縁邉就糧兵士内依此數目皆留在逐州屯駐邉上更不得勾抽所貴緩急不至失備取進止傳家集巻四十四欽定四庫全書傳家集巻四十五宋司馬光撰章奏二十八諌西征䟽熈寜四年正月一日上月日具位臣光謹昧死再拜上䟽皇帝陛下臣以不材誤承朝廷委用待罪長安兼領一路十州兵民大柄朝辭之日伏蒙陛下面諭以凢邉防事機及朝廷得失有所聞見令一一奏聞臣受命以来且愧且懼所愧者聖知深厚責任至重所懼者智識淺短無以堪稱夙夜疚心不敢寜居臣自入境以来見流移之民道路相望詢訪閭里皆云今夏大旱禾苗枯瘁河渭以北絶無所收獨南山之下稍有所存而入秋霖雨經月不霽禾雖有穗往往無實雖有實往往無米雖有米率皆細黒一斗之粟舂簸之後不過得米三四升糓價踵貴民間累年困於科調素無積蓄不能相贍以此須至分房减口就食西京襄鄧商虢等州或庸賃客作或燒炭採薪或乞匄剽竊以度朝夕當此之際國家惟宜鎮之以静省息諸事减節用度則租稅自輕徭役自少逋負自寛科率自止四患旣除民力自足民財自饒閭里自安流亡自還固不待陛下憂勤於中宰相劬勞於外然後人人得其所也苟或不然國家雖欲輕租稅寛逋負其所費之財何由可得雖欲少徭役止科率其所營之事何由可成四患不除雖日下㤙澤之詔民猶不免於流移轉死也盖欲止沸者莫若絶薪欲安民者莫若省事此目前之騐非難知也臣到官以来伏見朝廷及宣撫等司指揮分義勇作四畨欲令以此於縁邉戍守選諸軍驍銳及募閭里惡少以為竒兵造乾糧皺飯布囊力車以偹餽運悉取嵗賜秉常之物散給縁邉諸路又竭内地府庫甲兵財物以助之且以永興一軍一作路言之所發人馬甲八千副錢九萬貫銀二萬三千両銀盌六千枚其餘細瑣之物不可勝數動皆廹以軍期上下相驅急於星火官吏狼狽下民驚疑皆云國家将以今春大舉六師長驅深入以討秉常之罪臣以踈賤不得預聞廟堂之議未知兹事為虚為實昨者親承徳音以為方今邉計唯冝謹嚴守備俟其入冦則堅壁清野使之来無所得兵疲食盡可以坐收其弊臣退而思念聖謀髙逺深得王者御戎狄之道實天下之福及到關中乃見凡百䖏置皆為出征調度臣不知有司在外不諭聖意以致有此張皇将陛下黙運神筭不令愚賤之臣得聞其實也臣不勝惶恐晝則忘食夜則廢寝心寒股栗竊為陛下危之夫兵者凶噐聖人不得已而用之自古以来國家冨彊将良卒精因人主好戰不已以致危亂者多矣况今公私困竭将愚卒懦乃欲驅之塞外以捕狡悍之虜其無功必矣豈惟無功兼後患甚多不可盡言也若朝廷初無出征之意則何為坐散府庫之財疲生民之力訖無分毫之事萬一将来虜騎入冦府庫已竭民力已困将何以禦之臣先任御史中丞日朝廷将興綏州之役臣曽上言國家先當舉百職修庻政安百姓實倉庫選将帥立軍法練士卒精噐械八事皆備然後可以征伐四夷今此八事未有一者勝於曩時而况關中饑饉十室九空為盗賊者紛紛已多縣官倉庫之積所餘無幾乃欲輕動大衆横挑猛敵此臣之所大懼也或者又云國家未討秉常先欲試兵誅一小族若果如此尤為不可何則今者竭關中之財力大興師衆乃捨有罪之彊冦誅無辜之小種勝之不武不勝為笑将無以復號令戎狄矣此二䇿者皆為不可伏望陛下深鍳安危之機消之於未萌救之於未形速下明詔撫諭關中之民以朝廷不為出征之計其義勇更不分畨於縁邉戍守亦不選募竒兵凡諸調發為餽運之具者悉令停罷愛惜内地倉庫之儲以備春深賙救飢窮之人如此豈惟生民之幸亦社稷之福也臣不勝憂迫直輸赤誠惟陛下裁察臣光昧死再拜上䟽應詔言朝政闕失状熈寜七年四月十八日上右臣准西京牒准三月三十日詔勅朕涉道日淺晻于致治政失厥中以干隂陽之和乃自冬迄春旱暵為虐四海之内被災者廣間詔有司損常膳避正殿冀以塞眚消變歴日滋乆未䝉休應嗷嗷下民大命近止中夜以興震悸靡寜永惟其咎未知攸出意者朕之聴納不得於理歟獄訟非其情歟賦斂失其節歟忠謀讜言欝於上聞而阿諛壅蔽以成其私者衆歟何嘉氣之乆不效也應中外文武臣寮並許實封直言朝政闕失朕将親覽考求其當以輔政理三事大夫務悉心交儆成朕志焉臣伏讀詔書喜極以泣昔成湯以六事自責今陛下以四事求諌聖人所為異世同符凡詔書所言皆即日之深患陛下旣已知之羣臣夫復何云曽子曰尊其所聞則髙明矣行其所知則光大矣陛下誠知其如是復能斷志無疑不為左右所移則安知今日之災沴不如太戊之桑糓髙宗之雊雉成王之雷風宣王之旱魃更為宗廟生民之福乎然自詔下以来臣不知中外之臣亦有以當今之急務生民之疾苦力為陛下别白言之者乎盖必有之矣而臣未得聞也臣竊不自揆伏念父子受國厚恩備位侍從曏在朝廷屢以狂瞽塵浼聖聦間以衰疾自求閒官不敢復預國家之議四年於兹矣幸遇陛下發不世之詔問以朝政闕失斯實千載一時古人雖在畎畝猶不忘君况居位食禄者乎是以不敢畏當塗避衆怒愛㣲軀保妻子心知時事之可憂而塞嘿不言也竊觀陛下英睿之性希世少倫即位以來鋭精求治耻為繼體守文之常主髙欲慕堯舜之隆下不失漢唐之盛擢俊傑之才使之執政言無不聴計無不從所譽者超遷所毁者斥退垂衣拱手聴其所為推心置腹人莫能間雖齊桓公之任管仲蜀先主之任諸葛亮殆不及也執政者亦悉心竭力以副陛下之欲耻為碌碌守法循故事之臣毎以周公自任是冝百度交正四民豐樂頌聲旁洽嘉瑞沓至乃其效也然六年之間百度紛擾四民失業怨憤之聲所不忍聞災異之大古今罕比其故何哉豈非執政之臣所以輔陛下者未得其道歟所謂未得其道者在於好人同已而惡人異已是也陛下旣全以威福之柄授之使之制作新法以利天下是冝與衆共之捨短取長以求盡善而獨任已意惡人攻難羣臣有與之同者則擢用不次與之異者則禍辱隨之人之情誰肯棄福而取禍去榮而就辱於是天下之士躁於冨貴者翕然附之争勸陛下益加委信順從其言嚴斷刑罰以絶異議如是者往往立取羙官比年以来中外執事權者皆此屬矣其懐忠直守廉耻者皆擯斥廢棄或罹罪譴無所容立至於臺諫之官天子耳目所以規朝政之闕失糾大臣之専恣此陛下所當自擇而亦使執政擇之彼專用其所親愛之人或小有違忤即加貶逐以懲後来必得佞諛之尤者然後使為之如是則政事之愆謬羣臣之姦詐下民之疾苦逺方之寃抑陛下何從得聞見之乎又奉使詢訪利害於四方者亦其所親愛之人皆先禀其意指憑其氣勢以驅廹州縣之吏善惡繫其筆端升黜由其脣吻州縣之吏承迎奉順之不贍何暇與之講利害立同異哉其入奏則云州縣守宰咸以為便經乆可行陛下但見其文書粲然可觀以謂法之至善詢謀僉同豈知其在外之所為哉或者更増為條目務求新巧互陳利病各事改張使畫一之法日殊月異乆而不定吏民莫知所從盖由襲故則無功出竒則有賞彼皆進身之私計非有益國便民之志也又令使者督責所在監司監司督責州縣上下相驅競為苛刻奉行新法稍不盡力則謂之非才不職及沮壊新法立行停替或未熟新法誤有違犯皆不理赦降去官與犯贓者罪同而重於犯私罪者州縣之吏唯奉行文書救免罪戾之不暇民事不復留心矣又潜遣邏卒聴市道之人謗議者執而刑之又出牓立賞募人告捕誹謗朝政者臣不知自古聖帝明王之政固如是耶昔堯稽于衆舍已從人舜戒羣臣予違汝弼汝無面從退有後言此其所以為帝王稱首者也秦惡聞其過殺直諌之士禁偶語之人及其禍敗行道之人皆知之而已獨不知此所以為萬世戒者也子産相鄭鄭人游于郷校以論執政然明請毁之子産曰何為夫人朝夕退而㳺焉以議執政之善否其所善者吾則行之其所惡者吾則改之是吾師也若之何毁之我聞忠善以損怨不聞作威以防怨豈不遽止然猶防川大决所犯傷人必多吾不克救也不如小决使道不如吾聞而藥之也何今之執政異於古之執政乎齊景公謂梁􅉌㩀曰惟㩀與我和夫晏子對曰㩀亦同也焉得為和和如􅃵焉水火醯醢鹽梅以烹魚肉宰夫和之齊之以味濟其不及以洩其過君子食之以平其心君臣亦然君所謂可而有否焉臣獻其否以成其可君所謂否而有可焉臣獻其可以去其否是以政平而不干民無爭心今㩀不然君所謂可㩀亦曰可君所謂否㩀亦曰否若以水濟水誰能食之今朝廷之臣對揚啓沃亦有異於梁丘㩀者乎衞君言計非是而羣臣和者如出一口子思曰以吾觀衞所謂君不君臣不臣者也人主自臧則衆謀不進事是而臧之猶却衆謀况和非以長惡乎夫不察事之是非而悦人賛已闇莫甚焉不度理之所在而阿諛求容諂莫甚焉君闇臣諂以在民上民不與也若此不已國無類矣子思言於衞侯曰君之國事将日非矣出言自以為是而卿大夫莫敢矯其非卿大夫出言自以為是而士庻人莫敢矯其非君臣旣自賢矣而羣下同聲賢之賢之則順而有福矯之則逆而有禍如此則善安從生今執政主新法羣下同聲賢之有以異於衞國之政乎是以士大夫憤懣欝結視屋竊歎而口不敢言庻人飢寒憔悴怨嗟號泣而無所控告此則陛下所謂忠謀讜言欝於上聞而阿諛壅蔽以成其私者也苟忠讜退伏阿諛滿側而望百度之正四民之樂頌聲之洽嘉瑞之臻固亦難矣方今朝之闕政其大者有六而已一曰廣散青苖錢使民負債日重而縣官實無所得二曰免上户之役斂下户之錢以養浮浪之人三曰置市易與細民爭利而實耗散官物四曰中國未治而侵擾四夷得少失多五曰結保甲教習凶噐以疲擾農民六曰信狂狡之人妄興水利勞民費貯若其佗瑣瑣米鹽之事皆不足為陛下道也捨其大而言其細捨其急而言其緩外有獻替之迹内懐附㑹之心是姦邪之尤者臣不敢為也凡此六者之為害人無貴賤愚智莫不知之乃至陛下左右前後之臣日譽新法之善者其心亦知其不可但欲希合聖心附㑹執政盗貴冨耳一旦陛下之意移則彼之所言亦異矣臣今不敢復費簡札叙利害以煩聖聴但願陛下勿詢阿諛之黨勿徇權臣之意斷志罷之必有能為陛下言其詳者矣此六者之中青苗免役錢為害尤大夫力者民之所生而有也糓帛者民可耕桑而得也至於錢者縣官之所鑄民不得私為也自未行新法之時民間之錢固已少矣冨商大賈藏鏹者或有之彼農民之冨者不過占田稍廣積糓稍多室屋修完耕牛不假而已未甞有積錢巨萬於家者也其貧者藍縷不蔽形糟糠不充腹秋指夏熟夏望秋成或為人耕種資採拾以為生亦有未甞識錢者矣是以古之用民各囙其所有而取之農民之役不過出力稅不過糓帛及唐末兵興始有稅錢者故白居易譏之曰私家無錢鑪平地無銅山言責民以所無也今有司為法則不然無問市井田野之民由中及外自朝至暮唯錢是求農民值豐嵗賤糶其所収之糓以輸官比常嵗之價或三分减二於斗斛之數或十分加二以求售於人若值凶年無糓可糶吏責其錢不已欲賣田則家家賣田欲賣屋則家家賣屋欲賣牛則家家賣牛無田可售不免伐桑棗撤屋材賣其薪或殺牛賣其肉得錢以輸官一年如此明年将何以為生乎故自行新法以來農民尤被其患農者天下之本農旣失業餘民安所取食哉今貨益重物益輕年雖饑糓不甚貴而民倍困為國計者豈可不少思其故哉此皆歛錢之咎也北盡塞表東被海涯南踰江淮西及卭蜀自去歲秋冬絶少雨雪井泉溪澗往往涸竭二麥無收民已絶望孟夏過半秋種未入中户以下大抵乏食採木實草根以延朝夕若又如是數月将如何哉當此之際而州縣之吏督廹青苗助役錢不敢少緩鞭笞縲紲唯恐不迨婦子遑遑如在湯火之中號泣呼天無復生望臣恐鳥窮則啄獸窮則攫民困窮已極而無人救恤羸者不轉死溝壑壮者不聚為盗賊将何之矣若東西南北所在嘯聚連羣結黨日滋月蔓彌漫山澤蹈藉城邑州縣不能禁官軍不能討當是時方議除去新法将奚益哉緑林赤眉黄巾黒山之徒自何而有皆疲於賦斂復值饑饉窮困無聊之民耳此乃宗廟社稷之憂而廟堂之上方晏然自得以為太平之業八九已成此臣所為痛心疾首晝則忘食夜則忘寝不避死亡欲黙不能者也易復之初六曰不逺復無祗悔元吉言過而能改雖悔不大也其上九曰迷復凶有災眚用行師終有大敗以其國君凶至于十年不克征言迷而不復凶且有災於君道尤不利也昔秦穆公敗於殽作秦誓曰唯古之謀人則曰未就予忌唯今之謀人姑将以為親雖則云然尚猷詢兹黄髪則罔所愆盖悔弃老成之逺慮用利口之淺謀以取覆敗而思補其過也故能終雪前耻彊霸西戎漢武帝征伐四夷中國虚耗賊盗羣起又喪貳師之軍乃下哀痛之詔曰廼者以縛馬書徧示丞相御史二千石諸大夫郎為文學者皆以虜自縛其馬不祥甚哉公車方士太史太卜皆以為吉今計謀卦兆皆反謬盖始寤公卿方士之諂諛對不以誠致誤國事有悔于心也故禁苛暴止擅賦力本農天下復安自國家行新法以來天下之人心祈口禱唯冀陛下之覺悟而拯救其失以蘇疲民如望上天之膏澤日復一日以至于今及今改之猶可救也過是則民力屈竭一旦渙然離散乃始勞心安集豈不難哉竊觀陛下詔書寅畏天災深自咎責丁寜懇惻以求至言是陛下已知前日之失而欲有所改為也若徒著之空文而於新法無所變更是猶臨鼎哀魚之爛而益薪不已将何補哉陛下誠能垂日月之明奮乾剛之斷放逺阿諛勿使壅蔽自擇忠讜為臺諌官收還威福之柄悉從已出詔天下青苗錢勿復散其見在民間逋欠者計從初官本分作數年催納更不收利息其免役錢盡除放差役並依舊法罷市易務其所積貨物依元買價出賣所欠官錢亦除利催本罷拓土開境之兵先阜安中國然後征伐四夷罷保甲教閲使服田力穡所興修水利委州縣相度凡利少害多者悉罷之如此則中外讙呼上下感悦和氣薫蒸雨必霑洽矣彼阿諛之人附㑹執政者皆縁新法以得冨貴若陛下以為非而捨之彼如魚之失水必力争固執而不肯移願陛下勿問之也臣竊聞陛下以旱暵之故避殿撤膳其焦勞至矣而民終不預其澤不若罷此六者立有溥博之徳及於四海也又聞京師近雖獲雨而畿甸之外旱氣如故王者以四海為家無有逺近皆陛下之赤子願陛下雖徇羣臣之請御正殿復常膳猶應兢兢業業憂勞四方不遽自覺以為無復災也又諸州縣奏雨往往止欲觧陛下之焦勞一寸則云三寸三寸則云一尺多不以其實不可不察也又聞青苗之法災傷及五分則倚閣其間官吏不仁者至有抑遏百姓止放四分以下稅此尤可罪者也臣在冗散之地若朝政小小得失臣固不敢預聞今坐視百姓困於新法如此将為朝廷深憂而陛下曽不知之又今年以來臣衰疾寝増恐萬一溘先朝露齎懐忠不盡之情長抱恨於黄泉是以冒死一為陛下言之儻陛下猶棄忽而不之信此則天也臣不敢復言矣干冒宸扆臣無任懇切惶懼之至薦范祖禹狀元豐七年十二月上右臣伏以報國之忠莫如薦士負國之罪莫如蔽賢臣伏見奉議郎同編修資治通鑑范祖禹智識明敏而性行温良如不能言好學能文而謙晦不伐如無所有操守堅正而圭角不露如不勝衣祖禹乃今正議大夫致仕范鎮兄孫自祖禹年未二十為舉人時臣巳識之今年四十餘行義完固常如一日祖禹所為本末無如臣最熟知臣於熈寜三年奏祖禹自前知資州龍水縣事同修資治通鑑至今首尾一十五年由臣頑固編集此書乆而不成致祖禹淹回沉淪不得早聞逹於朝廷而祖禹安恬静黙如可以終身下位曽無滯留之念臣誠孤陋所識至少於士大夫間罕遇其比况如臣者逺所不及凡臣所言莫非據實不敢溢美今所修書已畢祖禹應歸吏部别授差遣臣竊為朝廷惜此良寳委棄榛莽伏望皇帝陛下特賜采㧞或使之供職祕省觀其述作或使之入侍經筵察其學行自餘進用繫自聖忠如䝉朝廷擢用後有不如所舉臣甘與之同罪再乞西京留臺狀元豐八年二月上右臣先於元豐五年九月二十六日受勅提舉西京嵩山崇福宮候滿三十箇月不候替人發來赴闕至今月此任當滿伏念臣性雖至愚粗甞從學平生所守不敢忘信雖遇布衣未甞妄語况於朝廷豈敢欺罔臣今年六十有七耳目手足雖未全衰數年以來昏忘特甚舉錯云為動多差繆使之臨繁處劇實所不堪非敢愛身必恐敗事但臣前後提舉崇福宫已經四任坐享俸給全無所掌今復有求匄實自愧心竊見西京留司御史臺及國子監比於宫觀粗有職業伏望聖慈俯加矜察特於上件兩處差遣内除授一任庻使竊禄庇身以養殘年則陛下愛物曲盡始終之賜㣲臣陳力兩遂公私之便乞奔神宗皇帝喪狀元豐八年三月十七日上右臣先任提舉西京嵩山崇福宫於今年二月任滿臣以數年以來昏忘特甚臨繁處劇實所不堪尋具狀奏陳乞於西京留司御史臺及國子監内除授臣一任未奉朝㫖間於今月七日忽奉遺制大行皇帝奄弃天下臣哀荒摧絶無地自處伏念臣自先帝踐阼以來過䝉知待特出倫軰首寘翰苑繼處憲臺亦甞承乏俾佐樞府臣自知非才不敢冒居力辭事任願就冗散亦荷矜容曲從所欲養以俸禄不責職業優游自便十有五年近者書成又叨進職褒嘉賜賚皆踰等比聖㤙汪洋天隆地厚未足為諭奉諱之初即欲號哭奔走徑詣京師奉望梓宫展臣子之誠萬分之一又念國朝故事如昭厚二陵未甞有近臣奔喪之例加以前已乞留臺國子監未奉進止彷徨疑慮不敢輒行今竊聞觀文殿學士孫固資政殿學士韓維已至闕下臣方自咎責不敢寜居已於今月十七日起離西京欲乞亦赴闕廷隨百官班入臨見於前路聴候指揮申宣撫權住製造乾糧皺飯狀熈寜三年十二月一日上准都轉運司牒准宣撫使衙劄子節文製造乾糧州軍将􅔋一斗變造乾糧五斤仍量支與柴錢勘㑹近准宣撫使衙劄子節文指揮沿邉四路十四州軍并近裏永興軍河中府同耀乾州鳳翔府等州軍變造􅔋餅皺飯當司已兩次牒逐州軍疾早變造施行去訖今又准前項宣撫使衙劄子已牒逐州将􅔋一斗變造乾糧五斤仍量支與柴錢如闕􅔋即疾速計置收糴變造乾糧所是柴錢斟量支給施行去訖牒請照㑹施行者右具如前勘會先准中書劄子節文奉聖㫖今後起發義勇赴沿邉戰守並令自齎備一月口食與折将來本户稅物若不能自備只乞於起發州軍預請一月口食齎往者亦聴又勘會永興軍近准都轉運使司牒准宣撫使衙劄子近准朝㫖義勇上畨令附帯乾糧一秤至屯戍州軍須合預行變造乾糧准備支遣附帯前去右劄送陜西轉運司檢會近降義勇分畨條貫指揮㳂邉四路十四州軍并近裏永興河中同耀乾鳯翔六州府速行勘會義勇所居縣分近便省倉斛斗内有􅔋粟或白米便約義勇合附帯乾糧秤數中停變造􅔋餅皺飯如見在􅔋數不多即一色變造皺飯仍趂此時月造下兩畨令附帯數目免致非時蒸㬠易為損惡仍毎乾糧一秤破係官布造袋子封印如法收將來義勇上畨日依數附帯者光竊詳義勇戍守之時毎人逐日給米二升半其一月口食七斗五升若更加乾糧一秤并噐械衣装盤纒等物竊慮一人之力難以勝任兼今來變造乾糧皺飯須至差配百姓當此饑饉民間不易之際雖云量支柴薪亦不能全無搔擾况即今諸縣官倉􅔋米至少昨准朝㫖散支第四等第五等闕食人户各二石尚未有備若更造乾糧皺飯即将來二三月間正當闕食之際更將何物可以救濟必見大叚失所竊見慶厯年中議欲出兵討伐元昊亦曽令陜西諸州製造乾糧皺飯萬數不少後來旣不出兵其乾糧皺飯所在堆積經年朽腐不可復食盡為棄物今官中錢糓比於慶厯年尤更難得若復造此物徒使公私勞費卒無所用誠為可惜又國家備邉若止於戍守則㳂邉自有倉廪無用乾糧皺飯今來承准指揮製造上件乾糧皺飯仍令十日一申倉卒取辦竊慮百姓猜疑以為國家又欲出兵必致逺近驚憂無由觧諭至時不為便穏光已指揮本路前項五州軍且未令造乾糧皺飯更聴候宣撫衙指揮去訖謹具狀申宣撫使衙伏望裁酌早賜指揮乞罷修腹内城壁樓櫓及噐械狀熈寜四年正月三日上尋得㫖依奏准熈寜三年十一月初七日准樞宻院劄子節文檢會近為麟府路豐州及外堡寨官吏弛慢不職不修完城池樓櫓噐甲等已奉聖㫖降官等第斷遣及劄與三路轉運司徧牒轄下沿邉州軍知委去訖近又據陜西路提刑宣撫司奏華州甲仗庫弓弩不堪盖是監官并本州官貟全不用心㸃檢有誤緩急使用其鈐轄盧戭坐受優俸空占當直兵士略不營職朝廷已令鄜延路經略司舉官差替盧戭其華州甲庫弓弩不堪本州當職官貟全不用心㸃檢仍宣撫司差官取勘聞奏竊慮諸路亦有不修完城壁噐甲等去處奉聖㫖令河東河北陜西經略安撫司指揮轄下州軍委官吏子細㸃檢須管日近修完城壁樓櫓堅固噐甲精利如將來朝廷専差官㸃檢得却有未修城壁樓櫓噐甲等其應干官吏必當依此重行斷遣劄付本司者尋依准朝㫖行下本路諸州軍施行近准虢州申州司勘會本州雖係陜西路即不係近邉州軍其州城從來並不曽有敵樓戰棚為自來霖雨損壊摧塌及無兵功累年不曽修築今來亦不敢専擅役夫修築已牒在城兵馬都監吕士宣重行檢計損壊城邑去處才候檢計到合使人功物料别具狀供申乞差兵夫次及據觧州申准兵馬監押狀申准州牒備録到安撫使司牒内坐到聖㫖指揮修完城壁樓櫓等尋將帯壕寨木匠作頭等檢計外羅城面上只有更屋二十三座並係年深倒塌及城壁墜倒乆來亦不曽泥補修完伏乞據狀申上衙乞差官計料修城人工及剏添樓櫓免致將來朝廷差官檢視見並不修完城壁及剏盖樓櫓虚負責降停替州司勘會舊來城上並無樓櫓即目城面上濶處只及四五尺以來今若指揮使行剏造又縁合使人工材料數目不少今來未敢専擅剏修伏候指揮右謹具如前勘會管下永興等一十州軍城壁内有乆來已行安置樓櫓完備亦有城壁低下薄怯全未有樓櫓去處其逐州官吏旣准上項朝㫖及見麟府豐州官吏以不修完城壁櫓樓噐甲降官等第斷遣并華州官吏差替取勘仍恐朝廷非時差官㸃檢例各畏懼争欲日近興功完葺以避譴責伏縁營造樓櫓須藉城基厚濶方可安置今來觧虢兩州城壁皆稱濶處只及四五尺似此之類須是先貼築城基方可剏修樓櫓若非大叚興功無以辦濟况今本路州軍全闕廂軍應急差使官庫亦闕見錢收買材料若是差役人夫配率材料又縁陜西州軍已是去嵗夏麥薄收秋苖旱損當此饑饉人户流移之際若更如此差擾必是轉難存濟兼永興軍一路州軍盡在腹裏去沿邉絶逺設若蕃賊入冦亦未能卽到逐州軍城下其樓櫓修下數年不用不免損壊今來若盡令與沿邉州軍一例須管日近修完城壁樓櫓堅固噐甲精利顯見官私虚有勞費欲乞朝廷特降指揮其㳂邉及次邉州軍即一依近降朝㫖修完所有腹内州軍城壁樓櫓并候将來豐熟以漸營葺其噐甲即㨿不堪數目逐旋勒作院人匠依程課修整務令精利所貴公私皆得辦濟乞不添屯軍馬熈寜四年正月八日上今月七日准熈寜三年十二月二十九日陜西河東路宣撫使司劄子本司近已具奏聞乞於永興軍邠州河中府三州軍易得糧草之處别添屯軍馬選差将官専切訓練逐路不得句抽専聴宣撫司節制内一項乞於永興軍駐劄兵馬差本司准備差使莊宅使趙瑜充永興軍路都鈐轄與知府専管訓練者右具如前臣勘會永興軍所管今年正月一日見在軍糧麤細色斛斗共三十六萬九千七百石二斗四升據即目本府見駐泊及就糧并本城兵貟糧食及官僚請俸等共約支得向去一十七箇月半馬料三萬七千六百五十二石四斗二升約支得向去一十五箇月有餘稈草四十萬六千二百二十二束約支得一十三箇月半有餘此只是據見在軍馬約度即不知今來所添屯軍馬計多少數目若只添一倍之時其人粮只約支得八箇月有餘馬料只約支得七箇月有餘稈草只支得六箇月有餘所添更多所費尤廣又先准中書劄子奉聖㫖令體量應災傷人户委的飢乏不能自存者仰發省倉斛斗據第四第五以下人户各借二石今勘會永興軍諸縣第四等以下闕食人户約及十餘萬户若毎户支二石共計合支二十餘萬石其外縣雖有粮草亦是數目不多更難支充貸糧若並令在府省倉請領又更减却此數即軍糧約支更不及得上項月數况去年陜西經夏大旱入秋霖雨五糓例皆不熟其永興軍放稅多者至七八分即今毎斗白米價錢一百文足稈草毎束價錢二十七文足雖差官開場糴買只糴得白米九百餘石稈草全無兼勘會軍資庫日近雜支錢盡底支絶准轉運司牒将三司提刑司鹽馬司封樁錢盡數充雜支錢止及四萬餘貫除支毎月料錢及軍府諸般使用並不住准轉運司牒支撥往㳂邉州軍及應副收買軍期物色見今無錢支與和糴場糶買糧草豈得謂之易得糧草之處臣竊謂大凡添屯軍馬先須約度本處糧草可以贍養與否今來關中饑饉倉庫空虚贍養舊兵猶恐不足更添新者何以枝梧雖朝廷更於左藏庫内藏庫支撥銀紬絹等降下本路添助支費亦不免令州縣配賣與百姓轉増貧困况糧草是重滯之物不可從逺處興販得來須本處土地所生方可計置今饑饉如此雖多積金銀髙估物價令轉運司與州縣多方擘畫其日下所要糧草何由可得况即今民間闕食流移死亡者已為不少諸縣處處申報驚刼若至向前二三月後舊糓已盡新麥未熟民間必轉更飢乏若官中愛惜倉庫坐視不救竊恐流移轉多死亡轉衆盗賊轉煩深為不便竊以戎狄擾邉手足之疾百姓離散腹心之憂豈可重外輕内逐末忘本兹事得失所繫不細伏望朝廷先将陜西諸州軍糧草約度合贍得若干軍馬一年支費仍須於十分中量留二三分救濟目下飢民外如有剰數然後據數添屯軍馬若苦無剰數之時伏乞朝廷更不添屯儻以邉鄙未寜須至量添軍馬之時即乞分散往諸州軍就糧各委逐處兵官精加訓練不須聚在永興軍邠州河中府三處更特置都鈐轄三貟候邉事稍定即乞速發遣歸住營處所貴公私稍得辦濟若不如此先約度粮草但務添屯軍馬竊恐一旦倉庫俱竭别有不虞至時悔無所及臣職在守藩不敢不言所有先准朝㫖令第四等以下人户借支斛斗二石未審今來支與不支若支與則軍粮轉更不足不支則人户正當飢乏伏願聖慈早降指揮臣不勝廹切之誠奏乞兵官與趙瑜同訓練駐泊兵士狀熈寜四年正月十九日上右臣准今月三日宣命差下在京及外處拱聖等十四指揮計五千餘人赴永興軍權駐泊准備宣撫司抽差使及差荘宅使趙瑜充本路都鈐轄與臣専管句訓練臣本書生叨忝兩制軍旅之事素所不知加以近准宣撫司劄子坐到教閲新法令排日各習事藝臣所管永興軍一十三縣民事至多及應副㳂邉軍須物色文案填委毎日自旦至暮未甞暫閒實無餘力與趙瑜同監教閲又不可専委趙瑜獨行訓練又永興軍舊管屯駐駐泊就粮兵士自來並是鈐轄劉斌路分都監李應之同共管句今來所添兵士准宣命指揮只令趙瑜與臣専管句訓練所有舊來兵士不知趙瑜管與不管若令通管之時其新來兵士旣在永軍駐泊其劉斌李應之並是本路鈐轄都監豈可却管轄不得竊慮向去新兵士不賔服舊兵官舊兵官不應副新兵士各分彼我則致生事深為不便所有上件新差來永興軍權駐劄兵士臣欲乞令本路兵官與趙瑜同共訓練所貴公共同心管句得辦謹具状奏聞伏候勅㫖并申宣撫相公更賜敷奏乞早降指揮傳家集巻四十五欽定四庫全書傳家集巻四十六宋司馬光撰章奏二十九乞開言路劄子元豐八年三月三十日上臣聞周易天地交則為泰不交則為否君父天也臣民地也是故君降心以訪問臣竭誠以獻替則度政修治邦家乂安君惡逆耳之言臣營便身之計則下情壅蔽衆心離叛自生民以來未有不由斯道者也夫道猶歧路近差跬歩逺失千里今皇帝陛下新臨大寳徳性髙明太皇太后同斷萬幾聖謨光大初發號令不可不慎斯乃治亂之歧塗安危之所分也當以要切為先以瑣細為後臣竊見近年以來風俗頺弊士大夫以偷合苟容為智以危言正論為狂是致下情蔽而不上通上恩壅而不下達閭閻愁苦痛心疾首而上不得知明主憂勤宵衣旰食而下無所訴公私兩困盗賊已繁猶頼上帝垂休嵗不大飢祖宗詒謀人無異志不然者天下之勢可不為之寒心乎此皆罪在羣臣而愚民無知往往怨歸先帝此臣所以日夜憤痛焦心泣血不顧死亡思有開發於朝廷者也臣愚以為今日所宜先者莫若明下詔書廣開言路不以有官無官之人應有知朝政闕失及民間疾苦者並許進實封状盡情極言仍頒下諸路州軍於所在要閙處出牓曉示在京則於鼓院檢院投下委主判官畫時進入在外則於州軍投下委長吏即目附遞奏聞皆不得取責副本彊有抑退其百姓無産業人慮有姦詐則責保知在奏取指揮放令逐便然後陛下於聴政之暇略賜省覽其義理精當者即施行其言而顯擢其人其次取其所長捨其所短其狂愚鄙陋無可采取者報聞罷去亦不加罪如此則嘉言日進羣情無隠陛下雖深居九重四海之事如指諸掌舉措施為惟陛下所欲斯乃治安之源太平之基也陛下若以臣言為可取伏乞决自聖意下學士院草詔書施行羣臣若有沮難者其人必有姧惡畏人指陳専欲壅蔽聦明此不可不察取進止進修心治國之要劄子狀元豐八年四月十九日上右臣伏聞本固則末茂源濁則流渾昔仁宗皇帝擢臣知諌院臣初上殿即言人君之徳三曰仁曰明曰武致治之道三曰任官曰信賞曰必罰英宗皇帝時臣曽進歴年圖其後序言人君之道一其徳有三其志亦猶所以事仁宗也大行皇帝新即位擢臣為御史中丞臣初上殿言人君修心治國之要其志亦猶所以事英宗也今上天降災大行皇帝奄弃天下皇帝陛下新承大統太皇太后同聴萬幾不知臣愚猥䝉訪落臣且愧且懼無以塞責謹復以人君修心治國之要為獻其志亦猶所以事大行皇帝也所以然者臣歴觀古今之行事竭盡平生之思慮質諸聖賢之格言治亂安危存亡之道舉在於是不可移易是以區區首為累朝言之不知臣者以臣為進迃闊陳熟之語知臣者以臣為識天下之本源也夫治亂安危存亡之本源皆在人君之心仁明武所出於内者也用人賞功罰罪所施於外者也出於内者雖有厚有薄有多有寡禀之自天然好學則知所宜從力行則光美日新矣施於外者施之當則保其治保其安保其存不當則至於亂至於危至於亡行之由已者也所以能當在於至明所以能明在於至公是以明君善用人者博訪逺舉拔其殊尤徳行髙人謂之賢智勇出衆謂之能賢不必能能不必賢各隨所長授以位任有功則賞有罪則罰其人苟賢能雖讎必用其人苟庸愚雖親必弃賞必有所勸罰必有所懲賞不以喜罰不以怒賞不厚於所愛罰不重於所憎必與一國之人同共好惡是以古者爵人於朝與士共之刑人於市與衆弃之如此安有不當者乎臣故曰所以能當在於至明所以能明在於至公也昔齊桓公置射鉤而使管仲相漢髙祖知人善任使苟為不才雖見喜弃之苟才矣雖負販酒徒亡将戍卒亦用之此所以能奮布衣取天下也館陶公主為子求郎明帝不許而賜錢千萬郎賤官也猶惜之况其貴者乎故永平之治至今稱之宋髙祖事蕭太后甚孝太后欲以子道憐為揚州刺史髙祖以其貪愚不許故功業之髙冠於南朝唐太宗殺建成元吉而用其官屬魏鄭公王珪等與房杜無異卒得其效宣宗事鄭太后甚謹問舅鄭光以政事不能對罷其方鎮故時人稱美謂之小太宗此用人之公明者也韓昭侯惜弊袴不以賜左右之無功者漢髙祖深怨雍齒而不忘其功魏太祖勲勞冝賞不吝千金無功望施分毫不與唐宣宗重惜服章故當時得緋紫者以為榮此賞功之公明者也僮牛殺孟丙仲任立叔孫昭子昭子數其罪而殺之孔子善其不懐丁公脫漢祖於阨髙祖以為不忠而斬之武帝妹隆慮公主且死屬其子昭平君昭平君殺人武帝流涕而誅之唐明皇弄臣黄㼐掀捕盗官墜馬明皇杖殺之宣宗謂樂工汝惜羅程藝我惜髙祖太宗法此罰罪之公明者也臣略舉此數者以為明騐其餘在陛下博覽載籍以考之知臣所言不為謬妄臣以一夫之愚不能周知天下之務近曽上奏乞下詔書開言路伏望聖慈早賜施行今并治平四年五月三日上殿劄子具録進呈乞陛下留神幸察乞去新法之病民傷國者䟽元豐八年四月二十七日上月日具官臣司馬光謹昧死再拜上䟽太皇太后陛下皇帝陛下臣竊見先帝聦明睿智勵精求治思用賢輔以致太平委而任之言行計從人莫能間雖周成王之任周公齊桓公之任管仲燕昭王之任樂毅蜀先主之任諸葛亮殆不能及斯不世出之英主曠千載而難逄者也不幸所委之人於人情物理多不通曉不足以仰副聖志又足已自是謂古今之人皆莫已如不知擇祖宗之令典合天下之嘉謀以啓廸清衷佐佑鴻業而多以已意輕改舊章謂之新法其人意所欲為人主不能奪天下莫能移與之同者援引登青雲與之異者擯斥沈溝壑専欲遂其狠心不顧國家大體人之常情誰不愛冨貴而畏刑禍於是搢紳大夫望風承流競獻䇿畫務為竒巧捨是取非興害除利名為憂民其實病民名為益國其實傷國作青苖免役市易賖貸等法以聚斂相尚以苛刻相驅生此厲階迄今為梗又有邉鄙之臣行險徼倖大言面欺輕動干戈妄擾蠻夷夫兵者國之大事廢興存亡於是乎在而其人苟榮一身之官賞不顧百姓之死亡國家之利病輕慮淺謀發於造次御軍無法僅同兒戯深入敵境坐守孤城糧運旣竭狼狽奔潰築寨極邉功猶未畢輕敵不備闔城塗地使兵夫數十萬暴骸於曠野資仗臣億弃捐於異域又有生事之臣欲乗時干進建議置保甲户馬保馬以資武備變茶鹽鐡冶等法増家業侵街商稅等錢以供軍須遂使九土之民失業窮困如在湯火此皆羣臣躁於進取誤惑先帝使利歸於身怨歸於上非先帝之本志也臣荷先帝大恩常思報效曏在朝廷之時屢言新法非便觸忤權貴冒犯衆怒爭辯非一先帝憐其孤忠不以為罪仍蒙寵擢寘之樞廷臣以所言未行力辭不受臣非惡冨貴而好貧賤正欲感寤先帝知臣為國不為身庶幾采納狂瞽使百姓獲安基局永固而已旣又自乞冗官退伏閭里雖身䖏于外區區之心晨夕寤寐何甞不在先帝之左右所以不敢自赴闕廷如此之乆者亦猶辭樞廷之志也熈寜七年歴時不雨先帝遇災而懼深自刻責誕布詔書廣開言路臣當是時不勝踊躍極有開陳而建議之臣知所立之法不合衆心天下之人必盡指其非恐先帝覺寤而已受誤國之罪伏欺罔之刑乃勸先帝繼下詔書言新法已行必不可動臣之所言正為新法若新法不動臣尚何言自是閉口不敢復預朝廷論議十有一年矣然每覩生民之愁怨憂社稷之阽危於中夜之間一念及此未甞不失聲拊心也葵藿之志猶望先帝一賜召對訪以外事得吐心極言退就斧鉞死無所恨不意上天降禍先帝升遐臣之寸誠無由披露欝抑憤懣自謂終天及奔喪至京乃䝉太皇太后陛下特降中使訪以得失是臣積年之志一朝獲伸感激悲涕不知所從顧天下事務至多臣思慮未熟不敢輕有條對但乞下詔使吏民皆得實封上言庻幾民間疾苦無不聞逹旣而聞有㫖罷修城役夫撤詗邏之卒止御前造作京城之人已自歡躍及臣歸西京之後繼聞斥退近習之無状者戒飭有司奉法失當過為煩擾者罷物貨専場及民所養户馬又寛保馬年限四方之人無不鼓舞聖徳傳布一日千里頌嘆之聲如出一口溢于四表乃知太皇太后陛下深居禁闥皇帝陛下雖冨於春秋天下之事靡不周知民間衆情乆在聖度四海羣生可謂幸甚凡臣所欲言者陛下略已行之臣稽慢之罪實負萬死夫為政在順民心苟民之所欲者與之所惡者去之如决水於髙原之上以注川谷無不行者苟或不然如逆阪走丸雖竭力以進之其復走而下可必也今新法之弊天下之人無貴賤愚智皆知之是以陛下微有所改而逺近皆相賀也然尚有病民傷國有害無益者如保甲免役錢将官三事皆當今之急務釐革所冝先者臣今别具狀奏聞伏願决自聖志早賜施行議者必曰孔子稱孟莊子之孝其佗可能也其不改父之臣與父之政是難能也又曰三年無改於父之道可謂孝矣彼謂無害於民無損於國者不必以已意遽改耳必若病民傷國豈可坐視而不改哉易曰幹父之蠱有子考无咎象曰幹父之蠱意承考也蠱者事有蠱弊而治之也幹父之蠱迹似相違意則在於承繼其業成父之美也又曰裕父之蠱往見吝象曰裕父之蠱往未得也裕者饒益之名也若不忍違異益父之過往而不返未為得冝也昔漢文帝除肉刑斬右趾者弃市笞五百者多死景帝元年改之笞者始得全武帝作鹽鐡㩁酤均輸等法天下困弊盗賊羣起昭帝用賢良文學之議而罷之後世稱明唐代宗縱宦官公求賂遺置客省拘滯四方之人德宗立未三月悉禁止罷遣之時人望致太平德宗晩年有宫市五方小兒暴横為民患鹽鐡月進羨餘順宗即位皆罷之中外大悦是皆改父之政而當者人誰非之哉况先帝之志本欲求治而羣下干進競以私意紛更祖宗舊法致天下籍籍如此皆羣臣之罪非先帝之過也為今之計莫若擇新法之便民益國者存之病民傷國者悉去之使天下曉然知朝廷子愛黎庶之心吏之苛刻者必變而為忠厚民之離怨者必變而為親譽徳業光榮福祚無窮豈不盛哉夫天子之孝在於得萬國之歡心以事其親儻措置如此歡心孰大焉事親孰備焉今幅貟之内所在嗷嗷有倒垂之急延頸傾耳以俟改法庻得蘇息若朝廷不以爲意日復一日萬一遇數千里之蝗旱公私匱竭無以相救失業之民蜂起為盗安知無姦雄乘之而動則國家有累􅆑之危申屠剛曰未至豫言固常為虚及其已至又無所及朝廷當此之際觧兆民倒垂之急救國家累􅆑之危豈假必俟三年然後改之哉况今軍國之事太皇太后陛下權同行處分是乃母改子之政非子改父之道也何憚而不為哉惟聖明裁察臣光昧死再拜上䟽乞罷保甲狀元豐八年四月上右臣竊以兵出民間雖云古法然古者八百家纔出甲士三人歩卒七十二人閒民甚多三時務農一時講武不妨稼穡自上世相承習以為常民不驚擾自兩司馬以上皆選賢士大夫為之無侵漁之患故卒乗輯睦動則有功今籍鄉村之民二丁取一以為保甲皆投以弓弩教之戰陣是農民半為兵也三四年來又令河北河東陜西置都教場無問四時每五日一教特置使者比監司專切提舉州縣不得關預每一丁教閲一丁供送雖云五日而保正保長以泥堋除草為名日聚之教場得賂則縱之不則㽞之是三路耕耘收獲稼穡之業幾盡廢也自唐開元以來民兵法壊戍守戰攻盡募長征兵士民間何嘗習兵哉夫兵者凶器也聖人不得巳而用之國家承平百有餘年四夷順服戴白之老不識兵革一旦畎畝之人忽皆戎服執兵奔驅滿野見者孰不驚駭耆舊歎息以為不祥事旣草創調發無法比户搔擾不遺一家又廵檢指使按行鄉村往來如織保正保長依倚弄權坐索供給多責賂遺小不副意妄加鞭撻􅅙食行伍不知紀極中下之民罄家所有侵肌削骨無以供億愁苦困弊靡所投訴流移四方繦屬盈路又朝廷時遣使者徧行按閲所至犒設賞賚糜費金帛以巨萬計此皆鞭撻平民銖兩丈尺而斂之一旦用之如糞土而鄉村之民但苦勞役不感恩澤臣不知設保甲於農民之勞旣如彼為國家之費又如此終將何所用哉若使之捕盗賊衞鄉里則何必如此之多若使之戍邉境征戎狄則彼戎狄之民以騎射為業以攻戰為俗自幼及長更無佗務中國之民生長太平服田力穡雖復授以兵械教之擊刺在教場之中坐作進退有似嚴整必若使之與戎狄相遇填然鼓之鳴鏑始交其奔北潰敗可以前料决無疑也是猶驅羣羊而戰豺狼也當是時豈不誤國事乎又悉罷三路廵檢下兵士及諸縣弓手皆易以保甲令主簿兼縣尉但主草市以裏其鄉村盗賊悉委廵檢而廵檢兼掌廵按保甲教閲朝夕奔走猶恐不辦何暇逐捕盗賊哉又保甲中往往有自為盗者亦有乗保馬行刼者然則設保甲保馬本欲除盗乃更資盗也書曰民惟邦本本固邦寜又曰可畏非民夫川涸魚逝林燔鳥飛民喪其生業無以自存赴訴不受失其所依安得不去而為盗哉自教閲保甲以來河東陜西京西盗賊已多至敢白晝公行入縣鎮殺官吏官軍追討經歴嵗月終不能制况三路未至大飢而盗賊已昌熾如此萬一遇數千里之蝗旱而失業飢寒武藝成就之人所在蜂起以應之其為國家之患可勝言哉此非小事不可以忽夫奪其衣食使無以為生是驅民為盗也使比屋習戰勸以官賞是教民為盗也又撤去捕盗之人是縱民為盗也謀國如此果為利乎害乎且曏者干進之士説先帝以征伐四夷開邉拓土之䇿故立保甲户馬保馬等法近者登極赦書節文云應縁邉州軍仰逐處長吏并廵檢使臣鈐轄兵士及邉上人户不得侵擾外界務要静守彊場勿令搔擾此盖聖意欲惠綏殊俗休息中國華夷之人孰不歸戴然則保甲户馬保馬復何所用哉今雖罷户馬寛保馬而保甲猶存者盖未有以其利害之詳奏聞者也臣愚以為宜悉罷保甲使歸農召提舉官還朝量逐縣户口毎五十户置弓手一人略依縁邉弓箭手法許䕃夲户田二頃悉免其稅役除出賊地分嚴加科罰及令出賞錢外其賊發地分更不立三限科校但令捕賊給賞若獲賊數多及能獲强惡賊人者各隨功大小遷補職級或補班行務在優假弓手使人勸慕然後募本縣鄉村人户有勇力武藝者投充計即今保甲中有勇力武藝者必多願應募若一人闕額有二人以上爭投者即委本縣令尉選武藝髙强者充或武藝衰退者許佗人指名與之比校若武藝勝於舊者即令充替其被替者更不得䕃田如此則不必教閲武藝自然精熟一縣之中其壯勇者旣為弓手其羸弱者雖使為盗亦不能為患仍委本州及提㸃刑獄常切按察令佐有取捨不公者嚴行典憲若召募不足即且於鄉村户上依舊條權差候有投名者即令充替其餘廵檢兵士縣尉弓手耆長壯丁逐捕盗賊並乞依祖宗舊法乞開言路狀元豐八年四月上右臣昨在京師伏䝉太皇太后不以臣愚踈無取遣使訪以得失豈惟㣲臣有千載一遇之幸中外聞之踊躍相慶以為言路将開下情得以上通太平之期指日可待也當是時臣未暇備論天下之事先陳所急於三月三十日上言以近嵗風俗頺弊士大夫以偷合苟容為智以危言正論為狂致閭閻愁苦而上不得知明主憂勤而下無所訴公私兩困盗賊已繁冝下詔書不以有官無官之人有知朝政闕失及民間疾苦者並許進實封狀鼓院檢院州軍長吏不得抑退其義理精當者行其言而顯其人狂愚鄙陋者報聞罷去亦不加罪又於四月二十一日復上言皇帝陛下初即政於用人賞罰尤不可不當夫諌諍之臣人主之耳目也不可一日無之說命曰若跣弗視地厥足用傷設有人閉目而塞耳跣足而疾趨前遇險阻能無傷乎賈山有言人主之威非特雷霆也勢重非特萬鈞也開道而求諌和顔色而受之用其言而顯其身士猶恐懼而不敢自盡况震之以威壓之以重乎頃者王安石秉政欲蔽先帝聦明專威福行私意由是深疾諌者過於仇讎嚴禁誹謗甚於賊盗是以天下之人以言為諱百姓愁苦無聊靡所控告致怨謗之語上及先帝臣嘗痛心泣血思救其失是故首乞下詔開言路以通下情臣謂羣臣苟有肯進言者陛下必加褒擢以勸來者此乃古人市駿骨揖怒蛙之意也召誥曰王乃初服嗚呼若生子罔不在厥初生自貽哲命今皇帝陛下新即位太皇太后初垂簾天下之人莫不屬目傾耳臣自到西京以來朝夕伏聴朝廷惟新之政以為必務明四目逹四聦以發天下積年憤鬰之志今開言路之詔旣不聞頒於四方而太府少卿宋彭年言在京不可不並置三衙管軍臣僚水部貟外郎王諤乞令依保馬元立條限均定逐年命買之數又乞令太學増置春秋博士使諸生肄業朝廷以非其本職而言各罰銅三十斤臣忽聞之悵然失圖憤邑無已臣非私於二人直為朝廷惜治體耳夫阿意箝口容身竊禄此小臣之利也威福在巳人不敢言此大臣之利也然民怨於下而不聞國家阽危而不知於陛下有何利哉彼宋彭年王諤臣素不識不知其人為賢為不肖但惜陛下臨政之初而二臣首以言事獲罪臣恐中外聞之忠臣觧體直士挫氣欲仕者斂冠藏之欲諫者咋舌相戒則上之聦明猶有所不照下之情偽猶有所不逹太平之功尚未可期也宋彭年所言雖不識事體但當廢而不行亦不宜加罪至如孔子作春秋為萬世法王安石秉政輒黜之使不得與諸經並列於學官學者毋得習以為業王諤所言未為不當乃以越職為罪古者置諌鼓設謗木詢于芻蕘未聞有位於朝而以言事為越職者也若當職之人旣不肯言不當職之人又不得言則以四海之廣兆民之衆其政治利病天子深居九重何由得聞之哉昨日進奏院遞到告身差臣知陳州然則臣自今於一州之外言及佗事亦為越職何敢言矣今二臣之罰旣不可追伏望陛下如臣前奏下詔不以有官無官當職不當職之人皆得進言擇其可取者㣲加旌賞使天下之人知朝廷樂聞善言不惡論事無可取者寝而勿問庻幾願納忠之人猶肯源源而來也臣禀賦愚戇文學政事皆出人下惟不識忌諱不阿權貴遇事妄言無所顧避以此荷知於累朝見稱於衆人若亦不得言則無所復用於聖世矣上辜太皇太后陛下下問之意下負㣲臣平生願忠之心内自痛悼死不瞑目臣乆忝便安今朝廷授以名藩義不敢辭見牒本州索逺接公人起發赴任次到官之日但勉竭疲駑恪勤本職苟力所不逮伏領罪戾而已謝御前劄子催赴闕狀元豐八年五月十五日上右臣今月十五日平明准入内内侍省遞到太皇太后御前劄子一道令臣早至闕廷者臣狂瞽妄言冝從誅譴曲荷開納仍叨奨飾并以臣羸老抱疾過形矜恤螻蟻命㣲何階報謝臣専候陳州逺接兵士到卽起發赴闕次臣無任瞻天望聖激切屏營之至奏乞所欠青苗錢許重疊倚閣狀熈寜四年正月上勘會永興軍准提舉陜西路常平廣惠倉司牒准司農寺牒檢會近准熈寜二年九月四日勅節文所借過青苖錢斛令隨省稅日限送納如遇本户災傷五分已上合隨夏稅納者展至秋稅合隨秋稅納者展至次年夏稅寺司看詳上件勅意人户合隨夏稅送納者如本户災傷五分已上即展至當年秋稅若秋料内更遇災傷自合送納夏料錢斛了足不許再行倚閣若本户更曽借過秋料錢斛即令倚閣秋料數目展至次年夏料送納切慮内有州縣並不詳認上件勅條一例重疊倚閣牒當司請詳此及備録上件勅條徧下諸州軍如是夏料合納青苗錢斛本户災傷五分以上展至秋料送納如秋料内更遇災傷即却合催夏料數目仍將本路借過秋料錢斛展至次年夏料送納了足即不得將兩次災傷重疊倚閣免至人户積欠數多難為了納别致違悞如有昨來夏料係災傷倚閣展至今秋送納者如今秋本户更遇災傷便請疾速催納了足具數申寺仍關報提刑轉運司准此施行者右謹具如前臣竊詳朝廷所散青苖錢斛本為救接窮困闕用之民使得至夏秋成熟所以春散夏斂夏散秋斂或遇本户災傷五分以上即展至次料送納盖以寛假飢民使有以自存非為乗此艱食規求利息今司農寺乃令不得將兩次災傷重疊倚閣如有昨來夏科災傷倚閣展至今秋送納者今秋本户更遇災傷便令疾速催納了足臣竊恐此事不合勅意盖縁一次災傷民間猶有舊來蓄積未至困窮其青苖錢尚許倚閣豈有連併兩次災傷百姓轉更不易之時却令須得送納舊來蓄積旣盡新糓又復不收更将何物可以供輸其逐州縣為見司農寺有此指揮不知有無務行督促嚴加科責使貧下百姓何以為生竊惟朝廷為民父母必不肯如此况災傷倚閣稅賦并借貸過斛斗准條並候豐熟日令分作料次送納如更遇災傷亦權住催理何故青苖錢斛最為緊急獨不許重疊倚閣臣已指揮本路災傷地分永興軍河中陜府同華耀乾觧八州軍請勘會去嵗夏料如係災傷倚閣青苗錢斛展限至秋送納去處若去秋本户更遇災傷其夏料錢斛未得依司農寺指揮催理更聴候朝㫖伏望聖慈特賜采察早降指揮謹具状奏聞伏候勅㫖奏去訖及牒提舉陜西路常平廣惠倉司奉聖㫖冝令提舉陜西路常平廣惠倉司疾速關牒永興軍本路州軍令詳司農寺牒一依修貫指揮即不得施行司馬光牒致誤百姓及時送納劄付司農寺仍仰關牒合屬去處准此次日乞留䑓奏為乞不將米折青苗錢狀熈寜四年正月上准提舉陜西常平廣惠倉司牒右謹具如前本司勘會朝廷元散青苗錢指揮取利不得過二分今來提舉常平廣惠倉司乃依見今饑饉之嵗在市貴價將本倉陳次斛斗紐作見錢支散與人又豫定將來粟麥之價粟毎斗二十五文足小麥毎斗四十文足夲司看詳向去夏秋五糓有豐有儉其糓麥之價固難豫定今將陳色白米毎斗紐作見錢七十五文若折計作小麥價錢支俵毎斗四十文共折計得小麥一斗八升七合半則是貧民於正二月間請得陳色白米一石却將來納着新好小麥一石八斗七升五合若折計作粟錢支俵毎斗二十五文足計支則一斗白米價錢七十五文足共折得粟三斗則是貧民闕乏之時只請得陳色白米一石却將來共納着新粟三石若只送納見錢即又須賤糶斛斗以償官中本利使貧下之民寒耕熱耘竭盡心力所收斛斗於正稅之外更以巧法取之至盡不問嵗豐嵗儉常受飢寒顯見所散青苖錢大為民害竊惟朝廷從初散青苖錢之意本以兼并之家放債取利侵漁細民故設此法抑其豪奪官自借貸薄收其利今以一斗陳米散與飢民却令納小麥一斗八升七合五勺或納粟三斗所取利約近一倍向去物價轉貴則取利轉多雖兼并之家乗此飢饉取民利息亦不至如此之重國家為民父母置此二倉名為常平廣惠豈當如此今邉鄙用兵軍糧闕乏旣無餘剰可以賑貸伏望朝廷憫此農民遭值凶饑困窮憔悴鄰於死亡直將上件常平廣惠倉斛斗依先降朝㫖借貸與第四等以下人户更不取利若不能如此須欲作青苗錢俵散之時即乞不以元糶價貴賤更不紐作見錢只據所散與人户石斗至將來成熟令出息二分毎散得一斗米者納一斗二升細色或依倉式例折作粗色如此細民猶不至窮困官中取利雖薄亦不减二分元數如允所請伏乞早降指揮謹具狀奏聞伏候勅㫖乞以除拜先後立班劄子元豐八年六月四日上臣於前月二十七日夜准閣門告報巳降告身授臣守門下侍郎二十八日三省樞密院同奉聖㫖除知樞密院外門下中書侍郎左右丞同知樞密院事班次等並以除拜先後為序今月四日延和殿進呈竊見張璪等奏乞推臣在上今後依新得指揮伏縁臣以不才誤䝉朝廷拔擢寘諸執政之末已為忝竊况超越倫軰特出其右在臣愚分何以克堪兼臣在二十八日已前伏乞依新得聖㫖以除拜先後為序在安燾之下取進止乞以除拜先後立班第二劄子元豐八年六月五日上臣今月四日曽奏乞依新得聖㫖以除拜先後為序至今未奉指揮臣噐能學術素出人下執政之中最為後來一旦超居衆人之上誠所未安伏望聖慈依臣前奏班在安燾之下取進止傳家集巻四十六欽定四庫全書傳家集巻四十七宋司馬光撰章奏三十請更張新法劄子元豐八年五月二十八日上臣聞詩云毋念爾祖聿修厥德故夏遵禹訓商奉湯典周守文武之法漢循高祖之律唐行太宗之制子孫享有天禄咸數百年國家受天明命太祖太宗撥亂返正混一區夏規模宏逺子孫承之百有餘年四海治安風塵無警自生民以來罕有其比其法可謂善矣先帝以睿智之性切於求治而王安石不達政體專用私見變亂舊章誤先帝任使遂致民多失職閭里怨嗟陛下深知其弊即政之初變其一二歡呼之聲已洋溢於四表則人情所苦所願灼然可知陛下何憚而不并其餘悉更張哉譬如有人誤飲毒藥致成大疾苟知其毒斯勿飲而已矣豈可云姑少少减之俟積以歳月然後盡捨之哉臣曏曽上言教閱保甲公私勞費而無所用之斂免役錢寛富而困貧以飬浮浪之人使農民失業窮愁無吿將官專制軍政州縣無權無以偹倉猝萬一饑饉盗賊羣起國家可憂此皆所害者大所及者衆先宜變更借令皇帝陛下獨覽權綱猶當早發號令以解生民之急救國家之危収萬國之歡心復祖宗之令典况太皇太后陛下同斷國事捨非而取是去害而就利於體甚順何為而不可哉取進止乞改求諫詔書劄子元豐八年上臣先於三月三十日上言乞下詔書廣開言路不以有官無官之人並許進實封狀仍頒下諸路州軍於要閙處出榜曉示鼓院檢院州軍長吏不得抑退臣昨奉聖㫖令入見於今月二十三日到京䝉降中使以五月五日詔書賜臣看閱臣狂瞽妄言曲荷采納豈獨微臣之幸抑亦天下之幸此乃聖主之先務太平之本原也然臣伏讀詔書其間有愚心未安者不敢不冒萬死極竭以聞竊見詔書始末之言固盡善矣中間有云若乃隂有所懐犯非其分或扇揺機事之重或迎合已行之令上則觀望朝廷之意以徼倖希進下則􅃷惑流俗之情以干取虚譽審出於此苟不懲艾必能亂俗害治然則黜罰之行是亦不得已也臣聞明主推心以待其下而無所疑忌忠臣竭誠以事其上而無所畏避故情無不通言無不盡今詔書求諫而又逆以六事防之臣以為人臣惟不上言上言則皆可以六事罪之矣其所言或於羣臣有所褒貶則可以謂之隂有所懐本職之外微有所涉則可以謂之犯非其分陳國家安危大計則可以謂之扇揺機事之重或與朝㫖暗合則可以謂之迎合已行之令言新法之不便當改則可以謂之觀望朝廷之意言民間之愁苦可閔則可以謂之􅃷惑流俗之情然則天下之事無復可言者矣是詔書始於求諫而終於拒諫也臣恐天下之士益箝口結舌非國家之福也又止令御史臺出牓朝堂自非趨朝之人莫之得見所詢者狹伏望聖明於詔書中删去中間一節如臣三月三十日所奏頒布天下使天下之人曉然知陛下務在求諫無拒諫之心各盡所懐不憂黜罰如此則中外之事逺近之情如指諸掌矣取進止辭門下侍郎劄子元豐八年五月二十八日上臣准閤門告報已降吿命除臣守門下侍郎者臣先於熈寧三年䝉先帝除臣樞宻副使臣以才力短拙固辭得免自是至今十有六年臣齒􅄠愈衰精力愈耗忽被恩詔力少任重非所克堪豈敢愛身實恐累國伏望聖慈特寢新命聽臣赴陳州本任所有吿身臣不敢祗受取進止辭門下侍郎第二劄子是日中使梁惟簡賜手詔云賜卿手詔深體予懐更不多免嗣君年德未高吾當同處萬務所賴方正之士賛佐邦國想宜知悉再宣諭前日所奏乞引對上殿訖赴任其日已降指揮除卿門下侍郎切要與卿商量軍國政事早來所奏偹悉卿意再降詔開言路俟卿供職施行遂止不上臣伏䝉聖恩差御藥吳靖方宣詔臣令受新除門下侍郎吿身者聖恩重複惶愧愈深臣性質愚魯學術淺短徒以素仗忠信竊慕公直偶為時俗被以虚名誤䝉累朝甄奨承乏侍臣熈寧初王安石說導先帝置三司條例司始議新法臣以為財聚則民散下怨則上危力曽開陳稱其不可言語拙訥不能感悟㝷䝉聖恩除樞宻副使臣貪愛富貴無異於人顧以君無虚授臣無虚受先帝用臣必以為有益國家苟言無足采臣何敢叨居其位是以累上章奏終辭不拜既而請補外郡又乞散官兩任留臺四任崇福臣區區之心惟望先帝察其何故辭貴就賤一賜召對訪以新法於民間果為利害臣得輸肝瀝膽極竭以聞退就鼎鑊死且不朽飲食寤寐不忘此志幽明難欺天實知之不圖先帝奄棄天下臣隕心泣血謂積年所懐生死莫伸及來奔國喪伏䝉太皇太后特降中使宣諭令無惜奏章臣不意愚誠復有所攄發千載一遇不勝踊躍遂首以開言路為請及其他新法之不便者略舉數條今䝉恩差知陳州又詔令過闕入覲到城之日䝉降中使以開言路詔書賜示臣芻蕘之言遽荷采納且喜且懼無地自容然詳讀詔書中間六事有所未安似名為求諫其實拒諫恐士民見者未達聖意莫敢進言方欲上殿論列不意忽奉恩命俾貳左省臣以非才未敢祗受及以言路不通新法為患皆當今切務遂於今早入一劄子辭免恩命并所准偹上殿劄子二道同於通進司投下未審聖意以臣前後所言果為何如若稍有可采乞特出神斷力賜施行則臣可以策勵疲駑少佐萬一若皆無可采則是臣狂愚無識不知為政豈可以汚高位尸重任使朝廷獲曠官之譏微臣受竊位之責他日有誤國事罪不容誅伏望聖慈特寢新命使得自安其分取進止乞申明求諫詔書劄子元豐八年六月十四日上臣伏見皇帝陛下初臨太寳太皇太后陛下同斷萬幾側身虚已渇於求諫特下詔書大開言路此誠明主之先務太平之本原也竊見中間有若廼隂有所懐至是亦不得已也一節天下見者未達聖心咸以為朝廷雖名求諫實惡人論事豫設科禁有上言者皆可以此六事罪之是以盤桓猶豫未敢盡言如此則上恩不得下䆒下情不得上通上下否閉萬事乖失又前來詔書止牓朝堂所詢不廣見者甚少臣愚欲望聖慈下學士院别草詔書除去中間一節務在勤求讜言使之盡忠竭誠無有所諱仍乞徧頒天下在京於尚書省前及馬行街出牓在外諸州府軍監各於要閙處曉示不以有官無官之人應有知朝政闕失及民間疾苦者並許進實封狀言事在京則於登聞鼓院檢院投下委主判官畫時進入在外則於州府軍監投下委長吏即日附逓聞奏不得取責副本强有抑退其百姓無家業人慮有姦詐即令本州責保知在奏取指揮放令逐便候有上件實封奏狀進入至内中伏望陛下以萬幾之暇畧賜省覽其所論至當者當用其言以顯其身其是非相半者捨短取長其言無可采事不可行者亦當矜容不可加罪如此則下情無不通嘉言㒺攸伏聦明周四逺海内如指掌矣或慮奏狀繁多難以親覽即乞降付三省委三省官看詳擇其可取者用黄紙簽出再進入或乞留置左右以偹規戒或乞降付有司施行取進止看閱吕公著所陳利害劄子臣今月一日夜䝉降到吕公著劄子一道付臣看閱所陳更張利害有無兼濟之才直書當與未當具悉奏來者臣自公著到京止於都堂衆中一見自後未嘗私相見及有簡帖往來今公著所陳與臣所欲言者正相符合盖由天下之人皆欲如此臣與公著但具衆心奏聞耳臣聞書曰有廢有興出入自爾師虞庶言同則繹言國家政事欲有所改更必先謀於衆人所言皆同然後行之則無失也傳曰上酌民言則下天上施言為人上者當采酌民言從其所欲則在下之人戴上如天受其恩施也伏望陛下察公著所陳參以臣民所上實封奏狀若與之同者斷志行之勿復有疑臣見太平之功不日可成矣公著一言而天下受其利可謂有兼濟之才所言無有不當惟有保甲一事欲就農隙教習臣愚以為朝廷既知其為害於民無益於國便當一切廢罷更安用教習容臣續具劄子奏聞次其公著劄子謹同封上取進止乞罷保甲劄子元豐八年七月三日上臣竊見先帝以戎狄驕傲侵據漢唐故地有征伐開疆之志故置保甲令開封府界及河北陜西河東三路皆五日一教閱京東西兩路保甲養馬仍各置提舉官權任比監司既而有司各務張皇以希功賞其提舉官專䕶本局不顧他司事干保甲州縣皆不得關預管内百姓不得處治其廵檢指使保正保長競為侵擾蠶食無厭稍不如意擅行捶撻其保丁習於遊惰不復務農或自為刼掠或侵陵鄉里其本家耕種耘穫率皆妨廢供送不辦率斂無窮貲産耗竭無以為生弱者流移四方壯者亡為盗賊行之數年先帝浸知其弊申勅州縣令保甲應有違犯并廵教官指使違法事件並許州縣覺察施行及陛下踐阼聽政首令京東西路保甲養馬並依元降年限収買其剰買過數目並以充次年之數又令開封府界三路團教已及半年經朝廷按閱者每月併教兩日未經按閱者併教三日陜西團教未及半年者每月兩次併教三日又令見教人身材弱小或久來疾病及本家止有一丁病患不堪營作并第五等巳下地土不及二十畝者並許州縣保明提舉司審驗放免又令一縣不得放免過二分此皆聖澤矜寛民力於保甲勞費雖什减五六然保甲保馬向去㸃擇買養補填尚猶如舊其廵教指使保正保長名目猶在於所轄保甲恐不免須有陵逼侵漁其四時教閱雖减日數未免妨農臣愚以為此保甲若使之逐捕賊盗則近已有指揮廵檢縣尉及弓手兵級人數並令依保甲未上畨以前人數復置其保甲更不令管勾捕盗若使之攻討四夷則此皆畎畝白徒教閱雖熟未嘗見敵與戎狄戰鬭必望風奔潰登極詔書戒勅邉吏令不侵擾外界務要静守疆場然則此保甲保馬的實有何所用徒令府界及五路農民不堪愁苦幸賴社稷之靈適值累年豐稔猶流民甚多盗賊充斥若遇如明道年之蝗康定年之旱至和年之水則其為國家大患豈可盡言近者羣盗王冲乗保馬諸處行刼置保馬本欲逐盗今更為盗資又獲鹿縣保甲斫射毆傷提勾孫文廵檢張宗師以下陵上是乃大亂之源漸不可長凡保甲保馬有害無利天下之人莫不知之臣不知朝廷何憚而乆不廢罷伏乞斷自聖志盡罷諸處保甲保正保長使歸農依舊置耆長壯丁廵捕盗賊戸長催督稅賦其所養保馬揀擇勾収太僕寺量給價錢分配兩騏驥院坊監及諸軍召提舉官還朝其勾當公事廵檢指使並送吏部與合入差遣如此則開封府界及五路之民孰不歡呼鼓舞荷戴聖德若以保甲中武藝已成之人可惜使之歸農即乞令逐縣戸數每五十戸置弓手一人略依縁邊弓箭手法許䕃本戸田二頃與免二稅或稅輕者與免若干石斗稅及戸下諸般科役本戸田不足聽䕃親戚田務在優假使人勸慕然後召募本縣鄉村戸有勇力武藝者投充弓手計即今保甲中有勇力武藝者必多願應募若一人闕額有二人以上争投者即委本縣令佐揀試武藝高强者充若見充弓手人有勇力武藝衰退許他人指名比較若勝於舊者即令充替如此則不須教閱武藝自然常得精熟一縣之中其勇壯者既充弓手其羸弱者雖使之為盗亦無能為患仍委本州及提㸃刑獄常切按察令佐有取捨不公者重加刑典若無人投名乞更議優法若尚召募不足即且於鄉村戸上依舊雇人候有投名者即令充替若弓手數多即令分畨更互在縣祗應一年一替其餘各分定地分廵捕賊盗每獲賊勘得赦後住止及窩藏去處其本地分嚴行科責及令出賞錢與獲賊之人其賊發地分更不作三限科校只令捕賊給賞如此則賊發之處捕盗之人不復掩蔽住止窩藏之處捕盗人不肯庇匿盗賊無所容身自然稀少取進止乞罷免役錢狀元豐八年上右臣竊以百姓出力以供在上之役盖自古及今未之或改熈寧中執政者以為百姓惟苦差役破産不憚増稅乃請據家貲高下各令出錢雇人充役按因差役破産者惟鄉戸衙前有之自餘散從承符弓手手力耆戸長壯丁未聞破産者也其鄉戸衙前所以破産者盖由山野愚戇之人不能幹事使之主管官物或因水火損敗或為上下侵欺是致欠折備償不足有破産者至於長名衙前乆在公庭句當精熟每經重難差遣積累分數别得優輕場務酬奨徃徃致富何破産之有夫差役出於民錢亦出於民今使民出錢雇役何異割鼻飼口朝三暮四於民何所利哉又曏者役人皆上等戸為之其下等單丁女戸及品官僧道本來無役今更使之一槩輸錢則是賦斂愈重非所以寛之也故自行免役法以來富室差得自寛而貧者困窮日甚殆非所抑兼并哀惸獨均賦役也又監司守令之不仁者於雇役人之外多取羨餘或一縣至數萬貫以冀恩賞規進取不顧為民世世之患又國家舊制所以必差青苗戸充役人者為其有莊田家屬有罪難以迯亡故頗自重惜今雇浮浪之人充役常日恣為不法一旦事發單身竄匿何處州縣不可投名又農家所有不過穀帛與力自古賦役無出三者自行新法以來青苗免役及賦斂多責見錢錢非私家所鑄要須貿易外求豐歳穀賤已自傷農况廹於期限不得半價盡糶所収未能充數家之餱粮不暇更留若值凶年則又無穀可糶人人賣田無所可售遂至殺牛賣肉伐桑鬻薪來年生計不敢復議此農民所以重困也又錢者流通之物故謂之泉布比年以來物價愈賤而閭閻益困所以然者錢皆聚於官中民間乏錢貨重物輕借使有人鬻薪糴米米價雖賤薪價亦賤故也臣愚以為宜悉罷免役錢其州縣諸色役人並依舊制委本縣令佐掲簿定差替見雇役人其衙前先召募人投充長名召募不足然後差鄉村人戸每經歴重難差遣依舊以優輕場務充酬奨所有見在免役錢撥充州縣常平本錢以戸口為率常存三年之蓄有餘則歸轉運司凡免役之法縱富强應役之人征貧弱不役之戸利於富者不利於貧者及今耳目相接猶可復舊若更年深富者安之民不可復差役矣傳家集巻四十七欽定四庫全書傳家集巻四十八宋司馬光撰章奏三十一乞罷將官狀元豐八年上右臣伏以州縣者百姓之根本長吏者州縣之根本根本危則枝葉何以得安故自古以來凡置州郡必嚴其武備設長吏必盛其侍衛非以重其權驕其人也乃所以安百姓衛朝廷也秦懲周室幹弱枝强之弊既滅六國以為天下不復用兵雖分三十六郡置郡守更以御史監之隳名城銷兵器束以苛法舉動施為皆不得自專是以陳勝吳廣以匹夫奮臂大呼郡縣莫能制多殺長吏以應之雖由其殘虐取亡亦守令無權無兵之所致也晉武帝平吳亦以為天下既一兵無所用悉去州郡兵陶璜山濤皆言州郡武備不可廢帝不聽及永寧以後盗賊羣起州郡無備不能擒制天下遂大亂夫兵者所以威不軌而昭文德誰能去兵州縣無虞則國家安矣州縣不守則國家危矣臣切見國朝以來置總管鈐轄都監監押為將帥之官凡州縣有兵馬者其長吏未嘗不兼同管轄盖知州即一州之將知縣即一縣之將故也先帝欲征伐四夷患諸州兵官不精勤訓練士卒懈弛於是有建議者請分河北陜西河東京東京西等路諸軍若千人為一將别置將官使之專切訓練其逐州總管以下及知州知縣皆不得關預及有差使量留羸弱下軍及剥員以充本州官白直及諸般差使其餘禁軍皆制在將官專事教閱臣愚以為職事修舉在於擇人不在設官苟得其人雖總管等皆能訓練士卒不得其人雖將官亦何所為况今之將官即曏之為總管等者也豈為總管等則不能舉職為將官乃能舉職乎此徒變易其名無益事實非惟無益兼復有害凡設官分職當上下相維如身之使臂臂之使指紀綱乃立今為州縣長吏及總管等官而於所部士卒有不相統攝不得差使殆如路人者至於倉庫守宿街市巡邏亦皆乏人雖於條許差將下兵士而州縣不得直差須牒將官將官往往占䕶不肯差撥萬一有非常之變州縣長吏何以號令其衆制禦姦宄哉又頃歳以來自轉運使知州以下白直及迎送之人日朘月減出入導從太為蕭條供承荷擔有所不給觀望削弱無以威服吏民臣略舉目覩一事以證其餘西京城郭周數千里卑薄頺缺犬豕可踰又􅈆洛二水交貫其中每夜諸門扃鐍雖嚴而灘流之際人皆可以平行往來其屬水南北廵檢下所管兵士除出軍外餘數不多通判以下諸官白直來往防送倉庫守宿街市巡邏盡出其間曏者先帝建豫勅西京留守親詣嵩山起建道場其將下禁軍充白直者於條皆不得出城經宿所敢留者剰員七八人而已西京天子别都也其守禦不固如此留守前宰相重官也其侍衞單寡如此况僻小州縣其守禦之備侍衞之衆可知矣萬一有凶校之賊驅烏合之衆突入城邑或刼質戕賊畏吏以焚燒廬舎殺掠吏民將何以制之哉此特天下太平之久習俗淳厚羣心安固賊不測虚實膽智怯弱故未敢為之耳豈可忽略謂之必無而不為之備哉今獨縁邊州軍城隍完固士卒衆多可以守禦自餘腹内州縣既無深溝高城又乏士卒羣盗猝至何以責其竭節守義不棄城竄匿或以酒食迎賊以甲兵獻賊斂民財以賂賊者乎羣盗尚爾况敵人傾國大舉長驅而來者哉易曰君子安不忘危存不忘亡治不忘亂兵法曰不恃敵之不我犯恃我之不可犯國家豈可恃即日平寧晏然高枕不以為慮謂其必不敢來乎臣愚以為河北陜西河東京東京西等路腹内州縣宜以漸候豐年農閒之際委提㸃刑獄與本處長吏相度各修築所治之城州城稍高縣城次之不必廣大所以然者高則難踰小則易守故也其縁邊屯駐兵士遇春夏無事之際委經略安撫使與轉運使公共商量减放歸住營州軍或於内地就糧勿聽怯懦將帥多有虚占以自守衛其腹内州軍量其大小𦂳慢大藩常留千餘人小州亦留數百人不得差發往别州軍見兵不足即行招添悉罷將官其逐州縣禁軍並委長吏與總管等官同共提舉教閱及諸多差使其有不能精勤致士卒懈弛者委提㸃刑獄常切按察聞奏嚴行責降仍令逐縣各選有勇力武藝之人充弓手以守衞城邑討捕盗賊其州縣吏所給白直迎送之人皆如嘉祐編勑以前之數如此力可以守然後遇㓂盗之至責其棄城等罪而誅之彼亦甘心矣乞降臣民奏狀劄子元豐八年七月十四日上臣伏見陛下詔開言路至今已涉旬月必有臣寮民庶上言朝廷闕失民間疾苦奏狀已多未見有付外令三省或樞宻院商量施行者如此則徒煩聽覽何所禆益昔漢昭帝時吏民上書言便宜有異輒下杜延年平處復奏先帝初即位詔中外上言得失亦令臣與張方平同詳定選擇可取者與元奏狀同進入内或降付三省樞宻院施行臣竊計今來臣民所上文字其間是非臧否雖錯雜嘉謀長䇿不可謂無以睿明所燭諒毫髮無遺豈可一概棄置全不采用欲乞選其可從者降出施行或以萬幾之繁未暇遍加省覽即乞依臣前奏降付三省委執政官分取看詳擇其可取者用黄紙簽出再進入或留置左右或降付有司施行取進止乞降封事簽帖劄子元豐八年八月八日上臣聞舜明四目達四聦王者視四海之内皆如戸庭閭閻之間皆如指掌然後能治其天下恭惟太皇太后陛下深居九重皇帝陛下富於春秋四海之廣大閭閻之隱微未嘗身親而目覩也非采聽臣民之言雖以天縱睿智之性何由知之陛下近詔天下臣民皆得上封事言朝政闕失民間疾苦仍降出令臣與諸執政官看詳其第一次降出者三十三巻臣謹與諸執政選擇其中除無取及冗長之辭外其可取者已用黄紙簽出進入訖伏乞陛下取簽出者更賜詳覽或留置左右以備規戒或降付有司商議施行如此則忠言日進聦明日廣誠生民之厚幸社稷之盛福也曏者執政請聽臣寮上殿陛下謙退以為國家政事多未習知臣寮欲言事者自有章䟽何必上殿今臣民章䟽舉集於前若非陛下勤加省覽則朝政闕失民間疾苦何由上聞國家政事無時而習知也其間亦有一事而衆人共言者臣亦重複簽出盖欲陛下知天下所共患衆情所同欲也夫為政在順民心民之所欲者行之所惡者去之則何患號令不行民心不附國家不安名譽不榮哉惟在陛下斷志而力行之耳取進止乞省覽農民封事劄子元豐八年九月三日上臣伏覩近降農民訴疾苦實封奏狀王嗇等一百五十道除所訴重􅃨外俱已簽帖進入竊惟四民之中惟農最苦農夫寒耕熱耘霑體塗足戴星而作戴星而息􅅙婦育􅅙治繭續麻紡緯縷縷而積之寸寸而成之其勤極矣而又水旱霜雹蝗􅈮間為之灾幸而収成則公私之債交争互奪穀未離場帛未下機已非已有矣農夫􅅙婦所食者糠籺而不足所衣者綈褐而不完直以世服田畝不知捨此之外更有可生之路故其子弟遊市井者食甘服美目覩盛麗則不復肯歸南畝矣至使世俗俳諧共以農為􅅓鄙誠可哀也又况聚斂之臣於租稅之外巧取百端以邀功賞青苗則强散重斂給陳納新免役則刻剥窮民収養浮食保甲則勞於非業之作保馬則困於無益之費可不念哉夫農蠺者天下衣食之原人之所仰以生也是以聖王重之臣不敢逺引前古竊聞太宗皇帝嘗遊金明池召田婦數十人於殿上賜席使坐問以民間疾苦田婦愚戇無所隱避賜帛遣之太宗興於側㣲民間事固無不知所以然者恐富貴而忘之也故每臨朝無一日不言及稼穡真宗皇帝乳母秦國夫人劉氏本農家也喜言農家之事真宗皇帝自㓜聞之故為開封尹以善政著聞及踐大位咸平景德之治為有宋隆平之極景德農田勅至今稱為精當昔周公相成王作無逸曰先知稼穡之艱難乃逸則知小人之依盖以一盂之飯一尺之帛莫不出於艱難人主既知之則不肯用之於無益散之於無功驕侈之心無自而生矣伏惟太皇太后陛下深居九重皇帝陛下富於春秋自非今者濬發德音大開言路使畎畝之民皆得上封事則此曹疾苦何由有萬分之一得達於天聽哉其文辭鄙俚語言叢雜皆身受實患直貢其誠不可忽也伏望太皇太后陛下與皇帝陛下同賜省覽庶以開廣聦明資益聖性於民間情偽靡不周知異日太平之業由此為始矣取進止與吕公著同舉程頥劄子元豐八年九月十五日上臣等竊見河南處士程頥力學好古安貧守節言必忠信動遵禮義年踰五十不求仕進真儒者之高蹈聖世之逸民伏望聖慈特加召命擢以不次足以矜式士類禆益風化取進止乞裁斷政事劄子元豐八年十月十七日上臣聞兩貴之不能相事兩賤之不能相使此乃物理自然人情之常也是以聖人立為君臣使人臣各獻其謀而人君裁决其是非若網在綱有條而不紊此國家所以治也若人君不加裁决使人臣各行其意則朝夕鬭訟弱不勝强寡不勝衆不則雷同詭隨尸位竊禄苟且偷安以度目前此國家所以衰也然人君於是非之間亦當三思精察昭然無疑然後决之自古興衰未有不由此塗出也夫人心不同各如其面雖以周公之聖召公之賢同輔成王猶有不恱况邪正忠佞各有所存者乎臣竊惟皇帝富於春秋太皇太后親臨萬幾事無大小皆委於執政垂拱仰成萬一羣臣有所見不同勢均力敵莫能相一者伏望陛下特留聖意審察是非若甲是而乙非當捨乙而從甲乙是而甲非當捨甲而從乙如此則羣臣莫敢不服善政日新矣不然陛下雖有求治之心事功無時而成也况書曰惟辟作福作威不可使用人賞罰之柄盡歸執政人主一不得而專也取進止議可劄子元豐八年十月二十四日上臣聞古人有言謀之在多斷之在獨陛下寛仁委政羣下或政有大疑議論難一儻陛下不决其是非則争辯紛紜無時而息事功何由可成臣謹案蔡邕獨斷叙漢制有疑事公卿百官㑹議若臺閣有正處而獨執異議者曰駁議其合於上意者文報曰某官某甲議可此所以各盡羣下之所見而人主亦不失操柄也今執政之臣雖相與竭力同寅協恭若萬一有議論必不可合者欲乞許令各具劄子奏聞望陛下精察其是非可否以聖意决之或於簾前宣諭或於禁中批出令依某人所奏若羣臣猶有固争執者則願陛下更加審察若前來處分果非則勿憚改為若灼然無疑則决行不移耳如此再思而行庶幾得盡衆心事亦少失矣取進止乞不貸强盗白劄子元豐八年八月上刑部奏鈔曹州勘到百姓趙倩吕德吕文於今年三月二十三日同打刼南華縣界頓榮家財物將鎗刺頓榮一鎗腮上血出打刼得財物被弓手捉獲醫人檢得頓榮元被吕文刺傷處有血是失物傷將刼到賘估定足錢陸貫玖拾玖文本州只為頓榮被刼刺傷時不曽申官檢定痕驗遂具案申奏大理寺㑹到進奏院今年三月六日赦七日到州准律勅合决重杖一頓處死刑部檢到例擬並特貸命决脊杖二十各刺面配廣南逺惡州軍牢城門下勘㑹近年以來諸州勘到劫賊但不曽殺人放火者並作情理可愍或刑名疑慮申奏朝廷率從寛貸竊詳逐人既為刼賊情理有何可愍赦後贓滿傷人刑名有何疑慮此皆逐州官吏避見失入罪名專務便文營已無去害疾惡之心况曹州素多盜賊係重法地分如趙倩等所犯如此皆得免死則是强盗不放火殺人者盡得免死竊恐盗賊轉加恣横良民無以自存殆非懲惡勸善之道其趙倩等欲乞並令本州依法處死仍乞立法自今後應天下州軍勘到强盗情理無可愍刑名無疑慮輒敢奏聞者並令刑部舉駁重行典憲更不得似日前用例破條乞不貸故鬭殺劄子元豐八年八月十四日上竊惟王者所以治天下惟在法令凡殺人者死自有刑法以來百世莫之或改若殺人者不死傷人者不刑雖堯舜不能以致治也近見刑部奏鈔泰寧軍勘到保正家人姜齊見本都代名大保長張存捽着百姓孫遇其孫遇捽着袁貴髻子張存道此人稱是東嶽急脚子胡亂打人不伏収領齊捽着孫遇􅉍互打三二十拳解擘放却袁貴齊與張存捽倒孫遇齊行拳踢打孫遇身死齊發心共張存捉縳袁貴虚做打死元相争人申解赴縣替得償命其袁貴到縣不肯虚招齊䝉枷項隔勘方具實招通又懐州勘到百姓魏簡與郭興争賭錢拽倒郭興家棚子郭興父郭昇拽着簡使頭撞簡簡為本人年老便道你共我不是抵對休扯着我待推揢郭昇圖放却簡用力去郭昇咽喉上揢一揢其人當下倒地身死又耀州勘到百姓張志松為再從弟張小六寃執稱呪罵堂兄弟男女偉志松乘酒嗔恨張小六因此行拳打張小六當時身死上件三人於條皆合處死本州並作情理可憫奏裁耀州仍稱張志松本無殺意刑部一切檢例擬特貸命决脊二十刺配斷所牢城竊詳孫遇不合詐稱東嶽急脚子胡亂打人雖是罪人然罪不至死其姜齊等既解臂放袁貴即合申送赴官依法施行其孫遇别更不曽拒捍及走兼巳就拘執豈可更捽倒毆撃直至於死又更誣執被苦人袁貴作殺人賊欲令替自已償命如此情理有何可憫其魏簡為郭昇年老不欲相打却用力去本人咽喉上一揢至死豈不更甚于歐打又張志松只為張小六寃執呪罵事理至輕遂歐本人致死並是鬭殺於情理皆無可憫凡人因忿相争迭相歐擊其意豈皆在於殺但一人於􅇳限内死則彼一人須當償命况此三人皆即時歐殺當死無疑止是逐州避見失入罪名妄作情理可憫或刑名疑慮奏裁刑部即引舊例一切貸命若因循不改為弊甚大所以然者從來律令勅式有該説不盡之事有司無以處决引例行之今鬭殺當死自有正條而刑部不問可貸與否承例盡免死决配作奏鈔施行是殺人者不死其鬭殺律條更無所用也於殺人者雖荷寛恩其被殺者何所告訴非所以禁制凶暴保安善良也欲乞今後應諸州所奏大辟罪人並委大理寺依法定斷如情理無可憫其刑名無疑慮即仰刑部退囘本州令依法施行如委實有可憫及疑慮即仰刑部於奏鈔後别用貼黄聲說情理如何可憫刑名如何疑慮今擬如何施行令門下省省審如所擬委得允當則用繳狀進入施行如有不當及用例破條即仰門下省駁奏乞行取勘庶使畫一之法不至隳壞凶暴之人有所畏憚其姜齊等縁係未立法以前今欲先次進入大辟貸配法草元豐八年十月二十日授刑部應開封府諸路州軍奏到大辟罪人稱是刑名疑慮及情理可憫者仰大理寺依法定斷并坐疑慮可憫條送刑部看詳如刑名實有疑慮情理實有可憫因依申奏取㫖若看詳得别無疑慮及可憫者即具鈔奏下本處依法施行不得一槩將舊例貸配破却律勅正條仍委門下中書尚書省㸃檢如有不當及用例破條奏乞取勘施行傳家集巻四十八欽定四庫全書傳家集巻四十九宋司馬光撰章奏三十二進孝經指解劄子元豐八年十二月二日上臣竊惟自古五帝三王未有不由學以成其聖德者所謂學者非誦章句習筆札作文辭也在於正心修身齊家治國明明德於天下也恭惟皇帝陛下肇承基緒雖年在㓜冲而執喪臨朝率禮弗越體貌尊嚴舉止安重顒顒卭卭有老成之德華夷瞻仰無不愛戴此乃聖性自然不聞亦式實天祐皇家宗廟社稷生民之盛福也然玉不琢不成器人不學不知道儻復資學問以成之則堯舜禹湯文武何逺之有伏見近降聖旨過冬至開講筵臣竊以聖人之德無以加於孝自天子至於庶人莫不始於事親終於立身揚名於後世誠為學所宜先也臣曏不自揆嘗撰古文孝經指解皇祐中獻於仁宗皇帝竊慮歳久遺失不存今則繕冩為一冊上進伏乞聖明少賜省覽取進止辭轉官劄子元豐八年十二月十二日上臣伏覩中書録黄奉聖旨神宗祔廟畢執政官依故事轉遷以臣為正議大夫者竊惟英宗皇帝親政之初以宰臣韓琦等於嘉祐之末有定䇿大功保佑聖躬濟於艱難故各特遷一官今陛下以神宗皇帝大漸之際宰臣蔡確等啓廸聖心建立儲貳傳授大寳各特遷一官固亦其宜臣當是時方閒居在西京凴几末命非所預聞豈得與確等同受褒賞且國家名位本以醻功報德不可但以祔廟禮畢檢舉故事虚有授受况臣於登極之初已䝉覃恩改官今曽未踰年安敢再叨殊渥縱臣貪冒不知愧恥天下之人其謂臣何所有授正議大夫吿身臣不敢祗受伏望聖慈特賜寢罷取進止辭轉官第二劄子元豐八年十二月上臣於今月十一日伏覩中書録黄䝉恩除正議大夫臣於十二日具劄子奏以蔡確等啓廸神宗皇帝建立儲貳傳授大寳宜遷一官臣閒居西京非所預聞所有正議大夫吿身臣不敢祗受自後未聞降出至十四日准閤門吿報令臣受上件告身臣竊惟富弼輔佐三朝名德老成當嘉祐之初亦是定策之臣但以不預顧命懇辭甚至如臣才德比於富弼無能為役當建儲顧命之際臣為庶僚在外初不預聞豈敢止因祔廟隨例遷官凡為政之要惟在賞功罰罪臣沗備執政無功受賞將何以裁抑他人所有新命伏望聖慈特賜寢罷取進止辭轉官第三劄子元豐八年十二月上臣伏奉詔書以臣辭免恩命所請宜不允者昔英宗皇帝入承大統宰臣韓琦等實有定䇿之功又踐阼之初聖躬違豫慈聖光獻皇太后權同聽政琦等盡忠竭力亦不為不至及英宗皇帝專制萬幾襃賞琦等各遷一官臣時為諫官猶上言以近歳官冗賞濫兩府大臣陛下即政之初宜懲革斯弊今自於朞年之間連併遷官則難以禁他人之幸進者恐宿衞將軍宗室外戚四方藩鎮内侍近臣皆有冀望至時陛下亦不能裁抑兩府亦不敢執奏當是時英宗皇帝雖不収還恩命而富弼亦有定策之功自以不預顧命力辭甚苦况臣既不預定策又不預顧命豈可來自冗散之地遽與輔臣同賞且臣昔日在人則言其不可受今日在已則受而不辭顧行復言能不自愧所有吿身臣不敢祗受伏望聖慈矜察特賜寢罷取進止辭轉官第四劄子元豐八年十二月上臣昨䝉恩除臣正議大夫臣三具劄子及簾前面陳至懇終未賜開允臣夙夜愧恐不能自已臣竊以為政之要惟在於賞功罰罪賞不當功則徼幸競進罰不當罪則善良憂恐亂之基也曏日神宗皇帝大漸之際臣屏居閭閻今乃與建儲受遺之臣一例遷官賞不當功何以過此陛下不知臣不肖使待罪執政執政當為陛下抑徼幸惜官職而身自冒賞何以表率他人臣非敢私飾小亷其志欲為國家慎重名器伏望聖慈矜察特賜寢罷新命所有吿身臣不敢祗受取進止辭轉官第五劄子元豐八年十二月上臣准閣門吿示以臣累上章辭免新命已降批荅不許所有吿身可吿示早令祗受者臣竊惟無功受賞士之所難䆒觀英宗皇帝神宗皇帝即政之初襃賞大臣皆以定策受遺之功非因祔廟禮畢臣既非定策又不受遺實難虚受至於政事日新皆陛下聖明衆賢協力在臣一人何能禆益而無名冒賞惟恐有玷清朝所有吿身臣不敢祗受伏乞早賜寢罷取進止請革弊劄子元豐八年十二月四日上臣伏見陛下自臨政以來夙夜孜孜以愛百姓安國家為事盖善治疾者必䆒其所來攻其所急救之欲速去之欲盡臣觀今日公私耗竭逺近疲弊其原大概出於用兵夫兵者凶器天下之毒財用之蠧聖人除暴定亂不得已而用之耳自有唐中葉藩鎮䟦扈降及五代羣雄角逐四海九州𤓰分縻潰兵相吞噬生民塗炭二百餘年太祖受天明命四征弗庭光啓景祚太宗繼之克成厥勲然後大禹之迹悉為宋有於是載戢干戈與民休息或自生至死年及期頥不見兵革吏守法度民安生業雞鳴狗吠烟火相望可謂太平之極致自古所罕侔矣及神宗繼統材雄氣英以幽薊雲朔淪於契丹靈夏河西專於拓䟦交趾日南制於李氏不得悉張置官吏収籍賦役比於漢唐之境猶有未完深用為恥遂慨然有征伐開拓之志於是邊鄙武夫窺伺小利敢肆大言祗知邀功不顧國患争賈餘勇自謂衞霍不死白面書生披文按圖玩習陳迹不知合變競獻竒策自謂良平更生聚斂之臣捃拾財利剖析秋毫以供軍費專務市恩不恤殘民各陳遺利自謂研桑復出相與誤惑先帝自求榮位於是置提舉官强配青苖多収免役以聚貨泉又驅畎畆之人為保甲使捨耒耜習弓矢又置都作院調筋皮角木以多造器甲又養保馬使賣耕牛市駔駿而農民始愁苦矣部分諸軍無問邊州内地各置將官以領之自知州軍總管鈐轄都監監押皆不得關預捨祖宗教閱舊制誦射法效北服機械陳圖競為新竒朝晡上塲罕得休息而士卒始怨嗟矣置市易司强市㩁取坐列販賣増商稅色件及菜果而商賈始貧困矣又立賖貸之法誘不肖子弟破其家又令民封狀増價以買坊塲致其子孫鄰保籍没貲産不能偹償又増茶鹽之額賤買貴賣强以配民食用不盡廹以威刑破産輸錢又設措置河北糴便司廣積糧穀於臨流州縣以備饋運教兵既久積財既多然後用之而承平日久人已忘戰將帥愚懦行伍驕惰加以運籌决勝者乃浮躁巧偽之士不知彼已妄動輕舉是以頓兵靈武力疲食盡自潰而歸執兵之士荷糧之夫暴骨塞外且數十萬築堡永樂怠忽無備縱冦延敵闔城之人翦為魚肉曽未足以威服戎狄而中國先自困矣先帝深悔其然厭截截諞言思畨畨良士及下哀痛之詔息兵富民奄棄天下此臣所為痛心疾首而泣血追傷者也伏惟皇帝陛下肇承基緒太皇太后同聽庶政首戒邊吏毋得妄出侵掠俾華夷兩安今契丹繼好秉常納貢乾德拜章征伐開拓之議皆已息矣則此置提舉官散青苗斂免役錢㸃教保甲置都作院養保馬置將官市易司封狀買坊塲増茶鹽額措置河北糴便司皆為虚設陛下幸詔臣民各言疾苦其已至者千有餘章未有不言此數事者足知其為天下公患衆人所共知非臣一人之私言也利害著明皎如日月何所復疑而羣臣猶習常安故憚於更張雖頗加裁抑而監司按堵將官具存保甲猶教閱保馬猶養飼邊州屯戍不减軍器造作不休茶鹽新額尚在差役舊法未復是用兵雖息而公私勞費猶未息也如此因循不知改轍數年之後萬一遇水旱大饑盗賊羣起其為國家憂患豈敢盡言哉伏願陛下斷自聖志凡王安石等所立新法果能勝於舊者則存之其餘臣民以為不如舊法之便者痛加釐革雖非一日可行之事欲乞陛下宣諭執政令因臣民上封事熟議利害進呈以聖鑒裁决而行之昔夏遵禹訓商用湯法周循文武之典盖創業垂統之王貽厥孫謀後世所宜謹守不可失也若凡百措置率由舊章但使政事悉如熈寧之初則民物熈熈海内太平更無餘事矣議者必曰革弊不可倉猝當徐徐有漸此何異使醫治疾而曰勿使遽愈且勿除其根原使盡也其為醫者謀則善矣其為疾者謀奚利哉取進止乞罷免役錢依舊差役劄子元祐元年正月二十二日上尋得㫖依奏臣竊見免役之法其害有五舊日差役之時上戸雖差充役次有所陪備然年滿之後却得休息數年營治家産以備後役今則年年出錢無有休息或有所出錢數多於徃日充役陪備之錢者此其害一也舊日差役之時下戸亢不充役今來一例出錢免役驅廹貧民剥膚椎髓家産既盡流移無歸弱者轉死溝壑强者聚為盗賊此其害二也舊日差役之時所差皆土着良民各有宗族田産使之作公人管勾諸事各自愛惜少敢大叚作過使之主守官物少敢侵盗所以然者事發迯亡有宗族田産以累其心故也今召募四方浮浪之人充役無宗族田産之累作公人則恣為姦偽曲法受贓主守官物則侵欺盗用一旦事發則挈家亡去變易姓名往别州縣投名官中無由追捕官物亦無處理索此其害三也自古農民所有不過穀帛與力凡所以供公賦役無出三者皆取諸其身而無窮盡今朝廷立法曰我不用汝力輸我錢我自雇人殊不知農民出錢難於出力何則錢非民間所鑄皆出於官上農之家所多有者不過莊田穀帛牛具桑柘而已無積錢數百貫者也自古豐歳穀賤已自傷農官中更以免役及諸色錢督之則穀愈賤矣平時一斗直百錢者不過直四五十文更急責之則直三二十矣豐年猶可以糶穀送納官錢若遇凶年則穀帛亦無不免賣莊田牛具桑柘以求錢納官既家家各賣如何得售惟有拆屋伐桑以賣薪殺牛以賣肉今歳如此來歳何以為生是官立法以殄盡民之生計此其害四也提舉常平倉司惟務多斂役錢廣積寛剰以為功效希求進用今朝廷雖有指揮令役錢寛剰不得過二分竊慮聚斂之臣猶依傍役錢别作名目隱藏寛剰使幽逺之人不被聖澤此其害五也陛下近詔臣民各上封事言民間疾苦所降出者約數千章無有不言免役錢之害者足知其為天下之公患無疑也以臣愚見為今之計莫若直降勅命應天下免役錢一切並罷其諸色役人並依熈寧元年以前舊法人數委本縣令佐親自掲五等丁産簿定差仍令刑部檢㑹熈寧元年見行差役條貫雕印頒下諸州所差之人若正身自願充役者即令充役不願充役者任便選雇有行止人自代其雇錢多少私下商量若所雇人逃亡即勒正身别雇若將帶却官物勒正身陪填如此則諸色公人盡得有根柢行止之人少敢作過官中百事無不修舉其見雇役人候差别役人各放逐便數内惟衙前一役最號重難曏者差役之時有因重難破家産者朝廷為此始議作助役法然自後條貫優假衙前諸公庫設厨酒庫茶酒司並差將校勾當諸上京綱運召得替官員或差使臣殿侍軍大將管押其麤色及畸零之物差將校或節級管押衙前苦無差遣不聞更有破産之人若今日差充衙前料民間陪備亦少於曏日不至有破家産者若猶以為衙前戸力難以獨任即乞依舊於官戸僧寺道觀單丁女戸有屋業每月掠錢及十五貫莊田中年所収斛斗及百石以上者並令隨貧富分等第出助役錢不及此數者與放免其餘産業並約此為准所有助役錢令逐州樁管據所有多少數目約本州衙前重難分數每分合給幾錢遇衙前合當重難差遣即行支給然尚慮天下役人利害逐處各有不同欲乞於今來勅内更指揮行下開封府界及諸路轉運司謄下諸州縣委逐縣官看詳若依今來指揮别無妨礙可以施行即便依此施行若有妨礙致施行未得即仰限勅到五日内具利害擘畫申本州仰本州類聚諸縣所申擇其可取者限勑書到一月内具利害擘畫申轉運司仰轉運司類聚諸州所申擇其可取者限勅書到一季内具利害擘畫奏聞朝廷候奏到委執政官再加看詳各隨宜修改别作一路一州一縣勅施行務要所在役法曲盡其宜取進止辭免醫官劄子元祐元年正月二十三日上臣以病在朝假伏䝉聖慈連日差中使押醫官沈士安朱有章楊文蔚陳易簡等到臣家各診候留藥臣上荷大恩天隆地厚隕首糜軀無足論報然臣竊聞陳易簡見在病假近皇太后服藥亦祗應不得今以臣故特煩聖㫖督廹令每日一到臣家看候醫治臣忝為人臣實不自安况臣私家亦須更請一醫人每日診候調理其陳易簡已知臣脉氣病狀欲乞特降聖㫖只令臣每日具病狀増减就易簡處取藥更不令易簡每日到臣家診候庶於體分稍得自安取進止辭放正謝劄子元祐元年上臣伏聞降聖㫖在閤門宰臣執政官近遷轉已正謝訖内有司馬光見患在假特放謝仍免赴景靈宫福寧殿恭謝臣聞命震駭無地自處豈有朝廷特遷一官卧家受之並不入謝君降異常之澤臣無一拜之勤自古以來未嘗有此臣雖頑暗必不敢當伏望聖慈早賜収還今來指揮候臣疾患稍痊只依前來指揮减拜入謝及赴景靈宫福寧殿恭謝庶使賤臣粗能自安取進止審内批指揮劄子元祐元年正月上内批依二十八日指揮臣昨日具劄子奏為聖㫖特放正謝仍免赴景靈宫福寧殿恭謝臣以自古以來未有此禮必不敢當當夜准御批依近降指揮臣勘㑹今月十四日内降以臣轉官所有將來正謝特令兩拜起居免舞蹈十七日又准内降所有臣將來合赴景靈宫恭謝逐殿宜止令兩拜二十八日又准入内供奉官劉永年傳宣放臣正謝及景靈宫福寧殿神御前恭謝臣未審御批依近降指揮是依十四日指揮十七日指揮依二十八日指揮須至再有奏禀取進止辭放正謝第二劄子臣昨夜准御批指揮今早再有奏禀䝉復降御批依二十八日指揮臣承命驚惶措躬無地伏念臣忝為人臣陛下賜之一顧賜之巵酒賜之𤓰果臣亦當稽首拜謝况進以高位加之寵名榮動搢紳澤流苗裔豈可即安私室專飬沉疴不造王庭坐受圭組不獨為海内之所共責有司之所直䋲天威違顔不出咫尺隕越斃踣為聖朝羞臣雖至愚粗知自愛何敢受此自納於不測之誅伏望聖慈矜閔候臣所患稍痊安日止依十四日十七日所降指揮减拜入謝及於景靈宫福寧殿神御前恭謝庶使差可自安其二十八日指揮臣以死自守必不敢奉詔取進止辭放正謝第三劄子元祐元年二月上今月五日准尚書省劄子以臣前奏乞候所患稍痊安日依正月十四日十七日所降指揮减拜入謝及於景靈宫福寧殿神御前恭謝今月二日三省同奉聖㫖依正月二十八日指揮臣聞君待臣以惠臣奉君以恭故能上下相親道用交泰陛下念臣衰老抱病筋力尫羸特損朝儀以從私便陛下之大惠也臣若不知禮有靦面目坐受優恩曽無辭避是君有惠而臣不恭上行施而下無報臣雖頑昧心豈敢安伏望聖慈如臣前奏依正月十四日十七日指揮庶使㣲軀有地自處取進止傳家集巻四十九欽定四庫全書傳家集巻五十宋司馬光撰章奏三十三論西夏劄子元祐元年正月上臣伏見神宗皇帝以夏國王趙秉常為臣下所囚興兵致討奮揚天威震動沙漠虜擕其種落竄伏河外諸將収其邊地建米脂義合浮圖葭蘆吳堡安疆等寨此盖止以藉口用為已功皆為其身謀非為國計臣竊聞此數寨者皆孤僻單外難於應援田非肥良不可以耕墾地非險要不足以守禦中國得之徒分屯兵馬坐費芻糧有久戍逺輸之累無拓土闢境之實此衆人所共知也王師既収靈州不克狼狽而歸卒疲食盡失亡頗多西人知中國兵力所至自此始有輕慢之心是以明年邊臣築永樂城虜潛師掩襲覆軍殺將塗炭一城久之又舉一國之衆攻圍蘭州期於必取將士堅守僅而得全虜自是銳氣少挫不敢輕犯邊矣臣聞此數寨之地中國得之雖無所利虜中失之為害頗多何則深入其境近其腹心常慮中國一朝討襲無以支梧不敢安居是以必欲得之不肯棄捨一年前虜嘗專遣使者詣闕深自辨訴請臣服如故其志無他止為欲求其舊境而已朝廷既許其臣服虜來請舊境朝廷乃降指揮其前則云所以興舉甲兵本欲執取罪人救㧞幽辱非有意侵取疆塲土地而已其後乃云止將已得些小邉土聊示削罰豈可更有陳乞還復之理此則朝㫖首尾已自相違又興師本為振㧞秉常拒命者國人之罪豈可更削秉常之地於理差似未安王者以大信御四海羗戎雖㣲恐未易以文辭欺也於是虜既失望憤怒怨懟移文保安軍辭理不遜云今來賀正旦人使難議遣發自是正旦生辰乃至陛下繼明皆不遣使入賀其不臣大矣然而去歳四遣使者詣闕弔慰祭奠吿其母喪并進遺物理雖不備稍示屈服臣竊料虜意不出於三一者猶冀朝廷萬一赦其罪戾返其侵疆二者陽為恭順使中國休怠便隂伺間隙入為邉患三者久自絶於上國其國中貧乏使者往來得賜賚之物且因為商販耳昔衞貳於晉晉取戚田及衞人既服郤缺曰日衞不睦故取其地今已睦矣可以歸之叛而不討何以示威服而不柔何以示懐非威非懐何以示德遂歸戚田于衞今西人所為如此朝廷既不能拒絶勿受其使又不能招納與之更始彼來則迎送館穀以賔客待之不來則一無所問日復一日將踰二年臣竊意朝廷謂西人勢已衰弱心實内附故來則不拒去則不追置之度外不以為虞殊不思數年前王師大舉深入將士所過烈於猛火割其疆埸屢請而不還彼怨毒欲讐報之心窺窬欲乘釁之意日夜不忘若渇者不忘飲盲者不忘視也譬如有虎狼在屋側垂頭熟寢人豈可見其不動狎而侮之循其頭躡其尾邪臣每思之終夕寒心以臣愚慮於今為之止有二策一者返其侵疆二者禁其私市何謂返其侵疆凡天子即位天地一新滌瑕蕩穢小大無遺昔趙佗自稱南越武帝倔强嶺南漢文帝即位赦其大罪遣單使往諭之佗稽首請服累世為臣李繼遷俶擾西陲十有餘年關中困弊真宗皇帝即位赦其大罪割靈夏等數州除其子趙德明為定難軍節度使由是邉境安寧者四十年此乃前世及祖宗之成法非無所依據也今秉常之罪不大於繼遷也米脂等寨不多於靈夏也陛下誠能於此踰年改元之際特下詔書數其累年不來賀正旦生辰及登寳位等不備之禮嘉其弔慰祭奠吿國母喪進遺物之勤曠然推恩盡赦前罪自今以後貢獻賜予悉如舊規廢米脂義合浮圖葭蘆吳堡安疆等寨令延慶二州悉加毁撤除省地外元係夏國舊日之境並以還之其定西城蘭州議者或謂本花麻所居趙元昊以女妻之覊縻役屬非其本土欲且存留以為後圖猶似有名禦夷狄者不壹而足俟其再請或留或與徐議其宜亦無所傷至於㑹州尚在化外而經略司遽稱熈河蘭㑹虜常疑中國更有闢境之心不若改為熈河岷蘭經略司如此則西人忽被德音出於意外雖禽獸木石亦將感動况其人類豈得不鼓舞忭蹈世世臣服者乎議者或曰先帝興師動衆所費億萬僅得數寨今復無故棄之此中國之恥也昔漢元帝棄珠崖詔曰朕日夜惟思議者之言羞威不行則欲誅之通於時變則憂萬民夫萬民之饑餓與逺蠻之不討危孰大焉遂棄之此乃帝王之大度仁人之用心如天地之覆燾父母之慈愛盛德之事何恥之有國家方制萬里今此尋丈之地惜而不與萬一西人積怨憤之氣逞凶悖之心悉舉犬羊之衆投間伺隙長驅深入覆軍殺將兵連禍結如曏日繼遷元昊之叛逆天下騷動當是之時雖有米脂等千寨能有益乎不唯待其攻圍自取固可深恥借使虜有一言不遜而還之傷威毁重固已多矣故不若今日與之之為美也此國大事伏望陛下留神熟慮更與執政詳議以聖意斷而行之不可後時失此機㑹悔將無及何謂禁其私市西夏所居氐羌舊壤地所産者不過羊馬氊毯其國中用之不盡其勢必推其餘與他國貿易其三面皆戎狄鬻之不售惟中國者羊馬氊毯之所輸而茶綵百貨之所自來也故其民如嬰兒而中國乳哺之矣寳元慶厯之間元昊負恩僣亂屢犯邉境大入則大利小入則小利中國未嘗蹈其境破其軍禽其將屠其城有害於社稷也而首尾六年元昊遣使因縁邉吏卑辭納款頓顙稱臣雖其惡積罪盈欲懐音革面原其私心未必不貪中國之財思私市之利故也舊制官給客人公據方聽與西人交易傳聞近歳法禁踈闊官吏弛慢邉民與西人私交易者日夕公行彼西人公則頻遣使者商販中國私則邉鄙小民竊相交易雖不獲歳賜之物公私無乏所以得偃蹇自肆數年之間似恭似慢示不汲汲於事中國由資用饒足與事中國時無以異故也陛下誠能却其使者責以累年正旦生辰及登寳位皆不來賀何獨遣此使者拒而勿内明勅邉吏嚴禁私市俟其年歳之間公私困弊使自謀而來禮必益恭辭必益遜然後朝廷責而赦之許通私市待之如初然邉民與西人交易為日積久習玩為常一旦禁之其事甚難何則若以常法治之則有司泥文動循䋲墨追問證左逮捕傳送之人停匿之家奏裁待報動涉半年如此則徒使邉民麗刑者衆獄犴盈溢而私市終不能禁也夫三尺之限空車不能登峭峻故也百仭之山重載陟其上陵夷故也今必欲嚴禁邉民與西人私市須權時别立重法犯者必死無赦本地分吏卒應廵邏者不覺透漏官員衝替兵士降配仍許人吿捉獲者賞錢若干當日内以官錢支給更不以犯事人家財充如此則縁邉六路各行得一兩人則庶幾可以聳動人耳目令行禁止人不敢犯矣然人存政舉此事全在邉帥得人昔龎籍為河東經畧使下令禁邉民與西人私市有熟戸犯禁籍斬於犯處妻拏皆送淮南編管一境凛然無敢犯者其後施昌言為環慶路經略使亦禁私市西人發兵壓境昌言遣使問其所以來之故西人言無他事只為交易不通使者懼其兵威輒私許之法遂復壊若邉帥未能盡得其人則此法恐未易可行不若前策道大體正萬全無失也取進止乞未禁私市先赦西人劄子元祐元年二月上臣於今月三日上言以西人未服中國不得無憂而邉備不敢少弛不自揆其狂妄獻二策上策欲因天子繼統曠然赦之歸其侵地與之更始下策欲嚴禁私市俟其屈服然後赦之然禁私市甚難立法極嚴又邉帥得人然後能行不若前策之道大體正萬全無失也今竊聞執政用臣下策止令禁私市又立法不嚴邉師未盡得人若邉吏拘文獲一漏百私市滔滔如故或此路禁絶而彼路放行如隄防一存一亡將何所益如此適足以激怒西人使益發悖心安肯屈服萬一㣲犯邉境或表牒中形不遜語至時朝廷轉難處置悔之無及不若用臣上策早相彌縫縱未欲還其侵地且下詔書責而赦之使彼此安心時難得而易失不可忽也况本欲因天子繼統蕩滌其罪今日行之已為太晩若更遷延則赦之無名兹事繫國安危若俟執政論議僉同恐失機㑹誤國大事伏望聖意獨斷行之勿復有疑天下幸甚若有執政立異議乞令其人自入文字若依從其議他日因此致引惹邉事當專執其咎取進止乞先赦西人第二劄子元祐元年二月上臣於今月十二日上言乞以天子繼統曠然更始宜下詔數西人之罪而赦之縱未還其侵地且行此策以安邉境至今聞執政議尚未决臣之愚意以為封内未安未可圖外故欲急行臣前策以羈縻西人且可數年邉鄙無事朝廷得休息戍兵安養百姓待國力完偹家給人足然後奮揚天威討貳柔服何所不可若行臣前策可以萬全行臣後策有得有失豈可棄上策而用下策捨萬全而就有失也本平興國中李繼遷反西陲不解甲者十餘年關中困竭寳元慶厯之間趙元昊叛屢入為冦覆軍殺將自是中國虚耗不復富實今國家理財未得其道民力困窮於下府庫窘乏於上又新遭大喪山陵纔畢自去年十月初以來不雨雪旱勢甚大若萬一激怒西人㣲出一不遜語則并臣前策亦不可行矣今因天子即位未久西人外迹未有不順故臣願朝廷旦夕汲汲行之機㑹難得時不可失此臣所以惓惓進言不已者也若萬一激怒西人致生邉患兵連禍結士卒殄盡於鋒鏑生民困竭於轉餉餓殍蔽地盗賊鋒起為國家慮豈不危哉而執政方以為西人㣲弱不敢復動數遣使來誠心内附置之度外不以為虞今復固執先禁私市之議又立法不嚴邉帥不才者不先易去行之太早不能中節一旦禍生所忽邉鄙震驚乃始歸罪戎狄豈不害國事乎臣於今月三日所上言措置西邉事雖畫二策固以還其侵地責而赦之為上策嚴禁私市待其數年貧困來服然後赦之為下策所謂絶私市非立法至嚴帥臣智勇此法恐未易可行不若前策道大體正萬全無失非臣前後返覆静言庸違也朝廷比來擢臣於冗散之中使預聞國論盖亦誤謂臣㣲有益於國家非徒采其虚名也臣之不敢終辭亦欲竭盡疲駑少酬大恩非苟貪於禄位也今盡忠謀國而為衆所挫臣尚留此有何所用此國大事伏望陛下早審察二議從其長者若聖意以臣言為然乞御批依臣前策若降付三省樞宻院執政仍有固守已見争之最力者乞如臣前奏令自入文字言先禁私市保得他日必不致引惹邉事如其不然身執其咎取進止乞不改更罷役錢敕劄子元祐元年上臣近以抱病家居恐溘先朝露無以少報盛徳是以力疾貪陳所見竊以即日為小民病者無若免役錢欲乞悉行廢罷復祖宗差役舊法識慮愚短誠不意朝廷盡從其說非陛下明斷不能如是此乃天下之幸非獨微臣之幸也然臣聞令出惟行弗惟反彼免役錢雖於下戸困苦而上戸優便行之已近二十年人情習熟一旦變更不能不懐異同又復行差役之初州縣不能不小有煩擾又提舉官專以多斂役錢為功惟恐役錢之罷若見朝廷於今日所下勅微有變動必須相吿曰朝廷之勅果尚未定宜且觀望必競言役錢不可罷朝廷萬一聽之則良法復壊矣伏望朝廷執之堅如金石雖有小小利害未偹俟諸路轉運司奏到徐為改更亦未為晩當此之際則願朝廷勿以人言輕壊利民良法取進止乞罷提舉官劄子元祐元年上臣聞書稱明王立政不惟其官惟其人臣少時見天聖中諸路止各有轉運使一員亦無提㸃刑獄惟河北陜西以地重事多置轉運使兩員然朝廷必擇朝士累任知州有聲迹曉錢穀者乃得為之未嘗輕以授人凡一路之事無所不總使按察官吏薦賢發姦愛飬百姓興利除害或朝廷有本路事務未能細知利害者則委之相度措置當是之時官少民安事無不舉公私饒樂海内晏清景祐初始復置提㸃刑獄其後或時置轉運判官以其冗長害事尋復廢罷自王安石執政以來欲力成新法諸路始置提舉常平廣惠農田水利官其後每事各置提舉官皆得按察官吏事權一如監司又増轉運副使判官等員數皆選年少資淺輕俊之士為之或通判知縣監當資序及選人以權發遣處之有未嘗歴親民即為監司者能順已意則不次遷擢小有乖違則送審官院與合入差遣更加責降彼年少則歴事未多資淺則衆所不服輕俊則舉措率易歴事未多故措置百事往往乖方衆所不服故依勢立威以行號令舉措率易故慮事不熟壊法害民又利禄誘於前罪戾俟於後由是往往上不顧國家事體下不恤百姓怨咨止務希合以圖進取致今日天下籍籍如此皆由此來也陛下幸念民惟邦本本固邦寧知元元困窮於國家非便欲救而安之詔青苗錢不得抑配免役錢寛剰不得過二分竊聞諸路提舉官州縣猶有於春首抑配青苗錢勒百姓供情願狀别作名目占免役寛剰錢但取文具而已如此則朝廷號令廢格不行於臣下恩澤壅塞不被於黎民徒存空文何以為政臣聞去草者絶其本救水者回其原提舉官者乃病民之本原也陛下必欲蘇息疲瘵乞盡罷諸路提舉官其轉運使除河北陜西河東外餘路只置使一員判官一員提㸃刑獄分兩路者合為一路共差文臣兩員凡本路錢穀財用事悉委轉運司刑獄常平兵甲賊盗事悉委提㸃刑獄管勾仍選知州已上資序累歴親民差遣所至有政迹聦明公正之人方得為監司聰明則知官吏賢不肖公正則黜陟無私部下官吏既皆得人事務安有不幹集百姓安有不富庶此乃國家鎮撫四方之本也若以提舉官累年積蓄錢榖財物不少恐轉運司一旦得之妄有耗散即乞盡椿作常平倉錢物委提㸃刑獄一面交割主管依常平倉法謹伺穀價賤糴貴糶及准備災傷賑貸其餘不得支用若轉運司委的窘乏須至兌那常平錢物者必須具數先奏朝廷得㫖乃得移牒支撥若以監司數少路分闊逺處廵歴及管勾不辨即乞只依舊法每歳徧廵諸州更不徧廵諸縣自非要切大事朝廷不令監司親往勾當只令選差本部官除司理司法縣尉獨員監當之類舊條不許差出外其舊條不得隔州差選人勾當差及被差之人皆有罪新條諸州管勾官及主簿當給散月分不得差出之類指揮乞更不施行所貴監司有官可差幹得事務若遇有賊盗乞朝廷只委提㸃刑獄差官或行移文字監督捕盗官捉殺察其不稱職及有可以代之者先令權攝仍奏乞替換許一面相度賊盗强弱立賞錢數目其捕盗官若立功許隨功大小保明乞轉官及升差遣或减年磨勘朝廷更不下刑部磨勘詰難住滯臨時詳酌恩澤直賜指揮賊盗自然無不敗獲不須令親出入監逐捉殺於事無益如此則監司廵歴管勾職事簡要易為辦集取進止傳家集巻五十欽定四庫全書傳家集巻五十一宋司馬光撰章奏三十四論錢榖宜歸一劄子元祐元年上臣竊以洪範八政食貨為先故古者國用必使冡宰制之祖宗之制天下錢榖自常平倉𨽻司農寺外其餘皆總於三司一文一句以上悉申帳籍非條例有定數者不敢擅支故能知其大數量入為出詳度利害變通法度分畫移用取被有餘濟此不足指揮百司轉運使諸州如臂使指朝廷常慎選健吏精於理財者為三司官如陳恕林特李參之類皆稱職有名者也其餘非通曉錢榖者亦罕得叨居其任故能倉庫充溢用度有餘民不疲乏邦家乂安自改官制以來備置尚書省六曹二十四司及九寺三監各有職事將舊日三司所掌事務散在六曹及諸寺監應支用錢物五曹得以自專有司得符即時應副而户部不能制申發帳籍又不盡歸户部户部既不得總天下財賦無由盡知錢糓出内見在之數既不盡知何由量入為出又五曹及内外百官各具理財之法申奏施行户部不得一一關預無由盡公共一利害今之户部尚書舊三司使之任也而左曹𨽻尚書右曹不𨽻尚書天下之財分而為二視彼有餘視此不足不得移用天下皆國家之財而分張如此無專主之者誰為國家公共愛惜通融措置者乎譬人家有財必使一人專主管支用若使數人主之各務已分所有者多互相侵奪又人人得取而用之財有増益者乎故利權不一雖使天下財如江海亦恐有時而竭况民力及山澤所出有限劑乎此臣所以日夜為國家深憂者也今縱未能大有更張欲乞且令尚書兼領左右曹侍郎則分職而治其右曹所掌錢物尚書非奏請得㫖不得擅支諸州錢糓金帛𨽻提舉常平倉司者每月亦須具帳申户部六曹及寺監欲支用錢物皆須先闗户部符下支撥不得一面奏乞直支應掌錢物諸司不見户部符不得應副其舊日三司所管錢榖財用事有㪚在五曹及諸寺監者並乞收歸户部若謂户部事多官少難以辦集即乞减户部冗末事務付閒曹比司兼領而通𨽻户部如此則利權歸一若更選用得人則天下之財庶㡬可理矣取進止乞申勅州縣依前勅差役劄子元祐元年上臣伏見御批指揮以臣近建明差役法慮其間未得盡備差韓維吕大防孫永范純仁專切詳定聞奏臣竊以免役錢之病民自曏日臣僚民庶上封事及日近劉摯等奏陳言之甚詳非獨出臣一人之私意也陛下幸用臣言悉罷免役錢依舊差役詔下之日中外歡呼徃來之人聞道路農民迭相慶賀云今後這囬快活也然則此令之下深合人心明白灼然無可疑者其間條目未備不能委曲盡善固須有之臣所以乞下諸路州縣官吏令㸔詳若有妨礙施行未得即具利害擘畫以次上聞誠以畎畒幽隠南北異宜自非在彼親民小官無以知其詳悉故令各具所見指陳利害所以盡下情求民瘼非謂勅書一下禁人不得復議也俟其奏到徐議添改何後之有要在早罷役錢復差役為大利而已如搆造大厦棟宇已立雖户牖未備可以徐圖今陛下令韓維等再行詳定考究利害宇補漏略成就良法固無所妨但勅下已踰半月州縣差役約以及半方行遣紛紜臣愚竊恐聞此指揮謂朝廷前日之勅改更未定或斂錢或差役尚未可知官吏惶惑不知所從衆庶失望怨嗟益甚必有本因新法得進之臣乘此間隙爭言免役錢不可罷因聚斂獲功之吏稱舊條未改督責免役錢愈急是民出湯火濯清泉復入湯火也伏望朝廷特賜申勅州縣言今來止為其間條目未備令維等詳定所有差役仰州縣依前勅一面施行候詳定到事節續降下次免致於差役中半紛紜之際令出反汗人情大揺實天下幸甚取進止隨乞宫觀表辭位劄子元祐元年上臣以病羸拜起及上下馬不得請朝假將治已及月餘旬日以來疾大勢雖退飲食亦稍進然氣體疲乏足腫生瘡歩履甚難策杖而行不出堂室况於拜起固所未易臣自料度筋力完復可以朝趨近亦數月逺則半年或過此期未可前定豈有執政之臣身據髙位坐受厚俸既不趨朝又不供職宴安偃仰養病於家何待人言獨不内愧臣是用夙宵惶愧無地自處今不免有表上瀆聖聰乞除宫觀差遣一任以養衰殘竊慮陛下怪其忽有此奏故别具劄子披瀝肝膽伏望聖慈早賜開允取進止辭位第二劄子元祐元年上臣伏䝉聖慈以臣乞宫觀差遣特命入内内侍省東頭供奉官陳衍賜臣批答不允仍斷來章者伏念臣自結髪從學講先王之道聞君子之風竊不自揆常妄有尊主庇民之志不意天幸䝉陛下誤采虚名擢於閭閻之間寘之廟堂之上禮遇過優委任至重臣非木石豈不知荷戴天恩銘心鏤骨願竭駑蹇少報萬分眷戀天庭豈肯輕去不謂一旦嬰此沉痾累月不愈害於飲食不能造朝今雖疾勢漸平飲食亦進而肌骨羸瘠氣力疲乏腫足骭痬餘毒方熾旬月之間必未能趨伏闕廷瞻望天光端居私家尸位竊禄縱陛下寛仁微臣不知廉耻中外有識之士及天下衆庻其謂臣何伏望聖慈矜察依臣前奏除宫觀差遣一任使得自安其分取進止為病未任入謝劄子元祐元年閠二月二日上臣今月二日准閤門承受范禹臣告報已降白麻除臣守尚書左僕射兼門下侍郎令當日入謝者臣先為乆病在假不能朝叅乞一宫觀差遣未奉俞㫖今忽聞制命超升左輔俾之師長百僚豈臣空踈所能堪可臣方别具悃欵辭免未敢祗受况臣即今以乆病少力足瘡未愈歩履甚艱拜起不得未任朝見乞候臣筋力稍完入覲宸扆面陳至誠取進止辭左僕射第一劄子元祐元年閠二月上臣今月二日伏聞已降白麻除臣左僕射兼門下侍郎者臣資性愚鈍學術膚淺誤䝉甄采預聞政事常懼不稱䧟于罪戾加以近嬰疾疹乆不朝參方乞宫觀以便頥養豈意天恩出於意表即長中䑓直升元宰躐等踰分近世罕倫愧赧驚懼汗流霑踵况今中外舊臣或輔佐累朝或踐揚兩府髙才碩德顯著甚多若以代臣皆出臣右又即今執政臣位在四若以次而舉亦未至臣伏望聖明歴選其人俾居斯任如臣無狀何敢克當所有新命臣不敢祗受取進止辭左僕射第二劄子元祐元年閠二月上臣今月六日伏䝉聖慈差東上閤門副使王舜封賜臣左僕射兼門下侍郎告身者臣近聞恩命自知非分不敢膺克已累有文字辭免恭俟俞旨今䝉降到告身臣未敢祗受欲乞且留在閤門取進止辭左僕射第三劄子元祐元年閏二月上臣於今月二十三日相繼有劄子辭免新除尚書左僕射恩命未奉俞旨六日又䝉聖恩差東上閤門副使王舜封就臣本家賜臣告身臣亦未敢祗受乞且留在閤門今早勾當御藥院馮宗道傳宣并降到御批早令祗受臣上戴天恩下顧無狀進退惟谷無地自處臣聞髙宗命傅說為相戒之曰若作酒醴爾惟麴糵若作和羮爾惟鹽梅夫釀酒者多麴則太苦多糵則太甘調羮者多鹽則太鹹多梅則太酸和調適冝㝡為難事故以諭良相酌寛猛之政處大小之事必平和允愜曲盡其冝然後為善臣才性長短敢不自知賦分於天樸鈍戇直至於守事君之忠懐愛民之志不為欺罔不渉佞邪如此數條臣敢自保然燭理不明見事不敏度量􅄶隘關防淺露若位以元宰委之機務分畫措置必有差違至時雖自納於刑亦無所益臣非敢愛身實恐誤國况臣之少壯猶不如人今年齒衰老目視近昏事多健忘目前所為轉首不記舉措語言動多差失自近病來耳頗重聽此皆事實衆所共見非臣以虚辭文餙如此豈可首居相位毗賛萬㡬方今老成碩德已試有效及抱道藏噐藴積未施中外之臣不為無人伏望聖慈博訪選以代臣必能稱職所有告身臣未敢祗受縁臣即日歩趨拜起皆所未能朝覲之期無由預定告身留臣本家於理非是伏乞依臣前奏早賜宣取且留在閤門候臣所患痊平堪歩趨拜起入覲天顔靣陳至誠至時若不允許祗受未晩取進止乞黄庭堅同校資治通鑑劄子元祐元年上臣先奉勅編修資治通鑑共成二百餘巻於去年九月内奉聖旨令祕書省正字范祖禹及臣男康用副本重行校定聞奏近又奉聖旨令據巳校到定本逐旋送國子監鏤板竊縁上件文字巻秩稍多其范祖禹近差充修神宗皇帝實録檢討官在彼自有職事慮恐日近校定不辦有妨鏤板臣竊見秘書省校書郎黄庭堅好學有文即日在本省别無職事欲望聖慈特差令與范祖禹及臣男康同校定上件資治通鑑所貴早得了當取進止傳家集巻五十一欽定四庫全書傳家集巻五十二宋司馬光撰章奏三十五乞令校定資治通鑑所冩稽古録劄子元祐元年上臣聞史者今之所以知古後之所以知先是故人主不可以不觀史善者可以為法不善者可以為戒自生民以來帝王之盛者無如堯舜書稱其德皆曰稽古然則治天下者安可以不師古哉伏見皇帝陛下初開經筵先講論語讀祖宗寳訓論語記孔子之言行寳訓述祖宗之聖謀誠為從學之要然國家未有天下以前帝王之事臣愚以為亦不可不知也顧以年祀悠逺載籍浩愽非一日二日所能徧閱而周知所冝提其綱目撮其精英然後可以見治亂存亡之大略也臣先於英宗皇帝時嘗采獵經史上自周威烈王二十三年下盡周世宗顯德六年略舉每年大事編次為圖年為一行六十行為一重五重為一巻凡一千三百六十二年共成五巻謂之歴年圖上之以省煩文便觀覽臣又於神宗皇帝時受詔修國朝百官公卿表臣依司馬遷法自建隆元年至治平四年各記大事於上方書成上之有詔附於國史臣今更討論經史上自伏羲下至周威烈王二十二年略序大要以補二書之闕合為二十巻名曰稽古録欲繕冩奏御而私家少得筆吏恐日近不能了畢竊見先有聖旨令秘書省正字范祖禹等就本省校定臣所編修資治通鑑見有筆吏及紙札等物伏望聖慈特降指揮許臣并上件稽古録送祖禹等令就本局繕冩校對訖先次上進候將來讀祖宗寳訓了日若别未有書可讀欲乞且取臣此書進讀仍令侍讀官隨文觧釋則前王軌轍皆可槩見庶㡬足以資稽古之萬一輔聖性之聰明取進止論賑濟劄子元祐元年上臣竊惟鄉村人户播殖百榖種蓺桑麻乃天下衣食之原比於餘民尤宜存恤凡人情戀土各願安居苟非無以自存豈願流移他境國家若於未流移之前早行賑濟使糧食相接不至失業則比屋安堵官中所費少而民間實受賜若於既流移之後方散米煑粥以有限之儲蓄待無窮之流民徒更聚而餓死官中所費多而民實無所濟伏覩近降朝旨令户部指揮府界諸路提㸃刑獄司體量州縣人户如委是闕食據見在義倉及常平米榖速行賑濟仍丁寧指揮州縣多方存恤無致流移失所此誠得安民之要道然所以能使民不流移者全在本縣令佐得人欲乞更令提㸃刑獄司指揮逐縣令佐專切體量鄉村人户有闕食者一靣申知上司及本州更不候回報即將本縣義倉及常平倉米榖直行賑貸仍據鄉村五等人户逐户計口出給歴頭大人日給二升小兒日給一升令各從民便或五日或十日或半月一次齎歴頭詣縣請領縣司亦置簿照㑹若本縣米榖數少則先從下户出給歴頭有餘則並及上户其不願請領者亦聽候將來夏秋成熟糧食相接日即據簿歴上所貸過糧令隨稅送納一斗只納一斗更無利息其令佐若别有良法簡易便民勝於此法者亦聽從便要在民不乏食不至流移而已仍令提㸃刑獄司常切體量逐縣令佐有能用心存恤闕食人户雖係災傷並不流移者保明聞奏優與酬奬其全不用心賑貸致户口多流移者取勘聞奏乞行停替庻使官吏有所勸沮百姓實霑聖澤取進止乞撫納西人劄子元祐元年三月上臣先於二月中曾上言乞因新天子繼統下詔悉赦西人之罪與之更始雖未還其侵疆且嵗給賜待之如故此道大體正萬全無失既而執政所見各有異同沮難遷延遂屏弃不行臣竊聞今來西人已有關報定使副詣闕賀登寳位國家若於此際又不下詔開而納之萬一西人蓄怨積憤肆其悖心或有一騎犯邉或於表牒中有一語不遜當是之時雖欲招納乃是畏其陸梁傷威毁重何耻如之臣之前䇿亦不可行矣伏望陛下令三省樞密院將臣三月三日十二日十六日并今來所上文字一處進呈臣愚欲為國家消患於未萌誠惜此機㑹夙夜遑遑廢寢忘食陛下若俟詢謀僉同然後施行則執政人人各有所見臣言必又屏弃凡邊境安則中國安此乃國家安危之機伏望陛下察臣所言甚易行而無後害可使華夷兩安為利甚大斷自聖旨勿復有疑取進止撫納西人詔意元祐元年三月上朕聞王者奄有四極至仁無私靡間華夷視之如一夏國主秉常世守西土藩衛中邦自其祖彛興以來沐浴皇化職貢時至率多忠勤仁宗皇帝加之寵名胙以大國錫予之數嵗則有常曏因邊臣奏陳云彼君臣失職及移文詰問曽無報應神宗皇帝乃出師命將拯彼阽危在於夏國主秉常實有大造而所部之人􅃍敢自絶侵軼我邊鄙䖍劉我吏民正旦同天皆不入賀國家包以大度置而不問但絶嵗賜以俟悛心不幸先帝違弃萬國朕嗣守令緒祗承前志夙夜寅畏迨今朞年宣廣恩澤無幽不振而夏國主秉常屢遣使者造于闕庭弔祭訃告寖修常軄朕惟江海之大來則受之豈復追念徃昔校計細故冝捨其前日之不恭取其今茲之效順曠然湔滌與之更始自今申敕將吏嚴戢兵民毋得輙規小利擾彼疆場凡嵗時頒賚命有司率由舊章必使桴皷不鳴􅇏燧無警彼此之民早眠晏起同底太寜不亦休哉可布告中外咸使聞知辭接續支俸劄子元祐元年三月上臣以假滿百日自四月以後不敢勘請俸給聞近有聖㫖特再給臣寛假將治其俸給等接續支給臣自正月二十一日以病在朝假乆而不愈亦曽陳乞宫觀以養衰殘聖恩不許更除左僕射臣惶恐失圖不敢復言自爾日望痊平入覲丹扆面陳至誠庻得極竭疲駑且供舊職以補報萬分而臓府雖寧瘡瘍未愈肌體羸瘠足力全無步履甚難拜起不得以此無由朝叅計在假不管本職公事巳及一百一十餘日入覲之期未能自定竊以百日停俸著在舊章况臣當表率百僚豈敢廢格不行臣聞孔子曰先事後得詩云不素餐兮今雖聖澤優厚曲加矜恤而使臣違先事之義重素餐之罪四海指目何以自安伏望聖慈許臣依條百日外住支請受候叅假日依舊庶使臣得安心養疾保全㣲軀取進止乞罷將官劄子元祐元年三月上臣於去年四月二十七日曽上言州縣者百姓之根本長吏者州縣之根本根本危則枝葉何以得安故自古以來置州郡必嚴其武偹設長吏必盛其侍衛所以安百姓衛朝廷也秦㓕六國以為兵不復用雖置郡守而以御史監之墮名城銷鋒鏑故陳勝呉廣起而郡縣不能制國隨以亡晉武帝平呉悉罷州郡兵陶璜山濤皆言州郡武偹不可廢及永寧以後盗賊羣起州郡無備天下遂大亂國朝置總管鈴轄都監監押為將帥之官凡州縣兵馬其長吏未嘗不同管轄葢知州則一州之將知縣則一縣之將也熈寧中謀臣建議分天下禁軍每數千為一將别置將官以領之訓練差使抽那一出其手其逐州總管以下及知州知縣皆不得關預量留羸弱下軍及剰員以充本州白直及諸般差使而已凡設官分職當上下相維如身之使臂臂之使指紀綱乃立今為州縣長及總管等官而於所部士卒有不相統攝殆如路人者至於倉庫守宿街市廵邏亦皆乏人雖於條有許差將下兵士者而州縣不得直差須牒將官將官徃徃占䕶不肯差撥萬一有非常之變州縣長吏何以號令其衆制禦姧宄哉臣目覩前宰相西京留守韓綘謁嵩山起建道埸其將下禁軍充白直者於條不得出城經宿所敢留者剰員七八人而已况僻小州縣其守禦之備侍衛之衆可知矣臣當時乞悉罷將官其逐州縣禁軍並委長吏與總管等官同共提舉教閱及諸處差使其州縣長吏所給白直皆如嘉祐編勅以前之數臣自上此文字後來不聞朝廷有所施行竊見近嵗諸處多闕雨澤盗賊頗多州縣全無武備長吏侍衛單寡禁軍盡屬將官將官多與長吏爭衡長吏勢力逺出其下萬一有如李順王倫攻城䧟邑之冦或如王均王則竊發肘腋之變豈不為朝廷旰食之憂邪王者制治於未亂保邦於未危豈可自恃太平之乆謂必無此等事邪又自祖宗以來諸軍少曽在營常分畨徃縁邊及諸路屯駐駐泊盖欲使之均勞逸知艱難識戰闘習山川自置將官以來苟非有所征討全將起發與將官偕行外其餘常在本營不復分畨屯駐駐泊飽食安坐養成驕惰之性歲月滋乆恐不可復用又每將下各有部隊將准備差遣指使之類一二十人而諸州總管鈐轄都監監押員數亦如舊設官重􅃨虚費廪禄凢將官之設有害無利天下曉軍政者莫不知之臣愚伏望朝廷如臣前奏盡罷諸路將官其禁軍各委本州縣長吏與總管鈐轄都監監押等管轄一如未置將官已前之法其諸州軍兵馬全少不足守禦之處量與立額招添其守禦有備而冦賊之發不能式遏或弃城逃避或率吏民迎賊或斂民財賂賊雖責之以死彼亦甘心今平居騶從且不能備一旦冦至責以死節不亦難哉取進止傳家集巻五十二欽定四庫全書傳家集巻五十三宋司馬光撰章奏三十六舉張舜民等充館閣劄子元祐元年上臣今月二十四日准尚書省劄子准二十二日詔書節文執政大臣冝各舉文學政事行誼之臣可以充館閣之選者三人臣竊見奉議郎張舜民材氣秀異讀書能文剛直敢言竭忠憂國通直郎孫凖學問優博文辭宏贍行義無缺乆淹下僚河南府左軍廵判官劉安世才而自晦愿而有立力學修已恬於進取其人並堪充館閣之選如後不如所舉臣甘當同罪取進止五月三日尚書省劄子光所患已安惟足瘡有妨拜跪不候叅假時放謝仍權免赴前後殿起居許乗轎子三日一至都堂聚議或門下省治事辭三日一至都堂劄子元祐元年上臣伏覩中書省録黄今月二日奉聖㫖以臣所患已安惟足瘡有妨拜跪不候參假特放正謝仍權免赴前後殿起居許乗轎子三日一至都堂聚議或門下尚書省治事者臣聞命震恐無地自處竊念臣臓腑雖安飲食如故但兩足無力瘡口未合歩履艱難拜起不得以此未果朝參至於數日一至政事堂乃唐世以來宿德元老髙年有疾朝廷尊禮特降此命豈伊微臣所敢倫擬况臣自正月二十一日請朝假至今百三十餘日豈有未見君父輒赴省供職况臣於病中除左僕射雖累具劄子辭免未􅂪開允仍􅂪就家賜以告身亦未敢祗受方俟入覲天顔面陳至懇豈可遽治尚書省事伏望聖慈俟臣歩履有力拜起得成參假了日與諸執政一例供職貴於微軀差得自安所有今月二日指揮乞賜寢罷取進止内降付中書省許肩輿至内東門扶掖入對小殿辭入對小殿劄子元祐元年上臣今月二日聞有聖㫖令臣不候參假特放正謝仍權免赴前後殿起居許乗轎子三日一至都堂聚議或門下尚書省治事臣以恩禮太優不敢輒當尋具劄子辭免今月四日又覩中書省録黄奉聖㫖依前降指揮不許辭免仍令閤門告示許肩輿至内東門外令男扶掖至小殿引對特免起居令引見前一日聞奏如此則禮數愈重尤不敢當臣竊惟富弼三世輔臣德髙望重神宗皇帝想見其人故特制此禮乃自古所無顧臣何人敢與為比况親屈乗輿特御小殿以臣勤君其罪至大縱陛下優借而天威咫尺恐隕越隨之似此異數臣决不敢受只候垂簾日於延和殿引見并乞上殿然事有不得已者雖知僭越不得不承順聖恩臣即目上下馬未得及足上有瘡深惡馬汗欲乞如今聖㫖許權乗轎子出入及入内至常時下馬處下轎子又臣兩足無力若無人扶掖委實全拜起不得欲乞今來入見及將來每遇入對並權許令臣男康入殿遇拜時扶掖候痊安日皆復舊規如此則曲成之仁已踰於天地非臣隕身䘮元所能報塞所有其餘恩禮並乞寢罷取進止三省同奉聖㫖令乗轎子至崇政殿門外於延和殿垂簾日引對餘並依前降指揮辭男康章服劄子元祐元年上臣乆在病假今月十二日於延和殿入見并辭免新命以兩足無力拜起不得聖恩特許令臣男康入殿扶掖臣既不得請臣男復賜章服父子忝竊誠不自安所有臣男恩命乞賜寢罷取進止乞與諸位徃來商量公事劄子元祐元年上臣近奉聖㫖許臣乗轎子三日一次至都堂聚議伏縁三省樞密院各有職事難以臣故必令三日一聚議檢㑹去嵗曽有指揮遇假日有公事許於東西府聚議其東西府近北舊有便門臣欲乞於近南更開一便門臣今縁足疾未愈乞遇假日或日晩執政出省後有司合商量公事許乗小竹轎子徃諸位商量其執政有欲商量公事者亦許來臣本位更不一一奏聞所貴論議詳盡事無留滯取進止乞進呈文字劄子元祐元年上臣先奉聖㫖權免赴前後殿起居許乘轎子三日一至都堂聚議又許肩輿至内東門外令男康扶掖至小殿引對臣以恩禮大重不敢輒當只乞於延和殿引見以兩足無力若無人扶掖委實全拜起不得乞今來入見及將來每遇入對並許令臣男康入殿遇拜時扶掖奉聖㫖令乗轎子至崇政殿門外於延和殿垂簾日引對餘並依前降指揮臣今月十八日合至都堂遇其日垂簾臣欲隨執政赴延和殿常起居及上殿進呈文字竊慮閣門以前來聖㫖有免赴起居字及只云三日一至都堂後來聖㫖無將來每遇入對並許令臣男康入殿遇拜時扶掖字不聴臣及男康入殿伏望聖慈傳宣閣門十八日許臣隨執政赴延和殿常起居及上殿進呈文字令臣男康入殿遇拜時扶掖仍自今後每遇入對並乞准此取進止中使徐湜封還傳宣聖㫖且令入都堂尚書省門下省治事所有入殿起居且頥養筋力直候秋涼引對所有元上劄子今却令封還并賜食二合乞進呈文字第二劄子元祐元年上臣今月十六日曽具劄子奏乞於十八日隨執政赴延和殿常起居及上殿進呈文字尋􅂪聖恩差入内東頭供奉官徐湜封還仍傳宣且令入門下尚書省治事所有入殿起居且頥養筋力直候秋涼引對此乃聖恩憐臣疲羸恐不堪勞苦欲且就安逸雖父母之愛其子恐不能如此之備臣隕身喪元無以為報然臣既參假治事若不以時入對面盡愚忠少禆萬一則與未參假時無異所以區區陳請不能自巳臣今欲再乞於二十六日隨執政赴延和殿常起居及上殿進呈文字臣至時自度若筋力委實不能支梧即乞如今來聖㫖且只入門下尚書省治事候筋力稍完再有陳請若且可以支梧即乞每遇垂簾日許隨執政赴延和殿常起居及進呈文字仍乞傳宣閣門自今後每遇臣入對許令臣男康入殿遇拜時扶掖取進止乞進呈文字第三劄子臣自前月十二日參假以來兩曽具劄子奏乞隨執政官於延和殿進呈文字皆􅂪聖恩遣中使封囬令候秋凉陛下矜愛微臣誠至深至厚然陛下不知臣不肖使待罪宰相宰相之職在輔佐天子謨明萬幾朝夕在前啟沃獻替臣自閠二月二日降麻除左僕射屬在病假至今未嘗得一日與諸執政至簾前參陪國論雖許投進文字然中心委細無由一一面陳陛下徒閔其衰病欲使便安於一身不若使之竭盡愚忠庶幾有補於天下臣為私計豈不願宴安在家若顧公義豈得内無愧懼竊恐上則失陛下所以擢用臣之意下則失㣲臣忘身徇國之心况已先奉聖㫖權免前後殿起居朝㑹之勞什减七八臣自體當近日以來病勢亦似更减歩履比曏時稍輕但兩足少力若無人扶掖則全拜不得今不免冒犯無厭之罪伏望聖慈特降指揮令臣每遇殿上問聖體及謝恩等合拜之時特令免拜若在殿下常起居許令臣男康扶掖仍乞傳宣閣門每遇臣入朝許令臣男康隨入殿門如此則於臣羸病之軀優假巳極於公家之務亦無所廢臣今欲乞如臣前奏於今月八日隨執政赴延和殿常起居及上殿進呈文字取進止此劄子若降付三省再候進呈則八日以前皆值假故不坐八日入朝不及如允臣所奏乞直批降指揮依奏乞進呈文字第四劄子臣近曽三次具劄子奏乞與諸執政赴延和殿進呈文字皆䝉聖慈遣中使封還云候秋凉雖天恩矜憫隆厚無窮然臣既待罪宰相豈可不於簾前參陪國論况今已立秋兼臣自體當得筋力差勝於前可以枝梧只是無人扶掖全拜起不得欲乞如臣前奏候垂簾日許令與諸執政赴延和殿常起居同進呈文字并乞特降指揮自今後每遇臣入對許令臣男康隨入殿門取進止聖意若不欲批指揮即乞降赴三省乞赴延和殿起居劄子尋封囬臣昨乞自今後遇延和殿垂簾日赴起居奏事䝉聖恩依所乞為足瘡所有起居等冝特與權免拜及令男康扶掖入殿者臣若得男康扶掖實可以拜起臣既乆不面天顔豈有全不拜之理欲乞每遇延和殿垂簾日與吕公著同班常起居取進止乞官劉恕一子劄子元祐元年上臣伏覩祕書少監劉攽等奏故祕書丞劉恕同編修資治通鑑功力最多比及書成編修屬官皆䝉甄録惟恕身亡其家獨未霑恩門户單露子孫並無人食禄乞依黄鑑梅堯臣例官其一子臣徃嵗初受勅編修資治通鑑首先奏舉恕同修恕愽聞强記尤精史學舉世少及臣修上件書其討論編次多出於恕至於十國五代之際羣雄競逐九土分裂傳記訛謬簡編缺落嵗月交互事迹差舛非恕精慱他人莫能整治所以攽等衆共推先以為功力最多不幸早夭不見書成未死之前未嘗一日捨書不修今書成奏御臣等皆䝉天恩襃賞甚厚獨恕一人不得霑預降為編户良可矜憫欲乞如攽等所奏用黄鑑梅堯臣例除一子官使其平生苦心竭力不為虚設取進止乞不拒絶西人請地劄子元祐元年上臣近具劄子奏乞於今月八日隨執政延和殿進呈文字復䝉聖慈遣中使封還令依前降指揮臣不敢再三固違聖㫖然臣區區之心所以欲於八日入對者竊見夏國宥州有牒稱已差人詣闕計㑹所侵疆土城寨竊慮其日進呈上件文字此乃邊鄙安危之機生民休戚之本不可不察臣自今年二月初以來累曽上言乞因新天子即位西人恭順之際早下詔書赦其罪戾待遇如故如此則控縱在我天子之體正休兵息民夷夏之心安不幸虜人有一語不遜一騎犯邊則此詔不可復下無何臣在病假不得靣論人心不同為衆所奪日復一日遷延至今虜先遣使來直求侵地指陳兵端辭意寖慢前所議詔書已不可下矣既失此機㑹即日使至應答亦難若悉從其所請則彼益驕而無厭若悉拒而不從則邊患由此而起今就二者之中寧為百姓屈已少從所請以紓邊患不可激令憤怒致興兵犯塞以困生民所以然者靈夏之役本由我起新開數寨皆是彼田今既許其内附豈可猶靳所侵地而不與彼必曰我自天子新即位卑辭厚禮以事中國庻㡬歸我侵疆今猶不許則是恭順無益不若以武力取之彼小則上書悖慢大則攻䧟新城當是之時不得已而與之其為國家之耻無乃甚於今日乎以小喻大譬如甲奪乙田未請而與之勝於請而後與若更請而不與則彼必興鬭訟矣此是非利害明如白黒臣竊慮進呈之際羣臣猶有見小忘大守近遺逺惜此不毛無用之地結成覆軍殺將之禍兵連不觧為國家憂伏望陛下决自聖志勿聽浮言為兆民計文彦愽輔佐四朝熟知虜情此可謂軍國重事願陛下詢彦愽以决之取進止傳家集巻五十三欽定四庫全書傳家集巻五十四宋司馬光撰章奏三十七乞以十科舉士劄子元祐元年上尋依此行臣竊惟為政之要莫如得人百官稱職則萬務咸治然人之才性各有所能或優於德而嗇於才或長於此而短於彼雖皐䕫稷契止能各守一官况於中人安可求備是故孔門以四科論士漢室以數路得人若指瑕掩善則朝無可用之人苟隨噐授任則世無可弃之士臣誤䝉甄擢備位宰相慎選百官乃其職業而智識淺短見聞褊狹知人之難聖賢所重寰宇至廣俊彦如林或以恬退滯淹或以孤寒遺逸被褐懐玉豈能周知若専引知識則嫌於狹私難服衆心若止循資序則官非其人何以致治莫若使在位逹官人舉所知然後克恊至公野無遺賢矣臣不勝狂愚欲乞朝廷設十科舉士一曰行義純固可為師表科有官無官人皆可舉二曰節操方正可備獻納科舉有官人三曰智勇過人可備將帥科舉文武有官人此科亦許鈐轄以上武臣舉四曰公正聰明可備監司科舉知州以上資序五曰經術精通可備講讀科有官無人人皆可舉六曰學問該慱可備顧問科有官無官人皆可舉七曰文章典麗可備著述科有官無官人皆可舉八曰善聽獄訟盡公得實科舉有官人九曰善治財賦公私俱便科舉有官人十曰練習法令能斷請讞科舉有官人應職事官自尚書至給舎諫議寄禄官自開府儀同三司至太中大夫職自觀文殿大學士至待制每嵗須得於十科中舉三人非謂每科各舉三人謂各随所知某人堪充某科共計三人其狀云臣竊見某人有何行能並須指陳事實不得徒餙虚辭位在上者得舉在下之人位在下者不得舉在上之人臣今保舉堪充某科如䝉朝廷擢用後不如所舉謂若舉行義純固而違犯名教節操方正而佞邪險躁智勇過人而愚懦致敗公正聰明而私曲昏闇經術精通而不能講讀學問該愽而空踈牆面文章典麗而鄙拙紕繆善聽獄訟而寃滯失實善治財賦而病民耗國練習法令而屢致出入及犯正入已贓臣甘伏朝典不辭候奏狀到日付中書省擇勤謹吏人二人専切收掌仍十科各置簿畫時抄録年月日某官姓名舉某官姓名别置合舉官臣僚簿嵗終不舉及人數不足按劾施行或遇在京及外方有事須合差官體量相度㸃檢磨勘剗刷催促推勘定奪則委執政親檢逐簿各隨所舉之科選差令試管勾上件事務若能辦集即别置簿記其勞績遇本科職任有闕謂若經筵或學官有闕即用行義純固經術精通學問該愽等科人臺諫有闕即用節操方正科人之類則委執政親檢逐簿選名實相稱或舉主多有勞績之人補充仍於本人除官勅告前盡開坐舉主姓名於後或不如所舉其舉主從貢舉非其人律科罪犯正入已贓舉主减三等科罪若因受賄徇私而舉之罪名重者自從重法期在必行不可寛宥雖見為執政官朝廷所不可輟者亦須降官示罰即朝廷臨時因事特詔舉官謂若舉知河渠馬牧等處之類不在十科之内者有不如所舉亦同此法所貴人人重慎所舉官皆得人取進止起請科場劄子元祐元年上臣伏覩朝廷改科場制度第一場試本經義第二場試詩賦第三場試論第四場試策試新科明法除斷案外試論語孝經義奉聖㫖令禮部與兩省學士待制御史臺國子監司案集議聞奏臣竊有所見不敢不以聞凡取士之道當以德行為先文學為後就文學之中又當以經術為先辭采為後是故周禮大司徒以六德六行賔興萬民漢以賢良方正孝亷質樸敦厚取士中興以後取士尤為精慎至於公府掾屬州從事郡國計吏丞史縣功曹鄉嗇夫皆擇賢者為之苟非其人則為世所譏貶是以人人思自砥礪教化興行風俗純厚乃至後世陵夷雖政刑紊於上而節義立於下有以姧囬巧偽致富貴者不為清議所容此乃德化之本原王者所先務不可忽也熹平中詔引諸生能文賦者待制鴻都門下蔡邕力争以為辭賦小才無益於治不如經術自魏晉以降始貴文章而賤經術以詞人為英俊以儒生為鄙樸下至隋唐雖設明經進士兩科進士日隆而明經日替矣所以然者有司以帖經墨義試明經專取記誦不詢義理其弊至於離經析注務隠争難多方以誤之是致舉人自㓜至老以夜繼晝腐脣爛舌虚費勤勞以求應格詰之以聖人之道瞢若靣牆或不知句讀或音字乖訛乃有司之失非舉人之罪也至於以賦詩論策進士及其末流專用律賦格詩取捨過落擿其落韻失平側偏枯不對蜂腰鶴膝以進退天下士不問其賢不肖雖頑如跖蹻苟程試合格不廢髙第行如淵騫程試不合格不免黜落老死衡茅是致舉人專尚辭華不根道德渉獵鈔節懐挾勦剽以取科名詰之以聖人之道未必皆知其中或遊處放蕩容止輕儇言行醜惡靡所不至者不能無之其為弊亦極矣神宗皇帝深鑒其失於是悉罷賦詩及經學諸科專以經義論策試進士此乃革歴代之積弊復先王之令典百世不易之法也但王安石不當以一家私學欲盖掩先儒令天下學官講觧及科場程試同已者取異已者黜使聖人坦明之言轉而䧟於竒僻先王中正之道流而入於異端若已論果是先儒果非何患學者不弃彼而從此何必以利害誘脅如此其急也又黜春秋而進孟子廢六藝而尊百家加之但考校文學不勉勵德行此其失也凡謀度國事當守公論不可希時又不可徇俗冝校是非之小大利害之多少使質諸聖人而不謬酌於人情而皆通稽於上古而克合施之當世而可行然後為善也今國家大議科場之法欲盡美以臣所見莫若依先朝成法合明經進士為一科立周易尚書詩周禮儀禮禮記春秋孝經論語為九經令天下學官依注疏講說學士愽觀諸家自擇短長各從所好春秋止用左氏傳其公羊糓梁陸淳等說並為諸家孟子止為諸子更不試大義應舉者聴自占習三經以上多少隨意皆須習孝經論語於家狀前開坐習某經某經又每歲委升朝文官保舉一人不拘見在任不在任是本部非本部各舉所知若係親戚亦於舉狀内聲說其舉狀稱臣竊見某州某縣人某甲有何行能臣今保舉堪應經明行修科於後不如所舉臣甘當連坐不辭候奏狀到朝廷下禮部貢院置簿各分逐路抄録本人姓名注舉主官位姓名於其下仍下本州出給公據付本人收執及令本州亦如貢院置簿抄録准備開科場日考驗公據其舉狀既上之後若所舉之人犯贓私罪至徒已上情理重及違犯名教候斷訖仍收坐舉主奏乞朝廷取勘施行其人未及第者减五等已及第者减叄等坐之一如舉選人充京官法臣竊料此法初行其奔競屬請固不能免若朝廷必坐舉主毋有所赦行三五人後自皆慎擇其人不敢妄舉如此則士之居鄉居家獨處闇室立身行已不敢不慎惟懼玷缺有聞於外矣所謂不言之教不肅而成不待學日訓月察立賞告訐而士行自美矣每遇開科場其有舉主者自稱應經明行修舉仍於所投家狀前開坐舉主者位姓名有司檢㑹簿上合同方許收接其無舉主者只稱應鄉貢進士舉如常法每舉人三人以上自相結為一保止保委是正身及是本貫不曽犯真刑無隠憂匿服此外皆不保其本州及貢院考試並依舊法差封彌謄録監門廵鋪官程試之日嚴加檢察如舊試經學諸科法各令求已毋得移坐位相從託商量相聚傳義傳本懷挾代筆違者扶出第一場先試孝經論語大義五道内孝經一道論語四道先須備載正文次述注疏大意次引諸家異義次以已見評其是非以援據精詳理長文優者為通其次為粗援㨿踈略理短文拙者為否三通以上為合格不合格者先次駮放合格者榜引次場就試如舊試經學諸科法或合格人數太少則委試官臨時短中求長詳酌放過次場試尚書次場試周禮次場試儀禮次場試禮記次場試春秋次場試周易大義各五道令舉人各隨所習經書就試考校過落如孝經論語法次場論二道一道於儒家諸子書内出題一道於歴代正史内出題次場試策三道皆問時務考策之日方依觧額及奏名人數定去留編排髙下以經數多者在上經數均以策論理長文優在上其經明行修舉人並於進士前别作一項出榜解發及奏名至御前試時務策一道千字以上封彌官於號上題所明經及舉主人數候考校詳定畢編排之時亦以經數多者在上經數均以策理長文優者在上文理均以舉主多者在上其經明行修舉人亦於進士前别作一項編排先放及第其推恩注官比進士特加優異他時選擇清要官館閣臺諫等並須先取經明行修人其舉主姓名常於官告前聲說如此則舉人皆務尊尚經術窮聖人指趣不敢不精旁覽子史不敢不慱又不流放入於異端小說講求時務亦不敢不知所得之士既有行義又能明道又能慱學又知從政其為國家之用豈不賢於今日之所取乎所有今來乞復詩賦者皆嚮日老舉人止習詩賦不習經義應舉不得故為此說欲以動揺科場制度為已私便朝廷若不欲棄捐舊人候將來科場進士有特奏名者令試詩賦隨其優劣等第推恩亦無傷也不可以此輕改成法復從弊俗誤惑後生若以為文章之士國家所不可無即乞許人於試本經合格日投狀乞試雜文於試論次場引試或古詩或律詩或歌行或古賦或頌或銘或賛或四六表啟臨時委試官出題目試某文定篇數字數共須及五百字以上取辭采髙者為合格候得觧及奏名及第日編排姓名髙下各在經數同等人之上如此則文章之士亦不乏矣至於律令勅式皆當官者所須何必置明法一科使為士者豫習之夫禮之所去刑之所取為士者果能知道義自與法律冥合若其不知但日誦徒流絞斬之書習鍜鍊文致之事為士已成刻薄從政豈有循良非所以長育人材敦厚風俗也朝廷若不欲廢弃巳習之人其明法曽得觧者依舊應舉未曽得觧者不得更應則收拾無遺矣臣愚所見如此伏乞以臣所奏及禮部等官所議榜國子監門及編下諸州有州學處榜州學門令舉人限一月内投狀指定何法為善仰本州附遞以聞候到京齊足更委其他執政㸔詳參酌從長施行取進止謝免北使朝見日起居狀元祐元年上右臣伏覩中書省録黄以今月十一日北使朝見奉聖㫖許臣與文彦愽免赴起居仍候人使升殿降階訖權歸幕次將欲賜茶即升殿臣以乆患脚膝逺行乆立實所未堪方欲奏陳伏䝉聖恩差句當御藥院梁某宣諭令臣於人使見辭日更不赴臣無任感天荷聖激切屏營之至謹録奏謝以聞謹奏傳家集巻五十四欽定四庫全書傳家集巻五十五宋司馬光撰章奏三十八申明役法劄子元祐元年上臣先曽上言乞直降勅命應天下免役錢一切並罷其諸色役人並依熈寧元年以前舊法人數委令佐揭簿定差䝉朝廷一一如臣所請臣竊聞降勅之初百姓莫不喜恱一兩月間州縣定差已了别無詞訟人情安帖無何續有顧募不足方行定差指揮人始疑惑既而屢有更張號令不一又轉運使各以已見欲合本路共為一法不令州縣各從其冝是致州縣惶惑不知所從或已差役人却放或已放顧人却收或依舊用役錢顧人或不用錢招人充役朝夕不定上下紛紜徃徃與二月六日勅意相違竊縁臣元初起請及朝廷所降勅節文明言委州縣官㸔詳依今來指揮若有方礙致施行未得仰具利害擘畫申州州申轉運司轉運司奏聞委執政官再加㸔詳隨冝修改别作一路一州一縣勅施行務要曲盡其冝豈是當日所言一字不可移易但患轉運司州縣不肯奏陳臣今欲申明元初起請内聲說不明不盡事件謹具畫一如後一臣起請雖云依熈寧元年舊法人數定差若舊法人數有於今日不可行者即是妨礙合申乞改更人數或太多或太少惟本州縣知得的確合消數目合酌中立額申乞依數定差朝廷難為遥度一臣起請雖云若所差人不願充役任便選顧有行止人自代其顧錢多少私下商量若所顧之人邀勒被差之人廣求顧直官司亦當裁定不得過自來官中顧錢之數其州縣官員即不得指占所顧之人令被差之人顧覔一臣起請雖云見􅃹役人候差到役人各放令逐便者若所顧之人自有田産情願充役者亦自可依舊存留又曹司一役新差之人多不諳熟書算行遣及案下文字未曽交割合留所顧之人給與顧錢令與新差之人同共行遣限半年内交割了畢才放逐便一臣起請云今日衙前陪備少於曏日不至破家若猶以為户力難任即乞於官户僧道單丁女户有屋業每月掠錢及十五貫莊田中年所收斛斗及百石以上者並等第出助役錢不及此數者與放免臣意以為十口之家歲收百石足供口食月掠房錢十五貫足供日用二者相須此外有餘者始令出助役錢非謂止收百石即令助役也若猶嫌太少及所收掠課利難知實數即乞應係第三等以上令出助役錢第四等已上放免若本州坊場河渡等錢自可支酬衙前重難分數得足則官户等更不消出助役錢一從来諸州招募人投充長名衙前若招募不足方始差到鄉户衙前此自是舊法今來别無改更惟是舊日將坊場河渡折酬長名衙前重難令自出賣今來官中出賣坊場河渡收錢依分數折酬長名衙前重難只此與舊法有異若鄉户差補已足續有投名者即先從貧下放鄉户歸農鄉户願投充長名亦聴一臣起請委逐縣㸔詳具利害擘畫申州本州類聚擇其可取者擘畫申轉運司轉運司類聚諸州所申擇其可取者擘畫奏聞朝廷伏縁知逐處民間利害子細轉運司不如州州不如縣竊慮逐縣逐州有擘畫得事理切當而本州及轉運司抑遏刪去不以上聞致勅下之日依舊妨礙施行未得欲乞更降指揮下州縣如有似此擘畫切當被在上刪去者許逐縣直申轉運司本州直申奏所貴下情無壅曲盡事冝仍乞降指揮下詳定役法所只得以諸路州縣申到利害詳其可否立為定法其不當職之人為髙竒之論不切事情者不得施行亦不可將一路一州一縣利害作海行條貫一詳定役法所奏請行下指揮若有妨礙難行之事亦乞如臣起請委逐路州縣看詳具利害擘畫申上隨宜修改右臣所言若有可取乞遍下諸州縣除此外並依二月六日所降勅命施行取進止乞罷保甲招置長名弓手劄子元祐元年上臣竊見府界及三路保甲雖罷團教猶冬教一月於民有損於官無益不若盡罷之便何則比於團教之時民間勞費雖什减六七然猶有三四此所謂於民有損也朝廷每歲遣使按閱所費金帛以百萬計而終無所用之此所謂於官無益也臣以為不若盡罷之便自置保甲以來盗賊倍多所以然者鄉村無頼子弟乍渉城市聞見紛華自恃身為保丁坐索本家供給飲愽遊蕩習以成性今雖罷團教不肯復歸南畆服田力穡逸欲既深資用不足既家藏利兵又身挾武藝由是邀結黨友群行攻劫父兄不能禁州縣不能制此自然之勢也是以數年以來年不甚饑而府界三路盗賊縱横入縣鎮殺官吏若遇蟲蝗水旱大饑之歲將若之何此不可不為之先慮也以臣愚見莫若盡罷府界及諸路保甲據逐縣主户數目盗賊多少委提㸃刑獄相度每若干户置長名弓手一人與免户下租稅支移折變及夫役諸般差徭科配一無所預務為優假使人歆慕每十人置節級一員五十人置十將一員百人置員寮一員二百人以上置指揮使副指揮使各一員雖不及二百人亦置指揮使副指揮使名目盡􅃹一縣弓手以為賞功資級其節級始初且令本縣令佐依上下名次或選有部轄者權管候有長行捉殺到强盗一人即補充正節級替下權管之人自後每捉殺到强盗一人依此遷一級若未有闕且為守闕不得管人候有闕日補正其累功勞遷至正指揮使滿三年以上又曽捉殺到强盗三人從來不曽犯贓罪者仰本縣官吏結罪保明申州本州官吏結罪保明申奏乞朝廷與於三班借差内安排若遇有强惡賊人朝廷臨時别立賞格者不在此限如此則保申中勇健之士見前有出官之望來應募者必多除第一第二等户物力髙强合充重役不得應募外其餘但於本縣有户籍田産不以等第髙下並許投充長名弓手永無觧役之期若第一第二等户情願以一丁為弓手餘丁充重役者亦聽若一人闕額有二人以上爭投者即委令佐揀試武藝髙强者充之如此則本縣勇健者皆充弓手其餘懦弱者雖使之為盗亦無能為患若見充長名弓手人有勇力武藝衰退者許令外人指名比較若勝於舊者即令充替如此則不須教閱武藝自然長得精熟仍委本州及提㸃刑獄常切覺察令佐有取捨不公者取勘依法施行若應募未滿見今鄉差弓手之數即且令鄉差弓手相兼祗應候招到長名弓手一人即替鄉差弓手一人歸農其鄉差弓手願投長名者亦聴若長名弓手及百人以上即令分一半作兩畨二百人以上每百餘人分作一畨並年終交替其上畨者隨縣尉逐捕盗賊自節級以上各令管所轄之人若所轄之人有小可過犯許一面區分不得過小杖十下若所轄之人敢陵犯本轄人員者杖一百毆者徒一年雖權管亦同本轄人員若於所轄人處取受財物並依律科罪犯贓罪杖者若係管轄權管即降充長行下名若係正人員即降一資自後每捉殺到强盗兩人始當一人罪至徒者不以權正並降充長行下名自後每捉殺到强盗三人始當一人雖許遷資並係額外不得管人不得出官若遇下畨則不相管轄亦無階級其下畨者自十將以下各隨所居之處與耆長同覺察本管地分内曽為强盗之人及窩藏之家凡為强盗者不肯於本管地分作過須在他處盖恐累及本地分捕盗人無所自容故也其本地分捕盗人徃徃知之莫肯發舉盗既得財分贓則絶迹逺遁其賊發地分捕盗人雖欲擒捕莫知其處官中雖立三限科校終無所益由此賊發地分捕盗人每有賊發莫肯申舉若變主懦弱則多方抑塞不令聲賊變主强梁則共陪所失之財勸和使休是致羣盗無所忌憚日益昌熾又告捕得賊多被賊人讎報焚燒莊舎屠害老少其賞錢豈冝留滯而徃徃為州縣沮難有司靳惜動有經年請領不得使之觧體欲乞今後應賊發地分其捕盗人更不立三限科校捕盗官亦不批罰只以擒賊多少論其功賞若敢抑塞隠蔽從嚴法施行仍每州各隨大小賊盗多少借官錢數千貫專充告捕賞錢每獲强盗勘得從來住止窩藏去處候斷遣巳了委本州長吏當日先以官錢支給告捕之人即移牒出賊州縣勾追住止窩藏地分捕盗人科不覺察罪弓手杖一百耆長杖八十壯丁笞四十先籍没賊人及窩藏家財産償所支賞錢外其不足之數令捕盗人等均攤限壹月催足津般赴給賞州軍補填官錢若路逺難以津般則各於本州官錢内關牒折兊其强惡賊人朝廷特於常法外多立賞錢者自以省錢充不在捕盗人均攤之限如此賊盗則無所容身必思改過自新若果行此法府界三路既免教閲勞費之患無頼子弟又有所歸投得以羈縻諸路正鄉村之名復國家舊制勇健之士前有仕進之望爭討賊立功不待教閱而弓手武藝自然不敢衰退不須㸃差而鄉兵自足兼有所用人雖衆多而上下有綱紀不敢相侵暴賊發地分捕盗人不知賊處免虚受刑責出賊地分為累及身不敢蔽匿景跡之人被盗之家無人抑塞有所伸訴賊盗窮窘無所容身稍冀衰息取進止乞令六曹刪减條貫白劄子勘㑹近歲法令尤為繁多凢法貴簡要令貴必行則官吏易為檢詳咸知畏避近㨿中書門下後省修成尚書六曹條貫共計三千六百九十四冊寺監在外又㨿編修諸司勅式所申修到勅令格式一千餘巻冊雖有官吏彊力勤敏者恐不能遍觀而詳覽况於備記而必行之其間條目苛密抵捂難行者不可勝數昨者條貫初下吏部侍郎左選差注不行者數日不免再有奏陳復依舊法必料諸曹條貫皆有似此拘礙難行者今欲特降指揮下尚書六曹委長貳郎官同共㸔詳本曹新舊條貫内有海行已有及全無義理於事無益防禁太繁難為遵守者盡令刪去惟取紀綱大體切近事情朝夕不可無者方始存留作本司條貫限兩月申奏施行傳家集巻五十五欽定四庫全書傳家集巻五十六宋司馬光撰章奏三十九乞先行經明行修科劄子元祐元年上臣先上言乞每嵗委陞朝文官保舉一人應經明行修科與進士並置程試一如進士惟於及第後推恩優異以勸勉天下舉人使敦修士行昨已有朝㫖來年科塲且依舊法施行竊聞近有聖㫖其進士經義並兼用注䟽及諸家之説或已見仍罷律義先次施行臣竊詳朝廷之意盖為舉人經義文體専習王氏新學為日已久來年科塲欲兼取舊學故有此指揮令舉人豫知而習之臣所乞置經明行修科者欲使舉人知向去科塲朝廷敦尚行義不専取文學所以美教化厚風俗比於經義文體尤為要切宜使舉人豫知欲乞亦降朝㫖先次施行况與進士舊法兩不相妨取進止所舉孫準有罪自劾劄子元祐元年上臣先准詔書舉文學政事行誼之臣可以充館閣之選者三人臣舉通直郎孫凖近聞孫準與妻趙氏因爭女使與妻兄趙元裕相論訴状内有虚妄事罰銅六斤臣昧扵知人所舉有罪理當連坐乞賜責降取進止所舉孫凖有罪自劾第二劄子臣先舉孫凖行義無缺堪充館閣之選如後不如所舉甘當同罪近聞凖與妻家爭訟罰銅六斤臣奏乞連坐責降伏䝉聖慈批還云孫凖為家私小事罰銅安有連罪伏緣臣舉状稱凖行義無缺今凖閨門不睦妻妾交爭是行義有缺於臣為貢舉非其人臣不敢逃刑况臣近奏十科或有不如所舉其舉主從貢舉非其人律科罪雖見為執政朝廷所不可輟者亦須降官示罰臣備位宰相身自立法首先犯之此而不行何以齊衆乞如臣所奏從貢舉非其人律施行所貴率厲羣臣審慎所舉取進止後殿常起居乞拜劄子元祐元年上臣竊以人臣見君禮無不拜文彦慱年齡位望皆逺踰於臣每後殿起居猶須拜伏獨臣一人恩㫖不拜忝為臣子實不自安欲乞今後遇文彦慱入朝與之同班不入朝即别為一班依羣臣例常起居况臣自揣近日筋力㣲増若得臣男扶掖其常起居四拜殊不為難伏望聖慈聴許以存朝廷之禮取進止辭大禮使劄子尋改差臣先奉勅差充明堂大禮使伏緣臣自去冬以來脚膝無力拜起艱難至今正月下旬全妨拜起遂請朝假至今首尾八箇月若無人扶掖委實獨自拜起不得每次朝見幸䝉聖恩許男扶掖將來饗明堂在上帝前不可使人扶掖又随皇帝陟降拜伏必恐未能一一如禮欲望聖慈矜憫别賜差官充大禮使取進止論監司守資格任舉主劄子元祐元年上臣竊見御史韓川上言諸路監司不當拘限資格專任舉主當令宰相自加選擇竊緣常調之人不可不為之立資格以抑躁進塞倖門若果有賢才朝廷自當不次選擢豈拘此制凡年髙資深之人雖未必盡賢然累任親民歴事頗多知在下艱難比於元不歴親民便任監司者必小勝矣朝廷執政止八九人若非交舊無以知其行能不惟渉狥私之嫌兼所取至狹豈足以盡天下之賢才若采訪毁譽則愛憎毁譽情偽萬端與其聴逰談之言曷若使之結罪保舉故臣奏設十科以舉士其中一科公正聦明可備監司誠知請屬挾私所不能無但有不如所舉者嚴加譴責無所寛宥則今後自然慎擇不敢妄舉矣至如楚潜等雖無聲名安知其無實用俟其到官無狀廢職并舉主坐之亦未為晩取進止薦王大臨劄子元祐元年八月八日上大臨除太學錄已卒臣竊見鄆州處士王大臨通經術善講説安仁樂義譽髙鄉曲貧不易志老不變節曏嘗有詔敦遣固辭不起伏望聖慈召致京師寘之學官為士類矜式取進止乞官陳洙一子劄子元祐元年上臣竊以嘉祐中仁宗皇帝未有繼嗣故殿中侍御史陳洙奏乞擇宗室之賢者立以為後既發奏状謂家人曰我今日入一文字言社稷大計若得罪大者死小者貶竄汝輩當為之備下奏状者未返洙得疾而卒臣時為諌官親聞見此事竊憐其亡身狥國繼之以死而天下莫之知近見故職方員外郎張術亦以當時乞建儲貳子申伯特補太廟齋郎伏望聖慈依張術例除一子官以旌忠義取進止辭明堂宿衞劄子元祐元年上臣先奉聖㫖將來明堂特與免侍祠攝事導駕及稱賀陪位肆赦立班止令宿衞在於人臣恩禮優厚無以復加捐生隕命不足酬報然臣日近患左足掌底腫痛全然履地不得跬歩不能行未知痊愈之期所有將来明堂宿衛亦恐祗赴不得伏望聖慈特賜矜免乞恩不已慙懼無地取進止辭提舉修實錄劄子元祐元年上臣先奉勅差提舉修神宗皇帝實録臣自受命以來以衰羸多病罕曽得到局供職日近又患左足腫痛不能履地日甚一日未有痊愈之期所有修神宗皇帝實錄伏乞别賜差官提舉取進止進呈上官均奏乞尚書省事類分輕重某事闗尚書某事關二丞某事關僕射白劄子尋得㫖依今欲應尚書省事舊有條例事不至大者並委六曹長官一面專决應奏上者奏上應行下者行下其有衝改條貫或應臨時特取㫖及事體大非六曹所能専决者即申都省委僕射左右丞同商量或送中書取㫖或直批判指揮所有都省常程文字並只委在右丞一面批判指揮施行事體稍大及有所疑者方與僕射商量同批判所有諸色人辭状只委左右丞一面収接可留即留可退即退若六曹判㫁不當及住滯不决即别委不千礙官定奪是非及根究住滯因依若顯有不當及無故住滯其本曹官吏即行按劾所貴上下相承各有職分行遣簡徑事務辦集乞趂時収糴常平斛斗白劄子元祐元年上尋得㫖依奏勘會舊常平倉法以豐嵗糓賤傷農故官中比在市添價収糴使蓄積之家無由抑塞農夫須令賤糶凶嵗糓貴傷民故官中比在市减價出糶使蓄積之家無由邀勒貧民須令貴糴物價常平公私兩利此乃三代之良法也曏者有因州縣闕常平糴本錢雖遇豐嵗無錢収糴又有官吏怠慢厭糴糶之煩雖遇豐嵗不肯収糴又有官吏不能察知在市斛斗實價只信憑行人與蓄積之家通同作弊當収成之初農夫要錢急糶之時故意小估價例令官中収糴不得盡入蓄積之家直至過時蓄積之家倉廪盈滿方始頓添價例中糶入官是以農夫糶榖止得賤價官中糴榖常用貴價厚利皆歸蓄積之家又有官吏雖欲趂時収糴而縣申州州申提㸃刑獄提㸃刑獄申司農寺取候指揮比至回報動渉累月已是失時榖價倍貴是致州縣常平倉斛斗有經隔多年在市價例終不及元糴之價出糶不行堆積腐爛者此乃法因人壞非法之不善也熈寧之初執政以舊常平法為不善更將糴本作青苗錢散與人户令出息二分置提舉官以督之豐嵗則農夫糶榖十不得四五之價凶年則屠牛賣肉伐桑賣薪以輸錢於官錢貨愈重榖直愈輕朝廷深知其弊故罷提舉官令將累年蓄積錢榖財物盡樁作常平倉錢物委提㸃刑獄交割主管依舊常平倉法施行今嵗諸路除有水災州軍外其餘豐熟䖏多今欲特降指揮下諸路提㸃刑獄司乗有此糴本之時委豐熟州縣官各體察在市斛斗實價多添錢數廣行収糴如闕少倉厫之處以常平倉錢添盖仍令少糴麥荳多糴榖米其南方及川界卑濕之地有斛斗難以乆貯者即委提㸃刑獄相度逐州縣合銷數目抛降収糴纔候將来在市物貨價比元糴價稍増即行出糶不得令積壓損壞仍令州縣各勒行人將十年以来在市斛斗價例比較立定貴賤酌中價例然後將逐色價分為三等自幾錢至幾錢為中等價幾錢以上為上等價幾錢以下為下等價令逐處臨時斟酌加减務在合宜既約定三等價仰自今後州縣每遇豐嵗斛斗價賤至下等之時即比市價相度添錢開塲収糴凶年斛斗價貴至上等之時即比市價相度减錢開塲出糶若在市見價只在中等之内即不糴糶更不申取本州及上司指揮免有稽滯失時之患仍委提㸃刑獄常提舉覺察若州縣斛斗價及下等而不収糴價及上等而不出糶及収貯不如法變轉不以時致有損壞并監官不逐日入塲致壅滯糶糴人户並取勘施行若州縣長吏及監官能用心及時糴糶至得替時酌中價錢與斛斗通行比折與初到任時増剰及十分中一分以上許批書上厯子候到吏部日與升半年名次及二分以上許指射家便差遣一次所貴官吏各各用心州縣皆有儲蓄雖遇荐饑民無菜色又得官中所積之錢稍稍散在民間可使物貨流通其河北州縣有糴便司斛斗見多沿邉州縣轉運司見糴軍糧處更不糴常平倉斛斗若今來指揮内有未盡未便事仰委提㸃刑獄司逐旋擘畫申奏施行乞約束州縣不得抑配青苗錢白劄子元祐元年上撿會先朝初散青苖錢本為利民故當時指揮並取人户情願不得抑配自後因提舉官速要見功務求多散諷脇州縣廢格詔書名為情願其實抑配或舉縣勾集或排門抄劄亦有無頼子弟謾昧尊長錢不入家亦有他人冒名詐偽請去莫知為誰及致追催皆歸本户朝廷深知其弊故悉罷提舉官不復立額考較天下莫不欣戴昨於四月二十六日有勅命令給常平錢榖限二月或正月只為人户欲借請者及時得用又令半留倉庫半出給者只為所給不得輒過此數至於取人户情願不得抑配一遵先朝本意慮恐州縣不曉勅意將謂朝廷復欲多散青苗錢廣収利息勾集抑配督責嚴急一如曏日置提舉官時令欲續降指揮下諸路提㸃刑獄司告示州縣並須候人户自執状結保赴縣乞請常平錢之時方得勘會依條支給不得依前勾集抄劄強行抑配仍仰提㸃刑獄常切覺察如有官吏似此違法騷擾者即時取勘施行若提㸃刑獄不切覺察委轉運司安撫司覺察聞奏乞罷散青苖錢白劄子元祐元年上得㫖依昨於四月二十六日降指揮令於正月二月支散常平倉錢􅂖竊慮州縣多不曉朝廷之意將謂却欲廣散青苗錢多収利息嚴行督責一如未罷提舉官時勘會青苗錢利民甚少害民極多臣民上言前後非一今欲遍行指揮下諸路提㸃刑獄司自今後其常平倉錢榖只令州縣依舊法趂時糴糶其青苗錢更不支俵所有舊欠二分之息盡皆除放只令提㸃刑獄契勘逐州縣元支本錢随見欠多少分作料次令隨稅送納傳家集巻五十六欽定四庫全書傳家集巻五十七宋司馬光撰章奏四十乞合兩省為一劄子元祐元年與三省同上臣等聞三王不相襲禮五帝不相沿樂况國家設官分職張立治具上下相維修飾明備何所愧於漢唐何必事事循其陳迹而失當今之宜也謹案西漢以丞相縂百官而九卿分治天下之事光武中興身親庶務事歸臺閣尚書始重而西漢公卿稍已失職矣及魏武佐漢初建魏國置祕書令典尚書奏事文帝受禪改祕書為中書有令有監而亦不廢尚書然中書親近而尚書踈外矣東晉以後天子以侍中常在左右多與之議政事不得任中書於是又有門下而中書權始分矣降及南北朝大抵皆循此制唐初始合中書門下之職故有同中書門下三品同中書門下平章事其後又置政事堂盖以中書出詔令門下掌封駮日有爭論紛紜不决故使兩省先於政事堂議定然後奏聞開元中張説奏改政事堂為中書門下自是相承至于國朝莫之能改非不欲分也理勢不可復分也曏日所謂中書者乃中書門下政事堂也唐末諸司使皆内臣領之樞宻使參預朝政始與宰相分權矣降及五代改用士人樞宻使皆天子腹心之臣曰與議軍國大事其權重於宰相太祖受命以宰相專主文事叅知政事佐之樞宻使專掌武事副使佐之自是以來百有餘年官師相承中外安帖百司長官及諸路監司諸州長吏皆得專達或申奏朝廷或止申中書樞宻院事大則中書樞宻院進呈取㫖降勅劄宣命指揮事小則批状直下本司本路本州本人故文書簡徑事無留滯神宗皇帝以唐自中葉以後官職繁冗名器紊亂欲革而正之誠為至當然但當據今日之事實考前世之訛謬刪去重復去其冗長必有此事乃置此官不必一依唐之六典分中書為三省令中書取㫖門下覆奏尚書施行凡内降文書及諸處所上奏状申状至門下中書省者大率皆送尚書省尚書省下六曹六曹付諸案勘當檢尋文書會問事節近則寺監逺則州縣一切齊足然後相度事理定奪歸着申尚書省尚書省送中書取㫖中書既得㫖送門下省覆奏畫可然後飜錄下尚書省尚書省復下六曹方符下諸處以此文字繁冗行遣迂回近者數月逺者踰年而未曽結絶或四方急奏待報或吏民辭訟求决皆困於留滯又本置門下省欲以封駮中書省録黄樞宻院錄白恐有未當若令舉職則須日有駁正争論紛紜執政大臣遂成不恊故自置門下省以來駁議甚少又門下不得直取㫖行下雖有駮議必須却送中書取㫖中書或不捨前見復行改易又内批文字及諸處奏請多降付三省同共進呈則門下之官已經商量奏决若復有駮正則為反復近日中書文字有急速者往往更不送門下省然則門下一官殆為虚設徒使吏員倍多文書繁冗無益於事臣等今衆共商量欲乞依舊令中書門下通同職業以都堂為政事堂每有政事差除及臺諌官章奏已有聖㫖三省同進呈外其餘並令中書門下官同商議簽書施行事大則進呈取㫖降勅劄事小則直批状指揮一如舊日中書門下故事併兩省十二房吏人為六房同共㸃檢鈔状行遣文書若有溢員除揀選留住外並特與减三年出職不及三年應出職者與减磨勘年限若政事有差失委給事中封駮差除有不當委中書舍人封還詞頭又兩省諌官皆得論列則號令之出亦不為不審慎矣如此則政事歸一吏員不冗文書不繁行遣徑直於先帝所建之官並無所變更但於職業㣲有修改欲令於事務時宜差為簡便其委曲條目並候得㫖允許續議修立取進止乞令六曹長官專逹劄子元祐元年上臣等聞王者設官分職居上者所緫多故治其大要居下者所分少故治其詳細此理勢之自然綱紀所由立也是以周官小宰以官府之六屬舉邦治大事則從其長小事則専達凡宰相上則啓沃人主論道經邦中則選用百官賞功罰罪下則阜安百姓興除利害乃其職也至扵簿領之差失期會之稽違獄訟之曲直胥史之選補皆郎吏之任非宰相所宜親也故人有言察目睫者不能見百歩察百歩者亦不能見目睫言詳於近者必略於逺謹於細者必遺於大也今尚書省事無大小皆决於僕射僕射自朝至暮省覽文書受接辭状未嘗暫息精力疲弊於米鹽細故其於經國之大體安民之逺猷不暇復精思而熟慮恐非朝廷所以責宰相之事業也竊以六曹長官古之六卿事之小者豈可不令專達臣等商量欲乞今後凡有詔令降付尚書省者僕射左右丞簽訖官告黄牒之類已簽訖者更不簽分付六曹謄印符下諸司及諸路諸州施行其臣民所上文字降付尚書省僕射左右丞簽訖亦分付六曹本曹尚書侍郎及本㕔郎官次第簽訖委本㕔郎官討尋公案會問事節相度理道檢詳條貫下筆判云今欲如何施行次第通呈侍郎尚書若郎官所判已得允當則侍郎簽過尚書判准應奏上者直奏上應行下者直行下即未得允當者委侍郎尚書改判事之可否皆决於本曹長官其文字分付本㕔郎官之時委本曹長官随事大小鑿限若有稽遲即行紏劾即委的有事故結絶未得者申長官展吏部尚書如舊日判東西審官院左選侍郎如舊日判流内銓右選侍郎如舊日判三班院户部長官如舊日三司使刑部長官如舊日判審刑院舊日本司文字並直奏直下今欲令六曹長官准此更不由經僕射左右丞即改更條法或奏乞特㫖謂如刑部刑名疑慮或情理可憫或情重法輕特乞停替編配之類或事體稍大或理有可疑非六曹所能專决者聴詣僕射左右丞咨白或具状申都省委僕射左右丞商議或上殿取㫖或頭簽劄子奏聞或入熟状或直批判指揮其諸色人辭状並只令經本曹長官陳過尚書侍郎本㕔郎官次第簽押判决一如朝廷降下臣民所上文字次第施行若六曹不為収接及乆不結絶或判斷不當即令經登聞皷院進状降下尚書省委僕射左右丞判付本省不干礙官員看詳定奪若本曹顯有不當即行紏劾所貴上下相承各有職分行遣簡徑事務易集取進止乞令三省諸司無條方用例白劄子元祐元年上勘會舊例只是前官所行或是或非豈足永為後法近嵗三省及百司多用例破條諸色人亦多於條外攀援體例希求恩澤欲令今後凡有正條者並須依條無條方許用例前例若是所當遵行前例若非即宜釐革只委本省六曹本司長官相度理道與奪批判所貴向去漸除弊例乞令監司州縣各舉按所部官吏白劄子元祐元年上檢會監司知州通判於本部官吏内有罪惡顯著而有失覺察者並連累責降雖有舊條然未嘗一一行遣又慮一路一州官吏衆多上位覺察不盡又未指定合覺察事件致寛者則一切不問急者則濫及無辜又凡為監司州縣長吏當進賢退不肖不可但令覺察有罪不令舉薦賢才今欲立舉薦四條一曰仁惠謂安民利物衆所畏愛非疲軟不立曲取人情者二曰公直謂心無適􅇀事不吐茹非内私外公實佞詐直者三曰明敏謂深察情理應機辦事非飾詐掠美利口矜功者四曰亷謹謂安貧守分動遵法度非詐清釣名偷安避事者按察四條一曰苛酷謂用刑繁苛殘虐踰法者二曰狡佞謂傾險巧詐危人自安者三曰昏懦謂不曉物情依阿無守者四曰貪縱謂饕餮無厭任情不法者凡監司州縣於所部之内皆得以此八條舉按官吏其舉薦者於本部官吏之内有仁惠公直明敏亷謹者可舉則舉無有定數縣舉之州州置簿記姓名州舉之監司監司置簿記姓名監司舉之朝廷中書置簿記姓名各随所舉行能任使以試之果有實効則漸加旌異其按察者監司專按察知州軍通判路分都監以上知州軍通判專按察在州官吏及諸知縣知縣專按察簿尉及縣界内官吏若有苛酷狡佞昏懦貪縱者縣體量申州州體量申監司監司體量申奏續更體量的確事迹紏發施行若有失察覺别致因事彰露其監司降知州軍知州降通判通判各降一資知縣降監當其餘所部官吏監司知州軍通判皆得按察但不坐失覺察之罪即挾情按察不以公者候勘鞫見實自依常法知縣惟得具事迹申州不得擅勘命官乞不帖例貸配劄子元祐元年十月二十日上勘㑹守法者有司之職揆道者君相之權伏見從來命官犯罪大理寺既依法定斷更令刑部檢例或追官或勒停或衝替或差替之類朝廷依而行之謂之特㫖凡人之罪犯千端而事體萬計豈可求其比類能得正同又既謂之特㫖當臨時㫁在朝廷若先令刑部帖例朝廷依此施行乃是輕重之權返在有司也欲今後應命官犯罪大理寺既定㫁委刑部看詳内有法重情輕或法輕情重並具状申中書省更不帖例委中書省官相度情理輕重同共商量除依法外自貸命編配至特放臨時擬定進呈取㫖施行其百姓犯大辟罪諸州奏稱刑名疑慮及情理可憫者大理寺依法定斷委刑部看詳委的有疑慮可憫之状即具状申門下省更不帖例委門下省官相度事理同共商量臨時擬定或依法或貸命編配進呈取㫖施行再申明役法劄子元祐元年上檢會二月六日勅文止是罷免役錢其諸色役人並依熈寧元年以前舊法委令佐掲簿定差尚慮諸路州縣利害各有不同所以下文云委逐縣看詳若有妨礙施行未得即具利害擘畫申州仰本州類聚諸縣所申擇其可取者具利害擘畫申轉運司轉運司類聚諸州所申擇其可取者具利害擘畫奏聞其意欲使本州體量諸縣所申利害之虚實擘畫之是非擇其實而是者條例申轉運司云某縣當如何措置某縣當如何措置其餘已依舊法定差施行轉運司得諸州所申亦如此體量條例申奏盖欲随處差役曲盡其宜非謂使逐路共為一法也今訪聞諸路轉運司不遵用熈寧元年以前舊法又不取諸州縣所擘畫各以已意撰成一路役法差官分詣諸州縣名為商量其實諷諭令随已意却作州縣擘畫立法申奏州縣稍有違異輒加責怒以此多不依應得逐處利便不合民心又諸路州縣見朝廷置詳定役法所以為當别撰役法頒下往往等候下即定差殊不知看詳役法所專候諸路州縣具到利害擘畫即作一路一州勅行下以此觀望遷延乆不了絶今欲特降指揮下諸州縣除有舊法妨礙難行之事速具申陳外其餘並依舊法一面定差其看詳役法㨿逐處先申到利害擘畫事件如得允當逐旋奏乞令本處依此施行所貴差役之法日近早見結絶傳家集巻五十七欽定四庫全書傳家集巻五十八宋司馬光撰書啓一謝檢討啓仰戴寵靈俯循涯分任非才稱憂與愧并竊以帝王垂憲於典墳文武布政於方􅉺參天球赤刀之寳閟石室金匱之嚴豈繄記述之良抑亦討論之美自㣲貫穿前載浹洽舊聞稽古侔倚相之才叙事識子長之體則何以懋明得失考合異同訪逸事於名山求緒言於故老使聖哲丕績蔽天壌而亡窮俊乂隆名炳丹青而不朽原立官之甚重宜擇士以恪居豈容冒塵坐致􅈥曠如光者行能褊淺器質迂踈徒以儒術承家蚤用門資署吏甫任典謁已辱聞詩愚者常專雖慕攻堅之業勤而無獲正如毁瓦之為猥玷士科始陪賔幕漆雕之道未信尹何之傷實多旋屬家艱零丁苫凷比還官次汩沒道塗辭鋒頓而不修學殖落而亡幾分從塵役絶覬榮階俄承乏於􅎩宗遂參華於天祿慶霄清晏蓬渚邃嚴縑素牣盈率多未見英豪坌集叨與並遊顧𤨏陋之無庸每怔忪而自失所虞揚汰敢冀甄収何期佑弼之司誤辱襃稱之奏俾登史觀賛治信書緝記言記動之殊辨所見所聞之實詳明其故紬繹厥文竊惟累洽之辰方咏衆賢之富弗圖嘉命􅃍及窳才靖究所来孰云無自此盖伏遇某官奨延後進汲引下僚采其毫􅄠之長振以齒牙之論使不售之馬立享千金之酬無用之材或充萬乗之器敢不劬勞從事恪慎處躬冀少答於生成庶無慙於知遇謝校勘啓伏以聖哲之道悉載於書書之散訛道亦欝滯是以國家開圖籍之府設校讎之官必求秀􅊆絶特之人使之執事誠以道為重也光天與之分甚顓且愚徒以世家相承習尚儒素故自免去襁褓初知語言父兄提携授以經籍是以不執餘技而逢衣自名曽未能逰聖人之藩籬嚌六藝之糟粕遽用門䕃列於王官始就郷舉徑叨上第常竊自恨道未至而受祿學未優而治民雖媮獲於一時終不足為成人也已而天降之禍服衰五年指景數刻幾無生望洎免喪為吏從事藩方則牒訴文移所居委塞是以舊學益廢剪為荆榛私心悵然每用嘆邑不自意得承乏東序息肩簿領乃始修礪錢鏄誅治荒穢庶幾勉狥宿昔之志雖失之春芸猶得之秋穫足為愈焉敢謂朝之輔臣不察駑朽遽列其名薦之法座上方倚信大臣議無不用遂發中詔引登書府使之款朱闕蹈紫臺倐去蓬蒿頡頏霄漢榮耀過分不寒而栗夙夜循念罔知所來此盖伏遇某官内竭忠力以勤王家外隆寛裕以延士類各適其器不遺衆才顧盼所加人増大吕之重議論所與世劇衮章之榮俾兹妄庸濫獲甄采敢不益自勤敕無違率履勉服故業期於有成庶幾不辱寵靈無負知鑒又謝龐參政啓伏以朋友道缺為日久矣陵夷至於近世益以衰薄甚者旦為好言暮而反之况於存沒之異貴賤之絶苟能言其姓名識其逰處斯可頌矣矧又収撫其孤誘掖成就使之自邜而翼去幽而光天下幾何人哉光質性愚陋動無可稱學古著文皆不逮衆徒以先人疇昔嘗託僚寀獲友髙明道同志合出處如一分義之美近古所希光以童子獲執几杖侍見扵前執事撫髫誨導俾之就學以至冒竊科級叨塵祿位始終之賜皆有自焉及夫上天降災禍罰崇大屏伏田里號咷待盡執事賜書弔撫俾能自存又譔著遺烈表之楸柏使其後祀焜燿無窮凡兹大恩固巳無量矣而又以光樸懦自守謂其寡過每賜祓飾多踰其實光或聞之流汗被顙常懼不能堪副以累知言暨衰麻外除復從吏役執事以文武才實入賛樞極薦士之奏首列光名事雖報聞勤惻愈甚間二嵗進參大政則又復前奏出之扆前上方推信大臣議無不用亟命近署試其所能藝術素踈果暴媸鄙方自踧踖以須譴絀不意天恩曲成引内袐府遽使頡頏禁闥依光紫霄校讐羣書參奉逰豫豈光空薄所能堪稱承命震駭征營失據静自循度罔知所来此非先人之餘休被及後昆執事之敦篤不遺故舊糠粃小生何階自致衘恩念親涕洟横集夫以執事之忠亮純明豈其私一不肖之人使汙衊文館羞士大夫盖將驅一世之人使媮者日醇薄者日敦誠有以賛天子之大化非獨苟然而已乃知大君子之舉事用志逺矣光敢不夙夜刻勵寤寐訓辭進益所長攻去所短冀不忝前人之教誨羞知已之稱論以負明詔之収擢而已過此以往不知所為上宋侍讀書昔燕王有馬千里而天下無敢獻馬於燕者為其皆不能及廐中之良也趙王有璧徑尺而天下無敢賈玉於趙者為其皆不能及櫝中之美也彼以物求售者誠然以道求售者則異矣請以周公言之夫周公之徳美才智天下固無庶幾望其藩籬者然周公沐則捉髪飱則吐哺汲汲焉走迎天下之士惟恐一人伏於蓬蓽之下者是以鍾石筦絃之音歌舞其徳于今未衰曏者儻以已之才徳求諸他人則外踰四海舟車所極終無一人可収采者又安有曄曄光美施於千載邪降及後世賢公卿大夫未有不祖述此道而能具美者也伏惟執事體純明以立質積學問以廣徳自結聖主優㳺禁闥四表仰聲而響集羣士希光而㬌附眄睞所被温於春陽咳唾所沾重於珪璧誠薦紳之表的後進之衡鑑也光才朽行僻學踈文陋羣居士林無與比數而不自屏絀妄以技進於左右是由獻馬於燕賈玉於趙也執事儻以二國之意遇之則光宜驅呵擯逐不得少留於門下矣以周公之道按之則光必得從七十子之後而俟見焉竊以為古者見於公卿大夫必有贄今其禮亡久矣士非文無用為贄者是敢不自隱其嗤鄙雜錄舊所為文凡五巻執之立於屏外以俟進退之命焉
