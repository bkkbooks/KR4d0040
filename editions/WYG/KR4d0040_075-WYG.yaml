body:
  text: 迃書迃書序嘉祐二年作余生六齡而父兄教之書雖誦之不能知其義又七年始得稍聞聖人之道朝誦之夕思之至於今二十有七年矣雖其性之昏愚憊而不能進然勤亦至矣時有所獲書以示人人之論高者則曰子之書庸而無奇衆人所同知也論卑者則曰子之書迃而難用於世無益也嘻我窮我之心以求古之道力之所及者則取之庸與迃惟人之所名也我安得知之故命其書曰庸書亦曰迃書云釋迃或謂迃夫曰子之言太迃於世無益也迃夫曰子知迃之無益而不知其為益且大也子知迃之有益而不知其為損亦大也子不見夫樹木者乎樹之一年而伐之則足以給薪蘇而巳二年而伐之則足以為桷五年而伐之則足以為楹十年而伐之刖足以為棟夫豈非收功愈逺而為利愈大乎古之人惟其道閎大而不能狹也其志邃奥而不能邇也其言崇高而不能庳也是以所適齟齬而或窮為布衣貧賤困苦以終其身然其遺風餘烈數百千年而人猶以為法曏使其人狹道以求容邇志以取合庳言以趨功雖當時貴為卿相利止於其躬榮盡於其生惡得餘澤以及後世哉如余者患不能迃而巳矣迃何病哉辨庸或謂迃夫曰子之言甚庸衆人之所及也惡足貴哉迃夫曰然余學先王之道勤且久矣惟其性之惛也苦心勞神而不自知猶未免夫庸也雖然古之天地有以異於今乎古之萬物有以異於今乎古之性情有以異於今乎天地不易也日月無變也萬物自若也性情如故也道何為而獨變哉子之於道也將厭常而好新譬夫之楚者不之南而之北之齊者不之東而之西信可謂殊於衆人矣得無所適失其所求愈勤而愈逺邪嗚呼孝慈仁義忠信禮樂自生民以來談之至今矣安得不庸哉如余者懼不能庸而巳矣庸何病哉士則或曰為士何如迃夫曰士者事天以順交人以謹謹司其分不敢失隕而巳矣或曰為士者亦事天乎曰是何言也天者萬物之父也父之命子不敢逆君之言臣不敢違父曰前子不敢不前父曰止子不敢不止臣之於君亦然故違君之言臣不順也逆父之命子不孝也不順不孝者人得而刑之順且孝者人得而賞之違天之命者天得而刑之順天之命者天得而賞之或曰何謂違天之命曰天使汝窮而汝强通之天使汝愚而汝强智之若是者必得天刑或曰何謂天刑曰人之刑賞刑賞其身天之刑賞刑賞其神故天之所賞者其神間靜而佚樂以考終其命天之所刑者其神勞苦而愁困以夭折其生彼雖僂然而白首猶貳負之臣桎梏而處諸石下雖踰千嵗惡足稱壽哉或曰夫士者當美國家利百姓功施當時澤及後世豈獨齪齪然謹司其分不敢失隕而巳乎曰非謂其然也智愚勇怯貴賤貧富天之分也君明臣忠父慈子孝人之分也僣天之分必有天災失人之分必有人殃堯舜禹湯文武勤勞天下周公輔相致太平孔子以詩書禮樂教洙泗顔淵簞食瓢飲安於陋巷雖徳業異守出處異趣如此其逺也何嘗捨其分而妄為哉言戒迃夫曰言不可不重也子不見鐘鼓乎夫鐘鼓叩之然後鳴鏗訇鏜􅝅人不以為異也若不叩自鳴人孰不謂之祅邪可以言而不言猶叩之而不鳴也亦為廢鐘鼓矣䘌齒迃夫病䘌齒呻吟之聲達於四鄰通夕不寐有道士過之問曰子知病之所來乎曰不知也道士曰病來自天天且取子之齒以食食骨之蟲而子拒之以違天也夫天者子之所受命也若之何拒之其必與之迃叟曰諾於是以齒與蟲惽然而寐一夕而愈蠆祝迃夫夜立於庭拊樹而蠆螫其手捧手吟呼痛徹於心家人呼祝師祝之祝師曰子姑勿以蠆為慘烈以為凡蟲而藐之曰是惡能苦我哉則痛巳矣從之少選而痛息迺謝祝師曰爾何術而能攘蠆之毒如是其速也祝師曰蠆不汝毒也汝自召之余不汝攘也汝自攘之夫召與攘皆非我術之所能及也子自為之也於是迃夫嘆曰嘻利害憂樂之毒人也豈直蠆尾而巳哉人自召之人自攘之亦若是而巳矣飯車天雨迃夫出見飯車息於高蹊者指謂其徒曰是車也將覆不久矣行未十步聞讙聲顧見其車巳覆其徒問曰子何由知之迃夫曰吾以人事知之夫天雨道濘而蹊獨不濡又狹而高是衆人之所趣也而車不量其力固狹擅高久留不去以妨衆人之欲進者其能無覆乎禍有鉅於此者奚飯車之足云拾樵迃夫見童子拾樵於道約曰見樵先呼者得之後毋得爭也皆曰諾既而行相與笑語戲狎至驩也瞲然見横芥於道其一先呼而衆童子爭之遂相撻擊有傷者迃夫惕然亟歸而嘆曰必天下之利大於横芥者多矣吾不知戒而日與人遊恃其驩而信其約一旦有先呼而鬭者能無傷乎知非嘉祐三年五月二十五日作或曰蘧伯玉五十而知四十九年非信乎曰何啻其然也古之君子好學者有垂死而知其未死之前所為非者況五十乎夫道如山也愈升而愈高如路也愈行而愈逺學者亦盡其力而止耳自非聖人有能窮其高逺者哉天人熙寧七年三月十六日作迃叟曰天力之所不及者人也故有耕耘斂藏人力之所不及者天也故有水旱螟蝗無怪迃叟曰有兹事必有兹理無兹理必無兹事世人之怪怪所希見由明者視之天下無可怪之事理性元豐二年十月二十八日作易曰窮理盡性以至於命世之高論者競為幽僻之語以欺人使人跂懸而不可及憒瞀而不能知則盡而捨之其實奚逺哉是不是理也才不才性也遇不遇命也事親元豐四年作迃叟事親無以踰人能不欺而巳矣其事君亦然事神元豐四年正月十六日作或問迃叟事神乎曰事神或曰何神之事曰事其心或曰其事之何如曰至簡矣不黍稷不犧牲惟不欺之為用君子上戴天下履地中函心雖欲欺之其可得乎寛猛元豐四年十月作迃叟曰寛而疾惡嚴而原情政之善者也回心或問子能無心乎迃叟曰不能若夫回心則庶㡬矣何謂回心曰去惡而從善捨非而從是人或知之而不能徙以為如制駻馬如斡磻石之難也靜而思之在我而巳如轉戸樞何難之有無益元豐六年二月十七日作迃叟曰言而無益不若勿言為而無益不若勿為余久知之病未能行也學要元豐六年五月二日作迃叟曰學者所以求治心也學雖多而心不治安以學為治心元豐六年六月二十三日作迃叟曰小人治迹君子治心文害元豐六年七月十八日作或謂迃叟子於道則得其一二矣惜乎無文以發之迃叟曰然君子有文以明道小人有文以發身夫變白以為黑轉南以為北非小人有文者孰能之道大元豐六年八月一日作迃叟曰聖人之道如天地天地之間靡所不有衆人之道如山川如陵谷如鳥獸如艸木如蟲沙各盡其分不知其外天地則無不包也無不徧也毋我知孔子曰殷有三仁焉蓋孔子之前為比干者則非微子矣為微子者則非比干矣為箕子者則非比干與微子矣至孔子然後人知三子者皆仁人也孔子曰微管仲吾其被髮左衽矣如其仁如其仁孟荀氏之言曰仲尼之門五尺童子羞稱五伯以是觀之孟荀氏之道槩諸孔子其隘甚矣道同元豐六年作迃叟曰合天下而君之之謂王王者必立三公三公分天下而治之曰二伯一公處乎内皆王官也周衰二伯之職廢齊桓晉文糾合諸侯以尊天子天子因命之為侯伯修舊職也伯之語轉而為霸霸之名自是興自孟荀氏而下皆曰由王道而王由伯道而霸道豈有二哉得之有淺深成功有小大耳譬諸水為畎為澮為谷為谿為川為瀆若所鍾則海也大夫士畎澮也諸侯谿谷也州牧川也方伯瀆也天子海也小大雖殊水之性奚以異哉絶四元豐六年作或問子絶四何以始於毋意迃叟曰吉凶悔吝未有不生乎事者也事之生未有不本乎意者也意必自欲欲既立於此矣於是乎有從有違從則有喜有樂有愛違則有怒有哀有惡此人之常情也愛實生貪惡實生暴貪暴惡之大者也是以聖人除其萌塞其源惡奚自而至哉或曰毋意於惡既聞矣敢問聖人亦毋意於善乎曰不然聖人之為善豈有意乎其間哉事至而應之以禮義耳禮者履也循禮則事無不行義者宜也守義則事無不得聖人執禮義以待事不為善而善至矣聖人豈有意乎其間哉或曰然則聖人之心其猶死灰乎曰不然聖人之心如宿火耳夫火宿之則晦發之則光引之則然鼓之則熾既而復掩之則乃晦矣深而不消久而不滅者其宿火乎聖人之心亦然治其心以待物物至而應事至而辨豈若死灰哉灰死則不復然矣奚所用哉或曰毋固毋必奚以異乎曰在我為固在人為必聖人出處語黙惟義所在無可無不可奚其固成敗禍福繫命所遭誰得而知之奚其必或曰然則何以終於毋我曰有意有必有固則有我有我則私私實生蔽是故泰山觸額而不見雷霆破柱而不聞無意無必無固則無我無我則公公實生明是故秋毫過目無不見也飛蚊厯耳無不聞也其得失豈不逺哉求用元豐六年作或曰士不好富貴則為士者不得其用刑賞不行矣迃叟曰小人有才必求用於世以利其身不賞不勸不刑不懲君子有才亦求用於世以行其道勸不待賞懲不待刑自古亂臣賊子未有不出於好富貴者也為上者亦何利焉負恩元豐七年四月二十八日作迃叟曰受人恩而不忍負者其為子必孝為臣必忠羨厭元豐七年三月十五日作迃叟曰人情苦厭其所有羨其所不可得未得則羨巳得則厭厭而求新則為惡無不至矣老釋元豐七年十二月二日作或問老釋有取乎迃叟曰有或曰何取曰釋取其空老取其無為自然捨是無取也或曰空則人不為善無為則人不可治奈何曰非謂其然也空取其無利欲之心善則死而不朽非空矣無為取其因任治則一日萬㡬有為矣鑿龍門辨元豐七年十二月二日作或問禹鑿龍門闢伊闕有諸迃叟曰龍門伊闕天所為也禹治之耳非山横其前水壅其流禹始鑿而闢之然後通也或曰何以知之曰孟子云禹之行水行其所無事若鑿山以通水不可謂之無事矣無為賛元豐八年正月十九日作學黄老者以心如死灰形如稿木為無為迃叟以為不然作無為賛治心以正保躬以靜進退有義得失有命守道在巳成功則天夫復何為莫非自然聖窮聖人専以利人為心於術無不知也穀而可辟則不教人耒耜矣死而可違則不教人棺槨矣夫豈非天使民食且死雖聖人不能違乎諱有人之情諱有而不諱無離婁之明人謂之瞽不愠矣栁下惠之和人謂之汚不怍矣斥莊或曰莊子之文人不能為也迃夫曰君子之學為道乎為文乎夫唯文勝而道不至者君子惡諸是猶朽屋而塗丹雘不可處也眢井而羃綺繢不可履也烏喙而漬飴糖不可嘗也而子獨嗜之乎或曰莊子之辨雖當世宿學不能自解迃夫曰然則佞人也堯之所畏舜之所難孔子之所惡是青蠅之變白黑者也而子獨悦之乎辨揚或曰揚子之諂也以王莽為可以繼周公軼阿衡迃夫曰得巳哉揚子之為書也品藻當世蜀莊子真仲元靡不及焉莽宰天下而自況於伊周敢遺諸子何鮑之死不可不畏也雖然莽自況伊周則與之況黄虞則不與也其志將曰為伊周而止斯可矣不止而至於簒伊周豈然哉無黨或曰吾子擯莊而引揚或者為黨乎曰無黨也使莊為揚書斯與之矣揚為莊言斯拒之矣孰黨哉兼容或曰甚矣子道之隘也奚容之不兼迃夫曰沱潛之於江也榛楛之於山也兼容焉可也莠之於苖也冰之於火也欲兼得乎哉指過或曰有人於此人指其過而告之則喜何如迃夫曰君子也或曰曷若無過而指諸迃夫曰君子履中正而行者也故有過則人得而指諸若夫不中不正之人終日所為皆過也又安得而指之難能或曰堯舜之徳何以為難能迃夫曰舜自修於畎畝之中而聞於堯此舜之難也舜在畎畝之中而堯知之此堯之難也三欺迃夫曰鞠躬便辟不足為恭長號流涕不足為哀弊衣糲食不足為儉三者以之欺人可矣感人則未也君子所以感人者其惟誠乎欺人者不旋踵人必知之感人者益久而人益信之官失迃叟曰世之人不以耳視而目食者鮮矣聞者駭曰何謂也迃叟曰衣冠所以為容觀也稱體斯美矣世人捨其所稱聞人所尚而慕之豈非以耳視者乎飲食之物所以為味也適口斯善矣世人取果餌而刻鏤之朱綠之以為盤案之玩豈非以目食者乎天人迃叟曰天之所不能為而人能之者人也人之所不能為而天能之者天也稼穡人也豐歉天也傳家集巻七十四欽定四庫全書傳家集巻七十五宋司馬光撰格投壺新格熙寧五年作傳曰張而不弛文武弗能也弛而不張文武弗為也一張一弛文武之道也君子學道從政勤勞罷倦必從容宴息以養志游神故可久也蕩而無度將以自敗故聖人制禮以為之節因以合朋友之和飾賔主之歡且寓其教焉夫投壺細事遊戲之類而聖人取之以為禮用諸鄉黨用諸邦國其故何哉鄭康成曰投壺射之細也古者君子射以觀徳為其心平體正端壹審固然後能中故也蓋投壺亦猶是矣未審度於此而取中於彼仁道存焉疑畏則疎惰慢則失義方象焉左右前却過分則差中庸著焉得十失二成功盡棄誡慎明焉是故投壺可以治心可以修身可以為國可以觀人何以言之夫投壺者不使之過亦不使之不及所以為中也不使之偏頗流散所以為正也中正道之根柢也聖人作禮樂修刑政立教化垂典謨凡所施為不啻萬端要在納民心於中正而巳然難得而制者無若人之心也自非大賢守道敦固則放蕩傾移無不至求諸少選且不可得是故聖人廣為之術以求之投壺與其一焉觀夫臨壺發矢之際性無麤宻莫不聳然恭謹志存中正雖不能久可以習焉豈非治心之道歟一矢之失猶一行之虧也豈非修身之道乎兢兢業業慎終如始豈非為國之道歟君子之為之也確然不動其心儼然不改其容未得之而不懾既得之而不驕小人之為之也俯身引臂挾巧取奇苟得而無愧豈非觀人之道歟由是言之聖人取以為禮宜矣彼博奕者以詭譎相高以殘賊相勝孔子猶曰飽食終日無所用心為之猶賢乎巳況投壺者又可鄙略而輕廢哉古者壺矢之制揖讓之容今雖闕焉然其遺風餘象猶彷彿也世傳投壺格圖皆以奇雋難得者為右是亦投瓊探􅍐之類耳非古禮之本意也余今更定新格増損舊圖以精宻者為右偶中者為下使夫用機徼倖者無所措其手焉壺口徑三寸耳徑一寸高一尺實以小豆壺去席二箭半箭十有二枚長二尺有四寸以全壺不失者為賢苟不能全則積算先滿百二十者勝後者負俱滿則餘算多者勝少者負為圖列之左方并各釋其指意焉有初箭十算首箭中者君子作事謀始以其能慎始故賞之第二箭以下連中不絶者皆五算若一箭不中次箭皆為散箭其違中内有貫耳及驍者其箭別計假若有初箭仍貫耳則二十算是也舊圖初箭一籌其次每箭加二籌盡四箭而止甚非勸功之道今自二箭以下連中不絶者皆賞之所以勉人於不解也全壺無算無算者不以耦之算數多少皆勝之也若兩人俱全則復計其餘算以次勝負夫為山九仞功虧一簣全壺實難故君子貴之有終十五算末箭中也靡不有初鮮克有終故比之有初又加五算也散箭一算貫耳十算耳小於口而能中之是其用心愈精故賞之驍箭十算何謂之驍皆俊猛意也謂投而不中箭激反躍捷而得之復投而中者也為其巳失而復得之不逺復善補過者也故賞之若復投而貫耳者其算別計復投而不中者廢之敗壺不問巳有之算皆負謂十二箭皆不中大無功也若兩人皆敗則亦計餘算以決勝負横耳謂箭横加耳上舊五十籌横壺横加壺口舊四十籌皆依常算無賞偶然而横非投者工何足以賞若為後箭所擊而墜地者與不中同倚竿箭斜倚壺口中舊十五籌龍首倚竿正箭首正向已者舊十八籌龍尾倚竿而箭羽正向已者舊十五籌狼壺轉旋口上而成倚竿者舊十四籌帶劒貫耳不至地者舊十五籌耳倚竿舊十五籌皆廢其算傾邪險詖不在於善而舊圖以為奇箭多與之算甚無謂也今廢其算所以罰之然亦異於不中者故於連中全壺皆為通數若為後前所擊及同自墜壺若耳中者復計其算墜地者與不中倒中舊百二十籌倒耳舊不問籌數並滿壺中之算盡廢之顛倒反覆惡之大者奈何以為上賞今盡廢其算所以明逆應之道䇿問學士院試李清臣等䇿問一首熙寧三年三月二十八日王介甫言於上以為天命不足畏祖宗不足法流俗不足恤故因䇿目以此三事質於所試者范景仁復至曰流俗不足恤一事我巳為䇿目矣遂刋之明日禁中以紙帖其上别出䇿目試清臣等問先王之治盛矣其遺文餘事可見於今者詩書而巳矣詩曰文王陟降在帝左右書曰面稽天若蓋言王者造次動靜未嘗不考察天心而嚴畏之也詩曰毋念爾祖聿修厥徳書曰有典有則貽厥子孫蓋言三代嗣王未有不遵禹湯文武之法而能為政者也詩曰先民有言詢於芻蕘書曰有廢有興出入自爾師虞庶言同則繹蓋言與衆同欲則令無不行功無不成也今之論者或曰天地與人了不相關薄食震揺皆有常數不足畏忌祖宗之法未必盡善可革則革不足循守庸人之情喜因循而憚改為可與樂成難與慮始紛紜之議不足聽采意者古今異宜詩書陳迹不可盡信邪將聖人之言深微高逺非常人所能知先儒之解或未得其㫖邪願聞所以辨之賢良䇿問一首為邵興宗作皇祐四年問國家比下詔書以延天下豪俊之士待之以不次之位豈特以學問之富為賢良文辭之麗為方正邪蓋思得先古之至道當今之要務施之於事以安元元此主上所以側席而求寤寐而思者也今子大夫褎然為舉首固當有以副所以待之之意而不愧乎其名矣言及之而不言則㡬於所謂隠者乎昔三代之王也逺者八百載近者不減四百後世王天下者鮮能及之陵夷衰微至於五代或四三年敢問前之所以延者豈世有哲王以守其業後之所以蹙者豈繼嗣不肖不能享其功歟抑繇祖宗建法垂統明備固宻子孫不能敗邪至治之世耕者讓畔漁者讓澤今國家修明禮義以切勵天下久矣而退讓之風未甚行於朝爭奪之俗未盡絶於野秋毫之利捐仁廢誼為之而不恥上下病之而不能革也又内外百吏或侵牟細民苟不得其欲則轉賞為罰倒直為曲寃痛失職吁嗟滿道雖待之以重誅嚴刑而不能止也兹二者豈世俗澆偽不可復振將教之禁之之道有所未備也漢有天下至於孝文纔三十年而帛朽於庫粟流於庾國家平定宇内嚮九十載而公私之積日以凋耗議者推測其故而未能明也憂者雖衆而莫能謀也敢問所以明之謀之亦有其術歟又若韓非之五蠧荀悦之三遊此皆先世之患而今猶未息者也將何道以息之至於朝政之善有所未盡黎庶之病有所未聞子大夫其精心致思條析陳之靡有所遺有司將以復於上而行之焉毋悼後害以枉執事苞忠隠知而不自盡以取美禄榮名而巳進士䇿問十五首問昔季路冉有公西華曽晳閒居縱言各陳其志趙文子觀於九原以為死者可作想慕隨㑹之為人夫材性散殊不可致之於一塗愛尚不同不可納之於一趣吾子懐材抱器待時而用前言往行心所常存然則志於道者何術慕於古者何人當位得時施於政而何尚修身立行選於徳而何從蓋聞言不及之而言謂之躁言及之而不言謂之隠今聴者雖非昔人之明而亦未為不知已則其言也可無隠焉問昔者堯遭洪水咨於四岳曰有能俾乂四岳薦鯀堯曰吁咈哉方命圯族則知鯀之不可用亦明矣四岳復薦曰試可乃巳堯遂命之治水九年功用不成然後黜之而興禹焉夫唐堯聖人之盛者舉事興為豈容過差顧後之學者不能辨明耳不然使不善之人任事九年蒸民汛濫所廢者大所害者廣然後去之仁聖用心固不如此愚智有涯不能測逺吾子其辨也問稽於經傳帝王之際玉帛諸侯亡慮萬國當是之時聲教所被東不踰海西距流沙南不盡荆蠻北不及獯鬻以五服之民養萬國之君公有羡積私有餘儲征代朝貢無歲而無咸出其中未嘗匱乏今國家奄有萬方囊括禹迹加以兵革不試垂三十年累聖恭儉與民休息宫室不崇苑囿不廣衣服不麗飲食不精然比歲以来有事西虜發輸滯積以饋一隅乃復財用竭而不繼力役困而不給吁嗟之聲蕭然道路何曩者用民之侈而有餘今者用民之狹而不足乎變而通之必有其道此最國家之急而從政者之所欲聞也吾子明於古之道而察於今之故何施何為而得國用舒民力足以及於古之世也仁者之言其利宜漙幸毋讓焉問夏書曰賞延於世小雅裳裳者華刺幽王棄賢者之類絶功臣之世是古有世祿之道也周書數紂之罪則曰官人以世而言春秋者公羊氏亦云譏世卿詩書春秋皆聖人所以儀範後世也今其言乃違戾如是豈聖人之道淵微奥逺學者不足以至邪願聞所以辨之而毋讓問王者受天命臨四海上承天之序下正人之統故政治之本莫先於厯數厯數之紀莫大於正朔正朔者厯數之大端而萬事之維首也是以聖人重之三代之王視斗招揺建寅建丑建子以為正月仰應三光俯順三統總象三材備在典䇿其傳詳矣正於唐虞以前則厯世儒生各為異見孔安國以為建寅為正得天之數自古皆用之湯武放伐以有天下革故鼎新然後有改正朔易人視聴之事今據唐虞之前無異正朔之文則似孔說得之然鄭康成依尚書緯以為正朔三而改自古皆相變若循環然非至於夏商周而後變也孔子曰行夏之時自古皆用建寅何得謂之夏之時似鄭義復為優夫正朔者帝王之盛節國家之大事而古今異論紛紛不決願吾子辨其得失明究其說使後來學者知其適從問夫佐天子治四海安萬民使諸侯軌道四夷賔服百吏稱職萬機辨治地平天成風雨和順者宰相之任也其功烈莫先焉王者封二王後所以存三統重絕先聖之世也而班固漢書采漢興以來有金革之勤及蠻夷降王受爵邑者為功臣表又采椒房母舅之家徼倖獲封者為外戚恩澤侯表而自平津以降由丞相得侯者及商周之後皆不得附於功臣之列而猥編於外戚恩澤之間豈以燮理隂陽之重而居貫甲執兵之後先聖苖裔王者賔客而在武夫健將之左邪抑史氏將有深㫖非淺識所知乎將不思而巳矣願聞所以辨之問祭典曰法施於民則祀之有功於民則祀之故厲山氏之子曰柱能殖百穀祀以為稷共工氏之子曰勾龍能平水土祀以為社湯既勝夏欲變先王之制以明革命於是乎以棄代而後世無及勾龍者故不易也夫平水土者莫尚於禹禹之功顧不及勾龍邪湯不祀禹以為社而云後世無及勾龍者其㫖何哉聖人規為必不妄也子大夫其懋明之問世之為詩者皆稱魯僖公能遵伯禽之法魯人尊之而為之頌自孔子刪詩存而不去非虛美也今以春秋迹之或違禮而動或作事不時至於修泮宫伐淮夷作新廟皆無聞焉殆若與頌不相應者其故何哉問孟子稱盡信書不如無書吾於武成取二三䇿而巳為其以至仁伐至不仁而有血流漂杵也後之學者皆祖其言乃以書為舛駮非若他經之純美也嗚呼彼孟子者果愈於聖人邪書者果是非相冒中有可信不可信者邪學者病於隨風而呼順流而攘未有能排其門上其堂探其室嚌其䏑而徒披猖横騖乎藩籬之外彼又烏知甘酸之正味邪乃欲信孟子而非書孟子又曰說詩者不以文害辭不以辭害志斯言也豈獨可施於詩而不可施於書邪孟子之云書不可盡信者果是歟願與諸君訂之問關雎麟趾之化王者之風故繫之周公鵲巢騶虞之徳諸侯之風先王之所以教故繫之召公説者以為先王謂太王王季今據二南之詩大抵皆言文王之化或美召伯或美王姬烏在其為太王王季也且如太王王季文王之詩何為不編之雅頌而列於國風又文王之道被於天下何故其中雜有王者諸侯之風復何為繫之周公召公皆惷昧所不識也二三君子奥博於學願聞所以辨之其説何也問曲禮曰禮不下庶人刑不上大夫按王制修六禮以節民性冠婚喪祭鄉相見此庶人之禮也舜典五服三就大夫於朝士於市此大夫之刑也夫禮與刑先王所以治羣臣萬民不可斯須偏廢也今曲禮乃云如是必有異㫖其可見乎問子曰侍於君子有三愆言未及之而言謂之躁言及之而不言謂之隠未見顔色而言謂之瞽夫聖人之道正直無隠豈伺人顔色而言邪必有微㫖幸為辨之問春秋始隠之説誰氏為通問春秋不書公即位何以特書王正月杜元凱以朝正於廟解之朝正于廟國家常禮非特行於君之始年也問春秋貴儀父者為其能自通於大國繼好息民也夫小事大者盟不重於朝今犂来名而儀父字其説何也樂詞樞宻院開啟聖節道場排當詞散念紫電流樞元聖誕膺於丕運妙花雨地輔臣祗奉於仁祠憑不垢之勝因佑無疆之遐算仍修高㑹共洽多娛宜盡從容式昭慈惠䕫龍滿座集紳紳花雨仍添一日春欲識華胥何處在只應近與醉鄉鄰作語徳水澄瀾上聖應期而降誕崇邱儲粹大賢名世以挺生蓋精神之㑹昌若符契之相合必資同徳用底太寧恭惟尊號皇帝陛下容覆如天照臨若日躋羣生於富壽之域納庶俗於仁讓之塗雷雨弗迷魚鼈咸若伏惟某官某官丕宣忠力克壯逺猷筦樞機而均四時撫韜鈐而制八狄屬呈祥於里社冀徼福於香城大啓梵筵同祈睿算玉毫珠髻既瞻仰於慈雲寶案金觴仍涵濡於湛露肴羞交錯笙磬駢羅仁澤醲於惠風喜色饒於淑氣某謬㕘樂吏獲對台廷不揆蕪才敢獻口號華渚流星表聖期宗工齋祓欵仁祠異花散漫承嚴供妙樂從容奉宴嬉印紱相鮮金錯落珮環交映玉葳蕤乾坤長久南山固此地年年捧羽巵勾曲八音繁㑹七律鈞諧上悦台顔把色合曲御筵送李宣徽昭亮知真定府口號匈奴舊畏李將軍今日重來㡬代孫旗尾飄揚山燒裂馬蹄騰踏塞塵昏降王稽顙朝南闕天子垂衣御北門幕府事閒刁斗靜碧潭佳景日開樽作語天文垂象貴將陪扈於太微地險流形常山控臨於大漠矧聖神之御辨懐荒憬以嚮風秋塵無驚夜戸不閉眷是股肱之郡委於心膂之臣某官武節兼人雄規絶衆元戎十乗董鋭士以啓行清酒百壺命賢王而出餞榮生道路威動塞垣駐大斾於近郊留朱輪於清籞某叨居樂部幸對台光不揆蕪才敢獻口號秋風蕭瑟引華旌祖宴高張出斗城玉饌芳菲羅百品鐵衣照耀擁千兵驪歌未闋長楊苑騎吹先臨細栁營雨露醲恩何以報沙場不惜樹功名慶文公八十㑹口號某聞三王之盛未有遺年五福之先莫如享壽恭惟開府太師才為人傑位極帝師黑頭强仕之時巳登廊廟黄髮老成之日還賞林泉賛熙洽於三朝保康寧於八十太公望口餘兩齒猶釣渭濵田千秋身乗小車尚腰相印何曽則始為太宰石鑒則甫拜司空平津之談論多聞方叔之謀猷克壯獨兼具美度越前修留守相公鎮撫都畿典司官鑰遇唐虞之無事喜稷卨之得朋大啓華筵益祈遐算提舉端明惜盛事之難值慕賢者之所為親邀相車就宴甲第跪斟芳醑仰祝椿齡某不揆荒蕪敢獻口號元勲茂徳古無倫海内高閒第一人台席巳酬調鼎志磻溪還作釣魚身師臣首冠三旌貴嵗厯行開九帙新願過期頤躋上夀飛觴四十有餘春傳家集巻七十五欽定四庫全書傳家集巻
