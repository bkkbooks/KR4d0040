  text: 七十六
  hash: sha256:460089a18fd767218a13639c3ce25329948e4ad09c4d5e17f9358b25afc10b17
body:
  text: 宋司馬光撰誌一太子太保龐公墓誌銘嘉祐八年作公諱某字醇之其先出於周之畢公因邑命氏近世自鄆徙居單之成武曽祖考諱某贈太師中書令妣何氏封越國太夫人祖考諱某贈太師中書令兼尚書令封秦國公妣陳氏封楚國太夫人考諱某贈太師中書令兼尚書令封魏國公妣邢氏封燕國太夫人自秦公以往仍世不仕魏公始以通春秋仕至國子博士公幼敏達工文辭書無不觀舉進士上第釋褐黄州司理參軍秩滿居魏公憂服除調江州判官未之官用舉者除開封府兵曹參軍諸兄欲分魏公遺産公曰吾幸有禄盡以讓二兄一錢不取知府事薛公奎素名威嚴少許可獨見公而器之待遇甚厚謂曰君他日必至公輔余不及也仍舉為法曹頃之改大理寺丞知襄邑縣召還編天聖勅授刑部詳覆官㑹群牧判官缺是時章獻太后臨朝用中㫖求之者以十數執政患之謀曰得孤寒中有聲望才節可以服人者與之則中㫖可塞矣乃以公名進太后果從之仍改服銀緋久之出知秀州事明道中召入為殿中侍御史章獻太后崩章惠太后欲踵之臨朝公奏燔閤門所掌垂簾儀制以沮其謀當時服其敢言先帝始専萬機富於春秋左右欲以奇巧自媚後苑珠玉之工頗盛於前日公上言今螽螟為災民憂轉死北有耶律西有拓跋陛下安得不以儉約為師奢靡為戒重惜國用以徇民之急上深納其言中丞孔公道輔嘗謂人曰今之御史多承望要人風指隂為之用獨龐君天子御史耳尋授開封府判官尚美人方有寵遣宦者稱教㫖免工人市繇公上言祖宗以來未有美人敢稱教㫖干撓府政者上怒抶宦者切責美人仍詔諸官府自今有傳宫中之命皆毋得施行龍圖閣學士范諷喜放曠不遵禮法士大夫多慕效之又為姦利事公屢奏其狀不報㑹除祠部員外郎廣南東路轉運使將之官復奏言之且曰苟不懲治則敗亂風俗將如西晉之季不可不察有詔置獄以覆其實獄成諷坐貶鄂州行軍司馬仍下詔戒天下風俗上欲還公御史既而以貶逐大臣之故亦以公為太常博士知臨江軍至官未百日復授祠部員外郎福建路轉運使景祐三年以侍御史召還執政奏擬戸部判官上曰龐某止可三司判官邪後九日除刑部員外郎兼侍御史知雜事改服金紫尋判大理寺糾察在京刑獄知審官院在臺中二年執政奏擬戸部副使上曰龐某豈得以常塗進之遂擢為天章閣待制拓跋元昊僭亂陜右騷動公奉使體量安撫還未㡬出知汝州事數月徙知同州事尋授陜西都轉運使慶厯元年延安缺帥以公為龍圖閣直學士知延州事尋加鄜延路馬步軍都部署經略安撫緣邊招討等使明年除延州觀察使五辭不受復遷諫議大夫職任如故延安自龍州之敗戎落民居焚掠㡬盡距郭無㡬悉為冦境人心危懼公至補綻茹漏聚用増備撫民以仁馭軍以嚴戍兵近十萬未有壁壘多寄止民家無秋毫敢犯民者諸將欲出兵公必召問方畧取其所長而誨其所短告以賞罰巳而必行由是諸將莫敢不盡力出輒有功是時元昊數犯邊覆軍殺將而獨不近鄜延間或小入輒以敗去故地為虜所據者公悉逐之築十一城於險要其腹中可食之田盡募民耕之延安遂為樂土㑹朝廷益厭兵欲赦元昊之罪以詔書命公招懐之公曰虜驟勝方驕若中國自遣人說之彼益偃蹇不可與言先是元昊用事之臣野利旺榮遣其牙校李文貴來公留之於邊至是召之自從公所諭以逆順禍福遣還文貴尋以旺榮曹偶四人書來用敵國修好之禮公以其不遜未敢復書請於朝朝廷急於息民命公復之書開延而勿拒稱旺榮等為太尉且曰元昊果肯稱臣雖仍其僭名可也公上言僭名理不可容臣不敢奉詔太尉天子上公非陪臣所得稱今方抑止其僭而稱其臣為上公恐虜滋驕不可得臣旺榮等與臣書自稱寧令謨寧令此虜中之官中國不能知其義可以無嫌臣輒從而稱之朝廷善之旺榮等又請用小國事大之禮公曰此非邊帥所敢知也而主若遣使者奉表以來乃敢導致於朝廷耳是時朝廷方修復涇原公恐虜猝犯之敗其功乃留連其使數與之講議雖抑止其僭亦不決然絶也如是踰年元昊乃遣其伊州刺史賀從勗來自稱男邦面令國兀卒郎霄上書父大宋皇帝公使謂之曰天子至尊荆王叔父也猶奉表稱臣今名體未正不敢以聞從勗曰子事父猶臣事君也使從勗得至京師而天子不許請更歸議之公上言虜自背誕以來雖屢戰得氣然喪私市之利民甚愁困今其辭禮寢順必誠有改事中國之心願聽從勗詣闕更選使者往至其國以詔㫖抑之彼必稱臣凡名稱禮數及求匄之物當力加裁損必不得巳乃少許之若所求不違恐豺狼之心未易盈厭也朝廷皆從其䇿元昊果稱臣冊命為夏國主上以西鄙之寧皆公之功乃宻詔諭以兩府有缺當補之四年遂入為樞宻副使公在延州治州城及諸寨皆募禁軍為之軍行出塞則使因糧於敵馬芻皆自刈之還畀其直民無飛輓之勞及去民遮道泣曰公用兵數年未嘗以一事煩民雖以一子為香焚之猶不足報也追送數驛乃去公至樞府上言陜西用兵以來用度太廣請遣使者減省邊費上從之所省逾半八年參知政事皇祐元年以工部侍郎為樞宻使公以近世養兵之弊在於多而不精故國用困竭與丞相合議大加簡閲於是中外言者鼎沸以為必生大變上亦疑焉公曰萬一有一夫狂謼二臣請以百口償之卒行其䇿是嵗凡省八萬餘人三司糧賜皆有餘矣三年同中書門下平章事兼昭文館大學士公為相専以公忠便國家為事不以官爵養私交取聲譽端明殿學士程公戡知益州將行上俾公諭之曰戡還當處以兩府公曰兹事出於上恩臣不敢與聞卒不與程言廣源蠻儂智高反毒徧嶺南王師數不利詔以樞宻副使狄青為宣撫使以討之言事者以青武人不足専任固請以侍從文臣為之副上以訪公公曰屬者王師所以屢敗皆由大將權輕偏裨人人自用遇敵或進或退力不能制故也今青起於行伍若以侍從之臣副之彼視青無如也青之號令復不可得行是循覆車之軌也青素名善戰今以二府將大兵討賊若又不勝不惟嶺南非陛下之有荆湖江南皆可憂矣禍難之興未見其涯不可不慎青昔在鄜延居臣麾下沈勇有智略若専以智高委之使青先以威齊衆而後用之必能辦賊幸陛下勿以為憂也上曰善於是詔嶺南用兵皆受青節制處置民事則與樞宻直學士孫沔等議之青至嶺下斬敗軍將校數人進擊智高於邕州大破之智高奔大理捷書至上喜謂公曰嶺南非卿執議之堅不能平今日皆卿功也青還上欲以為樞宻使同平章事公曰昔曹彬平江南太祖謂之曰朕欲以卿為使相然今外敵尚多卿為使相安肯為朕盡死力邪賜錢二億而巳今青雖有功未若彬之大若賞以此官則富貴極矣異日復有寇盜青更立功將以何官賞之且青起軍中致位二府衆論紛然以為國朝未有此比今幸而立功論者方息若又賞之太過是復使青得罪於衆人也臣所言非徒便於國體亦為青謀也爭之累日上乃許之加青檢校官遷䕶國軍節度使河中尹仍賜其諸子官既而内外訟青功以為賞薄者多上重於違衆復以青為樞宻使其後青卒以官盛為世所疑近世臺官進用太速公舉舊制御史秩滿以大藩處之内侍省都知王守忠侍上久求領節度使上以問公公曰自宋興以來未有内臣為節度使者陛下至孝凡祭祀文物事有毫髮關於宗廟者未嘗不兢兢畏慎況祖宗典法又可隳邪上乃止由是内外怨疾頗多㑹道士趙清貺與公有瓜葛親與堂吏通謀受人賂詐許為之求官公聞之奏捕清貺及堂吏繫獄窮治其姦杖而流之清貺行數日而斃於是言事者乗此爭詆毁公協力排之始以為公私於清貺末言殺以滅口上雖知公無罪欲厭言者之心五年命公以戸部侍郎知鄆州事兼京東西路安撫使既而深悔之是嵗上親祠南郊前月餘謂執政曰龐某可就加觀文殿大學士速行之若過大禮是與有罪者無以異也及詔出仍厚加賜賚契丹來求上御容及例外事數條上以問執政皆相視莫能對上悵然久之曰前者出龐某太怱怱蓋以公習知夷狄情能㫁大事故也至和二年除昭徳軍節度使永興軍路安撫使知永興軍事未行又改河東路經畧安撫使知并州事嘉祐元年上得疾久未瘳中外憂懼公上言比者陛下皇子繼夭宫坊虛位立嗣之義禮有明文願陛下深思祖宗統緒之重厯選宗室宜為嗣者速決聖志制命一出則群心大安奉承宗廟之孝無大於此臣以寒儒荷陛下大恩位至將相是以冒重禍而不疑不悔年垂七十逼於休退固無他望唯陛下保萬世之業懐生䝉無窮之幸乃老臣之大願後數年上遂定大筞如公議麟州屈野水西有田與夏虜相接疆場不明數十年來虜盜耕之麟人不能正也至是詔邊吏禁止之邊吏頗暴掠其民公曰拓跋氏稱臣奉貢未失臣禮今不先以文告而遽暴掠之使歸曲而責直非中國所以御夷狄也乃戒邊吏謹斥候毋得輒犯虜徐以義理曉之虜不去召使更定疆場又不至公曰虜仰吾私市如嬰兒之待乳若絶之虜必自來乃禁邊毋與虜為市虜大窮移書於邊請遣使更議疆場使者至有日㑹管勾麟府軍馬事郭恩恃其勇果與知麟州事武戡走馬承受公事黄道元率兵不滿千人涉屈野之西至忽里堆不為戰備虜怨邊吏之暴其民每聚兵萬餘於境上以待邊吏至而擊之以復其仇邊吏守公約束虜以饑疲罷去者數矣至是或告虜在水西恩等不信虜遂發伏兵以擊恩等恩道元皆没於虜戡脫走得歸然虜以私市故猶遣使者來請退水西之田二十里公不許先是公命通判并州事司馬光之麟州與戡議邊事戡請乗虜罷兵之時築二堡於屈野之西以禁耕者且為州耳目光還以告公從之比往而虜兵巳復聚戡不敢興役及敗乃言其日行視堡地為虜所掩以至失亡㑹虜遣道元歸朝廷命御史按之御史新拜官欲排擊大臣以為名移幕府取文書公以築堡之議光實與焉恐并獲罪乃留徼光之書以其餘與之御史遂劾奏公擅築堡於邊以敗師徒又匿制獄所取文書坐是解節鉞復以觀文殿大學士戸部侍郎知青州事兼京東東路安撫使光慙怍守闕上書具言其狀自請斧鉞之誅朝廷不許公又上奏引咎自歸乞矜免光罪光卒不坐他日光見公無所自容而公待之如故終身不復言始公在并州年甫七十亟欲告老㑹左遷不敢至青半嵗乃上表自陳朝廷不許遷尚書左丞徙知定州事本路安撫使公過京師入見上面陳至誠上曰新進之臣畏怯避事定州兵驕日久藉卿威名以鎮之卿勉為朝廷行也公不得巳請讓還左丞及至定一年而歸老上許之如期復請詔召還京師公陳請不巳或謂公今精力克壯年少所不及主上注意方厚何遽引去若此之堅公曰必待筋力不支明主厭棄然後乃去是不得巳豈止足之謂邪凡上表者九手疏二十餘通朝廷不能奪五年聴以太子太保致仕公好學出於天性雖耋老家居常讀書賦詩未嘗閒用此自娛至忘饑渴寒暑子弟雖愛之甚常莊色以誨之閨門燕居人不見其有惰容其為治以愛民為主明練法令以平心處之常曰凡為大臣尤宜祗畏繩墨豈得自恃貴重亂天子法邪唯治軍差嚴有犯輒以便宜從事或㫁斬刳磔或累笞取斃軍中股栗然能察知其勞苦至於廬舍飲食無不盡心為之區處使皆完美故所至士卒望風聳畏而終無怨心遇僚屬謙恭和易有所開白苟可取雖文書巳行立為更易無愛吝心八年三月丙午以疾薨于第年七十六時上巳不豫聞之震悼不能臨奠遣中使弔賻其家未踰月宫車晏駕今上在亮隂故未及贈諡公先娶夫人邊氏故樞宻直學士肅之女封嘉興縣君再娶劉氏供備庫使永崇之女封彭國夫人男五人長曰元魯登進士第官至大理寺丞早終次元英太常博士次元常内殿崇班次元中大理寺丞次元直大理評事女七人長適冀州支使陳琪封南安縣君次適都官員外郎宋充國封徳安縣君早終次適屯田員外郎程嗣隆封仁夀縣君次繼適宋充國封永康縣君次適大理評事趙彦若封榮徳縣君次及幼女皆未嫁孤元英將以其年六月壬申葬公于雍邱之東山乃謂光曰公平生知愛莫子如也子當銘公墓光自知不文不敢辭噫光受公恩如此其大滅身不足以報然公之徳烈載天下之耳目光不敢以一言私焉銘曰顯允公徳柔嘉維則敏而好謀果而不惑函谷以西幼艾嬉遊邊鄙不聳荷公之休五嶺以南復為王土制勝廟堂承公之祜文服武取動皆有成誰克知之維天子明天子爵禄天子法度怨憎孔多公忠乃著膂力未愆辭榮以年子衆而賢受福之全天之生公以佐先帝綴衣在庭公適辭世迹實為文欵石幽泉身毁名傳垂之億年
