body:
  text: 晉祠祈雨文盖聞誠通無逺神鑒無幽始謂不然廼今知信屬者時雨稍乏宿麥未滋躬謁嚴祠黙伸心禱囘輈再宿嘉澍響臻豈懇欵之㣲克留神聴寔元元之幸宜蒙神福然原陸久燥根荄未浹畎畆喁喁猶有待望謹以清酤嘉薦答揚神恵神當茂布優渥以終大施尚饗祭晉祠文維年月日具官某謹遣某官某謹以醪果殽羞恭薦于某神惟神宅晉之原食晉之土凡在晉境皆為神宇今嘉澤雖豐霑潤未溥神心無私民靡不撫逺邇之間奚有捨取惟神申大前徳均錫靈雨實我來麰秀我稌黍穂棲于田粒益于庾為酒為醴永承神祜尚饗晉祠謝晴文久雨不止涉于積旬汙邪既瀦平原将溢田恐蕪穢民憂墊隘有司恐懼謀請于神聰明感通遽已晴霽水返其壑雲歸於山蔬榖無虧嵗則大熟蒙神之休敢愛牲酒尚饗祭雷道矩文維年月日陜郡司馬光謹致祭于士友雷君道矩之靈嗚呼道矩氣厚以和行直且方謹畏禮律如循鋒鋩臨義敢决若揮干将無位於朝憂國遑遑發憤抗言忠鯁激昻逺慮萬世引之深長家聲不隕􅂱然有光西戎驕貪蠺食我疆筞馬徑前挺身戰塲敷陳直辭逆折豺狼虜氣方沮斂蹤退藏如何不淑罹此疾殃㣲息垂盡遺音琅琅上嗟王事未畢而亡下痛老母皤然在堂言終而絶云誰不傷嗚呼道矩短長有時不可推移善惡得失繫人施為顯晦窮通云胡可期立身如此可以無悲獨我友生煩寃涕洟恨此膏澤不霑蒸黎奠以薦誠魂乎有知嗚呼哀哉尚饗祭江隣幾文嗚呼佗人之生憎愛糾紛獨君不然見之者親佗人之死議論交集獨君不然聞之者泣問君何修乃能致此率其誠心無有表裡是宜胡耉光大顯融如何不淑星未五終平日之遊晨往夕來宛其在目誰能不哀念君素懐於物何有叙兹永違無若巵酒尚饗三司祭張元常文惟君寛裕敦篤外和内直秀眉廣顙盛氣揚休吉徳之報宜蒙遐福骨相之符必享永年如何一朝兩違所望凡在僚友孰不惋傷奠以薦誠庶幾來饗初除待制祭先公文光聞禄不及親古人所歎重茵列鼎適足增悲光弱冠之初幸塵仕籍罪多福鮮繼招凶釁顧復之恩闕焉靡報痛毒愁辛無忘夙夜誠不自意蒙荷餘休名參侍從身踐世職不肖之質何以似續慙怍戰兢不遑啟處甘旨之養已無所展忠直之風庶幾不墜力自黽勉無忝所生備位諌臣不敢自逺瞻望邱壟涕泗交横尚饗祭龐頴公文嘉祐八年五月作維嘉祐八年五月丁巳具官司馬光謹以清酌庶羞之奠躬薦於故相國贈司空侍中頴公之靈公茂徳豐功布於四海事存石刻不敢重陳念昔先人久同僚宷越自童齔得侍坐隅撫首提携愛均子姓甫勝冠弁遽䘮所天孤苦惷愚不能自立長號四望誰復顧哀惟公眷憐過於平日既釋縗服還齒簪裾舉首朝端繄公是賴爰加振㧞俾出泥塗讎校祕文討論前載逮公出牧兩託後車推心不疑言皆見納立效甚寡為負實多過若邱山咸加掩覆善如絲粟必見褒揚屢薦其名徹聞天聴遂塵清貫獲備邇臣今日所䝉莫非公力言念恩紀終身敢忘承乏諫垣造請有禁不親杖屦殆将再期豈意一朝忽為永訣儀刑在目訓誨如聞奄去華堂長歸幽壤心焉隕絶言不成章英靈有知臨此薄酹嗚呼哀哉尚饗告題祭版文治平四年十月作治平四年十月辛酉曽孫具官光敢昭告於曽祖考處士府君曽祖妣夫人伏以春秋祭祀思慕無窮宜有屏攝以伸曕奉謹以良月吉日恭題祭版伏惟尊靈降監昭格是憑是依尚饗祭張尚書文熙寧四年作維熙寧四年月日女壻具官司馬光謹以清酌庶羞祭於故禮部尚書張公之靈公之徳業衆所尊仰始終詳實已載銘文在昔先公與公同省間來問訊延就中堂光時弁髦立侍左右蒙公一見許以成人不卜不謀遂妻以子自惟童騃齒位殊絶未嘗交語從何辱知知已之恩重於姻戚沒身銜戢不敢弭㤀聞訃之初涕零如雨綴於官守走哭無從逺薦醪羞用辭為侑尚饗祭吕獻可文熙寧四年八月作嗚呼獻可之亡海内歎惜况於親友惋傷可知忠直敢言人人自許誰如獻可始末無虧道不愧心名高於世夀夭不校餘復何言知我之深見於臨沒今兹永訣文不逮情嗚呼哀哉尚饗張尚書𦵏祭文維熙寧四年八月日女壻具官司馬光謹以清酌庶羞祭於禮部尚書致仕清河恭安公之靈日月徂遷𦵏期已及承乏西臺不敢離局行不執紼奠不操巵引領松楸悲何有極尚饗祭錢君倚文維熙寧六年七月已未陜郡司馬光謹致祭於君倚舍人之靈嗚呼君倚好賢如親就義若渇非聖不學唯善是為納忠於君恥後堯舜竭力於友志追陳雷推誠而行不疑不畏屢蹈顛沛終殄悔心甲科榮名西掖清貫君倚之美兹不足言始謂吉人必膺遐福如何彫謝曽未二毛我與君倚南北殊鄉哲愚異品中年相值情厚故交飾貌無華發言必盡風迹猶在精爽何之江山阻長醪羞㣲薄惟期惋怛可以潜通嗚呼哀哉尚饗祭董少卿文維年月日具位司馬光謹致祭於鄰幾少卿董兄之靈兄昔為夏宰西鄙用師賦調雖煩民不告病生齒雖衆訟庭常虚光實夏民目所親睹自兄之去繼者為誰三十年餘屈指無幾兄入佐㑹計出奉簡書厯守别藩所至稱治民懐其惠吏畏其明為時材臣屢當劇任指顧立辧不廢笑談與人遊居雍容愷悌引年據禮納祿辭榮志力精强謂宜遐夀如何不淑奄忽長歸光既舊且親荷知為厚聞訃哀惋始不自勝薄致醪羞維誠是薦尚饗祭張宻學文惟公幼而孝長而謹以文學從仕以勤力當官入侍禁嚴譽處臺省出敷恵化周流藩宣将漕則蓄積豐衍監邊則民夷懐服慮無㣲而不臻職無煩而不舉朝倚器幹時推精力夀考而終福祿流厚今兹自宋遷周捨卑就燥卜宅得吉祖載及期光等早厠賔客之末晚陪嗣子之遊式陳醪羞用薦衷素尚饗祭陳彦升文年月日涑水司馬光謹以香酒膳羞致祭于彦升之靈嗚呼光平生取友以道相親如彦升之質直光所心服忽焉棄我惋痛誠深尚饗奠李夫人文元豐七年十月乙酉具官司馬光謹遣男某官某致祭奠於故李尚書夫人之靈夫人明智而溫柔順而正知古不泥從俗不流禮刑閨門名播鄉曲神明保祐夀考令終光忝預族姻素服懿徳敢陳薄酹式薦㣲誠尚饗改𦵏先令公啟殯祭文以下為丞相作某舋惡不天福祐單薄旨甘甫備風樹永違日月貿遷松檟未植夙興夜處心不遑寧是用物土之良諏時之吉改卜宅兆恭啟攅塗屬以備位宰司任隆責大懇祈退避恩指莫從不得臨穴盡哀憑棺取訣永言罪負隕絶復蘇叩心長號五内糜沸令公祖奠文日月有期靈輀将進逺違故壤遷就佳城惟靈澹泊安閒以時就道山川無壅徒御不驚瞻慕攀號心摧氣結令公到墓祭文闕塞之陽伊川之涘地形爽塏水脉厚深惟靈去故就新永寧兹宅不騫不圮保固億年涕慕之心昊天罔極令公掩壙祭文嗚呼祿不逮親古人所歎重茵列鼎誰適為榮掩坎聚墳身不親在羡門既鍵長夜無晨瞻望題和於兹永絶興言念此心爽飛颺觸地號天肝腸寸絶貟外啟殯祭文惟靈居家孝慈蒞官肅給如何茂徳不享遐年爰擇令辰肇開旅肂遷就祖域永有依歸沃酹不親倍増悲涕尚饗貟外掩壙祭文日吉時良已就安宅祖禰咸在如從逺歸英靈有知足慰𡨕漠終古永訣臨風涕洟尚饗潁川郡夫人焚黄祭文夫人胄自徳門無祿蚤世久同困約不與顯榮朝推恩渥追錫嘉命魚軒翟茀燭耀重泉靈而有知歆戴天寵尚饗啟殯祭文旅官飄颻家無常所槥櫝未瘞久寓西郊逢時之良遷就窀穸撤攅云始取道有期撫事悵然益増感悼祖奠祭文日月有期輤輿當發川塗寝邈丘壟長歸伉儷之心曷勝悲惋傳家集巻八十
