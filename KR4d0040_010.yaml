front:
  text: 溫國文正公文集卷第十
  hash: sha256:154e7a591dd687d39ff4da72e918ae273ea48631c66a1e5a8d992f74442c2cb7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_010-1a}
body:
  text: 律詩五致政邵少卿挽辭之美訪及不獲展奉以詩為謝送聶祕丞希甫字之美宰桐城二首送蒲中舍霜致政歸蜀前栗亭令蘇門先生和沖卿喜雨偶成寄贈致仕劉都官諷張元常云諷年六十三致仕夫婦皆健居簡州賴山中有二子皆有官其一登進士第諸孫皆好書和宋郎中選字子才孟秋省直八月五夜省直送王著作慥西京簽判夢稚子梅聖俞挽歌二首次韻和王勝之十二月十五日退朝馬上作又和雪送裴中舍士傑赴太原幕府和吳省副中復字仲庶梅花半開招慿由張司封飲伯平字公達郭氏園送仲通出刺棣州得朝字賞花釣魚二首御製後苑賞花釣魚七言四韻詩一首奉聖旨次韻秦人送致仕朱郎中令孫依韻和仲庶省壁畫山水太博同年葉兄紓以詩及建茶為貺家有蜀箋二軸輒敢繫詩二章獻於左右亦投挑報李之意也送宋郎中知鳯翔府秋夕不寢呈諌長樂道龍圖始平公以光得免使北賜之以詩謹依韻酬和孟嘗喜李侍郎東之得西京留臺始平公作雙樗庵命光為詩忝職諌垣日負憂畏𬗟思雲夫處土老兄蕭然物外何樂如之因成浮槎詩寄獻以杼鄙懷邇英閣讀畢後漢書蒙恩賜御筵詩送李侍郎東之西京留臺送元待制絳字厚之出牧福唐送吳駕部處厚知真州和趙子輿龍州吏隱堂寄題錢君倚明州重修衆樂亭冬夜張元常挽歌二首和景仁夜讀試卷奉和御製龍圖等閣觀三聖御書詩又和雪霽又和二月五日夜風雪仁宗皇帝挽歌詞二首故相國頴公挽歌詞三首致政邵少卿挽詞北固啓佳城東吳霣德星繐帷長寂寞羽扇遂飄零泉燭千年碧霜松數寸靑慶餘知有在玉樹滿階庭之美訪及不獲展奉以詩為謝昔君來闕下定館必吾廬今者雖相值依然是索居之美館於僧舍不堪休沐少便使往還踈深愧原思巷空回長者車送聶祕丞希甫字之美宰桐城二首問子青雲器胡為不少留未能充祿養安敢及身謀卓爾千人俊居然百里優連城價終在自是玉工羞七載一相見恍然如路衢形骸漸枯稿志業轉荒蕪往事雲過眼新悲雪染鬚明朝又分首上馬即重湖送蒲中舍霜致政歸蜀前栗亭令厭苦折腰久飄然黃鵠飛田園未蕪沒鄰曲有光輝昔奮儒衣去今紆朝紱歸人生貴知足得此巳為希念昔兩髦日烏奴同燕遊隨時自有樂何物可為愁豈意今頭白相逢欲涕流慿君訪題壁好在水西樓光侍先君為利州路轉運使與君屢遊烏奴山寺題名屋壁蘇門先生長嘯蘇門石行藏丗莫知逍遙心迹逺寂寞姓名誰鄉在無何有時方不可為麟麟本神物安得係而羈和沖卿喜雨偶成萬里風隨快雨來塵昏消伏旱光開物情濯熱參差喜天意為仁容易湖簾映薄寒燈有量窗含虗曰麝成煤君侯雅有江湖興蕭灑何須氣象催寄贈致事劉都官諷張元常云諷年六十三致事夫婦皆徙居簡州賴山中有二子皆有官其一登進士第諸孫皆好書星郎年未至辭祿一何髙目瑩棲靈氣眉踈出秀豪胸中自有樂身外盡徒勞回首紅塵地紛紛笑我曹解紱沱江外誅茅井絡邊老萊夫婦隱韋孟子孫賢浮蟻邀旁舍蹲鴟種薄田不須親􅕇杖想望巳蕭然范景仁詩云移家尚恐青雲淺隱几唯知白日長朱公綽詩云疏草焚來應見史橐金散盡只留書和宋郎中選字子才孟秋省直夜久殘暑盡好風來滿襟牀空唯置枕冠小不施簮竹影亂涼月林梢轉曉參人心有喧寂何必欲雲岑八月五夜省直大火巳西落溫風猶襲人留連惜紈扇散誕脫紗巾蟾影夜色淺蛩聲秋意新圗書足自適何物更關身送王著作慥西京簽判古來都邑美孰與雒陽先況復元侯貴兼之從事賢玦離橫闕塞珠曲逗伊川慰眼登臨樂送君空惘然夢稚子窮泉纎骨巳成塵幽草間花二十春昔日相逢猶是夢今宵夢裏更非真梅聖俞挽歌二首兵形窮勝負史法貫興衰落落雖殊衆恂恂不忤時位卑名自重才大命須竒丗俗那能識傷嗟正為詩􅃮燈無復曙柏徑不知春南紀光華減中朝俊秀貧淒清千古韻寂莫一丘塵異日昭亭下方多瀝酒人次韻和王勝之十二月十五日朝退馬上作瓦溝微白雪光清闕角𥘉紅海日騰塵息長街千騎人鞘鳴深殿六龍升雲巖有客空回首圭蓽何人尚曲肱自笑鯫生章綬縛不容逃去正如􅊻又和雪四簷冰管未全晞一夕隂風雪又飛客卧牛衣憂死别人留玉塞望生歸公車歲晚憐東郭遼海雲深失令威頗憶當年映書否物華如舊鬢毛非送裴中舍士傑赴太原幕府元戎台鼎舊大府節旄新邊候正無事賔筵况得人山寒太行曉水碧晉祠春齋釀蒲萄熟飛觴不厭頻和吳省副中復字仲庶梅花半開招慿由張司封飲伯玉字公逹帝鄉春色嶺頭梅髙壓年華犯雪開正與嘉賔思共醉不須芳物重相催從車貯酒傳呼出側辨簮花倒載回風雨難期王事劇未知休沐幾旬來郭氏園送仲通出刺棣州得朝字名園送嘉客冠蓋去傾朝小雨塵微斂餘寒酒易消鴈歸春近塞日上海生潮北道平如掌東風五馬驕賞花釣魚二首飛廉通上苑鳷鵲帶夫淵樹色含春霧波光靜曉煙香飄仙仗外花舞御巵前籊籊文竿裊篩篩素鮪鮮誤陪金馬籍愧奉柏梁篇願獻南山壽宸遊侍億年日麗芙蓉闕春濃太液波苑門鳴玉集輦路翠華過芳樹周阿密嘉魚在渚多浮英入樽斝頒首出蒲荷人樂熙熙德臣賡旦旦歌萬生同鼓舞相與醉天和御製後苑賞花釣魚七言四韻詩一首奉聖旨次韻馺娑蜚廉次第開鳴鞘傳蹕自天來雲隨綵仗低臨幄栁壓金隄翠入杯檻倚柔風絲縹眇花翻麗日影徘徊上林春色長如舊玉輦嬉遊歲歲陪秦人楚旗獵獵蓋山紅回首咸陽一炬空惆悵秦人虛用意幾年辛苦得山東送致仕朱郎中令孫丗間榮利無窮物奔走勞勞何所之仕宦為郎非不逹功名有命待無時橐中雖乏千金直膝下常攜兩綬兒細校人生能此少好從閭里樂期頥依韻和仲庶省壁畫山水畫工執筆巳心遊稍稍蘅臯引杜洲堆案煩文猶倦暑滿軒新意忽驚秋天生賢者非無為官遇明時未易休正恐怒飛朝暮事丹青難得久淹留太博同年葉兄紓以詩及建茶為貺家有蜀箋二軸輒敢繫詩二章獻於左右亦投桃報李之意也閩山草木未全春破纇真茶采擷新雅意不忘同臭味先分疇昔桂堂人西來萬里浣花箋舒卷雲霞照手鮮書笥久藏無可稱願投詩客助新編送宋郎中知鳯翔府昔解陳倉印於今二十秋雙鳬久東上五馬重西遊鐃騎行關外壷漿擁道周民心巳化服條教不更修秋夕不寢呈諫長樂道龍圗雨氣生燈暈霜寒入漏聲踈籬過螢影腐葉掩蟲鳴丘壑違𥘉願簮𥚑徇外榮丹心終夜苦白髮詰朝生恩與乾坤大身如草木輕何階致明主垂拱視升平始平公以光得免使北賜之以詩謹依韻酬和皇華將命得人難專對非才輒自言幸免驅車涉沙漠尚容載筆待宣溫不惟羞屈穹廬膝無奈常逰魏闕魂衮職區區未能補何時餘諭奉清樽孟嘗冠蓋盈門意氣豪海魚兼兩未充庖歸來散盡三千客方寤時人市道交喜李侍郎東之得西京留臺賤子何為者栖栖今二毛滄波浮片葉大塊載秋毫利物物何補營身身巳勞羡君遣世網脫屣一何髙始平公新作雙樗庵命光為詩間氣生王佐多材秉國鈞㨂隆慿𣏌梓節徑仰松筠底績承平業遺榮壽考身結廬依散木退讓樂天真忝職諌垣日負憂畏𬗟思雲夫處士老兄蕭然物外何樂如之因成浮槎詩寄獻以杼鄙懷秋水浮槎客漂如一葉輕鷗群雖仗信鯨口幾忘生耿耿天津闊滔滔海浪驚何時還故土懷糈問君平邇英閣讀畢後漢書蒙恩賜御筵詩赤伏開興運昆陽定壯圗官儀還舊物郊兆建新都杲日群隂破油雲萬類蘇鑾輿陟喬嶽璽綬撫胸奴厚祿優諸將嘉猷訪大儒重明紹堂御名奕葉奉規摹叔世綱條紊遺風節義扶袁安空隕涕揚震卒蒙辜倿指車前鹿人瞻屋上烏炎精盡河渚黃眚兆當塗青簡傳良直金華侍燕娛興衰炳轍迹淑慝粲龜符赫赫天光照孳孳睿思紆方齊建武治不啻永平俱化盛文明止恩隆飲食需晞陽慙祀棘濡咮愧鵜鶘帝力生成大臣功報效無先民誠可監願不忘斯須送李侍郎東之西京留臺先公勳烈盛鹽梅清白仍聞世濟才華省拂衣辭簿領長衢回首謝塵埃嵩峯排霧依俙出洛水迎人迤邐來寄語馬前頭白吏何殊昔日李西臺送元待制絳字厚之出牧福唐甌越東南美田肥果稼饒況懷新賜綬重過舊題橋食足姦回熄風移獄犴銷長才報政速鈴閣日逍遙送吳駕部處厚知真州嚮託屏星駕同隨丞相車終朝容懶拙經歲庇迃踈共此趨雲闕旋聞建隼旟江淮一都會遊刃必多餘和趙子輿龍州吏隱堂四望逶迤萬疊山微通雲棧落塵寰誰知吏道自可隱未必仙家有此間酒熟何人能共醉詩成無事復相關浮生適意即為樂安用腰金鼎鼐間寄題錢君倚明州重修衆樂亭橫橋通廢島華宇出荒榛風月逢知己湖山得主人使君如獨樂衆庶必深顰何以知家給笙歌滿水濵張元常挽歌二首為吏文無害臨民政不苛渾金生自美古井淡無波方喜風鵬舉旋聞隙駟過善人宜壽考報施定如何秀眉無足驗結轖遽為災鄉曲三年别江山萬里回林閭飛旐入書劒逐舟來墳草枯還緑重泉不復開冬夜冬夜何其永寒光四泬漻鴈橫星歷歷人靜漏迢迢破屋霜應重荒庭雪未消不眠何所念逹曉思無憀奉和御製龍圖等閣觀三聖御書詩積厚丕丕業重光郁郁文寶書垂列宿玉字切浮雲散帙鳴鑾駐充庭雜佩分願移天縱藝似續聖功勤和景仁夜讀試卷案前宫燭墮花頻滿目髙文妙入神勇氣先登勢無敵巧心後發語尢新好賢何啻三薰貴求寶方知百汰真愚魯自非慿驥髮崑山千里到無因又和雪霽南宫來幾時挾纊易春衣意謂花將晚何言雪尚飛夜聲通旅枕曉色弄晴暉繼日勞王事離鴻巳北歸又和二月五日夜風雪春風正豪怒夜雪復飄揚勿使羇愁亂自知清興長簾踈聲淅瀝燈冷暈微茫此夕牛衣客成名不可忘仁宗皇帝挽歌詞二首聲教萬餘里文明四十春茂勳留信史盛福滿生民共適禽魚樂安知橐籥仁百年龍馭逺空復仰威神霧曉銅魚躍霜寒閶闔開哀聲際海發靈仗拂天來别寢嚴虗位重閽閟夜臺柏城空有路無復屬車回故相國頴公挽歌辭三首儒衣臨絶塞廟略運竒兵緩帶羌塵靜靈旗海霧清公心結明主隂德庇群生名遂身仍退人間五福并銘旌逺明滅騎次去低昻三鼎功名大重泉日月長鶴飛來弔客牛卧卜連岡車馬還城郭悲風滿白楊滄波與鄧林魚鳥久飛沈一旦成陳迹何人識寸心髙山亡景行流水失知音淚盡離東閣歸來破故琴溫國文正公文集卷第十
