front:
  text: 温國文正公文集卷第六十一
  hash: sha256:3c4c830444b49f31f2165e17f8d973f3793eae41986baf530f2fa0c8191eac6c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_061-1a}
body:
  text: 書啓四莒張砥先生書荅陳師仲監簿書荅李大卿孝基書與吴相書荅蔣中舎深之書深之祖綸淳化中為永康軍判官死蜀冦荅郭純長官書荅陳師仲司法書問景仁以正書所疑書荅張砥先生書八月二日涑水司馬光白張君先生辱書示以所著春秋傳士大夫不以經術爲事乆矣足下獨能治春秋三十年成書三十萬言是古之儒者復見於今日也欽仰咨嘆無有窮巳足下自謂天以聖師之道厄日引久而隂有所相若非己意之所自出者光經術素淺於春秋尤所不通虚辱足下之賜讀之累日不能識其涯涘又烏暇知其得失敢錯論議於其間哉至於建白於上乞廢三傳之學而行足下之書以伸千載聖人未明之意此尤非光之所敢任也不勝惶悸之劇其書謹再拜封納請更擇能通春秋學有大名居髙位可以副足下之求者而從之幸甚幸甚不宣光白荅陳師仲監簿書九月十八日涑水司馬光再拜陳君監簿足下金州人來辱兩書以能出處見期未相識爲恨光實何人敢受此賜反仄愧汗無地自處光性愚陋頗好讀古人書聞君子之風亦知慕之而未能至睹小人所爲亦知恥之但恐未能免耳曏蒙朝廷猥加収采塵汚侍從預陪國論訖無銖兩之𥙷俄又擢寘樞庭譬如有人舉萬金之重加稚子之背彼必走而避之萬金非不貴也然走而避之者知其非任故也此乃物理之常烏足謂之賢哉今以衰病自求便安朝廷未棄之田里尚縻以一官賜之廪禄使飽食安坐自放於豐草長林間乃聖主之至仁鄙夫之大幸豈敢効古之人以道不行而自藏哉恐足下傳聞之誤而獎借之過誠不敢自保恐萬一它日䧟足下於不知言之責以重老朽之辠是敢輙自陳叙浼瀆聦明庶幾識察而巳光雖未獲侍前三復足下書及所示文編語髙而氣直才美而志大其嚮往欽服之心固非筆札所能盡也不宣光再拜荅李大卿孝基書光再拜昨晚暫得請見經宿起居何如適辱誨筆承朝夕往河清不得再詣辭千萬以保攝爲禱大卿平生以保攝爲事計其專勤舉丗無倫然光區區猶有所獻者譬如舉輕塵以禆泰山雖不知量志在忠益而巳光聞一隂一陽之謂道然變而通之未始不由乎中和也隂陽之道在天爲寒燠雨暘在國爲禮樂賞刑在心爲剛柔緩急在身爲飢飽寒熱此皆天人之所以存日用而不可免者也然稍過其分未甞不爲災是故過寒則爲春霜夏雹過燠則爲秋華冬雷過雨則爲霪潦過暘則爲旱暵禮勝則離樂勝則流賞僣則人驕溢刑濫則人乖叛太剛則暴太柔則懦太緩則泥太急則輕飢甚則氣虚竭飽甚則氣留滯寒甚則氣沉濡熱甚則氣浮躁此皆執一而不變者也善爲之者損其有餘益其不足抑其太過舉其不及大要歸諸中和而巳矣故隂陽者弓矢也中和者質的也弓矢不可偏廢而質的不可逺離中庸曰中者天下之大夲也和者天下之逹道也致中和天地位焉萬物育焉由是言之中和豈可須臾離哉昨日聞大卿言臓腑素有冷疾湏至服熱藥今則徧身生瘡疥手足時瘈瘲疑有風邪尚欲以烏頭治之光雖略曽以所見貢聞又恐侍坐之乆尊體疲倦不敢畢其辭而退竊以大卿勤養生之術數十年而猶有冷疾者殆食素膳太多故也彼筍簟乳腐麵滓豆炙性大寒而滯氣光見人多食之致脾胃虚弱脹滿滑泄面目浮腫腰足沈重者前後非一矣天生萬物各有所食苟不得其所食則不能全其生人爲萬物之靈兼𬞞榖酒肉而食之乃其常性也酒肉者所以扶衰養疾不可廢也大卿絶酒肉而專素膳爲日巳乆此其所以有冷疾也旣得冷疾復以熱藥攻之聞大卿所服之藥皆躁悍酷烈它人莫能近口此其所以失中和也中冷則爲羸瘠靣腫外熱客於肌膚則爲瘡疥流於筋脉則爲瘛瘲光雖不暁醫以隂陽之理推之殆不逺矣不勝𣢾𣢾之愚欲望大卿自今罷素膳屏熱藥静慮以適神潜心以實下起居飲食造次湏臾不少離於中和試行之旬月竊謂所苦不湏攻療必自去矣若旬月無效棄黜其言可也光以託契義之舊仰徳名之熟雖得見尚新所居連牆而往来不數然愛重之心過於朝夕握手接膝者矣是以敢輒獻盡言幸㠻裁察不宣光再拜崇福大卿與呉相書光啓光愚戇迃僻自知於丗無所堪可以是退伏散地苟竊微禄以庇身保家而已近聞道路之人自京師来者多云相公時語及姓名或云亦常有所薦引未知虚實光自居洛以来仕宦之心乆巳杜絶在少壯之時猶不如人况年垂六十鬚髮皓然視昏聽重齒落七八精神衰耗豈復容有干進之心但以從遊之乆今日特蒙齒記感荷知已之恩終身豈敢忘哉顧惟相公冨貴顯榮豐備巳極光踈冗之人無一物可以爲報惟忠信之言庻幾仰醻盛徳之萬一耳伏惟明主歴選周行登用人傑以毗元化以光不敢忘知已之心知相公必不輕孤於明主也竊見國家自行新法以来中外恟恟人無愚智咸知其非州縣之吏困於煩苛以夜継晝棄置實務崇飾空文以刻意爲能以欺誣爲才閭閻之民迫於誅歛人無貧冨咸失作業愁怨流離轉死溝壑聚爲盗賊日夜引領冀朝廷之覺寤弊法之變更凡幾年于兹矣相公聦明豈得不聞之邪今府庫之實耗費殆竭倉廪之儲僅支數月民間貲産朝不謀夕而用度日廣掊歛日急河北京東淮南蠭起之盗攻剽城邑殺掠官吏官軍巳不能制矣若不幸復有方二三千里之水旱霜蝗所在如是其爲憂患豈可勝諱哉此安得謂之細事保其必無而恬然曽不以爲意乎賈誼當漢文之丗以爲譬如抱火厝之積薪之下而寢其上火未及然固謂之安若當今日必謂之火已然而安寢自若者也昔周公勤勞王家坐以待旦跋胡疐尾羽敝口瘏終能爲周家成太平之業立八百之祚身爲太師名播無窮子孫奄有龜蒙與周升降王夷甫位居宰輔不思經國專欲自全置二弟於方鎮以爲三窟及晋室阽危身亦不免然則聖賢之心豈皆忘身徇物不自爲謀哉蓋以國家興隆則身未有不預其福者也顧衆人之識近而聖賢之慮逺耳如相公之用心固周公之用心也今若法弊而不更民疲而不恤萬一䑕竊益多蠭蠆有毒則竊恐廟堂之位亦未易安居雖復委逺機柄均逸外藩外藩固非息肩之處乃至投簪解紱嘯傲東山東山亦非髙枕之地也然則相公今日救天下之急保國家之安更無所與讓矣救急保安之道苟不罷青苗免役保甲市易之法息征伐之謀而欲求其成効是猶惡湯之沸而益薪皷橐欲適鄢郢而北轅疾驅也所求必不果矣欲去此五者而不先别利害以寤人主之心則五者不可得而去矣欲寤人主之心而不先開言路則人主之心不可得而寤矣所謂開言路者非如曏時徒下詔書使臣民言得失旣而所言當者一無所施行又取其稍訐直者隨而罪之此乃塞言路非開之也爲今之要在於輔佐之臣朝夕啓沃唯以親忠直納諌爭廣聦明去壅蔽爲先務如是政令之得失下民之疾苦粲然無所隱矣以聖主睿明之資有賢相公忠之助使讜言日進下情上通則至治可指期而致弊法何難去哉夫難得而易失者時也今病雖巳深猶未至膏肓苟制治於未亂保邦於未危尚有返掌之易失今不治遂爲痼疾雖邴魏姚宋之佐將未如之何必有噬臍之悔矣相公讀書從仕位至首相展志行道正在此時苟志無所屈道無所失其合則利澤施於四海其不合則令名髙於千古丈夫立身事君始終如此亦可以爲無負矣光切於報徳貪盡區區不覺辭多光惶恐再拜荅蔣中舎深之書深之祖綸淳化中爲永康軍判官死蜀㓂光啓承垂示先都官畫像記沈公論之巳詳殆無以加古之人誰不死惟得其所爲難故國君死社稷大夫死衆士死制各死其所受禮也爲臣事君不計位之髙卑恩之厚薄知之淺深苟在其職死之義也方蜀冦之熾守臣軍帥棄地與衆而逃者多矣先都官獨以文吏在下位力戰死之其於禮義非知之明守之篤能如是乎可謂得其所矣沈公旣叙其忠孝光又述其禮義然忠孝禮義亦相与爲表裏者也光再拜荅郭純長官書光啓去歲十月蒙惠書足下所治路僻光閑居難值便人以是朞年不獲修報然中懷耿耿未甞暫忘潘司録来又辱書且媿且感霜秋公餘喜聆安善所示㑹統稽元圖貫穿千餘載前賢搜羅所不至者纎悉盡備靡有闕遺非夫好學之勤用意之精誰能臻此欽服欽服光學踈識淺於正閏之際尤所未逹故於所修通鑑叙前丗帝王但以授受相承借其年以記事爾亦非有所取捨抑揚也於漢昭烈之立甞著論以述其事今并録呈可以見其不敢專矣夫正閏之論誠爲難暁近丗歐陽公作正統論七篇以断之自謂無以易矣有章表明者作明統論三篇以難之則歐陽公之論似或有所未盡也歐陽公謂正統不必常相継有時而絶斯則善矣然謂秦得天下無異禹湯又謂始皇如桀紂不廢夏商之統又以魏居漢晋之間推其夲末進而正之此則有以来章子之疑矣章子𥙷歐陽公思慮之所未至謂秦晋隋不得與二帝三王並爲正統魏不能兼天下當爲無統斯則善矣然五代亦不能兼天下与魏同乃獨不絶而進之使与秦晋隋皆爲覇統亦誤矣足下離之更爲異䓁斯又善矣然則正閏之論雖爲難知經三君子盡心以求之愈講而愈精庻幾或可以臻其極乎是以古之人貴於切切偲偲良有以也如光者惷愚冥頑安足以闚三君子之藩籬而敢措一辭於正閏之間竊惟足下録此書以相示蓋亦有切切偲偲之志非欲光爲諾諾之人也芻蕘之言明者擇焉光辱足下之厚意豈可逆自鄙薄不傾胷腹之所有以盡布於左右而求采擇乎孔子曰名不正則言不順先儒謂秦爲閏者以其居二代之間而非正統如餘居兩月之間而非正月也夫覇之爲言伯也古者天子立二伯分治天下諸侯周衰方伯之職廢齊犯御名晉文能帥諸侯以尊周室故天子冊命使續方伯之職謂之覇主而後丗學者乃更以皇帝王霸爲德業之差謂其所行各異道此乃儒家之末失也今章子以覇易閏以失爲得恐不足遵也夫統者合於一之謂也今自餘以下皆謂之統亦恐名之未正也又蜀先主自言中山靖王之後而不能舉其丗系後唐出於沙陀姓朱邪氏唐賜之姓明宗復非莊宗之族清泰又非明宗之子李昇起於厮役莫知其姓或云湖州潘氏子李神福俘之以爲僮僕徐温匄之以爲子及稱帝慕唐之盛始自言姓李初欲祖吴王恪嫌其誅死又欲祖鄭王元懿命有司檢討二王苗裔有司請爲恪十丗孫昇曰歴十九帝十丗何以盡之有司請以三十年爲一丗議後始定足下云蒙先丗之烈者謂之餘今三家皆謂之餘可乎且餘者豈非謂承正統之餘也今劉知逺謂之閏而劉崇謂之餘可乎又凡不能壹天下者或在中國或在方隅所處雖不同要之不得爲真天子今以曹魏劉石二趙苻姚兩秦元魏髙齊字文周朱梁石晉劉漢郭周爲閏孫呉劉宋二蕭齊梁陳慕容燕赫連夏爲偏李蜀吕李秃髮沮渠西涼乞伏秦馮燕揚呉王孟兩蜀廣南漢王閏爲僣三者如不相逺然願更詳之彼符氏姚氏与慕容氏赫連氏与拓跋氏一據閞西一據山東与髙齊宇文周何以異乎又凡天禄之不終者傳丗不傳丗等耳王莽雖篡竊天下甞盡爲之臣者十八年与秦頗相類非四夷群盗之比也則天乃唐之母后臨朝稱制與吕后無殊但不當革命稱周耳其後子孫相继有天下不得謂之不終其身今与王莽同謂之僞亦似未安也凡此數者皆愚陋之所見未必中理願足下采其區區之心而不以爲罪幸甚幸甚光再拜長官祕校足下荅陳師仲司法書八月三十日涑水司馬光謹復書司法陳君足下辱書并示先國博家傳以爲何蕃董邵南之節行不見於它書獨韓文公傳而詩之故其名彰徹迨于今謂光盍亦爲傳若詩使吾先君之名流布於丗承命悸栗流汙及足何足下比擬之非倫而責望之太過乎文章自魏晉衰微流及齊梁陳隋羸備纎靡窮無所之文公傑然振而起之如雷霆列星驚照今古自班張崔蔡不敢企仰况潘陸以降固無足言故何董之名附其文而傳曏使一妄庸人傳而詩之二子於今尚有聞乎光性愚學踈於文尤非所長今時常爲秉筆者笑敢望傳於後乎足下乃使爲韓之所爲是猶驅䇿駑馬曰必爲我追千里之足其果能爲之乎借候光不自知量輙引韓以自况爲詩傳以叙當丗賢者之事業必取舉丗之唾詈且無所容其身矣誠不敢自愛大懼汩没先君子之名以重其辠况先君子潜德遺羙二顔旣傳而評之甚精且詳決傳無疑光何所有可以加銖兩之重乎惟足下憐而察之光再拜問景仁以正書所疑書光啓晚來蒙惠手筆并㯶扇值相継有客不得即時修謝前此承示所著正書且垂諭云未安處便與點竄以景仁之明逹耆壽加以平生所致思而得者乃下問於頑鄙末學如光之比雖古人詢于芻蕘以能問不能殆無以踰此何以勝克悚仄悚仄伏讀累日如風雅皆周道旣衰詩人追思其盛而歌之閞睢以興淑女非興后妃成康平王康侯皆指其爵謚文王配上帝終周丗八蜡不數昆䖝三年之喪不應二十七月衆子在嫡孫亦應傳重舜無塗廪浚井之事韓愈爲嫂服期非是凡此之類皆光素所探揣謂其當然而未敢自信今乃幸與景仁如合符契豁然決矣至於解利貞者性情也四海困窮柔逺能邇皆先儒研思所未到不勝歎服其間亦有愚昧所未諭者十餘條或一字筆誤無不簽出以俟稍暇得侍凾丈請益卒業前日所留易說繫辝注續詩話皆狂簡不揆冝見誅絶於君子者然亦庶幾景仁矜其有志於學痛爲鉏治其蕪穢明示以坦塗使識所之詣幸甚幸甚孔子日朋友切切偲偲斯道也亡廢乆矣靣相䛕背相訾者出門皆是也非吾人孰當惜之幸冀留意温國文正公文集卷第六十一
