  text: 溫國文正公文集卷第三
  hash: sha256:ce7d2f025f1ac6931e3c4f3df372b7741d794a5d1ef952b3a83e7580a47dcd81
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_003-1a}
body:
  text: 古詩奉同景仁次道太常致齋韓廷評維見過閽人不時納韓去乃知為詩謝之送守哲歸廬山清明後二日同鄰幾集賢校理江休復景仁次道中道國子監主簿宋敏求興宗元明秉國太理評事韓維如晦國子監直講裴煜公疏篆石經胡恢飲趙道士東軒以日暮天無雲春風扇微和為韻得和字和端式十題春塘冰煙霽鐘汀洲蘋漁洲火寒溪石幽谷泉秋原菊垂崖鞭古木隂天外峯晉康陳生庸家世以孝悌聞有異木連理生其庭郡欲旌表其門不果王魯玉為之求詩於朝之士大夫以紀之送興宗之丹陽癭盆送張兵部中庸字元常知遂州同舍會飲金明沼上書事和聖俞詠昌言五物括蒼石屏淡樹石屏白鶻圖懷素書縛虎圖新遷書齋頗為清曠偶書呈全董二秀才并示姪良富奉同濟川迎吏未至秋暑方劇呈同舍十二韻和聶之美雞澤官舍詩七首西齋題廳壁縣樓葦栁向城路懷翠亭晚食菊羹和沖卿崇文宿直睹壁上題名見寄并寄不疑沖卿詩序僕與不疑三人同登進士第同自太學官入校集賢書又嘗同直一室今不疑謫南方僕佐東屏沖唧因宿直觀壁上題名為詩代書昔别贈宋復古張景淳苦寒行初見白髮慨然感懷謝胡文學九齡惠水牛圖二卷王書記以近詩三篇相示光各托其意以詩賡之感遇投梅聖俞呈范景仁酬胡侍講先生和錢君倚日本刀歌同聖民過楊之美聽琵琶女奴彈啄木曲觀諸公所贈歌明日投此為謝晚歸書室呈君倚偶成同君倚過聖俞聖俞惠詩復以二章為謝和君倚藤牀十二韻旬慮十七韻呈同舍夜坐二月中旬慮問過景靈宫門始見花卉呈君倚和始平公夢中有懷歸之念作詩始得兩句而窹因足成章和鄰幾六月十一日省宿書事和仲通祕閣校理張洞苦暑思長安幕中望終南秋雪呈鄰幾和仲通追賦陪資政侍郎吳公臨虛亭燕集寄呈陜府擇之學士秋意呈鄰幾吳充次韻和掃棗好草倒又對前韻窺梨卑枝垂偏眠船舷邉後牖有朽柳聶著作三舅謫官長沙作耐暑亭書來索詩走索不疑廳薜荔及竹和公逹過潘樓觀七夕市酬鄰幾問不飲栽菊鄰幾詩曰君實不飲酒庭下多栽菊不知黃花開奈此杯中緑凌晨煙露滋後日風霜促欲表君苦心宜種子猷竹次韻和不疑假書鄰幾知方酣寢為詩通意八月十七日夜省直紀事呈同舍送雷太簡和王介甫明妃曲和不疑送虜使還道中聞鄰幾聖俞長逝作詩哭之虞帝憫獄謡和沖卿三哀詩江鄰幾梅聖俞韓欽聖窮免謡二首闕和介甫烘虱奉同范景仁宋次道太常致齋韓廷評維見過閽人不時納韓去乃知為詩謝之端居太常署寒日淡孤清取酒呼諸友談笑方縱橫韓君士林秀四海依高名家襲鍾鼎貴身無簪組縈逍遙風塵外萬物秋毫輕未嘗妄過人所過以為榮如何枉玉趾及門失相迎主人豈傲客事有迷誤并追延既不及相視徒嗟驚威鳯顧修梧不下還孤征景星欻呈彩旋有流雲生靈物固難覩俗眼真不明投謝有何物珉石從雙璚送守哲歸廬山哲公金陵來神韻自孤秀京華三十春高節愈幽茂烜赫公卿門道俗日奔走自非趣尚合一息不相就慷慨賢豪士波溢千金富蔬飯苟有餘秋毫未嘗受囂呶不可變堅白如瓊琇居然尚愁寂終厭塵土臭忽思香爐雲薈蔚冠孤岫振衣尋昔逰煙霞宛如舊絡木藤蔓長攫石松根瘦瀑泉響夜壑乳管添春竇茅茨蔭方丈宴坐度清晝几席雨竒花階除馴猛獸方知物外樂回視人寰陋御名勿露聲光愚迷將輻湊清明後二日同鄰幾祕閣校理江休復景仁次道中國國子監主簿宋敏求興宗元明秉國大理評事韓維如晦國子監直講裴煜公疏篆石經胡飲趙道士東軒以日暮天無雲春風扇微和為韻得和字寂寥清明後餘春巳無多間軒富佳致不惜載酒過水木晚尤秀風煙晴更和臨樽不盡醉奈此芳菲何和端式十題春塘氷春塘含薄冰淅瀝隱隈曲晴日射寒芒柔風折哀玉草樹曽未知波光巳先緑煙際鐘蒼茫返照收羃歷寒煙起前山黯同色不辨峯巒美獨有逺來鐘悠揚翠微裏汀洲蘋秋江些字淡蕩波急枝難定參差碧葉繁皎潔寒花靜幽人吟不歸獨立汀洲瞑漁洲火漁翁繫葉舟逺映楓林宿手携雙白魚呼兒㸑山竹深夜寂無人明滅寒江曲寒溪石穹石正嶄岩寒流更清急霜飛敗葉擁波濺蒼苔濕溪僧勿劇來沙鶴方孤立幽谷泉深谷窅無底空聞泉水哀時因秋日照微見碧縈回谷裏非人境胡麻何處來秋原菊高原向搖落叢菊始滋榮草際浮金碧照人雙目明何須天生理玉斚泛餘英垂崖鞭山竹引春根垂透蒼崖底綢直老龍鬚御名佶修蛇尾支郎雖畜馬不忍裁為箠古木隂古木夏隂薄蕭蕭蠧葉微豈無緑樹濃愛此風煙姿高僧此休息肩倚瘦笻枝天外峯飛鳥去不息長空黯何極疏峯帶夕暉點綴秋天碧禪觀坐超然相望兩沈寂晉康陳生庸家世以孝悌聞有異木連理生其庭郡欲旌表其門不果王禹玉為之求詩於朝之士大夫以紀之靈珠蟠泥沙積水不能掩賢人畜美德豈必自標檢陳生世同財百口共豐儉逺居嶺海間天質非陶染邦人慕其行鬪辨日衰減祥木并殊柯童童植軒檻或欲揭其門令人識儀範愚公私不然外奬由內歉巳能孝悌著默致神靈感何必賜牛酒然後明褒貶况兹詩詠末瑣瑣事鉛槧才薄不敢辭適能為汚點送興宗之丹陽赤日裂后土萬家如烘爐君行何事役似為貧所驅埃塵稍去眼雲景日蕭踈扁舟乘長風倐忽變三吳六年羇旅倦一旦誰掃除御名勿忘回首浩蕩江山娛癭盆癭盆生以醜自鬻突兀當軒聳羣目海蛙鬪怒腹幹張老蛟蟠蟄鱗鬐秃昔時仙客浮孤槎波䀶漬朽成凹窪蜀都買卜置之去爾來流落嚴遵家誰逢好事得寶蓄裁供盥濯真可辱况為飲具承歡娛未必蟠根勝珠玉不若刳為太古尊滿㪺明水羞百神凷桴葦籥薦忠信坐使風俗還深淳送張兵部中庸字無常知遂州劒嶺橫天古棧微相如重駕傳車歸雙親倚門望巳久千騎踏雪行如飛人門富貴非不有似君榮耀真亦稀聞道西州遺畫像使我涕淚空沾衣先人知溪縣正板籍肉賦役邑人至今誦之畫像猶存同舍會飲金明沼上書事日華駘蕩金明春波光淨緑生魚鱗煙深草青逰人少道路苦無車馬塵石渠諸君職事簡載酒擷花畏花晚浮舟逐勝任所之箕踞狂歌扣舷板眼花耳熱氣愈豪擲杯擊案聲嗷嗷驚沙颯颯繞洲渚魚龍遷去避我曹人生大料無百歲貴賤賢愚同一致在家殽蔌餘幾何一日風光不宜棄和聖俞詠昌言五物括蒼石屏主人小石屏得之括蒼山括蒼道里逺致此良亦難層崖萬仭餘騰出浮雲端吳兒采石時蘿蔓愁攀緣石文狀松雪毫髮皆天然置之坐席旁清風常在顔願君善藏蓄永日供餘間御名勿示要人坐致求者繁將使括蒼民吁嗟山谷間淡樹石屏昔行鞏洛間馬瘦天復隂寒煙淡不收一拂橫長林當時無畫工負此清賞心今朝石上迹歷歷皆可尋輕素巳紛泊老幹仍蕭森坐令髙興還野氣生衣襟丹青不耐久風日易消侵何如造化真更彼歲月深昌言家素盆購此糜百金請鐫好事名千古無銷沈白鶻圖白鶻日邉來一息萬里遙橫飛碧海晴六翮寒蕭蕭輕如朔雪花逈與長風飄傾身疊紺爪吟嘯何嘵哮瞥來疾驚電欻起先扶搖遂令狐與狸不敢矜凶妖罻羅不可取滅影還雲霄世人莫得見粉繪圖輕綃凛然堂牖間霜氣生春朝風雨夜如墨古木無鳴梟懷素書上人工書世所稀於今散落無復遺君從何處獲數幅敗絹蒼蒼不成軸雲流電走何縱橫昏醉視之雙目明烈火燒林虎豹栗疾雷裂地龍蛇驚須臾挂壁未收卷隂風颯颯來吹面秪疑神物在暗中寶祕不令關俗眼嗟豫平生不識書但愛意氣豪有餘欲求數字置座側安得滿斗千金珠縛虎圖孫生非畫師趣尚頗竒偉為人少諧合不肯畜妻子時時入深山信足動百里蕭然坐盤石盡日曾不起精心忽有得縱筆何恢詭萬象皆自然神工相表裏流傳落人間萬金易寸紙君家縛虎圖用意尤精緻雖云鎖紐牢觀者猶披靡昔聞劉綱妻制虎如犬豕繫之牀腳間垂頭受鞭箠孫生儻未見畫此亦何理明知非世人羽化實不死願君它日歸置之成都市必有乘槎人庶幾能辨此新遷書齋頗為清曠偶書呈全董二秀才并示姪良富長夏暑候濁雲火髙巑岏豈徒肌骨煩木卷川流乾新居得南齋楹檻稍虛寬森羅對草樹曉暮清隂寒汛掃布几簟氣體粗可安圖書雖非多亦足備覽觀聖賢述事業細大無不完髙出萬古表逺窮四海端於中苟得趣自可忘寢餐况今有道世穀祿正可干朂哉二三子及時張羽翰力學致顯位拖玉簪華冠毋為玩博奕趣取一笑歡壯年不再來急景如流丸奉同何濟川迎吏未至秋暑方劇呈同舍稚金避老火暑勢尤驕盈朱光爍厚地萬葉焦無聲夫子久倦遊得郡為親榮束裝待騶吏歸期殊未成埃沙塞廣陌蓬藋擁前楹出處兩不愜孤坐心煩縈何時驚飈來掃蕩天地清郊墟草樹疏千騎從雙旌飄颻若神仙皂蓋西南征離羣詎幾時豈不懷友生有意肯相過不妨巾屨并官舍稍虛涼愧無殽酒迎和聶之美雞澤官舍詩七首西齋明府學既優所聞今得施四境巳澄清還以書自怡西齋幾黃卷治原俱在兹題廳壁百里有民社古為子男國苟有愛物心稚老皆蒙德為身不為人鄙哉陶彭澤縣樓孤樓雖不髙足以瞰四逺餉婦陌頭歸田夫桑廕飯敕吏省追胥勿令農事晚葦索索夕風遒瀼瀼朝露裛啅雀裊寒枝宿螢依敗葉眇然秋興長坐與江潮接柳驛道苦車馬田廬悲斧斤誰栽官舍俞老朽完天真所願明府心庇樹如庇人向城路村路煙欲暝行人殊未稀借問往來者營營皆有為乃知市朝客趣務良可悲懷翠亭髙齋對秋山平望殊不逺雖違獨往心蒼蒼長在眼可嗟都邑逰終日紅塵滿晚食菊羮朝來趨府庭飲啄厭腥羶况臨敲撲喧憒憒成中煩歸來褫冠帶杖屨行東園菊畦濯新雨緑秀何其煩平時苦目痾滋味性所便采擷授厨人烹瀹調甘酸毋令薑桂多失彼真味完貯之鄱陽甌薦以白木盤餔啜有餘味芬馥逾秋蘭神明頓颯爽毛髮皆蕭然乃知愜口腹不必矜肥鮮嘗聞南陽山有菊環清泉居人飲其流孫息皆華顚嗟豫素荒浪強為簪縷牽何當葺弊廬脫略區中緣南陽丐嘉種蒔彼數畒田抱甕親灌溉爛漫供晨餐浩然養恬漠庶足延頽年和沖卿崇文宿直睹壁上題名見寄并寄邵不疑沖卿詩序僕與不疑三人同登進士同自太學官入校集賢書又嘗同直一室今不疑謫南方㒒佐東平沖卿因宿直觀壁上題名為詩代書白袍昔紛紛相與會東堂帝梧碧蕭瑟翔集皆鸞凰伊余素空疏濫吹翰墨場不為羣俊遺出處聮簪裳爾來凡六閏轉轂飛炎涼同歌太學下共醉金馬旁修竹壓窗寒夭桃倚戶芳金盤剖盧橘玉壺分蔗漿驚呼局上急嘲笑杯間狂神情一契會形迹兩俱忘歡餘嘆薄宦離合何能常濡毫紀歲時揮霍素壁光去秋隨相車沿牒來東方城中未遍辭不疑逐南荒奔波走郊外取别何蒼黃舉觴未及盡亟歸還束裝行行到官下日積簿領忙文書擁筆端胥史森如墻况當三伏深沾汗尤淋浪細蠅繞眉睫驅赫不可攘涔涔頭目昏始覺冠帶妨誠知才智微吏治非所長懼貽知已羞敢不益自強因思甌閩逺南走侵閩漲炎蒸異中縣從古無雪霜終朝坐茅屋鹽茗征行商歡譁費口舌解囊收毫芒不疑性髙介此困安可當山川幾千里問訊誰能將沖卿居京邑青雲正騰驤寓直紫臺上風露澄東廂清夜不成寐緩步聊倣徨拂此壁上塵逺懷同舍郎英辭欻感發髙義紛激昂泠泠宮殿虛諷詠何琅琅手書成兩通貯之古錦囊一往泉山南一致汶水陽堅重金璧體光寒矛劒鋩乃知賢雋心淺俗未易量何嘗用榮枯遽爾分否臧居然激衰薄更使清風揚昔别贈宋復古張景淳昔别如飛蓬飄蕩隨所適那知十六載巵酒對今夕渺然思舊逰間不容一息百年詎幾何會合難屢得復古素愷悌志行重金錫皎如百鍊精不為燥濕易景淳氣高逸浩蕩誰與敵下筆驚雷霆龍蛇走屋壁居然器業美但有富貴逼他時綰金印羇束愈愁寂須窮今日歡快意浮大白勿辭簪辨傾頽然倒樽席苦寒行窮冬北上太行嶺霰雪糾結風峥嶸熊濳豹伏飛鳥絶一徑僅可通人行僮飢馬羸石磴滑戰栗流汗皆成冰妻愁兒號強相逐萬險歷盡方到并并州從來號慘烈今日乃信非虛名隂煙苦霧朝不散旭日不復能精明跨鞍攬轡趨上府髮拳鬚磔指欲零炭爐炙硯湯涉筆重復畫字終難成誰言醇醪能獨立壷腹迸裂無由傾石脂裝火近不熱蓬勃氣入頭顱腥仰慙鴻鴈得自適隨陽南去何溟溟又慙鳦鳥識時節巖穴足以濳微形我來蓋欲報恩分契闊非盡利與榮古人有為知已死只恐凍骨埋邉庭中朝故人豈念我重裘厚履飄華纓傳聞此北更寒極不知彼民何以生𥘉見白髮慨然感懷萬物壯必老性理之自然我年垂四十安得無華顚所悲道業寡汩沒無它賢深懼歲月頽宿心空棄捐視此足自警拔之乃違天留為鑑中銘晨夕思乾乾謝胡文學九齡惠水牛圖二卷牛生天地間益物用最大其功配坤元彖爻參衆卦血毛類上帝肹蠁景福介宗廟及賓客百禮無不在引耒刺中田粒食蒸民賴服箱走四方竭力任重載昔聞戴叟筆圖寫窮纖芥胡君繼其妙差肩立異代公卿仰名聲一觀不可丐如何散賤者遽有雙圖賚所嗟性顓愚雅不曉佳畫有如歌九韶鐘鼓樂聾聵得之乃虛器無異居大蔡神物恐化去立召風雨怪雙圗雖卷還重貺敢不拜王書記以近詩三篇相示各托其意以詩賡之感遇白鵠出江渚刷羽何鮮新志凌青霞端欲飲天漢津清飈未我與陂澤聊逡巡偶為虞羅獲逺趣無由伸樊籠厭局促野性那能馴庭除數驚顧慘慘常畏人皓素不入俗衆目誰為珍稻粱不充腹日與雞鶩鄰舉頭畏太髙俯啄空愁辛蕭蕭斂六翮憔悴傷精神男兒五十不如意青衫華髮逰埃塵嚮為盬官北如晉今為幕吏西適秦慨然遂欲拋手板拂衣高蹈錦水濵長竿短艇入煙雨放歌酣飲欹烏巾方今聖朝清似水林空谷靜無隱淪吾君夢卜偶未到勿學君投聖俞聖俞精為詩堅重比白玉至寶識之希未必諧衆目應辰仰髙風跂聳自西蜀平生未相識歉歉不自足薄逰困京師旅食止脫粟得官當入秦行李未結束先求聖俞門執贄請所欲九衢季冬月風沙正慘黷羸馬憚逺行毛鬛寒瑟縮旅拒不肯前一步九刺蹙飢童袖擁口手足盡皸瘃論詩久未出竊罵怨滿腹歸來面揚揚氣若飫粱肉纍纍數十字疏淡不滿愊自謂獲至珍呼兒謹藏蓄長安十五驛重復間川陸置詩懷袖間倦悶輒披讀高吟桑野闊目瞑即投宿自可忘羇愁行瞻灞陵曲呈景仁劔山中斷融為川清江雙流鬱廽旋溝塍阡陌粲如繡香粳紫芋皆良田地靈物秀氣淑美由來衮衮生英賢朝家文明所及逺於今臺閣尤蟬聮獵纓鳴佩走聲望出入金馬如雲煙奈何應辰獨壈坎華髮未得離賔筵璵璠懸黎已為寶結緑豈得偏棄捐願君彈冠自重惜邑人行誦紫虛篇酬胡侍講先生瑗字翼之見寄后王命天官考績弊群吏屬曹省閥閲專職米鹽事賤生偶承乏竊祿聊自庇才力困不逮慘慘日憂惴賴依僚友賢剸裂沛餘地自知雖寄名不足繫軒輊先生喜誘掖貽詩極褒賁誰云歲杪寒面熱汗沾漬非不恱子道駑鈍力難致常恐負吹噓終為重言纍和君倚日本刀歌昆吾道逺不復通世傳切玉誰能窮寶刀近出日本國越賈得之滄海東魚皮裝貼香木鞘黃白間雜鍮與銅賈人云真鍮似金真銅似銀百金傳入好事手佩服可以攘祅凶傳聞其國居大島土壤沃饒風俗好其先徐福詐秦民采藥淹留童丱老百工五種與之俱至今器用皆精巧前朝貢獻屢往來士人往往工辭藻徐福行時書未焚逸書百篇今尚存令嚴不許傳中國舉世無人識古文嗟豫乘桴欲往學滄波浩蕩無通津令人感嘆坐流涕鏽澀短刀何足云同聖民過楊之美聽琵琶女奴彈啄木曲觀諸公所贈歌明日投此為謝坐曹據案心目疲出門上馬行何之闕然久不見之美率意共往初無期正逢攬轡欲有適為我却解連環羇間軒適足容數客夏木初繁有佳色呼兒取次具杯盤青眼相逢喜無極檀槽錦帶小青娥妙質何須誇綺羅按絃運撥驚四座當今老手誰能過彈為幽鳥啄寒木園林颯颯風雨和喙長瓜短躍更上丁丁取蠧何其多曲終拂羽忽飛去不覺酒盡朱顔酡巳聞啄木曲又觀啄木歌雄文更復值絶藝有如天際傾長河今朝壯觀誠極樂去此將奈寂寞何歸來解帶豁胸腹坐踞胡牀仰看屋從今三日不洗耳耳內泠泠有殘曲人間何物號富貴紆紫懷金盡虛器知君自處真得策身外百愁都擲置太學餐錢月幾何客來取酒同醒醉晚歸書室呈君倚簿領日沈迷事役等胥靡得歸無所為未免閲書史一種勞精神胸中異憂喜人生無苦樂適意即為美乃知抱關人不必羡青紫偶成於陵薄三公桔槹親灌園伯成輕南面執耒耕丘樊淵明恥為令乞食倚人門賢人樂遂志榮辱安足言鄙哉夸毗子結駟乘朱軒同君倚過聖俞王畿天下樞簿頷日填積自非奉朝請九衢未嘗識今兹到東城胥靡暫逃役近指聖俞居安能不往覿一室靜蕭然昏碑帖古壁叩階讀新詩迷暗得指擲笑言殊未足黯然日將夕呼馬涉歸塗燈火巳歷歷又知幾何時更有重來迹聖俞惠詩復以二章為謝我得聖俞詩於身亦何有名字托文編他年知不朽我得聖俞詩於家果何如留為子孫寶勝有千金珠和君倚藤牀十二韻嗟豫仕京府謀祿非謀身豈徒勞百骸消鑠侵天真所畏曠官誅敢辭從事勤朝訊獄中囚暮省案前文雖有八尺牀初無偃息䀶比歸暫解帶日沒軒窗昏援枕未及就擈面愁飛蚊未能習律令何暇窺皇墳夫君天才秀明穎排糾紛右曹况清簡剸裂奚足云未遇且堅卧逢時將致君行當起經濟膏沐醒吾人旬慮十七韻呈同舍府官無旬休慮問乃逰息詔書禁從詣還舍始朝食緩帶對藜羔下筯免促迫門前吏卒散却掃謝來客北軒有藤床今晨始拂拭蓬髮亂宜梳霜髭間可摘開軒曬藥物發笥出書册菊畦親灌浸茶器自涓滌於時孟秋末天晴色紺碧林葉雖未零風聲巳淅瀝神明還九藏清氣襲百脈征夫解甲胄疲馬脫羈靮蜚鳥開樊籠跳魚出鼎鬲形骸盡我有不復為物役雖非久安逸幸得少頃適訟庭止敲撲咫尺異喧寂明朝不能然顧盻愁月夕夜坐春陽氣未勝重為隂所乘涔涔積雨闋慘慘餘寒增流雲鬱不開烈風尚慿陵夜闌閉戶牖青暈生昏燈僮僕悉巳眠書几久欹憑涉獵閲舊聞暫使心魂澄有如行役歸丘園恍重登又如逺别離邂逅逢友朋嗟嗟宦逰子何異魚入􅊻奪其性所樂強以所不能人生本不勞苦被外物繩坐愁清旦出文墨來相仍吏徒分四集僕㒒如秋蠅煩中劇沸鼎入骨真可憎安得插六翮適意高飛騰二月中旬慮問過景靈宮門始見花卉呈君倚賤生參府僚勉強踰半歲終非性所好出入意如醉訟庭敲撲喧衆草絶生意不知有青春候匆巳改燧周章連日忙爛漫數宵睡軒窗岌飛舉風雨頗恣睢謂言芳菲物狼籍應掃地今晨呼馬出歷獄問囚繫窈窕清宫深倉琅朱門閉廣殿肅層隂虛庭藹佳氣長楊委嫩緑老柏淨新翠薜荔垂冤延竒石立贔屭豁然愁憤開精神四面至事役難少留馬去尚回睇亦足慰無聊年華不都棄和始平公夢中有懷歸之念作詩始得兩句而寤因足成一章元宰撫洪鈞四海可熏灼至人飬天真視此猶嬰縛出入金鼓威寤寐琴樽樂乃知伊吕心未始忘丘壑和鄰幾六月十一日省宿書事長夏金正伏火意尤驕盈夫子寓官舍無術逃煩蒸軒窗豁四開滅去壁上燈紵衣不可親羽扇安能勝濯泉泉巳溫撫簟簟可憎萬葉悄無風但有飛蚊鳴六府燥不濡喉舌煙塵生攝衣起徐步四顧天正晴雲漢淺欲涸箕畢徒縱橫忽思終南巔秀出秦雲青上有長松林蔽日深杳冥下有萬仭壑含蓄太古冰安得躡輕屐杖策緣峥嶸挂冠芙蓉闕結屋高崖稜回視萬鍾祿彯撇如飛蠅和張仲通學士苦暑思長安幕中望終南秋雪呈鄰幾秋雲覆秦川小雨野未濕誰言終南頂巳有霰雪集返景開新晴孱顔照都邑初疑江津闊逺浪橫風急又疑龍蛻骨逶迤委原隰詞客登髙樓四望清興入當時應百篇遺散不復拾今兹宦帝城大暑困鬱悒紅塵滿九衢出入冠帶襲家居賓旅來俯僂煩拜揖回思幕中趣引領安可及江翁養文采正如玄豹蟄君往犯其嚴騰起誰敢縶嗟豫素恇怯旁睨毛髮立強復綴此章庶幾勇可習和仲通追賦陪資政侍郎吳公臨虛亭燕集寄呈陜府祖擇之學士吾家陜之北陜事吾能説孤亭占城隅形勝最殊絶雲消天宇空極目鳥飛滅大河西北來洶湧地脈裂萬里卷流沙長驅走溟碣羣山勢離合披靡隨曲折林薄帶村墟郊原如繡纈祠宫望神禹間田指虞芮高丘想巫咸空巖懷傅説聖賢迹已遠縹渺見風烈吳公昔為守治行瑩冰雪君從豐鎬來華館息塵轍主人喜嘉客置酒升嵽嵲清歡浩無涯燭至樽未撤誰知捧手辭遽有幽明訣至今猶墮淚遺愛滿耆耋擇之新下車條教悉施設依然典刑在先後如符節嗟豫仕京邑苟祿自羇紲丘壟翳荒松三年灑掃缺求歸未能得朝莫腸百結得君臨虛詩髣佛見里闕何時往登臨曠若目去䁾憂來復長吟益使寸心折秋意呈鄰幾吳充新涼入閭巷舊暑何人掃筠籠賣紅蓮莎階墜丹棗蕉衫日以疏紈扇安能好蟬悲西風樹燕亂斜陽草此意屬淵明籬邉幾樽倒次韻和掃棗好草倒槐花滿庭除籍籍不可掃梢踈邵平瓜漸熟王陽棗失時團扇棄新進祫衣好日暮益愁思寒螿起幽草忽聞秋興篇嘆賞幾絶倒又對前韻窺梨卑枝垂端居倦煩暑園圃久不窺雨餘秋氣新紅葉生紫梨形得蕭散不知環堵卑何能效流俗把酒須菊枝登髙已可醉四野青雲垂偏眠船舷邉縱棹下清溪波靜地仍偏日夕水風􅋽蕭灑成安眠兀兀但髙枕悠悠還進船中流忽驚窹漁父歌扣舷山川非嚮時回首雲霞邉後牖有朽栁弱植生川澤託根北堂後昔時青春姿扶踈映軒牖風霜日消落憔悴復何有蠧穿枯節斷雨漬虗心朽幸不夭天年猶得勝凡栁聶著作三舅謫官長沙作耐辱亭書來索詩少連善降志無愠能忍詬兹亭名耐辱締構自吾舅樽前湘水清席下湘山秀於焉忘榮枯終日醉醇酎攻愁若攻敵避喧如避寇困久理須通非徒保無咎走索伎兒欲誇衆喜占衢路交繫組不厭長縛竿不厭髙空中紛往來巧捷如飛猱却行欠膚寸倒絓連秋毫參差有萬一虀粉安可逃錢刀不盈掬身世輕鴻毛徒資旁觀好曹偶相稱褒豈知從事者處之危且勞邵不疑廳薜荔及竹修竹非俗物薜荔亦佳草樹之君子庭人來見逾好侵階鶴脛細緣壁龍鱗老紛披兩疏翠煙色宜秋早主人日封植清風庶長保和公逹過潘樓觀七夕市織女雖七襄不能成報章無巧可乞汝世人空自狂帝城秋色新滿市翠帟張偽物踰百種爛漫侵數坊誰家油壁車金碧照面光土偶長尺餘買之珠一囊安知杼軸勞何物為𧖟桑紛華不足恱浮侈真可傷酬鄰幾問不飲栽菊鄰幾詩曰君實不飲酒庭下多栽菊不知黃花開奈此杯中緑凌晨煙露滋後日風霜促欲表君苦心宜種子猷竹黃菊本天物先隨元化生酒醴乃人功後因儀狄成酒客強親菊菊酒初無情種之荒階側何嘗妨獨醒修竹氣蕭灑自合生君庭次韻和不疑假書鄰幾知方酣寢為詩通意江翁順天和心迹兩夷簡雖如邉韶寢且異宰豫懶平居無時間經史自課限高歌慕翰林鳴琴寫中散翛然物外人強為章綬綰官舍苦秋霖瞬息聊休眼勤勩巳有餘宴安何愧赧借書誰敢驚欹枕尚未暖不疑神驥才垂耳困皂棧碌碌隨吾儕拜揖把手版毋嫌朱墨倦騰舉已為晚御名勿思山林山林付愚孱八月十七日夜省直紀事呈同舍窮秋直省舍大雨吁可畏九河翻層空入夜愈恣睢置床東壁根時有塗墍墜颯颯勢將摧怵惕不成寐中宵抱衾立呼燭久方至徙之近西偏禱帳不能備飛蚊胡不仁忍此加啄噬避煩只深藏悒悒靣蒙被須臾漏轉劇枕褥亦沾漬雖起欲何之室中無燥地展轉遂逹旦耿耿負憂悸因思閭井民糊口仰執技束書巳連旬妻兒日憔悴囊錢與盎米薪米同時匱敗衣不足準搏手坐相視豫今幸巳多敢不自知愧無謀忝肉食念爾但增欷送雷太簡南山有白雲應物任所適欻來非有心倐去還無迹甘澤望沾浹嘉生待蘇息無為遽收卷復入巖間石和王介甫眀妃曲胡雛上馬唱胡歌錦車巳駕白槖駝眀妃揮淚辭漢主漢主傷心知奈何宫門銅環雙獸靣回首何時復來見自嗟不若住巫山布袖蒿簪嫁鄉縣萬里寒沙草木稀居延塞外使人歸舊來相識更無物只有雲邉秋鴈飛愁坐泠泠調四絃曲終掩靣向胡天侍兒不解漢家語指下哀聲猶可傳傳遍胡人到中土萬一他年流樂府妾身生死知不歸妾意終期窹人主目前美醜良易知咫尺掖庭猶可欺君不見白頭蕭太傅被讒仰藥更無疑和不疑送虜使還道中聞鄰幾聖俞長逝作詩哭之昨夕郵吏來叩門致書函呼奴取以入就火開其緘不疑賦長篇發自燕之南痛傷江與梅繼踵良人殱噫嗟知其二尚未知其三請從北轅後覼縷為君談鄰幾雖久病始不妨朝參飲啜䆮衰少厥逆生虗痰逮於易簀辰皮骨餘崆嵌遺書屬清儉終始真無慙聖俞食寒氷外以風邪兼愚醫暴下之結轖候愈添惙惙氣上走不復容針砭自言從良友地下心亦甘欽聖體素強藥石性所諳平居察舉措敢以不夀占一朝暫歸卧簿領不廢簽訃來衆皆愕未信猶窺覘興言念三子舉𬒮涕已霑英賢能幾何逝者迹相銜君疑天上才難得帝人貪我疑人間美多取神所嫌茫茫幽眀際蓍蔡難窮探憂來不可忘終日心厭厭虞帝虞帝老倦勤薦禹為天子豈有復南巡迢迢渡湘水至德逺無象異論紛紛起意疑大聖人姦憸亦如己乃知中下士無由逃謗毀憫獄謡五刑象天有震耀上聖本以防姦邪法官由來少和泰臯陶之靣如削瓜况於秦漢任酷吏死人籍籍如亂麻搖椘之求靡不得小者勍刖大滅家君不見古時牢獄地幾多冤骨埋黃沙和吳沖卿三哀詩江鄰幾梅聖俞韓欽聖天生千萬人中有一俊傑奈何喪三賢前後才暮月鄰幾任天資浮飾恥澡刷朝市等山林衣冠同布褐外無涇渭分內有淄澠别逢時敢危言慷慨誰能奪聖俞詩七千歷歷盡精絶初無追琢勤氣質稟清潔負兹驚世才未嘗自標揭鞠躬隨衆後側足畏蹉跌欽聖渥窪駒初生巳汗血雖有絶塵蹤不失和鸞節冝為清廟器儼雅應鍾律衆論仍共然非從友朋出群材方大來軮軋扶帝室誰云指顧間聮翩化異物弔縗哭未巳病枕氣巳竭同為地下逰擕手不相失紳紱頓蕭條相逢但嗟咄誦君三哀詩終篇涕如雪眉目尚昭晣笑言猶髣佛肅然來悲風四望氣蕭瑟和王介甫烘蝨天生萬物名品夥嗟爾為生至么麼依人自活反食人性喜伏藏便垢涴晨朝生子暮生孫不日蕃滋踰萬箇透疏緣隙巧百端通夕爬搔不能卧我歸彼出疲奔命偹北驚南厭搜邏所擒至少所失多捨置熏燒無術奈加之炭上猶晏然相顧未知亡族禍大者洋洋迷所適奔走未停身巳墮細者懦怯但深濳乾死縫中誰復課黑者抱髮亦憂疑逃入幧頭默相賀腥腥騰起逺襲人袖擁鼻端時一唾初雖快意終自咎致爾殱夷非爾過吾家篋笥本自貧况復為人苦慵惰體生鱗甲未能浴衣不離身成脆破朽繒壞絮為淵藪如麥如麻寖肥大虛腸不免須侵人肯學夷齊甘死餓醯酸蚋聚理固然爾輩披攘我當坐但思努力自潔清群蝨皆當逺逋播溫國文正公文集卷第三
