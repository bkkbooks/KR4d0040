body:
  text: 書啓五答孫察長官書之翰待制之姪也答福昌張尉耒書與王樂道書答新知磁州陳大夫游古書答范景仁論養生及樂書與范景仁書答范景仁書答兩浙提舉趙宣德㞦書答懷州許奉丗秀才書答武功石令飛卿啓與劉道原書答孫察長官書之翰待制之姪也十一月二十七日涑水司馬光再拜復書崇信賢令孫君足下蒙眖書兼示以尊伯父行狀墓志及所著唐史記令光為之碑以紀述遺烈以尊伯父之清節令望加之光自幼稚至于成人得接侍周旋今日獲寓名豐碑之末附以不朽何榮如之雖文字鄙拙亦不敢辭顧有必不敢承命者惟足下察之光嚮日亦不自揆妄為人作碑銘既而自咎曰凡刋瑑金石自非聲名足以服天下文章足以傳後丗雖強顔為之後人必隨而棄之烏能流永久乎彼孝子孝孫欲論撰其祖考之美垂之無窮而愚陋如光者亦敢膺受以為已任是羞汚人之祖考而沒其德善功烈也罪孰大焉遂止不為自是至今六七年所辭拒者且數十家如張龍圗文𥙿張侍郎子思錢舍人君倚樂卿損之宋監子才或師或友或僚宩或故舊不可悉數京洛之間盡知之儻獨為尊伯父為之彼數十家者必曰是人也蓋擇賢不肖而為之也為人子孫者有人薄其祖考宜如何讎疾之哉以光么麼使當此數十家之讎疾將何以堪之所以必不可承命者此也雖然竊有愚意敢試陳之唯足下采擇焉今丗之人既使人為銘納諸壙中又使它人為銘植之隧外壙中者謂之志隧外者謂之碑其志蓋以為陵谷有變而祖考之名猶庶幾其不泯也然彼一人之身爾其辭雖殊其爵里勳德無以異也而必使二人為之何哉愚竊以為感矣今尊伯父既有歐陽公為之墓志如歐陽公可謂聲名足以服天下文章足以傳後丗矣它人誰能加之愚意區區欲願足下止刻歐陽公之銘植於隧外以為碑則尊伯父之名自可光輝於無窮又足以正世俗之惑為後來之法不亦美乎未審足下以為何如光再拜答福昌張尉來書五月五日陜人司馬光謹復書福昌少府祕校足下光行能固不足以髙於庸人而又退處冗散屬者車騎過洛乃蒙不辱而訪臨之其榮巳多今又承賜書兼示以新文七篇豈有人嘗以不肖欺聽聞邪何足下所與之過也始懼中愧終於感藏以自慰知幸知幸光以居丗百事無一長於文尤所不間然竊見屈平始為騷自賈誼東方朔嚴忌王子淵劉子政之徒踵而為之皆蹈襲模倣若重景疊響訖無挺特自立於其外者獨柳子厚恥其然乃變古體造新意依事以叙懷假物以寓興髙揚橫騖不可羈束若咸韶護武之不同音而為閎美條鬯其實鈞也自是寂寥無聞今於足下復見之苟非英才間出能如此乎欽服慕重非言可逮然彼皆失時不得志者之所為今明聖在上求賢如不及足下齒髮方壯才氣茂美官雖未逹髙逺有漸異日方將冠進賢佩水蒼出入紫闥訏謨黃閣致人主於唐虞之隆納蒸民於三代之厚如斯文者以光愚陋竊謂不可遽為也不宣光再拜與王樂道書昨日光退與郭秀才再三評議樂道所苦蓋本非大病但藥物過分劑衣食不適冝致困憊如此耳光雖不曉醫觀樂道羸瘠雖甚然精神聲氣殊未覺衰願樂道姑自保養勿為過慮凡人之所賴以生者天地中和之氣也若不節飲食衣服直以極熱極寒踈利之藥循環攻之使中和之氣何以自存乎况今樂道之疾上熱下寒服凉藥則熱未去而寒益甚服溫藥則寒未减而熱益加然則所服之藥皆有損而無益也光愚欲望樂道盡屏去諸藥必不得巳止服參苓之類扶助胃氣可也只調飲食以待病氣自退飲食不惟禁止生冷亦不可傷飽亦不可傷飢粟米性溫作薄糜以藥強服之且有榖氣以助飬臟腑衣服不可過薄亦不可過厚加之棄置萬事勿以經懷沉聽內視藏心于淵恬淡逍遙歸于自然使神安志適骨肉都融則中和之氣油然自生如此飬之旬月何疾不瘳矣夫欲速則不逹半歲之病豈一朝可愈但當去其害之者勿令過與不及俟氣血徐徐自復則善矣光夙夜為樂道思之無以出此輒敢獻其區區雖其言似迃然收效甚逺在聰明詳擇之答新知滋州陳大夫游古書正月二十二日涑水司馬光再拜復書知府大夫足下光雖未獲展際然與令姪公􅘙相知為日固久近蒙貺書并寵示先相國文集一通三復書文傀汗滿顔伏惟先相國閎才茂勳布在竹帛以其餘力發揮於文光自為兒未齓時固巳誦相國之詩况於今日瞻仰遺文譬如蓬莪生泰山之隅依附而不知其髙鯈鮒歷渤澥之尾游泳而莫測其廣足下乃比之楊雄遇明哲君子過矣此豈後進小生所冝當也前歲公􅘙校正先集欲刻板摹之廣傳於丗光幸以鄰居公􅘙每有一事未明一字未正必垂訪問苟淺學所能及者未嘗敢有隱也所不能及者亦不敢質而闕之請公􅘙訪諸能者比特磨研編削之比耳豈足為有功於先集哉乃蒙足下勤勤相謝又褒借太過雖增君子謙謙之美顧小人不敢受而有殆無地以自處所幸者得閟藏先集以詒子孫俾轉相授以永其傳乃其志也不宣光再拜答景仁論養生及樂書光啓近於夢得處連得所賜兩書聞泛西湖浮水登香菜樓望陘山起居甚適差尉勤想又蒙教以冝觀素問病原有療病導引之方且云鑄周釜漢斛已成欲令光至頴昌就觀之雖古之儒者聞善相告見善相示勤勤懇懇殆不過此其幸與感何可勝言但以家兄約非久入洛須留此待之不可捨去故未敢輕諾徒增耿耿耳景仁所教誠善矣孔子曰盍各言爾志竊不自揆敢盡其所聞可以養生及治樂者薦於左右譬猶嘉榖既殖必使傭役從而耘耨之大厦既御名必使賤工從而礱斫之然後克成其粹美景仁可能不鄙而聽之乎常記昔者與景仁同在貢院充點檢官主文試進士民受天地之中以生論當是時埸中秉筆者且千人皆以為民之生無不禀天地中和之氣也其文辭之美固多矣以愚觀之似皆未得劉康公之指常欲私出鄙意而論之因循汨沒卒不能就於今三十五年矣因景仁教以養生之道敢試言之康公之言曰民受天地之中以生所謂命也是以有動作禮義威儀之則以定命也能者養之以取福不能者敗之以取禍今成子惰棄其命矣蓋所謂生者乃生存之生非始生之生也夫中者天地之所以立也在易為太極在書為皇極在禮為中庸其德大矣至矣就其小小者言之則養生亦其一也何以知之夫人之有疾也必自於過與不及而得之隂陽風雨晦明必有過者焉飢飽寒燠勞逸喜怒必有偏者焉使二者各得其中無疾矣隂陽風雨晦明天之所施也飢飽寒暑勞逸喜怒人之所為也人之所為苟不失其中則天之所施雖過亦弗能傷矣木朽而蝎處焉肉腐而蟲聚焉人之所為不得其中然後病襲焉故曰養備而動時則天不能病也是以聖人制動作禮義威儀之則所以教民不離於中不離於中所以定命也能者則養其中以享福不能者則敗其中以取禍是皆在已非在它也詩云人而無禮胡不遄死記曰人有禮則生無禮則死人無禮則失中失中則棄命矣劉康公所以能知成肅公之將死蓋用此道也彼素問病原之說雖佳恐漫汗支離不若此道之為明且約也昔者聖人造次而動不爽於和縱心所欲不失其中施之於身則有餘矣將以教天下垂後丗則未能也是故調六律五聲八音七始以形容其心制吉凶賔軍嘉禮以軌物其德使當時及後丗之人雖四海之逺千載之久聽其樂則洋洋乎其心和常若聖人之在其上循其禮則肅肅然其體正常若聖人之處其旁是以大夫無故不徹簨簴士無故不徹琴瑟朝夕出入起居未嘗不在禮樂之間以收其放心檢其慢志此禮樂之所以為用也周室既衰禮缺樂弛典章云逸疇人流散律度量衡不存乎丗咸英韶護不傳乎人重以暴秦焚滅六籍樂之要妙存乎聲音其失之甚易求之甚難自漢以來諸儒取諸胸臆以億度古法牽於文義拘於名數校竹管之短長計黍粒之多寡競於無形之域訟於無證之庭迭相否臧紛然無巳雖使后夔復生亦不能决彼周釜出於考工記事非經見是非固未得而知如漢斛者乃劉歆為王莽為之就使其真器尚存亦不足法况景仁復改其制度恐勞役心力費銅炭而巳孔子曰禮云禮云玉帛云乎哉樂云樂云鍾鼓云乎哉今先王之樂餘音遺文既不可得而覩聞矣盍亦返其夲乎樂記曰禮樂不可斯須去身致樂以治心則易直子諒之心油然生矣易直子諒之心生則樂樂則安安則久久則天天則神天則不言而信神則不怒而威致樂以治心者也致禮以治躬則莊謹莊謹則嚴威中心斯須不和不樂則鄙詐之心入之矣外貌斯須不莊不謹而易慢之心入之矣樂也者動於內者也禮也者動於外者也樂極和禮極順內和而外順則民瞻其顔色而弗與爭也望其容貌而民不生易慢焉此樂之夲禮之原也夫樂之用不過於和禮之用不過於順二者非徒冝於治民乃兼所以養生也如光者雖知之常病未能行之今老矣猶庶幾強勉而學焉以養其餘生亦願景仁共勤此道捐其末求其夲捨其流取其原致樂以和其內致禮以順其外內和則疾疹不生外順則災患不至疾疹不生則樂災患不至則安既樂且安志氣平泰精神清明暢乎四支浹乎百體如此則功何以不若伶倫師曠壽何以不若召康衛武醫經病原皆可焚周釜漢斛皆可銷矣景仁以為何如哉抑禮樂乃天地人之大倫自古大賢君子尚不敢輕議而狂簡小子輒妄言及之是冝得誅絶之罪於聖人賴景仁之知我如鮑叔之知管仲也不以為僣不以為狂庶幾有可采擇於其中焉不宣光再拜景仁正議七兄左右與范景仁書光啓范朝散來領二月二十三日及晦日兩書所云遞中書未嘗得蓋二十三日書即是也夫治心以中此舜禹所以相戒也治氣以和此孟子所以養浩然者也孔子曰爵祿可辭也白刃可蹈也中庸不可能也然則中和者聖賢之所難而來示謂光心未嘗不平氣未嘗不和猶不免於病此言過矣以光方於古人乃下之下者也於聖賢之道曽不能望其藩籬然亦知中和之美可以為養生作樂之夲譬如萬物皆知天之為髙日之為明莫不瞻仰而歸向之誰能跂而及之邪嚮所以薦於左右者欲與景仁黽勉共學之耳安能遽入其域邪至於㬌仁夫冬為酒所困發於耳發於牙是亦過中之所為也又云今之尺乃古之尺今之權衡乃古之權衡惟量比所為律十三分二之大此無它出於魏晉以來貪政也光謂尺量權衡自秦漢以來變更多矣今之尺與權衡豈得猶是先王之所用邪彼貪者知大其量以多取人榖豈不知大其尺以多取人帛大其權以多取人金乎且尺量權衡公私所共用也斂之以大量則給之亦以大量貪者何所得乎此則衆共知其不然明矣黃金方寸其重一斤恐亦據今之尺與權衡言之耳唐自安史之亂雅樂工器什不一存逮於黃巢蕩無孑遺有殷盈孫者更按考工記始鑄鎛鍾十二五代用之周丗宗更命王朴考正其音律今以景仁律驗之在未位者巳中黃鍾則是太常鎛鍾下七律也不知何故反以為合又景仁所謂律與釜斛之分數光未甚解豈非語其容受邪景仁亦以千二百黍為籥則二百四十萬黍為一斛以今斛槩之何啻大十三分之二邪此皆愚所不及非面議莫之盡嚮謂景仁必入洛庶得相與極論養生作樂之夲今景仁既不來光又不得往鬱鬱之志殊未央也不宣光再拜答景仁書光再拜自四月來連於夢得處領三書以無的便久未之報惟景仁必能察其非惰慢也來書主釜斛論甚確光寡學於鐘律實所不解不足以辨是非嚮者互相攻難聊資戲笑耳今若喋喋為報乃是求勝而強相加爭言而競後息非素志也且置是論至於中和為養生作樂之本此皆見於經傳非取諸光之胸臆不可忽也詩云呦呦鹿鳴食野之蘋鹿得美草猶呼其類共食之况君子得美道可不告其執友而共學之乎何光區區仰告之勤而景仁却之之堅曽不熟察也來示云致中和天地位焉萬物育焉言帝王中和之化行則隂陽和動植之類蕃非為一身除病也夫和者大則天地中則帝王下則匹夫細則昆蟲草木皆不可須臾離者也豈帝王則可行而一身則不可行邪人苟能無失中和則無病豈待巳病然後除之邪夫養生用中和猶割雞用牛刀所益誠微然生非中和亦不可養也譬如用勺水滌一器景仁見而責之曰夫水之所以浮天載地生育萬物汝何得用之滌器如此則可乎不可乎又云孟軻養浩然之氣言榮辱禍福不能動其心非除病之謂也夫志氣之帥也苟不以中和養其志氣能浩然乎苟氣不浩然則榮辱禍福交攻之終日戚戚隕穫充詘能無病乎孔子曰仁者壽又曰大德必得其壽彼仁與德捨中和能為之乎又云向之病誠猶飲食過中是過飲食之中非中和也光誠愚不知飲食之中非中和更為何物也光所願者欲景仁舉措云為造次顛沛未始不存乎中和豈於飲食獨捨之乎此則尤所不解也夫中和之道崇深閎逺無所不周無所不容人從之者如鳥獸依林去之者如魚蝦出水得失在此於彼奚損益焉而光重復反覆言之猶噓溫以助春吹寒以佐冬徒自困苦夫何為哉正身遇所忠愛不能自默耳夫已自未能力行而遽以強人此孔子所謂道聽而塗說冝人之未見信也然景仁明如離朱中和之益著於南山豈景仁所不能睹哉或者偶未之思耳嚮者所蒙教誨何敢忘之但承其意不承其術謹當熟讀中庸以代素問巢原熟讀樂記以代考工記律曆志庶幾有得於桑榆啓發其端皆自益友之賜也至幸至幸至感至感不宣光再拜景仁七兄左右答兩浙提舉趙宣德㞦書光頓首再拜比見邸報聞先大資少保違去盛丗驚怛惋痛衷懷如割以道逺無便無由發疏致慰昨晚兵人來忽辱示問并鄭君所為行狀欲令光作志文光實何人望先公名德何啻倍蓰什百嚮獲接侍之久蒙知顧之厚今得論撰盛美自託不朽何幸如之顧以光不為人作碑志巳十餘年所辭拒者甚多往歲有孫令以書見屬欲令光撰其伯父之翰碑光時復書叙不可為之故頗詳是後又辭王樂道曽子固等數家皆以此書呈之去年冨公𥘉薨光往弔酹其孤朝奉在草土中號哭自擲必欲使光作墓志又遣人來垂諭至于三四光亦以所以語孫令者告之竟辭不為今若獨為先公為之則是有所輕重厚薄足下試以尊意度之謂光敢為之乎不敢為乎此則不待光辭之畢足下必盡察之矣况先公清節直道著於海內皎如列星決不沉沒它年所以取信於丗者在國史列傳豈待光鄙陋之文然後彰彰乎方今群公文章髙出於衆論議為人所信者何可悉數足下不求於彼顧遣使者自衢至洛走數千里專以相委荷雅意期待如此之重乃敢仰違尊命俾使者虛返其為罪戾擢髮有餘所兾大君子聰明通恕知其非可為而不為也慚懅恐悸言不能盡光頓首答懷州許奉丗秀才書五月四日涑水司馬光拜拜復書許君秀才足下去年十二月懷州人來蒙惠書自尓日欲因王判官寓書報謝俗事汩沒繼以國喪奔走京師往返殊無暇稽慢之罪固無所逃光性愚魯自幼誦諸經讀注疏以求聖人之道直取其合人情物理目前可用者而從之前賢髙竒之論皆如面墻亦不知其有內外中間為古為今也比老止成一朴儒而巳嚮屢聞王君具道盛美云道甚髙學甚精孝悌隆閨門名義著鄉里常延頸企踵睎仰聲采固非一日不意過聽遽詒之話言仍示以所述孝睦事迹夫孝悌者仁義之實敦睦者政化之本光以是窺足下之志固不待承顔接辭而後知之矣欽服欽服夫玉韞窮山十仞之土不能掩其光珠潜深淵岸草為之不枯足下始進德修業但恐大名不免彰徹於丗勿病人之不巳知也光屬受詔守陳不久留於洛王君多㳂牒在外今日暫見之來旦復出輒走此布區區草率不悉仍封舊注古文孝經一冊容易上呈庶逹鄙志光頓首再拜答武功石令飛卿啓光啓縣人來蒙示啓事千餘言大指以為明天子在上冝以時起佐萬一以澤斯民不冝專務自逸何足下期待之過而責望之重也捧讀戰栗流汗及踵光聞君子擬人必於其倫仲尼聖人也自生民以來未之有也而足下語及不肖動輒以仲尼泛之此雖甚愚不辨菽麥之人亦不敢當無乃重增不肖之罪而為足下失言之纍乎不可不可光自惟德行文學言語政事一無所長在稠人間僅及下中但事君不敢欺得官非智力所任者不敢䡖受此固為士者之常守無足言者而丗俗閭閻之人遽相與驚怪從而譽之光聞之每踧踖發慙不自知其何以致之蓋所謂名浮於實者也性戇滯不曉時務比又苦衰疾不堪治民遂自乞冗貟苟竊微祿以庇身養族天子憐其無它惡直不才耳而嘗歷事三朝今雖昏耄無所用不忍棄捐俾之掌留臺道宫月給錢粟而不責以職事如疲牛老馬尚以莝豆飼之不求其任重致逺脫其紖鞅縱之林野使之徜徉自適以盡其天年此乃天子至仁雖天地之覆載滄海之􅉼容未足以諭而草木魚蟲無一毫之益以報盛德乃光有負於朝廷而朝廷實無負於光也光豈敢養髙傲丗釣名邀利邪光胸中何所有而足下欲迫之使立朝廷佐下風邪且明天子在上進賢退不肖褒勤黜惰皆決於掌握為人臣者身非已有如金在鎔泥在鈞惟甄冶之所為用捨進退豈得自專邪竊恐足下誤信丗俗之談而有是言也願勿以騏驥之皮蒙駑駘之背而䇿之使一日千里幸幸甚甚與劉道原書光再拜光少時惟得髙氏小史讀之自宋訖隋正史并南北史或未嘗得見或讀之不熟今因修南北朝通鑑方得細觀乃知李延壽之書亦近丗之佳史也雖於禨祥詼嘲小事無所不載然叙事簡徑比於南北正史無煩冗蕪穢之辭竊謂陳壽之後惟延壽可以亞之也渠亦當時見衆人所作五代史不快意故别自私著此書也但恨延壽不作志使數代制度沿革皆沒不見道原五代長編若不費功計不日即成若與將沈約蕭子顯魏收三志依隋志篇目刪次𥙷葺别為一書與南北史隋志並行則雖正史遺逸不足患矣不知道原肯有意否其符瑞等皆無用可刪後魏釋老志取其要用者附於崔浩傳後官氏志中氏族附於宗室及代初功臣傳後如此則南北史更無遺事矣今國家雖校定摹印正史天下人家共能有幾本久逺必不傳於丗又校得絶不精只如沈約叙傳差却數板亦不寤其它可知也以此欲告道原存録其律歷禮樂職官地里食貨刑法之大要耳不知可否如何如何光再拜溫國文正公文集卷第六十二
