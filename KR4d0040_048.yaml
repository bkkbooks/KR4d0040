body:
  text: 章奏三十三乞申明求諫詔書劄子看閲吕公著所陳劄子乞罷保甲劄子密院劄子劄子批語乞降臣民奏狀劄子審前劄子乞降封事簽貼劄子乞不貸強盜劄子乞不貸故鬪殺劄子乞省覽農民封事劄子乞申明求諌詔書劄子六月十四日上十八日進呈依奏臣伏見皇帝陛下初臨大寶太皇太后陛下同斷萬機側身虛己渴於求諌於五月五日特下詔書大開言路此誠明主之先務太平之夲原也竊見中間有若乃隂有所懷至是亦不得已也一節天下見者未逹聖心咸以為朝廷雖名求諌實惡人論事豫設科禁有上言者皆可以六事罪之是以盤淵聖御名猶豫未敢盡言如此則上恩不得下究下情不得上通上下否閉萬事乖失又前來詔書止榜朝堂所詢不廣見者甚少臣愚欲望聖慈下學士院别草詔書除去中間一節務在勤求讜言使之盡忠竭誠無有所諱仍乞遍頒天下在京於尚書省前及馬行街出榜在外諸州府軍監各於要閙處曉示不以有官無官之人應有知朝政闕失及民間疾苦者並許進實封狀言事在京則於登聞鼓院檢院投下委主判官畫時進入在外則於州府軍監投下委長吏即日附遞聞奏不得取責副夲強有抑退其百姓無家業人慮有姦詐即令夲州責保知在奏取指揮放令逐便候有上件實封奏狀進入至內中伏望陛下以萬機之暇略賜省覽其所論至當者當用其言而顯其身其是非相半者捨短取長其言無可采事不可行者亦當矜容不可加罪如此則下情無不通嘉言罔攸伏聰明周四逺海內如指掌矣或慮奏狀繁多難以親覽即乞降付三省委三省官看詳擇其可取者用黃𥿄簽出再進入或乞留置左右以備規戒或乞降付有司施行取進止看閲吕公著所陳劄子臣今月一日夜蒙降到吕公著劄子一道付臣看閲所陳更張利害有無兼濟之才直書當與未當具悉奏來者臣自公著到京止於都堂衆中一見自後來未嘗私見及有簡帖往來今公著所陳與臣所欲言者正相符合蓋由天下之人皆欲如此臣與公著但具衆心奏聞耳臣聞書曰有廢有興出入自爾師虞庶言同則繹言國家政事欲有所改更必先謀於衆人所言皆同然後行之則無失也傳曰上酌民言則下天上施言為人上者當采酌民言從其所欲則在下之人戴上如天受其恩施也伏望陛下察公著所陳參以臣民所上實封奏狀若與之同者斷志行之勿復有疑臣見太平之功不日可成矣公著一言而天下受其利可謂有兼濟之才所言無有不當惟有保甲一事欲就農隙教習臣愚以為朝廷既知其為害於民毋益於國便當一切廢罷更安用教習容臣續具劄子奏聞次其公著劄子謹同封上取進止乞罷保甲劄子臣竊見先帝以戎狄驕傲侵據漢唐故地有征伐開疆之志故置保甲令開封府界及河北陜西河東三路皆五日一教閲京東西兩路保甲養馬仍各置提舉官權任比監司既而有司各務張皇以希功賞其提舉官專護夲局不顧它司事干保甲州縣皆不得關預營內百姓不得處治其巡檢指使保正保長競為搔擾𧖟食無厭稍不如意擅行捶撻其保丁習於遊惰不復務農或自為劫掠或侵陵鄉里其夲家耕種耘穫率皆妨廢供送不辦率斂無窮資産耗竭毋以為生弱者流移四方壯者亡為盜賊行之數年先帝浸知其弊申勑州縣令保甲應有違犯并巡教官指使違法事件並許州縣覺察施行及陛下踐阼聽政首令京東西兩路保甲養馬並依元降年限收買其剩買過數目並充以次年分之數又令開封府界三路團教巳及半年經朝廷按閲者每月併教兩日未經按閲者併教三日陜西團校未及半年者每月兩次並教三日又令見教人身材弱小或久來疾病及夲家止有一丁病患不堪營作并第五等以下地土不及二十畒者並許州縣保明提舉司審驗放免又令一縣不得放免過二分皆聖澤矜寬民力於保甲勞費雖十減五六然保甲保馬向去點擇買養𥙷填尚猶如舊其巡教指使保正保長名目猶在於所轄保甲恐不免須有陵逼侵漁其四時教閲雖減日數未免妨農臣愚以為此保甲若使之逐捕盜賊則近巳有指揮巡撿縣尉及弓手兵級人數並令依保甲未上畨以前人數復置其保甲更不令管句捕盜若使之攻討四夷則此皆畎畒白徒教閲雖熟未嘗見敵與戎狄戰鬪必望風奔潰登極詔書敕邊吏令不得侵擾外界務要靜守疆場然則此保甲保馬的實有何所用徒令府界及五路農民不堪愁苦幸賴社稷之靈適值纍年豐稔猶流民甚多盜賊充斥若遇如明道年之蝗康定年之旱至和年之水則為國家大患豈可盡言近者群盜王冲乘保馬諸處行劫置保馬夲欲逐盜今更為盜資又獲鹿縣保甲斫射毆傷提句孫文巡檢張宗師以下陵上是乃大亂之源漸不可長凡保甲保馬有害無利天下之人莫不知之臣不知朝廷何憚而久不廢罷伏乞斷自聖志盡罷諸處保甲保正保長使歸農依舊置耆長壯丁巡捕盜賊戶長催督稅賦其所養保馬㨂擇勾收太僕寺量給價錢分配兩騏驥院坊監及諸軍召提舉官還朝其句當公事巡撿指使並送吏部與合入差遣如此則開封府界及五路之民孰不歡呼鼓舞荷戴聖德若以保甲中武藝巳成之人可惜使之歸農即乞令逐縣户馬數每五十户置弓手一人略依緣邊弓箭手法許䕃夲户田二頃與免二稅或稅輕者與免若干石斗稅及户下諸般科役夲户田不足聽䕃親戚田務在優假使人勸募然後召募夲縣鄉村户有勇力武藝者投充弓手計即今保甲中有勇力武藝者必多願應募若一人闕額有二人以上爭投者即委夲縣令佐揀試武藝髙彊者充若見充弓手人有勇力武藝衰退許它人指名比較若勝於舊者即令充替如此則不須教閲武藝自然常得精熟一縣之中其勇壯者既充弓手其羸者雖使之為盜亦無能為患仍委夲州及提點刑獄常切按察令佐有取捨不公者重加刑典若無人投名乞更議優法若尚召募不足即且於鄉村户上依舊雇人候有投名者即令充替若弓手數多即令分畨更互在縣祗應一年一替其餘各分地分巡捕盜賊每獲賊勘得赦後住止及窩藏去處其夲地分嚴行科責及令出賞錢與獲賊之人其賊發地分更不作三限科校只令捕賊給賞如此則賊發之處捕盜之人不復掩蔽住止􅌪藏之處捕盜人不肯庇匿盜賊無所容身自然稀少取進止密院劄子時密院聞余𣣔上前奏先以白劄子進呈畫此指揮欲府界三路保甲自來年正月以後並罷團校止令每農歲間月分依義勇舊法赴縣教閲一月所有差官置場排備軍器及教閲法式畨次按賞費用等仰樞密院取索㑹校措置條畫與三省同共立法取旨施行十月六日進呈奉聖旨依此劄子批語十二日三省樞密院同進呈奉聖旨保甲依今月六日巳得指揮所有保馬别詳議立法進呈乞降臣民奏狀劄子臣伏見陛下詔開言路至今巳涉旬月必有臣僚民庶上言朝政闕失民間疾苦奏狀巳多未見有付外令三省或樞密院啇量施行者如此則徒煩聽覽何所禆益昔漢昭帝時吏民上書言便冝有異輒下杜延年平復奏言先帝𥘉即位詔中外上言得失亦令臣與張方平同詳定選擇可取者與元奏狀同進入內或降付三省樞密院施行臣竊計今來臣民所上文字其間是非臧否雖錯雜嘉謀長䇿不可謂無以睿明所燭諒毫髮無遺豈可一槩棄置全不采用欲乞選其可從者降出施行或以萬幾之繁未暇遍加省覽即乞依臣前奏降付三省委執政官分取看詳擇其可取者用黃紙簽出再進入或留置左右或降付有司施行取進止審前劄子狀臣於今月三日具劄子奏為保甲保馬有害無利乞廢罷召募保甲投充弓手仍乞降付三省樞密院啇議施行至今未見降下竊慮有司遺失不逹聖聽乞令勘㑹依臣前奏早賜降下取進止乞降封事簽帖劄子臣聞舜明四目逹四聰王者視四海之內皆如户庭閭閻之間皆如指掌然後能治其天下恭惟太皇太后陛下深居九重皇帝陛下冨於春秋四海之廣大閭閻之微隱未嘗身親而目覩也非采聽臣民之言雖以天縱睿智之性何由知之陛下近詔天下臣民皆得上封事言朝政闕失民間疾苦仍降出令臣與執政官看詳其第一次降出者三十三卷臣謹與諸執政選擇其中除無取及冗長之辭外其可取者巳用黃𥿄簽出進入訖伏乞陛下取簽出者更賜詳覽或留置左右以備規戒或降付有司啇議施行如此則忠言日進聰明日廣誠生民之厚幸社稷之盛福也嚮者執政請聽臣僚上殿陛下謙退以為國家政事多未習知臣僚欲言事者自有章疏何必上殿今臣民章疏舉集於前若陛下不勤加省覽則朝政闕失民間疾苦何由上聞國家政事無時而習知也其間亦有一事而衆人共言者臣亦重復簽出蓋欲陛下知天下所共患衆情所同欲也夫為政在順民心民之所欲者行之所惡者去之則何患號令不行民心不附國家不安名譽不榮哉惟在陛下斷志而力行之耳取進止乞不貸強盜白劄子刑部奏鈔曹州勘到百姓趙倩吕德吕文於今年三月二十三日同打劫南華縣界頓榮家財物將槍刺頓榮一槍腮上血出打劫得財𬒳弓手捉獲醫人檢得頓榮元𬒳吕文刺傷處有血是尖物傷將劫到贓估定足錢陸貫玖拾玖文夲州只為頓榮𬒳劫刺傷時不曽申官檢定痕驗遂具案申奏大理寺㑹到進奏院今年三月六日赦七日到州准律勑合决杖一頓處死刑部檢到例擬並特貸命决脊杖二十各刺靣配廣南逺惡州軍牢城門下勘會近年以來諸州勘到劫賊但不曽殺人放火者並作情理可愍或刑名疑慮由奏朝廷率從寬貸竊詳逐人既為劫賊情理有何可愍赦後贓滿傷人刑名有何疑慮此皆逐州官吏避見失入罪名專務便文營己無去害疾惡之心况曹州素多賊盜係重法地分如趙倩等所犯皆得免死則是強盜不放火殺人者盡得免死竊恐盜賊轉加恣橫良民無以自存殆非懲惡勸善之道其趙倩等欲乞並令夲州依法處死仍乞立法自今後天下州軍勘到強盜情理無可愍刑名無疑慮輒敢奏聞者並令刑部舉駮重行典憲更不得似日前用例破條乞不貸故鬪殺劄子竊惟王者所以治天下惟在法令凡殺人者死自省刑法以來百丗莫之或改若殺人者不死傷人者不刑雖堯舜不能以致治也近者刑部奏鈔泰寧軍勘到保正家人姜齊見夲都代名大保長張存捽著百姓孫遇其孫遇捽著袁貴髻子張存道此人稱是東嶽急腳子胡亂打人不伏收領齊捽著孫遇遞互打三二十拳解擘放却袁貴齊與張存捽到孫遇齊行拳踢打孫遇身死齊發心共張存捉縛袁貴虛做打殺元相爭人申解赴縣替得償命其袁貴倒縣不肯虛招齊蒙枷項隔勘方具實招通又懷州勘到百姓魏簡與郭興爭賭錢拽倒郭興家棚子郭興父郭升拽著簡使頭撞簡簡為夲人年老便道你共我不是抵對休扯著我待推揢郭升圖放却簡用力去郭升咽喉上揢一揢其人當下倒地身死又耀州勘到百姓張志松為再從弟張小六冤執稱呪罵堂兄弟男女偉志松乘酒嗔恨張小六因此行拳打張小六當時身死上件三人於條例皆合處死夲州並作情理可愍奏裁耀州仍稱張志松夲無殺意刑部一切檢例擬特貸命决脊杖二十刺配斷所牢城竊詳孫遇不合詐稱東嶽急腳子胡亂打人雖是罪人然不至死其姜齊等既解擘放袁貴即合申送赴官依法施行其孫遇别更不曽拒捍及走兼巳就拘執豈可更捽倒毆擊直至於死又更誣執𬒳苦人袁貴作殺人賊欲令替自己償命如此情理有何可愍其魏簡為郭升年老不欲相打却用力去夲人咽喉上一揢致死豈不更甚於毆打又張志松只為張小六冤執呪罵事理至輕遂毆夲人致死並是鬪殺於情理皆無可憫凡人因忿相爭迭相毆擊其意豈在於殺但一人於辜限內死則彼一人須當償命况三人皆即時毆殺當死無疑只是逐州避見失入罪名妄作情理可憫或刑名疑慮奏裁刑部即引舊例一切貸命若因循不改為弊甚大所以然者從來律令勑式有該說不盡之事有司無以處决引例行之今鬪殺當死自有正條而刑部不問可貸與否承例盡免死决配作奏鈔施行是殺人者不死其鬪殺律條更無所用也於殺人者雖荷寬恩其被殺者何所告訴非所以禁制凶暴保安良善也欲乞今後應諸州奏大辟罪人並委大理寺依法定斷如非情理可憫其刑名疑慮即仰刑部退回夲州令依法施行如委見有可憫及疑慮即仰刑部於奏鈔後别用貼黃聲說情理如何可憫刑名如何疑慮今擬如何施行令門下省省審如何擬委得允當則用繳狀進入施行如有不當及用例破條即仰門下省駮奏乞行取勘庶使畫一之法不至墮壞凶暴之人有所畏憚其姜齊等緣係未立法以前今欲先次進入乞省覽農民封事劄子臣伏覩近降農民訴疾苦實封奏狀王嗇等一百五十道除所訴重復外俱巳簽帖進入竊惟四民之中惟農最苦農夫寒耕熱耘霑體塗足戴星而作戴星而息蠶婦育蠶治􅗀績麻紡緯縷縷而積之寸寸而成之其勤極矣而又水旱霜雹蝗􅠀間為之災幸而收成則公私之債交爭互奪榖未離場帛未下機巳非己有矣農夫蠶婦所食者糠籺而不足所衣者綈褐而不完直以丗服田畒不知捨此之外有何可生之路耳故其子弟遊市井者食甘服美目覩盛麗則不復肯歸南畒矣至使丗俗俳諧共以農為嗤鄙誠可哀也又况聚斂之臣於租稅之外巧取百端以邀功賞青苗則強散重斂給陳納新免役則刻剝窮民收飬浮食保甲則勞於非業之作保馬則困於無益之費可不念哉夫農蠶者天下衣食之源人之所仰以生也是以聖王重之臣不敢逺引前古竊聞太宗皇帝嘗遊金明池召田婦數十人於殿上賜席使坐問以民間疾苦田婦愚戇無所隱避賜帛遣之太宗興於側微民間事固無不知所以然者恐冨貴而忘之故也每臨朝無一日不言及稼穡真宗皇帝乳母秦國夫人劉氏夲農家也喜言農家之事真宗皇帝自幼聞之故為開封尹以善政著聞及踐大位咸平景德之治為有宋隆平之極景德農田勑至今稱為精當昔周公相成王作無逸曰先知稼穡之艱難乃逸則知小人之依蓋以一盂之飯一尺之帛莫不出於艱難人主既知之則不肯用之於無益散之於無功驕侈之心無自而生矣伏惟太皇太后陛下深居九重皇帝陛下冨於春秋自非今者濬發德音大開言路使畎畝之民皆得上封事則此曹疾苦何由有萬分之一得逹於天聽哉雖其文辝鄙俚語言叢雜皆身受實患直貢其誠不可忽也伏惟太皇太后陛下與皇帝陛下同賜省覽庶以開廣聰明資益聖性於民間情僞靡不周知異日太平之業由此為始矣取進止溫國文正公文集卷第四十八
