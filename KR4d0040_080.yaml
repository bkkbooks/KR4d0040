  text: 温國文正公文集卷第八十
  hash: sha256:2979ef2cd4bfb03baab8426f5001cacf8b8ccfc595b45966fac5a8b8024d52e8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_080-1a}
body:
  text: 祭文豢龍廟祈雨文祭齊國獻穆大長公主文爲文相作改葬先令公啓殯文令公祖奠文令公到墓文令公掩壙文貟外啓殯文貟外掩壙文頴川郡夫人焚黄祭文啓殯祭文祖奠祭文祭郭侍讀文祭范尚書文祭觀文丁尚書文諸廟祈雪文祭黄石公文爲始平公祭劉大卿文諸廟祈雨祝文謝雨文爲始平公祭晉祠文又祭晉祠文雨止謝晉祠文祭雷道矩文祭江鄰幾文三司祭張元常文初除待制祭先公文祭頴公文告題祭版文祭張尚書文祭獻可文張尚書葬祭文祭錢君倚文祭董少卿文祭張宻學文祭陳彦升文奠李夫人文豢龍廟祈雨文年月日宣徳郎将作監主簿權知韋城縣事司馬光謹率吏民具清酌庶羞之奠致祭于豢龍之神昔者聖王設官分職畜擾神物以爲人用後世䘮業神寔繼之知龍嗜慾服事夏后王嘉神勞胙以此土歳祀超忽廟貌仍存闔縣奔走春秋薦獻却災致福保佑斯人今大夏将盡而歴時不雨穀苗槁死不可復殖倉廩無儲民将何恃民寔神主神寔民休百姓不粒誰供神役邑長有罪神當罰之百姓無辜神當愛之天有甘澤龍寔司之以時宣施神寔使之槁者以榮死者以生旱氣消除化為豐登然後自迩及逺粢盛牲酒以承事神永永無斁伏惟尚饗祭齊國獻穆大長公主文惟靈襲慶皇家作嬪侯族環珮為節動顧禮文蘋藻必親無違婦職承夫以順敎子以慈純素柔嘉自忘王姬之貴肅雍明智居爲里戚之䂓嗚呼遐福未終大期奄及去白日之昭晣歸下泉之窈冥宸極惋傷具僚増欷祇陳薄薦庶逹菲誠尚饗爲文相作改葬先令公啓殯文某舋惡不天福祐單薄旨甘甫備風樹永違日月貿遷松檟未植夙興夜處心不遑寧是用物土之良諏時之吉改卜宅兆恭啓攢塗属以備位宰司任隆責大懇祈退避恩指莫從不得臨穴盡哀慿棺取訣永言罪負隕絶復蘇叩心長號五内糜沸令公祖奠文日月有期靈輀將進逺違故壤遷就佳城惟靈澹泊安間以時就道山川無壅徒御不驚瞻慕攀號心摧氣結令公到墓文闕塞之陽伊川之涘地形爽塏水脉厚深惟靈去故就新永寧兹宅不騫不圯保固億年涕慕之心昊天罔極令公掩壙文嗚呼禄不逮親古人所嘆重茵列鼎誰適為榮掩坎聚墳身不親在羡門旣鍵長夜無晨瞻望題和於兹永絶興言念此心爽飛颺觸地號天肝腸寸絶員外啓殯文惟靈居家孝慈蒞官肅給如何茂徳不享遐年爰擇令辰肇開旅硉遷就祖域永有依歸沃酹不親倍增悲涕尚饗員外掩壙文日吉時良巳就安宅祖禰咸在如從遠歸英靈有知足慰冥漠終古永訣臨風涕洟尚饗頴川郡夫人焚黄祭文夫人胄自徳門無禄蚤世乆同困約不與顯榮朝推恩渥追錫嘉命魚軒翟茀燭耀重泉靈而有知歆戴天寵尚饗啓殯祭文旅宦飄颻家無常所槥櫝未瘞乆寓西郊逢時之良遷就窀穸撤攅云始取道有期撫事悵然益增感悼祖奠祭文日月有期輤輿當發川塗寖邈丘隴長歸伉儷之心曷勝悲惋祭郭侍讀文維皇祐四年五月壬子尚書屯田員外郎孫琳殿中丞司馬光太子左贊善大夫李端卿大理寺丞李杲卿前通州推官楚楷謹致祭于故侍讀學士郭公之靈嗚呼惟公之徳清夷純白恪御名匪懈勤劬朝夕文爲國華行為士則抱讀拱編雍容帝側貧錫之金坐命之席絶衆逾倫恩輝備極如何不淑奄從窀穸某等庸蔽乆泳公恩承乏下僚從公外藩庇其闕遺誨之話言如妷如甥心何敢諼今兹相顧失涕来門瞻望靈帷薦其蘋蘩凄風肅然髣髴如存嗚呼哀哉尚饗祭范尚書文嗚呼天生儁賢爲國之紀服休服采以翼天子冠帶立朝正色嶬嶬讜言直節奮不顧已廼率西師氐羗率俾廼贊公台緝熙物軌乃牧東夏刑清政理徳實光大才則茂美宜其永齡享有多祉如何不㳤遠塗中止輴車過都頓舍甚邇奠不手觴僣痌何巳靈厎其衷歆兹馨旨尚饗祭觀文丁尚書文惟公抱㓗懷真含忠履厚賦才茂美逢世休嘉降集帝庭回翔禁署羽儀髦儁黼黻訓辭登贊機衡進叅台鼎物無疵癘民底乂安陪貳殿惟雍容風議老成之徳中外式瞻宜享永年以毗大業如何不淑隕此哲人日月有時輴車首路興言僚舊哽涕無從薄薦醪羞式歆哀欵尚饗諸廟祈雪文竊以雪霜不時神寔職之編室流亡吏當坐之今者自秋徂冬天澤未浹麰麥旣寡又將槁枯意者吏不職歟民無告歟胡為困苦使至此極也惟神哀民之窮寛吏之辜使雪以時降而麥猶有收敢不牲酒鼔舞以承神休尚饗祭黄石公文維年月日具官某謹遣某官某敢以香酒告于黄石公之神惟公禀天至靈與聖同契幽􅐌人傑光啓漢家廟食于今千有餘祀惟是鄆土居神宇下曠冬無雪宿麥将枯舊廩既罄新埸無望老穉遑遑濵于溝壑上聖夙夜苦心焦思中外百吏憂失圖惟神導天之和寛上之慮救民之死赦吏之罪使膏澤下濟土脉僨興回枯爲榮變凶成䄒敢不祇率所部逺邇之民以承事神永永無斁尚饗爲始平公祭晉祠文盖聞誠通無逺神鍳無幽始謂不然廼今知信屬者時雨稍乏宿麥未滋躬謁嚴祠黙伸心禱囬輈再宿嘉澍響臻豈懇欵之微克留神聴寔元元之幸宜蒙神福然原陸乆燥根荄未浹畎畞喁喁猶有待望謹以清酤嘉薦答揚神惠神當茂布優渥以終大施尚饗又祭晉祠文維年月日具官某謹遣某官某謹以醪果殽羞恭薦于某神惟神宅晉之原食晉之土凡在晉境皆為神宇今嘉澤雖豐霑潤未溥神心無私民靡不撫逺邇之間奚有捨取惟神申大前徳均錫靈雨實我来麰秀我稌黍穗棲于田粒益于庾為酒為醴永承神祜尚饗雨止謝晉祠文乆雨不止涉于積旬汙邪既瀦平原将溢田恐蕪穢民憂墊隘有司恐懼謀請于神聦明感通遽巳晴霽水返其壑雲歸于山蔬糓無虧歳則大熟蒙神之休敢愛牲酒尚饗祭雷道矩文維年月日陜郡司馬光謹致祭于士友雷君道矩之靈嗚呼道矩氣厚以和行直且方謹畏禮律如循鋒鋩臨義敢决若揮干將無位於朝憂國遑遑發憤抗言忠鯁激昂逺慮萬世引之深長家聲不隕燁然有光西戎驕貪蠶食我疆榮馬徑前挺身戰場敷陳直辭逆折豺狼虜氯方沮斂蹝退蔵如何不淑罹此疾殃微息垂盡遺音琅琅上嗟王事未畢而亡下痛老母皤然在堂言終而絶云誰不傷嗚呼道矩短長有時不可推移善惡得失縶人施為顯晦窮通云胡可期立身如此可以無悲獨我友生煩冤涕洟恨此膏澤不霑烝黎奠以薦誠魂乎有知嗚呼哀㢤尚饗祭江鄰幾文嗚呼他人之生憎愛糾紛獨君不然見之者親他人之死議論交集獨君不然聞之者泣問君何修乃能致此率其誠心無有表裏是宜胡耉光大顯融如何不㳤星未五終平日之逰晨往夕來宛其在目誰能不哀念君素懷於物何有叙兹永違無若巵酒尚饗三司祭張元常文惟君寛𥙿敦篤外和内直秀眉廣顙盛氣揚休言徳之報宜蒙遐福骨相之符必享永年如何一朝兩違所望凡在僚友孰不惋傷奠以薦誠庶幾来饗初除待制祭先公文光聞祿不及親古人所嘆重茵列鼎適足增悲光弱冠之初幸塵仕籍罪多福鮮繼招凶釁顧復之恩闕焉靡報痛毒愁辛無忘夙夜誠不自意蒙荷餘休名參侍從身踐世職不肖之質何以似續慙怍戰兢不遑啓處甘旨之養巳無所展忠直之風庶㡬不墜力自黽勉無忝所生備位諫臣不敢自遠瞻望丘壟涕泗交横尚饗祭頴公文維嘉祐八年五月丁巳具官司馬光謹以清酌庶羞之奠躬薦于故相國贈司空侍中頴公之靈公茂德豐功布於四海事存石刻不敢重陳念昔先人乆同僚寀越自童齔得侍坐隅撫首提携愛均子姓甫勝冠弁遽喪所天孤苦憃愚不能自立長號四望誰復顧哀惟公眷憐過扵平日旣釋縗服還齒簪𥚑舉首朝端繫公是賴爰加振㧞俾出泥塗讎校秘文討論前載逮公出牧兩托後車推心不疑言皆見納立效甚寡為負實多過若丘山咸加掩覆善如絲粟必見褒揚屢薦其名徹聞天聴遂塵清貫獲俻邇臣今日所蒙莫非公力言念恩紀終身敢忘承乏諫垣造請有禁不親杖屨殆将再朞豈意一朝忽爲永訣儀刑在目訓誨如聞奄去華堂長歸幽壤心焉隕絶言不成章英靈有知臨此薄酹嗚呼哀哉尚饗告題祭版文治平四年十月辛酉曾孫具官光敢昭告于曽祖考處士府君曽祖妣夫人伏以春秋祭祀思慕無窮宜有屏攝以伸瞻奉謹以良月吉日恭題祭版伏惟尊靈降監昭格是憑是依尚饗祭張尚書文維熙寧四年月日女壻具官司馬光謹以清酌庶羞祭于故禮部尚書張公之靈公之徳業衆所尊仰始終詳實巳載銘文在昔先公與公同省間来問訊延就中堂光時弁髦立侍左右蒙公一見許以成人不卜不謀遂妻以子自惟童騃齒位殊絶未嘗交語從何辱知知己之恩重扵姻戚沒身衘戢不敢弭忘聞訃之初涕零如雨綴扵官守走哭無從逺薦醪羞用辭為侑尚饗祭獻可文嗚呼獻可之亡海内嘆惜况扵親友惋傷可知忠直敢言人人自許誰知獻可始末無虧道不愧心名高於世夀夭不校餘復何言知我之深見扵臨没今兹永訣文不逮情嗚呼哀哉尚饗張尚書葬祭文惟熈寧四年八月日女壻具官司馬光謹以清酌庶羞祭于禮部尚書致仕清河恭安公之靈日月徂遷塟期巳及承乏西臺不敢離局行不執紼奠不操巵引領松楸悲何有極尚饗祭錢君倚文維熈寧六年七月己未陜郡司馬光謹致祭于君倚舍人之靈嗚呼君倚好賢如親就義若渇非聖不學唯善是為納忠於君恥後堯舜竭力於友志追陳雷推誠而行不疑不畏屢蹈顛沛終殄悔心甲科榮名西掖清貫君倚之美兹不足言始謂吉人必膺遐福如何彫謝曽未二毛我與君倚南北殊郷哲愚異品中年相值情厚故交飾貌無華發言必盡風迹猶在精爽何之江山阻長醪羞微薄唯期惋怛可以濳通嗚呼哀哉尚饗祭董少卿文維年月日具位司馬光謹致祭于鄰㡬少卿董兄之靈兄昔爲夏宰西鄙用師賦調雖煩民不告病生齒雖衆訟庭常虚光實夏民目所親睹自兄之去繼者為誰三十年餘屈指無㡬兄入佐㑹計出奉簡書歴守别藩所至稱治民懷其恵吏畏其明為時才臣屢當劇任指顧立辦不廢笑談與人逰居雍容愷悌引年據禮納禄辭榮志力精強謂宜遐夀如何不㳤奄忽長歸光旣舊且親荷知爲厚聞訃哀惋始不自勝薄致醪羞維誠是薦尚饗祭張宻學文惟公㓜而孝長而謹以文學從仕以勤力當官入侍禁嚴譽處臺省出敷惠化周流藩宣将漕則蓄積豐衍監邉則民夷懐服慮無微而不臻職無煩而不舉朝倚噐幹時推精力夀考而終福祿流厚今兹自宋遷周捨卑就燥卜宅得吉祖載及期光等早厠賔客之末晚陪嗣子之逰式陳醪羞用薦衷素尚饗祭陳彦升文年月日涑水司馬光謹以香酒膳羞致祭于彦升之靈嗚呼光平生取友以道相親如彦升之質直光所心服忽焉棄我惋痛誠深尚饗奠李夫人文元豐七年十月乙酉具官司馬光謹遣男某官某致祭奠于故李尚書夫人之靈夫人明智而温柔順而正知古不泥從俗不流禮刑閨門名播郷曲神明保祐夀考令終光忝預族姻素服懿徳敢陳薄酹式薦微誠尚饗温國文正公文集卷第八十終
