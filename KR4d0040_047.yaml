body:
  text: 章奏三十二乞罷免役狀乞罷將官狀乞開言路狀謝御前劄子催赴闕狀請更張新法劄子乞改求諌詔書劄子辭門下侍郎第一劄子第二劄子乞罷免役狀右臣竊以百姓出力以供在上之役蓋自古及今未之或改熙寕中執政者以爲百姓惟苦差役破産不憚增稅乃請據家貲髙下各令出錢雇人充役按因差役破産者惟郷戸衙前有之自餘散從承符弓手手力耆戸長壯丁未聞破産者其郷户衙前所以破産者蓋由山野愚戇之人不能幹事及主管官物或因水火損敗或謂上下侵欺是致欠折備償不足有破産者至於長名衙前乆在公庭句當精熟毎經重難差遣積累分数别得優輕埸務酬奬往往致冨何破産之有夫差役出於民錢亦出於民今使民出錢雇役何異割鼻飼口朝三暮四於民何所利哉又曏者役人皆上等户爲之其下戸單丁女戸及品官僧道夲來無役今更使之一槩輸錢則是賦歛愈重非所以寛之也故自行免役法以來富室差得自寛而貧者窮困日甚殆非所以抑兼并哀惸獨均賦役也又監司守令之不仁者於雇役人之外多取羡餘或一縣至數萬貫以冀恩賞規進取不顧爲民丗丗之患又國家舊制所以必差青苗户充役人者爲其有莊田家属有罪難以逃亡故頗自重惜今雇浮浪之人充役常日恣爲不法一旦事發單身竄匿何處州縣不可投名又農家所有不過榖帛與力自古賦役無出三者自行新法以來青苗免役及賦歛多責見錢錢非私家所鑄要須貿易外求豐嵗榖賤巳自傷農况迫於期限不得半價盡糶所收未能充數家之糇粮不暇更留若值凶年則又無榖可糶人人賣田無往可售遂至殺牛賣肉伐桑鬻薪來年生計不敢復議此農民所以重困也又錢者流通之物故謂之泉布比年以來物價愈賤而閭閻益困所以然者錢皆聚於官中民間乏錢貨重物輕借使有人鬻薪糴米米價雖賤薪價亦賤故也臣愚以爲冝悉罷免役錢其州縣諸色役人並依舊制委夲縣令佐掲簿定差替見雇役人其衙前先召募人投充長名召募不足然後差郷村人戸毎經歴重難差遣依舊以優輕埸務充酬奬所有見在免役錢撥充州縣常平夲錢以戸口爲率常存三年之蓄有餘則歸轉運司凡免役之法縱冨強應役之人征貧弱不役之户利於冨者不利於貧者及今耳目相接猶可復舊若更年深冨者安之民不可復差役矣謹録奏聞伏候勑旨乞罷將官狀右臣伏以州縣者百姓之根夲長吏者州縣之根夲夲危則枝葉何以得安故自古以來凡置州郡必嚴其武備設長吏必盛其侍衛非以重其權驕其人也乃所以安百姓衛朝廷也秦懲周室幹弱枝強之弊旣滅六國以爲天下不復用兵雖分三十六郡置郡守更以御史監之隳名城消兵噐束以苛法舉動施爲皆不得自專是以陳勝吴廣以匹夫奮臂大呼郡縣莫能制多殺長吏以應之雖由其殘虐取亡亦守令無權無兵之所致也晉武帝平吴亦以爲天下旣壹兵無所用悉去州郡兵陶璜山濤皆言州郡武備不可廢帝不聽及永寕以後盗賊群起州郡無備不能擒制天下遂大亂夫兵者所以威不軌而昭文德誰能去兵州縣無虞則國家安矣州縣不守則國家危矣臣竊見國朝以來置緫管鈐轄都監押爲將帥之官凡州縣有兵馬者其長吏未甞不兼同管轄蓋知州即一州之將知縣即一縣之將故也先帝欲征伐四夷患諸州兵官不精勤訓練士卒懈弛於是有建議者請分河北陜西河東京東京西等路諸軍若干人爲一將别置將官使之專切訓練其逐州緫管以下及知州知縣皆不得關預及有差使量留羸弱下軍及剰貟以充夲州官白直及諸般差使其餘禁軍皆制在將官專事教閱臣愚以爲職事修舉在於擇人不在設官茍得其人雖緫管等皆能訓練士卒不得其人雖將官亦何所爲况今之將官即曏之爲緫管等者也豈爲緫管等則不能舉職爲將官乃能舉職乎此徒變易其名無益事實非惟無益兼復有害凡設官分職當上下相維如身之使臂臂之使指紀綱乃立今爲州縣長吏及緫管等而於所部士卒有不相統攝不得差使殆如路人者至於倉庫守宿街市巡邏亦皆乏人雖於條許差將下兵士而州縣不得直差須牒將官將官往往占護不肯差撥萬一有非常之變州縣長吏何以號令其衆制禦姦宄哉又頃歳以來自轉運使知州以下白直及迎送之人日朘月减出入導從大爲蕭條供承荷擔有所不給觀望削弱無以威服吏民臣略舉目覩一事以證其餘西京城郭周數十里卑薄頽缺犬豕可踰又瀍洛二水交貫其中毎夜諸門扄鐍雖嚴而灘流之際人皆可以平行往來其屬水南北巡檢下所管兵士除出軍外餘數不多通判以下諸官白直往來防送倉庫守宿街市巡邏盡出其間嚮者先帝違豫勑西京留守親詣嵩山起建道場其將下禁軍充白直者於條皆不得出城經宿所敢留者剰貟七八人而已西京天子别都也其守禦不固如此留守前宰相重官也其侍衛單寡如此况僻小州縣其守禦之備侍衛之衆可知矣萬一有凶狡之賊驅烏合之衆突入城邑或刼質戕賊長吏以焚燒廬舎殺掠吏民將何以制之哉此特天下太平之乆習俗淳厚群心安固賊不測虚實膽智怯弱故未敢爲之耳豈可忽略謂之必無而不爲之備哉今獨㳂邊州軍城隍完固士卒衆多可以守禦自餘腹内州縣旣無深溝髙城又乏士卒群盗猝至何以責其竭節守義不棄城竄匿或以酒食迎賊以甲兵獻賊歛民財以賂賊者乎群盗尚尔况戎狄傾國大舉長驅而來者哉易曰君子安不忘危存不忘亡治不忘亂兵法曰不恃敵之不我犯恃我之不可犯國家豈可恃即日平寕晏然髙枕不以爲慮謂其必不敢來乎臣愚以爲河北陜西河東京東京西等路腹内州縣冝以漸候豐年農安之際委提點刑獄與夲處長吏相度各修築所治之城州城稍髙縣城次之不必廣大所以然者髙則難踰小則易守故也其縁邊屯駐兵士遇春夏無事之際委經略安撫使與轉運使公共商量减放歸住營州軍或於内地就粮勿聽怯懦將帥多有虚占以自守衛其腹内州軍量其大小緊慢大藩常留千餘人小州亦留數百人不得差發往别州軍見兵不足即行招添悉罷將官其逐州縣禁軍並委長吏與緫管等官同共提舉教閱及諸多差使其有不能勤飭致士卒懈弛者委提點刑獄常切按察聞奏嚴行責降仍令逐縣各選有勇力武藝之人充弓手以守衛城邑討捕盗賊其州縣吏所給白直迎送之人皆如嘉祐編勑以前之數如此力可以守然後遇冦盗之至責其弃城等罪而誅之彼亦甘心矣謹録奏聞伏候勑旨乞開言路狀右臣昨在京師伏蒙太皇太后不以臣愚踈無取遣使訪以得失豈惟微臣有千載一遇之幸中外聞之踊躍相慶以爲言路將開下情得以上通太平之期指日可待也當是時臣未暇備論天下之事先陳所急於三月三十日上言以近歳風俗頽弊士大夫以偷合苟容爲智以危言正論爲狂致閭閻愁苦而上不得知明主憂勤而下無所訴公私兩困盗賊巳繁冝下詔書不以有官無官之人有知朝政闕失及民間疾苦者並許進實封狀皷院檢院州軍長吏不得抑退其義精當者行其言而顯其人狂愚鄙陋者報聞罷去亦不加罪又於四月二十一日復上言皇帝陛下初即政於用人賞罰尤不可不當夫諫爭之臣人主之耳目也不可一日無之說命曰若跣弗視地厥足用傷設有人閉目而塞耳跣足而疾趍前遇險阻能無傷乎賈山有言人主之威非特雷霆也勢重非特萬鈞也開道而求諌和顔色而受之用其言而顯其身士猶恐懼而不敢自盡况震之以威壓之以重乎頃者王安石秉政欲蔽先帝聦明專威福行私意由是深疾諌者過於仇讎嚴禁誹謗甚於盗賊是以天下之人以言爲諱百姓愁苦無聊靡所控告致怨謗之語上及先帝臣常痛心泣血思救其失是故首乞下詔開言路以通下情臣謂群臣苟有肯進言者陛下必加褒擢以勸來者此乃古人市駿骨揖怒蛙之意也召誥曰王乃初服烏呼若生子罔不在厥初生自貽哲命今皇帝陛下新即位太皇太后陛下初垂簾天下之人莫不屬目傾耳臣自到西京以來朝夕伏聽朝廷惟新之政以爲必務明四目逹四聦以發天下積年憤鬱之志今開言路之詔旣不聞頒於四方而太府少卿宋彭年言在京不可不並置三衙管軍臣僚水部貟外郎王諤乞令依保馬元立條限均定逐年合買之數又乞令太學増置春秋博士使諸生肄業朝廷以非其夲職而言各罰銅三十斤臣忽聞之倀然失圖憤邑無巳臣非私於二人直爲朝廷惜治體耳夫阿意箝口容身竊禄此小臣之利也威福在巳人莫敢言此大臣之利也然民怨於下而不聞國家阽危而不知於陛下有何利哉彼宋彭年王諤臣素不識不知其人爲賢爲不肖但惜陛下臨政之初而二臣首以言事獲罪臣恐中外聞之忠臣解體直士挫氣欲仕者歛冠藏之欲諌者咋舌相戒則上之聦明猶有所不昭下之情僞猶有所不逹太平之功尚未可期也宋彭年所言雖不識事體但當寢而不行亦不冝加罪至如孔子作春秋爲萬丗法王安石秉政輙黜之使不得與諸經並列於學官學者毋得習以爲業王諤所言未至不當乃以越職爲罪古者置諌皷設謗木詢于芻蕘未聞有位於朝而以言事爲越職者也若當職之人旣不肯言不當職之人又不得言則以四海之廣兆民之衆其政治利病天子深居九重何由得聞之哉昨日進奏院逓到告身差臣知陳州然則臣自今於一州之外言及它事亦爲越職何敢言矣今二臣之罰旣不可追伏望陛下如臣前奏下詔不以有官無官當職不當職之人皆得進言擇其可取者微加旌賞使天下之人知朝廷樂聞善言不惡論事毋可取者寢而勿問庶幾願納忠之人猶肯源源而來也臣禀賦愚戇文學政事皆岀人下惟不識忌諱不阿權貴遇事妄言無所顧避以此荷知於累朝見稱於衆人若亦不得言則毋所復用於聖丗矣上孤太皇太后陛下下問之意下負微臣平生願忠之心内自痛悼死不瞑目臣乆忝便安今朝廷授以名藩義不敢辤見牒夲州索逺接公人起發赴任次到官之日但勉竭疲駑恪勒夲職苟力所不逮伏須罪戾而已謹録奏聞伏候勑旨謝御前劄子催赴闕狀右臣今月十五日平明凖入内内侍省逓到太皇太后御前劄子一道令臣早至闕庭者臣狂瞽妄言冝從誅譴曲荷開納仍叨奬飾并以臣羸老抱疾過形矜恤螻蟻命微何階報謝臣專候陳州逺接兵士到即起發赴闕次臣無任瞻天望聖激切屏營之至謹録奏聞謹奏請更張新法劄子臣聞詩云毋念爾祖聿脩厥德故夏遵禹訓啇奉湯典周守文武之法漢循髙祖之律唐行太宗之制子孫享有天禄咸數百年國家受天明命太祖太宗撥亂返正混一區夏規模宏逺子孫承之百有餘年四海治安風塵無警自生民以來罕有其比其法可謂善矣先帝以睿智之性切於求治而王安石不逹政體專用私見變亂舊章誤先帝任使遂致民多失業閭里怨嗟陛下深知其弊即政之初變其一二歡呼之聲巳洋溢於四表則人情所苦所願灼然可知陛下何憚而不并其餘悉更張哉譬如有人誤飲毒藥致成大疾苟知其毒斯勿飲而已矣豈可云姑少少減之俟積以歲月然後盡捨之哉臣曏曽上言教閱保甲公私勞費而無所用之歛免役錢寛冨而困貧以養浮浪之人使農民失業窮愁無告將官専制軍政州縣無權無以備倉猝萬一饑饉盗賊群起國家可憂此皆所害者大所及者衆先冝變更借令皇帝陛下獨覽㩲綱猶當早發號令以解生民之急救國家收萬國之歡心復祖宗之令典况太皇太后陛下同断國事捨非而取是去害而就利於體甚順何爲而不可取進止乞改求諌詔書劄子臣先於三月三十日上言乞下詔書廣開言路不以有官無官之人並許進實封狀仍頒下諸路州軍於要閙處出牓示鼔院檢院州軍長吏不得抑退臣昨奉聖旨令入見於今月二十三日到京蒙降中使以五月五日詔書賜臣看閱臣狂瞽妄言曲荷采納豈獨微臣之幸抑亦天下之幸此乃聖主之先務太平之夲原也然臣伏讀詔書其間有愚心未安者不敢不冒萬死極竭以聞竊見詔書始末之言固盡善矣中間有云若迺隂有所懷犯非其分或扇揺機事之重或迎合巳行之令上則觀望朝廷之意以徼倖希進下則衒惑流俗之情以干取虚譽審出於此苟不懲艾必能亂俗害治然則黜罰之行是亦不得巳也臣聞明主椎心以待其下而無所疑忌忠臣竭誠以事其上而無所畏避故情無不通言無不盡今詔書求諫而逆以六事防之臣以爲人臣惟不上言上言則皆可以六事罪之矣其所言或於群臣有所褒貶則可以謂之隂有所懷夲職之外微有所渉則可以謂之犯非其分陳國家安危大計則可以謂之扇摇機事之重或與朝旨暗合則可以謂之迎合巳行之令言新法之不便當改則可以謂之觀望朝廷之意言民間愁苦可閔則可以謂之衒惑流俗之情然則天下之事無復可言者矣是詔書始於求諫而終於拒諫也臣恐天下之士益箝口結舌非國家之福也又止令御史臺出榜朝堂自非趍朝之人莫之得見所詢者狹伏望聖明於詔書中刪去中間一節如臣三月三十日所奏頒布天下使天下之人曉然知陛下務在求諫毋拒諌之心各盡所懷不憂黜罰如此則中外之事逺近之情如指諸掌矣取進止辭門下侍郎第一劄子臣於今月二十七日夜准閤門告報已降告除臣守門下侍郎者臣先於熙寜三年蒙先帝除臣樞宻副使臣以才力短拙固辭得免自是至今十有六年臣齒髪愈耗忽被恩詔力少任重非所克堪豈敢愛身實恐累國伏望聖慈特寢新命聽臣赴陳州夲任所有告身臣不敢祗受取進止第二劄子又未上間中使梁惟簡賜手詔令受傳宣云再降詔開言路俟卿供職施行遂止不上臣於今月二十八日伏蒙聖恩差御藥吴靖方宣召臣令受新除守門下侍郎告身聖恩重複惶愧愈深臣性質愚魯學術淺短徒以素仗忠信竊慕公直偶爲時俗被以虚名誤蒙累朝甄奬承乏侍臣熈寜初王安石說導先帝置三司條例司始議新法臣以爲財聚則民散下怨則上危力曽開陳稱其不可言語拙訥不能感寤㝷蒙聖恩除樞宻副使臣貪愛冨貴無異於人顧以君無虚授臣無虚受先帝用臣必以爲有益國家苟言無足采臣何敢叨居其位是以累上章奏終辭不拜旣而請補外郡又乞散官兩任留臺四任崇福臣區區之心惟望先帝察其何故辭貴就賤一賜召對訪以新法於民間果爲利害臣得輸肝瀝瞻極竭以聞退就鼎鑊死且不朽飲食寤寐不忘此志幽明難欺天實知之不圗先帝奄弃天下臣隕心泣血謂積年所懷生死莫伸及來奔國喪伏蒙太皇太后特降中使宣諭令無惜奏章臣不意愚誠復有所攄發千載一遇不勝踊躍遂首以開言路爲請及其它新法之不便者略舉數條今蒙恩差知陳州又詔令過闕入覲到城之日蒙降中使以開言路詔書賜示臣芻蕘之言遽荷采納且喜且懼無地自容然詳讀詔書中間六事有所未安似名爲求諫其實拒諫恐士民見者未逹聖意莫敢進言方欲上殿論列不意忽奉恩命俾貳左省臣以非才未敢祗受及以言路不通新法爲患皆當今切務遂於今早入一劄子辭免恩命并所准備上殿劄子二道同於通進司投下未審聖意以臣前後所言果爲如何若稍有可采乞特出神斷力賜施行則臣可以䇿勵疲駑少佐萬一皆無可采則是臣狂愚無識不知爲政豈可以汚髙位尸重任使朝廷獲曠官之譏㣲臣受竊位之責它日有誤國事罪不容誅伏望聖慈特寢新命使得自安其分取進止賜卿手詔深體予懷更不多免嗣君年德未髙吾當同處萬務所頼方正之士賛佐邦國想冝知悉再宣諭前日所奏乞引對上殿訖赴任其日巳降指揮除卿門下侍郎切要與卿啇量軍國政事早來所奏備悉卿意再降詔開言路俟卿供職施行温國文正公文集卷第四十七
