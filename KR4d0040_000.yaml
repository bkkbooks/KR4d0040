body:
  text: 古賦進交趾獻竒獸賦表交趾獻竒獸賦稷下賦靈物賦第二卷古詩春獵八月十五日夜寄友人戲下歌烏栖曲二首海仙歌宫漏謌華州祗役往馮翊留别楚正叔建中孟甞君歌緱山引洛陽少年行將軍行何秀才漢倫郊園五首夏日過陳秀才園林陪同年吴冲卿登宿州北樓望梁楚之郊訪古作是詩充燕歌臺楚宫行塞上六言柳枝詞十三首奉和經略龐龍圖延州南城八詠迎薫亭供兵磑柳湖飛蓋園翠漪亭延利渠縁雲軒禊堂天馬歌河上督役懷噐之寄呈公明叔度時噐之鞫獄滄州華星篇時視役河上寄郡中諸同舎宿石堰夜聞牧馬者歌楊白華都下秋懷呈聶之美陪張龍圖南湖暑飲六言二首道傍田家送李汝臣同年謫官導江主簿春日書寄東郡諸同舎和邵不疑校理蒲州十詩必飲亭亭有流盃渠涌泉石樞宻學士蔣公知府事得片石大如席上有數十竅莫知所施公問石工對曰此盖涌泉石也乃於飲亭下鑿地為塪置石其上夏日從旁激水灌之躍髙數尺以清暑氣翠樓碧樓靜齋槐軒凉逸一字芙蕖軒惜花亭竹軒秋日寄山中友人和之美舟行雜詩八首舟中夜坐舩行遇風野花水鴨魚鷹􅊻魚者都門路吴冲卿直舎閻士安畫墨竹歌和之美河洲四詩又和夜雨宿村舎送伊闕王大夫歌送韓太祝維歸許昌賦得交字和興宗夜直聽雨和之美諷古和之美二貧詩送薯蕷苗與興宗荅昌言求薯蕷苗送冷金牋與興宗謝興宗惠草蟲扇和昌言官舎十題石榴花薏苡石蘭萱草蜀葵畦𬞞水紅甘菊蘭病竹送文慧師歸眉山應符風林石歌興宗南園草盛不翦僕過而愛之爲詩贈主人古詩贈興宗出都日塗中成以下請告歸陜及之汾隂省兄時所爲重經車輞谷送巢縣崔尉酬次道初登朝呈同舎第三卷古詩奉同景仁次道太常致齋韓廷評維見過閽人不時納韓去乃知爲詩謝之送守哲歸廬山清明後二日同鄰幾集賢校理江休復景仁次道中道國子監主簿宋敏求興宗元明秉國大理評事韓維如晦國子監直講裴公踈篆石經胡風飲趙道士東軒以日暮天無雲春風扇徴和爲韻得和字和端式十題春塘冰煙際鍾汀洲蘋漁洲火寒谿石幽谷泉秋原菊垂崖鞭古木隂天外峯晉康陳生庸家丗以孝悌聞有異木連理生其庭郡欲旌表其門不果王魯王爲之求詩於朝之士大夫以紀之送興宗之丹陽癭盆送張兵部中庸字元常知遂州同舎㑹飲金明沼上書事和聖俞詠昌言五物括蒼石屏淡樹石屏白鶻圖懷素書縛虎圖新遷書齋頗爲清曠偶書呈全董二秀才并示姪良冨奉同濟川迎吏未至秋暑方劇呈同舎十二韻和聶之美雞澤官舎詩七首西齋題㕔壁縣樓葦柳向城路懷翠亭晚食菊羮和冲卿崇文宿直睹壁上題名見寄并寄不疑冲卿詩序僕與不疑三人同登進士第同自太學宮入校集賢書又甞同直一室今不疑謫南方僕佐東平冲卿因宿直觀壁上題名爲詩代書昔別贈宋復古張景淳苦寒行初見白髮慨然感懷謝胡文學九齡惠水牛圖二卷王書記以近詩三篇相示光各摭其意以詩賡之感遇投梅聖俞呈范景仁酬胡侍講先生瑗字翼之見寄君倚日本刀歌同聖民過楊之美聽琵琶女奴弹啄木曲觀諸公所贈歌明日投此爲謝晚歸書室呈君倚偶成同君倚過聖俞聖俞惠詩復以二章爲謝和君倚藤牀十二韻旬慮十七韻呈同舎夜坐二月中旬慮問過景靈宫門始見花卉呈君倚和始平公夢中有懷歸之念作詩始得兩句而寤因足成章和鄰幾六月十一日省宿書事和仲通祕閣杖理張侗苦暑思長安幕中望終南秋雪呈鄰幾和仲通追賦陪資玫侍郎吴公臨虚亭燕集寄呈陜府擇之學士秋意呈鄰幾吴充次韻和掃棗好草倒又對前韻卑披藝偏眠舩舷邊後牖有朽柳聶著作三舅謫官長沙作耐辱亭書來索詩走索不疑㕔薜茘及竹和公逹過潘樓觀七夕市酬鄰幾問不飲栽菊鄰幾詩曰君實不飲酒庭下多栽菊不知黃花開奈此盃中緑凌晨煙露滋後日風霜促欲表君苦心冝種子猷竹次韻和不疑假書鄰幾知方酣寢爲詩通意八月十七日夜省直紀事呈同舎送雷太簡和王介甫明妃曲和不疑送虜使還道中聞鄰幾聖俞長逝作詩哭之虞帝憫獄謡和冲卿三哀詩江鄰幾梅聖俞韓欽聖窮兎謡二首和介甫烘虱第四卷古詩和勝之雪霽借馬入局偶書齊山詩呈王學士晳字㣲之吹簫和始平公見寄八韻又和并寄楊樂道十二韻朝雞贈樂道謝始平公以近詩一卷賜示早春戯作詩呈景仁進詩表瞻彼南山詩夏夜和景仁西圻野老詩種竹介甫作巫山髙命光屬和勉率成篇眞不知量昔余甞宰韋城今重過之二十五年矣慨然有懷秋懷呈景仁又和秋懷贈道士陳景元酒景仁召飲東園呈升元次道子容君錫花庵詩寄邵堯夫時在西京留臺廨舎東新開小園無亭榭乃治木插竹多種酴醿寳相及牽牛扁豆諸蔓延之物使蒙羃其上如棟宇之狀以爲逰涉休息之所臣日花庵康定中余過洛橋南得詩兩句於今三十二年矣再過其處足成一章寳鑑貽開叔謝王道濟惠古詩古石噐壽安雜詩十首噴玉泉神林谷二首遊神林谷寄邵堯夫靈山寺流泉且遊永濟渡靈山寺藏珠石疊石溪東山下有墜石衘圎徑二尺餘其崖上脫處猶存君貺垂示嵩山祈雪詩十章合爲一篇以酬之酬仲庶終南山詩酬永樂劉祕校庚四洞詩枤柏寄傳欽之獨樂園七題讀書堂釣魚庵采藥圃見山臺弄水軒種竹齋澆花亭第五卷古詩和利州鮮于轉運侁字子駿公居八詠桐軒竹軒柏軒巽堂山齋間燕亭㑹景亭寳峯亭題太原通判楊郎中希元新買水北園首夏二章呈諸鄰酬安之謝藥㘽二章雨中過王安之所居不謁以詩寄之送藥㘽與安之張明叔兄弟雨中見過弄水軒投壷賭酒薄暮而散詰朝以詩謝之小雨園中書事二絶送劉仲通知涇州和復古大雨南園雜詩六首見山臺晝卧偶成修酴􅨍架螢明叔家瑞蓮蓮房不寐苦雨八月十五日夜宿南園懷君貺八月十六日過天街懷景仁宿南園九月十一日夜雨宿南園韓秉國寄酒兼見招以詩謝之子厚先生哀辭張載古墳酬趙少卿丙字南正藥園見贈登封龐國愽元常字懋德年三十八自云欲弃官隱嵩山作吏隱庵於縣寺俾光賦詩勉率塞命暮春同劉伯壽史誠之飲宋叔逹園用前韻再呈示道人謝君貺中秋見招不及赴久雨効樂天體聞景仁遷居許昌爲詩寄之送張伯常同年移居郢州南園飲罷留宿詰朝呈鮮于子駿范堯夫彞叟巳弟自用前韻不寐招子駿堯夫和家兄喜晴用安之韻病中子駿見招不往兼呈正叔堯夫時正叔約次日爲㑹和子駿秋意龍門坐中呈子駿堯夫六言園櫻傷老也和景仁緩安則後見寄求决樂議雖用其韻而不依次蓋景仁才力髙逸歩驟絶群非駑拙所能追故也和秉國招景仁不至云方作書與光論樂同子駿題和樂亭第六卷律詩一夏日西齋書事過故洛陽城二首華清宫初春登興國寺塔虎牢關和李殿丞倉中對菊三首送何萬下第歸蜀執酒河橋春别荅陳進士謂之憶江東舊遊見贈又贈謂之重九日憶菊客思前年春與楚正叔同遊陟屺寺今兹巳復周歳窅然思之曉霽觀江上人壁許道寧畫寒林自都往餘杭懷聶之美夢與之美爲寒食之遊梧桐秋日登觀信亭湖上村家别聶之美松江潮水二首雙竹并序旅宿睢陽南湖南湖二首西谿公讌二首西湖金山寺出塞古松聞龔伯建下第故絳城題陳秀才鳯園林九日登麻藺坂逰延安宿馬太愽東舘字承之塞上四首送何濟川爲龐公使慶陽席上探得冬字渉延安道中作鄜州懷聶之羙和張推官同年師奭春隂無緒偶成歸田詩五首并序春曉詠史三首秋夜望月漢宫詞讀漢武帝紀鷺鷥待詔二首觀僧室畫山水詠寒士贈外兄吴之才挺九日懷聶之美時余在河南聶在陳州飲吴之才家晚秋洛中思歸東園普明寺荷塘上置酒送孟仲習冝君令翶野廟吕禄廟雪霽登普賢閣上郡南三十里有相思亭在太山之麓二水所交平皇之上往來者徒習其名莫詳其義慶暦甲申歳余適延安過於其下于時夏虜梗邊征戍未息竊感東山采薇之義叙其情而愍其勞因作五詩庶幾不違周公之指且以釋亭之名爾梅花三首友人楚孟德過余縱言及神仙余謂之無孟德謂之有伊人也非誕妄者蓋有以知之矣然余俗士終疑之故作遊仙曲五章以佐戯笑云雲際亭和孫器之清風樓龍女祠後塘自生荷花数枝與史誠之更相酬和贈楚法曹叔度楷先春亭寄揚州侯都監仲倫沉隂欲雪與同列㑹飲南齋感懷之羙舉進士寓京師此詩寄之風雪數日不見叔度晚約公明共詣之贈吴之才寒食許昌逰中寄幕府諸君和叔度獨登天臺水亭五哀詩并序屈平李牧晁大夫馬伏波斛律丞相留别東郡諸僚友遣興閽史追和張學士從沂公遊廣固城去歳與東郡幕府諸君同遊河亭望太行雪飲酒賦詩今冬罷歸京邑悵然有懷哭馬承之山家風送王殿丞景陽知眉山縣先公与秘閣府君相继爲利州路轉運使予与眉山同年登第送朱校理宷字廉叔知濰州貢院中戯從元禮求酒太常愽士畢田黄甘寒食南官夜飲送孟著作翶字仲習知濟隂同次道陪讌瓊林校勘宋敏求送馮狀元京歸鄂州送吴耿先生先生通六經大義乆客關中今還建陽北山送髙陟歸金陵三舉不登科以好學孝弟聞於卿里子髙有徐浩詩碑昌言借摹其文甫及数本石有微釁懼而歸之子髙荅簡有碎珊瑚之戯昌言以詩贈子髙同舎皆和司諌錢彦逺送僧聦歸蜀送史館任祠部顓河東轉運使送沖卿通判河中府校理吴充故翰林彭學士挽歌三首乗景福東廂詩夜意即日依韻柏寒御溝秋賜酒霜菊同景仁寄修書諸同㑹賜果賜書御書四民安康字怪石葉未開木芙蓉無讀武士䇿風觀試騎射自喜景仁直秘閣范鎮第七卷律詩二興宗許菊乆之未得得菊井詩送史館唐祠部詢字彦猷江南西路轉運使送張寺丞覲知冨順監寄題李舎人偉蒲中新齋贈太子太傳康靖李公挽歌詞二首送二同年使北右吕濟叔右李公素昌言有詠石髮詩三章模冩精措殆難復加僕雖未睹兹物而巳苦識之乆者輙復強爲三詩以継其後非敢庶幾差肩適足爲歬詩之輿臺耳校理石楊休送沈寺丞紳知南昌縣字公儀酬不疑雪中書懷見寄校理邵必荅師道對雪見寄直講陳洙送王校理懌字公和守琅琊沂公兄子為公後哭尚頴字公楚故侍讀學士張公哀辭二首錢子髙挽歌二首題楊中正供奉洗心堂崇勲之孫送龔章判官之衛州新及第送王瓘同年河南府司録字文正先君甞為此官送王彦臣同年通判亳州字伯逢正月二十四日夜雪和道粹檢討王純臣雪夜直宿和次道大慶殿上元迎駕送茹屯田孝標知無爲單田横墓偃師西登平陸北山回瞰陜城奉寄李八丈學士使君二十二韻貟村坂其東八政水即古之傳巖有傅說廟又東北虞城古虞公之國也太行石昌言學士宰中牟日爲詩見寄乆未之荅今冬罷武成幕来京師此詩謝之楊休昌言見督詩債戲呈絶句靜夜春送導江李主簿君俞送峽州陳廉祕丞三首武成致齋奉酬吴冲卿寺丞太學宿直見寄二首雪中㝷友人不遇河邊晚望早春寄東郡舊同僚邊將三首漁父早春又山中早春贈學仙者留别友生二月六日𥘉見待漏房前栁色微緑欣然成詠垂㧕閑居中秋陪張龍圖讌射堂𥘉夕隂雲酒行頓解喜而成詠貽宋四行簡迪自嘲醉雪寒取酒虞部劉貟外約遊金明光以賤事失期劉惠詩見嘲以詩四首謝之宗孟孫噐之奉使淮浙至江爲書見寄以詩謝之五首和國子夏主簿李花有章送聶之羙攝尉韋城送吴辨叔大名司户送楊太祝忱知長洲縣和邵興宗秋夜學舎宿直和吴沖卿病中偶書呈諸同舎光時亦卧疾月下