front:
  text: 温國文正司馬公文集序孔門以顔回爲德行之首於其問仁則曰天下歸仁焉於其問爲邦則告以虞夏啇周之政何哉以其德行舉而錯之事業則所謂言語政事文學皆其所優爲者孔子所以稱其賢則其心固以王佐許之矣若餘子未免夫貨殖者晝寢者無所取材者難與並爲仁者惡可與顔氏子同年語哉其源躬仁義禮樂之實以沃其膏酌聖賢出處之正以厲其操通古今因革之變以博其施非徒載之空言也是文也君天下者得之足以鑒興衰通治體公卿大夫得之足以勸忠嘉盡臣節士庶人得之足以檢身厲行爲君子之歸以至山㒹水涯幽人放客得之則浩歌流詠斟酌厭飫隨取隨足夫丹青可渝而公之文不可朽也金石可磨而公之文不可磷也山可摧澤可涸而公之文愈乆愈新垂丗而亡窮也公又甞著資治通鑑備論前丗君臣善否之蹟與其理亂興亡之證別爲一書公非有意於立文者然將以鼓吹六經羽翼名敎則肆筆爲言不約而成章古語曰木有文而水有波雖欲更之無柰之何韓愈曰仁義之人其言藹如也昔顔淵死孔子曰噫天喪予憫王道之無傳也公立朝大節輔相勲庸凛凛在人耳目公雖云亡斯文未喪學者傳誦非獨得其言得其書而巳文集凢八十卷爲二十八門其間詩賦章奏制詔表啓雜文書傳無所不備實得於叅知政事汝南謝公謝公語嶠曰艱虞以來文籍散亡子曽大父雜端公熈寧二年坐詆時政及再繳詔敕還中書謫守九江一斥不復司馬公時營救甚力章䟽具載國史天下所共知之且趣嶠叙其首鏤行於丗嶠雖淺陋未學然服膺此書舊矣矧復丗篤忠義之契頋何敢以不敏辭紹興二年歳在壬子九月旦左朝請郎直徽猷閣權發遣福建路提點刑獄公事呉興劉嶠謹序温國文正司馬公文集目録第一卷
