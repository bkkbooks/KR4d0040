body:
  text: 章奏三日食遇隂雲不見乞不稱賀狀三德御臣揀兵論赦及踈決狀薦鄭揚庭薦劉癰進五規狀保業惜時日食遇隂雲不見乞不稱賀狀六年八月二十八日上是歲果大雨不見日食不復稱賀自後踵以為常右臣准太常禮院公文司天監奏今年六月朔太陽交食臣伏覩近丗以來每有日食之變曆官皆先具月日時刻及所食分數奏聞至日或為隂雲所蔽或所食不滿分數公卿百官皆奉表稱賀以為大慶臣愚以為日之所照周遍華夷雲之所蔽至為近狹今若太陽實虧而有浮隂翳塞雖京師不見四方必有見者此乃天戒至深不可不察臣聞漢成帝永始元年九月日有食之四方不見京師見谷永以為沈湎于酒禍在內也二年二月日有食之四方見京師不見谷永以為百姓屈竭禍在外也臣愚以為永之所言似未協天意夫四方不見京師見者禍尚淺也四方見京師不見者禍寖深也日者人君之象天意若曰人君為隂邪所蔽災慝明著天下皆知其憂危而朝廷獨不知也由是言之人主尤冝側身戒懼憂念社稷而群臣乃始相率稱賀豈得不謂之上下相蒙誣罔天譴哉又所食不滿分數者曆官術數之不精當治其罪亦非所以為賀也伏望陛下明敕有司若六月一日果有日食之異或四方見京師不見或所食不滿分數皆不得奉表稱賀以重皇天之怒則天下幸甚臣職在禮部掌凡群臣慶賀章表不敢不言謹具狀奏聞伏候勑旨三德以下三道劄子嘉祐六年𥘉除諌官七月二十一日上殿一留中一送中書一送察院揀軍官貟臣伏䝉聖恩不以臣無似擢臣為諫官臣自幼學先王之道意欲有益於當時是以雖在外方為它官猶願竭其愚心陳國家之所急况今立陛下之左右以言事為職陛下仁聖聰明求諌不倦群臣雖有狂狷愚妄觸犯忌諱陛下皆含容寬貸未嘗加罪誠微臣千載難逢之際苟不以此時傾輸胸腹之所有以副陛下延納之意則不可以自比於人死有餘罪矣臣竊惟人君之大德有三曰仁曰明曰武仁者非嫗喣姑息之謂也興教化修政治養百姓利萬物此人君之仁也明者非煩苛伺察之謂也知道誼識安危别賢愚辨是非此人君之明也武者非彊亢暴戾之謂也惟道所在斷之不疑姦不能惑佞不能移此人君之武也故仁而不明猶有良田而不能耕也明而不武猶視苗之穢而不能耘也武而不仁猶知穫而不知種也三者兼備則國治彊闕一焉則衰闕二則危三者無一焉則亡自生民以來未之或改也臣不勝區區觸死忘生竊見陛下天性慈惠慎微接下子育元元泛愛群生雖古先聖王之仁殆無以過然自踐阼以來垂四十年夙夜孜孜以求至治而朝廷紀綱猶有虧缺閭里窮民猶有怨歎意者群臣不肖不能宣揚聖化將陛下之於三德萬分之一亦有所未盡歟臣聞春秋傳曰賞慶刑威曰君臣幸得以修起居注日侍黼扆之側伏見陛下推心御物端拱淵默羣臣各以其意有所敷奏陛下不復詢訪利害考察得失一皆可之誠使陛下左右前後股肱耳目之臣皆忠實正人則如此至善矣或出於不意有一姦邪在焉則豈可不為之寒心哉夫善惡是非相與混殽若待之如一無所别白或知其善而不能賞知其惡而不能罰則為善者日懈為惡者日勸雖有堯舜禹湯文武之君稷契伊呂周召之臣以之求治猶鑿氷而取火適楚而北行也伏望陛下少垂聖思以天授之至仁廓日月之融光奮乾剛之威斷善無微而不録惡無細而不誅則唐虞三代之隆何逺之有此臣愚淺所見不敢不陳取進止七月二十三日起居舍人直祕閣同修起居注同知諌院臣司馬光劄子御臣臣聞致治之道無它在三而已一日任官二日信賞三日必罰康誥稱文王之德曰庸庸祗祗威威顯民言用其可用祗其可祗刑其可刑也臣竊見國家所以御群臣之道纍日月以進秩循資塗而授任苟日月積久則不擇其人之賢愚而置髙位資塗相值則不問其人之能否而居重職夫人之材性各有所冝而官之職業名有所守自古得賢之盛莫若陶虞之際然稷降播種益主山林垂為共工龍作納言契敷五教皋陶明刑伯夷典禮后䕫典樂皆各守一官終身不易茍使之更來迭去易地而守未必能盡善今以群臣之材固非八人之比乃使之遍居八人之官逺者三年近者數月輒已易去如此而望職事之修功業之成必不可得也非特如是而已設有勤恪之臣悉心致力以治其職群情未洽績效未著在上者疑之同列者嫉之在下者怨之當是時朝廷或以衆言而罰之則勤恪者無不解體矣姦邪之臣衒竒以譁衆養交以市譽居官未久聲聞四逹畜患積弊以遺後人當是之時朝廷或以衆言而賞之則姦邪者無不爭進矣所以然者其失在於國家采名不采實誅文不誅意夫以名行賞則天下飾名以求功以文行罰則天下巧文以逃罪如是則為善者未必賞為惡者未必誅今陛下誠能博選在位之士不問其始所以進及資序所當為使有德行者掌教化有文學者待顧問有政術者為守長有勇略者為將帥明於禮者典禮明於法者主法下至醫卜百工皆度材而授任量能而施職有功則增秩加賞而勿徙其官無功則降黜廢弃而更求能者有罪則流竄刑誅而勿加寬貸如是而朝廷不尊萬事不治百姓不安四夷不服臣請伏面欺之誅凡臣所言皆陛下耳所厭聞心所素知然致治之要無以易此知之非艱行之惟艱顧陛下力行何如耳敢昧死陳瞽言惟陛下裁擇取進止揀兵臣竊聞朝廷近降指揮㨂選諸指揮兵士𥙷填近上軍分其主兵之官惟務人多不復精加選擇其間明知羸弱悉以充數臣以耳目踈短聞之後時不能豫陳可否致事已施行然其得失利害之明不可不盡為陛下言之往者不可及來者猶可追也臣竊惟當今國家之患在於士卒不精故四夷昌熾財用不足故公私窘迫今縱不能澄汰衰老以省大費而又平居晏然非有警急坐增無用之衆以長無窮之患臣不知為國計者果如何也方今天下安樂無虞而府庫之積隨得隨散曽無羡餘設不幸有螽螟水旱饑饉相仍盜賊猝起戎狄內侵不知陛下將何以待之此不可不為之先慮也臣竊觀自唐室募兵以來果能得武猛材力之士猶為有益若不擇勇怯而養之臣不知其可也唐德宗以神䇿軍使白琇圭為京城召募使應募者皆市井沽販之人有名無實及涇師犯闕德宗命琇圭以神䇿軍禦之卒無一人至者德宗狼狽失據遂幸奉天及五代之際軍政光紊是以叛亂接迹禍敗相尋周丗宗以髙平之戰士卒不精故樊愛能何徽所部先奔歸而大閲諸軍悉簡去老弱選其精鋭以為侍衛親軍由是甲兵之盛近丗無比故能南割淮甸北取關南群雄畏服所向無敵太祖皇帝受天明命撫有大寶當是之時戰士不過數萬北禦契丹西捍河東以其餘威開荆楚包湖湘卷五嶺吞巴蜀掃江南服吳越太宗皇帝紹丕烈奮神威遂拔晉陽一統四海堂堂之業萬丗賴之今天下兵數臣不能盡知竊聞比於太祖皇帝時其多數倍然元昊羌胡之竪子智髙蠻獠之微種乃敢倔強河西橫行嶺表國家發兵討之士卒或望塵奔北或迎鋒沮潰毀辱天威為四夷笑由是觀之養兵之術務精不務多也且今所選之兵升其軍分增其糧賜是冝感戴上恩人人喜恱而竊聞京城之內被選之人往往咨嗟悲怨父子相泣况於外方兵士違去鄉里訣别親戚其為愁苦不言可知使中外人情遑遑如此豈惟久逺之害亦不可不以切近之憂為萬一之慮也兵者國之大事廢興之端安危之要盡在於是臣不知曽與不曽令兩府大臣相與熟議經久利害然後行之今在京兵士已經㨂上分配諸軍者無如之何其未揀及外州軍兵士伏望朝廷特降㫖揮下應係㨂軍臣僚須是二躬親子細㨂選好人材有膂力及得等樣别無呈切方得㨂上如已經㨂中後朝廷别差不干礙官覆揀得却有不及等樣及羸弱病患之人其元㨂軍臣僚伏乞重行貶竄仍自今後每遇大假招揀兵士並須先令兩府臣僚同共啇量度財用豐耗及事之緩急若須至招㨂方得聞奏施行并約束揀軍臣僚務精不務多一如今來旨揮取進止論赦及踈决狀嘉祐六年八月十五日上右臣竊以赦者害多而利少非國家之善政也虞書曰眚災肆赦怙終賊刑謂過誤有害則赦之恃惡自終則殺之非不擇罪之有無并赦之也漢大司馬吳漢病篤光武親臨問所欲言對曰惟願陛下慎無赦而已王符亦曰今日賊良民之甚者莫大於數赦贖赦贖數則惡人昌而善人傷矣蜀人稱諸葛亮之賢亦曰軍旅屢興而赦不妄下然則古之明君賢臣未嘗以數赦為美也國家承順天心子愛百姓發號出令必先至仁然數赦之弊猶未能去又古之赦者其出無常嚴謹周密不可前知姦民猶抵冒以待之况今國家三年一郊未嘗無赦每歲盛夏皆有踈決猾吏貪縱大為姦利悍民暴橫侵侮善良百千之中敗無一二幸而發露率皆亡匿不過周歲必遇赦降則晏然自出復為平人往往指望謂之熱敕使願慤之民憤邑惴恐凶狡之群志滿氣掦豈為民父母勸善沮惡之意哉且踈决之名本以盛暑之際恐囹圄之中有滯積冤結有司不為申理使無所告訴故天子臨軒親加慮問平其枉直無辜則赦有罪則誅使久繫之人一朝而決故能消釋沴氣迎致太和非謂不問是非一切縱之也又祖宗之時每歲不過一次踈決死罪以下皆遞降一等近年以來或至再三自徒以下一切赦之今歲五月以前踈決之令已再行矣此所以使百職隳慢姦邪恣睢者也今縱未能盡革前弊伏望陛下特降指揮下中書今後每歲踈決不過一次或早或晚使外人不可豫期其徒罪仍依舊降從杖或遇親祀南郊之歲更不踈決永為定制庶幾為惡之人不敢指以自寬有所戒懼謹具狀奏聞伏候勑旨薦鄭揚庭臣竊見近丗以來搢紳之士專上華辭不務經術先聖微言幾成廢墜臣謂苟有盡心修明六藝皆冝甄獎以勵來者伏見并州孟縣主簿鄭揚庭自少及長研精易道撰著所得成易測六卷不泥隂陽不涉怪妄專用人事指明六爻求之等倫誠難多得臣不敢隱蔽輒取進止伏望聖慈略垂省覽苟有可取量加旌異貴使學者有所勸慕取進止薦劉雍臣伏見西鄙用兵以來草萊之士談兵機獻邊䇿者不可勝紀其間夸誕迃闊不切事情鄙陋膚淺無可觀采者甚衆蓋緣邊鄙之事非土著之人耳目習熟則不能究明利病非學古之士歷觀成敗則不能堅定是非竊見并州鄉貢進士劉雍撰成邊議十卷援据古今指陳得失用意甚勤論理頗多不敢隱蔽謹具進呈伏乞少賜省覽如有可取欲乞朝廷略加甄獎進五規狀嘉祐六年八月十七日上右臣幸得備位諫官竊以國家之事言其大者逺者則汪洋濩落而無目前朝夕之益陷於迃闊言其小者近者則叢脞委瑣徒足以煩浼聖聽失於苛細夙夜惶惑口與心謀涉歷纍旬乃敢自决與其受苛細之責不若取迃闊之譏伏以祖宗開業之艱難國家致治之光美難得而易失不可以不慎故作保業隆平之基因而安之者易為功頽壞之勢從而救之者難為力故作惜時道前定則不窮事前定則不困人無逺慮必有近憂故作逺謀燎原之火生於熒熒懷山之氷漏於㳙㳙故作重微象龍不足以致雨畫餅不足以療飢華而不實無益於治故作務實合而言之謂之五規此皆守邦之要道當丗之切務戇陋狂瞽觸冒忌諱惟知納忠不敢愛死伏望陛下以萬幾之餘遊豫之間垂精留神特賜省覽萬一有取裁而行之則臣生於天地之間不與草木同朽矣謹貝狀奏聞伏候勑旨保業天下重器也得之至艱守之至艱王者始受天命之時天下之人皆我比肩也相與角智力而爭之智竭不能抗力屈不能支然後肯稽顙而為臣當是之時有智相偶者則為二相參者則為三愈多則愈分自非智力首出於丗則天下莫得而一也斯不亦得之至艱乎及夫繼體之君群雄已服衆心已定上下之分明彊弱之勢殊則中人之性皆以為子孫萬丗如泰山之不可搖也於是有驕墯之心生驕者玩兵黷武窮泰極侈神怒不恤民怨不知一旦渙然四方糜潰秦隋之季是也惰者沈酣宴安慮不及逺善惡雜糅是非顛倒日復一日至於不振漢唐之季是也二者或失之彊或失之弱其致敗一也斯不亦守之至艱乎臣竊觀自周室東遷以來王政不行諸侯逐進分崩離析不可勝紀凡五百有五十年而合於秦秦虐用其民十有一年而天下亂又八年而合於漢漢為天子二百有六年而失其柄王莽盜之十有七年而復為漢更始不能自保光武誅除僣僞凡十有四年後能一之又一百五十有三年董卓擅朝州郡瓦解更相吞噬至于魏氏海內三分凡九十有一年而合於晉晉得天下才二十年惠帝昏愚宗室構難群胡乘釁濁亂中原散為六七聚為二三凡二百八十有八年而合於隋隋得天下才二十有八年焬帝無道九州幅裂八年而天下合於唐唐得天下一百有三十年明皇恃其承平荒于酒色養其疸囊以為子孫不治之疾於是漁陽竊發而四海橫流矣肅代以降方鎮跋扈號令不從朝貢不至名為君臣實為讎敵陵夷衰微至于五代三綱頽絶五常殄滅懷璽未暖處官未安朝成夕敗有如逆旅禍亂相尋戰爭不息流血成川澤聚骸成丘陵生民之類其不盡者無幾矣於是太祖皇帝受命于上帝起而拯之躬擐甲胄櫛風沐雨東征西伐掃除海內當是之時食不暇飽寢不遑安以為子孫建太平之基大勳未集太宗皇帝嗣而成之凡二百二十有五年然後大禹之迹復混而為一黎民遺種始有所息肩矣由是觀之上下一千七百餘年天下一統者五百餘年而已其間時時小有禍亂不可悉數國家自平河東以來八十餘年內外無事然則三代以來治平之丗未有若今之盛者也今民有十金之産猶以為先人所營苦身勞志謹而守之不敢失墜况於承祖宗光美之業奄有四海傳作萬丗可不重哉可不慎哉夏書曰豫臨兆民凛乎若朽索之馭六馬周書曰心之憂危若蹈虎尾涉于春冰臣願陛下夙興夜寐兢兢業業思祖宗之勤勞致王業之不易援古以鑒今知太平之丗難得而易失則天下生民至於鳥獸草木無不幸甚矣惜時夏至陽之極也而一隂生冬至隂之極也而一陽生故盛衰之相承治亂之相生天地之常經自然之至數也其在周易泰極則否否極則泰豐亨冝日中孔子傳之曰日中則􅉴月盈則食天地盈虛與時消息而况於人乎况於鬼神乎是以聖人當國家隆盛之時則戒懼彌甚故能保其令問永久無疆也凡守太平之業者其術無它如守巨室而已今人有巨室於此將以傳之子孫為無窮之規則必實其堂基壯其柱石彊其棟梁厚其茨蓋髙其垣墉嚴其關鍵既成又擇子孫之良者使謹守之日省而月視欹者扶之弊者補之如是則雖亘千萬年無頽壞也夫民者國之堂基也禮法者柱石也公卿者棟梁也百吏者茨蓋也將帥者垣墉也甲兵者關鍵也是六者不可不朝念而夕思也夫繼體之君謹守祖宗之成法苟不隳之以逸欲敗之以讒諂則丗丗相承無有窮期及夫逸欲以墮之讒諂以敗之神怒於上民怨於下一旦渙然而去之則雖有仁智恭儉之君焦心勞力猶不能救陵夷之運遂至於顛沛而不振嗚呼可不鑒哉今國家以此承平之時立綱布紀定萬丗之基使如南山之不朽江河之不竭可以指顧而成耳失今不為已乃頓足扼腕而恨之將何益矣詩云我日斯邁而月斯征夙興夜寐無忝爾所生時乎時乎誠難得而易失也溫國文正公文集卷第十八
