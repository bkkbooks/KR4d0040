body:
  text: 書啓六荅范景仁書荅景仁書韓秉國書秉國書荅韓秉國書荅秉國第二書三省咨目宻院咨目與三省宻院論西事簡與吕晦叔簡二荅彭寂朝議書荅范景仁書光啓許人至得五日所賜書承氣體休佳至慰至喜示諭孔子孟軻亦病兄議論者以此所有佐彼所闕以此之是變彼之非告之以忠進之以直彼當察之以公受之以虚若饋獻之相益貿易之相資各得所求故可貴也光前獻樂議景仁已拒之今獻中和之論又不售若墨翟守千仞之城以待勍敵使光何自而入焉夫聚財異於用兵用兵則貴必勝聚財則貴多得今光屢有所獻皆不克納借使光肯伏其不勝然於㬌仁亦何所得哉豈可徒競無窮之辭請亦置是論處暑以來天氣頓凉慎護自愛而巳不宣光再拜景仁七兄足下荅景仁書光啓六月中於夢得處連辱兩書自爾以通鑑欲進御結絶文字日不暇給以是闕然乆不修報計景仁雖怪之必知其非踈怠也光與㬌仁自皇祐中論樂迄今三十年筆舌往返前後非一今更欲竭肺腸以仰告亦止於陳言重複祗増煩瀆無益於析理也然景仁今書所詰責者亦不可不略自辨來示云光與胡阮前非李照今復主之光皇祐中所上聞者正以房庻妄改漢書以就私意謂景仁不冝信而從之近日所上聞者止爲景仁以今之夲府尺即黄帝時尺恐不然至於音律髙下素非光所習學實不曉其是非亦不知王李胡阮之相去幾律何甞敢有所主有所非邪此則所不敢當也來示云經有注釋之未安史有記録之害義理者不可不正此則誠然然湏新義勝舊義新理勝舊理乃可奪耳如浴乎沂十月五星聚東井之類是也至於房庶所改漢書云一黍之起積一千二百黍之廣全不成文理豈可遽改舊書邪其餘則與景仁之意殊塗而同歸景仁以禮樂爲治國之大而不可慢光豈以爲小而可慢邪景仁吹律吕考鍾磬校尺量鑄鬴斛以求先王之樂光謂先王之樂大要主於中和而巳亦猶景仁謂衣有青赤黄白黒之異光謂主於温而已矣景仁謂食有酸苦甘辛鹹之異光謂主於飽而已矣然則景仁豈能全廢光之說光豈敢盡不用景仁之論邪彼諸家言樂者各有十二律五音更相是非如五方之人言語不通飲食不同各謂我是而彼非孰能正之從景仁之樂視之則王朴君臣民事物皆不相干李照皆失其位使二人復生於今日視景仁之樂未知其云何也若欲知其真是真非必有如伶倫后夔師曠者始能知之耳今旣未有其人願景仁且以所著樂說與光書合藏之以俟後丗必有知樂者能辨之也光之言止於此自今景仁更以樂論相示光亦不敢對也不宣光再拜韓秉國書維啓春氣斗温伏惟動止安和相見之期竟未有定殊増耿耿見與景仁書似怪鄙拙論議於公有所未盡者向讀中和論疑中字解釋未甚明然未敢決然以爲非也今試妄言煩公一閱是非幸復垂諭以解愚蔽胷中所欲言者非可以書盡惟兾自愛重而巳謹手啓不宣維再拜君實資政閤下秉國論中之說有二對外而爲言一也無過與不及一也喜怒哀樂之未發漠然無形及其既發然後見其中節與不中節也故喜怒哀樂之未發謂之中發而中節謂之和人之心虚則明塞則暗虚而明則燭理而無滯應物而不窮喜怒哀樂之發有不中節乎中節則無過與不及矣有不和乎在易之卦虚其中曰离爲日爲南方爲火王弼解復其見天地之心云天地以本爲心者也雷動風行運變萬化寂然至無是其本也春萌夏長秋落冬閉日月之行星斗之運此天地之迹可見於外者也張宫置吏發號施令事功之修舉民物之茂遂此聖人治天下之迹可見於外者也若其所以迹者盖莫得而擬議也凡物莫不有本此又衆夲之所自出故曰大夲凢物不得其節則過與不及施於用則爲蔽塞爲睽乖爲不行爲患難無此四者和矣故曰逹道明乎此者其見天地聖人之心乎荅韓秉國書光啓丁通直來蒙貺書審起居安和至喜示諭見與景仁書似怪論議有所不同此何言哉朋友道廢乆矣光述中和論所以必欲呈秉國者正爲求切瑳琢磨庶幾近是耳豈欲秉國雷同而巳邪聞秉國有論光不勝其喜故因景仁請見之何謂怪也然光至愚於秉國之論猶有所未逹者請試陳之惟秉國擇焉秉國云中之說有二對外而言一也無過與不及一也此誠如諭然中者皆不近四旁之名也指形而言之則有中有外指德而言之則有和此書以中庸爲名其所指者蓋德也非形也如秉國所諭則中庸應云喜怒哀樂之未發謂之中及其旣發謂之外不則云喜怒哀樂之未發謂之虚發而皆中節謂之和乃相應也秉國又云虚則明塞則暗此誠如所諭然所謂虚者非空洞無物之謂也不以好惡利害蔽其明是也夫心動物也一息之間升天沈淵周流四海固不肯兀然如木石也惟賢者治之能止於一擇其所止莫如中庸故虞書曰惟精惟一允執厥中也凡人固有無喜怒哀樂之時當此之際其心必有所在小人則追求嗜好靡所不之惟君子能自處於中庸之地不動以待事也大學曰知止而後有定定而後能靜靜而後能安安而後能慮慮而後能得又曰爲人君止於仁爲人臣止於謹爲人子止於孝爲人父止於慈與國人交止於信言所止各有在也荀子曰德操然後能定能定然後能應能定能應夫是之謂成人亦言所定在於德也又曰人何以知道曰心心何以知曰虚一而靜心未甞不藏也然而有所謂虚不以所巳藏害所將受謂之虚心未甞不兩也然而有所謂靜不以夢劇亂知謂之静然則虚者固不爲空洞無物靜者固不謂兀然如木石也凢曰虚曰靜曰定云者如大學與荀卿之言則得中而近道矣如佛老之言則失中而逺道矣光所以不好佛老者正謂其不得中道可言而不可行故也借使有人真能獨居宴坐屏物棄事以求虚無寂㓕心如死灰形如槁木及有物歘然來感之必未免出應之則其喜怒哀樂未必皆能中節也曷若治心養氣專以中爲事動靜語黙飲食起居未始不在乎中則物雖輻湊横至一以中待之無有不中節者矣秉國又引王輔嗣解復其見天地之心以證虚無爲衆夲之所自出夫万物之有誠皆出於無然旣有則不可以無治之矣常病輔嗣好以老莊解易恐非易之本指未足以爲據也輔嗣以雷動風行運變萬化爲非天之心然則爲此者果誰邪夫雷風日月山澤此天地所以生成萬物者也若皆寂然至無則萬物何所資仰邪天地之有雲雷風雨猶人之有喜怒哀樂必不能無亦不可無也故易曰雲行雨施品物流形詩曰君子如怒亂庻遄沮君子如祉亂庻遄巳但動靜有節隠見有時不可過與不及過與不及皆爲災害必得中然後和和然後能育萬物也自有天地以來陽極則隂生隂極則陽生動極則靜靜極則動盛極則衰衰極則盛否極則泰泰極則否若循環之無端萬物莫不由之故曰一隂一陽之謂道此皆天地之心然復者陽生之卦也天地之大德曰生故聖人賛之曰復其見天地之心乎言天地之道雖一往一來本以好生爲心也易道幽深而輙敢妄爲之解其罪甚大亦不自識其是與非也抑求之空言不若驗之實事竊聞秉國平日好習靜光不勝區區願秉國試輟習靜之心動靜語黙飲食起居皆在於中勿須臾離也乆而觀其所得所失孰少孰多則秉國必自得之矣豈待光之煩言哉愚慮如此所不及者不惜更示不宣光再拜秉國資政五兄左右荅秉國第二書光啓辱四日所惠書誨以所未諭幸甚幸甚書文甚多援据甚廣光欲一一條對則恐逐枝葉而忘本根徒費紙扎視聽無益於進道是冝直指其大要而言之今光與秉國皆知中庸之爲至德而信之矣所未合者秉國以無形爲中光以無過與不及爲中此所謂同門而異户也夫喜怒哀樂之未發常設中于厥心豈有形於外哉荀卿太學所謂虚靜定者非寂然無思慮也虚者不以欲惡蔽其明也靜者不以怵迫亂其志也定者不以得喪易其操也中庸所謂中者動靜云爲無過與不及也二者雖皆爲治心之術其事則殊矣今秉國合而爲一恐未然也周公思兼三王以施四事有不合者仰而思之夜以継日孔子終日不食終夜不寢以思道豈得寂然無思慮哉茍爲不思又不慮直情徑行雖聖人亦恐喜怒哀樂不能皆中節也中庸所謂誠者天之道言聦明睿智天所賦也誠之者人之道言好學從諌人所爲也不勉而中不思而得從容中道謂聖徳之巳成者也擇善而固執之博學審問慎思明辨篤行謂賢人之好學者也人一能之已百之謂愚者之求益者也夫不歴坱埤不能登山不㳂江河不能至海聖人亦人耳非生而聖也雖聦明睿智過絶於人未有不好學從諌以求道之極致由賢以入於聖者也故孔子曰我非生而知之好古敏以求之者也又曰吾十有五而志于學至於七十然後縱心所欲不踰矩以孔子之徳性猶力學五十有五年乃能成其聖况它人不學而能之乎若謂聖人生知自天必不可及則顔子何爲欲罷不能孟子何爲自比於舜哉舜戒群臣曰予違汝弼汝無面從使舜生而聖不勉而中不思而得夫又何弼哉詩稱文王不聞亦式不諌亦入言其性近於道處師弗煩在傅弗勤非謂不學而不諌也光前書論中巳備矣恐秉國尚未詳覽而熟察也光前書云願秉國動靜語黙飲食起居皆在於中勿須臾離也乆必得之矣秉國亦常留意采其言乎今有人饋食於吾二人者吾二人未甞而先爭之一人曰鹹一人曰酸曷若相與共甞則知其味矣又有饋藥於吾二人者吾二人未服而先爭之一人曰寒一人曰温曷若相與共服則知其驗矣中美食也良藥也光願與秉國強勉而試行之師曠曰秉燭之明孰與夜行吾二人雖老矣継今而猶學庶幾其有益也往來之言奚以多爲光再拜三省咨目光比日牽強入朝欲與諸公商議數事貢其短拙以求采擇無何上下馬不得湏至在朝假謹具咨目如左當今法度所冝最先更張者莫如免役錢不惟刻剥貧民使不聊生又雇得四方無頼浮民使供百役官不得力爲今之計莫若盡罷免役錢依舊差役民間息肩者什巳七八若慮逐處利害不同即委諸路轉運司及州縣具未便事理申陳朝廷更爲相度别立一州縣勑施行第一不可委提舉司相度彼雖夲職藉頼役錢如魚之有水安肯放免必來沮難無疑也光見欲作一文字奏聞若降至三省望諸公同心叶力與賛成如此行之可以除乆弊蘇疲民凡法乆則難變此法行之巳十五年下户雖愁苦上户頗優便常情論議巳是非不一若不於此際決志改之恐異日遂爲萬丗膏肓之疾公家不得用民力貧民常苦冨民常優矣朝廷今欲整治天下蘇息疲民先湏十八路各得好監司一兩人忠厚暁事憂民忘私使之進賢退不肖興利除害朝廷於本路事有所不知問之則以實對委之措置則不至乖方然後可以倚仗爲耳目股肱也苟非其人則百事倒置矣前日所草監司資格及委官薦舉文字不知諸公曽徧見未若如此可行則早告進呈施行然立格爲易守格爲難旣出指揮巳後願諸公堅執此格勿自墮壞始爲有益也旱勢可懼若春更不雨必成大飢不可不預爲之備國家所頼爲根夲者莫若農民農民者衣食之原國家不可不先存恤也欲加存恤莫若察其乏食之初早加賑贍使各安土不至流移官費旣省民不失業此上策也若巳流移官雖作擘畫散米煑粥徒聚爲餓􅥌無益也爲今之計莫若預先將常平斛斗在州縣者十分中支撥一分充賑貸米委州縣樁管許一面支破常切覺察郷村人户有闕食者許經本縣投狀據口數多少老小出給暦子毎五七日一次赴縣請領口食先從丁户爲始縣亦置簿拘管請却之數如此救接直至成熟日即一切住支却令還納所貸元數更不取利息如此始是實惠弋俊巳獲未聞賞獲之者其將官討捕者不無搔擾冝早罷之前日蔡尹来言開封有巨盗朝廷有募人能禽之者賞以班行今旣禽之止賞以錢孔子稱去食去兵無信不立聖朝政令豈當如此諸公更筭其多者范景仁當仁宗不豫未有繼嗣天下寒心莫敢啓口之時獨能首建大議以安宗廟社稷章十九上除官不拜可謂以身徇國之臣其功不在文冨之下今文冨重賞景仁獨不霑及此太皇太后亦應知其功大願諸公進呈秉國文字時詳爲敷奏乞優與推恩前日簾前宣諭上封事異等者冝略加旌賞此乃聖朝羙事光有看詳封事暦三卷官職姓名及所言事一一有之願諸公同於其間選擇才識出衆者具姓名敷奏量加褒異以成聖志宻院咨目光比日曳病入朝只爲欲與諸公啇議數事於簾前敷奏終不能得聚㕔今光飲食日減不能造朝未知幾時復得瞻望顔色湏至具咨目如左吕大忠言夏虜乍恭乍驁由私市公行故也其延慶侵疆有害無用終當與之然今日未可與也俟大忠到官審察事勢先奏乞嚴禁私市不過年歲間彼必屈服遣人來祈請然後朝廷下詔曠然歸以侵疆赦其罪戾自今貢賜往來一切如故此策大善請明公更召見詢訪其詳然如光愚見若只如去夏約束檢門下開折簿曾行下則大是悠悠徒爲玩令一無所益湏别立法云應漢户熟户與西人私相交易者正犯人處斬妻子送江淮編管粉壁暁示許人陳告即時給係省錢五十貫充賞本地分廵檢寨主監押並衝替仍令經略司本州常切覺察如此逐處行却一兩箇方能禁絶若西人如往年興兵壓境以脅慶州劉忱時亦莫之聽但堅壁清野使自疲弊而去河東經略司緫領二十餘州軍邊靣千餘里地接二虜帥府之重熟過於此而以吉甫處之果能稱職否且如昨者北虜侵火山地不與於初累石時便令撤去彼若放箭我射何傷仍明據道理亦行文牒痛加詰責云當奏朝廷問諸北朝今朝延緊不共理㑹示之以弱但恐春暖虜狃於得志以爲南朝易與大興徒衆廣有占割朝廷亦坐視無如之何土地者國之本若虜惟意所欲無問多少要取便取成何國家此由邊帥不能防微杜漸故漸渠自乞揚州諸公何不早許之别擇老成重厚有膽略者以代之子厚方欲措置熈河爲經乆之計而元帥乃一方頭目其人豈髙材英噐憂國忘家者邪願早易之勿致敗事御史所言保甲罷按閱甚當冝從之彼得三時務農豈顧此微茫賞物而省國用不少但與逐旋置庫量留些小金帛遇冬敎時委令佐選絶藝者賞以銀楪子銀盌綵叚如與人班行雖云猥賤亦是國家命官豈可如泥土與人其出等事藝及正長教人及分數欲更不與班行正長所以鞭撻保丁只為未及分數千賞故也前日見駕部来白沙苑地狹不能容京西所送騍馬且彼無牡馬徒多養騍馬何爲但使之積死可惜耳欲令京西未發者皆烙退印還民巳發者令沙苑估價出賣如何若可取望早指揮然監牧亦不可不一靣早差官相度興復漢唐都長安故養馬多在汧隴三輔之間國家都大梁故監牧在鄆鄭相衛許洛之間各取便於出入故也合冝且復近處一二監各有舊基故也子厚常言軍賞誤何時當與裁減改正邊人立小功者冝勿賞此宋景所以安開元也封事大約已遍止有兩複吏云其籖子厚欲有去取旣難得㑹議彼亦無大利害但請子厚欲去者去之餘令進入貴早結絶與三省宻院論西事簡不和西戎中國終不得髙枕光所上芻蕘果有可采否縱未欲遽以侵地歸之且早下一詔數其不賀正旦生辰及登寳位臣禮不俻諭以天子新即位務崇寛大曠然赦之自今貢奉賜予宜皆復舊規但不責其必來獻地分畫疆界而巳令保安牒與如此則彼此相弥縫且有名又不失大體不乗此際爲之萬一彼微爲邊患或更出不遜語愈難處置願諸公筭其多者與吕晦叔簡光啓自晦叔入都及得共事毎與僚宷行坐不相離未甞得伸悃愊雖日夕接武猶隔闊千里也今不幸又在病告杳未有展覿之期其邑邑可知光平生有國武子疾好盡言以招人過遇庸人時或妄發以取恨怒况至交益友豈敢返懷情不盡乎晦叔自結髮志學仕而行之端方忠厚天下仰服垂老乃得秉國政平生所藴不施於今日將何俟乎比日以来物論頗譏晦叔慎嘿太過若此際復不廷爭事蹉跌則入彼朋矣願慎旃慎旃光誠不肖豈敢以憂國爲已任然昨日冨家之諭巳上聞矣光自病以来悉以身付醫家事付康惟國事未有所付今日屬於晦叔矣又介甫文章節義過人處甚多但性不暁事而喜遂非致忠直踈逺讒佞輻輳敗壞百度以至于此今方矯其失革其弊不幸介甫謝丗反覆之徒必詆毀百端光意以謂朝廷持冝優加厚禮以振起浮薄之風苟有所得輙以上聞不識晦叔以爲如何更不煩荅以筆札扆前力言則全仗晦叔也荅彭寂朝議書光啓辱書奬惜太過期待太厚且愧且懼殆無所容光禀性甚愚求道多蔽德行言語政事文學皆不迨人齪齪廉謹自守而巳不意時俗妄加虚名如火附瑩如膏汚衣潜迯湔澣不知所避固微生之不幸未甞敢取以爲已有也屬者朝廷誤賜甄擢俾待罪政府辭不獲命黽勉就職毎内訟非據如藉蒺藜素與足下未甞得接聲采之熟陪從容之乆乃能不逺數千里教所以不及非光無似克堪大賜乃足下愛君仁民之志勤懇切至不暇擇其人之可否而語之也衘荷盛德刻骨不忘謹當寶藏時取伏讀以自警策庶幾少副萬分之一譬如駑馬聞騏驥嘶鳴不自量度踴躍躑躅亦欲疾歩而從之殊不知軼景遺風雖破骨絶筋而不可及也雖然朝廷近發詔書溥覃四海雖市􅒡畎畒之民皆得直上封言事足下位爲朝大夫任爲部刺史於朝政闕失民間疾苦願不惜以時上聞後禁中降出得與諸公詳議恊同者即行之幸甚幸甚不宣光再拜温國文正公文集卷第六十三
