body:
  text: 銘針頌原説述銘鐵界方銘劒銘并序槃水銘四言銘針勇針逸針友針頌顔樂亭頌原原命説説玄述述國語四言銘系述銘鐵界方銘質重精剛端平直方進退無私法度攸資燥濕不渝寒暑不殊立身踐道是則是俲劒銘并序或曰古者君子居常佩劒以備不虞今也無之倉卒何恃焉應之曰君子恃道不恃劒道不在焉雖劒不去體不能救其死是故苟得其道則劒存可也亡可也作劒銘云昆吾之精太阿之靈深慮過防却除不祥倐忽縱橫萬夫莫當用得其道利器可保道之不明器無足憑怙力棄常匹夫以亡敗德阻兵國家以傾逆不敵順暴不犯仁上以守國下以全身長鋏蕭蕭七星照腰不離於道神鋒可銷槃水銘槃水之盈止之則平平而後清清而後明勿使小欹小欹必傾傾不可收用毀其成嗚呼奉之可不兢兢四言銘聰明勇健之謂才忠信孝友之謂行正直中和之謂德深逺髙大之謂道修己針三首勇針何為而正致誠則正何為而勇蹈正則勇孟賁之材心動則回臨義不疑嗚呼勇哉逸針百仞之木生本秋毫德隳於惰名立於勞宴安之娛窮乎一晝德著名成億年不朽可貪非道可愛非時沒丗無稱君子恥之昔在周公作為無逸大聖猶然况非其匹友針余何遊乎余將遊聖之門仁之里非聖不師非仁不友可乎未可不若遊衆人之場聞善而遷觀過而改顔樂亭頌并序周翰孔子四十七丗孫名宗翰邦直李清臣也孔子舊宅東北可百步有井魯人以為昔顔氏之居也周翰思其人買其地犯御名亭其上命曰顔樂邦直為之銘其言顔子之志盡矣無以加矣子瞻論韓子以在隱約而平寬為哲人之細事以為君子之於人必於其小焉觀之光謂韓子以三書抵宰相求官與于襄陽書謂先逹後進之士玄為前後以相推援如市賈然以求朝夕芻犬僕賃之資又好恱人以銘志而受其金觀其文知其志其汲汲於冨貴戚戚於貧賤如此彼又烏知顔子之所為哉夫嵗寒然後知松柏之後雕士貧賤然後見其志此固哲人之所難故孔子稱之而韓子以為細事韓子能之乎光實何人敢評先賢之得失聊因子瞻之言申而盡之頌曰貧而無怨難顔子在陋巷飲一瓢食一簞能固其守不戚而安此德之所以完原命子罕言命子貢稱夫子之文章可得而聞也夫子之言性與天道不可得而聞也是則天道精微非聖人莫能知今學者未能通人理之萬一而遽從事於天是猶未嘗操舟而欲涉海不陷溺者其幾矣昔眭孟知有王者興於微賤而不知孝宣乃欲求公孫氏擅以天下翼奉知漢有中衰厄會之象而不知王莽乃云洪水為災西門君惠知劉秀當為天子而不知光武乃謀立國師公劉秀秀亦更名以應之劉靈助知三月當入定州四月爾朱氏滅而不知滅尓朱者為齊神武入定州者乃其首也此五子者其於術可謂精矣皆無益於事而身為戮沒又况下此者哉夫天道窅冥恍愡若有若亡雖以端兆示人而不可盡知也非天下之至神其孰能與於此是以聖人之教治人而不治天知人而不知天春秋記異而説不書唯恐民冒沒猖狂以趨於亂也説玄余少之時聞玄之名而不獲見獨觀雄之自序稱玄盛矣及班固為雄傳則曰劉歆嘗觀玄謂雄曰空自苦今學者有祿利然尚不能明易又如玄何吾恐後人用覆醬瓿也雄笑而不應諸儒或譏以為雄非聖人而作經猶春秋吳楚之君僣號稱王蓋誅絶之罪也固存此言則固之意雖愈於歆亦未謂玄之善如雄所云也余亦私怪雄不贊易而别為玄易之道其於天人之緼備矣而雄豈有以加之乃更為一書且不知其焉所用之故亦不謂雄冝為玄也及長學易苦其幽奧難知以為玄者賢人之書校於易其義必淺其文必易夫登喬山者必踐於坱埤適滄海者必沿於江漢故願先從事於玄以漸而進於易庶幾乎其可跋而望也於是求之積年始得觀之𥘉則溟涬漫漶略不可入乃研精易慮屏人事而讀之數十過參以首尾稍得窺其梗槩然後喟然置書嘆曰嗚呼楊子雲真大儒者邪孔子既沒知聖人之道者非子雲而誰孟與荀殆不足擬况其餘乎觀玄之書昭則極於人幽則盡於神大則包宇宙小則入毛髮合天地人之道以為一刮其根本示人所出胎育萬物而兼為之母若地履之而不可窮也若海挹之而不可竭也蓋天下之道雖有善者蔑以易此矣考之於渾元之𥘉而玄已生察之於當今而玄非不行窮之於天地之季而玄不可亡叩之以万物之情而不漏測之以鬼神之狀而不違槩之以六經之言而不悖藉使聖人復生視玄必釋然而笑以為得己之心矣乃知玄者所以贊易也非别為書以與易角逐也何歆固知之之淺而過之之深也或曰易之法與玄異雄不遵易而自為之制安在其贊易乎且如與易同道則既有易矣何以玄為曰夫畋者所以為禽也網而得之與弋而得之何異書者所以為道也易網也玄弋也何害不既設網而使弋者為之助乎子之求道亦膠矣且楊子作法言所以準論語作玄所以準易子不廢法言而欲廢玄不亦惑乎夫法言與論語之道庸有異乎玄之於易亦然大厦將傾一木扶之不若衆木扶之之為固也大道將晦一書辨之不若衆書辨之之為明也學者能專精於易誠足矣然易天也玄者所以為之階也子將升天而廢其階乎先儒為玄解者誠巳善矣然子雲為文既多訓詁指趣幽還而玄又其難知者也故今疑先儒之解未能盡契子雲之志丗必有能通之者比老終且學焉述國語先儒多怪左丘明既傳春秋又作國語為之説者多矣皆未通也先君以為丘明將傳春秋乃先采集列國之史國别分之取其菁英者為春秋傳而先所采集列國因序事過詳不若春秋傳之簡直精明渾厚遒峻也又多駮雜不粹之文誠由列國之史學有薄厚才有淺深不能醇一故也不然丘明作此復重之書何為邪然所載皆國家大節興亡之本柳宗元邪佞之人智識淺短豈足以窺望古君子藩籬而妄著一書以非之竊懼後之學者惑於宗元之言而簡棄此書故述其所益以張之四言銘系述迃叟為四言銘見者忽之曰老生常談耳故有系述孔子稱才難夫才者所受於天非人所能強也故推十合一曰士千人曰俊萬人曰傑出於其類拔於其萃此其所以難也聞言易悟曰聰睹事易辨曰明敢為不懼曰勇強力不屈曰健有是四者才則美矣然未足恃也自古恃才而不勤德行以殺身喪家亡國者踵相及也彼皆天之所與非已之所為又奚足以驕人哉君子則不然有其才必思美其行以成之盡心於人曰忠不欺於已曰信善父母曰孝善兄弟曰友夫孝友百行之先而後於忠信何也苟孝友而不忠信則非孝友矣能是四者行則美矣未及於德也正直為正正曲為直適冝為中交泰為和正直非中和不行中和非正直不立若寒暑之相濟隂陽之相成也夫察目睫者不能見百步瞻百步者亦不能見目睫均是德也執其近小而遺其逺大守其卑淺而忘其髙深是猶不免為小人焉故君子好學不厭自強不息推之使逺廓之使大聳之使髙研之使深發于心形于身𥙿于家施于國格于上下被于四表雖堯舜周孔莫不本於是矣嗚呼捨是而云道者皆不足學也溫國文正公文集卷第六十八
