body:
  text: 銘箴頌原說述銘䥫界方銘劒銘并序槃水銘四言銘箴勇箴逸箴友箴頌顔樂亭頌原原命說說玄述述國語四言銘系述銘䥫界方銘質重精剛端平直方進退無私法度攸資燥濕不渝寒暑不殊立身踐道是則是俲劒銘并序或曰古者君子居常佩劒以備不虞今也無之倉卒何恃焉應之曰君子恃道不恃劒道不在焉雖劒不去體不能救其死是故苟得其道則劒存可也亡可也作劒銘云昆吾之精太阿之靈深慮過防却除不祥倐忽縱横萬夫莫當用得其道利噐可保道之不明噐無足憑怙力棄常疋夫以亡敗徳阻兵國家以傾逆不敵順暴不犯仁上以守國下以全身長鋏䔥蕭七星炤腰不離於道神鋒可銷槃水銘槃水之盈止之則平平而後清清而後明勿使小欹小欹必傾傾不可收用毀其成嗚呼奉之可不兢兢四言銘聦明勇健之謂才忠信孝友之謂行正直中和之謂德深逺髙大之謂道修己箴三首勇箴何爲而正致誠則正何爲而勇蹈正則勇孟賁之材心動則回臨義不疑嗚呼勇哉逸箴百仞之木生本秋毫德隳於惰名立於勞宴安之娱窮乎一晝德著名成億年不朽可貪非道可愛非時没丗無稱君子恥之昔在周公作爲無逸大聖猶然况非其匹友箴余何遊乎余將遊聖之門仁之里非聖不師非仁不友可乎未可不若遊衆人之場聞善而遷觀過而改顔樂亭頌并序周翰孔子四十七丗孫名宗翰邦直李清臣也孔子舊宅東北可百歩有井魯人以爲昔顔氏之居也周翰思其人買其地犯御名亭其上命曰顔樂邦直爲之銘其言顔子之志盡矣無以加矣子瞻論韓子以在隱約而平寛爲哲人之細事以爲君子之於人必於其小焉觀之光謂韓子以三書抵宰相求官與于襄陽書謂先逹後進之士玄爲前後以相推援如市賈然以求朝夕芻犬僕賃之資又好恱人以銘誌而受其金觀其文知其志其汲汲於冨貴戚戚於貧賤如此彼又烏知顔子之所爲哉夫嵗寒然後知松柏之後彫士貧賤然後見其志此固哲人之所難故孔子稱之而韓子以爲細事韓子能之乎光實何人敢評先賢之得失聊因子瞻之言申而盡之頌曰貧而無怨難顔子在陋巷飲一瓢食一簞能固其守不戚而安此德之所以完原命子罕言命子貢稱夫子之文章可得而聞也夫子之言性與天道不可得而聞也是則天道精微非聖人莫能知今學者未能通人理之萬一而遽從事於天是猶未甞操舟而欲渉海不䧟溺者其幾矣昔眭孟知有王者興於微賤而不知孝宣乃欲求公孫氏擅以天下翼奉知漢有中衰阨㑹之象而不知王莽乃云洪水爲災西門君惠知劉秀當爲天子而不知光武乃謀立國師公劉秀秀亦更名以應之劉靈助知三月當入定州四月爾朱氏滅而不知滅尓朱者爲齊神武入定州者乃其首也此五子者其於術可謂精矣皆無益於事而身爲戮没又况下此者哉夫天道窅㝠恍愡若有若亡雖以端兆示人而不可盡知也非天下之至神其孰能與於此是以聖人之教治人而不治天知人而不知天春秋記異而說不書唯恐民冒没猖狂以趨於亂也說玄余少之時聞玄之名而不獲見獨觀雄之自序稱玄盛矣及班固爲雄傳則曰劉歆甞觀玄謂雄曰空自苦今學者有禄利然尚不能明易又如玄何吾恐後人用覆醬瓿也雄笑而不應諸儒或譏以爲雄非聖人而作經猶春秋呉楚之君僣号稱王蓋誅絶之罪也固存此言則固之意雖愈於歆亦未謂玄之善如雄所云也余亦私怪雄不賛易而别爲玄易之道其於天人之緼備矣而雄豈有以加之迺更爲一書且不知其焉所用之故亦不謂雄冝爲玄也及長學易苦其幽奥難知以爲玄者賢人之書校於易其義必淺其文必易夫登喬山者必踐於坱埤適滄海者必㳂於江漢故願先從事於玄以漸而進於易庻幾乎其可跋而望也於是求之積年始得觀之𥘉則溟涬漫漶略不可入迺研精易慮屏人事而讀之数十過參以首尾稍得闚其梗槩然後喟然置書嘆曰嗚呼楊子雲真大儒者邪孔子旣没知聖人之道者非子雲而誰孟與荀殆不足擬况其餘乎觀玄之書昭則極於人幽則盡於神大則包宇宙小則入毛髮合天地人之道以爲一刮其根本示人所出胎育萬物而兼爲之母若地履之而不可窮也若海挹之而不可竭也蓋天下之道雖有善者蔑以易此矣考之於渾元之𥘉而玄已生察之於當今而玄非不行窮之於天地之季而玄不可亡叩之以万物之情而不漏測之以鬼神之狀而不違槩之以六經之言而不悖藉使聖人復生視玄必釋然而笑以爲得己之心矣乃知玄者所以賛易也非别爲書以與易角逐也何歆固知之之淺而過之之深也或曰易之法與玄異雄不遵易而自爲之制安在其賛易乎且如與易同道則旣有易矣何以玄爲曰夫畋者所以爲禽也網而得之與弋而得之何異書者所以爲道也易網也玄弋也何害不旣設網而使弋者爲之助乎子之求道亦膠矣且楊子作法言所以准論語作玄所以准易子不廢法言而欲廢玄不亦惑乎夫法言與論語之道庸有異乎玄之於易亦然大厦將傾一木扶之不若衆木扶之之爲固也大道將晦一書辨之不若衆書辨之之爲明也學者能專精於易誠足矣然易天也玄者所以爲之階也子將升天而廢其階乎先儒爲玄解者誠巳善矣然子雲爲文旣多訓詁指趣幽還而玄又其難知者也故今疑先儒之解未能盡契子雲之志丗必有能通之者比老終且學焉述國語先儒多怪左丘明旣傳春秋又作國語爲之說者多矣皆未通也先君以爲丘明將傳春秋乃先采集列國之史國别分之取其菁英者爲春秋傳而先所采集列國因序事過詳不若春秋傳之簡直精明渾厚遒峻也又多駮雜不粹之文誠由列國之史學有薄厚才有淺深不能醇一故也不然丘明作此複重之書何爲邪然所載皆國家大節興亡之本柳宗元邪佞之人智識淺短豈足以窺望古君子藩籬而妄著一書以非之竊懼後之學者惑於宗元之言而簡棄此書故述其所益以張之四言銘系述迃叟爲四言銘見者忽之曰老生常談耳故有系述孔子稱才難夫才者所受於天非人所能強也故推十合一曰士千人曰俊萬人曰傑岀於其類抜於其萃此其所以難也聞言易悟曰聦睹事易辨曰明敢爲不懼曰勇強力不屈曰徤有是四者才則美矣然未足恃也自古恃才而不勤德行以殺身䘮家亡國者踵相及也彼皆天之所與非已之所爲又奚足以驕人哉君子則不然有其才必思美其行以成之盡心於人曰忠不欺於已曰信善父母曰孝善兄弟曰友夫孝友百行之先而後於忠信何也苟孝友而不忠信則非孝友矣能是四者行則美矣未及於德也正直爲正正曲爲直適冝爲中交泰爲和正直非中和不行中和非正直不立若寒暑之相濟隂陽之相成也夫察目睫者不能見百歩瞻百歩者亦不能見目睫均是德也執其近小而遺其逺大守其卑淺而忘其髙深是猶不免爲小人焉故君子好學不厭自強不息推之使逺廓之使大聳之使髙研之使深發于心形于身𥙿于家施于國格于上下被于四表雖堯舜周孔莫不本於是矣嗚呼捨是而云道者皆不足學也温國文正公文集卷第六十八
