  text: 温國文正公文集卷第四
  hash: sha256:00625ab92854080de2dcbcfaec0b2347129206fd55ca5b04a0fd55f8a2f80f40
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_004-1a}
body:
  text: 古詩和勝之雪霽借馬入局偶書齊山詩呈王學士晳字散之吹簫和始平公見寄八韻又和并寄楊樂道十二韻朝雞贈樂道謝始平公以近詩一卷賜示早春戯作詩呈景仁進詩表瞻彼南山詩夏夜和景仁西圻野老詩種竹介甫作巫山髙命光屬和勉率成篇眞不知量昔子嘗宰韋城今重過之二十五年矣慨然有懷秋懷呈景仁又和秋懷贈道士陳景元酒景仁召飲東園呈彦升次道君錫才元子容花庵詩寄邵堯夫時在西京留臺𪠘舍東新開小園無亭榭乃治木揷竹多種酴醿寳相及牽牛扁豆諸蔓延之物使蒙羃其上如棟宇之狀以爲逰渉休息之所名曰花庵康定中余過洛橋南得詩兩句於今三十二年矣再過其處足成一章寳鑑貽開叔謝王道濟恵古詩古石器夀安雜詩十首噴玉泉神林谷二首遊神林谷寄邵堯夫靈山寺流泉且逰永濟渡靈山寺藏珠石疊石溪東山下有墜石衘圎徑二尺餘其崖上脫處猶存君貺垂示嵩山祈雪詩十章合爲一篇以酬之酬仲庶終南山詩酬永樂劉祕校庚四洞詩枤栢寄傅欽之獨樂園七題讀書堂釣魚庵采藥圃見山臺弄水軒種竹齋澆花亭和勝之雪霽借馬入局偶書勝之家本公侯貴弱冠英才已驚世雒陽多士誰敢倫千古比肩唯賈誼昔遭絳灌深切齒奔走十年爲下吏近方抆拭出泥塗稍學和光匿鋒銳㑹計之官豈足爲黽勉簿書聊自庇王城九衢臘月尾風雪數朝窮恣睢櫪間款段疲且病借馬扵人亦披曳揚鞭掣轡趨省廷刺蹙不前泥沒鼻慨然遂有勞者歌滿紙雄文欻軒輕人生榮遇有早晚視此錙銖勿關意况君卓犖高出群異日青雲終自致鮮車大盖擁驊騮莫忘今朝乗小駟齊山詩呈王學士晢字微之江上有奇山群峯矗如翦昔聞齊刺史置酒升絶巘其人有惠政嘉名自兹逺君来踵其迹詞牒日清蕳驪駒時入谷勝地窮搜選問俗復懷人非徒事逰衍吹簫古人吹簫者以和虞韶聲後世不復貴給喪仍賣餳和始平公見寄八韻嚮来從後車雍容鎭藩垣政成簿書簡終日侍清樽今兹俻言職不得登朱門違離詎幾時風色變寒温忽聆吉甫什穆如承話言安得六翮生随意逺飛翻垂耳倦新覊蹀足思華軒諒無伯樂顧疲勞安敢論又和并寄楊樂道十二韻聖主樂忠諫曲從如轉圜玉色粹陽春至仁生自然所慙群臣愚無以稱䦕延賤生何為者側足青規前頑石不可錬安能補高天狂蕳昧大體所依官長賢有如驂之靷左右随周旋庶幾助山甫衮職無尤愆緬思老成人阻親函丈筵豈不寸心勞動為纏徽牽何當執夀巵跪起得差肩相顧藐無期瞻望徒悁悁朝雞贈王樂道小雞距短雙翅垂廣場勇鬪無所施清暁長鳴獨先衆朝者恃此能知時星河滿天月光白東望扶桑悄無色一聲高舉耳目醒四逺群隂俱辟易陋巷人疎烟火稀永夜沈沈鍾鼓微聞之徐起就盥櫛顛倒不復憂裳衣君家逈居北城曲阿閣嶕嶢日鳴玉蕭蕭風雨得司晨不使無功啄君粟謝始平公以近詩一卷賜示皇家駿命承蒼穹烝民之傑生維嵩聖賢會合若符契坐致四海登熈隆三階清平九鼎重指麾拱揖安華戎人情誰不樂将相往往皓首忘疲癃北平飲乳尚懷印千秋乗車猶入宫唯公致政年甫至耳目眀利志氣充幡然脫去萬鍾禄羽儀高逺如翔鴻靈臺不復絓塵務至徳恬淡含黄中英華純粹積不發事業轉為文字工大篇短韻間金石遠追吉甫流清風刻雕衆物非用意黙與元化參神功應劉鮑謝事奇巧細瑣豈足誇才雄祼圭夷玉清廟器肯與環玦爭玲瓏絳悵生徒東閤客㣲官拘縶如樊籠言詩何敢望商賜幸得誦詠祛童蒙昏花病目不自惜服膺盥手書一通千金之産不可易子孫寳蓄傳無窮早春戲作呈范景仁閏餘春意早卉木先有思嚶嚶群鳥翔東西各求類伊予忝諌垣動息抱憂悸衮職曠不補言責眞可畏况禁過從陋巷若囚繫茅茨庇風雨偏隘無餘地時於壞垣隙歴歴生新薺君侯乃比鄰跬歩難自致常思去歳初西軒習歌吹座客皆故人歡笑無拘忌平生不喜酒是日成爛醉豈言長揖歸良㑹難再值東風忽復来時華一何駛叢竹固無恙夭桃作花未朝廷正清明詎肯容竊位何當遂廢放歡飲還自恣進詩表臣光言臣聞天尊地卑道之常也而乾下坤上謂之泰豈非陽不下隂則無以行其施君不交臣則無以得其心是以詩人歌頌其君之徳多稱飲食飫燕之豐鐘鼔筦磬之樂車服旌旂之盛幣帛錫予之多蓋以君臣兄弟朋友之際舍此無以相交也雖然人君不以誠心加之則此四者雖美無益也故鹿鳴曰我有旨酒以燕樂嘉賔之心彤弓曰我有嘉賓中心貺之此言君臣之恩不由外来也中謝伏見體天法道欽文聦武聖神孝徳皇帝陛下以十二月二十三日二十七日再幸天章閣悉召宰輔侍從之臣偏觀瑞物及先帝御書御集又幸寳文閣親為飛白書并御墨紙筆以賜群臣又賦詩命群臣屬和又幸群玉殿置酒作樂比暮而罷其酒醪殽蔌羅花金噐多出禁中於二十七日仍面喻群臣以前日之燕辦扵造次未盡朕心故欲重與卿等為樂今天下方無事毋惜盡醉以稱朕意是日凡爲燕之具又加厚扵前其所以勞徕存撫羣臣莫非出扵陛下之志者是以羣臣膏沐寵光𬒳服徳音薰蒸條鬯浹扵肌膚淪扵骨髓固不待飲食而先醉飽矣退而詠歌聖徳流布四方聞者無不咨嗟歎息以為陛下之扵羣臣可為無負而羣臣實負陛下多矣苟有可以死扵其軄補益萬分莫敢愛也中謝竊以群臣前後受陛下爵位廩禄饗燕賜予固巳多矣未有如今日之歡欣感激深厚切至上下如一者其故何㢤此非外物豐衍所能致也正由陛下加之誠心而巳矣陛下方将推廣此心以被天下至於朝廷之政進賢退不肖賞善罰惡無不盡誠以求之臣見四海之内如殿堂之上無不沈酣於茂恩饜飫扵盛徳矣不勝鼔舞抃蹈之至謹成瞻彼南山詩七章隨表上進文采鄙野不自揣度羞汚盛時伏惟陛下察其狂簡而裁其罪罰焉瞻彼南山詩瞻彼南山有梌有堂維葉牂牂君子之燕籩豆洋洋鼎爼將將百羞阜昌上下樂康邦家之光君子萬年撫有四荒受禄無疆瞻彼南山有椐有栩維葉湑湑君子之燕清酒有藇壷樽有楚酌言賜之命之釂之上下以序君子萬年永綏兆民受天之祜瞻彼南山有𣏌有樅維葉逢逢君子之燕管絲􅗳􅗳奏鼔􅣨􅣨自堂徂庭上下肅雍靡有不恭君子萬年令徳髙明髙明有融赫赫明明天命有嚴命我祖考九土是監倭馯之東蠻蜑之南享獻有時靡敢不詹閟兹餘文複閣巖巖萬世是承四方是瞻帝曰卿士左右之臣四方無虞矜爾之勤式觀且逰從予一人于壼于閎于堂于陳金石之符翰墨之珍匪予汝夸祖考之勲多士庶尹羣公百辟拜手稽首答揚休徳旣醉旣飽御名思爾職罔顧爾私㒺愛爾力惇忠祇敕永奉丕則立民之極載祀千億夏夜溽暑鬱不開矗矗雲萬疊長風卷地來涷雨不濡葉雖無潤物功凉冷得所愜須臾號怒息清月照璧頰小冠簪短髪衣裾輕獵獵欹傾依曲几暫爾蘇疲􅒒坐乆不思眠草間㣲露浥和范景仁西圻野老西郊廣路浮壤黄上天雨泣寒雲蒼鸞旗門㦸紛晻靄扈從威神歸帝郷田家老父眉睫白杖藜匍匐泣露旁且云生逢至仁主蠲租罷役歳為常𧖟收百箔桑蔽野麻麥極望無邉疆去年翠華出賽雨錦繡綿絡墟里光拜迎六馬負縑帛孫扶嫗接歸揚揚自分謳歌畢餘景一朝縞素安可防哀聲澒洞徹四極草木慘淡顔色傷螻蟻衰齡不足贖淚如飛雪空霑裳河縈洛貫嵩峯足泉底寰瀛日月長羡門已閉屬車返軛上空瞻金鳳凰種竹種竹南牆隂竹生皆北嚮苟非陽在北竹性安可強乃知就陽意草木皆有情園葵最柔弱獨取傾心名介甫作巫山髙命光屬和勉率成篇眞不知量巫山髙巫山之髙髙不極寒江西来曵練長群峰森羅十二㦸清狖悲號裂翠崖老蛟怒闘摧丹壁輕生重利三巴客一葉直衝髙浪白船頭吟嘯坐自如仰視長天不盈尺叢祠象設儼山椒巫祝紛紛非一朝云是高唐神女之所䖏至今暮雨常蕭蕭我聞神理眀且直興亡唯觀惡與徳安肯来從楚國君慿依夢寐爲淫昬襄王之心自荒惑引領日望陽臺雲獨不思懐王西行不復返甲光照地屯秦軍蠺食黔中下荆門陵園宗廟皆焼焚社稷飄零不復存嗟嗟若敖蚡冒将篳路藍縷皆辛勤昔予嘗權宰韋城今重過之二十五年矣慨然有懐二十五年南北走遺􅋢寂然民記否昔日嬰兒今壮夫昔日壯夫今老叟秋懐呈景仁草木正蕃廡孰知天地秋况兹宿雨餘景氣益和柔消揺愧簪紱夢想懷林丘兹志乆木果素髪今巳稠仰視白日光浩蕩浮雲流安得黄鵠羽陵風千里逰又和秋懐疇昔共登仕爾来三十秋常晞絲繩直竊耻鴟夷柔蹄涔學鉅海螘垤依崇丘行之不自疑親寡憎怨稠於今不亟去淪胥恐同流努力買良田逺追沮溺逰贈道士陳景元酒籬根委餘菊堦角擁殘葉清言乆不悒何以慰疲􅒒朋樽涵太和高興雅所愜誰云居室逺風味自可接景仁召飲東園呈彦升次道君錫才元子容去冬辱嘉招寒風方贔屭今秋侍髙宴晴日正澄麗雖無花蘤繁且有丘樊思雖無山泉樂蹔違塵土氣僕休散城邑馬縦脫羈轡讙呼笑言適散誕冠帶棄殊勝禁掖嚴進止有常地花菴詩寄邵尭夫時在西亰留臺廨舎東新開小園無高榭乃治木揷竹多種酴醿寳相及牽牛扁豆諸蔓延之物使蒙羃其上如棟宇之狀以爲逰渉休所名曰花菴洛陽四時常有花雨晴顔色秋更好誰能相與共此樂坐對年華不知老自然天物勝人爲萬葉無風緑四垂猶恨簮紳未離俗荷衣蕙帶始相冝康㝎中予過洛橋南得詩两句於今三十二年矣再過其䖏作成一章銅駝陌上桃花紅洛陽無䖏無春風重来羞見水中影鬢毛蕭颯如秋蓬寳鑑貽開叔流塵集寳鑑塵昏鑑不昏纎泥落清水泥渾非水渾人能辨二物相與自忘言二物不能辨悠悠何足論無爲捨其内逐和取煩冤謝王道濟惠古詩古石噐緱氏古城裏好道王道濟作詩有古風讀書知古意朝来遣㒒夫遺我古石噐結從天地𥘉生自一拳際工倕創規摹般輸施剞劂㵸茗北窓下坐有羲皇思嗟予性迂鄙齟齬居今世忝官汚臺省曽無益時智退蔵又濡滯尚不離朝市闕地避煩暑頗與營窟類新搆西齋中鑿地為室謂之凉洞誠非古人比拜賜得無媿壽安雜詩十首噴玉泉蒼崖雙起秋雲齊亂峯迸出如攅犀石棱澁不容馬蹄下馬歩入荆榛谿瀑泉沃雪拖白霓落潭横引成清溪老木長藤咫尺迷興䦨欲出忘東西神林谷二首石下泉聲蔓草深石上露濃蒼蘚徧山禽驚起飛且鳴葉墜空林人不見雞幘竒峯雲外橫青壁千尋不可上却羡樵兒輕險峡腰䋲操斧長来往逰神林谷寄邵尭夫山人有山未嘗逰俗客逺来仍乆留白雲滿眼望不見可惜冝陽一片秋靈山寺流泉去寺猶一里隔林聞水聲安知客乗興山下遠相迎且逰逰人戀山水日晏澹忘歸但愛雲烟好那知㒒馬飢永濟渡洛水寒可􅍱長汀栁飛葉莭物先無期自與幽懐愜清波見白鷗靜林聞啄木泉細入平沙雲閑出幽谷靈山寺神林興盡謀早歸草間露裛行徑微怱思靈山去不逺馬首欲東還向西垂鞭縦轡尋山足洛水逶迤過數曲漸聞林下飛泉鳴未到已覺神骨清入門拂去衣上土先愛娑羅隂滿庭庭下雙渠走清澈羅縠成紋日光徹寒聲淅􅅹入肝髄亂影彯蕭動毛髪寺憎引我觀泉源堂東周迴百步寛碧頗梨色湛無底想像必有虬龍蟠泉南髙山名鳯翅宛轉抱泉張逺勢岸旁脩竹踰萬竿颯颯長含風雨氣寺門下望情豁然桑柘紛披滿一川嵩高女几列左右王屋大行来掌前昔爲孔氏懸泉荘巖洞猶存荆棘荒到今其下多恠石蹲豹攫争軒昂嗟予歸来苦不早汩沒朝市行欲老捫蘿躡屣須數逰筋力支離難自保蔵珠石疊石溪東山下有墜石銜丸往二尺餘其崖上脫䖏猶存水齧東山根土色渥如丹危峯忽摧脫半崖銜石丸隂陽昔融結神化不可原𥘉疑偓佺養靈藥魑魅觸之無故落又疑蛟龍伏巨卵雷電擊之從此㫁或者女媧補天餘却下青冥遺耳珠不然盤古戲爲樂聊取天弧彈朱雀物理萬状終難知巧心推求徒自疲不如引客坐石上好竒且醉手中巵獨樂園七題讀書堂吾􅋢董仲舒窮經守幽獨所居雖有園三年不逰目邪說逺去耳聖言飽充腹發策登漢庭百家始消伏釣魚庵吾愛嚴子陵羊裘釣石瀨萬乗雖故人訪求失所在三旌豈易貴不足易其介奈何夸毗子斗禄窮百態采藥圃吾愛韓伯休采藥賣都市有心安可欺所以價不二如何彼女子已復知姓字驚起入窮山深畏名爲累見山臺吾愛陶淵眀拂衣遂長往手辭梁主命犧牛憚金鞅愛君心豈忘居山神可飬輕舉向千齡髙風猶尚想弄水軒吾愛杜牧之氣調本髙逸結亭侵水際揮弄消永日洗硯可抄詩泛觴冝促膝莫取濯冠纓紅塵汙清質種竹齋吾愛王子猷借宅亦種竹一日不可無蕭洒常在目雪霜徒自白柯葉不改緑殊勝石季倫珊瑚滿金谷澆花亭吾愛白樂天退身家履道釀酒酒𥘉熟澆花花正好作詩邀賔朋欄邉長醉倒至今傳畫圗風流稱九老温國文正公文集卷第四
