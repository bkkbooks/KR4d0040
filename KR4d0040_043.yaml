  text: 溫國文正公文集卷第四十三
  hash: sha256:6b01f8500a47a17a7d6f56e5236530c8d96e40aeec6b6a8cff17ccbaa53ba311
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_043-1a}
body:
  text: 章奏二十八請自擇臺諌劄子論李定劄子貼黃諫西征疏乞罷修腹內城壁樓櫓及器械狀乞不添屯軍馬請自擇臺諫劄子臣竊見近日臺諫官言制置三司條例司害民及吕惠卿姦邪者率𬒳責降或更加以惡名如吕公著告辝云乃誣方鎮有除惡之謀中外聞者無不駭愕臣竊惟朝廷之意無它止欲懲戒來者使不敢復言耳國家置臺諫官以為天子耳目唯恐政事有闕失百姓有疾苦大臣專恣左右姦邪天子深居九重不能得聞故也今臺諫官稍有懷剛直之志畏天下公議憂念朝廷哀憫百姓忤犯大臣刺譏左右者陛下輒罪而逐之更使大臣自擇所親以代其任萬一又為公論則又逐之是必得庸懦阿諛不知廉恥附下罔上背公死黨之人然後止耳若言路皆此等之人則禁闥之外陛下耳目之所不及者雖有至大之事迫切之禍陛下何從知之如此豈宗廟社稷之福也晏子曰君所謂可臣亦曰可君所謂否臣亦曰否若以水濟水誰能食之今陛下使大臣自擇臺諫官又取自於己者存之異於己者去之然則陛下獨與大臣為天下足矣何必更置臺諫官也且條例司之害民吕惠卿之姦邪天下之人誰不知之獨陛下與王安石未之寤耳豈可更為之黜逐臺諫以長其威福成其氣勢臣竊為陛下寒心今臺諫官巳被逐者臣不敢留唯願陛下自擇公正剛直者布之言路以明四目逹四聰勿使為群下所欺蔽則天下幸甚臣受陛下過分之恩不敢塞默雖死怨讎之手猶賢於竊祿偷生者也取進止論李定劄子臣竊見近者朝廷除秀州推官李定為監察御史裏行知制誥李大臨蘇頌等纍次封還詞頭數日來外間皆言朝廷巳為之寢罷今日復聞劄下舍人院須令草詞臣竊意朝廷知大臨等既纍次封還詞頭今復草之則為反覆必難奉詔因欲以違命之罪罪之使今後凡朝廷所行政令群下無敢立異者若果如此則百執事之人自非偷合苟容者皆不得立於朝政令或有得失陛下復何從知之晏嬰所謂以水濟水賈山引秦之季丗以戒漢文帝者正患其如此耳前論逐臺諫官今又論大臨等非敢私此數人正為國家惜言路之絶耳伏望陛下審思愼行之勿使聰明遂壅蔽則天下幸甚取進止貼黃國家不次用人固無常法然必使衆心厭服然後為美是以堯舜非不聰明也其命官皆先謀嶽牧既衆言僉同復明試以功而後用之故舉不失能而上下雍熙也臣素不識李定實不知其行能何如陛下果知其賢何不且試之以漸俟其功效顯著衆皆知之然後不次拔用則誰曰不可何必今日與臣下力校勝負殆非人君廣大之體也諫西征疏月日具位臣光謹昧死再拜上疏皇帝陛下臣以不材誤承朝廷委用待罪長安兼領一路十州兵民大柄朝辭之日伏蒙陛下靣諭以凡邊防事機及朝廷得失有所聞見令一一奏聞臣受命以來且愧且懼所愧者聖知深厚責任至重所懼者智識淺短無以堪稱夙夜疚心不敢寧居臣自入境以來見流移之民道路相望詢訪閭里皆云今夏大旱禾苗枯瘁河渭以北絶無所收獨南山之下稍有所存而入秋霖雨經月不霽禾雖有穗往往無實雖有實往往無米雖有米率皆細黑一斗之粟舂簸之後不過得米三四升榖價踊貴民間纍年困於科調素無蓄積不能相瞻以此須至分房減口就食西京襄鄧啇􅉑等州或傭賃客作或燒炭采薪或乞丐剽竊以度朝夕當此之際國家惟冝鎮之以靜省息諸事減節用度則租稅自輕繇役自少逋負自寬科率自止四患既除民力自足民財自饒閭里自安流亡自還固不待陛下憂勤於中宰相劬勞於外然後人人得其所也苟或不然國家雖欲輕租稅寬逋負其所費之財何由可得雖欲少繇役止科率其所管之事何由可成四患不除雖日下恩澤之詔民猶不免於流移轉死也蓋欲止沸者莫若絶薪欲安民者莫若省事此目前之驗非難知也臣到官以來伏見朝廷及宣撫等司指揮分義勇作四畨欲令以次於緣邊戍守選諸軍驍鋭及募閭里惡少以為竒兵造乾糧皺飯布囊力車以備餽運悉取嵗賜秉常之物散給緣邊諸路又竭內地府庫甲兵財物以助之且以永興一路言之所發人馬甲八千副錢九万貫銀二万三千兩銀碗六千枚其餘細瑣之物不可勝數動皆迫以軍期上下相驅急於星火官吏狼狽下民驚疑皆云國家將以今春大舉六師長驅深入以討秉常之罪臣以踈賤不得預聞廟堂之議未知兹事為虛為實昨者親承德音以為方今邊計惟冝謹嚴守備俟其入冦則堅壁清野使之來無所得兵疲食盡可以坐收其弊臣退而思念聖謀髙逺深得王者御戎狄之道實天下之福及到關中乃見凡百處置皆為出征調度臣不知有司在外不諭聖意以致有此張皇將陛下默運神算不令愚賤之臣得聞其實也臣不勝惶惑晝則忘食夜則廢寢心寒股栗竊為陛下危之夫兵者凶器聖人不得巳而用之自古以來國家冨彊將良卒精因人主好戰不巳以致危亂者多矣况今公私困竭將愚卒懦乃欲驅之塞外以捕狡悍之虜其無功必矣豈惟無功兼後患甚多不可盡言也若朝廷𥘉無出征之意則何為坐散府庫之財疲生民之力訖無分毫之事萬一將來虜騎入冦府庫巳竭民力巳困將何以禦之臣先任御史中丞日朝廷將興綏州之役臣曽上言國家先當舉百職修庶政安百姓實倉庫選將帥立軍法練士卒精器械八事皆備然後可以征伐四夷今此八事未有一者勝於曩時而况關中饑饉十室九空為賊盜者紛紛巳多縣官倉庫之積所餘無幾乃欲輕動大衆橫挑猛敵此臣之所大懼也或者又云國家未討秉常先欲試兵誅一小族若果如此猶為不可何則今者竭關中之財力大興師衆乃捨有罪之強寇誅無事之小種勝之不武不勝為笑將無以復號令戎狄矣此二䇿者皆為不可伏望陛下深鍳安危之機消之於未萌救之於未形速下明詔撫諭關中之民以朝廷不為出征之計其義勇更不分畨於緣邊戍守亦不選募竒兵凡諸調發為饋運之具者悉令停罷愛惜內地倉庫之儲以備春深賙救饑窮之人如此豈惟生民之幸亦社稷之福也臣不勝憂迫直輸赤誠惟陛下裁察臣光昧死再拜上疏乞罷修腹內城壁樓櫓及器械狀三日上尋得旨依奏准熙寧三年十一月𥘉七日准樞密院劄子節文檢㑹近為麟府路豐州及外堡寨官吏弛慢不職不修完城池樓櫓器甲等已奉聖旨降官等第斷遣及劄與三路轉運司遍牒轄下㳂邊州軍知委去訖近又壉陜西路提刑宣撫司奏華州甲仗庫弓弩不堪蓋是監官并夲州官貟全不用心點撿有誤緩急使用其鈐轄盧戭坐受優俸空占當直兵士略不營職朝廷巳令鄜延路經略司舉官差替盧戭其華州甲庫弓弩不堪夲州當職官貟全不用心點檢仍宣撫司差官取勘聞奏切慮諸路亦有不修完城壁器甲等去處奉聖旨令河東河北陜西經略安撫司指揮轄下州軍委長吏子細點檢須管日近修完城壁樓櫓堅固器甲精利如將來朝廷專差官點檢得却有未修城壁樓櫓器甲等其應干官吏必當依此重行斷遣劄付夲司者尋依准朝旨行下夲路諸州軍施行近准􅉑州申州司勘㑹夲州雖係陜西路即不係近邊州軍其州城從來並不曽有敵樓戰棚為自來霖雨損壞摧搨及無兵功纍年不曽修築今來亦不敢專擅役夫修築巳牒在城兵馬都監吕士宣重行撿計損壞城邑去處才候撿計到合使人功物料别具狀供申乞差兵夫次及據解州申准兵馬監押狀申准州牒備録到安撫使司牒內坐到聖旨指揮修完城壁樓櫓等尋將帶壕寨木匠作頭等檢計外羅城靣上只有更屋二十三座並係年深倒搨及城壁墜倒久來亦不曽泥𥙷修完伏乞據狀申上衙乞差官計料修城人工及創添樓櫓兔致將來朝廷差官檢視見並不修完城壁及創蓋樓櫓虛負責降停替州司勘㑹舊來城上並無樓櫓即目城靣上闊處只及四五尺已來今若指揮使行創造又緣合使人工材料數目不少今來未敢專檀創修伏候指揮右謹具如前勘㑹管下永興等一十州軍城壁內有久來巳行安置樓櫓完備亦有城壁低下薄怯全未有樓櫓去處其逐州官吏既准上項朝旨及見麟府豐州官吏以不修完城壁樓櫓器甲降官等第斷遣并華州官吏差替取勘仍恐朝廷非時差官點檢例各畏懼爭欲日近興功完葺以避譴責伏緣營造樓櫓須藉城基厚闊方可安置今來解􅉑兩州城壁皆稱闊處只及四五尺似此之類須是先貼築城基方可創修樓櫓若非大假興功無以辦濟况今夲路州軍全闕廂軍應急差使官庫亦闕見錢收買材料若是差役人夫配率材料又緣陜西州軍已是去歲夏麥薄收秋苗旱損當此饑䭚人户流移之際若更如此差擾必是轉難存濟兼永興軍一路州軍盡在腹裏去㳂邊絶逺設若蕃賊入冦亦未能便到逐州軍城下其樓櫓修下數年不用不免損壞今來若盡令與㳂邊州軍一例須管日近修完城壁樓櫓堅固器甲精利顯見官私虛有勞費欲乞朝廷特降指揮其㳂邊及次邊州軍即一依近降朝旨修完所有腹內州軍城壁樓櫓並候將來豐熟以漸營葺其器甲即據不堪數目逐旋勒作院人匠依程課修整務令精利所貴公私皆得辦濟乞不添屯軍馬今月七日准熙寧三年十二月二十九日陜西河東路宣撫使司劄子夲司近已具奏聞乞於永興軍邠州河中府三州軍易得糧草之處别添屯軍馬選差將官專切訓練逐路不得句抽專聽宣撫司莭制內一項乞於永興軍駐劄兵馬差夲司准備差使莊宅使趙瑜充永興軍路都鈐轄與知府專管訓練者右具如前臣勘㑹永興軍所管今年正月一日見在軍糧粗細色斛斗共三十六萬九千七百石二斗四升據即目夲府見駐泊及就糧并夲城兵貟糧食及官僚請俸等共約支得向去一十七箇月半馬料三萬七千六百五十二石四斗二升約支得向去一十五箇月有餘稈草四十萬六千二百二十二束約支得一十三箇月半有餘此只是據見在軍馬約度即不知今來所添屯軍馬計多少數目若只添一倍之時其人糧只約支得八箇月有餘馬料只約支得七箇月有餘稈草只支得六箇月有餘所添更多所費尤廣又先准中書劄子奉聖旨令體量應災傷人戶委的飢乏不能自存者仰撥省倉斛㪷據第四第五以下人户各借二石今勘㑹永興軍諸縣苐四等以下闕食人户約及十餘萬户若每戶支二石共計合支二十餘万石其外縣雖有糧草亦是數目不多更難支充貸糧若並令在府省倉請領又更減却此數即軍糧約支更不及得上項月數况去年陜西經夏大旱入秋霖雨五榖例皆不熟某永興軍放稅多者至七八分即今每㪷白米價錢一百文足稈草每束價錢二十七文足雖差官開場糴買只糴得白米九百餘石稈草全無兼勘㑹軍資庫日近雜支錢盡底支絶准轉運司牒將三司提刑司鹽馬司封椿錢盡數充雜支錢止及四萬貫除支每月料錢及府庫雜使并不住准轉運司牒支撥往㳂邊州軍及應副收買軍期物色見今無錢支與和糴場糴買糧草豈得謂之易得糧草之處臣竊謂大凡添屯軍馬先須約度夲處糧草可以贍養以備今來關中饑饉倉庫空虛贍養舊兵猶恐不足更添新者何以枝梧雖朝廷更於左藏庫內藏庫支撥銀紬絹等降下夲路添助支費亦不免令州縣配賣與百姓轉增貧困况糧草是重滯之物不可從逺處興販得來須夲處土地所生方可計置今饑饉如此雖多積金銀髙估物價令轉運司與州縣多方擘畫其目下所要糧草何由可得况即今民間闕食流移死亡者已為不少諸縣處處申報驚劫若至向前二三月後舊榖巳盡新麥未熟民間必轉更饑乏若官中愛惜倉庫坐視不救竊恐流移轉多死亡轉衆盜賊轉煩深為不便竊以戎狄擾邊手足之疾百姓離散腹心之憂豈可重外輕內逐末忘夲兹事得失所繫不細伏望朝廷先將陜西諸州軍糧草約度合贍得若干軍馬一年支費仍須於十分中量留二三分救濟目下饑民外如有剩數然後據數添屯軍馬若苦無剩數之時伏乞朝廷更不添屯儻以邊鄙未寧須至量添軍馬之時即乞分散往諸州軍就糧各委逐處兵官精加訓練不須聚在永興軍邠州河中府三處更特置都鈐轄三貟候邊事稍定即乞速發遣歸住營處所貴公私稍得辦濟若不如此先約度糧草但務添屯軍馬切恐一旦倉庫俱竭别有不虞至時悔無所及臣職在守藩不敢不言所有先准朝旨令第四等以下人户借支斛㪷二石未審今來支與不支若支與則軍糧轉更不足不支則人户正當饑乏伏願聖慈早降指揮臣不勝迫切之誠溫國文正公文集卷第四十三
