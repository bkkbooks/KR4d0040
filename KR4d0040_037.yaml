body:
  text: 章奏二十二王廣淵第三劄子髙居簡第二劄子髙居簡第三劄子封事劄子髙居簡第四劄子郭昭選劄子帖黃髙居簡第五劄子王中正第一劄子辭賜金第一劄子第二劄子納賜金劄子王中正第二劄子王中正第三劄子石椁劄子王廣淵第三劄子臣前兩次上言王廣淵傾巧姦邪乞盡奪去職名與逺地監當近聞夲人帶職知齊州仍賜章服如此乃是賞之非黜之也嚮使廣淵自改京官以來謹身守分不為姦諂以至今日不過作第二任通判今所得乃如此豈可謂為姦諂無益哉孔子稱唯器與名不可以假人今之章服所謂器也職名所謂名也二者皆無用之物然而天下貴之者為其非賢材則不能得之故也唐宣宗重惜章服不輕以與人有司製緋紫衣以備賜與經年不用三兩領故當時服緋紫者人以為貴夫名器者譬如珠玉若使之易得如瓦礫尚安足貴乎近歲兩次覃恩服緋紫者巳為泛濫今又如陳鑄王廣淵輩皆賜章服是使今後受賜服者皆以為恥不以為榮也且陛下使廣淵出補外官者必巳知其姦邪之迹也今又復以職名章服寵之是勸人使效廣淵所為也臣竊恐非國家之福伏望聖斷依臣前奏盡奪去廣淵職名并此來章服與逺地監當使賞善訓惡皎然明白取進止髙居簡第二劄子臣近曽上言句當御藥院髙居簡工讒善佞乞逺加竄逐未蒙施行昔周公以立政戒成王至虎賁綴衣趣馬小尹左右攜僕百司庶府亦皆擇人穆王命伯冏為太僕正曰昔在文武侍御僕從罔匪正人又曰慎簡乃僚無以巧言令色便辟側媚其惟吉士僕臣正厥后克正僕臣諛厥后自聖自古聖帝明王雖左右小臣未嘗不謹擇端良之人以自防逸豫之生也况陛下嗣膺寶命聖德惟新善惡興襄於此乎分而使讒佞如居簡者旦夕常在左右又寵而信之此乃異日禍亂之根腹心之疾也臣職在去邪不敢不再三上言伏望聖明依祖宗舊制應句當御藥院官至崇班以上者並令出外其髙居簡仍乞逺加竄逐取進止髙居簡苐三劄子臣近曽兩次上言句當御藥院髙居簡工讒善佞乞逺加竄逐至今不蒙降出施行居簡頃在先朝巳竊弄權柄依慿城社玷辱聖明物論洶洶切齒側目及陛下繼統必謂首行誅竄以警邪臣不意居簡狡猾多端先自結於陛下使陛下寵愛信任更過於先帝之時朝廷公忠之士無不憤悶深為陛下惜之方今內侍之臣小心謹慎可以備陛下左右使令者何可勝數陛下足以擇而用之何必違祖宗舊典負天下譏謗獨保護居簡堅如金石臣竊惑之伏望聖慈取臺諌官前後所言居簡文序盡付所司明治其罪以彰至公之義順合衆心其餘句當御藥院者亦乞遵舊制官至內殿崇班以上並授以向外差遣取進止封事劄子臣伏以大舜舉賢敷納以言明試以功漢武帝詳延特起之士待以不次之位終獲其用威加胡越真宗皇帝總覽群臣章奏用其言而顯其身以成咸平景德之治凡察言所以知人知人所以立政自古及今其道一也今陛下即政之𥘉首開言路令中外臣民皆得上封事海內欣欣咸畢精竭思以承休德若於此際能采其嘉謀舉其賢材而用之則太平之基可指日而望也若徒備外飾廢其言而不用棄其人而不取則天下頽弊之事當何時而振起乎臣與張方平先受詔詳定中外所上封事雖巳盡心料簡合於義理可施行者一一奏聞更望陛下擇其精者決自聖意必令行之其有識慮稍出於衆者願陛下特賜召對靣加詢訪考其虛實果有可采密藉姓名遇有差遣隨材授任俟其實有顯效然後不次拔擢如此則嘉言罔攸伏野無遺賢矣取進止髙居簡苐四劄子臣纍日前上殿言句當御藥院髙居簡自先帝時竊弄權柄陛下復寵而信之大為聖德之纍乞治其罪陛下許臣送樞密院施行至今未聞有指揮不知居簡以何道結陛下能如此之深也居簡所能止於讒佞佞者不過巧言令色希意迎合快人主之欲以市其權使人主溺於荒宴而不自知也讒者不過離人君臣間人骨肉惑人主之心以固其恩使人主陷於傾危而不自寤也有是二者又可近乎嚮使陛下即位歲久功業巳成而有讒佞之臣始得幸天下有識者猶當寒心何則知其必為禍亂之階也况今初承大統當鋭精求治之時而遽留居簡於左右仍加寵信根蒂巳牢則異日之憂可勝道哉此臣所以不避死亡而必當力爭者也或聞陛下𣣔待居簡自求引退然後遣去臣誠戇愚未曉所謂若國之大臣耆年有德聞望素髙一旦偶有小失未為外人所知陛下務存終始使自引去以全其名則可矣其挾姦作慝者猶冝明正刑書况居簡閨闥小臣罪惡盈積所冝肆諸市朝宣示四方以戒憸人而尚足為之隱乎且居簡姦邪播聞逺近陛下今日雖為之隱天下耳目庸可蔽乎凡居簡所以能為惡者以其自託宮禁譬如狐鼠依慿城社彼惟恐離去左右豈肯自陳求退乎伏望陛下盡出群臣前後所言居簡事狀送居簡付所司明治其罪以彰至公之道取進止郭昭選劄子臣竊聞陛下嚮時直省官郭昭選等四人近有特旨並除閣門祗候衆言籍籍頗謂僥忝國初草創天步尚艱故祖宗即位之始必拔擢左右之人以為腹心羽翼豈以為永丗之法哉乃遭時不得已而然也自後嗣君守承平之業繼聖考之位亮隂未言之間有司因循踵為故事凡東宫僚吏一槩超遷謂之隨龍以此昭選之徒得自厮役直除班行其為幸已多矣乃敢妄有攀援邀求無巳曽不自省有何功勳小人之心終無厭極不可縱也且閣門祗候祖宗所以蓄養賢才以待任使之地也其班序差遣事事不同譬諸文臣則館閣之流也豈可使厮役之人為之哉况東宫其餘吏卒甚衆苟一人得之則皆有兾望之心此書所謂啓寵納侮者也陛下既承大統則率土之濵誰不為臣而獨私於東宫之人則所與親者至狹矣臣昨除御史中丞𥘉上殿之日首以官人賞罰為言誠以三者致治之夲自上丗以來不易之道也今昭選等以賤隸而叨美職是官不擇人也無橫草之勞而數月之間恩命相繼是無功受賞也姦慝明著如髙居簡等尚保而庇之是有事不罰也陛下始初清明方勵精求治而乃輕其官爵慢其賞罰如此將以興太平之功猶適楚而北轅也今臣所以區區進言者但為陛下惜此而巳所有昭選等新除隱門祗候乞賜追寢取進止帖黃或聞昭選等因告昌王入言得此㫖未知虛的審或如此尤為不可陛下之於昌王但當極其友愛至於官爵刑賞乃陛下政柄須决之聖心昌王亦不當關預陛下亦不當聽從如此則兄弟之恩全君臣之分正矣漢館陶公主為子求郎明帝不許賜錢十萬曰郎官上應列宿出宰百里有非其人民受其殃是以難之彼為其子猶不可况為它人乎髙居簡第五劄子臣聞邪正不可同朝猶氷炭不可同器陛下不知臣不肖使待罪御史中丞臣四次上言勾當御藥院髙居簡工讒善佞不冝寵信置於左右所言無取不蒙省録臣實無顔尚居風憲若陛下以臣為拙直則居簡為姦邪若以居簡為忠良則臣為讒慝臣與居簡勢難兩留况臣守官京師十有一年自先帝時纍曽陳乞外任伏望聖慈罷臣御史中丞除一外任差遣取進止王中正第一劄子臣伏見陛下前者盡罷寄資內臣髙居簡等令補外官中外欣然無不稱頌聖德尋聞復留陳承禮劉有方二人又以王中正勾當御藥院衆頗失望臣竊惟祖宗之意以御藥一職最為親密過供奉官以上輒令罷去者乃以防微杜漸詒謀萬丗憂深思逺誠自古帝王之所不及子孫所冝謹守不可失墜者也近歲以來左右之臣既戀權勢又貪祿位遂求暗理資序豫支俸給名曰寄資以欺誑外人此豈祖宗之意邪今陛下欲振舉紀綱一新治道必當革去久弊一遵正法夫法如隄防常應完固乃得無患一有蟻壤泄之則漸致潰敗不可復救近習之臣朝夕在側因緣祈恩無有窮極不以祖宗舊法制之恐陛下它日亦將厭之也况王中正素聞姦猾頗好招權今處之要職是去一居簡得一居簡也伏望陛下一依前降指揮盡罷寄資者令𥙷外官以成聖德之美别擇內供奉以下朴直廉謹者使勾當御藥院以存祖宗之法取進止辭賜金第一劄子臣先奉勑充山陵儀仗使巳蒙聖恩賜絹一百匹錢二百貫文充盤纏於今月二十九日又降中使賜臣箔金五十兩并銀合重三十兩臣不敢仰違詔旨雖巳奏謝訖然竊聞嘉祐八年永昭陵時不曽有此則例私心惶恐深不自安臣聞人君不行無功之賞則群下勸人臣不受非分之賜則廉恥立今臣等雖五使猶在京城跬步之勞亦未嘗有以何勳效再受重賜况臣職在執憲當抑絶僥幸而身自為之將何以糾正它人其箔金并銀合伏望聖慈許令回納入庫庶使下臣有以自容取進止辭賜金第二劄子臣前日蒙恩賜金五十兩并銀合臣以所賜過厚尋問永昭陵禮儀使范鎮知舊例所無不敢當受遂具奏陳乞許令回納伏蒙聖慈特降中使宣諭令受臣上荷恩遇至深至重螻蟻微命不足為報愧懼流汗無所容措然臣竊聞昔韓昭侯有弊袴命藏之侍者曰君亦不仁者矣不賜左右而藏之昭侯曰吾聞明主愛一嚬一笑嚬有為嚬笑有為笑今袴豈特嚬笑哉吾必侍有功者彼一弊袴猶不可以與無功之人况數十兩之金乎魏太祖之為政有功冝賞不吝千金無功望施分毫不與我太祖太宗之御臣下亦然故能驅駕英豪光啓大業夫明主之不妄賞賜非吝之也誠以賜一無功則天下無功之人皆有徼覬之心有功之人皆懷怨望故也借使一人有功而人主賜之一金無功者不得其有功者必喜何則衆人不得而我獨得之是人主知我之功也其榮多矣如是則智者獻其謀勇者竭其力雖使之赴湯火猶將甘而樂之若有功者賜千金無功者亦賜千金其有功者必不恱何則彼無功而我與之鈞是人主待我無以異於彼也其辱深矣如是則有功者莫不解體誰肯竭其智力觸冒死亡以徇國家之急哉故官爵金帛者人主所以鼓舞群情使之奔走左右而不自知者也然則明王愛一嚬一笑豈為過論哉仁宗皇帝天性寬仁承纍世餘烈府庫充實身雖節儉而好施於人群臣左右貪求無厭賜豫之例因兹浸廣府庫之積日益減耗不幸又於五年之中再遭大喪左藏內藏奉宸庫率皆空竭當此之時舊例所有猶冝鐫减以救其弊况可以例外橫賜無功之人乎且陛下以國用不足之故永厚陵猶遵遺制比永昭陵事事裁減而所賜群臣之物乃更多於永昭之時臣雖小人貪昧財賄揣循此理能自安乎此臣所以夙夜憂惶無以自處者也况府庫之物乃天下萬民之物也自非有功於民者皆不冝得之臣所以仰違詔命堅辭賜物至于再三者非自以飾小廉也乃欲助陛下成治道也伏望聖慈察其誠懇依臣前奏許令將所賜金并銀合回納入庫取進止納賜金劄子臣近以所賜箔金五十兩并銀合三十兩係永昭陵時舊例所無不敢當受奏乞許令回納奉御寶批依奏臣微懇獲伸上荷聖恩無有窮極所有箔金并銀合謹隨劄子進納取進上王中正第二劄子臣竊聞陛下好令內臣采訪外事及問以群臣能否臣愚竊以為非冝陛下內有兩府兩制臺諌外有提轉牧守皆腹心耳目股肱之臣也陛下誠能精擇其人使之各舉其職薦舉賢能糾案姦慝論政事得失述民間利病皆令列於奏牘明白啓陳其有尸祿偷安及挾私欺罔者小則罷黜大則誅竄誰敢不盡公竭誠以承休德如此則天下之事猶一堂之上陛下何患於不知哉今深處九重之內詢於近習之臣采道聽塗說之言納曲躬附耳之奏不驗虛實即行賞罰臣恐讒邪得以逞其愛憎而陛下為之受其譏謗也近聞王中正差往陜西句當公事有知涇州劉渙等曲加諂奉鄜延路鈐轄吳舜臣違失其意俄而渙等進擢舜臣降黜衆人皆言中正所為審或如是則是中正弄權已有明驗今陛下又置之肘腋委以腹心臣恐天下之人將重足一迹而畏之輿金輦璧而奉之矣外議又言山陵禮畢韓琦必求引退兩府當有遷𥙷臣竊慮兩制巳上萬一有無廉恥之人或隂結此屬以求進用者夫以堯之聰明咨于四嶽衆言僉同然後用人猶失之於鯀况可决於近習之口乎凡公忠正直之士必不肯借譽左右以求自售齊威王所以賞即墨大夫而烹阿大夫正謂此也昔漢唐之衰宦官所以能壞亂綱紀傾覆國家者皆由人主與之謀議幃幄進退群臣故也此乃治亂安危之夲不可不察伏望聖慈詳思臣言凡欲知天下之事當詢訪外庭之臣其王中正不可令句當御藥院或姦佞之臣豫設機謀以經營兩府者必不可用則天下幸甚取進止王中正第三劄子臣伏奉手詔莭文問王中正等事得之於何人可密奏來臣以非才誤受陛下聖知擢為御史中丞惟懼曠職孤忝大恩每與賔客語言無不詢訪時事稍有毫髮裨益盛德率皆奏陳此事臣得之賔客前後非止一人誠恐玷纍公朝所以有此論述中正有無此語惟陛下可以知之臣在闕門之外何由知其虛實若其果有此事陛下得以為戒若其無有臣敢避妄言之罪但外人有此論議臣不敢不令陛下知之萬一有益聖明皆微臣之幸也取進止石椁劄子臣伏見永厚陵皇堂卷軬石四重其二重並寄於枋木之上陛下孝心深逺以為異日枋木終歸朽腐石若隕墜於梓宫非便發自聖謀欲為石椁其修奉山陵都護宋守約鈐轄張若水以䇿非已出百端沮難茍欲修飾目前自營私計不為梓宫萬丗之慮為人臣子不忠如此乃敢令石匠作頭供狀稱八月二十七日進入梓宫後連夜造作計二十四時辰了當如蒙别差人定奪却不依今來所定時辰先得了當甘當軍令不詞公列奏牘誑惑朝廷是主掩閉皇堂及虞祭并木主到京之日皆曽改移臣昨充山陵儀仗使目覩內臣黃懷信用夷床􅧣牀等下梓宫數刻之間安厝巳畢乃知守約若水等欺罔聰明輕侮邦憲若不懲戒則不公挾詐之人將何所忌憚伏望陛下治守約若水等罪嚴行責降若升祔畢有赦守約若水等緣修奉山陵得罪特乞不原其黃懷信等冝優與酬奬貴使賞罰明白人知聳畏取進止溫國文正公文集卷第三十七
