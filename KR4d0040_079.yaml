body:
  text: 碑志五殿中丞知商州薛君墓志銘衛尉少卿司馬府君墓表尚書駕部貟外郎司馬府君墓志銘書孫之翰墓志後書孫之翰唐史記後文潞公家廟碑書田諫議碑隂殿中丞知商州薛君墓志銘魏晉之間薛氏始自蜀徙河東有部曲數千家永嘉之亂保河汾以自固厯劉石符氏莫能屈姚秦元魏以來始出仕為公侯卿相者比肩並起入唐尤盛號為甲族然率因逰窅去鄊里惟府君之先至今留居河東唐衰薛氏中微曽祖考諱昉不仕祖考諱允恭贈諌議大夫考諱田樞密直學士右諫議大夫贈太尉其行義功烈皆見于宋宣獻公所為太尉公之碑府君諱儀字式之太尉公之第二子始以父蔭為太廟齋郎又除守將作監主簿太尉公知益州奏府君監鳳翔府啇稅後徙知河東府君年少河東士民皆鄉里長老然素嚴憚府君不敢干以私府君御之亦不失恩義之中以父憂去官服除知鄠縣徙知安邑通判渭州州將武人不能謹廉州大吏郝正者把其隂事招權受賕莫敢詰府君至以正罪惡言于將請治之將內窘私以情告府君曰某止欲去惡吏耳必不使及君將亦知府君不欺即移疾以州事屬府君府君乃發正私出塞市馬收案伏法將不染於辭深德府君且內慙自是悉委事於府君後將知府君賢亦委以事如前將既而某官張君亢除知渭州或謂府君曰君自到渭名雖州佐其實將也張君有材而尚氣到必不為君下彼不可以文法拘也君冝於事一無所與庶幾或免府君喟然嘆曰吾推忠信正直之心以事人豈好犯上而專事邪今張君來吾猶是心也使張君賢必不我怨如其不賢吾獲罪亦命而已矣豈可因人而變其守哉及張君至處事有夫府君力爭如故必當理而後止僚吏皆為之懼張君𥘉無言久之乃於廣坐謂衆曰亢喜忠義與身俱生遇事輒發不能顧慮故數為小人所陷使為亢佐者皆如薛君亢復何患於是聞者皆服張君之賢而重府君之正是時元昊數寇邉覆軍殺將朝廷患之乃命范文正公為鄜延招討使以張君知鄜州為范公之副張公即具奏府君在渭州所以佐已之狀乞移通判鄜州朝廷許之而府君母馮翊郡太君黨氏春秋髙多疾顧戀鄉里不肯隨諸子之官府君之弟用太尉君恩得官河中者適皆罷去府君乃固辭鄜州願監河中鹽稅以便親既得請范公遽上奏曰朝廷從薛某之欲於其私固便然甚非張亢求與共事之意乞以薛某還亢仍為徙其兄若弟鄉里一官以慰其心朝廷即以府君弟俅知河東縣府君鄜州府君不得已之官張君患州大而處勢卑難以待敵欲遷就伏龜山計功數十萬時虜乘勝深入而州無役兵欲以戰士築之衆咸以為難府君獨以為可張君喜曰薛君謂之可事無不成矣役始興而張君病失音府君外備寇敵內董役事人不知張君之病也城成民至今賴之歲餘徙知深州遭母憂服除知啇州慶曆八年閏月庚戌終于州廨年五十一先是屬縣宰有建言商山産銅請置監鑄錢朝廷下其議轉運使有是之者府君上言朝廷前置阜民監于州境洪崖冶鑄鐵錢未數年鐵已竭其監當廢况又益置銅錢監銅産尤薄恐徒勞費無益請以所得銅于舊監鑄錢銅竭而止章久上久不決會府君沒宰之説遂行縣官之費甚廣而銅尋竭如府君言宰坐抵罪府君居家孝友自幼能屬文始習律賦語意即髙竒驚人然不肯從進士舉嘗著蓼蟲賦以刺世之嗜外物而忘其苦者又以為事之當御名者莫若言動交修名乃著五御名文以自警觀是二文足以知其旨趣矣𥘉娶唐氏天章閣待制肅之女生一女適殿中丞趙士寧又娶劉氏左諌議大夫綜之孫又娶李氏直集賢院建中之孫又娶陳氏司農卿宗元之女生二男長曰昌朝繇太子中允監察御史裏行坐正論不阿黜為大理司丞次曰昌期早卒二女長適袐書省校書郎張煦次早卒昌朝將以熙寧五年正月某甲子葬府君於本縣趙行村請直龍圗閣趙君卨狀其冶行以授光使為之志昔者先子嘗獲知于太尉公從兄理佐府君於鄜州幕光亦嘗拜府君於兄舍以是頗知府君之為人府君容貌溫恭而內守堅不可奪移語言無機巧蔽匿而眀察物情其志常在利民而深疾姦惡故所至上官信之僚友親之下民愛之今也幸使光志其墓光既取趙君之狀詮次之又敢私附其所知云銘曰忤意冝踈而或以之親阿意冝合而或以之離蓋至誠可以待無窮而辭色不過欺一時嗚呼久如薛君以忠信正直為心夫又何施而不冝衛尉少卿司馬府君墓表府君諱浩於司徒公為從父兄其鄉里先世見於祖墓碣曽祖諱某祖諱某父諱某皆不仕府君少治詩以學究舉凡八上終不遇遂絶意不復自進於有司專以治家為事為人魁岸慷慨尚氣義於宗族恩尤篤司馬氏纍世娶居食口衆而田園寡府君竭力營衣食以贈之均一無私孀婦孤兒皆獲其所凡數十年始衆無絲豪怨言家貧祖墓迫隘尊卑長幼前後積若干喪久未之葬府君履行祖墓之西相地為新墓稱家之有無一旦悉舉而葬之弟子里早孤府君識其俊異自幼教督甚嚴其後卒以文學取進士第仕至太常少卿所至著名迹前此鄉人導涑水以溉田利甚博嵗以岸益深峭水不能復上田日磽薄將不足以輸租府君率鄉人言縣官始請築塌于下流水乃復行田間為民用至于今賴之天聖八年四月癸己終於家年六十三慶曆二年八月癸酉葬西墓𥘉娶張氏早終生女適解人南公佐公佐舉進士得同學究出身再娶蘇氏先府君十年終年五十八生男宣又娶郭氏無子後府君十六年終年若干宣用司徒公蔭輔郊社齋郎纍官為尚書駕部貟外郎知梁山軍今致仕居家駕部君寬厚有守練習法令善為政吏民不能欺既升朝纍贈府君官至衛尉少卿夫人蘇氏追封長安縣太君駕部君謂古君子論撰其世先人之美著諸金石故命光直敘其實以表于府君之墓道時熙寧六年五月辛酉也尚書駕部貟外郎司馬府君墓志銘兄諱某字周卿曽大父諱某大父諱某皆不仕父諱某以通毛詩屢應州舉名升禮部及兄登朝纍贈衛尉卿母某氏封某縣太君司馬氏纍世娶居食口常不減數十衛尉府君為之長兄年十六衛尉即以家事委之衣食均贍宗族無間言衛尉得以優遊自適十餘年而終兄用從父太尉君蔭輔郊社齋郎太尉以家事非兄不能辦未聽從宦後數年乃調逹州通川尉州有宣漢鹽井距州千餘里唯一溪僅通小舟可以往來守片吏恃其險逺大為姦利州遣兄往按之因為之區處利害凡再往返遂革其弊考滿除華州司理參軍州將驕貴數用私欲撓公法兄執不聽有幕僚性剛戾自將以下皆惡之共文致其罪俾兄鞠之幕僚復上書訟州官皆獲罪惟兄不染於辭人以是益知其公平有驍騎十餘卒犯罪謀亡去監押捕獲之誣云共啚不軌欲殺之以求功賞州官信之謂兄必考掠取服兄不從據實鞠之皆止杖罪餘囚負䆓得直者甚衆既而遭繼母郭氏憂去官直冤者或炷香于頂臂以送之服除授解州聞喜尉用薦者遷大理寺丞知河中府猗氏縣徙閬州新井縣通判鄧均二州先是房州竹山有金溪出金甚多山谷窮僻人迹罕至豪族專其利監司欲命官置場市之皆憚其險辭不行時兄年巳踰六十奮曰利其祿而避其勞可乎遂往躋攀崖巘為之經畫條目使公私俱利仍每月一按行凡歲餘乃還均州秩滿徙知梁山軍纍官至駕部貟外郎年甫七十體力尚壯即求致仕詔輔子廣郊社齋郎廣為虢州盧氏主簿迎兄之官以熙寧八年十二月戊子朔暴得疾已丑終於官舍年七十有三兄為人沉厚寬𥙿喜愠不形于外少時家貧有衣一笥夜遺火比家人覺狼狽救之笥衣巳盡兄獨臥不起家人尤之曰燒衣蕩盡何心尚安臥邪兄曰衣已燒矣起視何益轉枕復寢人皆服其度量子孫僕役有過徐訓諭之不輕罵辱然當官公直能知小民情偽吏不敢以絲毫欺也雖練習律令而不為峭刻斷獄必求厭人心摧抑強猾扶衛愚弱所治職事皆有方略或素號繁劇者兄處之嘗有餘暇氣色不動而衆務修舉廷中永晝寂無人聲其下皆畏而愛之久猶見思從仕三十餘年未嘗有過然性恬靜不自矜譽故人知之者益鮮無所超越循常調終身兄亦不憾也其奉養儉素自為布衣至二千石飲啜服用未嘗少異與鄉人居和易簡靜故沒之日聞者無不歎惜先娶紐氏早終再娶張氏解州助教震之女柔靜慈良宜於族姻封清河縣君治平四年終於鄧州年五十八子男四人曰齊曰庭曰廣曰房庭虢州虢略尉女四人長適解人樊景讓次適陕人張安仁次二人未嫁皆早夭齊等以熙寧九年二月壬寅奉兄及嫂之喪葬於夏川鄊先塋之西南光以期日之迫不暇請於時之賢士大夫自為之銘曰廓然有容頽然無爭所蒞之政不煩而成去久而人益思無求而人莫知年至歸休始終無虧書孫之翰墓志後明道中公在華州光始以太廟齋郎得謁見皇祐中幸與公同在館閣公於光為前輩而光服公才仰公德不敢以同舍期也然粗能孰公之為人元豐二年十一月公弟子崇信令察示光以歐陽公所撰公墓志光讀之恍然如復見公得侍坐於傍也昔蔡伯喈嘗言吾為碑銘多矣皆有慙德唯郭有道無愧色耳觀歐陽公此文其言公自𥘉仕以美才淸德為時所重在諌院言宫禁事切直無所避在陕不飾厨傳凡當官公論不私其所愛淡然寡所好外和而內徑喜言唐事學者終歲讀史不如一日聞公論此皆光親所覩聞當時士大夫所共知可謂實録而無愧矣公名高于世歐陽公以文雄天下固不待光言而後人信之然歲月益久識公者益寡竊懼後之人見歐陽公之文以為如世俗之銘志但飾虗美以取悅其子孫耳故冒進越之罪嗣書其末譬猶捧土以培泰山掬水以沃大河彼豈賴此以為髙深哉蓋志在有以益之不自知非其任也書孫之翰唐史記後孫公昔著此書甚自重惜嘗别緘其稿于笥必盥手然後啓之謂家人曰萬一有水火兵刃之急他貨財盡棄之此笥不可失也每公私少間則增損改易未嘗去手其在江東為轉運使出行部亦以自隨過亭傳休止輒修之會宣州有急變乘馹遽往不暇挈以俱既行於後金陵大火延及轉運𪠘含弟子察親負其笥避于沼中島上公在宣州聞之亟還入門問曰唐書在乎察對曰在乃恱餘無所問自壯年至于今白首乃成亦未以示人文潞公執政嘗從公借之公不與但録姚崇宋璟論以諭之况他人固不得見也元豐二年察自陽翟來洛陽以其書授光曰伯父平生之志萃於是書朝廷先嘗取之留禁中不出今沒二十餘年家道益衰大懼是書遂散逸不傳於人故録以授子光昔聞公有是書固願見而未之得得之驚喜曰子之貺我兼金不如顧無以為報請受而藏之遇同好則傳之異日或廣布於天下使公之志業煒煌於千古庶幾亦足以少報乎文潞公家廟碑先王之制自天子至于官師皆有廟君子將營宫室宗廟為先居室為後及秦非笑聖人蕩滅典禮務尊君卑臣於是天子之外無敢營宗廟者漢世公卿貴人多建祠堂於墓所在都邑則鮮焉魏晉以降漸復廟制其後遂著於令以官品為所祀世數之差唐侍中王圭不立私廟為執法所糾太宗命有司為之營太土御名以耻之是以唐世貴臣皆有廟及五代蕩析士民求生有所未遑禮頽教陊廟制遂絶宋興夷亂蘇疲久而未講仁宗皇帝閔羣臣貴極公相而祖禰食于寢儕于庶人慶曆元年因郊祀赦聽文武官依舊式立家廟令雖下有司莫之舉士大夫亦以耳目久不際往往不知廟之可設于家也皇祐二年天子宗祀禮成平章事宋公奏言有司不能推述先典明諭上仁因循顧望遂踰十載緣偷襲弊殊可嗟閔臣嘗因進對屢聞聖言謂諸臣專殖苐産不立私廟睿心至意形于歎息蓋由古今異冝封爵殊制因疑成憚遂格詔書請下禮官議定制度於是翰林承旨而下共奏請自平章事以上立四廟東宫少保以上三廟其餘器服儀範俟更參酌以聞是嵗十二月詔如其請既而在職者違慢相仗迄今廟制卒不立公卿亦安故習常得諉以為辭無肯唱衆為之者獨平章事文公首奏乞立廟河南眀年七月有詔可之然尚未知築搆之式靡所循依至和𥘉西鎮長安訪唐廟之存者得杜岐公舊迹止餘一堂四室及旁兩翼嘉祐元年始倣而營之三年增置前兩廡及門東廡以藏祭器西廡以藏家譜齋枋在中門之右省牲展饌視滌濯在中門之左庖厨在其東南其外門再重西折而南出四年秋廟成公以入輔出藩未嘗踰時安處於洛元豐三年秋留守西都始釁廟而𣏌焉一旦授光以家譜豫欲志族世之所從來及廟之所由立垂示後昆而為我敘其事𣢾于石光竊惟公追逺復古率禮興化之盛德不可以無傳雖自知不文不敢辭謹敘而銘之按譜云文氏之先出陳公子完以諡為氏與翼祖諱同至秦有丕丕生河東太守教始家平陽其後有韶漢末為揚州刺史自韶以來世乃可譜韶之六世孫頻為後魏北絳太守頻曾孫顯俊以别駕從北齊髙祖起晉州就霸業戰功名居多終兖州刺史頻之六世孫曰肅曰君洪肅仕隋為頴川郡丞名列循吏以公直抗宇文述老卑秩君洪從髙祖起晉陽為右衛將軍太子建成餘黨攻宫門君洪首奮挺出戰沒頻之八世孫曰暉曰播暉相中宗誅張易之奪武后天下歸之唐用仇人讒謫死嶠南播有史學官至給事中君洪之曾孫羽為御史中丞肅之四世孫括為御史大夫括孫晦為太子賓客晦兄昕為義成莭度使皥為散騎常侍榮冠當時自顯俊至晦皆有傳見於史其家自平陽或遷太平或遷蒲阪或遷實鼎晦之從父昆弟晤為北都留守判官始居介休晤生汾州參軍檖檖生館館生澤州録事參軍即公之髙祖考也諱浩曽祖考諱某仕後唐厯晉城天池平城三主簿避晉髙祖諱更其氏曰文厯崞太谷二令漢髙祖即位復舊氏更名某漢失天下其支别者自帝於晉陽復事之終嵐州録事參軍祖考諱某辟石州幕府棄官歸鄉里太宗皇帝平晉陽召之不起以廟諱故復為文氏考諱某以儒學進厯十三官所至以強直勤敏振利攘害名聞逹不可掩判三司開拆磨勘司終主客郎中河東轉運使其治行之詳見於故平章事晏公參知政事王公沂撰墓志及碑公貴朝廷褒榮三代贈官皆至太師中書令兼尚書令爵燕周魏三國公廟成澤州府君為苐一室夫人某氏配燕公為苐二室燕國太夫人宋氏配周公為苐三室周國太夫王氏越國太夫人申氏配魏公居東室魏國太夫人耿氏魯國太夫申氏配公以廟制未僃不敢作主用晉荀安昌公祠制作神板采唐周元陽議祠以元日寒食秋分冬夏至致齊一日又以或受詔之四方不常其居乃酌古諸侯載遷主之義作車奉神板以行此皆禮之從冝者也其銘曰鬱彼喬木茂于苞根浩彼長川發于浚源矧人之先云誰敢諼天佑有宋誕生哲臣乃斡樞軸乃秉鎔鈞克釐克諧允武允文甘陵有妖悖暴紛囂公往逍遙不日而消仁祖太上御名疾羣心震栗公入密勿四海清謐出殿方維為諸侯師以惠以綏不廢其威至也民悅去也民思其思如何式謡且歌歌政之和在洛為多謀居之安疇如得民公自汾渚遷于洛滸允樂兹土永燕私處伊水洋洋山木蒼蒼是掄是剫是斷是斫逹于有洛是相是虞是卜是諏是築是救是植是扶是茨是塗作廟渠渠新廟既成室家是營公曰豫居風雨是撫勿侈勿崇豫躬是容人痺公堂公曰豫康人隘公庭公曰豫寧人勿豫隘惟子孫是賴人勿豫痺惟子孫是利克恭克儉豫履豫視俾躬之為美匪目之為麗廟堂既闢四室有侐豢牲孔碩導黍及稷豆籩既滌汛掃既僃旨酒既泲刲牲為饎乃薦乃陳苾苾芬芬祖考欣欣百嘏來臻天錫公祉強明夀愷帝錫公祿崇榮豐泰天匪公私公德是冝帝匪公優公勳是酬公拜稽首揚天子之休思純終始式貽孫子子子孫勿替勿忘時奉丞嘗保公之烈光書田諫議碑隂光自始學未冠聞故諫議大夫田公當真宗踐阼之𥘉求治方急公稽古以監今日有獻月有納以贊成咸平盛隆之治私心慕仰想見其為人熙寧中始識公之曽孫偃師尉衍因就求觀公之遺文後十餘年衍為武勝軍莭度推官知沈丘縣事以公文集及墓銘相示且命光為神道碑其墓銘乃故參知政事范公所為也范公大賢其言固無所苟仐其銘曰嗚呼田公天下之正人也雖復使他人竭其慕仰之心頌公之美纍千万言能有過于此乎光於范公無能為役范公恨不得見田公則田公果何如人哉光不惟愚陋不學且不為人作碑銘已久不敢承命然常怪世人論撰其祖禰之德業壙中之銘道旁之碑必使二人為之彼其德業一也銘與碑奚以異曷若刻大賢之言既納諸壙又植于道其為取信于永久豈不無疑乎願審思之脫或可從請附刻于碑隂之末溫國文正公文集卷第七十九
