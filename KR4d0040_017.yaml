body:
  text: 奏章二第三狀論屈野河西修堡狀二道乞􅉑州三狀辭修注五狀第三狀先於六月十九日八月一日兩曽上言乞擇宗室賢者進而用之蓋以上則輔衛聖躬下則鎮安百姓迄今未聞聖朝少垂采聽臣誠愚昧不逹國家髙逺之意若臣所言非邪當明治其罪以示天下若其是邪亦謂聖心不冝弃忽豈可直以臣之愚賤不察其言若投羽毛於滄海之中杳然莫知其所之豈踈逺所望哉臣不勝憤悶敢復剖析肝膽陳布以聞雖抵罪萬死亦無怨悔臣聞書曰逺乃猷詩云猶之未逺是用大諌凡國家之弊在於樂因循而多忌諱不於治安之時豫為長逺之謀此患難所從而生也竊觀漢室以至有唐簡䇿所載帝王即位則立太子此乃古今不易之道也其或謙讓未暇則有司請之所以尊宗廟重社禝皆國家莫大之慶未聞人主以為諱惡也及唐中葉以來人主始有惡聞立嗣者群臣莫敢發言言則刑戮隨之是以禍亂相尋不可復振殊不知本強則茂基壯則安此乃國家所當深鑒而不足以為法也今天下之人上自公卿下至庶人苟有知識忠於國家者其心皆知當今之務無此為大無此為急然而各畏忤旨之誅莫敢進言臣獨不愛犬馬之軀為陛下言之陛下豈可不少留聖思而聽察之邪臣嘗歷觀春秋以來逮至國𥘉積一千六百餘年其間天下混一內外無患兵寢不用者不過四百餘年而已至如聖朝芟夷僣亂一統四海內平外順上安下和使在朝在野之人自祖及孫耳目相傳不識戰鬪蓋自上世以來治平之久未有若今之盛者也竊見國家於州縣倉庫斗糧尺帛未嘗不嚴固扄鐍擇人而守之況如是融明閎茂之業豈可不謹擇親戚可信任者使助陛下守之乎此則賢愚之人所共為陛下重惜者也陛下當此之時頥指如意不早決至䇿以固萬丗不拔之基獨不念太柤太宗跋履山川經營天下真宗宵衣旰食以致太平之艱難乎此臣所以夙夜遑遑起則思之卧則夢之感嘆涕泗不能自巳不避煩瀆之誅再三進言者也或者謂臣身賤居外而言朝廷之事侵官也臣愚以為治古諌爭無官自公卿大夫士至於庶人百工啇旅矇瞍芻蕘無有不得言者所以逹下情而察國政也若置官而守之非其官者皆不得言則下情壅而不通如是則國家雖有迫切之憂行道之人皆知之而在上者莫得聞也此其為害豈不深乎況臣食陛下之祿於今三世矣先臣某以廉直恬退特為陛下所知擢自孤微升之侍從此恩之重子子孫孫何時敢忘而又陛下嚮以水災親下明詔延訪中外勤求得失臣獨何人身逢盛際捨此大節隱而不言其餘瑣碎豈足道哉抑又聞之元后作民父母陛下臣父也安有為人之子見危而不告其父乎伏望陛下察臣區區之心不為私其一身不惜少頃之間取臣前後所奏略賜省覽其中萬一苟有可施行者乞以陛下之意斷而行之宣告中外使逺近渙然無復憂疑則自然神靈恱於上而災異伏衆庶喜於下而姦宄消至於草木昆蟲靡不蒙𬒳其福其為功業豈不盛哉夫時者難得而易失惟陛下早留神詳察論屈野河西修堡狀竊以為人臣者事君不避難有罪不逃刑臣先任通判并州軍州事准經略司牒差往麟州勾當公事其屈野河西一帶田土積年以來為夏虜所侵臣委曲詢訪本州當職官吏以虜之侵盜為日巳久諭之以理則不肯退縮逼之以兵則動成戰鬪召之重定界至則偃蹇不來春種秋穫無有巳期如何區處可以不戰而得所侵之地其本州官吏為臣言州城之西臨屈野河自河以西直抵界首五六十里並無堡障斥候以此虜得恣耕其田逰騎往往直至城下或過城東州人不知去歲巳於河西置一小堡以處斥候之人亦曽申經略司乞於其西增置二堡㑹今春以來虜騎屯聚遍滿河西經略司牒令候西人退散別申取指揮今虜衆盡已退去自州城以西至大橫水爽平數十里間絶無一人一騎若乘此際急於州西二十里左右增置二堡每堡不過十日可成比至虜中再行點集此堡巳皆有備虜不能為害如此則麟州永無侵軼之虞州兵出入有所宿頓堡外先侵之田虜皆不能耕種臣之愚心亦以為國家固爭屈野河西田者非少此尺寸之地蓋以虜侵耕至河則麟州孤危果能成此二堡以為麟州耳目藩蔽於事誠便遂㱕貝以官吏所言白於龐籍籍用臣言即牒麟州令依前申修築二堡仍令精加探候廣設隄備戒諭約束莫非丁寧蓋欲乘間急修故不暇取旨俟報但曽奏知而已不期滿到之後元末興修虜衆已復大集於五月五日彼處兵官引一千許人夜開城門徑往屈野河西前無探候後無䇿應中無部伍但賫酒食不為戰備以此逢敵如何不敗遂令所謀之事悉皆無成此乃諸將恃勇輕敵臨事無備之所致本非修堡之過況自元昊納欵以來麟州修建堡寨及出兵過屈野河西前後非一雖與虜遇未嘗敗北明知今日之敗在於無備不在修堡與過河也然臣竊聞議者乃以龐籍為擅修堡寨引惹邊事臣伏自惟省本因臣與麟州官吏啇量傳道其言逹於龐籍籍未嘗身至河西周知利害皆臣愚戇思慮不熟䡖議大事當伏重誅今乃使議者悉歸咎於龐籍臣豈敢晏然不言苟求自脫上負聖朝死有餘責臣雖小人義不忍為伏望陛下察龐籍本心欲為國家保固疆圉發於忠赤不顧身謀過聽臣言以至於此獨治臣罪以正典刑雖蹈鼎鑊亦無所畏干冒宸嚴臣無任戰汗激切屏營之至第二狀右臣先曽奏陳為麟州修堡事乞獨治臣罪至今未奉朝旨今竊知龐籍移知青州夏倚等各有責降臣伏自惟念若朝廷不以修堡為非龐籍等必不受責若以為非則龐籍先巳指揮麟州罷修此堡因臣至彼見虜騎退散方議再修武戡夏倚等雖建此䇿因臣至彼傳導其言方得逹於龐籍由是言之修堡之事皆臣所致若治其罪臣當為首今龐籍等先受其責而未蒙譴罰臣實內慙無以自處況臣在并州日受經略司牒管勾夲司要重公事龐籍凡處置邊事未嘗不詢及於臣采用其說臣亦夙夜竭盡愚慮知無不言庶幾協心禆𥙷國家有萬一之益今乃以智識淺短思慮不精上為朝廷之憂下為龐籍之纍若復苟求自脫不即大誅是臣以蕞爾之軀虧國家至平之法罪舋愈重不容於死伏望聖慈察臣前後所陳夲未事理嚴賜誅譴以正刑書不勝幸甚干冒宸嚴臣無任惶恐屏營之至謹貝狀奏聞伏候敕旨乞􅉑州狀右臣不避斧鉞傾瀝危懇臣夲貫陜州夏縣丘壟宗族俱在彼中自先臣亡沒及臣服闋以來十有餘年守官未嘗得近鄉里止曽一次請假焚黃得展省墳墓中心念此朝夕不忘近臣方欲上煩朝廷陳乞家便一官又為自判吏部南曹未及一年及陜州側近州郡俱未有闕所以未敢陳請今竊知巳降勑命授臣開封府推官於臣之分誠為榮幸然臣有此私懇須至披陳加以禀賦愚暗不間吏事臨繁處劇實非所長心慮不職以煩司寇伏望聖慈特賜矜察除知􅉑州或慶成軍一次情願守待逺闕庶得近便灑掃先塋或上件處所無闕乞且歸館供職候有闕日特賜差除干冒宸嚴臣不任懇切惶懼之至謹具狀奏聞伏候勑旨苐二狀右臣先蒙恩授臣開封府推官臣為久不曽到鄉里及自知才性疲駑不任劇職曽奏乞知􅉑州或慶成軍一次奉聖旨不許辝免就職以來已踰半歲躰素多病牽強不前竊知􅉑州即今有闕臣𣣔乞依前來所奏差知􅉑州一次或巳除人即乞候主判登聞鼓院或尚書省間慢司局有闕日差除一處庶幾守官不至曠敗干冒宸嚴臣無任戰汗激切屏營之至謹具狀奏聞伏候勑旨苐三狀右臣伏自去歲聖恩除開封府推官以來臣以久不到陜州鄉里及資性駑下不任劇職兩曽乞差知􅉑州或主判登聞鼓院及尚書省間慢司局不蒙聽許臣以開封府重難之處不敢更有陳請今竊知巳降勑命除臣判三司度支句院竊緣臣禀賦愚鈍素無才幹省府職任俱為繁劇去此就彼皆非所冝若貪榮冒居必致曠敗內省僥忝誠不自安欲乞依前來所奏差知􅉑州或主判登聞鼓院及尚書省間慢司局若俱無闕則乞知絳州乾州或在京間慢差遣一次干冒宸嚴臣無任懇切戰汗屏營之至謹具狀奏聞伏候勑旨辭修注第一狀右臣伏奉勑差臣同修起居注臣性識庸昧學術空淺循塗平進猶懼不稱況記注之職士林髙選若以叙進則先逹尚多若以才升則最出衆下豈敢不自揣度貪冒榮寵內猶愧怍人將謂何承命震恐殆無容措伏望聖慈俯賜矝察更擇時彥以副群望所有勑臣不敢祗受謹具狀奏聞伏候勑旨第二狀右臣伏准中書劄子以臣昨奉勑差同修起居注不敢祗受奉聖旨不許辭免便令受勑者臣聞人主度才然後授任人臣量能然後就職是以上無曠官下無竊位臣雖愚戇粗識兹義今修注之官日侍黼扆瞻望倩光仕進之塗無此為美臣非惡居顯榮樂在踈賤顧以駑下之質不相當稱苟強顔為之不惟取四方觀笑為士友所責亦恐用非其人貽朝廷羞臣愚所慮正在於此是以傾輸悃愊昧死自陳今制旨益嚴未賜開可臣夙夜震懼不知所圖豈辭語拙訥不能著白將誠信未昭無以感發俯仰惶惑若懷氷炭是用再有披露仰逹天聰不敢避煩黷之誅庶幾逃忝冒之罪所有差同修起居注勑臣不敢祗受乞依前奏更賜擇人臣無任激切俟命之至謹具狀奏聞伏候勑旨第三狀右臣伏准中書劄子以臣昨奉勑差同修起居注再有奏陳不敢祗受乞更賜擇人奉聖旨令臣依前降指揮不許辭免便令授敕者臣區區之誠屢塵天聽言理鄙拙未蒙采納退自悚懼置躬無所臣雖愚陋豈不知非常之恩不可䡖得詔命之嚴不可屢違所以冒犯雷霆祈請不已者誠以人臣之義陳力就列不能者止臣自釋褐從仕佩服斯言奉以周旋不敢失墜仕進夲末皆可覆按鄉者承上庠之乏充文館之貟𥙷奉常之屬給太史之役未嘗敢以片言避免煩浼朝廷蓋以解擲章句校讎文字考尋儀典編次簡牘苟䇿勵疲駑庶幾可以逃於罪戾是以聞命之始即時就職至於修起居注自祖宗以來皆慎擇館閣之士必得文采閎冨可以潤色詔命者然後為之臣自幼及長雖粗能誦習經傳涉獵史籍至於屬文實非所長雖欲力自切劘求及等輩性有常分不可強勉儻不自惟忖貪冒榮寵異時驅䇿有所不稱使四方之人環目譏笑以為盛明之朝容有竊位之人其為聖人之纍豈云細哉如是則雖伏質撗分不足以補塞無狀此臣所以夙夜惶悸欲止不能者也且臣前後所陳剖心析肝莫非懇到而朝廷弃置其言曽不足省是不以情實待臣也意者使臣言出於誠陛下矝而聽之足以盡下情從物欲使臣言出於僞陛下亦因許之足以沮姦回警偷薄臣竊為朝廷計之二者皆未為失也今臣所陳請已及再三而陛下拒之愈堅督之愈急使拳拳之志無以自明豈上下坦然推心相信之道哉臣不勝憤悶伏望聖慈依臣前奏更賜擇人所有同修起居注勑臣不敢祗受謹具狀奏聞伏候勑旨第四狀右臣伏自蒙恩差臣同修起居注巳三次奏陳不敢受勑更乞擇人今又准中書劄子奉聖旨令臣依纍降指揮便授勑更不得辭免詔旨丁寧至于三四而臣偃蹇自遂是謂不恭若正典刑罪死無赦然臣知而不敢避者誠以罪有大於此者故也臣聞虞書曰無曠庶官然則官無巨細皆分理天職王者猶不敢私非其人况人臣而敢叨居其位乎如是則雖無國討必有天刑臣雖頑愚粗知自愛雖日遷九官所不願也臣嚮辭開封府推官及判三司度支勾院朝廷一有指揮不令辭免臣即時就職豈以材力為足堪其任哉竊自惟度以為朝命巳行必不可移雖章奏煩多終無所益是以黽勉從事不敢復言及覩王安石前者差修起居注力自陳訴章七八上然後朝廷許之臣乃追自悔恨嚮者非朝廷不許由臣請之不堅故也臣今所以煩瀆聖聽不能自已雖加重誅所不敢逃况王安石文辭閎冨丗少倫比四方士大夫素所推服授以此職猶懇惻固讓終不肯為如臣空踈何足稱道比於安石相去逺甚乃敢不自愧耻以當非常之命乎使臣之才得及安石一二則臣聞命之日受而不辭今臣內自省循一無可取乃與之同𬒳選擢比肩並進豈不玷朝廷之舉為士大夫所羞哉此臣所以倣徨尤不敢受者也伏望聖慈察臣誠心且令循守舊職更賜推擇當今俊異之人可與安石為比者使同修起居注如此則賢不肖各當其分能不能各適其冝下情獲安衆望惟允所有同修起居注勑臣不敢祗受謹具狀奏聞伏候勑旨第五狀右臣先奉勑差同修起居注臣四曽上奏乞更擇人今又准中書劄子奉聖旨令臣依纍降指揮更不得辭免便令授勑供職者臣要領如草芥不足以膏斧鉞軀命如螻蟻不足以脂鼎鑊今屢違明詔當伏重誅然臣區區之情亦兾朝廷少賜寬察臣自知材能不足塞職歸情上聞煩瀆聖聰至于四五刳肝瀝膽盈卷溢幅臣之情亦極矣臣之辭亦殫矣雖欲重復稱引無以復加而朝廷以臣賤微終不之聽臣晝夜憂悸無以自存俯仰三思進退維谷夫詔命至尊微臣至卑修注至榮罪誅至辱今臣以卑違尊去榮就辱原其本志豈有它哉正欲朝廷任官皆得其人愚臣處身不失其分而已若聖恩矝而許之則豈惟愚臣之幸亦可以少有𥙷於國家若章奏煩多而詔指不移豈惟使臣獲頑愚不䖍之罪不容於菹醢抑亦恐四方之人謂朝廷乏於賢材如臣之比尚足固留也不勝迫切之情伏望聖慈依臣前奏更賜擇人所有同修起居注勑臣不敢祇受謹具狀奏聞伏望勑旨溫國文正公文集卷第十七
