body:
  text: 章奏九上殿劄子二道論覃恩劄子儀鸞失火劄子請早令皇子入內劄子直講乞不限年及出身劄子奏乞復夏倚差遣劄子奏乞推恩老臣劄子論董淑妃諡議䇿禮劄子論寺額劄子賈尹劄子王逵劄子論赦劄子壽星觀劄子再論王逵劄子趙滋劄子陳烈劄子上殿劄子二道臣近曽上疏以即今公私財用率皆窮窘專奉目前經費猶汲汲不足万一有大水大旱飢饉相仍戎狄侵邊盜賊群起發兵誅討不時克定倉庫巳空百姓又竭其憂患不細必當早為之謀以救斯弊乞隨才用人使久於其任務農通商以蕃息財物節省賜豫裁損浮費又以宰相領總計使之職凡天下金帛錢榖屬於三司不屬三司者總計使皆領之歲終則校其出入之數若入少而出多則思其所以救輔之術奏而行之常使歲餘三分之一以備飢饉軍旅非常之費其內外錢榖官之長皆委總計使察其能否考其功狀以奏而誅賞之此誠當今之急務伏望陛下與公卿大臣定議早賜施行取進止又臣伏見陛下以皇姪宗實知宗正寺宗實辭讓多日不肯就職陛下兩次遣使者召令受勑中外之人無不欣恱以為非陛下睿智聰明深謀逺慮斷自聖志確然不惑何以及此夫王者以大庇生民為仁安固基業為孝仁孝之道莫大於此今陛下一舉而兩有之天下聞之安得不喜又爵祿者人之所貪往往校量絲毫干求爭訟不顧廉恥今宗實特受陛下簡拔恩寵殊異而以榮為懼辭讓懇切首尾十月尚未受詔其智識操行必賢於人益足彰陛下知人之明此天下所以尤喜也然陛下於宗實屬則父也尊則君也在禮父召無諾唯而起君命召不俟駕今陛下兩遣使者召之宗實雖不受恩命亦當入見面自陳述豈可在家堅卧不起臣愚伏願陛下更遣近上內臣往傳聖意責以禮法彼冝不敢不來則陛下面加敦諭使知聖心懇惻發於至誠彼宜不敢不受如此則陛下仁孝之德純粹光大本末如一無以復加此皆陛下即今所行而臣復區區進言者誠欲陛下守之益堅行之不倦故也取進止論覃恩劄子臣光等伏覩今月三日御扎取今年季秋擇日有事于明堂所有合行諸般恩賞一依南郊例施行臣等竊見皇祐二年親祀明堂是時以𥘉行希闊之禮文武臣僚並轉一官今國家修舉舊禮乃是常典雖已誕告恩賞一依南郊例然竊慮貪冒無識之人尚有希覬流言云云動搖中外況今庶官濫溢經費窘竭豈可復踵往歲之失以增今日之弊伏望朝廷豫先明降指揮言今歲所行明堂之禮更不覃恩轉官使中外咸知以絶徼幸者之望取進止論儀鸞失火劄子臣竊聞今月九日夜大慶殿前儀鸞司房內失火煙熖已起燒及屋宇側近守宿之人知覺差早僅能救滅或聞聖恩欲寬貸失火之人竊以宫省之內火禁不可不嚴嚮使救之稍緩為災不細伏望選差不干礙官一貟子細檢定火發蹤由委開封府依公盡理根勘從𥘉失火因依應干繫人等嚴賜施行所貴戒勵後人不敢懈慢取進止請早令皇子入內劄子臣等伏聞擇今月二十二日差內臣宣皇子曙入內而曙猶復稱病未入臣等𥘉以臣子有君命召不俟駕之禮使者有受命不受辭之義今曙但以恐懼不敢便當陛下非常恩寵而所差內臣亦當以臣子事君父之禮曉諭切責使即奉命豈得備禮致命默然往復殊不副陛下聖意其今月二十五日宣曙內臣伏乞特行責降以懲不職之罪况皇子之名本非官職無容避讓今詔命巳下二十餘日而曙既為陛下之子禮當朝夕定省備人子之職不冝久處外宅伏望聖慈速賜選差都知御藥諭以君父之命不可違臣子之職不可闕敦迫切責使即時入內并下大宗正司及本宫亦仰以禮敦遣不得更容遷延取進止直講乞不限年及出身劄子臣伏見國子監直講見缺數貟久而未輔蓋以近制須年四十以上及進士九經出身方得為之臣愚以為學官正冝取德行經術可為師表之人不當限以苛法若不察其人之賢愚而惟年齒出身之問則雖有德行如顔回經術如王弼皆終身不可為學官也又舊制學官皆先試講説然後就職近歲此法亦因循不行臣欲乞今後應國子監直講有闕許本監或兩制以上舉京朝官選人有德行經術者具姓名聞奏更不問年紀及出身其國子監所舉者委學士或舍人院試兩制以上所舉者委國子監試並須衆官聚廳㸦舉疑義靣試講説擇其義理精通者保明聞奏方降勑差除若德行邪僻經術荒謬而輒敢舉薦保明者並乞嚴行朝典取進止奏乞復夏倚差遣劄子臣先任通判并州事日準經略司牒往麟州勾當公事伏見通判本州事夏倚通敏恪勤勇於忠義苟利公家不為身謀始與臣共議於屈野河西修堡以上西夏侵耕及見管勾軍馬司公事郭恩恃勇輕敵倚與臣書稱恩萬舉萬敗經略司方行止約恩巳覆沒倚收撫散兵孤城獲安既而倚與衆人一例獲罪降充監當及今五年兩經大赦應當時河西連纍之人罪稍輕者並已復舊差遣惟倚尚合入知縣資敘比於衆人獨為困躓誠可哀憐臣竊以倚當日知恩必敗而力不能制恩之敗績實非倚罪兼其人公忠材智誠有可稱不可專以一眚掩其衆善伏望聖慈特與復通判差遣庶使任職之臣知徇公獲罪終不能久為身纍有所勸慕取進止奏乞推恩老臣劄子臣伏見皇祐二年陛下親祀明堂曽召前兩府杜衍任布二人陪位及禮畢陛下推恩特賜衍布子男各一人進士出身今陛下再舉希闕之典亦曽召前宰相龐籍陪位臣竊以籍嚮守西邊宣力實多懷柔凶渠復歸皇化其在宰府屬蠻冦慿陵震驚二廣翼贊聖謀廓清醜類及告老之年精力猶壯堅辭榮祿去位家居實朝家之碩臣方今之舊俊遇兹盛禮伏望陛下用杜衍任布前例特推恩於籍子男一人以慰其心足以示養老優賢增聖政之美取進止論董淑妃諡議䇿禮劄子臣伏見充媛董氏薨追贈婉儀又贈淑妃陛下親為之輟朝挂服群臣進名奉慰又命有司為之定諡及行䇿禮於葬日仍給鹵簿外廷之議皆以為董氏名秩本微病亟之日方拜充媛今送終之禮太為崇重臣案古者婦人無諡近丗惟皇后有諡及有追加䇿命者妃嬪以下未之有也鹵簿本以賞軍功未嘗施於婦人唯唐平陽公主有舉兵佐髙祖定天下之㓛方給鼓吹後至中宗時韋后建議始令妃主葬日皆給鼓吹非明王之令典不足法也臣愚伏念陛下恭儉寡欲近歲以來後宮之寵絶無大盛過分著聞於外者此四方之人所以咨嗟頌咏歸仰聖德也不意今兹以既沒之董氏而有司諂曲妄崇虛飾以隳紊制度瀆慢名器使天下之人疑陛下隆於女寵甚非所以光益聖德也况禮數既崇則凡喪事所須用度必廣今明堂大禮新畢帑藏空虛賦斂日滋元元愁困誠不冝更崇大後宫之喪以橫增煩費夫亡者雖加之虛名盛飾豈能復知而足以仰纍聖德臣竊惜之伏望陛下特詔有司悉罷議諡及䇿禮事其葬日更不給鹵簿凡喪事所須務從減損不必盡一品之禮以明陛下薄於女寵而厚於元元也取進止論寺額劄子臣伏覩近降赦節文應天下係帳存留寺觀院舍自來未有名額者特賜名其在四京管內者雖不係帳今日前巳蓋到舍屋及百間以上者亦賜名額竊以釋老之教無益治世而聚匿遊惰耗蠹良民此明識所共知不待臣一二而言也是以國家明著法令有創造寺觀一間以上者聽人陳告科違制之罪仍即時毀撤蓋以流俗戇愚崇尚釋老積弊巳深不可猝除故為之禁限不使繁滋而已今若有人公違法令擅造寺觀及百間巳上則其罪巳大幸遇赦恩免其罰罪可矣其棟宇瓦木猶當毀撤沒入縣官今既不毀而又明行恩命錫之寵名是勸之也臣聞為人上者洗濯其心一以待民是以令行禁止而莫敢不從今立法以禁之於前而發赦以勸之於後則凡國家之號令將使民何信而從乎臣恐自今以往姦猾之人將不顧法令依慿釋老之教以欺誘愚民聚斂其財以廣營寺觀務及百間以上以須後赦冀幸今日之恩不可復禁矣方今元元貧困衣食不贍仁君在上豈可復唱釋老之教以害其財用乎事有微而患深令有近而害逺者此之謂也伏望陛下追改前命應天下寺觀院舍不係帳者不以舍屋多少並依前後勑條處分其昨來赦文內四京寺觀院舍雖不係帳亦賜名額一節乞更不施行庶使號令為民所信而遊惰不能為姦也取進止賈尹劄子臣伏見權知開封府賈黯夲以文藝進身不間吏事嚮在流內銓三班審官院巳無聲迹可紀及尹京邑當繁劇之任尤非所長區斷乖方怨嗟盈路伏乞朝廷量其所能授以它職别選差人知開封府庶合衆心取進止王逵劄子臣竊聞監兖州景靈宫王逵近降勑差知萊州逵暴戾凶狡陵上虐下所至為害朝野具知仐年齒已衰猶汚仕籍若復授以一州使為長吏必恣行不法殘害民物監司畏之莫敢詰問使一境之人何所控告伏望朝廷撿會逵年紀及察逵平生事迹勒令致仕或只與監當差遣永不得令親民取進止論赦劄子臣伏見國家每下赦書輒云敢以赦前事言者以其罪罪之誠欲恩澤下究而號令必信也比見臣僚多以私意偏見奏赦前事乞不原赦或更特行編配重於不經赦之人朝廷皆從其請若其人情理巨蠧必不可赦者則國家當於約束勑及赦文內明白言之若所坐不至甚重而特不赦是恩澤有所不均而同罪之人有幸有不幸也且今劫盜殺人不死及雜犯死罪猶赦之而微罪不赦是則罪之輕重不繫於人主不刋之法令而決於人臣一時之私意也況使經赦之人仍就編配得罪重於不經赦者尤無謂也夫赦者誠非致治之道然朝廷若能永無赦令使有罪者必刑則人知恐懼莫敢犯矣今既數下赦令而使大罪得免小罪𬒳刑經赦者其罪重不經赦者其罰輕臧否糾紛使百姓何所取信哉臣愚欲望陛下自今犯罪之人情理巨蠹必不可赦者乞於豫降約束勑內明白言之其餘並從赦文處分其有指赦作過情狀顯然不因臣僚奏請陛下聖意特不原免者止冝依法施行亦不可使重於赦前之罪應昨赦前犯罪不至編配而赦後特編配者並乞放令逐便庶使恩澤均一號令明信取進止壽星觀劄子臣等前者伏覩陛下幸壽星觀奉安真宗御容當時是臣等不知事之本末未敢進言自後方知本觀舊日止有先帝時所畫壽星近因本觀管勾內臣吳知章妄有奏陳稱是先帝御容意欲張大事體廣有興修自為勞效别圖恩賞陛下天性仁孝以為崇奉祖宗重違其請遂更畫先帝御容以易壽星之像改為崇先觀知章既得御容倚以為名姦詐之心不知紀極乃更求開展觀地别建更衣殿及諸屋宇將近百間制度宏侈計其所費踰數千万向去增益未有窮期臣等竊以祖宗神靈之所慿依在於太廟木主而巳自古帝王之孝者莫若虞舜啇之髙宗周之文武未聞宗廟之外更廣為象設然後得盡至誠也唯髙宗祭祀親廟微為豐數故傅説曰黷于祭祀時謂弗欽禮煩則亂事神則難祖己曰祀無豐于昵蓋規之也後至漢氏始為原廟當時醇儒逹禮者靡不譏之況畫御容於道宮佛寺而又為壽星之服其為黷也甚矣且又太祖太宗御容在京師者止於興國寺啓聖院而已真宗御容已有數處今又益以崇先觀是亦豐于昵也無乃失尊尊之義乎原其所來止因知章妄希恩澤乃敢恣為誣罔興造事端致陷朝廷於非禮今既奉安御容難以變更若止就本觀舊來已修屋宇固足崇奉所有創添屋宇伏乞一切停寢止令有司以時侍奉所有知章誣罔聖聰依託御容妄有干請廣興力役乞下所司取勘窮治姦狀明正其罪取進止再論王逵劄子十一月十八日上逵改除西京留臺臣先曽上言新差知萊州王逵暴戾凶狡殘害民物乞檢會逵年紀及平生事迹勒令致仕或只與監當差遣至今未聞朝廷追改前命臣竊以善為政者視民如子見不仁者誅之如鷹鸇之逐鳥雀也故害民之吏患在不知知而不除使戕賊良善不愛一州而愛一酷吏豈為民父母之意哉伏望朝廷檢會臣前來所奏早賜施行取進止趙滋劄子臣先曽上言趙滋為人剛慢不可管軍朝廷不以為信臣亦自恐聞聽未審不敢復有所陳自後又聞滋對契丹人使禮貌驕倨不遵舊式近者又聞本路帥臣奏滋任意行事恐致引惹竊以景德以前契丹未和親之時戎車歲駕疆埸日駭乘輿暴露於澶淵虜騎慿陵於齊鄆兩河之間暴骨如莽先帝深惟安危之大體得失之至計親屈帝王之尊與之約為兄弟歲捐金帛以餌之聘問往來待以敵國之禮陛下承統一遵故約夫豈以此為不辱哉志存生民故也是以兵革不用百姓阜安垂六十年今契丹所以事中國之禮未有闕也為邊臣者當訓卒乘繕器械以戒不虞厚饔餼愼威儀以待使者內不失備外不失好以副朝廷之意而已今滋數乘客氣以傲使人爭小勝以挑強胡苟為夸大於目前以求一時之聲名而不顧國家永久之患臣恐釁隙一開則朝廷未得髙枕而卧也昔孫蒯毀瓶而曹衛御名難鄫人漚菅而魯國喪邑涉他捘手而晉失諸侯女子爭桑而吳師入郢故禍常起於細微而事或生於所忽凡二國所以相交之道不可以不愼也雄州當虜之衝平居則行李之所往來有事則戎馬之所出入典州之將不可不精擇其人滋稟性狂很恐不可久置於彼乞落軍職徙之內地母使邊將相效為國生事實天下幸甚取進止陳烈劄子臣等伏見朝廷嚮以福州處士陳烈好學篤行動遵禮法樂道養志名聞京師故舉之閭閻之中以為學官烈辭讓未至今聞福建路提點刑獄王陶奏據福州勘到烈為妻林氏疾病瘦醜遣歸其家十年不視陶因言烈貪汚險詐行無纎完乞盡追奪前後所受恩命臣等素不識烈不知其人果為如何惟見國家常患士人不修名檢故舉烈等以獎勵風俗若烈平生操守出於誠實雖有底滯汚闊之行不能合於中道猶為守節之士亦當保而全之豈可毀壞挫辱疾之如讎書曰不協于極不罹于咎皇則受之古人所以禮九九市駿骨蓋以此也若其內懷姦惡虧敗名教外飾詐偽沽釣聲利則朝廷嚮者以為有道之士不次用之今乃醜行布於四方其為愧恥亦不細矣其始者薦舉之人安可置其罪而不問臣等欲望陛下委鄰路監司再行體量本人平生事迹善惡虛實或選差公正官吏通儒術識大體者覆勘前件公事若情理不至深重止於夫妻不相安諧則使之離絶而巳湔洗其過庶幾復伸眉於後又使四方節行之士不憂撗辱得以安恬於閭里若實有醜惡之迹敗亂名教則當嚴賜刑誅并治舉者之罪以明至公取進止溫國文正公文集卷第二十四
