  text: 溫國文正公文集卷第十一
  hash: sha256:fefefe4507ca847a649c459d6b923ec12279608d3d2a89057eaac39f92f31b0f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_011-1a}
body:
  text: 律詩六讀頴公清風集寄題興州朝都官仲約東沼沼上唐鄭都官有詩刻石送周密學沆字子真真定安撫使贈狄節推國賔梁公之孫送丁正臣知蔡州感春不寐雞光皇祐二年謁告歸鄉里至治平二年方得再來愴然感懷詩以紀事辭墳嘉祐元年光通判并州因公事至此今歸辝墳不敢至夏縣而去於今十年矣謁三門禹祠又遊三門開化寺送僧歸吳次韻和韓子華寒食休沐與諸公同會趙令園暮歸馬上偶成送朝祕丞端彥子長子通判雄州光頃為諸生嘗受經於錢丈學賦於張丈今乃叨忝同為侍臣蒙錢丈賜酒張丈賜詩不勝愧悚之深言志為謝宋相國挽辭二首英宗皇帝挽歌辭三首送燕諌議知潭州送李益之侍郎致政歸廬山十月七日益之好談禪故效其語資善堂宴餞應詔胡太傅宿字武平挽歌二首送惠思歸錢塘鄭侍郎紓挽歌辭和吳仲庶寄吳瑛比部安道之子壯年致政歸隱蘄春送吳仲庶知江寧蘇才翁子美有贈枎溝白鶴觀黃道士詩紀于屋壁歲久漫滅今縣宰周同年得完本於民間扺豫求詩長垣道中作再使河北河北道中作夜發長垣送丁正臣通判復州致政王侍郎琪字君玉挽歌二首景仁召遊東園馬上口占依前韻奉送才元和甫使北哭劉仲邍送向防禦經知陳州春帖子詞皇帝閣六首太皇太后閣六首皇太后閣六首皇后閣五首夫人閣四首和景仁瓊林席上偶成時康與禹玉景仁次道之子同時登科在席早朝書事奉和早朝書事范鎮登長安見山樓長安送李堯夫同年別長安初到洛中書懷和景仁題崇福宫又寄題傳欽之濟源别業遊李衛公平泉莊贈河中通判朱郎中壽昌侍郎巽之子襁褓中母劉氏𬒳出壽昌長而訪之不能得熙寧中知廣德軍年五十三乃乞尋醫身自訪永得於同州為民黨氏妻迎以歸奏授封邑壽昌揚州人以與其母子孫俱在同州故折資通判河中寄題李水部庠滻水别業泉水詩送吳都官大元字一翁分司歸和州讀頴公清風集伊臯埀訓皆王度周召陳詩盡國風非獨立言方不朽相君功德已無窮人生百歲隙中光唯有髙名久不亡千古但令編簡在清風飬物一何長佳城鬱鬱閟英靈幸有文章見典刑開卷未終雙袖濕目前髣佛對淵庭一言華衮足為榮況託文編久愈明鄒湛不逢羊叔子丗間何處復知名公集有遺光詩數章寄題興州朝都官仲約東沼沼上唐鄭都官有詩刻石名郎遊勝地心迹繼風流昔為題詩著今因好事修四山相照映五馬屢淹留想見波光淨依然一片秋鄭詩云徹底千峯影無風一片秋送周密學沆字子真真定安撫使玉帳前牙舉銅魚左契分平生公望著期月政聲聞陌上壷漿隘潭邊花氣曛遙知待新將民物兩欣欣贈狄節推國賔梁公之孫天馬雲孫在終然骨相竒泥塗辱雖久霜雪志難移白髮無嗟老青衫莫厭卑為山已九仞髙節肯中衰送丁正臣知蔡州䟃𧽼汝水濵千騎擁朱輪懸瓠遺基古鞶囊吉夢新丹心留紫闥清耳逺紅塵須識明君意先應試治民感春積草滿春庭衡門永晝扄波頭何事白柳眼為誰青榮落浮雲度悲歡熟醉醒繁華非我物隨意任飄零不寐四逺寂然群動收只餘嚴鼓度坊樓無由更續三更夢何處飛來一點愁雞羽短籠深不得飛久留寧為稻粱肥膠膠風雨鳴何苦滿室髙眠正掩扉光皇祐二年謁告歸鄉里至治平二年方得再來愴然感懷詩以紀事十六載重歸順塗歌式微青松弊廬在白首故人稀外飾服章改流光顔貌非巫咸舊山色相見尚依依辭墳嘉祐元年光通判并州因公事至此今歸拜祭不敢至夏縣而去於今十年矣十年一展墓旬浹復東旋豈負襁褓愛橫遭章綬纒更來知幾日遺恨恐終天慟哭出松徑悲風為颯然謁三門禹祠信矣禹功美獨兼人鬼謀長山忽中斷巨浸失橫流迹與天地久民無魚鱉憂誰能報盛德空爾薦醪羞又贔屭青崖裂喧豗白浪豪客舟浮木葉生理脫鴻毛柏映孤峯短水際孤峯甚細而髙上有小柏者舊相傳不知幾何年矣而止長又餘人莫測其理銘書絶壁髙唐太宗刻銘底柱之隂魏鄭公撰字幾盈尺殘缺僅可讀河師不耕織容易戲風濤遊三門開化寺山石古來色河流無盡聲行舟自往返群木幾枯榮狂象調難伏空華滅復生我來何所得聊此濯塵纓送僧歸吳髙枕聊成夢晴空忽見花浮生盡是客何處得為家旅食帝城久歸舟澤國賖勿因菰菜味回首浩無涯次韻和韓子華寒食休沐與諸公同會趙令園暮歸馬上偶成冠蓋連翩陌上來風光爛漫擁樓臺玉巵貯酒隨冝飲綺席尋花觸處開小雨前宵先潑火季春明日又吹灰須知勝集人間少惆悵金羈容易回送朝祕丞端彥子長子通判雄州少傅名德重蔚然人物師群孫滿丹穴嘉瑞盡長離勿嘆毛羽短巳驚文采竒勉哉勤志業餘慶未應衰光頃為諸生嘗受經於錢丈學賦於張丈今乃叨忝同為侍臣蒙錢丈賜酒張丈賜詩不勝愧悚之深言志為謝疇昔勝冠日曽為絳帳生九言聞善教一顧得虛聲不意叨嚴近於今接老成寧須詩酒賜侍坐巳知榮宋相國挽辭二首仁聖𥘉承緒敷天籲俊賢得人兹最盛射䇿獨居先禁省英聲逺巖廊至化宣辭榮還故第三事究髙年吹灰須知勝集人間少惆悵金羈容易回送朝祕丞端彥子長子通判雄州少傅名德重蔚然人物師群孫滿丹穴嘉瑞盡長離勿嘆毛羽短巳驚文采竒勉哉勤志業餘慶未應衰光頃為諸生嘗受經於錢丈學賦於張丈今乃叨忝同為侍臣蒙錢丈賜酒張丈賜詩不勝愧悚之深言志為謝疇昔勝冠日曽為絳帳生九言聞善教一顧得虛聲不意叨嚴近於今接老成寧須詩酒賜侍坐巳知榮宋相國挽辭二首仁聖𥘉承緒敷天籲俊賢得人兹最盛射䇿獨居先禁省英聲逺巖廊至化宣辭榮還故第三事究髙年邦光華衮禭家寶素書陳東閣簮𥚑散西芒宅兆新泉臺無復曉柏徑不知春獨有髙文在芬芳繼古人英宗皇帝挽歌辭三首盛德師堯舜英姿肖祖宗太陽光遍照滄海量兼容鴻業知能繼齊民望可封如何未五載巳上鼎湖龍虹瑞流朱邸童髭侍紫宸簡心天與子授位帝知人學古功時敏鉤深道日新冝然三百載民物仰威神諌省臣無狀龍鱗昔屢嬰恩深忘位賤義重覺生輕不正誅鋤法仍蒙獎嘆榮百身何足報天造固難名送燕諌議知潭州長沙地饒美賈誼獨傷悲自古臨榮辱幾人無怨咨使君擁符節大艦出江湄意氣陶然樂應無弔屈辭送李益之侍郎致政歸廬山十月七日益之好談禪故效其語儒業金華貴歸心白鶴孤江山依舊在軒冕嚮來無嘯詠誰當共登臨未索扶浩然知此樂逈與世人殊水底元無月衣中自有珠六塵皆外物萬法盡迷塗瀑布寒雲濕觚稜瑞氣扶遙知至樂地不異在京都資善堂宴餞應詔士論歸清德皇心重老成陳謨侍經席得謝解塵纓坐密金章並行徐玉醴清都門昔供帳踈傅未為榮胡太傅宿字武平挽歌二首行冠鄉人品文為學者師黃裳藴厚德玉律儼清規大節人難奪嘉謨世莫知儀刑不可見遺烈滿豐碑裴回遊內禁密勿贊鴻樞隂德加民物清名服士夫天方遺一老星忽隕三吳疑從龍髯去來雲在帝都英宗時方上仙送惠思歸錢唐孤岫平湖外禪房老柏隂倦遊諳濁丗獨往遂𥘉心夜雨燈窗逈秋苔屐齒深勿鋤山徑草便有俗人尋鄭侍郎紓挽歌辭雲夢氣回復比肩生俊豪司農家學冨廷尉里門髙騏驥昔千里鳯皇今一毛即丘餘慶在終應吕虔刀和吳仲庶寄吳瑛比部安道之子壯年致政歸隱蘄春負米承親願巳餘遭母憂服除遂致仕耻隨雞鶩啄泥沙一朝投紱真高士萬卷藏書舊丗家齒髮未衰非藥物山林不返為雲霞厖眉尚有郎潛者徇祿憂生直可嗟送吳仲庶知江寧江南佳麗地人物自風流青骨靈祠在黃旗王氣收衣冠餘舊俗歌頌樂賢侯正恐還朝速江山未遍遊蘇才翁子美有贈扶溝白鶴觀黃道士詩紀于屋壁歲久漫滅今縣宰周同年得完本於民間扺豫求詩潦倒黃冠無足論白頭嗜酒住荒村狂名偶為留詩著陳迹仍因好事存金石鏘洋虛殿寂龍蛇灑落古牆昏飛黃滅沒浮雲外疲馬何能望駿奔長垣道中作極目王畿四坦然方輿如地蓋如天始知恃險不如德去殺勝殘巳百年再使河北桑麥青青四月𥘉皇華使者又脂車為臣豈得辭王事只向金鑾坐讀書河北道中作緑柳隂中白浪花河邊日日暗風沙解鞍縱馬悄無事隱几看書隨處家河勢東回今幾年濃隂滿目盡桑田川原變化無終極一氣不為常寂然原上纍纍古冢髙昔時意氣盡賢豪斷碑名姓巳磨滅永日東風吹野蒿夜發長垣長塗暑氣劇求日卧郵亭晝伏如牆鼠宵行似野螢歇鞍沙月白拂面栁風醒歷歷瞻雲漢誰為二使星送丁正臣通判復州得失固有命丗人空自勞冬溫少霜雪松短沒蓬蒿孤宦千里逺榮名一旦髙回看碌碌者太華與秋毫致政王侍郎珙字君玉挽歌二首弱冠獻竒䇿居然終賈才賦成平樂館歌奉柏梁杯侍郎天聖𥘉以江都主簿上書獻十策召試館職嘗侍宴後苑賦山水石歌首出諸文士獨被褒賞麗藻留昭丗英逰隔夜臺土中埋美玉誰見不興哀振鷺辭靈沼冥鴻翔太虛清朝解鳴玉舊里桂安車詩酒江山勝園林俸祿餘所忠今不往誰奏茂陵書景仁召逰東園馬上口占適野自可愛況逢佳主人馬穿官栁影衣拂帝城塵物外誰知樂樽前别有春年華已消歇歷歷見松筠依前韻奉送才元和甫使北析木帶天津華星隨去人揚旍踰絶漠負弩候前塵出塞風霜苦歸塗楊栁春會書專對美燁燁滿秋筠哭劉仲邍天下才無幾夫君獨患多髙文粲列宿英辨瀉長河榮宦成朝夢浮生度尺波舊僚空執酒相與淚滂沱昔醉金明渚今來慧辨祠當年笑相視此日哭殊悲天逈川原淨風髙草木衰江梅靈氣在泉下復相知送向防禦經知陳州千騎去翩翩專城尚少年韋平家好學隂馬丗稱賢官用才能進恩非雨露偏想聞河潤逺封略帝畿連春帖子詞皇帝閣六首肇履璿璣曆重飛緹室灰寒隨土牛盡暖應斗車回鸞路迎長日農祥正曉天九垓同燠沐萬物向蕃鮮盛德方迎木柔風漸布和省耕將效駕擊壤巳聞歌候鴈來歸北寒魚陟負冰相烏風色改暘谷日華升浮陽滿野白溶溶澤底山椒淑氣通草木豈能知造化一華一葉盡天功漠然天造與時新根著浮流一氣均萬物不須雕刻巧正如恭已布深仁太皇太后閣六首盛德𥘉臨震陽和巳動坤發生天施大厚載母儀尊種桃臨玉井裁勝刻金花借問此何處崑山王母家長樂曉鍾殘皇輿入問安東風猶料峭冒絮禦餘寒慶壽風煙接未央飛樓復道鬱相望春來無以銷長日間取經書教小王冰斯半解波先緑栁葉未生條巳黃四海澄清天子孝朝回日奉萬年觴東宫歸政五年餘隱几時觀黃老書禁闥無為民自化熙熙不獨在春初皇太后閣六首母德思齊盛天心奮豫初青暉凝輦路佳氣擁宸居暖日初添刻柔風乍襲衣拜孫時哺果觀織屢臨機膾肉紛銀縷蘭牙蔟紫茸太官遵舊俗歲歲與今同叉上花開海燕飛紅繒翦蕚蠟粘枝風前飄蕩參差羽還似瑶箱呈瑞時玉漏聲殘金殿開乘輿清蹕問安來盡將草木欣欣意同與新春入壽杯裁縫大練成春服慈儉由來性所鍾肯使外家矜侈靡車如流水馬如龍皇后閣五首穜稑獻新種禕褕浣舊衣玉鈎隨步輦行春采桑歸樛木猶藏葉天桃未作花六宫歌逮下四海詠冝家溝暖冰初斷窗晴雪半消餘寒不足畏塗壁盡芳椒寶勝金幡巧鬪功綵花蠟燕揚和風玉盤翠苣映紅蓼捧案朝來獻兩宫春衣不用蕙蘭熏領緣無煩刺繍文曽在蠶宫親織紞方知縷縷盡辛勤夫人閣四首璧帶非煙潤金鋪霽景鮮繍功添采縷和氣入繁絃翦綵催花發開簾望燕歸藏􅍐新過臘習舞競裁衣綺窗繡户又東風丹掖遊陪歲歲同但願太平無限樂何須三十六離宫聖主終朝勤萬機燕居專事飬希夷千門永晝春岑寂不用車前插竹枝和景仁瓊林席上偶成時康與禹玉景仁次道之子同時登利在席念昔瓊林賜宴歸綵衣緑綬正相冝將雛雖復慰心喜負米翻成觸目悲殿角花猶紅勝火樽前髮自白如絲桂林衰朽何須恨幸有新枝續舊枝早朝書事太白明如李恐誤東方三丈髙晨光孤照闕霧氣濕侵𫀆槐栁經霜慘驊騮得路豪素飱無小輔俯仰愧金鼇奉和早朝書事范鎮日氣曉先赤天形秋轉髙風輕金轡勒霜重毳衣袍匹馬精神倦前騶意思豪近來君在告連直幾畨鼇登長安見山樓到官今十日才得一朝間歲晚愁雲合登樓不見山長安送李堯夫同年昔歲瓊林花氣曛今朝長樂栁梢春事隨流水滔滔度鬢結繁霜戢戢新世路飽諳都是夢人生可貴莫如身會須築室臨清洛相與檇筇戴葛巾别長安暫來還復去夢裏到長安可惜終南色臨行子細看𥘉到洛中書懷三十餘年西復東勞生薄宦等飛蓬所存舊業惟清白不負明君有朴忠早避喧煩直得䇿未逢危辱好收功太平觸處農桑滿羸取閭閻鶴髮翁和景仁題崇福宫歷歷山頭雪泠泠松下風樽中亦有酒恨不與君同又不獨山頭白人頭亦垂素積雪有時消青山色如故寄題傅欽之濟源別業縣郭遙相望修篁百畝餘林間清濟水門外太行車道勝隨冝足身間與世踈何時容命駕采蕨釣肥魚遊李衛公平泉莊相國巳何在空山餘故林嚮時堪炙手今日但傷心陵谷尚未改門闌不可尋誰知荆棘地鶴蓋舊成隂贈河中通判朱郎中壽昌侍郎巽之子襁褓中母劉氏𬒳出壽昌長而訪之不能得熙寧中知廣德軍年五十三乃乞尋醫身自訪求得於同州為民黨氏妻迎以歸奏授封邑壽昌楊州人以其母子孫俱在同州故折資通判河中陟屺今將老扶牀昔未行旨甘無所展朱紫不為榮里巷傳呼入比鄰失涕驚方知貫金石何以易精誠寄題李水部庠滻水别業茅茨臨素滻沃野帶長林日永一堂靜草生三徑深銷憂何用酒為樂不須琴擾擾市朝客無人知此心泉水詩送吳都官大元字一翁分司歸和州泉水出幽谷原流本自清縈回遍中國浩蕩入東瀛峽口春雷怒潭心曉鑑平悠悠隨所值行止兩無情溫國文正公文集卷第十一
