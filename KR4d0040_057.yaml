body:
  text: 表為龐公讓明堂加恩第一表第二表為龐相謝明堂禮成加光祿大夫行尚書户部侍郎依前樞蜜使檢校太傅表謝生日賜羊酒米笏記夫人謝功德疏文皇帝皇后貴妃為文相公謝神道碑文表為文相公求退第二表為龐相公讓官表為龐相公再讓宰相表為龐相公謝官表為文相公許州謝上表賀皇子昕建節表謝中冬衣襖表賀皇子降生表賀章獻章懿皇后祔廟表為滑州張龍圖作進古文孝經指解表進通志表謝賜資治通鑑序表謝獎諭敕書并帶馬表永興謝上表遺表元豐五年秋吾若語澀疑為中風之候恐朝夕疾作猝然不粉乃遂作遺表自書之常置卧內俟且死以授范堯夫范夢得使上之八年三月五日官車晏駕此表無用留以示子孫欲使知吾事君區區之心耳賀立皇太子表謝起居減拜表為龐公讓明堂加恩第一表展采合宫甫成於盛禮推恩列位首冒於徽章內省空踈交深震栗云云伏念臣出於單族素乏異能遭㑹聖辰襲承義訓肩隨群士齒列具僚始更郡縣之勞遂玷閨臺之美雖慕盡公之節力自祓摩迄無髙衆之名可容稱道頃由邊瑣進二樞廷復參承弼之司旋總幾微之務固巳任踰才表榮出望涯十七物之珍羞居慙厚賜三百囷之重祿坐愧素䬸雖僶勉以自安常忸怩而內訟屬國家講求闊典祗紹明禋幸千載之親逢叨一時之榮觀伏遇尊號皇帝陛下大衷廣覆聖道兼容不專享於神休俾下覃於朝衆謂臣職當扈蹕禮與執膰曲矝孱陋之蹤猥𬒳殊尤之澤位列元功之次邑增真食之封事與志違名非德稱惴如臨谷憂甚履氷豈可忽非據之災安無勞之賞俾衆庶有假人之議致朝廷蒙含垢之羞熟自省循誠難膺克伏望俯矝危欵曲軫睿慈特寢不資之恩以全無似之質露誠獲允受賜益深干冒宸嚴第二表愚衷上列冀寢於殊恩睿志莫回必申於前命征營無措兢戰失圖中謝伏以總章昔王之盛節追嚴廟祏前載之美談唐虞著五府之文啇周增重屋之制久兹曠絶未暇修明伏遇尊號皇帝陛下祗若天常寅恭祭典謂五精之氣不可久契於神歡三祖之靈不可弗親於宗祀若稽古訓濬發聖謨昆侖倣玉帶之圖路寢采康成之義八窗四户屬象相依萬舞九成聲明具在臣謬居機近忝助祼將庀徒護法駕之嚴負璽託屬車之末奉汶上肅雍之慶無周南留滯之嗟其在蠢愚固為榮幸不可復妄膺髙位慆竊寵名况士卒有暴露之勞百司有供億之費欲加之賞宜用為先臣祿秩巳豐勤劬至薄不可復加固難褒進以重愆尤伏惟天鑒崇髙下垂燭察物誠精至庶獲感通干冒宸嚴為龐相謝明堂禮成加光祿大夫行尚書户部侍郎依前樞密使檢校太傅表臣某言伏奉云云叨榮過分揣已非冝制命益嚴懇辭不獲中謝伏念臣顓愚無述孤陋寡徒起家衡茅致位機近此皆出於天幸斷自宸知非才伎過絶於人豈朋援隂為之地是以每循涯知止以寵為憂獲一官若負譴訶進一位若懷疾眚非敢厭薄髙爵希慕虛名誠以居二府之崇贊万機之大久留不去妨廢實多况祿厚者衆之所趨勢尤者人之所疾不獨力綿任重失職是虞亦將智淺跡單處躬可畏方自謀於遜避以深逺於譏嫌豈謂伏遇尊號皇帝陛下濬發清衷述修盛禮合祫天地之祀嚴配祖宗之靈茂典既成鴻私旁洽謂臣屬當扈從與在駿奔疇其執事之勞均以受釐之慶遷地官之亞列增帝傅之寵名悉非庸虛所能堪稱是用力陳危欵冀寢殊思葵藿之心徒自傾而無隱雨露之澤非巳降而可收雖祗徇於詔文實內慙於靈府敢不益堅苦節愈勵撲忠當官而行蹈水火而無避惟力是視竭筋骨以為期謝生日賜羊酒米笏記臣遭㑹聖辰謬塵機任屬是門弧之旦方慙鼎食之榮敢意睿慈重加蕃錫內循朽薄徒極悸惶夫人謝恩功德疏文皇帝伏以金仙妙法克贊於邦猷寶偈勝因有資於帝祉妾親逢熙旦祗戴鴻恩庶慿佛事之嚴仰佑皇基之固懇祈攸至慧照所臨皇后伏以坤元布德亭育群生太隂凝暉燭臨四海輒依真界恭薦微誠潔蒲塞之嘉羞敷貝多之妙偈庶資佛事以佑母儀貴妃伏以䦕雎首於國風式昭淑德軒星著於天象實亞柔儀敢慿金偈之勝緣仰輔椒闈之多福慈明所鑒懇𣢾惟精為文相公謝神道碑文表臣某言伏蒙聖恩詔翰林學士承㫖王某撰先臣某神道碑文降付臣者命發宸廷文成禁署澤加存沒榮動邇遐中謝竊以金石之傳久而彌茂風樹之感貴而自悲諒知為子之心咸有顯親之願伏念先臣䇿名休運接武辨朝陳力當官服勤沒齒臣荷析薪之業紹作室之功雖資性甚愚曽無肖似而義方未墜少逭譴尤伏遇尊號皇帝陛下過聽菲才遽加大任置彼官師之首列於丞弼之司非藉丗榮曷膺國寵頃以歲時得卜宅兆圗新將論撰於豐碑用表章於大隧豈意眷明曲照優渥沓臻䊸彼神翰揭諸螭首仍詔代言之職直書傳信之辭著琬琰以無忘與松楸而並列聲光不朽永蒙庇於昆孫精爽有知潜拜嘉於幽壤荷恩益腆撫已知輕且身體髮膚皆仰資於顧復而股肱心膂敢有愛於生成未識津涯徒知涕泗為文相公求退第二表臣某言伏奉今月某日批答云云臣省躬甚明椯分巳熟非敢外飾以邀上知天恩留連未見識察物意專慤期於感通中謝伏念臣本以諸生親逢盛丗行能無出於萃類學術不際於幾微所期解韋布之衣霑斗石之祿竭簿領之效免耕稼之勤安敢企踵帝庭許身王佐伏遇尊號皇帝陛下嘉其木訥亮以孤忠課於近小之功粗能稱旨役以煩辱之事不至敗官乃謂榱桶之才可勝棟楹之任錡釡之器足兼鼎鼐之容遠自西州驟叨重柄躋密地則不踰中宿參大政則曽未朞年遽越等夷直登佑弼靜言遭際熟察基緣寧左右先為之容豈朋援隂為之地莫非眷鑒特振寒蹤雖以草木之微猶知雨露之澤况於有識詎敢忘恩豈欲違去旒扆之前逺離闕廷之外棄萬鍾之秩辭四輔之崇顧以義不可留情有所迫大易存覆餗之戒詩人著在梁之譏任重難勝位髙多懼雖人主含貸未賜於譴訶有司因循不加於繩治臣敢不捫心自愧顧影知非乘疵吝之未形保名迹而先退必使愆尤增積謗讟流聞致陛下失始終之仁愚臣受逺邇之責非止謀身之過抑亦負國之深是用寢食震驚夙宵悸栗視金章於芒刺等黃閣於焦原苟未去身何能歉志伏望燭臨危𣢾矝恤苦言聽避位於上司得保躬於散地博求俊傑光輔休明則臣俯就下陳若獲九遷之喜出居外職無殊三接之榮干冒冕旒不勝惓惓切至之誠為龐相公讓官表臣某言伏奉制命特授臣某官者恩出非常位遷不次內循空薄交集震驚中謝臣識昧踈通學非殫洽依慿時會叨假國靈荐更要劇之權遂躋通顯之地陪侍惟幄參與機衡雖盡股肱之勞不遺餘力訖無毫髮之效克厭衆心居常自思敢忘內訟方且俟清間之燕竭悃欵之私力辭宥密之聮退祈冗散之秩庶逭官責少息人言豈期志願未從寵光逾峻遽以枵踈之質猥當佑弼之司承命以還措躬無所竊以緝熙帝術寅亮國成翼戴萬機統和三極得人則群生蒙福失職則百度乖方詎可妄居豈容虛授臣雖欲冒榮不顧懷祿苟安儻衆庶責望之深成朝廷倚毗之失是用夙宵愧恧寤寐兢憂不知列鼎之榮恍若臨淵之懼伏望尊號皇帝陛下俯從危欵曲照孤蹤矝其驅䇿之勤為日巳久察其避議之固於心不欺俾祗服於舊官特寢除於新命旁求俊德式副輿情干冒宸嚴臣無任懇迫激切之望為龐相公再讓宰相表伏奉某月日批答云云需奏仰陳冀安於涯分綸言俯及未照於悃誠蹐地載驚履氷逾畏中謝臣聞量能授職者人主之通術陳力就列者臣下之令圗義或此違治何由立臣是以退居深念申旦伏思竊惟佑弼之崇實繫安平之夲總領衆職鎮撫四夷下遂萬物之冝上序三光之統凡將圖任豈易輕言至若黃霸循良朱博鋭敏始為郡守皆號能臣暨陟宰司遂隳盛譽或受嗤於鶡雀或召咎於鼓妖豈前智而後愚蓋任盈而量溢况臣空薄詎敢擬倫必欲使用不違才舉無敗事則莫若委之藩服俾敷寬大之條置以邊方得奉綏懷之略庶幾展效不敢憚勤儻以服役有年居官無過而欲捐之草莾尚將留彼闕庭則願且守故棲未遷它職祕自寧於密地得時望於清光忝幸已深感槩何極豈敢使巖廊曠位元鼎失和竊貪一日之榮不虞四海之責伏望尊號皇帝陛下曲垂矝恤靡賜忽遺察底裏之無欺全始終而可保特收渙命俯徇愚衷少安據蒺之憂尚免在梁之刺內惟懇迫期獲允俞為龐相公謝官表伏奉某月日批答云云荷恩逾分瀝懇敷言成命莫回愧顔無寄中謝伏念臣賦能甚薄探道未深習詩禮以為儒師法令而𥙷吏適際亨嘉之㑹誤膺濬哲之知亟陟顯塗荐膺煩使監邊則盡護群帥侍幄則協贊萬微密邇清光訏謨基命固巳任逾器表榮溢望涯居無終食之間少忘素䬸之責何意天恩橫𬒳宸眷曲成猥掄樗液之才專委棟隆之任靡由階漸遽爾直登冠冊府之華資總史臣之善志翻經演法進律加田甫聞出綍之言殆失措躬之地力陳丹慊仰黷邃旒雖堅不奪之誠難變巳行之令威顔甚邇私願莫從俯僂若驚徜佯自失此蓋伏遇尊號皇帝陛下用人道廣愛物義深不求純備之功姑委燮調之職爰從隗始俾奉蕭規敢不祓飾厥心耀明其志識慮所及不敢顧私筋力可任期於盡瘁少助緝熙之化仰酬覆燾之仁為文相公許州謝上表伏奉制命云云巳於今月某日到任上訖避辭公鼎雖弛負擔違離天閽倍深眷戀中謝伏念臣材非出類識不先幾逢辰休嘉致位通顯謹司斥候亟守於邊隅䖍布教條荐更於方鎮訖無聲跡可聳傳聞伏遇尊號皇帝陛下明燭幽微仁霑疏逖遽選掄於遐服俾陪二於中樞曽不浹旬遂參大政未能周歲爰陟上司念遭際之非常求比倫之蓋寡雖濵隕越豈謝生成是用杜僥幸之門窒竒邪之徑激揚廉讓抑止浮華苟有利於公家固不為於私計然而力非其任智實有涯群心萬殊理難稱愜衆目環視動成詆訶紛如鋒矢之衝浩若波濤之沸從之則懼傷國體違之則立致身殃進退靡遑啓居無所屢以清間之侍力陳退避之誠蓋揣分之甚詳恐敗官而為辱貴全終始不蹈顛危陛下察其愚衷必非緣節愍其孤迹易致怨憎俾述職於近藩得免譏於尸祿仍進天官之秩復升殿幄之華禮數甚優恩輝愈洽脫吕梁之險亟就安瀾去焦原之危更遵夷路非曲加於庇佑豈自信於保全惟許昌之奧區乃昆吾之故壤土毛豐衍民齒夥繁敢不志在拊循勤加訓導奉承寬大之詔期臻冨庶之風少副憂勤兹為報效賀皇子昕建節表臣光言伏覩進奏院報月日皇子授忠正軍節度使檢校太尉壽國公封建夲支光隆基祚王室增維城之固萬方有磐石之安臣光中謝恭惟皇帝陛下仁𬒳海㝢道合天衷膺受純禧誕錫元胄采古昔之令典考今兹之盛務爰立藩邸恢建宏規假節秉鉞習以戎律赤舄衮衣崇其儀望苴茅胙土訓以政治明尊尚親資忠移孝一舉而善衆美具該斯實堂御名之逺謀黎苗之隆福也臣述職外方傳聞嘉喜不勝拜蹈激切之至謝中冬衣襖表臣光言伏奉詔書賜臣翠毛細錦綿旋襴一領者祗荷寵光心顔無措臣光中謝恭惟皇帝陛下皇仁溥洽衣被九圍軫念祁寒寵錫嘉服臣雖無似蒙澤猶均濫承安燠之榮空慙不稱之責賀皇子降生表臣光言伏覩都進奏官牒皇子降生仍令諸道不得進奉者伏以熊羆之兆載於詩雅弓韣之祥著於禮典蓋以保育黎元無兹為大夲支既茂基祚益安是故百男昌而周興五宗彊而漢熾隆替之源古今一揆臣光中謝伏惟尊號皇帝陛下純孝奉先逺䣭垂丗錫類之祉久屬群心皇穹隆休誕啓茂緒蓬矢遵吉牢具修儀斯實宗廟眷祐之靈黎庶無疆之福窮河際海聲教所霑儻曰有心率知相慶况臣職叨近著位備列藩竊聆嘉喜奚勝踊躍官守有繫阻造闕廷賀章獻章懿皇后祔廟表為滑州張龍圖作臣某言伏承今月九日章獻明肅皇后章懿皇后並升祔真宗皇帝廟室禮畢者聖心追逺思慕慈親陟配禰宮順成大禮臣某中賀伏以章獻明肅皇后輔佐先朝敷明隂教導揚末命鎮綏大業章懿皇后淑慎在躬受天元祉茂育聖神光啓丕祚而猶分祀閟宫未登太室尊號皇帝陛下濬發孝思㳂情著制采開元之令典講國家之故事涓選嘉辰咸升配侑述祖宗之志成母后之尊允所謂道隆列辟法垂後丗禮行於宗廟孝通乎神明日月所臨霜露所墜抃手蹈足小大同之况臣任居藩垣職參臺閣欣豫之志倍億等夷官守所居不獲奔詣闕廷稱慶進古文孝經指解表臣光言臣聞聖人之德莫加於孝猶江河之有源草木之有本源逺則流大本固則葉繁是以由古及今臣畜四海未有孝不先隆而能宣昭功化者也臣某誠惶誠恐頓首頓首伏惟尊號皇帝陛下純孝之性發於自然動靜云為必咨訓典起居出入不忘先烈以為滁州者太祖皇帝所以禽馘姦桀肇開王跡并州者太宗皇帝所以芟夷僣亂混一九圍澶州者真宗皇帝所以攘却貪殘億寧華夏皆大勳懿業威靈所存遂命有司分建原廟圖繢聖容躬題扁榜嚴奉之禮備盡恭勤羽衛供帳率從豐衍兹有以見陛下尊顯祖宗之意無不至矣經曰愛恭盡於事親而德教加於百姓刑于四海夫以陛下天授之資愛恭之志而又念夫百官者祖宗之百官不可以私非其人府庫者祖宗之府庫不可以賞非其功法令者祖宗之法令不可以罰非其罪慎之重之益自警戒如是日月基緒之固巍如泰山黎民乂安四夷懷服草木禽魚靡不茂豫此誠孝德之極致也臣愚幸得𥙷文館之缺以經史為職竊覩祕閣所藏古文孝經先秦舊書傳注遺逸孤學堙微不絶如線是敢不自揆量妄以所聞為之指解雖才識𥚹淺無能發明庶幾因聖人之言得少關省覽則糞土之臣榮願足矣其古文孝經指解一卷謹隨表奉進以聞臣光誠惶誠恐頓首頓首謹言年月日具位臣司馬光上表進通志表臣光言臣聞治亂之原古今同體載在方冊不可不思臣光誠惶誠恐頓首頓首臣少好史學病其煩冗常欲刪取其要為編年一書力薄道悠久而未就今兹伏遇皇帝陛下丕承基緒留意藝文開延儒臣講求古訓臣有先所述通志八卷起周威烈王二十三年盡秦二丗三年史記之外參以它書於七國興亡之迹大略可見文理迃疏無足觀采不敢自匿謹繕寫隨表上進干冒宸嚴臣無任戰汗屏營之至臣光誠惶誠恐頓首頓首謹言謝賜資治通鑑序表臣光言今月九日伏蒙聖恩令臣讀所修資治通鑑仍面賜御製御書序一篇者臣性識駑鈍學問空淺偶自幼齡粗涉群史嘗欲芟去蕪雜發輝精雋窮探治亂之迹上助聖明之鑒功大力薄任重道悠徒懷寸心行將白首伏遇先皇帝若稽古道博采徽言俾托舊聞遂伸微志尚方紙墨分於奏御之餘內閣圗書從其假借之便未遑汗簡巳泣遺弓陛下祗服駿命丕承前烈臣以屬藁有緒不可不成受詔所為不敢不上詮次無法抵捂實多仰汚覽觀伏須罪戾豈謂陛下赦其狂簡賞其專勤思所以旌異於它書焜耀於群下特發殊恩不用常例屬當勸講之始俾參經史之末逮此清間命之進讀而又序其夲原冠於篇秩發言為典肆筆成書炳蔚玄變如虎豹之明灝噩無涯逾啇周之盛况復褒貶是非古人有所未至造端立意愚臣不能自言陛下一賜指陳渙然氷釋至於博而得其要簡而周於事典刑之總㑹冊牘之淵林臣實何人克堪斯語若乃嘉文宣以作則援正觀而為師兹實生民之福豈伊微臣之幸臣某誠感誠抃頓首頓首竊以周之南董漢之遷固皆推髙一時播美千載未有親屈帝文特紆宸翰曲蒙獎飾大振輝光如臣朴􅈪小才固非先賢之比便蕃茂澤獨專後丗之榮退自揣循殆無容措遂使螢燐末照依日月以永存草木常名附天地而不朽臣不任懇欵之至謹奉表陳謝以聞臣光誠感誠抃頓首頓首謹言年月日具位臣光上表謝獎諭勑書并帶馬表臣光言伏蒙聖恩以二股河北流巳閉斷降勑書獎諭仍賜衣一對金帶一條鞍轡馬一匹者聖言優渥寵錫便蕃顧循無勞何以堪稱臣光誠感誠愧頓首頓首竊以去秋積雨河決棗強朝廷憂勞憫兹昏蟄臣祗奏明詔相視所冝詢采衆言聞逹天聽捨短收長率由聖志處決利害昭晣如神今流勢東所徑趨渤碣恩冀西北公私安堵斯皆上帝儲休明主獨斷勞心建䇿則有當官之人勤力奏功則有執役之士臣進無運籌之智退無負薪之勤曽何施為膺兹貺賚辭之則涉於僞慢受之則實為尸素有􅌤面目無地自容臣性雖頑愚靈於草木蒙𬒳天施敢忘報效唯期竭忠庶禆萬一臣光誠感誠愧頓首頓首謹言永興謝上表臣光言昨奉敕差充永興軍一路兵馬都總管安撫使兼知永興軍府事已於今月十四日到任訖荷恩至重任責尤深巡撫吏民敷宣詔令臣光誠感誠懼蝢首頓首臣識慮暗淺規為闊踈唯知愚忠屢貢狂直奉事三世操守一心間以齒髮浸衰疾疹交集曽靡論思之效久汚侍從之班既無𥙷於夲朝祈自安於散地不圗睿澤更委名都雖要重之權自知不稱而煩劇之地難以固辭受命以還措躬無所朅來就道甫爾到官維此咸秦昔為畿甸山川秀美土地膏腴論其平時誠為樂土在於今日滴值凶年經夏亢陽苗青乾而不秀涉秋淫雨穗腐黑而無收廩食一空家之蓋藏之粟襁負相屬道有流離之人老弱懷溝壑之憂姦猾蓄􅍉蒲之志正冝安靜不可動搖譬諸烹魚勿煩擾則免於糜爛如彼種木任生殖則自然蕃滋謹當䇿勵疲駑雕磨朽鈍智力所及勤瘁無辭雖復失位危身終不病民負國庶幾小𥙷用答大恩臣無任戴天荷聖激切屏營之至謹奉奏謝以聞臣光誠感誠懼頓首頓首謹言遺表元豐五年秋吾言語澀疑為中風之候恐朝夕疾作猝然不救乃豫作遺表自書之常置卧內俟且死以授范堯夫范夢得使上之八年三月五日宫車晏駕此表無用留以示子孫欲使知吾事君區區之心耳臣光言臣丗受國恩常思𥙷報伹以性識愚戇不合聖心是以比年以來屏居杜口不敢復言今衰疾日侵將填溝壑敢以平生忠懇一逹天聰庶幾陛下知臣無求於朝廷而未嘗忘國家也臣光誠哀誠切頓首頓首伏惟皇帝陛下天縱睿哲燭物精敏踐阼以來鋭志求治圗任竒傑恢張洪業得王安石委而信之不復疑二聽其言從其計人有沮毀之者責而逐之雖周成王之信周公齊御名公之任管仲燕昭王之倚樂毅蜀先主之託諸葛亮殆無以及斯乃不丗出之英主曠千載而難逢者也不幸所委不得其人安石既愚且愎不知擇祖宗之令典合天下之嘉謀以啓迪聰明佐佑丕烈乃足己自是謂古今之人皆莫己如有人與之同則喜與之異則怒喜則數年之間援引登青雲怒則黜逐擯弃終身沉草萊凡人之情誰不喜冨貴而畏刑禍於是忠直逺屏姦諛競進為之腹心羽翼以干祿徼利遂使中外權要之任非其黨與不得處也深疾諌者過於仇讎嚴禁誹謗甚於盜賊然後逞其胸臆變亂舊章興害除利捨是取非其尤病民傷國者略舉四條其一曰青苗錢分命使者誘以重賞強散息錢朘民求利取新償舊負債歲多官守空簿實無所獲貨重物䡖公私兩困其二曰免役錢縱冨強應役之人使家居自逸征貧弱不役之户使流離轉死凡農家所有不過榖帛與力自古賦役無出三者今皆不取專責以錢錢非私家所鑄要須貿易外求豐歲榖賤巳自傷農又迫於期限不得半價盡糶所收未能充數家之糇糧不暇更留若值凶年則又無榖可糶人人賣田無往可售遂至殺牛賣肉伐桑鬻薪來年生計安敢復議用此雇浮浪之人以供百役使緩則為姦急則逃竄處事若此豈非倒置其三曰保甲自唐募長征之兵賦農民榖帛以給其衣糧農固巳困矣今榖帛稅如故又使捨耕桑事戰陳一身二任民何以堪又罷巡檢兵士及尉司弓手皆易以保甲半月一代彼畎畒之民尚未能操弓挾矢已復代去用此擒盜不亦難乎夫奪其衣食使無以為生是驅民為盜也使比屋習戰勸以官賞是教民為盜也又撤去捕盜之人是縱民為盜也謀國如此果為利乎四曰市易遣吏坐列販賣與細民爭利下至菜果油麵駔儈所得皆攉而奪之使道路怨嗟逺近羞笑啇旅不行酒稅虧損奪彼與此得少失多又稱貸於民恣其所取使無賴子弟得醉飽之資在家父兄受督責之苦傾資破産什有五六凡此四者皆逆人情違物理天下非之莫之肯從安石乃以峻法驅之彼十惡盜賊纍更赦令猶得寬除獨違新法者不以赦降去官原免是其所犯重於十惡盜賊也安石苟欲遂其狠心無顧治體此其厲階至今為梗也又有姦詐之臣如种諤薛向王韶李憲王中正之徒行險徼幸懷諼罔上輕動干戈妄擾蠻夷夫兵者國之大事廢興存亡於是乎在而諤等苟營一身之官賞不顧百姓之死亡國家之利病輕慮淺謀發於造次深入自潰僅同兒戲使兵夫數十萬暴骸於曠野資仗巨億弃捐於異域昔王恢為馬邑之謀單于覺之遁去時漢軍無所失亡但無功耳武帝猶以為不誅恢無以謝天下今潰敗亡失狼藉如此而建議行師之人晏然曽無愧畏或更蒙寵任竊見國家至仁重惜人命諸州論囚有法應流而誤入死者舉州官吏皆坐停廢奈何使數十萬人無罪就死反無所坐乎此所以使狂躁貪冒之人競為常試之說而無所懲艾者也若舉事屢如此其於國家豈不可憂乎臣聞堂上不則郊草不贍曠耘是以古聖王之治天下必先內而後外安近以服逺故書曰帝乃誕敷文德七旬有苗格詩云王猷允塞徐方既來下至齊淵聖御名晉文亦先冨教其民然後用之陛下何不視今曰朝廷之政治何如群臣之智能何如百姓之冨樂何如士卒之精鋭何如乃遽從事於四夷也臣所惜者以陛下之聖明不師虞舜周宣之德反慕秦皇漢武之所為借使能踰葱嶺絶大漠鏖臯蘭焚龍庭又何足貴哉自古人主喜於用兵疲弊百姓致內盜蜂起或外冦窺覦者多矣申屠剛曰未至豫言固常為虛及其巳至又無所及必若待四方糜沸如秦漢隋唐之季然後悔之固巳晚矣夫諌爭之臣人主之耳目也安可一日無之書曰若跣弗視地厥足用傷設有人閉目塞耳跣而疾趨前遇險阻安有不顛躓者哉臣竊見十年以來天下以言為諱大臣偷安於祿位小臣苟免於罪戾閭閻之民憔悴困窮無所控告宗廟社稷危於纍卵可為寒心人無賢愚貴賤莫不知之而訖無一人敢發口言者陛下深居九重徒日聞諛臣之言以為天下家給人足太平之功十已八九成矣臣是以不勝憤懣為陛下忍死言之庶幾陛下覽其垂盡之辭察其碩忠之志廓然發日月之明毅然奮乾剛之斷悔既往之失收將來之福登進忠直黜逺佞邪審黃髮之可任寤諞言之難信罷苗役廢保甲以寬農民除市易絶稱貸以惠工啇斥退聚斂之臣褒顯循良之吏禁約邊將不使貪功而危國制抑近習不使握兵而北亂除苛察之法以隆易簡之政變刻薄之俗以復敦朴之化使衆庶安農桑士卒保首領宗社永安傳祚無窮則臣沒勝於存死榮於生瞑目九泉無所復恨矣臣不勝瞻天戀聖之至謹手書遺表以聞臣光誠哀誠切頓首頓首謹言年月日端明殿學士兼翰林侍讀學士太中大夫臣司馬光上表賀立皇太子表臣光言伏覩今月三日制書節文皇子延安郡王傭可立為皇太子仍賜名煦者主器惟長立邦家之基錫命以時為社稷之福臣光中謝竊以天意與子人情愛親三王以來百丗不易伏惟皇帝陛下光紹前烈濬發逺猷仰尊宗廟之嚴俯眷蒸民之重寵建上嗣誕告多方離日昭布於重光震雷何啻於百里封略之內聲教所覃凡有識知孰不鼓舞况臣叨居近列夙受大恩喜聞徽音逺踰庶品無任踊躍之至謹奉表陳賀以聞謝起居減拜表臣光言伏惟閣門告報今月十四日內降以臣與吕公著近各推恩轉官所有將來正謝特令兩拜起居餘免舞蹈仍於執政官班次後别作一班及自今後凡遇前殿應干大起居特令别作一班止兩拜起居恩出非常禮加異數優假太過慙負愈深臣光誠感誠懼頓首頓首臣猥以瑣才預聞機政去春以後疾疹屢生入冬以來飲食漸少逮兹歲序之首頓覺筋力之衰拜起絶艱朝請殆廢內惟恩紀之重天地所不能踰退思績效之微絲毫未嘗有立欲避位則為罪益大欲就列則強力不前朝夕為衆目所觀啓處無措躬之地敢謂皇帝陛下太皇太后陛下仁霑枯朽明燭幽微特虧著定之儀曲遂形骸之便臣詢諸故老或謂有舊章然彼皆位躋宰輔之崇德著耆明之美豈臣么麼所敢比方欲辭則寶所不支欲受則自知非分蹴踖心悸戰兢汗流惟仰賴於寵靈冀有瘳於藥物病庶遄巳禮得如𥘉期於竭忠不敢愛死謹奉表稱謝以聞臣誠感誠懼頓首頓首謹言溫國文正公文集卷第五十七
