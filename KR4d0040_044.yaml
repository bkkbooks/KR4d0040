  text: 溫國文正公文集卷第四十四
  hash: sha256:acf94260932ffc7688e6e2578cef10960f67fc591a819c51d485078bfbbd87d4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_044-1a}
body:
  text: 章奏二十九申宣撫權住製造乾糧皺飯狀奏乞所缺青苗錢許重疊倚閣狀奏為乞不將米折青苗錢狀奏乞兵官與趙瑜同訓練駐泊兵士狀申宣撫權住製造乾糧皺飯狀准都轉運司牒准宣撫使衙劄子節文製造乾糧州軍將􅔋一斗變造乾糧五斤仍量支與柴錢勘㑹近准宣撫使衙劄子節文指揮㳂邊四路十四州軍并近裏永興軍河中府同耀乾州鳯翔府等州軍變造􅔋餅皺飯當司已兩次牒逐州軍疾早變造施行去訖今又准前項宣撫使衙劄子巳牒逐州將􅔋一斗變造乾糧五斤仍量支與柴錢如闕􅔋即疾速計置收糴變造乾糧所是柴錢斟量支給施行去訖牒請照㑹施行者右具如前勘㑹先准中書劄子節文奉聖旨今後起發義勇赴㳂邊戰守並令自賫備一月口食與折將來夲户稅物若不能自備只乞於起發州軍預請一月口食賫往者亦聽又勘會永興軍近准都轉運使司牒准宣撫使衙劄子近准朝旨義勇上畨令附帶乾糧一稱至屯戍州軍須合預行變造乾糧准備支遣附帶前去右劄送陜西轉運司檢㑹近降義勇分畨條貫指揮㳂邊四路十四州軍并近裏永興河中同耀乾鳯翔六州府速行勘㑹義勇所居縣分近便省倉斛斗內有􅔋粟或白米便約義勇合附帶乾糧稱數中停變造􅔋餅皺飯如見在􅔋數不多即一色變造皺飯仍趂此時月造下兩畨令附帶數目免致非時蒸㬠易為損惡仍每乾糧一稱破係官布造袋子封印如法收將來義勇上畨日依數附帶者光切詳義勇戍守之時每人逐日給米二升半其一月口食七斗五升若更加乾糧一稱并器械衣裝盤纏等物切慮一人之力難以勝任兼今來變造乾糧皺飯須至差配百姓當此饑饉民間不易之際雖云量支柴薪亦不能全無搔擾况即今諸縣官倉􅔋米至少昨准朝旨散支第四等第五等闕食人户各二石尚未有備若更造乾糧皺飯即將來二三月間正當闕食之際更將何物可以救濟必見大假失所竊見慶曆年中議欲出兵討伐元昊亦曽令陜西諸州製造乾糧皺飯萬數不少後來既不出兵其乾糧皺飯所在堆積經年朽腐不可復食盡為棄物今官中錢榖比於慶曆年尤更難恃若復造此物徒使公私勞費卒無所用誠為可惜又國家備邊若止於戍守則㳂邊自有倉廪無用乾糧皺飯今來承准指揮製造上件乾糧皺飯仍令十日一申倉卒取辦切慮百姓猜疑以為國家又欲出兵必致逺近驚憂無由解諭至時不為便穩光巳指揮夲路前項五州軍且未令造乾糧皺飯更聽候宣撫衙指揮去訖謹具狀申宣撫使衙伏望裁酌早賜指揮奏乞所缺青苗錢許重疊倚閣狀勘㑹永興軍准提舉陜西路常平廣惠倉司牒准司農寺牒撿㑹近准熙寧二年九月四日敕節文所借過青苗錢斛令隨省稅日限送納如遇夲户災傷五分巳上合隨夏稅納者展至秋稅合隨秋稅納者展至次年夏稅寺司看詳上件敕意人户合隨夏稅送納者如夲户災傷五分巳上即展至當年秋稅若秋內更遇災傷自合送納夏料錢斛了足不許再行倚閣若夲户更曽借過秋料錢斛即令倚閣秋料數目展至次年夏料送納切慮內有州郡並不詳認上件敕條一例重疊倚閣牒當司請詳此及備録上件敕條遍下諸州軍如是夏料合納青苗錢斛夲户災傷五分以上展至秋料送納如秋料內更遇災傷即却合催夏料數目仍將夲路借過秋料錢斛展至次年夏料送納了足即不得將兩次災傷重疊倚閣免至人户積缺數多難為了納别致違悮如有昨來夏料係災傷倚閣展至今秋送納者如今秋夲户更遇災傷便請疾速催納了足具數申寺仍關報提刑轉運司依此施行者右謹具如前臣竊詳朝廷所散青苗錢斛夲為救接窮困闕用之民使得至夏秋成熟所以春散夏斂夏散秋斂或遇夲户災傷五分以上即展至次料送納蓋以寬假飢民使有以自存非為乘此艱食規求利息今司農寺乃令不得將兩次災傷重疊倚閣如有昨來夏料災傷倚閣展至今秋送納者今秋夲户更遇災傷便令疾速催納了足臣竊恐此事不合勑意蓋緣一次災傷民間猶有舊來蓄積未至困窮其青苗錢尚許倚閣豈有連併兩次災傷百姓轉更不易之時却令須得送納舊來蓄積既盡新榖又復不收更將何物可以供輸其逐州縣為見司農寺有此指揮不問有無務行督促嚴加科責使貧下百姓何以為生竊惟朝廷為民父母必不肯如此况災傷倚閣稅賦并借貸過斛斗准條並候豐熟日令分作料次送納如更遇災傷亦權住催理何故青苗錢斛最為緊急獨不許重疊倚閣日巳指揮夲路災傷地分永興軍河中陜府同華耀乾解八州軍請勘㑹去歲夏料如係災傷倚閣青苗錢斛展限至秋送納去處若去秋夲户更遇災傷其夏料錢斛未得依司農寺指揮催理更聽候朝旨伏望聖慈特賜采察早降指揮謹具狀奏聞伏候勑旨及牒提舉陜西路常平廣惠倉司奉聖旨冝令提舉陜西路常平廣惠倉司疾速關牒永興軍夲路州軍令詳司農寺牒一依條貫指揮即不得施行司馬光牒致誤百姓及時送納劄付司農寺仍仰關牒合屬去處准此次日乞留臺奏為乞不將米折青苗錢狀准提舉陜西常平廣惠倉司牒云云右謹具如前夲司勘㑹朝廷元散青苗錢指揮取利不得過二分今來提舉常平廣惠倉司乃依見今饑饉之歲在市貴價將夲倉陳次斛斗細作見錢支散與人又豫定將來粟麥之價粟每斗二十五文足小麥每斗四十文足夲司看詳向去夏秋五榖有豐有儉其榖麥之價固難豫定今將陳色曰米每斗細作見錢七十五文若折計作小麥價錢支俵每斗四十文共折計得小麥一斗八升七合半則是貧民於正二月間請得陳色白米一石却將來納著新好小麥一石八斗七升五合若折計作粟錢支俵每斗二十五文足計支則一斗白米價錢七十五文足共折得粟三㪷則是貧民闕乏之時只請得陳色白米一石却將來共納著新粟三石若只送納見錢即又須賤糶斛斗以償官中夲利使貧下之民寒耕熱耘竭盡心力所收斛斗於正稅之外更以巧法取之至盡不問歲豐歲儉常受飢寒顯見所散青苗錢大為民害竊惟朝廷從𥘉散青苗錢之意夲以兼并之家放債取利侵漁細民故設此法抑其豪奪宫自借貸薄收其利今以一斗陳米散與飢民却令納小麥一斗八升七合五勺或納粟三斗所取利約近一倍向去物價轉貴則取利轉多雖兼并之家乘此饑饉取民利息亦不至如此之重國家為民父母置此二倉名為常平廣惠豈當如此今邊鄙用兵軍糧闕乏既無餘剩可以賑貸伏望朝廷閔此農民遭值凶饑困窮憔悴鄰於死亡直將上件常平廣惠倉斛斗依先降朝旨借貸與第四等以下人戶更不取利若不能如此須欲作青苗錢俵散之時即乞不以元糴價貴賤更不細作見錢只據所散與人戶石斗至將來成熟令出息二分每散得一斗米者納一斗二升細色或依倉式例折作粗色如此細民猶不至窮困官中取利雖薄亦不減二分元數如允所請伏乞早降指揮謹具狀奏聞伏候敕㫖奏乞兵官與趙瑜同訓練駐泊兵士狀右臣准今月三日宣命差下在京及外處拱聖等十四指揮計五千餘人赴永興軍權駐泊准備宣撫句抽差使及差莊宅使趙瑜充夲路都鈐轄與臣專管句訓練臣夲書生叨忝兩制軍旅之事素所不知加以近准宣撫司劄子坐到教閲新法令排日各習事藝臣所管永興軍一十三縣民事至多及應副㳂邊軍須物色文案填委每日自旦至暮未嘗暫間實無餘力與趙瑜同監教閲又不可專委趙瑜獨行訓練又永興軍舊管屯駐駐泊就糧兵士自來並是鈐轄劉斌路分都監李應之同共管句今來所添兵士准宣命指揮只令趙瑜與臣專管句訓練所有舊來兵士不知趙瑜管與不管若令通管之時其新來兵士既在永興軍駐泊其劉斌李應之並是夲路鈐轄都監豈可却管轄不得竊慮向去新兵士不賔服舊兵官舊兵官不應副新兵士各分彼我則致生事深為不便所有上件新差來永興軍權駐劄兵士臣欲乞令夲路兵官與趙瑜同共訓練所貴公共同心管句得辦謹具狀奏聞伏候勑旨并申宣撫相公更賜敷奏乞早降指揮溫國文正公文集卷第四十四
