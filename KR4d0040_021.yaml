body:
  text: 章奏六論公主宅內臣狀論皇城司巡察親事官劄子論復置豐州劄子論上元遊幸劄子論以公使酒食遺人刑名狀論諸科試官狀論上元令婦人相撲狀正家劄子優老劄子論湖南提刑張田狀論張田第二狀論張方平第三狀論李瑋知衛州狀辭知制第一狀第二狀論公主宅內臣狀右臣近聞有聖旨令召前管句兖國公主宅內臣二人復還本宅臣與楊畋龔鼎臣同有論列以為非冝未蒙允納臣聞父之愛子教以義方弗納於邪公主生於深宫年齒幼稚不更傳姆之嚴未知失得之理臣謂陛下冝導之以德約之以禮擇淑慎長年之人使侍左右朝夕教諭納諸善道其有恃恩任意非法邀求當少加裁抑不可盡從然後慈愛之道於斯盡矣此二人嚮在主第罪惡山積當伏重誅陛下寬赦斥之外方中外之人議論方息今僅數月復令召還道路籍籍口語可畏殆非所以成公主肅雍之美彰陛下義方之訓也臣實憤悒為陛下惜之伏望陛下察臣愚忠追止前命無使四方指目以為過舉虧損盛德非細故也謹具狀奏聞論皇城司巡察親事官劄子十二月九日上有旨親事官決杖配下軍臣畋等伏聞皇城司親事官奏報有百姓殺人私用錢物休和事下開封府推鞫皆無事實欲乞元𥘉巡察人照勘其皇城司庇護不肯交付臣等竊以祖宗開基之始人心未安恐有大姦隂謀無狀所以躬自選擇左右親信之人周流民間密行伺察當是之時萬一有挾私誣抂者則斧鉞隨之是以此屬皆知畏懼莫敢為非今海內承平已踰百年上下安固人無異望丗變風移冝有釐革而因循舊貫更成大弊乃至帝室姻親諸司倉庫悉委此屬廉其過失廣作威福公受貨賂所愛則雖有大惡掩而不問所憎則舉動語言皆見掩托臣等常病國家擇天下賢才以為公卿百官而猶不可信顧任此厮役小人以為耳目豈足恃哉今乃妄執平民加之死罪使人幽縶囹圄橫罹楚毒幸而不自誣服僅能辨明若更不聽有司詰問元𥘉巡察之人少加懲戒臣恐此屬無復畏憚愈加恣撗使京師吏民無所措其手足此豈合祖宗之意哉伏望朝廷指揮皇城司令送元𥘉巡察人下開封府推問本情或别有仇嫌或察訪鹵莾各隨其狀依法施行仍自今後永為定制庶可以塞欺罔之源絶侵冤之門以全國家至公之道取進止論復置豐州劄子臣畋等伏見國家復修豐州故城仍差人知州此誠河西險要之地修之甚便然其地勢孤絶外迫冦境嚮者王氏知州之時所部蕃族甚衆有永安來逺保寧三寨皆以蕃族守之慶曆𥘉拓跋元昊攻陷州城州民及三寨蕃族盡為所虜掃地無遺今州城之中但有丘墟瓦礫環城數十里皆草莾林麓而已若建以為州則須復設外寨備置官吏廣屯兵馬多積芻糧皆應調發內地之民以奉之勞費甚大此所謂徇虛名而受實弊也頃年朝廷欲修豐州城河東經略司嫌其單外乃於其南數十里築永寧堡其地窪下居兩山間疏惡難守今既修豐州則永寧堡深在腹內無所復用臣等以為不若遷永寧堡於豐州故城其兵馬芻糧不更增益但擇使臣有材略者使守之不必假以知州之名仍召募蕃漢之民使墾闢近城之田俟民物繁庶皆如其舊然後升以為州亦未晚也取進止論上元逰幸劄子臣畋等伏見今歲以祈榖改日之故車駕併以十三十四日幸諸寺觀臣等竊惟上元觀燈本非典禮正以時和年豐欲與百姓同樂為太平之榮觀而已去歲四方諸州多罹水旱鰥寡孤獨流離道路伏計陛下念此未嘗去心竊恐有司不明大體務循故事無所減損不稱陛下子愛元元之意又連日遊幸在於聖體亦為煩勞伏望陛下比之每歲特減遊觀之處以閔恤下民安養聖神天下幸甚取進止論以公使酒食遺人刑名狀臣聞聖王之教尚忠厚而貴愷悌故詩有鹿鳴伐木既醉行葦宴好之相樂刺乾糇之失德禮有幣帛饔餼行於邦國贄獻飲酒施於鄉黨是以風俗純和協氣流通漢景帝詔曰吏受所監臨以飲食免重其更議著令丞相廷尉議曰吏及諸有秩受其官屬所監所治所行所將飲食計償費勿論卓茂為密令民有言部亭長受其米肉遣者茂曰凡人所以貴於禽獸者以有仁愛也鄰里饋遺此乃人道所以相親汝獨不欲修之寧能髙飛逺走不在人間邪民曰然則律何故禁之茂曰律設大法禮順人情今我以禮教汝汝必無怨惡以律治汝汝一門之內小者可刑大者可殺也近歲以來中外有司喜以微文刺舉苛細至於宴飲相從酒食相饋皆集纍成過詆以峻法嚮聞知鎮戎軍曹修受鄰州所送公用酒巳而自首法官處以贓罪陜西都轉運使彭思永奏據密院劄子賈漸起請除舊例送酒食外不得買置金帛作土風贈遺并省司參詳今後以公使錢置買珍異等物及見錢送與人者並從違制定斷其收受人坐贓論其有公使錢人受還答之物入己準盜論今曹修因陳首雖免書罰尚負贓名使人疑惑乞明立條約朝廷命有司參議至今未決臣竊詳舊條之意明許以酒食相遺其有公使錢人受還答之物正謂珍異見錢今曹修所受止於樽酒隨而自首巳為刻薄法官又以贓罪加之剖析一條以為二事不察人情不顧大體若朝廷因之遂為著令臣恐忠厚之俗益衰偷薄之風遂長百司庶尹無所措其手足虧損聖朝堂堂之化非細故也臣今所言非為曹修除雪贓名欲望朝廷申明條應以公使錢及財物贈遺人及受者各坐贓論其監臨之官受所監臨或因使於使所及經過處受取者並凖律文處分即贈遺人而受其還答入己者凖盜論並須贓滿五匹以上方得科罪其不滿五匹及以飲食之物相饋餉者皆勿論如此則人情有以相接貪吏不能為姦百司有所循守矣謹具狀奏聞伏候勑旨論諸科試官狀右臣伏見朝廷取勘諸處發解考試諸科官以所解之人到省九不十不者臣竊惟國家本設諸科以求通經之士有司專以上文下注為問巳為弊法竊聞去歲貢院出義題官更於弊法之中曲為竒巧或離合句讀故相迷誤或取卷末經注字數以為問目雖有善記誦之人亦不能對其於設科本意不亦逺乎是則罪在貢院出義題官不在諸處發解官也今舉人𬒳黜巳非其理又并發解之官亦坐停替臣恐自此為吏者益務竒巧從學者益棄本原殆非所以省刑罰隆經術也伏望朝廷更取本處解發上件諸科試卷委官覆考其通粗合格者特與免罪不合格者乃依法坐之仍勑貢院將來科埸選擇通經術曉大體之人充諸科出義官依條出義母得更如今來詭僻苛細至時如有十不九不之人然後取勘本處發解考試官依前後條貫施行如此則彼皆無辭于罰論者亦不以為冤矣謹具狀奏聞伏候勑旨論上元令婦人相撲狀右臣竊聞今月十八日聖駕御宣德門召諸色藝人令各進技藝賜與銀絹內有婦人相撲亦𬒳賞賚臣愚竊以宣德門者國家之象魏所以垂憲度布號令也今上有天子之尊下有萬民之衆后妃侍旁命婦縱觀而使婦人裸戲於前殆非所以隆禮法示四方也陛下聖德溫恭動遵儀典而所司巧佞獻技以汚瀆聰明竊恐取議四逺愚臣區區實所重惜若舊例所有伏望陛下因此斥去仍詔有司嚴加禁約今後婦人不得於街市以此聚衆為戲若今次上元始預百戲之列即乞取勘管句臣僚因何置在籍中或有臣僚援引奏聞因此宣召者並重行譴責庶使巧佞之臣有所誡懼不敢導上為非禮也謹具狀奏聞伏候勑旨正家劄子臣先曽上言為前𬋩句兖國公主宅內臣等過惡至大乞不召還近聞傳宣入內內侍省令押上件內臣梁懷吉赴公主宅依舊句當外議喧譁無不駭異臣聞太宗皇帝時姚坦為兖王宫翊善王有過失坦輒盡言諫正王及左右皆患之左右教王詐疾踰月不朝太宗甚憂之召王乳母入宫問王起居狀乳母曰王本無疾但以翊善姚坦檢束太嚴王舉動不得自由鬱鬱成疾耳太宗怒曰朕選端士為王僚屬固欲導王為善今既不能納用規諌而又詐疾欲使朕逐去正人以求自便其可得乎且王年少不知出此皆汝輩教之耳命捽至後園杖之數十召坦慰勉之太宗非不愛其子也誠以愛之則莫若納之於善若縱其所欲不忍譴訶適所以害之也齊國獻穆大長公主太宗皇帝之子真宗皇帝之妹陛下之姑於天下可謂貴矣然獻穆公主仁孝謙恭有如寒族奉李氏宗親備盡婦道愛重其夫無妬忌之行至今天下稱婦德者以獻穆公主為首獻穆公主豈不自知其身之貴哉誠以貴而不驕然後能保其福祿全其令名故也臣謂陛下教子以義冝以太宗皇帝為法公主事夫以禮冝以獻穆公主為法則風化流於四方聲譽施於後丗今陛下曲徇公主之意不復裁以禮法使之無所畏憚陷入於惡觸情任性以邀君父憎賤其夫不執婦道將何以形四方之風垂來丗之則易曰家人嗃嗃悔厲吉婦子嘻嘻終吝此言家道尚嚴不可專用恩治也伏望陛下斥逐梁懷吉等復歸前來貶竄之處其公主左右之人欲使陛下召還梁懷吉等皆教導公主為不善之人也悉冝治其罪而逐之别擇柔和謹願者以輔其缺仍戒敕公主以法者天下之公器若屢違詔命不遵規矩雖天子之子亦不可得而私庶幾有所戒懼率循善道可以永保福祿不失美名不然衆人所云甚可畏也取進止優老劄子臣聞古之聖王尊禮黃髮屬任以政者蓋以其更歷天下之事練習為治之體故也昔鬻熊年九十見文王文王曰老矣鬻熊曰君若使臣捕虎逐麋臣已老矣使臣坐而䇿國事臣年尚少也近歲以來大臣髙年者皆不敢自安其位言事者又欲以擊搏大臣為名從而攻之此豈為臣盡忠至公之道哉凡言事者當為國家進賢退不肖使其人無可取雖少壯何為果有益於時雖老何傷也臣竊見樞密使張忭屢以老疾辭位臣平生與忭迹不相接無絲毫恩分然竊聞其為人忠謹清直不可干以私臣不敢上避聖主之疑下畏丗俗之謗隱忠不言以利其身伏望陛下深念宥密之地不可任非其人先以聖意揣度若未能得賢於忭者則使忭且居其位於事亦未有曠廢也若忭必不可留則願陛下慎選德望材器為衆所服知王體曉兵略者以代之不可以不擇其人之可否使循資纍敘而為之也取進止論張田湖南提刑狀右臣竊聞朝廷差屯田貟外郎張田充荆湖南路提點刑獄田之為人傾邪險薄前知諌院唐介言之甚詳伏計朝廷已熟知之提點刑獄專按察之柄繫一方休戚今以傾邪險薄之人為之誠未見其可况田嚮者止自通判資序權發遣三司判官因罪左遷知蘄州議者巳謂之太優今到任未及三年遂作監司臣竊恐士大夫爭欲效田所為以為進取之捷徑不惟任使失人抑亦敗壞風俗伏望朝廷寢田新命更擇端士以代之實逺方吏民之幸謹具狀奏聞伏候勑旨論張田第二狀二月三十日上田尋移知湖州右臣近曽上言張田不可充荆湖南路提點刑獄未蒙朝廷施行臣竊以吏者民之紀綱提刑獄吏之師帥苟不得其人則一方咸受其弊又凡今之朝士自常調進用者皆自此官為始國家尤冝慎擇其人田資性險薄色厲內荏毀譽出其愛憎威福發於喜怒陵其可陵佞其可佞真小人之雄傑而時俗以為賢才夫不善之人天下皆知其不善斯不足疾也惟衆人謂之賢而實不肖者君子疾之昔漢文帝欲以嗇夫為上林令張釋之以為嗇夫利口捷給恐天下隨風而靡唐太宗見進士等第怪其無張昌齡王公謹名王師明白二人有文無行恐變陛下風雅今提點刑獄其為輕重非特上林令與入等進士之比也臣願陛下必選忠厚方正實有治行者為之其飾偽行險躁於進取如田比者皆不可用也臣今所言非專為湖南之吏民亦為國家重惜風俗伏惟陛下察其愚忠其荆湖南路提點刑獄乞别賜擇人謹具狀奏聞伏候勑旨論張方平第三狀右臣先曽上言秦鳯路經略安撫使張方平怯懦輕易乞更擇人至今未蒙朝廷施行臣竊聞拓拔亮祚年齒寖長猖狂好兵常分之外邀求無厭董氊凶悍狡獪超其父兄朝廷官爵不滿其意頗懷怨懟與契丹結婚隂相表裏此朝廷所當旰食而憂也秦州居二虜之交為陜西四路之首軍馬民夷最號繁冨而以怯懦輕易之人守之是委羔豚於虎狼之蹊也臣竊為國家危之况方平其他材識素無所長止以文辭致位至此姦憸貪猥上論共知今不可使之守邊事狀昭然而朝廷掩覆其過曲加保全愛一人而失一方臣竊以為過矣伏望陛下不以邊事為細而忽之速治方平之罪嚴加譴謫更擇沉勇曉兵之人以代其任不然必待有烽燧之警然後易之則冦已深矣謹具狀奏聞伏候勑旨論李瑋知衛州狀二月二十八日上來月五日公主降封欣國右臣竊聞駙馬都尉李瑋出知衛州兖國公主入居禁中瑋所生母楊氏歸瑋兄璋之宅其公主宅祗應人等悉令散遣外議籍籍無不怪愕伏以陛下始者追念章懿太后選瑋使之尚主欲以申固姻戚冨貴其家今以公主之故使李氏母子離析家事流落大小憂讋殆不聊生豈始所以結婚之意哉近者章懿太后忌日陛下閲奩中之故物思平生之居處獨能無雨露之感悽愴之心乎臣愚以為陛下冝且留李瑋在京師其公主宅祗應人等除作過者逺加竄逐出外其餘並令仍舊儲歭什物皆安堵不移以俟歲月之間徐以義理曉諭公主庶幾回意易慮率德遵禮復歸本宅則中外之情無不釋然不然公主必無復歸李氏之志者則今日致此衆議紛紜煩瀆聖聽皆由公主縱恣胸臆無所畏憚數違君父之命陵蔑夫家豈可李瑋獨蒙斥逐出外而公主爵邑請受全無貶損非所以示天下至公之道也謹具狀奏聞伏候勑旨辭知制誥第一狀右臣近蒙中書召試制誥竊聞聖恩巳除臣本官知制誥續又令兼侍講數日之間寵命相繼在人為榮於臣甚懼竊以二職文士之髙選儒林之極致古之英俊尚或難兼况於微臣愚陋無比一身二任力所不堪豈敢冒居以取顚覆聞之震恐瞀憒失據臣自少及長章句之學粗嘗從師至於文詞實為鄙野嚮者辭免修起居注非謂不能記録言動正恐循次而進典掌誥命取嗤四方為國大辱是以披心自歸至于四五誠慤不著不蒙開允惟黽勉就職而夙夜惶懼未嘗少安近者𬒳召之日再欲具此奏陳又以比來朝廷擢用數人雖辭避懇至未嘗得請而或者不諒其心以為采名恐復虛發如前所為是以躊躇倣徨不免赴試除名既降強顔忍恥亦欲就職以俟疵吝布彰自當退黜今者竊聞天章閣侍講呂公著與臣同時𬒳召公著辭讓不至朝廷巳除公著天章閣待制兼侍講臣乃始自悔恨輒以愚心妄意朝廷當伏重詠臣雖無知若使廉讓有恥者棄置不收貪冒苟得者進受華顯不惟虧聖朝風化亦使微臣受四海之責將不得單斃其死所有除知制誥敕告臣未敢祗受乞更擇文學兼荗與職業相稱之人以代臣庶幾克叶逺近之望寬愚臣之罪其侍講恩命臣更不敢辭謹具狀奏聞伏候勑旨第二狀右臣今月十四日曽有奏陳以知制誥之職非臣所堪乞更擇人未蒙允許臣夙夜惶恐不知所措臣與吕公著同時召試公著固辭得請而臣獨就職是公著廉讓而臣無愧恥也臣雖甚愚誠不忍以身居下流蒙受衆惡為丗汚澤雖獲美官將何榮之有且公著沉厚淵懿士林推服文學行能非臣之比名位寵祿臣安敢先之昔施氏卜宰皇句須吉施氏之宰有百室之邑與皇句須邑使為宰以讓鮑國而致邑焉施孝叔曰子實吉對曰能與忠良吉孰大焉少室周為趙簡子之右聞牛談有力請與之戲弗勝致右焉簡子許之臣今自知不材請釋美官以授能者雖不足比迹大賢庶幾得從皇句須少室周之後其榮多矣伏望朝廷察其區區特賜矜許其除知制誥敕告臣不敢祇受乞授公著或别擇人不勝大幸謹具狀奏聞伏候勑旨溫國文正公文集卷第二十一
