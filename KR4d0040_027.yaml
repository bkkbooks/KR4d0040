body:
  text: 章奏十二醫官第二劄子張茂則劄子十二月七日上與吕獻可違名放宮人劄子上皇太后疏上皇帝疏講筵劄子十月二十七日上有㫖十二月二日開講程宣徽劄子二道後宫等級劄子配天議乞延訪群臣劄子醫官第二劄子臣先曽上言以醫官宋安道等診候御脉日久方術無驗乞行降黜别擇良醫使專其事考其功效以行賞罰自後寂然不聞朝廷施行臣以為聖體已安不敢復言今覩陛下不親虞祭乃知疾疹殊未痊平臣子之心何以自安臣竊聞宋安道等每奏皇太后及語大臣皆云陛下六脉平和體中無疾今乃疾狀如此安道等不惟方術無效論其靣謾之罪亦冝誅殛矣且安道等侍先帝疾至於今日而猶免於貶竄冝其無所懲戒不肯盡心也臣不知朝廷何意再三惜此數夫不為國家正賞罰之法快天下之志也夫以四海之廣捨此數人之外豈無良醫患在上之人不求求而不得得而不使使而不専故也臣亦聞嚮者朝廷選醫官數人皆委近臣試以難經素問考其通粗取合格者以為侍醫亦有不試而使與安道等雜處共事者夫良醫由性識敏逹以平生所治之人考其得失探其精粹得之於心未必皆讀古書也亦猶誦詩書者豈盡能治民讀孫吳者豈盡能行兵今以難經素問試之是徒得記誦之人未嘗得醫人也安道等久在醫局專利忌能交結貴近更相黨庇使外方新進醫人與之共處豈敢展其胸臆施其方術哉是以一槩混同而久不見功也今若精擇一人使之專診御脉旬月之間考其應驗有功則加以重賞無功則俟以嚴刑則術精者得盡其力術疏者不敢濫進矣臣又聞病人能自知其病者未甚病也憎良藥而不受者病在內拒之也今竊聞陛下不安如此而常自謂無疾則病已深矣醫有良藥而陛下不服則己為病所拒矣若陛下不早覺悟而更求名醫強進良藥縱陛下不自惜奈宗廟社稷何此臣所以痛心疾首前有鼎鑊而不敢避者也伏望陛下察臣兩次所奏罷黜醫人有罪無功者召募四方名醫委大臣精選一人使之專診御脉聽用其言服食其藥以旬月之期察其能否如前所云以保養聖神為天下生民之福取進止張茂則劄子十一月七日上與吕獻可連名臣等竊聞祖宗舊制內臣年未五十不得充內侍省押班近除張茂則年方四十八今陛下踐阼之𥘉尤冝謹守祖宗法度以御左右之臣示天下至公若茂則果有才幹可用雖更留此闕二年俟其年至然後授之又何晚也臣恐茂則一開此例則內臣攀援求進者多畫一之法從此隨壞人人相效不可禁止不若正之於事𥘉也臣等區區所為國家重惜在此而已取進止放宫人劄子臣伏見前代帝王升遐之後後宫下陳者盡放之出宫還其親戚所以遂物情重人世省浮費逺嫌疑也竊惟先帝恭儉寡欲清約執禮後宫侍左右承寵渥者至少而饗國日久歲增月積掖庭之間冗食頗衆陛下以哀恤之初未忍罷遣今山陵祔廟大禮俱畢臣愚謂冝舉前代故事應先帝後宫非御幸有子及位號稍貴并職掌文書之人其餘皆給與糚奩放遣出外各令歸其親戚或使任便適人書之史冊亦聖朝一美事也取進止上皇太后疏十一月日具位臣光謹再拜上疏皇太后殿下臣聞聖人之德使四海之外編戶之民皆輻湊而歸之如孝子之奉父母其故何哉推仁愛惻怛之誠以加之也故詩云愷悌君子民之父母夫四海至逺也編戶至微也誠之至也猶可以為之父母況閨門之內血氣之親乎昔漢明德馬皇后無子明帝使養賈貴人之子炟以為太子且謂之曰人不必自生子但患愛養不至耳后於是盡心撫育勞悴過於所生及明帝崩太子即位是為章帝章帝亦孝性淳篤恩性天至母子慈愛始終無纎芥之間前史載之以為美談臣光恭惟仁宗皇帝憂繼嗣之不立念宗廟之至重以皇帝仁孝聰明選擢於宗室之中使承大統不幸踐阼數日遽嬰疾疹雖殿下撫視之慈無所不至然醫工不精藥石未效竊聞嚮日疾勢稍增舉措語言不能自擇左右之人一一上聞致殿下以此之故不能堪忍兩宫之間微相責望群心憂駭不寒而栗方今仁宗新棄四海皇帝久疾未平天下之勢危於纍卵惟恃兩宫和睦以自安如天覆而地載也豈可效常人之家爭語言細故使有絲毫之隙以為宗廟社稷之憂哉臣是用日夜焦心隕涕側足纍息寧前死而盡言不敢幸生而塞默也伏以皇帝內則仁宗同堂兄之子外則殿下之外甥壻自童幼之歲殿下鞠育於宮中天下至親何以過此又仁宗立以為皇子殿下豈可不以仁宗之故特加愛念包容其過失邪况皇帝在藩邸之時以至踐阼之初孝謹溫仁動由禮法此殿下所親見而明知也苟非疾疹亂其本性安得有此過失哉夫心者神明之主也若其有疾則精爽迷亂冥然無知言語動作不自省記不識親踈不擇貴賤此乃有疾者之常不足怪也殿下聰明睿智天下之理無所不通豈可責有疾之人以無疾之禮邪今殿下雖日夕憂勞徒自困苦終何所益以臣愚見莫若精擇醫工一二人以治皇帝之疾旬月之間察其進退有效則加之以重賞無效則威之以嚴刑未愈之間但冝深戒左右謹於侍衛其舉措語言有不合常度者皆不得以聞庶幾不增殿下之憂憤殿下惟寬釋聖慮和神飬氣以安靖國家紀綱海內俟天地垂祐聖躬痊復然後舉治平之業以授之不亦美乎古之慈母有不孝之子猶能以至誠惻隱撫存愛飬使之內愧知非革心為善况皇帝至孝之性禀之於天一旦疾愈清明復𥘉其所以報答盛德豈云細哉臣之愚慮苦言盡此而巳乞殿下更賜裁擇臣光昧死再拜上疏上皇帝疏十一月日具位臣光昧死再拜上疏皇帝陛下臣先於四月二十七日及六月二十三日皆曽上疏以陛下受仁宗皇帝之天下欲報之德當奉事皇太后孝謹撫諸公主慈愛勿使姦邪之人有所離間致兩宫有隙以上貽宗廟之憂下為群生之禍叩心瀝膽極其懇惻未審臣言得逹聖聽或萬機之繁未嘗奏御也此乃成敗之端安危之本不可不察臣聞漢章帝乃賈貴人之子明帝使明德馬皇后母飬之后盡心撫育勞瘁過於所生章帝亦孝性淳篤恩性天至母子慈愛始終無纎介之間馬氏三舅皆為卿校列侯賈貴人終不加尊號賈氏親族無受寵榮者此前丗美事今日所當法也詩云父兮生我母兮鞠我拊我畜我長我育我顧我復我出入腹我欲報之德昊天罔極然則父母之恩不獨以其生己也拊畜長育居其太半焉陛下自齠齔之年為皇太后所鞠育恩亦至矣又况今日為仁宗皇帝之嗣承四海之大業乎臣謂陛下冝夙興夜寐昏定晨省親奉甘旨承順顔色無異於事濮王與夫人之時也近者道路之言頗異於是紛紛籍籍深可駭愕臣竊惟陛下孝恭之性著於平昔豈一旦遽肯變更蓋嚮者聖體未安之時舉動語言或有差失不能自省而外人訛傳妄為增飾必無事實雖然此等議論豈可使天下聞之也周書曰小人怨汝詈汝則皇自欽德古人有言曰禦寒莫如重裘弭謗莫如自修陛下疾疹未平固無如之何若既愈之後臣愚伏望陛下親御皇太后閣克己自責以謝前失溫恭朝夕侍飬左右先意承志動無違禮使大孝之美純粹光顯過於未登大位之時如此則上下咸恱宗社永安今日道路妄傳之言何能為損也古之至孝者雖有不慈之母猶能使之感窹歡悅回心易慮况皇太后聖善之德著聞四方自陛下有疾以來日夜泣涕禱於神祇憂勞困悴以兾陛下之安寧如耕者之望收涉者之求濟陛下豈不思有以慰安之也臣不勝區區干冒以聞乞留神采擇臣昧死再拜上疏講筵劄子十月二十七日上有旨十二月二日開講臣伏覩講筵所告報依乾興年故事講論語讀史記續奉聖旨直候來春臣聞傅說曰王人求多聞時惟建事學于古訓乃有獲又日念終始典于學厥德修罔覺然則學者帝王之首務不可忽也況今陛下𥘉臨大寶所冝朝夕延訪群臣講求先王之道覽觀前丗之成敗以輔益聖德緝熙大化不可但循近例以寒暑為辭如此使下情何以上通四方何以觀望殆非所以廣聰明宣令名也伏乞依前降聖旨擇日開講筵取進止程宣徽劄子臣伏覩今月二十九日制書宣徽南院使鄜延路經略安撫使程戡加安武軍節度使令再任臣聞官以待賢才賞以勸有功官非其人則職事廢闕賞不當功則群臣懈體程戡素無才術少壯之時歷職中外猶無名迹為人所稱况今老病昏懦尤甚在鄜延苟且偷安以度日月為吏兵所慢戎狄所輕臣謂朝廷當因其歲滿授以冗秩别擇能臣以代其任今乃寵以節鉞使居舊任外庭聞者無不駭愕臣竊以兩府之外官尊祿厚無若節度使者群臣非有大功不可輕授臣不知程戡在鄜延曽有何功遽授此官萬一邊臣有能立大功者朝廷當復以何官處之况陛下踐阼之𥘉四方之人拭目傾耳觀聽朝廷之刑賞以占聖政而戡首蒙濫賞臣竊為陛下惜之伏望聖慈追還前命别選賢才使守鄜延庶合中外之望取進止後宫等級劄子臣聞王化之興始於閨門故易基乾坤詩首關雎前丗皆擇良家子以充後宫位號等級各有貟數祖宗之時猶有公卿大夫之女在宫掖者其始入宫皆須年十二三以下醫工診視防禁甚嚴近歲以來頗隳舊制內中下陳之人競置私身等級寖多無復限極監勒牙人使之雇買前後相繼無時暫絶致有軍營井市下俚婦人雜處其閒不可辨識此等置之宫掖豈得為便臣嘗念此不勝憤惋今陛下即位之初百度惟新嬪嬙之官皆闕而未備臣謂冝當此之時定立制度依約古禮使後宫之人共為幾等等有幾人若未足之時且虛其貟數既足之後不可更增凡初入宫皆須幼年未適人者若求乳母亦須選擇良家性行和謹者方得入宫傳之子孫為萬丗法此誠治亂之夲禍福之原不可以為細事而忽之取進止配天議右臣等伏准中書劄子翰林學士王圭及知制誥錢公輔等奏季秋大饗明堂以仁宗皇帝配神作主事奉聖旨令臺諌及經筵臣僚與兩制禮院同共再詳定聞奏者朝廷以祖宗事重不敢自專博訪群臣使各陳其意臣等愚懵不逹古今但據所聞正禮以對至於取捨繫自聖明竊以孝子之心誰不欲尊其父者聖人制禮以為之極不敢踰也故祖己訓髙宗曰祀無豐于昵孔子與孟懿子論孝亦曰祭之以禮然則事親者不以數祭為孝貴於得禮而已矣祭法有虞氏禘黃帝而郊嚳祖顓頊而宗堯夏后氏禘黃帝而郊鯀祖顓頊而宗禹啇人禘嚳而郊冥祖契而宗湯周人禘嚳而郊稷祖文王而宗武王先儒謂禘郊祖宗皆祭祀以配食也禘謂祭昊天於圎丘也祭上帝於南郊曰郊祭五帝五神於明堂曰祖宗故詩曰思文后稷克配彼天又我將祀文王於明堂此其證也下此皆不見於經矣前漢以髙祖配天後漢以光武配明堂以是觀之古之帝王自非建邦啓土及造有區夏者皆無配天之文故雖周之成康漢之文景明章其德業非不美也然而子孫不敢推以配天者避祖宗也孝經曰嚴父莫大於配天則周公其人也孔子以周公有聖人之德成太平之業制禮作樂而文王適其父也故引之以證聖人之德莫大於孝答曽子之問而已非謂凡有天下者皆當尊其父以配天然後為孝也近世祀明堂者皆以其父配五帝此乃誤識孝經之意而違先王之禮不可以為法也景祐二年仁宗詔禮官稽案典籍辨崇配之序定二祧之位乃以太祖為帝者之祖比周之后稷太宗真宗為帝者之宗比周之文武然則祀真宗於明堂以配五帝亦未識古禮今仁宗雖豐功美德洽於四海而不在二祧之位議者乃欲捨真宗而以仁宗配食明堂恐於祭法不合又以人情言之是絀祖而進父也夏父弗忌躋僖公先兄而後弟孔子猶以為逆祀書於春秋况絀祖而進父乎必若此行之不獨乖違典禮恐亦非仁宗之意也議者又欲以太祖及三宗迭配郊丘及明堂臣等亦以為不可何則國家受天永命傳祚萬丗若繼體守文之君皆得配天則子孫將有無窮之數與祖宗無别也凡為國家者制禮立法必思萬丗之規不可專徇目前而已臣等竊謂冝遵舊禮以真宗配五帝於明堂行之為便謹具狀奏聞伏候勑旨程宣徽第二劄子臣近曽上言鄜延路經略使程戡建節再任不合衆望乞追還前命事至今不聞施行臣竊以方今國家外患唯在西北二冦所以捍禦二冦唯在諸路經略安撫使居此任者豈可不精擇其人程戡在鄜延自以衰老畏人指目專務姑息取媚群小僚屬軍伍尚無禀畏况於外夷固所輕侮比年以來趙諒祚數違舊制易姓建官妄有邀求不遵朝命戡不能式遏而容納其使事之可否盡諉於朝廷則禦侮之臣將何所用事君不忠孰甚於此臣愚以為凡御群臣之道若居官稱職衆所不及則當使之再任若立功立事為人所知則當加之品秩今語其稱職則軍政不修語其立功則戎狄驕慢而朝廷寵命益優委任益厚臣恐將帥之臣宣力者無所勸而懷姦者得其志如此而望疆埸安寧四夷賔服臣竊以為難矣所有程戡新授恩命伏乞早賜追還取進止乞延訪群臣劄子臣聞天尊地卑道之常也而周易乾下坤上謂之泰者蓋言人君降心接臣人臣竭忠以事君然後上下交而其志同也若人君驕亢以自尊人臣怠慢以自踈則上下之情不通而否道成焉是以孔子語舜之德曰舜好問而好察邇言其斯以為舜乎竊見祖宗之時間居無事常召侍從近臣與之從容講論萬事至於文武朝士使臣選人凡得進見者往往召之使前親加訪問委曲詳悉無所不至所以然者一則欲使下情上通無所壅蔽二則欲知其人能否才器所任是以黜陟取捨皆得其冝太平之業由此而致恭惟陛下潜德藩邸踰三十年一旦龍飛奄有四海雖聖質英睿得於天縱然與當丗士大夫未甚相接民間情僞未甚尽知臣謂冝詔侍從近臣每日輪一貟直資善堂夜則宿於崇文院以備非時宣召若有事故請假則與以次官玄換直宿其餘群臣進見及奏事者亦望聖慈稍解嚴重細加訪問以開廣聰明禆益大政取進止溫國文正公文集卷第二十七
