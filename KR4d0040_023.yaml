body:
  text: 章奏八論因差遣例除監司劄子論財利疏論因差遣例除監司劄子臣光竊以轉運使提點刑獄轉運判官等皆宣布國家詔令督察官吏善惡一方之民休戚所繫事任至重不可輕以授人伏見近歲以來多以所歷差遣循例得之不問其人賢與不肖有無績效至如真楚泗州之類雖云繁劇然民事至少賔客實多大抵能飾厨傳即為稱職官滿之日往往擢為監司若其人實有材能政迹則雖在它州亦當擢用若無以異於庸人則不當獨以此數州為僥幸之津塗也臣欲乞應諸處知州軍有政迹尤異及功效著明者特賜勑書獎諭仍令中書記録姓名若轉運使提點刑獄轉運判官等有闕即采擇用之其餘諸處差遣舊例得監司者今後亦皆寢罷得替日依舊入常程差遣如此則官吏有所勸監司皆得人矣取進止論財利疏月日具位臣光謹昧死上疏尊號皇帝陛下臣聞昔楚莊王以無災為懼曰天豈棄不榖乎范文子曰唯聖人能外內無患然則歲小不登邊鄙有警未必非國家之福也伏見今春天久不雨陛下憂勞於內公卿惶恐於外豈不以公私之積素不充實若遇饑饉將無以相恤乎一朝京師得雨逺方未遍則君臣釋然相慶不復以民食為念陛下安知來歲之旱不甚於今歲乎蓋天降災沴蠻夷猾夏冦賊姦宄此堯舜所不能免也即不幸有大水大旱方二三千里戎狄乘間而窺邊細民窮困而為盜軍旅數起久未有功府庫之蓄積已竭百姓之生業已盡陛下當此之時將以何道救之乎臣不知陛下與公卿大臣以此為必無而不足憂乎將以為有之而不為之備俟事至然後憂之也若俟事至然後憂之雖以陛下之聖明得益稷太公以為輔佐臣以為不及矣何則聖賢之治皆積以歲月然後有功欲天下之家給人足固不可一日具也周易既濟之象曰君子以思患而豫防之此其時矣失之愈逺救之愈難奈何日復一日取過目前而已乎晉武帝時何曽謂其子孫曰吾每見主上所說皆平生常語未嘗及經逺大計吾子孫其及於亂乎其後五胡御名亂中州覆沒生民塗炭幾三百年由是觀之上下偷安不為逺謀此最國家之大患也詩曰哀哉為猷匪先民是程匪大猷是經維邇言是聽維邇言是爭如彼築室于道謀是用不潰于成方今之政何以異此此臣之夙夜所為痛心疾首者也古之王者藏之於民降而不能乃藏於倉廪府庫故上不足則取之於下下不足則資之於上此上下所以相保也今民既困矣而倉廪府庫又虛陛下儻不深以為憂而早為之謀臣恐國家異日之患不在於它在於財力屈竭而已矣今朝廷不循其本而救其末特置寬恤民力之官分命使者旁午四出爭言便冝以變更舊制米鹽靡密之事皆非朝廷所當預者張設科條不可勝紀或不如其舊益為民患或朝三暮四移左於右其間果能利民者不過放散縣官之物以豫民耳是誠損上益下王者之仁政也然臣聞古之聖王養之有道用之有節上有餘財然後推以豫民是以上下交足而頌聲作矣今入者日寡出者日滋是所謂厭其原開其瀆其竭可立而待也公家既竭不取諸民將焉取之是徒有利民之名而無利民之實果何益哉夫寬恤民力在於擇人不在立法若守令得人則民力雖欲毋寬其可得乎守令非其人而徒立苛法適所以擾民耳自置此官以來於今纍年臣訪之民間未聞其困弊小瘳於前也然則為今之術奈何曰在隨材用人而久任之在飬其本原而徐取之在減損浮冗而省用之何謂隨材用人而久任之夫人之材性各有所冝雖周孔之材不能遍為人之所為況其下乎固當就其所長而用之今朝廷用人則不然顧其出身資叙何如耳不復問其材之所堪也故在兩禁則欲其為嚴助司馬相如任將帥則欲其為衛青霍去病典州郡則欲其為龔遂黃霸尹京邑則欲其為張敞趙廣漢司財利則欲其為孔僅桑羊丗豈有如此人哉故財用之所以匱之者由朝廷不擇專曉錢榖之人為之故也國𥘉三司使或以諸衛將軍諸司使為之判官則朝士曉錢榖者皆得為之不必用文辭之士也先朝以數路用人文辭之士置之館閣曉錢榖者為三司判官曉刑獄者為開封府推判官三者職業不同趣舍各異莫相涉也然後人主以時引對訪問以察之使令以試之積久以觀之核其真僞辨其臧否考其功效然後進之退之未必歷其職者皆須進用不可復退也故群臣各宣其用而萬事交舉矣夫官久於其業而後明功久於其事而後成是以古者丗官相承以為氏姓先朝陳恕領三司十餘年至今稱能治財賦者以恕為首豈恕之材智獨異於人哉蓋得久從事於其職故也至於副使判官堪其事者亦未數易也是以先帝屢行大禮東封西祀廣修宫觀而財用有餘者用人專而任之久故也近歲三司使副使判官大率多用文辭之士為之以為進用之資塗不復問其習與不習於錢榖也彼文辭之士習錢榖者固有之矣然不能專也於是乎有以簿書為煩而不省以錢榖為鄙而不問者矣又居官者出入遷徙有如郵舍或未能盡識吏人之面知職業之所主已捨去矣臣頃者判度支勾院甫二年耳上自三司使下至檢法官改易皆遍甚者或更歷數人雖有恪勤之人夙夜盡心以治其職人情稍通綱紀粗立則捨之而去後來者意見各殊則嚮之所為一皆廢壞況怠惰之人因循苟且惟思便身不顧公家者乎如此而望太倉有紅腐之粟水衡有貫朽之錢臣未知其期也凡百官莫不欲久於其任而食貨為甚何則二十七年耕然後有九年之食今居官者不滿三歲安得有二十七年之效乎臣愚以為朝廷冝精選朝士之曉錬錢榖者不問其始所以進或進士或諸科或門䕃先使之治錢榖小事有功則使之權發遣三司判官事及三年而察之實效顯著者然後得權三司判官事又三年更有實效然後得為正三司判官其無實效者皆退㱕常調勿復收用其諸路轉運使不復以路分相壓使之久於其任有實效者或自權為正自轉運副使為轉運使無實效者亦退㱕常調勿復收用每三司副使闕則選三司判官及諸路轉運使功效尤著者以𥙷之三司使闕亦選於副使以𥙷之三司使久於其任能使用度豐衍公私冨實者增其秩使與兩府同而勿改其職如此則異日財用之豐耗不離於己不得諉之它人必務為永久之規矣其文辝之士則自有資塗不必使為錢榖之吏以輕之也何謂養其本原而徐取之善治財者飬其所自來而收其所有餘故用之不竭而上下交足也不善治財者反此夫農工啇賈者財之所自來也農盡力則田善收而榖有餘矣工盡巧則器斯堅而用有餘矣啇賈流通則有無交而貨有餘矣彼有餘而我取之雖多不病矣今之有司自謂能治財者臣見之矣凍餒其民而豐積聚者也掃土以市祿位而不恤後人者也捃拾麻麥而喪丘山者也保惜一錢而費萬金者也不操白刃而為冦攘者也姦巧簿書而罔君上者也必曰養其所自來而收其所有餘則聞者以為笑矣夫使稼穡者饒樂而惰游者困苦則農盡力矣堅好便用者獲利浮溈侈靡者不售則工盡巧矣公家之利捨其細而取其大散諸近而收諸逺則商賈流通矣農工商賈皆樂其業而安其冨則公家何求而不獲乎夫農天下之首務也古人之所重而今人之所輕非獨輕之又困苦莫先焉何以言之彼農者苦身勞力衣粗食糲官之百賦出焉百役歸焉歲豐賤貿其榖以應官私之求歲凶則流離凍餒先衆人填溝壑如此而望浮食之民轉而緑南畒難矣彼直生而不知市井之樂耳苟或知之則去而不返矣故以今天下之民度之農者不過二三而浮食者常七八矣欲食廪之實其可得乎臣愚以為凡農民租稅之外冝無有所預衙前當募人為之以優重相𥙷不足則以坊郭二戶為之彼坊郭之民部送綱運典領倉庫不費二三而農民常費八九何則儇利戇愚之性不同故也其餘輕役則以農民為之歲豐則官為平糴使榖有所歸歲凶則先案籍賙贍農民而後及浮食者民有能自耕種積榖多者不籍以為家資之數如此則榖重而農勸矣彼百工者以時俗為心者也時俗貴用物而賤浮僞則百工變而從之矣時俗者以在上之人為心者也在上好朴素而惡淫侈則時俗變而從之矣其百工在官者亦當擇人而監之以功致為上華靡為下物勒工名謹考其良苦而誅賞之取其用不取其數則器用無不精矣彼商賈者志於利而已矣今縣官數以一切之計變法更令棄信而奪之彼無利則棄業而從他縣官安能止之哉是以茶鹽棄捐征稅耗損凡以此也然則縣官之利果何得哉善治財者不然將取之必豫之將斂之必散之故日計之不足而歲計之有餘此乃白圭猗頓之所知豈國家選賢擇能以治財其用智顧不如白圭猗頓邪患在國家任之不久貴近效而遺逺謀故也夫伐薪者刈其條枚養其本根則薪不絶矣若并根本而伐之其得薪豈不多哉後無繼矣是非難知之道也然則有司不為者彼其心曰吾居官不日而遷不立效於目前以自顯顧養財以遺後之人使為功吾何賴焉是非特有司之罪也亦朝廷用人之法驅之使然也何謂減損浮冗而省用之昔太祖𥘉得天下之時止有一百一十一州耳江南兩浙西川冨饒之土皆為異域又承五代荒亂之餘府庫空竭豪桀綦布於海內戎狄窺覦於邊境戎車歲駕四方多虞當是之時內給百官外奉軍旅誅除僣僞賞賜巨萬未嘗聞財用不足如今日之汲汲也陛下承祖宗之業奄有四百餘州天下一統戎狄欵塞冨饒之土貢賦相屬承平積久百姓阜安是冝財用羡溢百倍於前奈何竭府庫之所蓄罄率土之所有當天下無事之時遑遑焉專救經費而不足萬一有不可期之災患將何以待之乎夫以國𥘉之狹隘艱難財用冝不足而有餘今日之廣大安寧財用冝有餘而不足陛下亦嘗熟思其所以然之理乎得非太祖所養者皆有㓛有用之人陛下所養者未必尽有功用乎臣竊見陛下天性恭儉不好侈靡宫室苑囿皆因祖宗之舊無所更造或隳頓荒蘙不加修治飲膳衣服器皿帷帳適足供用不極精華或苦惡弊綻亦不更易雖唐虞之土階三尺茅茨不翦殆無以過然左右侍御之人宗戚貴臣之家苐宅園圃服食器用往往窮天下之珍怪極一時之鮮明惟意所欲無復分限以豪華相尚以儉陋相訾愈厭而好新月異而歲殊長以費用不足則求請無厭丐貸不恥甚者或依慿詔令以發府庫之財假託供奉以靡縣官之物真僞莫辨多少不㑹陛下聖度寬仁不欲拒塞惡聞人過不加案詰至於頒賜外廷之臣亦皆踰溢常數不循舊規如嚮者皇女初生所散包子之類費用不可勝紀臣嘗聞耆舊之人言先朝公主在宫中俸錢不過月五千其餘後宫月給大扺倣此非時未嘗輕有賜豫賜豫亦不甚豐竊聞近日俸給賜豫比於先朝何啻數十倍矣漢明帝曰我子豈冝與先帝子等乎夫等猶不可又况過之是以祖宗之積窮於賜豫困於浮費臣不能知其詳以外望度之什耗七八矣內藏以虛而浸淫於左藏矣夫府庫者聚天下之財以為民也非以奉一人之私也祖宗所為置內藏者以備饑饉兵革非常之費非以供陛下奉養賜豫之具也今內藏庫專以內臣掌之不領於三司其出納之多少積蓄之虛實簿書之是非有司莫得而知也若皆以奉養賜豫而盡之一旦有饑饉兵革之事三司經費自不能周內藏又無所仰斂之於民則民已困竭得無狼狽而不支乎此臣夙夜所凛凛也今陛下所以有唐虞之德而無唐虞之治者其失在於不忍而好豫不忍則不誅有罪好豫則不待有功不誅有罪則姦邪欺罔而不忌不待有功則貪佞徼幸而無厭治道之所以不格于上下者凡以此也昔韓昭侯有弊袴命藏之侍者曰君亦不仁者矣不賜左右而藏之昭侯曰吾聞明主愛一嚬一笑嚬有為嚬笑有為笑今袴豈特嚬笑哉吾必待有功者彼小國諸侯猶能慎賞如是而國以冨强况以四海之主不行無功徼幸之賞杜塞甘言悲辭之請則唐虞之治何逺之有哉夫府庫金帛皆生民之膏血州縣之吏鞭撻其丁壯凍餒其老弱銖銖寸寸而聚之今以冨大之州終歲之積輸之京師適足以供陛下一朝恩澤之賜貴臣一日燕飲之費陛下何獨不忍於目前之群臣而忍之於天下之百姓乎夫以陛下恭儉之德擬於唐虞而百姓窮困之弊鈞於秦漢秦漢竭天下之力以奉一身陛下竭天下之力以資衆人其用心雖殊其病民一也此臣之所以尤戚戚者也又宫掖者風俗之原也貴近者衆庶之法也故宫掖之所尚則外必為之貴近之所好則下必效之自然之勢也是以內自京師士大夫外及逺方之人下及軍中士伍甽畒農民其服食器用比於數十年之前皆華靡而不實矣嚮之所有今人見之皆以為鄙陋而笑之矣夫天地之産有常而人類日繁耕者寖寡而遊手日衆嗜欲無極而風俗日奢欲財力之無屈得乎哉又府史胥徒之屬居無廪祿進無榮望皆以啖民為生者也上自公府省寺諸路監司州縣鄉村倉場庫務之吏詞說追呼租稅繇役出納㑹計凡有毫釐之事關其手者非賂遺則不行是以百姓破家壞産者非縣官賦役獨能使之然也太半盡於吏家矣此民之所以重困者也又國家比來政令寬㢮百職隳廢在上者簡倨而不加省察在下者侵盜而恣為姦利是以每有營造貿買其所費財物什倍於前而所收功利曽不一二此國用之所以尤不足者也又自古百官皆有常貟而國家用磨勘之法滿歲則遷日滋月益無復限極是以一官至數百人則俸祿有增而無損矣又近歲養兵務多不務精夫兵多而不精則力用寡而衣糧費衣糧費則府庫耗府庫耗則賜賚稀是以不足者豈惟民哉兵亦貧矣䇿之失者無甚於此也凡此數者皆所以竭民財者也陛下安得熟視而無所變更邪臣愚伏願陛下觀今日之弊思將來之患深自枊損先由近始凡宗室外戚後宫內臣以至外廷之臣俸給賜豫皆循祖宗舊規勿復得援用近歲僥幸之例其踰越常分妄有干求者一皆塞絶分毫勿許若祈請不巳者冝嚴加懲譴以警其餘凡文思院後苑作所為竒巧珍玩之物不急而無用者一皆罷肖內自妃嬪外及宗戚下至臣庶之家敢以奢麗之物夸眩相髙及貢獻賂遺以求恱媚者亦明治其罪而焚毀其物於四逹之衢專用朴素以率先天下矯正風俗然後登用廉良誅退貪殘保佑公直銷除姦蠧澄清庶官選練戰士不祿無功不食無用如此行之久而不懈臣見御府之財將朽蠹而無所容貯大倉之粟將彌漫而不可蓋藏農夫棄糧於甽畝商賈讓財於道路矣孰與今日汲汲以應目前之求凛凛以憂將來之困乎夫食貨者天下之急務今窮之如是而宰相不以為憂意者以為非巳之職故也臣願復置總計使之官使宰相領之凡天下之金帛錢榖隸於三司及不隸三司如內藏奉宸庫之類總計使皆統之小事則官長專逹大事則謀於總計使而後行之歲終則上其出入之數於總計使總計使量入以為出若入寡而出多則總計使察其所以然之理求其費用之可省者以奏而省之必使歲餘三分之一以為儲蓄備禦不虞凡三司使副使判官轉運使及掌內藏奉宸等庫之官皆委總計使察其能否考其功狀以奏而誅賞之若總計使久試無效則乞陛下罷退其人更置之議者必以為宰相論道經邦燮理隂陽不當領錢榖之職是皆愚人不知治體者之言昔舜舉八愷使主后土奏庶艱食貿遷有無地平天成九功惟敘周禮冢宰以九職九賦九式九貢之法治財用唐制以宰相領鹽鐵度支戶部國𥘉亦以宰相都提舉三司水陸發運等使是則錢榖自古及今皆宰相之職也今譯經潤文猶以宰相領之豈有食貨國之大政而謂之非宰相之事乎必若府庫空竭閭閻愁困四方之民流轉死亡而曰我能論道經邦燮理隂陽非愚臣之所知也臣不勝狂愚冒犯忌諱惟陛下裁察臣光昧死再拜上疏溫國文正公文集卷第二十三
