body:
  text: 章奏三十七起請科埸劄子賑濟劄子乞撫納西人劄子詔意乞先行經明行修科劄子辭接續支俸劄子請罷將官劄子起請科場劄臣伏覩朝廷改科埸制度第一場試夲經義第二場試詩賦第三場試論第四埸試策試新科明法除斷案外試論語孝經義奉聖旨令禮部與兩省學士待制御史臺國子監司業集議聞奏臣竊有所見不敢不以聞凡取士之道常以德行為先文學為後就文學之中又當以經術為先辭采為後是故周禮大司徒以六德六行賔興萬民漢以賢良方正孝廉質朴敦厚取士中興以後取士尤為精慎至於公府掾屬州從事郡國計吏丞史縣功曹鄉嗇夫皆擇賢者為之苟非其人則為丗所譏貶是以人人思自砥礪教化興行風俗純厚乃至後丗陵夷雖政刑紊於上而節義立於下有以姧回巧偽致冨貴者不為清議所容此乃德化之本源王者所先務不可忽也熹平中詔引諸生能文賦者待制鴻都門下蔡雍力爭以為辭賦小才無益於治不如經術自魏晉以降始貴文章而賤經術以詞人為英俊以儒生為鄙朴下至隋唐雖設明經進士兩科進士日隆而明經日替矣所以然者有司以帖經墨義試明經專取記誦不詢義理其弊至於離經析注務隱爭難多方以誤之是致舉人自幼至老以夜繼晝腐脣爛舌虛費勤勞以求應格詰之以聖人之道瞢若靣墻或不知句讀或音字乖訛乃有司之失非舉人之罪也至於以賦詩論策試進士及其末流專用律賦格詩取捨過落擲其落韻失平側偏枯不對蜂腰鶴膝以進退天下士不問其賢不肖雖頑如跖蹻苟程試合格不廢髙第行如淵騫程試不合格不免黜落老死衡茅是致舉人專尚辭華不根道德涉獵鈔節懷挾勦剽以取科名詰之以聖人之道未必皆知其中或遊處放蕩容止輕儇言行醜惡靡所不至者不能無之其為弊亦極矣神宗皇帝深鑒其失於是悉罷賦詩及經學諸科專以經義論策試進士此乃革歷代之積弊復先王之令典百丗不易之法也但王安石不當以一家私學欲蓋掩先儒令天下學官講解及科場程試同已者取異己者黜使聖人坦明之言轉而陷於竒僻先王中正之道流而入於異端若已論果是先儒果非何患學者不棄彼而從此何必以利害誘脅如此其急也又黜春秋而進孟子廢六藝而尊百家加之但考校文學不勉勵德行此其失也凡謀度國事當守公論不可希時又不可徇俗冝校是非之小大利害之多少使質諸聖人而不謬酌於人情而皆通稽於上古而克合施之當丗而可行然後為善也今國家大議科埸之法欲盡善盡美以臣所見莫若依先朝成法合明經進士為一科立周易尚書詩周禮儀禮禮記春秋孝經論語為九經令天下學官依注疏講説學士慱觀諸家自擇短長各從所好春秋止用左氏傳其公羊榖梁陸淳等説並為諸家孟子止為諸子更不試大義應舉者聽自占習三經以上多少隨意皆須習孝經論語於家狀前開坐習某經某經又每歲委升朝文官保舉一人不拘見在任不在任是夲部非本部各舉所知若係親戚亦於舉狀內聲説其舉狀稱臣竊見某州某縣人某甲有何行能臣今舉堪應經明行修科於後不如所舉臣甘當連坐不詞候奏狀到朝廷下禮部貢院置簿各分逐路抄録本人姓名注舉主官位姓名於其下仍下夲州出給公據付夲人收執及令夲州亦如貢院置薄抄録準備開科埸日考驗公據其舉狀既上之後若所舉之人犯贓私罪至徒以上情理重及違犯名教候斷訖仍收坐舉主奏乞朝廷取勘施行其人未及第者減五等巳及第者減三等坐之一如舉選人充京官法臣竊料此法𥘉行其奔競屬請固不能免若朝廷必坐舉主無有所赦三五人後自皆慎擇其人不敢妄舉如此則士之居鄉居家獨處暗室立身行已不敢不慎惟懼玷缺有聞於外矣所謂不言之教不肅而成不待學官日訓月察立賞告訐而士行自美矣每遇開科埸其有舉主者自稱應經明行修舉仍於所投家狀前開坐舉主官位姓名有司撿會簿上合同方許收接其無舉主者只稱應鄉貢進士舉如常法每舉人三人以上自相結為一保止保委是正身及是夲貫不曽犯真刑無隱憂匿服此外皆不保其夲州及貢院考試並依舊法差封彌謄録監門巡鋪官程試之嚴加檢察相聚傳義傳本懷挾代筆違者扶出第一場先試孝經論語大義五道內孝經一道論語四道先須備載正文次述注疏大意次引諸家異義次以己見評其是非以援據精詳理長文優者為通其次為粗援據疏略理短文拙者為否三通以上為合格不合格者先次駮放合格者榜引次埸就試如舊試經學諸科法或合格人數太少則委試官臨時短中求長詳酌放過次埸試尚書次埸試周禮次埸試儀禮次埸試禮記次埸試春秋次埸試周易大義各五道令舉人各隨所習經書就試考校過落如孝經論語法次埸試論二道一道於儒家諸子書內出題一道於歷代正史內出題次埸試策三道皆問時務考䇿之日方依解額及奏名人數定去留編排髙下以經數多者在上經數均以諭策理長文優者在上其經明行修舉人並於進士前别作一項出榜解發及奏名至御前試時務策一道千字以上封彌官於號上題所明經數及舉主人數候考校詳定畢編排之時亦以經數多者在上經數均以策理長文優者在上文理均以舉主多者在上其經明行修舉人亦於進士前别作一項編排先放及第其推恩注官比進士特加優異它時選擇清要官館閣臺諌等並須先取經明行修人其舉主姓名常於官告前聲説如此則舉人皆務尊尚經術窮聖人指趣不敢不精旁覽子史不敢不博又不流放入於異端小説講求時務亦不敢不知所得之士既有行義又能明道又能博學又知從政其為國家之用豈不賢於今日之所取乎所有今來乞復詩賦者皆嚮日老舉人止習詩賦不習經義應舉不得故為此説欲以動搖科埸制度為已私便朝廷若不欲棄捐舊人候將來科埸進士有特奏名者令試詩賦隨其優劣等第推恩亦無傷也不可以此輕改成法復從弊俗誤惑後生若以為文章之士國家所不可無即乞試夲經合格日投狀乞試雜文於試論次埸引試或律詩或歌行或古賦或頌或銘或贊或四六表啓臨時委試官出題目試某文定篇數字數共須及五百字以上取辝采髙下者為合格候得解及奏名及第日編排姓名髙下各在數經同等人之上如此則文章之士亦不乏矣至於律令敕式皆當官者所須何必置明法一科使為士者豫習之夫禮之所去刑之所取為士者果能知道義自與法律冥合若其不知但日誦徒流絞斬之書習煆錬文致之事為士已成刻薄從政豈有循良非所以長育人材敦厚風俗也朝廷若不欲廢棄巳習之人其明法曽得解者依舊應舉未曽得解者不得更應則收拾無遺矣臣愚所見如此伏乞以臣所奏及禮部等官所議謗國子監門及遍下諸州有州學處榜州學門令舉人限一月內投狀指定何法為善仰夲州附遞以聞候到京齊足更委其他執改看詳參酌從長施行取進止賑濟劄子臣竊惟鄉村人戶播殖百榖種蓻桑麻乃天下衣食之原比於餘民尤冝存恤凡人情戀土各願安居苟非無以自存豈願流移它境國家若於未流移之前早行賑濟使糧食相接不至失業則比屋安堵官中所費少而民間實受賜若於既流移之後方散米煮粥以有限之儲蓄待無窮之流民徒更聚而餓死官中所費多而民實無所濟伏覩近降朝旨令戶部指揮府界諸路提點刑獄司體量州縣人戶如委是闕食據見在義倉及常平米榖速行賑濟仍丁寧指揮州縣多方存恤無致流移失所此誠得安民之要道然所以能使流民不移者全在本縣令佐得人欲乞更令提點刑獄司指揮逐縣令佐專切體量鄉村人戶有闕食者一靣申知上司及夲州更不候回報即將夲縣義倉及常平倉米榖直行賑濟仍據鄉村五等人戶逐戶計口出給曆頭大人日給二升小兒日給一升令各從民便或五日或十日或半月一次賚曆頭詣縣請領縣司亦置簿照會若本縣米榖數少則先從下戶出給曆頭有餘則并及上戶其不願請領者亦聽候將來夏秋成熟糧食相接日即據簿曆上所貸過糧令隨稅送納一斗只納一斗更無利息其令佐若别有良法簡易便民勝於此法者亦聽從便要在民下乏食不至流移而巳仍令提點刑獄司常切體量逐縣令佐有能用心存恤闕食人戶雖係災傷並不流移者保明聞奏優與酬獎其全不用心賑貸致戶口多流移者取勘聞奏乞行停替庶使官吏有所勸沮百姓實霑聖澤取進止乞撫納西人劄子臣先於二月中曽上言乞因新天子繼統下詔悉赦西人之罪與之更始雖未還其侵疆且給歲賜待之如故此道大體正萬全無失既而執政所見各有異同沮難遷延遂屏棄不行臣竊聞今來西人巳有閞報定使副詣闕賀登寶位國家若於此際又不下詔開而納之萬一西人蓄怨積憤肆其悖心或有一騎犯邊或於表牒中有一語不遜當是之時雖欲招納乃是畏其陸梁傷威毀重何恥如之臣之前策亦不可行矣伏望陛下令三省樞密院將臣二月三日十二日十六日并今來所上文字一處進呈臣愚欲為國家消患於未萌誠惜此機會夙夜遑遑廢寢忘食陛下若俟詢謀僉同然後施行則執政人人各有所見臣言必又屏棄凡邊境安則中國安此乃國家安危之機伏望陛下察臣所言甚易行而無後害可使華夷兩安為利甚大斷自聖旨勿復有疑取進止詔意元祐元年三月上朕聞王者奄有四極至仁無私靡間華夷視之如一夏國主秉常丗守西土藩衛中邦自其祖彛興以來沐浴皇化職貢時至率多忠勤仁宗皇帝加之寵名胙以大國錫豫之數歲則有常嚮因邊臣奏陳云彼君臣失職及移文詰問曽無報應神宗皇帝乃出師命將極彼阽危在於夏國主秉常實有大造而所部之人遽敢自絶侵軼我邊部虔劉我吏民正旦同天皆不入賀國家包以大度置而不問但絶歲賜以俟悛心不幸光帝違棄萬國朕嗣守令緒祗承前志夙夜寅畏逮今期年宣廣恩澤無幽不振而夏國主秉常屢遣使者造于闕庭弔祭訃告寖修常職朕惟江海之大來則受之豈復追念往昔校計細故冝捨其前日之不恭取其今兹之效順曠然湔滌與之更始自今申欶將吏嚴戢兵民毋得輒規小利擾彼疆埸凡歲時頒賚命有司率由舊章必使桴鼓不鳴烽燧無警彼此之民早眠晏起同底太寧不亦休哉可布告中外咸使聞知乞先行經明行修科劄子元祐元年上臣先上言乞每歲委升朝文官保舉一人應經明行修科與進士並置程試一如進士惟于及第後推恩優異以勸勉天下舉人使敦修士行昨巳有朝旨來年科場且依舊法施行竊聞近有聖旨其進士經義並兼用注疏及諸家之説或己見仍罷律義先次施行臣竊詳朝廷之意蓋為舉人經義文體專習王氏新學為日巳久來年科場欲兼取舊學故有此指揮令舉人豫知而習之臣所乞置經明行修科者欲使舉人知向去科場朝廷敦尚行義不專取文學所以美教化厚風俗比於經義文體尤為要切冝使舉人豫知欲乞亦降朝旨先次施行况與進士舊法兩不相妨取進止辭接續支俸劄子臣以假滿百日自四月以後不敢勘請俸給聞近有聖旨特再給臣寬假將治其俸給等接續支給臣自正月二十一日以病在朝假久而不愈亦曽陳乞宫觀以養衰殘聖恩不許更除左僕射臣惶恐失圗不敢復言自爾日望痊平入覲丹扆面陳至誠庶得極竭疲駑且供舊職以輔報萬分而藏府雖寧瘡瘍未愈肌體羸瘠足力全無步履甚難拜起不得以此無由朝參計告假不管本職公事及一百一十餘日入覲之期未能自定竊以百日停俸著在舊章况臣當表率百僚豈敢廢格不行臣聞孔子曰先事後得詩云不素䬸兮今雖聖澤優厚曲加矜恤而使臣違先事之義重素䬸之罪四海指目何以自安伏望聖慈許臣依條百日外住支請受候參假日依舊庶使臣得安心養疾保全微軀取進止請罷將官劄子臣於去年四月二十七日曽上言州縣者百姓之根夲長吏者州縣之根夲根夲危則枝葉何以得安故自古以來置州郡必嚴其武備設長吏必盛其侍衛所以安百姓衛朝廷也秦滅六國以為兵不復用雖置郡守而以御史監之墮名城銷鋒鏑故陳勝吳廣起而郡縣不能制國隨以亡晉武帝平吳悉罷州郡縣兵陶璜山濤皆言州郡武備不可廢及永寧以後盜賊群起州郡無備天下遂大亂國朝置總管鈐轄都監監押為將率之官凡州縣兵馬其長吏未嘗不同管轄蓋知州則一州之將知縣則一縣之將也熙寧中謀臣建議分天下禁軍每數千為一將别置將官以領之訓練差使抽那一出其手其逐州總管以下及知州知縣皆不得開預量留羸弱下軍及剩貟以充夲州白直及諸般差使而已凡設官分職當上下相維如身之使臂臂之使指紀綱乃立今為州縣長及總管等官而於所部士卒有不相統攝殆如路人者至於倉庫守宿街市巡邏亦皆乏人雖於條有許差將下兵士者而州縣不得直差須牒將官往往占護不肯差撥萬一有非常之變州縣長吏何以號令其衆制禦姧宄哉臣目覩前宰相西京留守韓絳謁嵩山起建道埸其將下禁軍充白直者於條不得出城經宿所敢留者剩貟七八人而已况僻小州縣其守禦之備侍衛之衆可知矣臣當時乞悉罷將官其逐州縣禁軍並委長吏與總管等官同共提舉教閲及諸多差使其州縣長吏所給白直皆如嘉祐編勑以前之數臣自上此文字後來不聞朝廷有所施行竊見今歲諸處多闕雨澤盜賊頗多州縣全無武備長吏侍衛單寡禁軍盡屬將官將官多與長吏爭衡長吏勢力逺出其下萬一有如李順王倫攻城陷邑之冦或如王均王則竊發肘腋之變豈不為朝廷旰食之憂邪王者制治於未亂保安於未危豈可自恃太平之久謂必無此等事邪又自祖宗以來諸軍少曽在營常分畨往緣邊及諸路屯駐駐泊蓋欲使之均勞逸知艱難識戰鬪習山川自置將官以來苟非有所征討全將起發與將官偕行外其餘常在夲營不復分畨屯駐駐泊飽食安坐養成驕惰之性歲月滋久恐不可復用又每將下各有部隊將準備差遣指使之類一二十人而諸州總管鈐轄都監監押貟數亦如舊設官重復虛費廪祿凡將官之設有害無利天下曉軍政者莫不知之臣愚伏望朝廷如臣前奏盡罷諸路將官其禁軍各委夲州縣長吏與總管鈐轄都監監押等管轄一如未置將官以前之法其諸州軍兵馬全少不足守禦之處量與立額招添其守禦有備而冦賊之發不能式遏或棄城逃避或率吏民迎賊或斂民財賂賊雖責之以死彼亦甘心今平居騶從且不能備一旦冦至責以死節不亦難哉取進止溫國文正公文集卷第五十二
