body:
  text: 章奏十五貢院乞逐路取人狀上殿劄子擇帥劄子延訪群臣第四劄子任守忠劄子第二劄子第三劄子奉養劄子內侍差遣劄子貢院乞逐路取人狀准中書批送下太子中舍知封州軍州事柳材奏伏見國家間歲一開科場詔下州郡使之鄉舉里選遣詣京師覆試於禮部雖幽逺之士咸與其進然而天下發解進士到省常不下二千餘人南省取者才及二伯而開封國學鎖㕔預奏名者殆將太半其諸路州軍所得者僅百餘人爾惟陜西河東河北荆湖北廣南東西等路州軍舉人近年中第者或一二竊以科舉既頻天下之士誠奔走之不易而嶺外尤為遐僻每隨計動經五七千里往來不啻百餘程跋履道塗蒙犯風雪比至京師扶持困躓之不暇使與郊圻安燕之士角其藝能固不可得也既而不第孤寒之路最為蹭蹬千進且難往往廢學於臣愚見似有未均欲乞今後南省考試進士將開封國學鎖㕔舉人試卷衮同糊名其諸道州府舉人試卷各以逐路糊名委封弥官於試卷上題以在京逐路字用印送考試官其南省所放合格進士乞於在京逐路以分數裁定取人所貴國家科苐均及中外如允所請伏乞下兩制詳定者右謹具如前當院今將簿籍勘㑹近歲三次科場內嘉祐三年國子監得解及免解進士共一百一十八人及第者二十二人約五人中取一人開封府得解及免解進士共二百七十八人及第者四十四人約六人中取一人河北路得解及免解進士共一百五十二人及第者五人約三十人中取一人京東路得解及免解進士共一百五十七人及第者五人梓州路得解及免解進士六十三人及第者二人並約三十一人中取一人廣南東路得解及免解進士共九十七人及第者三人約三十二人中取一人荆湖南路得解及免解進士共六十九人及第者二人約三十四人中取一人廣南西路得解及免解進士共三十八人利州路得解及免解進士共二十六人䕫州路得解及免解進士共二十八人及第者各只一人河東路得解及免解進士共四十四人全無人及第嘉祐五年國子監得解及免解進士共一百八人及第者二十八人開封府得解及免解進士共二百六十六人及第者六十九人並約四人中取一人京東路得解及免解進士共一百五十人及第者五人約三十人中取一人荆湖南路得解及免解進士共六十九人及第者二人約三十四人中取一人廣南東路得解及免解進士共八十四人及第者二人約四十二人中取一人河東路得解及免解進士共四十一人陜西路得解及免解進士共一百二十三人及第者各只一人荆湖北路得解及免解進士共二十四人廣南西路得解及免解進士共六十三人夔州路得解及免解進士三十二人並全無人及第嘉祐七年國子監得解及免解進士共一百一十一人及第者三十人約四人中取一人開封府得解及免解進士共三百七人及第者六十六人約五人中取一人荆湖南路得解及免解進士六十八人及第者二人約三十四人中取一人陜西路得解及免解者進士共一百二十四人及第者二人約六十二人中取一人河北路得解及免解進士共一百五十四人河東路得解及免解進士共四十五人荆湖北路得解及免解進士共二十三人及第者各一人廣南東路得解及免解進士共七十七人廣南西路得解及免解進士共六十三人利州路得解及免解進士共二十八人並全無人及第以此比較在京及諸路舉人得失多少之數顯然大假不均蓋以朝廷每次科場所差試官率皆兩制二館之人其所好尚即成風俗在京舉人追趣時好易知體靣淵原漸染文采自下使僻逺孤陋之人與之為敵混同封彌考較長短勢不侔矣孔子曰十室之邑必有忠信如丘者焉言雖微陋之處必有賢才不可誣也是以古之取士以郡國户口多少為率或以德行或以材能隨其所長各有所取近自族姻逺及夷狄無小無大不可遺也今或數路之中全無一人及第則所遺多矣國家用人之法非進士及第者不得美官非善為賦詩論䇿者不得及第非遊學京師者不善為賦詩論䇿以此之故使四方學者皆棄背鄉里違去二親老於京師不復更歸其間亦有身負過惡或隱憂匿服不敢於鄉里取解者往往私買監牒妄冒户貫於京師取解自間歲開科場以來逺方舉人憚於往還只在京師寄應者比舊尤多國家雖重為科禁至於不用䕃贖然冒犯之人歲歲滋甚所以然者蓋由每次科場及第進士大率是國子監開封府解送之人則人之常情誰肯去此而就彼哉夫設美官厚利進取之塗以誘人於前而以苛法空文禁之於後是猶决洪河之尾而捧土以塞之其勢必不行矣書曰無偏無黨王道蕩蕩國家設賢能之科以俟四方之士豈可使京師詐妄之人獨得取之今來栁材所起請科場事件若依而行之委得中外均平事理允當可使狐逺者有望進逹僑寓者各思還夲土矣難者必曰國家比設封彌謄録以盡至公其諸路舉人所以及第少於在京者自以文藝踈拙長短相形理冝黜退今若於封彌試卷上題在京逐路字號必慮試官挾私者因此得以用情是大不然國家設官分職以待賢能大者道德器識以弼諧教化其次明察惠和以拊循州縣其次方略勇果以扞禦外侮小者刑獄錢榖以供給役使豈可專取文藝之人欲以備百官濟萬事邪然則四方之人雖於文藝或有所短而其餘所長有益於公家之用者蓋亦多矣安可盡加棄斥使終身不仕邪凡試官挾私者不過徇其親知鄉黨今雖題逐路字號若試官欲徇其親知則一路之人共聚一處不知何者為其親知若欲徇其鄉黨則一路之中所取自有分數豈敢偏於夲路剩取一人以此言之雖題逐路字號試官亦無所容其私也今欲乞依柳材起請今後南省考試云云裁定取人若朝廷尚以為有所嫌疑即乞令封彌官將國子監開封府及十八路臨時各以一字為偏傍立號假若國子監盡用乾字開封府盡用坤字京東路盡用離字京西路盡用坎字為偏傍其餘路分並依此例知貢舉官於逐號之中考校文理善惡各隨其長短每十人中取一人奏名其不滿十人者六人以上亦取一人五人以下更不取人其親戚舉人别試者緣人數至少更不分别立號只依舊條混同封彌分數取人其合該奏名者更不入南省奏名數內如允所奏乞降指揮下貢院遵守施行上殿劄子臣聞舜與臯陶𢋫歌相戒以明良為美以叢脞為非蓋以王者奄有四海君臨億兆若事無巨細皆以身親之則所得至寡所失至多矣古語有之曰察者不能見目睫非不欲兼之勢不可也是以明王為之不然總其大體執其樞要精選賢能任以百職有功者賞有罪者誅故處躬不勞而收功甚大用此道也臣伏見陛下自親政以來厲精求治孳孳不倦未明求衣日􅉴不食雖大禹之勤勞文王之懿恭無以過此然而政有夲末事有細大舉其綱則百目張挈其領則衆毛理臣願陛下先其夲後其末急其大緩其細擇人而任之此政之夲也賞善而罰惡此事之大也陛下當先察群臣之邪正與其材能之所堪然後思天下有某事不治者當使某人治之其公忠勤恪功效顯著者勸之以厚賞姦回惰慢無功敗事者威之以嚴刑如是則萬事無不舉兆民無不安陛下可以髙拱無為而名配堯舜矣至於簿書之煩碎文法之微密錢榖之出納體例之有無此乃群臣百吏之所守非陛下所當留意也陛下若捨彼而取此則臣恐徒有大禹之勤勞而不獲其功文王之懿恭而不見其治也臣以獻替為職遇陛下勤政之𥘉虛心求諌此乃千載一時誠不敢以細末之事煩汙聰明伏望陛下深思此道乃自古及今致治之大勿以為迃闊陳熟之言而忽之則天下幸甚取進止擇帥劄子臣竊聞近者夏國屢起事端邊境之變不可不備為備之要在於擇帥伏見鄜延路經略使程戡資性姦回涇原路經略使施昌言老病昏昧皆以斗筲罷愞之才當折衝禦侮之任平居之時未見有闕一旦警急必敗大事譬如開門揖盜以肉餧虎臣竊謂國家危之伏望朝廷早擇智勇之將以代其任二人並除致仕以安邊境之民戒偷祿之臣取進止延訪群臣第四劄子臣屢曽上言乞詔侍從近臣每日輪一貟直資善堂夜則宿於崇文院內備非時宣召亦曽面奉德音云候秋凉當頻有宣召今巳秋凉尚未聞有曽被召之人臣始者上言之時竊見陛下欣然開納將謂即時施行自後遷延日久聖意漸以為難臣竊意內外之臣必有欺惑天聽沮難此事欲陛下常居禁中不與群下相接以壅蔽聰明專固權寵者此豈忠臣之所為而陛下之福邪臣願陛下深察此情斷自聖志使之更直陛下每日聽政餘暇宫中無事之時特賜召對與之從容講論古今治體民間情僞使各竭其胸臆所有而陛下更加采擇是者取之非者捨之忠者進之邪者黜之如此則下情盡逹聖德日新矣若以資善堂體例稍生則學士待制於崇文院輪宿自有舊條只乞陛下傳宣崇文院今後直宿者並須從早在彼祗候宣召其有事故請假者須與以次官互換直宿此事極不難行而所益甚大惟陛下留意取進止任守忠劄子臣竊聞入內內侍省都都知任守忠擅取奉宸庫金珠數萬兩獻遺中宮自以為功仍受中宮賞賜外議籍籍無不駭愕伏以守忠從來罪惡極多不可遽數陛下體元繼統聖政方新守忠曽無畏憚益恣巧諂公取官物自眩私恩贊導椒房首為侈靡既求權寵又分厚利姦邪之臣無大於此伏望陛下特發神斷以守忠付所司窮治所犯明正典刑以示天下取進止第二劄子臣近曽上言任守忠姦邪事跡乞正典刑未聞施行臣案守忠懷姦罔上諂倿貪婪竊弄權柄固非一日專為讒慝交御名兩宫狡詐反覆陛下所知若非先帝聖明皇太后仁慈則社稷可憂天位不安今又盜取庫物曲求容媚教中宫為不順陷陛下為不義此而不誅典刑安用據守忠罪惡臣久合奏陳但以陛下踐阼之初天威未震欲望陛下親發英斷戮此大姦使內外之臣莫不震肅今聖恩容貸巳及歲餘外議皆言守忠以諂佞之故受陛下寵遇過於先帝之時臣備位諌官不敢塞默守忠職在宮禁久專威福若不早除恐别生事伏望陛下如臣前奏速以守忠付所司窮治所犯肆之市朝以副天下之望取進止第三劄子二十日上殿明日守忠除保信軍節度副使蘄州安置臣近者兩次上言任守忠姦邪事跡乞正典刑至今未聞施行臣迫於忠懇不能自已竊見守忠早以小臣獲事先帝幸蒙奬拔榮祿俱極日侍左右不能以忠言正道𥙷益萬分専以詼諧諂諛苟求恱媚其罪一也總領近侍委之差遣而陵忽同列與奪自恣附己則愛恱逆意則憎疾援引親黨排抑孤寒任情徇私略無顧避其罪二也從來所受俸祿賞賜亦為不少而資性貪婪老而益甚盜竊宮物受納貨賂金帛珍玩溢於私家第宅産業甲於京師聚斂之心曽無紀極其罪三也交結朋援專權據勢縱逞胸臆妄行威福所愛者雖有大罪掩蓋不言所惡者小有瑕疵紏擲成事使宮禁之內側足屏息畏憚守忠無以為比其罪四也濮王之薨守忠監護葬事賈弄國恩輕蔑皇族乘其有喪丐奪財物所得甚多終不滿意遂誣長子宗懿以為不孝使𬒳譴謫感憤成疾以至沒身不能自雪其罪五也先帝以春秋寖髙未有繼嗣深思宗廟生民之重屬意聖明固非一日而守忠隂蓄姦心沮壞大䇿深忌國家立長立賢自欲於倉猝之際居中建議擇幼弱昏懦之君以邀大利如有唐之季定䇿國老門生天子賴先帝聰明卓然逺覽斷志不疑不然則太平之業幾墜於地其罪六也及陛下既為皇子守忠內懷憂懼日於先帝之前離間百端隔絶內外進對甚希使先帝為陛下之父不得施為父之恩陛下為先帝之子不得展為子之親其罪七也及先帝晏駕陛下纘統不幸遇疾皇太后權同聽政守忠乘此之際大逞姦謀窺伺語言撰造事迹往來革靣進退異辝使皇太后以文母之慈不免投杼之疑陛下以曽閔之孝立有負恩之謗交犯御名兩宫遂成深隙計其隂謀無所不至賴皇太后聰明確然執義不可傾移不然禍變之興豈可具道其罪八也及聖體既安皇太后恭還大政守忠不勸導陛下以勤修子道承顔順意報答盛德恢廣令譽而相時隨勢斗異炎凉欲詐輸新忠以巧遮舊惡用昔時讒陛下之計為今日讒皇太后之辝雖陛下未必聽受而使皇太后聞之不能不以介意終日涕泣邑怏成疾守忠但欲左右反覆自為身謀並不顧天下之人議陛下之善惡其罪九也皇后王位尚新天下聳觀令德守忠輒為皇后晝䇿並不禀問皇太后矯傳教旨開祖宗寶藏擅取金珠數萬兩以獻皇后既取恱一時又坐享厚賜逆婦姑之禮開驕侈之源使皇后受其惡名而已身收其重利為臣姦邪孰甚於此其罪十也守忠有大罪十皆陛下所親見衆人所共知其餘欺慢為姦恣橫不法事類繁多不可勝言誠國之大賊人之巨蠹伏望陛下盡發守忠之罪明示四方斬於都市以懲姦慝取進止奉養劄子臣伏見陛下嚮者即位之𥘉奉事皇太后䖍恭𣢾至皇太后撫愛陛下恩渥周備數日之間慈孝之譽逹於中外播於逺近聞者無不相慶自聖體不安旬月之間道路之人漸有異議皆云因任守忠等夲不樂陛下為嗣故於皇太后之處則言陛下與中宫之短於陛下與中宮之處則言皇太后之失遂使兩宮之心互相猜二間隙一開猝難復合今陛下奮發英斷屏黜讒邪守忠等皆降逐出外中外之人不勝抃恱然臣愚竊恐皇太后尚未能盡知姦人之情與陛下所以斥去之意伏望陛下與中宫親詣皇太后閣頓首陳謝具述從來為守忠等所誤致屢有違忤皇太后之意今守忠等既去願與皇太后母子之恩一如舊日然後朝夕與中宫侍飬左右膳羞藥餌躬親進獻承顔順色皆如臣庶之家母子婦姑之禮若左右之人尚有敢相離間者願陛下立行誅竄勿復有疑如此則讒慝黜逺內外雍睦善氣興行災沴消亡宗廟永安令聞長丗若失此之際兩宫之歡不能復舊則恐長無可復之期豈唯當今天下之人以陛下為非將傳於史䇿取譏万世矣此皆聖明所自知而臣復區區進言者欲陛下深更留意取進止內侍差遣劄子臣嚮時上殿伏見陛下宣諭以內臣差遣並一切委之都知司臣當時已曽奏陳以為非便今入內內侍省都都知任守忠恃此權勢背公立私奉之者坐獲進擢忤之者立致排擯威福之柄盡在其手遂使宫禁之中畏憚其人過於人主罪盈惡積幸賴陛下神斷已斥而去之然儻不收還威福之抦則是去一守忠生一守忠終無益也臣愚伏望陛下自今日已後除內臣常程差遣依舊令都知司定差外其勾當御藥院內東門龍圖天章閣後苑化成殿延福宫等處及非時差管勾裏外要切公事之人並乞陛下親加選擢試之以事觀其為人忠謹有功者則加賞拔姦邪不職者則加貶退不必一勘㑹資序檢尋體例如此則誰不懷德畏威輸忠竭力豈獨內臣而已雖外朝之臣亦可用此道而治也取進止貼黃所有見御四人亦乞陛下一按舊例於內供奉官以下自以聖意選擇忠信謹慤可託心腹之人使之勾當溫國文正公文集卷第三十
