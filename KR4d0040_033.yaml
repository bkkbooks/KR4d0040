body:
  text: 章奏十八招軍劄子錢糧劄子西邊劄子論修造劄子濮安懿王合行典禮議翰林學士王圭等狀孫長卿劄子第二劄子北邊劄子招軍劄子臣近聞朝廷於在京及諸路廣招禁軍其災傷之處又招飢民以充廂軍臣愚以為國家從來患在兵不精不患不多夫兵少而精則衣糧易供公私充足一人可當十遇敵必能取勝兵多不精則衣糧難贍公私困匱十人不足當一遇敵必致敗北此利害之明有如白黑不為難知也是以太祖皇帝之時天下兵數不及當今十分之一而猶日加選練簡去羸老專取精鋭故能征伐四克混一區夏自景德以來中國既以金帛綏懷戎狄不事征討至今已六十餘年是宜官有餘積民有餘財而府庫殫竭倉廪空虛水旱小愆流殍滿野其故何哉豈非邊鄙雖安而冗兵益多之所致乎此乃天下所共知非臣一人之私言也慶曆中趙元昊叛西邊用兵朝廷廣加召募應諸州都監監押募及千人者皆特遷一官以此之故天下冗兵愈衆國力愈貧近歲又纍次大㨂廂軍以輔禁軍之數即日係籍之兵巳為不少矣何苦更復直招禁軍及招飢民以充廂軍臣不知建議之臣曽與不曽計校今日府庫之積以飬今日舊有之兵果為有餘為不足乎此蓋邊鄙之臣庸愚懦怯無它材略但求添兵在朝之臣又恐所給之兵不副所求它日邊事或有敗闕歸咎於己是以不顧國家之匱乏只知召募取其虛數不論疲軟無所施用此群臣容身保位苟且目前之術非為朝廷深謀逺慮建經久之畫也諺曰多求不如省費此言雖小可以喻大今以十口之家衣食僅足一旦頓增五口必不能贍若不顧困中之粟笥中之帛所餘幾何而惟冗口是貪能無窮匱乎國家之勢何以異此群臣既不能為陛下忠謀陛下又不自以為憂則誰當憂之臣恐邊臣之請兵無窮朝廷之募兵無已倉庫之粟帛有限百姓之膏血有涯不知國家長此沉瘵何時當瘳乎臣又聞即日災傷之處軍無見糧煮薄粥以飼飢民猶不能給况刺以為兵將以何物養之終身乎且畎畒農民止因一時飢饉故流移就食若將來豐稔則各思復業今既刺以為兵是使之終身失業也於官於民皆為非便謀䇿之失孰甚於此臣願陛下斷自聖志速降指揮應在京及諸路並且罷招禁軍但選擇將帥使之訓練舊有之兵以備禦四夷不患不足其災傷之處州縣不得妄招飢民以充廂軍但據所有斛斗救接農民俟向去稍豐使各復舊業則天下幸甚臣自陛下踐阼以來不自知其狂愚見朝廷政令有未便差除有未當屢獻瞽言浼瀆天聰陛下未嘗為之變一政令改一差除如臣者亦可以不言矣然猶區區獻言不已者誠恥居位而不言不恥多言而見厭也取進止錢糧劄子臣近蒙恩給假至陜州焚黃竊見緣路諸州倉庫錢糧例皆闕絶其官吏軍人料錢月糧並須逐旋收拾方能支給竊料其餘諸州臣不到處亦多如此臣聞國無三年之蓄曰國非其國今窘竭如此而朝廷曽不以為憂若不幸有水旱蝗蝻方數千里如明道康定之時如之邊鄙有急興兵動衆不知朝廷何以待之臣伏見陳許頴亳等州止因去秋一次水災遂致骨肉相食積尸滿野此非今日官吏之罪乃嚮時官吏之罪也何則嚮時豐稔之歲其人但務偷安不為逺慮粟麥至賤不能儲蓄及至凶荒之際官私俱竭上下狼狽何由相救雖使桑羊劉晏復生亦無如之何也今春幸而得雨麥田有望朝廷巳置飢饉之事於度外不復以儲蓄為意矣萬一天下州縣復有災傷則何以異於陳許頴亳之民也若飢饉相繼盜賊必興此豈可不早為之深慮乎臣愚伏望陛下於天下錢榖常留聖心特降詔書明諭中外應文武臣僚有熟知天下錢榖利害能使倉庫充實又不殘民害物者並許上書自言陛下勿以其人官職之踈賤文辭之鄙惡一一略加省覽擇其理道稍長者皆賜召對從容訪問以方今食貨俱乏公私皆困何故而然如何擘畫可使上下豐足若其言無可取者則罷遣而已有可取者即為之施行仍記録其姓名置於左右然後選其中材幹出群者以為轉運使副判官及三司使副判官仍每至年終令三司撮計在京府界及十八路錢帛糧草見在都數聞奏以之比較去年終見在都數若增羡稍多即令勘會如别無姦巧欺謾及非理賦斂而致增羡其當職之人冝量行褒賞纍經褒賞者即别加進用若減耗稍多即令詰問如别無大故災傷及添屯軍馬而致減耗其當職之人冝量行責罰纍經責罰者即永從黜廢誠能如此行之不懈數年之後可使天下倉皆有餘粟庫皆有餘財雖有水旱蝗蝻之災及邊鄙有急皆不足憂也取進止西邊劄子臣竊見近年以來趙諒祚雖外遣使人稱臣奉貢而內蓄姦謀窺伺邊境隂以官爵金帛招誘中國不逞之人及熟戶蕃部聞其亡命叛去及潛與交通者巳為不少而朝廷不能一一盡知也其熟戶蕃部有違拒不從者諒祚輒發兵馬公行殺掠弓箭手有住在沿邊者諒祚皆迫逐使入內地將帥之臣但坐而視之不能救援遂使其餘熟户皆畏憚凶威怨憤中國人人各有離叛之心及朝廷遣使齎詔責問則諒祚拒而不納縱有所答皆侮慢欺謾之辭朝廷亦隱忍含容不復致詰諒祚又數揚虛聲以驚動邊鄙而將帥之臣率多懦怯别無才謀以折衝禦侮只知多聚兵馬以自衛其身一路有警則三路皆聳盡抽腹內州軍下畨兵士置在麾下使之虛食糧草數月之後寂無影響然後遣還未及休息忽聞有警又復抽去如此往還疲於道路訖無一事曽有施為臣雖愚駑不習邊事竊以私意料之諒祚所以依舊遣使稱臣奉貢者一則利於每歲所賜金帛二十餘萬二則利於入京興販貿易三則欲使朝廷不為之備也其所以招誘不逞之人者欲以采訪中國虛實之事平居則有謀主入冦則用為鄉導也其所以誘脅熟户迫逐弓箭手者其意以為東方客軍皆不足畏惟熟户弓箭手生長極邊勇悍善鬪若先事剪去則邊人失其所恃入冦之時可以通行無礙也其所以數揚虛聲驚動邊鄙者欲使中國之兵疲於奔命耗散儲畜公私貧困既而邊吏習以為常不復設備然後乘虛入冦也凡此諸事若不早為之慮使姦謀得成竊恐其為國家之患未可量也臣謂朝廷冝霄衣旰食以為深憂而但見其遣使奉貢即以為臣節未虧得其侮玩之語以為恭順得其侵謾之語以為誠實蓋朝廷非不知其夲心且欲幸其未發止求目前之暫安不顧異時之深患臣日夜思之不勝憤悒何戎狄為謀之深而中國慮事之淺也臣愚伏望陛下於邊鄙之事常留聖心特降詔書明諭中外應文武臣僚有久歷邊任或曽經戰陳知軍中利害及戎狄情偽者並許上書自言陛下勿以其人官職之踈賤及文辭之鄙惡一一略加省覽擇其理道稍長者皆賜召對從容訪問以即日治兵禦戎之䇿何得何失如何處置即得其冝若其言無可取者則罷遣而已有可取者即為施行仍記録其姓名置於左右然後選其中勇略殊衆者擢為將帥若能稱職有功則勸之以爵賞昏懦敗事則威之以刑誅加以選練士卒留精去冗申明階級之法抑揚驕惰之氣誠能如此行之不懈數年之後俟將帥得人士卒用命然後惟陛下之所欲為雖北取幽薊西收銀夏恢復漢唐之疆土亦不足為難况但守今日之封略制戎狄之侵侮豈不沛然有餘裕哉取進止論修造劄子臣伏見近日以來修造稍多只大內中自及九百餘間以至皇城諸門并四邊行廊及南薰門之類皆非朝夕之所急無不重修者役人極衆費財不少此蓋陛下纘極之𥘉禁廷之中誠有破漏不可居者陛下略命整葺理亦冝然而左右之臣便謂陛下好興土木之功遂廣有經度雖不至損壞之處亦毀拆重修務以壯麗互相誇勝外以希旨求知內以營私規利萬一陛下更因此賞之則營造之端猝無窮巳國財必竭民力必殫臣竊惟陛下新臨天下惠澤未孚於民而以好治宫室流聞四方非所以光益聖德也修造勞費不可勝數臣請且言諸州買木一事擾民甚多衙前皆厚有産業之人每遇押竹木綱散失陪填無有不破家者先帝躬履節儉宫室苑囿無有增飾故諸場材木皆有羡餘屢因赦恩放免買木以寬民力自頃修造倍多諸場材木漸就減耗有司於外州科買百端營致尚恐不足而工匠用之賤如糞土昔漢文帝惜十家之産罷露臺而不作今諸場前後所積竹木何啻十家之産陛下至仁若察其所從來得不為之愛惜乎况即今在京倉庫踈漏甚多皆以上件數處興功占使匠人物料末暇修葺致粟帛之類大有損敗古者將營宫室宗廟為先廏庫為次居室為後今之所修緩急先後無乃未得其冝乎又皇子生而冨貴年未及冠所冝示以朴素慎其所習今聞所修三位規摹侈大又復過於祖宗之時皇子所居漢明帝曰我子何得比先帝子此志非所以納之於義方也臣愚伏望陛下特降聖旨應大內裏外舍屋即目不至大假損壞之處及不至要切如南薰門之類並罷興修其皇子位只因舊屋夾截修整早令畢功不得過為宏壯且令那減匠人物料修倉庫之損壞者所有諸處監修之官自是夲職更不與減年磨勘及轉官酬奬以塞泰侈之源使天下皆知陛下去奢從儉仁民愛物不亦美乎取進止濮安懿王合行典禮議宰臣韓某等狀伏以出於天性之謂親緣於人情之謂禮雖以義制事因時適冝而親必主於恩禮不忘其本此古今不易之常道也伏惟皇帝陛下奮乾之健乘離之明擁天地神靈之休荷宗廟社稷之重即位以來仁施澤浹九族既睦万國交歡而濮安懿王德盛位隆冝有尊禮陛下受命先帝躬承聖統顧以大義後其私恩慎之重之事不輕發臣等忝備宰弼實聞國論謂當考古約禮因冝稱情使有以隆恩而廣愛庶幾上以彰孝治下以厚民風臣等伏請下有司議濮安懿王及譙國太夫人王氏襄國太夫人韓氏仙遊縣君任氏合行典禮詳處其當以時施行治平元年五月二十八日進呈奉聖旨候過仁宗皇帝大祥别取旨治平二年四月九日再進呈奉聖旨送太常禮院與兩制已上同共詳定聞奏翰林學士王圭等狀右謹具如前臣等謹案儀禮喪服為人後者傳曰何以三年也受重者必以尊服服之為所後者之祖父母妻妻之父母昆弟昆弟之子若子若子者言皆如親子也又為人後者為其父母傳曰何以期也不二斬也何以不二斬也持重於大宗者降其小宗也又為人後者為其昆弟傳曰何以大功也為人後者降其昆弟也以此觀之為人後者為之子不敢復顧私親聖人制禮尊無二上若恭愛之心分施於彼則不得專一於此故也是以秦漢以來帝王有自旁支入承大統者或推尊父母以為帝后皆見非當時取譏後丗臣等不敢引以為聖朝法况前代入繼者多宮車晏駕之後援立之䇿或出母后或出臣下非如仁宗皇帝年齡未襄深惟宗廟之重祗承天地之意於宗室衆多之中簡拔聖明授以大業陛下親為先帝之子然後繼體承祧光有天下濮安懿王雖於陛下有天性之親顧復之恩然陛下所以負扆端冕冨有四海子子孫孫萬丗相承者皆先帝之德也臣等愚淺不逹古今竊以謂今日所以崇奉濮安懿王典禮冝一凖先朝封贈期親尊屬故事髙官大國極其尊榮譙國太夫人仙逰縣君亦改封大國太夫人考之古今實為冝稱孫長卿劄子臣伏聞前環慶路經略使孫長卿加集賢院學士充河東路都轉運使長卿前在環慶不曉邊事舉措煩苛致熟户蕃部叛亡幾盡道路之人無不知之臣謂朝廷冝嚴加譴謪以警群帥不意今日更褒以寵名授以重任外廷聞之無不駭笑如此何以使群臣舉職邊鄙獲安伏望聖慈速改前命數其無狀於逺小處責降庶今後封疆之臣稍有所畏取進止第二劄子臣近言前環慶路經略使孫長卿守邊無狀冝加譴謫不當更加集賢院學士充河東路都轉運使不蒙朝廷省察臣竊見陛下近者靣諭執政以中外臣僚多不修職業令降詔書嚴加戒諭此誠致治之夲然臣愚以為言之不如行之若言而不行徒使號令玩瀆傷威毀信不若不言之為愈也長卿夲以錢穀常才驟蒙朝廷拔擢數年之中官為丞郎位為元帥智力淺薄用過其分不曉軍政不逹蕃情處事煩碎衆心不附是致熟户蕃部各思離叛受趙諒祚誘脅去者極多而長卿掩蔽欺謾不一一聞奏慶曆中元昊背誕環慶所以獨不𬒳兵者以熟戶盛壯為之藩蔽也今因長卿失於撫御散亡殆盡居官如此可謂失職而朝廷更加寵秩委之重任賞罰如此雖復曰下詔書又何益也臣愚伏望陛下黜不職之人當以長卿為始則群臣無不悚栗不令而行矣取進止北邊劄子臣聞明主謀事於始而慮患於微是以用力不勞而收功甚大竊見國家所以御戎狄之道似未盡其冝當其安靖附順之時則好與之計校末節爭競細故及其桀傲暴撗之後則又從而姑息不能誅討是使戎狄益有輕中國之心皆厭於柔服而樂為背叛近者西戎之禍生於髙冝北狄之隙起於趙滋而朝廷至今終未省寤猶以二人所為為是而以循理守分者為非是以邊鄙武臣皆鋭意生事或以開展荒棄之地十數里為功勞或以殺略老弱之虜三五人為勇敢朝廷輒稱其才能驟加擢用既而虜心忿恨遂來報復屠剪熟户鈔劫邊民所喪失者動以千計而朝廷但知驚駭增兵聚糧其致冦之人既不追究而守邊之臣亦無譴責如此而望戎狄賔服疆場無虞是猶添薪扇火而求湯之不沸也臣愚竊惟真宗皇帝親與契丹約為兄弟仁宗皇帝赦趙元昊背叛之罪册為國主嵗捐百万之財分遺二虜豈樂此而為之哉誠以屈巳之愧小愛民之仁大故也今陛下嗣巳成之業守既安之基而執事之臣數以爭桑之少忿不思灌瓜之大計使邊鄙之患紛紛不息臣竊為陛下惜之近者聞契丹之民有於界河捕魚及於白溝之南翦伐柳栽者此乃邊鄙小事何足介意而朝廷以前知雄州季中祐不能禁禦為不材别選州將以代之臣恐新將之至必以中祐為戒而以趙滋為法妄殺虜民則戰鬪之端往來無窮矣况今民力雕弊倉庫虛竭將帥乏人士卒不練夏國既有憤怨屢來侵冦禍胎巳成若又加以契丹失歡臣恐國力未易支也伏望陛下嚴戒北邊將吏若契丹不循常例小小相侵如漁船柳栽之類止可以文牒整會道理曉諭使其官司自行禁約不可輕以矢刃相加若再三曉諭不聽則聞於朝廷雖專遣使臣至其王庭與之辨論曲直亦無傷也若又不聽則莫若博求賢才增修德政俟公私冨足士馬精強然後奉辭以討之可以驅穹廬於幕北復漢唐之土宇與其爭漁柳之勝負不亦逺哉取進止溫國文正公文集卷第三十三
