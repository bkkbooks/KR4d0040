body:
  text: 律詩十感物送伯淳監汝州酒酬安之謝光兄弟見過酬王安之聞罷真率會和潞公伏日宴府園示坐客和子駿新荷司徒開府韓國冨公挽辭四首臧郎中挽歌二首和子華遊君貺園又和上元日遊南園賞梅花又和遊趙中令園又和遊吳氏園二首和子駿約遊一二園亭看花遇雨而止又即事二章上呈明日雨止復招子駿堯夫遊南園戲呈堯夫聞正叔與客過趙園歡飲戲成小詩和子華應天院行香歸過洛川寒食遊南園獨飲次前韻二首觀孫兒戲感懷陪子華燕醮聽酒半過趙令園和秉國寄子駿堯夫二留臺和伯常自郢州見寄和潞公行及白馬寺得留守相公書云名園例惜好花以俟同賞詩二章和子華喜潞公入覲歸置酒遊諸園賞牡丹陪致政開府太師留守相公致政內翰燕集輒歌盛美為三公壽皆用公字為韻景仁將歸頴昌輒為詩二十韻紀贈復用三公燕集韻酬子駿堯夫和吳朝議執中字幾聖同年謝光與景仁同年見過伏蒙留守相公賜示陪太師潞公東田宴集詩輒敢屬和效趙學士體成口號十章上獻開府太師和潞公招堯夫不至和子華招潞公暑飲再和伯常見寄再和秉國約遊石淙送堯夫知河中府二首席君從於洛城種金橘今秋始結六實以其四獻開府大師招三客以賞之留守相公賦詩以紀竒事光竊不自揆輒依髙韻繼成五章和留守相公九月八日與潞公宴趙令園有懷去年與景仁秉國遊賞和留守相公寄酒與景仁和秉國芙蓉五章安之朝議哀辭二首和堯大見寄華嚴真師以詩見貺聊成二章紀其趣尚和子華過王帥家見梅花盛開呈君實子駿兼簡堯夫和張伯常賀遷資政又書一絶戲呈又和南園真率會見贈春日思景仁神宗皇帝挽詞五首北京留守王太師挽歌詞二首感物朝看新燕飛暮聽子規啼尺蠖身藏葉神龜尾曳泥韝鷹何用掣櫪馬不當嘶自伐憎狙巧頽然憂木雞送伯淳監汝州酒惟知負米樂不覺抱關卑出處兩得意是非皆自知酬安之謝光兄弟見過平時一二日不見巳相思况復閉關久杳無攜手期清談勝妙藥髙韻敵涼颸愧乏機雲美虛承清眼知酬王安之聞罷真率會閉關寧是率辭疾似非真既處譏嘲地誰為長厚人虛舟非有意飄瓦不須嗔此過如何贖清秋宴席陳安之詩有解嘲意故以此戲之資一笑和潞公伏日宴府園示座客盛陽金氣伏華宇玉樽開真率除煩禮耆英集上才炎蒸疑逺避流景忘西頽幸忝俊逰並仍慙右席陪蒲葵參執扇氷果侑傳柸相國方留客如何務早回和子駿新荷懶不窺園久元非效仲舒新荷滿沼緑籃舁出門踈借問含煙晚能勝裛露𥘉愧無魚戲句弄翰白紛如司徒開府韓國冨公挽辭四首天祐休明祚時生俊傑臣賢科首多士宰府澤生民煥爛三台正沖融四海春欲知甄冶力試問白頭人松漠驕無信漁陽廣聚兵移書侮中國決意背齊盟直氣輕軺入英辭左袵驚虜歸烽火滅宇縣復升平大吕功名重鴻毛軒冕輕間居容愈盛暫出市皆傾溟海涵容大龍門謁見榮謙光儼在內慟哭望佳城杖屨還私第精誠在本朝愛君老不懈憂國沒方昭東閣秋牢落西芒夜寂寥只應忠亮志氣運不能消臧郎中挽歌二首積慶承前烈呈才會聖時踐楊朝有籍治行吏為師僚友皆親譽黎民每去思惜哉違丗早志業未全施素履存誠厚虛懷待物真鄉閭昔相接朋友丗彌親遺扎蠅頭細長阡馬鬛新九原那可作空復想音塵和子華遊君貺園甲第朱門久不開春風潛入發江梅今朝丞相雙車轍輾破林間水畔苔小桃似喜相君來爭發新花繼落梅更仗環溪醒殘酒沒蒿春水緑於苔大尉公引水繞園可以泛舟名曰環溪又和上元日遊南園賞梅花梅簇荒臺自可羞相君愛賞忘宵遊未言美實調羹味且薦清香泛酒甌又和遊趙中令園中舍園陪丞相遊百物恐誤勸酒不須愁春風陌上醒歸去只恐更為桃李羞又和遊吳氏園二首天氣清和無喘牛花林爛漫竹林幽臨風髙詠足為樂有勇方知笑仲由名園易主似行郵美竹髙松景自幽誰信本來天地物長為己有固無由和子駿約遊一二園亭看花遇雨而止行樂及佳時官間無所羈只知花正發不共雨為期淺草碧無際濃雲冷四垂陪遊興未盡安得不相思來詩警向云人尋載酒地雨破看花期又云感公行樂處蚤莫得相思又即事二章上呈雨不城遊半恐誤路歸逢花值柳倍依依朝來賴飲三杯酒醉卧西齋晝掩扉覺後追思氣味長歡情愁緒兩俱忘近來方得醉中趣熟寐沈沈是醉鄉明日雨止復招子駿堯夫遊南園昨朝洛北阻遊陪惆悵中橋半醉回潑火既經寒食雨解酲須撥凍醪醅詩傳曰春酒凍醪也遙思花寨交橫錦未分春心斗頓灰更與二三頭白友試擕薄具上髙臺戲呈堯夫近來朝野客無座不談禪顧我何為者逢人獨懵然羡君詩既好説佛衆誰先只恐前身是東都白樂天聞正叔與客過趙園歡飲戲成小詩吾廬寂寞類荒村但有林間鳥雀喧不似楚家多樂事笙歌拾得醉鄰園和子華應天院行香歸過洛川印節傳呼洛北還府庭無訟不妨間度橋寒色侵春服按轡晴光露曉山香穗徘徊凝廣殿花籃繁會滿通闤自知白雪髙難和忍愧誰能寄我顔寒食遊南園獨飲寒食良辰無賞心雜花爛漫柳成隂若非獨酌酬佳景一日風光直万金次前韻二首頭白惜春情更深花間獨醉競分隂泉聲醒耳自可樂不用歌拋滿袖金南園莫笑獨追尋明日未知晴與隂揮手一朝辝逆旅滿堂安用纍千金觀孫兒戲感懷我昔垂髫今白頭中間萬事水東流此心爭得還如爾戲走階前不識愁陪子華燕醮聽酒半過趙令園簮裾丞相閣林沼令君家煙曲香尋篆杯深酒過花霏微燼沈水馥郁漬榠柤愧乏相如賦陪遊託後車和秉國寄子駿堯夫二留臺一臺二妙日追遊琥珀香醪白玉甌相下不厭賢者意尚言執友欠龍頭和伯常自郢州見寄西郊去歲揖行人栁暗花濃又一春坐想髙風清入骨沉吟佳句健生神潺湲杳靄煙波古來書云郢西雨多潺湲杳靄散誕逍遙興趣新應笑洛陽車馬道緇衣未免化紅塵和潞公行及白馬寺得留守相公書云名園例惜好花以俟同賞詩二章雲漢成章湛露晞都門宴餞羽觴飛謝安不復東山去爭似阿衡得謝歸其一相國東郊迓帝師油幢交映碧參差都人共喜安輿到正是餘花可惜時其二和子華喜潞公入覲歸置酒遊諸園賞牡丹介圭成禮下中天春物雖闌色尚妍園吏望塵皆闢户肩輿回步即開筵波濤凌亂韡旁錦風雨縱橫撥底絃洛邑衣冠陪後乘尋花載酒願年年陪致政開府太師留守相公致政內翰燕集輒歌盛美為三公壽皆用公字為韻獨佐成康丗髙年有畢公神心降維嶽龜兆告非熊黃閣遵成範太常書茂功歸來保眉壽恩禮享優隆右太師東閣延髦士西都守别宮不忘如衛武難老似僖公位貌今雖逺官僚舊忝同開懷盡巵酒足以厚時風右相公眉似髙僧秀顔如童子紅忠純汲長孺髙潔夏黃公矯矯遼東鶴冥冥塞北鴻自誇新酒量豫想百分空右內翰景仁將歸頴昌輒為詩二十韻紀贈秀發西南美挺生河嶽靈雕龍蔚文采老鸖瑩儀形落筆髙時俊飛緌侍帝庭英聲軼雲漢逺勢擊滄溟苦節專憂國嘉謀每據經溫雖比圭璧直不避雷霆道勝軒裳薄神和氣體寧忠誠懷畎畝樂事寄林坰藻鑑評隨月過從德應星苦吟金出礦確論木銜釘賤子叨流輩髙風仰典刑巨川容滴水餘景借流螢久别眉俱白重來眼更青淹留弦與晦遊集醉還醒有酒須相就無歌不共聽竒花喧夕市疊鼓咽春亭揚𬒮行辭洛回車去望陘許西北有陘山見來書往還天表鴈離合浪間萍異日期同傳景仁嘗言它日與光若得在國史必同傳窮泉約互銘光與景仁約後死者當為先死者作墓銘古今難得事交分保頽齡復用三公燕集韻酬子駿堯夫官間虛室白粟飽太倉紅朝夕掃三徑往來從二公蒹葭徒倚玉燕雀豈知鴻相遇輒同醉惟愁樽酒空和吳朝議執中字幾聖同年謝光與景仁同年見過結綬東堂同發䇿白頭相值益相親却思景祐無多日共見元豐有幾人天下髙名歸廣受二公皆致仕古來交道重雷陳謝公身老才方壯落筆成章字字新伏蒙留守相公賜示陪太師潞公東田宴集詩輒敢屬和舞雩新雨浹公田水滿東溪上下天行徑乍迃𥘉見笋浮舟正好未生蓮絃收裂帛胡琴闋袖結清風楚舞妍相國火城光滿路夜歸不假玉蟾圎效趙學士體成口號十章獻開府太師都人共喜太師回比頻必切戶爭迎不得催正值土樓灘水淺大家出手挽船來東郊車馬走紅塵城外多於城裏人誰信今朝還政後過如前歲下車新歸來甫可及春殘丞相頻邀賞牡丹逺處名園多不到樽前日獻百餘盤洛陽風俗重繁華荷擔樵夫亦戴花貪看二公同宴會遊人昏黑忘還家公厨敕許釀芳樽屢喚賔朋醉後園謔浪略無名位間誰人知道太師尊過春稀復到諸園厭苦終朝鼓吹喧招得老僧江外至啜茶揮麈話松軒東田小籍選新聲歌吹胡琴色色精客少有時全不用天然水竹湛餘清首夏清和新雨晴緑莎細軟不妨行園夫遮道白何事梔子花開斑笋生矮帽長絛紫縠衫朱門深靜似重巖莫言永日渾無事種藥移花一一監八十聰明強健身況從壯歲秉鴻鈞功名冨貴古亦有無事歸來能幾人和潞公招堯夫不至東閣尊壘招共飲後房羅綺約同觀既無薊子分身術須欠車公一座歡和子華招潞公暑飲朱門近在府園東杖屨過從跬步中避暑連翩投轄宴析酲蕭灑滿襟風間來髙韻渾如鶴醉裏朱顔却變童剪燭添香歡未極但驚銅漏太匆忽再和伯常見寄誅茅宋玉宅邊人知醉冝城幾甕春細雨短蓑魚向市孤村極浦鼓迎神遍遊七澤身忘倦更賦千篇意轉新不必滄浪羡清泚嚮來纓上巳無塵再和秉國約遊石淙上國分攜十五秋未嘗偶坐捧茶甌石淙今會須如約彼此霜毛各滿頭送堯夫知河中府二首耆老承風舊絲綸錫命新展禽安屢黜原憲樂常貧執志窮通一論交表裏真但祈深自重膏澤望斯民河抱城根曲山侵地勢斜周餘古樓觀舜俗舊人家回首從遊闊裝懷牒訴譁何時重載酒同醉洛陽花席君從於洛城種金橘今秋始結六實以其四獻開府太師招三客以賞之留守相公賦詩以紀竒事光竊不揆輒依髙韻繼成五章冝春果結洛陽枝太師云此果本出袁州正遇耆明會客時更引輕舟倚蘆岸香粳鮮鱠雅相冝圎小香黃珠顆垂結成洛邑重霜時相公和氣陶群物不是寒溫變土冝君從好事不知疲種子成株凡幾時摘獻帝師三取二自嘗兩顆且隨冝物不須多且賞竒禦寒想見結庵時江南江北徒虛語盡信前書是不冝弊居橘亦自南移愛護栽培費歲時前此實成酸苦甚應由與德不相冝和留守相公九月八日與潞公宴趙令園有懷去年與景仁秉國遊賞今歲台星聚洛中甘棠前後兩隂濃英辝唱和詩千首高宴遊陪祿萬鍾木末霜繁花未落雲間字小鴈相從西湖在望親朋逺節物那堪處處逢和留守相公寄酒與景仁想對白衣初滿傾執杯未飲巳詩成懷賢孤坐悄無語不是朝來困宿酲和秉國芙蓉五章清曉霜華漫自濃獨慿愛日飬殘紅勸君秉燭須勤賞閶闔難禁一夜風地方稀見誠竒物筆界輕絲指捻紅楚蜀可憐人不賞牆根屋角數無躬平昔低顔避桃李英華今發歲云秋盛時已過渾如我醉舞狂歌插滿頭後時獨立誠難事猶賴階庭有菊叢綽約霜前弄姿態非如群木万株紅但見涉江求水際豈知緣木采霜中微紅未肯全衰歇正似􅋳顔鶴髮翁安之朝議哀辝二首埸屋推聲價朝紳仰典刑朱衣老卿列白首戀親庭舟壑一朝失泉臺万古扃音容宛在目爭免涕飄零樂易春陽暖孤髙秋氣清老惟知自適貧不問為生京兆開阡陌延陵題墓塋何如帝師筆純孝紀名卿和堯夫見寄志趣苦難合倀倀何所依逢君始相照知我信為稀忽報除書下徒瞻征蓋飛相思千里逺洛浦又春歸仁政如慈父蒲人得所依教條前後接風迹古今稀試郡才書最還朝必奮飛西臺舊班列猶望繡衣歸華嚴真師以詩見貺聊成二章紀其趣尚知足隨緣處處安一身溫飽不為難禪房窄小才容榻此外從它丗界寬素髮青眸七十餘未嘗遊學只安居旁無几杖身輕健應為心間得自如和子華過王帥家見梅花盛開呈君實子駿兼簡堯夫去年與客盡清歡今日重來立馬看猶足攜觴同醉在只愁風雨橫相干和張伯常賀遷資政不駕使車開漢關相如不棲巖穴錬金丹子微豈無開徑三人友分著垂緌五寸冠情遊之士坐飽太倉猶自愧謬躋祕殿益難安願同野老嬉堯壤長守先生首蓿盤又書一絶戲呈伯常逺自郢中回喜與愁心相繼來幸得蒹葭依玉樹愁將瓦礫報瓊瑰又和南園真率會見贈白頭難入少年埸林下相招莫笑狂緑篠影侵棊局暗黃梅花漬酒巵香任真自愧殽羞薄假寐初便枕簟涼酬應詩豪困牽帥從來懶放似嵆康春日思景仁去歲洛城中嬉遊處處同從離崿嶺北常夢潩泉東草逺春街碧花繁夕市紅臨風默惆悵想像白眉翁神宗皇帝挽詞五首決事神明速任人金石堅天機先兆朕聖度藴淵泉仁義生知性恩威獨化權乾坤無毀息長與大名傳其一聽政涉中􅉴觀書逹夜分周王忘自逸漢祖不知勤棣蕚因心友雲章落筆文它年紬石室光大繼皇墳其二至德成無象徽名避不居期門弋獵絶步輦宴遊踈錢列金釭暗兵嚴武帳虛蓬萊日晏仗猶望駕宫車其三鼇禁叨承詔金華侍執經微生輕草芥聖澤闊滄溟鹿性安林野葵心注闕庭堯雲不可望白首涕飄零其四式道清行馬靈輴下陛簾雲奔同軌集雨泣兆民瞻石闕蒼煙暝松門白露霑戴弓徒隕絶無計附龍髯其五北京留守王太師挽歌詞二首盧肇時推重終軍衆共賢如何奪標日未及棄繻年官歷清塗遍名居美事先人間有五福視履豈非全其一昔日程文士光應舉公發解中間侍坐賔遊陪慙晚輩待遇過它人方歎龍門逺俄驚馬鬛新西園行樂處引領但霑巾其二溫國文正公文集卷第十五溫國文正公文集卷第十六章奏一論兩浙不冝添置弓手狀先公知杭州代作為孫大博乞免廣南轉運判官狀論麥允言給鹵簿狀以下九道並同知太常禮院時上奉聖旨麥允言有軍功特給鹵薄今後不得為例乞印行荀子楊子法言狀與館閣諸君同上申本寺乞奏修築皇地祇壇狀皇祐三年五月上奉聖旨依式論劉平招魂葬狀奏乞移髙禖壇狀皇祐三年十二月上論張堯佐除宣徽使狀皇祐二年十二月具草未上聞堯佐罷宣徽使遂不上論夏令公諡狀皇祐四年十月十三日上論夏令公諡第二狀二十二日上奉聖旨改諡文莊論周琰事乞不坐馮浩狀請建儲副或進用宗室第一狀至和三年六月十九日上是歲仁宗違豫不臨朝者纍月國嗣未建天下寒心中外之臣勇悍不屈素以忠直自負如唐介等皆莫言惟范景仁時為諫官首建此議光聞而繼之弟一狀留中第二第三狀降付中書論兩浙不冝添置弓手狀先公知杭州代作準勑命指揮云云臣竊觀兩浙一路與他路不同臣謹條列添置弓手不便事件如左伏惟聖恩省察少加詳擇焉當今西戎梗邊三方皆聳人心易動當務安之一旦聞異常詔書大加調發擐甲執兵學習戰陳置指揮使節級等名目頗似軍法以為欲俲河北陜西沿邊鄉兵謂國家以權計點之假名捕盜漸欲收為卒伍戍守邊防吳人輕怯易惑難曉道聽塗説衆情鼎沸至欲毀體捐生竄匿山澤臣雖明加告諭嚴行止約愚民無知不可户説誠恐差點之後搖動生憂其不可一也吳越素不習兵以故常少盜賊不過聚結朋黨私販茶鹽時遇官司往往鬪敵在於兩浙最為劇賊然皆權時利合事訖則散不能久相屯結又無銛利兵器止偷啇稅不敢剽掠平人近年以來雖亦頗有強盜然比諸內地要自稀踈今避差點者若竄匿無歸必例為寇竊加以弓矢刀􅘫之類許其私置自今以後賊盜必多及私販茶鹽之徒皆有利兵抵拒吏士益難擒討積微至著漸不可長其不可二也姦吏貪叨惟喜多事今計杭州管界當差若干人他州比率大凡有幾縣胥里長於兹相慶民既憂愁而又脅之煩苦不安而又擾之所規自潤豈顧其外雖朝廷重為懲禁特倍常科長吏勞心不能悉察厚利所誘死亦冒之加以版籍差誤户口異同毫氂不當互相告決追呼無時獄訟不歇則民未暇為公上給役而先困於貪吏之誅求矣此之騷擾勢不能免其不可三也民皆生長畎畝天性敦愚所知不過播種之法所識不過耒耜之器加之吳人駑弱天下所知一旦使棄其所工學所不能恐徒煩教調終無所成就其有成不堪施用則是虛有煩費而與不添置無異其不可四也吳子壽夢以前世服於楚自申公巫臣得罪于楚逃奔于晉為晉聘吳教之乘車教之戰陳其後楚人戎車歲駕早朝晏罷奔命不息以至吳亡自是以來號稱輕狡逺則劉濞近至錢鏐其間承風倔強無數豈唯其人之跋扈亦由習俗之樂亂也幸賴祖宗之馴致陛下之敦化至德之醲淪於骨髓暴亂之風移變無迹此皆上天降祐前世所不能庶幾者也今忽無故黷玩威稜狎侮危事示以逆德弄之凶器生姧回之心啓禍患之兆臣恐似非國家之至便所以萬全而無害其不可五也方今兩浙雖水旱稍愆未至流殍閭閻無事盜賊不添縱使有之舊來吏士隨發擒討甚有餘力不假更求正恐平居興役有害無益而已臣職忝密近官備藩方不敢默然理須上列伏望陛下特令兩浙一路更不添置或以事須過防舊人太少則乞只依近降勑命量加添輔更不立指揮使等名目閲習諸事一如舊規貴得衆情大安別無生事謹具狀奏聞伏候敕旨為孫太博乞免廣南轉運判官狀右臣今月九日樞密院遞到勑牒一道差臣充廣南東路轉運判官臣昨自滑州簽判就除夲州通判未及半歲今又蒙恩授前件差遣於臣忝冒實踰涯分供命陳力豈冝復辝嚮若止臣一身﨑嶇困苦雖更逺役靡不甘心敢以微誠輕煩聖聽念臣二親垂白思戀鄉里兩任滑州去家差近迎侍朝夕往來如意甘脆供須頗為私便一日離側倚門致念况復貪榮逺從吏道其在人子何心自安况轉運判官國家近置推擇委任務在得人以臣愚踈恐難堪稱伏惟聖慈詳求幹敏授以此職令臣且充滑州通判終滿一任庶得官政無廢侍養不闕君親之際恩義兩全棄骨畢身曷云補報論麥允言給鹵簿狀以下九道並同知太常禮院時上奉聖旨麥允言有軍功特給鹵簿令後不得為例太常禮院右伏見中書劄子云云昔仲叔于奚有功於衛衛人使之繁纓以朝孔子曰惜也不如多與之邑惟器與名不可以假人夫爵位尊卑之謂名車服等威之謂器二者人主所以保畜其臣而安治其國家不可忽也今允言近習之臣非有元勳大勞過絶於人而贈以三公之官給以一品鹵簿其為繁纓不亦大乎陛下雖欲寵秩其人而適足增其罪纍也何則三公之官鼎足承君上應三台鹵簿者所以褒賞元功皆非近習之臣所當得者陛下念允言服勤左右生巳極其富貴死又以三事之禮為之送終鼓吹簘鐃烜赫道路是則揚其僣侈之罪使天下側目扼腕而疾之非所以為榮也惟陛下御仲叔于奚之傳垂意孔子之言則知名器之重不可加非其人况唐制群臣於國立大功者婚葬則給鹵簿餘不在給限伏望陛下追寢前命其麥允言更不給鹵簿母使天下之人竊敢指目以為朝廷過舉不勝幸甚謹具狀奏聞伏候勑旨皇祐二年九月十四日具官臣光等狀奏乞印行荀子楊子法言狀與綰閣諸君同上臣等伏以戰國以降百家蜂午先王之道荒塞不通獨荀卿楊雄排攘衆流張大正術使後丗學者坦知去從國家博采藝文扶翼聖化至於莊列異端醫方細伎皆命摹刻以廣其傳顧兹二書猶有所闕雖民間頗畜私本文字訛誤讀不可通誠恐賢逹之言寖成廢缺今欲乞降勑下崇文院將荀子楊子法言本精加考校訖雕板送國子監依諸書例印賣臣等愚懵不達大躰不勝區區貪陳所見申本寺乞奏修築皇地祗壇狀皇祐三年五月上奉聖旨依奏右光等謹案唐郊祀録方丘八角三成每等髙四尺七闊十六步設八陛上等陛廣八尺中等陛廣一丈下等陛廣一丈二尺今皇地祇壇四角再成面廣四丈九尺縱四丈六尺上等髙四尺五寸下等髙五尺方五丈三尺陛廣三尺五寸平漫無墄大抵卑陋不與禮典相應伏以王者父天母地天地之尊禮相亞埒今圎丘之制極為崇峻獨於方丘有所闕略未稱國家嚴恭明察之意謹具狀申聞伏乞據狀敷奏指揮下有司依唐郊祀録制度增修庶合典禮謹録狀上論劉平招魂葬狀右準樞密院批送下國子博士劉慶孫等奏狀六月二十三日進呈奉聖旨送太常禮院詳定聞奏臣等謹案延陵季子曰骨肉歸復于土魂氣無所不之是故聖人作為丘壟以藏其形作為宗廟以饗其神形之不存葬將安設今劉平沒身虜廷喪柩不返其子不忍封樹之不立哀展省之無所𣣔虛造棺椁招魂假葬朝廷下之禮官令檢詳故實臣等案晉丗袁瓌賀循等議以為非身無棺非棺無槨苟無喪而葬招幽魂氣於德為愆義於禮為不物當時詔書明有禁約今劉慶孫等所請招魂葬不可聽許所有將見贈官品定諡則乞依條例施行奏乞移髙禖壇狀皇祐三年十二月上準敕節文髙禖壇地下仰依典故增修今據濠寨張德等計料填疊修築都役右具如前竊緣見今所置髙禖壇處地勢極下若就彼填疊不惟功費甚大兼夏秋霖潦四集未免浸漬謹案北齊之制髙禖為壇於南郊傍景祐四年太常禮院修定儀注約用此制今來若於南郊壇傍一二里以來别踏行髙燥地修築上件高禖壇則功費絶少又免水患參考禮典亦無所違如允所奏云云論張堯佐除宣徽使狀皇祐二年十二月具草未上聞堯佐罷宣徽使逐不上臣聞明主勞心力以求諌和顔色而受之士猶畏懦而不敢進又況震之以威壓之以重而望忠臣之至直言之入難矣臣之不忠言之不直而天下安萬事治者未之有也臣竊見臺諌官屢以張堯佐事上言而陛下執之益堅拒之益固前日臺諌官等守閣請對陛下却而不內中外之人莫不駭愕以為異事昔漢元帝欲用馮昭儀兄野王為御史大夫既而疑曰吾恐後世謂吾私於後宫遂不用今堯佐有野王之嫌而無其才陛下不次用之數年間自散郎至宣徽使雖彼實有可稱天下之人安可家至戶曉使謂陛下不私後宫哉枊又聞之人有種瓜而甚愛之者盛夏日方中而灌之瓜不旋踵而煙敗其愛之非不勤也然灌之不以其時適所以敗之也今陛下貴用堯佐逺過其分天下己側目扼腕而疾之又復摧折忠諌以重其罪是正日中而灌瓜也臣竊為堯佐寒心而陛下獨不為之深思逺慮哉非獨如是而已前者臺諫官不得對之日隂霧冥冥跬步相失寒冰著木終日不解臣謹案洪範五行傳聽之不聰是謂不謀厥咎急厥罰常寒又案京房書謂之蒙氣此皆隂氣太盛壅蔽陽明上下否塞疑惑不決之象天意昭然有如教語行道之人皆知其異陛下資性純孝嚴恭天命容納直言深明得失此非臣之諛乃天下所共知也獨奈何以堯佐之故忽天戒而不顧棄人言而不從輕祖宗之爵祿違古今之明鑒書之簡䇿使天下之人有以議聖德之萬一或纍於光融髙大之美此臣所以日夜痛心疾首寢不能安食不能飽深為陛下重惜者也臣聞臣之事君猶子事父也豈有父獲大謗於外而子不以告且不諌哉惟陛下亟召諌臣使竭其所聞采納其言而尉安其意以厭上天之心解外廷之惑闢忠讜之路塞寵幸之門則天下歡然歌誦盛德豈有窮哉昔漢明帝作德陽殿鍾離意諌即時罷之後乃復作殿成謂群臣曰鍾離尚書在此殿不成矣然則明帝非不欲為殿也所以屈意罷之者欲全諌臣之節而開直言之端也今臺諌官前後言堯佐者數矣陛下曽不留神省察少為末減以慰其心夫人主所欲為人臣豈能強變之哉顧自今以往事復有大於堯佐者在列之臣噤默拱手視之而已矣此非朝廷之福也不然群臣猶朽木陛下猶雷霆安可以力校哉惟陛下察之而已矣論夏令公諡狀皇祐四年七月十三日上臣等伏覩故贈太師中書令夏竦以舊在東宫特賜諡文正臣聞大戴禮曰諡者行之迹也行出於已名生於人所以勸善沮惡不可私也臣等叨預禮官諡有得失職所當言不敢隱默謹案令文諸諡王公及職事官三品以上皆録行狀申省考功勘校下太常禮院擬諡訖申省議定奏聞所以重名實示至公也陛下聖德涵容如天如地哀愍舊臣恩厚無巳知竦平生不協群望不欲委之有司槩以公議且將掩覆其短推見所長故定諡於中而後宣示于外臣等謂猶冝擇中流之諡使與行實粗相應者取而賜之亦非群臣所敢議也今乃諡以文正二者諡之至美無以復加雖以周公之才不敢兼取況如竦者豈易克當所謂名與實爽諡與行違傳之永久何以為法伏以陛下睿智聰明燭見微逺如竦所為豈不素聞乃欲以恩澤之私強加美諡雖朝士大夫畏竦子孫方居美仕不敢顯言四方之人耳目炳然豈可掩蔽必曰夏竦之為如是而諡文正非以諡為公器也蓋出於天子之恩耳此其譏評國家之失豈云細哉臣等所以夙夜區區不敢避誅戮之辜怨讎之禍狂僣妄言正為此耳伏乞陛下留神幸察改賜一諡庶協中外之論以為萬世之法臣等無任懇𣢾惶懼之至謹具狀奏聞伏候勑旨論夏令公諡第二狀二十三日上奉聖旨改諡文莊右臣等近以故贈太師中書令夏竦賜諡文正輒有奏陳乞賜改更至今未奉俞旨臣等竊以凡為人臣受祿不必多居位不必髙苟當官不言則刑戮之人也是以夙夜惶懼不敢默默伏惟陛下不以鄙賤而匆其言臣等竊迹諡法夲意所謂道德博聞曰文者非聞見雜博之謂也蓋以所學所行不離於道德也靖共其位曰正者非柔懦苟偷之謂也蓋以詩云靖共爾位好是正直也今竦奢侈無度聚斂無厭內則不能制義於閨門外則不能立效於邊鄙言不副行貌不應心語其道德則貪淫矣語其正直則回邪矣此皆天下所共聞非臣等所敢誣加也陛下乃以文正諡之臣等戇愚不逹大體不知復以何諡待天下之正人良士哉且陛下所以念竦如此之厚者以竦嘗為東宮之臣故也嚮者東宮之臣死而得諡者非一陛下未嘗親有所㝎至於竦獨不然豈非知竦所為不合衆心邪陛下必以竦為正直無疑則何不委之有司付以公議然則陛下掩覆其短適所以彰之也陛下念竦不己則莫若厚撫其家至於諡者先王所以勸善沮惡非供恩澤之具也議者將以諡為虛名何害借人臣等請試言其害凡國家所以馭臣下者不過禍福榮辱而已若為善者生享其福死受其榮為不善者生遇其禍死蒙其辱天下雖𣣔不治安何可得已若有不令之臣生則盜其祿位死則盜其榮名善者不知所勸惡者不知所懼臧否顛倒不可復振此其為害可勝道哉虞書曰兢兢業業一日二日萬幾孔安國傳曰言當戒懼萬事之微夫事之方微治之易絶及其既著誰得治之況天下之人皆知竦為大邪陛下雖諡之以正此不足以掩竦之惡而適足以傷國家之至公耳且諡法所以信於後人者為其善善惡惡無私也今以一臣之故而敗之使忠良俊傑之士蒙美諡者後世皆疑之則諡法將安用哉臣等所以冒犯天威區區不已與人父子為怨者誠惜國家勸沮大法不可因循虧廢也伏惟陛下憐察少加采擇特依前奏所陳改賜竦諡天下幸甚臣等不勝惶恐待命之至謹再具狀奏聞伏候勑旨
