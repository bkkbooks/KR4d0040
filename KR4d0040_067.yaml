body:
  text: 記二傳附北京韓魏公祠堂記范景仁傳圉人傳張行婆傳貓虪傳北京韓魏公祠堂記沒而祠之禮也由漢以來牧守有惠政於民者民或為之生祠雖非先王之制皆發於人之去思亦不可廢也然年時浸逺人浸忘之惟唐狄梁公為魏州刺史屬契丹寇河北梁公省徹戰守之備撫綏雕弊之民民安而虜自退魏人祠之至今血食熙寧𥘉河北水溢地大震官寺民居蕩覆者太半詔以淮南節度使司徒兼侍中韓魏公為河北安撫使判大名府兼北京留守公既愛民如愛子治民如治家去其疾忘己之疾閔其勞忘己之勞未幾居者以安流者以還飢者以充乏者以足群心既和歲則屢豐在魏五年徙判相州魏人涕泣遮止數日乃得去魏人思公而不得見也相與立祠於熙寧禪院塑公像而事之後二年公薨于相州魏人聞之爭奔走哭祠下雲合而雷動連日乃稍息自是每嵗公生及違丗之日皆來致祠作佛事未嘗少懈噫公之德及一方功施一時者魏人固知之矣至於德及海內功施後丗者亦嘗知之乎公為宰相十年當仁宗之末英宗之𥘉朝廷多故公臨大節處危疑苟利國家知無不為若湍水之赴深壑無所疑憚或諌曰公所為如是誠善萬一蹉跌豈惟身不自保恐家無處所殆非明哲之所尚也公歎曰此何言也凡為人臣者盡力以事君死生以之顧事之是非何如耳至於成敗天也豈可豫憂其不成遂輟不為哉聞者愧服其忠勇如此故能光輔三后濟大難使中外之人餔啜嬉遊自若曽無驚視傾聽竊語之警坐置天下於太寧公之力也嗚呼公與狄梁公皆有惠政於魏故魏人祠之然其為逺近所遵慕年時雖逺而不毀非有大功於社稷為神祇所相祐能如是乎况梁公之功顯天下皆知之魏公之功隱天下或未能盡知也然則魏公不又賢乎冝其與梁公之祠並立於魏享祀無窮公薨後九年魏人以狀抵西京俾光記將刻于石竊惟梁公二碑乃李雍馮宿之文光實何人敢不自量顧魏人之美意不可抑又欲以其所未知者諗之故不敢辭時元豐七年六月丙戌涑水司馬光記范景仁傳范景仁名鎮益州華陽人少舉進士善文賦場屋師之為人和易修敕故參知政事薛簡肅公端明殿學士宋景文公皆器重之輔國子監生及貢院奏名皆第一故事殿廷唱第過三人則為奏名之首者必抗聲自陳以祈恩雖考校在下天子必擢置上列以吳春卿歐陽永叔之耿介猶不免從衆景仁獨不然左右與並立者屢趣之使自陳景仁不應至七十九人始唱名及之景仁出拜退就列訖無一言衆皆服其安恬自是始以自陳為恥舊風遂絶釋褐新安主簿到官數旬時宋宣獻公留守西京不欲使與下吏共勞辱召置國子監使教諸生秩滿又薦於朝為東監直講未幾宋景文公奏同修唐書又用參知政事王公薦召試學士院詩用彩霰字學士以沈約郊居賦雌霓連蜷讀霓為入聲謂景仁為失韻由是除館閣校勘殊不知約賦但取聲律便美非霰不可讀為平聲也當時有學者皆為景仁積鬱而景仁處之晏然不自辨為校勘四年應遷校理丞相龐公薦景仁有美才不汲汲於進取特除直祕閣未幾以起居舍人知諌院仁宗性寬仁言事者竸為激訐以采名或緣愛憎汚人以帷箔不可明之事景仁獨引大體自非關朝廷安危擊生民利病皆闊略不言陳恭公為相嬖妾張氏笞殺婢御史劾奏欲逐去之不能得乃誣之云私其女景仁上言朝廷設臺諌官使之除讒慝也審如御史所言則執中可斬如其不然御史亦可斬御史怒共劾景仁以為阿附宰相景仁不顧力為辨其不然深救當時之弊識者韙之仁宗即位三十五年未有繼嗣嘉祐初暴得疾旬日不知人中外大小之臣無不寒心而畏避嫌疑相倚仗莫敢發言景仁獨奮曰天下事尚有大於此者乎捨此不言顧惟抉擲細微以塞職是真負國吾不忍也即上言太祖捨其子而立太宗周王既薨真宗取宗室子飬之宫中陛下冝為宗廟社稷計早擇宗室賢者優其禮數試之以政與圖天下之事以系天下人心章纍上寢不報景仁因闔門家居自求誅譴執政或諭以奈何效干名希進之人景仁上執政書言繼嗣不定將有急兵鎮義當死朝廷之刑不可死亂兵之下此乃鎮擇死之時尚安暇顧干名希進之嫌而不為去就之決哉又奏稱臣竊原大臣之意恐行之而事有中變故畏避而為容身之計也萬一兵起大臣家族首領顧不可保其為身計亦巳踈矣就使事有中變而死陛下之職與其死於亂兵不猶愈乎乞陛下以臣此章示大臣使其自擇死所聞者為之服栗尋除兼侍御史知雜事景仁固辭不變乞解言職就散地執政復諭以上之不豫諸大臣亦嘗建此䇿今姦言巳入為之甚難景仁復上執政書云但當論事之是非不當問其難易况事早則濟緩則不及此聖賢所以貴機會也諸公謂今日難於前日安知它日不難於今日乎謂今日姦言巳入不可弭他日可弭乎凡見上靣陳者三奏章者十有七朝廷不能奪乃罷諌職改集賢殿修撰頃之拜知制誥遷翰林學士英宗即位中書奏請追尊濮安懿王事下兩制議以為冝稱皇伯髙官大國極其尊榮大忤執政意更下尚書省集百官議之意朝士必有迎合者既而臺諌爭上言為人後者為之子不得顧私親今陛下既為仁宗後若復推尊濮王是二統也殆非所以報仁宗之盛德衆論鼎沸執政欲緩其事乃下詔罷百官集議曰當令禮官檢詳典禮以聞景仁時判太常寺即具列為人後之禮及漢魏以來論議得失悉奏之與兩制臺諌議合執政怒召景仁詰責之日詔書云當令檢詳奈何遽列上邪景仁曰有司得詔書不敢稽留即以聞乃其職也奈何更以為罪乎會宰相遷官景仁當草制坐失於考按不合故事加侍讀學士出知陳州今上即位復召還翰林王介甫參知政事置三司條例司變更祖宗法令專以聚斂為務斥逐忠直引進姦佞景仁上疏極言其不可朝廷不報景仁時年六十三因上言即不用臣言臣無顔復居位食祿願聽臣致仕章纍上語益切直介甫大怒自草制書極口醜詆使以本官户部侍郎致仕凡所應得恩例悉不之與於是當時在位者皆自愧景仁名益重於天下介甫雖詆之深人更以為榮焉景仁既退居有園第在京師專以讀書賦詩自娛客至無貴賤皆野服見之不復報謝故人或為具召之雖權貴不拒也不召則不往見之或時乘興出遊則無逺近皆往嘗乘籃輿歸蜀與親舊樂飲賑施其貧者周覽江山窮其勝賞期年然後返年益老而視聽聰眀支體尤堅疆嗚呼嚮使景仁枉道希丗以得冨貴蒙屈辱任憂患豈有今日之樂邪則景仁所失甚少所得殊多矣詩云愷悌君子神所勞矣又曰樂只君子遐不眉壽景仁有焉客有問今丗之勇於迃叟者叟曰有范景仁者其為勇人莫之敵客曰景仁長僅五尺循循如不勝衣奚其勇叟曰何哉而所謂勇者而以瞋目裂眥髮上指冠力曵九牛氣陵三軍者為勇乎是特匹夫之勇耳勇於外者也若景仁勇於內者也自唐宣宗以來不欲聞人言立嗣萬一有言之者輒切齒疾之與倍畔無異而景仁獨唱言之十餘章不巳視身與宗族如鴻毛後人見景仁無恙而繼為之者則有矣然景仁者冒不測之淵無勇者能之乎人之情孰不畏天子與執政親愛之至隆者孰若父子執政欲尊天子之父而景仁引古義以爭之無勇者能之乎祿與位皆人所貪或老且病前無可冀猶戀戀不忍捨去况景仁身巳通顯有聲望視公相無跬步之逺以言不行年六十三即拂衣歸終身不復起無勇者能之乎凡人有所不能而人或能之無不服焉如吕獻可之先見范景仁之勇決皆余所不及也余心誠服之故作范景仁傳圉人傳汧侯有馬悍戾不可乘服以為無用將棄之野愛其疾足募有能馴之者祿以百金有圉人叩門而告曰臣能馴之汧侯使飬馬數月馬益調服步驟緩速折還左右唯人所志汧侯喜賞以百金之祿拜為圉師衆騶疾之謁於侯曰侯馬今馴矣彼何功而徒費侯金臣請代之侯逐圉人居數月馬復悍戾如故侯乃召圉人而謝曰子能使悍馬馴子去而馬復悍敢問何術也對曰臣賤夫也不知異術而唯飬馬之知夫馬太肥則陸梁太瘠則不能任重䇿之急則駭而難馴緩則不肯盡力善為圉者渴之飢之飲之秣之視其肥瘠而豐殺其菽粟緩之以盡其材急之以禁其逸鞭䇿以警其怠恩渥以馴其心使之得其冝適而不勞亦不使有遺力焉其術甚微得於心應於手已不能傳之於人人亦不能從己傳也如此故馬之材在馬馬之性在我雖悍戾何傷哉汧侯曰善圉人曰是術也豈特養馬而巳抑治國亦猶是也夫材智之士治國者之悍馬也捨之則不能以興功葉御之不以道則不獲其利而桀點不可制故明君者能用材智之士而以爵祿賞罰御之是以爵太髙則驕祿太豐則墯驕墯之臣雖有智力君不得而使也制之急則不得盡其能制之緩則不肯宣其用不任恩渥一驅之以威則愁怨而離心故明君者節其爵祿裁其緩急恩澤足以結其心威嚴足以服其志則生死貴賤之命在於君矣雖僄悍何憂哉汧侯恱位為上卿任以國政用其術推而行之汧國大治張行婆傳行婆張氏濰州昌樂人父為虎翼軍校張氏生七年繼母潛使儈者鬻之給其父云失之父哭之一目失明由是落軍籍為民儈者鬻於故尚書左丞范公家字曰菊花范氏以媵其女適泗州人三班借職全士則張氏勤謹其主家愛之與父别凡二十一年一旦遇之於范氏之門而識之遂辭范氏與父俱歸父怒繼母欲歐而逐之張氏曰兒非母不得入貴人家母乃有德於兒又何怨焉今賴天之力得復見父若兒歸而母逐兒何安焉父乃止父時年且八十無他子家甚貧鬻薪為業昌樂有故田園為人所據張氏乃與父母歸鄉里訟於州而得之未幾父卒張氏養繼母盡子道母老不能行所適稍逺則張氏負之母卒張氏嫁為里民王祐妻生一男二女祐早卒諸孤皆幼張氏鞠之不從人既長畢婚嫁乃謂其子曰吾素樂浮屠法里中有古寺廢已久吾當帥里人修之棄家處其中不復為爾母矣里人聞之爭助以財不日立堂殿廚廡塑繪佛像營儲峙皆備每戒其子母得至寺曰寺有衆人之財將以興佛事吾一毫不敢私也汝來使吾無以自明全士則之妹余嫂也元豐中張氏自濰之泗省全氏又自泗之陜省余嫂徒步數千里曰吾故時主家不可忘也嫂置諸園門之旁獨處一室日一𬞞食讀佛書每與女僕語專誨以忠勤有不受而詬之者輒拜謝不與校遇勞辱之事則以身先之與之錢刀衣服固辭強之不得巳辭多受少見尺薪寸帛不忍棄必拾以歸愛之如己物女僕之幼者則為之櫛沐紉縫視之如已女至於猴犬飲食以時無不馴服張氏去輒數日悲嗚不食余熟察其所為而異之因諭之曰嫗巳老幸有子不與之居以終其身而栖栖汲汲周逰四方何為乎張氏曰凡學佛者先應斷麥彼雖吾子久已捨之不復思也嗚呼世之服儒衣冠讀詩書以君子自名者其忠孝廉讓能如張氏者幾希豈得以其微賤而忽之邪聞其風者能無怍乎嚮使生於劉子政之前使子政得而傳之雖古列女何以尚之惜乎為浮屠所蔽不得入於禮義之塗然其處心有可重者余是敢私記之貓虪傳仁義天德也天不獨施之於人凡物之有性識者咸有之顧所賦與有厚薄耳余家有貓曰虪每與衆貓食常退處干後俟衆貓飽盡去然後進食之有復還者又退避之他貓生子多者虪輒分置其栖與己子並乳之愛視踰於已子有頑貓不知其德於已乃食虪之子虪亦不與校家人以白澤圖云畜自食其子不祥見虪在旁以為共食之痛箠而斥之以卑僧舍僧飼之不食匿竇中近旬日餓且死家人憐而返之至家然後食家人每得稚貓輒令虪母之嘗為它貓子搏犬犬噬之幾死人救獲免後老且病不復執鼠於家為長物余不忍棄常自飼之及死余命貯簏中瘞於西園時元豐七年十月甲午也自生至死近二十年昔韓文公作猶相乳説以為北平王之德感應召致及余家有虪乃知物性各於其類自有善惡韓子之説幾於諂耳嗟乎人有不知仁義貪冒爭奪病人以利己者聞虪所為得無愧哉司馬相如稱物有同類而殊能者故力稱烏獲捷言慶忌人誠有之獸亦冝然昔余通判鄆州有貓曰山賔生數月遇鼷得巨鼠方食之前與鼷鬪嚙鼷走奪鼠以歸後因汙余書余以卑都監常鼎始縶之跳擲髙數尺不可牽制乃囊盛以授之兩廨相距二里許後數日山賔復來歸余又囊以授之鼎命婢牢縶之山賔既識路即時歸繩約滿身鼎責群婢曰汝曹雖為人曽不及彼貓一心於其主余以既卑之不可復留卒囊以授之遂不復歸不知其為死為生也山賔非虪之比余獨嘉其不忘舊主故録之附干虪傳之末溫國文正公文集卷第六十七
