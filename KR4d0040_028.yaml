body:
  text: 章奏十二奉養劄子上殿劄子二道永昭陵寺劄子貢院定奪科埸不用詩賦狀乞車駕早出祈雨劄子民有犯惡逆乞不令長官自劾狀二先劄子延訪群臣第二劄子奉養劄子臣竊聞近日陛下聖體甚安奉事皇太后昏定晨省未甞廢闕非獨群臣百姓之福乃宗廟社稷之福也陛下旣爲仁宗皇帝之後皇太后即陛下之母今濮王旣沒陛下平生孝養未盡之心不施之於皇太后將何所用哉臣聞君子受人一飯之恩猶不忍負之必思報荅况皇太后有莫大之德三陛下豈可斯須忘之先帝立陛下爲嗣皇太后有居中之助一也及先帝晏駕之夜皇太后决定大䇿迎立聖明二也陛下踐阼數日而得疾不省人事中外衆心惶惑失措皇太后爲陛下攝理萬機鎭安中外以俟痊復三也有此一德者則陛下子子孫孫報之不盡况兼三徳而有之陛下所以奉養之禮若有絲毫不備四海之人其謂陛下爲如何天地鬼神其謂陛下爲如何此不可以不留聖心也今陛下巳能奉飬如禮而臣復區區進言者誠欲陛下戒之慎之始終無倦外盡其恭内盡其愛使孝德日新令聞四逹以叶天下之望保萬丗之禄而巳若萬一有無識小人以細末之事離間陛下母子不顧國家傾覆之憂而欲自營一身之利者願陛下付之有司明正其罪使天下暁然皆知陛下聖明仁孝不負大恩而䜛倿不能間也取進止上殿劄子臣累曽上言乞陛下加意奉飬躬親萬機言辤拙訥未蒙采納臣竊惟當今切務無大於此是敢不避斧鉞重有敷陳至於奉親之禮報德之義爲君之職訪善之道臣曏來文字敘述已詳不敢復煩聖聽獨以目前利害言之陛下試詳擇焉竊以皇太后母也陛下子也皇太后母儀天下巳三十年陛下新自藩邸入承大統若萬一兩宫有隙陛下以爲誰逆誰順誰得誰失又仁宗皇帝㤙德在民藏於骨髓陛下受其大業而無以報之則何以慰天下之望若陛下上失皇太后之愛下失百姓之望則雖有大寳之位將何以自安凡人主所以保國家者以有威福之柄也故民畏之如神明愛之如父母今陛下即位將近朞年而朝廷政事除拜賞罰一切委之大臣未甞詢訪事之本末察其是非有所與奪臣恐上下之人習以爲常威福之柄寖有所移則雖有四海之業將何以自固位則不安業則不固於陛下果何所利乎陛下必以爲事皇太后之禮止如是亦不失矣親萬機之務止如是亦無闕矣臣竊以爲不可臣聞陛下昔在藩邸事濮王承順顔色備盡孝道凡宫中之事濮王皆委陛下幹之無不平允陛下事皇大后當一如濮王然後可視天下之政當一如宫中之事然後可况濮王之親以恩皇太后之親以義其奉飬之謹非特有所加則無以取信也宫中之事小天下之事大其聽断之勤非特有所加則無以致治也儻奉飬極其謹聽断極其勤則陛下仁孝之名流於萬丗英叡之德逹於四表宗廟永安子孫蒙福於陛下有何所害而乆不肯爲哉凡此利害之明有如白黒取捨之易有如返掌陛下今日回意易慮猶爲未晚若固守所見終無變更臣恐日月䆮乆釁隙愈深不可復合威權巳去不可復収後雖悔之亦無及巳臣受國家累世大恩不敢愛死爲陛下極陳社禝之計肝膽所蓄盡此而巳伏望陛下少留意察之取進止又劄子臣近以私懇求郷便一州伏蒙聖恩令宰臣宣諭以臣曏所言事略皆施行令臣且在諌院供職未得求出臣以駑下之質生於盛明之丗得備諫官爲幸巳大況陛下謙恭接下容受直言此乃愚臣千載一遇畢命報國之秋豈願離去左右自棄於踈逺之地誠以父母墳墓乆不展省人子之心遑遑不安所以有此陳乞今忽奉聖旨宣諭如此臣惶恐慙懅無地自容夙夜循省進退維谷臣竊惟曏時所言欲陛下以事濮王之禮事皇太后又欲陛下延訪群臣躬親政事今陛下雖奉事皇太后加於往日猶未及事濮王之時承顔順意曲盡歡心也雖省覽庻政猶未甞訪問群臣講治亂之切務也陛下若以二者爲止當如此則兩宫之意無由和洽萬機之務無由治辨禍亂之原尚在太平之期尚逺臣雖日侍丹扆有何所益陛下若奉飬之禮日増月益訪求治道勤勞不倦使慈母歡欣於上百姓安樂於下則臣雖在逺方亦猶在陛下之側也臣聞為人子者事其親而親不恱不敢怨也退而自責曰我之愛不至歟愛至矣而猶不恱則曰我之禮不恭歟禮恭矣而猶不恱則曰我之誠不盡歟誠旣盡矣則大孝之名逹於四海通於神明神明且猶助之而况人乎臣又聞爲人君者視天下有一事不治以爲已過有一民失所以為已憂天下巳安巳治矣猶復思將來之患而䂊防之天下未甞無事也在人君思與不思而巳苟思之則治安不思則亂危陛下儻能以此二者自勉則臣安敢廢公家之急而徇私家之務乎取進止永昭陵寺劄子臣竊聞近有中旨於永昭陵側别建一寺未知信否若果如此竊恐不可何則宣祖太宗三陵共有一寺若獨於真宗仁宗各置一寺則是尊奉之禮踰於祖宗豈特於體理不順爲朝廷闕失亦是違先帝之孝心也議者或謂三陵共在一處永定永昭相去稍逺以此湏别建一寺凡臣僚之家無人守墳乃於墳側置寺㗖以微利使之守護種植而巳至於國家守衛山陵有司備具置寺之處何較近逺若云資薦求福則死生之際人不能知釋氏所言虚實難驗使亡者冥然無知則資薦之事有何所益果然有知如釋氏所言則仁宗皇帝寛慈恭儉好生惡殺恩浹四海澤被萬物豈待别置一寺更度數僧然後得生天堂樂處也且仁宗皇帝晚年詔天下無名額寺屋及百間者並特與名額計創添寺額千有餘處據此功德冝享壽考無疆之福而數月之間宫車晏駕以此驗之佛不能爲人之福豈不顯然此皆皇太后與陛下所親見也今自國喪之後支給賞賜供奉山陵帑藏空虚賦役煩多百姓罷弊京西去秋不稔春復少雨正是朝廷宵衣旰食存恤之時乃復興此無名之役不急之費誠非中外所望也若萬一有益於先帝群臣豈敢愛惜今逆禮傷孝蠧財勞人但使僧徒及監修之人因此爲名妄求恩澤以廣徼幸之路臣竊爲朝廷不取也伏望陛下與皇太后深思當今切務汲汲於冨國安民息此無益之事以副天下之望其永昭陵寺只乞依前來指揮更不别置取進止貢院定奪科埸不用詩賦狀准中書送下天章閣待制判國子監吕公著劄子臣聞以言取人固未足以盡人之才今之科埸格之以辭賦又不足以觀言國家承平日乆文物至盛學者莫不欲宗經嚮道至於浮華愽習有不得巳而爲之者先帝察取士之弊甞集近臣之論形於詔文則曰本學校以教之然後可以求其行先䇿論則辨理者得盡其說簡程式則閎博者頗見其才雖丁寜申諭而有司不能奉行竊聞昨來南省考校始專用論䇿升黜議者頗以爲當臣猶恐四方踈逺未知所尚有司各持所見則人無適從欲乞今來科埸更不用詩賦如未欲遽罷即乞令第一埸試論第二埸試䇿第三埸試詩賦每遇廷試亦以論壓詩賦爲先後升降之法庶成先帝之志永厎人文之盛臣謬司學政盍進輿言如允所奏即乞預行告示令本院定奪聞奏者當院看詳近丗取人專用詩賦其爲弊法有識共知今來吕公著欲乞科埸更不用詩賦委得允當然進士只試論䇿又似太簡欲乞今後省試除論䇿外更試周易尚書毛詩周禮儀禮春秋論語大義共十道爲一埸其䇿只問時務所有進士帖經墨義一埸從來不曽考校顯是虚設乞更不試御前除試論外更試時務䇿一道如此則舉人皆習經術不尚浮華若是依舊不罷詩賦之時即先試後試事歸一體别無損益今若罷去詩賦仍乞依吕公著起請預行告示使天下學者早得聞知乞車駕早出祈雨劄子臣伏見權御史中丞王疇等建言乞陛下循真宗故事幸諸寺觀祈雨朝廷雖從其所請而講議選日巳踰旬浹至今車駕未出衆論狐疑皆云事恐中輟臣愚竊以陛下踐位巳踰朞年京城百姓未聞屬車之音重以曏者聖體不安逺方之人妄造事端訛言未息若聞車駕一出則逺近釋然莫不恱喜況今春少雨麦田枯旱禾種未入倉廩虚竭閭里飢愁陛下爲民父母當與之同其憂勞祈禱群神豈可晏然視之不以疚懷况詔命巳降流聞四方若復遷延乆而不出則道路之人愈増猜惑不若曏時𥘉無此議也且王者以四海爲家故稱乘輿或稱行在今車駕蹔出近在京城之内亦何必拘瞽史之言選㨂時日忘萬民朝夕之急殆非成湯桑林周宣雲漢之意也臣愚伏望陛下断自聖志於一兩日之間車駕早岀爲民祈雨以副中外喁喁之望取進止民有犯惡逆乞不令長官自劾狀臣竊以國家承百王之弊俗化陵夷不肖愚民犯誼侵禮無所不至此朝廷所冝留意不可忽也昔賈誼歎秦俗之薄惡以爲借父耰鉏慮有德色母取箕帚立而誶語抱哺其子與公併倨婦姑不相說則反辱而相稽以今閭巷之民旦夕所爲如彼數者皆何足言近聞開封府屢有子殺父母者相繼事發以京邑之中猶有如此悖逆之民況於逺方教化之所不及哉臣竊見刑部格敕百姓間有犯惡逆以上者州縣長官量事貶降隱而不言委録事叅軍糾察聞奏刑统叅詳條部内有犯惡逆以上罪者今後刺史以上附表自劾以敦風教責与不責並聽敕裁朝廷近年務行寛政吏有故出人罪者率皆不問或小有失入則終身廢棄以此民有謀殺及毆詈尊長者州縣之吏專務掩蔽縦釋惟恐上聞往往止從杖罪断遣少肯處以正法蓋避自劾之耻務爲身謀遂使頑民益無顧憚名敦風教其實壞之王者之政當善善惡惡若寛此悖逆之民以爲仁政臣實愚淺未之前聞況教化之失風俗之弊任其責者豈特州縣長吏而巳若長吏隱而不言乃使録事叅軍糺察聞奏斯亦難矣臣愚伏望朝廷今後除去上件貶降長官及附表自劾二條更不施行在京則委糺察刑獄畿内則委府界提點在外則委轉運使提點刑獄常切覺察州縣官吏如有敢將惡逆不孝不睦等罪寛縱隱蔽不依正法勘鞫断遣並畫時糺舉聞奏隨其輕重各以故出人罪論若上件諸司不糺舉者委臺諌官察訪聞奏取進止二先劄子臣伏覩皇太后手書巳罷聽政陛下欽承慈旨獨断萬機臣聞易曰君子以作事謀始又曰正其始萬事理差之毫釐繆以千里陛下雖踐祚朞年於國家大政猶多所謙抑雖時有處分皆常式小事非天下所以望於陛下者也曏時外間議者皆曰陛下聖體未安倦於聽覧及知聖體巳安又曰陛下上畏皇太后之嚴欲盡人子之禮避專命之嫌韜藴聦明未敢施設今皇太后舉國家大柄盡付之陛下則議者無復可言唯拭目傾耳以瞻望聖政而巳矣陛下當此之際治身治國舉措云爲不可不慎昔楊朱見衢塗而泣謂其可以左可以右所差甚微所失甚大也人主即政之𥘉亦榮辱安危之衢塗也故臣願陛下留聖心焉臣聞治身莫先於孝治國莫先於公孔子曰孝德之本也又曰不愛其親而愛它人者謂之悖德不恭其親而恭它人者謂之悖禮未有根絶而葉茂源涸而流長者也仁宗皇帝以四海大業授之陛下其恩德之大天地不足以爲比今登遐之後骨肉至親獨有皇太后與公主數人陛下所當日夜盡心竭力供承撫飬以副仁宗皇帝之意曏者皇太后聽政之時左右侍衛之人不敢不恪求湏之物無敢不備旣委去政柄臣竊慮有無識小人隨勢傾移侍奉懈慢供給有闕則天下之責皆歸陛下此不可不留意朝夕省察者也又若有不逞之人於两宫之間刺探動静拾掇語言外如效忠内實求媚以相間者臣願陛下迎拒其辭執付有司加之顯戮誅一人則群邪自退納一言則百䜛俱進此乃禍亂之機不可不深察也臣聞國事聽於君家事聽於親臣愚以爲陛下在外朝之時刑賞黜陟之政當自以聖心决之至禁庭之内取捨賜予事無大小不若皆禀於皇太后而後行陛下與中宫勿有所專如此則内外之體正尊卑之序明慈母歡欣於上臣民頌咏於下矣不然皇太后歸政之後若侍衛之人稍有怠惰求湏之物小失供擬加以䜛邪妄興離間萬一有絲毫闕失流聞於外或皇太后憂思不樂内生疾疢則陛下何以勝此名於天下哉雖百善不能掩矣臣故曰治身莫先於孝也洪範於好惡偏黨之際六反言之重之至也周任曰爲政者不賞私勞不罰私怨大學曰欲明明德於天下者必先正其心有所忿懥則不得其正有所好樂則不得其正陛下奮發宫邸入纂皇極爰自潜躍至於天飛舊恩宿怨豈能盡無然今日即政之𥘉皆不可置於聖慮以害至正也凡人君之要道在於進賢退不肖賞善罰惡而巳爵禄者天下之爵禄非以厚人君之所喜也刑罰者天下之刑罰非以快人君之所怒也是故古者爵人於朝與士共之刑人於市與衆棄之明不敢以巳之私心蓋天下之公議也今以四海之廣百官之衆有賢有愚有善有惡比肩接迹雜遝並進臣願陛下少留聦明詳擇其間苟有才德髙茂合於人望者進之雖宿昔怨讎勿棄也有噐識庸下無𥙷於時者退之雖親暱姻婭勿取也有勵行立功爲丗所推者賞之雖意之所憎勿廢也有懷姦犯禁爲衆所疾者罰之雖意之所愛勿赦也如此則野無遺賢朝無曠官爲善者勸爲惡者懼上下恱服朝廷大治百姓蒙福社禝永安不然陛下若專居深宮自暇自逸威福之柄盡委大臣取過目前不爲逺慮賢愚不分善惡共貫不則所進者皆平生所親愛所退者皆平生所不快所賞者皆謟䛕而無功所罰者皆忠諒而無罪如此則中外解體紀綱隳紊群生失所天下可憂矣臣故曰治國莫先於公也此二先者榮辱之大本安危之至要臣願陛下審思而力行之詩云亹亹文王令聞不巳陛下誠能行此二者則盛徳羙譽滂沛洋溢近者傳誦逺者褒嘆不過旬月之間徧於天下逹於四夷後日之政如順風吹毛乗髙決水可以不勞而成功矣取進止延訪群臣第二劄子臣先曽上言乞詔侍從近臣每日輪一貟直資善堂夜則宿於崇文院以備非時宣召若有事故請假則與以次官玄換直宿以開廣聡明禆益大政至今未聞施行蓋陛下謙謹以皇太后同聽庻政未奉慈旨不敢擅召群臣與之論議今皇太后盡以四海之事歸於陛下出入起居頥旨如意臣是敢重申前說乞少加采擇凡人牆之外目不見也里之前耳不聞也而天子奄有四海一日萬機民之憂樂事之本末雖有聦明叡智之性若不問之於人何從知之是以太祖太宗雖起於側微猶日孜孜訪問群下至於小臣卒伍亦無所間絶故能紀綱四方創業垂統陛下生爲帝王子孫未甞歴試於外天下之事豈能細知況先朝置直學士待制等職以爲侍從之臣若使之不得朝夕在左右備顧問將安用之所有每夜於崇文院輪宿自是舊制近年以來因循隳廢舉而行之有何所難伏望聖慈檢㑹臣近來所奏劄子内事節特賜施行取進止温國文正公文集卷第二十八
