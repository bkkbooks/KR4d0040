body:
  text: 論二功名論機權論朋黨論三勤論管仲小器論荀息論致知在格物論葬論中和論功名論自古人臣有功者誰哉愚以為人臣未嘗有功其有功者皆君之功也何以言之夫地有草木天不雨露之則不能以生月有光華日不照望之則不能以明臣有事業君不信任之則不能以成此自然之道也古者大國不過百里小國半之然皆有賢卿大夫以輔佐其君大者以王小者以霸下者猶能保其社稷丗數十傳而不絶由是觀之天下烏有無士之國哉患在人主知之不明用之不固信之不專耳如是則人臣雖有才智而不得施雖有忠信而不敢效人主徒憂勞於上欲治而愈亂欲安而愈危欲榮而愈辱矣然則人主有賢不能知與無賢同知而不能用與不知同用而不能信與不用同不用賢而求功業之美名譽之白難矣昔百里奚虞人也由余戎人也商鞅魏人也而用於秦苗賁皇申公巫臣楚人也而用於晉伍貟楚人也而用於吳韓信陳平項羽之人也而用於漢是五國者非無賢人也主不能知而驅之以資敵國此所謂有賢不能知與無賢同也齊御名公見郭氏之虛問於野人曰郭何故亡對曰以其善善而惡惡公曰善善而惡惡國所以興也而亡何故對曰善善而不能行惡惡而不能去所以亡也公歸以告管仲管仲曰君與其人俱來乎曰否管仲曰君亦一郭氏也公乃召而官之齊景公待孔子曰若季氏則吾不能以季孟之間待之齊王欲中國而授孟子室養孟子以祿萬鍾使諸大夫國人皆有所矝式是二君者非不知孔孟之為聖賢也不能行其道而徒欲尊之以為名是以孔孟以為不義而不留也洪範曰凡厥正人既富方榖汝弗能使有好于而家時人斯其辜此所謂知賢不能用與不知同也樂毅為燕伐齊下七十餘城燕王疑之使騎劫代將田單詐騎劫而敗之盡失齊地廉頗為趙將拒秦久而不戰趙王疑之使趙括代將白起擊趙括而虜之坑其卒四十萬項羽用范增謀強霸諸侯圍漢王滎陽幾拔矣聞漢之反間而疑之范增怒去而項羽卒為漢擒夫駕車者既服騏驥矣又以駑馬參之欲其並驅而前不可得也藝田者既樹嘉榖矣又以稂莠雜之欲其並生而茂不可得也為國者既置賢才矣又以小人間之欲其並立而冶不可得也是故宓子賤為單父宰辭於君請君之近史二人與之俱至官使二史書方書輒掣其肘書不善則從而怒之二史患之辭請歸以告魯君魯君以問孔子孔子曰宓不齊君子也其才任王霸之佐屈節治單父將以自試也意者以此為諌乎公寤太息而歎曰此寡人之不肖寡人亂宓子之政而責其善者數矣微二史寡人無以知其過微夫子寡人無以自寤遽發所愛之使告宓子曰自今以往單父非吾有也從子之制有便於民者子決為之五年一言其要宓子遂得行其政而單父大治大禹謨曰任賢勿二去邪勿疑疑謀勿成百志惟熙荀子曰人主有六患使賢者為之則與不肖規之使智者慮之則與愚者論之使修士行之則與汚邪之人疑之雖欲成立得乎哉譬之是猶立直木而恐其影之枉也惑莫大焉語曰好女之色惡者之孽也公正之士衆人之痤也修乎道之人汚邪之賊也今使汚邪之人論其怨賊而求其無偏得乎哉譬之是猶立枉木而求其影之直也亂莫大焉噫人主苟不知其賢則已矣巳審知其賢授之以政而復疑之何哉凡忠直之臣行其道於國家則必與夫天下之姦邪為怨敵矣非喜與之為怨也不與之為怨則君不尊國不治功不立也以一人之身日與天下之姦邪為怨更進迭毀於君前而君不能決兼聽而兩可之如是則忠直之臣求欲無危不可得也君子非愛死而不為也知其身死而功不立姦邪愈熾忠良愈恐政治愈亂國家愈危也是以君子難進易退辭貴就賤被髮佯狂逃匿山林者以此故也此所謂用賢不能專與不用同也明主為之不然審求天下之大賢而亟用之專信之舉社稷百姓而委屬之雖有至親不能奪也雖有至貴不敢爭也雖有讒巧不能間也確然若膠漆之相合視其際而不可得見也然後賢者得竭其心而施其才不憂怨賊之口不懼猜嫌之迹人主端拱無為享其功利收其榮名而巳矣古之聖帝明王用此道而光宅四海長育萬物功如天地名若日月者多矣固不待稱引而知也請言其時近而道卑者昔齊桓公得管仲三薰而三浴之解其縲紲置以為相鮑叔桓公之傅也避太宰之位而安隨其後國子高子天子之守卿也人率五卿而聽其政令况其餘四境之內上下之人其孰敢不戰戰栗栗從桓公而貴信之是以能九合諸侯一正天下為五霸首也陳平楚之亡將也漢高祖得之使典護諸將絳灌之屬盡害之髙祖以平為護軍中尉盡監護諸將諸將乃不敢言韓信亡卒也髙祖用蕭何一言拔諸行伍之中以為大將諸將皆驚而不敢爭也是以五年之中滅項羽定天下創業垂統四百歲而不絶蜀先主與關羽張飛布衣之友周旋艱險恩若兄弟一旦得諸靄孔明待之過于關張關張不説先主曰孤之有孔明猶魚之有水願諸君勿復言是以能起于敗亡之中保有一方與魏吳為敵國符求固得王景略於處士以為丞相貴戚大臣有害之者永固輒殺之謂太子宏及長樂公丕曰汝事王公如事我也是以能東取燕西取涼南取襄陽北取拓跋奄有中原幾平海內此五臣者從今日視之皆英傑之才也嚮使四君知之不明用之不固信之不專則管仲醢於齊庭陳平窮於戶牖韓信餓於淮隂諸葛孔明老於隆中王景略死於華山名氏埋滅不可復知烏有曄曄功烈施於後丗如此哉是以大雅云徐方既同天子之功晉平公問叔向曰齊淵聖御名公之霸君之力乎臣之力乎叔向曰管仲善制割隰朋善削縫賔胥無善純緣淵聖御名公知衣而巳亦其臣之力也師矌曰管仲善斷割之隰朋善煎熬之賔胥無善齊和之羮巳熟矣奉而進之而君不食誰能強之亦其君之力也魏文侯使樂羊將而攻中山三年而拔之返而論功文侯示之謗書一篋樂羊再拜稽首曰此非臣之功主君之力也由是言之人臣不能立功凡有功者皆其君之功也機權論丗之命機權也妄故作機權論以辨之機者弩之所以發矢者也機正於此而的中於彼差之至微失之甚逺故聖人之用機也似之易曰機者動之微吉之先見者也又曰君子見幾而作不俟終日然則機者事之未著萌牙專兆之時聖人眇然見之能去禍而取福迎吉而禦凶所以為神也聖人之所慎無過機者故曰兢兢業業一日二日万機也權者銓也所以平輕重也聖人之用權也必將校輕重啇緩急彼重而此輕則舍此而取彼彼緩而此急則去彼而就此取捨去就之間不離於道乃所謂權也然則機者仁之端也權者義之平也今丗俗之為説者乃欲棄仁義而行機權不亦反哉夫不知機權則無以為聖人聖人未嘗斯須不用者機權而巳矣聖人精心審謹而後行之故百姓萬物皆賴焉小人知機權之道而誣竊其名妄行悖理所以福祿不久而禍亂及之也請問聖人機權之道曰昔紂為玉柸象箸而箕子佯狂衛靈公仰視蜚鴻而孔子行是皆知譏者也夫柸箸小器飾以珠玉未為大過而箕子知其必亡國者為其奢淫泰侈之漸由此始也仰視蜚鴻失理之細者而孔子去之者知其不能用聖而有厭怠之心不去則大禍將至也如此聖人之知機豈不偉哉伊尹放太甲微子去啇歸周周公誅管蔡是皆知權者也夫數君子豈不知放君畔宗戮親之為不善哉誠以放君之責輕而淪喪大業之禍重畔宗之譏薄而保存宗祀之孝深戮親之嫌小而傾覆周室之害大故去彼而取此也夫太甲之𥘉欲敗度縱敗禮苟非苦其身體勞其思慮則不能變惡遷善克終允德成湯之業將墜於地伊尹躬受湯命阿衡王家故不得不放諸桐宫也受為不道自絶於天微子不去與之偕亡則祖禰不祀宗族無主故不得不抱祭器而歸周也管蔡奉廢姓伐宗國違天命逆人心傾危聖輔斫喪周室成王幼弱周公攝政故不得不奮干戈揚斧鉞以治之蓋周公非自愛而愛周室故也嚮若太甲尚可諌而改則伊尹必不放君啇受苟可輔而存則微子必不畔宗管葵猶可教而治則周公必不戮親夫豈不思誠不得以已也是以太甲曰惟嗣王不惠于阿衡伊尹作書曰祗爾厥辟辟不辟忝厥祖是猶以辱先為戒未欲正言覆亡之禍委蛇其辭以感切之也王惟庸罔念聞伊尹乃言曰無越厥命以自覆是正言禍敗以聳動之也王未克變伊尹乃以王生而榮逸不知勞辱狎近小人積習至此非其性惡故曰兹乃不義習與性成營于桐宫其訓無俾世迷言積習浸久將成其性及今猶可沮詘而改此乃伊尹盡心盡力於成湯太甲之至也微子之誥曰啇其弗或亂正四方言受不可復正史必亡國已所以當出奔存湯後也父師若曰啇其淪喪我罔為臣僕言啇既亡宗族俱滅無所寄託也又曰王子弗出我乃顛躋言不可不行也此微子廣咨謀權輕重之審諦也大誥曰肆子沖人不卬自恤義爾邦君越爾多士尹氏御事言今東征非為已也豳風曰既取我子無毀我室子以喻管蔡也室以喻周家也言管蔡輕而周家重也曰子羽譙譙子尾翛翛言勤瘁也豫室翹翹風雨所漂搖豫唯音嘵嘵言三監背誕王室阽旎故我恐懼以憂之也此豈周公背公向私之志哉夫聖人之用權也如此故國家安而仁義立也後丗之人昧錙銖之利以放逐其君懷芥蒂之嫌以屠滅其親而亦自比於伊周曰吾用機權不亦誣哉此乃亂臣賊子所以滋多也朋黨論黃介夫作壞唐論五篇以為壞唐者非巢溫與閹竪乃李宗閔李德𥙿朋黨之弊也是誠得其本矣雖然介夫知其一未知其二彼盜賊之興由閹竪閹竪之橫由輔相則信然矣噫輔相樹立私黨更相排壓而不能正者又誰咎哉夫朋黨之患不專在唐自古有之以堯之明共工歡兜相薦於朝舜臣堯既流共工又放歡兜除其邪黨然後四門穆穆百工咸熙仲虺數夏之惡曰簡賢附勢實繁有徒武王數啇之惡曰朋家作仇脅權相滅是則治亂之丗未嘗無朋黨堯舜聰明故能别白善惡而德業昌明桀紂昏亂故不能區處是非而邦家覆亡由是言之興亡不在朋黨而在昏明矣洪範皇極曰無偏無陂遵王之義無有作好遵王之道無有作惡遵王之路無偏無黨王道蕩蕩無黨無偏王道平平無反無側王道正直周公戒成王曰孺子其朋孺子其朋其往無若火始𦦨𦦨厥攸灼敘弗其絶是以舜誅禹父而禹為舜佐伊尹放太甲而相之周公放蔡叔而封蔡仲公之至也夫宗閔德𥙿雖為朋黨由文宗實使之文宗嘗曰去河北賊易去朝中朋黨難殊不知群臣為朋黨誰之過也由是觀之壞唐者文宗之不明宗閔德𥙿不足專罪也三勤論揚子曰民有三勤政善而吏惡一勤也吏善而政惡二勤也政吏駢惡三勤也愚謂勤民者一未嘗有三也何則吏者民之司命吏良則民斯逸矣未有吏善而政惡者也亦未有政善而吏惡者也度吏之材而任之者君之政也形民之力而用之者吏之政也吏苟得人安有穀人不足於晝絲人不足於夜者乎故為人君者謹於擇吏而巳矣它奚足事哉管仲小器論孔子稱管仲之器小哉先儒以為管仲得君如此不勉之以主而僅止於霸此其所以為小也愚以為周天子尊而管仲勉齊淵聖御名公以王是教之篡也此管仲所恥而不為孔子顧欲其為之邪夫大人者顧時不用則巳用則必以禮樂正天下使綱紀文章粲然有萬丗之安豈直一時之功名已邪管仲相淵聖御名公霸諸侯禹迹所及冠帶所加未能使之皆率識也而偃然自以天下為莫已若也朱紘而鏤簋反坫而三歸此其器豈不小哉揚子曰大器其猶規矩凖繩乎先自治而後治人斯言得之矣荀息論晉獻公使荀息傳奚齊荀息曰臣竭其股肱之力不濟則以死繼之及里克殺奚齊荀息死之君子曰詩所謂白圭之玷尚可磨也斯言之玷不可為也荀息有焉杜元凱以為荀息有此詩人重言之義以愚觀之元凱失左氏之意多矣彼生與君言死而背之者是小人穿窬之行君子所不譏也夫立嫡以長正也獻公溺於嬖寵廢長立少荀息為國正卿君所倚信不能明白禮義以格君心之非而遽以死許之是則荀息之言玷於獻公未沒之前而不可救於巳沒之後也然則左氏之志所以貶荀息而非所以為褒也致知在格物論人之情莫不好善而惡惡慕是而羞非然善且是者蓋寡惡且非者實多何哉皆物誘之也物迫之也桀紂亦知禹湯之為聖也而所為與之反者不能勝其欲心故也盜跖亦知顔閔之為賢也而所為與之反者不能勝其利心故也不軌之民非不知穿窬探囊之可羞也而冒行之驅於飢寒故也失節之臣亦非不知反君事讎之可愧也而忍處之逼於刑禍故也况於學者豈不知仁義之美廉恥之尚哉斗升之秩錙銖之利誘於前則趨之如流水豈能安展禽之黜樂顔子之貧也動色之怒毫末之害迫於後則畏之如烈火豈能守伯夷之餓徇比干之死乎如此則何暇仁義之思廉恥之顧哉不惟不思與不顧也抑亦莫之知也譬如逐獸者不見泰山彈雀者不覺露之霑衣也所以然者物蔽之也故水誠清矣泥沙汨之則俯而不見其影燭誠眀矣舉掌翳之則咫尺不辨人眉目况冨貴之汨其智貧賤之翳其心哉惟好學君子為不然己之道誠善也是也雖茹之以藜藿如梁肉臨之以鼎鑊如茵席誠惡也非也雖位之以公相如塗泥賂之以萬金如糞壤如此則視天下之事善惡是非如數一二如辨黑白如日之出無所不照如風之入無所不通洞然四逹安有不知者哉所以然者物莫之蔽故也於是依仁以為宅遵義以為路誠意以行之正心以處之修身以帥之則天下國家何為而不治哉太學曰致知在格物格猶扞也禦也能扞禦外物然後能知至道矣鄭氏以格為來或者猶未盡古人之意乎葬論葬者藏也孝子不忍其親之暴露故斂而藏之齎送不必厚厚者有損無益古人論之詳矣今人葬不厚於古而拘於隂陽禁忌則甚焉古者雖卜宅卜日蓋先謀人事之便然後質諸蓍龜庶無後艱耳無常地與常日也今之葬書乃相山川岡畎之形勢考歲月日時之支干以為子孫貴賤貧冨壽夭賢愚皆繫焉非此地非此時不可葬也舉丗惑而信之於是喪親者往往久而不葬問之曰歲月未利也又曰未有吉地也又曰遊宦逺方未得歸也又曰貧未能辨葬具也至有終身纍丗而不葬遂棄失尸柩不知其處者嗚呼可不令人深歏愍哉人所貴於身後有子孫者為能藏其形骸也其所為乃如是曷若無子孫死於道路猶有仁者見而殣之耶先王制禮葬期逺不過七月今丗著令自王公以下皆三月而葬又禮末葬不變服食粥居倚廬哀親之未有所歸也既葬然後漸有變除今之人背禮違法未葬而除喪從宦四方食稻衣錦飲酒作樂其心安乎人之貴賤貧冨壽天繫於天賢愚繫於人固無關預於葬就使皆如葬師之言為人子者方當哀窮之際何忍不顧其親之暴露乃欲自營福利耶昔者吾諸祖之葬也家甚貧不能具棺槨自太尉公而下始有棺槨然金銀珠玉之物未嘗以錙銖入於壙中將葬太尉公族人皆曰葬者家之大事奈何不詢隂陽此必不可吾兄伯康無如之何乃曰詢於隂陽則可矣安得良葬師而詢之族人曰近村有張生者良師也數縣皆用之兄乃召張生許以錢二萬張生野夫也丗為葬師為野人葬所得不過千錢聞之大喜兄曰汝能用吾言吾俾爾葬不用吾言將求它師張師曰惟命是聽於是兄自以己意處歲月日時及壙之淺深廣狹道路所從出皆取便於事者使張生以葬書緣飾之曰大吉以示族人族人皆恱無違異者今吾兄年七十九以列卿致仕吾年六十六忝備侍從宗族之後仕者二十有三人視它人之謹用葬書未必勝吾家也前年吾妻死棺成而斂裝辦而行壙成而葬未嘗以一言詢隂陽家迄今亦無它故吾常疾隂陽家立邪説以惑衆為丗患於喪家尤甚頃為諌官嘗奏乞禁天下葬書當時執政莫以為意今著兹論庶俾後之子孫葬必以時欲知葬具之不必厚視吾祖欲知葬書之不足信視吾家元豐七年正月日具官司馬光述中和論君子從學貴於博求道貴於要道之要在治方寸之地而巳大禹謨曰人心惟危道心惟微惟精惟一允執厥中危則難安微則難明精之所以明其微也一之所以安其危也要在執中而巳中庸曰喜怒哀樂之未發謂之中發而皆中節謂之和君子之心於喜怒哀樂之未發未始不存乎中故謂之中庸庸常也以中為常也及其既發必制之以中則無不中節中節則和矣是中和一物也飬之為中發之為和故曰中者天下之大夲也和者天下之逹道也智者知此者也仁者守此者也禮者履此者也樂者樂此者也政者正其不能然者也刑者威其不從者也合而言之謂之道道者聖賢之所共用也豈惟人哉天地之所以生成萬物靡不由之故曰致中和天地位焉萬物育焉孔子曰君子無終食之間違仁造次必於是顛沛必於是故曰道不可須臾離可離非道也孔子曰中庸之為德也其至矣乎民鮮久矣又曰回也其心三月不違仁其餘則日月至焉而巳日月至焉者斯巳賢矣以是觀之能久於中庸者蓋鮮矣孔子曰智者樂仁者壽蓋言知夫中和者無入而不自得能無樂乎守夫中和者清明在躬志氣如神能無壽乎小雅曰樂只君子邦家之基樂只君子萬壽無期又曰樂只君子邦家之光樂只君子萬壽無疆蓋言君子有中和之德則邦家安榮既樂且壽也孔子曰克己復禮為仁蓋言禮者中和之法仁者中和之行故得禮斯得仁矣孔子間居曰無聲之樂志氣不違以至於氣志既起樂記曰易直子諒之心生則樂以至於不言而信不怒而威蓋言樂以中和為本以鍾鼓為末也商頌曰不競不絿不剛不柔布政優優百祿是遒蓋言政以中和為美也大雅曰惠此中國以綏四方無縱詭隨以謹無良蓋言刑以中和為貴也子曰飯𬞞食飲水曲肱而枕之樂亦在其中矣又曰回也一簞食一瓢飲不改其樂楊子曰紆朱懷金之樂也外顔氏子之樂也內蓋言聖賢內守中和雖幽隱貧賤不失其樂也劉康公曰民受天地之中以生所謂命也能者飬之以福不能者敗以取禍中庸曰有德者必得其壽蓋言君子動以中和為節至於飲食起居咸得其冝則隂陽不能病天地不能夭雖不導引服餌不失其壽也孟子曰我善養吾浩然之氣夫志氣之帥也氣體之充也志至焉氣次焉故孟子飬德以氣言之蓋能謹守中和之志不以喜怒哀樂亂其氣則志平氣順德日新矣故曰持其志無暴其氣及夫德之成也沛然不息確然不動挺然不屈故曰其為氣也至大至剛以直飬而無害不有道義以充其內能如此乎故曰配義與道無是餒也凡人為不善能欺天下之人不能欺其心雖忍而行之於其心不能無蒂芥焉然則浩然之氣不存矣故曰行有不慊於心則餒矣君子優遊從容以飬其氣雖不敢忽忘亦不正以為事欲其速成故曰必有事焉而勿正心勿忘勿助長也操之則存捨之則亡久而無怠然後自得之此其所以難言也楊子曰藏心于淵美厥靈根君子存神於內應務於外雖往來万變未嘗失其所守是以百骸治而德本植焉故曰神不外也志之所至氣必輔之君子乘之以為善小人乘之以為惡故曰氣者所適善惡之馬也君子守中和之心飬中和之氣既得其樂又得其壽夫復何求哉孔子曰狂其內能如此乎故曰配義與道無是餒也凡人為不善能欺天下之人不能欺其心雖忍而行之於其心不能無蒂芥焉然則浩然之氣不存矣故曰行有不慊於心則餒矣君子優遊從容以飬其氣雖不敢忽忘亦不正以為事欲其速成故曰必有事焉而勿正心勿忘勿助長也操之則存捨之則亡久而無怠然後自得之此其所以難言也楊子曰藏心于淵美厥靈根君子存神於內應務於外雖往來万變未嘗失其所守是以百骸治而德本植焉故曰神不外也志之所至氣必輔之君子乘之以為善小人乘之以為惡故曰氣者所適善惡之馬也君子守中和之心飬中和之氣既得其樂又得其壽夫復何求哉孔子曰狂者進取又曰吾黨之小子狂簡斐然成章如光之謂矣雖然此皆纂述聖賢之言非取諸胸臆也夫道猶的也射者莫不志於的其中否則未可知也必俟有道者乃能裁之溫國文正公文集卷第七十一
