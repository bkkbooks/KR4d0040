  text: 溫國文正公文集卷第六十九
  hash: sha256:0d5c29ea3cfca1900b4c477aab11c40286bc5db694923062b20b62ccaccf7f32
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_069-1a}
body:
  text: 贈諭訓樂詞贈書心經後贈紹鑒諭諭若訥訓訓儉示康樂詞樞密院開啓聖節道埸排當散念作語御筵送李宣徽口號慶文公八十會口號書心經後贈紹鑒余嘗聞學佛者言佛書入中國經律論三藏合五千四十八卷般若經獨居六百卷學者撮其要為心經一卷為之注者鄭預最簡而明余讀鄭注乃知佛書之要盡於空一字而巳或問楊子人有齊死生同貧冨等貴賤何如楊子曰作此者其有懼乎此經云照見五藴皆空度一切苦厄似與楊子同指然則釋老之道皆冝為憂患之用乎丗稱韓文公不喜佛常排之余觀其與孟尚書書論大顛云能以理自勝不為事物侵亂乃知文公於書無所不觀蓋嘗遍觀佛書取其精粹而排其糟粕耳不然何以知不為事物侵亂為學佛者所先耶今之學佛者自言得佛心作佛事然曽不免侵亂於事物則其人果何如哉西京僧官凡六貟曰録曰首座曰副首座左右街各有一缺則選僧之有行業者補之又缺則以次上遷逮左録而止崇德僧紹鑒既為左首座矣會足有微疾乃嘆曰吾棄家為僧固求自安逸今巳病而猶自勤於僧職豈吾本心哉即投牒自請解去時左録新物故其徒皆上之以為冝待次補鑒不聽既解去明日右録亦物故補其處者乃位於鑒下之人也其徒皆為之恨鑒處之恬然噫鑒儻不知事物之空能如是乎鄭經刻石於天寶末今頗殘缺余賢鑒能不以所重易所輕且欲勸之俾全其所得乃命吏好寫一通以贈之元豐五年十二月甲寅涑水迃叟書諭若訥熙寧六年冬光在洛有衢州僧若訥袖書來見曰仁宗皇帝時若訥得召對化成殿命講所學經且作頌三篇上甚喜後數日中使賜若訥紫衣若訥辭曰臣所為不逺千里求見明主者欲獻其所學庶幾廣之於天下今陛下乃賜臣紫衣非臣志也臣不敢奉詔使者三返終辭不受上飛白安淨二字以賜若訥然後手加額受而藏之若訥野僧也生江湖間一旦萬乘之主召入禁中面訪所學授以二字蓋師號之類也天下僧受師號者何可勝紀有能親屈帝筆如若訥之光榮者乎若訥是以不敢忘先帝不資之恩思有以報之嚮聚吾師所述之經五千餘卷合為一藏命曰報恩經藏遍請朝廷輔佐之臣撰文書石瑑而立之今又將刻所賜二字于石以傳于後子為我序其事而記之光謝曰光儒者素不習釋氏書將何以發明上人之學與受賜之由且文辭鄙陋何敢輒寓名諸公之末自陷不知量之罪乎若訥固請不巳曰若訥去冬巳嘗犯寒至洛值子西適秦不克見而返今兹復來非有它求欲得記文而巳若訥豈不知朝廷貴人及四方之士能文者甚衆欲為斯記者亦不鮮若訥皆不願得而唯子之求何子拒我之深乎光甚愧其言因諭之曰上人之志於光勤且厚如此光敢無辭以為復抑仁宗皇帝既嘉上人不受命服賜以二字豈師號之謂邪蓋以褒勸上人之德也上人亦嘗思其指乎夫安淨德之美者也既曰安矣則於物冝無求既曰淨矣則物不得而間之是故安如磐石雖加減萬鈞不為之低昂淨如清水有一毫入之則纍矣上人既能知先帝之大恩當謹守聖言而力行之以無負先帝之所期乃所以報也經藏奚為哉况光之文又足求邪訓儉示康吾夲寒家丗以清白相承吾性不喜華靡自為乳兒長者加以金銀華美之服輒羞赧棄去之二十忝科名聞喜宴獨不戴花同年曰君賜不可違也乃簮一花平生衣取蔽寒食取充腹亦不敢服垢弊以矯俗千名但順吾性而巳衆人皆以奢靡為榮吾心獨以儉素為美人皆嗤吾固陋吾不以為病應之曰孔子稱與其不遜也寧固又曰以約失之鮮矣又曰士志於道而恥惡衣惡食者未足與議也古人以儉為美德今人乃以儉相詬病嘻異哉近嵗風俗尤為侈靡走卒類士服農夫躡絲履吾記天聖中先公為群牧判官客至未嘗不置酒或三行五行多不過七行酒酤於市果止於梨栗棗柿之類肴止於脯醢菜羮器用瓷􅃮當時士大夫家皆然人不相非也會數而禮勤物薄而情厚近日士大夫家酒非內法果肴非逺方珍異食非多品器皿非滿按不敢會賔友常數月營聚然後敢發書苟或不然人爭非之以為鄙吝故不隨俗靡者蓋鮮矣嗟乎風俗頽弊如是居位者雖不能禁忍助之乎又聞昔李文靖公為相治居第於封丘門內聽事前僅容旅馬或言其太隘公笑曰居第當傳子孫此為宰相聽事誠隘為太祝奉禮聽事巳寬矣參政魯公為諌官真宗遣使急召之得於酒家既入問其所來以實對曰卿為清望官奈何飲於酒肆對曰臣家貧客至無器皿肴果故就酒家觴之上以無隱益重之張文節為相自奉養如為河陽掌書記時所親或規之曰公今受俸不少而自奉若此公雖自信清約外人頗有公孫布𬒳之譏公冝少從衆公歎曰吾今日之俸雖舉家錦衣玉食何患不能顧人之常情由儉入奢易由奢入儉難吾今日之俸豈能常存一旦異於今日家人習奢巳久不能頓儉必致失所豈若吾居位去位身存身亡常如一日乎嗚呼大賢之深謀逺慮豈庸人所及哉御孫曰儉德之共也侈惡之大也共同也言有德者皆由儉來也夫儉則寡欲君子寡欲則不役於物可以直道而行小人寡欲則能謹身節用逺罪豐家故曰儉德之共也侈則多欲君子多欲則貪慕冨貴枉道速禍小人多欲則多求妄用敗家喪身是以居官必賄居鄉必盜故曰侈惡之大也昔正考父饘鬻以糊口孟僖子知其後必有逹人季文子相三君妾不衣帛馬不食粟君子以為忠管仲鏤簋朱絃山楶藻梲孔子鄙其小器公叔文子享衛靈公史鰌知其及禍及戍果以冨得罪出亡何曽日食萬錢至孫以驕溢傾家石崇以奢靡誇人卒以此死東市近丗寇萊公豪侈冠一時然以功業大人莫之非子孫習其家風今多窮困其餘以儉立名以侈自敗者多矣不可遍數聊舉數人以訓汝汝非徒身當服行當以訓汝子孫使知前輩之風俗云樞密院三月十三日於大相國寺開啓聖節道場錫慶院排當第一盞散念紫電流樞元聖誕應於丕運妙花雨地輔臣祗奉於仁祠慿不垢之勝因佑無疆之遐算仍修髙會共洽多娛冝盡從容式昭慈惠第二盞散念夔龍滿坐集緌紳花雨仍添一日春欲識華胥何處在只應近與醉鄉憐作語德水澄瀾上聖應期而降誕崇丘儲粹大賢名丗以挺生蓋精神之會昌若符契之相合必資同德用砥太寧恭惟尊號皇帝陛下容覆如天照臨若日躋群生於冨壽之域納庶俗於仁讓之塗雷雨弗迷魚鱉咸若伏惟某官某官丕宣忠力克壯逺猷管樞機而均四時撫韜鈐而制八狄屬呈祥於里社冀徼福於香城大啓梵筵同祈睿算玉毫珠髻既瞻仰於慈雲寶案金觴仍涵濡於湛露肴羞交錯笙磬駢羅仁澤醲於惠風喜色饒於淑氣某謬參樂吏獲對台廷不揆蕪才敢獻口號華渚流星表聖期宗工齋祓𣢾仁祠異花散漫承嚴供妙樂從容奉宴嬉印紱相鮮金錯落佩鐶交映王葳㽔乾坤長久南山固此地年年捧羽巵句曲八音繁會七律鈞諧上恱台顔把色合曲御筵送李宣徽昭亮知真定府口號胸奴舊畏李將軍今日重來幾代孫旗尾飄揚山燒裂馬蹄騰踏塞塵昏胡兒稽顙朝南闕天子垂衣御北門幕府事間刁斗靜碧潭佳景日開樽作語天文垂象貴將陪扈於太微地險流形常山控臨於大漠矧聖神之御辨懷荒憬以嚮風秋塵無驚夜户不閉眷是股肱之郡委於心膂之臣某官武節兼人雄規絶衆元戎十乘董鋭士以啓行清酒百壷命賢王而出餞榮生道路威動塞垣駐大斾於近郊留朱輪於清籞某叩居樂部幸對台光不揆蕪才敢獻口號秋風蕭瑟引華旌祖宴髙張出斗城玉饌芳菲羅百品鐵衣照耀擁千兵驪歌未闋長楊苑騎吹先臨細柳營雨露醲恩何以報沙埸不惜樹功名慶文公八十會口號仙才聞三王之盛未有遺年五福之先莫如享壽恭惟開府太師才為人傑位極帝師黑頭強仕之時巳登廊廟黃髮老成之日還賞林泉贊熙洽於三朝保康寧於八十太公望口餘兩齒猶釣渭濵田千秋身乘小車尚腰相印何曽則始為太宰石鑒則甫拜司空平津之談論多聞方叔之謀猷克壯獨兼具美度越前修留守相公鎮撫都畿典司宫鑰遇唐虞之無事喜稷卨之得朋大啓華筵益祈遐算提舉端明惜盛事之難值慕賢者之所為親邀相車就宴甲第跪斟芳醑仰祝椿齡仙才不揆荒蕪敢獻口號元勳茂德古無倫海內髙間第一人台席巳酬調鼎志磻溪還作釣魚身師臣首冠三旌貴歲曆行開九帙新願過期頤躋上壽飛觴四十有餘春溫國文正公文集第六十九
