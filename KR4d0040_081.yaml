body:
  text: 嘉慶己未十月五日庚寅竹汀居士錢大昕假觀時年七十有二嘉慶丁巳夏有杭州書友以宋刻温國文正司馬公文集介郡城學餘堂書肆示余余取與案頭所貯抄本相對其標題司馬太師温國文正公傳家集已與此不合而序文節去首尾并誤劉嶠為劉隨不知其何本也至于年號官銜㮣從闕畧俾考古者茫無依據是可慨已是刻序文一一完善次列進司馬温公文集表一篇分卷序次離合先後多有不同偶取校勘雖文義未甚齟齬而一字一句摠覺舊刻之妙愛不忍釋矣問其直索白金一百六十兩余以價昂一時又無其資還之既而思此書為明初人收藏本卷首表文弟一葉末餘𥿄有硃書一行云洪武丁巳秋八月收八字有小方印一其文云徐逹左印有大方印一其文云松雲道人徐良夫臧書卷第八十後空葉有墨書三行云國初吴儒徐松雲先生収藏温公集八十卷缺九卷雍謹鈔𥙷以爲完書云弘治乙丑秋九月望日石湖盧雍謹記則此書本爲吴中藏書不知何時轉入武林而今又重歸合浦此一竒也且松雲収藏在洪武丁巳而此書之来又在嘉慶丁巳其間甲子屢更顯晦亦復幾易此竒之又竒也今雖不能即得或者遲之又乆必俟諸秋八月収以符前賢之轍邪閱月有五學餘主人来云此書出君家徧示郡中藏書者雖皆識爲宋刻然所還之價有不及無過者曷於前四十之數而益其半乎余重是書之刻在宋爲最初本兼重以徐盧二公之手澤使大弓寳玉有歸魯之日未始非前賢實呵䕶之故不惜重資購得得之日適在秋八月何巧乃尔爰誌顛末以示後之讀是書者見竒書之出造物若有以使之然而聚散既有其地顯晦又有其時豈不異哉讀未見書齋主人黄丕烈識嘉慶已未冬十一月既望装此書成夫然而快然大慊于心也盖余自丁巳八月至今即付装潢幾閱二載餘費且倍扵得價然其書若有待扵余之装潢而始完善者是書之幸實余之幸也初書装十四冊破爛特甚買淂後驅蠧魚至數百計且缺葉及無字處每冊俱有乃命工𥙷綴其缺葉皆誤重于他葉之腹其無字者皆漿黏于前後葉之背始悟當時俗工所為以致不可卒讀苟非精加装潢則全者缺之有者無之不幾使此書多遺憾耶用著原委以見古書難得即装潢亦當煞費苦心也至此本為宋最初之刻錢竹汀謂全曰宋王深寜撰困學紀聞載温公集字句多與此刻合知深寕所見即是本也世行本以傳家集為最古今見此紹興初刻題曰温國文正司馬公文集則傳家之名非其最初及觀周香嚴所藏舊抄本亦為卷八十而標題則曰司馬太師温國文正公傳家集卷末有泉州公使庫印書局淳熈拾年正月内印造到云云又有嘉定甲申金華應謙之并有門生文林郎差充武岡軍軍學教授陳冠两跋皆云公裔孫出泉本重刋是傳家又重刋本矣
