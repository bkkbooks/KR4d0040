body:
  text: 章奏四逺謀重微務實論舉選狀論張叔詹知蔡州狀十二等分職任差遣劄子乞省覽制䇿劄子逺謀易曰君子以思患而豫防之書曰逺乃猷詩曰猷之未逺是用大諌昔聖人之教民也使之方暑則備寒方寒則備暑七月之詩是也觀夫市井禆取之人猶知旱則資舟水則資車夏則儲裘褐冬則儲絺綌彼偷安苟生之徒朝醉飽而暮飢寒者雖與之俱為編户貧冨必不侔矣况為天下國家者豈可不制治於未亂保邦於未危乎詩云逮天之未隂雨徹彼桑土綢繆牖户今女下民或敢侮子孔子曰為此詩者其知道乎能治其國家誰敢侮之逮天之未隂雨者國家間暇無有災害之時也徹彼桑土者求賢於隱微也綢繆牖户者修敕其政治也夫桑土者鴟梟所以固其室也賢俊者明主所以固其國也國既固矣雖有侮之者庸何傷哉臣竊見國家每邊境有急羽書相銜或一方饑饉餓莩盈野則廟堂之上焦心勞思忘寢廢食以憂之當是之時未嘗不以將帥之不選士卒之不練牧守之不良倉廩之不實追責前人以其備禦之無素也幸而烽燧息五榖登則明主舉萬壽之觴於上群公百官歌太平縱娛樂於下晏然自以為長無可憂之事矣嗚呼使自今日以往四夷不復犯邊水旱不復為災則可矣若猶未也則天幸安可數恃哉陛下何不試以間暇之時思不幸邊鄙有警饑饉荐臻則將帥可任者為誰牧守可守者為誰雖在千里之外使之常如目前至於甲兵之利鈍金榖之盈虛皆不可不前知而豫謀也若待事至而後求之則已晚矣夫四夷水旱事之細者也抑又有大於是者陛下亦嘗留少頃之慮手詩云維彼聖人瞻言百里維此愚人覆狂以喜此言逺謀之難知近言之易行也夫謀逺則似迃迃則人皆忽之其為害至慘也而無切身之急為利至大也而無旦夕之驗則愚者抵掌謂之迃也冝矣國家之制百官莫得久於其位求其功也速責其過也備是故或養交飾譽以待遷或容身免過以待去上自公卿下及斗食自非憂公忘私之人大抵多懷苟且之計莫肯為十年之規况萬世之慮乎自非陛下惕然逺覽勤而思之日復一日長此不巳豈國家之利哉此臣日夜所以痛心泣血而憂也昔賈誼當漢文帝之時以為天下方病大瘇又苦􅏓盩又類辟且病痱陛下視方今國家安固公私冨實百姓樂業孰與漢文然則天下之病無乃更甚乎失今不治必為痼疾陛下雖欲治之將無及己治之之術非有它竒巧也在察其病之緩急擇其藥之良苦隨而攻之勿責目前之近功期於万世治安而已矣重微虞書曰兢兢業業一日二日万幾何謂万幾幾之為言微也言當戒懼万事之微也夫水之微也捧土可塞及其盛也漂木石沒丘陵火之微也勺水可滅及其盛也焦都邑燔山林故治之於微則用力寡而功多治之於盛則用力多而功寡是故聖帝明王皆銷惡於未萌弭禍於未形天下隂𬒳其澤而莫知所以然也周易坤之𥘉六曰履霜堅氷至霜者寒之始也氷者寒之極也坤之𥘉六於律為林鍾於曆為建未之月陽氣方盛而隂氣已萌物未之知也是故聖人謹之曰履霜堅氷至言為人君者當絶惡於未形杜禍於未成也繫辝曰知幾其神乎君子知微知彰知柔知剛万夫之望謂此道也孔子謂魯哀公曰昧爽夙興正其衣冠平旦視朝慮其危難一物失理亂亡之端君以此思憂則憂可知矣太宗皇帝命昭宣使河州團練使王繼恩討蜀平之宰相請除繼恩宣徽使太宗不許曰宣徽使位亞兩府若使繼恩為之是官官執政之漸也宰相固請以繼恩功大它官不足以賞之太宗怒切責宰相特置宣政使以授之真宗皇帝欲與章穆皇后及後宫遊內庫后辝曰婦人之性見珍寶財貨不能無求夫府庫者國家所以養六軍備非常也今耗散之於婦人非所以重社稷也真宗深以為然遂止由是觀之先帝以睿明卓越防微杜漸如此之深可不念哉昔扁鵲見齊淵聖御名侯曰君有疾在腠理不治將深淵聖御名侯不恱曰醫之好利也欲以不疾者為功及在血脈在腸胃淵聖御名侯皆不信及在骨髓扁鵲望之遂逃去徐福言霍氏太盛冝以時抑制漢宣帝不從及霍氏誅人為之訟其功以為曲突徙薪無恩澤焦頭爛額為上客故未然之言常見弃忽及其已然又無所及夫宴安怠墯肇荒淫之基竒巧珍玩發奢泰之端甘言悲辭啓僥幸之塗附耳屏語開讒賊之門不惜名器導僣逼之源假借威福授陵奪之柄凡此六者其初甚微朝夕狎玩未睹其害日滋月益遂至深固比知而革之則用力百倍矣伏惟陛下思萬幾之至重覽大易之明戒誦孔子之格言繼先帝之聖志使扁鵲得早從事毋使徐福有曲突之歎則可以修之於廟堂而德冒四海治之於今日而福流萬世優游逍遙而光烈顯大豈不美哉豈不美哉務實周書曰若作梓材既勤朴斫惟其塗丹雘此言為國家者必先實而後文也夫安國家利百姓仁之實也保基緒傳子孫孝之實也辨貴賤立綱紀禮之實也和上下親逺邇樂之實也决是非明好惡政之實也詰姦邪禁暴亂刑之實也察言行試政事求賢之實也量材能課功狀審官之實也詢安危訪治亂納諌之實也選勇果習戰鬪治兵之實也實之不存雖文之盛美無益也臣竊見方今逺方窮民轉死溝壑而屢赦有罪循門散錢其於仁也不亦逺乎本根不固有識寒心而道宫佛廟修廣御容其於孝也不亦逺乎統紀不明名器紊亂而雕繢文物修飾容貌其於禮也不亦逺乎群心乖戾元元愁苦而斷竹數黍敲叩古器其於樂也不亦逺乎是非錯繆賢不肖混殽而鉤校薄書訪尋比例其於政也不亦逺乎姦暴不誅冤結不理而拘泥微文糾摘細過其於刑也不亦逺乎行能之士沉淪草野而考校文辝指抉聲病其於求賢不亦逺乎材任相違職業廢弛而撿勘出身比類資序其於審官不亦逺乎久大之謀弃而不省淺近之言應時施行其於諌也不亦逺乎將帥不良士卒不精而廣聚虛數徒取外觀其於治兵不亦逺乎凡此十者皆文具而實亡本失而末在譬猶膠板為舟摶土為楫敗布為帆朽索為維畫以丹青衣以文繡使偶人駕之而履其上以之居平陸則煥然信可觀矣若以之涉江河犯風濤豈不危哉伏望陛下撥去浮文悉敦本實選任良吏以子惠庶民深謀逺慮以保安宗廟張布綱紀使下無覦心和厚風俗使人無離怨別白是非使万事得正誅鋤姦惡使威令必行取有益罷無用使野無遺賢進有功退不職使朝無曠官察讜言考得失使謀無不盡擇智將練勇士使征無不服如是則國家安若泰山而四維之也又何必以文采之飾歌頌之聲眩耀愚俗之耳目哉論舉選狀右臣竊以取士之道當以德行為先其次經術其次政事其次藝能近丗以來專尚文辭夫文辭者乃藝能之一端耳未足以盡天下之士也國家雖設賢良方正等科其實皆取文辭而已近以祫享赦節文應天下士人有素敦節行兼通學術久為鄉里所推者委轉運使提點刑獄同加搜訪每路各三兩人仍與本處長吏連署結罪保舉聞奏所舉之人朝廷命本州敦遣至則館於太學待遇甚厚考試之際不糊名謄録既而署等𥙷官皆過所望此誠合先王取士之道臣謂國家將除積久之弊立太平之基天下士大夫皆靡然嚮風矣行之未幾忽聞朝廷一切罷之無不悵然失望臣誠戇愚不識所謂若以所舉之人多非實有材行則當治舉將之罪别加搜訪豈可以一二人謬濫廢天下之舉賢是由因溺而廢天下之舟因噎而廢天下之食也且人之毀譽或出愛憎雖復聖賢不能自免孔子曰衆好之必察焉衆惡之必察焉恐國家亦未可以此遙斷否臧遽行黜陟也就使其人平昔所行誠有虧缺古之人或舉於漁鹽或舉於盜賊豈可不容其改行自新而終身弃之乎且人之行能迭有短長若不弃瑕録用而以一節廢之則失之多矣臣愚以為天子撫有四海海內之士不可一一身察之也必資舉者然後能盡天下之才既用舉者之言授之爵祿苟不嚴為禁約以防其私則請託欺罔無不至矣竊以孝者士之尊行廉者吏之首務故漢丗舉士皆用孝廉行之最久得人為多臣欲乞應天下知州府軍監任內聽舉孝廉一人大藩聽舉二人轉運使提點刑獄任內聽舉三人並須到任及一年以上方得奏舉夫鄉舉里選雖為古法今之為吏者不得久於其任士之素行或不能盡知若本部無人可舉即聽舉别部之人素所知者以充其數其在京兩制以上聽歲舉一人其舉狀逐時送下貢院置簿收掌每遇科埸詔下即委貢院選擇其日以前舉主最多者取三十人申奏降指揮下本貫敦遣赴闕若舉主數同者即以發狀先後為次謂君俱有三人舉主則取第三狀日月有前者仍於進士奏名額內减三十人候到闕日或陛下臨軒親試或委中書門下試經義䇿一道時務䇿一道但以義理優長為上不取文辭華美若所對經義乖戾聖意及時務全不通曉方行黜落其及第授官並與進士第一甲同在明經之上仍於告身前列坐舉主姓名其所舉之人若犯私罪情理重及正入已贓未及第者舉主減三等巳及第者減一等坐之並不以赦原其公罪及私罪情理輕者舉主不坐其未舉以前若曽犯罪除公案見在證驗明白外舉主亦不坐即因勢要屬請求舉及為人屬請并受屬請而舉之者並科違制之罪受贓者並以枉法論即敦遣不至者更不就除官若纍經敦遣不至即乞朝廷臨時裁度特加聘召不為定制又國家置明經一科少有應者及諸科所試大義有司不以定去留蓋由始者立格太髙致舉人合格者少臣欲乞今後明經所試墨義止問正文不問注疏其所試大義不以明經諸科但能具注疏本意說解稍詳者為通雖不失本意而講解踈略者為粗餘並為不若能先具注疏本意次引諸家雜說更以己意裁定援據該贍義理髙逺雖文辭質直皆為優等與折二通若不能記注疏本意但以己見穿鑿不合正道雖文辭辨給亦降為不其明經以六通諸科以四通以上為合格若合格人少即并取粗多者合格人多即減去通少者委試官臨時相度令合元額又舊制明經以周易尚書為小經今欲乞以周易尚書毛詩為一科三禮為一科春秋三傳為一科皆習孝經論語為帖經又說書一科議者多以為不當廢欲乞與明經並置但每次科埸止取十人奏名在諸科額內試中受官並與諸科同若自以本科及第或出身者更不得就試說書如此則求賢之路廣請託之源絶浮僞之風息得人之頌興矣謹具狀奏聞伏候勑旨論張叔詹知蔡州狀八月下旬上尋改知衛州叔詹遂乞致仕朝廷許之右臣竊見前知壽州張叔詹因本路監司奏以本州水災叔詹非才乞别差人尋移知蔡州伏緣壽蔡之民皆陛下赤子叔詹若為政無狀於民有害移彼置此有何所殊况蔡州封部闊逺户口繁庶土饒山林素多盜賊地望之重過於壽州牧守之任尤須擇人豈有因不才彼斥更得善處若叔詹實有才能惠及於民則當治本路監司罔上誣賢之罪使叔詹仍居舊任不復移易今臧否不分進退無據衆口籍籍皆云未允臣前上言為治之要在於擇人賞罰此亦擇人不精賞罰不當之一事也况叔詹資性庸下老而益昏夲無片長授任過分其為忝冒人盡知之使之從政所至為害伏乞朝廷直令致仕或授以冗散之職勿使親民庶幾黜陟明白無損政體謹具狀奏聞伏候勑旨十二等分職任差遣劄子臣竊以國家張官置吏任事久則能否著能否著則黜陟明黜陟明則職業修職業修則萬事理此古今致治之要術也今朝廷明知任官不久之弊然不能變更者其患有二一者仕進資塗等級太繁若不踐歷無由擢用二者歲月叙遷有增無減貟少人多無地可處此所以熟視日久而無如之何者也臣嘗不自知其愚賤私為陛下慮之竊以今之所謂官者古之爵也所謂差遣者古之官也官以任能爵以疇功今官爵渾殽品秩紊亂名實不副貟數濫溢是以官吏愈多而萬事益廢欲治而清之莫若於舊官九品之外别分職任差遣為十二等之制以進退群臣謹具條列如左一十二等之制宰相第一兩府第二兩制以上第三三司副使知雜御史第四三司判官轉運使第五提點刑獄第六知州第七通判第八知縣第九幕職第十令録第十一判司簿尉第十二其餘文武職任差遣並以此比類為十二等若上等有闕則於次等之中擇才以𥙷之一十二等之中舊無貟數者並乞以即今人數為定貟自今有闕則𥙷不可更增一十二等之人德行學術政事勇略錢榖刑獄文辭各隨才授任其提點刑獄以上皆無罷滿之期知州知縣縣令四年餘皆三年為滿未滿之間稱職有功則改官益祿賞賜獎諭仍居舊任必須上等有闕然後選擇遷𥙷其不能稱職者則移易黜廢有罪者貶竄刑誅一同等之人雖名有尊卑事有間劇地有逺近治有小大遇遷𥙷之時不復以資任相壓皆合為一等選擇進用一提點刑獄以上伏乞陛下與執政大臣親加詳擇其知州以下委之審官院幕職以下委之流內銓遇上等有闕即於次等之中取職業修舉功利及民纍經褒賞或有舉主數多者次取常調少過者以次遷𥙷一應磨勘合改京官又且依常調差遣須候上等有闕即取有功或舉主最多者以次遷𥙷其自幕職入知縣者並改京官一因資䕃得京官者分監當為三等𥘉任皆入下等監當候中等上等有闕亦依簿尉令録之制取有功或舉主多者以次遷𥙷若知縣有闕則與幕職混同遷𥙷但不改官而已仍自今後以資䕃授官者須歷薄尉不得直除京官一應因貪虐不公或昏懦廢職坐除免停替之人永不得復舊等差遣內别無入已贓曽經叙理得差遣或降充監當者五年之外有舉主五人以上聽復舊等差遣右十二等之制伏望裁擇或有可采乞下公卿大臣詳議然後施行取進止乞省覽制䇿劄子臣竊以國家本置六科蓋欲以上觀朝政之得失下知元元之疾苦非為士人設此以為進取之階也臣昨差覆考應制舉人所試䇿竊見上等三人所陳國家大體社稷至計其間甚有可采擇者伏望陛下取正夲留之禁中常置左右數加省覽以為警戒其副本下之中書令擇其所言合於當今之務者奏而行之使四方之人皆知朝廷求直言之士非以飾虛名乃取其實用也及臣前所獻五規雖智識暗淺辭語鄙陋然皆臣夙夜盡志竭誠以思治丗之要道非指陳一事之得失於有司無所施行亦望陛下以視朝之隙時取觀之庶幾於聖政或有萬分之益取進止溫國文正公文集卷第十九
