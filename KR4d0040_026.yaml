body:
  text: 章奏十一論御藥寄資劄子乞令皇子伴讀提舉左右人劄子祔廟議上兩宮疏夏國入弔劄子論進賀表恩澤劄子上殿劄子二道醫官劄子西路旱劄子九月十三日上尋下兩路轉運司趙滋劄子福寧殿前尼女劄子九月二十九日上尋撤去遣奠劄子後殿起居劄子皇地祇劄子虞祭劄子論御藥寄資劄子臣伏見祖宗以來擇內臣謹信者句當御藥院以其職任最為親近恐名位寖崇歲久則權勢太重不可制御故常用供奉官以下為之轉至內殿崇班則出為外官此乃祖宗深思逺慮防微杜漸髙出前古詒謀萬丗者也近歲以來頗隳舊法居此任者往往暗理官資請其俸給久而不去殊失祖宗之意深為不便今兹踐阼之𥘉所冝革去積弊率由舊章竊聞勾當御藥院劉保信等四人亦曽自陳乞因覃恩别授外官伏望皇太后殿下皇帝陛下各依逐人所請及應自來內臣暗理官資者並除正官授以外任别擇供奉官以下素知心腹忠信謹慤之人使勾當御藥院仍自今後凡轉官至內殿崇班以上者並須出外一遵祖宗之制不得暗理官資依舊留任內廷差遣取進止乞令皇子伴讀提舉左右人劄子臣伏見陛下差直史館王陶充皇子伴讀祕閣校理孫思恭充本位說書此誠國家之首務聖哲之逺圖然臣聞三代令王置師傅保以教其子又置三少與之燕居至於左右前後侍御僕從之人皆選孝悌端良之士逐去邪人母得在側使之日見正事聞正言然後道明而德成心諭而體安福𬒳兆民功流萬丗此教之所以為益也今陶等雖為皇子官屬若不日日得見或見而遽退語言不洽志意不通未嘗與之論經術之精微辨人情之邪正究義理之是非考行己之得失教者止於供職學者止於備禮而左右前後侍御僕從或有佞邪讒巧之人雜處其間出入起居朝夕相近誘之以非禮導之以不義納之以諂諛濟之以詐僞雖皇子資性聰明端慤難移然親近易習積久易遷諂諛易入詐僞易惑如此則雖有碩儒端士為之師傅終無益也臣聞孟子曰雖有天下易生之物一日暴之十日寒之未有能生者也吾見亦罕矣吾退而寒之者至矣又曰一齊人傅之衆楚人咻之雖日撻而求其齊也不可得矣臣愚伏望陛下多置皇子官屬博選天下有學行之士以充之使每日在皇子位與皇子居處燕游講論道義聳善抑惡輔成懿德其左右前後侍御僕從亦皆選小心端慤之人使所屬官司結罪保明然後得入仍專委伴讀官提舉覺察若有佞邪讒巧之人誘導皇子為非禮之事者委伴讀官糾舉施行即時斥逐不今在側若皇子自有過失再三規誨不從者亦聽以聞如此則必進德修業日就月將善人益親邪人益踈誠天下之幸也大理評事趙彥若孝友溫良謹潔正固博聞強記難進易退國子監直講李實好學有文修身慎行祕閣校理孟恂清純愷悌始終如一此臣之所知也伏望陛下擇此三人及廣求其比以備皇子官屬臣推心盡忠不敢形迹僣越妄言伏俟譴謫取進止祔廟議禮天子七廟三昭三穆與太祖之廟而七太祖之廟萬丗不毀其餘昭穆盡則毀之示有終也自漢以來天子或起於布衣以受命之𥘉太祖尚在三昭三穆之次故或祀四丗或祀六丗其太祖以上之主雖屬尊於太祖親盡則遷故漢元帝之丗太上廟主瘞於寢園魏明帝之丗處士廟主遷於園邑晉武帝祔廟遷征西府君惠帝祔廟又遷豫章府君自是以下大扺過六丗則遷其神主蓋以太祖未正東嚮之位則止祀三昭三穆若太祖巳正東嚮之位則并三昭三穆為七丗矣唐髙祖𥘉立祀四丗太宗增祀六丗及太宗祔廟則遷洪農府君神主於夾室髙宗祔廟又遷宣皇神主於夾室皆祀六丗此前代之成法也惟明皇立九室祀八丗事不經見難可依據今若以太祖太宗為一丗則大行皇帝祔廟之日僖祖親盡當遷於西夾室祀三昭三穆於先王典禮及近丗之制無不符合太廟更不須添展一室上兩宫疏月日具官臣光昧死再拜上疏皇太后殿下皇帝陛下臣聞天地交謂之泰天地不交謂之否天地者上下之象也施諸人事君仁而臣忠父慈而子孝兄愛而弟恭皆泰也君不仁臣不忠父不慈子不孝兄不愛弟不恭皆否也泰則上下之情通內外之志和國以之治家以之安否則上下之情塞內外之志乖國以之亂家以之危治亂安危之分不在於它在於審察否泰之端而已矣書曰立愛惟親立恭惟長始于家邦終于四海自古明王治天下之道未有不自孝慈始者也恭惟先帝屬籍之親凡數百人獨以天下之業傳於聖明皇太后承顧命之際鎮撫中外决定大業其恩德隆厚踰於天地何可勝言皇帝至性蒸蒸哀以執喪共以致養夙夜憂勞以成疾疹其於慈孝之美可謂至矣然臣猶竊有所懼不可不過慮於萬一先事而進言者臣聞金隄千里潰於蟻壤白璧之瑕易離難合況社稷之重非特金隄也骨肉之親非特白璧也在於守之至謹執之至固完美無間然後福祿無疆也夫姦邪之人專窺主意苟有釁隙則因乘之於是離間人君臣交犯御名人父子使之上下相疾內外相疑巳然後得奮其詐謀以盜其大權私其重利自古以來喪國敗家未有不由此者也今雖睿聖在上朝廷清明中外之臣咸懷忠良然禍福之原其來甚微舉措聽納不可不慎臣愚竊惟今日之事皇帝非皇太后無以君天下皇太后非皇帝無以安天下兩宫相恃猶頭目之與心腹也皇帝聖體平寧之時奉事皇太后承順顔色宜無不如禮若藥石未效而定省溫清有不能周備者亦皇太后所冝容也孔子曰孝哉閔子騫人不間於其父母昆弟之言蓋言誠信純至表裏著明而它人不能間也孟子曰父子責善賊恩之大者也蓋言骨肉至親止當以恩意相厚不當較錙銖之是非也臣愚伏望皇帝常思孔子之言皇太后無忘孟子之戒萬一姦人欲有閞說涉於離間者當立行誅戮以明示天下使咸知讒佞之徒不能欺惑聖明也方今天地鬼神群臣百姓鳥獸草木皆恃兩宫以為安若兩宫歡欣於上則天地鬼神得以歆其禋祀鳥獸草木得以遂其生息况群臣百姓孰不保首領以樂太平之化哉臣狂瞽妄言不識忌諱惟知徇國不為身謀不勝區區迫切之誠臣光昧死再拜上疏夏國入弔劄子臣伏聞夏國所遣使人前日不肯門見固求入對朝廷不許勒歸館舍臣愚竊以陛下繼統之𥘉四夷之人皆欲奉望天表窺覘聖德又聞嚮曽不安意謂未能視朝所以犬羊之心敢爾桀黠今若深閉固拒不聽入見則必疑有所隱避益足使之驕慢况即日陛下巳御正殿臣謂何惜紫庭數步之地使之稽首拜伏瞻仰清光庶幾得識陛下神武之姿知必能鎮服四海歸至其國轉相告語使其蜂蟻之衆心服氣沮不敢窺邊此所謂上兵伐謀不待戰而屈敵者也取進止論進賀表恩澤劄子臣竊見諸路轉連使提點刑獄知州軍等名遣親屬進奉賀登極表至京師朝廷不問官職髙下親屬逺近一例推恩乃至班行幕職權知州軍或所遣之人不係親屬者亦除齊郎及差使殿侍此蓋國初承五代姑息藩鎮之弊故有此例後來人主嗣位之初大臣因循故事不能革正然以理推之國家爵祿本待賢才及有功效之人今使此等無故受官誠為大濫况近日官吏繁冗十倍於國初之時朝廷深知其弊所以數年前别定條制減省諸色奏䕃之數若進表之人皆得一官則又併增數百入仕之人嚮來減省奏䕃悉為虛設今縱不能盡罷此等恩澤其進表人若係五服內親者或乞等第授一官其五服外親及不係親屬者並量賜金帛罷去庶幾少救濫官之失取進止上殿劄子二道臣聞臯陶贊於舜曰元首明哉股肱良哉庶事康哉蓋言人君明則百官得其人百官得其人則衆事無不美也又曰元首叢脞哉股肱惰哉萬事隳哉蓋言人君細碎無大略則群臣不盡力群臣不盡力則万事皆廢壞也此二者治亂之至要也荀子曰明主好要暗主好詳主好要則百事詳主好詳則百事荒故為人君者自有職事固不當詳察細務也然則人君之職謂何臣愚以為量材而授官一也度功而加賞二也審罪而行罰三也材有長短故官有能否功有髙下故賞有厚薄罪有小大故罰有輕重此三者人君所當用心其餘皆不足言也臣伏見國家舊制百司細事如三司鞭一胥史開封府𥙷一廂鎮之類往往皆須奏聞崇政殿所引公事有軍人武藝國馬芻秣之類皆一一躬親閲視此蓋國𥘉艱難權時之制施於今日頗傷煩碎陛下龍興撫運聖政惟新臣愚以為冝令中書樞密院檢詳中外百司自來公事須申奏取旨及後殿所引公事其間不繫大體非人君所宜身親者悉從簡省委之有司陛下養性安身以專念人君之三職足以法天地之易簡致虞舜之無為誠天下幸甚取進止第二道臣聞王言惟作命不言臣下罔攸禀令陛下以明德令望龍飛受命四海之內延頸傾耳渴聞聖政自踐阼以來於今五月而陛下深執謙巽端拱淵默群臣奏事一無可否中外之情深為鬱邑嚮者猶謂聖體未安今御殿聽政巳遵舊式出入起居皆復常度而獨於萬機未加裁决臣竊惑之詩曰弗躬弗親庶民弗信弗問弗仕勿罔君子臣愚伏望陛下凡兩府及群臣奏事稍留神省察詢訪利害議論是非可則行之否則却之使四方翕然瞻仰聖德億兆群生不勝幸甚取進止醫官劄子臣伏見舊醫官宋安道等四人昨以侍先帝醫藥無狀降授諸州散官尋以陛下聖體不安大臣憂恐權留安道等診候御脉今巳百有餘日陛下聖體終未平復安道等方術無驗較然可知而其人皆得罪於先帝臣謂陛下不冝赦其罪戾留在京師並乞發遣令赴貶所僧志緣本不曉醫但以妖妄惑人於江淮之間稱是診人六脉能知災福今亦出入禁庭叨忝章服察其療疾實無所益伏乞奪去紫衣放歸本州凡用醫之道在謹擇其人而專任之然後良工得盡其術而功效可見今聞診御脉者常以十數工拙相雜是非混殽發言進藥更相倚仗前跋後疐左瞻右顧雖有俞扁之術將安所施於是彊者自專弱者附㑹雷同比周共為誣罔不顧聖體但為身謀俱云脉氣平知藏府無疾然而旁側衆人竊觀形證豈得為安寧復舊如醫官所言哉日月益深根柢益固四海憂畏焦心墜膽臣愚伏望陛下思一身之安危繫群生之禍福深自重惜不可因循博訪京邑四方通醫術者精擇一人使之專診御脉聽用其言服食其藥若旬日之間全無應效則斥去不用别更擇人如此必遇良醫痊復有日臣不勝區區伏望聖慈少加采察天下幸甚取進止西路旱劄子九月十三日上尋下兩路轉運司臣竊聞京西陜西兩路自夏末以來殊少雨澤秋田豐稔者所收不過五分枯旱之處所得尤薄而官司或務為聚斂民有訴旱者不肯受接道塗嗷嗷頗多怨讟巳有流移就食它方者况此兩路昨來供應山陵百姓最為勞苦朝廷尤冝優恤伏望特降詔旨下兩路體量應有災傷之處倍加存撫寬其租稅敢有抑塞旱狀不為收接者嚴加譴責庶使困窮之民有所赴訴取進止趙滋劄子臣纍曽上言趙滋剛愎狂妄不可管軍及守邊必將敗事近聞朝廷益加寵任令再知雄州臣愚瞽之言誠無足采然竊聞嚮時本路都轉運使唐介安撫使彭思永皆曽言滋罪狀今朝廷使之再任彼三人者必不肯同心協力以利公家但更相違戾窺伺得失雖容貌語言外相包容其中心豈能坦然全無猜惡是朝廷激之使交鬪也若監司將帥玄相猜惡而欲使之安下民扞外敵臣竊以為難矣伏望朝廷念河北一路繫國家安危察滋所為皆夸誕不實授滋别路一間慢差遣使上下之情各獲自安不唯邊境保無他慮亦滋一身之福也取進止福寧殿前尼女劄子九月二十九日上尋撤去臣竊見大行皇帝梓宫在福寧殿自啓菆以來每日裝飾尼女置於殿前傳以粉黛衣之綺繍狀如俳優又類戲劇臣不知其說果何謂也群臣見者無不駭異或歎其失禮或默有譏誚黷嫚威神莫甚於此殆非所以禆助喪容觀示萬方伏望聖慈速令撤去孔子曰葬之以禮此孝之大也臣願陛下因此特降聖旨下有司應將來靈駕進發以至襄事凡儀仗送終之物有鄙俚無稽不合典禮如此類者悉冝刪去無使四方之人有所觀笑取進止遣奠劄子臣聞禮為人後者為之子也孔子曰人未有自致者也必也親喪乎又曰喪事不敢不勉故天子即位之初天下所以瞻仰而歸心者唯在執喪盡禮而已矣恭惟仁宗皇帝舉天下而授之陛下明睿獨斷人莫之間父母能生陛下不能使陛下貴為天子冨有四海至於萬丗子孫永饗天祿皆仁宗皇帝之厚德不可忘也今靈駕發引逺就山陵天長地久永無還期痛毒惻怛無甚於此伏望陛下至日若聖體稍安行禮之際威儀容止動加矝愼劈踊哭泣過於哀毀以竭孝思之至報罔極之恩結四海之心聳萬民之望盛德本基盡在於是不可以不嚴畏也此雖聖明所自知然臣區區尚欲以塵露之微助山海之大庶幾萬一或有所益焉取進止後殿起居劄子臣竊見國家從來以垂拱崇政為便殿乘與每旦先御垂拱退御崇政是以侍從近臣巳於垂拱起居者非有職事奏對更不復至崇政近歲以來乘輿間日一御垂拱有司不詳事體夲末遂令學士待制及兩省官只赴垂拱不赴崇政起居近以山陵未畢乘輿不御垂拱將近旬月學士以下遂廢起居之禮豈有名為侍從近臣而動踰旬月不得瞻望黼扆臣恐朝廷之儀由此相承寖益訛謬欲乞今後應乘輿不御前殿並令學士待制及兩省官赴後殿起居或以為太煩即令兩日一次起居取進止皇地祇劄子臣伏見今月十九日以大行皇帝諡號奏告天地宗廟社稷皇地祇止於圎亡望告臣聞王者父天母地其尊一也是故孝經曰事父孝故事天明事母孝故事地察今社稷之祀位為上公猶特遣官奏告而皇地祇寓於南郊下同腏食失尊卑之敘乖重輕之義考諸名體竊所未安欲乞今後凡祭告皇地祇並遣兩府官一貟詣北郊行事庶合禮意取進止虞祭劄子臣聞禮既葬而虞虞安也柩既藏矣孝子不忍一日離其親恐精神倣徨無所依歸故祭以安之也然則虞者孝子之事主人當親其禮非臣下所得攝也臣竊見今月三日虞祭百官皆入就位而哭而陛下不親其禮使宗正卿攝事臣竊惑之伏以永昭陵距京師猶五頓木主還未至之時不可一日不虞故使群臣攝事今木主巳逹京師近在內殿而有司不根禮意尚如塗中使群臣行事於親踈之序有所不稱於哀恭之情有所未盡臣恐聞見之人不知有司之失而歸責於陛下今未至卒哭尚有三虞欲望自來日以後陛下親行其禮取進止第二劄子臣昨日上言虞祭者孝子之事非臣下所得攝乞陛下親行其禮陛下不以臣言為輕以為得禮巳降聖旨依臣所奏今日禮儀既具百辟在庭而陛下不出復使宗正卿攝事在列之臣無不愕然自失且昨日有司不為陛下設親祭之禮猶可謂之有司之失若今日之事則咎將誰歸此皆由臣蠢愚以彰陛下之過臣之罪重惟陛下裁之臣聞易曰不逺復無祇悔元吉孔子曰過而不改是謂過矣伏望陛下來日雖聖體小有不康亦當勉彊親行其禮以解中外之惑取進止溫國文正公文集卷第二十六
