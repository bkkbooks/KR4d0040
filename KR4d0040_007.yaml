  text: 溫國文正公文集卷第七律詩二
  hash: sha256:03d72d543c7ee2bdc31503e490540f05c7fffed1ba82bde2f287fecb780da61f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_007-1a}
body:
  text: 興宗許菊久之未得得菊并詩送史館唐祠部詢字彥猷江南西路轉運使送張寺丞覲知冨順監寄題李舍人偉蒲中新齊贈太子太傅康靖李公挽歌詞二首送二同年北使右吕濟叔右李公素昌言有詠石髮許三章模寫精措殆難復加僕雖未覩兹物而巳若識之久者輒復強為三詩以繼其後非敢庶幾差肩適足為前詩之輿臺耳校理楊休石送沈寺丞紳知南昌縣字公儀酬不疑雪中書懷見寄校理邵必答師道對雪見寄直講陳沫送王校理懌字公和守琅瑘沂公兄子為公後哭尚頴字公楚故侍讀學士張公哀辭二首錢子髙挽歌二首題楊中正供奉洗心堂崇勳之孫送龔章判官之衛州新及策送王瓘同年河南府司録字文玉先君嘗為此官送王彥臣同年通判毫州字伯逢正月二十四日夜雪和道粹檢討王純臣雪夜直宿和次道大慶殿上元迎駕送茹屯田孝標知無為軍田橫墓偃師西登平陸北山回瞰陜城奉寄李八丈學士使君二十二韻貟村坂其東八政水即古之傅巖有傅說廟又東北虞城古虞公之國也太行石昌言學士宰中牟日為詩見寄久未之答今冬罷武城慕來京師此詩謝之楊休昌言元督詩債戲呈絶句靜夜春送導江李主簿君俞送峽州陳廉祕丞三首武成致齊奉酬吳冲卿寺丞太學宿直見寄二首雪中尋友人不遇河邊晚望早春寄東郡舊同僚邊將三首漁父早春又山中早春贈學仙者留别友生二月六日𥘉見待漏房前柳色微緑欣然成詠垂柳間居中秋陪張龍圖宴射堂𥘉夕隂雲酒行頓解喜而成詠貽宋四行簡迪自嘲醉雪寒取酒虞部劉貟外約遊金明光以賤事失期劉惠詩見嘲以詩四首謝之宗孟孫器之奉使淮浙至江為書見寄以詩謝之五首和國子夏主簿李花有章送聶之美攝尉韋城送吳辨叔大名司户送楊太祝忱知長洲縣和邵興宗秋夜學舍宿直和吳冲卿病中偶書呈諸同舍光時亦卧疾月下小飲又絶句馬病入塞喜孫器之來自共城送韓太祝縝知錢塘和聶之美鴈又和諷克送王太祀豫知伊闕慶曆七年祝南郊禮畢賀赦送張太博肅知嶽州和之美河西列岫亭書事釣魚有感又田家和人葦花送趙書記衆之官華州又寄題陟屺寺寄鄭縣史令千之前君為白馬尉廨舍前即南浦今西溪封內勝地也送華亭沈主簿閏正月十五日夜監直對月懷諸同舍二首歸鴈憶龐之道送鄭推官戡赴邠州興宗約遊㑹靈久不闈問以詩趣之清明日與興宗飲趙道士東軒上巳日與太學諸同舍飲王都尉園寄題洪州慈濟師西軒山頭春色三月十五日宿魏雲夫山莊又七言留别逢吉陜城桃李零落巳盡硤石山中今方盛開馬上口占自澠至洛循谷水行百餘里送不疑知常州送聶之美任雞澤令送張袐牧知分寧獻臣父館宿遇雨懷諸同舍送韓直講鐸字子文鄆州寧親宣徽使河東經略使鄭文肅公挽歌二首又代孫撿討瑜字叔禮作二首送丁祕羽字公佐知雍丘苦雨酬師道雪夜見寄代叔禮作使北詩又擊毬送許先輩泰符尉宗城送趙殿丞象字子與歸成都祀明堂禮畢子與新升朝以恩官其父大理評事賜告歸寧得其除書以俱二三同舍為詩以紀其美僕得回字送張都官肅字子莊江南東路提刑得前字興宗許菊久之未得菊栽許送定如何庭下不堪秋草多九日無花更無酒便攜藜杖直相過得菊并詩黃花小墢和煙斸野興蕭蕭巳相逐同來更得詩句兼久立看詩忘栽菊送史館唐祠部詢字彥猷江南西路轉運使豪桀爭唐鹿江南號冨彊明時雖混一餘俗尚雕傷稅版誅求急詞曹牒訴忙皇心愍頽弊使節付才良貪吏先投紱姦民盡越鄉閭閻無插筆田畝有捿糧漢閣歸期闊隋河去驛長風髙片帆疾鉦鼓入秋光送張寺丞覲知富順監漢家五尺道置吏撫南夷欲使文翁教兼令孟獲知盤羞蒟醬實歌雜竹枝辭取酒須勤醉鄉關不可思寄題李舍人偉蒲中新齊隴上家聲勇氣殊邊亭卧鼓欲安居非同王翦私求宅更似甘寧晚好書劒倚寒窗風淅瀝門無雜客栁蕭踈蒲州風土平生愛為問旁鄰地有餘贈太子太傳康靖李公挽歌詞二首黃髮今雕喪蒼生欲奈何散金才極樂曵杖巳成歌十郡餘恩在三臺故吏多位崇仍有後五福更為多鹵簿去悠悠西郊亂葉秋旐翻寒日薄笳咽斷雲愁吊客門飛鶴佳城山卧牛靈車今不返洧水日東流葬新鄭送二同年使北華纓下王除天子寵胸奴雖復夷風陋猶知漢使殊夜烽沉不舉秋柝寂無虞何必燕然刻蒼生肝腦塗右吕濟叔雲愁雪欲零四牡出郊坰古塞煙華紫寒沙日氣靑金門祕雞樹朱節耀龍庭幾夜天街北遙占漢使星右李公素昌言有詠石髮詩三章模寫精楷殆難復加僕雖未賭兹物而巳若識之久者輒復強為三詩以繼其後非敢庶幾差肩適足為歬詩之輿臺耳校理石楊休萬古風濤浸石巖老苔垂足細䰐鬖傳聞海砥珠無數何事從來散不簪金闕銀城仙客居欲傳消息問麻姑蓬萊無物堪為信剪寄蒼龍一握鬚琅菜來從若木邊西王母傳有碧海之琅菜非膏非沐緑冤延玉盤委積羞嘉客不是陶家無饌錢送沈寺丞紳知南昌縣字公儀長江湛湛帶楓林古木寒雲縣寺深老吏不能容狡獪細民無復有冤侵洪崖丹井聞猶在徐孺衡門說可尋寧復淹留如寶劒更令牛斗氣沉沉酬不疑雪中書懷見寄校理邵必直道免三黜敢云羞小官盤飱紅粟澀衣桁黑貂寒書府容身易侯門曲意難荆扉盈尺雪有客問袁安答師道對雪見寄直講陳洙隂風一夕驚曉雪滿都城氣覆千家白光連萬象清戀空飛不下弄態舞相縈歷亂看無定飄颻轉未成綴垣時缺剝壓竹乍欹傾細隙過無滯寒窗拂有聲園林勻結練觀閣巧雕瓊草木情先喜乾坤意亦榮營魂頓踈健病目暫虛明郢曲髙誰和羞將叩缶并送王校理懌字公和守琅琊沂公兄子為公後金門倦鳴玉千騎出東方封略依滄海枌榆近故鄉秦碑苔蝕字鄅稻日翻芒國吏遙應識當年丞相郎哭尚頴字公楚操業五常備艱難六極全仲尼難語命禆竈不知天弱女飄何許遺文散莫傳官輕史不録後丗孰稱賢故侍讀學士張公哀辭二首喜愠與榮枯居之悉晏如稍間多執筆至老不拋書常愧無能極曽霑清論餘秋風郭門外雨泣望喪車凶夢歌洹水妖巢集戴鵀未嘗餘俸祿無以具衣衾袁渙分倉榖翁歸賜府金他年純固傳寧使令名沉朝廷以公清貧贈賵有加錢子髙挽歌二首煒燁傳家學連翩射策榮走丸過省閣破竹取公卿埋玉嗟何早為山惜未成空令澤官友相顧淚縱橫同年致祭者二十二人象設如平昔升堂不見君尚疑言笑在忽念死生分清論千秋雪浮榮一片雲泉臺多少路何處復修文題楊中王供奉洗心堂崇勳之孫閥閲盛山西朱門揚㦸衣雅知名教樂深笑宴遊非一室琴書隘三年園圃稀異時論事業肯復讓輕肥送龔章判官之衛州新及第几硯昔年遊於今成十秋松堅終發石魚變即辭流近郡無飛檄清時不借籌淇園春竹美軍宴日椎牛送王灌同年河南府司録字文正先君嘗為此官綵服昔為兒隨親宦洛師至今餘夢想常記舊逰嬉佐史頭應白書樓樹巳欹聞君行有日使我淚交頥送王彥臣同年通判亳州字伯逢先朝御六飛親謁瀨鄉祠牛酒當時惠衣冠此日思仙蹤丹有竈天瑞檜生枝聖主憐耆舊題輿得吏師正月二十四日夜雪疊瓦浮輕雪參差粉畫難苦欺初變柳故壓未生蘭夜色微分白春容不受寒即為花卉奪猶得暫供看和道粹撿討王純臣雪夜直宿天祿凝嚴近紫臺書幃夜對雪華開層樓直倚寒空出清漏逺從深殿來薄夢不成氷柱折曉光先到玉花摧兔園終是諸侯事虛費相如能賦才和次道大慶殿上元迎駕鳯律年華到尚新九重氣象巳成春曉雲低拂羽林仗宿雨先清紫陌塵玉殿鳴鞘傳警蹕彤庭委珮集簮紳闕歬無復魚龍戲自有歡謡億萬人送茹屯田孝標知無為軍疊鼓鳴鐃迎候新軍牙孑孑倚淮津聊應衣繍過鄉曲不作引章驚故人荻迸短芽淝水暖荷浮圎葉漅湖春使君此去榮多少猶是當年書劒身田橫墓􅢰師西昔時南靣並稱孤今日還為絳灌徒忍死秖能添屈辱偷生不足愛須臾一朝從殉傾群客千古生風激懦夫直使強顔臣漢帝韓彭未必兔同誅登平陸比山回瞰陜城奉寄李八丈學士使君二十二韻漢家二千石體望向來尊况復嚴徐客從前益稷孫公侯貴不絶禮樂器常存符竹臨分陜聲光應列藩親闈先契重三司同僚子舍近交敦滑州同幕柏壟依仁域棠隂接故園懷歸聊露請豫告辱推恩荷祋煩疆候停車下郡門帷牆紛大館騶騎屈朱􅙲不以黎苗待還將臭味論森羅牢禮重滅裂俗儀煩霜霽威嚴息春生笑語溫草微侵碧甃塵不染華軒日影搖雲棟風㾗過玉樽落塵歌逈出激楚褎雙翻雅戲象交局珍肴熊薦蹯河梁俄首路汾曲訪吹塤舉手辭雙㦸騰裝改北轅烏飛城樹曉鴈泊野蕪暄耿耿清標闊涔涔宿酒昏百蟠縈阪道數里豁川原跋馬風煙外依稀鼓吹喧貟村坂其東八政水即古之傅巖有傳說廟又東北虞城古虞公之國也穹谷鬱盤紆河瀕陜北隅泉流㳙不絶岡勢儼相扶初旭紛髙下空煙似有無石灘醒耳快嶠樹窣雲孤天霽嵐光活人稀草色蘇牧兒歌自若樵子逺相呼壞道傍連傳空城右指虞窮嵓今寂寞蔓草只荒蕪野店寒䬸澀山程瘦馬瘏物華供興趣亦足慰﨑嶇太行象帝胚渾散愚公轍跡開橫行四極外蟠據九河隈茀鬱天閽近崢嶸地軸回陽崖明草樹隂壑轉風雷波沓群峯涌雲奔峭壁來猿嵓垂磊落龍窟鬪喧豗噴雨驚湍灑跳星巨石頽平塗憂屐拆跬步戒輪摧覆頂千春雪緣漳萬古苔谷盤容國士髓裂餌仙才晋市飛樵札燕郊落燒煤棊圖分冀野蟻壤認叢臺在昔王塗塞嘗聞霸略恢嚴閞隂伏甲間道夜銜枚挾詐揮金斗貪功襲墨縗戰場空爝火京觀悉蒿萊險易曽何變興亡只可哀隆平方恃德襟帶自崔嵬石昌言學士宰中牟日為詩見寄久未之答今冬罷武成幕來京師此詩謝之楊休昔年三月浪鱗翼化雲雷竹箭流俱上芙蓉幕對開釋褐昌言除同州推官光華州判官瀵泉揚沸渭泰華聳崔嵬捧檄容歸省飛觴復屢陪時光人知同州光以吏事時往省覲復得與昌言遊芬芳襲芝室嘉慶侍蘭階吳壁評殘筆隋碑讀漬苔同州龍興寺即隋文帝故宅寺有李德林撰碑國公吳道子盡畫或未就而止云以俟後之能者清隂依玉樹和氣樂春臺薄官俄成别私門忽遇災一朝捐綵服五載泣粗縗季路還從仕任安獨見哀近畿須健令劇邑試長才過目全牛解迎鋒巨枿槯雉留乘䕃伏蝗避境苗回時得鳴琴暇仍飛麗句來正知榮篋笥無足報璿瑰紞鼓俄攀鄧安車巳召枚賦成平樂館燕奉柏梁杯自顧誠駑緩于今尚草萊履穿羞路雪蓋敝怯京埃儻惜餘光便炎風動死灰昌言見督詩債戲呈絶句學餧才貧杼軸勞踰年避債負詩豪倒囊不惜償虛劵未敵瓊瑶舊價髙靜夜午夜空齊四悄然清寒透骨不成眠秋風故揭踈簾起正漏月華來枕前春紅桃素李競年華周遍長安萬萬家何事青春庭下柏東風吹盡亦無花送導江李主簿君俞學海無涯冨辝鋒一戰勳聲華掩終賈賦頌繼淵雲五斗為邊吏千倉飽戍軍明恩美尤異優秩賞能勤黃祖隂懷怒張湯巧用文折雖因木秀燒不變蘭薰迹有窮通異心無得喪分龍蛇寧久蟄玉石豈俱焚蜀國花饒思臨卭酒易醺西風時有意尺紙慰離群送峽州陳廉祕丞三首冝都賢太守治迹古人齊虎負衆子去鳯環群鳥棲行增頴川秩别降武都泥正恐還朝速春林未子規郡府猿聲外旌旗鳥道邊樓髙出楚塞煙霽識巴船𥜗袴嗟來暮簮紳惜外遷皇仁矜逺俗非謂意踈賢地險三巴口江流百折蟠騶珂通峽響門㦸照秋寒翠壁虎牙石素花狼尾灘孫劉置栅處細為寫圖看武成致齊奉酬吳沖卿寺丞太學宿直見寄二首廣文更直太常齊咫尺無從盡素懷不及清風得隨意夜深容易過天街雪後餘氷尚綴簷月華霜氣入踈簾難堪瓊玉驚心骨坐覺清寒幾倍添雪中尋友人不遇擁䄂犯風雪驅車行詣誰朱門不可入素友復難期依丗誠多拙迷方忽自悲𥚹心終寡合吾道易參差河邊晚望髙浪崩奔卷自沙悠悠極望入天涯誰能脫落塵中意乘興東遊坐石槎早春寄東郡舊同僚樓臺帶餘雪寒色未全收久負入開意空為同舍羞清樽接勝友飛蓋從賢侯應限春來晚煙林巳數逰邊將三首紅旗一簇聚山椒霽日清風看射鵰脫帽胡兒遙稽首漢家新將霍嫖姚月白星稀霜氣多卷旗束甲涉䓗河田家不覺官軍度夜半只聞風雨過橫吹長歌千萬騎將軍塞北立功回邊人爭出孤城望漸見旌旗天外來漁父楚岸橘花香扁舟泛渺茫短蘘衝密雨素髮淨秋霜煙外鳴桹逺波間擲線長無人識名姓擊汰恐誤入滄浪早春梅梢柳蕚未全開日淡風和春意來雨後誰家有桃李㑹須多買及時栽又璿霄轉斗車春意逼梅花熟寐侵街鼓間情到酒家睛陽浮地末寒色斂天涯歸鴈空餘迹朝來印浦沙山中早春山木欣欣意春光次第催欹巾望歸鴈伏檻聽新雷巖靜聞氷折巢空喜燕來澗花從寂寞亦向草堂開贈學仙者微徑透重巒茅堂竹葉冠方瞳映骨靜秀氣逼人寒夜火裝丹竈睛霜醮石壇不須驚淺俗䡖舉入雲端留别友生野際共為别客亭芳草新何心更執酒滿目盡傷春今古無窮路東西相背塵行行復回首不欲著鞭頻二月六日𥘉見待漏房前柳色微緑欣然成詠宫城映出絲絲緑頓覺皇州春意回從此不辭驅瘦馬六街終日踏塵埃垂柳天意清和二月初春風不動整如梳陶潜宅外時無此想更蕭條不易居間居故人通貴絶相過門外真堪置雀羅我巳幽慵僮更懶雨來春草一畨多中秋陪張龍圗宴射堂𥘉夕隂雲酒行頓解喜而成詠飛蓋共徘徊西園髙宴開秋雲惜明月留待庾公來貽宋四行蕳迪離羣如幾辰屈指十靑春不意輪蹄跡共兹京洛塵文場投􅃮契客路轉蓬身别易相逢闊過從莫厭頻自嘲盤飱羅新𬞞充腹不求餘窮巷晝扄户間軒卧讀書有心齊塞馬無意羡川魚丗道方邀逐如君術巳踈醉厚於太古暖於春耳目無營見道真果使屈原知醉趣當年不作獨醒人雪寒取酒雪意久未就寒雲低不收飄揚插孤幟迢遞映髙樓試假賢人濁聊攻客子愁呼僮擕小榼更凖黑貂裘虞部劉貟外約遊金明光以賤事失期劉惠詩見嘲以詩四首謝之宗孟絲管嘈嘈耳不分綺羅雜沓自成春不唯漢帝昆明小更覺唐家曲水貧絳闕朝歸散玉珂不遊不飲奈春何皇仁聽使歡娛極白簡從君冷峭多碧柳紅桃照眼春綺肴芳醴集朝紳自嫌林野踈頑迹難預風流席上賔上苑花繁髙覆墻曲隄風暖柳絲長爐邊應有步兵尉甕下難尋吏部郎孫器之奉使淮浙至江為書見寄以詩謝之五首䪍矢迎山驛軺車下帝臺夜看牛斗分應有使星來曉棹旌旗逈暮河鉦鼓喧商船極目避漢使一何尊吳釀木蘭春蘇州有木蘭堂酒江鱸白錦鱗玉盤聊下筯初識紫絲蓴岫貼睛天闊舟緣石岸深吳江中石岸長數里遙知作書處纜裊緑波心沙溆鶴爭飛波光可染衣松江異淇水信美不如歸器之家衛州和國子夏主簿李花有章儒宫岑寂覺春間仙李繁花重壓欄碎錦不飛蒙樹合素雲欹亞舉枝難能詩此日當推謝捧賜他年足繼淵聖御名更約雕盤薦秋實豈徒穠豔一朝看送聶之美攝尉韋城徒勞巳足倦漂泊益恓惶短劒無三尺征衣兵一囊折腰從事馬贊謁使君堂併日屢承檄無時不褁糧官曹大兒戲弓槊小軍行破柱翻偷窟傾林索盜囊村墟旅顔黑風日故衫黃瞑宿投煙舍朝飱䕃道桑誰憂課書殿豈慕薦飛章志氣空磅礴才華浪激昂鐫鑱圭始瑩磨拂鑑尤光衣褐仍纏袴無羞俗吏裝送吳辨叔大名司戶元宰司官鑰旌旄壓大河敢言趨府倦私歎折腰多機發何妨避光塵未免和艱難方逺到慶閥肯蹉跎致逺必自近如君豈椽曹魚龍試春浪松栝露秋毫錯落辝華富堅􅥁氣節髙無歎走塵勞送楊太祝恍知長州縣三吳佳縣首民物舊熙熙專用清談治非如俗吏為林踈丹橘􅒯稻熟白芒欹冝使民無忘嚴修太伯祠和邵興宗秋夜學舍宿直直舍逍遙度清夜暫投逢掖解儒冠髙樓影背星河轉踈竹氣兼風露寒籬下黃花新蘂亂門邊碧柳舊株殘折腰把板今無有勿似陶潛遂弃官和吳冲卿病中偶書呈諸同舍光時亦卧疾病來門不掃秋草翳吾廬弃置賢人酒蕭條長者車冥迷牀鬪蟻潤溽篋生魚藥物從無繼簞瓢自有餘形神寂可弔身丗邈相踈何事文園客消中亦著書月下小飲美景賞心相值難良宵四座盡儒冠月華過冷衣襟潤酒力易消樽俎寒自有笑談供逸氣不須絲竹借餘歡坊樓五鼓欲催曙桂影長先髙興䦨又絶句舉首孤輪不似遙鐏前狂氣出雲霄常娥不惜惜丹桂欲就髙枝掛酒瓢馬病羸病何其久仁心到棧頻須憐苜蓿歉當認主人貧客舍同蕭索山程共苦辛未能逢伯樂且可自相親入塞萬騎入榆關臯蘭苦戰還椎鋒佩刀鈌踏血馬蹄殷鐃吹來風外牛羊出霧間須知沙塞惡壯士變襄顔喜孫器之來自共城取友不無人愛君天性真逺尋窮巷宅未拂滿衣塵王禮貧尤重交情别更親誰家釀醇酒盡醉凖衣巾送韓太祝縝知錢唐冠佩鬱相映由來積德家一時推俊異四海走聲華圖籍添舟重江山忘路賖夷塗指霄漢局驥不須嗟和聶之美鴈汲汲復栖栖往來誰與期映雲才可見入霧杳難追羇枕夢初斷寒閨涕巳危冥冥逺繒繳愧爾獨知時又和諷古海客久藏機鷗知人不知如何毫末利管鮑亦相欺送王太祝豫知伊闕百里歡迎新令賢儒經吏術盡家傳天開嶺阜竦雙闕地雜桑麻隘一川錦雉馴飛春陌上雪鳬髙去夕嵐邊長才久屈君無限所惜斯民受賜偏慶曆七年祀南郊禮畢賀赦雷鼓千通破大幽天開獄鑰縱纍囚驛書散出先飛鳥一日恩流四百州送張太博肅知嶽州嚴風秀木折為薪得罪由來為出群粥粥黃雞憎鶴介芃芃青蔓掩蘭薰天資讒嫉多端巧人極精明不易分飲水豈言吳刺史謗書翻似馬將軍波濤洶涌動寒野樓閣嶣嶤壓暮雲紅葉寺深秋晚見蒼山鍾逈夜清聞何妨絶境聊為守正恐中朝亟用君身外百愁俱擲置放歌沈飲且醺醺和之美河西列岫亭秋山對踈牖羈客倦登臨雨後嵐光活晴𥘉落照深素波明别浦赤葉照衰林佇目寂無語何人知此心亭臯資逺矚秋思浩無涯鴈唼牽菱蔓童歌出荻花壟荒猶叱犢枝暗稍栖鴉煙靄藏東渚慿軒莫望家書事志士喜功業感時心易勞蘖栽終栝柏荒蔓任蓬蒿梁竦慵為吏蕭咸恥詣曹風霜果不變會見出雲髙釣魚有感垂竿臨晚岸堅坐據莓苔餌落萍初散魚驚荷暫開有求雖瑣細未獲且低回君識磻磎老曽垂緑髮來又野釣披榛竹無人知往來髙空飛不下鷗鳥巳相猜田家未塞豪人奪何言公賦收皇心雖惻隱蓬戶或焦愁為吏空多祿無人能此憂知君坐公府他日冨民侯和人葦花葭菼迷河曲髙秋一畨榮齊紈張野白楚練照川明不夜月常皎踰時雪未晴萬仙霓帔合千畒玉苗生漠漠波瀾偃茫茫沙磧平際空鹽海竭垂地塞雲橫日暖鷗無色風髙鶴有聲逢君得嘲賦豈愧束薪井送趙書記衆之官華州車馬西城外遙遙未有塵辭梁猶帶雪過洛漸生春幕府斜依嶽關山曲抱秦曩來謨畫拙不必笑前人又寄題陟屺寺鄭南峯下寺前軒反景分明見渭川為報十年容易别於今愁悴不如先寄鄭縣史令千之前君為白馬尉廨舍前即南浦今西溪封內勝地也憐君比比得佳縣勝槩間情雙有餘為看西溪日沉後如何南浦月生初長春宮柳逺扶踈新樹應多舊巳枯蠹柱苔牆遍尋歷古亭猶有杜詩無送華亭沈主簿執𬒮青門道蕭蕭馬欲東暮雲零落翠逺樹淺深紅楚澤吟聲裏吳山醉眼中相思杳何許野鸖唳髙風閏正月十五日夜監直對月懷諸同舍二首霧淨金波溢天開碧幕空夜寒雖料峭春意自冲融熠熠枝上露翛翛竹杪風暫還林野興不似畜樊籠淡薄春雲散低昻北斗橫微分漢津鴈靜識建章更濁酒憐虛爵髙文憶友生前軒空不掩悵息負孤清歸鴈亦知南國稻粱肥水滿春江努力歸聞道楚人繒繳細平沙短草盡藏機憶龐之道疇昔兩垂髫知音結久要何言半塗别不待歲寒雕幸有才名在非隨氣運消英靈猶髣佛宿草巳蕭蕭送鄭推官戡赴邠州形便豳公國旗旄擁將壇秦雲低落日塞樹怯春寒草檄無留思投壷不廢歡還應笑黃卷寂寂守儒官百榼行春樂千弓從獵豪苦吟邊月冷飛鏑野風高竒䇿鞭殊俗長緌係不毛輸君躍馬貴一等著青𫀆驕虜巳歸計聖朝方寢兵時聞候火入非復塞塵驚秋嶺無南牧春田恣北耕休窮西海路辛苦學甘英興宗約遊㑹靈久不聞問以詩趣之勝地何妨行樂頻萬雙白璧不賖春臘醅巳老久未壓楊柳青青不侍人清明日興宗飲趙道士東軒佳遊得令辰過此不為春一境風光秀萬家煙火新燕初飛玉殿草不染香輪逼水蒲牙短圍隄柳帶勻縱談髙出古落筆健生神日暮還醒去林花應笑人上巳日與大學諸同舍飲王都尉園冠蓋鬱相依名園花未稀游絲縈復展狂絮墮還飛積弩遺風陋蘭亭舊俗微何如詠沂水春服舞雲歸寄題洪州慈濟師西軒登臨傳勝絶悵息未成遊山氣髙凌霽湖光碧照秋煙踈茶竈􅒯燈冷竹房幽安得聊慿檻蕭然洗客愁山頭春色天意欲回煦群生稍鬱蒸平田猶未遍絶嶺獨先升翠色添崖柏寒聲折澗氷誰為物外友挈手共同登三月十五日宿魏雲夫山㽵先生嫌俗賔猶與故鄉親不惜煙霞地暫容韁鎖身林廬深有徑雞犬四無鄰蔌蔌開花墮蒼蒼古柏春飯炊松粒細盤采蕨芽新靜覺精神健間知氣味真雞泉冷毛髮山翠濕衣巾竹色消酲易林聲破夢頻客輪來去轍驛路古今塵明日空回首白雲應笑人又七言聞道山家門鎮開獨驅瘦馬出塵埃白雲明月先無約何事今霄亦此來留别逢吉君念承明臭味稀相逢惜别重依依㑹稽太守方坐嘯東郭先生還步歸嚴助朱買臣皆為會稽守東郭先生孝武時待詔公車樂飲林塘留節物餞行里舍動光輝雙旌回去行人發一帶長臯煙雨微陜城桃李零落巳盡硤石山中今方盛開馬上口占西望飛花千樹暗東來芳蘂一畨新行人不惜泥塗倦喜見年光兩處春自澠至洛循榖水行百餘里巳煩榖水逺相送更得嵩峯遙見迎水碧峯青看未足却愁前到洛陽城送不疑知常州宦學不營身京華費十春非貪為郡樂意欲與民親祖帳青門道歸帆楊子津江山舊遊在煙火故鄉鄰敢惜離群闊欣聞得吏循嗟余一囊米𬈑負鬛絲新送聶之美任雞澤令趙魏髙氣俠到今風俗然椎埋吏難禁擊斷丗稱賢明府冝更瑟罷民庶息肩無如􅗀絲者急斂縱敲鞭送張祕校知分寧獻臣父百里大夫官不輕莫嗟領上髮垂星人生榖祿偏冝晚丗路艱難不厭經數曲秋江縈縣白幾峯霽色入簾青于公嚮日多隂德巳有鵷雛在帝庭館宿遇雨懷諸同舍佳雨濯煩暑翛然生曉凉森沈殿瓦碧羃歷井苔蒼院靜杉篁秀人間鍾鼓長慿誰同把酒清興窅相望送韓直講鐸字子文鄆州寧親車馬儼何之東岡舊有陂三年别親意千里逹家時去仕元戎幕來為太學師寧須負斗米不復斷機絲物色迎歸鞚光輝入壽巵人生無此樂此樂獨君知宣徽使河東經略使鄭文肅公挽歌二首璿璣敷帝命金節護邊兵盡付將軍制真為儒者榮扶搖方上擊濛汜忽西傾罷市人相吊紛紛滿百城柳翣喪容盛江山故國遙清時獨長往何日重來朝事與秋雲斷榮如曉夢消西風虎丘路馬鬛又嶣嶤又代孫檢討瑜字叔禮作二首湖澄翠岫孤勝地古東吳氣象常時秀英靈何丗無金閨演王綍玉帳綰兵符煒燁照鄉曲從兹益重儒人為天地客處丗若浮休豈有生長在秖知名可留露沾寒草晚風嘯白楊秋地下求文友應從顧陸遊送丁祕竭字公佐知雍丘古縣跨河流人繁軍市稠羽飛朝暮驛鱗疊往來舟兄擅才華久時推政治尤足猶妨老驥目不礙全牛從道西來近能無東望愁時因趍上府窮巷一相求苦雨積雨欲侵旬朝晡漫不分蒼凉微露日慘淡巳生雲地半成泥滓天應厭垢氛時聞度鶬鴰空外自為群酬師道雪夜見寄玉樹交橫雪後天銀河沉著斗欄干筆峯微結氷絲澀燈暈𥘉成花燼殘太學先生氈苦薄公車倦客履仍單欲吟佳句到清曉夜寂愁聞金石寒代叔禮作使北詩人主愛民物心無彼此情約歡同一國蒙福遍群生玉帛遙相望風波寂不驚熙熙南北海所至盡升平又擊毬肅奉承軺命仍陪戲馬遊朋分𥘉逈出勢合復相收顧眄華星激縈回紫電流良因重嘉好禮接使臣優送計先輩秦符尉宗城紅塵久帝城髙價動公卿竹柏寒方茂驊騮老更成氷霜驅馬瘦書劒束裝輕丞相虛東閣遙知倒履迎送趙殿丞象字子輿歸成都祀明堂禮異子輿新升朝以恩官其父大理評事賜告歸寧得其除書以俱二三同舍為詩以紀其美僕得回字蜀棧錦衣來高堂綬笥開恩輝同日至喜色共春回駟馬過鄰社朝𥚑捧壽杯吾生無此樂空使寸心摧送張都官肅字子莊江南東路提刑得前字楚俗號難治司刑尤擇賢危疑片言决舒慘一方專松不雕寒色絲曽斷直絃清風過江外應在下車前溫國文正公文集卷第七
