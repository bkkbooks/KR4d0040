body:
  text: 章奏二十乞經筵訪問劄子選人試經義劄子論安懿皇劄子留吕誨等劄子留傅堯俞等劄子乞與傅堯俞等同責降劄子居家奏狀第二劄子第四劄子第三劄子請不受尊號劄子議祧遷狀辭翰林學士第一狀第二狀第三上殿劄子王陶乞除舊職劄子乞經筵訪問劄子臣以駑朽得侍勸講竊見陛下天性好學孜孜不倦然於經席之中未嘗發言有所詢問臣愚意陛下欲護群臣之短恐於應對之際倉卒失據不能開陳稠人之中受其愧怍此誠聖心仁恕之極群臣捐軀無以報塞然臣聞易曰君子學以聚之問以辨之論語曰疑思問中庸曰有弗問問之弗得弗措也有弗辨辨之弗明弗措也以此言之學非問辨無由發明今陛下若皆默而識之不加詢訪雖為臣等踈淺之幸竊恐無以宣暢經旨禆助聖性伏望陛下自今講筵或有臣等講解未盡之處乞賜詰問或慮一時記憶不能詳備者許令退歸討論次日别具劄子敷奏庶幾可以輔稽古之志成日新之益取進止選人試經義劄子臣竊見國家舊制資蔭出身人𥘉授差遣者並令審官院流內銓試省格詩或賦或論一首或五經墨義十道各從其便其賦論墨義徒有其名無人願試大率皆乞試詩其間甚有假手於人真偽難辨就使自能作詩辭采髙妙施於治民亦無所用不可以此便為殿最臣欲乞今後應資蔭出身人𥘉授差遣者並委審官院流內銓試孝經論語大義共三道仍令主判臣僚更將所對義面加詢問使之口説若義理精通者特為一等并所試大義卷子保明聞奏京官與減一任監當選人並與家便差遣合入家便者與先次其義理稍通者依常調不通者旦令修學候一周年外再試必須試中方得出官若年四十以上者即聽依舊制只寫家狀讀律如此則公卿大夫子弟皆嚮學知道亦近於先王教胄子之術也取進止論安懿皇劄子臣聞諸道路未知信否或言朝廷欲追尊濮安懿王為安懿皇審或如此竊恐不可陛下既為仁宗後於禮不得復顧私親臣先時言之巳熟不敢復煩聖聽今臣不知陛下之意固欲追尊濮王者欲以為榮邪以為利邪以為有益於濮王邪前丗帝王以旁支入繼追尊其父為皇者自漢哀帝為始其後安帝聖御名帝靈帝亦為之哀帝追尊其父定陶恭王為恭皇今若追尊濮安懿王為安懿皇是正用哀帝之法也陛下有堯舜禹湯不以為法而法漢之昏主安足以為榮乎仁宗恩澤在人淪於骨髓海內之心所以歸附陛下者為親受仁宗之命為之子也今陛下既得天下乃加尊號於濮王海內聞之孰不解體又安足以為利乎夫生育之恩昊天罔極誰能忘之陛下不忘濮王之恩在陛下之中心不在此外飾虛名也孝子愛親則祭之以禮今以非禮之虛名加於濮王而祭之其於濮王果有何益乎三者無一可而陛下行之臣竊惑之此蓋政府一二臣自以嚮者建議之失已負天下之重責苟欲文過遂非不顧於陛下之德有所虧損陛下從而聽之臣竊以為過矣臣又聞政府之謀欲託以皇太后手書及不稱考而稱親雖復巧飾百端要之為負先帝之恩虧陛下之義違聖人之禮失四海之心政府之臣秪能自欺安能欺皇天上帝與天下之人乎臣願陛下急罷此議勿使流聞逹於四方則天下幸甚臣今雖不為諌官然嚮日已曽奏聞身備近臣遇國家有大得失不敢不言取進止留吕誨等劄子臣聞人主患在不聞其過人臣患在不能盡忠是故忠直敢言之臣國家之至寶也夫以人主之尊下臨群臣和顔色以求諌重爵賞以勸之群臣猶畏懦而不敢進又况憚之以威懲之以刑則嘉言何從而至哉竊聞侍御史知雜事吕誨侍御史范純仁監察御史裏行吕大防因言濮王典禮事盡𬒳責降中外聞之無不駭愕臣觀此三人忠亮剛正憂公忘家求諸群臣罕見其比今一旦以言事太切盡從竄逐臣竊為朝廷惜之臣聞人君所以安榮者莫大於得人心今陛下徇政府一二人之情違舉朝公議尊崇濮王過於禮制天下之人巳知陛下為仁宗後志意不專悵然失望今又取言事之臣群輩逐之臣恐纍於聖德所損不細閭里之間腹非竊歎者多矣况純仁大防皆陛下簡拔於衆人之中任以為耳目之臣蓋取其忠直非取其阿諛也純仁大防亦欲竭誠盡節以報陛下之知故敢不附政府侃然正論今更以此獲罪則陛下於群臣之中尚誰親哉若使忠直日退阿諛日進則陛下何以復知臣下之善惡政事之得失如此殆非國家之福也伏望聖慈亟令誨等還臺供職則天下翕然皆歌陛下之聖明雖禹之樂聞善言湯之改過不吝不足過矣不則旦為之别改近地一官亦可以少慰外人之心也留傅堯俞等劄子臣近曽上殿蒙聖恩宣諭以濮王稱親事云此親字官家亦夲不欲稱假使只稱濮王與仙逰縣君有何不可臣乃知陛下至公本無過厚於私親之意直為政府所誤以致外議紛紜必謂旦夕下詔罷去親名其已出臺官當别有除改見在臺官亦優加撫諭使之就職昨日忽聞侍御史知雜事傅堯俞知和州侍御史趙鼎通判淄州趙瞻通判汾州中外之人無不驚愕此蓋政府欲閉塞來者使皆不敢言然後得専秉大權逞其胸臆臣竊惟陛下春秋方壯聖性欽明而今日獨取拒諌之名受孤恩之謗違天下之望失人主之權止於遂政府數人很心而已不知於陛下有何所利而為之臣不勝區區深為陛下痛惜伏望陛下勿復詢於政府特發宸斷召還堯俞等下詔更不稱親如此則可以立使天下憤悶之氣化為歡欣誹謗之語更為謳歌矣取進止乞與傅堯俞等同責降劄子臣昨任諌官日與其餘臺官等同共論列濮王典禮不冝稱尊號及皇考事前後非一臣尋蒙恩改龍圖閣直學士臣屢曽辝免乞以舊職知河中府等一處朝廷不許止免缺職今同知諌院傅堯俞御史知雜事吕誨侍御史范純仁趙鼎趙瞻監察御史衷行吕大防並巳責降若所言濮王事合於典禮則堯俞等不當竄逐若所言非是則臣不冝獨免况同時臺諌官竄逐已盡臣實無顔尚居故位同罪異罰有纍公朝伏乞與傅堯俞等一例責降取進止居家奏狀右臣今日上殿已曽靣奏為先任諌官日言事不當乞賜責降見居家待罪自今月十二日已後不敢赴起居所有夲職公事亦不敢管勾謹具狀奏聞謹奏第二劄子臣於今月十一日上殿以先任諌官日論列濮王事不當乞賜責降陛下令納下劄子不送中書臣以負罪在身不可苟免若不得臣劄子中書無以進呈行遣遂於次日具録劄子副夲繳申中書臣又有此固違聖旨之罪乞付外施行早賜責降取進止筆三劄子臣於今月十一日上殿乞與傅堯俞等一例責降十三日又曽自陳固違聖旨之罪至今未奉指揮臣嚮於陛下即位之年四月二十七日巳曽上疏豫戒追尊祖父之事及政府請議濮王典禮陛下令候過仁宗大祥别取旨臣與傅堯俞甫過太祥即詣政府白以為人後者不得顧私親之議及詔兩制禮官同共詳定之日臣又獨為衆人手撰奏草若治其罪臣當為首其吕誨等並係後來論列巳蒙譴逐况如臣者豈冝容恕縱陛下至仁特加保庇臣能不愧於心伏望聖慈依臣前奏早賜責降其嚮所上疏竊慮年月稍久禁中遺失今别録進呈取進止第四劄子臣自今月十一日以來巳曽三次奏乞與傅堯俞等一例責降未蒙開允今又準中書劄子以侍講錢象先奏乞催臣依舊赴經筵供職奉聖旨令臣疾速朝參供職者臣仰荷大恩所冝奔走奉承詔旨然臣退循義理有所未安是以不敢苟貪榮祿至重有敷陳臣與傅堯俞等七人同為臺諌官共論濮王典禮凡堯俞等所坐臣大約皆曽犯之今堯俞等六人已蒙聖恩盡得外輔獨臣一人尚留闕下使天下之人皆謂臣始則唱率衆人共為正論終則顧惜祿位苟免刑章臣雖至愚粗惜名節受此指目何以為人非徒如是而已又使譏謗上流謂國家行法有所偏頗臣是用晝則忘餐夕則忘寢入則愧朝廷之士出則慙道路之人藐然一身措之無地雖知違犯天威負罪愈重豈敢更復朝參供職伏望聖慈曲垂矜察依臣前奏早賜責降取進止請不受尊號劄子臣聞王者父天母地子育黎元嚴恭鬼神畏懼災異故能安靖國家饗有多福自生民以來不易之道也天雖至髙視聽甚邇朝夕不離王者左右順吉逆凶應若影響此乃詩書所載聖人所言豈可謂之漠然無知而簡忽不顧哉臣伏見陛下踐阼巳來太陽侵色中有黑子大風晝晦冬溫無氷連年大水漂沒廬田以至今歲災異尤甚慧星彰見光炎隆熾朝東暮西連月乃滅飛蝗害稼日有食之加之陜西河東夏秋乏雨禾既不收麥仍未種婦子恓惶流離滿路西戎內侮邊鄙未安當此之際群臣冝勸導陛下以祗畏天命勤恤民隱克己謙約博求至言以消復變咎延致善祥而朝廷晏然曽不為意或以為自有常數非關人事或以為景星嘉瑞更當有福今者又有佞臣建議請上尊號其為欺蔽上天誣罔海內孰甚於此是使上帝鬼神怫鬱不懌自拜表以來陛下嬰此疾疹久而未愈此皆群臣諂諛之罪陛下豈得不省寤而深思哉臣不勝區區忘生觸死伏望陛下自以聖意止群臣所上章表却尊號而勿受更下詔書深自咎責咨謀四方廣開言路求所以事天養民轉災為福之道俟聖體康復政化流通天時豐穰人心恱豫然後推崇徽稱何晚之有如此庶幾上帝收還威怒福祿大來聖躬和平勿藥有喜群生百姓莫不幸甚况陛下嚮者郊禮之前辭尊號不受天下稱誦盛德至今未巳然則是棄虛名而得實名捨虛美而取實美也於陛下何損焉臣荷國大恩承乏侍從誠見近日群臣皆以言為諱入則拜手稽首請加鴻名出則錯立族談腹非竊笑終無一人為陛下正言其不可者臣竊痛之是敢妄進狂瞽惟聖明采察取進止議祧遷狀右臣準學士院告報以大行皇帝神主祔廟僖祖神主當遷夾室準朝旨令待制以上同議者臣先於嘉祐八年仁宗祔廟之時已曽與龍圗閣直學士盧士宗上言僖祖當遷夾室當時議臣皆以為不然朝廷遂從衆議臣謹案王制稱天子七廟三昭三穆與太祖之廟而七明太祖之外止有三昭三穆而巳是以前代帝王於太祖未正東嚮之時大率所祀不過六丗若僖祖於今日方議祧遷則是太祖之外更有四昭三穆與太祖之廟而八不合先王典禮難以施於後丗臣愚以為仁宗祔廟之時僖祖已當遷於夾室今大行皇帝祔廟順祖亦當遷於夾室臣既承詔旨令得與議不敢不盡所見以對伏乞朝廷更賜詳擇今録嘉祐八年奏議一夲謹具狀繳連奏聞伏候敕旨辭翰林學士第一狀右臣竊聞巳降敕告在閣門除臣翰林學士者臣聞人臣之義陳力就列不能者止臣自從仕以來佩服斯言不敢失墜頃事仁宗皇帝蒙恩除知制誥臣以平生拙於文辭不敢濫居其職瀝懇固辭仁宗皇帝察其至誠遂賜開許今翰林學士比於知制誥職任尤重固非愚臣所能堪稱聞命震駭無地自處况臣於先皇帝時以久官京師私門多故纍曽進狀乞知河中府或襄虢晉絳一州後值國有大故及所修君臣事迹並未經奏御以此未敢更上文字日近方欲再有陳乞不意忽叨如此恩命臣雖頑鄙粗能自知非分之榮必不敢受伏望聖慈察臣非才不堪此任特賜哀矜遂其微志許以舊職知河中府或襄虢晉絳一州若此數處無闕即乞於京西陜西路除一知州差遣如此則上不纍公朝之明下不失私家之便誠為大幸干冒宸嚴臣無任惶恐懇切之至謹具狀奏聞伏候敕旨第二狀右臣近於閏三月二十九日曽進狀辭免新除翰林學士恩命乞一知州差遣至今未奉朝旨者臣竊以唐室以來士人所重清要之職無若翰林自非天下英材聲稱第一詳識典故冨有文章雖欲冒居豈厭衆意臣稟賦頑鈍百無所堪在於屬辭尤為鄙拙安敢強顔輒為此職人雖不言能不內愧是用輸肝瀝膽貢實自歸惟仁聖鑒其中悃力小任重慙懼交攻坐炭履氷未足為諭特遂所志使之自安天地至恩無以過此所有翰林學士敕告臣不敢祗受伏乞依臣前奏只以舊職於晉絳或京西陕西路除一知州差遣干冒宸嚴臣無任惶恐懇切之至第三上殿劄子臣近蒙聖恩除翰林學士已曽兩次進狀辭免乞一知州差遣奉聖旨不允令便授勑告者臣非不知美官難得詔旨難違然所以須至再三煩瀆天聽者誠以臣之材性各有短長人君當量能授官人臣當陳力就列如此則事無曠廢上下得冝臣自幼少以來雖稍曽讀書而稟性愚鈍拙於文辭若使之解經述史或粗有所長至於代言視草最其所短今若苟貪榮寵妄居此職萬一朝廷有大號令或除拜稍多臣才思竭涸必至閣筆縱使勉強得成其鄙惡必甚以之宣布四方使共傳笑豈惟彰微臣之醜亦恐為朝廷之羞此臣所以寧犯譴怒之誅而不敢當清華之選者也陛下若察其至誠知非矯飾特賜哀矜寢罷新命則是掩臣所短全臣所長生成之恩孰大於此况臣自通判并州得替住京十有餘年去歲兄里身亡遺孤無人照管臣纍曽奏先帝乞家便一官亦蒙聖恩許候修書略成規矩即除外任無何先帝奄棄天下臣哀荒失圗未敢敘陳近方欲具所修前漢紀三十卷先次進呈然後以私懇上干陛下聖聽不期忽有今兹恩命誠非愚臣夲心所願憂惶局蹐無所容措伏望聖慈依臣前奏只以舊職於晉絳或京西陜西路除一知州差遣所有翰林學士勑告臣不敢祗受取進止王陶乞除舊職劄子臣昨日召對蒙聖恩賜示以吳奎所上劄子為直除王陶翰林學士家居待罪事臣尋巳曽據所見敷奏陛下始欲止還陶舊職後又欲與陶侍讀學士臣當時匆遽未有以對退為陛下經宿思之侍讀學士與翰林學士資級略同若授陶此職臣恐奎尚未肯起陛下新即尊位大臣屢有不安其位者奎素有質直之名萬一因此激發舉動更有過當若亟行罷免則深失士大夫之望若屢詔不起則愈損陛下之威况陶本以言事不聽辭免臺職待罪之際若更加以美官臣竊料陶亦不敢受欲望聖慈止還陶未作御史中丞時舊職則奎前者巳經商量不敢不起陶既是舊職受之亦安庶免更有紛紜重傷朝廷大體臣蒙陛下虛已下問愚慮竊以此為便不敢不奏乞賜詳擇取進止溫國文正公文集卷第三十五
