  text: 溫國文正公文集卷第五十
  hash: sha256:447f780f368d1d4bca421ffa07539df98edd2dfe8c39a63fcd95240efd029e41
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_050-1a}
body:
  text: 章奏三十五辭不正謝劄子內批依近降指揮審取指揮劄子辭放正謝第三劄子論西夏劄子辭放正謝第四劄子乞未禁私市先救西人劄子又劄子乞堅守罷役錢勑不改更劄子辭不正謝劄子臣伏聞降聖旨在閣門宰臣執政官近遷轉巳正謝訖內有司馬光見患在假特放謝仍免赴景靈宫福寧殿恭謝臣聞命震駭無地自處豈有朝廷特遷一官卧家受之並不入謝君降異常之澤臣無一拜之勤自古以來未嘗有此臣雖頑暗必不敢當伏望聖慈早賜收還今來指揮候臣疾患稍痊只依前來指揮減拜入謝及赴景靈宫福寧殿恭謝庶使賤臣粗能自安取進止內批依近降指揮審取指揮劄子臣昨日具劄子奏為聖旨特放正謝仍免赴景靈宮福寧殿恭謝臣以自古以來未有此禮必不敢當當夜準御批依近降指揮臣勘會今月十四日內降以臣轉官所有將來正謝特令兩拜起居免舞蹈十七日又準內降所有臣將來合赴景靈宫恭謝逐殿冝止令兩拜二十八日又準入內供奉官劉永年傳宣放臣正謝及景靈宮福寧殿神御前恭謝臣未審御批依近降指揮是依十四日指揮十七日指揮依二十八日指揮須至再奏稟取進止內批依二十八日指揮辭放正謝第三劄子臣昨夜準御批指揮今早再有奏稟蒙復降御批依二十八日指揮臣承命驚惶措躬無地伏念臣忝為人臣陛下賜之一顧賜之巵酒賜之瓜果臣亦當稽首拜謝况進以髙位加之寵名榮動搢紳澤流苗裔豈可即安私室專飬沈痾不造王庭坐受圭組不獨為海內之所共責有司之所直繩天威違顔不出咫尺隕越斃踣為聖朝羞臣雖至愚粗知自愛何敢受此自納於不測之誅伏望聖慈矝閔候臣所患稍痊安日止依十四日十七日所降指揮減拜入謝及於景靈宫福寧殿神御前恭謝庶差可自安其二十八日指揮臣以死自守必不敢奉詔取進止論西夏劄子臣伏見神宗皇帝以夏國主趙秉常為臣下所囚興兵致討奮揚天威震蕩沙漠虜攜其種落竄伏河外諸將收其邊地建米脂義合浮圖葭蘆吳堡安強等塞此蓋止以藉口用為已功皆為其身謀非為國計臣竊聞此數寨者皆孤僻單外難於應援田非肥良不可以耕墾地非險要不足以守禦中國得之徒分屯兵馬坐費芻糧有久戍逺輸之纍無拓土闢境之實此衆人所共知也王師既收靈州不克狼狽而歸卒疲食盡失亡頗多西人知中國兵力所至自此始有輕慢之心是以明年邊臣築永樂城虜潛師掩襲覆軍殺將塗炭一城久之又舉一國之衆攻圍蘭州期於必取將士堅守僅而得全虜自是鋭氣小挫不敢輕犯邊矣臣聞此數寨之地中國得之雖無所利虜中失之為害頗多何則深入其境近其腹心常慮中國一朝討襲無以支梧不敢安居是以必欲得之不肯棄捨一年前虜嘗專遣使者詣闕深自辨訴請臣服如故其志無它止為欲求其舊境而巳朝廷既許其臣服虜來請舊境朝廷乃降指揮其前則云所以興舉甲兵夲欲執取罪人救拔幽辱非有意侵取疆埸土地而巳其後乃云止將巳得些少邊土聊示削罰豈可更有陳乞還復之理此則朝旨首尾已自相違又興師本為振拔秉常拒命者國人之罪豈可更削秉常之地於理差似未安王者以大信御四海羌戎雖微恐未易以文辭欺也於是虜既失望憤怒怨懟移文保安軍辭理不遜云今來賀正旦人使難議發遣自是正旦生辰乃至陛下繼明皆不遣使入賀其不臣大矣然而去歲四遣使者詣闕吊慰祭奠告其母喪并進遺物禮雖不備稍示屈服臣竊料虜意不出於三一者猶冀朝廷万一赦其罪戾返其侵疆二者陽為恭順使中國休息隂伺間隙入為邊患三者久自絶於上國其國中貧乏使者往來得賜賚之物且因為啇販耳昔衛二於晉晉取戚田及衛人既服郤缺曰日衛不睦故取其地今巳睦矣可以歸之叛而不討何以示威服而不柔何以示懷非威非懷何以示德遂歸戚田于衛今西人所為如此朝廷既不能拒絶勿受其使又不能招納與之更始彼來則迎送館榖以賔客待之不來則一無所問日復一日將踰二年臣竊意朝廷謂西人勢巳衰弱心實內附故來則不拒去則不追置之度外不以為虞殊不思去年前王師大舉深入將士所過烈於猛火割其疆埸屢請而不還彼怨毒欲讎報之心窺窬欲乘釁之意日夜不忘若渴者不忘飲盲者不忘視也譬如有虎狼在屋側垂頭熟寢人豈可見其不動狎而侮之循其頭躡其尾邪臣每思之終夕寒心以臣愚慮於今為之止有二策一者返其侵疆二者禁其私市何謂返其侵疆凡天子即位天地一新滌瑕蕩穢小大無遺昔趙他自稱南越武帝倔強嶺南漢文帝即位赦其大罪遣單使往諭之他稽首請服纍丗為臣李繼遷俶擾西陲十有餘年關中困弊真宗皇帝即位赦其大罪割靈夏等數州除其子趙德明為定難軍節度使由是邊境安寧者四十年此乃前丗及祖宗之成法非無所依據也今秉常之罪不大於繼遷也米脂等寨不多於靈夏也陛下誠能於此踰年改元之際特下詔書數其纍年不來賀正旦生辰及登寶位等不備之禮嘉其吊慰祭奠告國母喪進遺物之勤曠然推恩盡赦前罪自今以後貢獻賜豫悉如舊規廢米脂義合浮圖葭蘆吳堡安強等寨令延慶二州悉加毀撤除省地外元係夏國舊日之境並以還之其定西城蘭州議者或謂夲花麻所居趙元昊以女妻之羈縻役屬非其夲土欲且存留以為後圖猶似有名禦夷狄者不一而足俟其再請或留或與徐議其冝亦無所傷至於會州尚在化外而經略司遽稱熙河蘭會虜常疑中國更有闢境之心不若改為熙河岷蘭經略司如此則西人忽𬒳德音出於意外雖禽獸木石亦將感動况其人類豈得不鼓舞抃蹈丗丗臣服者乎議者或曰先帝興師動衆所費億萬僅得數寨今復無故棄之此中國之恥也昔漢元帝棄朱崖詔曰朕日夜惟思議者之言羞威不行則欲誅之通於時變則憂萬民夫萬民之飢餓與逺蠻之不討危孰大焉遂棄之此乃帝王之大度仁人之用心如天地之覆燾父母之慈愛盛德之事何恥之有國家方制萬里今此尋丈之地惜而不與萬一西人積怨憤之氣逞凶悖之心悉舉犬羊之衆投間伺隙長驅深入覆軍殺將兵連禍結如嚮日繼遷元昊之叛逆天下騷動當是之時雖有米脂等千寨能有益乎不唯待其攻圍自取固可深恥借使虜有一言不遜而還之傷威毀重固巳多矣故不若今日與之之為愈也此國家大事伏望陛下留神熟慮更與執政詳議以聖意斷而行之不可後時失此機會悔將無及何謂禁其私市西夏所居氐羌舊壤所産者不過羊馬氈毯其國中用之不盡其勢必推其餘與它國貿易其三靣皆戎狄鬻之不售惟中國者羊馬氊毯之所輸而茶綵百貨之所自來也故其人如嬰兒而中國乳哺之矣寶元慶曆之間元昊負恩僣亂屢犯邊境大入則大利小入則小利中國未嘗蹈其境破其軍禽其將屠其城有害於社稷也而首尾六年元昊遣使因緣邊吏卑辭納𣢾頓顙稱臣雖其惡積罪盈欲懷音革靣原其私心亦未必不貪中國之財思私市之利故也舊制官給客人公據方聽與西人交易傳聞近歲法禁踈闊官吏弛慢邊民與西人交易者日夕公行彼西人公則頻遣使者啇販中國私則邊鄙小民竊相交易雖不獲嵗賜之物公私無乏所以得偃蹇自肆數年之間似恭似慢示不汲汲於事中國由資用饒足與事中國時無以異故也陛下誠能却其使者責以纍年正旦生辰及登寶位皆不來賀何獨遣此使者拒而勿內明勑邊吏嚴禁私市俟其年嵗之間公私困弊使自謀而來禮必益恭辭必益遜然後朝廷責而赦之許通私市待之如初然邊民與西人交易為日積久習玩為常一旦禁之其事甚難何則若以常法治之則有司泥文動循繩墨追問證佐逮捕傳送之人停匿之家奏裁待報動涉半年如此則徒使邊民麗刑者衆獄犴盈溢而私市終不能禁也夫三尺之限空車不能登峭故也百仭之山重載陟其上陵夷故也今必欲嚴禁邊民與西人私市須權時别立重法犯者必死無赦夲地分吏卒應巡邏者不覺透漏官貟衝替兵士降配仍許人告捉獲者賞錢若干當日內以官錢支給更不以犯事人家財充如此則沿邊六路各行得一兩人則庶幾可以聳動人耳目令行禁止人不敢犯矣然人存政舉此事全在邊帥得人昔龐籍為河東經略使下令禁邊民與西人私市有熟户犯禁籍斬於犯處妻孥皆送淮南編管一境凛然無敢犯者其後施昌言為環慶路經略使亦禁私市西人發兵壓境昌言遣使問其所以來之故西人言無它事只為交易不通使者懼其兵威輒私許之法遂復壞若邊帥未能盡得其人則此法恐未易可行不若前策道大體正萬全無失也取進止辭放正謝第四劄子今月五日準尚書省劄子以臣前奏乞候所患稍痊安日依正月十四日十七日所降指揮減拜入謝及於景靈宫福寧殿神御前恭謝今月二日三省同奉聖旨依正月二十八日指揮臣聞君待臣以惠臣奉君以恭故能上下相親道用交泰陛下念臣衰老抱疾筋力尫羸特損朝儀以從私便陛下之大惠也若不知禮體有􅌤靣目坐受優恩曽無辭避是君有惠而臣不恭上行施而下無報臣雖頑昧心豈敢安伏望聖慈如臣前奏依正月十四日十七日指揮庶使微軀有地自處取進止乞未禁私市先赦西人劄子臣於今月三日上言以西人未服中國不得無憂而備邊不敢少弛不自揆其狂妄獻二策上策欲因天子繼統曠然赦之歸其侵地與之更始下策欲嚴私市俟其屈服然後赦之然禁私市甚難立法極嚴又邊帥得人然後能行不若前策之道大體正萬全無失也今竊聞執政用臣下策止令禁私市又立法不嚴邊帥未盡得人若邊吏拘文獲一漏百私市滔滔如故或此路禁絶而彼路放行如隄防一存一亡將何所益如此適足以激怒西人使益發悖心安肯屈服萬一微犯邊境或表牒中形不遜語至時朝廷轉難處置悔之無及不若用臣上策早相彌縫縱未欲還其侵地且下詔書責而赦之使彼此安心時難得而易失不可忽也况本欲因天子繼統蕩滌其罪今日行之巳為太晚若更遷延則赦之無名兹事繫國安危若俟執政論議僉同恐失機會誤國大事伏望聖意獨斷行之勿復有疑天下幸甚若有執政立異議乞令其人自立文字若依從其議它日因此致引惹邊事當專執其咎取進止又劄子臣於今月十二日上言乞以天子繼統曠然更始冝下詔數西人之罪而赦之縱未還其侵地且此策行以安邊境至今聞執政議尚未決臣之愚意以為封內未安未可圖外欲急行臣前策以羈縻西人且可數年邊鄙無事朝廷得休息戍兵安飬百姓待國力完備家給人足然後奮揚天威討二柔服何所不可若行臣前策可以萬全行臣後䇿有得有失豈可棄上䇿而用下策捨萬全而就有失也太平興國中李繼遷反西陲不解甲者十餘年關中困竭寶元慶曆之間趙元昊叛屢入為冦覆軍殺將自是中國虛耗不復冨實今國家理財未得其道民力困窮於下府庫窘乏於上又新遭大喪山陵才畢自去年十月初以來不雨雪旱勢甚大若萬一激怒西人微出一不遜語則并臣前策亦不可行矣今因天子即位未久西人外迹未有不順故臣願朝廷旦夕汲汲行之機會難得時不可失此臣所以惓惓進言不巳者也若萬一激怒西人致生邊患兵連禍結士卒殄盡於鋒鏑生民困竭於轉餉餓殍蔽地盜賊蜂起為國家慮豈不危哉而執政方以為西人微弱不敢動數遣使來誠心內附置之度外不以為虞今復固執先禁私市之議又立法不嚴邊帥不才者不先易去行之太早不能中節一旦禍生所忽邊鄙震驚乃始歸罪戎狄豈不害國事乎臣於今月三日上所言措置西邊事雖畫二䇿固以還其侵地責而赦之為上策嚴私市待其數年貧困來服然後赦之為下䇿所為絶私市非立法至嚴帥臣智勇此法恐未易可行不若前策道大體正萬全無失非臣前後返覆靜言庸違也朝廷比來擢臣於冗散之中使預聞國論蓋亦誤謂臣微有益於國家非徒采其虛名也臣不敢終辭亦欲竭盡疲駑少酬大恩非苟貪於祿位也今盡忠謀國而為衆所挫臣尚留此有何所用此國大事伏望陛下早審察二議從其長者若聖意以臣言為然乞御批依臣前䇿若降付三省樞密院執政仍有固守已見爭之最力者乞如臣前奏令自入文字言先禁私市保得它日必不致引惹邊事如其不然身執其咎取進止乞堅守罷役錢敕不改更劄子臣近以抱病家居恐溘先朝露無以少報盛德是以力疾貪陳所見竊以即日為小民病者無若免役錢欲乞悉行廢罷復祖宗差役舊法識慮愚短誠不意朝廷盡從其説非陛下明斷不能如是此乃天下之幸非獨微臣之幸也然臣聞令出惟行弗惟返彼免役錢雖於下戶困苦而上户優便行之巳近二十年人情習熟一旦變更不能不懷異同又復行差役之𥘉州縣不能不小有煩擾又提舉官專以多斂役錢為功惟恐役錢之罷若見朝廷於今日所下勑微有變動必更相告曰朝廷之勑果尚未定冝且觀望必競言役錢不可罷朝廷萬一聽之則良法復壞矣伏望朝廷執之堅如金石雖有小小利害未備俟諸路轉運司奏到徐為改更亦未為晚當此之際則願朝廷勿以人言輕壞利民良法取進止溫國文正公文集卷第五十
