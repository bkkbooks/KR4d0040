body:
  text: 章奏四十諡議附論監司守資格任舉主劄子舉孫凖自劾第二劄子辭明堂宿衛劄子辭提舉修實録劄子乞合兩省為一劄子乞令六曹長官專逹劄子乞令三省諸司無條方用例白劄子乞令監司州縣各舉按所部官吏白劄子乞不帖例貸配劄子再申明役法李文恭諡議錢宣靖諡議趙僖質公諡議侍衛親軍副都指揮使威塞軍節度使贈太尉馮守信諡議論監司守資格任舉主劄子臣竊見御史韓川上言諸路監司不當拘限資格專任舉主當令宰相自加選擇竊緣常調之人不可不為之立資格以抑躁進塞幸門若果有賢材朝廷自當不次遷擢豈拘此制凡年髙資深之人雖未必盡賢然纍任親民歷事頗多知在下艱難比於元不親民便任監司者必小勝矣朝廷執政止八九人若非交舊無以知其行能不惟涉徇私之嫌兼所取至狹豈足以盡天下之賢才若采訪聲譽則愛憎毀譽情偽萬端與其聽遊談之言曷若使之結罪保舉故臣奏設十科以舉士其中一科公正聰明可備監司誠知請屬挾私所不能無但有不如所舉者其舉主嚴加譴責無所寬宥則今後自然慎擇不敢妄舉矣至如楚潛等雖無聲名安知其無實用俟其到官無狀廢職并舉主坐之亦未為晚取進止舉孫凖自劾第二劄子臣先舉孫凖行義無假堪充館閣之選如後不如所舉甘當同罪近聞凖與妻家爭訟罰銅六斤臣奏乞連坐責降伏蒙聖慈批還云孫凖為家私小事罰銅安有連罪伏緣臣舉狀稱凖行義無缺今凖閨門不睦妻妾交爭是行義有缺於臣為貢舉非其人臣不敢逃刑况臣近奏設十科或有不如所舉其舉主從貢舉非其人律科罪雖見為執政朝廷所不可輟者亦須降官示罰臣備位宰相身自立法首先犯之此而不行何以齊衆乞如臣所奏從貢舉非其人律施行所貴率厲群臣審慎所舉取進止辭明堂宿衛劄子臣先奉聖旨將來明堂特與免侍祠攝事導駕及稱賀陪位肆赦立班止令宿衛在人臣恩禮優厚無以復加捐生隕命不足酬報然臣日近患左足掌砥腫痛全然履地不得跬步不能行未知痊愈之期所有將來明堂宿衛亦恐祗赴不得伏望聖慈特賜矜免乞恩不巳慚懼無地取進止辭提舉修實録劄子臣先奉勑提舉修神宗皇帝實録臣自受命以來以衰羸多病罕曽得到局供職日近又患左足腫痛不能履地日甚一日未有痊愈之期所有修神宗皇帝實録伏乞别賜差官提舉取進止乞合兩省為一劄子臣等聞三王不相襲禮五帝不相沿樂况國家設官分職張立治具上下相維修飭明備何所愧於漢唐何必事事循其陳迹而失當今之冝也謹按西漢以丞相揔百官而九卿分治天下之事光武中興身親庶務事歸臺閣尚書始重而西漢公卿稍巳失職矣及魏佐漢𥘉建魏國置祕書令典尚書奏事文帝受禪改祕書為中書有令有監而亦不廢尚書然中書親近而尚書踈外矣東晉以後天子以侍中常在左右多與之議政事不專任中書於是又有門下而中書權始分矣降及南北朝大抵皆循此制唐𥘉始合中書門下之職故有同中書門下三品同中書門下平章事其後又置政事堂蓋以中書出詔令門下掌封駮日有爭論紛紜不決故使兩省先於政事堂議定然後奏聞開元中張説奏改政事堂為中書門下自是相承至于國朝莫之能改非不欲分也理勢不可復分也故嚮日所謂中書者乃中書門下政事堂也唐末諸司使皆內臣領之樞密使參預朝政始與宰相分權矣降及五代改用士人樞密使皆天子腹心之臣日與議軍國大事其權重於宰相太祖受命以宰相專文事參知政事佐之樞密使專掌武事副使佐之自是以來百有餘年官師相承中外安帖百司長官及諸路監司諸州長吏皆得專逹或申奏朝廷或止申中書樞密院事大則中書樞密院進呈取旨降勑劄宣命指揮事小則批狀直下本司本路本州本人故文書簡徑事無留滯神宗皇帝以唐自中葉以後官職繁冗名器紊亂欲革而正之誠為正當然但當據今日之事實考前世之訛謬刪去重復去其冗長必有此事乃置此官不必一依唐之六典分中書為三省令中書取旨門下覆省尚書施行凡內降文書及諸處所上奏狀申狀至門下中書省者大率皆送尚書省尚書省下六曹六曹付諸案勘當檢尋文書會問事節近則寺監逺則州縣一切齊足然後相度事理定奪歸著申尚書省尚書省送中書取旨中書歸得旨送門下省覆奏畫可然後翻録下尚書省尚書省復下六曹方得符下諸處以此文字繁冗行遣迂回近者數月逺者踰年未能結絶或四方急奏待報或吏民辭訟求決皆困於留滯又本置門下省欲以封駮中書省録黃樞密院録白恐有未當若令舉職則須日有駮正爭論紛紜執政大臣遂成不協故自置門下省以來駮議甚少又門下不得直取旨行下雖有駮議必須却送中書取旨中書或不捨前見復行改易又內批文字及諸處奏請多降付三省同共進呈則門下之官巳經啇量奏決若復有駮正則為反覆又近日中書文字有急速者往往更不送門下省然則門下一官殆為虛設徒使吏貟倍多文字繁冗無益於事臣等今衆共商量欲乞依舊令中書門下通同職業以都堂為政事堂每有政事差除及臺諌官章奏巳有聖旨三省同進呈外其餘並令中書門下官同啇議簽書施行事大則進呈取旨降敕劄事小則直批狀指揮一如舊日中書門下故事併兩省十二房吏人為六房同共點檢鈔狀行遣文書若有溢貟除㨂選留住外並特與減三年出職不及三年應出職者與減磨勘年限若政事有差失委給事中封駮差除有不當委中書舍人封還詞頭又兩省諌官皆得論列則號令之出亦不為不審慎矣如此則政事歸一吏貟不冗文理不繁行遣徑直於先帝所建之官並無所變更但於職業微有修改欲令於事務時冝差為簡便其委曲條目並候得旨允許續議條立取進止月日中書侍郎臣張某等劄子門下侍郎臣韓某尚書右僕射兼中書侍郎臣某尚書左僕射兼門下侍郎臣某乞令六曹長官專逹劄子臣等聞王者設官分職居上者所總多故治其大要居下者所分少故治其詳細此理勢之自然紀綱所由立也是以周官小宰官府之六屬舉邦治大事則從其長小事則專逹凡宰相上則啓沃人主論道經邦中則選用百官賞功罰罪下則阜安百姓興利除害乃其職也至於簿領之差失期會之稽違獄訟之曲直胥吏之遷輔皆郎吏之任非宰相所冝親也故人有言察目睫者不能見百步察百步者亦不能見目睫言詳於近者必略於逺謹於細者必遺於大也今尚書省事無大小皆決於僕射僕射自朝至暮省覽文書受接辭狀未嘗暫息精力疲弊於米鹽細故其於經國之大體安民之逺猷不暇復精思而熟慮恐非朝廷所以責宰相之事業也竊以六曹長官古之六卿事之小者豈不可令專逹臣等啇量欲乞今後凡有詔令降付尚書省者僕射左右丞簽訖官告黃牒之類巳簽訖者更不簽分付六曹謄印符下諸司及諸路諸州施行其臣民所上文字降付尚書省僕射左右丞簽訖亦分付六曹本曹尚書侍郎及本廳郎官次第簽訖委本廳郎官討尋公案會問事節相度理道檢詳條貫下筆判云今欲如何施行次第通呈侍郎尚書若郎官所判巳得允當則侍郎簽過尚書判準應奏上者直奏上應行下者直行下即未得允當者委侍郎尚書改判事之可否皆決於本曹長官其文字分付本廳郎官之時委本曹長官隨事大小鑿限若有稽違即行糾劾即委的有事故結絶未得者申長官展吏部尚書如舊日判東而審官院左選侍郎如舊日判流內銓右選侍郎如舊日判三班院户部長官如舊日三司使刑部如舊日判審刑院舊日本司文字並直奏直下今欲令六曹長官準此更不經由僕射左右丞即改更條法或奏乞特旨謂如刑部刑名疑慮或情理可憫或情重法輕特乞停替編配事之類或事體稍大或理有可疑非六曹所能專決者聽詣傼射左右丞咨白或具狀申都省委僕射左右丞商議或上殿取旨或頭簽劄子奏聞或入熟狀或直批判指揮其諸色人辭狀並只令經本曹長官陳過尚書侍郎本廳郎官次第簽押判決一如朝廷降下臣民所上文字次第施行若六曹不為收接及久不結絶或判斷不當即令經登聞鼓院進狀降下尚書省委僕射左右丞判付本省不干礙官貟看詳定奪若本曹顯有不當即行糾劾所貴上下相承各有職分行遣簡徑事務辦集取進止月日尚書右丞臣吕某尚書左丞臣李某尚書右僕射臣某尚書左僕射臣某乞令三省諸司無條方用例白劄子勘會舊例只是前宫所行或是或非豈足永為後法近歲三省及百司多用例破條諸色人亦多於條外攀援體例希求恩澤欲令今後凡有正條者並須依條無條方許用例前例若是所當遵行前例若非即冝釐􅒝只委本省本曹本司長官相度理道與奪批判所貴向去漸除弊例乞令監司州縣各舉按所部官吏白劄子檢會監司知州通判於本部官吏內有罪惡顯著而有失覺察者並連纍責降雖有舊條然未嘗一一行遣又慮一路一州官吏衆多上位覺察不盡又未指定合覺察事件致寬者則一切不問急者則濫及無辜又凡為監司州縣長吏當進賢退不肖不可但令覺察有罪不令舉薦賢才今欲立舉薦四條一曰仁惠謂安民利物衆所畏愛非疲軟不立曲取人情者二曰公直謂心無適莫事不吐茹非內私外公實佞詐直者三曰明敏謂深察情理應幾辦事非飾詐掠美利口矜功者四曰廉謹謂安貧守分動遵法度非詐清釣名偷安避事者按察四條一曰苛酷謂用刑繁苛殘虐踰法者二曰狡佞謂傾險巧詐危人自安者三曰昏懦謂不曉物情依阿無守者四曰貪縱謂叨䬸無厭任情不法者凡監司州縣於所部之內皆得以此八條舉按官吏其舉薦者於本部官吏之內有仁惠公直明敏廉謹者可舉則舉無有定數縣舉之州州置簿記姓名州舉之監司監司置簿記姓名監司舉之朝廷中書置簿記姓名各隨所舉行能任使以試之果有實效則漸加旌異其按察者監司專按察知州軍通判路分都監以上知州軍通判專按察在州官吏及諸知縣知縣專按察簿尉及縣界內官吏若有苛酷狡佞昏懦貪縱者縣體量申州州體量申監司監司體量申奏續更體量的礭事迹糾發施行若有失察覺别致因事彰露其監司降知州軍知州降通判通判各降一資知縣降監當其餘所部官吏監司知州軍通判皆得按察但不坐失覺察之罪即挾情按察不以公者候勘鞫見實自依常法知縣惟得具事迹申州不得擅勘命官乞不帖例貸配劄子勘會守法者有司之職揆道者君相之權伏見從來命官犯罪大理寺既依法定斷更令刑部檢例或追官或勒停或衝替或差替之類朝廷依而行之謂之特旨凡人之罪犯千端而事體萬計豈可求其比類能得正同又既謂之特旨當臨時斷在朝廷若先令刑部帖例朝廷依此施行乃是輕重之權返在有司也欲今後應命官犯罪大理寺既定斷委刑部看詳內有法重情輕或法輕情重並具狀申中書省更不怙例委中書省官相度情理輕重同共啇量除依法外自貸命編配至特放臨時擬定進呈取旨施行其百姓犯大辟罪諸州奏稱刑名疑慮及情理可憫者大理寺依法定斷委刑部看詳委的有疑慮可憫之狀即具狀申門下省更不帖例委門下省官相度事理同共商量臨時擬定或依法或貸命編配進呈取旨施行再申明役法檢會二月六日勑文止是罷免役錢其諸色役人並依熙寧元年以前舊法委令佐揭簿定差尚慮諸路州縣利害各有不同所以下文云委逐縣看詳若有妨礙施行未得即具利害擘畫申州仰本州類聚諸縣所申擇其可取者具利害擘畫申轉運司轉運司類聚申州所申擇其可取者其利害擘畫奏聞其音欲使本州體量諸縣所申利害之虛實擘畫之是非擇其實而是者條例申轉運司云某縣當如何措置集縣當如何措置其餘巳依舊法定差施行轉運司得諸州所申亦如此體量條例申奏蓋欲隨處差役曲盡其冝非謂使逐路共為一法也今訪聞諸路轉運司不遵用熙寧元年以前舊法又不取諸州縣所擘畫各以己意撰成一路役法差官分詣諸州縣名為啇量其實諷諭令隨巳意却作州縣擘畫立法申奏州縣稍有違異輒加責怒以此多不依應得逐處利便不合民心又諸路州縣見朝廷置詳定役法所以為當别撲役法頒下往往等候下即定差殊不知看詳役法所專候諸路州縣具到利害擘畫即依一路一州敕行下以此觀望遷延久不了絶今欲特降指揮下諸州縣除有舊法妨礙難行之事速具申陳外其餘並依舊法一面定差其看詳役法據逐處先申到利害擘畫事件如得允當逐旋奏乞令本處依此施行所貴差役之法日近早見結絶諡議故參知政事贈僕射李文恭公諡議議曰僕射稟秀美之氣函純一之德剛柔得中華實兼茂越自衡泌奮飛天朝回翔禁垣遂贊大政咨命不永奄忽遷徂自時迄今垂七十載令問休暢決然未息紳辨之士流為美談謹按諡法忠信接禮曰文不懈于位曰恭夫事親盡誠與人不欺行有標的言有規括忠信接禮之謂矣光輔神宗億安四海邁其懿德倡率士民不懈于位之謂矣請諡曰文恭謹議錢宣靖諡議議曰令公仁惠足以布政明智足以建功清修足以服人寬𥙿足以容衆與物無競執議甚堅泊乎如淵撓不可濁介乎如石重不可移信尚德之君子全節之正人矣而又講學不倦好謀而成文以美身忠以贊國謹案諡法善問周逹曰宣和德考衆曰靖令公論撰常典發揮聖政使祖宗之烈燭耀無窮是不亦宣乎關領樞機謀謨帷幄六師輯睦夷夏乂安是不亦靖乎請諡曰宣靖謹議趙僖質公諡議議曰少傅體和居厚履恭涵一言必有物動不近名矯迹衡茅濯羽雲漢入贊樞極出殿藩維謹案諡法小心恭慎曰僖言行相應曰質少傅內則造辟盡忠外則騰章建畫親昵有問應以他言可不謂僖乎歷事三朝始終一節不賁飾以譁衆不激訐以髙人可不謂質乎請諡曰僖質謹議侍衛親軍副都指揮使威塞軍節度使贈太尉馮守信諡議議曰昔者晉人不恭敢距大邦負固阻兵趂趄不庭太宗征之霆駭風趨狐狼之墟化為樂都混一之勳太尉與焉玁狁孔熾整居幽冀縱騎鳴弦至于澶淵真宗一麾電卷雲披剪其酋豪鳥潰麋逃砥寧之功太尉在焉天下既平蜚遊不驚符瑞充盈登休薦成和鸞四巡萬乘星陳東暨云亭西涉河汾警蹕之清太尉扈焉白馬之河漏為橫波濟澤之阿閭殫可歌隤林仆竹薪石相屬淵吐其陸莓莓衍沃隄防之勞太尉董焉謹案諡法能修其官曰勤猛以強果曰威迹其夙夜在公臨敵剛決榮祿昭融令問始終考於二法可謂協矣諡曰勤威謹議溫國文正公文集卷第五十五
