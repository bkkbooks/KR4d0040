  text: 溫國文正公文集卷第九
  hash: sha256:c6bf11d127fe9ca23fce4040e47bbc01dae63c749aa05133c6afe3bb87fe6e90
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_009-1a}
body:
  text: 律詩四秋夜再呈冝甫冝甫家有金鈴菊客未之識因代菊贈冝甫深夜奉和始平公喜聞昌言修注秋雨霽倐聞宗聖案伎應之飲酒詩呈冝甫冝甫東樓晚飲送魏寺丞廣赴辟秦州判官昌言謫官符離有病鶴折翼舟載以行及還修注始平公以詩問之命光同賦二首和聶之美重遊東郡二首大熱夷齊清風臺巳下十七首並和何濟川漢州西湖雜詠佇月亭藥圃竹塢射綳玉徽亭書樓朔㑹堂浮醳亭清燕亭流芳橋曉景亭假山探花橋樂軒坐船枇杷洲寓泊鄭圃寄獻昌言舍人奉和始平公憶東平和運使舍人北園餞别行憩三交僧舍冒雪宿百井閞見寄又和留題定襄驛又寄獻自嘲晉陽三月未有春色柳溪對雪酪羹奉同道矩謝始平公惠硯陪始平公燕柳溪送王都官淑字元之官滿還都到并州已復數月率爾成詩和道矩送客汾西村舍杏花盛開置酒其下北軒老杏其大十圍春色向晚止開一花余憫其憔悴作詩嘲之杏解嘲寄陜西提刑江學士從始平公城西大閲陪諸君北園樂飲和道矩紅梨花二首和懋賢聞道矩小園置酒助以酒果副之以詩數日不至後圃今晚偶來芳物都盡率然成詩和樂道自河外南轅過冝芳雨晴氣和景物可愛馬上偶成夏日晨發故關寄逢吉中秋夕始平公命與考校諸君置酒賦詩病酒呈晉州李八丈和李八丈小雪同㑹有懷鄰幾三月晦日登豐州故城送張學士師中字吉老兩浙提點刑獄賦得清字寄聶之美之美時監韶州錢監又寄送昌言舍人得告還蜀三首祁國正獻公挽歌三首社相侍讀王文公挽歌二首相國廣平文簡程公挽歌二首送王書記申字應辰之官永興和錢學士公輔字君倚呈邵興宗曉思送朱職方處仁字表臣提舉江淮運鹽送次道知太平州送蘇屯田宷字公佐知單州蘇先君嘗知單父縣君倚示詩有歸吳之興為詩三十二韻以贈喜聖民得登州詩寄雲夫處士老兄兼呈知府待制八丈和任屯田逈字元道感舊叙懷送李學士及之字公遠使北送薛水部十丈通判并州送祖擇之守陜奉和鄰幾六月七日文德殿觀文武百官等上尊號十五韻和始平公郡齊偶書二首感興寄聶之美八月七日夜省直苦雨三首次韻和鄰幾秋雨十六韻紫微石舍人挽歌二首次韻和沖卿中秋朧月次韻和鄰幾九月五夜省直吳正肅公挽歌辭三首和鄰幾金鈴菊送賢良陳著作舜俞簽書壽州判官秋夜城上調秋角煙間發瞑鍾風枝搖宿鳥霜草覆寒蛩久負觀書樂端愁束帶恭暫因群吏散還得遂幽慵再呈冝甫西家壷巳倒次第向東鄰朱戶如堅閉黃花惡笑人冝甫家有金鈴菊客未之識因代菊贈冝甫主人倦邀客寂寞委蒼苔此日開無益明年不復開深夜踈星映戶月流天群動收聲四寂然嗟爾寒蛩怨何事悲吟徹曙亦無眠奉和始平公喜聞昌言修注鳯口除書下九閽簮紳拭目仰殊恩曉提麟筆依華蓋日就螭拗記聖言桃李新隂方藹藹驊騮老志更軒軒主人喜見相如逹趣召鄒枚洗玉樽光與昌言俱出始平門下身亡時年五十九秋雨霽倐聞宗聖案伎應之飲酒詩呈宜甫寒風細雨未晴天密似輕塵薄似煙一室獨吟圗史亂四鄰髙㑹綺羅鮮鴈飛斜柱絃隨指蟹薦新螯酒滿船自笑不歌仍不飲昏昏只解枕肱眠冝甫東樓晚飲賔主俱歡醉髙樓逈倚空形忘羈檢外酒散笑談中晚市煙初白秋園葉半紅登臨不厭數朝夕是寒風送魏寺丞廣赴辟秦州判官征西大府開後乘得髙材區脫烽煙靜渠搜職貢來隴雲低玉帳羌舞奉金罍信美從軍樂修梧荗帝臺昌言謪官符離有病鶴折翼舟載以行及還修注始平公以詩問之命光同賦二首曽下青田啄玉苗泥沙病羽久蕭條謫仙不欲留塵丗依舊提擕上碧霄相閣書傳紫闥深破緘先問九臯禽不令一物傷天理仁愛方知真宰心和聶之美重遊東郡二首躍馬津亭未幾何官逰容易十年過飄颻空似隨流梗寂寞猶為挂壁梭西嶺應餘當日翠南湖真減幾分波之美亡南浦比舊水涸過半輸君尚得飛征蓋重向春園聽舊歌又南湖重過又逢春官柳雖踈亦解新臺榭傾欹賔友散臨風愁殺獨遊人大熱山澤欲焦枯炎光滿太虛不知天地外暑氣復何如夷齊夷齊雙骨巳成塵獨有清名日日新餓死溝中人不識可憐今古幾何人清風臺巳下十七首並和何濟川漢州西湖雜詠太守金閨客天朝應對才非因板輿戀寧駕使車來水鑑秋毫盡霜鋒錯節開清風遍千里不獨此髙臺佇月亭燈火動漁磯湖邊過鳥稀孤蟾久未上五馬不成歸長嘯風生座髙吟露滿衣間情無日厭岸幘對清輝藥圃三蜀膏腴地偏於藥物冝小畦千種聚春雨一畨滋山相慙多識桐君未遍知他年似胡廣飬壽復扶襄竹塢二何迹相繼竹塢日隂森濟川詩注云前守何修撰不伐西湖竹余亦遵之欲識飬民意先觀愛物心低垂樽俎冷密映管絃深勿怪湖光少年來碧影侵射堋疊鼓花前急紅旌竹外髙驚飈分白羽餘響振烏號壯觀傾春陌歡聲涌夜濤因兹形禮俗豈獨事遊遨玉徽亭房公昔漂泊置酒此鳴琴人事有憂樂山光無古今風流俱寂寞結御名尚蕭森松竹含虛籟猶疑絃上音書樓使君有書癖記覽浩無涯况此孤樓逈端無外物譁橫肱欹曲几搔首落烏紗此趣人誰識長吟窗日斜朔㑹堂朔旦集僚吏兹堂簪組繁舞空孤鶴下映日兩鳬翻花散東方騎萍浮北海樽須知太守貴鐃吹引朱􅙲浮醳亭曲水華榱下浮觴去復還浪搖花影碎日射酒缸殷滅沒遙尋客裴回怯度灣窮歡不知醉清泚照心顔清燕亭波澄䕃群木永日湛清華碧篠靜秋色白蘋低晚花松聲工醒酒泉味最便茶外事付丞掾無妨風景嘉流芳橋橋下流芳度餘春日夕催呼人洗樽斚招客藉莓苔倚柱時流滯隨波乍往回仙家如不近安得此花來曉景亭簾櫳分曉色逺樹子規啼濃露侵衣冷晴煙壓水低神遊靈境健身入畫圗迷衙吏無煩報汀洲鷺正棲假山廣漢土平逺巳嫌丘壑踈呼工刻巖洞應手出庭除縹眇神仙宅嵌空虎豹居人功與天力秀絶兩何如探花橋橋邊春意近五馬屢徘徊湖水旦暮緑林花早晚開適因嘗酒到又為賦詩來借問雙華表經過日幾回樂軒繁絃凝渌水疊鼓摻漁陽風結舞𥘉急塵飛歌正長鳬鷖爭上下棟宇為低昂太守且安坐新聲未遽央坐船使君張皂蓋髙宴碧湖心苒蒻牽菱蔓夷猶泊栁隂晚風侵坐冷春浪沒篙深倒載歸何晚波間夕照沈枇粑洲周官斂珍味場人掌國之場圃而樹之果蓏珍異之物以時斂而藏之鄭康成曰珍異蒲桃枇杷之屬漢苑結芳根𥘉修上林苑群臣逺方各獻名果異樹有枇杷十株何意荒洲上猶餘嘉樹存犯寒花巳發迎暑實尤繁願逐蒲萄使離宫奉至尊寓泊鄭圃寄獻昌言舍人旅食緇衣館飄蓬恍自迷樹撗寒霧逺山隱古原低愁暮空庭雀驚晨别墅雞故人何處在依約玉繩西奉和始平公憶東平相印東臨汶水陽兩看春葉與秋霜登山置酒延鄒湛上馬回鞭問葛強溪竹低垂寒滴翠露荷相倚淨交香宵衣深念長城固肯待從容傲醉鄉又千巖秀色擁晴川万須陂光上下天委地魚鹽隨處市蔽空桑柘不容田訟庭虛靜官曹樂儒服寬長邑里賢不為從知方負羽獨乘漁艇老風煙和運使舍人北園餞别行憩三交僧舍冒雪宿百井關見寄驪駒北上雪孱顔䪍矢前驅度漢關僧室松杉清照眼驛亭煙火逈依山馬銜邊草枯猶瘦鴈怯胡雲冷未還賤子不須回首問鬢毛蕭颯簿書間又和留題定襄驛按節羊腸阪褰帷並塞州仁風熙愛日清德凛髙秋甘澤隨征蓋華星近戍樓他年叱馭事直筆寄歆彪又寄獻承明共直廬瞬息八年餘幸託屏星駕前迎使者車跡雖殊貴賤心不置親踈青眼披情素猶如相見初自嘲英名愧終賈髙莭謝巢由直取雲山笑空為簮組羞浮沉乖俗好隱顯拙身謀惆悵臨清鑑霜毛不待秋晉陽三月未有春色天心均煦嫗物態異芬芳上國花應爛邊城柳未黃清明空改火元巳漫浮觴仍說秋寒早年年八月霜柳溪對雪春風不勝雪散漫渡蕪沙密映緣溪柳爭飛亂眼花鴟夷賖美酒油壁繫輕車塞下芳菲晚聊將當物華酪羮軍厨重羊酪饗士舊風傳不數紫蓴滑徒誇素鮪鮮􅪈蠡煩同取勺藥助烹煎莫與吳兒說還令笑茂先奉同道矩謝始平公惠硯爵臺今已傾飄瓦出蕪城還入縑緗用尤資筆墨精相君憐古物白史擅書名聊用飛軍檄何愁楯鼻平陪始平公燕柳溪溪光不動柳風輕玉帳森沈擁萬兵鷗入煙中間自舞魚翻波靣喜相迎樓船下視晴天碧鼓吹前驅逺陌清桃李歸時應盛發薰然和氣滿春城送王都官淑字元之官滿還都粹美清廟器可嗟沉下僚優游仲舉坐洋溢海沂謡奏課應居首知音况滿朝從今黃鵠舉眼冷看青霄到并州已復數月率爾成詩忽忽此何地經時更自猜深疑醉裏得復似夢中來薄官真何益浮生信可咍鵬蜩定有分不若寸心灰和道矩送客汾西村舍杏花盛開置酒其下田家繁杏壓枝紅逺勝桃夭與李穠何事偏冝間處植無端復向别時逢林間暫繫黃金勒花下聊飛瑪瑙鍾㑹待重來醉嘉樹只愁風雨不相容北軒老杏其大十圍春色向晚只開一花余憫其憔悴作詩嘲之春木爭秀發嗟君獨不材須慙一花少強逐衆芳開頑豔人誰采微香蝶不來直為無用物空爾費栽培杏解嘲造物本非我榮枯那足言但餘良幹在何必豔花繁壯麗華林苑歡娛梓澤園芳菲如可采豈得侍君軒寄陜西提刑江學士明主於庶獄選才從本朝鄼侯三尺律漢使一封軺郡國清名滿關河古意饒淒涼乘障客華髮日蕭蕭從始平公城西大閲滄溟浴日照春臺組練光中玉帳開汾水騰凌金鼓震西山宛轉斾旌回逍遙靜散晴空雨叱咤橫飛逈野雷坐鎮四夷真漢相武侯空復道英才陪諸君北園樂飲浩歌縱飲任天機莫使歡娛與性違玉枕醉人從獨卧金羈倦客聽先歸須知㑹府間時少况復邊城樂事希花卉正濃風日好今年巳不負春暉和道矩紅梨花二首繁枝細葉互低昂香敵酴醾豔海棠應為窮邊太寥落併將春色付穠芳又蜀江新錦濯朝陽楚國纎腰傅薄粧何事白花零落早同時不敢鬪芬芳和懋賢聞道矩小園置酒助以酒果副之以詩芙蓉幕下惜餘間不使芳華取次殘珍果醇醪與新句併將佳味助清歡數日不至後圃今晚偶來芳物都盡率然成詩爛漫不解賞飄零空慘悽殘紅正滿地不忍踏芳蹊和樂道自河外南轅過冝芳雨晴氣和景物可愛馬上偶成京洛春應老河邊初解顔碧浮煙際草翠滴雨餘山目極褰帷外詩成攬轡間滿川桃李色共喜傳車還夏日窮邊已深夏氣色耿清秋鮮旭開山郭凉煙淡戍樓兜零烽火息區脫虜塵收逮此軍中暇無妨文雅游晨發故關寄逢吉畫㦸衣中趨絳帳驛亭門外拂征鞍巳嗟漂泊三年別更負從容十日歡暖席未窮談笑樂陟岡相望滯留難揚鞭䇿馬幾多意原上秋風作曉寒中秋夕始平公命與考校諸君置酒賦詩月華秋色兩鮮新萬里澄空不受塵兔濯素毛騰浩露桂飄香實下飛輪光侵酒面寒無力清入詩豪健有神座客何須辭醉倒相君應不惜車茵病酒呈晉州李八丈身如五嶺炎蒸裏心似三江髙浪中誰道醉鄉風土好舟車常願不相通和李八丈小雪同㑹有懷鄰幾天祿淹回德齒尊暫留汾曲兩朱轓間軒坐嘯正飛雪同舍倦游來及門空嘆髙歌如郢客愧無佳賦似文園坐中猶缺鄰幾在深負棊枰與酒樽三月晦日登豐州故城春盡蕪城天一涯白榆生莢柳生花滿川戰骨知誰罪深屬來人戒覆車送張學士師中字吉老兩浙提點刑獄賦得清字朝家重典刑書府惜時英鉦鼓喧江下雲山拂眼清秋風鱸鱠美晝日錦衣榮勿似朱翁子空令守邸驚寄聶之美之美時監韶州錢監去歲雙毛白今春一齒零人生浮似葉客官泛如萍塞上貂裘弊天涯海氣腥何當占箕頴蕭散並柴扃又寄心目悠悠逐去鴻别夾容易四秋風莫嗟密密書連𥿄萬里經年信一通送昌言舍人得告還蜀三首迢遞銅梁道凝嚴青瑣闈負書當日去鳴玉此時歸鄉樹迎朱轂江花照錦衣臨卭不足並榮耀古今稀又悽愴懷桑梓劬勞詠蓼莪樹風今逺矣鼎食奈悲何劒閣登車近秦關屈指過騰裝才首路夕夢巳江沱又冨貴動歸思來光里閭戒門羞主父負弩笑相如外物有榮悴中心無戚踈遙知見親舊不改布衣𥘉祁國正獻公挽歌三首杜相舟楫才猷大氷霜德操堅陶鈞成茂業書史樂髙年瞻望簮紳共吁嗟館舍捐舉時無異諭方信今名全又釣玉吳臺舊詠茅梁苑新位登華衮貴家似布衣貧直道髙當丗清風遺後人千秋寒照目竹帛不捿塵又先子同烏府知音誠皎然脫纕來拜伏撫首辱哀憐逮此泉扄掩空悲塵網牽無由懷酒絮撇涕望新阡侍讀王文公挽歌二首石室書編冨金華講席重薦紳歸博洽鳴玉稱雍容二負纍囚象尸臣古瑑蹤老成今巳矣咨訪欲誰從又杯底潜蛇影門隂集戴鵀玉樓新記就石槨舊名沉篋有封巒扎籝無遺子金寂寥封馬鬛秋色淨松林相國廣平文簡程公挽歌二首明直君臣合安危將相兼金章四輔貴玉帳萬兵嚴禦侮長城隱臨繁利刃銛南山霣巖石何以慰民瞻又帝誥封泥紫皇墳殺簡青坐談安玉壘專對讋龍庭黼黻昭文理氷霜瑩典刑英靈入箕尾終古作天星送王書記申字應辰之官永興白髮添新鑷紅塵滿弊衣人生適未值吾道豈云非鞏洛風煙逺函秦草樹微長安春酒美行樂勿令希和錢學士公輔字君倚呈邵興宗霜露蒼蒼宰樹髙纍茵列鼎重鴻毛蒹葭自幸猶依玉髖髀何能學奏刀才薄無由禆覆燾命竒不得報劬勞光任始周歲二親繼喪平生念此心先亂蓼蓼難分莪與蒿曉思束帶朝尚早蓬門未脫扃短籬潜落月老樹戴孤星隱几貂裘黑開編竹簡青子雲非執㦸何以得窮經送朱職方處仁字表百提舉江淮運鹽熬漉滄波耗征輸澤國貧嬰羅矜赤子運策借能臣拜手觚稜曉浮舟狼湯狼音浪湯音宕見地理志滎陽春東南待蘇息别酒莫逡巡送次道知太平州狼湯春流滿蕪湖候吏迎旌旟曉日麗鉦鼓野風清暫喜紅塵逺休嗟素髮生專城方四十自古以為榮送蘇屯田寀字公佑知單州蘇先君嘗知單父縣佳郡望都城相聞擊柝聲賔朋才執别耆舊巳前迎綵服當年戲驪駒此日榮絃歌應盡在琴調不須更君倚示詩有歸吳之興為詩三十二韻以贈吳越為君土崤函是我家濯纓從吏事傾蓋聚京華奕丗交朋重二先君景德二年同年進士同僚分誼加光與君倚崇文吏部開封皆同官聲光嘗耳剽臭味辱肩差選士參縣石蒸髦應㭬罝帝畿圍日月蓬渚積煙霞咨訪傾肝膽推褒借齒牙後來慙瓦礫旁倚愧蒹葭談論寥天一詼諧老柏塗虛舟坦莫逆璞玉瑩無瑕信美陪遊衍胡為起咄嗟勞歌盡鄉思旅夢各天涯誠厭簮紳纍難堪獄訟譁缿筒朝插蝟貫索暮如麻霡霂霑朝服蜩螳沸尹衙宿姦牢窟宅弊俗費鞭檛鮆鱠思吹絮吳中食鮆以楊花為候羊羮憶卧沙關中羊有卧沙細肋梅林連雨熟梨味得霜佳秋色城臨水春風路入花稻肥初斷蟹斷蟹事見笠澤叢書桑密不通鴉秦人謂桑密有鴉飛不過之語蹙衄浮盤芡鉤聮卧壠瓜江蓴半卷葉石蕨乍舒芽風物隨鄉樂山川苦道遐若人才有𥙿修己德無邪正恐臨髖髀安能舍鏌鎁怒飛期寖逼肥遁迹猶賖不比溝中木微同井底蛙果能真引去誰復強邀遮旋結蝸牛舍還乘下澤車間門常友拒醉幘任欹斜林野遊如鹿泥塗蟄似蛇故人時記憶陽羡致新茶喜聖民得登州晝日少間暇中霄夢亦勞符移空浩浩榜楚鎮謷謷敢說今求郡畨思昔坐曹羡君乘五馬東去一何髙詩寄雲夫處士老兄兼呈知府待制八丈一鶚曽飛奏中林下鶴書今乘使君馬重到逸人居松竹過從久閭閻惠愛餘只應棠樹影比舊更扶踈和任屯田逈字元道感舊叙懷結交英俊樂如何風誼敦明寄詠歌自致青雲今有幾化為異物巳居多櫝中本自沽良價毫末安能滑至和鄰笛不堪頻嘆息酒壚那得重經過年華易度窗塵影人事難期海水波賢業著鞭猶可在况君壯齒未蹉跎送李學士及之字公逺使北征蓋霜空逈飄颻迎塞鴻虜牙侵海角漢節下天中酒薄隂山雪裘寒易水風邊聲不可聽歸思浩無窮送薛水部十丈通判并州十萬貔貅士旌旗晉水陽元戎倚耆碩别乘選才良秀直寒松節精明利劒鋩知君留滯久從此欲騰驤送祖擇之守陜聲教空巖穴夫君集帝庭辝華動丹扆光價塞青冥俊德爭推載榮塗易建瓴陸離寒水玉磊落曙天星得喪誰先識艱虞困屢經蹉跎渥窪足漂泊鳯凰翎粉署疏恩紀井棠寄典刑仁風思布護疲俗待綏寧賤子良多愧餘光每乞靈題名聮士版占籍備民丁種種顛毛白蕭蕭壟柏青陌頭瞻皂蓋獨立涕飄零奉和鄰幾六月七日文德殿觀文武百官等上尊號十五韻舜禹曽何與羲農實強名含靈徒叶贊造物始無情閶闔非煙淡觚稜曉氣清葳蕤大衢隘殷轔外朝盈鮮旭分衣繪薰風拂佩瓊華顛方內集殊俗海隅傾棨㦸金閨奧囊書赭桉橫敷言齊列位稽首從群卿不報乾坤施難圗日月明仁心由性得治體與時行金石皆中𣢾丹青豈外榮功歸元首重澤及草茅輕業業沖虛意區區愛戴誠何為猶讓德不以慰懷生退復歌天保期於采頌聲和始平公郡齊偶書二首文武從容兩有餘公槐將幕往來居巳安四海如三傑欲散千金比二踈今日監邊親跪轂他年入殿賜乘車武侯暫為蒼生起長憶隆中卧舊廬又平安候火出雲間區脫無塵刀斗間漢相威聲遙制敵胡兵逺迹夜開關赤松雅意思輕舉黃閣群心望復還玉帳牙旗空壯觀謝公髙興在東山感興寄聶之美平生百無可強為一官縻丗味偏余薄心期獨子知林猿愁玉鎖櫪馬患金羈年事今華髮求榮欲為誰八月七日夜省直苦雨三首夜色槐隂重雨聲官舍寒野農安敢問環堵未能完盡日流雲度何時大塊乾正愁開霽晚霜露滿紅欄又悵望中秋月於今巳上弦明生圭樣小影露桂華偏幽恩邈難致浮雲去不還何當出隂翳清徹照中天又菊蘂如排粟青青見葉心未嘗窺白日何以散黃金欹側踈籬短綿延蔓草深寒蛩爾何與終夕亦悲吟次韻和鄰幾秋雨十六韻氣象殊朝夕興居錯晦明混元初不宰霪雨浩無程墊隘寧天意咨嗟固物情曣㬈方有望蔚薈已隨生杲杲升還隱淒淒斷復行亂莎長被徑荒蘚緑緣甍轍跡康莊絶潢汙壠畒平茅茨不足庇禾黍若為成蟋蟀頽墻泣伊威壞竈盈乘時衆鷗舞得意怒蛙鳴牛馬誰分異蕭蘭已混并居間猶回度負重况遐征舟泊川無渚輪摧路有坑轑羮愁病婦焬竈擁寒嬰災不妨明德神應格至誠淳光終下燭時藿久心傾紫微方舍人挽歌二首地勝岷峨秀時清俊乂生楊雄晚得祿何武少知名性有圗書癖心忘紱冕榮前年歸諭蜀不使里人驚又顧我非君比最為相得歡平生遊處久美行始終完長夜忍埋玉秋霜不借蘭西風濕襟袖空有涕䦨干次韻和沖卿中秋朧月豈無錦幄翠簾垂匝樹明燈正赫曦共惜月華方滿夜更當秋色中分時烏皮几穩風侵鬢白玉樓髙冷透肌千里浮雲何處斷北來試問鴈應知次韻和鄰幾九月五夜省直群騶布路歆瘦馬解鞍回雨闋蟲聲樂秋深菊意催圗書紛自適僚友邈誰陪何以銷寒夜殘醪不滿杯吳正肅公挽歌辭三首皇家延茂異鶚立逈無倫髙議誰能奪英才自有真驊騮寧受縶水鑑不捿塵試為咨清論風流第幾人又辭華巳獨步政治復無前吏不容三冗民皆戴二天於今知和寡自古愰才偏惆悵棠隂下仁風尚藹然公再為陜牧光實陜人知公之政又念昔少年日謬登君子堂重言何以稱厚德不能忘光皆以文請見公答以長歌過有褒美玉麈聲容在泉臺歲月長慿誰寄清淚為我灑松岡和鄰幾金鈴菊何處見佳菊秋風汶水陽酒浮金鐸細露泛蜜房香不謂紅塵地相逢君子堂依然故人意不減舊芬芳送賢良陳著作舜俞簽書壽州判官海隅方萬里豪俊幾何人百汰求才盡三薰得士新聲華四方聳器業一朝伸他日蒼生望非徒澤壽春溫國文正公文集卷第九
