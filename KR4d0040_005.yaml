body:
  text: 古詩和利州鮮于轉運件字子駿公居八詠桐軒竹軒柏軒巽堂山齋間燕亭會景亭寶峯亭題太原通判楊郎中希元新買水北園首夏二章呈諸鄰酬安之謝藥栽二章雨中過王安之所居不謁以詩寄之送藥栽與安之張明叔兄弟雨中見過弄水軒投壷賭酒薄暮而散詣朝以詩謝之小雨渴中書事二絶送劉付通知涇州和復古大雨南園雜詩六首見山臺晝卧偶成修酴醿架螢明叔家瑞蓮蓮房不寐苦雨八月十五日夜宿南園懷君貺八月十六日過天街懷景仁宿南園九月十一日夜雨宿南園韓秉國寄酒兼見招以詩謝之子厚先生哀辭張載古墳酬趙少卿丙字南正藥園見贈登封龐國博元常字君隱年三十八自云欲棄官隱嵩山作吏隱庵於縣寺俾光賦詩勉率塞命暮春同劉伯夀史誠之飲宋叔達園用前韻再呈示道人謝君貺中秋見招不及赴久雨效樂天體聞景仁遷居許昌為詩寄之送張伯常同年移居郢州南園飲罷留宿誥朝呈鮮于子駿范堯夫彛叟兄弟自用前韻不寐招子駿堯夫和家兄喜晴用安之韻病中子駿見招不往兼呈正叔堯夫時正叔約次日為會和子駿秋意龍門座中呈子駿堯夫六言園櫻傷老也和景仁緱氏别後見寄求決樂議雖用其韻而不依次蓋景仁才力髙逸步驟絶群非駑拙所能追故也和秉國招景仁不至云方作書與光論樂同子駿題和樂亭和利州鮮于轉運侁字子駿公居八詠桐軒朝陽升東隅照此庭下桐菶菶復萋萋居然古人風踈柯青玉聳密葉翠羽蒙午景疑餘清夕照留殘紅雨響甍棟外風生户牖中主人政多暇步賞常從容終當致威鳯覽德鳴噰噰又將施五絃解愠歌帝宮竹軒兹軒最灑落歷歷種琅玕正晝簿書稀蕭蕭風雨寒翠隂涼宴坐踈韻承清歡錦籜裁夏扇玉筍供春槃晴蝸潛葉底暝雀投林端幽興遇物愜髙懷隨處安且免一日無何須千畝寬柏軒凛然陵霜色本自生丘壑徙之君子庭栽培固不薄靜夜聲飂飂清晝隂漠漠秀氣逼簷楹翠影通簾箔知君棟梁材大匠偶未度但守歲寒心間軒赤不惡巽堂華堂選形勝地直巽之隅主人心潔齊公間此燕居西來故鄉客東過朝大夫時運志所愜下榻同歡娛琴碁間壷觴賦詠雜歌呼民間既羲皇席上冝華胥每思就一醉幸無官守拘蔡何三千里風埃與泥塗山齋幽蹊入桃李危棧蟠林麓行行忽虛敝髙齋出山腹園圃近指掌郊郭紛盈目春老酴醿香夏淺篔當緑條橫喜罥衣笋迸乍穿屋秋江澄可卷冬嶺翠如撲煙間漁艇小寒外村居獨燒轉望畬田響答聆伐木驚麏挺走險鴈禽嚶出谷物華時變更興趣日相續誰知使者尊常著野人服肯以駟馬榮區區詫鄉族間燕亭吏治正倥􅘓夫君何燕間􅗀絲既云寡符移皆可刪子駿奏減役錢幾半朝廷是之印封從事散躡屣升東山放杖坐危亭清嘯出雲間無私席賔少忘機林鳥還野人瞻翠微稽首雙眉斑會景亭景物浩無窮兹為一都會之人心若鑑萬狀靜相對喬林擁砌底修嶺倚窗背流雲過席上去鳥出天外徐徐杖屨整藹藹郊原晦來往亦何為逍遙真樂內寶峯亭孤亭冠山椒下視物不隔六合縱心賞萬家窮目力髻鬟烏奴翠衣帶嘉陵碧霞生白水尾日沒九隴春煙凝朝夕市塵飛往來驛雖復對紛紜何嘗改岑寂實兼觀風逺非徒選勝適巴峽少平田每若天宇窄及兹伏櫺檻坐瞰南北極先君昔乘軺名題古寺壁侍行尚垂髫孤露今戴白讀君登臨詩舊遊皆歷歷永無膝下歡終篇涕霑臆光天聖中侍先君為利州路轉運使題名諸寺子駿皆為之刻石題太原通判楊郎中希元新買水北園洛陽名園不勝紀門巷相連如櫛齒修竹長楊深徑迃令人邑邑氣不舒愛君買園中橋北堂壓崖端跨空碧滿川桃李皆目前近水逺山一朝得曽陪尊兄此高會豁然如出樊籠外暫遊尚爾況久居勝氣清風日相對易生畫筆丗所珍麞猿滿壁皆逼真并州近胡沙塵惡終更早來為士人首夏二章呈諸鄰首夏木隂薄清和自一時筍抽八九尺荷生三四枝新服裁蟬翼舊扇拂蛛絲莎徑熱未劇晨昏來往冝爞爞久旱天颯颯昨育雨塵頭清過轍水脈生新渚豈徒滋𣏌菊亦可望禾黍勿笑盤𬞞陋時來一觴舉安之謝藥栽二章洛人栽花不栽藥吾屬好尚何其偏服之雖能巳百疾愛間成癖無由痊護根帶土我親移荷鍾汲泉君自種恱目寧將惡草殊扶危或比兼金重雨中過王安之所居不謁以詩寄之萬木含涼雨驅馬有餘清長衝帶短蕪舊潦駢新蓱髙齋彼誰居雅尚推名卿汗亭雖地卑躡屐未妨行野服踞䔧牀蕭散臨前楹纂纂棗林繁欣欣藥畹榮過門不敢叩自視慙冠纓素與安之約不以公服相過送藥栽與安之盛夏移藥栽及雨方可種為君著屐取呼童執傘送到時雲巳開枝軟葉猶重夕陽宜屢澆又須煩抱甕張明叔兄弟雨中見過弄水軒投壷賭酒薄暮而散詰朝以詩謝之喜君午際來涼雨正紛泊呼奴掃南軒壷席謹量度軒前紅微開壷下鳴泉落虎瓜泉上覆之以版每投壷板上設榻繞之榻去壷各二矢半必爭如五射有禮異六博求全怯垂成倒置畏反躍新格倒中者壷中之算盡廢之雖無百驍巧且有一笑樂交飛觥酒滿強進盤飱薄苟非興趣同珍殽徒綺錯小雨雲日玄出沒數朝飛雨清瞳朧似欲止廉纎還未睛映空輕絲亂著物細珠明葉端危未落荷心重忽傾喜涼髙燕舞便濕群蛙鳴於豫亦有得藥畹胡麻生渴中書事二絶芳州晚日鮮曲岸新雨好紅薇點圎荷金䔲出幽草坐嗅白蓮藥卧看青竹枝間齋不成寐起讀聖俞詩送劉仲通知涇州四載一相逢相逢遽為别儕輩日蕭條與君俱白髮巵酒不暇執舊遊那復説忽忽無他言暑行戒飢渴和復古大雨積隂連日作鬱蒸長雲飛天勢如鵬白雨四注垂萬縆坐間斗寒衣可增雷公推車電施鞭飛騰九澤舞百川須臾開晴萬物鮮仰視白日當青天南園雜詩六首見山臺晝卧偶成移牀獨上髙臺卧颯颯涼風吹面過林蟬忽噪驚薄夢手執殘書幅巾墮修酴醿架貧家不辦御名堅木縛竹立架擎酴醿風搖雨漬不耐久未及三載俱離披往來遂復廢此徑舉頭礙冠行絓衣呼奴改作豈得巳抽新換故拆四籬來春席地還可飲日色不到香風吹螢林塘荒濕地向夕巳飛螢月沒蛩吟砌露涼人在庭隨風疑落燼過水亂踈星學子燈前寢誰將爾照經明叔家瑞蓮君家得蓮種逺自浙江湄明燭然深碗濃朱畫細絲盛開尤􅔽蓞到落不離披豈獨夏花好仍兼秋實竒味長包石蜜殼嫩剝燕支况復芬芳久霜前殊未衰蓮房蓮房前後熟供噉不須齊肉嫩山蜂子稜深天馬蹄尚連餘蘂在深映亂荷低脆美知新采近根猶帶泥不寐長年睡益少氣耗非神清昨朝多啜茶況以思慮并中煩枕屢移展轉何時明蘇秦六國印力取鴻毛輕白圭萬金産運智立可營如何五更夢百方終不成苦雨今春憂亢陽引領望雲族首夏忽滂沱意為蒼生福自爾無虛日髙原亦霑足連年困飢饉此際庶和熟如何涉秋序沈隂仍慘黷長簷㵼潺湲晝夜浩相續喧豗流潦怒突兀壞垣秃駕牛泥沒鼻跨馬水平腹瓦欹松漫白道廢草濃緑汙萊閔下田漏濕憐破屋縱橫委地麻狼藉卧隴榖怯聞飢嬰啼愁聽寡婦哭間官雖無責飽食愧有祿丗紛久去心物役奈經目鬱陶聊秉筆狂簡巳盈幅八月十五日夜宿南園懷君貺昔公在洛師未嘗棄嘉節今宵秋半分空羡西園月天色湛澄清風聲冷騷屑笑言不可親引領望金闕賴有篋中詩端居數披閲八月十六日過天街懷景仁秋潦收四野晴雲無一班忽驚龍門缺逺見鳴臯山涼飈入毛髮皓氣清心顔悠然念吾友逍遙城闕間思陪藍輿尾共此登臨間宿南園頃來興味少旬日不為詩昏昏但思眠疲病知吾衰豈無籬邊菊不欲拈酒巵絡緯爾何苦終夕鳴聲悲九月十一日夜雨宿南園韓秉國寄酒兼見招以詩謝之雨多秋草盛濃緑擁寒階吾廬奧且曲退縮如晴蝸小園巳自隘欲往泥霑鞋體羸畏風冷室處門常䦱空蝸切九日古所重負此時節佳緬想使君宴綺席臨髙齋肥羜堆玉盤飛觴酒如淮楚舞陵湖波茱茰落金叉神醒鼓吹喧百疊疑傾崖歡餘忽我思牙兵星火差潩泉耻獨醉醇味相與偕我飲雖不多和氣浩無涯梧子拾為果拒霜伐為柴沼中數寸魚烹煎足為鮭吳人謂魚肉為鮭誰言無以侑繞渚多鳴蛙交道久衰薄巋然見吾儕奈何數舍遙晤語積年乖況乃辱嘉招私心豈不懷轘轅石道澀重以隂雲埋雖有果下馬𣢾假非渥窪臨風徒竦踊志願焉能諧狂詩寄一笑聊用當詼俳子厚先生哀辭張載先生負材氣弱冠遊窮邊麻衣揖巨公決䇿期萬全謂言叛羌背坐可執而鞭意趣小參差萬金莫留連中年更折節六籍事精研羲農訖周孔上下皆貫穿造次循繩墨儒行無少愆師道久廢闋模範幾無傳先生力振起不絶尚聮綿教人學雖博要以禮為先庶幾百丗後復覩三王前釋老比尤熾群倫將蕩然先生論性命指示今知天聲光動京師名卿爭薦延置之石渠閣豈徒修簡編丞相正自用立有榮枯權先生不可屈去之歸卧堅孤婺矛牙聚滿室糊口耕無田欣欣茹䔧藿皆不思肥鮮近應詔書起尋取病告旋舊廬不能到丹旐風翩翩人生會歸盡但問愚與賢借令陽虎壽巨足驕顔淵况於朱紫貴飄忽如雲煙豈若有清名髙出太白巔門人俱絰帶雪涕會松阡厚終信為美繼志仍須專讀經守舊學勿為利祿遷好禮效古人勿為時俗牽修內勿修外執中勿執偏當令洙泗風郁郁滿秦川先生儻有知無憾歸重泉古墳茫茫野田平極目歷歷古墳如夏屋碑版無文荆棘深石獸沈淪松柏秃問人雖不知姓名昔皆髙官仍厚祿子孫流落何所之凶吉當年非不卜我來正值寒食天祭膰不設無人哭酬趙少卿丙字南正藥園見贈鄙性苦迃僻有園名獨樂滿城爭種花治地惟種藥栽培親荷􅓩購買屢傾槖縱橫百餘區所識恨不博身病尚缺字攻何論療民瘼登封龐國博元常字懋德年三十八自云欲棄官隱嵩山作吏隱庵於縣寺俾光賦詩勉率塞命懋德負長才全牛不足剸才為百里宰驥足殊未展齒髮方盛疆趣尚巳髙逺結庵睋二室志欲巢絶巘賢人心如雲無迹有舒卷不須驚俗目卓犖乃求顯既知吏可隱何必遺軒冕暮春同劉伯壽史誠之飲宋叔達園絮狂飛作團梅小不多酸共惜餘春好更窮今日歡清流入花底翠嶺出林端嫩笋玉縈筯新櫻珠照盤邀迎嘉客易會合故人難寄語門前僕驊騮任解鞍用前韻再呈舊友今餘幾追思鼻可酸休論身外事且盡目前歡薜荔垂隄面酴醿擁席端舞精抽􅗀緒絃妙落珠盤醇酒回春易靈丹却老難扶歸不復記茗艼上金鞍示道人天覆地載如洪爐萬物死生同一塗缺字中松柏與龜鶴得年稍久終摧枯借令真有蓬萊山未免亦居天地間君不見太上老君頭似雪丗人浪説駐童顔謝君貺中秋見招不及赴不侍庾公宴月華虛四秋幸逢東閣開又阻西園遊清輝散廣座孤影隨行舟衮衣如未歸志願終可酬久雨效樂天體雨多雖可厭氣涼還可喜欲語言慵開無眠身懶起一榻有餘美想彼廟堂人正應憂􅝂理缺第五句聞景仁遷居許昌為詩寄之天衢名利場塵泥繼朝昏況兹辭榮久厭苦車馬喧慨然忽髙舉翩若黃鵠翻朝賣西城宅暮理南行轅回首豈無懷眷眷望國門想象解裝𥘉完美未可論縱橫置老屋缺剝周短垣臧獲念去故炊爨假罌盆幼稚喜就新階庭走諸孫幸有克家子生事不日溫許昌昔名都於今亦雄藩先賢雖巳逺風迹􅏮猶存况復多巨公分義素所敦丞相辭黃閣學士乘朱􅙲青雲同禁省白首會山缺字潩水湛寒光盡眼清心魂華堂臨曲渚畫舫承芳樽髙談金石諧逸筆風雨奔得朋誠多歡孤陋未可諼時當惠好音獨樂慰荒園送張伯常同年移居郢州楚江白逶迤楚山碧參差玉炊稻粒長縷切魚膄肥羡君盡室行飄然無所羈伐竹營茅茨種橘為藩籬荒陂無四垣但以荷塘圍官雖朝大夫身丗巳相遺野老坐爭席林叟談忘歸猶嫌沮溺徙名字為人知南園飲罷留宿詰朝呈鮮于子駿范堯夫彛叟兄弟園僻青春深衣寒積雨闋中霄酒力散卧對滿窗月旁觀萬象寂逺聽群動絶只疑玉壷冰未足比明潔自用前韻耿耿寐不成迢迢夜未闋良朋悔不留負此當軒月懷想空鬱陶眺聽轉清絶他時重見過餘樽猶可潔不寐思夢夕不效良夜行巳闌此心如杯水擾易澄苦難百年能幾何萬慮誰能殫棄置勿復尋專取形神安招子駿堯夫虛牖延朝光髙林散晴藹深夏猶清和間齋亦爽塏離群才宿昔跂佇心巳痗楸枰頗光潔置設儼相待軒車能朅來雞黍足充餒和家兄喜晴用安之韻象龍雖得請躍蜧亦須占既有膏苗益寧無漂麥嫌餘霏方映戶反照忽通簾羈旅愁懷闋農家喜色添田間拾穗滿陌上荷鉏兼豫想三川逈秋場萬庾尖病中子駿見招不往兼呈正叔堯夫時正叔約次日為會衰朽拙自將藴積成中病掩扉卧小榻安養惟便靜遙知良友集鬱若荀陳盛獻酬屏浮飾簡率任真性園櫻傷老也園有繁櫻圃有肥菁我酒既清我殽既馨我友戾止聊以娛情今我不樂日月其徑園有穠李圃有肥𣏌我酒既旨我殽既美我友戾止改憂為喜今我不樂年其有幾園有弱柳圃有肥韭我酒既有我殽既阜載笑載歌以宴我友今我不樂年其無夕悠悠泛舟載縱載橫白日將傾飄風載驚嗟我老矣髮脫齒零胡為百憂勞此餘生和景仁緱氏别後見寄求決樂議雖用其韻而不依次蓋以景仁才力髙逸步驟絶群非駑拙所能追故也至樂存要眇失易求之難昔從周道襄疇人曠其官聲律久無師文字多缺漫仁皇閔崩壞廣庭集危冠紛紜鬪筆舌異論誰能殫或欲徇陳迹竅厚潛鎪剜或欲立私意妄取舊史刋古今互齟齬大抵皆欺讕景仁信其説墨守不可干賤子欲面從誰與換膽肝必求此議決深谷為崇巒何如兩置之試就中和看天地育萬物生成適暄寒聖人保四海皇極致阜安樂理亦如此炳煥猶朱丹嘽緩與噍殺折衷遺兩端兹道苟不由芒刃難嬰髖魯樂最為備雍徹施三淵夏御名齊韶猶肄習太公避陳完唐民聽伴侶不復含悲酸乃知樂有源鍾鼓皆波瀾昨者清明𥘉榆火始改鑽景仁從許來傾都咸聚觀諸公競邀迓非獨惜春殘議樂不復對晝夕且窮歡來時桃李穠去日勺藥闌三旬只須臾駛若阪上丸轘轅逢雨別惝恍歸騎單東西步步逺回首祝加餐仍兾勉中和心廣體自胖和秉國招景仁不至云方作書與光論樂小桃佳李實如拳西湖盡眼鋪芳蓮景仁不從鄉賢飲為此樂論方窮研周襄官失疇人散鍾律要眇誰能傳近人欺衆出私意最可閔笑房生顚如光𥘉不辨宫羽是非得失安敢專每煩教諭纍百紙頑如鐵石不可鐫王李阮胡相詆毀各執所學何妨偏景仁家居鑄釜斛欲除民瘼恐未然要須中和育萬物始見大樂之功全同子駿題和樂亭春禽哢晴朝秋蟲吟雨夕風和振蘭芳露寒滋菊色萬物苟得所隨時各有適矧伊人最靈胡為長戚戚聖人垂大訓燦爛著方册至樂和無聲大禮簡無迹心專守中庸身不蹈邪僻造次常在前須臾不離側窮通雖百變何往不自得兹亭聊寓名和樂在胸臆溫國文正公文集卷第五
