body:
  text: 論周琰事乞不坐馮浩狀右臣伏奉聖旨以鎖廳舉人周琰重疊用殊字既條制未明試官不申請定奪臣與馮浩各特罰銅五斤放仰荷含貸喜懼無量然臣昨在武成王廟考試之時其周琰所用殊字浩本疑不係重疊用韻由臣愚懵鑒别不精觀琰程試不見所善又據條制但言重疊用韻不云用他韻引而協者非由此堅執輒行黜落鹵莽之罪盡皆在臣今浩與臣一例受罰臣雖無似能不愧心伏望聖慈特賜矜察與免馮浩責罰於臣更加嚴譴各得其分誠不敢辭干冒宸嚴臣無任戰汗激切屏營之至謹具狀奏聞伏候勑旨請建儲副或進用宗室苐一狀至和三年六月十九日上是歲仁宗遣豫不臨朝者纍月國嗣未建天下寒心中外之目勇悍不屈素時忠直自負如唐介等皆莫言惟范景仁辱為諫官首建此議光聞而繼之第一狀留中第二第三狀降付中書竊以人臣之進言者捨其急而議其緩則言益繁而用益寡矣人君之聽納者忽其大而謹其細則心益勞而功益淺矣故明主不惡逆耳之言以察治亂之原忠臣不避滅身之禍以論安危之本是以上下交泰而事業光美也臣竊見陛下自首春以來聖躰小有不康天下之人側足而立纍氣而息恟恟憂懼若蹈冰炭間者雖已痊平而民間猶有妄為訛言以相驚動者雖有司以嚴刑束之彼口不得言中心惶惶何所不慮邪陛下胡不試思其所以然者何哉豈非儲二者天下之根本根本未定則衆心不安也賈誼有言抱火措之積薪之下而寢其上火未及然因謂之安當誼之時漢孝文帝春秋鼎盛有孝景以為之太子中外乂安公私冨溢誼猶有是言使誼處於今日當云何哉陛下好學多聞博覽經史試以前古之事迹之治亂安危之幾何嘗不由繼嗣哉得其人則治不得其人則亂分先定則安不先定則危此明白之理皎如日月得失之幾間不容髮於朝廷至大至急之務孰先於此而陛下晏然不以為憂群臣愛身莫以為言此臣所以日夜痛心疾首忘其身之踈賤而不顧鼎鑊之罪者也伏惟陛下哀而察之今夫細民之家有百金之寶猶擇親戚可信任者使謹守之況天下之大乎三代之王以至二漢所以能享天之祿若是其久者豈非皆親任九族以為藩輔乎使親者猶不可信則踈者庸足恃乎臣竊惟陛下天性純孝振古無倫事無大小關於祖宗者未嘗不勤身苦體小心翼翼以奉承之况所受祖宗光明盛大之基業豈可不為之深思逺慮措之於安平堅固之地以保萬世無疆之休哉臣聞天子之孝非若衆庶止於飬親而已蓋將慎守前人之業而傳於無窮然後為孝也故經稱天子之孝曰德教加於百姓刑干四海諸侯之孝曰保其社禝而和其民人卿大夫之孝曰守其宗廟士之孝曰保其祿位而守其祭祀庶人之孝曰謹身節用以養父母此皆聖人之言非臣之狂瞽也今陛下所以奉事祖宗其道至矣若獨於此未留睿意早定大議則嚮時純孝巍巍之德皆無益矣此天下所共為陛下重惜非特愚臣而已臣聞禮大宗無子則同宗為之後為之後者為之子也故為人後者事其所後禮皆如父所以尊尊而親親也伏惟祖宗受天明命功德在人本支百丗子孫千億而陛下未有皇嗣人心憂危伏望陛下深念祖宗之艱難基業之閎美神器之大寶蒼生之重望勿聽苟且之言勿從因循之計斷自聖志昭然勿疑謹擇宗室之中聰明剛正孝友仁慈者使攝居儲二之位以俟皇嗣之生退居藩服儻聖意未欲然者或且使之輔政或典宿衛或尹京邑亦足以安天下之心如此則天神地祗宗廟社禝實共賴陛下聖明之德況群臣兆民其誰不歡呼鼓舞乎昔魯漆室之女憂魯君老太子幼彼匹婦也猶知憂國家之難蓋以魯國有難則身必與焉故也況臣食陛下之祿立陛下之朝又得承乏典册之府比於􅃮室之女斯亦重矣誠不忍坐視國家至大至急之憂而隱默不言臣誠知不言責不在臣言之適足自禍然而必言者萬一䔬陛下采而聽之則臣於國家譬如螻蟻而為陛下建万丗無窮之基救四海生民之命臣榮多矣願陛下勿以臣人微位賤謂之狂狷而忽之試以臣言自為聖意延問大臣忠於社禝者儻以為非臣請伏妄言之誅儻以為是願陛下決志而速行之焚臣此奏勿以示外足以明臣非敢徼冀毫釐之幸也虞書曰勑天之命惟時惟幾陛下當此之時變危為安變亂為治易於返掌若失時不斷使天下之人有以議陛下之純孝者則臣雖欲畢命捐軀以報陛下亦無及巳臣不勝區區憤悶之誠干冒冕旒伏地待罪第二狀臣先於六月十九日輒以瞽言干犯聖聽伏地傾耳以俟明詔于今月餘一無所問陛下寬仁不加誅於狂愚之臣然亦未賜采納臣竊自痛人品猥細言語吃訥不能發明國家安危大體致陛下輕而棄之此皆臣之罪也雖然臣性誠愚位誠賤而意誠忠語誠切願陛下不以人之愚賤而廢忠切之言少留聖心於宗廟社禝之至計則天下幸甚天下幸甚竊以為國家者政有小大事有緩急知所先後則功無不成議者或曰當今之務大而急者在於水災況溢是大不然彼水災所傷不過汚下及濵河之民若積雨既止有司少疏而塞之則民皆復業豈能為國家之患哉又曰然則在於榖帛窘乏是又不然夫以四海之冨治平之久若養之有道用之有節使良有司治之榖帛不可勝用也豈能為國家之患哉又曰然則在於戎狄侵盜是又不然夫戎狄侵盜不過能驚擾邊鄙之民若御之有道備之有謀可使朝貢相繼豈能為國家之患哉以臣之愚當今最大最急之患在於本根未建衆心危疑釋此不憂而顧憂彼三者是舍其肺腑而救其四支也不亦左乎借有髙材之臣能復九河之道儲九年之食開千里之邊而本根未建猶無益也況復細於彼三事者烏足道哉今陛下聖體雖安四方之人未能遍知尚有疑懼者陛下不以此時早擇宗室之賢者使攝居儲副之位內以輔衛聖躬外以鎮安百姓萬一有狂妄之人出於意外喧譁驚衆雖知萬全無慮然亦豈可不過為之防哉臣竊意陛下聖志洞照安危䇿慮已定而尚密之未欲宣示於外審或如此亦恐不可何則今天下之人企踵而立抉耳而聽以須明詔之下然後人人自安又何待而密哉若以儲副體大非造次可定者或且使之輔政或典宿衛或尹京邑亦足以遏禍難之原靖中外之意今安危之幾間不容髮日失一日貴在及時而朝廷置之意外不為汲汲朝夕所議大抵皆目前常事非甚大而急者臣恐髙拱雍容養成國家之患從而理之用力難矣此臣所以日夜區區寢不能安食不能飽不避死亡之誅進言不巳者也伏望陛下察其愚衷特賜詳擇臣前日所奏及今狀內事理稍有可施行者乞決計而速行之以安天下元元之心然後理臣僣妄建言之罪不敢辭也溫國文正公文集卷第十六
