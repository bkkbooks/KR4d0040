body:
  text: 章奏二十四辭免裁減國用劄子請不受尊號劄子手詔批答乞聽宰臣等辭免郊賜劄子舉諌官狀八月十一日邇英對問河北災變議學校貢舉狀辭免裁減國用劄子七月三日上殿次日收還差勑只令三司差官官勾臣近曽乞别選差官裁減國用奉聖旨不許辭免臣以非材叨忝美職月受厚俸常自愧恐無有報稱若果能有益於國臣何敢辭竊惟方今國用所以不足者在於用度太奢賞賜不節宗室繁多官職冗濫軍旅不精此五者必須陛下與兩府大臣及三司官吏深思其患力救其弊積以歲月庶幾有效固非愚臣一朝一夕所能裁減也若但欲知慶曆二年裁減國用制度比見今支費不同數目只下三司令供析聞奏立可盡見臣愚以為不必更差官置局專領此事况臣所修資治通鑑委實文字浩大朝夕少暇難以更兼錢榖差遣取進止請不受尊號劄子臣今月十七日准內降曽公亮等上尊號第三表檢㑹舊例合降不允批答巳具榜子審取聖旨去訖臣竊惟上尊號之禮非先王令典起於唐武后中宗之丗遂為故事因循至今伏見太祖開寶九年群臣上尊號有一統太平字太祖以燕晉未平却而不受以是見聖人之志苟無其實終不肯有其名也太宗端拱二年詔自前所加尊號盡從省去且曰以理言之皇帝二字亦未可兼稱朕欲稱王伹不可與諸子同耳群臣懇請乃受法天崇道四字而已其後終身遂不復增益先帝治平二年辭尊號不受天下莫不稱頌聖德不幸次年有諂諛之臣建言國家與契丹常有往來書彼有尊號而中國獨無足為深恥於是群臣復以非時上尊號論者甚為朝廷惜之昔漢文帝遺單于書以尺一牘單于答以尺二寸牘自稱天地所生日月所置胸奴大單于未聞文帝復為勝大之名以加之也學者至今稱文帝謙德之美未嘗以為可恥也此乃不識大體之言誠不足信耳今群臣以故事上尊號臣愚以為陛下聰明睿智雖冝享有鴻名然踐祚未久又在亮隂之中考之事體似未冝受陛下誠能斷以聖意推而不居既不允所請仍令更不得上表則頌嘆之聲將洋溢四海此所謂一謙四益後其身而身先可以捨虛名而得實譽者也伏望陛下更加詳擇取進止手詔覽卿來奏深諒忠誠朕方以頻日淫雨甲申地震天威彰著日虞傾禍實憂𬒳此鴻名有慙面目况在亮隂亦難當是盛典誠如卿言今已批降指揮可善為答辭使中外知朕至誠實乃內顧慙懼非是欺衆以邀虛名批答省表具之朕荷祖宗之休撫有四海永惟燭理之不明舉措之不中元元困窮未獲厥所夙夜悼懼如涉春氷屬以美報之禮不敢墮曠故欲躬執犧牲祗見上帝固非昭告成功自營福祿也群公卿士猥見褒譽欲歸以溢美增其徽稱抗章勤請至于再三朕乏馨香之德不能媚于神祇乃甲申地震淫雨為災天威彰著日虞罪悔尚何盛烈之可述鴻名之敢當心焉愧惕流汗霑足况尚在諒暗哀素未忘何冝此時亟舉盛典若斯之議非所敢聞冝體豫至誠勿復為奏所請冝不允仍斷來請乞聽宰臣等辭免郊賜劄子臣伏覩宰臣曽公亮等奏以河朔菑泠調用繁冗欲望將來大禮畢兩府臣僚更不賜銀絹奉聖旨送學士院取旨議者或以為兩府所賜無多納之不足以冨國而於待遇大臣禮太薄頗為傷體臣愚竊以為不然古者冢宰制國用視年之豐耗量入以為出固不可於饑饉之時守豐登之法也是故歲凶年榖不登君膳不祭肺大夫不食粱士飲酒不樂明君臣上下皆當深自貶損以救民急也臣竊惟國家帑藏素巳空虛重以今歲河北之地災害特甚嚮者慶曆之末河決啇胡民田雖傷官倉無損而河比父子相食餓殍蔽野今河决之外加以地震官府民居蕩為糞壤繼以霖雨倉粟腐朽軍食且乏何暇及民冬春之交民必大困甚於慶曆之時國家豈可坐而視之不加振救乎况復城櫓須修河防應塞百役並興所費不資當此之際朝廷上下安得不同心協力痛加裁損以徇一方之急凡宣布惠澤則冝以在下為先撙節用度則冝以在上為始今欲裁損諸費不先於貴者近者則踈逺之人安肯甘心而無怨乎必若為臣有大勳於天下雖錫之山川土田附庸何為不可若止因郊禮陪位而受數百萬之賞臣竊有所不安矣臣前所謂賞賜無節者此亦其一也雖臣下不辭猶應裁减況其自辭裁之何損乎儻若伹務因循姑息度日欲裁損乘輿供奉之物則曰减於制度太為削弱疑缺一假非所以養賢欲裁損群下浮冗之費則曰人情不恱恐致生事非所以安衆如此則是國用永無可省之日下民永無蘇息之期必至於涸竭窮極然後止也且君子之所尚者義也小人之所徇者利也為國者當以義褒君子利恱小人今大臣以災害之故辭錫賚以佐百姓之急義之可褒者也陛下從而聽之乃所以為厚非所以為薄也雖然兩制銀絹止於二萬匹兩未足以救今日之災又國家舊制每遇郊禋大賚四海下逮行伍無不霑洽不可於公卿大夫全無賜豫臣愚以為文臣自大兩省以上武臣及宗室自正任刺史以上內臣自押班以上將來大禮畢所賜並冝减半俟他年豐稔自依舊制其文武朝臣以下一更不减以為酌中臣亦知此物未能冨國誠冀國家因此漸思減其餘浮費自今日為始耳臣素愚戇識慮膚淺所言者皆目前之實狀非竒偉之髙論也伏望陛下更賜裁察若果有可取乞斷自聖旨勿為衆言所移則天下幸甚取進止舉諌官狀臣今日面奉聖旨令臣采訪可為諫官者密具姓名聞奏臣辭不獲命退而惶恐默自思忖凡擇言事官當以三事為先第一不愛冨貴次則重階名節次則曉知治體具此三者誠亦難材臣愚何足以識别賢能竊謂已試之人差為可信伏見三司鹽鐵副使吕誨纍居言職不畏彊禦再經謫降執節不回侍御史吕景外貌和厚內守堅正見得知恥臨義不疑於臣所知之中此兩人似堪其選更乞陛下博訪衆臣裁以聖意取進止八月十一日邇英對問河北災變八月十一日邇英進讀巳召對問以河北災變何以救之光對以河北大水倉廪漂沒所難得者莫先於食朝廷若降金帛令配賣於民以糴榖則重增煩擾且禾稼蕩盡擢之亦無所得故饑饉之歲金帛無所用惟食不可一日無耳上曰巳令漕五十萬石以賑之可足乎對曰臣聞瀛州所損自百五十萬石所漕者裁能補瀛州三分之一耳上曰然則奈何對曰臣聞河北東西路水所不及州縣頗稔可糴又汴流未絶冝多漕江淮之榖以濟之上又問諌官難得人誰可者對曰臣賤官何敢薦人上固問之對曰臣倉猝不能記容臣退而密奏上因論治道言州縣長吏多不得人政府不能精擇對曰人不易知天下三百餘州責其精擇誠難伹能擇十八路監司使之擇所部知州而進退之知州擇所部知縣而進退之得人多矣今之提轉古方伯州牧之任繫一路休戚當慎擇天下賢才不可伹取資叙及酬奬為之也上又問兩府辭郊賚劄子何不呈對以同僚有假故上問兹事何如對曰臣巳有奏狀臣所見上如此更乞博訪近臣裁以聖意上曰誰不同對曰獨臣有此愚見他人皆不以為然上曰朕意亦與卿同聽其辭賞乃所以成其美非薄之也然减半無益大臣懇辭不若盡聽之對曰今郊賚下至卒伍皆有之而公卿更無恐於體未順上曰巳有帶馬矣對曰求盡納者人臣之志賜其半者人主之恩也後數日光與禹玊介甫同進呈郊賚劄子於延和殿光言方今國用不足災害荐臻節省冗費當自貴近為始冝聽兩府辭賞為便介甫曰國家冨有四海大臣郊賚所費無幾而惜不之與未足冨國徒傷大體昔常衮辭賜饌時議以為衮自知不能當辭祿今兩府辭郊賚正與此同耳且國用不足非方今之急務也光曰常衮辭祿猶知廉恥與夫固位且貪祿者不猶愈乎國家自真廟之末用度不足近歲尤甚何得言非急務邪介甫曰國用不足由未得善理財之人故也光曰善理財之人不過頭㑹箕斂以盡民財如此則百姓困窮流離為盜豈國家之利邪介甫曰此非善理財者也善理財者民不加賦而國用饒光曰此乃桑羊欺漢武帝之言司馬遷書之以譏武帝之不明耳天地所生貨財百物止有此數不在民間則在公家桑羊能致國用之饒不取於民將焉取之果如所言武帝末年安得群盜蜂起遣繡衣使者逐捕之乎非民疲極而為盜邪此言豈可據以為實介甫曰太祖時趙普等為相賞賚或以萬數今郊賚匹兩不過三千豈足為多光日普等運籌幃握平定諸國賞以萬數不亦冝乎今兩府助祭不過奏中嚴外辦沃盥奉帨巾有何功勤而得比普等乎與介甫爭論久之禹王曰司馬光言省費自貴近始光言是也王安石言所費不多恐傷國體安石言亦是也惟陛下裁之上曰朕亦與司馬光同今且以不允答之可也是日適㑹介甫當制遂以上前所言意草批答引常袞事以責兩府兩府亦不復辭明日邇英講讀罷上獨留介甫與語兩府不敢先出以俟之至晡後乃出不數日參知政事議學校貢舉狀臣准御史臺牒准勑節文天下學校貢舉之法冝令兩府兩省待制以上御史臺三司三館臣僚各限一月具議狀聞奏者臣聞詩云無競惟人四方其訓之言君欲立強於天下者無如得人得人而任之以事則四方斯順之矣臣竊惟取士之弊自古始以來未有若近世之甚者也何以言之自三代以前其取士無不以德為夲而未嘗專貴文辭也漢氏始置茂才孝廉等科皆命公卿大夫州郡舉有經術德行者䇿試以治道然後官之故其風俗敦尚名節降及末世雖政襄於上而俗清於下由取士之術素加奬勵故也魏晉以降貴通才而賤守節習尚浮華舊俗益敗然所舉秀孝猶以經術取之州郡皆置中正以品其才行一言一動之失或終身為纍士猶兢兢不敢自放隋始置進士唐益以明經等科而秀孝遂絶止有進士明經二科皆自投牒求試不復使人察舉矣進士初但試䇿及長安神龍之際加試詩賦於是進士專尚屬辭不夲經術而明經止於誦書不識義理至於德行則不復誰何矣自是以來儒雅之風日益頽壞為士者狂躁險薄無所不為積日既久不勝其弊於是又設封彌謄録之法蓋朝廷苦其難制而有司急於自營也夫欲搜羅海內之賢俊而掩其姓名以考之雖有顔閔之德苟不能為賦詩論䇿則不免於遭擯棄為窮人雖有跖蹻之行苟善為賦詩論䇿則則不害於取髙第為美官臣故曰取士之弊自古始以來未有若近丗之甚者非虛言也今幸遇陛下聖明心知貢舉之極弊慨然發憤深詔群臣使得慱議利病更立新規是千載一時也議者或曰古人鄉舉里選今欲知士之德行冝委知州知縣者采察其實保而薦之臣獨以為不然古者分地建國自卿大夫士皆以其國人為之猶患處士之德行不可得而詳也故又擇其鄉之賢者使為閭胥比長自幼及長朝夕察其所為然後士之德行美惡莫得而隱也今夫知州知縣雜四海九州之人逺者三歲而更近者數月而更或𥘉到官即遇科場遽責之知所部士人德行誠亦難矣又應開封府舉者常不減數千人而開封府獄訟之繁知府者自旦至暮耳不暇聽目不暇視又有餘𥙿可使之察數千人之德行乎議者又曰冝去封彌謄録委有司考其文辭參以行實而取之臣獨以為不然夫士之德行知州縣者尚不能知而有司居京師一旦集天下之士獨以何術知之其術不過以衆人之毀譽决之孔子曰衆好之必察焉衆惡之必察焉夫衆人之毀譽庸詎足以尽其實乎必如是行之臣見其愛憎互起毀譽交作請託公行賄賂上流謗讟並興獄訟不息將紛然殽亂朝廷必厭苦之而復用封彌謄録矣夫封彌謄録固為此數者而設之也譬猶築防以鄣洚水也今不絶其源而徒去其防則橫流之患愈不可救矣臣雖至愚平生固嘗竭其思慮欲以少救其弊今敢試陳二䇿乞陛下俯加裁擇臣聞上之所為下之所歸也國家從來以詩賦論䇿取人不問德行故士之求仕進者日夜孜孜專以習賦詩論䇿為事惟恐不能勝人父教其子兄勉其弟不是過也今若更以德行取人則士之力於德行亦猶是也誠風化清濁之原歷代訛繆而不寤必待聖朝然後正之者也夫德行修之於心藏之於身雖家人有所不知况於卿黨况於州縣况於朝廷將何從知之故必待明哲公正之臣知而舉之然後四海之士皆可得而官使也然舉薦之法既行則干求屬請誠所不能無也要在所舉非其人者國家以嚴法繩之勿加恩貸則苟且徇私之人皆知懼矣且國家既以德行取士則彼貪猾輕躁之人依附權要枉道求進者皆為清議所貶見棄於時雖有舉者必不多矣臣愚欲乞今後應係舉人令升朝官以上歲舉一人提點刑獄以上差遣者歲舉二人諌議大夫或待制以上歲舉三人不以所部非所部鄉里非鄉里除自己親戚及曽犯真刑或私罪情理重曽經罰贖及不孝不友盜竊淫亂明有迹狀者不得舉外其餘皆得舉之仍於舉狀內明言臣今保舉某州某科某人有學術節行乞賜召試若舉狀既上之後却有前後諸般違礙事發其舉主並依律文貢舉非其人分故失從公私罪定斷受贓而舉者以枉法論其舉狀逐時送下禮部貢院置簿記録若應舉人而不舉者歲終委貢院勘㑹姓名聞奏乞嚴加朝典每遇三年一開貢舉委貢院截自詔下之日勘㑹選擇舉主最多者從上取之舉主數同則以舉狀到省日月先後為次其舉主曽有贓罪及見停間身亡或在合參人數外者並不准倍於每次科場南省奏名人數具姓名聞奏乞下夲貫發遺赴闕其夲貫更不考試即具申狀解送赴貢院仍出公慿給付遂人令赴貢院照㑹限十一月內取齊十二月內引見正月內委貢院者試其試官或朝廷臨時添差進士試經義䇿三道子史䇿三道時務䇿三道更不試賦詩及論明經及九經等諸科試夲經及論語孝經大義共四十道明經加試時務䇿三道其帖經墨義一切皆不試對䇿反大義但取義理優長不取文辭華巧唯所對經史乖僻時務踈闊者即行黜落其奏名人數並依科埸舊制若合格者少不滿舊數亦聽至御試時進士明經各試時務䇿一道九經等諸科試夲經大義十道所有名字髙下並只以舉主多者為上舉主數同則以舉狀到省月日先後為次其舉人所納家狀及授官後吏部所給告身並須開坐元初舉主人數姓名若及第後犯私罪情理重及贓罪其舉主並減一等坐之未及第者減三等皆不以去官及赦原如此則群臣不敢挾私妄舉士人皆崇尚經術重惜操履風俗丕變矣朝廷若不能行此保舉之法其次莫若修學校之法以取之臣伏見自慶曆以來天下諸州雖皆立學校大抵多取丁憂及停間官貟以為師長籍其供給以展私惠聚在事官貟及井市豪民子弟十數人遊戲其間坐耗糧食未嘗講習修謹之士多恥而不入間有二千石自謂能興學者不過盛修室屋增置莊産廣積糧儲多聚生徒以邀虛名師長之人自謂能立教者不過謹其出入節其遊戲教以鈔節經史剽竊時文以夜繼晝習賦詩論䇿以取科名而巳此豈先王立學之意邪於以修明聖道長育人材化民成俗固巳踈矣臣欲乞自今天下州學只許置教授一人委夲州長吏於夲處命官中選擇無過犯有節行能講說為衆所服者舉奏𥙷充若夲州無人則奏乞下銓司選差委銓司於見在銓選人內㨂選進士明經諸科出身人歷任無贓私罪能講說經書者奏補充逐州教授仍令國子監試講說經書應舉人𥘉入學者並為外舍生唯赴聽講及公試外不得於學中宿食其教授每日講書畢取在學諸生姓名書於籖上雜置筒中抽取三人問以聽過書中疑議三條使對衆解說通者置簿記録粗者不問不者有罰每月中兩次公試各試所習舉業委教授考校定優劣等第具姓名出榜示訖亦置簿記録其有過犯者小過則罰錢中過則降謂自內舍髙等降為中等中等降為𥘉等𥘉等降為外舍生外舍生無等可降者勒出學大過則斥出學亦置簿記録每遇春秋釋奠畢委教授選擇外舍生到學及半年以上自前次釋奠以來說書多通公試多在優等姓名近上即為優等過犯情輕數少即升入內舍為𥘉等生始聽於學中宿食又選擇𥘉等生升為中等生中等生升為髙等生皆如外舍生之法其有二人巳上比較難决者即特令說書及試所葉以决皆須具狀申夲州委知州通判更加審覆委得公當然後給牒補之如後來有過降等者其牒即行抽取毀抹其教授選擇糾舉升降等第若有不公委知州通判覺察取勘聞奏乞行衝替其開封府舉人舊無府學並令寓教於國子監其國子監舉人須實是品官子弟方得依條入學其教試選升之法並與外州同以直講比教授判監同判監比知州通判凡國子監開封府及諸州軍內舍髙等生額並用夲處解額之半解額有竒數者入髙等生額假若解額三人則以二人為髙等生額其中等倍髙等𥘉等倍中等若人數未足則闕之不得溢額𥙷人若遇詔下開貢舉委夲處判監同判監知州通判截自其曰勘㑹髙等生𥙷及半年以上者具姓名結罪保明聞奏開封府人只委判監同判監保明仍給公慿許令免解直就省試其髙等生占不盡解額方許本處其餘舉人取解其中等𥘉等生於取解時仍别立號常比其餘舉人多取分數所有髙等生至省試時亦别立號每七人中取一人奏名如此則舉人亦稍嚮經術敦行誼矣夫經術深淺非程試所能知行誼美惡非朝夕所能察今使之處於學校經二三年纍經選擇升至髙等又占解額妨衆人進取之路若其行誼小有過差必不為衆人所容矣由此觀之其髙等生經術則講說常通文藝則屢入優等過犯則全然輕少行誼則為衆所服比之糊名謄録考其一日所試賦詩論䇿偶有所長而取之者相去逺矣况近年舉人或一無行能橫遇恩澤幸得免解者不可勝數今髙等生行能如此裁免一解豈足惜哉此學校之法也若朝廷又不䏻如此只于舊條之中毛舉數事微有更張則于取士之道並無所益徒更煩苛不若悉循舊貫之為愈也司馬溫國文正公文集卷第三十九
