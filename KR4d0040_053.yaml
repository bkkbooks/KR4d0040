body:
  text: 章奏三十八舉張舜民等充館閣劄子辭三日一至都堂劄子內降付中書省許肩輿至內東門扶掖入對小殿辭入對小殿劄子辭康章服劄子乞進呈文字劄子中使徐湜封還傳宣乞與諸位往來啇量公事劄子再乞進呈文字劄子乞進呈文字第三劄子論西人請地乞不拒絶劄子申明役法劄子乞進呈文字第四劄子乞延和殿常起居劄子乞官劉恕一子劄子乞以十科舉士劄子舉張舜民等充館閣劄子臣今月二十四日准尚書省劄子准二十二日詔書節文執政大臣冝各舉文學政事行誼之臣可以充館閣之選者三人臣竊見奉議郎張舜民材氣秀異讀書能文剛直敢言竭忠憂國通直郎孫凖學問優博文辭宏贍行義無缺久淹下僚河南府左軍巡判官劉安丗才而自晦願而有立力學修己恬於進取其人並堪充館閣之選如後不如所舉臣甘當同罪取進止五月三日尚書劄子光所患巳安惟足瘡有妨拜跪不候參假特放謝仍權免赴前後殿起居許乘轎子三日一至都堂聚議或門下尚書省治事辭三日一至都堂劄子臣伏覩中書省録黃今月二日奉聖旨以臣所患巳安惟足瘡有妨拜跪不候參假特放正謝仍權免赴前後殿起居許乘轎子三日一至都堂聚議或門下尚書省治事者臣聞命震恐無地自處竊念臣臟腑雖安飲食如故但兩足無力瘡口未合步履艱難拜起不得以此未果朝參至於數日一至政事堂乃唐丗以來宿德元老髙年有疾朝廷尊禮特降此命豈伊微臣所敢倫擬况臣自正月二十一日請朝假至今百三十餘日豈有未見君父輒赴省供職况臣於病中除左僕射雖纍具劄子辭免未蒙開允仍蒙就家賜以告身臣亦未敢祗受方俟入覲天顔面陳至懇豈可遽治尚書省事伏望聖慈俟臣步履稍有力拜起得成參假了日與諸執政一例供職貴於微軀差得自安所有今月二日指揮乞賜寢罷取進止內降付中書省許肩輿至內東門扶掖入對小殿左僕射兼門下侍郎司馬光為足瘡妨拜跪巳指揮免起居許乘轎子至尚書省等處治事今有劄子辭免可依前降指揮不許辭免仍令閣門告示許肩輿至內東門外令男康扶掖至小殿引對特免起居令引見前一日聞奏辝入對小殿劄子臣今月二日聞有聖旨令臣不候參假特放正謝仍權免赴前後殿起居許乘轎子三日一至都堂聚議或門下尚書省治事臣以恩禮太優不敢輒當尋具劄子辭免今月四日又覩中書省録黃奉聖旨依前降指揮不許辭免仍令閣門告示許肩輿至東門外令男康扶掖至小殿引對特免起居令引見前一日聞奏如此則禮數愈重尤不敢當臣竊惟冨弼三丗輔臣德髙望重神宗皇帝想見其人故特制此禮乃自古所無顧臣何人敢與為比况親屈乘輿特御小殿以臣勤君其罪至大縱陛下優借而天威咫尺恐隕越隨之似此異數臣決不敢受乞只候垂簾日於延和殿引見并乞上殿然事有不得已者雖知僣越不得不承順聖恩臣即日上下馬未得及足上有瘡深惡馬汗欲乞如今來聖旨權許乘轎子入內至常時下馬處下轎子又臣兩足無力若無人扶掖委實全拜起不得欲乞今來入見及將來每遇入對並權許令臣男康入殿遇拜時扶掖候痊安日皆復舊規如此則曲成之仁已踰於天地非臣隕身喪元所能報塞所有其餘恩禮並乞寢罷取進止三省同奉聖旨令乘轎子至崇政殿門外於延和殿垂簾日引對餘並依前降指揮辭康章服劄子臣久在病假今月十二日於延和殿入見并辭免新命以兩足無力拜起不得聖恩特許令臣男康入殿扶掖臣既不得請臣男復賜章服父子忝竊誠不自安所有臣男恩命乞賜寢罷取進止乞進呈文字劄子臣先奉聖㫖權免赴前後殿起居許乘轎子三日一至都堂聚議又許肩輿至內東門外令男康扶掖至小殿引對臣以恩禮太重不敢輒當只於延和殿引見以兩足無力無人扶掖委實全拜起不得乞今來入見及將來每遇入對並許令臣男康入殿遇拜時扶掖奉聖旨令乘轎子至崇政殿門外於延和殿垂簾日引對餘並依前降指揮臣今月十八日合至都堂遇其日垂簾臣欲隨執政赴延和殿常起居進呈文字竊慮閣門以前來聖旨有免赴起居字及只云三日一至都堂後來聖旨無將來每遇入對並許令臣男康入殿遇拜時扶掖字不聽臣及男康入殿伏望聖慈傳宣閣門十八日許臣隨執政赴延和殿常起居及上殿進呈文字令臣男康入殿遇拜時扶掖仍自今後每遇入對並乞准此取進止中使徐湜封還傳宣聖旨且令入都堂尚書省門下省治事所有入殿起居且頥飬筋力直候秋凉引對所有元上劄子今却令封還并賜食二合乞與諸位往來啇量公事劄子臣近奉聖㫖許臣乘轎子三日一至都堂聚議伏緣三省樞密院每有職事難以臣故必令三日一聚撿㑹去歲曽有指揮遇假日有公事許於東西府聚議其東西府近北舊有便門臣欲乞於近南更開一便門臣今有足疾未愈乞遇假日或日晚執政出省後有合啇量公事許乘小竹轎子往諸位啇量其諸執政有欲啇量公事者亦許來臣夲位更不一一奏聞所貴論議詳盡事無留滯取進止再乞進呈文字劄子臣今月十六日曽具劄子奏乞於十八日隨執政赴延和殿常起居及上殿進呈文字尋蒙聖慈差入內東頭供奉官徐湜封還仍傳宣且令入門下尚書省治事所有入殿起居且頥飬筋力直候秋凉引對此乃聖恩憐臣疲羸恐其不堪勞苦欲其且就安逸雖父母之愛其子恐不能如此之備臣隕身喪元無以為報然臣既參假治事若不以時入對靣盡愚忠少禆萬一則與未參假時無異所以區區陳請不能自巳臣今欲再乞於二十六日隨執政赴延和殿常起居及上殿進呈文字臣至時自度若筋力委實不能枝梧即乞如今來聖旨且只入門下尚書省治事候筯力稍完再有陳請若且可以支梧即乞每遇垂簾日許隨執政赴延和殿常起居及進呈文字仍乞傳宣閣門自今後每遇臣入對許令臣男康入殿遇拜時扶掖取進止乞進呈文字第三劄子臣自前月十二日參假以來兩曽具劄子奏乞隨執政官於延和殿進呈文字皆蒙聖恩遣中使封回令候秋凉陛下矜愛微臣誠至深至厚然陛下不知臣不肖使待罪宰相之職在輔佐天子謨明萬幾朝夕在前啓沃獻替臣自閏二月二日降麻除左僕射屬在病假至今未嘗得一日與諸執政至簾前參陪國論雖許投進文字然中心委細無由一一靣陳陛下徒閔其衰病欲使便安於一身不若使之竭盡愚忠庶幾有𥙷於天下臣為私計豈不願宴安在家若顧公義豈得內無愧懼竊恐上則失陛下所以擢用臣之意下則失微臣忘身徇國之心况巳先奉聖旨權免前後殿起居朝㑹之勞什減七八臣自體當近日以來病勢亦似更減步履比嚮時稍輕但兩足少力若無人扶掖則全拜不得今不免冒乞恩無厭之罪伏望聖慈特降指揮令臣每遇殿上問聖體及謝恩等合拜之時特令免拜若在殿下常起居許令臣康扶掖仍乞傳宣閣門每遇臣入朝許令臣男康隨入殿門如此則於臣羸病之軀優假巳極於公家之務亦無所廢臣今欲乞加臣前奏於今月八日隨執政赴延和殿常起居及上殿進呈文字取進止此劄子若降付三省再候進呈則八日以前皆值假故不坐八日入朝不及如允臣所奏乞直批降指揮依奏論西人請地乞不拒絶劄子臣近具劄子奏乞於今月八日隨執政赴延和殿進呈文字復蒙聖慈遣中使封還令依前降指揮臣不敢再三固違聖旨然臣區區之心所以欲於八日入對者竊見夏國宥州有牒稱凡差人詣闕計㑹所侵疆土城寨竊慮其日進呈上件文字此乃邊鄙安危之機生民休戚之夲不可不察臣自今年二月𥘉以來纍曽上言乞因新天子即位西人恭順之際早下詔書赦其罪戾待遇如故如此則控縱在我天子之體主休兵息民夷夏之心安不幸虜人有一語不遜一騎犯邊則此詔不可復下無何臣在病假不得靣論人心不同為衆所奪日復一日遷延至今虜先遣使來直求侵地指陳兵端辝意浸慢前所議詔書巳不可下矣既失此機㑹即日使者至應答亦難若悉從其所請則彼益驕而無厭若悉拒而不從則邊患由此而起今就二者之中寧為百姓屈巳少從所請紓邊患不可激令憤怒致興兵犯塞以困生民所以然者靈夏之役夲由我起新開數寨皆是彼田今既許其內附豈可猶靳所侵地而不與彼必曰我自天子新即位卑辝厚禮以事中國庶幾歸我侵疆今猶不許則是恭順無益不若以武力取之彼小則上書悖慢大則攻陷新城當是之時不得巳而與之其為國家之恥無乃甚於今日乎以小喻大譬如甲奪乙田未請而與之勝於請而後與若更請而不與則彼必興鬪訟矣此是非利害明如白黑臣竊慮進呈之際群臣猶有見小忘大守近遺逺惜此不毛無用之地結成覆軍殺將之禍兵連不解為國家憂伏望陛下決自聖志勿聽浮言為兆民計文彥博輔佐四朝熟知虜情此可謂軍國重事願陛下詢彥博以決之取進止申明役法劄子臣先曽上言乞直降勑命應天下免役錢一切並罷其諸色役人並依熙寧元年以前舊法人數委令佐揭簿定差蒙朝廷一一如臣所請臣竊聞降勑之𥘉百姓莫不喜恱一兩月間州縣定差巳了别無辭訟人情安帖無何續有雇募不足方行定差指揮人始疑惑既而屢有更張號令不一又轉運使各以已見欲合夲路共為一法不令州縣各從其冝是致州縣惶惑不知所從或巳差役人却放或已放雇人却收或依舊用役錢雇人或不用錢招人充役朝夕不定上下紛紜往往與二月六日敕意相違竊緣臣元𥘉起請及朝廷所降節文明言委逐縣官看詳依今來指揮若有妨礙致施行未得仰具利害擘畫申州州申轉運司轉運司奏聞委執政官再加看詳隨冝修改别作一路一州一縣勑施行務要曲盡其冝豈是當日所言一字不可移易伹患轉運司州縣不肯奏陳耳臣今欲申明元初起請內聲說不明不盡事件謹具畫一如後一臣起請雖云依熙寧元年舊法人數定差若舊法有於今日不可行者即是妨礙合申乞改更人數或太多或太少惟本州縣知得的礭合消數目合酌中立額申乞依數定差朝廷難為遙度一臣起請雖云若所差人不願充役任便選雇有行止人自代雇錢多少私下商量若所雇之人邀勒𬒳差之人廣求雇直官亦當裁定不得過自來官中雇錢之數其州縣官貟即不得指占所雇之人令𬒳差之人雇覔一臣起請雖云見雇役人候差到役人各放令逐便若所雇之人自有田産情願充役者亦自可依舊存留又曹司一役新差之人多不諳熟書算行遣及案下文字未曽交割合留所雇之人給與雇錢令與新差之人同共行遣限半年內交割了畢才放逐便一臣起請云今日衙前陪備少於嚮日不至破家若猶以為戶力難任即乞於官戶僧道單丁女户有屋業每月掠錢及十五貫莊田中年所收斛斗及百石以上者並等第出助役錢不及此數者與放免臣意以為十口之家歲收百石足供口食月掠房錢十五貫足供日用二者相須此外有餘者始令出助役錢非謂止收百石即令助役也若猶嫌太少及所收掠課利難知實數即乞應係第三等以上令出助役錢第四等以下放免若本州坊埸河渡等錢自可支酬衙前重難分數得足則官戶等更不消出助役錢一從來諸州招募人投充長名衙前若招募不足方始差到鄉戶衙前此自是舊法今來别無改更惟是舊日將坊場河渡折酬長名衙前重難令自出賣今來官中出賣坊場河渡收錢依分數折酬長名衙前重難只此與舊法有異若鄉戶差𥙷巳足續有投名即先從貧下放鄉戶歸農鄉戶願投充長名亦聽一臣起請委逐縣看詳具利害擘畫申州本州類聚擇其可取者擘畫申轉運司轉運司類聚諸州所申擇其可取者擘畫奏聞朝廷伏緣知逐處民間利害子細轉運司不如州州不如縣切慮逐縣逐州有擘畫得事理切當而本州及轉運司抑遏刪去不以上聞致敕下之日依舊妨礙施行未得欲乞更降指揮下州縣如有似此擘畫切當被在上刪去者許逐縣直申轉運司本州直申奏所貴下情無壅曲盡事冝仍乞降指揮下詳定役法所只得以諸路州縣申到利害詳其可否立為定法其不當職之人為髙竒之論不切事情者不得施行亦不可將一路一州一縣利害作海行條貫一詳定役法所奏請行下指揮若有妨礙難行之事亦乞如臣起請委逐路州縣看詳具利害擘畫申上隨冝修改右臣所言若有可取乞遍頒下諸州縣除此外並依二月六日所降敕命施行乞進呈文字第四劄子臣近曽三次具劄子奏乞與諸執政赴延和殿進呈文字皆蒙聖慈遣中使封還云候秋凉雖聖恩矜閔隆厚無窮然臣既待罪宰相豈可不於簾前參陪國論况今巳立秋兼臣自體當得筋力差勝於前可以支梧只是無人扶掖全拜起不得欲乞如臣前奏候垂簾日許令與諸執政赴延和殿常起居同進呈文字并乞特降指揮云云殿門取進止聖意若不欲批指揮即乞降付三省乞延和殿常起居劄子臣昨乞自今後遇延和殿垂簾日赴起居奏事蒙聖恩依所乞為足瘡所有起居等宜特與權免拜及令男康扶掖入殿者臣若得男康扶掖實可以拜起臣既久不靣天顔豈有全不拜之理欲乞每遇延和殿垂簾日與吕公著同班常起居取進止乞官劉恕一子劄子臣伏覩祕書少監劉攽等奏故祕書丞劉恕同編修資治通鑑功力最多比及書成編修屬官皆蒙甄録惟恕身亡其家獨未霑恩門户單露子孫並無人食祿乞依黃鑑梅堯臣例官其一子臣往嵗初受勑編修資治通鑑首先奏舉恕同修恕博聞強記尤精史學舉丗少及臣修上件書其討論編次多出於恕至於十國五代之際群雄競逐九土分裂傳記訛謬簡編缺落歲月交互事迹差舛非恕精博它人莫能整治所以攽等以衆共推先以為功力最多不幸早夭不見書成未死之前未嘗一日捨書不修今書成奏御臣等皆蒙天恩褒賞甚厚獨恕一人不得霑預降為編户良可矜閔欲乞如攽等所奏用黃鑑梅堯臣例除一子官使其平生苦心竭力不為虛設取進止乞以十科舉士劄子臣竊惟為政之要莫如得優百官稱職則万務咸治然人之才性各有所能或人於德而嗇於才或長於此而短於彼雖臯夔稷契止能各守一官况於中人安可求備是故孔門以四科論士漢室以數路得人若指瑕掩善則朝無可用之人苟隨器授任則丗無可棄之士臣誤蒙甄擢備位宰相慎選百官乃其職業而智識淺短見聞𥚹狹知人之難聖賢所重寰宇至廣俊彥如林或以恬退滯淹或以孤寒遺逸𬒳褐懷玉豈能周知若專引知識則嫌於挾私難服衆心若止循資序則官非其人何以致治莫若使在位達官人舉所知然後克協至公野無遺賢矣臣不勝狂愚欲乞朝廷設十科舉士一曰行義純固可為師表科有官無官人皆可舉二曰節操方正可備獻納科舉有官人三曰智勇過人可備將帥科舉文武有官人此科亦許鈐轄巳上武臣舉四曰公正聰明可備監司科舉知州以上資序人五曰經術精通可備講讀科有官無官人皆可舉六曰學問該博可備顧問科有官無官人皆可舉七曰文章典麗可備著述科有官無官人皆可舉八曰善聽獄訟盡公得實科舉有官人九曰善治財賦公私俱便科舉有官人十曰練習法令能斷請讞科舉有官人應職事官自尚書至給舍諌議寄祿官自開府儀同三司至太中大夫職自觀文殿大學士至待制每歲須得於十科內舉三人非謂每科各舉三人謂各隨所知某人堪充某科共計三人其狀云臣竊見某人有何行能並須指陳事實不得徒飾虛辭位在上者得舉在下之人位在下者不得舉在上之人臣今保舉堪充某科如蒙朝廷擢用後不如所舉謂若舉行義純固而違犯名教節操方正而佞邪險躁智勇過人而愚懦致敗公正聰明而私曲昏暗經術精通而不能講讀學問該博而空踈牆靣文章典麗而鄙拙紕繆善聽獄訟而冤滯失實善治財賦而病民耗國練習法令而屢致出入及犯正入已贓臣甘伏朝典不辭候奏狀到日付中書省擇勤謹吏人專切收掌仍科各置簿畫時抄録年月日某官姓名别置合舉官臣僚簿歲終不舉及人數不足按劾施行或遇在京或外方有事須合差官體量相度點檢磨勘剗刷催促推勘定奪則委執政親檢逐簿各隨所舉之科選差令試管旬上件事務若能辦集即别置簿記其勞績遇本科職任有闕謂若經筵或學官有闕即用行義純固經術精通學問該博等科人臺諌有闕即用節操方正科人之類則委執政親檢逐簿選名實相稱或舉主多或有勞績之人補充仍於本人除官勑告前盡開坐舉主姓名於後或不如所舉其舉主從貢舉非其人律科罪犯人正入已贓舉主减三等科罪若因受賄徇私而舉之罪名重者自從重法期在必行不可寬宥雖見為執政官朝廷所不可輟者亦須降官示罰即朝廷臨時因事特詔舉官謂若舉知河渠馬牧等之類不在十科之內者有不如所舉亦同此法所貴人人重慎所舉官皆得人取進止溫國文正公文集卷第五十三
