body:
  text: 論一十哲論龔君賔論邴吉論賈生論四豪論㢘藺論才德論知人論十哲論十哲於經無見而學者多稱之國家祀孔子十哲則祀於堂上其餘門人祀於東西廡下俎豆之數皆異焉愚竊以爲過矣是十人者孔子雖以四科第之非謂門人之中唯十人爲賢也至於柴也愚參也魯師也辟由也喭豈謂唯此四人爲不肖邪以此觀之尊十哲非孔子意明矣必若以一善取之則門人之賢者非止十人也以盡善取之則德行之外未有無過者也孔子謂宰我曰朽木不可彫於予與何誅謂子貢曰賜不受命而貨殖焉億則屢中謂冉有曰求也非吾徒也小子鳴皷而攻之可也謂子路曰由知德者鮮矣謂子夏曰啇也不及然則豈爲盡善邪又十哲之外孔子之所稱譽多矣曽點與子路冉有俱侍坐各言其志而孔子獨曰吾與點也曽參以至孝顯孔子爲之語孝經又謂子賤君子哉若人然則十人之餘豈可盡誣邪且政事言語文學之髙者不足以當德行之卑者是十人者其中固有差等矣豈可爲之一槩邪龔君賔論王莽慕龔君賔之名訹以尊爵厚禄劫以淫威重勢而必致之君賔不勝逼迫絶食而死班固以薫膏之語譏焉未聞有爲之辨者也可不大哀昔者紂爲不道毒痡四海武王不忍天下困窮而征之斯則有道天子誅一亂政之匹夫爾於何不可而伯夷叔齊深非之義不食周粟而餓死狷隘如此仲尼猶稱之曰仁以爲不殞其節而已况於王莽慿漢累丗之恩因其継嗣衰絶飾詐僞而盗之又欲誣洿清士以其臭腐之爵禄甘言䛕禮期於必致不可以智免不可以義攘則志行之士舎死何以全其道哉或者謂其不能黜芳弃明保其天年然則虎豹之鞹何以異於犬羊之鞹庸人之行孰不如此又責其不詭辭曲對若薛方然然則將未免於謟豈曰賢能故君賔遭遇無道及此窮矣失節之徒排毀忠正以遂己非不察者又從而和之太史公稱伯夷叔齊不有孔子則西山之餓夫誰識知之信矣哉邴吉論邴吉爲丞相出逢群盗格闘死傷橫道過之不問見牛喘而問之以爲詰禁盗賊守令之事隂陽不調此乃宰相職耳談者美之愚竊以爲不然夫宰相所以治隂陽者豈拱手端居無所施設而隂陽自調蓋亦佐人主治庶政安四海使和氣洋洋薄於宇宙旁暢周逹浸潤滲漉明則百姓洽幽則鬼神諧然後寒暑時至萬物阜安雖古昔聖人之治天下至於隂陽和寒暑時而至治極矣豈庸人所能致哉當邴吉爲政之時政治之不得刑罰之失中不肖之未去忠賢之未進可勝紀哉釋此不慮而慮於牛喘以求隂陽不亦踈乎且京邑之内盗賊縱横政之不行孰甚於此詩云啇邑翼翼四方之極近不能正如逺人何若曰守令之職守令不賢當責何人非執政者之過而又誰歟昔士㑹爲政晋國之盗逃奔于秦子産爲政桃李垂於街者莫援若盗賊不禁而曰長安令之職風俗不和而曰三老之職刑罰不當而曰廷尉之職衣食不足而曰司農之職推而演之天下之事各有其官則宰相居於其間悉無所與而曰主調隂陽隂陽固可坐而調耶愚以爲邴吉自知居其位而無益於丗飾智譎問以揜其迹抑亦自欺而巳矣賈生論丗皆以賈生聦明辯博曉練治體若遭明主當治丗誠得盡用其道三代可復帝皇可幾不幸黜於絳灌踈廢早終可爲痛惜愚以爲賈生學不純正雖有儁才任之爲治必不效矣何以知之觀其書而知之賈生數上䟽陳得失云可爲痛哭者一流涕者二太息者六然所謂痛哭者諸侯太彊也以爲指大於股脛大於腰乆而不制必爲國害夫爲天下者患政刑之不立不患諸侯之太彊賈生言不見用然終文帝丗諸侯帖服孝景𥘉立晁錯不勝其憤而削之反者紛然響應起不踰時敗亡不救惡能爲漢之大害哉所謂流涕者匈奴不賔也匈奴荒外之國与禽獸無殊天下治而不服不足損聖王之徳天下弊而得之不足爲聖王之功而賈生孜孜愛其蕞爾之金絮忘其征討之大費忿其區區之禮莭忽其勤民之鉅害惡在其爲知治體也夫治天下之具孰先於禮義者安天下之本孰先於嗣君者禮義不張雖復四夷賔服疆埸不聳當如内憂何儲嗣失教雖復諸侯微弱四方無虞其誰能守之然賈生以此二者列之於後以爲餘事捨國家之紀綱遺天下之大本顧切切然以列國外夷爲慮皆涕泣之可謂悖本末之統繆緩急之序謂之知治體何哉又曰仁義者人主之芒刃也法制者人主之斤斧也不能以道輔人主鎭撫諸侯綏之以徳齊之以禮而欲踈骨肉断慈惠視仁義爲虚噐操刑法爲利柄翦周礼之夷塗樹申啇之險術由此觀之所學豈得爲純正耶丗人不察其所由之術苟見其材之茂學之愽其言暐瞱可觀而不得施於丗因從而歎之不知夫駮濫刻深非吾黨也夫唯材髙而道不正者君子惡之四豪論戰國之時天下禮義消亡下陵上替諸侯僣天子大夫偪諸侯陪臣之間有能約身抑志尊賢養士不愛煩費以樹聲名者齊有孟甞魏有信陵趙有平原楚有春申雖不能以禮義佐其君以政教和其民合於至公槩於大道然自奮於濁丗天下談士異口同舌咸謂之賢銓於四人臧否優劣亦可聞歟論者曰凡人臣者上以事君中以利國下以養民釋此三者非人臣也臣而不臣聖王當丗必爲誅首孟甞君養亡頼匿亡命廢公法樹私恩媮采名譽以竊國相之位迹其行事皆爲身耳非能爲國與民謀也至其晚節遂挾仇敵以覆宗國保薛中立自比諸侯臣而不臣孰甚於此春申君進書秦宫解楚國社稷之憂縱楚太子而自以身當不測之誅智勇忠信有足稱者至其柱石楚國權寵無貳割江東之封窮僣奢之樂十餘年間楚國益弱又納邪人之言造姦僞之謀亂其國嗣洿敗王家方諸田文罪又甚焉終爲李園所襲身首屠裂則其智勇忠信果安在也平原君行事大倣孟甞至於貪上黨之田致邯鄲之禍遂至國家大敗社稷幾亡于以知其智謀尤岀數子之下也然趙奢戮平原君之客奢諭釋以公義而平原君薦奢於朝卒著功名且平原君臣人之節終始無虧此其賢於孟甞春申逺矣信陵君以母弟之親卿相之尊抱關鼔刀之人親執馭而事之詘而不耻勞而不倦非有髙丗之材孰能如此且向使侯生朱亥皆實庸人公子雖事之如是不足稱也然公子所以降身詘志者審知二子之賢耳以區區之魏惴懼之衆當秦乗勝十倍之兵一戰却之邯鄲全六國安信陵君之功也秦乗公子之去魏急攻大梁公子一悟毛薛之言翻然易慮歸救宗國復破秦軍閉諸函谷可謂能矣魏王信䜛猜阻公子公子遂滅迹酣飲全身逺害以其壽終可謂智矣智能如此而又守之以仁行之以恭必若采善於亂丗論賢於游俠則彼三人者蔑以加其上矣故校其臧否當以信陵爲首平原次之孟甞又次之春申爲其下矣或曰無忌盗國兵符矯殺晉鄙以赴平原君之私交雖有功於魏非忠臣也何以賢於三子對曰趙魏脣齒之國以虎狼之秦攻危亡之趙趙亡則魏斃理勢然矣魏王不逹事冝徒畏彊秦之空言坐擁盛兵以觀成敗計之大失無過於此故無忌矯奪其軍以救趙非獨赴趙之難亦爲魏謀也奚其不忠哉漢髙祖過大梁輙祠信陵君爲置守冢者彼三子則皆無旌異髙祖英主也蓋有以知之矣廉藺論丗稱藺相如以區區之趙抗虎狼之秦秦雖彊暴不能陵趙者相如之功也謂其賢於廉頗光竊疑之何則秦之所以不能陵趙者以其國治兵強也固非口舌之間所能抗也然則國何以治兵何以強豈非廉頗在其位耶趙得和氏璧秦王聞而欲之請易之以土田相如奉璧銜命而往秦王欲強取之相如抗節不撓視死如歸卒欺秦王而歸璧於趙以是爲相如之功噫又何足稱哉夫和氏之璧懷握之玩得之不足以爲重失之不足以爲輕而相如以死爭之以詐取之有如秦王赫然増怒肆其強暴逞其毒螫葅醢相如移兵攻趙是爲趙王愛數寸之玉喪國士之賢貪無用之噐貽宗廟之憂人臣愛君果如是哉澠水之㑹秦王謂趙王皷瑟而詔史書之相如進缶於秦王秦王不可則挺劒劫之必得當而後止是何異賈竪小人矝豪恃氣不能相下者惡足言功哉昔桀爲無道湯幽囚於夏臺戎狄侵豳太王避之於岐文王三分天下有其二就拘於羑里夫以幽拘之辱弃國而逃與一皷瑟之間孰難哉然而三王忍恥行之卒蹶夏啇撫綏四海相如儻能相趙王示㣲弱以驕秦忍小恥以怒趙崇德修政以須秦之可亡從而仆之濟黔首於塗炭救赤子於虎狼其功烈豈不煒㷸光遠哉而於罇俎之間壇坫之上爭言暴氣取當而止英偉之士不亦可羞哉趙王不能逺觀嘉其一命之不辱賞其要劫之小䇿一旦位諸功實之上㢘頗日夜憤憤欲礪刃刺之而相如能不與之校此則賢矣然亦不可用一善掩大功丗稱藺優於㢘非通論也才德論丗之所謂賢者何哉非才與德之謂邪二者殊異不可不察所謂才者存諸天德者存諸人智愚勇怯才也愚不可強智怯不可強勇四者有常分而不可移故曰存諸天善惡逆順德也人苟弃惡而取善變逆而就順孰禦之哉故曰存諸人譬之於物金可以爲鍾可以爲鼎玉可以爲珪可以爲璧此存諸人者也玉不可以爲鍾鼎金不可以爲珪璧此存諸天者也存諸天者聖人因而用之存諸人者聖人教而成之雖然自非上聖必有偏也厚於才者或薄於德豐於德者或殺於才鈞之不能兩全寧捨才而取德昔者鄷舒有三儁才恃之而不務德晉滅之智宣子將以瑶爲後智果曰不如宵也瑶之賢於人者五其不逮者一也美鬚長大則賢射御足力則賢技藝畢給則賢巧文辯慧則賢彊毅果敢則賢如是而甚不仁以其五賢陵人而以不仁行之智宗必滅宣子弗聽智氏果亡故曰寧捨才而取德抑又聞之爲國家者進取莫若才守成莫若德進取不以才則無功守成不以德則不乆陳平貪汚之人也韓信無恥之士也樊噲屠者而酈食其酒徒也天下之至賤無行者也然其才皆有過人者漢祖舉而用之故蹶秦仆項而卒兼天下也魏國置相而用田文吴起不恱與之論功田文曰我戰闘治民皆不如子若主㓜國危大臣未附百姓不信當是時屬之子乎屬之我乎吴起乃謝曰屬之子矣此言田文無他技能唯忠厚可信也夫有德者必不反其君故可以託六尺之孤寄百里之命爲社稷臣有才者不必忠信故以羈䇿御之而爲德者役也然則德者掌也才者指也掌亡則指不可用矣是故民者田也國者苗也才耒耜也德膏澤也進取不以才猶無耒耜而耕也雖勤灌漑不能生矣守成不以德猶旣種而無膏澤也苗槁無日矣故人主利其耒耜以墾治其民而封殖其國又引膏澤以漑之使其本根深固而枝葉葰茂故子孫謹守其畔穫而食之而巳復何爲哉知人論考制度習威儀辯牢餼之等詳邊豆之數此宗人之職也察清濁别邪正恊律吕之音肄綴兆之容此太師之職也練士卒簡噐械戰必勝攻必取此將帥之職也明法令審獄訟禁強禦誅姦回此士師之職也豐衣食衍貨財通有無紓滯積此司㑹之職也便舟輿利噐械守法度禁淫巧此工師之職也考龜筴占祲祥相吉凶眎休咎此太卜之職也謹蓋藏吝出納治文書精㑹計此府史之職也若夫選賢而進之量能而任之成功者賞敗官者誅此則人君之職也夫天下至廣也兆民至衆也萬機至繁也而天子兼而有之必將以一人之耳目智力爲之則所及者寡所廢者多矣是以明主擇輔佐以論官師論官師以正群吏正群吏以和萬民則治約而事無曠矣益稷曰元首明哉股肱良哉庶事康哉此言君明則臣良臣良則事康也立政曰宅乃事宅乃牧宅乃凖兹惟后矣又曰文王惟克厥宅心乃克立兹常事司牧人以克俊有德文王罔攸兼于庶言庶獄庶慎惟有司之牧夫是訓用違庶獄庶慎文王罔敢知于玆此言人君急於知人緩於知事也魏文侯與田子方飲文侯曰鍾聲不比乎左髙田子方笑文侯曰何笑子方曰臣聞之君明樂官不明樂音今君審於音臣恐其聾於官也是以笑荀子曰治國有道人主有職若夫貫日而治詳一日而曲列之是所以使夫百吏官人爲也不足以是傷遊玩安燕之樂若夫論一相以兼率之使臣下百吏莫不宿道郷方而務是夫人主之職也人主者守至約而詳事至佚而功垂衣裳不下簟席之上而海内之民莫不願得以爲帝王夫是之謂至約樂莫大焉人主者以官人爲能者也匹夫者以自能爲能者也人主得使人爲之匹夫則無所移之百畒一守事業窮無所移之也今以一人兼聽天下日有餘而治不足者使人爲之也大有天下小有一國必自爲之然後可則勞苦耗悴莫甚焉如是則雖臧獲不肯與天子易勢業以是統天下一四海何故必自爲之爲之者役夫之道也墨子之說也論徳使能而官施之者聖王之道也儒之所謹守也傳曰農分田而耕賈分貨而販百工分事而勸士大夫分職而聽建國諸侯分土而守三公揔方而議則天子共己而己矣由是言之人君之事守莫大於知人也昔者舜導百川不如禹殖百榖不如稷布五教不如契聽五刑不如臯陶典百工不如垂典山澤不如益典禮不如伯夷典樂不如䕫然而明此八者之本能知其人而任使之者舜也譬若車之有轂宮之有棟人之有心此群聖所以爲之役而歸之功也嗚呼帝王之事美矣大矣固不可得而言也齊淵聖御名公兄弟爭國暴於犲狼閨門不治甚於狗彘然獨能知管仲之賢舉國而委之一則仲父二則仲父是以兵車之㑹三乗車之㑹六指麾左右而諸侯莫敢不從後丗言淵聖御名公者徒知其賢而不復知其惡也孔子言衞靈公之無道季康子曰夫如是奚而不喪子曰仲叔圉治賔客祝佗治宗廟王孫賈治軍旅夫如是奚其喪齊文宣帝荒淫狂悖甚於桀紂然而知楊愔之賢悉以國事委之時人以爲主昏於上政清於下凡此皆淫昏暴亂之君也徒以能知賢人而用之大者以覇其次以安小者以存况乎以聖君而用賢臣是猶王良之御六驥逢蒙之關繁弱孟賁之揮干將何適而不逹何射而不中何撃而不断哉或曰人主之職在知人則旣知之矣抑以堯之聖而失之四凶孔子之聖而失之宰我子羽夫人豈易知也哉曰是則然矣夫射者必志於的弓矢旣調專精審固而發之雖或不中亦鮮矣與夫冥冥而射者不猶愈乎昔臯陶陳九德曰寛而栗柔而立愿而恭亂而肅擾而毅直而温簡而㢘剛而塞彊而義彰厥有常吉哉日宣三德夙夜俊明有家日嚴祗肅六德亮采有邦翕受敷施九德咸事俊乂在官百僚師師百工惟時孔子曰視其所以觀其所由察其所安人焉廋哉人焉廋哉李克曰居視其所親冨視其所與逹視其所舉窮視其所不爲貧視其所不取是亦知人之術也顧人主不深察而巳矣温國文正公文集卷第七十
