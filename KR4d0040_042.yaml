front:
  text: 温國文正公文集卷第四十二
  hash: sha256:4e8ca9303fdbe365e34dadeff44ccceebe36a59dcb10e4425e508b12529ef15f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_042-1a}
body:
  text: 章奏二十七辭樞宻副使第四劄子辭樞宻副使第五劄子貼黄二道辭樞宻副使第六劄子乞免永興軍路青苗助役錢劄子乞不令陜西義勇戍邊及刺充正兵劄子乞留諸州屯兵劄子宗室襲封劄子辭樞宻副使第四劄子臣准句當御藥院陳承禮傳宣令臣即今入見者臣仰煩聖恩重沓如此雖頑如木石亦當遷變然臣固守愚志不移者誠以荷盛徳者必有以酬報居重位者不可以無功臣自惟立朝材器短淺一無所用獨有補過拾遺可禆萬一方今爲天下患者唯有制置三司條例司及諸路提舉句當常平廣惠倉使者若陛下朝發一詔罷之則夕無事矣故臣不量力勢輕用上陳儻陛下以臣言爲是乞早賜施行若以爲非則臣乃狂愚之人於今英俊滿朝而擢用狂愚之人使汚宥宻之地豈不以爲聖政之累也伏望聖慈追還樞宻副使恩命令臣且供舊職取進止辭樞宻副使第五劄子臣准句當御藥院李舜舉傳宣令臣即今赴閤門授勑告者陛下聖恩無窮愚臣辭避不巳盡下之德愈盛慢上之罪愈深憂惶失圗無地自處臣竊惟陛下今茲不次用臣必以識慮爲小有可采臣亦以受陛下非常之知不可以全無報効是以乞罷制置三司條例司及諸路提舉句當常平廣惠倉使者若陛下果能行此勝於用臣爲兩府臣若得此言果行勝於居兩府之位儻或所言皆無可采臣獨何顔敢當重任伏望聖慈矜察更不復遣使臣宣召追還樞宻副使恩命庶使賤臣差獲自安取進止貼黄二道李舜舉傳聖旨諭臣以樞宻院夲兵之地各有職分不當更引它事爲辭臣今若巳授樞宻副使勑告即誠如聖旨不敢更言職外之事今未受恩命猶是侍從之臣於朝廷闕失無不可言者所以區區貪進小忠庶幾少補聖政之萬一况所言二事並是去年巳曽上言以其無効所以不敢當今日新恩非爲侵官乞聖明裁察兼臣右膝下見患一瘡有妨拜起入見未得伏望聖慈更不差使臣宣召候膝瘡稍愈自乞入見面奏懇誠辭樞宻副使第六劄子尋得旨聽許臣伏准句當御藥院劉有方傳宣撫問兼問臣取幾日入見令早入者聖恩深厚不忘微賤存恤勤至臣螻螘之命無足報塞惶恐無措伏念臣即今膝瘡雖稍减可尚未全愈有妨拜起未知可以入見之日不獨如此兼爲臣近曽上䟽言乞罷制置三司條例司及追還諸路常平廣惠倉使者未聞朝廷少賜采録但聞條例司愈用事催散青苗錢愈急中外人情愈遑遑不安臣當此際獨以何心敢當髙位故寧𬒳嚴譴未敢輙出臣聞古者國有大事謀及卿士謀及庶民參酌下情與衆同欲是以事無不當令無不行未嘗有四海之内卿士大夫農商工賈異口同辭咸以爲非獨信二三人之偏見而能成功致治者也伏望陛下出臣近所上䟽宣示中外臣庶使共决其是非若臣言果是乞早賜施行若臣言果非乞更不差使臣宣召早収還樞宻副使勑告治臣妄言及違慢之罪明正刑書庶使是非不至渾殽微臣進退有地不爲天下之所疑怪取進止乞免永興軍路青苗助役錢劄子臣奉勑差充永興軍一路安撫使臣竊見陜西百姓自城綏州以來供應諸般科配及支移稅賦往近邊州軍日近復有環慶事宜加之今年亢旱五稼不熟人户流移者巳聞不少國家所冝汲汲存恤使人户安集臣伏見先所散青苗錢貧破百姓爲害不細臣巳曽累次上言不敢重煩聖聽今又聞議者欲令州縣將諸色役人一時放罷官爲雇人祗應却令人户均定免役錢隨二稅送納乃至單丁女户客户寺觀等並令均出若果行此法其爲害必又甚於青苗錢何則上等人户自來更互充役有時休息今歳歳出錢是常無休息之期也下等人户及單丁女户等從來無役今盡使之出錢是孤貧鰥寡之人俱不免役也若錢少則不足以雇人若錢多則湏重歛於民雇人不足則公家闕事重歛於民則衆心愁怨自古以來繇役皆出於民今一旦變之臣未見其利也且受雇者皆浮浪之人使之主守官物則必侵盗使之幹集公事則必爲姦事發則挺身逃亡無有田宅宗族之累建議者亦自知其不可乃云若雇召人不足即依例輪差支與逐處所定雇錢足了役事自當有人應募今旣無人應募必是錢少不足充役是徒有免役之名而役猶不免但無故普増數倍之稅也彼青苗錢以債與民而取其息巳是困民之法今又使撗出數倍之稅民安有不困蹷者哉以富庶之域猶不能堪况陜西累歳奉邊民力彫弊豈可復爲無益之事以擾之乎伏望聖慈特免永興軍一路青苗免役錢以愛惜民力專奉邊費其餘路分則繫自朝廷裁酌取進止乞不令陜西義勇戍邊及刺充正兵劄子臣先任諫官日伏見國家揀刺陜西義勇臣累曽論列以爲徒使百姓愁苦無益於用近聞環慶路用義勇與西賊戰闘望風奔潰死傷甚多致主將䧟没此義勇不可用之明驗也臣竊聞議者猶欲教閱義勇以抗西賊若止令州縣教閱守護郷土猶於人情不至大擾若發以戍邊或如慶曆中刺爲正兵則衆人覩環慶之敗譬如無罪往就死地恐於人情大有不安國家旣重賦歛以盡其財又逼之戰闘以絶其命是驅良民使爲盗賊也彼爲官軍則惜生故望風退走彼爲盗賊則必死自可以一敵百臣恐今日教之挽射擊刺乃它日爲盗之資也廟堂之議臣所不得知万一有之詔下之日臣論列不及况當逺離朝廷故不得不先事而言也取進止乞留諸州屯兵劄子臣奉敕充永興軍一路兵馬都緫管安撫使臣竊聞夲路十州所管屯駐禁軍至少大率皆是縁邊就粮兵士常時分爲上下畨有一半在逐州或遇邊上稍有警急則盡皆抽去逐州並無守把兵士臣竊惟天下事不可忽必湏思患豫防戎狄犯邊雖當竭力扞禦然腹内州軍豈可全無武備况逐州皆有軍資甲仗市邑民居万一犬羊奔突間諜内應或盗賊乗虚姦人竊發其夲州官吏手下無兵雖有智勇將安所施臣愚以爲逐州冝各添一指揮禁軍屯駐内永興軍爲閞中根夲宜添兩指揮若朝廷別無兵士可以差撥只乞於縁邊就粮兵士内依此数目撥留在逐州屯駐邊上更不得句抽所貴緩急不至失備取進止宗室襲封議時在學士院朝廷以爲非是兩制議者各贖銅三十斤礼院各追一官臣等竊原聖人制禮之意必使嫡長丗丗承襲者所以重正統而絶爭端也古者諸侯生立丗子死則襲爵故令文稱諸王公侯伯子男皆子孫承嫡者傳襲若無嫡子及有罪疾立嫡孫無嫡孫以次立嫡子同母弟無母弟立庶子無庶子立嫡孫同母弟無母弟立庶孫曽孫以下准此皆謂始薨之時應襲爵之人也其無後者則國除自唐末以來王公以下不復承襲國朝故事常封夲宫最長者一人爲國公陛下以爲非古故於去年十一月十一日降勑節文稱宣祖太祖太宗之子皆擇其後一人爲宗令丗丗封公𥙷環衛之官以奉祭祀不以服屬盡故殺其恩禮又稱其非祖免親更不賜名授官太常禮院㝷奉檢詳國朝近制諸王之後皆用夲宮最長一人封公継襲今來新制旣言祖宗之子皆擇其後一人爲宗即與自來事體不同夲院參詳合依禮令傳嫡承襲閏十一月五日奉聖旨祖宗之子并濮國公並令傳嫡襲封所有見今諸宫院已封公者令依舊將來即更不襲封臣等詳觀兩次詔旨丁寧皆欲以復古禮而重正統也今據禮院所定諸王後合襲封人内除越王曽孫丗程魯王孫宗肅韓王孫宗繢呉王孫宗絳並依禮令當傳襲外其昭成太子陳王蔡王皆無後國當除宗保仲郃宗逹以旁親継襲乃是朝廷特恩爲之立後紹封其國於禮典亦無乖違所有秦王之後陳薦等欲立其庶曽孫克継韓忠彦等欲立其庶長孫承亮楚王之後陳薦等欲立其庶曽孫丗逸韓忠彦等欲立其庶長孫從式魏王之後衆禮官皆欲立其嫡孫同母弟宗惠臣等看詳三王見今自有正統而承亮從式宗惠皆係旁支若此三人襲三王之封則子子孫孫常居環衛丗襲爵禄與國無窮其正統子孫祖免以外更不賜名授官數丗之後降在皁隷如此三人何幸而封正統何罪而絶不惟與禮令之意乖違亦非聖詔所謂爲宗傳嫡者也所以然者蓋縁禮令據初薨之時定爲嗣之人今日於數丗之後議當爲後者事體有殊而專執令文所以參差不合而異論紛紜也臣等按忠彦等以爲令文之制與古稍異若無嫡孫而有嫡曽孫則捨曽孫而立嫡子母弟若無母弟又立庶子以此知亦許推及旁支常以親近者爲先也今令文稱無嫡孫同母弟則立庶孫以禮典與五服勑言之諸子之子除嫡長外皆爲庶孫旣云立庶孫則當於諸房庶孫内擇其長者一人立之蓋王視庶孫恩親等也庶孫比曽孫行尊而屬近也臣等按令文皆約古禮爲之安有與古不同之理借使不同朝廷方憲章稽古亦當捨令而從禮豈可棄禮而就令也况令文所謂子孫承嫡者傳襲言嫡子嫡孫相継不絶雖經百丗皆應傳襲也若不幸而絶則有立嫡子同母弟以下之事非謂有嫡曽孫捨之不立而立嫡子之母弟也晉庾純云古者所以重宗諸侯丗爵士大夫丗禄防其爭競故明其宗也吴啇云按禮貴嫡重正所以尊祖禰継丗之正統也夫受重者不得以輕服服之是以孫及曽元其爲後者皆服三年受重故也王敞云君爲祖三年旣爲君而有父祖之喪者謂父祖並有廢疾不得受國而巳受位於曽祖者也范宣云嫡孫亡無後則次子之後乃得傳重以此觀之明嫡統不絶則旁支無継襲之道然則令文所謂子孫承嫡者傳襲自嫡曽孫以下皆包之矣所以更言若無嫡子及有罪疾立嫡孫者嫌人無嫡子即立嫡子之母弟或嫡子有罪疾并其嫡孫廢之故也又言曽孫巳下准此者謂庻孫以上皆無即立嫡曽孫之母弟無母弟則立庶弟之類是也若令文之意但以行尊屬近者爲嗣則無嫡子使應立嫡子母弟及庻子何爲更立庶孫也必若忠彦等所云則國家故事取夲宫最長者一人封公巳是行尊屬近之人更當遵行何必更有改作也彼令文所指者傳襲之人五服敕所載喪服之制事理各殊豈可引喪服之庶孫證傳襲之庶孫也且造令之時王公以下薨則傳襲故少有立曽元者今諸王之薨巳歴數丗乃更追議當爲後之人則不應捨正統而更取旁支也今欲使合於古而適於今則莫若自國𥘉以來於其人薨没之時定當爲嗣者以至於今日則於禮令不失而亦不離正統矣案秦王以雍熈元年薨於時嫡子德恭當立德恭以景德三年卒嫡長子承慶當立承慶以寳元二年卒無嫡子有庻子六人長曰克晤先卒無子次曰克継當立楚王以某年薨嫡長子惟叙當立惟叙以大中祥符五年卒嫡子從煦當立從煦以慶暦五年卒無嫡子有庻子丗逸一人當立魏王以某年薨無嫡子有庻子三人長日允升以某年卒嫡子宗禮當立宗禮以治平二年卒嫡長子仲翹先卒無子次母弟仲髦亦先卒次母弟仲蒼當立以此考之其當爲後者豈不明白矣所有承選雖是德文之嫡子其父元非嫡長自不應承襲蓋因今來承亮以庻孫得承襲故従承選有辝先王制禮皆夲諸天地酌之人情譬如四支百體不可移也移之則綱紀紛乱爭端並興於承選可以見其驗矣臣等謹依古禮及令文并去年十一月十一日勑命閏十一月五日聖旨指揮撿詳屬籍重行定奪到秦王之後合以克繼襲封楚王之後合以丗逸襲封魏王之後合
