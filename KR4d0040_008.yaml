front:
  text: 温國文正公文集卷第八
  hash: sha256:1fe619ab3cdaf3ad27694dbb67b99bf3cb9ba9668771e3180508999f4c779332
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_008-1a}
body:
  text: 律詩三送楊祕丞秉通判楊州送光禄王卿周致仕歸荆南贈清衍和道粹春寒趨舘馬上口占同次道元日宿尚書省聽誓戒寄常州邵不疑去􅍲是日次道同不疑宿直和子淵除夜春祠致齋寄呈景仁次道雙井茶寄贈景仁送王殿丞悋西京簽判和子淵元夕送謝都官顗知光化軍送仲更歸澤州二月二日太常致齋晨起呈景仁次道二同舎送劉觀察從廣知洺州寒食御筵口号二首致政楊侍郎挽歌二首送晁校理仲衍字子長知懷州席上賦得榛二月二十日與同舎宴李氏園晚歸馬上賦詩用歸字韻送師道知長溪因歸覲省雙竹詩和次道奉慈齋宮見寄送次道通判西京送劉儀先輩大名尉送皇甫寺丞穆知藍田縣酬次道板橋晚望見寄送祁嶠頴陽主簿送李尉以監丞致仕歸閩中和伯鎮再入館和同舎對菊無酒文太師挽歌三首文路公父送李祠部復圭字審言知滑州和道粹垂拱早朝王范二直閣班列在前戯成小詩荅劉邍父賀龐公惠炭送田校理諒字仲孚知晉州前判吏部南曺正月三日與廣淵同出南薫門分趨齋宮塗中有作寄題常州東山亭送人爲閩宰送才元知廣安軍歸成都覲省送上雒王推官經臣送瀛州簽判蘇袐丞寀和次道西都元日懷不疑并見寄王金吾北園二月二十四日館宿興宗舎後桃花盛開偶書牖上送周寺丞畋知洛南周華人送齊學士廓字公闢知荆南送王待制知陜府送張景淳知邵武軍送章伯鎮知湖州送王伯𥘉通判婺州送張少卿學士子憲知洪州送昭逺兄歸陜寄清逸魏處士送雲卿知衛州送昌言知宿州送濟川知漢州二首哭公素送程端明知成都丁尚書挽詞二首奉和濟川代書三十韻寄諸同舎和始平公貽一二賔僚留客和始平公長句寄漢州何學士濟川有書見貽云以親老湏守逺郡以便禄養不得如光在主人幕下因以詩荅閼逢敦牂二月十一日與一二僚友遊叔禮園亭以詩戯呈十四日小園置茶招宗聖應之皆辭以醉爲詩贈之同僚有獨遊東園者小詩寄之三首小詩招僚友晚遊後園二首小園晚飲賦得春字李花得韻同前東䆫奉和始平公酬大資政吴侍郎晚行後園見菊戯冝甫野菊送楊秘丞秉通判揚州苦聞小杜說楊都當昔豪華今在無江勢横來控南楚地形前下瞰東吴萬商落日舩交尾一市春風酒並壚得意莫忘京國友滿塵衝雪奉朝趨送光禄王卿周致仕歸荆南九列誰云非顯塗人生巳不負爲儒拂衣長揖䕫龍貴散髪還爲黄綺徒白鶴歸飛心自逺青霞髙舉勢何孤千金盡與郷人費不向江頭買木奴贈清行我厭俗縁苦空爲薄宦牽如師真逹者於丗必超然敝笠衝塵陌寒雲擁雪天﨑嶇逺相顧深愧此心專和道粹春寒趍舘馬上口占殘臘尚要春清寒更着人雪華猶惜别物意倍添新雲壓宫城重風調玉漏匀行遊冝結轡九陌未多塵同次道元日宿尚書省聽誓戒寄常州邵不疑去歳是日次道同不疑宿直椒花獻歳新瑄玉侍祠頻此夕同華省非才愧後塵江風迎茜斾沙雨待朱輪不比齋官冷端居棄擲春和子淵除夜緹室重飛玉琯灰物華全與斗杓回依依殘臘無情别歴歴新春滿眼來強取酒巵浮翠柏懶開粽葉覔楊梅男兒努力平主志肯使功名落草萊春祠致齋寄呈景仁次道比日聚官舎笑言曽未厭暫成揮手别各有侍祠嚴晴景朝朝麗春容物物添解齋當共醉莫遣此期淹雙井茶寄贈景仁春睡無端巧逐人驅訶不去苦相親欲慿洪井真茶力試遣刀圭報谷神送王殿丞恪西京簽判清白丗風存王公復有孫挺生如玉樹不竭似淮源日背崧峯紫春添洛水喧幕中多勝友肯使負芳罇和子淵元夕神嶽嶣嶤闕角齊銀檐無影玉䋲低風傳絲管交加發燈滉星河上下迷清醴横飛金鑿落香塵不染錦鄣泥誰知此夕齋祠客近在宮城槐柳西送謝都官顗知光化軍廏吏整車馬忩忩辦曉裝青緺出閶闔朱斾指滄浪野店杏初發津亭柳巳黄行行不可駐猶及勸耕桑送仲更歸澤州太行横擁巨川回三晉由來産異才展墓乗春走郷陌負書拂暁下蘭臺河陽路側花應合天井關頭雪未開㑹使郷人驚六印莫羞今日弊裘來二月一日太常致齋晨起呈景仁次道二同舎官舎春蕭瑟朝來尚薄寒人雖繁陌上塵不近門端巳負踏青約同舎先有是約仍無舉白歡從次道求酒不獲故云慿君御溝上試折栁條看送劉觀察從廣知洛州漢家英俊士衮衮出金張乆襲諸侯籍新腰太守章畛封連故趙廬井帶清漳春色迎鐃吹應忘道路長寒食御筵口号二首雨意沉沉潑火餘䕫龍盛集退朝初酒殽絡繹來丹禁冠劒參差下玉除紫鳯歸飛雲爛熳黄鸝新囀柳扶踈麥禾滿野邊烽息佳節何妨賦樂胥聖主褒優鼎軸臣金觴玉醴照青春萬家煙火朝來静九陌風光雨後新髙鷰翔飛驚紫綬餘花點綴託朱輪問牛因得觀民俗不獨嬉遊惜令辰致政楊侍郎挽歌二首時論歸清徳皇心重老臣祖風終骾直家學本深淳便殿談經乆安車就第新如何金未盡奄忽棄郷人憂國心如石當朝有古風挂冠雖在逺遺扎不忘忠飛旐西歸洛新阡背倚嵩還令往來客下馬白楊中送晁校理仲衍字子長知懐州鷄犬相聞桑柘春風光明潤帝郷鄰群峯斜轉太行角萬谷同趨馬頰津簮組傾都邀别𬒮壷漿滿路候行塵非君厭薄承明直天子方今重治人席上賦得榛微物生山澤蕭條荆棘鄰何人掇秋實此日待嘉賓雖無木桃贈投此寄情親二月三十日與同舎宴李氏園晚歸馬上賦詩用歸字韻門前蹀躞金羈滿坐上連翩玉斝飛數尺遊絲留客醉一行垂柳送人歸同邀勝友時難得重到名園花巳稀莫惜芳辰䞉行樂無端風雨橫相違送師道知長溪因歸覲省羈旅帝城乆逢人青眼稀聞君又當去使我益思歸佳色鄰郷樹高堂望綵衣春流先自疾心出片帆飛雙竹詩上苑通丹禁脩林繞玉堂周阿紆鏤檻並榦擢新篁蕭灑駢瑶甃連翩拂璧璫虬騰雙角直鯨噴兩鬚長曉泊煙華重晴留雨氣涼分音成律吕齊秀待鸞凰碧借雲霞潤清依日月光物情知有爲天造固無方比節群誠合虚心至道彰吾君愈動德不敢有嘉祥和次道奉慈齋宮見寄去住邈如霄與塵依依欲别更相親雖知洛邑饒英俊莫忘齋廬並直人送次道通判西京相府新承檄蘭臺舊校文題輿榮得士把𬒮惜離群首夏郊原秀晴陽草樹曛觚稜日邊逺闕塞霧中分翠嶺林端出飛泉竹外聞金羈遊爛漫珠履醉􅌭紛人服聲光重官無簿領勤歸期肯留滯漢主待淵雲送劉儀先輩大名尉潭潭相府開旌騎擁三臺聞道廷中吏無非天下才䇿名新振拔把板尚低回勿爲卑飛困青冥盡此來送皇甫寺丞穆知藍田縣南山三輔劇百里古諸侯誰謂絃歌小不分宵旰憂煙橫輞水暝雲照武關秋安得無羈束從君一縱遊酬次道板橋晚望見寄春來曽約醉河橋深負垂楊千萬條今日都門相望處西風亂葉正蕭蕭送祁嶠頴陽主簿蒼山臨縣郭雲木冷蕭騒人有漁樵樂官無簿領勞垂天起膚寸合抱本纎毫志意誠脩立歸飛羽翼髙送李尉以監丞致仕歸閩中行行歌式微浩嘆返荆扉却著登山屐盡焚趨府衣溪清魚影亂竹闇筍芽肥應悔浮名誤空將白髮歸和伯鎮再入館甘泉獻賦人流落浙江濵自歎三年謫歸來萬事新銓衡時進對户牖日相親明主方思賈非徒問鬼神和同舎對菊無酒黄花倚秋色曄曄爲誰開更使窺殘榼空令洗舊盃嗅香行繚繞撚蘂立徘徊盡日柴門外白衣來不來文太師挽歌三首文潞公父汾晉地形羙古今多鉅賢况承勲烈後冝有慶霊傳著位登朝右聲華出衆先起家從此始圭組遂蟬聮羙化流民物薫然遺愛多欒公當日社邵父至今歌庭有三鱣集門容駟馬過欲知餘慶在公鼎格平和夏屋封何處山田有卧牛蟠根走伊水回首負嵩丘忠孝家風備哀榮禮秩優龍鸞舞宸翰万古照松楸送李祠部復圭字審言知滑州東郡隄繇苦曏來煙火踈提封百里逺生齒万家餘賢守車纔下疲人意巳紓行聞謡五袴京廪滿郊墟和道粹垂拱早朝王范二直閣班列在前戯成小詩霽日扶霜仗祥煙覆曉班帝車回北斗天闕竦南山紫殿鴻鸞肅金門虎豹環蓬萊兩仙伯逈立白雲間荅劉邍父賀龐公惠炭東郭先生履半穿禦冬深愧主人賢應憐道上雪欲積意使爐中灰復然麴蘖暗添寒酒力圖書共免濕薪煙茅齋斗似饒光彩客至何憂臘後天送田校理諒字仲孚知晉州前判吏部南曹銓筦萃賢豪夫君主劇曹長才沛餘𥙿衆論蔚推髙逮此分符貴知無頓刄勞公卿如有缺不獨賜金褒正月三日與廣淵同岀南薫門分趨齋宮塗中有作並轡岀都門葱籠日欲昕野寒餘宿雪樹闇濕春雲梢望郊宫近先愁馬首分一朝猶戀戀可復乆離群寄題常州東山亭二首謝傳英聲髙可攀結茅積土想東山常憂勝槩一朝盡豈信風流千古還塵尾蒲葵供永日酒樽棊局奉歡顔賢侯心跡遥相望不使蘭陵風月閑閥閱崔嵬動四方入門鸞鶴自成行青緺舊巳臨佳郡墨客新歸耀故郷醉舞幾應摧屐齒對棊正欲賭香囊階庭玉樹寒相照更使東山逸氣長送人爲閩宰萬里東甌外溪山秀出群郷人皆嗜學太守復工文正用慈良化居無牒訴紛誰云逺京國佳政日相聞送才元守廣安軍歸成都覲省皂蓋五驊騮今來異昔遊簞壷交里舎鐃吹下瀛洲壽酒行當舉歸鞭不可留春光乆相待先在錦江頭送上雒王推官經臣墨綬百里宰紅蕖幕府僚民淳無闘辨地勝得逍遥日上雲未散春深雪不消知音巳交薦勿茹紫芝苗送瀛州簽判蘇祕丞寀髙陽十萬兵幕府藉時英塞上風猶勁關南春未生投壷邊柝靜倚馬檄書成不忘塵中客征鴻可寄聲和次道西都元日懷不疑并見寄露冕優分竹題輿佐畫圻比年攜手樂兹日賞心違齋祀春來併娱逰别後希誰怜從窶卒草際犯寒歸王金吾北園丞相後園天籞鄰年年分借上林春目前但識禽魚樂門外何妨車馬塵花蘤秪疑名品盡圗書方驗古今貧將軍朝下無餘事端爲風煙作主人二月二十四日館宿興宗舎後桃花盛開偶書牖上金馬春寂寂穠桃隨意開夕風零落盡不待主人來送周寺丞畋知洛南周茟人太華指商於中間百里餘稍行山驛逺漸與世塵踈楚塞參差接秦民錯雜居惜哉非肯綮不足試投虚送齊學士廓字公闢知荆南漢家太守治才髙楚國山川氣象豪旗斾逶迤蟠夢澤樓舡贔屓壓江濤雄名誰復知宣武遺愛猶應祀叔敖何必三年求奏計詔書朝夕賜金褒送王待制知陜府疇昔誠相契間関分不渝先君知鳯翔府待制通判事以道誼相知非直僚友两巳絶絃悲宿草撫首念諸孤位略尊榮間年忘德齒殊清隂容息足重語辱嘘枯待制主漕京西光仕武成幕府仍叨奬引鶠閣騫雲表虹旌拂海隅明光新出綍陜陌重分符豐潤還桑椊讙謳復路衢寕湏更條教耆舊巳簞壷待制爲陜牧光寔陜人送張景淳知邵武軍閩嶺窅何在東南千里遥仳離傷草草㑹合更迢迢隋岸微吹絮吴江欲上潮肯無同舎念回首弭䡖橈送章伯鎮知湖州江外饒佳郡吴興天下稀蓴羮紫絲滑鱸鱠雪花肥星斗寒相照煙波碧四圍柳侯還作牧草樹轉清輝送王伯初通判婺州煜爚屏星駕迢遥婺女區嵐光睛向背溪溜暖縈䊸萬室鳴機杼千艘隘舳艫若逢耆舊問能說隠侯無送張少卿學士子憲知洪州相府典刑在朝閨望實髙紬書榮史觀典樂重卿曹夷路迎飛鞚桑林應奏刀家籝傳舊學廟鼎刻前勞祇服屯千騎連檣閱万艘劒芒衝夜氣閣影動秋濤風色傳花信煙光拂酒膏使君專問俗無意在遊遨送昭逺兄歸陜種種親頭白帝城難少留倚門應有望列鼎本無求清夜多歸夢紅塵厭乆遊此行殊捧檄轅下五驊騮寄清逸魏處士郷樹三揺落臨風歌式微徒嗟俗縁重端使素心違茅閣杉松冷山園藥草肥不能如海鷰嵅歲一西飛送雲卿知衛州汗簡成新令褰帷刺劇州韋平家法在邵杜治聲優野竹交淇水秋瓜蔓帝丘三年歸奉計肯顧石渠遊送昌言知宿州煒燁符離守中流蔟皷旂柳隂濃不断舟勢激如飛魏闕行歸奏承明秖蹔違星軺晨夕度尺素勿令稀送濟川知漢州二首金馬從容樂問君何所之客心彯若梗親髮暠如絲舊學巳孤陋素交仍别離執經時有問使我復從誰千騎擁朱􅙲青霞晝繍還復尋題柱迹重過棄繻関曉棧流雲濕秋湖脫葉殷乆遊仐得意真不愧江山哭公素負書遊上囯拾芥取榮名雅度津涯闊高文風雨驚忘懷飜得謗縱酒遂傷生忍使泉臺客悁悁不自明丹旌倚輤車榮辱尽虚无半道驊騮頓先秋蘭茞枯兒癡纔過齓親老不勝扶家事今䔥瑟寕将未第殊送程端明知成都高陽將幕開濯錦使旌來欲識関頭雪正如江上梅宵衣矝逺俗霞冕寄良才豈待三年最脩梧茂帝臺丁尚書挽詞二首鳯蹕遊汾曲非熊得偉人閨臺光顯重訓誥愈深淳論道叅黄閤撗經侍紫宸如何天不憗志業未全伸丹闕晨趍退蕭然忘丗榮閑齋虚自白永日澹无營脫略簪紳累沈冥丘壑情貪夫誠有激千載素風清奉和濟川代書三十韻寄諸同舎金馬延群雋芸香聚衆書杳疑神境絶深與丗塵踈氣逼煙霄爽光分日月餘不材叨誤選故友幸聮居雲蓋森朝騎天閽謹契魚後先陪賈馬左右揖嚴徐朱閣霜清外琁題日上𥘉詞林精採擷蓺囿縱遊漁决勝楸枰暝窮歡綺席舒朝昏升紫闥咫尺侍彫輿玉壘俄郷思銅符忽詔除綵衣承几杖華轂照園廬四郭柑垂䕃千塍稻散渠壺漿迎露冕鐃吹擁髙旟有德能仁虎無欺恥怒狙道塗繁楫讓犴獄絶淪胥滯穗棲場圃鳴桴静里閭貧寕費官燭飢不茹家𬞞翁子懐青綬文園駕赤車古今相與校勝負定何如上正開宣室人方誦子虚追鋒行入謁委珮復傳臚撫已聊睎驥臨民遽起予居然耗廪禄豈不愧簮𥚑鵜翼顔何厚錐囊意未攄因循戀糠籺汩没老塗淤自顧徒爲爾誠非益者歟俄承吕公檄遂䇿阮生驢驛騎傳巴徼詩筒逹魯墟琳琅固無價燕石敢沽諸和始平公貽一二賔僚儒冠藹藹從平津東閤由來盛衆賔終始何甞忘教育髙卑曽不問䟽親共陪樽爼無虚日空喜谿山得主人白雪屢歌殊未和自知羞愧後車塵留客酒煙漠漠自生春舞䄂飄颻拍拍新湏信客歸絲竹散清風白月解愁人和始平公長句寄漢州何學士勢交倐忽易蕭條頼有伊人尚建標湏信松筠凌雪茂肯爲蒲柳望秋凋欽賢髙館三年别廣漢專城百舎遥書𥿄如雲詩叩玉數憑疾翼度青霄濟川有書見貽云以親老湏守逺郡以便禄養不得如光在主人幕下因以詩荅千騎駸駸簇畫輈髙旌大蓋五驊騮齋中酒美連翩醉湖上花繁爛熳遊雞犬相聞通故里旨甘不絶奉晨羞秪應朝夕平津閤得向君前立勝籌閼逢敦牂二月十一日與一二僚友遊叔禮園亭以詩戯呈下馬乆徘徊林芳殊未開春風眞有意湏待主翁來十四日小園置茶招宗聖應之皆辭以醉爲詩贈之草樹弄春暉家家倒載歸誰怜獨醒客日暝掩雙扉同僚有獨遊東園者小詩寄之三首車馬東城路芬芳數里塵風光不相待愁殺未遊人右咫尺東園樂無如簿領何春風連夜惡聞道落花多右城樓傳晚皷稍稍訟庭稀起拂衣中土還乗𣢾叚歸小詩招僚友晚遊後園二首五陵年少競春暉肥馬銀鞍白玉羈何似松間煑新茗更來花底覆殘棊右麥田小雨隴㣲青草樹欣欣照暁晴花下客來醒亦好猶勝閉户過清明小園晚飲賦得春字公府豐暇豫眞成棄擲春招邀俱勝友爛漫醉芳辰花艶穠無敵文鋒徤有神猶勝擁朱墨終日坐埃塵李花得韻同前嘉李䌓相倚園林澹泊春齊紈翦夜薄吴紵下機新色與晴光亂香和露氣匀望中皆玉樹環堵不爲貧東䆫臨風梳短髮䔥颯晚凉新不識市朝客何如江海人沉吟憑棐几欹側戴紗巾濁丗事无尽東䆫聊放神奉和始平公酬大資政吴侍郎道盛經綸業文髙翰墨塲雍容偃藩地宻迩釣璜郷回首紅塵逺清心白日長山形抱城堞谿影照公堂䄫稏千塍碧芙蕖萬頃香跨波横略彴逼地亞篔簹大壄禾麻溢髙齋几席涼夔龍屢𢋫唱東壁正垂光晚行後園見菊戯冝甫野菊荒無數班班𥘉見花徑湏来一醉試遣問東家野菊野菊未甞種秋花何處來羞隨衆草没故犯早霜開寒蝶舞不去夜蛬吟更哀幽人自移席小􅎥泛清盃温國文正公文集卷第八
