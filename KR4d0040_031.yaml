body:
  text: 章奏十六講筵劄子乞講尚書劄子除盗劄子備邊劄子蓄積劄子階級劄子義勇第一劄子舉官劄子義勇第二劄子義勇第三劄子臣伏覩講筵所告報奉聖旨令自九月初五日後日逐講筵至重陽節住講候將来開春别選日講筵臣竊以國家夲設經筵欲以發明道誼禆益聖德先帝時無事常開講筵近嵗因聖體不安遂於端午及冬至以後盛暑盛寒之時權罷數月今陛下始初清明方冝銳精學問之時而五日開講八日已罷臣恐議者以爲陛下非有意於求道但欲循故事俻外飾而已群臣非有意於明道但欲塞職業求錫賚而已若果如此臣竊爲朝廷羞之且陛下近増置諸宫敎授仍下詔戒朂宗室使之嚮學儻陛下不以身先之則宗室安肯奉詔哉臣愚以爲陛下若别有所爲未暇開講則且俟它時亦未爲晚若旣開講筵則恐數日之間未冝遽罷取進止乞講尚書劄子臣伏覩經筵講說論語將畢竊以尚書者二帝三王嘉言要道盡在其中爲政之成䂓稽古之先務也陛下新承大統留意萬機欲求楷模莫盛於此臣不勝區區欲望陛下更以聖意裁酌將來論語旣畢令講說尚書取進止除盗劄子臣竊聞降勑下京東京西災傷州軍如人戸委是家貧偷盗斛㪷因而盗財者與減等断放未知虚的若果如此深爲不便臣聞周禮荒政十有二散利薄征緩刑弛力舎禁去㡬率皆推寛大之㤙以利於民獨於盗賊愈更嚴急所以然者蓋以饑饉之歲盗賊必多殘害良民不可不除也頃年甞見州縣官吏有不知治體務爲小仁者或遇凶年有刼盗斛斗者小加寛縱則盗賊公行更相刼奪郷村大擾不免廣有収捕重加刑辟或死或流然後稍定今若朝廷明降勑文䂊言偷盗斛斗因而盗財者與減等断放是勸民爲盗也百姓乏食官中當輕傜薄賦開倉賑貸以救其死不當使之自相刼奪也今歲府界京東京西水災極多嚴刑峻法以除盗賊猶恐春冬之交飢民嘯聚不可禁禦又况降勑以勸之臣恐國家始於寛仁而終於酷暴意在活人而殺人更多也凡號令之出不可不慎毫釐之失爲害實多若纔知其失隨即更張猶勝於有害及民迷而不復者也伏望陛下速令収還此勑嚴責京東京西轉運司及州縣應災傷之處多方擘畫斛斗救濟飢民若有一人敢刼奪人斛斗者立加擒捕依法施行如此則衆知所畏不敢輕犯所以保全愚民減省刑獄之道也取進止備邊劄子臣聞周書稱文王之德曰大邦畏其力小邦懷其德蓋言諸侯傲很不賔則討誅之順從柔服則保全之不避彊不陵弱此王者所以爲政於天下也臣伏見去歲先帝登遐趙諒祚遣使者來致祭延州差指使高冝押伴入京冝言語輕肆傲其使者侮其國主使者臨辭自訴於朝臣當時与吕晦上言乞加冝罪朝廷忽略此事不以爲意使其怨懟歸國一國之人皆以爲耻今歲以來諒祚招誘亡命點集兵馬窺伺邊境攻圍堡塞驅脅熟戸八十餘族殺掠弓箭手約數千人悖逆如此而朝廷乃更遣使臣齎詔撫諭彼順從則侮之傲很則畏之無乃非女王所以令諸侯乎若使臣至彼諒祚稽首服罪禁止侵掠猶或可赦若復拒違王命辭禮驕慢侵掠不已未知朝廷將何以待之傷威毁重孰甚於此方今公私困竭士卒驕惰將帥乏人而戎狄犯邊事之可憂孰大於此而朝廷上下晏然若無事者其故何哉豈朝廷自有其俻而踈外之臣不得與知乎臣竊惑之所謂備者非但添屯軍馬積貯粮草而已也在於擇將帥而修軍政也二者皆闕何謂有俻臣不勝憤懣伏望陛下愽延群臣訪以禦邊之䇿擇其善者而力行之方今救邊之急冝若奉漏甕沃焦釡猶恐不及豈可外示閑暇而飬成大患也取進止蓄積劄子臣聞國以民爲夲民以食爲天國家近歲以來官中及民間皆不務蓄積官中倉廪大率無三年之儲郷村農民少有半年之食是以小有水旱則公私窮匱無以相救流移轉徙盗賊並興當是之時朝廷非不以爲憂及年榖稍豐則上下之人皆忘之矣此最當今之深弊也先帝時臣曽上言乞將諸路轉運使及諸州軍長吏官滿之日倉廩之實比於始至増減多少以爲黜陟又令民能力田積榖者皆不以爲家貲之數欲爲國家力救此弊自後不聞朝廷施行今歲開封府界南京宿亳陳蔡曹濮濟單等州霖雨爲災稼穡之田悉爲洪流百姓羸弱者流轉它方餓死溝壑彊壯者起爲盗賊吏不能禁朝廷欲開倉賑貸則軍儲尚猶不足何以贍民欲括取於蓄積之家則貧者未能振濟冨者亦將乏食又使今後民間不敢蓄積不幸復有凶年則國家更於何處取之此所以朝廷雖寒心銷志亦坐而視之無如之何者也臣竊思之蓋非今日有司之罪乃曏時有司之罪也往者不可及來者猶可追陛下儻不於今日特留聖心速救斯弊豐凶之期不可預保若向去復有水旱螟蝗之災饑饉相仍甚於今年則國家之憂何所不至乎臣又聞平糴之法必謹視年之上下故大熟則上糴三而舎一中熟則糴二下熟則糴一使民適足價平則止小飢則發小熟之所歛中飢則發中熟之所歛大饑則發大熟之所歛而粜之所以取有餘𥙷不足也今開封府及京東京西水災之處放稅多及十分是大飢之歲也官吏往往更行収糴所給官錢旣少百姓不肯自來中糶則遣人編欄搜括無以異於冦盗之鈔刼是使有穀之家愈更閉匿不敢入市榖價益貴人不聊生如此非獨天災亦由吏治顛錯之所致也臣愚欲望朝廷檢㑹臣前次及今來所奏事理更加詳酌擇其可者少賜施行指揮開封府界及京東京西災傷州軍見今官中収糴者一切止住其有常平廣惠倉斛斗之處按籍置曆出粜賑貸先救農民告諭蓄積之家許令出利借貸與人候豐熟之日官中特爲理索不令逋欠其河北陜西河東及諸路應豐稔之處委轉運司相度榖價賤者廣謀収糴價平即止如本路闕少錢物即委主司於它處擘畫郍移應副仍自今以後乞朝廷毎年謹察諸路豐凶之處依此施行臣竊料有司必言官無閑錢可以趂時収糴臣伏見國家毎遇凶荒之歲縁邊屯軍多處常用數百錢糴米一斗若用此於豐稔之歲可糴一石不識有司何故於凶荒之歲則有錢供億至豐稔之歲則無錢也此無它故患在有司偷安目前以俟遷移進用不爲國家思乆逺之計而已故臣惟願陛下深留聖意取進止階級劄子臣聞治軍無禮則威嚴不行禮者上下之分是也唐自肅代以降務行姑息之政是以藩鎮跋扈威侮朝廷士卒驕横侵逼主帥下陵上替無復綱紀以至五代天下大亂運祚迫蹙生民塗炭祖宗受天景命聖德聦明知天下之亂生於無禮也乃立軍中之制曰一階一級全歸伏事之儀敢有違犯罪至於死於是上至都指揮使下至押官長行等衰相承粲然有叙若身之使臂臂之使指莫敢不從故能東征西伐削平海内爲子孫建乆大之業至今百有餘年天下太平者皆由此道也近歲以来中外主兵臣僚往往不識大體好施小惠以盗虚名軍中有犯階級者務行寛貸是致軍校大率不敢鈐束長行甘言恱色曲加煦嫗以至懦怯兵官亦爲此態遂使行伍之間驕恣悖慢寖不可制上畏其下尊制於卑所謂下陵上替者無過於此臣聞聖王刑期於無刑今寛貸犯階級之人雖活一人之命殊不知軍法不立漸成陵替之風則所係乃億兆人之命也臣愚欲望陛下特降詔旨申明階級之法戒勑中外主兵臣僚令一遵祖宗之制如敢有輙行寛貸曲収衆心者嚴加罪罰以儆其餘庻幾綱紀復振基緒永安取進止義勇第一劄子臣傳聞朝廷差陜西提點刑獄陳安石於夲路人户三丁之内刺一丁充義勇不知虚實若果如此大爲非便臣竊意議者必以爲河北河東皆有義勇而陜西獨無近因趙諒祚冦邊故欲廣籍民兵以備緩急使之捍禦也臣伏見康定慶暦之際趙元昊叛亂王師屢敗死者動以萬數國家乏少正兵遂籍陜西之民三丁之内選一丁以爲郷弓手㝷又刺充保捷指揮差於㳂邊戍守當是之時閭里之間惶擾愁怨不可勝言耕桑之民不聞戰闘官中旣費衣糧私家又湏供送骨肉流離田園盪盡陜西之民比屋彫殘至今二十餘年終不復舊者皆以此也其謀䇿之失亦足以爲戒矣是時河北河東邊事稍緩故朝廷但籍其民以充義勇更不刺爲軍雖比之陜西保捷爲害差小然國家何甞使之捍禦戎狄得其分毫之益乎今議者但恠陜西獨無義勇不知陜西之民三丁之内已有一丁充保捷矣自西事以來陜西困於科調比於景祐以前民力減耗三分之二加之近歲屢遭凶歉今秋方獲小稔且望息肩又值邊鄙有警衆心已揺若更聞此詔下必大致警擾人人愁苦一如康定慶暦之時是賊㓂未来而先自困弊也况即日陜西正軍甚多不至闕乏何爲遽作此有害無益之事以循覆車之轍也伏望朝廷審察利害特罷此事誠一方之大幸取進止舉官劄子臣聞致治之夲在於得賢天下至廣群臣至衆人主不能徧知必資薦舉若薦舉不得其實則邪巧並進官職耗廢是故設連坐之法以懲之此百王不易之道也伏見近降詔書令中外臣僚於文資宫内不以職位髙下舉行實素著官政尤異可備升擢任使之人又於諸司使以下至三班使臣内舉堪充將領及行陳任使之人此乃前丗之令典當今之切務臣始聞之不勝慶抃旣而議者皆言數年之前亦曽有此詔書所舉甚衆未聞朝廷曽有所升擢今兹蓋亦修故事飾虚名而已非有求賢之實也若果如此誠有何益臣愚欲望陛下盡將令來臣僚所舉之人隨逐人資叙各置一簿編其姓名留之禁中其副本降付中書樞宻院若遇文臣轉運使副提點刑獄轉運判官知大藩府及武臣緫管鈐轄路分都監知州軍等有闕除用舊資序人外應係升陟入上件差遣者並乞於今來舉官簿内次第資叙人中陛下親加選擇點定一人其不係今來薦舉之人不得差充上件差遣若升陟以後它日職事敗闕不如所舉及犯贓私罪其舉主並依法施行雖見任兩府亦乞不以恩例特放凡係舉官不當降官及降差遣者未滿三年雖遇恩赦不得牽復如此則群巨莫敢不尽公擇人天下賢才皆可得而官使矣取進止義勇第二劄子臣近曽上言乞罷刺陜西義勇事未審朝廷曽與不曽别爲商量臣前次上殿乞陛下留意俻邊所謂備者非但添屯軍馬積貯糧草而巳任於擇將帥而修軍政今將帥不才者未聞有所更改軍政頽弊者未聞有所振舉而忽取腹内州軍之民盡刺以爲兵外人聞之無不駭愕今陜西㳂邊正軍動以萬數朝廷若能擇有方略膽勇之人以爲將帥使之簡去疲弱選取精銳勤加教習明行賞罰則雖欲取銀夏而稅其地禽趙諒祚而制其命有何所難况但止其鈔盗乎今朝廷不孜孜以將帥軍政爲急而無故籍耕桑之民使之執兵徒有驚擾而實無所用臣不知誰爲陛下畫此䇿也昔康定慶暦之間朝廷以元昊犯邊官軍不利巳曽籍陜西之民以爲鄊弓手始者明出敕牓云但欲使之守護郷里必不刺充正軍屯戍邊境牓猶未収而朝廷盡刺充保捷指揮令邊州屯戍當是之時臣丁憂在陜備見其事民皆生長太平不識金革一旦調發爲兵自陜以西閭閻之間如人人有䘮户户被掠號哭之聲彌天亘野天地爲之慘悽日月爲之無色往往逃避於外宫中縶其父母妻子急加追捕鬻賣田園以充購賞曁刺靣之後兵貟教頭利其家冨百端誅剥衣糧不足以自贍湏至取於私家或屯戍在邊則更湏千里供送祖父財産日銷月鑠以至於盡况其平生所習者惟桑麻耒耜至於甲胄弩槊雖日加教閱不免生踈而又資性戇愚加之畏懦臨敵之際得便即思退走不惟自䘮其身兼更拽動大陣自後官中知其無用遂大加沙汰給以公慿放令逐便而惰游已乆不復肯服稼穡之勞兼田産巳空無所復歸皆流落凍餒不知所在長老至今言之猶長歎出涕其爲失䇿較然可知足以爲後来之戒而不足以爲法也今朝廷雖云所籍之民止刺手背農隙之時委州縣召集教閱只在郷里不令戍邊而民間懲往年之事必大興訛言互相驚擾朝廷號令失信前後巳多雖州縣之吏徧至民家靣加暁諭亦終不肯信迯亡避匿刑獄必繁怨嗟之聲周遍一方足以動揺群心感傷和氣若使分毫有益於國亦無所顧此有害無益顯然明白近在目前設使教習得成一旦諒祚大舉入冦邊臣不能捍禦而使之深入三輔東過潼關乃欲驅此烏合村民以拒之不亦難乎此適足以取戎狄之笑而巳伏望陛下軫念生民深察得失其刺義勇事早賜寢罷取進止義勇第三劄子臣累日前方聞朝廷有指揮令陜西路㨂郷村百姓充義勇臣即時有奏劄子言其非便昨日又上殿具劄子靣有敷陳奉聖旨令送中書樞宻院商量臣到中書樞宻院方知此事擬議巳乆敕下本路己近旬日臣耳目踈淺聞之後時不能先事進言是臣之罪然臣聞之易曰不逺復無祇悔元吉說命曰無恥過作非今雖敕命巳下若追而止之猶勝於遂行不顧不可避反汗之嫌而蹈迷復之凶也百姓一經刺手則終身羈縻不得左右人情畏憚不言可知康定年中㨂差郷弓手時元不刺手後至慶暦年中刺充保捷之時冨有之家猶得多用錢財雇召壯徤之人充替今一切皆刺其手則是十餘萬無罪之人永充軍籍不得復爲平民其爲害民尤甚於康定之時也臣料即今陜西之民已狼狽驚擾不聊生矣若朝廷晏然坐而視之曽不憫恤使赤子嗷嗷何所告訴為民父母者固當如是乎古者國有大事謀及卿士謀及庻人謀及卜筮今籍一路之民以爲兵可謂大事矣而兩府之外朝士大夫無一人知者一旦敕書旣下急如星辰嚴如雷霆誰暇問其端倪况敢言其非也臣以備位諌官旣聞之後不可畏避死亡不爲陛下力言之若又棄忽其言不爲改更則是今後朝廷號令有過誤者終不可復救也如此則恐非國家之福臣愚伏望聖慈速降指揮下陜西路其義勇且未得㨂刺别聽候朝廷指揮然後慱延卿士大夫更熟議其可否果然有利於國無害於民徐復行之何晚之有取進止貼黄若更遷延數日則陜西㨂刺已畢無由改更臣此劄子乞早降付中書樞宻院速賜指揮温國文正公文集卷第三十一
