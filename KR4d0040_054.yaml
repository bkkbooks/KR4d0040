  text: 溫國文正公文集卷第五十四
  hash: sha256:0300bea1524a3b4bd0d003c4a05a3fde2a7f1f6744808fcb6619d37351e781d9
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_054-1a}
body:
  text: 章奏三十九謝免北使朝見日起居狀所舉孫凖有罪自劾劄子後殿常起居乞拜劄子辭大禮使劄子上官均奏乞尚書省事類分輕重某事關尚書某事關二丞某事關僕射進呈白劄子七月二十八日三省同上得旨依乞趂時收糴常平斛斗白劄子約束州縣抑配青苗錢白劄子乞罷散青苗白劄子薦王大臨劄子乞官陳洙一子劄子乞令六曹刪減條貫劄子乞罷保甲招置長名弓手劄子謝免北使朝見日起居狀右臣伏覩中書省録黃以今月十一日北使朝見奉聖旨許臣與文彥博免赴起居仍候人使升殿降階訖權歸幕次將欲賜茶即升殿臣以久患腳膝逺行久立實所未堪方欲奏陳伏蒙聖恩差句當御藥院梁某宣諭令臣於人使見辭日更不赴臣無任感天荷聖激切屏營之至謹録奏謝以聞謹奏所舉孫凖有罪自劾劄子臣先凖詔書舉文學政事行誼之臣可以充館閣之選者三人臣舉通直郎孫凖近聞孫凖與妻趙氏因爭女使與妻兄趙元𥙿相論訴狀內有虛妄事罰銅六斤臣昧於知人所舉有罪理當連坐乞賜責降取進止後殿常起居乞拜劄子竊以人臣見君禮無不拜文彥博年齡位望皆逺踰於臣每後殿起居猶須拜伏獨臣一人恩旨不拜忝為臣子實不自安欲乞今後遇文彥博入朝與之同班不入朝即别為一班依群臣例常起居况臣自揣近日筋力微增若得臣男扶掖其常起居四拜殊不為難伏望聖慈聽許以存朝廷之禮取進止乞特賜批依辭大禮使劄子二十七日上尋改差臣先奉敕差充明堂大禮使伏緣臣自去冬以來膝腳無力拜起艱難至今年正月下旬全妨拜起遂請朝假至今首尾八箇月若無人扶掖委實獨自拜起不得每次朝見幸蒙聖恩許男扶掖將來大饗明堂在上帝前不可使人扶掖又隨從皇帝陟降拜伏必恐未能一一如禮欲望聖慈矜憫別賜差官充大禮使取進止上官均奏乞尚書省事類分輕重某事關尚書某事關二丞某事關僕射進呈白劄子七月二十八日三省同上得旨依今欲應尚書省事舊有條例事不至大者並委六曹長官一靣專決應奏上者奏上應行下者行下其有衝改動條貫或應臨時特取旨及事體大非六曹所能專決者即申都省委僕射左右丞同商量或送中書取旨或直批判指揮所有都省常程文字並只委左右丞一靣批判施行事體稍大及有所疑者方與僕射啇量同批判所是諸色人辭狀只委左右丞一靣收接可留即留可退即退若六曹判斷不當及住滯不決即别委不干礙官定奪是非及根窮住滯因依若顯有不當及故住滯其本曹官吏即行按劾所貴上下相承各有職分行遣簡徑事務辦集乞趂時收糴常平斛斗白劄子八月三日三省同上得旨依勘會舊常平倉法以豐歲榖賤傷農故官中比在市添價收糴使蓄積之家無由抑塞農夫須令賤糶凶歲榖貴傷民故官中比在市減價出糶使蓄積之家無由邀勒貧民須令貴糴物價常平公私兩利此乃三代之良法也嚮者有因州縣闕常平糴本錢雖遇豐歲無錢收糴又有官吏怠慢厭糴糶之煩雖遇豐嵗不肯收糴又有官吏不能察知在市斛斗實價只信慿行人與蓄積之家通同作弊當收成之初農夫要錢急糶之時故意小估價例令官中收糴不得盡入蓄積之家直至過時蓄積之家倉廪盈滿方始頓添價例中糶入官是以農夫糶榖止得賤價官中糴榖常用貴價厚利皆歸蓄積之家又有官吏雖欲趂時收糴而縣申州州申提點刑獄提點刑獄申司農寺取候指揮比至回報動涉纍月巳是失時榖價倍貴是致州縣常平倉斛斗有經隔多年在市價例終不及元糴之價出糶不行堆積腐爛者此乃法因人壞非法之不善也熙寧之初執政以舊常平法為不善更糴本作青苗錢散與人户令出息二分置提舉官以督之豐歲則農夫糶榖什不得四五之價凶年則屠牛賣肉伐桑賣薪以輸錢於官錢貨愈重榖直愈輕朝廷深知其弊故罷提舉官令將纍年積蓄錢榖財物盡樁作常平倉錢物委提點刑獄交割主管依舊常平倉法施行今歲諸路除有水災州軍外其餘豐熟處多今欲時降指揮下諸路提點刑獄司乘有此糴本之時委豐熟州縣官貟各體察在市斛斗實價多添錢數以廣行收糴如闕少倉敖之處以常平倉錢添蓋仍令少糴麥豆多糴穀米其南方及川界卑濕之地有斛斗難以久貯者即委提點刑獄相度逐州逐縣合銷數目拋降收糴才候將來在市物價比元糴價稍增即行出糶不得令積壓損壞仍令州縣各勒行人將十年以來在市斛斗價例比較立定貴賤酌中價例然後將逐色價分為三等自幾錢至幾錢為中等價幾錢以上為上等價幾錢以下為下等價令逐處臨時斟酌加減務在合冝既約定三等價仰自今後州縣每遇豐歲斛斗價賤至下等之時即比市價相度添錢開場收糴凶年斛斗價貴至上等之時即比市價相度減錢開場出糶若在市見價只在中等之內即不糴不糶更不申本州及上司指揮免有稽滯失時之患仍委提點刑獄常切提舉覺察若州縣斛斗價及下等而不收糴價及上等而不出糶及收貯不如法變轉不以時致有損壞并監官不逐日入埸致壅滯糶糴人户並取勘施行若州縣長吏監官能用心及時糴糶至得替時將酌中價錢與斛斗通行比折與初到任時增剩及十分中一分以上許批書上曆子候到吏部日與升半年名次及二分以上許指射家便差遣一次所貴官吏各各用心州縣皆有儲蓄雖遇荐飢民無菜色又得官中所積之錢稍稍散在民間可使物貨流通其河北州縣有糴便司斛斗見多及緣邊州縣轉運司見糴軍糧處更糴常平倉斛斗若今來指揮內有未盡未便事件委提點刑獄司逐旋擘畫申奏施行約束州縣抑配青苗錢白劄子同前中書舍人蘇軾不肯簽臺諌亦纍章乞盡罷四日再進呈後劄子檢會先朝初散青苗錢本為利民故當時指揮並取人户情願不得抑配自後因提舉官速要見功務求多散諷脅州縣廢格詔書名為情願其實抑配或舉縣句集或排門抄劄亦有無賴子弟謾昧尊長錢不入家亦有它人冒名詐偽請去莫知為誰及至追催皆歸本户朝廷深知其弊故悉罷提舉官不復立額考較天下莫不欣戴昨於四月二十六日有勑令給常平錢榖限三月或正月只為人户欲借請者及時得用又令半留倉庫半出給不得輒過此數至於取人户情願不得抑配一遵先朝本意慮恐州縣不曉勑意將謂朝廷復欲多散青苗錢廣收利息句集抑配督責嚴急一如嚮日置提舉官時今欲續降指揮下諸路提點刑獄司告示州縣並須候人户自執狀結保赴縣乞請常平錢榖之時方得勘會依條支給不得依前句集抄劄強行抑配仍仰提點刑獄常切覺察如有官吏似此違法搔擾者即時取勘施行若提點刑獄不切覺察委轉運安撫司覺察聞奏乞罷散青苗白劄子四日進呈得旨依昨於四月二十六日降指揮令於正月二月支散常平倉錢榖切慮州縣多不曉朝廷之意將謂却欲廣散青苗錢多收利息嚴行督責一如未罷提舉官時勘會青苗錢利民甚少害民極多臣民上言前後非一今欲遍行指揮下諸路提點刑獄司自今後其常平錢榖只令州縣依舊法趂時糴糶其青苗錢更不支俵所有舊欠二分之息盡皆除放只令提點刑獄契勘逐州縣元支本錢隨見欠多少分作料次令隨稅送納薦王大臨劄子八月八日上大臨除太學録巳卒臣竊見鄆州處士王大臨通經術善講説安仁樂義譽髙鄉曲貧不易志老不變節嚮常有詔敦遣固辭不起伏望聖慈召致京師置之學官為士類矜式取進止乞官陳洙一子劄子嘉祐中仁宗皇帝未有繼嗣故殿中侍御史陳洙奏乞擇宗室之賢者立以為後既發奏狀謂家人曰我今日入一文字言社稷大計若得罪大者死小者貶竄汝輩當為之備下奏狀者未返洙得疾而卒臣時為諌官親聞見此事竊憐其亡身徇國繼之以死而天下莫之知近見故職方貟外郎張術亦以當時乞建儲二子申伯特輔太廟齋郎伏望聖慈依張術例除一子官以旌忠義取進止乞令六曹刪減條貫劄子八月十二日三省同上得旨依勘會近歲法令尤為繁多凡法貴簡要令貴必行則官吏易為檢詳咸知畏避近據中書門下後省修成尚書六曹條貫共計三千六百九十四册寺監在外又據編修諸司勑式所申修到敕令格式一千餘卷册雖有官吏強力勤敏者恐不能遍觀而詳覽况於備記而必行之其間條目苛密抵梧難行者不可勝數昨者條貫初下吏部侍郎左選差注不行者數日不免再有奏陳復依舊法必料諸曹條貫皆有似此拘礙難行者今欲特降指揮下尚書六曹委長二郎官同共看詳本曹新舊條貫內有海行巳有及全無義理於事無益防禁太繁難為遵守者盡令刪去惟取紀綱大體切近事情朝夕不可無者方始存留作本司條貫限兩月申奏施行乞罷保甲招置長名弓手劄子臣竊見府界及三路保甲雖罷團教猶冬教一月於民有損於官無益不若盡罷之便何則比團教之時民間勞費雖十減六七然猶有三四此所謂於民有損也朝廷每歲遣使按閲所費金帛以百萬計而終無所用之此所謂於官無益也臣以為不若盡罷之便自置保甲以來盜賊倍多所以然者鄉村無賴子弟乍涉城市聞見紛華自恃身為保丁坐索本家供給飲博遊蕩習以成性今雖罷團教不肯復歸南畒服田力穡逸欲既深資用不足既家藏利兵又身挾武藝由是邀結黨友群行攻劫父兄不能禁州縣不能制此自然之勢也是以數年以來年不甚飢而府界三路盜賊縱橫入縣鎮殺官吏若遇蟲蝗水旱大飢之歲將若之何此不可不為之先慮也以臣愚見莫若盡罷府界及諸路保甲據逐縣主戶數目盜賊多少委提點刑獄相度每若干戶置長名弓手一人與免戶下租稅支移折變及夫役諸般差徭科配一無所預務為優假使人歆慕每十人置節級一貟五十人置十將一貟百人置貟寮一貟二百人以上置指揮使副指揮使各一貟雖不及二百人亦置指揮使副指揮使名目盡管一縣弓手以為賞功資級其節級始初且令本縣令佐依上名下次或選有部轄者權管候有長行捉殺到強盜一人即輔充正節級替下權管之人自後每捉殺到強盜一人依此遷一級若未有闕且為守闕不得管人候有闕日補正其纍功勞遷至正指揮使滿三年以上又曽捉殺到強盜三人從來不曽犯贓罪者仰本縣官吏結罪保明申州本州官吏結罪保明申奏乞朝廷與於三班借差內安排若遇有強惡賊人朝廷臨時别立賞格者不在此限如此則保甲內勇健之士見前有出官之望來應募者必多除第一第二等户物力髙強合充重役不得應募外其餘但於本縣有户籍田産不以等第髙下並許投充長名弓手永無解役之期若第一第二等户情願以一丁為弓手餘丁充重役者亦聽若一人闕額有二人以上爭投者即委令佐㨂試武藝髙強者充如此則本縣勇健者皆充弓手其餘怯弱者雖使之為盜亦無能為患若見充長名弓手人有勇力武藝衰退者許令外人指名比校若勝於舊者即令充替如此則不須教閲武藝自然長得精熟仍委本州及提點刑獄常切覺察令佐有取捨不公者取勘依法施行若應募未滿見今鄉差弓手之數即且令與鄉差弓手相兼祗應候招到長名弓手一人即替鄉差弓手一人歸農其鄉差弓手願投長名者亦聽若長名弓手及百人以上即令分一半作兩畨二百人以上每百餘人分作一畨並年終交替其上畨者隨縣尉逐捕盜賊自節級以上各令管所轄之人若所轄之人有小可過犯許一靣區分不得過小枤十下若所轄之人敢陵犯本轄人貟者杖一百歐者杖徒一年雖權管亦同本轄人貟若於所轄人處取受財物並依律科罪犯贓罪杖者若係權管即降充長行名若係正人貟即降一資自後每捉殺到強盜三人如當一人雖許遷資並係額外不得管人不得出官若遇下畨則不相管轄亦無階級其下畨者自十將以下各隨所居之處與耆長同覺察本管分內曽為強盜之人及窩藏之家凡為強盜者不肯於本管分作過須在它處蓋恐纍及本地分捕盜人無所自容故也其本地分捕盜人往往知之莫肯發舉盜既得財分贓則絶迹逺遁其賊發地分捕盜人雖欲擒捕莫知其處官中雖立三限科校終無所益由此賊發地分捕盜人每有賊發莫肯申舉若變主懦弱則多方抑塞不令聲賊變主強梁則共陪所失之財勸和使休是致群盜無所忌憚日益昌熾又告捕得賊多𬒳賊人讎報焚燒莊舍屠害老小其賞錢豈冝留滯而往往為州縣沮難有司靳惜動有經年請領不得使之懈體欲乞今後應賊發地分其捕盜人更不立三限科校捕盜官亦不批罰只以擒賊多少論其功賞若敢抑塞隱蔽從嚴法施行仍每州各隨大小賊盜多少借官錢千貫専充告捕賞錢每獲強盜勘得從來住止窩藏去處候斷遣巳了委本州長吏當日先以官錢支給告捕之人即移牒出賊州縣句追住止􅌪藏地分捕盜人科不覺察罪弓手杖一百耆長杖八十壯丁笞四十先籍沒賊人及􅌪家財産償錢外其不足之數令捕盜人等第均攤限一月催足津般赴給賞州軍輔填官錢若路逺難以津般則各於本州官錢內閞牒折兊其強惡賊人朝廷特於常法外多立賞錢者自以省錢充不在捕盜人均攤之限如此賊盜無所容身必思改過自新若果行此法府界三路既免教閲勞費之患無賴子弟又有所歸投得以羈縻諸路正鄉村之名復國家舊制勇健之士前有仕進之望爭討賊立功不待教閲而弓手武藝自然不敢衰退不須點差而鄉兵自足兼有所用人雖衆多而上下有綱紀不敢相侵暴賊發地分捕盜人不知賊處免虛受刑責出賊地分為纍及身不敢蔽匿景迹之人𬒳賊之家無人抑塞有所伸訴盜賊窮窘無所容身稍冀衰息取進止溫國文正公文集卷第五十四
