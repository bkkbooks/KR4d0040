body:
  text: 章奏五論制䇿等第狀免北使第一狀免北使第二狀與樂道論燕飲狀論兩府遷官狀建儲劄子荒政劄子論夜開宫門狀論上殿屏人狀建儲勸農劄子乞矝恤陳洙遺孤狀論環州事宜狀論蘇安靜狀論張方平守邊輕易狀論均稅官吏乞隨功過量行懲勸狀論張方平第二狀論制䇿等第狀閠八月九日上既而執政以􅝲所試進呈欲黜之上曰其言切直不可弃也乃降一等收之即蘇轍也右臣近蒙差赴崇政殿後覆考應制舉人試卷內􅱹􅝲兩號所對䇿辭理俱髙絶出倫輩然􅝲所對命秩之差虛實之相養等一兩事與所出差舛臣遂與范鎮同議以􅱹為第三等􅝲為第四等詳定官已定從覆考竊知初考官以為不當朝廷更為之差官重定復從初考以􅝲為不入等臣竊以國家置此六科夲欲取材識髙逺之士固不以文辭華靡記誦雜博為賢􅝲所試文辭臣不敢言但見其指陳朝廷得失無所顧慮於四人之中最為切直今若以此不蒙甄收則臣恐及下之人皆以為朝廷虛設直言極諌之科而􅝲以直言披黜從此四方以言為諱其於聖主寬明之德虧損不細臣區區所憂正在於此非為臣已考為髙等苟欲遂非取勝而已也伏望陛下察臣愚心特收􅝲入等使天下之人皆曰􅝲所對事目雖有漏落陛下特以其切直收之豈不美哉謹具狀奏聞伏候勑旨免北使第一狀右臣竊知巳降勑命差臣充北朝國信使臣緣名犯北朝諱所行文字雖可以更改竊慮臨時語言不能記憶或有觸犯兼臣體羸多病性不耐寒若涉窮荒必生疾病非敢自愛恐於王事有所廢闕伏望聖慈矝閔别賜差官在於愚臣實為至幸謹具狀奏聞伏候勑旨免北使第二狀尋改差人右臣先曽奏乞免充北朝國信使至今未奉朝旨竊以專對之任亦須擇才臣不惟名犯北朝諱及性不耐寒兼臣不經接伴未能諳練南北事體資性拙訥恐辱王命伏望聖慈矝察早賜選差曽經接伴之人充國信使所貴臨事不至闕誤謹具狀奏聞伏候勑旨與楊畋論燕飲狀臣畋等竊見今歲以來災異屢臻日食地震江淮騰溢風雨害稼民多菜色此正陛下側身克己眚禮蕃樂之時而道路之言皆云陛下近日宫中燕飲微為過差賞賚之費動以萬計耗散府庫調斂細民况酒之為物傷性敗德禹湯所禁周公所戒殆非所以承天憂民輔養聖躬之道也陛下恭儉之德彰信兆民議者皆以為後宫奢縱務相誇尚左右近臣利於賞賚陛下重違其請屈意從之夫天以剛健為德君以正固為事奈何徇後宫左右之欲上忽天戒下忘民病中不為宗廟社稷深自重惜臣等愚惑竊為陛下不取也伏望陛下當此之際悉罷燕飲安神養氣後宫妃嬪進見有度左右小臣賞賚有節及厚味臘毒之物無益奉養者皆不冝數御以傷太和乃可以解皇天譴告之威慰元元困窮之望保壽命無疆之休天下群生不勝幸甚臣等區區納忠忘死惟陛下裁察取進止論兩府遷官狀未及上孫抃等已罷官遂不上右臣伏見朝廷因進用宰臣韓琦等凡兩府之臣盡遷一官臣愚不明大體未識所謂竊恐從此相承遂為故事凡公卿者百吏之表率今國家方以百吏繁冗思革其弊而公卿無故一切遷官將何以使三百赤芾受爵不讓者有所愧心哉况慶曆中陛下以數月不雨執政之臣皆降一官以答天戒今歲日食地震河及江淮泛溢橫流烈風淫雨敗傷五稼四方之民墊溺流餓不可勝紀比於慶曆災害尤衆而兩府大臣無問新舊皆𬒳褒遷殆非所以仰承天心下慰衆庶之意也竊計大臣當此之際亦必不敢受無名之賞伏望陛下因其辝讓內惟樞密使副使不可以給諌及郎中為之者依舊制外其餘皆不遷官以養大臣廉讓之節無使之負謗於海內則其為德澤愈厚矣建儲劄子臣光於至和三年通判并州事日三曽上言乞陛下早定繼嗣以遏亂源當是之時臣疏逺在外猶不敢隱忠愛死敷陳社稷至計况今日侍陛下左右官以諫爭為名竊惟國家至大至急之務無先於此若捨而不言專以冗細之事煩瀆聖聽厭塞職業是臣懷姦以事陛下罪不容於葅醢伏望陛下取臣嚮時所進二狀少加省察或有可取乞斷自聖志早賜施行如此則天地神祇宗廟社稷群臣百姓並受其福惟在陛下一言而已取進止荒政劄子臣竊聞淮南兩浙今歲水災民多乏食往往群輩相聚操執兵杖販鬻私鹽以救朝夕至有與官軍拒鬪相殺傷者若浸淫不止將成大盜朝廷不可不深以為憂蓋由所司榷之太急故抵冒為姦臣聞周禮以荒政十有二聚民近者朝廷略以施行惟舍禁除盜賊二者似未留意今赤子凍餒濵於溝壑奈何尚與之爭錙銖之利豈為民父母之意哉臣謂陛下宜戒諭職司使明體朝意稍弛鹽禁而嚴督盜賊緩課利不充之罰急群行剽劫之誅廢告捕私鹽之賞旌討禽彊暴之功弃聚斂之小得保安全之大福除惡於纎介弭亂於未形最䇿之得者也取進止論夜開宫門狀閠月二十九日上有旨劄送皇城司右臣竊聞今月二十五日十三公主薨其日宫中迭殯出城留宫門及城門至夜深方閉物情駭異以為非冝雖陛下慈愛至深然門闕之禁不可不嚴若以式律言之夜開宫殿門及城門者皆須有墨勑魚符其受勑人具録所開之門并出入人帳送中書門下自監門衛大將軍以下俱詣閣覆奏御注聽即請合符門鑰監門官司先嚴門仗所開之門內外並立隊燃炬火對勘符合然後開之符雖合不勘而開若勘符不合而為開及不承勑而擅開閉若得出入者剩將人出入其刑名輕者徒流重者處絞今以乳兒出殯之故內自禁掖外逹郊野諸門洞開一如晝日車馬往來絡繹不絶出入之人無復譏訶有如萬分之一姦險不逞之人雜處其間豈可不為之寒心哉伏望陛下深鑒安危防微杜漸自今官殿門城門並須依時開閉非有急切大事勿復夜開必不得已須至夜開者即乞陛下親降手勑加以御寶受勑之人仍寫出入人帳委宿衛當上之官衆共驗勑文真的然後覆奏候再見御批方請門鑰與監門官親自監開依帳點閲人數放令出入即時下鎖進納門鑰其宿衛監門官司若不見手勑及御批而輒敢開者依不承勑而擅開閉律文施行雖有手勑御批不參驗及親自監開點閲人數者依符雖合不勘而開律文施行庶可以養萬乘之威尊消姦宄於未萌也謹具狀奏聞伏候勑㫖論上殿屏人狀九月九日上尋有旨依奏臣等竊聞自先帝以來應兩府臺諫官等上殿奏事左右侍臣悉皆屏退蓋以君不密則失臣臣不密則失身重慎樞機不得不爾竊見近日臣僚上殿奏事左右侍臣不遵舊制或有進至殿角板障門以裏與御座相去不過數步陛下德音及群臣敷奏之語皆可聽聞其間有機密大事若致漏泄大為不便欲乞一依舊制今後應遇兩府臺諫官等上殿奏事其左右侍臣並於殿角板障門外踏道下祗候仍乞委都知押班於兩邊板障門外檢校如敢竊有覘聽者並具姓名聞奏勘罪施行取進止建儲九月二十二日上殿劄子二道尋有詔以濮王子宗實知宗正寺臣近於前月二十六日上殿敷奏乞檢㑹臣在并州所奏三狀早定繼嗣事陛下聖意昭然即垂聽納凡所宣諭皆非愚臣所能及此乃天地神祇保佑皇家實萬丗無疆之休也臣謂陛下朝夕當發德音宣告大臣施行其事今將近一月未有所聞豈陛下以兹事體大愼選宗室未得其人將左右之人有所間沮熒惑聖聽臣皆不得而知也臣聞為人後者為之子也著於禮律皆有明文漢孝成帝即位二十五年年四十五以未有皇嗣立弟子定陶王欣為太子今陛下即位之年及春秋皆已過之豈可不為宗廟社稷深思逺慮哉况今亦未使之正東宮之名但願陛下自擇宗室仁孝聰明者養以為子官爵居處稍異於衆使天下之人皆知陛下意有所屬以係逺近之心俟他日皇子生復使之退歸蕃邸有何所傷此誠天下安危之本願陛下决意而遠行之取進止勸農劄子臣聞食者生民之大本為政之首務也饑饉之丗珠玉金銀等於糞土惟榖之為貴不可一日無也今國家每下詔書必以勸農為先然而農夫日寡游手日繁豈非為利害所驅邪今農夫苦身勞力惡衣糲食以殖百榖賦斂萃焉繇役出焉歲豐則賤糶以應公上之須給債家之求歲凶則流離異鄉轉死溝壑如是而欲使夫啇賈末作之人坐漁厚利鮮衣美食者轉而緣南畒斯亦難矣然則勸農者言也害農者政也天下生之者益少食之者益多欲榖之無涸得乎哉為今之術勸農莫如重榖重榖莫如平糴使諸路轉運使及州軍長吏遇豐歲能廣謀糴入官滿之日倉廪之實比於始至增羡多者賞之其無水旱之災益兵之費而蓄積耗減者黜之又令民能力田積榖者不以為家資之數如是則榖重而農勸雖有饑饉常無流亡盜賊之患矣今歲河北河東緣邊榖糴至賤此亦國家所冝留意者也乞矜恤陳洙遺孤狀右臣竊見殿中侍御史裏行陳洙資性忠果憂公忘私禀命不永奄辭聖丗垂沒之際猶上章奏搢紳之倫靡不嗟惜冝有旌嘉異於諸臣家素貧乏遺孤頗衆歸葬閩越道塗險逺伏望朝廷特賜矜憫依監察御史裏行張宗誼例除子男一人官及乞降朝旨下衢信建三州候洙喪柩至彼差人防護津送前去亦足以示朝廷褒直勸忠終始之恩也謹具狀奏聞伏候勑旨論環州事冝狀右臣竊知環州熟户蕃部屯聚攻劫殺傷兵民雖犬羊之衆人面獸心緩之則驕急之則叛固其常性亦由將吏恩不能懷威不能服信不能結勇不能斷平居無事則擾之使亂及其陸梁又不能制是使戎狄順服王化則浸苦不安桀驁鴟張則冨饒熾大凡邊境所以多事未有不由此也夫以屬國小胡背誕不恭而國家不能禽討使西北二虜聞之豈不益有輕漢之心伏望陛下特詔陜西不干礙監司體量蕃部所以叛亂之因若果由將吏撫御乖方所致則乞明行誅責以謝邊民更選良將能吏有方略者使之鎮遏分别蕃部善惡附順者撫而安之以壞散其黨悖逆者討而誅之使永久懾服不然臣恐其日月浸深罪惡愈重自知不為朝廷所容將外連西夏內結諸部黨與益衆氣熖益大方為朝廷旰食之憂非特鼠竊狗偷而已也謹具狀奏聞伏候勑旨論蘇安靜狀右臣伏見朝廷近除帶御器械蘇安靜充內侍省押班臣竊聞國家舊制兩省押班須年五十以上方得為之安靜年未五十特䝉擢用臣恐自今以後內臣求進者援以為例乃有年齒極少遂居衆首國之舊章因此隨壤竊為朝廷重之伏望陛下追寢安靜前命以存典法謹具狀奏聞伏候勑旨論張方平守邊輕易狀右臣竊聞近者秦鳳路經略安撫使知秦州張方平承信邊人虛稱西夏點兵侵犯邊境惶擾失度閉門乘城移牒鄰路索兵自救自永興以西軍馬皆被抽發使近邊之民轉相驚動關隴騷然仍飛奏上聞致朝廷憂疑巳而按省皆無事實方平身為元帥繫一方安危舉措施為衆所瞻倚今乃怯懦輕易一至於此萬一疆埸實有警急使方平當之豈不敗事臣竊恐戎狄聞之得以窺將帥之淺深益有輕中國之心非所以壯皇威鎮殊俗也伏望朝廷治方平之罪嚴加譴謫更擇明智沈勇之人以代其任庶幾國家藩屏得禦侮之臣可以髙枕矣論均稅官吏乞隨功過量行懲勸狀右臣先奉勑與三司同共詳定均稅已立條約下諸路監司施行去訖竊以為國家凡欲立事當先使賞罰明白然後事無不成伏見職方貟外郎秦植前通判德州事均五縣稅皆得平允並無人户詞訟若與庸愚之人煩擾敗事者同歸常調一無殿最則能吏解體必無成功伏望朝廷察其勤瘁優加酬獎并其餘均稅官吏隨其功過量行懲勸則來者覩之無不盡力矣謹具奏聞伏候勑旨論張方平第二狀右臣先於今月十四日上言秦鳯路經略安撫使張方平怯儒輕易乞更擇良將以代其任未蒙朝廷采納臣聞將者成敗之機安危之本固不可以任非其人今方平舉措輕脫震駭一方傳笑天下不才之跡章灼如此而朝廷猶掩覆包含一無所問臣恐戎狄聞之皆有窺窬之志吏士覩之皆有輕侮之心是國家重惜方平而輕弃秦隴也凡將帥能否患在不知既知其不能而任之如故臣誠愚戇深所未逹議者或以為方平雖失於倉猝然止於過為備禦若從而罪之恐自今守邊之臣聞有冦至皆不敢為備也臣竊以為不然所謂為備者當平居無事之時簡其將佐訓其士卒嚴其壁壘利其器械審其間諜逺其斥候使朝夕之間常若冦至如是則雖有猛鷙之敵不能犯也萬一犯之可以安坐而制之耳何至狼狽如是哉臣聞方平在秦鳯專以貴倨自處下情壅而不通自門牆之外皆可欺也况於兵民之休戚戎狄之情僞方平安得而知之是以一旦承信虛聲惶惑失據內驚諸郡上動朝廷此而不責典刑安用臣所以區區獻言不已者乃責方平之無備非責其為備也伏望朝廷察臣前後所言明治方平之罪謫之逺方以警封疆之臣使皆豫為備禦不敢驕傲懈弛如方平所為也謹具狀奏聞伏候勑旨溫國文正公文集卷第二十
