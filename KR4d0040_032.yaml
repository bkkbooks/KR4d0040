body:
  text: 章奏十七義勇第四劄子義勇第五劄子義勇第六劄子求降黜第一狀第五狀劄子陳述古劄子皮公弼劄子王廣淵劄子皮公弼第二劄子王廣淵第二劄子義勇第四劄子臣近日已三次上言乞罷陜西刺義勇事未蒙朝廷采納臣欲止而不言則不忍坐視一路之民橫受困苦而自圗一身之安又恐遷延日久則無及於事是以不敢避斧鉞之誅繼上封奏為陛下極陳其利害臣比日以來熟思此事誠於民有丗丗之害於國無分毫之利何謂於民有丗丗之害臣竊見河北陜西河東自景祐以前夲無義勇凡州縣諸般色役並是上等有物力人户支當其鄉村下等人户除二稅之外更無大假差徭自非大饑之歲則溫衣飽食父子兄弟熙熙相樂自寶元慶曆之間朝廷因趙元昊叛亂契丹壓境遂於三路鄉村人户之中不問貧冨等苐但有三丁之家即㨂一丁充鄉弓手及強壯其時西邊事冝尢急尋將陜西一路鄉弓手盡刺靣充保捷正軍其河北河東事冝稍緩遂只將鄉弓手及強壯刺手背充義勇自此三路之人始騷然愁苦矣其河北河東之民比於陜西雖免離家去鄉戍邊死敵之患然一刺手背之後則終身拘綴或欲逺出幹事糴賤販貴或遇水旱凶荒欲分房逐熟或典賣盡田産欲浮遊作客皆慮官中非時點集不敢東西又當差點之際州縣之吏寧無乞覔教閲之時人貟教頭寧無斂掠是於常時色役之外添此一種科徭也若果如議者之言無害於民則民皆樂從官中何必更刺其手背以防逃竄乎以此觀之義勇為害於兩路之民已可知矣况陜西於慶曆年中民家巳各喪一丁刺充保捷流落不歸今又取其次丁刺充義勇不亦甚乎朝廷近年分命朝臣遍往諸路減省諸般色役至於弓手壯丁解子驛子之類州縣所不可闕者亦皆減放謂之寬恤民力今乃無故一旦刺一路之民十有餘万以為義勇何朝廷愛之於前而忍之於後憫之於小而忘之於大乎且今日既籍之後則州縣義勇皆有常數每有逃亡病死州縣必隨而𥙷之則義勇之身既羈縻以至老死而子孫若有進丁又不免刺為義勇是使陜西之民子子孫孫常有三分之一為兵也臣故曰於民有丗丗之害也何謂於國無分毫之利太祖太宗之時未有義勇至於正軍亦不及今日十分之一然而太祖取荆湖平西川下廣南克江南太宗取兩浙克河東一統天下若振槁拾遺此豈義勇之力也哉蓋由民政修治軍令嚴肅將帥得人士卒精綀故也康定慶曆之間趙元昊負纍朝厚恩無故逆命侮慢不恭侵犯邊境朝廷竭天下之力以奉邊鄙劉平任福葛懷敏之師相繼覆沒士卒死者動以萬數正軍不足益以鄉兵外府不足繼以內帑民力困極財物殫盡終不能出一旅之衆涉區脫之地以討其罪而不免含垢忍耻假以寵名誘以重賂僅得無事當是之時三路新置鄉兵共數十萬何嘗得一人之力乎由此觀之義勇無用亦可知矣賈誼有言曰前車覆後車戒康定慶曆禦戎之䇿國家當永以為戒今乃一檢當時體例而行之是後車又將覆也有難臣者必曰古之兵皆出民間豈民兵可用於古而不可用於今乎臣則對曰三代之時用井田之法以出卒車馬居則為比閭族黨州鄉行則為伍兩卒旅師軍為之長者皆卿大夫士也唐𥘉府兵各有營府不屬州縣有將軍郎將折衝果毅以相統攝是以令下之日數萬之衆可以立具無敢逃亡避匿者以其綱紀素備故也今鄉兵則不然雖有軍貟莭級之名皆其鄉黨族姻平居相與拍肩把袂飲博鬪毆之人非如正軍有階級上下之嚴也若安寧無事之時州縣聚集教閲則亦有行陳旗鼓關弓彍弩坐作叫噪真如可以戰敵者彼若聞胡冦大入邊兵已敗邊城不守胡騎殺掠蹂踐卷地而來則莫不迎望風聲奔波迸散其軍貟節級將鳥伏鼠竄自救之不暇豈有一人能為縣官率士卒而待冦乎以臣觀之此正如兒戲而已安有為國家計驚搔一路之民使之破家失業而為兒戲之事乎臣故曰於國無分毫之利也凡此利害之明有如白黑伏望陛下不以臣愚賤而忽其言少留聽察其刺陜西義勇事早賜寢罷則一方幸甚取進止貼黃此事若稍更遷延竊慮陜西義勇已刺却手背無由更改伏望聖慈將臣文字早降中書樞密院施行義勇第五劄子臣近者巳曽四次上言乞罷刺陜西義勇别白利害極其懇惻然未蒙省察方今陜西一路之民大小遑遑如在湯火之中而朝廷晏然略無拯救之意臣職在針諌安可塞默不敢廣有援引以煩聖聽請以目前顯驗言之今建議以義勇為便者必曰即日河北河東不用衣糧而得勝兵數十萬皆教閲精熟可以戰敵又兵出民間合於古制臣請言其不然彼數十萬者虛數也教閲精熟者外貌也兵出民間者名與古同而實異也何以言之河北何東州縣既承朝廷之意各㨂刺義勇只求數多據帳籍言之誠有數十萬之衆矣若萬一胡冦在近官中急欲點集之時則一人不可見矣豈非虛數乎平常無事州縣教閲之日觀者但見其旗號鮮明鉦鼓備具行列有序進退應節即嘆美以為真可戰殊不知彼皆隊舞聚戲之類若聞胡冦之來則瓦解星散不知所之矣豈非外貌乎古者兵出民間民耕桑之所得皆以衣食其家故處則冨足出則精鋭今既賦斂農民之粟帛以贍正軍又籍農民之身以為兵是一家獨任二家之事也如此民之財力安得不屈豈非名與古同而實異乎以臣愚見河北河東已刺之民猶當遣放况陜西未刺之民乎陛下欲知利害之實何不試召建議者而問之曰河北河東自置羲男以來胡冦凡幾次深入至腹內州軍用義勇拒戰而胡冦敗退今既有義勇之後三路正軍皆可廢而不用乎若果然胡冦曽深入因得義勇之力而敗退今來刺義勇之後正軍皆可廢罷此乃萬丗之長䇿也願陛下行之勿疑若自置義勇以來未嘗經陳敵使用今來雖有義勇正軍亦未可廢罷則何忍以十餘萬無罪之赤子盡刺以為無用之兵乎天生聖君以為民也民今如此陛下豈可全不為之動心乎臣之所言盡於此矣陛下若以為稍有可采即乞早降指揮下陜西令罷刺義勇以救一方之民若以為敕命巳行不肯遽改即乞且免刺手背候邊事寧息依舊放散則民雖有一時搔擾之勞猶免終身羈縻之苦若以臣所言皆孟浪迃闊不可施行則臣之智識愚暗無以勉強變更不可久汚諌諍之列伏望聖慈特賜降黜别擇賢才而代之取進止義勇第六劄子臣昨日上殿為言乞罷刺陜西義勇事陛下宣諭以為命令巳行臣退而思之不勝鬱悒終夕不寐深祗陛下此言之失臣案周易復之𥘉九曰不逺復無痛悔元吉祇大也蓋言人誰無過雖在聖賢亦不能免然聖賢皆能不逺而復故雖有小悔不至於大而終保元吉也其上六曰迷復凶有災眚用行師終有大敗以其國君凶至于十年不克征蓋言失之巳逺迷而不復無事不凶而人君尤甚故孔子贊之曰迷復之凶反君道也自古明聖之君聞一善言立為之變更號令者多矣不可悉數惟近歲大臣自知思慮不熟號令巳失無以抑奪臺諌之言則云命令巳行難以更改此乃遂非拒諌之辭陛下新臨大政當求善無厭從諌如流之時而亦有此言天下將何望焉且唐室以前諌議大夫拾遺𥙷闕皆中書門下省屬官曰與中書令侍中侍於天子之側議論大政苟事有闕失皆得隨時規正今國家凡有大政惟兩府大臣數人相與議論深嚴祕密外廷之臣無一人知者及詔勑巳下然後臺諌之官始得與知或事有未當須至論列又云命令巳行難以更改則是國家凡有失政皆不可復救也如此豈惟愚臣一人無用於時諌諍之官皆可廢也以臣所見但當論其事之得失言之是非不當云命令巳行不可改也今陜西一路之民小大皇皇正如在湯火之中若忽得朝廷指揮云所有義勇且住㨂刺其已刺手背者並給與公慿放令逐便是得出湯火之中死而復生也其誰不歡呼鼓舞感戴聖恩豈有一人云命令已行不當復改邪陛下萬民之父母萬民陛下之赤子豈有父母誤墜其子於井而曰吾已誤矣遂忍不救邪昔舜稱堯之德曰稽千衆舍巳從人仲虺稱湯之德曰用人惟已改過不吝臣願陛下勿以先入之言為主虛心平意以察臣前後五次所言果然為是為非若其是歟即乞早降指揮罷刺陜西義勇若其非歟即乞如臣前來所奏特賜降黜别擇賢才而代之所有命令巳行之言伏望陛下自今永以為戒不可使天下聞之塞絶善言之路也取進止求降黜第一狀右臣近日纍曽上言乞罷刺陜西義勇事朝廷以言無可采寢而不行臣性識庸昧不逹大體妄以狂瞽煩瀆聖明章奏相繼至于五六終不能少以愚誠感動天聽尸祿矌官孰甚於此臣實無顔尚居諌列伏望聖慈察其無堪早賜降黜謹具狀奏聞伏候敕㫖第五狀右臣近曽四次進狀以言事不當乞賜降黜未蒙朝廷施行今伏見知制誥錢公輔因繳納王疇除樞密副使詞頭責授滁州團練副使臣竊以公輔所坐止於柅樞密副使恩命臣嚮來所言乃是沮宰相大議公輔密啓於詔令未出之前臣露章爭執於詔令已行之後公輔奏章止於一上臣凡六次進劄子五次進狀以此校量公輔罪輕微臣罪重輕罪猶蒙嚴譴重罪安可不行伏望聖慈詳臣前後所奏比錢公輔更於逺小處責降所貴聖朝刑典行之均一謹具狀奏聞伏候敕旨劄子臣近曽六次進狀以言事不當乞賜降黜未蒙朝廷施行陛下之意蓋謂臣一言不從遽求引去太為容易臣之愚心非敢獨為鄉來一事而已臣聞為士者苟得位於朝必能獻可替否致君堯舜躋民仁夀今臣備位諌職三年有半不能悉心竭忠以𥙷益明主使國家綱紀浸以隳紊百姓困窮衣食日蹙戎狄悖慢軍旅驕惰比於臣未作諌官之時未見有分毫之勝然則臣之不才較然可見豈敢不自愧恥尚竊榮寵伏望聖慈依臣前奏早賜責降取進止陳述古劄子臣竊聞陜西都轉運使陳述古昨因巡邊妄奏朝廷稱邊鄙寧靜不足為慮後因權涇原路經略司事聞副總管劉几稱西人點集將謀入冦請出兵防托述古恐與前奏相違因此怒凡奏稱不協軍情張皇生事擅移凡知鳯翔府數日之間西人果大舉犯邊殺掠弓箭手及熟戶蕃部述古亦不即時發兵救援致陷沒數千戶近者雖知朝廷巳差臺官勘到述古罪狀然竊聞所坐止於擅移劉几及奏狀有不實之處若以文吏議之罪不至重若以國家計言之為害實深何則國家承平日久人不習戰雖屯戍之兵亦臨敵難用唯弓箭手及熟戶蕃部皆生長邊陲習山川道路知西人情僞材氣勇悍不懼戰鬪從來國家賴之以為藩蔽今述古知西人欲求侵擾而自避翻覆之辜順成欺罔之謀抑遏將官不許救護遂以數千戶王民委於虎口使父子流離骨肉塗炭豈唯巳陷沒者深可哀痛臣恐自今巳後諸路弓箭手皆不敢於極邊居止熟戶蕃部皆有叛國從賊之心以此觀之其害豈小哉况述古出於明䕃材器庸鄙自歷官以來所至之處縱恣胸臆殘虐吏民不顧憲典輕侮王命驕暴狼狡天下共知屢曽坐事黜降旋復收用叨竊名位一朝至此誠過其分量故天奪之魄舉措乖繆駭人視聽陷敗民命坐辱國威內外之人無不憤疾臣聞舜誅四凶而天下服如述古平生所為亦可以謂之凶人矣陛下縱不欲明加斧鉞以謝邊民亦當投之荒裔以禦魑魅庶使封疆之臣少知驚懼取進止皮公弼劄子臣伏覩近降詔書於初任第二任通判人中選人權發遣三司判官公事九年之後擢為職司既使之久於其事又待以不次之位此誠用人之要術為政之首務也然當兹選擢之𥘉天下士大夫莫不延頸而望拭目而視若得清修孤直之人則皆勸慕為善秖節礪行不肖者亦化而為賢矣若得貪汚諂僞之人則皆傾巧干進飾貌盜名安恬者亦變而為躁矣此乃風俗之本原政治之樞機不可以不慎自非有竒材異績為天下所知未可容易當此舉也竊見尚書都宫貟外郎皮公弼為吏之處以貪叨致冨資性狡猾善為進取在京師則造請不倦在外則書啓相尋專用此術致舉者三十餘人一旦首膺兹選天下之人苟有知公弼所為者但私議竊歎憤鬱喑嗚莫敢發言此豈可以稱陛下求賢之意副四方跂竦之望哉若所選之人皆如公弼之類乃是開此徼幸之門以為佞邪躁進之塗恐非朝廷之福也所有皮公弼伏望聖慈追還前命勒歸本任况今中外之官本資序合入三司判官者尚不啻數十人豈得其中全無可選擇者願且選以𥙷即日三司判官之闕俟果有竒材異績為衆所知者然後依近降詔書舉而用之天下幸甚取進止王廣淵札子臣伏見新除王廣淵直集賢院外廷之人無不怪惑偶語族談莫知其故或云廣淵以脣舌便佞遊走於公卿之門蓋執政所薦也或云陛下潜龍之時廣淵以文章因陛下故人自薦逹素蒙知賞故特加拔擢此二者臣莫知其虛實若果有其一皆非朝廷之美也夫端士進者治之表也憸人進者亂之階也臣竊聞廣淵雖有文藝其餘更無所長於士大夫之間好奔競善進取稱為第一若以此獲公卿之知則其人固非端士矣嚮以𥘉任通判編排中書文字二年之間堂除知舒州搢紳巳皆相與指目以為僥幸今又驟加美職安得不取外朝之怪惑乎陛下方蒞政之𥘉欲簡拔天下賢材置諸不次之位以率厲群臣而執事之臣不能稱陛下之意前此用皮公弼權發遣三司判官今又用王廣淵直集賢院將何以使天下之人尚廉恥之節崇敦厚之風乎若陛下龍潜之時廣淵果曽以文章自逹於左右此尤不可昔漢文帝時景帝為太子嘗召上左右飲中郎將衛綰獨稱疾不往及即位寵侍綰過於它臣周太祖時丗宗鎮澶州張美為三司吏掌州之錢榖丗宗私有求假美悉力應奉及即位衆皆稱美材敏而丗宗終薄其為人廣淵若當仁宗之丗私以文章獻於陛下為臣忠謹者肯如是乎陛下今日當治其罪而又賞之將何以厲人臣之節也所有王廣淵新授直集賢院勑伏乞追還取進止皮公弼第二劄子臣近曽上言乞罷皮公弼權發遣三司判官公事未聞朝廷施行臣聞周禮小宰以六計弊群吏之治曰廉善廉能廉謹廉正廉法廉辨蓋言為吏者雖有六事皆以廉為夲也翼奉曰人誠向正雖愚為用若乃懷邪智益為害蓋言人操心不正者雖有材能無所用也今以公弼材能求於朝士之間不為難得若其貪汚諂僞則罕有其比陛下方欲簡拔英賢待之不次以切厲群臣新美大化而得公弼之徒臣恐四方聞之無不解體使廉正之士沉抑而不顯貪邪之人輻湊而競進其於虧損聖政敗壞風俗不為細事伏望陛下早追還公弼前所授恩命勒歸東明夲任取進止王廣淵第二劄子臣近曽上言乞罷王廣淵直集賢院事未聞朝廷施行外議籍籍至今未已臣備位諌職不敢塞默竊見廣淵憸邪便佞勤於造請以此之故自幕職入京數年之間得至除知州今又以特㫖直集賢院臣不知廣淵有何才德過絶於人而受國家寵榮如此之速也議者皆言陛下在藩邸時廣淵因時君卿以文章筆扎私有贄獻深自結納故有今日之命若果如此大為非冝臣聞為人君者洗濯其心至公至正審察善惡明辨是非忠信者雖有怨讎而必用姦回者雖有私恩而必誅是以群臣曉然各知所守一心同德以事其上今廣淵若於仁宗之丗私結陛下之知則陛下察其為人果為忠信果有姦回若以此獲美官則姦回之臣欲求進身者將何所不為恐非陛下之利也自古以來惟英明之主能知此理伏望陛下追還廣淵恩命仍嚴加竄謪以懲憸巧之臣用心不一者取進止溫國文正公文集卷第三十二
