body:
  text: 書啓二與東阿張主簿書與范景仁書再與范景仁書答明端太祝書答陳充祕校書與夏祕丞倚字中立書别紙與魏雲夫書間答德順軍劉太博忱書上始平公述不受知制誥啓龐丞相答劉蒙書與東阿張主簿書正月二十四日光頓首主簿足下光不佞蒙丞相辟署來此官雖賤微朝廷亦委之察舉境內賢士大夫苟捨置賢者而惟目前營求者之與罪孰大焉是以到官以來竊觀諸縣賢士大夫無如足下徇公愛民者其所以奉知固不俟足下之求也今乃貶損書誨有從風雨而老之歎殊非所望君子患不能不患人不知足下姑勉修所能何患無知己不宣光頓首與范景仁書九月二十六日同年弟司馬光再拜景仁學士足下嚮者景仁𥘉為諌官四方之士知與不知聞者皆曰諌官得景仁天下其庶矣况如光者其喜固不在衆人之後然而有所懼者其故何哉請試為景仁道之夫良玉易瑕清水易汚凡負天下之望者必任天下之責此理之固然也嚮使景仁才術操行無以異於衆人則其來也人不為之喜其去也人不為之戚默然不言人不以為責今景仁之名皎然暴於天下巳如清夜列星之文雖欲厚自謙讓藏於衆人烏可得哉此光所以為景仁懼也景仁官雖未甚逹然為天子耳目之臣朝夕在天子左右萬民之利病巳得而言之朝廷之得失巳得而言之亦不得謂之不用矣夫士之學行巳美而名不彰者朋友之過也既彰矣而時不用者執事之過也既用矣而功業不白於天下者敢問誰之過也行矣景仁勉之自今日以往天下之民萬一有失職而吟嘆者景仁之責也朝廷之政萬一有違理而傷道者景仁之責也非獨光浮目而望沈耳而聽也天下之人莫不皆然舉措小差天下之責四面至矣嗚呼可不懼哉自非相愛重之深至烏肯及此也不宣光再拜再與范景仁書月日光再拜景仁足下日者不自知其不肖猥賤敢妄以書干冒左右退自悔恐謂必且得罪見棄絶矣北都遞中忽辱示問然後知大君子納善無厭以畜其德汪汪然若江海之大夫如是天下之士孰不願挾其忠信以趨左右者哉幸甚景仁書云有朝廷之是非有天下之是非有後丗之是非夫何憂何懼善矣景仁之充此言也實天下蒼生之福也雖光亦願景仁如是而巳矣必曰議天下之是非若議樂之是非則非光之所敢知也又云必欲伺大臣之細故發其隱微以市已直實不能也此則不唯景仁恥之光亦恥之不願景仁為也光所謂良玉易疵清水易汚者謂其全之之難有疵汚而人見之易也非謂其易磷緇也春秋責賢者備孔子之意豈有異哉景仁或未之思耳凡論者審知其是守之不移然後能明其道何強辨之有哉必詭隨雷同然後景仁恱之邪屬部役者之金隄行在朝夕匆匆不能盡所懷光再拜答明端太祝書六月二十四日司馬光頓首太祝足下士之服儒衣冠者莫不指聖賢之道以為歸然而能至焉者幾希非其智力不足為也名利誘之則轉而從他不自知耳自古士之求道而不至者凡病此也今足下年甚少才甚美不知光之不肖而辱賜之書乃云非為名也欲師道德而巳嗚呼足下之言古大君子之言也審能充之聖賢之道近在耳目之前矣如光者將跂仰頌嘆之不及又奚暇道德之知而况以師道自處哉足下之志則誠美矣其所從求之人則非也孟子謂曹交曰夫道若大路然豈難知哉人病不求耳子歸而求之有餘師荀子曰學者誦數以貫之思索以通之為其人以處之除其害以養之足下儻察二子之言則雖閉門求之道烏有不至者哉光何人也足下推褒之過而督責之重譬之若指江河而使孺子涉焉必不敢從已不宣光恐悚頓首答陳充祕校書九月二十四日司馬光再拜復書祕校足下比日前辱賜書推褒責望皆非光所敢當惶恐纍日無以自處豈非足下愛之之厚而不覺言之之過也然光未知足下之志所欲學者古之文邪古之道邪若古之文則某平生不能為文不敢強為之對以欺足下若古之道則光與足下並肩以學於聖人光又智短力劣罷倦不進者也烏足問哉雖然足下之意勤不竭盡以告則必不止敢私薦其所聞足下擇焉足下書所稱引古今傳道者自孔子及孟荀楊王韓孫柳張賈才十人耳若語其文則荀楊以上不專為文若語其道則恐王韓以下未得與孔子並稱也若論學古之人則又不盡於此十人者也孔子自稱述而不作然則孔子之道非取諸已也蓋述三皇五帝三王之道也三皇五帝三王亦非取諸已也鉤探天地之道以教人也故學者苟志於道則莫若夲之於天地考之於先王質之於孔子驗之於當今四者皆冥合無間然後勉而進之則其智之所及力之所勝雖或近或逺或小或大要為不失其正焉舍是而求之有害無益矣彼數君子者誠大賢也然於道殆不能無駮而不粹者焉足下必欲求道之真則莫若以孔子為的而巳夫射者必志於的志於的而不中者有矣未有不志於的而中者也彼數君子者與我皆射者也彼雖近我雖逺我不志於的而惟彼所射之從則亦去的愈逺矣此某之所聞而是非不能自定者也足下試熟察而審處焉不宣光再拜與夏祕丞倚字中立書光再拜光初離并州一驛曽於遞中領所賜書以道塗無便可以報謝暨至都下則朝論紛紛以忽里之敗為皆因築堡引惹生事光每見公卿大夫下至等輩輒為開述虜侵漢地事體本末二堡不可不築之狀前日之敗蓋由邊將輕敵無備穿頭入網中本非作堡之過言之切至口幾流血而丗俗常情成是敗非氣焰方張不可嚮邇以光區區譬如鷦鷯漸羽以灑鄧林之火固無益矣聞光言者或逆加排折不容出口或嘸然陽應腹非皆笑要之所語數十百人訖無一人信者光遂閉口不敢復言但引咎責躬乞分取諸君之罪而并坐之所上之奏非特為龐公也亦具述當日與諸君謀議本末其言皆天地所監不敢有分毫欺罔仍言朝廷若不以修堡為非則龐某夏某等必不受責若以為非則龐某先巳罷修此堡因臣至彼見虜騎退散方議再修武某夏某等因臣傳導其言方得逹於龐某修堡之事皆臣所致若治其罪臣當為首乞伏重誅以正國典章再上不報又巡白二府力陳此誠乞朝廷大則肆之斧鉞中則流竄嶺海或聖朝至仁減貸極輕亦望以中立為比除一逺郡監當所以然者上以不虧國家至平之法中以少謝負纍知己之繫下則它日復見武侯中立及邢賈諸人有所施其靣目瀝㵼肝膽懇惻備至而二府諸公確然以為臺獄元無收竪使朝廷何以施行光退復具奏草更欲以死自請則親友皆言如此是明知朝廷不行而飾僞以采名也光聞其言實無以自明遂自塞默不敢復上而再三循念當日與中立於東齊計議之時固以成敗自決逮至忽里敗績之後光又與中立書言朝廷若知敗績不因修堡則吾輩何罪若為因修堡所致則必不以事盡諉諸君今諸君俱𬒳譴責而光獨得無咎是賣諸君以自脫也將不得列於人類其為羞愧可勝道哉每一念此晝則投筯輟䬸夜則擊席嘆吒終身慊慊不可湔洗若貯瓦石在於胸中無時可吐所以經年不通一字以問動止者固非懈惰誠由內自慙怍又未知中立察之與否使光執筆無以置辭前日邸吏乃以手字相示云得之西來軍士光然後知中立聰明察光非賣友者不加罪絶而猶賜存問光始敢布陳其所懷庶幾中立參以所聞知其非妄也雖然此乃略道梗槩其不可以書傳者須在他日靣談方盡覼縷也别𥿄詔獄所竪中立事嘗亦剽聞立寨斫木則有之辰巳之差則告者過也但謂所申郭武出巡為虛及狀內無武侯入城一節事耳然以光觀之皆中立忠於朝廷信於上司篤於僚友之事而治獄者集以為過當如之何此蓋措意不在中立故也書云又有餘憂此則慮之過者光去夏自麟還并悉述所聞衆人之議不出五策以白龐公其最下聽其侵耕置而勿問凡淺識偷安者其言皆如是也次則力戰決以勝負勇悍不思者其言如是也次則誘其耕民徙之內地使彼自懼失亡而去陳懷順之謀也次則絶其私市使彼自計侵耕所得不償所亡必來分割光與邢含人所議也次則乘間築堡以扞之借使不盡得其田亦足為麟州耳目藩蔽光與武侯中立所議也龐公幸用其二而舍置其三誘民決戰勿問於今日思之始知當日下策乃上計也嗟乎事難預知無可言者所惜者國家邊臣姑息之弊久矣今止欲自於漢地內立一小堡巳謂之引惹生事罪及元帥則後來者所為可知益使戎狄輕漢矣次則龐公垂教孜孜為國更獲欺罔之名次則中立才美操堅而橫罹此雖不足為異日之纍而亦暫致淹回次則光罪當為首而不蒙誅戮貶竄使國家有同罪異罰之譏此皆某所慊慊者也以此之故光今雖強顔出入朝省每有人正視其面則慙不敢仰凡以上纍知己而旁負朋友故也其他一一非書所盡盛暑中倍自保輔與魏雲夫書間十二月十一日光再拜雲夫處士老兄近蒙貺手筆云見家兄言光頗喜飬生夫生之貴於物也甚矣人不能保其生於他何有光心雖喜之不能得其塗徑望其藩牆也今老兄年餘八十矣自皇祐𥘉拜别又逾十年每聞家兄言老兄精神益明旅力益壯視聽飲食過於少年不知以何道修育乃能至是誠不勝嘆慕之深顧以俗網縻縶無由得親執几杖以受教於下坐儻有道之稊稗土苴可使愚陋牽俗之人與知而力行者願時賜誨諭俟它日得侍左右然後卒業不勝幸甚不宣光再拜答德順軍劉太博忱書光頓首再拜趙令來蒙貺書教以所不及始於喜愧終於感懼光常病丗人稱交友者相遇則詡詡笑言以酒食相恱相去則長函短幅副以苞苴言皆諂諛又似欺侮習尚成俗莫知其非求諸古人切切偲偲諒直之益萬無一二常懼沒丗不見其人今乃得之於足下此其所以為喜足下所示皆國家安危之本治亂之原當今所冝汲汲者足下為逺官無言責猶能孳孳不忘忠藎如此光仕於朝廷官以諌為名政事有闕或不能知知之或不能言言之或不能入不能入又不能去此其所以為愧也昔者先人獲知於先龍圗推稱援挽以至於通逹今兹某又獲知於足下教誨隱括使逃於罪戾仍丗受賜於門下此其所以為感也觀足下之言非直可以為交友之良乃實國家之忠臣光知不能薦又偷安竊祿以妨賢者之路大則將受誅於朝廷小則將取譏於天下之士大夫此其所以為懼也凡足下所諭敢不熟思而謹志之苟其智力之所及者不敢不勉也謹此布謝懇伏惟俯賜照察不宣光頓首再拜上始平公述不受知制誥啓龐丞相光惶恐啓雨後薄寒比日晴霽稍復暄暖伏惟台候萬福適蒙寵賜手教問以久不受恩命之故不惟愛念之厚乃復知其堅守愚志必有所為非苟然而已古人所謂知已者正應如是區區之死不足以報感極以泣無言可諭光自總角以來則拜伏趨走於前又辱知愛如此之重豈敢以半言誣罔聰明借使有之亦不能欺也光自幼讀經書雖不能鉤探微藴比之他人差為勤苦盡心而巳又好史學多編緝舊事此其所長也至於屬文則性分素薄尤懶為之當應舉時強作科埸文字雖僅能牽合終不甚工頗慕作古文又不能刻意致力窺前修之藩徒使其言迂僻鄙俚不益世用此真所謂學步邯鄲匍匐而歸者嚮者年三十餘相公在樞府時始令學作四六文字供給箋奏雖承命不敢不勉而終以愚陋不能進益自相公出鎮以來亦遂捨置未常復為也時時答親舊書啓則不免假手於人今知制誥之職掌為天子作詔文宣布華夷豈可使假手答書啓者為之邪光與石舍人同年登第少相親狎熟知其人志度清夷操行純一當在館閣時聞望甚美其文采亦不全出衆人之後一旦擢處西掖所作告命小有瑕謫則輕薄之士相與傳以為笑至今身沒而傳笑者未巳光竊傷之嚮使石不登西掖豈有此辱邪光平生所為文辭比之於石自謂猶未能及而視此前轍欲使光遵而蹈之豈能不懼且愧苟貪其榮利強顔為之不惟取一身沒齒之羞亦非所以增朝廷之光華也以是觀之光之不授知制誥出於赤誠非飾讓也但不為朝廷及丗人所諒耳夫館職止於校正文字故雖如光者亦可為之至於知制誥天下止有四貟非文辭髙妙殊衆絶倫者固不可為也非獨如是而巳㧕又有勢不可受者光嚮者除開封府推官判三司度支句院及修起居注皆曽辭免至于四五而不能得請卒復舊職今兹召試制誥私心自念以為若復辭而不獲則舉措可慙不若勿辭遂勉強就試當是之時謂吕侍講雖辭亦必不免無何明旦欲詣閣門受勑而今夕聞吕别有除命乃知光自不辭而非朝廷不許也是以復有今者之請奏章巳四上矣若又因循復往就職則是前後辭讓祿位皆詭詐飾名以巧邀朝廷舉不可信矣雖家人僕隸猶將疑之况天下之人乎如是則光無復靣目以立於士大夫之間是以竭力致辭不復計奏章之數若朝廷終不見聽治其頑蔽不恭之罪行罰而巳矣知制誥必可免也前日至堂中見執政亦具以此誠白之不知其見信否今并四次奏草封上貴知其本末之詳自免陳職以來喜有參侍之期而以辭官之故未奉朝請伏謁門下杳未有涯晨夕遑遑心如遊雲常在左右但形留不往耳既不獲面陳因辭杼情不覺煩多答劉蒙書五月十六日陜郡司馬光再拜復書賢良劉君足下昔張伯松語陳孟公曰人各有性長短自裁子欲為我亦不能吾而效子亦敗矣馬文淵戒兄子欲其效龍伯髙之周慎謙儉不欲其效杜季良憂人之憂樂人之樂也光愚無似何足以望萬一於古人然私心所慕者伯松伯髙而不敢為孟公季良之行也况幼時始能言則誦儒書習謹敕長而為吏則讀律令守繩墨齪齪然為鄙細之人側足於庸俗之間不為雄俊竒偉之士所齒目為日久矣不意去歲足下自大河之北洋洋而來遊於京師負其千鎰之寶欲求良工大賈而售之乃幸見顧於陋巷因得竊讀足下之文窺足下之志文甚髙志甚大語古則浩博而淵微論今則明切而精至誠不能不口誇而心服譬如窶人子終日環繞愛玩咨嗟傳布訖無一錢敢問其直之髙下亦終於無益而巳矣今者足下忽以親之無以養兄之無以葬弟妹嫂姪之與以恤䇿馬裁書千里渡河指某以為歸且曰以鬻一下婢之資五十萬卑之足以周事何足下見期待之厚而不相知之深也光得不駭且疑乎方今豪傑之士內則充朝廷外則布郡縣力有餘而人可仰者為不少矣足下莫之取乃獨左顧而抵於不肖豈非見期待之厚哉光雖竊託迹於侍從之臣月俸不及數萬㸑桂炊玉晦朔不相續居京師巳十年囊禇舊物皆竭安所取五十萬以佐從者之疏糲乎夫君子雖樂施豫亦必巳有餘然後能及人就其有餘亦當先親而後踈先舊而後新光得侍足下裁周歲得見不過四五而遽以五十萬奉之其餘親戚致舊不可勝數將何以待之乎光家居食不敢常有肉衣不敢純衣帛何敢以五十萬市一婢乎而足下勿以出責之豈非不相知之深哉光視地而後敢行蝢足然後敢立足下一旦待以為陳孟公社季良之徒光能無駭乎足下服儒衣談孔顔之道啜菽飲水足以盡歡於親簞食瓢飲足以致樂於身而遑遑焉以貧乏有求於人光能無疑乎足下又責以韓退之所為若光者何人敢望韓退之哉韓退之能為文其文為天下貴凡當時王公大人廟碑墓碣靡不請焉故受其厚謝隨復散之於親舊此其所以能行義也若光者何人敢望退之哉光自結髮以來雖行能無所長然實不敢錙銖妄取於人此衆人所知也取之也廉則其施之人也靳亦其理冝也若既求其取之廉又責其施之厚是二行者誠難得而兼矣足下又欲使光取之於他人是尤不可之大者微生髙乞醯於鄰人以應求者孔子以為不直况巳不能施而斂之於人以為巳惠豈不害於恕乎足下之命既不克承又費辭以釋之其為罪尤深足下所稱韓退之亦云文章不足以發天下之事業錢財不足以賄左右之匱急稇載而往垂橐而歸足下亮之而巳不宣光再拜溫國文正公文集卷第五十九
