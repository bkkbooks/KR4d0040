body:
  text: 碑誌三太常少卿司馬府君墓誌銘清逸䖏士魏君墓誌銘鄆州䖏士王君墓誌銘禮部尚書張公墓誌銘右諌議大夫吕府君墓誌銘太常少卿司馬府君墓誌銘兄諱某字昭逺曽祖考諱某妣某氏祖考諱某妣某氏考諱某追贈光禄卿妣李氏封永夀縣太君兄舉進士及苐𥘉命威勝軍判官又調涇州觀察推官尋監渭州酒稅改大理寺丞知猗氏縣未幾簽書保大軍莭度判官事故丞相龐公為鄜延經略使奏兄通判鄜州事徙知渝州厯知慶成軍觧房二州觧房皆未到官徙知啇州自啇還京師監右廂店宅務丁永夀太君憂服除知乾州以治平三年正月辛酉終於州𪠘享年六十有九累官至太常少卿兄為人孝友居䘮致哀寛厚容物而内守勁直在鄜州州長皆武人多驕恣不法兄平居與之燕逰笑語若無不可者及臨公事則正色立争必當理然後巳州長雖甚怒無如之何然知其無害已心亦不深怨也在渝州其佐曰趙寅以傲狠刻暴名扵世雖在卑位常行行視天意氣如公相兄始至閱獄囚釋寅所妄繋者近百人寅争之兄一不顧既而詞禮倨慢兄亦不與之校乆之寅寢自媿悔謝服及寅官滿泣涕不忍去兄早孤年過三十乃仕以是周知民間情偽其為政務合民心有悍狡為民害者痛繩以法愚弱不失理者徐為諭觧往往曉悟欣悅輟訟而去故所至民愛慕去之乆猶思詠不已然其奉上官無過分之禮每罷官入京師多閉戸家居未嘗及權貴之門視審官缺貟榜扵壁人乆不取者輟受以去惟掌店宅時留京師凡再朞自餘率不過數月已去矣以是獨所治之民知其才業之美朝廷終無從知之佗人人或仕䆠絶在兄後或才能出兄下逺甚以熟扵時態往往取顯䆠兄䖏之晏然俱若不見聞者常曰吾幸以寒士積官至二千石自足已乆尚何求於人哉司馬氏同居累世宗族甚大兄為之長凡二十餘年能一施以㤙無親踈賢不肖之間故人人無怨善為詩多為人傳誦夫人同郡魏氏封某縣君故䖏士贈著作郎野之女䖏士名重扵真宗朝列傳在國史夫人先兄十八年終於渝州享年若干子男二人雍太廟室長應試将作監主簿女三人長適内殿承制雷周祐次適馮翊縣尉王淳蚤卒次適郊社齋郎崔頴兄終之歲某月某甲子與夫人合塟扵先塋光以塟日之迫不暇請扵佗人故忍泣叙而銘之光後兄二十一歲而生加之各從䆠四方於兄治行不能得其詳姑録其所知以傳永乆不敢以一言私也銘曰夀雖未高不為夭官雖未顯不為卑徳之和為衆所慕政之便為民所知仕不茍進兮於道無虧兄今何恨兮生者同悲嗚呼哀哉清逸䖏士魏君墓誌銘君諱閑字雲夫世家于陕之東郊父諱野真宗皇帝時有大名累召終不能起贈著作郎君少喜為詩學鼔琴不樂仕進一遵著作君之志皇祐二年仁宗皇帝祀眀堂詔天下求遺逸草莱年耆徳茂者知府直史舘李公昭遘薦君再世有高莭上嘉之賜號清逸䖏士嘉祐八年八月癸未終于家年八十四君自始生至沒當國家隆盛偃兵無事之時家有舊田廬君謹守而治之朝廷以著作君之賢復其子孫無有所與以故沛然自足無衣食之累性不嗜酒謹㓗守法度然與人和浮沈閭里不自標掲以故其生也人樂與之逰其沒也無謗言府縣之官或時延禮亦與之往来然未嘗有毫髪之私以干之其政事失得未嘗納於耳出於口也以故皆愛重之無厭倦少好養生大要用冲澹自守不以一物累其心以故視聴歩趋能老而不衰嗚呼今之名䖏士者多矣或力為竒譎以盗聲名萬一輩幸欲欺愚俗取美官或交逰有位依其名勢乾没射利以侵漁細民若是者雖不仕又足賢乎然則能保其福樂而免扵過咎有如君者凡幾人邪君三娶曰臧氏曰趙氏曰皇甫氏子男一人曰樵女三人適進士梁軫張震左侍禁張宏孫男二人曰潜曰澤先僕射與著作君相愛如昆弟光拜君於髫齓之年今也其孤将以某年月日塟君於某地来求銘光何敢辭銘曰天長不息兮地大無疆人寓其中兮細於毫茫奪攘紛糾兮非愚則狂惟君之生兮遭世寜昌依承先徳兮曄然有光笥有餘衣兮廪有餘糧養生以理兮行已有方居不煩人兮逰不出郷逍遥自適兮旣夀而康視彼公侯兮金朱煌煌憂勞沒齒兮或罹咎殃為得孰多兮為謀孰長鄆州䖏士王君墓誌銘至和中光從故丞相龐公鎭鄆州公命光典州學學生王大臨通經有行誼光特愛重之後十五年王生来見光於京師曰大臨将以今年某月某日塟其親於湏城縣長山之麓子為我銘其墓光辭以拙於文生曰大臨逺来非有佗故唯銘之求朝士大夫以百數大臨無所謟唯子之歸子何得拒之光媿其言不敢辭因曰然則願聞先子之行生乃出其邑人試祕書省校書郎梁君燾之状以授光曰君諱惟徳字輔之始為童子父行戍於蜀君侍大父母撫諸弟以孝友聞其治家如成人大父母終君親負土成墳終喪不嘗酒肉父自蜀歸家益冨父好散施君竭力以助之有所予必稱父命以致之嘗舉三禮一試於禮部不中格喟然歸不復就舉専以養親治經為事著禮說二十卷性温厚喜導人為善郷里謂之王君子有鬪者君徐以義理辨告皆悅曰君子幸教我我何敢違即觧去不復詣吏年若干病亟歎曰死生有命恨不得終為子之道以天聖五年十一月辛亥終再娶皆楊氏其後夫人贈職方貟外郎旦之女也能成君之志順適舅姑使之終身無憂愠之色及老寢疾每祭祀猶强起執事年若干以嘉祐五年十二月己已終子男五人長曰大順今爲剡縣主簿次未名次大同皆早世次宗道次大臨女二人長適大學舘學究劉應祥次亦早世君既沒家甚貧大臨以善講觧爲諸生師月受俸於州學錢二千積而不用滿三十萬乃舉兩世之柩而塟之光不及見君知其爲人以其子之賢與梁君之言於是乎銘銘曰孝乎親友于其弟家有餘施及郷里人悅其教稱爲君子嗚呼是亦爲政奚必仕禮部尚書張公墓誌銘熈寜四年三月癸已禮部尚書致仕張公年八十八薨于冀州私苐其孤保孫状公之功行遣使者走洛陽謂光曰公将以八月壬申塟子爲我銘公之墓光旣哭自惟文辭鄙惡不足發眀公事業然婚媾累世庶知公之志於佗人爲詳用不敢辭公諱某字誠之其先家於深州曽祖諱侑祖諱光偉贈太子中允父諱文質贈尚書左僕射母太原郡太君王氏自㒒射以上皆不仕而家饒於財太平興國中契丹屢入塞㒒射以深州城惡始徙居冀州眀年深州䧟公以景徳二年登進士苐厯蜀州趙州司理遷安肅軍判官天禧末詔詮司以身言書判取士應詔者五十餘人唯二人中選而公與其一由是除著作佐郎知朝城縣㓂忠愍公尹大名於僚吏中待公獨異曰觀君器業他日必當逺到秩滿爲開封府司録出知将陵縣通判雄州王文康公爲御史中丞薦公自屯田貟外郎改殿中侍御史遷侍御史彈劾不避貴戚遷兵部貟外郎封塩鐵勾院明道二年京東大飢選公爲轉運使賑救有方優詔褒美就賜𬗋衣金魚間一歲徙陜西又徙河北舉按貪横風迹益顯景祐四年入爲戸部副使寳元元年遷度支副使㝷元昊僣亂西鄙騷動詔以公爲天章閣待制陜西都轉運使諸将爭進攻取之榮公上言戎狄狂僣自古有之今大兵出征臣恐生民徧受其弊若元昊果有悛悔懐服之心無佗邀求雖名號未正臣謂亦可闊略與其責虚名於戎狄曷若拯實弊於生民也朝廷雖不即從其後綏撫元昊亦略如公筞康定元年遷龍圖閣直學士知延州是時大夫人髙年𬒳疾公難於逺離而不敢辭朝廷責公不即之官復以待制知澤州明年徙知成徳軍遭太夫人憂有詔起今視事俄還學士職公上言契丹與元昊為婚恐隂謀相首尾河北城久不治宜留意㑹契丹聚兵塞上求關南地慶暦二年詔以公為河北都轉運使悉城河北諸州契丹講觧復知成徳軍明年自兵部郎中遷右諫議大夫充河北都轉運使公辭以河北幸無事願以故官留成徳詔從之明年徙知青州問一歲入知審官院改知開封府明年出知成徳軍未行改河北都轉運使公上言恩州守臣非其人州兵驕悍恐有意外之變不報俄徙陕西都轉運使恩州兵王則果作亂公坐失覺察明年左遷知汀州先是冀州男子李教醉酒妄言渉妖逆事覺自經死教兄敡為公壻其怨家告敡父母因敡私屬公得免縁坐事下御史府案驗皆無實公猶以婚家落學士自給事中降授左諫議大夫初貶江南㝷徙知彬州皇祐元年復以給事中知洪州明年復為學士在洪三年入判流内銓知審官院出知澶州明年徙河北都轉運使至和元年徙知相州明年復知審官院嘉祐元年知邢州明年告老以吏部侍郎致仕家居凢十五年遇英宗今上即位及郊禮恩就遷三官為禮部尚書公性孝友始罷蜀州歸得蜀中竒繒物入門不以適私室悉布之堂上請太夫人及昆弟姊妹恣擇取之常曰兄弟天之所生譬如手足不可離絶妻妾乃外舎之人奈何用外人而㫁手足乎宗族雖甚踈逺其貧窶者無不收恤男女孤婺矛牙者皆為之婚嫁無一人失所者然為人荘重雖家居常自整飾衣冠不具不以見子孫與語或至夜分不命之坐閨門之内肅然如官府事小大皆有條理自始仕至終老凡與賔友相接常垂足危坐或燕飲終日逮夜未嘗稍輕倚有倦怠之色佗人莫能為也其在官以精敏㢘直為朝廷所知故每有邉警及灾害處多以公當之事無不集識量髙逺能甄别人物前後薦舉僚吏数百人訖無一人敗官爲累者翰林鄭學士獬屡舉進士不中見公於洪州公曰君科名當爲天下第一得自有時勿以爲憂巳而果然家本河北不習舟楫及謫官南方極江湖之險每值風濤家人不勝愁恐公曰吾自省平生處心無可愧者神明必将衛我豈沉溺於此哉怡然不以屑意在南方累年夫人及子孫相衛物故者数人知冀州蔣偕嘗有憾於公乗公之謫以事殘破公家至伐墓中柏以治道路佗人謂公罹此憂患必不能濟公以道自寛卒無恙而返及偕爲儂蠻所殺家人或有快之者公輙怒責公既納政還郷里熈寜初河北地大震往往壞官府民居公方食案上器皆傾墜左右奔散公安坐自如徐曰地震常理何至驚遽如此時河决棗彊勢逼州城或勸公徙家邢州公曰吾家衆所望也苟輕為舉動使一州吏民何以自安卒不徙朝廷優禮舊徳五授其子保孫以冀州官保孫欲順適公意凡居處出入及燕待賔客奉養供張之具皆不减為二千石時故公雖退居不自覺異於昔日也年逾八十耳目手足猶聡明輕利飲食起居壮者或不能及嗜讀書老而不衰臨終前一日呼門生問西邊用兵今何如朝廷法令無復變更否其忠愛之心盖出天性非有為而為之也訃聞太常謚曰恭安夫人永嘉郡君劉氏先公亡二男長曰貽孫大理評事次曰保孫殿中丞五女長適前進士李敭次適供備庫副使賈世永次適端明殿學士司馬光次適供備庫使任永次適厯城主簿劉忠輔貽孫及適賈氏劉氏女皆早卒公乆在貴位宗族用公䕃𥙷官者凡三十餘人銘曰福善之道世或疑之以公而觀决無可疑仁不遺親忠不忘君立身謹嚴當官恪勤入踐䑓閣出臨藩服自少通顯逮于納禄體強無疾資用常充年垂九十榮禄而終章綬纍纍延于九族歸從祖考是謂全福右諫議大夫吕府君墓誌銘府君諱誨字獻可其先幽州安次人曽祖父諱琦晉兵部侍郎贈太師中書令尚書令祖諱端相太宗真宗以太子太保薨謚正惠贈太師中書令伯祖諱餘慶太祖時參知政事贈鎮南軍節度使各有功烈記於史官父諱荀國子愽士贈兵部侍郎母張氏追封清河郡太君獻可㓜孤自力為學家于洛陽性沈厚不妄交㳺洛陽士人往往不之識登進士第調浮梁尉不之官歴旌徳扶風主簿遷雲陽令改著作佐郎知翼城縣徙簽書定國軍節度判官通判梓州事未至官遭母䘮服除知大通監兼交城縣召入為殿中侍御史彈劾無所避兖國公主仁宗之愛女下嫁李瑋薄其夫家嘗因忿恚夜開禁門入訴於上獻可奏宿衛不可不嚴公主夜叩禁門門者不當聽入并劾奏公主閤宦者梁懐古梁全一竄逐之㑹有新除樞宻副使者當時人有疑論獻可與其僚直以衆言陳上前謂必不可留章十七上卒與之俱罷獻可得知江州久之復召還臺英宗即位改起居舎人同知諫院時上有疾太后權同聴政内侍都都知任守忠乆用事於中上之立非守忠意乘此與其徒間太上御名兩宫造播惡言中外恟懼獻可連上兩宫書開陳大義情辭切至由是慈孝益篤䜛言不得行上疾久未平獻可請早建東宫以安人心既而上小瘳謙黙未可否事獻可屡乞親萬機攬威福延近臣通下情又請太后間数日一御東殿漸逺庶務自謀安佚㑹小旱因請上親出禱雨使外疑釋然太后旣歸政獻可復言於上今雖專聴㫁太后輔佐先帝乆多閱天下事事之大者猶宜關白咨訪然後行示不敢專以報盛徳任守忠謀不售而懼乃更巧爲謟諛求自入於上獻可曰是不可使乆處左右亟言上数其前後巨惡并其黨史昭錫竄於南方因上言大姦已去其餘嚮日慿恃無禮者宜一切縱捨勿念以安反側頃之以兵部貟外郎兼侍御史知雜事執政建言欲如漢氏故事推尊濮安懿王獻可率僚属極陳其不可且請治執政之罪積十餘章不聽仍求自貶又十餘章懐知雜御史敕告納上前曰臣言不效不敢居其位上重違大臣又嘉臺官敢直言章留中不下還其敕告屡詔令就職獻可與僚屬具録所上奏草納中書稱不敢奉詔固請即罪上不得已聽以本官出知蘄州巳而徙知晉州今上即位加集賢殿脩撰知河中府未㡬召爲刑部郎中充鹽鐡副使上素聞其疆直擢爲天章閣待制復知諌院遷諌議大夫權御史中丞是時有侍臣棄官家居者朝野稱其材以爲古今少倫天子引叅大政衆皆喜於得人獻可獨以爲不然衆莫不怪之居無何新爲政者恃其材棄衆任己厭常爲竒多變更祖宗法專汲汲歛民財所愛信引㧞時或非其人天下大失望獻可屡爭不能得乃抗章悉條其過失且曰誤天下蒼生必此人如久居廟堂必無安靜之理又曰天下本無事但庸人擾之上遣使諭解獻可執之愈堅乃罷中丞出知鄧州獻可雖在外遇朝廷有大得失猶言之不置㑹有疾奏乞閑官歸郷里朝旨未許乃乞致仕詔提舉西京崇福宫到官又乞致仕許之以熈寜四年五月甲午終於家年五十有八初正惠公薨其家日益貧獻可旣仕常分俸之半以給宗族之孤婺矛牙者室無餘貲所以自奉養至儉薄其治民主於惠利而疾姦暴大抵㮣以公平故所至人安之屡為言職其奏草存可見者凡二百八十有九厯觀古人有能得一二已可載之列傳垂示後世在獻可曾何足道今特舉其事繫安危者書之至於進對口陳之語不可得而聞也前後三逐皆以迕犯大臣所與敵者莫非秉大權天子所信嚮氣勢軋天下獻可視之若無所睹正色直辭指数其非不去不巳旁則為之股栗而獻可處之自如平居容貌語言恂恂和易使之不得位於朝人不過以謹厚長者名之而巳矣及遇事茍義所當爲疾趋徑前如救焚溺所不當爲畏避逺去如顧䧟穽惟恐墜焉晚年病卧洛陽猶旦夕憤嘆以天下事爲憂過於在位任其責者曽不念其身之病子孫之貧也嗚呼今之世愛君憂民發於誠心無所爲而爲之可已而不巳始終不變有如獻可者能幾人邪故其沒之日天下識不識皆咨嗟痛惜彼其心豈獨私於獻可㢤獻可始娶張氏故丞相鄧公之孫後娶時氏故侍御史旦之孫封同安縣君四男長曰由庚金水主簿次曰由聖将作監主簿次曰由禮由誠皆未仕六女長適羅山令鞠承之次適光禄寺丞吳安詩次適進士姚輝次蚤卒處者二人以其年八月某日塟伊闕先塋獻可病亟爲手書命光爲埋文光往省之至則目且瞑光伏呼曰更有以見屬乎張目強視曰無光出門而獻可沒噫如光者烏足以副獻可之所待邪顧義不得辭哭而爲銘銘曰有宋名臣吕正惠公之孫以忠直敢言克紹其門位則不究道則不負年則不夀名則不朽嗚呼爲人臣爲人嗣始終無愧能底于是可謂備矣温國文正公文集卷第七十七
