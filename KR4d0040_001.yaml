  text: 溫國文正公文集卷第一
  hash: sha256:26344b97ca030ede6540c897cc99c587d90ef50193167f7109c5cd6816cb60f7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_001-1a}
body:
  text: 古賦進交趾獻竒賦表交趾獻竒獸賦稷下賦靈物賦進交趾獻竒獸賦表嘉祐八年九月初三日上臣光言今月二十五日有詔詣崇政殿觀交州所獻異獸曰麒麟者臣愚不學不足以識異物竊以麟瑞獸也曠世而不可覿其於經有名而無形傳記有形而去聖久遠衆説紛揉自非聖人莫能識其真况承學之臣固不能決其是非也臣光中謝竊以王者道盛德至格于神明則有仁獸不召而自至不羈而自馴此其所以為瑞也今是獸也生於遐荒拘之檻櫝載之方舟輿曳萬里致於闕庭形質詭異不應經傳真偽之間未易究測儻其真也則非自然而來設其偽也徒為逺夷所笑殆非所以發揚聖朝之光輝補益治平之實效也旅􅋙曰不作無益害有益功乃成不貴異物賤用物民乃足犬馬非其土性不畜珍禽竒獸不育于國不寶逺物則逺人格所寶惟賢則邇人安臣竊以為宜延見使者賚之金帛賜以詔書嘉答其意歸其麒麟使復故壤然後登俊傑之才修政治之實使家給人足禮興樂行四夷賓服天瑞自至以遵旅熬之意不亦盛乎臣不勝憤悱謹述交趾獻竒獸賦一篇奉表投進以聞交趾獻竒獸賦皇帝御天下三十有六載化洽於人德通於神邇無不協逺無不臻粵有交趾來獻麒麟其為狀也熊頸而鳥噣豨首而牛身犀則無角象而有鱗其力甚武其心則馴蓋遐方異氣之産故圖諜靡得而詢於是降軺車之使發旁縣之民除塗於林嶺之隘引舟于江淮之濱曠時月而􅍱萬里然後得入覲於中宸與夫雕題卉服之士南金象齒之珍𣢾紫闥而坌入充彤庭而並陳於是羣公卿士百僚庶尹儼然垂紳薦笏旅進而稱曰陛下功冠邃古化侔儀極恭承神祇嚴奉宗稷純孝蒸蒸小心翼翼出入起居不忘於訓典進退周旋必資於軌則體文王之卑服遵大禹之菲食宫室觀臺無礱刻之華輿馬器用無珠玉之飾逰必備于法駕燕不廢於朝夕此皆帝王所不能為而陛下行之尚不忘於怵惕是以方內乂寧黎民滋殖垂髫之童耳皆習於詩禮戴白之叟目不睹夫金革至于根著浮流跋行喙息無不鞠舞太和涵濡茂澤此殊俗所以嚮臻靈獸所以來格雖漢室之初黑鷴貢於絶徼周家之隆白雉通于重譯殆不足方也臣等謂宜命協律播之聲歌䛇太史編之簡策以發揮不世之鴻休張大無倫之丕績不亦偉乎皇帝乃穆然深思愀然不怡曰吾聞古聖人之治天下也正心以為本修身以為基閨門睦而四海率服朝衆和而羣生恱隨故務其近不務其逺急其大不急其微今邦雖康未能復漢唐之宇俗雖阜未能追堯舜之時况物尚疵癘而民猶怨咨朕何敢以未治而忘亂未安而忘危享四方之獻當三靈之釐且是獸也生嶺嶠之外出沮澤之湄得其來吾德不為之大縱其去吾德不為之虧奈何貪其琛賮之美恱其鱗介之竒容其欺紿之語聽其諂諛之辭以惑逺近之望以為蠻夷之嗤不若以迎獸之勞為迎士之用飬獸之費為養賢之資使功烈烜赫聲明葳㽔廢耳目一日之玩為子孫萬世之規豈不美歟於是群臣拜手稽首咸曰此盛德之事臣等愚戇所不及陛下誠有意於此臣等敢不同心竭力對揚而行之皇帝於是御棫朴之篇觀大畜之繇延黃髮之儒顯巖穴之秀善有可旌無間於幽逺言有可采不棄於微陋位匪德而不升官無能而不授使稷契居左皋夔立右伊吕在前周召待後相與講經藝之淵源覽皇王之步驟求大化之所未孚訪惠澤之所未究興民之利若􅓼夫飢渴除民之害若憂夫疾疚賜豫簡而功無所遺刑罰清而姦無所漏浮費省而物不屈于求須苛役蠲而農不妨于耘耨使之夏有葛而冬有裘居有倉而行有糗絲纊之饒足以養其老甘脆之餘足以慈其幼地不加廣而百姓足賦不加多而縣官富道塗之人恥爭而喜讓閭閻之俗棄漓而歸厚戶知禮義之方人享期頥之夀然後旃裘之長頓顙而讋服祝髮之渠回靣而奔走靡不投利兵而襲冠帶焚僭服而請印綬於是三光澄清萬靈敷佑風雨時若百穀豐茂休氣充塞殊祥輻輳甘露霡霂於林薄醴泉觱沸於嵌竇華英羅植於階戺朱草叢生於庭霤鳯凰長離駢枝而結巢黃龍騶虞群友而為畜由是觀之則彼裔夷之凡禽瘴海之怪獸皮不足以備車甲肉不足以登爼豆夫又何足以耗水衡之芻而汚百里之囿者哉稷下賦齊王樂五帝之遐風嘉三王之茂烈致千里之竒士總百家之偉説於是築巨館臨康衢盛處士之逰壯學者之居美矣哉髙門橫閌夏屋長簷樽罍明潔几杖清巖爾乃雜佩華纓淨冠素履端居危坐規行矩止相與奮髯橫議投袂高談下論孔墨上述羲炎樹同拔異辨是分非榮譽樵株為之蓊蔚訾毀珵美化為瑕疵譬若蘭芷蒿莎布濩於雲夢之洳鴻鵠􅒗鶬鼓舞於渤澥之涯于是齊王沛然來逰欣然自喜謂稷下之富盡海內之美慨乎有自得之志矣祭酒荀卿進而稱曰吾王闢仁義之塗殖詩書之林安人之慮廣致治之意深然而諸侯未服四鄰交侵士有行役之怨民有愁痛之音意者臣等道術之淺薄未足以稱王之用心故也王曰先生之責寡人深矣願卒聞之對曰臣聞之碔砆亂玉魚目間珠泥沙漲者其泉慁莨莠茂者其穀蕪網者棄綱而失敘行者多𡵨而喪塗今是非一概邪正同區異端角進大道羇孤何以齊蹤於夏商繼軫於唐虞誠能撥去浮末敦明本初修先王之典禮踐大聖之規模德被品物威加海隅忠正修列讒邪放疏行其言不必飽其腹用其道不必暖其膚使臣飯粱齧肥而餐驕君之祿不若荷鉏秉耒而為堯舜之徒惜夫美食華衣髙堂間室鳳藻鴟義豹文麋質誦無用之言費難得之日民未治不與其憂國將危不知其失臣竊以大王為徒慕養賢之名而未覩用賢之實也巳靈物賦元豐元年六月二十七日作有物於此制之則留縱之則去卷之則小舒之則巨守之有主用之有度習之有常養之有素譽之不喜毀之不怒誘之不遷脅之不懼吾不知其何物聊志之於兹賦溫國文正公文集卷第一
