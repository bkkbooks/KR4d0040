  text: 温國文正公文集卷第二十九
  hash: sha256:faa87f416546bde9445d9ad094c59b236c8942d690307f1f9630807ed57cd397
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_029-1a}
body:
  text: 章奏十四取索劄子后族乞不推㤙劄子上皇太后䟽兩府遷官劄子又劄子感慈塔劄子上殿劄子二道貢院奏繫官親人許鏁應狀取索劄子臣竊聞兩府議定皇太后於諸處取索物色令本閣使臣以皇太后旨申牒逐處有司再具牓子奏聞候見御寳即便供應臣熟思此一節事理恐未至穏便臣聞自來内中凡有所湏止用御寳合同文字於諸司庫務取索諸司庫務即時供應過後方申三司覆奏及行磨勘今來皇太后有所取索若一一湏待本閤使臣申牒逐處再行覆奏候得御寳方敢供應臣愚竊慮行遣往復太爲迂迴萬一使者懈慢有司泥文皇太后緩急欲得藥餌什噐之類細小之物不能應時而至遷延經日有傷慈母之心則非陛下以四海奉飬之意也事雖至微當此之際小有不足所繫甚大禮王及后丗子之膳不㑹蓋優尊者不可限以多少之數故也臣愚欲望陛下再令兩府大臣啇量此事應皇太后所取物色並令本閤使臣行文字與合同司一如陛下聖旨所取出御寳合同文字下諸司庫務畫時供應仍令合同司每日將本閤使臣文字繳連實封别遣使臣進呈皇太后以防矯僞如此則尊卑之體正孝養之禮盡取進止后族乞不推㤙劄子臣竊聞陛下欲加曹佾使相皇太后再三不許又聞有聖旨令皇后本家分析親的骨肉聞奏亦與推㤙臣愚以爲皇太后旣深執謙遜抑損外親則后族亦恐未冝褒進伏望陛下宣諭兩府應后族㤙澤並未可施行且俟佗時徐議其事一則示人子恭孝之心不敢使后族先於母黨二則示人君即政之𥘉不可以爵禄待賢之具獨私椒房之親其於聖德益有光榮取進止目劄子乞更之降出只作聖意自諭上皇太后䟽月日具位臣光謹昧死再拜上䟽皇太后殿下去歲仁宗皇帝損棄萬方皇帝嗣統之𥘉憂哀成疾殿下念社稷之重同聽庻政以安群情今聖體復𥘉四方無事殿下推而不居自取安逸動靜之節無不合冝率士臣民孰不稱頌臣不自量度欲成殿下之全羙猶以螢燭之㣲明仰禆日月之盛光伏惟殿下稍寛其罪而終聽其辭臣竊以治家之道貴賤雖殊人情一也甞觀天下士民之家其長㓜群居長者或恩意不備衣食不豐㓜者或容貌不恭語言不遜者㓜者孝恭而不怨長者慈惠而不責則上下雍睦家道以興若㓜者以爲怨長者以爲責則上下乖離家道以衰其始相失也甚微而終爲禍也甚大又加以䜛人間之於是乎有父子相疑兄弟相疾亂虐並興無所不至者矣凡閨門之内子婦有以孝恭之心至者則尊親當歡然以慈愛之心接之若其有過則當以忠厚之心教之教之備矣而猶不聽則雖責之可也罪之可也及其旣改則又當復以歡心接之不可以一忤顔色而終身惡之遂不可解謝也故骨肉之間有威怒而無増疾有詰責而無猜忌此自古聖人所以御其親之道也臣竊惟皇帝皇后於殿下兼内外之親㓜蒙保育今日爲萬民父母享天下富貴孰云非殿下之力臣謂殿下固冝撫存愛念情同所生周旋保護以終大惠不可偶以纎芥之失遂蓄乆長之怒棄生成之厚恩取踈絶之深怨愚智所同知也皇帝去歲得疾之時禮貌言辭誠有可疑得罪於殿下者臣固巳甞言於殿下云不可責有疾之人以無疾之禮也凢醉而有過醒猶可赦况有疾之人不自省知本非其意之所欲爲豈可追數以爲罪咎邪皇后自童孺之歲朝暮游戯於殿下之懷分甘哺果拊循喣嫗有㤙無威今旣正位中宮得復奉膳羞盥帨以事殿下其意恃昔日之愛不自踈外猶以童孺之心望於殿下故或有所求湏不時滿意則愠懟怨望不能盡如家人婦姑之禮殿下雖怒之責之固其冝也誰曰不可但事過之後殿下若遂棄之不復収恤憎疾如仇讎則臣以爲過矣臣在闕門之外無由知禁廷之事竊聞道路之言未詳虚實皆言近日皇帝與皇后奉事殿下恭勤之禮甚加於往時而殿下遇之太嚴接之太簡或時進見殿下雖賜之坐如待踈客語言相接不過數句湏臾之間巳復遣去如此母子之恩如何得逹婦姑之禮如何得施所以使之疑惑恐懼不敢自親者蓋以此也臣竊惟殿下母儀天下踰三十年柔明之譽洽于中外皇帝龍潜藩邸進德脩業仁聖之望光于逺邇先帝以至公大義選賢建嗣海内之人皆謂繼統之日慈孝之風必自家刑國誠不意閭巷之民怱有今兹異論推其本原蓋由皇帝遇疾之際宫省之内必有䜛邪之人造飾語言互相間御名一則欲詐效小忠以結殿下之知僥求禄利二則自知過失素多畏嗣君之嚴有所不容三則欲竊弄權柄惡長君聦明使己不得自恣是以日夜闚覘拾掇絲毫之失無不納於殿下之耳殿下雖至聦哲不能無疑雖至仁慈不能無怒皇帝以剛徤之性屈於衆口無以自伸能不憤悒遂使兩宫之間介然相失乆而不懈流聞于外致朝野之士有敢竊議其是非者深可惜也今天誘其衷殿下濬發慈旨卓然逺覽舉天下之政歸之皇帝此乃宗廟之靈生民之福然臣竊料䜛邪之人心如沸湯愈不自安力謀離聞彼皆自營一身之私非爲國家與殿下之計也臣願殿下深察其情勿復聽納斥逺其人勿置左右召諭皇帝以向來紛紛皆此屬所爲自今以後母子之間當坦然無疑皇帝必涕泣拜伏感激摧謝然後兩官之歡一皆如舊兄皇后進見之際殿下冝賜以温顔留之從容來往無時勿加限絶或置酒語笑與之欣欣相待一如家人之禮如此則殿下坐享孝養何樂如之心平氣和眉壽無疆國家乂安内外無患名譽光美垂於無窮與其信任䜛慝猜防百端終日戚戚憂憤生疾國家不寜禍亂横生譏謗之言流於後丗二者得失相去逺矣且殿下旣能以祖宗之業付皇帝又能以大政授之而獨於恩禮之際終不能豁然回心息怒其故何哉方今宫闈之中殿下骨肉至親止於皇帝皇后長公主及皇子公主數人而巳其餘皆行路之人於殿下何有若親者尚不可結以恩信猜而逺之則踈者獨肯受殿下顧遇盡其死力終始無貳乎夫貴莫貴於爲天子之母富莫冨於受四海之養今殿下有此冨貴而不能自樂親其所可踈踈其所可親使受恩之子婦彷徨而不自安踧踖而不敢進雖内懐反哺之心而無以施展臣竊爲殿下惜之臣父子皆蒙先帝大恩擢於常調之中置之侍從之列心非木石豈能暫忘今先帝晏駕之後臣唯不避死亡以進忠直之言庶幾殿下母子和恱國家安寜是臣所以爲報効也不勝區區激切之誠展布以聞惟留神幸察臣光昧死再拜上䟽兩府遷官劄子臣伏覩去歲陛下即位之𥘉兩府臣僚巳各遷官今兹甫及期年一例又加㤙命雖陛下褒優大臣務從豐厚而朝野竊議以爲近來國家官爵易得恩賞太頻柱石之臣當勠力同心共救此弊今若連年之内寵數便蕃恬然有之自以爲冝則何以率正佗人抑塞僥倖因此恐大失天下之望然則陛下愛之適所以傷之也臣竊料大臣亦不敢自安必當辭避願陛下因而聽之以成其美取進止又劄子臣近曽江言兩府臣僚遷官太頻恐失天下之望乞陛下聽其辭避以成其美未蒙采納臣非憎此數人嫉其遷官乃是欲全其令名使之輔佐陛下重惜大柄耳先帝親選聖明傳以天下今陛下乃欲歸功大臣臣固知其人必不敢當也借使當日實曽賛成先帝聖意乃是欲安宗廟社稷若今日受賞則是䂊邀非常之福罪孰大焉然則陛下賞之是掩其盡忠之心使爲徇利之人何榮之有臣所謂欲全其令名者此也夫爵位者人主所以御群臣之大柄也然品秩髙下本皆虚名伹以難得之故爲人所貴若其易得則爲人所賤譬如金玉珠璣苟或道路階庭處處有之則與瓦礫無異矣近歲以來官冗賞濫兩府大臣豈不素知今遇陛下即政之初所冝開導聖聦以懲革斯弊今陛下以纉紹之際及聖體未安之時中外平寧為兩府之功加以厚賞則宿衞將帥宗室外戚四方藩鎮内侍近臣皆有冀望若一一稱滿其意則國家官爵賤於泥土將無以役使群臣若抑而不與則人不自知更生觖望是始於推恩而終於聚怨也且輔佐之臣自於期年之間連併遷官而欲禁止它人之幸進誠亦難矣臣所謂欲使之輔佐陛下重惜大柄者此也或者陛下以爲曹佾無功尚加使相况輔弼大臣當國家艱難之際輸力盡瘁不可不賞臣愚以爲不然陛下所以賞曹佾者非以爲有功也乃以皇太后之徳至深至厚無以爲報故褒崇元舅以慰母心今若縁此推恩次及后族次及兩府次及它人則是曹佾隨衆遷官不爲優異於皇太后之心何所慰焉然則陛下虚捐盛恩而衆人皆以大例遷官何足爲喜也臣豈不知陛下欲褒賞大臣而臣區區不量其力以撗議干之非身之利然爲朝廷忠謀無恤其它惟陛下察之取進止感慈塔劄子臣伏聞感慈塔巳有聖旨坼修五層竊以開封府界京東京西河此河東陜西西川等路自去冬少雪今春少雨麦田巳無所収昨得五月十三日雨方種秋田自後又經一月無雨萌芽始生隨復焦槁農民嗷嗷大率無食棄去郷里流離道路雇妻賣子以接糇糧縣官倉廪素無蓄積贍给軍衆猶恐不足固無贏餘可以賑貸陛下當此之際所冝側身刻意降服損膳以救其患而更脩此佛塔以費國財臣竊以爲失緩急先後之務矣且此塔傾欹爲日巳乆借使更經數年不脩於僧徒有何大害若百姓飢窮朝不及夕而國家不能収恤則老弱轉死溝壑壯者聚爲盗賊當是之時雖有千塔將安用之夫府庫之財皆生民膏血苟非事不得巳安可輕費今有司旣謟䛕苟且曽不爲陛下愛惜陛下又不以介意一皆聽之使四海蒼生將何所依仰臣愚欲望陛下親發德音宣諭有司以今歲旱災且罷脩此塔及其餘不急之費有似此類者皆仰有司條奏以聞一切寢罷候他年豐稔帑藏有餘然後徐議其事於聖政之初亦足以彰愛民之意爲盛羙之一事也取進止上殿劄子二道臣前者兩次上言乞詔侍從臣每日輪一貟直資善堂夜則宿於崇文院以備非時宣召若有事故請假則與以次官互換直宿亦曽靣奉德音云欲自以聖意宣諭政府施行此事自後至今未聞施行臣不避煩瀆天聽再三進言者蓋以爲國之要在於審察人材周知下情而巳審察人材之謂明周知下情之謂聦明則百官稱其職聦則萬機當其理百官稱其職萬穖當其理治之極也賢不肖渾殽之謂昏下情不上通之謂蔽昏則百職隳曠蔽則萬機乖戾百職隳曠萬機乖戾亂之至也極治則安至亂則危故聦明昬蔽者治亂之大本也今陛下即政之𥘉厲精求治而不以此事爲先欲以興隆祖業垂𥙿後昆是猶却行而求及前人也故臣不得不勤勤懇懇爲陛下再三言之書稱尭之德曰稽于衆捨已從人稱舜之德曰賔于四門明四目逹四聦故能咸熈庻績格于上下至今言聖人者無不以二帝爲首何哉聦明故也秦二丗納趙髙之謀恐譴舉不當見短於大臣而深拱禁中漢靈帝惑趙忠之言謂人君登髙則百姓散離而不敢登臺榭北齊後主忠度儒懦不喜見朝士非私昵未甞交語隋煬帝沈湎淫泆常在後宮盗賊滿天下惡人言之是以上下怨叛至於殺身滅國而終不自知後丗言無道者無不以四君爲首何哉昬蔽故也太祖太宗起於側微天下艱難民間情僞無不備知然南靣之日延訪群臣惟恐不及晝日不足継之以夜下至役夫田婦無不詢察以盡其情用能創業垂統力致太平陛下以帝王子孫生長冨貴朝士大夫素未相接耕織勞苦不經耳目當兹親政之始雖孜孜下問朝夕不倦以察人情猶恐不盡况深居九重非視朝之時不見群臣群臣非官位職事有列上殿無由進見顒卭淵黙以嚴重自居將使幽逺之民銜冤失職者何由上聞踈賤之臣懷材藴徳者何由自逹哉國家安危之所分將於此乎在臣是以不勝憤懣區區盡忠重爲陛下陳之伏望陛下察爲國之要觀唐虞之所以興秦漢齊隋之所以亡継祖宗之志以守太平之業檢㑹臣前來所奏兩劄子内事節早賜施行實天下幸甚取進止臣昨者上言近歲官冗賞濫兩府大臣遇陛下即政之𥘉冝開導聖聦以懲革斯弊今陛下以紹纉之際及聖體未安之時中外平寧爲兩府之功加以厚賞則宿衞將帥宗室外戚四方藩鎮内侍近臣皆有䔬望若一一稱滿其意則國家官爵賤如泥土將無以役使群臣且輔佐之臣自於期年之間連併遷官則難以禁止它人之幸進伏蒙陛下靣諭臣以兩府大臣皆有大功所以遷官它人無功何敢輙望臣再三敷奏以陛下若寢兩府㤙命則它人自然不敢僥求若見兩府遷官則誰肯自謂無功不求榮進恐至時陛下亦不能裁抑兩府亦不敢執奏當時陛下聖意確然終不開納今兩府纔受㤙命竊聞入内内侍省都都知任守忠等巳一例遷官臣竊料向去其餘臣僚互相形比継續遷官猝無窮盡蓋官爵者人主之利器所以驅䇿群臣制御四海今陛下曽不愛惜容易與人一至於此臣竊惜之凡政令之行必自貴近爲始前者濫恩巳施之於貴臣不可復収若止之於近臣猶可救其太半所有任守忠等㤙命伏望聖慈特賜追還以塞向去僥倖之路取進止貢院奏繫官親人許鏁應狀先准嘉祐三年八月二日中書劄子供繫官親授班行人云云右具如前當院檢㑹貢舉條制若竒才異行卓然不群者雖工啇雜類亦聽取解又進納人自來皆得鏁應看詳上件繫官親人並是三代食禄之家有人保任方得充選比於工啇雜類納財授官之人流品殊勝其中豈無竒才異行可以進用豈可止以連姻帝族遂同贓私罪犯之人不得鏁㕔應舉求諸義理全無意謂欲乞今後應與宗室女爲親𥙷轉班行者如别無事節違礙科場條貫並許依其它武臣例鏁㕔應奉以廣求賢之路温國文正公文集卷第二十九
