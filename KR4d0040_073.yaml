body:
  text: 史贊評議河間獻王贊范睢評秦坑趙軍項羽誅韓生貫髙戾太子敗立鉤弋子為太子趙廣漢誅魏孝武帝西遷應侯罷武安君兵馮道為四代相漢髙祖斬丁公甘羅張湯有後髙順賈捐之魏孝武𥘉立京房對漢元帝讀張中丞傳烹酈生子噲疑孟伯夷隘柳下惠不恭陳仲子避兄離母孟子將朝王至孟子謂蚳蛙云云沈同問伐燕公孫丑曰君子之不教子何也孟子曰父子之間不責善責善則離離則不祥莫大焉告子曰性猶湍水也云云亦由是也告子曰生之謂性云云猶人之性乎齊宣王問卿孟子曰有貴戚之卿有異姓之卿云云反覆之而不聽則去陳子曰古之君子何如則仕孟子曰所就三所去三孟子曰堯舜性之也桃應問曰舜為天子臯陶為士瞽叟殺人則如之何河間獻王贊周室衰道德壞五帝三王之文飄淪散失弃置不省重以暴秦害聖典疾格言燔詩書屠術士稱禮樂者謂之狂惑術仁義者謂之妖妄必剃滅先聖之道響絶迹盡然後慊其志雖有好古君子心誦腹藏壁扄巖鐍濟秦之險以通於漢者萬無一二漢𥘉挾書之律尚存久雖除之亦未尊録謂之餘事而巳則我先王之道焰焰其不熄者無幾矣河間獻王生為帝子幼為人君是時列國諸侯苟不以宮室相髙狗馬相尚則裒姦聚猾僣逆妄圖唯獻王厲節治身愛古博雅專以聖人法度遺落為憂聚殘𥙷缺校實取正得周官左氏春秋毛氏詩而立之周禮者周公之大典毛氏言詩最密左氏與春秋為表裏三者不出六藝不明噫微獻王則六藝其遂曀乎故其功烈至今賴之且夫觀其人之所好足以知其心王侯貴人不好侈靡而喜書者固鮮矣不喜浮辨之書而樂正道知之明而信之篤守之純而行之勤者百無一二焉武帝雖好儒好其名而不知其實慕其華而廢其質是以好儒愈於文景而德業後之景帝之子十有四人栗太子廢而獻王最長嚮若尊大義屬重器用其德施其志必無神仙祠祀之煩宫室觀遊之費窮兵黷武之勞賦役轉輸之敝冝其仁豐義治風移俗變煥然帝王之治復還其必賢於文景逺矣嗟乎天實不欲禮樂復興邪抑四海自不幸而巳矣達左范睢評穰侯相秦秦益彊宰制諸侯如嚴主之役僕夫左右前後無不如志此穰侯之功也范睢非能為秦忠謀亦非有怨於穰侯也欲行其說而穰侯適妨其路故控其喉拊其背而奪之位秦王視聽之不明遂至於遷母逐弟况穰侯何有哉穰侯雖擅權未至如睢之所言孔子惡夫佞者豈以此夫秦坑趙軍夫兵之設非以害人所以養人也殘暴如此其誰與之秦七世役諸侯卒兼天下然其失䇿之大者有三焉欺楚懷王而虜之不信莫大焉坑趙降卒四十万不仁莫大焉欺興國誅巳降使諸侯疑而百姓怨不智莫大焉秦所以失天下之故多矣在此三者於不信之不信不仁之不仁不智之不智是以始皇墳草未生而四海橫潰宗廟為墟究其禍本兆於此矣項羽誅韓生世皆以項羽不能用韓生之言弃關中之險故失天下竊謂不然夫秦據函谷東嚮以制天下然孝惠昭襄以之興而二丗子嬰以之亡顧所以用之之道如何耳地形不足議也項羽放殺其君不義之名明於日月宰制天下王諸侯廢公義而任私意逐其君以置其臣其受封者爭不服踈斥忠良猜忌有功使臣下皆無親附之意推此道以行之雖重金襲湯不能以一日守也况三秦之險哉貫髙髙祖以驕失臣貫髙以很亡君君臣之際不亦兩傷耶髙不能輔君以義不忍小恥輕慮淺謀以陷殺君之惡卒亡其國禍自髙始雖殺身破家以明張敖而令趙國社稷蕪沒宗廟丘墟所存者小所亡者大所得者少所失者多槩以大義亦烏足言哉戾太子敗鉤弋夫人之子十四月而生孝武以為神靈命其門曰堯母當是時太子猶在東宫則孝武屬意固巳異矣是以姦臣逆窺上意以傾覆家嗣卒成巫蠱之禍天下咸𬒳其殃然則人君用意小違大義禍亂及此可不愼哉立鉤弋子為太子孝武以孝昭之生神異於人而復有早成之資違長幼之次而立之鑒於諸吕先誅其母以絶禍源其於重天下謀子孫深逺矣然而舉襁褓之子置之万民之上非有孝昭之明霍光之忠鮮不危哉趙廣漢誅廣漢之為京兆漢興以來無能及者周禮議賢議能然則雖有罪固當宥之况廣漢之罪不及死邪斯足以為孝宣魏相之纍矣魏孝武帝西遷周書曰天之所壞不可支也元氏失政久矣而孝武欲興之脫於髙歡得宇文黑獺其所以異者無幾耳嗚呼為人君者必制治於未亂保安於未危兢兢業業曰慎一日不然怠惰荒淫使禍流子孫既亂且危然後圖之其可及乎應侯罷武安君兵甚矣邪臣之害國也以得為喪以成為敗保身固寵不顧國謀損公而益私付人而立巳國家喪敗不與其憂丗之患此亦已久矣馮道為四代相忠臣不二君賢女不二夫䇿名委質有死無二天之制也彼馮道者存則何心以臨前代之民死則何面以見前代之君自古人臣不忠未有如此比者然而尊官重祿老以沒齒何哉夫為國家者明禮義奬忠良褒義烈誅姦回以厲群臣群臣猶愛死而忘其君况相印將節以寵叛臣其不能永享天命冝矣然而庸愚之人往往猶稱其智蓋五代披攘人主嵗易群臣失節比踵於朝因而譽之欲以自釋余恐後丗以道所為為合於理君臣之道將大壞矣臣而不臣雖云其智安所用哉漢髙祖斬丁公評漢髙祖可謂能逺謀矣臣無二心古之命也縱君之敵以樹私思姦莫大焉姦而為惠勿報可也若將報之其望必大為臣不忠而享大報雖無背施何以使人天下既定姦不奸止盡節者賞二心者誅君無失刑臣無二心然後人無覬覦上下安矣冝乎子孫相承廟祀四百蓋亦謀之遠矣周書曰遠乃猷此之謂矣甘羅甘羅以稚子名顯於丗非有它竒略正以勢力恐張唐耳雖云慧敏然君子治丗無所取焉張湯有後或稱張湯矯僞刻薄而後嗣顯榮七葉不絶意者積善餘慶積惡餘殃近虛語耶應之曰不然所謂積者繼丗相因之謂也故傳稱八元八凱丗濟其美又稱三族丗濟其凶此非積善積惡之謂耶欒書有惠於晋晋人思之黶雖剛愎猶得保其宗廟至盈無德卿族遂亡然則黶之所以存書之餘慶也盈之所以亡黶之餘殃也祖父有德子孫為不善未免禍敗慶何有焉祖父不善而子孫有德福祿將集殃何有焉祖父為不善而子孫又無德以蓋前人之愆則餘殃𬒳之是以堯舜雖至德朱均不能免其災瞽鯀雖大惡舜禹無所虧其聖若張湯者雖險詖人也有子安丗保輔漢室實有大功子孫嗣之率皆忠恪信厚恭儉周密邦有道不廢邦無道免於刑戮以是光顯於後彌歷永丗固其冝矣又何異焉髙順或問陳登髙順皆有過人之才俱事吕布而登輸心魏祖親為反間順盡力於布與之偕死意者順賢登歟應之曰不然古者列國並立同事王室故先王制禮諸侯有王大夫有君君臣始終有死無二漢氏平一海內萬國一君天下之君惟帝室耳順於吕布雖備將佐無委質之分布者反覆亂人非能輔佐漢室而又強暴無謀敗亡有證登知幾輕舉以存易亡豫徐克清百姓蘇息順託身失所迷逺不復以陷大戮易稱比之匪人豈謂順耶其才雖美未能及登自兹觀智優劣見焉賈捐之君子以正消邪捐之以邪攻邪冝乎其不濟矣魏孝武𥘉立甚矣髙歡之無道其視君不如奕棋廢而置之在造次爾立君大事不詳如此取悔冝哉京房對漢元帝甚矣暗君之不可與言也天實剝喪漢室而昏塞孝元之心使如木石不可得入至於此乎哀哉京房之言如此其深切著明也而曽不能諭何哉詩云匪面命之言提其耳匪手攜之言示之事又云誨爾諄諄聽我藐藐噫後之人可不以孝元為鑒乎讀張中丞傳天授之謂才人從而成之之謂義發而著之事業之謂功精敏辨博拳捷趫勇非才也驅市井數千之衆摧胡虜百萬之師戰則不可勝守則不可拔斯可謂之才矣死黨友存孤兒非義也明君臣之大分識天下之大義守死而不變斯可謂之義矣攻城拔邑之衆斬首捕勇之多非功也控扼天下之咽喉蔽全天下之太半使其國家定於巳傾存於既亡斯可謂之功矣嗚呼以巡之才如是義如是功如是而猶不免於流俗之毀况其曖曖者邪烹酈生班固稱蒯通一說而喪三俊為其亡田橫殺酈生驕韓信也以愚觀之漢王既遣酈生下齊而不止韓信之進兵是則漢王殺之也惜夫一失其信群臣孰敢為之使諸侯孰敢為之與雖得齊而有之所亡豈不多哉子噲堯舜之聖非以其能輕天下也乃以其能重天下也夫唯重天下故必得聖人然後授之禹之傳於子非私之也茍天下無聖人以授之則非子莫之傳矣夫父之傳子非至禹而後有之也蓋自生民以來有國家者無不然矣燕噲徒知慕堯舜之名不知察堯舜之實訹於姧言以陷於死亡為天下笑豈不悲哉孟子曰以天下與人易為天下得人難豈非以燕噲而知之邪疑孟伯夷隘柳下惠不恭疑曰孟子稱所碩學者孔子然則君子之行孰先於孔子孔子歷聘七十餘國皆以道不合而去豈非非其君不事乎孺悲欲見孔子孔子辭以疾豈非非其友不友乎陽虎為政於魯孔子不肯仕豈非不立於惡人之朝乎為定哀之臣豈非不羞汙君乎為委吏為乘田豈非不卑小官乎舉丗莫知之不怨天不尤人豈非遺佚而不怨乎飲水曲肱樂在其中豈非厄窮而不憫乎居鄉黨恂恂似不能言豈非由由與之偕而不自失乎是故君子邦有道則見邦無道則隱事其大夫之賢者友其士之仁者非隘也和而不同遁丗無悶非不恭也苟毋失其中雖孔子由之何得云君子不由乎陳仲子避兄離母疑曰仲子以兄之祿為不義之祿蓋謂不以其道事君而得之也以兄之室為不義之室蓋謂不以其道取於人而成之也仲子蓋嘗諌其兄矣而兄不用也仲子之志以為吾既知其不義矣然且食而居之是口非之而身享之也故避之居於於陵於陵之室與粟身織屨妻辟纑而得之也非不義也豈當更問其築與種之者誰邪以所食之鵝兄所受之饋也故哇之豈以母則不食以妻則食之邪君子之責人當探其情仲子之避兄離母豈所願邪若仲子者誠非中行亦狷者有所不為也孟子過之何其甚與孟子將朝王至孟子謂蚳蛙云云疑曰孔子聖人也定哀庸君也然定哀召孔子孔子不俟駕而行過位色勃如也足躩如也過虛位且不敢不恭况召之有不往而它適乎孟子學孔子者也其道豈異乎夫君臣之義人之大倫也孟子之德孰與周公其齒之長孰與周公之於成王成王幼周公負之以朝諸侯及長而歸政北面稽首畏事之與事文武無異也豈得云彼有爵我有德齒可慢彼哉孟子謂蚳蛙居其位不可以不言言而不用不可以不去已無官守無言責進退可以有餘𥙿孟子居齊齊王師之夫師者導人以善而救其惡者也豈得謂之無官守無言責乎若謂之為貧而仕邪則後車數十乘從者數百人仰食於齊非抱關擊柝之比也詩云彼君子兮不素餐兮夫賢者所為百世之法也余懼後之人挾其有以驕其君無所事而貪祿位者皆援孟子以自况故不得不疑沈同問伐燕疑曰孟子知燕之可伐而必待能仁政者乃可伐之齊無仁政伐燕非其任也使齊之君臣不謀於孟子孟子勿預知可也沈同既以孟子之言勸王伐燕孟子之言尚有懷而未盡者安得不告王而止之乎夫軍旅大事也民之死生國之存亡皆繫焉苟動而不得其冝則民殘而國危仁者何忍坐視其終委乎公孫丑曰君子之不教子何也孟子曰父子之間不責善責善則離離則不祥莫大焉疑曰經云當不義則子不可不爭於父傳云愛子教以義方孟子云父子之間不責善不責善是不諌不教也而可乎告子曰性猶湍水也云云亦由是也疑曰告子云性之無分於善不善猶水之無分於東西此告子之言失也水之無分於東西謂乎地也使其地東髙而西下西髙而東下豈決導所能致乎性之無分於善不善謂中人也瞽叟生舜舜生啇均豈陶染所能變乎孟子云人無有不善此孟子之言失也丹朱啇均自幼及長所日見者堯舜也不能移其惡豈人之性無不善乎告子曰生之謂性云云猶人之性乎疑曰孟子云白羽之白猶白雪之白白雪之白猶白玉之白告子當應之云色則同矣性則殊矣羽性輕雪性弱玉性堅而告子亦皆然之此所以來犬牛人之難也孟子亦可謂以辨勝人矣齊宣王問卿孟子曰有貴戚之卿有異姓之卿云云反覆之而不聽則去疑曰禮君不與同姓同車與異姓同車嫌其逼也為卿者無貴戚異姓皆人臣也人臣之義諌於君而不聽去之可也死之可也若之何以其貴戚之故敢易位而處也孟子之言過矣君有大過無若紂紂之卿士莫若王子比干箕子微子之親且貴也微子去之箕子為之奴比干諌而死孔子曰啇有三仁焉夫以紂之過大而三子之賢猶且不敢易位也况過不及紂而賢不及三子者乎必也使後丗有貴戚之臣諌其君而不聽遂廢而代之曰吾用孟子之言也非篡也義也其可乎或曰孟子之志欲以懼齊王也是又不然齊王若聞孟子之言而懼則將愈忌惡其貴戚聞諌而誅之貴戚聞孟子之言又將起而蹈之則孟子之言不足以格驕君之非而適足以為篡亂之資也其可乎陳子曰古之君子何如則仕孟子曰所就三所去三疑曰君子之仕行其道也非為禮貌與飲食也昔伊尹去湯就桀桀豈能迎之以禮哉孔子栖栖遑遑周遊天下佛肸召欲往公山弗擾召欲往彼豈為禮貌與飲食哉急於行道也今孟子之言曰雖未行其言也迎之有禮則就之禮貌衰則去之是為禮貌而仕也又曰朝不食夕不食君曰吾大者不能行其道又不能從其言也使飢餓於我土地吾恥之周之亦可受也是為飲食而仕也必如是是不免於鬻先王之道以售其身也古之君子之仕也殆不如此孟子曰堯舜性之也疑曰所謂性之者天與之也身之者親行之也假之者外有之而內實亡也堯舜湯武之於仁義也皆性得而身行之也五霸則強焉而巳夫仁所以治國家而服諸侯也皇帝王霸皆用之顧其所以殊者大小髙下逺近多寡之間耳假者文具而實不從之謂也文具而實不從其國家且不可保况能霸乎雖久假而不歸猶非其有也桃應問曰舜為天子皋陶為士瞽叟殺人則如之何疑曰虞書稱舜之德曰父頑母嚚象傲克諧以孝蒸蒸乂不格姦所貴於舜者為其能以孝和諧其親使之進進以善自治而不至於惡也如是則舜為子瞽瞍必不殺人矣若不能止其未然使至於殺人執於有司乃弃天下竊之以逃狂夫且猶不為而謂舜為之乎是特委巷之言也殆非孟子之言也且瞽叟既執於臯陶矣舜惡得而竊之雖負而逃於海濵臯陶猶可執也若曰臯陶外雖執之以正其法而內實縱之以豫舜是君臣相與為僞以欺天下也惡得為舜與皋陶哉又舜既為天子矣天下之民戴之如父母雖欲遵海濵而處民豈聽之哉是臯陶之執瞽叟得法而亡舜也所亡益多矣故曰是特委巷之言殆非孟子之言也溫國文正公文集卷第七十三
