  text: 温國文正公文集卷第十二
  hash: sha256:527a4cd12f3896c88d3a0cd208fdcf744de00d112b6ca6d5b1559dfe422aa87e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0040_SBCK_012-1a}
body:
  text: 律詩七遊瀍上劉氏園題致仕李太傅園亭早行送羅郎中登管句玉局觀酬終南閻諌議詢字議道見寄寄成都呉龍圗同年花庵獨坐秋夜花庵二首和楊卿中秋月樂和邵堯夫秋霽登石閣和河陽王宣徽拱辰字君貺九日平嵩閣宴集和任開叔觀福嚴院舊題名柏梯寺平日遊園常䇿笻杖秋來發篋復出貂褥二物皆景仁所貺賭物思人斐然成詩雲閑來贈邵尭夫花庵多牽牛清晨始開日出巳瘁花雖甚美而不堪留賞送劉仲通赴京師送稻醴與子才重過華下和李君錫惠書及詩勉以早歸和君錫雪後招探春送祖擇之和宋子才致仕後歳旦見贈上元書懷喜才元過洛小詩招飲仲庻同年兄自成都移良安以詩寄賀西臺詩二十四韻和邵尭夫年老逢春和范㬌仁謝寄西遊行記又獨歩至洛濵又送酒與范尭夫再和尭夫年老逢春又和來韻邵尭夫許來石閣乆待不至石閣春望和邵尭夫安樂􅌪中職事吟聞蟬鎮和光宿憇鶴寺鎮和光遊噴玉潭其日大風光鎮和鎮光遊山呈景仁景仁六十三致仕光壽安鎮和光噴玉潭光和鎮疊石溪二首光和鎮疊石溪鎮和光應天院朝拜同呈景仁光明日相陪送客水北始次元韻奉呈君實鎮鎮卜居許下雖未有涯先作五十六言奉寄子華相公持國端明玉汝待制和景仁卜居許下景仁頃見許居洛今而倍之故詩中頗致其怨光喜兩三首呈景仁侍郎兼獻大尹宣徽和鎮亨𣏌下第作詩示之景仁思歸雨未克行以詩留之送景仁至丁正臣園寄主人和君貺老君廟姚黄牡丹又和董氏東園檜屏石牀遊瀍上劉氏園日暖孤臺逈露濃幽徑微茅齋舉白飲沙溆踏青歸照水清滿眼穿林香濕衣莫言春尚淺巳有杏花飛題致仕李太傳園亭漢家飛將種氣槩耿清秋解去金貂貴來從洛社遊清啇擁髙宴華館帶長流可笑班超老﨑嶇萬里侯早行寒犬吠柴門荒雞鳴逺村河聲空自急月影不曽渾木末星猶白榛中露巳繁客心獨惆悵四顧與誰言送羅郎中登管勾玉局觀官名爲玉局巳與俗塵踈鍾岀寒松逈香凝古殿虗郷閭非甚逺俸禄豈無餘誰道神仙樂神仙恐不如酬終南閻諫議詢字議道見寄閑官飬不才弊廬容嘯傲清洛伴歸來故友猶相念寒光生死灰疑闕寄成都吴龍圗同年照席燭花煖隨車劒騎寒江山資秀句風月助清歡政簡坤維靜仁深井絡安行歌與獨酌豈得並閑官花庵獨坐荒園才一畝意足巳爲多雖不居丘壑常如隠薜蘿忘機林鳥下極目塞鴻過爲問市朝客紅塵深幾何秋夜浮雲一消散星斗粲長天浩露灑翠柏清香生白蓮體凉猶衣葛耳靜巳無蟬坐乆群動息秋空唯寂然平日遊園常䇿笻杖秋來發篋復出貂褥二物皆景仁所貺睹物思人斐然成詩笻枝攜巳乆貂褥展猶新漸染岷山雪拂除京國塵危扶醉歸路穩稱病來身頼此齋中物時如見故人雲晴空碧於水那得片雲飛映日成丹凰隨風變白衣去來皆絶迹隠顯兩忘機天理誰能測終然何所歸閑來閑來觀萬物在處可逍遥魚爲貪鈎得蛾因赴火焦碧梧飢鸑鷟白粒飽鷦鷯帶索誰家子行歌復采樵贈邵堯夫家雖在城闕蕭瑟似荒郊遠去名利窟自稱安樂巢雲歸白石洞鶴立碧松梢得喪非吾事何湏更解嘲花庵多牽牛清晨始開日出巳瘁花雖甚羙而不堪留賞望逺雲凝岫粧餘黛散鈿縹囊承曉露翠蓋拂秋煙嚮慕非葵比彫零在槿先才供少頃玩空廢日髙眠送劉仲通赴京師聖朝方考牧畨育寄才能屢別良可嘆閑遊不復曽行塵遵洛汭朝騎對觚稜瀍上秋臺逈歸來正好登送稻醴與子才昔賢尊道誼置醴待嘉賔今我樂閑放提壷餉故人螘浮盃同白味撇甕頭醇何以助髙興籬邊菊蘂新花庵二首誰謂花庵小纔容三兩人君看賔席上經月有凝塵誰謂花庵陋徒爲見者嗤此中勝廣厦人自不能知和楊卿中秋月秋氣平分夜沈隂乍散天窺林𥘉淡薄照席怱孤圎冷入詩毫徤光浮醉弁偏韋賔勿輕去桂影正姢姢樂吾心自有樂丗俗豈能知不及老萊子多於榮啓期緼袍寛稱體脫粟飽隨冝乗興輙獨往携笻任所之和邵尭夫秋霽登石閣飛􅉉危檻出林端王屋嵩丘咫尺間獨愛髙明遊佛閣豈知憂喜滿塵寰目窮莾蒼纎毫盡身得逍遥萬象閑暇日登臨無厭數悲風殘葉巳珊珊先生冬夏俱不出和河陽王宣徽拱辰字君貺九日平嵩閣宴集九日英僚集千秋勝賞同飛橋貫河渚危閣壓霜風金散黄花泛雷驚疊皷通百常髙鳥外萬里寸眸中檻底臨丹葉盃中倒碧嵩來雲仾拂座去鴈逺沈空吹帽陪遊阻揺旌結想叢風流免堙滅鄒湛倚羊公和任開叔觀福嚴院舊題名墨蹤塵淡鬢華新猶喜重來值故人二十二年如轉目洛陽不改舊時春柏梯寺鑿石開蹊峻登崖置閣危笑談空谷應歩武白雲隨衆壑如翻浪鄰州若布棊何當遂棲隠身丗兩相遺重過華下昔辭蓮幕去三十四炎涼舊物三峯雪新悲一鑷霜雲低秦野闊木落渭川長欲問當時事無人獨歎傷和李君錫惠書及詩勉以早歸書意勤渠詩意新清如白雪煖如春西遊不盡谿山樂䇿馬歸來就故人和君錫雪後招探春莫嫌微雪壓梅牙巳有歸鴻泊浦沙天上詔來難乆駐直須早㸔洛陽花繁霙回夜色凌亂落春雲虚幌寒相襲華堂靜不聞玉巵深可敵銀燭近微分誰念牛衣客窮經白髮紛送祖擇之人生榮與辱百變似浮雲自有窮通定徒勞得䘮分銷愁唯有酒娱意莫如文方寸常蕭散其餘何足云和宋子才致仕後歳且見贈閑官逢獻歳拜揖亦紛然須信家居日方爲己有年劬勞中外徧名迹始終全伯玉空搔首蹉跎愧在前上元書懷老去春無味年年覺病添酒因脾積断燈爲目痾嫌勢位非其好紛華乆巳厭唯餘讀書樂暖日坐前簷喜才元過洛小詩招飲素髪各垂領舊交相見稀不唯春物好况是錦衣歸洛社凍醪熟詩傳春酒凍醪也伊魴絲鱠肥唐人諺曰洛鯉伊魴貴於牛羊南軒巳灑掃命駕不須違仲庶同年兄自成都移長安以詩寄賀𧖟叢龜印解鶉野隼旟新借問錦江樂何如興慶春驪歌遮去轍竹馬望行塵惠政如膏雨遥知彼此均西臺詩二十四韻翰苑昔陪侍天光辱顧瞻寵雖承渙汗功不立毫纎山鹿纓頻頓鈆刀礪不銛拭花眸字缺撚雪頷􅧋添跼影慙尸素胡顔處禁嚴辝盈唯免戾取少詎因廉定鼎分都異張官執法兼剡章愚懇盡出綍茂恩霑原憲非無粟胡威尚有縑求田近瀍洛買宅混閭閻地僻冝花卉兒勤付米塩倦逰良足悔居吉不煩占裘葛膚無見囷倉飯屬饜僧居閑可借野歩靜無嫌行樂筇枝瘦延賔稻醴甜麥田泥試屐桑䕃帽低簷愛竹忙猶種貪書老未厭松煙溪石潤檀燼愽山尖牋啓來慵拆衣冠脫怕拈紫毫斜倚架黄卷宻垂籤涸轍猶蒙潤寒灰免附炎所憂資秩滿但願歳時淹自是散無用非爲智養恬聖朝英彦冨幸許一夫潜和邵堯夫年老逢春年老逢春春莫咍朱顔不肯似春回酒因多病無心醉花不解愁隨意開荒徑倦遊從碧草空庭慵掃自蒼苔相逢談笑猶能在坐待牽車陌上來和范景仁謝寄西遊行記洛川秦野鬱相望風物山河舊帝鄉澗底逢人問樵徑松間繫馬宿僧房恨無同好擕三雅共講前聞醉百埸李白詩痛掃鸚鵡洲与君醉百埸歴徧勝遊翻悵望日邊回首逺煙蒼又八水三川路眇茫翠微深處白雲郷目懶拭如松液領髮頻抓似栗房林壑不嫌無用物形骸難入少年埸縁苔躡蔓知多少千里歸來屐齒蒼獨歩至洛濵拜表歸來抵寺居解鞍縱馬罷傳呼紫衣金帶尽脫去便是林間一野夫又草軟波清沙徑微手持笻竹着深衣白鷗不信忘機乆見我猶穿岸柳飛送酒與范堯夫紅櫻零落杏花開春物相催次苐來莫作林間獨醒客任從花笑玉山頽再和堯夫年老逢春年老逢春猶解狂行歌南陌上東岡晴雲髙鳥各自得白日遊絲相與長草色無情尽眼緑花林多思襲人香吾儕幸免簮裾累痛飲閑吟樂末央又和來韻年老逢春無用驚對花弄筆眼猶明不嫌貧舎舊來鷰喚起醉眠何處鶯一僕相隨幅巾出群童聚看小車行人間万事都捐去莫遣匈中氣不平邵堯夫許來石閣乆待不至淡日濃雲合復開碧嵩清洛逺縈回林間髙閣望巳乆花外小車猶未來石閣春望極目千里外川原繡畫新方知平地上見不盡青春和邵堯夫安樂􅌪中職事吟靈臺無事日休休安樂由來不外求細雨寒風冝獨坐暖天佳景即閑遊松篁亦足開青眼桃李何妨挿白頭我以著書爲職業爲君偷暇上髙樓聞蟬鎭山中氣候別二月巳聞蟬乍到清涼景飜疑暑伏天此身多暇日何事更驚年雜溜漴漴響相和勝管絃和光春林滿巖緑誰信巳鳴蟬葉上正多露山中别有天心閑寧感物道合況忘年坐聽生秋思何須膝上絃宿憩鶴寺鎭憩鶴山間憩竹輿宛然身丗住空虚地仙縱與天仙别明月清風也不踈和光回廊複閣勢縈䊸四嶺中涵一氣虚最愛欣欣向榮木每來相見不相踈逰噴玉潭其日大風光驚風動地起逰客望山行若待佳辰去應無好事名萬木吼穹谷駑駘屹不前猶勝望塵客佇立九衢邊鎭和畏風垂首立臨水側身行更拂懸崖壁援毫冩姓名一道來何處千尋正面前時時玉塵下紛泊䰅毛邊鎮大風吹沙髙翳天萬木簸蕩鳴空山夜來奥熱今斗寒下輿亂石﨑嶇間急著冒絮衣純綿兩邊荆棘難躋攀行到君實所詫處却坐拂拭塵土顔千尺瀑布才㳙㳙深潭寂寞神龍跧此來好事愼勿傳乞得性命成生還光昨朝景氣如暑天僮僕流汗衣裘單安知向暁暴風作一變陽春成大寒此時結友㝷名山伶俜徒歩水石間棘刺罥衣行路難枯藤壽栢同攀援驚沙擊眼百箭攅時得閃爍窺林巒景仁年長力更孱牽衣執手幸不顛仍聞旁谷有伏虎頼得與君俱早還遊山呈景仁景仁六十三致仕光我禄多龔舎舎爲吏不過六百石輙自免去君年少孔戣戣七十致仕韓愈留之道心閑始見丗路老方知山水不相厭風光難豫期嬉逰不可緩花卉即離披壽安鎭錦屏山下錦江人西去東來自在身正是春天好時節枉遭風起作埃塵和光冝陽城下作逰人都爲衣冠不繫身衆竅怒號成地籟也勝終日在紅塵噴玉潭光千尺崖頭一派清古今不絶墜崢嶸長風卷起散巖壑此日方知噴玉名和鎭夜月光華照潔清春雲容與覆崢嶸都城咫尺無人到却使廬山浪得名疊石溪二首光道傍行采藥石底卧題名溪邊有石撗出下甚隘景仁卧其下題名而去野老相迎拜谿童乍見驚山鳥勸人飲山多壺鳥提山蟬笑我狂山蝉聲如笑歸時興未盡不得看斜陽和鎮到處窺泉竇逢人問草名簮裳巳無累猿鳥不須驚對景有詩癖酌泉無酒狂山間少塵土雲際足春陽疊石溪鎮昨旦愁風色今朝喜日華從容下官道迤邐見人家盛服縁崖看焚香滿路遮樵抲成市井陶穴乃生涯春石聲相應沉涇處或窪累墻甆隠轔開徑石槎牙柴積髙於阜鈞槃疾甚車自非秦丗避誰道舜風遐拄杖逢山斗廻輿值水斜逺林行翠鳯幽隧轉青蛇泉眼思搴藻雲頭望采花仰身書疊壁平坐挹飛霞有景殊難紀兹遊信可誇君如别業就後㑹固無差和光谿邊有村落未始識紛華去縣只數里居民踰百家山腰荒徑轉谷口翠微遮老木紛無際重巒浩莫涯力窮纔到頂勢盡復成窪不定雲煙色難名草木牙泥鈞羅比屋澗石載連車谷中多甆窰土人自女几澗采石載來賣之為油宛有純風在誰云太古遐梁隨木性曲簷逐地形斜榛路牛呼犢叢祠雀噪虵倚崖松偃蓋落石浪飜花安用逰貟嶠何須躡紫霞好將詩筆冩還入帝城誇巳買漁樵舎母令後約差應天院朝拜回呈景仁光雞鳴上馬過河橋何異東都赴早朝紅日已髙猶熟寢比君殊未得逍遥明日相陪送客水北始次元韻奉呈君實鎭仕宦歸來謝世囂夢䰟非復紫宸朝如何正好睡時節送客相陪十里遥鎭卜居許下雖未有涯先作五十六言奉寄子華相公持國端明玉汝待制四十年來作往還如今那恠鬢毛斑鳬居鴈戸得安處鶴怨猿驚羞故山靜樂顧子難獨享公忙何日見君閑相將嵩少深深處更共服雲紫翠間和景仁卜居許下景仁頃見許居洛今而倍之故詩中頗致其怨光壯齒相知約歲寒索居今日鬢俱斑拂衣巳解虞卿印築室何須謝傅山許下田園雖有素洛中花卉足供閑它年決意歸何處便見交情厚薄間喜雨三首呈景仁侍郎兼獻大尹宣徽累日増煩暑通宵結薄隂蒼茫變風色散漫作春霖野店垂楊重僧房緑篠深踈慵尤得趣閉戸擁重衾漠漠春雲合爞爞旱氣收人心方有望時雨不須求豈獨老農喜仍令惡客留洛城花未謝作意更同逰麥田正塵坌桑徑怱傍沱比屋起相告荷鋤行且歌園林半局鎻車馬絶經過大尹愛民物何妨喜更多和鎮夜中間點滴曉後見沉隂正懼一時旱何妨三日霖着花開稍晚入麥潤還深想象離欄處髙張爛錦衾園館春無頼田家歲有收郍能垤鸛詠還似土龍求木䕃踈成宻雲容去復留巳然爲惡客泥濘亦須遊一春憂旱熯田里欲蹉跎正合爲霖望翻成擊壤歌風縁簾隙至雲壓舎簷過大尹今朝喜應同野老多亨𣏌下第作詩示之清白君家舊文章時態新何妨偶蹉跌未必遂沉淪莫歎科名晚惟憂道誼貧進修專在己得失盡由人孝友亦爲政簞瓢足養親那將少年淚容易輙傷春景仁思歸雨未克行以詩留之嘉客念歸程泥深未可行今朝隂又重春雨亦多情送景仁至丁正臣園寄主人客到暫開扄春蕪生滿庭主人殊不顧脩竹爲誰青和君貺老君廟姚黄牡丹芳菲觸目巳蕭然獨著金衣奉老仙若占上春先秀發千花百卉不成妍又和董氏東園檜屏石牀宻葉蕭森翠幕䊸蹔來猶恨不長居脫冠解帶坐終日花落石牀春自如温國文正公文集卷第十二
