body:
  text: 碑志四皇從兄華隂侯墓志銘皇姪右屯衛大將軍令邦墓志銘皇從姪蓬州刺史夫人仁和縣君潘氏墓志皇從姪右屯衛大將軍士虬墓記右班殿直傅君墓志銘虞部郎中李君墓志銘比部郎中司馬君墓表龍圖閣直學士李公墓志銘户部侍郎周公神道碑皇從兄華隂侯墓志銘華隂侯仲連字齊賢魏恭顯王元佐之曽孫邭國公允成之孫遂昌𥙿公宗顔之長子母曰太原郡君郭氏𥘉除右內率府副率厯率府率右千牛衛將軍右監門衛大將軍英宗即位遷右武衛大將軍撫州刺史今上即位遷右羽林軍大將軍辰州團練使侯幼不好㺯長而樂善學尤精於漢書昭𥙿公素好學喜為詩藏書萬卷侯能嗣承其志目其詩曰貽慶集熙寧二年五月戊子以疾終享年三十有六上為之輟視朝一日追贈華州觀察使封華隂侯夫人長安縣君劉氏男二人長曰士轡蚤卒幼曰士頖右內率府率女六人四蚤卒二未嫁以某年十一月癸酉葬永安縣銘曰昭𥙿愛子以詩書教名而藏之志在則效能守冨貴為諸侯孝皇姪右屯衛大將軍令邦墓志銘右千牛衛大將軍令邦字安國冀康孝王惟吉之曾孫丹陽僖穆王守莭之孫右龍武軍大將軍隴州防禦使世符之子也母曰南陽縣君張氏將軍生五年除太子內率府副率英宗即位遷古監門率府率今上踐祚遷右千牛衛將軍熙寧二年五月甲午遇疾卒年十九贈右屯衛大將軍治平𥘉英宗詔宗子無幼長皆就學差其年為大中小三品各置師以教之將軍時年十二從父南康修孝王愛其才性命為小學録以表率羣兒及年十五以新制試孝經論語於大宗正司二宗正以其誦習最精屢稱嘆之將軍起謝不敏拜於牀下衆益美其警悟而不伐遂升中學授左氏春秋將軍事親至孝有疾至焚香於臂以禱請然親有過未嘗不諌爭其所為得禮義類皆如此不幸蚤世識之者無親疏共惜之二子男未名而卒女尚幼是歲十一月癸酉葬於永安縣銘曰學則敏行則孝志業修冝逺到命不融衆所悼皇從姪蓬州刺史夫人仁和縣君潘氏墓志銘皇從姪右武衛大將軍蓬州刺史令超之夫人日仁和縣君潘氏故鄭王美之曽孫平州刺史惟熙之孫閣門祗候仁矩之子生十六年以選歸於蓬州使君封仁和縣君熙寧二年八月己未疾以卒享年二十有四生五子男子翺右內率府副率次二男未名二女早夭銘曰太勳之門克生令孫歸於帝族稟命天昏款文幽石以識塋園皇從姪右屯衛大將軍士虬墓記右千牛衛將軍士虬右武衛大將軍果州團練使齊安郡公仲郃之子贈安化軍莭度觀察留後髙密郡公宗望之孫贈安逺軍莭度使同中書門下平章事密國公允言之曽孫也母曰安康縣君李氏將軍生五歲以例賜名除右內率府副率眀年遷右監門率府率今上踐阼遷右千牛衛將軍幼而秀慧不嬉戲異於常兒七歲始就學授孝經孜孜不捨晝夜教授劉仲章老儒生嘗於廣坐問之曰將軍誦孝經果有何得對曰事親孝故忠可移于君居家理故治可移于官此其所得也仲章驚嘆曰異日成長必為德器數年愈自修立有成人之風親親尊尊動皆應法問安視膳朝夕無倦不幸遇疾以熙寧二年五月丙戌卒年十二宗室共嗟惜之朝廷贈右屯衛大將軍其年十一月癸酉葬永安縣謹記右班殿直傳君墓志銘熙寧二年春傅欽之遺光書曰昔我王考材氣過人宦不遂以沒堯俞幼鞠于王妣以至成人恩隱殊厚堯俞或以事夜艾未寢王妣常危坐待之及仕而之四方王妣不見再逾月則憂念氣澀而成癰逮王妣之亡竭堯俞之泣不足以償癕之血也今將以某月某日舉吾王考妣之栕葬于濟源吾嘗與子同在諌省子幸而知我必為我銘其墓子茍自謂不能是愛其少頃之勤而使我搶終已之恨非仁人之為也光讀之愧且懼復書曰子以義責光光何敢辭然門內之美光不得聞也子為光敘其事以來光謹條次之則可矣有間欽之以其狀來曰君諱某字寶臣其先大名內黃人世為冨家曽祖考諱思進始讀書為儒祖考諱凝贈虞部貟外郎考諱世隆以春秋三傳登科官至駕部貟外郎知印州事始家於鄆君少通尚書屢舉不中苐用親蔭輔三班借職纍遷至右班殿直𥘉監澶州酒稅厯齊州離濟賽酒稅廬州巡檢以事去官後監趙州倉知㝎州新樂縣復以事去官已而監博州酒稅以疾罷歸眀道元年十月十日終於家夀六十一君為人慷慨方嚴家之子弟雖甚愛之不命坐不敢坐其當官眀敏果斷在新樂有西山采木卒二百人謀劫其縣大呼自南門入君率左右操白挺逆之至則叱使坐卒不意君遽出皆愕不敢動君因罵之曰餓兵欲奚為捽其為魁者數人杖之各數十而縱之皆抑首去不敢出聲然不能與世浮沉平視貴要若無人故所至齟齬且老益窮因發狂疾棄官歸臥一歲所忽起召家人與訣語言如平生人乃疑其非狂也故相國王沂公為諸生家居未與人接君即以公輔器之巳而果然人不知其何用知之也夫人霍氏國子博士致仕若拙之孫篤于孝慈其父亡夫人未之知獨視雲煙草木皆慘悽變色泣下不能自止逾月而訃至後君二十二年年八十一而終男某仕至山南東道莭度推官知磁州昭德縣事贈工部郎中二女其長者蚤世幼適楊氏孫七人長曰堯俞字欽之今為兵部貟外郎次舜俞郊社齋郎次君俞未仕餘皆早世欽之為諌官處大議正直無所顧避朝廷不能用其言除知雜御史欽之固辭不肯拜必求得罪以去知和州聲振天下嗚呼得非承其祖之風烈邪欽之以夫人嘗至濟源愛其土風遂葬焉銘曰氣直志剛難進易傷善抑不揚其後必昌皆理之常虞部郎中李君墓志銘君之族出趙郡後家肥鄉今為開封府人曽祖考諱滔洺州團練判官贈中書令妣魯國夫人苗氏祖考諱炳侍御史贈尚書令妣陳國夫人周氏考諱贄虞部貟外郎贈司封貟外郎妣扶風縣太君宋氏司封之兄沆以清重知治體相真宗弟維以文辭髙仁宗𥘉為翰林學士皆有傳在國史當世士族咸榮慕之君諱某字漢臣早孤始以相國夫人奏試將作監主簿復以翰林君奏為守主簿𥘉監汝州鹽酒稅在京茶庫西京糧料院遭扶風太君喪服除監南京麴院在京豐濟倉會久疾以國子博士分司西京尋又掌中嶽廟慶曆七年七月癸已終于官舍年五十二君喜為詩有前人風挌為人溫良清謹睦于族姻厚于朋友故其生也人無與之為怨沒也久而思之夫人聶氏祕閣校理震之女封河南縣君生六子男攸今為內閣承制女一適古班殿直王矞一適屯田郎中朱處仁餘一男二女早卒君之沒攸與二處妹皆幼家極貧夫人婺矛牙居二十餘年撫育諸孤綱紀家事小大曲盡其冝李氏以復振熙寧二年六月戊午終於京師年七十五先是攸升朝贈君虞部郎中夫人封福昌縣太君攸所居官皆有能名異日必將有成者也光於夫人為姊子攸謂光將以今年某月日葬於洛陽賢相鄉之墓子冝為之銘光不辭銘曰生則人親之沒則人思之誠不盡于中其誰能得之位則不充夀則不融冝其有子以收以祀以終厥祉比部郎中司馬君墓表兄諱某字嘉謨陕州夏縣人其先宗支所自出見于祖墓碣曽祖諱某祖諱某父諱某皆不仕兄為人謹厚孝于親友於兄弟自幼及長無子弟之過不幸生二十八年以天僖四年六月辛卯終於家夫人同縣王氏進士禹之女長男未名而夭次男京生未踰歲而兄沒夫人年尚少自誓不嫁京既長以叔祖天章府君蔭入官為人強直幹敏所至吏民稱之由是纍遷尚書駕部貟外郎通判潞州軍州事贈兄官至比部郎中夫人享榮祿之養幾三十年封福昌縣太君年七十九以熙寧三年七月壬寅終二女長適鄉人曹中立早卒次適進士宋輔始兄之沒光生二年矣故于兄之材行不能詳知然茍非兄力為善于其身而無祿安能有遺福及其後邪兄以天聖六年三月乙已葬于先塋及夫人之沒以其年十月辛酉祔于兄墓京懼嵗時之久不可以莫之識也泣請于光為之表龍圖閣直學士李公墓志銘公諱某字公素其先唐之宗室避亂入蜀家於邛州之依政曽大父諱殼大父諱扆父諱憲皆不仕大父以才行著鄉曲朝廷褒之號靜惠處士公生三嵗而孤性警敏過人兄綯教之書嚴其程課而出公遨戲自如比暮兄歸公徐取書乘月視之一過立誦數千言兄由是竒之稍長善屬文尤工歌詩氣格豪邁景祐五年舉進士為天下苐二除大理評事通判邠州事州人以公少年高科始不以吏事期之公鋭精為冶所處畫皆出人意表吏民大驚會夏虜寇西鄙劉平石元孫戰沒邉人恟懼邠州城惡吏民謀內徙以避之時州無守將公攝州事即發民治州城僚吏固爭以事當言上侍報公日虜將至國外可暇顧文法為身計耶且我實為之有罪不爾纍乃親度材庀恩賦功董役不三旬而畢仁宗聞而嘉之下詔他州守僃當完者視邠為比官滿召試除集賢院厯判登聞鼓院吏部南曹開封府推官修起居注失執政意出為亰西轉運使復還修起居注判三司鹽鐵勾院時杜祁公為宰相多採拔英俊置之臺省不利祁公者指公為其黨左遷知潤州事徙知洪州事久之溪變寇亰湖朝廷議擇有材智者以為轉運使鎮撫之上曰有館職善飲酒者為誰其材可用今安在宰相不能對上復曰是往歲城邠州者宰相即言公姓名乃除荆湖南路轉運使公乘驛至邵陵令諸州皆按兵母得進討遣使􅈬蠻居諭以禍福群蠻感悅皆罷兵受約束又召還修起居注糾察在京刑獄遂知制誥判吏部流內銓知審官院以龍圖直學士權知開封府事京師多老姦宿猾吏不能禽公推迹其物色起居一時録治略盡威令大行坐盜入慈孝寺竊章獻皇后御容大珠徙提舉在京諸司庫務頃之遇疾皇祐四年八月癸未終於家年四十官纍遷至起居舍人公為人踈明樂易倜儻不羈飲酒盡數斗不亂視金帛如糞壤厚於交友與之逰者久而益親之為布衣時周逰四方識其土風人情故平生喜言為治之體及用兵方略數陳便冝書數十上仁宗杳秋䆮髙未有繼嗣公因侍祠髙禖遂奏賦大指言王者修身治國家逺嬖寵近柔良則神降之福子孫蕃衍上深嘉納命內侍石全育宣詔慰撫之公家至貧及病亟自為表言母老不能終養以是纍陛下上哀之􅉠恤甚厚時之士大夫無不惜公之志有餘而夀不給也夫人張氏封南陽郡君子男三人稷太子中舍秬大理寺丞秠太常寺奉禮郎女四人長適皇城使劉永吉次適進士謝少微次早夭次未嫁光與公同年進士也稷狀公之治行命光為之志光不得辭銘曰材氣以為實文學以為華孤舉秀出以大其家千里之足羈紲所不能制百圍之木鉤矩所不能加功可大施而夀祿不遐嗚呼天實使然其又奚嗟戶部侍郎周公神道碑周以國為氏漢魏以來世有顯人公之先家於益都曽祖考諱仁貴不仕祖考諱子元舉三禮登科為深州司法參軍契丹覆深州舉室罹禍朝廷哀之贈大理寺丞祖妣田氏追封仙逰縣太君考諱圭時適在外得免朝廷賜以官終太子中舍纍贈尚書左㒒射妣李氏纍封常山縣太君公諱沆字子真舉進士一上中第除膠水縣主簿初試吏事精敏如素習上下稱其能徙諸城主簿用蔡文忠公薦遷鎮海軍節度推官知勃海縣濱州大吏恃府勢築室鄣氏居害其出入民訴縣以十數前令莫敢直公立表撤室收吏抵罪豪猾惕息歲餘召入改著作佐郎縣民詣轉運使杜祁公請留祁公為奏詔許之會公以母老疾求監青州稅尋以憂去職服除知嘉興縣趙元昊擾西陲詔近臣舉可通判陜西諸州者冨丞相時知制誥以公名聞擢通判鳳翔府以權發遣鹽鐡判官召還改江西轉運判官公固辭願得近鄉里一官以謀葬乃改知沂州過京師入對言事仁宗善之賜服銀緋到官數月召還為開封府推官俄遷判官會湖南蠻唐盤二族殺掠居民官軍討之數不利有詔本路遣人招撫蠻輒殺之乃以公為轉運使委之經畫辭行仍服金紫公至上言蠻驟勝方驕未易懷服宜須秋冬進兵擊之蠻地險氣毒其人驍悍善用鋋盾北軍不能與之確請選雍宜融三州澄海忠敢知其山川習其伎藝者三千人入搗巢穴餘兵絡山足出則獵取之俟其勢窮力屈然後可招撫也朝廷用其策二族皆降湖南遂平是時軍旅暴興運路險澀公隨宜區處資糧豐給而民不疲病召為度支判官行未至復加直史館知潭州兼荆湖南路安撫使先是北軍戌湖南山溪者或期年或再期乃代去再期者多死瘴癘公奏以為不均請皆以期年為斷所生全甚衆歸朝除河東路轉運使自慶曆以來河東行鐡錢民多盜鑄吏以峻法懲之抵罪者日繁終不能禁公乃命高估鐵價盜鑄者無利不禁自息入為度支副使儂智高寇掠廣南既敗走詔以公為西路安撫使天子以嶺南地惡命公非賊所殘州縣不必往公曰天子之命至仁也然遠民新罹荼毒余敢不究宣天子之澤以靣慰之乎遂遍行州縣雖窮僻無不到者民避賊多棄田里逺去吏以常法滿半歲不還者皆聽人占佃公曰是豈與凶年逃租役者同乎奏更延期一年召使復業有巳為人占佃者皆奪還之仍免其一年租三年役貧者縣官貸以種糧由是嶺南民復安集又奉使契丹還加天章閣待制為陜西都轉運使未幾改河北𥘉河自橫隴西徙趨德博後十餘年又自商胡西徙趨恩冀朝廷皆以功大遂不復塞有李仲昌者建議請自啇胡口下鑿六塔渠引河東注橫隴故道用功省而利大詔遣使者與公行視利害公上言國家近議塞啇胡計用薪蘇一千六百四十五萬役工五百八十三萬今仲昌奏塞六塔計用薪蘇三百萬共是一河其塞之工力不容若是之殊蓋仲昌故為小計以求興役殆非事實又即日河水廣二百餘步六塔渠廣四十餘步必不能容且橫隴下流自河徙以東填閼成高陸其西隄粗完東隄或在或亡前日六塔水微通分太河之水曽不及十分之三濵水之民喪業者巳三萬餘戶就使如仲昌言全河東注必橫潰泛濫齊博德棣濱五州之民皆為魚鱉食矣今自六塔距海不啻千餘里若果欲壅河使東冝先治水所過兩隄使皆高厚仍僃置吏兵分守其地多積薪蘇以防衝決乃可為也然其勞費甚大恐未易可辨以臣度之六塔實不可塞朝廷卒用仲昌議塞之既塞不終朝復決齊博等州果大𬒳水害朝廷乃竄仲昌於嶺南諸阿附其議者亦抵罪衆始知公議為是公又上言民罹水災皆結廬隄冡糧乏可哀臣欲輒發近倉賑之顧大恩當自上出臣不敢竊取為名願亟遣使者案視收恤之朝廷從之未幾徙河東都轉運使踰年遷龍圖閣直學士知慶州兼環慶路經略安撫使邉民多闌出塞販青鹽抵重法公請損官鹽之價犯者稍衰入判三班監兵部太常寺通進銀臺司仁宗山陵為鹵簿使又以遺留物奉使契丹公以二使皆有厚賚不欲專之因託以力不能兼辭使契丹不行士大夫美之英宗𥘉即位契丹遣使賀乾元莭公為館伴詔取書入置柩前使者固請見上曰取書非故典也上以方衰絰不許使者執書不肯入閣門公曰昔北朝有喪南使至柳河而還今朝廷重鄰好聽君前至京師逹命於先帝恩禮厚矣奈何更以取書為嫌乎使者立授書是時朝廷未知契丹主之年公從容雜他語以問使者使者出不意遽以實對既而悔之相顧愕眙曰今復應兄事南朝矣頃之遷樞密直學士知成德軍兼真定府路安撫使土俗多棄親事浮屠公案籍閲其不知法者皆斥還其家凡斥數千人在真定數年以疾辭位治平四年以戶部侍郎致仕其年八月丁未朔薨于家年六十九公為人莊重動止皆有法不妄笑語居家孝友甚至而當官謹嚴始終如一鉏姦衛良摧強撫弱去嘉興二十年人有過其縣聞民間猶思咏之以為前後無有罷潭州民遮道不得行公諭解不能却乃旋鞚而南曰當與汝歸耳衆喜奔呼爭先道稍開躍馬北去追至境者尚數百人與僚佐議事其言當者立從之不當不面斥其短徐曰某意欲如此為安衆亦不能易也所部官屬有罪先以好言諭之不變乃誚責之懼而自改者蓋十七八苟尚不變乃案致於法猶為虧除不盡繩也有死於官下其家孤貧不能自歸者必為賻斂衛送或無歸者則為存處立生業嫁其女誨其子弟視如親戚故人始望其貌皆凛然畏之久而求其心乃知實仁厚長者也先娶王氏再娶劉氏封彭城郡君皆先公即世三男莘將作監主簿百藥大理寺丞常大䋥評事二女適太常博士榮安道來安令江懋簡公薨之歲十月已酉葬於先塋百藥暨常欲刻碑臨道俾異日鄉人皆得瞻公之墓不忘公之德請館閣校勘梁君燾狀公之功行以授光命為之銘光昔通判并州事事公於河東雖自知無文不敢終辭銘曰古之君子德盛道尊望之儼然即之也溫公正衣冠嚴不可干施之於政乃仁乃寬吏畏而悛民思不諼𣢾銘垂美以告後昆溫國文正公文集卷第七十八
