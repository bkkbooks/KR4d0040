  - {type: variant, offset: 2295, length: 2, content: 文正, WYG: 家髙逺之意若臣所言非邪當明治其罪以示天下若其是邪亦謂聖心不宜棄忽豈可直以臣之愚賤不察其言若投羽毛於滄海之中杳然莫知其所之豈踈逺所望哉臣不勝憤懣敢復剖析肝膽陳布以聞雖抵罪萬死亦無怨悔臣聞書曰逺乃猷詩云猶之未逺是用大諌凡國家之弊在於樂因循而多忌諱不於治安之時豫為長逺之謀此患難所從而生也竊觀漢室以至有唐簡䇿所載帝王即位則立太子此乃古今不易之道也其或謙譲未暇則有司請之所以尊宗廟重社稷皆國家莫大之慶未聞人主以為諱惡也及唐中葉以來人主始有惡聞立嗣者羣臣莫敢發言言則刑戮隨之是以禍亂相尋不可復振殊不知本强則茂基壯則安此乃國家所當深鍳而不足以為法也今天下之人上自}
  - {type: page-break, offset: 2295, content: '', id: KR4d0040_WYG_019-8a, image: WYG1094/WYG1094-0201c.png}
  - {type: variant, offset: 2298, length: 3, content: 文集卷, WYG: 卿下至庻人苟有知識忠於國家者其心皆知當今之務無此為大無此為急然而各畏忤㫖之誅莫敢進言臣獨不愛犬馬之軀為陛下言之陛下豈可不少留聖思而聽察之邪臣嘗歴觀春秋以來迨至國初積一千六百餘年其間天下混一内外無患兵寢不用者不過四百餘年而巳至如聖朝芟夷僣亂一統四海内平外順上安下和使在朝在野之人自祖及孫耳目相傳不識戰鬬葢自上世以來治平之乆未有若今之盛者也臣竊見國家於州縣倉庫斗糧尺帛未嘗不嚴固扄鐍擇人而守之况如是融明閎茂之業豈可不謹擇親戚可信任者使助陛下守之乎此則賢愚之人所共為陛下重惜者也陛下當此之時頥指如意不早决至䇿以固萬世不㧞之基獨不念太祖太宗跋履山川經營天下真宗宵衣旰食以致太平之艱難乎此臣所以夙夜遑遑起則思之卧則夢之感嘆涕泗不能自已不避煩凟之誅再三進言者也或者謂臣身賤居外而言朝廷之事侵官也臣愚以為治古諫諍無官自公卿大夫士至於庶人百工商旅矇瞍芻蕘無有不得言者所以逹下情而察國政也若置官而守之非其官者皆不得言則下情壅而不通如是則國家雖有迫切之憂行道之人皆知之而在上者莫得聞也此其為害豈不深乎况臣食陛下之禄於今三世矣先臣某以廉直恬退特為陛下所知擢自孤㣲升之侍從此恩之重子子孫孫何時敢忘而又陛下曏以水災親下明詔延訪中外勤求得失臣獨何人身逄盛際捨此大節隠而不言其餘𤨏碎豈足道哉抑又聞之元后作民父母陛下臣父也安有為人之子見危而不告其父乎伏望陛下察臣區區之心不為私其一身不惜少頃之間取臣前後所奏畧賜省覧其中萬一苟有可施行者乞以陛下之意斷而行之宣告中外使逺近渙然無復憂疑則自然神靈悦於上而災異伏衆庻喜於下而姦宄消至於草木昆蟲靡不䝉被其福其為功業豈不盛哉夫時者難得而易失惟陛下早留神詳察乞虢州}
