  - {type: variant, offset: 0, length: 207, content: 論周琰事乞不坐馮浩狀右臣伏奉聖旨以鏁廳舉人周琰重疊用殊字旣條制未明試官不申請定奪臣與馮浩各特罰銅五斤放仰荷含貸喜懼無量然臣昨在武成王廟考試之時其周琰所用殊字浩本疑不係重疊用韻由臣愚懵鑒别不精觀琰程試不見所善又據條制但言重疊用韻不云用佗韻引而恊者非由此堅執輙行黜落鹵莽之罪盡皆在臣今浩與臣一例受罰臣雖無似能不愧心伏望聖慈特賜矜察與免馮浩責罰於臣更加嚴譴各得其分誠不敢辭干冐宸嚴臣無任戰汗激切屏營之至謹具狀奏聞伏候勑旨, WYG: ''}
