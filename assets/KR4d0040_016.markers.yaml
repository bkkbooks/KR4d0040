  - {type: variant, offset: 2293, length: 1, content: 温, WYG: 請建儲副或進用宗室第三狀臣先於六月十九日八月一日兩曽上言乞擇宗室賢者進而用之葢以上則輔衛聖躬下則鎮安百姓迄今未聞聖朝少垂采聴臣誠愚昧不逹}
  - {type: page-break, offset: 2293, content: '', id: KR4d0040_WYG_019-7b, image: WYG1094/WYG1094-0201b.png}
