  - {type: variant, offset: 4417, length: 0, content: '', WYG: 言後宫等級劄子嘉祐八年十二月二日上臣聞王化之興始于閨門故易基乾坤詩首關雎前世皆擇良家子以充後宫位號等級各有員數祖宗之時猶有公卿大夫之女在宫掖者其始入宫皆須年十二三以下醫工診視防禁甚嚴近嵗以來頗隳舊制内中下陳之人競置私身等級寖多無復限極監勒牙人使之僱買前後相繼無時暫絶致有軍營井市下俚婦女雜處其間不可辨識此等置之宫掖豈得為便臣嘗念此不勝憤惋今陛下即位之初百度惟新嬪嬙之官皆闕而未備臣謂宜當此之時定立制度依約古禮使後宫之人共為幾等等有幾人若未足之時且虚其員數既足之後不可更増凡初入宫皆須幼年未適人者若求乳母亦須選擇良家性行和謹者方得入宫傳之子孫為萬世法此誠治亂之本禍福之原不可以為細事而忽之取進止傳家集巻二十九欽定四庫全書傳家集巻三十宋司馬光撰章奏十三}
