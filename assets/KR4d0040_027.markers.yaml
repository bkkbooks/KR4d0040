  - {type: variant, offset: 4760, length: 0, content: '', WYG: 劄子臣先曾上言乞詔侍從近臣每日輪一員直資善堂夜則宿於崇文院以備非時宣召若有事故請假則與以次官互換直宿以開廣聦明禆益大政至今未聞施行葢陛下謙謹以皇太后同聴庶政未奉慈㫖不敢擅召羣臣與之議論今皇太后盡以四海之事歸於陛下出入起居頥指如意臣是敢重申前說乞少加采擇凡人牆之外目不見也里之前耳不聞也而天子奄有四海一日萬幾民之憂樂事之本末雖有聦明叡智之性若不問之於人何從知之是以太祖太宗雖起於側微猶日孜孜訪問羣下至於小臣卒伍亦無所間絶故能紀綱四方創業垂統陛下生為帝王子孫未嘗厯試於外天下之事豈能細知況先朝置直學士待制等職以為侍從之臣若使之不得朝夕在左右備顧問將安用之所有每夜於崇文院輪宿自是舊制近年以來因循隳廢舉而行之有何所難伏望聖慈檢㑹臣前來所奏劄子内事節特賜施行取進止乞延訪羣臣第三劄子臣前者兩次上言乞詔侍從近臣每日輪一員直資善堂夜則宿於崇文院以備非時宣召若有事故請假則與以次官互換直宿亦曾面奉德音云欲自以聖意宣諭政府施行此事自後至今未聞施行臣不避煩瀆天聴再三進言者葢以為國之要在於審察人材周知下情而已審察人材之謂明周知下情之謂聦明則百官稱其職聦則萬幾當其理百官稱其職萬幾當其理治之極也賢不肖混殽之謂昏下情不上通之謂蔽昏則百職隳曠蔽則萬幾乖戾百職隳曠萬幾乖戾亂之至也治極則安亂至則危故聦明昏蔽者治亂之大本也今陛下即政之初厲精求治而不以此事為先欲以興隆祖業垂裕後昆是猶却行而求及前人也故臣不得不勤勤懇懇為陛下再三言之書稱堯之徳曰稽於衆舍已從人稱舜之徳曰賔於四門明四目逹四聦故能咸熈庶績格于上下至今言聖人者無不以二帝為首何哉聦明故也秦二世納趙髙之謀恐譴舉不當見短於大臣而深拱禁中漢靈帝惑趙忠之言謂人君登髙則百姓散離而不敢登臺榭北齊後主志度偷懦不喜見朝士非私昵未嘗交語隋煬帝沈湎淫泆常在後宫盜賊滿天下恐人言之是以上下怨叛至於殺身滅國而終不自知後世言無道者無不以四君為首何哉昏蔽故也太祖太宗起於側微天下艱難民間情偽無不備知然南面之日延訪羣臣惟恐不及晝日不足繼之以夜下至役夫田婦無不詢察以盡其情用能創業垂統力致太平陛下以帝王子孫生長富貴朝士大夫素未相接耕織勞苦不經耳目當兹親政之始雖孜孜下問朝夕不倦以察人情猶恐不盡況深居九重非視朝之時不見羣臣羣臣非官位職事有例上殿無由進見顒卬淵黙以嚴重自居將使幽逺之民衘寃失職者何由上聞疏賤之臣懷材藴徳者何由自逹哉國家安危之所分將於此乎在臣是以不勝憤懣區區盡忠重為陛下陳之伏望陛下察為國之要觀唐虞之所以興秦漢齊隋之所以亡繼祖宗之志以守太平之業檢會臣前來所奏兩劄子内事節早賜施行實天下幸甚取進止乞延訪羣臣第四劄子治平元年八月七日上臣屢曾上言乞詔侍從之臣每日輪一員直資善堂夜則宿於崇文院以備非時宣召亦曾面奉徳音云候秋涼當頻有宣召今已秋涼尚未聞有曾被召之人臣始者上言之時竊見陛下欣然開納將謂即時施行自後遷延日乆聖意漸以為難臣竊意内外之臣必有欺惑天聴沮難此事欲陛下常居禁中不與羣下相接以壅蔽聦眀專固權寵者此豈忠臣之所為而陛下之福邪臣願陛下深察此情斷自聖志使之更直陛下每日聽政餘暇宫中無事之時特賜召對與之從容講論古今治體民間情偽使各竭其胸臆所有而陛下更加采擇是者取之非者捨之忠者進之邪者黜之如此則下情盡逹聖徳日新矣若以資善堂體例稍生則學士待制於崇文院輪宿自有舊條只乞陛下傳宣崇文院今後直宿者並須從早在彼祗候宣召其有事故請假者須與以次官互換直宿此事極不難行而所益甚大惟陛下留意取進止言奉飬上殿劄子嘉祐八年}
