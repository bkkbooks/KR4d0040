  - {type: variant, offset: 3044, length: 899, content: 後宫等級劄子臣聞王化之興始於閨門故易基乾坤詩首關雎前丗皆擇良家子以充後宫位號等級各有貟數祖宗之時猶有公卿大夫之女在宫掖者其始入宫皆湏年十二三以下醫工診視防禁甚嚴近歳以來頗隳舊制内中下陳之人競置私身等級寖多無復限極監勒牙人使之雇買前後相継無時蹔絶致有軍營井市下俚婦人雜處其閒不可辨識此等置之宫掖豈得爲便臣甞念此不勝憤惋今陛下即位之初百度惟新嬪嬙之官皆闕而未備臣謂冝當此之時定立制度依約古禮使後宫之人共爲幾等等有幾人若未足之時且虚其貟數旣足之後不可更増凡初入宫皆湏幼年未適人者若求乳母亦湏選擇良家性行和謹者方得入宫傳之子孫爲萬丗法此誠治亂之夲禍福之原不可以爲細事而忽之取進止配天議右臣等伏准中書劄子翰林學士王珪及知制誥錢公輔等奏季秋大饗明堂以仁宗皇帝配神作主事奉聖旨令臺諌及經筵臣僚與兩制禮院同共再詳定聞奏者朝廷以祖宗事重不敢自專博訪群臣使各陳其意臣等愚懵不逹古今但據所聞正禮以對至於取捨繫自聖明竊以孝子之心誰不欲尊其父者聖人制禮以爲之極不敢踰也故祖己訓髙宗曰祀無豐于昵孔子與孟懿子論孝亦曰祭之以禮然則事親者不以數祭爲孝貴於得禮而已矣祭法有虞氏禘黄帝而郊嚳祖顓頊而宗堯夏后氏禘黄帝而郊鯀祖顓頊而宗禹啇人禘嚳而郊冥祖契而宗湯周人禘嚳而郊稷祖文王而宗武王先儒謂禘郊祖宗皆祭祀以配食也禘謂祭昊天於圎丘也祭上帝於南郊曰郊祭五帝五神於明堂曰祖宗故詩曰思文后稷克配彼天又我將祀文王於明堂此其證也下此皆不見於經矣前漢以髙祖配天後漢以光武配明堂以是觀之古之帝王自非建邦啓土及造有區夏者皆無配天之文故雖周之成康漢之文景明章其德業非不美也然而子孫不敢推以配天者避祖宗也孝經曰嚴父莫大於配天則周公其人也孔子以周公有聖人之徳成太平之業制禮作樂而文王適其父也故引之以證聖人之德莫大於孝荅曽子之問而已非謂凡有天下者皆當尊其父以配天然後爲孝也近世祀明堂者皆以其父配五帝此乃誤識孝經之意而違先王之禮不可以爲法也景祐二年仁宗詔禮官稽案典籍辨崇配之序定二祧之位乃以太祖爲帝者之祖比周之后稷太宗真宗爲帝者之宗比周之文武然則祀真宗於明堂以配五帝亦未識古禮今仁宗雖豐功羙德洽於四海而不在二祧之位議者乃欲捨真宗而以仁宗配食明堂恐於祭法不合又以人情, WYG: ''}
