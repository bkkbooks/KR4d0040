  - {type: variant, offset: 216, length: 2, content: 年正, WYG: ''}
  - {type: variant, offset: 219, length: 460, content: 辛酉終於州𪠘享年六十有九累官至太常少卿兄為人孝友居䘮致哀寛厚容物而内守勁直在鄜州州長皆武人多驕恣不法兄平居與之燕逰笑語若無不可者及臨公事則正色立争必當理然後巳州長雖甚怒無如之何然知其無害已心亦不深怨也在渝州其佐曰趙寅以傲狠刻暴名扵世雖在卑位常行行視天意氣如公相兄始至閱獄囚釋寅所妄繋者近百人寅争之兄一不顧既而詞禮倨慢兄亦不與之校乆之寅寢自媿悔謝服及寅官滿泣涕不忍去兄早孤年過三十乃仕以是周知民間情偽其為政務合民心有悍狡為民害者痛繩以法愚弱不失理者徐為諭觧往往曉悟欣悅輟訟而去故所至民愛慕去之乆猶思詠不已然其奉上官無過分之禮每罷官入京師多閉戸家居未嘗及權貴之門視審官缺貟榜扵壁人乆不取者輟受以去惟掌店宅時留京師凡再朞自餘率不過數月已去矣以是獨所治之民知其才業之美朝廷終無從知之佗人人或仕䆠絶在兄後或才能出兄下逺甚以熟扵時態往往取顯䆠兄䖏之晏然俱若不見聞者常曰吾幸以寒士積官至二千石自足已乆尚何求於人哉司馬氏同居累世宗族甚大兄為之長凡二十餘年能一施以㤙無親踈賢不肖之間故人人無怨善為詩多為人傳誦夫人同郡魏氏封某縣君故䖏士贈著, WYG: ''}
