  - {type: variant, offset: 5467, length: 0, content: '', WYG: 累遷尚書都官郎中歴典數州贈君官至尚書都官郎中夫人封永夀縣太君夫人為人孝慈勤儉中外宗族慕仰其徳一無間言子為二千石極其榮養年八十二以某年月日終於京師某月日祔於君之墓光不及事君而事夫人久敢書聞見之實而繫之以銘銘曰士不得位善無所施勤儉于躬家道以肥宗族是賴郷黨是師夀之少多命不可移有配有子後無棄基淑慝之效昭然不欺蘇騏驥墓碣銘為器之作蘇氏之先出自重黎忿生為周武王司寇封於溫世為卿士或謂之溫子春秋時蘇子為狄所滅子孫以邑為氏歴世久逺散之四方在洛陽者秦厲代以口辨顯戰國世在杜陵者建為漢名将子武使匈奴中十九年不屈節在武功者綽仕宇文周以明法令為某官子威隋文帝佐命功臣至唐瓌父子為賢相此其章章尤著者也周衰溫為晉邑漢屬河内郡隋以河内為懐州維修武之族不棄其故土留懐州不去公其後焉公諱某字某曽大父某大父某皆不仕父某贈左司衛率公㓜慷慨有逺志自力讀書不治家事宗族争笑且怒之曰汝世農家勤治耕桑以豐衣食汝忽棄業為書生窮餒無日矣公曽不顧為學益堅早䘮二親哀毁過禮鄉曲稱之弱冠舉三傳科景徳中契丹南侵河北盗賊蠭起公於是盡散家財糾合郷曲子弟結以信義扞禦群寇修武由是獲全大将軍某北征公踵軍門上謁延入與語兵事大恱即奏偕行至中山㑹契丹圍城甚急用公之䇿卒拒却之於是天子曰契丹犯塞河北士子躬被甲胄扞敵有功今天下貢舉巳畢朕憐夫北方賢士大夫不得以時充貢其皆召試賜第公由是解褐補符離尉縣多寇盗吏卒單弱公奨訓率厲擒馘七十餘人闔境清肅改河清主簿考滿吏民羣詣轉運使所請留詔聴更留成資而去遷遂州録事參軍本道論薦召對擢為大理寺丞知大名縣事尋除通判州事入朝遷太子中舍國家㳂前世故事分文武百官為二塗其遷次任使皆不相參涉有願相移易者聴之以公素善武事加習邊務遂改供備庫副使知威勝軍事繼興嵐莫石鳳蘷五州皆著聲績官歴東染院洛苑二副使其在蘷州兼䕫梓兩路兵馬都監提舉諸州廵檢兵甲賊盗事久之上表乞朝因言邊防民政諸利害稱旨遷右騏驥副使同提㸃湖南兩浙刑獄公事年七十四以慶歴二年十月十三日終於長沙官舍公始雖以學術為文吏而性好勇有智略晚年夏寇苦邊諸将多敗北無功公聞之歎曰吾以布衣起家至方伯承兩朝恩渥不可勝紀家近趙魏粗習兵略今狂虜驕慢侵擾疆場而吾老病不得荷戈前驅以報萬一非命也夫然卒不得盡其志嗚呼哀哉夫人張氏先公即世子四人師古果州團練判官師顔衛州司法參軍夢臣獲嘉縣主簿季子師說及孫孝先曾孫叔元皆三班借職餘孫若干人㓜未官公之在荆湖也夢臣為三班奉職以公高年多疾求告省侍朝廷以武吏求省侍無故事不許乞改文職歸省方許之行及宛葉間聞䘮因號泣晝夜奔赴凡七日行千三百里近世宦逺方而沒者子孫多焚其柩以燼歸𦵏相習為常無譏誚者夢臣獨奮曰為人子孫忍行此豈人心也哉自長沙數千里奉柩以歸嗚呼其信知義而斷不與流俗者夫古人稱善人者其身不耀必在子孫豈信然耶某年月日𦵏於某所先府君之兆夫人張氏祔光郷邑於公近又久承公之知故其於公之始終治行也於佗人為悉其諸子以碣文為請光何敢辭謹銘曰銘闕傳家集巻}
