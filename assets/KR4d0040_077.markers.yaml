  - {type: variant, offset: 5460, length: 0, content: '', WYG: 外何暇顧文法為身計耶且我實為之有罪不爾累乃親度材庀用賦功董役不三旬而畢仁宗聞而嘉之下詔他州守備當完者視邠為比官滿召試除直集賢院歴判登聞皷院吏部南曹開封府推官修起居注失執政意出為京西轉運使復還修起居注判三司鹽鐵勾院時杜祁公為宰相多採㧞英􅖡寘之臺省不利祁公者指公為其黨左遷知潤州事徙知洪州事久之谿蠻寇荆湖朝廷議擇有材智者以為轉運使鎮撫之上曰有館職善飲酒者為誰其材可用今安在宰相不能對上複曰是往嵗城邠州者宰相即言公姓名乃除荆湖南路轉運使公乗驛至邵陵令諸州皆按兵毋得進討遣使就蠻居諭以禍福群蠻感恱皆罷兵受約束又召還修起居注糾察在京刑獄遂知制誥判吏部流内銓知審官院以龍圗閣直學士權知開封府事京師多老奸宿猾吏不能禽公推迹其物色起居一時錄治略盡威令大行坐盗入慈孝寺竊章獻皇后御容大珠徙提舉在京諸司庫務頃之遇疾皇祐四年八月癸未終於家年四十官累遷至起居舍人公為人踈明樂易倜儻不羈飲酒盡數斗不亂視金帛如糞壤厚於交友與之遊者久而益親之為布衣時周遊四方識其土風人情故平生喜言為治之體及用兵方略數陳便宜書數十上仁宗春秋􅎊高未有繼嗣公因侍祠高禖還奏賦大指言王者修身治國家逺嬖寵近柔良則神降之福子孫蕃衍上深嘉納命内侍石全育宣詔慰撫之公家至貧及病亟自為表言母老不終養以是累陛下上哀之賻恤甚厚時之士大夫無不惜公之志有餘而夀不給也夫人張氏封南陽郡君子男三人稷太子中舍秬大理寺丞秠太常寺奉禮郎女四人長適皇城使劉永吉次適進士謝少㣲次早夭次未嫁光與公同年進士也稷状公之治行命光為之誌光不得辭銘曰材氣以為實文學以為華孤舉秀出以大其家千里之足羈紲所不能制百圍之木鉤矩所不能加功可大施而夀祿不遐嗚呼天實使然其又奚嗟虞部郎中李君墓誌銘熙寧二年作君之族出趙郡後家肥郷今為開封府人曽祖考諱滔洺州團練判官贈中書令妣魯國夫人苗氏祖考諱炳侍御史贈尚書令妣陳國夫人周氏考諱贄虞部貟外郎贈司封貟外郎妣扶風縣太君宋氏司封之兄沆以清重知治體相真宗弟維以文辭高仁宗初為翰林學士皆有傳在國史當世士族咸榮慕之君諱某字漢臣早孤始以相國夫人奏試将作監主簿復以翰林君奏為守主簿初監汝州鹽酒稅在京茶庫西京糧料院􅇜扶風太君憂服除監南京麴院在京豐濟倉㑹久疾以國子博士分司西京尋又掌中嶽廟慶歴七年七月癸巳終於官舍年五十二君喜為詩有前人風格為人溫良清謹睦於族姻厚於朋友故其生也人無與之為怨沒也久而思之夫人聶氏祕閣校理震之女封河南縣君生六子男攸今為内閣承制女一適右班殿直王矞一適屯田郎中朱處仁餘一男二女早卒君之沒攸與二處妹皆幼家極貧夫人嫠居二十餘年撫育諸孤綱紀家事小大曲盡其宜李氏以復振熙寧二年六月戊午終於京師年七十五先是攸升朝贈君虞部郎中夫人封福昌縣太君攸所居官皆有能名異日必将有成者也光於夫人為姉子攸謂光将以今年某月日𦵏於洛陽賢相郷之墓子宜為之銘光不辭銘曰生則人親之沒則人思之誠不盡於中其誰能得之位則不充夀則不融宜其有子以收以祀以終厥祉太常少卿司馬府君墓誌銘治平三年作兄諱某字昭逺曽祖考諱某妣某氏祖考諱某妣某氏考諱某追贈光祿卿妣李氏封永夀縣太君兄舉進士及第初命威勝軍判官乂調涇州觀察推官尋監渭州酒稅改大理寺丞知猗氏縣未幾簽書保大軍節度判官事故丞相龐公為鄜延經略使奏兄通判鄜州事徙知渝州厯知慶成軍觧房二州觧房皆未到官徙知商州自商還京師監右廂店宅務丁永夀太君憂服除知乾州以治平三年正月辛酉終於州廨享年六十有九累官至太常少卿兄為人孝友居䘮致哀寛厚容物而内守勁直在鄜州州長皆武人多驕恣不法兄平居與之燕遊笑語若無不可者及臨公事則正色力争必當理然後已州長雖甚怒無如之何然知其無害己心亦不深怨也在渝州其佐曰趙寅以傲狠刻暴名於世雖在卑位常行行視天意氣如公相兄始至閱獄囚釋寅所妄繫者近百人寅争之兄一不顧既而詞禮倨慢兄亦不與之校久之寅寝自愧悔謝服及寅官滿泣涕不忍去兄早孤年過三十乃仕以是周知民間情偽其為政務合民心有悍狡為民害者痛繩以法愚弱不識理者徐為諭解往往曉寤欣恱輟訟而去故所至民愛慕去之久猶思詠不已然其奉上官無過分之禮每罷官入京師多閉户家居未嘗及權貴之門視審官缺貟榜於壁人久不取者輒受以去惟掌店宅時留京師凡再朞自餘率不過數月已去矣以是獨所治之民知其才業之美而朝廷終無從知之佗人或仕宦絶在兄後或才能出兄下逺甚以熟於時態往往取顯官兄處之晏然俱若不見聞者常曰吾幸以寒士積官至二千石自足已久尚何求於人哉司馬氏同居累世宗族甚大兄為之長凡二十餘年能一施以恩無親踈賢不肖之間故人人無怨善為詩多為人傳誦夫人同郡魏氏封某縣君故處士贈著作郎野之女處士名重於真宗朝列傳在國史夫人先兄十八年終於渝州享年若干子男二人雍太廟室長應試将作監主簿女三人長適内殿承制雷周祐次適馮翊縣尉王淳蚤卒次適郊社齋郎崔頴兄終之嵗某月某甲子與夫人合𦵏於先塋光以𦵏日之廹不暇請於佗人故忍泣敘而銘之光後兄二十一嵗而生加之各從宦四方於兄治行不能得其詳姑録其所知者以傳永久不敢以一言私也銘曰夀雖未高不為夭官雖未顯不為卑徳之和為衆所慕政之便為民所知仕不苟進兮於道無虧兄今何恨兮生者同悲嗚呼哀哉殿中丞薛府君墓誌銘熙寕五年作魏晉之間薛氏始自蜀徙河東有部曲數千家永嘉之亂保河汾以自固歴劉石苻氏莫能屈姚秦元魏以來始出仕為公侯卿相者比肩並起入唐尤盛號為甲族然率因遊宦去郷里惟府君之先至今留居河東唐衰薛氏中㣲曽祖考諱昉不仕祖考諱允恭贈諫議大夫考諱田樞宻直學士右諫議大夫贈太尉其行義功烈皆見於宋宣獻公所為太尉公之碑府君諱儀字式之太尉公之第二子始以父䕃為太廟齋郎又除守将作監主簿太尉公知益州奏府君監鳳翔府商稅後徙知河東府君年少河東士民皆郷里長老然素嚴憚府君不敢干以私府君御之亦不失恩義之中以父憂去官服除知鄠縣徙知安邑通判渭州州将武人不能謹廉州大吏郝正者把其隂事招權受賕莫敢詰府君至以正罪惡言於将請治之将内窘私以情告府君曰某止欲去惡吏耳必不使及君将亦知府君不欺即移疾以州事屬府君府君乃發正私出塞市馬收案伏法将不染於辭深徳府君且内慙自是悉委事於府君後将知府君賢亦委以事如前将既而某官張君亢除知渭州或謂府君曰君自到渭名雖州佐其實将也張君有材而尚氣到必不為君下彼不可以文法拘也君宜於事一無所與庶幾自免府君喟然歎曰吾推忠信正直之心以事人豈好犯上而專事邪今張君來吾猶是心也使張君賢必不我怨如其不賢吾獲罪亦命而已矣豈可因人而變其守哉及張君至處事有失府君力争如故必當理而後止僚吏皆為之懼張君初無言久之乃於廣座謂衆曰亢喜忠義與身俱生遇事輒發不能顧慮故數為小人所陷使為亢佐者皆如薛君亢復何患於是聞者皆服張君之賢而重府君之正是時元昊數寇邊覆軍殺将朝廷患之乃命范}
