  - {type: variant, offset: 5458, length: 1, content: 温, WYG: 傳家集巻七十六欽定四庫全書傳家集巻七十七宋司馬光撰誌二龍圖閣直學士李公墓誌銘皇祐四年八月作公諱某字公素其先唐之宗室避亂入蜀家於邛州之依政曽大父諱殻大父諱扆父諱憲皆不仕大父以才行著鄉曲朝廷襃之號静惠處士公生三嵗而孤性警敏過人兄綯敎之書嚴其程課而出公遨戲自如比暮兄歸公徐取書乗月視之一過立誦數千言兄由是竒之稍長善屬文尤工謌詩氣格豪邁景祐五年舉進士為天下第二除大理評事通判邠州事州人以公少年高科始不以吏事期之公銳精為治所處畫皆出人意表吏民大驚㑹夏虜寇西鄙劉平石元孫戰沒邊人恟懼邠州城惡吏民謀内徙以避之時州無守将公攝州事即發民治州城僚吏固争以事當言上待報公曰虜将至}
