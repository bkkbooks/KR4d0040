  - {type: variant, offset: 680, length: 1338, content: 郎野之女䖏士名重扵真宗朝列傳在國史夫人先兄十八年終於渝州享年若干子男二人雍太廟室長應試将作監主簿女三人長適内殿承制雷周祐次適馮翊縣尉王淳蚤卒次適郊社齋郎崔頴兄終之歲某月某甲子與夫人合塟扵先塋光以塟日之迫不暇請扵佗人故忍泣叙而銘之光後兄二十一歲而生加之各從䆠四方於兄治行不能得其詳姑録其所知以傳永乆不敢以一言私也銘曰夀雖未高不為夭官雖未顯不為卑徳之和為衆所慕政之便為民所知仕不茍進兮於道無虧兄今何恨兮生者同悲嗚呼哀哉清逸䖏士魏君墓誌銘君諱閑字雲夫世家于陕之東郊父諱野真宗皇帝時有大名累召終不能起贈著作郎君少喜為詩學鼔琴不樂仕進一遵著作君之志皇祐二年仁宗皇帝祀眀堂詔天下求遺逸草莱年耆徳茂者知府直史舘李公昭遘薦君再世有高莭上嘉之賜號清逸䖏士嘉祐八年八月癸未終于家年八十四君自始生至沒當國家隆盛偃兵無事之時家有舊田廬君謹守而治之朝廷以著作君之賢復其子孫無有所與以故沛然自足無衣食之累性不嗜酒謹㓗守法度然與人和浮沈閭里不自標掲以故其生也人樂與之逰其沒也無謗言府縣之官或時延禮亦與之往来然未嘗有毫髪之私以干之其政事失得未嘗納於耳出於口也以故皆愛重之無厭倦少好養生大要用冲澹自守不以一物累其心以故視聴歩趋能老而不衰嗚呼今之名䖏士者多矣或力為竒譎以盗聲名萬一輩幸欲欺愚俗取美官或交逰有位依其名勢乾没射利以侵漁細民若是者雖不仕又足賢乎然則能保其福樂而免扵過咎有如君者凡幾人邪君三娶曰臧氏曰趙氏曰皇甫氏子男一人曰樵女三人適進士梁軫張震左侍禁張宏孫男二人曰潜曰澤先僕射與著作君相愛如昆弟光拜君於髫齓之年今也其孤将以某年月日塟君於某地来求銘光何敢辭銘曰天長不息兮地大無疆人寓其中兮細於毫茫奪攘紛糾兮非愚則狂惟君之生兮遭世寜昌依承先徳兮曄然有光笥有餘衣兮廪有餘糧養生以理兮行已有方居不煩人兮逰不出郷逍遥自適兮旣夀而康視彼公侯兮金朱煌煌憂勞沒齒兮或罹咎殃為得孰多兮為謀孰長鄆州䖏士王君墓誌銘至和中光從故丞相龐公鎭鄆州公命光典州學學生王大臨通經有行誼光特愛重之後十五年王生来見光於京師曰大臨将以今年某月某日塟其親於湏城縣長山之麓子為我銘其墓光辭以拙於文生曰大臨逺来非有佗故唯銘之求朝士大夫以百數大臨無所謟唯子之歸子何得拒之光媿其言不敢辭因曰然則願聞先子之行生乃出其邑人試祕書省校書郎梁君燾之状以授光曰君諱惟徳字輔之始為童子父行戍於蜀君侍大父母撫諸弟以孝友聞其治家如成人大父母終君親負土成墳終喪不嘗酒肉父自蜀歸家益冨父好散施君竭力以助之有所予必稱父命以致之嘗舉三禮一試於禮部不中格喟然歸不復就舉専以養親治經為事著禮說二十卷性温厚喜導人為善郷里謂之王君子有鬪者君徐以義理辨告皆悅曰君子幸教我我何敢違即觧去不復詣吏年若干病亟歎曰死生有命恨不得終為子之道以天聖五年十一月辛亥終再娶皆楊氏其後夫人贈職方貟外郎旦之女也能成君之志順適舅姑使之終身無憂愠之色及老寢疾每祭祀猶强起執事年若干以嘉祐五年十二月己已終子男五人長曰大順今爲剡縣主簿次未名次大同皆早世次宗道次大臨女二人長適大學舘學究劉應祥次亦早世君既沒家甚貧大臨以善講觧爲諸生師月受俸於州學錢二千積而不用滿三十萬乃舉兩世之柩而塟之光不及見君知其爲人以其子之賢與梁君之言於是乎銘銘曰孝乎親友于其弟家有餘施及郷里人悅其教稱爲君子嗚呼是亦爲政奚必仕禮部尚書張公墓誌銘熈寜, WYG: 熙寧}
