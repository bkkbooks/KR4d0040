  - {type: variant, offset: 5463, length: 0, content: '', WYG: 為鄜延招討使以張君知鄜州為范公之副張公即具奏府君在渭州所以佐已之状乞移通判鄜州朝廷許之而府君母馮翊郡太君党氏春秋高多疾顧戀郷里不肯随諸子之官府君兄弟用太尉公恩得官河中者適皆罷去府君乃固辭鄜州願監河中鹽稅以便親既得請范公遽上奏曰朝廷從薛某之欲於其私固便然甚非張亢求與共事之意乞以薛某還亢仍為徙其兄若弟郷里一官以慰其心朝廷即以府君弟俅知河東縣府君鄜州府君不得已之官張君患州城大而處勢卑難以待敵欲遷就伏龜山計功數十萬時虜乗勝深入而州無役兵欲以戰士築之衆咸以為難府君獨以為可張君喜曰薛君謂之可事無不成矣役始興而張君病失音府君外備寇敵内董役事人不知張君之病也城成民至今賴之嵗餘徙知深州遭母憂服除知商州慶歴八年閏月庚戌終於州廨年五十一先是屬縣宰有建言商山産銅請置監鑄錢朝廷下其議轉運使有是之者府君上言朝廷前置阜民監於州境洪崖冶鑄鐵錢未數年鐵已竭其監當廢况又益置銅錢監銅産尤薄恐徒勞費無益請以所得銅於舊監鑄錢銅竭而止章交上久不决㑹府君沒宰之說遂行縣官之費甚廣而銅尋竭如府君言宰坐抵罪府君居家孝友自幼能屬}
