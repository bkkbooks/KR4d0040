  - {type: variant, offset: 5470, length: 0, content: '', WYG: 欽定四庫全書傳家集巻七十八宋司馬光撰誌三縉雲縣尉張君墓誌銘故翰林侍讀學士張公有子曰某前公若干年卒殯楚州後若干年與公偕𦵏襄城時皇祐五年閏月甲申也其弟大理寺丞光以治行來求銘光獲事侍讀公為日久又與君之兄弟遊今也不敢以愚陋辭而不為姑譔次其所聞納諸壙云君字仲倩其世家郷黨見於侍讀公之碑君性嗜學年十五志節已皦皦出人有從母嫠居将從其女於保徳軍子㓜不能自致君奮曰人母子單弱如此於以涉逺我獨何心坐視之邪即白父母請送父母疑其尚少然聞其言甚恱即遣之君冒盛寒往返數千里曾不為勞人皆歎其仁而有立以䕃補太廟齋郎及長調縉雲尉治有聲迹縣有滛祠曰五通人嚴事之嵗旱君徧禱群祀不及五通吏民以為請君不得已强往禱且卜之巫曰不吉必無雨比歸雨大至君笑曰果然雨不雨非妖鬼事也而敢屢為變怪以驚愚民是不可不除即部吏卒焚滅其祠捽土偶人投江中嵗亦大熟官滿歸道病或請留傳舍俟愈而行君曰吾官逺方不獲侍親之左右四年於此矣今幸歸至舍見吾親而死吾目瞑矣又何可留趣舟而前及楚州卒年二十八娶袁氏故諌議大夫煒之孫生二男絪試将作監主簿繼太常寺太祝二女其㓜者早夭初侍讀公有五子光知其三人焉而不及識君三人者皆甚才然猶自謂不如也侍讀公沒兄弟寓居汝潁間食口衆無田宅以自給咸泣曰縉雲在吾屬豈憂此乎言其知力足賴而不遺其親也嗚呼使顯於朝而老所施設豈若是而已哉銘曰苑彼嘉禾煒煒其華實而未碩孰披之柯人之明果胡夀不遐思而悲者豈伊其家大理寺丞龎之道墓誌銘嘉祐八年作龐之道名元魯故相國頴公之元子妣曰嘉興縣君邊氏其鄉里世系見於頴公之誌天聖中先君與頴公皆為群牧判官居相近光朝夕與之道遊兄事之之道時尚㓜性明頴於文辭不待力學而自能讀書初如不措意已盡得其精要前軰見之皆驚歎光年不相逺自視如土瓦之望珠玉頴公為廣南東路轉運使奏之道試祕書省校書郎及為知雜御史又奏守将作監主簿景祐五年光與之道同登進士第之道簽書懐州判官事未幾徙知河南縣事縣多豪貴家素號難治之道至繩案無所避豪貴為之斂手徙簽書河中府判官事後數年光過河南問於野人曰龐君為治何如曰明而有斷又問今宰曰不及龐君逺矣乃知野人最不可欺而論議甚公也頴公為鄜延經略安撫使奏之道書機宜文字時方用兵文書填委或中宵不得寐頴公入為樞宻副使欲奏其勞為之求升資之道辭曰将吏有功者願大人悉奏之元魯不足言也頴公喜而從之久之以大理寺丞監國子監書庫慶歴七年五月戊寅以疾終年三十二殯於薦嚴佛舍之道事繼母劉夫人撫畜諸弟始終無間言及沒哭之皆哀不自勝終頴公之世親友不敢語及之道語之頴公未嘗不悲慟始光知之道敏於為學及過河南又得其為政焉其沒也益知之道孝友之行深矣先娶孫氏故都官貟外郎道之女又娶張氏今吏部侍郎致仕存之女一女早卒遂無子嘉祐八年六月壬申弟先英遷之道之柩𦵏於雍丘頴公之墓側袝以孫氏光為之銘曰學施於治孝友兼美官不登朝沒纔壮齒如光何人榮祿及此噫才固不足言直命而已矣右班殿直傅君墓誌銘皇祐五年作熙寧二年春傅欽之遺光書曰昔我王考材氣過人宦不遂以沒堯俞幼鞠於王妣以至成人恩隐殊厚堯俞或以事夜艾未寝王妣常危坐待之及仕而之四方王妣不見再逾月則憂念氣濇而成癰逮王妣之亡竭堯俞之泣不足以償癰之血也今将以某月某日舉吾王考妣之柩𦵏於濟源吾嘗與子同在諫省子幸而知我必為我銘其墓子苟自謂不能是愛其少頃之勤而使我抱終已之恨非仁人之為也光讀之愧且懼復書曰子以義責光光何敢辭然門内之美光不得聞也子為光敘其事以來光謹條次之則可矣有間欽之以其状來曰君諱某字寶臣其先大名内黄人世為富家曽祖考諱思進始讀書為儒祖考諱凝贈虞部貟外郎考諱世隆以春秋三傳登科官至駕部貟外郎知卭州事始家於鄆君少通尚書屢舉不中第用親䕃補三班借職累遷至右班殿直初監澶州酒稅歴齊州離濟賽酒稅廬州廵檢以事去官後監趙州倉知定州新樂縣復以事去官已而監博州酒稅以疾罷歸明道元年十月十日終於家夀六十一君為人忼慨方嚴家之子弟雖甚愛之不命坐不敢坐其當官明敏果斷在新樂有西山采木卒二百人謀刼其縣大呼自南門入君率左右操白挺逆之至則叱使坐卒不意君遽出皆愕不敢動君因罵之曰餓兵欲奚為捽其為魁者數人杖之各數十而縱之皆抑首去不敢出聲然不能與世浮沉平視貴要若無人故所至齟齬且老益窮因發狂疾棄官歸卧一嵗所忽起召家人與訣語言如平生人乃疑其非狂也故相國王沂公為諸生家居未與人接君即以公輔器之已而果然人不知其何用知之也夫人霍氏國子博士致仕若拙之孫篤於孝慈其父亡夫人未之知獨視雲烟草木皆慘悽變色泣下不能自止逾月而訃至後君二十二年年八十一而終男某仕至山南東道節度推官知磁州昭徳縣事贈工部郎中二女其長者蚤世㓜適楊氏孫七人長曰堯俞字欽之今為兵部貟外郎次舜俞郊社齋郎次君俞未仕餘皆早世欽之為諌官處大議正直無所顧避朝廷不能用其言除知雜御史欽之固辭不肯拜必求得罪以去知和州聲振天下嗚呼得非承其祖之風烈邪欽之以夫人嘗至濟源愛其土風遂𦵏焉銘曰氣直志剛難進易傷善抑不揚其後必昌皆理之常府州判官杜君墓誌銘嘉祐二年作嘉祐二年秋光在京師進士杜知臣涕泣來言曰大人昔以進士得見於先公又與子遊􅇰久今不幸而沒子為我銘其墓光既吊因辭以不文不敢為知臣固請曰佗人知臣所不敢請也故惟子之歸光廼曰然則願聞子先君世系治行之詳知臣退以其状來曰君諱陟字從聖其先自成都徙長江曽大父禮大父鍔皆不仕父昭文遂州長史君少好古學無所不闚著化坊三十一篇言王者以敎化坊民之道慶歴初天子詔諸州皆立學擇其士之賢有行者為之師州人共推上君君屢舉進士有司失之卒以三禮釋褐選􅈎道尉考滿遷府州軍事判官力於吏治轉運使提㸃刑獄交章薦之㑹屬官有以姦贓敗者怨恨反誣訟君坐罷官去君詣闕欲自理不果遇疾以八月己已終於里舍年五十有七娶譚氏生三子男知臣女長適卞宗建㓜適姚申皆舉進士嗚呼杜君觀其所學與所為書其志豈欲如是而止哉卒無遇以窮斯可哀矣知臣負其䘮歸以其年月日𦵏某地銘曰學之也勤守之也専仕進迍邅又不永年嗚呼孰知其然必歸之天贈太常博士吳君墓誌銘嘉祐五年作君之先世家金鄉曽大父諱賁不仕大父諱豫贈太常丞始𦵏洛陽金谷郷之尹里父諱蒨太平興國中進士高第以公直材敏立名朝廷數忤權貴由是不得居中連典大州官至侍御史亦𦵏尹里君諱元亨字子正用御史遺奏補太廟齋郎遷許州司士參軍選授永康尉歴河中府法曹參軍馮翊令馮翊華隂以漆沮為境中間洲上有美田民相與争之五十餘年吏不能决君檄華隂令㑹境上盡案兩郷之籍徧履其田執度以度之皆得其實自是民不敢復争時人稱之君為人謹㢘専以誠長者處官不能飾智巧以媚上故官久不遂官滿集吏部選除鄰水令還未至家道疾抵知洛陽縣李宋卿延之縣舍以天聖九年八月某日終年四十一宋卿主辦其䘮殯於水安佛室夫人聶氏祕閣校理震之女後君五年長男顥先夫人二年皆不祿獨少男幾復年未冠及幼女一人相與居家無一金之産幾復於孤貧中能自刻意為學取進士第今為太常博士知蓬州事累贈君官至太常博士夫人封仙源縣太君嫁其妹於北陽令李鵬嘉祐五年秋蓬州将之官泣謂光曰幾復奉先君夫人之遺體常恐不克續承祭祀今幸有祿秩室家苟完矣念先君先夫人之久未𦵏痛切不少忘於心况又逺宦於蜀忍置而去乎将以八月某日𦵏於梁縣之新豐鄉西成里子與我皆聶氏之甥也先君治行子皆知之其為我譔銘光曰懼不能堪子之命敢不諾銘曰御史之賢顯大於世及君恂恂清徳不墜迨君之終家旤相繼㣲蓬州之立吳氏幾廢嗚呼以君之慈良而沈抑不遂宜其有嗣進士吳君墓誌銘君諱顥字某其先金鄉人曽祖某贈太常丞祖某侍御史父某鄰水縣令贈太常博士鄰水府君娶於祕閣校理聶君某於某為從母鄰水府君之沒也先妣在鄭君衰絰來入門哭且拜問故又哭先妣命與光處於是時君年尚未冠為人長大有容觀論議慷慨讀書屬文材敏過人為進士業已完美先妣歎曰吾妹不幸早䘮其良人今有是子也吾妹猶有望間二嵗君以疾卒於蒲阪年二十一先妣聞之哭曰吾妹何負于天使至此極也已而弟幾復負其䘮殯於汝州佛舍後二十六年幾復為太常博士乃舉其䘮𦵏于梁縣從鄰水府君之兆時某年月日也銘曰特苖之秀未實而朽繫時之逢無有美醜骨兮有歸祭兮有依下從先人夫又奚悲清逸處士魏君墓誌銘嘉祐八年作君諱閑字雲夫世家於陕之東郊父諱野真宗皇帝時有大名累召終不能起贈著作郎君少喜為詩學鼔琴不樂仕進一遵著作君之志皇祐二年仁宗皇帝祀明堂詔天下求遺逸草萊年耆徳茂者知府直史館李公昭遘薦君再世有高節上嘉之賜號清逸處士嘉祐八年八月癸未終於家年八十四君自始生至沒當國家隆盛偃兵無事之時家有舊田廬君謹守而治之朝廷以著作君之賢復其子孫無有所與以故沛然自足無衣食之累性不嗜酒謹潔守法度然與人和浮沈閭里不自摽揭以故其生也人樂與之遊其沒也無謗言府縣之官或時延禮亦與之往來然未嘗有毫髪之私以干之其政事失得未嘗納于耳出于口也以故皆愛重之無厭倦少好養生大要用沖澹自守不以一物累其心以故視聴步趨能老而不衰嗚呼今之名處士者多矣或力為竒譎以盗聲名萬一輩幸欲欺愚俗取美官或交游有位依其名勢乾沒射利以侵漁細民若是者雖不仕又足賢乎然則能保其福樂而免於過咎有如君者凡幾人耶君三娶曰臧氏曰趙氏曰皇甫氏子男一人曰樵女三人適進士梁軫張震左侍禁張宏孫男二人曰潜曰澤先僕射與著作君相愛如昆弟光拜君於髫齓之年今也其孤将以某年月日𦵏君於某地來求銘光何敢辭銘曰天長不息兮地大無疆人寓其中兮細於毫芒奪攘紛糾兮非愚則狂惟君之生兮遭世寧昌依承先徳兮曄然有光笥有餘衣兮廪有餘糧養生以理兮行已有方居不煩人兮遊不出郷逍遥自適兮既夀而康視彼公侯兮金朱煌煌憂勞沒齒兮或罹咎殃為得孰多兮為謀孰長鄆州處士王君墓誌銘嘉祐六年作至和中光從故丞相龎公鎮鄆州公命光典州學學生王大臨通經有行誼光特愛重之後十五年王生來見光於京師曰大臨将以今年某月某日𦵏其親於須城縣長山之麓子為我銘其墓光辭以拙於文生曰大臨逺來非有佗故唯銘之求朝士大夫以百數大臨無所諂唯子之歸子何得拒之光愧其言不敢辭因曰然則願聞先子之行生乃出其邑人試祕書省校書郎梁君燾之状以授光曰君諱惟徳字輔之始為童子父行戍於蜀君侍大父母撫諸弟以孝友聞其治家如成人大父母終君親負土成墳終䘮不嘗酒肉父自蜀歸家益富父好散施君竭力以助之有所與必稱父命以致之嘗舉三禮一試於禮部不中格喟然歸不復就舉專以養親治經為事著禮說二十巻性溫厚喜𨗳人為善鄉里謂之王君子有闘者君徐以義理辨告皆恱曰君子幸敎我我何敢違即解去不復詣吏年若干病亟歎曰死生有命恨不得終為子之道以天聖五年十一月辛亥終再娶皆楊氏其後夫人贈職方貟外郎旦之女也能成君之志順適舅姑使之終身無憂慍之容及老寝疾每祭祀猶强起執事年若干以嘉祐五年十二月已巳終子男五人長曰大順今為剡縣主簿次未名次大同皆早世次宗道次大臨女二人長適大學館學究劉應祥次亦早世君既沒家甚貧大臨以善講解為諸生師月受俸於州學錢二千積而不用滿三十萬乃舉兩世之柩而𦵏之光不及見君知其為人以其子之賢與梁君之言於是乎銘銘曰孝乎親友于其弟家有餘施及鄉里人恱其敎稱為君子嗚呼是亦為政奚必仕玉城縣君楊氏墓誌銘夫人姓楊氏故尚書工部郎中直史館韓公之配也公之世系事業龍圖閣直學士郭公誌之矣夫人之先在唐為盛族居靖恭坊五代之亂衣冠之緒零落殆盡唯靖恭楊氏徙家于吴世有顯人迄今不絶考諱蛻仕至尚書司封郎中精於吏治所至著聲迹始韓公娶夫人之姊生男鑑鐸及二女不幸早世公曰楊氏名族吾既謀於宗而卜於廟矣不可易也廼復請昏於夫人夫人年若干歸韓氏生男鎮鉞初封真定後更封玉城縣君為人慈和淵静不喜聲味自少及長家人伺其動靜語黙皆有常度未嘗移也其撫視六子衣服飲食無絲毫簿厚六子亦相與親愛如一雖中外族婣莫知其為異母也年三十九而䘮韓公三年不茹葷自是閉閤深居日誦佛書不復有自虞樂之意年五十以至和元年三月乙亥終其五月壬申祔于公之墓時鑑為某官鎮為某官鐸為某官鉞已前卒鐸與光遊素久因状夫人之行命光為之銘光不得辭曰允矣夫人徳則均一而行有常邪承祖之休宜于夫家而夀不将邪福祿當有餘而更不足子孫其昌邪彭城縣君劉氏墓誌銘嘉祐五年作嘉祐五年某月日太常博士知蓬州事吳君幾復祔其祖妣彭城縣君劉氏于祖考御史府君之墓始夫人之沒蓬州生二年矣比冠而父母兄皆即世家至貧漂泊汝洛間嘗記幼時聞其兄言夫人之殯在京師廣濟佛寺已而舉進士及第乃求所以廣濟佛寺者凡有二焉在城之東西往問夫人之殯皆莫能知蓬州刻志求之積年不置一旦至西寺有僧老矣忽來訊曰君非鄰水令吳君之子邪曰然僧曰去三十載之前吳君殯其母夫人于是某為童子手親塗之某亦吳姓也故能識之因指視其處蓬州未之敢信周視其塗圮剝且盡所餘如掌而鄰水府君之題識存焉乃奠而哭之又數年然後得合𦵏於洛陽之金谷鄉自始沒至𦵏四十二年矣噫㣲是孫也則夫人之柩其復得邪露殯積久而題識獨存豈非鄰水府君自悼其不幸未𦵏而天隂相之邪乃知誠孝可以動鬼神信矣御史府君諱某鄰水府君諱某夫人平生行事不可復見其先單父人父為尚書郎云銘曰夫人既終吳氏中㣲四十餘年乃得其歸孝孫有立神實告之程夫人墓誌銘治平三年作治平三年夏蘇府君終於京師光往弔焉二孤軾轍哭且言曰某将奉先君之柩終𦵏於蜀蜀人之祔也同壟而異壙日者吾母夫人之𦵏也未之銘子為我銘其壙光固辭不獲命因曰夫人之徳非異人所能知也願聞其略二孤奉其事状拜以授光光拜受退而次之曰夫人姓程氏眉山人大理寺丞文應之女生十八年歸蘇氏程氏富而蘇氏極貧夫人入門執婦職孝恭勤儉族人環視之無絲毫鞅鞅驕倨可譏訶状由是共賢之或謂夫人曰若父母非乏於財以父母之愛若求之宜無不應者何為甘此􅂼糲獨不可以一發言乎夫人曰然以我求於父母誠無不可萬一使人謂吾夫為求於人以活其妻子者将若之何卒不求時祖姑猶在堂老而性嚴家人過堂下履錯然有聲已畏獲􅓧獨夫人能順適其志祖姑見之必說府君年二十七猶不學一旦慨然謂夫人曰吾自視今猶可學然家待我而生學且廢生奈何夫人曰我欲言之久矣惡使子為因我而學者子苟有志以生累我可也即罄出服玩鬻之以治生不數年遂為富家府君由是得専志於學卒成大儒夫人喜讀書皆識其大義軾轍之幼也夫人親敎之常戒曰汝讀書勿効曹耦止欲以書自名而已每稱引古人名節以勵之曰汝果能死直道吾無戚焉已而二子同年登進士第又同登賢良方正科目宋興以來唯故資政殿大學士吳公育與軾制䇿入三等轍所對語尤切直驚人繇夫人素勗之也若夫人者可謂知愛其子矣始夫人視其家財既有餘廼歎曰是豈所謂福哉不已且愚吾子孫因求族姻之孤貧者悉為嫁娶振業之郷人有急者時亦賙焉比其沒家無一年之儲夫人以嘉祐二年四月癸丑終於鄉里其年十一月庚子𦵏某地年四十八軾登朝追封武陽縣君凡生六子長男景山及三女皆早夭幼女有夫人之風能屬文年十九既嫁而卒嗚呼婦人柔順足以睦其族智能足以齊其家斯已賢矣况如夫人能開發輔𨗳成就其夫子使皆以文學顯重於天下非識慮高絶能如是乎古之人稱有國有家者其興衰無不本於閨門今於夫人益見古人之可信也銘曰貧不以汚其夫之名富不以為其子之累知力學可以顯其門而直道可以榮於世勉夫敎子底於光大夀不充徳福宜施於後嗣敘清河郡君元豐六年作清河郡君張氏冀州信都人禮部尚書致仕存之女端明殿學士司馬光之妻也年十六適司馬氏夫登朝封清河縣君及為學士改郡君年六十元豐五年正月壬子晦終於洛陽三月辛巳晦𦵏涑水先塋君性和柔敦實自始嫁至於瞑目未嘗見其有忿懥之色矯妄之言人雖以非意侵加黙而受之終不與之辨曲直已亦不復貯於懐也上承舅姑旁接娣姒下撫甥姪莫不恱而安之御婢妾寛而知其勞苦無妬忌心嘗夜濯足婢誤以湯沃之爛其一足君批其頰數下而止病足月餘方愈故其沒也自族􅊚至於厮養無親踈大小哭之極哀久而不衰咸出於惻怛非外飾也内外無一人私議其短者兹豈聲音笑貌之所能致邪平居謹於財不妄用自奉甚約及余用之以賙親戚之急亦未嘗吝也始余為學官笥中衣無幾一夕盗入室盡巻以去時天向寒衾無纊絮客至無衫以見之余不能不歎嗟君笑曰但願身安財須復有余賢其言為之釋然近世墓皆有誌刻石摹其文以遺人余以為婦人無外事有善不出閨門故止敘其事存於家庶使後世為婦者有所矜式耳華隂侯仲連墓誌銘熙寧二年作華隂侯仲連字齊賢魏恭憲王元佐之曽孫郇國公允成之孫遂昭裕公宗顔之長子母曰太原郡君郭氏初除右内率府副率歴率府率右千牛衛将軍右監門衛大将軍英宗即位遷右武衛大将軍撫州刺史今上即位遷右羽林軍大将軍辰州團練使侯㓜不好弄長而樂善學尤精於漢書昭裕公素好學喜為詩藏書萬巻侯能嗣承其志目其詩曰貽慶集熙寧二年五月戊子以疾終享年三十有六上為之輟視朝一日追贈華州觀察使封華隂侯夫人長安縣君劉氏男二人長曰士轡蚤卒㓜曰士頖右内率府率女六人四早卒二未嫁以某年十一月癸酉𦵏永安縣銘曰昭裕愛子以詩書敎名而藏之志在則傚能守富貴為諸侯孝右屯衛大将軍令邦墓誌銘熙寧二年作右千牛衛大将軍令邦字安國冀康孝王惟吉之曾孫丹陽僖穆王守節之孫右龍武軍大将軍隴州防禦使世符之子也母曰南陽縣君張氏将軍生五年除太子内率府副率英宗即位遷右監門率府率今上踐阼遷右千牛衛将軍熙寧二年五月甲午遇疾卒年十九贈右屯衛大将軍治平初英宗詔宗子無㓜長皆就學差其年為大中小三品各置師以敎之将軍時年十二從父南康修孝王愛其才性命為小學録以表率群兒及年十五以新制試孝經論語於大宗正司二宗正以其誦習􅇰精屢稱歎之将軍起謝不敏拜於牀下衆益美其警悟而不伐遂升中學授左氏春秋将軍事親至孝有疾至焚香於臂以禱請然親有過未嘗不諌争其所為得禮義類皆如此不幸早世識之者無親疎共惜之二子男未名而卒女尚幼是嵗十一月癸酉𦵏於永安縣銘曰學則敏行則孝志業修宜逺到命不融衆所悼仁和縣君潘氏墓誌銘熙寧二年作皇從姪右武衛大将軍蓬州刺史令超之夫人曰仁和縣君潘氏故鄭王美之曽孫平州刺史惟熙之孫閤門祇候仁矩之子生十六年以選歸於蓬州使君封仁和縣君熙寧二年八月已未疾以卒享年二十有四生五子男子翺右内率府副率次二男未名二女早夭銘曰太勲之門克生令孫歸於帝族禀命天昏款文幽石以識塋園皇從姪右屯衛大将軍士虬墓記熙寧二年作右千牛衛将軍士虬右武衛大将軍果州團練使齊安郡公仲郃之子贈安化軍節度觀察留後高宻郡公宗望之孫贈安逺軍節度使同中書門下平章事宻國公允言之曽孫也母曰安康縣君李氏将軍生五嵗以例賜名除右内率府副率明年遷右監門率府率今上踐阼遷右千牛衛将軍㓜而秀慧不嬉戯異於常兒七嵗始就學授孝經孜孜不捨晝夜敎授劉仲章老儒生嘗於廣坐問之曰将軍誦孝經果有何得對曰事親孝故忠可移於君居家理故治可移於官此其所得也仲章驚歎曰異日成長必為徳器數年愈自修立有成人之風親親尊尊動皆應法問安視膳朝夕無倦不幸遇疾以熙寧二年五月丙戌卒年十二宗室共嗟惜之朝廷贈右屯衛大将軍其年十一月癸酉𦵏永安縣謹記傳家集巻七十八欽定四庫全書傳家集巻七十九宋司馬光撰碑河東節度使守太尉開府儀同三司潞國公文公先廟碑嘉祐二年作先王之制自天子至於官師皆有廟君子将營宫室宗廟為先居室為後及秦非笑聖人蕩滅典禮務尊君卑臣於是天子之外無敢營宗廟者漢世公卿貴人多建祠堂於墓所在都邑則鮮焉魏晉以降漸復廟制其後遂著於令以官品為所祀世數之差唐侍中王珪不立私廟為執法所糾太宗命有司為之營構以恥之是以唐世貴臣皆有廟及五代蕩析士民求生有所未遑禮頽敎侈廟制遂絶宋興夷亂蘇疲久而未講仁宗皇帝閔群臣貴極公相而祖禰食於寝儕於庶人慶歴元年因郊祀赦聴文武官依舊式立家廟令雖下有司莫之舉士大夫亦以耳目久不際往往不知廟之可設於家也皇祐二年天子宗祀禮成平章事宋公奏言有司不能推述先典明諭上仁因循顧望遂踰十載緣偷襲弊殊可嗟憫臣嘗因進對屢聞聖言謂諸臣専殖第産不立私廟睿心至意形於歎息盖由古今異宜封爵殊制因疑成憚遂格詔書請下禮官儒臣議定制度於是翰林承㫖而下共奏請自平章事以上立四廟東宫少保以上二廟其餘器服儀範俟更參酌以聞是歳十二月詔如其請既而在職者違慢相仗迄今廟制卒不立公卿亦安故習常得諉以為辭無肯唱衆為之者獨平章事文公首奏乞立廟河南明年七月有詔可之然尚未知築搆之式靡所循依至和初西鎮長安訪唐廟之存者得杜岐公舊迹止餘一堂四室及旁兩翼嘉祐元年始倣而營之三年增置前兩廡及門東廡以藏祭器西廡以藏家譜齋枋在中門之右省牲展饌視滌濯在中門之左庖厨在其東南其外門再重西折而南出四年秋廟成公以入輔出藩未嘗踰時安處於洛元豐三年秋留守西都始釁廟而祀焉一旦授光以家譜曰予欲志族世之所從來及廟之所由立垂示後昆而為我敘其事欵於石光竊惟公追逺復古率禮興化之盛徳不可以無傳雖自知不文不敢辭謹敘而銘之按譜云文氏之先出陳公子完以諡為氏與翼祖諱同至秦有丕丕生河東太守敎始家平陽其後有韶漢末為揚州刺史自韶以來世乃可譜韶之六世孫頻為後魏北絳太守頻曽孫顯儁以别駕從北齊高祖起晉州就霸業戰功居多終兖州刺史頻之六世孫曰肅曰君洪肅仕隋為潁川郡丞名列循吏以公直抗宇文述老卑秩君洪從高祖起晉陽為右衛将軍太子建成餘黨攻宫門君洪首奮挺出戰沒頻之八世孫曰暉曰播暉相中宗誅張易之奪武后天下歸之唐用仇人讒謫死嶠南播有史學官至給事中君洪之曾孫羽為御史中丞肅之四世孫括為御史大夫括孫晦為太子賔客晦兄昕為義成節度使皡為散騎常侍榮冠當時自顯儁至晦皆有傳見於史其家自平陽或遷太平或遷蒲阪或遷實鼎晦之從父昆弟晤為北都留守判官始居介休晤生汾州參軍檖檖生館館生澤州錄事參軍即公之高祖考也諱沼曽祖考諱某仕後唐歴晉城天池平城三主簿避晉高祖諱更其氏曰文歴崞太谷二令漢高祖即位復舊氏更名某漢失天下其支别者自帝於晉陽復事之終嵐州錄事參軍祖考諱某辟石州幕府弃官歸鄉里太宗皇帝平晉陽召之不起以廟諱故復為文氏考諱某以儒學進歴十三官所至以彊直勤敏振利攘害名聞達不可揜判三司開拆磨勘司終主客郎中河東轉運使其治行之詳見於故平章事晏公參知政事王公沂譔墓誌及碑公貴朝廷褒榮三代贈官皆至太師中書令兼尚書令爵燕周魏三國公廟成澤州府君為第一室夫人某氏配燕公為第二室燕國太夫人宋氏配周公為第三室周國太夫人王氏越國太夫人申氏配魏公居東室魏國太夫人耿氏魯國太夫人申氏配公以廟制未備不敢作主用晉荀安昌公祠制作神板采唐周元陽議祠以元日寒食秋分冬夏至致齋一日又以或受詔之四方不常其居乃酌古諸侯載遷主之義作車奉神板以行此皆禮之從宜者也其銘曰鬱彼喬木茂於苞根浩彼長川發於浚源矧人之先云誰敢諼天佑有宋誕生哲臣乃斡樞軸乃秉鎔鈞克釐克諧允武允文甘陵有妖悖暴紛囂公往逍遥不日而消仁祖搆疾群心震栗公入宻勿四海清謐出殿方維為諸侯師以恵以綏不廢其威至也民恱去也民思其思如何式謠且歌歌政之和在洛為多謀居之安疇如得民公自汾渚遷於洛滸允樂兹土永燕私處伊水洋洋山木蒼蒼是掄是剫是斷是斵達於有洛是相是虞是卜是諏是築是捄是植是扶是茨是塗作廟渠渠新廟既成室家是營公曰予居風雨是撫勿侈勿崇予躬是容人庳公堂公曰予康人隘公庭公曰予寧人勿予隘維子孫是賴人勿予庳維子孫是利克恭克儉予履予視俾躬之為美匪目之為麗廟堂既闢四室有侐豢牲孔碩𨗳黍及稷豆籩既滌汛掃既備㫖酒既泲刲牲為饎乃薦乃陳苾苾芬芬祖考欣欣百嘏來臻天錫公祉彊明夀愷帝錫公祿崇榮豐泰天匪公私公徳是宜帝匪公優公勲是醻公拜稽首揚天子之休思純終始式貽孫子子子孫孫勿替勿忘時奉烝嘗保公之烈光户}
