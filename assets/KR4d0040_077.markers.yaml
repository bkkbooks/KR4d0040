  - {type: variant, offset: 5464, length: 0, content: '', WYG: 始習律賦語意即高竒驚人然不肯從進士舉嘗著蓼蟲賦以刺世之嗜外物而忘其苦者又以為事之當慎者莫若言動交進名乃著五慎文以自儆觀是二文足以知其志趣矣初娶唐氏天章閣待制肅之女生一女適殿中丞趙士寧又娶劉氏左諌議大夫綜之孫又娶李氏直}
  - {type: page-break, offset: 5464, content: '', id: KR4d0040_WYG_077-11b, image: WYG1094/WYG1094-0705b.png}
  - {type: variant, offset: 5465, length: 1, content: 卷, WYG: 賢院建中之孫又娶陳氏司農卿宗元之女生二男長曰昌朝繇太子中允監察御史裏行坐正論不阿黜為大理寺丞次曰昌期早卒二女長適祕書省校書郎張煦次早卒昌期将以熙寧五年正月某甲子𦵏府君於本縣趙行村請直龍圗閣趙君卨状其治行以授光使為之誌昔者先子嘗獲知於太尉公從兄里佐府君於鄜州幕光亦嘗拜府君於兄舍以是頗知府君之為人府君容貌溫恭而内守堅正不可奪移語言無機巧蔽匿而明察物情其志常在利民而深疾姦惡故所至上官信之僚友親之下民愛之今也幸使光誌其墓光既取趙君之状詮次之又敢私附其所知云銘曰迕意宜踈而或以之親阿意宜合而或以之離盖至誠可以待無窮而辭色不過欺一時嗚呼允如薛君以忠信正直為心夫又何施而不宜駕部貟外郎司馬府君墓誌銘熙寧九年作兄諱某字周卿曽大父諱某大父諱某皆不仕父諱某以通毛詩屢應州舉名升禮部及兄登朝累贈衛尉卿母某氏封某縣太君司馬氏累世聚居食口常不減數十衛尉府君為之長兄年十六衛尉即以家事委之衣食均贍宗族無間言衛尉得以優游自適十餘年而終兄用從父太尉府君䕃補郊社齋郎太尉以家事非兄不能辦未聴從宦後數年乃調逹州通川尉州有宣漢鹽井距州千餘里唯一谿僅通小舟可以往來守井吏恃其險逺大為姦利州遣兄往按之因為之區處利害凡再往返遂革其弊考滿除華州司理參軍州将驕貴數用私欲橈公法兄執不聴有幕僚性剛戾自将以下皆惡之共文致其罪俾兄鞫之幕僚復上書訟州官皆獲罪唯兄不染於辭人以是益知其公平有驍騎十餘卒犯罪謀亡去監押捕獲之誣云共圗不軌欲殺之以求功賞州官信之謂兄必考掠取服兄不從據實鞫之皆止杖罪餘囚負寃得直者甚衆既而􅇜繼母郭氏憂去官直寃者或炷香於頂臂以送之服除授解州聞喜尉用薦者遷大理寺丞知河中府猗氏縣徙閬州新井縣通判鄧均二州先是房州竹山有金谿出金甚多山谷窮僻人跡罕至豪族專其利監司欲命官置場市之皆憚其險辭不行時兄年已踰六十奮曰利其禄而避其勞可乎遂往躋攀崖巘為之經畫條目使公私俱利仍每月一按行凡嵗餘乃還均州秩滿徙知梁山軍累官至駕部貟外郎年甫七十體力尚壮即求致仕詔補子廣郊社齋郎廣為虢州盧氏主簿迎兄之官以熙寧八年十二月戊子朔暴得疾已丑終於官舍年七十有三兄為人沈厚寛裕喜慍不形於外少時家貧有衣一笥夜遺火比家人覺狼狽救之笥衣已盡兄獨卧不起家人尤之曰燒衣蕩盡何心尚安卧耶兄曰衣已燒矣起視何益轉枕復寝人皆服其度量子孫僕役有過徐訓諭之不輕罵辱然當官公直能知小民情偽吏不敢以絲毫欺也雖練習律令而不為峭刻斷獄必求厭人心摧抑彊猾扶衛愚弱所治職事皆有方略或素號繁劇者兄處之嘗有餘暇氣色不動而衆務修舉廷中永晝寂無人聲其下皆畏而愛之久猶見思從仕三十餘年未嘗有過然性恬静不自矜譽故人知之者亦鮮無所超越循常調終身兄亦不憾也其奉養儉素自為布衣至二千石飲啜服用未嘗少異與郷人居和易簡静故沒之日聞者無不歎惜先娶紐氏早終再娶張氏解州助敎震之女柔静慈良宜於族姻封清河縣君治平四年終於鄧州年五十八子男四人曰齊曰庭曰廣曰房庭虢州虢略尉女四人長適解人樊景讓次適陕人張安仁次二人未嫁皆早夭齊等以熙寧九年二月壬寅奉兄及嫂之喪𦵏於夏川郷先茔之西南光以期日之廹不暇請於時之賢士大夫自為之銘曰廓然有容頽然無争所蒞之政不煩而成去久而人益思無求而人莫知年至歸休始終無虧贈都官郎中司馬君墓誌銘嘉祐六年作君諱某其先出自晉安平獻王自周隋之前家涑水之上至唐仕宦陵夷降在畎畆曽祖諱林祖諱政父諱炳累世同㸑食口甚衆父兄以君孝謹自㓜以家事委之君晝夜服勤不遺餘力專以稼穡畜牧致饒給不事竒衺末業所獲悉以奉六親有餘則及鄉人身無私焉年三十二以某年月日終某年月日𦵏於涑水南原先待制府君常歎曰自吾兄之亡而家始貧使天下之民皆若吾兄之為雖古至治之世何以尚諸惜其無位而才不大施也夫人李氏同里人年二十八而寡父母欲奪其志夫家尊章亦遣焉夫人自誓不許惡衣蔬食躬執勤苦敎畜二子詠里詠不幸早世里登進士}
