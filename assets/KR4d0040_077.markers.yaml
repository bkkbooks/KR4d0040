  - {type: variant, offset: 41, length: 174, content: 右諌議大夫吕府君墓誌銘太常少卿司馬府君墓誌銘兄諱某字昭逺曽祖考諱某妣某氏祖考諱某妣某氏考諱某追贈光禄卿妣李氏封永夀縣太君兄舉進士及苐𥘉命威勝軍判官又調涇州觀察推官尋監渭州酒稅改大理寺丞知猗氏縣未幾簽書保大軍莭度判官事故丞相龐公為鄜延經略使奏兄通判鄜州事徙知渝州厯知慶成軍觧房二州觧房皆未到官徙知啇州自啇還京師監右廂店宅務丁永夀太君憂服除知乾州以治平, WYG: 熙寧四年}
