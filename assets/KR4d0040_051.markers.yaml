  - {type: variant, offset: 1950, length: 299, content: 隨求退表第一劄子臣以羸病拜起及上下馬不得請朝假將治巳及月餘旬日以來疾大勢雖退飲食亦稍進然氣體疲乏足腫生瘡歩履甚難策杖而行不出室堂况於拜起固所未易臣自料度筋力完復可以朝趨近亦數月逺則半年或過此期未可前定豈有執政之臣身據髙位受厚俸旣不趨朝又不供職宴安偃仰飬病於家何待人言獨不内愧臣是用夙宵惶愧無地自處今不免有表上瀆聖聦乞除宫觀差遣一任以養衰殘竊慮陛下怪其忽有此奏故别具劄子披瀝肝膽伏望聖慈早賜開允取進止三月二十八日内降臣伏見御批指揮以臣近建明差役法大意巳善縁關渉事衆尚慮其間未得盡備継有執政論奏臣僚上言役法利害若不精加考究何以成萬丗良法冝差韓維吕大防孫永范純仁四人專切詳定聞奏者仍將逐項文字抄録付韓維等, WYG: ''}
