  - {type: variant, offset: 78, length: 2, content: 正公, WYG: 日月有期輤輿當發川塗寝邈丘壟長歸伉儷之心曷勝悲惋}
  - {type: page-break, offset: 80, content: '', id: KR4d0040_WYG_080-15b, image: WYG1094/WYG1094-0738b.png}
  - {type: variant, offset: 83, length: 198, content: 已與此不合而序文節去首尾并誤劉嶠為劉隨不知其何本也至于年號官銜㮣從闕畧俾考古者茫無依據是可慨已是刻序文一一完善次列進司馬温公文集表一篇分卷序次離合先後多有不同偶取校勘雖文義未甚齟齬而一字一句摠覺舊刻之妙愛不忍釋矣問其直索白金一百六十兩余以價昂一時又無其資還之既而思此書為明初人收藏本卷首表文弟一葉末餘𥿄有硃書一行云洪武丁巳秋八月收八字有小方印一其文云徐逹左印有大方印一其文云松雲道人徐良夫臧書卷第, WYG: 巻}
