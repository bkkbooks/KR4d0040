  - {type: variant, offset: 0, length: 0, content: '', WYG: 晉祠祈雨文盖聞誠通無逺神鑒無幽始謂不然廼今知信屬者時雨稍乏宿麥未滋躬謁嚴祠黙伸心禱囘輈再宿}
  - {type: variant, offset: 1, length: 2, content: 慶己, WYG: 澍響臻豈懇欵之㣲克留神聴寔元元之幸宜蒙神福然原陸久燥根荄}
  - {type: page-break, offset: 1, content: '', id: KR4d0040_WYG_080-6a, image: WYG1094/WYG1094-0733c.png}
  - {type: variant, offset: 4, length: 0, content: '', WYG: 浹畎畆喁喁猶有待望謹以清酤嘉薦答揚神恵神當茂布優渥以終大施尚饗祭晉祠文維年月日具官某謹遣某官某謹以醪果殽羞恭薦于某神惟神宅晉之原食晉之土凡在晉境皆為神宇今嘉澤雖豐霑潤未溥神心無私民靡不撫逺邇之間奚有捨取惟神申大前徳均錫靈雨實我來麰秀我稌黍穂棲于田粒益于庾為酒為醴永承神祜尚饗晉祠謝晴文久雨不止涉于積旬汙邪既瀦平原将溢田恐蕪穢民憂墊隘有司恐懼謀請于神聰明感通遽已晴霽水返其壑雲歸於山蔬榖無虧嵗則大熟蒙神之休敢愛牲酒尚饗祭雷道矩文維年月日陜郡司馬光謹致祭于士友雷君道矩之靈嗚呼道矩氣厚以和行直且方謹畏禮律如循鋒鋩臨義敢决若揮干将無位於朝憂國遑遑發憤抗言忠鯁激昻逺慮萬世引之深長家聲不隕􅂱然有光西戎驕貪蠺食我疆筞馬徑前挺身戰塲敷陳直辭逆折豺狼虜氣方沮斂蹤退藏如何不淑罹此疾殃㣲息垂盡遺音琅琅上嗟王事未畢而亡下痛老母皤然在堂言終而絶云誰不傷嗚呼道矩短長有時不可推移善惡得失繫人施為顯晦窮通云胡可期立身如此可以無悲獨我友生煩寃涕洟恨此膏澤不霑蒸黎奠以薦誠魂乎有知嗚呼哀哉尚饗祭江隣幾文嗚呼佗人之生憎愛糾紛獨君不然見之者親佗人之死議論交集獨君不然聞之者泣問君何修乃能致此率其誠心無有表裡是宜胡耉光大顯融如何不淑星未五終平日之遊晨往夕來宛其在目誰能不哀念君素懐於物何有叙兹永違無若巵酒尚饗三司祭張元常文惟君寛裕敦篤外和内直秀眉廣顙盛氣揚休吉徳之報宜蒙遐福骨相之符必享永年如何一朝兩違所望凡在僚友孰不惋傷奠以薦誠庶幾來饗初除待制祭先公文光聞禄不及親古人所歎重茵列鼎適足增悲光弱冠之初幸塵仕籍罪多福鮮繼招凶釁顧復之恩闕焉靡報痛毒愁辛無忘夙夜誠不自意蒙荷餘休名參侍從身踐世職不肖之質何以似續慙怍戰兢不遑啟處甘旨之養已無所展忠直之風庶幾不墜力自黽勉無忝所生備位諌臣不敢自逺瞻望邱壟涕泗交横尚饗祭龐頴公文嘉祐八年五月作維嘉祐八年五月丁巳具官司馬光謹以清酌庶羞之奠躬薦於故相國贈司空侍中頴公之靈公茂徳豐功布於四海事存石刻不敢重陳念昔先人久同僚宷越自童齔得侍坐隅撫首提携愛均子姓甫勝冠弁遽䘮所天孤苦惷愚不能自立長號四望誰復顧哀惟公眷憐過於平日既釋縗服還齒簪裾舉首朝端繄公是賴爰加振㧞俾出泥塗讎校祕文討論前載逮公出牧兩託後車推心不疑言皆見納立效甚寡為負實多過若邱山咸加掩覆善如絲粟必見褒揚屢薦其名徹聞天聴遂塵清貫獲備邇臣今日所䝉莫非公力言念恩紀終身敢忘承乏諫垣造請有禁不親杖屦殆将再期豈意一朝忽為永訣儀刑在目訓誨如聞奄去華堂長歸幽壤心焉隕絶言不成章英靈有知臨此薄酹嗚呼哀哉尚饗告題祭版文治平四年}
