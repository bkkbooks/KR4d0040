  - {type: variant, offset: 49, length: 9, content: 城學餘堂書肆示余余, WYG: 夫人焚黄祭文夫人胄自徳門無祿蚤世久同困約不與顯榮朝推恩渥追錫嘉命魚軒翟茀燭耀重泉靈而有知歆戴天寵尚饗啟殯祭文旅官飄颻家無常所槥櫝未瘞久寓西郊逢時之良遷就窀穸撤攅云始}
