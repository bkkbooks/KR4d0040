  - {type: variant, offset: 22, length: 0, content: '', WYG: 月已未陜郡司馬光謹致祭於君倚舍人之靈嗚呼君倚好賢如親就義若渇非聖不學唯善是為納忠於君恥後堯舜竭力於友志追陳雷推誠而行不疑不畏屢蹈顛沛終殄悔心甲科榮名西掖清貫君倚之美兹不足言始謂吉人必膺遐福如何彫謝曽未二毛我與君倚南北殊鄉哲愚異品中年相值情厚故交飾貌無華發言必盡風迹猶在精爽何之江山阻長醪羞㣲薄惟期惋怛可以潜通嗚呼哀哉尚饗祭董少卿文維年月日具位司馬光謹致祭於鄰幾少卿董兄之靈兄昔為夏宰西鄙用師賦調雖煩民不告病生齒雖衆訟庭常虚光實夏民目所親睹自兄之去繼者為誰三}
  - {type: page-break, offset: 22, content: '', id: KR4d0040_WYG_080-11b, image: WYG1094/WYG1094-0736b.png}
  - {type: variant, offset: 23, length: 10, content: 有二嘉慶丁巳夏有杭州, WYG: 年餘屈指無幾兄入佐㑹計出奉簡}
