  - {type: line-break, offset: 25, content: '', id: KR4d0040_SBCK_081-1b01}
  - {type: variant, offset: 34, length: 0, content: '', WYG: 厯守别藩所至稱治民懐其惠吏畏其明為時材臣屢當劇任指顧立辧不廢笑談與人遊居雍容愷悌引年據禮納祿辭榮志力精强謂宜遐夀如何不淑奄忽長歸光既舊且親荷知為厚聞訃哀惋始不自勝薄致醪羞維誠是薦尚饗祭張宻學文惟公幼而孝長而謹以文學從仕以勤力當官入侍禁嚴譽處臺省出敷恵化周流藩宣将漕則蓄積豐衍監邊則民夷懐服慮無㣲而不臻職無煩而不舉朝倚器幹時推精力夀考而終福祿流厚今兹自宋遷周捨卑就燥卜宅得吉祖載及期光等早厠賔客之末晚陪嗣子之遊式陳醪羞用薦衷素尚饗祭陳彦升文年月日涑水司馬光謹以香酒膳羞致祭于彦升之靈嗚呼光平生取}
  - {type: page-break, offset: 34, content: '', id: KR4d0040_WYG_080-12a, image: WYG1094/WYG1094-0736c.png}
  - {type: page-break, offset: 34, content: '', id: KR4d0040_WYG_080-12b, image: WYG1094/WYG1094-0736d.png}
  - {type: variant, offset: 36, length: 4, content: 宋刻温國, WYG: 道相親如彦升之質直光所心服忽焉棄我惋痛誠深尚饗奠李夫人}
  - {type: variant, offset: 41, length: 1, content: 正, WYG: 元豐七年十月乙酉具官}
  - {type: page-break, offset: 41, content: '', id: KR4d0040_WYG_080-13a, image: WYG1094/WYG1094-0737a.png}
  - {type: variant, offset: 44, length: 0, content: '', WYG: 光謹遣男某官某致祭奠於故李尚書夫人之靈夫人明智而溫柔順而正知古不泥從俗不流禮刑閨門名播鄉曲神明保祐夀考令終光忝預族姻素服懿徳敢陳薄酹式薦㣲誠尚饗改𦵏先令}
  - {type: variant, offset: 45, length: 0, content: '', WYG: 啟殯祭}
  - {type: variant, offset: 46, length: 2, content: 集介, WYG: 以下為丞相作某舋惡不天福祐單薄旨甘甫備風樹永違日月貿遷松檟未植夙興夜處心不遑寧是用物土之良諏時之吉改卜宅兆恭啟攅塗屬以備位宰司任隆責大懇祈退避恩指莫從不得臨穴盡哀憑棺取訣永言罪負隕絶復蘇叩心長號五内糜沸令公祖奠文日月有期靈輀将進逺違故壤遷就佳城惟靈澹泊安閒以時就道山川無壅徒御不驚瞻慕攀號心摧氣結令公到墓祭文闕塞之陽伊川之涘地形爽塏水脉厚深惟靈去故就新永寧兹宅不騫不圮保固億年涕慕之心昊天罔極令公掩壙祭文嗚呼祿不逮親古人所歎重茵列鼎誰適為榮掩坎聚墳身不親在羡門既鍵長夜無晨瞻望題和於兹永絶興言念此心爽飛颺觸地號天肝腸寸絶貟外啟殯祭文惟靈居家孝慈蒞官肅給如何茂徳不享遐年爰擇令辰肇開旅肂遷就祖域永有依歸沃酹不親倍増悲涕尚饗貟外掩壙祭文日吉時良已就安宅祖禰咸在如從逺歸英靈有知足慰𡨕漠終古永訣臨風涕洟尚饗潁川}
  - {type: page-break, offset: 46, content: '', id: KR4d0040_WYG_080-13b, image: WYG1094/WYG1094-0737b.png}
