  - {type: variant, offset: 6, length: 1, content: 五, WYG: 作治平四年十月辛酉曽孫具官光敢昭告於曽祖考處士府君曽祖妣夫人伏以春秋祭祀思慕無窮宜有屏攝以伸曕奉謹以良月吉}
  - {type: variant, offset: 8, length: 6, content: 庚寅竹汀居士, WYG: 恭題祭版伏惟尊靈降監昭格是憑是依尚饗祭張尚書文熙寧四年作維熙寧四年月日女壻具官司馬光謹以清酌庶羞祭於故禮部尚書張公之靈公之徳業衆所尊仰始終詳實已載銘文在昔先公與公同省間來問訊延就中堂光時弁髦立侍左右蒙公一見許以成人不卜不謀遂妻以子自惟童騃齒位殊絶未嘗交語從何辱知知已之恩重於姻戚沒身銜戢不敢弭㤀聞訃之初涕零如雨綴於官守走哭無從逺薦醪羞用辭為侑尚饗祭吕獻可文熙寧四年八月作嗚呼獻可之亡海内歎惜况於親友惋傷可知忠直敢言人人自許誰如獻可始末無虧道不愧心名高於世夀夭不校餘復何言知我之深見於臨沒今兹永訣文不逮情嗚呼哀哉尚饗張尚書𦵏祭文維熙寧四年八月日女壻具官司馬光謹以清酌庶羞祭於禮部尚書致仕清河恭安公之靈日月徂遷𦵏期已及承乏西臺不敢離局行不執紼奠不操巵引領松楸悲何有極尚饗祭}
