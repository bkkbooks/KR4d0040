  - {type: variant, offset: 0, length: 567, content: 温國文正公文集卷第七律詩二興宗許菊乆之未得得菊并詩送史館唐祠部詢字彦猷江南西路轉運使送張寺丞覲知冨順監寄題李舎人偉蒲中新齋贈太子太傅康靖李公挽歌詞二首送二同年北使右吕濟叔右李公素昌言有詠石髮許三章模冩精措殆難復加僕雖未覩兹物而巳若識之乆者輙復強爲三詩以継其後非敢庶幾差肩適足爲前詩之輿臺耳校理楊休石送沈寺丞紳知南昌縣字公儀酬不疑雪中書懷見寄校理邵必荅師道對雪見寄直講陳沬送王校理懌字公和守琅瑘沂公兄子爲公後哭尚頴字公楚故侍讀學士張公哀辤二首錢子髙挽歌二首題楊中正供奉洗心堂崇勲之孫送龔章判官之衛州新及策送王瓘同年河南府司録字文玉先君甞爲此官送王彦臣同年通判毫州字伯逢正月二十四日夜雪和道粹檢討王纯臣雪夜直宿和次道大慶殿上元迎駕送茹屯田孝標知無爲軍田橫墓偃師西登平陸北山回瞰陜城奉寄李八丈學士使君二十二韻貟村坂其東八政水即古之傅巖有傅說廟又東北虞城古虞公之囯也太行石昌言學士宰中牟日爲詩見寄乆未之荅今冬罷武城慕來京師此詩謝之楊休昌言元督詩債戲呈絶句靜夜春送導江李主簿君俞送峽州陳㢘祕丞三首武成致齋奉酬吴冲卿寺丞太學宿直見寄二首雪中㝷友人不遇河邊晚望早春寄東郡舊同僚邊將三首漁父早春又山中早春贈學仙者留别友生二月六日𥘉見待漏房前柳色微緑欣然成詠垂柳閑居中秋陪張龍圖讌射堂𥘉夕隂雲酒行頓解喜而成詠貽宋四行簡迪自嘲醉雪寒取酒虞部劉貟外約遊金明, WYG: ''}
