  - {type: variant, offset: 555, length: 7950, content: 以賤事失期劉惠詩見嘲以詩四首謝之宗孟孫噐之奉使淮浙至江爲書見寄以詩謝之五首和國子夏主簿李花有章送聶之美攝尉韋城送吴辨叔大名司户送楊太祝忱知長洲縣和邵興宗秋夜學舎宿直和吴冲卿病中偶書呈諸同舎光時亦卧疾月下小飲又絶句馬病入塞喜孫噐之來自共城送韓太祝縝知錢塘和聶之美鴈又和諷克送王太祀豫知伊闕慶暦七年祝南郊禮畢賀赦送張太博肅知岳州和之美河西列岫亭書事釣魚有感又田家和人葦花送趙書記衆之官華州又寄題陟屺寺寄鄭縣史令千之前君爲白馬尉廨舎前即南浦今西溪封内勝地也送華亭沈主簿閏正月十五日夜監直對月懐諸同舎二首歸鴈憶龐之道送鄭推官戡赴邠州興宗約遊㑹靈乆不闈問以詩趣之清明日與興宗飲趙道士東軒上巳日與太學諸同舎飲王都尉園寄題洪州慈濟師西軒山頭春色三月十五日宿魏雲夫山莊又七言留别逢吉陜城桃李零落巳盡硤石山中今方盛開馬上口占自澠至洛循谷水行百餘里送不疑知常州送聶之美任雞澤令送張袐牧知分寧献臣父館宿遇雨懷諸同舎送韓直講鐸字子文鄆州寧親宣徽使河東經略使鄭文肅公挽歌二首又代孫撿討瑜字叔礼作二首送丁秘羽字公佐知雍丘苦雨酬師道雪夜見寄代叔禮作使北詩又撃毬送許先輩泰符尉宗城送趙殿丞象字子与歸成都祀明堂礼畢子与新升朝以恩官其父大理評事賜告歸寜得其除書以俱二三同舎爲詩以紀其美僕得回字送張都官肅字子莊江南東路提刑得前字興宗許菊乆之未得菊栽許送定如何庭下不堪秋草多九日無花更無酒便攜藜杖直相過得菊并詩黄花小墢和煙斸野興蕭蕭巳相逐同來更得詩句兼乆立看詩忘栽菊送史館唐祠部詢字彥猷江南西路轉運使豪桀爭唐鹿江南號冨彊明時雖混壹餘俗尚彫傷稅版誅求急詞曹牒訴忙皇心愍頽弊使節付才良貪吏先投紱姦民盡越郷閭閻無揷筆田畆有捿糧漢閣歸期闊隋河去驛長風髙片㠶疾鉦鼔入秋光送張寺丞覲知富順監漢家五尺道置吏撫南夷欲使文翁教兼令孟獲知盤羞蒟醤實歌雜竹枝辭取酒湏勤醉郷關不可思寄題李舎人偉蒲中新齋隴上家聲勇氣殊邊亭卧皷欲安居非同王翦私求宅更似甘寜晚好書劒倚寒牎風淅瀝門無雜客栁蕭踈蒲州風土平生愛爲問旁鄰地有餘贈太子太傳康靖李公挽歌詞二首黄髮今彫喪蒼生欲柰何散金纔極樂曵杖巳成歌十郡餘恩在三臺故吏多位崇仍有後五福更爲多鹵簿去悠悠西郊亂葉秋旐翻寒日薄笳咽断雲愁吊客門飛鶴佳城山卧牛靈車今不返洧水日東流葬新鄭送二同年使北華纓下王除天子寵匈奴雖復夷風陋猶知漢使殊夜烽沉不舉秋柝寂無虞何必燕然刻蒼生肝腦塗右吕濟叔雲愁雪欲零四牡出郊坰古塞煙華紫寒沙日氣靑金門秘雞樹朱節燿龍庭幾夜天街北遥占漢使星右李公素昌言有詠石髪詩三章模冩精楷殆難復加僕雖未賭兹物而巳若識之乆者輙復強爲三詩以繼其後非敢庻幾差肩適足爲歬詩之輿臺耳校理石楊休萬古風濤浸石巖老苔垂足細䰐鬖傳聞海厎珠無數何事從來散不簪金闕銀城仙客居欲傳消息問麻姑蓬萊無物堪爲信剪寄蒼龍一握鬚琅菜來從若木邊西王母傳有碧海之琅菜非膏非沐緑冤延玉盤委積羞嘉客不是陶家無饌錢送沈寺丞紳知南昌縣字公儀長江湛湛帶楓林古木寒雲縣寺深老吏不能容狡獪細民無復有冤侵洪崖丹井聞猶在徐孺衡門說可尋寧復淹留如寳劒更令牛斗氣沉沉酬不疑雪中書懷見寄校理邵必直道免三黜敢云羞小官盤飱紅粟澁衣桁黒貂寒書府容身易侯門曲意難荆扉盈尺雪有客問袁安荅師道對雪見寄直講陳洙隂風一夕驚暁雪滿都城氣覆千家白光連萬象清戀空飛不下弄態舞相縈歴亂㸔無定飄颻轉未成綴垣時缺剥壓竹乍欹傾細隙過無滯寒䆫拂有聲園林匀結練觀閣巧彫瓊草木情先喜乹坤意亦榮營魂頓踈徤病目蹔虚明郢曲髙誰和羞將叩缶并送王校理懌字公和守琅琊沂公兄子爲公後金門倦鳴玉千騎出東方封略依滄海枌榆近故郷秦碑苔蝕字鄅稻日翻芒國吏遥應識當年丞相郎哭尚頴字公楚操業五常備艱難六極全仲尼難語命禆竈不知天弱女飄何許遺文散莫傳官輕史不録後丗孰稱賢故侍讀學士張公哀辭二首喜愠與榮枯居之悉晏如稍閑多執筆至老不抛書常愧無能極曽霑清論餘秋風郭門外雨泣望䘮車凶夢歌洹水妖巢集戴鵀未甞餘俸禄無以具衣衾袁渙分倉榖翁歸賜府金他年純固傳寧使令名沉朝廷以公清貧贈賵有加錢子髙挽歌二首煒燁傳家學連翩射策榮走丸過省閣破竹取公卿埋玉嗟何早爲山惜未成空令澤官友相顧淚縱横同年致祭者二十二人象設如平昔升堂不見君尚疑言笑在忽念死生分清論千秋雪浮榮一片雲泉臺多少路何處復修文題楊中王供奉洗心堂崇勲之孫閥閱盛山西朱門颺㦸衣雅知名教樂深笑宴遊非一室琴書隘三年園圃稀異時論事業肯復讓輕肥送龔章判官之衛州新及第几硯昔年遊於今成十秋松堅終發石魚變即辭流近郡無飛檄清時不借籌淇園春竹美軍宴日椎牛送王灌同年河南府司録字文正先君甞爲此官綵服昔爲兒隨親宦洛師至今餘夢想常記舊逰嬉佐史頭應白書樓樹巳欹聞君行有日使我淚交頥送王彦臣同年通判亳州字伯逢先朝御六飛親謁瀬郷祠牛酒當時惠衣冠此日思仙蹤丹有竈天瑞檜生枝聖主憐耆舊題輿得吏師正月二十四日夜雪疊瓦浮輕雪參差粉畫難苦欺初變柳故壓未生蘭夜色微分白春容不受寒即爲花卉奪猶得蹔供看和道粹撿討王純臣雪夜直宿天禄凝嚴近紫臺書幃夜對雪華開層樓直倚寒空出清漏逺從深殿來薄夢不成氷柱折暁光先到玉花摧兎園終是諸侯事虚費相如能賦才和次道大慶殿上元迎駕鳯律年華到尚新九重氣象巳成春暁雲仾拂羽林仗宿雨先清紫陌塵玉殿鳴鞘傳警蹕彤庭委珮集簮紳闕歬無復魚龍戯自有驩謡億萬人送茹屯田孝標知無爲軍疊皷鳴鐃迎候新軍牙孑孑倚淮津聊應衣繍過郷曲不作引章驚故人荻迸短芽淝水暖荷浮圎葉漅湖春使君此去榮多少猶是當年書劒身田横墓􅢰師西昔時南靣並稱孤今日還爲絳灌徒忍死秖能添屈辱偷生不足愛湏臾一朝從殉傾群客千古生風激懦夫直使強顔臣漢帝韓彭未必兔同誅登平陸比山回瞰陜城奉寄李八丈學士使君二十二韻漢家二千石體望向來尊况復嚴徐客從前益稷孫公侯貴不絶禮樂器常存符竹臨分陜聲光應列藩親闈先契重三司同僚子舎近交敦滑州同幕栢壟依仁域棠隂接故園懷歸聊露請予告辱推㤙荷祋煩疆候停車下郡門帷廧紛大館騶騎屈朱􅙲不以黎苗待還將臭味論森羅牢禮重滅裂俗儀煩霜霽威嚴息春生笑語温草微侵碧甃塵不染華軒日影摇雲棟風㾗過玉樽落塵歌逈出激楚褏雙翻雅戲象交局珍肴熊薦蹯河梁俄首路汾曲訪吹塤舉手辭雙㦸騰裝改北轅烏飛城樹暁鴈泊野蕪暄耿耿清標闊涔涔宿酒昏百蟠縈阪道數里豁川原跋馬風煙外依稀皷吹喧貟村坂其東八政水即古之傅巖有傳說廟又東北虞城古虞公之國也穹谷鬱盤纡河瀕陜北隅泉流㳙不絶岡勢儼相扶初旭纷髙下空煙似有无石灘醒耳快嶠樹窣雲孤天霽嵐光活人稀草色蘇牧兒歌自若樵子逺相呼壞道傍連傳空城右指虞窮嵓今寂寞蔓草只荒蕪野店寒䬸澁山程瘦馬瘏物華供興趣亦足慰﨑嶇太行象帝胚渾散愚公轍跡開橫行四極外蟠據九河隈茀鬱天閽近崢嶸地軸迴陽崖明草樹隂壑轉風雷波沓群峯涌雲奔峭壁來猿嵓垂磊落龍窟闘喧豗噴雨驚湍灑跳星巨石頽平塗憂屐拆跬歩戒輪摧覆頂千春雪縁漳萬古苔谷盤容國士髓裂餌仙才晋市飛樵札燕郊落燒煤棊圖分冀野蟻壤認叢臺在昔王塗塞甞聞覇略恢嚴閞隂伏甲間道夜銜枚挾詐揮金斗貪功襲墨縗戰場空爝火京觀悉蒿萊險易曽何變興亡只可哀隆平方恃德襟帶自崔嵬石昌言學士宰中牟日爲詩見寄乆未之荅今冬罷武成幕來京師此詩謝之楊休昔年三月浪鱗翼化雲雷竹箭流俱上芙蓉幕對開釋褐昌言除同州推官光華州判官瀵泉揚沸渭泰華聳崔嵬捧檄容歸省飛觴復屢陪時光人知同州光以吏事時往省覲復得与昌言遊芬芳襲芝室嘉慶侍蘭堦吴壁評殘筆隋碑讀漬苔同州龍興寺即隋文帝故宅寺有李德林撰碑囯公吴道子盡畫或未就而止云以俟後之能者清隂依玉樹和氣樂春臺薄官俄成别私門忽遇災一朝捐綵服五載泣麄縗季路還従仕任安獨見哀近畿須徤令劇邑試長才過目全牛解迎鋒巨枿槯雉留乗䕃伏蝗避境苗廻時得鳴琴暇仍飛麗句來正知榮篋笥無足報璿瑰紞皷俄攀鄧安車巳召枚賦成平樂館燕奉柏梁盃自顧誠駑緩于今尚草萊履穿羞路雪蓋敝怯京埃儻惜餘光便炎風動死灰昌言見督詩債戯呈絶句學餧才貧杼軸勞踰年避債負詩豪倒囊不惜償虚劵未敵瓊瑶舊價髙靜夜午夜空齊四悄然清寒透骨不成眠秋風故掲踈簾起正漏月華來枕前春紅桃素李競年華周遍長安萬萬家何事青春庭下柏東風吹盡亦無花送導江李主簿君俞學海無涯冨辝鋒一戰勲聲華掩終賈賦頌継淵雲五斗爲邊吏千倉飽戍軍明㤙美尤異優秩賞能勤黄祖隂懷怒張湯巧用文折雖因木秀燒不變蘭薫迹有窮通異心無得䘮分龍蛇寧乆蟄玉石豈俱焚蜀國花饒思臨卭酒易醺西風時有意尺紙慰離群送峽州陳廉祕丞三首冝都賢太守治迹古人齊虎負衆子去鳯環群鳥棲行増頴川秩别降武都泥正恐還朝速春林未子䂓郡府猿聲外旌旗鳥道邊樓髙出楚塞煙霽識巴船𥜗袴嗟來暮簮紳惜外遷皇仁矜逺俗非謂意踈賢地險三巴口江流百折蟠騶珂通峽響門㦸照秋寒翠壁虎牙石素花狼尾灘孫劉置栅處細爲冩圖看武成致齋奉酬吴沖卿寺丞太學宿直見寄二首廣文更直太常齋咫尺無從盡素懐不及清風得隨意夜深容易過天街雪後餘氷尚綴簷月華霜氣入踈簾難堪瓊玉驚心骨坐覺清寒㡬倍添雪中尋友人不遇擁䄂犯風雪驅車行詣誰朱門不可入素友復難期依丗誠多拙迷方忽自悲𥚹心終寡合吾道易參差河邊晚望髙浪崩奔卷自沙悠悠極望入天涯誰能脫落塵中意乗興東遊坐石槎早春寄東郡舊同僚樓臺帶餘雪寒色未全収乆負入開意空爲同舎羞清樽接勝友飛蓋從賢侯應限春來晚煙林巳數逰邊將三首紅旗一簇聚山椒霽日清風㸔射鵰脫帽胡兒遥稽首漢家新將霍嫖姚月白星稀霜氣多卷旗束甲渉䓗河田家不覺官軍度夜半只聞風雨過横吹長歌千萬騎將軍塞北立功廻邊人争出孤城望漸見旌旗天外來漁父楚岸橘花香扁舟泛渺茫短蘘衝宻雨素髪浄秋霜煙外鳴桹逺波間擲線長無人識名姓擊汰恐誤入滄浪早春梅梢柳蕚未全開日澹風和春意來雨後誰家有桃李㑹湏多買及時栽又璿霄轉斗車春意逼梅花熟寐侵街鼓閑情到酒家睛陽浮地末寒色歛天涯歸鴈空餘迹朝来印浦沙山中早春山木欣欣意春光次第催欹巾望歸鴈伏檻聽新雷巖靜聞氷折巢空喜鷰來澗花從寂寞亦向草堂開贈學仙者㣲逕透重巒茅堂竹葉冠方瞳映骨靜秀氣逼人寒夜火裝丹竈睛霜醮石壇不湏驚淺俗䡖舉入雲端留别友生野際共爲别客亭芳草新何心更執酒滿目盡傷春今古無窮路東西相背塵行行復回首不欲着鞭頻二月六日𥘉見待漏房前柳色㣲緑欣然成詠宫城映出絲絲緑頓覺皇州春意廻從此不辭驅痩馬六街終日踏塵埃垂柳天意清和二月初春風不動整如梳陶潜宅外時无此想更蕭條不易居閑居故人通貴絶相過門外真堪置雀羅我巳幽慵僮更懶雨來春草一畨多中秋陪張龍圗讌射堂𥘉夕隂雲酒行頓解喜而成詠飛蓋共徘徊西園髙宴開秋雲惜明月留待庾公來貽宋四行蕳迪離羣如幾辰屈指十靑春不意輪蹄跡共兹京洛塵文塲投􅃮契客路轉蓬身别易相逢闊過從莫厭頻自嘲盤飱羅新𬞞充腹不求餘窮巷晝扄户閑軒卧讀書有心齊塞馬无意羡川魚丗道方邀逐如君術巳踈醉厚於太古暖於春耳目无營見道真果使屈原知醉趣當年不作獨醒人雪寒取酒雪意乆未就寒雲低不收飄揚挿孤幟迢遞映髙樓試假賢人濁聊攻客子愁呼僮擕小榼更凖黒貂裘虞部劉貟外約遊金明光以賤事失期劉惠詩見嘲以詩四首謝之宗孟絲管嘈嘈耳不分綺羅雜沓自成春不唯漢帝昆明小更覺唐家曲水貧絳闕朝歸散玉珂不遊不飲柰春何皇仁聽使歡娱極白簡從君冷峭多碧柳紅桃照眼春綺肴芳醴集朝紳自嫌林野踈頑迹難預風流席上賔上苑花繁髙覆墻曲隄風暖柳絲長爐邊應有歩兵尉甕下難尋吏部郎孫噐之奉使淮浙至江爲書見寄以詩謝之五首䪍矢迎山驛軺車下帝臺夜看牛斗分應有使星來曉棹旌旗逈暮河鉦皷喧商舩極目避漢使一何尊吴釀木蘭春蘇州有木蘭堂酒江鱸白錦鱗玉盤聊下筯初識紫絲蓴岫貼睛天闊舟縁石岸深吴江中石岸長數里遥知作書處䌫裊緑波心沙溆鶴爭飛波光可染衣松江異淇水信美不如歸噐之家衞州和國子夏主簿李花有章儒宫岑寂覺春閑仙李繁花重壓欄碎錦不飛蒙樹合素雲欹亞舉枝難能詩此日當推謝捧賜他年足継淵聖御名更約彫盤薦秋實豈徒穠豔一朝看送聶之美攝尉韋城徒勞巳足倦漂泊益恓惶短劒無三尺征衣兵一囊折腰從事馬賛謁使君堂併日屢承檄無時不褁糧官曹大兒戲弓槊小軍行破柱飜偷窟傾林索盗囊村墟旅顔黒風日故衫黃瞑宿投煙舎朝飱䕃道桑誰憂課書殿豈慕薦飛章志氣空磅礴才華浪激昂鑴鑱圭始瑩磨拂鑑尤光衣褐仍纏袴無羞俗吏裝送吴辨叔大名司戸元宰司官鑰旌旄壓大河敢言趨府倦私歎折腰多機發何妨避光塵未免和艱難方逺到慶閥肯蹉跎致逺必自近如君豈椽曹魚龍試春浪松栝露秋毫錯落辝華富堅􅥁氣節髙無歎走塵勞送楊太祝恍知長州縣三吴佳縣首民物舊熈熈專用清談治非如俗吏爲林踈丹橘􅒯稻熟白芒欹冝使民無忘嚴修太伯祠和邵興宗秋夜學舎宿直直舎逍遥度清夜蹔投逢掖解儒冠髙樓影背星河轉踈竹氣兼風露寒籬下黃花新蘂亂門邊碧柳舊株殘折腰把板今無有勿似陶潛遂弃官和吴冲卿病中偶書呈諸同舎光時亦卧疾病來門不掃秋草翳吾廬弃置賢人酒蕭條長者車冥迷牀闘蟻潤溽篋生魚藥物從無継簞瓢自有餘形神寂可弔身丗邈相踈何事文園客消中亦著書月下小飲美景賞心相值難良宵四座盡儒冠月華過冷衣襟潤酒力易消樽俎寒自有笑談供逸氣不須絲竹借餘歡坊樓五鼔欲催曙桂影長先髙興䦨又絶句舉首孤輪不似遥鐏前狂氣出雲霄常娥不惜惜丹桂欲就髙枝掛酒瓢馬病羸病何其乆仁心到棧頻湏怜苜蓿歉當認主人貧客舎同蕭索山程共苦辛未能逢伯樂且可自相親入塞萬騎入榆關臯蘭苦戰還椎鋒佩刀鈌蹋血馬蹄殷鐃吹來風外牛羊出霧間湏知沙塞惡壯士變襄顔喜孫噐之來自共城取友不無人愛君天性真逺尋窮巷宅未拂滿衣塵王禮貧尤重交情别更親誰家釀醇酒盡醉凖衣巾送韓太祝縝知錢唐冠佩鬱相映由來積德家一時推儁異四海走声華圖籍添舟重江山忘路賖夷塗指霄漢跼驥不湏嗟和聶之羙鴈汲汲復栖栖往来誰與期映雲纔可見入霧杳難追覉枕夢初斷寒閨涕巳危冥冥逺繒繳愧尔獨知時又和諷古海客乆藏機鷗知人不知如何毫末利管鮑亦相欺送王太祝豫知伊闕百里驩迎新令賢儒經吏術盡家傳天開嶺阜竦雙闕地雜桑麻隘一川錦雉馴飛春陌上雪鳬髙去夕嵐邊長才乆屈君無限所惜斯民受賜偏慶暦七年祀南郊禮畢賀赦雷皷千通破大幽天開獄鑰縱纍囚驛書散出先飛鳥一日恩流四百州送張太博肅知岳州嚴風秀木折爲薪得罪由来爲出群粥粥黃雞憎鶴介芃芃青蔓掩蘭薫天資䜛嫉多端巧人極精明不易分飲水豈言吴刺史謗書翻似馬將軍波濤洶涌動寒野樓閣嶣嶤壓暮雲紅葉寺深秋晚見蒼山鍾逈夜清聞何妨絶境聊爲守正恐中朝亟用君身外百愁俱擲置放歌沈飲且醺醺和之羙河西列岫亭秋山對踈牖羈客倦登臨雨後嵐光活晴𥘉落照深素波明别浦赤葉照衰林佇目寂無語何人知此心亭臯資逺矚秋思浩無涯鴈唼牽菱蔓童歌出荻花壟荒猶叱犢枝暗稍栖鵶煙靄藏東渚慿軒莫望家書事志士喜功業感時心易勞蘖栽終栝柏荒蔓任蓬蒿梁竦慵爲吏蕭咸恥詣曹風霜果不變會見出雲髙釣魚有感垂竿臨晚岸堅坐據莓苔餌落萍初散魚驚荷暫開有求雖瑣細未獲且仾回君識磻磎老曽垂緑髪來又野釣披榛竹無人知往來髙空飛不下鷗鳥巳相猜田家未塞豪人奪何言公賦収皇心雖惻隠蓬戸或焦愁爲吏空多禄無人能此憂知君坐公府他日冨民侯和人葦花葭菼迷河曲髙秋一畨榮齊紈張野白楚練照川明不夜月常皎踰時雪未晴萬仙霓帔合千畒玉苗生漠漠波瀾偃茫茫沙磧平際空塩海竭垂地塞雲横日暖鷗無色風髙鶴有聲逢君得嘲賦豈愧束薪井送趙書記衆之官華州車馬西城外遥遥未有塵辭梁猶帶雪過洛漸生春幕府斜依嶽關山曲抱秦曩來謨畫拙不必笑前人又寄題陟屺寺鄭南峯下寺前軒反景分明見渭川爲報十年容易别於今愁悴不如先寄鄭縣史令千之前君爲白馬尉廨舎前即南浦今西溪封内勝地也憐君比比得佳縣勝槩閑情雙有餘爲看西溪日沉後如何南浦月生初長春宮柳逺扶踈新樹應多舊巳枯蠹柱苔牆遍尋歴古亭猶有杜詩無送華亭沈主簿執𬒮青門道蕭蕭馬欲東暮雲零落翠逺樹淺深紅楚澤吟聲裏吴山醉眼中相思杳何許野鸖唳髙風閏正月十五日夜監直對月懷諸同舎二首霧浄金波溢天開碧幕空夜寒雖料峭春意自冲融熠熠枝上露翛翛竹杪風蹔還林野興不似畜樊籠澹薄春雲散仾昻北斗横微分漢津鴈靜識建章更濁酒怜虚爵髙文憶友生前軒空不掩悵息負孤清歸鴈亦知南國稻粱肥水滿春江努力歸聞道楚人繒繳細平沙短草盡藏機憶龐之道疇昔兩垂髫知音結乆要何言半塗别不待歲寒彫幸有才名在非隨氣運消英靈猶髣髴宿草巳蕭蕭送鄭推官戡赴邠州形便豳公國旗旄擁將壇秦雲低落日塞樹怯春寒草檄無留思投壷不廢歡還應笑黄卷寂寂守儒官百榼行春樂千弓從獵豪苦吟邊月冷飛鏑野風高竒䇿鞭殊俗長緌係不毛輸君躍馬貴一等着青𫀆驕虜巳歸計聖朝方寢兵時聞候火入非復塞塵驚秋嶺無南牧春田恣北耕休窮西海路辛苦學甘英興宗約遊㑹靈乆不聞問以詩趣之勝地何妨行樂頻萬雙白璧不賖春臘醅巳老乆未壓楊柳青青不侍人清明日興宗飲趙道士東軒佳遊得令辰過此不爲春一境風光秀萬家煙火新鷰初飛玉殿草不染香輪逼水蒲牙短圍隄柳帶匀縱談髙出古落筆健生神日暮還醒去林花應笑人上巳日與大學諸同舎飲王都尉園冠蓋鬱相依名園花未稀游絲縈復展狂絮墮還飛積弩遺風陋蘭亭舊俗微何如詠沂水春服舞雲歸寄題洪州慈濟師西軒登臨傳勝絶悵息未成遊山氣髙凌霽湖光碧照秋煙踈茶竈􅒯燈冷竹房幽安得聊慿檻蕭然洗客愁山頭春色天意欲回煦群生稍鬱烝平田猶未徧絶嶺獨先升翠色添崖柏寒聲折澗氷誰爲物外友挈手共同登三月十五日宿魏雲夫山㽵先生嫌俗賔猶與故郷親不惜煙霞地暫容繮鏁身林廬深有徑雞犬四無鄰蔌蔌開花墮蒼蒼古柏春飯炊松粒細盤采蕨芽新靜覺精神健閑知氣味真雞泉冷毛髮山翠濕衣巾竹色消酲易林聲破夢頻客輪來去轍驛路古今塵明日空廻首白雲應笑人又七言聞道山家門鎮開獨驅瘦馬出塵埃白雲明月先無約何事今霄亦此來留别逢吉君念承明臭味稀相逢惜别重依依㑹稽太守方坐嘯東郭先生還歩歸嚴助朱買臣皆爲會稽守東郭先生孝武時待詔公車樂飲林塘留節物餞行里舎動光輝雙旌廻去行人發一帶長臯煙雨微陜城桃李零落巳盡硤石山中今方盛開馬上口占西望飛花千樹暗東來芳蘂一畨新行人不惜泥塗倦喜見年光兩處春自澠至洛循榖水行百餘里巳煩榖水逺相送更得嵩峯遥見迎水碧峯青看未足却愁前到洛陽城送不疑知常州宦學不營身京華費十春非貪爲郡樂意欲與民親祖帳青門道歸帆楊子津江山舊遊在煙火故郷鄰敢惜離群闊欣聞得吏循嗟余一囊米𬈑負鬛絲新送聶之美任雞澤令趙魏髙氣俠到今風俗然椎埋吏難禁擊断丗稱賢明府冝更瑟罷民庻息肩無如􅗀絲者急歛縱敲鞭送張秘校知分寧獻臣父百里大夫官不輕莫嗟領上髮垂星人生榖禄偏冝晚丗路艱難不厭經數曲秋江縈縣白幾峯霽色入簾青于公嚮日多隂德巳有鵷鶵在帝庭館宿遇雨懷諸同舎佳雨濯煩暑翛然生暁凉森沈殿瓦碧羃歴井苔蒼院靜杉篁秀人閑鍾皷長慿誰同把酒清興窅相望送韓直講鐸字子文鄆州寧親車馬儼何之東岡舊有陂三年别親意千里逹家時去仕元戎幕來爲太學師寧湏負斗米不復断機絲物色迎歸鞚光輝入壽巵人生無此樂此樂獨君知宣徽使河東經略使鄭文肅公挽歌二首璿璣敷帝命金節護邊兵盡付將軍制真爲儒者榮扶揺方上擊濛汜忽西傾罷市人相吊紛紛滿百城柳翣䘮容盛江山故國遥清時獨長往何日重來朝事與秋雲断榮如暁夢消西風虎丘路馬鬛又嶣嶤又代孫檢討瑜字叔禮作二首湖澄翠岫孤勝地古東吴氣象常時秀英靈何丗無金閨演王綍玉帳綰兵符煒燁照郷曲從兹益重儒人爲天地客處丗若浮休豈有生長在秖知名可留露沾寒草晚風嘯白楊秋地下求文友應從顧陸遊送丁秘竭字公佐知雍丘古縣跨河流人繁軍市稠羽飛朝暮驛鱗疊往來舟兄擅才華乆時推政治尤足猶妨老驥目不礙全牛從道西來近能無東望愁時因趍上府窮巷一相求苦雨積雨欲侵旬朝晡漫不分蒼凉微露日慘淡巳生雲地半成泥滓天應厭垢氛時聞度鶬鴰空外自爲群酬師道雪夜見寄玉樹交横雪後天銀河沉着斗欄干筆峯微結氷絲澁燈暈𥘉成花燼殘太學先生氈苦薄公車倦客履仍單欲吟佳句到清暁夜寂愁聞金石寒代叔禮作使北詩人主愛民物心無彼此情約歡同一國蒙福徧群生玉帛遥相望風波寂不驚熈熈南北海所至盡昇平又擊毬肅奉承軺命仍陪戯馬遊朋分𥘉逈出勢合復相収顧眄華星激縈廻紫電流良因重嘉好禮接使臣優送計先輩秦符尉宗城紅塵乆帝城髙價動公卿竹柏寒方茂驊騮老更成氷霜驅馬瘦書劒束裝輕丞相虚東閤遥知倒履迎送趙殿丞象字子輿歸成都祀明堂禮異子輿新升朝以㤙官其父大理評事賜告歸寕得其除書以俱二三同舎爲詩以紀其美僕得逥字蜀棧錦衣來高堂綬笥開㤙輝同日至喜色共春回駟馬過鄰社朝𥚑捧壽盃吾生無此樂空使寸心摧送張都官粛字子莊江南東路提刑得前字楚俗號難治司刑尤擇賢危疑片言决舒慘一方專松不彫寒色絲曽断直絃清風過江外應在下車前温國文正