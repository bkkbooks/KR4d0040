  - {type: variant, offset: 4938, length: 6, content: 實患直貢其誠, WYG: 褒賞且國家名位本以醻功報德}
  - {type: variant, offset: 4946, length: 2, content: 忽也, WYG: 但以祔廟禮畢檢舉故事虚有授受况臣於登極之初已䝉覃恩改官今曽未踰年安敢再叨殊渥縱臣貪冒不知愧恥天下之人其謂臣何所有授正議大夫吿身臣不敢祗受}
  - {type: variant, offset: 4949, length: 0, content: '', WYG: 望聖慈特賜寢罷取進止辭轉官第二劄子元豐八年十二月上臣於今月十一日伏覩中書録黄䝉恩除正議大夫臣於十二日具劄子奏以蔡確等啓廸神宗皇帝建立儲貳傳授大寳宜遷一官臣閒居西京非所預聞所有正議大夫吿身臣不敢祗受自後未聞降出至十四日准閤門吿報令臣受上件告身臣竊}
  - {type: page-break, offset: 4949, content: '', id: KR4d0040_WYG_049-3a, image: WYG1094/WYG1094-0458c.png}
  - {type: variant, offset: 4950, length: 1, content: 太, WYG: 富弼輔佐三朝名德老成當嘉祐之初亦是定策之臣但以不預顧命懇辭甚至如臣才德比於富弼無能為役當建儲顧命之際臣為庶僚在外初不預聞豈敢止因祔廟隨例遷官凡為政之要惟在賞功罰罪臣沗備執政無功受賞將何以裁抑他人所有新命伏望聖慈特賜寢罷取進止辭轉官第三劄子元豐八年十二月上臣伏奉詔書以臣辭免恩命所請宜不允者昔英宗皇帝入承大統宰臣韓琦等實有定䇿之功又踐阼之初聖躬違豫慈聖光獻}
  - {type: page-break, offset: 4950, content: '', id: KR4d0040_WYG_049-3b, image: WYG1094/WYG1094-0458d.png}
  - {type: variant, offset: 4954, length: 0, content: '', WYG: 權同聽政琦等盡忠竭力亦不為不至及英宗皇帝專制萬幾襃賞琦等各遷一官臣時為諫官猶上言以近歳官冗賞濫兩府大臣}
  - {type: 'kr:newline', offset: 4956, content: '

      ', id: KR4d0040_krp_048-bkkkrnewl288}
  - {type: line-break, offset: 4956, content: '', id: KR4d0040_SBCK_048-12a03}
  - {type: variant, offset: 4956, length: 1, content: 與, WYG: 即政之初宜懲革斯弊今自於朞年之間連併遷官則難以禁他人之幸進者恐宿衞將軍宗室外戚四方藩鎮内侍近臣皆有冀望至時陛下亦不能裁抑兩府亦不敢執奏當是時英宗}
  - {type: page-break, offset: 4956, content: '', id: KR4d0040_WYG_049-4a, image: WYG1094/WYG1094-0459a.png}
  - {type: variant, offset: 4959, length: 2, content: 陛下, WYG: 雖不収還恩命而富弼亦有定策之功自以不預顧命力辭甚苦况臣既不預定策又不預顧命豈可來自冗散之地遽與輔臣}
  - {type: variant, offset: 4962, length: 0, content: '', WYG: 賞且臣昔日在人則言其不可受今日在已則受而不辭顧行復言能不自愧所有吿身臣不敢祗受伏望聖慈矜察特}
  - {type: variant, offset: 4963, length: 32, content: 省覽庶以開廣聦明資益聖性於民間情僞靡不周知異日太平之業由此爲始矣, WYG: 寢罷}
