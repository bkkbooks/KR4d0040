  - {type: indent, offset: 3055, content: 　　　　, id: KR4d0040_krp_048-bkkind21}
  - {type: variant, offset: 3056, length: 0, content: '', WYG: 省覽農民封事劄子元豐八年九月三日上臣伏覩近降農民訴疾苦實封奏狀王嗇等一百五十道除所訴重􅃨外俱已簽帖進入竊惟四民之中惟農最苦農夫寒耕熱耘霑體塗足戴星而作戴星而息􅅙婦育􅅙治繭續麻紡緯縷縷而積之寸寸而成之其勤極矣而又水旱霜雹蝗􅈮間為之灾幸而収成則公私之債交争互奪穀未離場帛未下機已非已有矣農夫􅅙婦所食者糠籺而不足所衣者綈褐而不完直以世服田畝不知捨此之外更有可生之路故其子弟遊市井者食甘服美目覩盛麗則不復肯歸南畝矣至使世俗俳諧共以農為􅅓鄙誠可哀也又况聚斂之臣於租稅之外巧取百端以邀功賞青苗則强散重斂給陳納新免役則刻剥窮民収養浮食保甲則勞於非業之作保馬則困於無益之費可不念哉夫農蠺者天下衣食之原人之所仰以生也是以聖王重之臣不敢逺引前古竊聞太宗皇帝嘗遊金明池召田婦數十人於殿上賜席使坐問以民間疾苦田婦愚戇無所隱避賜帛遣之太宗興於側㣲民間事固無不知所以然者恐富貴而忘之也故每臨朝無一日不言及稼穡真宗皇帝乳母秦國夫人劉氏本農家也喜言農家之事真宗皇帝自㓜聞之故為開封尹以善政著聞及踐大位咸平景德之治為有宋隆平之極景德農田勅至今稱為精當昔周公相成王作無逸曰先知稼穡之艱難乃逸則知小人之依盖以一盂之飯一尺之帛莫不出於艱難人主既知之則不肯用之於無益散之於無功驕侈之心無自而生矣伏惟太皇太后陛下深居九重皇帝陛下富於春秋自非今者濬發德音大開言路使畎畝之民皆得上封事則此曹疾苦何由有萬分之一得達於天聽哉其文辭鄙俚語言叢雜皆身受實患直貢其誠不可忽也伏望太皇太后陛下與皇帝陛下同賜省覽庶以開廣聦明資益聖性於民間情偽靡不周知異日太平之業由此為始矣取進止與吕公著同舉程頥劄子元豐八年九月十五日上臣等竊見河南處士程頥力學好古安貧守節言必忠信動遵禮義年踰五十不求仕進真儒者之高蹈聖世之逸民伏望聖慈特加召命擢以不次足以矜式士類禆益風化取進止乞裁斷政事劄子元豐八年十月十七日上臣聞兩貴之不能相事兩賤之不能相使此乃物理自然人情之常也是以聖人立為君臣使人臣各獻其謀而人君裁决其是非若網在綱有條而不紊此國家所以治也若人君不加裁决使人臣各行其意則朝夕鬭訟弱不勝强寡不勝衆不則雷同詭隨尸位竊禄苟且偷安以度目前此國家所以衰也然人君於是非之間亦當三思精察昭然無疑然後决之自古興衰未有不由此塗出也夫人心不同各如其面雖以周公之聖召公之賢同輔成王猶有不恱况邪正忠佞各有所存者乎臣竊惟皇帝富於春秋太皇太后親臨萬幾事無大小皆委於執政垂拱仰成萬一羣臣有所見不同勢均力敵莫能相一者伏望陛下特留聖意審察是非若甲是而乙非當捨乙而從甲乙是而甲非當捨甲而從乙如此則羣臣莫敢不服善政日新矣不然陛下雖有求治之心事功無時而成也况書曰惟辟作福作威不可使用人賞罰之柄盡歸執政人主一不得而專也取進止議可劄子元豐八年十月二十四日上臣聞古人有言謀之在多斷之在獨陛下寛仁委政羣下或政有大疑議論難一儻陛下不决其是非則争辯紛紜無時而息事功何由可成臣謹案蔡邕獨斷叙漢制有疑事公卿百官㑹議若臺閣有正處而獨執異議者曰駁議其合於上意者文報曰某官某甲議可此所以各盡羣下之所見而人主亦不失操柄也今執政之臣雖相與竭力同寅協恭若萬一有議論必不可合者欲乞許令各具劄子奏聞望陛下精察其是非可否以聖意决之或於簾前宣諭或於禁中批出令依某人所奏若羣臣猶有固争執者則願陛下更加審察若前來處分果非則勿憚改為若灼然無疑則决行不移耳如此再思而行庶幾得盡衆心事亦少失矣取進止乞}
