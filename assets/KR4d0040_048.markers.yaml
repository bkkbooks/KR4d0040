  - {type: variant, offset: 4346, length: 0, content: '', WYG: 大辟貸配法草元豐八年十月二十日授刑部應開封府諸路州軍奏到大辟罪人稱是刑名疑慮及情理可憫者仰大理寺依法定斷并坐疑慮可憫條送刑部看詳如刑名實有疑慮情理實有可憫因依申奏取㫖若看詳得别無疑慮及可憫者即具鈔奏下本處依法施行不得一槩將舊例貸配破却律勅正條仍委門下中書尚書省㸃檢如有不當及用例破條奏}
