  - {type: variant, offset: 2219, length: 6, content: 依義勇舊法赴, WYG: 河北陜西河東京東京西等路諸軍若千人為一將别置將官使之專切訓練其逐州總管以下及知州知}
  - {type: variant, offset: 2226, length: 0, content: '', WYG: 皆不得關預及有差使量留羸弱下軍及剥員以充本州官白直及諸般差使其餘禁軍皆制在將官專事}
  - {type: page-break, offset: 2226, content: '', id: KR4d0040_WYG_048-2b, image: WYG1094/WYG1094-0450b.png}
  - {type: substitution, offset: 2227, original: 閱, replacement: 閲, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-20841}}
  - {type: variant, offset: 2228, length: 0, content: '', WYG: 臣愚以為職事修舉在於擇人不在設官苟得其人雖總管等皆能訓練士卒不得其人雖將官亦何所為况今之將官即曏之為總管等者也豈為總管等則不能舉職為將官乃能舉職乎此徒變易其名無益事實非惟無益兼復有害凡設官分職當上下相維如身之使臂臂之使指紀綱乃立今為州縣長吏及總管等官而於所部士卒有不相統攝不得差使殆如路人者至於倉庫守宿街市巡邏亦皆乏人雖於條許差將下兵士而州縣不得直差須牒將官將官往往占䕶不肯差撥萬}
  - {type: page-break, offset: 2228, content: '', id: KR4d0040_WYG_048-3a, image: WYG1094/WYG1094-0450c.png}
  - {type: variant, offset: 2229, length: 0, content: '', WYG: 有非常之變州縣長吏何以號令其衆制禦姦宄哉又頃歳以來自轉運使知州以下白直及迎送之人日朘}
  - {type: variant, offset: 2230, length: 0, content: '', WYG: 減出入導從太為蕭條供承荷擔有}
  - {type: variant, offset: 2231, length: 0, content: '', WYG: 不給觀望削弱無以威服吏民臣略舉目覩一事以證其餘西京城郭周數千里卑薄頺缺犬豕可踰又􅈆洛二水交貫其中每夜諸門扃鐍雖嚴而灘流之際人皆可以平行往來其屬水南北廵檢下所管兵士除出軍外餘數不多通判以下諸官白直來往防送倉庫守宿街市巡邏盡出其間曏者先帝建豫勅西京留守親詣嵩山起建道場其將下禁軍充白直者於條皆不得出城經宿所敢留者剰員七八人而已西京天子别都也其守禦不固如此留守前宰相重官也其侍衞單寡如此况僻小州縣其守禦之備侍衞之衆可知矣萬一}
  - {type: page-break, offset: 2231, content: '', id: KR4d0040_WYG_048-3b, image: WYG1094/WYG1094-0450d.png}
  - {type: variant, offset: 2232, length: 0, content: '', WYG: 凶校之賊驅烏合之衆突入城邑或刼質戕賊畏吏以焚燒廬舎殺掠吏民將何以制之哉此特天下太平之久習俗淳厚羣心安固賊不測虚實膽智怯弱故未敢為之耳豈可忽略謂之必無而不為之備哉今獨縁邊州軍城隍完固士卒衆多可以守禦自餘腹内州縣既無深溝高城又乏士卒羣盗猝至何以責其竭節守義不棄城竄匿或以酒食迎賊以甲兵獻賊斂民財以賂賊者乎羣盗尚爾况敵人傾國大舉長驅而來者哉易曰君子安不忘危存不忘亡治不忘亂兵法曰不恃敵之不我犯恃我之不可犯國家豈可恃即日平寧晏然高枕不以為慮謂其必不敢來乎臣愚以為河北陜西河東京東京西等路腹内州縣宜以漸候豐年農閒之際委提㸃刑獄與本處長吏相度各修築所治之城州城稍高縣城次之不必廣大所以然者高則難踰小則易守故也其縁邊屯駐兵士遇春夏無事之際委經略安撫使與轉運使公共商量减放歸住營州軍或於内地就糧勿聽怯懦將帥多有虚占以自守衛其腹内州軍量其大小𦂳慢大藩常留千餘人小州亦留數百人不得}
  - {type: page-break, offset: 2232, content: '', id: KR4d0040_WYG_048-4a, image: WYG1094/WYG1094-0451a.png}
