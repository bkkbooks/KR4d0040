  - {type: variant, offset: 2201, length: 0, content: '', WYG: 行新法以來青苗免役及賦斂多責見錢錢非私家所鑄要須貿易外求豐歳穀賤已自傷農况廹於期限不得半價盡糶所収未能充數家之餱粮不暇更留若值凶年則又無穀可糶人人賣田無所可售遂至殺牛賣肉伐桑鬻薪}
  - {type: page-break, offset: 2201, content: '', id: KR4d0040_WYG_047-14b, image: WYG1094/WYG1094-0448b.png}
  - {type: variant, offset: 2203, length: 2, content: 正月, WYG: 生計不敢復議此農民所以重困也又錢者流通之物故謂之泉布比年以來物價愈賤而閭閻益困所以然者錢皆聚於官中民間乏錢貨重物輕借使有人鬻薪糴米米價雖賤薪價亦賤故也臣愚以為宜悉罷免役錢其州縣諸色役人並依舊制委本縣令佐掲簿定差替見雇役人其衙前先召募人投充長名召募不足然後差鄉村人戸每經歴重難差遣依舊以優輕場務充酬奨所有見在免役錢撥充州縣常平本錢以戸口為率常存三年之蓄有餘則歸轉運司凡免役之法縱富强應役之人征貧弱不役之戸利於富者不利於貧者及今耳目相接猶可復舊若更年深富者安之民不可復差役矣傳家集巻四十七欽定四庫全書傳家集巻四十八宋司馬光撰章奏三十一乞罷將官狀元豐八年上右臣伏以州縣者百姓之根本長吏者州縣之根本根本危則枝葉何以得安故自古以來凡置州郡必嚴其武備設長吏必盛其侍衛非以重其權驕其人也乃所以安百姓衛朝廷也秦懲周室幹弱枝强之弊既滅六國以為天下不復用兵雖分三十六郡置郡守更以御史監之隳名城銷兵器束以苛法舉動施為皆不得自專是以陳勝吳廣以匹夫奮臂大呼郡縣莫能制多殺長吏以應之雖由其殘虐取亡亦守令無權無兵之所致也晉武帝平吳亦以為天下既一兵無所用悉去州郡兵陶璜山濤皆言州郡武備不可廢帝不聽及永寧}
