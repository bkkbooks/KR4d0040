  - {type: variant, offset: 4881, length: 1, content: 冨, WYG: 肇承基緒雖年在㓜冲而執喪臨朝率禮弗越體貌尊嚴舉止安重顒顒卭卭有老成之德華夷瞻仰無不愛戴此乃聖性自然不聞亦式實天祐皇家宗廟社稷生民之盛福也然玉不琢不成器人不學不知道儻復資學問以成之則堯舜禹湯文武何逺之有伏見近降聖旨過冬至開講筵臣竊以聖人之德無以加}
  - {type: page-break, offset: 4881, content: '', id: KR4d0040_WYG_049-1b, image: WYG1094/WYG1094-0457d.png}
  - {type: variant, offset: 4883, length: 2, content: 春秋, WYG: 孝}
  - {type: variant, offset: 4886, length: 0, content: '', WYG: 天子至於庶人莫不始於事親終於立身揚名於後世誠為學所宜先也臣曏不自揆嘗撰古文孝經指解皇祐中獻於仁宗皇帝竊慮歳久遺失不存今則繕冩為一冊上進伏乞聖明少賜省覽取進止辭轉官劄子元豐八年十二月十二日上臣伏覩中書録黄奉聖旨神宗祔廟畢執政官依故事轉遷以臣為正議大夫者竊惟英宗皇帝親政之初以宰臣韓琦等於嘉祐之末有定䇿大功保佑聖躬濟於艱難故各特遷一官今陛下以神宗皇帝大漸之際宰臣蔡確等啓廸聖心建立儲貳傳授大寳各特遷一官固亦其宜臣當是時方閒居在西京凴几末命}
  - {type: page-break, offset: 4886, content: '', id: KR4d0040_WYG_049-2a, image: WYG1094/WYG1094-0458a.png}
  - {type: variant, offset: 4887, length: 16, content: 今者濬發徳音大開言路使畎畝之民皆, WYG: 所預聞豈}
