  - {type: variant, offset: 5008, length: 0, content: '', WYG: 劄子元豐八年}
  - {type: variant, offset: 5009, length: 0, content: '', WYG: 二月上臣昨䝉恩除臣正議大夫臣三具劄子及簾前面陳至懇終未賜開允臣夙夜愧恐不能自已臣竊以為政之要惟在於賞功罰罪賞不當功則徼幸競進罰不當罪則善良憂恐亂之基也曏日神宗皇帝大漸之際臣屏居閭閻今乃與建儲受遺之臣一例遷官賞不當功何以過此陛下不知臣不肖使待罪執政執政當為陛下抑徼幸惜官職而身自冒賞何以表率他人臣非敢私飾小亷其志欲為國家慎重名器伏望聖慈矜察特賜寢罷新命所有吿身臣不敢祗受取進止辭轉官第五劄子元豐}
