  - {type: variant, offset: 2180, length: 0, content: '', WYG: 下侵欺是致欠折備償不足有破産者至於長名衙}
  - {type: variant, offset: 2181, length: 2, content: 奏先, WYG: 乆在公庭句當精熟每經重難差遣積累分數别得優輕場務酬奨徃徃致富何破産之有夫差役出於民錢亦出於民今使民出錢雇役何異割鼻飼口朝三暮四於民何所利哉又曏者役人皆上等戸為之其下等單丁女戸及品官僧道本來無役今更使之一槩輸錢則是賦斂愈重非所}
  - {type: punctuation, offset: 2183, content: /, id: KR4d0040_krp_048-bkkpn8}
  - {type: variant, offset: 2184, length: 3, content: 白劄子, WYG: 寛之也故自行免役法以來富室差得自寛而貧者困窮日甚殆非所抑兼并哀惸獨均賦役也又監司守令之不仁者於雇役人之外多取羨餘或一縣至數萬貫以冀恩賞規}
  - {type: page-break, offset: 2184, content: '', id: KR4d0040_WYG_047-14a, image: WYG1094/WYG1094-0448a.png}
  - {type: variant, offset: 2188, length: 8, content: 呈畫此指揮欲府界, WYG: 取不顧為民世世之患又國家舊制所以必差青苗戸充役人者為其有莊田家屬有罪難以迯亡故頗自重惜今雇浮浪之人充役常日恣為不法一旦事發單身竄匿何處州縣不可投名又農家所有不過穀帛與力自古賦役無出}
