  - {type: variant, offset: 4638, length: 228, content: 是以聖王重之臣不敢逺引前古竊聞太宗皇帝甞遊金明池召田婦數十人於殿上賜席使坐問以民間疾苦田婦愚戇無所隱避賜帛遣之太宗興於側微民間事固無不知所以然者恐冨貴而忘之故也每臨朝無一日不言及稼穡真宗皇帝乳母秦國夫人劉氏夲農家也喜言農家之事真宗皇帝自㓜聞之故爲開封尹以善政著聞及踐大位咸平景德之治爲有宋隆平之極景徳農田勑至今稱爲精當昔周公相成王作無逸曰先知稼穡之艱難乃逸則知小人之依蓋以一盂之飯一尺之帛莫不出於艱難人主旣知之則不肯用之於無益散之於無功驕侈之心無自而生矣伏, WYG: 恭}
