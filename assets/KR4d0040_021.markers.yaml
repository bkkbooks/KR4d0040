  - {type: variant, offset: 3977, length: 286, content: 謹具狀奏聞伏候勑旨論張方平第三狀右臣先曽上言秦鳯路經略安撫使張方平怯懦輕易乞更擇人至今未蒙朝廷施行臣竊聞拓拔亮祚年齒寖長猖狂好兵常分之外邀求無厭董氊凶悍狡獪超其父兄朝廷官爵不滿其意頗懷怨懟與契丹結婚隂相表裏此朝廷所當旰食而憂也秦州居二虜之交爲陜西四路之首軍馬民夷最號繁冨而以怯懦輕易之人守之是委羔豚於虎狼之蹊也臣竊爲國家危之况方平其他材識素無所長止以文辤致位至此姦憸貪猥上論共知今不可使之守邊事狀昭然而朝廷掩覆其過曲加保全愛一人而失一方臣竊以爲過矣伏望陛下不以邊事爲細而忽之速治方平之罪嚴加譴謫更擇沉勇暁兵之人以代其任不然必待有烽燧之警然後易之則冦已深矣謹具狀奏聞伏候勑旨, WYG: ''}
