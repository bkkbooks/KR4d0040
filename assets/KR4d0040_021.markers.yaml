  - {type: variant, offset: 2523, length: 931, content: 爲前𬋩句兖國公主宅内臣等過惡至大乞不召還近聞傳宣入内内侍省令押上件内臣梁懷吉赴公主宅依舊句當外議諠譁無不駭異臣聞太宗皇帝時姚坦爲兖王宫翊善王有過失坦輙盡言諫正王及左右皆患之左右教王詐疾踰月不朝太宗甚憂之召王乳母入宫問王起居狀乳母曰王本無疾但以翊善姚坦檢束太嚴王舉動不得自由鬱鬱成疾耳太宗怒曰朕選端士爲王僚屬固欲導王爲善今旣不能納用規諌而又詐疾欲使朕逐去正人以求自便其可得乎且王年少不知出此皆汝輩教之耳命捽至後園杖之數十召坦慰勉之太宗非不愛其子也誠以愛之則莫若納之於善若縱其所欲不忍譴訶適所以害之也齊國獻穆大長公主太宗皇帝之子真宗皇帝之妹陛下之姑於天下可謂貴矣然獻穆公主仁孝謙恭有如寒族奉李氏宗親備盡婦道愛重其夫無妬忌之行至今天下稱婦德者以獻穆公主爲首獻穆公主豈不自知其身之貴哉誠以貴而不驕然後能保其福禄全其令名故也臣謂陛下教子以義冝以太宗皇帝爲法公主事夫以禮冝以獻穆公主爲法則風化流於四方聲譽施於後丗今陛下曲徇公主之意不復裁以禮法使之無所畏憚䧟入於惡觸情任性以邀君父憎賤其夫不執婦道將何以形四方之風垂來丗之則易曰家人嗃嗃悔厲吉婦子嘻嘻終吝此言家道尚嚴不可專用恩治也伏望陛下斥逐梁懷吉等復歸前來貶竄之處其公主左右之人欲使陛下召還梁懷吉等皆教導公主爲不善之人也悉冝治其罪而逐之别擇柔和謹愿者以𥙷其缺仍戒敕公主以法者天下之公器若屢違詔命不遵規矩雖天子之子亦不可得而私庶幾有所戒懼率循善道可以永保福禄不失美名不然衆人所云甚可畏也取進止優老劄子臣聞古之聖王尊禮黄髮屬任以政者蓋以其更歷天下之事練習爲治之體故也昔鬻熊年九十見文王文王曰老矣鬻熊曰君若使臣捕虎逐麋臣已老矣使臣坐而䇿國事臣年尚少也近歳以來大臣髙年者皆不敢自安其位言事者又欲以擊搏大臣爲名從而攻之此豈爲臣盡忠至公之道哉凡言事者當爲國家進賢退不肖使其人無可取雖少壯何爲果有益於時雖老何傷也臣竊見樞宻使張昪屢以老疾辤位臣平生與昪迹不相接無絲毫恩分然竊聞其爲人忠謹清直不可干以私臣不敢上避聖主之疑下畏丗俗之謗隱忠不言以利其身伏望陛下深念宥宻之地不可任非其人先以聖意揣度若未能得賢於昪者則使昪且居其位於事亦未有曠廢也若昪必不可留則願陛下慎選德望材器爲衆所服知王體曉兵略者以代之不可以不擇其人之可否使循資累叙而爲之也取進止論, WYG: ''}
