  - {type: variant, offset: 4601, length: 0, content: '', WYG: 論皇城司廵察親事官劄子有㫖親事官决杖配下軍臣等伏聞皇城司親事官奏報有百姓殺人私用錢物休和事下開封府推鞫皆無事實欲勾元初廵察人照勘其皇城司庇䕶不肯交付臣等竊以祖宗開基之始人心未安恐有大姦隂謀無狀所以躬自選擇左右親信之人使之周流民間密行伺察當是之時萬一有挾私誣枉者則斧鉞隨之是以此屬皆知畏懼莫敢爲非今海内承平已踰百年上下安固人無異望世變風移宜有釐革而因循舊貫更成大弊乃至帝室姻親諸司倉庫悉委此屬亷其過失廣作威福公受貨賂所愛則雖有大惡掩而不問所憎則舉動語言皆見掎摭臣等常病國家擇天下賢才以爲公卿百官而猶不可信顧任此厮役小人以爲耳目豈足恃哉今乃妄執平民加之死罪使人幽繫囹圄横罹楚毒幸而不自誣服僅能辨明若更不聽有司詰問元初廵察之人少加懲戒臣恐此屬無復畏憚愈加恣横使京師吏民無所措其手足此豈合祖宗之意哉伏望朝廷指揮皇城司令送元初廵察人下開封府推問本情或别有仇嫌或察訪鹵莽各隨其狀依法施行仍自今後永爲定制庶可以塞欺罔之源絶侵寃之門以全國家至公之道取進止論復置豐州劄子嘉祐六年十二月十四日上臣等伏見國家復置豐州故城仍差人知州此誠河西險要之地修之甚便然其地勢孤絶外廹㓂境曏者王氏知州之時所部蕃族甚衆有永安來逺保寕三寨皆以蕃族守之慶厯初拓䟦元昊攻䧟州城州民及三寨蕃族盡爲所虜掃地無遺今州城之中但有丘墟瓦礫環城數十里皆草莽林麓而已若建以爲州則湏復設外寨備置官吏廣屯兵馬多積芻糧皆應調發内地之民以奉之勞費甚大此所謂徇虚名而受實弊也頃年朝廷欲修豐州城河東經畧司嫌其單外廼於其南數十里築永寕堡其地窪下居兩山間䟽惡難守今旣修豐州則永寕堡􅅧在腹内無所復用臣等以爲不若遷永寕堡於豐州故城其兵馬芻糧不更増益但擇使臣有材畧者使守之不必假以知州之名仍召募蕃漢之民使墾闢近城之田俟民物繁庶皆如其舊然後升以爲州亦未晩也取進止論上元遊幸劄子嘉祐七年正月十二日上臣等伏見今嵗以祈糓改日之故車駕併以十三十四日幸諸寺觀臣等竊惟上元觀燈本非典禮正以時和年豐欲與百姓同樂爲太平之榮觀而巳去嵗四方諸州多罹水旱鰥寡孤獨流離道路伏計陛下念此未嘗去心竊恐有司不明大體務循故事無所減損不稱陛下子愛元元之意又連日遊幸在扵聖體亦爲煩勞伏望陛下比之毎嵗特減逰觀之處以閔恤下民安養聖神天下幸甚取進止論正家上殿劄子嘉祐七年二月初四日上臣先曽上言爲前管句兖國公主宅内臣等過惡至大乞不召還近聞傳宣入内内侍省令押上件内臣梁懐吉赴公主宅依舊句當外議諠譁無不駭異臣聞太宗皇帝時姚坦爲兖王宫翊善王有過失坦輒盡言諌正王及左右皆患之左右教王詐疾踰月不朝太宗甚憂之召王乳母入宫問王起居狀乳母曰王本無疾但以翊善姚坦檢束太嚴王舉動不得自由鬱鬱成疾耳太宗怒曰朕選端士爲王僚屬固欲導王爲善今旣不能納用規諌而又詐疾欲朕逐去正人以求自便其可得乎且王年少不知出此皆汝輩教之耳命捽至後園杖之數十召坦慰勉之太宗非不愛其子也誠以愛之則莫若納之扵善若縱其所欲不忍譴訶適所以害之也齊國獻穆大長公主太宗皇帝之子真宗皇帝之妹陛下之姑於天下可謂貴矣然獻穆公主仁孝謙恭有如寒族奉李氏宗親備盡婦道愛重其夫無妬忌之行至今天下稱婦徳者以獻穆公主爲首獻穆公主豈不自知其身之貴哉誠以貴而不驕然後能保其福禄全其令名故也臣謂陛下教子以義冝以太宗皇帝爲法公主事夫以禮宜以獻穆公主爲法則風化流於四方聲譽施於後世今陛下曲徇公主之意不復裁以禮法使之無所畏憚䧟入於惡觸情任性以邀君父憎賤其夫不執婦道將何以形四方之風垂來世之則易曰家人嗃嗃悔厲吉婦子嘻嘻終吝此言家道尚嚴不可專用恩治也伏望陛下斥逐梁懐吉等復歸前來貶竄之處其公主左右之人欲使陛下召還梁懐吉等者皆教導公主爲不善之人也悉宜治其罪而逐之别擇柔和}
