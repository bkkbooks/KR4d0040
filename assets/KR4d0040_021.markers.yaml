  - {type: variant, offset: 4602, length: 2, content: 具狀, WYG: 愿者以補其缺仍戒勅公主以法者天下之公噐若屡違詔命不遵規矩雖天子之子亦不可得而私庶幾有所戒懼率循善道可以永保福禄不失善名不然衆人所云甚可畏也取進止乞優老上殿劄子臣聞古之聖王尊禮黄髪屬任以政者盖以其更歴天下之事練習為治之體故也昔鬻熊年九十見文王文王曰老矣鬻熊曰君若使臣捕虎逐麋臣已老矣使臣坐而䇿國事臣年尚少也近嵗以來大臣髙年者皆不敢自安其位言事者又欲以擊摶大臣爲名從而攻之此豈爲臣盡忠至公之道哉凡言事者當爲國家進賢退不肖使其人無可取雖少壯何爲果有益於時雖老何傷也臣竊見樞宻副使張昪屢以老疾辭位臣平生與昪迹不相接無絲毫恩分然竊聞其爲人忠謹清直不可干以私臣不敢上避聖主之疑下畏世俗之謗隐忠不言以利其身伏望陛下深念宥宻之地不可任非其人先以聖意揣度若未能得賢於昪者則使昪且居其位於事亦未有曠廢也若昪必不可留則願陛下慎選徳望材噐爲衆所服知政體曉兵畧者以代之不可以不擇其人之可否使循資累叙而爲之也取進止傳家集巻二十三欽定四庫全書傳家集巻二十四宋司馬光撰章}
