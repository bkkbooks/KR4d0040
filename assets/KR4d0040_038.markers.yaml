  - {type: variant, offset: 2167, length: 0, content: '', WYG: 聲聞云欲歸降自是至今已經數年朝廷屢召邊臣與之謀議外人往徃知之亦有邸吏傳報四方安有虜中獨不覺寤寂然無事曽無誅討之意乎臣竊疑其内挟詐謀未可信也或者諒祚久懐逆計以朝廷待之恩禮優厚無因而發故遣其部將詐降以卜之若朝廷受之則將歸曲而責直得以為背叛之名或者使其部將詐言勢孤力微不能獨制諒祚乞朝廷遣將出師為助而隂設伏兵以徼大利此二者皆未可知也若萬一有之則今日受之正墮其計中矣縱使噮側實有降心葢亦私有忿恨或别負罪惡反側不安欲倚大國之威以逼其主其所部之民未必肯盡從也雖其自言權勢之强甲兵之盛有謀善戰為民}
