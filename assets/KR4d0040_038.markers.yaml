  - {type: variant, offset: 4530, length: 929, content: 議謀殺巳傷案問欲舉自首狀臣竊以爲凡議法者當先原立法之意然後可以断獄竊詳律文其於人損傷不在自首之例注云因犯殺傷而自首者得免所因之罪仍從故殺傷法所謂因犯殺傷者言因犯他罪夲無殺傷之意事不得已致有殺傷除爲盗之外如刼囚略賣人之類皆是也律意蓋以於人損傷旣不得首恐有别因餘罪而殺傷人者有司執文并其餘罪亦不許首故特加申明云因犯殺傷而自首者得免所因之罪然殺傷之中自有兩等輕重不同其處心積慮巧詐百端掩人不備者則謂之謀直情徑行略無顧慮公然殺害者則謂之故謀者尤重故者差輕今此人因犯他罪致殺傷人他罪雖得首原殺傷不在首例若從謀殺則太重若從闘殺則太輕故酌中令從故殺傷法也其直犯殺傷更無他罪者惟未傷則可首伹係巳傷皆不可首也今許遵欲將謀之與殺分爲兩事按謀殺故殺皆是殺人若將謀之與殺分爲兩事則故之與殺亦是兩事也且律稱得免所因之罪故刼囚略人皆是巳有所犯因而又殺傷人故刼略可首而殺傷不原若平常謀慮不爲殺人當有何罪可得首免以此知謀字止因殺字生文不得别爲所因之罪也若以刼闘與謀皆爲所因之罪從故殺傷法則是闘傷自首反得加罪一等也遵所引蘇州洪祚断例案律䟽云假有因盗故殺傷人而自首者盗罪得免故殺傷罪仍科䟽旣指言故殺傷人明是因盗謀殺傷人者自從謀法當時法官誤断不可用例破條遵又引編勑謀殺人傷與不傷罪不至死者並奏取勑裁以爲謀殺已傷而罪不至死者即是自首之人案尊長謀殺卑㓜之類皆是巳傷而罪不至死不必因首也遵又引律䟽問荅條云謀殺凡人乃云是舅又云謀殺之罪首盡顯是謀殺許令自首案問皆謂謀而未傷方得首免若其巳傷何由可首凡議罪制刑當使重輕有叙今若使謀殺巳傷者得自首從故傷法假有甲乙二人甲因闘毆人鼻中血出旣而自首猶科杖六十罪乙有怨讎欲致其人於死地暮夜伺便推落河井偶得不死又不見血若來自首止科杖七十罪二人所犯絶殊而得罪相埒果然如此豈不長姦况阿云嫌夫醜陋親執腰刀就田野中因其睡寐斫近十刀斷其一指初不陳首至宫司執録將行拷捶勢不獲已方肯招承情理如此有何可憫朝廷貸命編管巳是寛恩而遵更稽留不斷爲之伸理欲令天下今後有似此之類並作减二等斷遣竊恐不足勸善而無以懲惡開巧僞之路長賊殺之源姦邪得志良民受弊非法之善者也臣愚以爲大理寺刑部所定巳得允當難從許遵所奏作案問欲舉减等而科今來與王安石各有所見難以同共定奪伏乞朝廷特賜裁酌施行温國文正公文集卷第三十八, WYG: ''}
