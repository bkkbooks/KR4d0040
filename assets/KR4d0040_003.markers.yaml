  - {type: variant, offset: 461, length: 392, content: 倚日本刀歌同聖民過楊之美聴琵琶女奴彈啄木曲觀諸公所贈歌明日投此爲謝晚歸書室呈君倚偶成同君倚過聖俞聖俞恵詩復以二章爲謝和君倚藤牀十二韻旬慮十七韻呈同舍夜坐二月中旬慮問過景靈宫門始見花卉呈君倚和始平公夢中有懐歸之念作詩始得兩句而窹因足成章和鄰幾六月十一日省宿書事和仲通秘閣校理張洞苦暑思長安幕中望終南秋雪呈鄰幾和仲通追賦陪資政侍郎呉公臨虚亭燕集寄呈陜府擇之學士秋意呈鄰㡬呉充次韻和掃棗好草倒又對前韻窺梨卑枝垂偏眠船舷邉後牖有朽柳聶著作三舅謫官長沙作耐暑亭書來索詩走索不疑㕔薜荔及竹和公逹過潘樓觀七夕市酬鄰幾問不飲栽菊鄰㡬詩曰君實不飲酒庭下多栽菊不知黄花開奈此盃中緑凌晨煙露滋後日風霜促欲表君苦心宜種子猷竹次韻和不疑假書鄰㡬知方酣寢爲詩通意八月十七日夜省直紀事呈同舍送雷太簡和王介甫明妃曲和不疑送虜使還道中聞鄰幾聖俞長逝作詩哭之虞帝憫獄謡和冲卿三哀詩江鄰㡬梅聖俞韓欽聖窮免謡二首闕和介甫烘虱, WYG: 誰}
