  - {type: variant, offset: 8, length: 178, content: 太常致齋韓廷評維見過閽人不時納韓去乃知爲詩謝之送守哲歸廬山清明後二日同鄰幾集賢校理江休復景仁次道中道國子監主簿宋敏求興宗元明秉國太理評事韓維如晦國子監直講裵煜公疎篆石經胡恢飲趙道士東軒以日暮天無雲春風扇微和爲韻得和字和端式十題春塘冰煙霽鐘汀洲蘋漁洲火寒谿石幽谷泉秋原菊垂崖鞭古木隂天外峯晉康陳生庸家世以孝悌聞有異木連理生其庭郡欲旌表其門不果王魯玉爲之求詩於, WYG: 初登}
