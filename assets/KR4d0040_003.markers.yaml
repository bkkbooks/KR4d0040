  - {type: variant, offset: 7880, length: 368, content: 鄰幾知方酣寢爲詩通意江翁順天和心迹兩夷簡雖如邉韶寢且異宰予懶平居無時閒經史自課限高歌慕翰林鳴琴寫中散翛然物外人強為章綬綰官舎苦秋霖瞬息聊休眼勤勩巳有餘宴安何愧赧借書誰敢驚欹枕尚未暖不疑神驥才垂耳困皁棧碌碌隨吾儕拜揖把手版毋嫌朱墨倦騰舉已為晚御名勿思山林山林付愚孱八月十七日夜省直紀事呈同舍窮秋直省舍大雨吁可畏九河飜層空入夜愈恣睢置床東壁根時有塗墍墜颯颯勢将摧怵惕不成寐中宵抱衾立呼燭乆方至徙之近西偏禂帳不能備飛蚊胡不仁忍此加啄噬避煩只深蔵悒悒靣䝉被須臾漏轉劇枕褥亦沾漬雖起欲何之室中無燥地展轉遂逹旦耿耿負憂悸因思閭井民餬口仰執技束書巳連旬妻兒日憔悴囊錢與盎米薪米同時匱敗衣不足準搏手坐相視予今幸巳多敢不自知愧無謀忝肉食念爾但増欷送雷太簡南山有白雲應物任所適欻来非有心倐去還無迹甘澤望沾浹嘉生待蘇息無爲遽收卷復入巖間石和王介甫眀妃曲胡雛上, WYG: 傳家集巻三宋司}
