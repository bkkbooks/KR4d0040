  - {type: variant, offset: 8249, length: 1055, content: 唱胡歌錦車巳駕白槖駝眀妃揮淚辭漢主漢主傷心知奈何宫門銅環雙獸靣囬首何時復来見自嗟不若住巫山布䄂蒿簪嫁郷縣萬里寒沙草木稀居延塞外使人歸舊来相識更無物只有雲邉秋鴈飛愁坐泠泠調四絃曲終掩靣向胡天侍兒不觧漢家語指下哀聲猶可傳傳徧胡人到中土萬一佗年流樂府妾身生死知不歸妾意終期窹人主目前美醜良易知咫尺掖庭猶可欺君不見白頭蕭太傅被䜛仰藥更無疑和不疑送虜使還道中聞鄰幾聖俞長逝作詩哭之昨夕郵吏来叩門致書凾呼奴取以入就火開其緘不疑賦長篇發自燕之南痛傷江與梅継踵良人殱噫嗟知其二尚未知其三請從北轅後覼縷爲君談鄰㡬雖乆病始不妨朝叅飲歠䆮衰少厥逆生虗痰逮於易簀辰皮骨餘崆嵌遺書屬清儉終始眞無慙聖俞食寒氷外以風邪兼愚醫暴下之結轖候愈添惙惙氣上走不復容鍼砭自言從良友地下心亦甘欽聖體素强藥石性所諳平居察舉措敢以不夀占一朝蹔歸卧簿領不廢簽訃来衆皆愕未信猶闚覘興言念三子舉𬒮涕已霑英賢能㡬何逝者迹相銜君疑天上才難得帝人貪我疑人間美多取神所嫌茫茫幽眀際蓍蔡難窮探憂来不可忘終日心厭厭虞帝虞帝老倦勤薦禹爲天子豈有復南廵迢迢渡湘水至徳逺無象異論紛紛起意疑大聖人姦憸亦如己乃知中下士無由逃謗毀憫獄謡五刑象天有震耀上聖本以防姦邪法官由来少和泰臯陶之靣如削瓜况於秦漢任酷吏死人籍籍如亂麻揺椘之求靡不得小者勍刖大滅家君不見古時牢獄地幾多冤骨埋黄沙和呉沖卿三哀詩江鄰㡬梅聖俞韓欽聖天生千萬人中有一儁傑奈何喪三賢前後纔暮月鄰㡬任天資浮飾恥澡刷朝市等山林衣冠同布褐外無涇渭分内有淄澠别逢時敢危言慷慨誰能奪聖俞詩七千歴歴盡精絶初無追琢勤氣質禀清㓗負兹驚世才未甞自標掲鞠躬隨衆後側足畏蹉跌欽聖渥洼駒初生巳汗血雖有絶塵踪不失和鸞節冝爲清廟器儼雅應鍾律衆論仍共然非從友朋出群材方大来軮軋扶帝室誰云指顧間聮翩化異物弔縗哭未巳病枕氣巳竭同爲地下逰擕手不相失紳紱頓蕭條相逢但嗟咄誦君三哀詩終篇涕如雪眉目尚昭晣笑言猶髣髴肅然来悲風四望氣蕭瑟和王介甫烘蝨天生萬物名品夥嗟爾為生至么麽依人自活反食人性喜伏蔵便垢涴晨朝生子暮生孫不日蕃滋踰萬箇透疎縁隙巧百端通夕爬搔不能卧我歸彼出疲奔命偹北驚南厭搜邏所擒至少所失多捨置熏燒無術奈加之炭上猶晏然相顧未知亡族禍大者洋洋迷所適奔走未停身巳堕細者懦怯但深濳乾死縫中誰復課黒者抱髪亦憂疑逃入幧頭黙相賀腥腥騰起逺襲人袖擁鼻端時一唾初雖快意終自咎致爾殱夷非爾過吾家篋笥本自貧况復爲人苦慵惰體生鱗甲未能浴衣不離身成脆破朽繒壊絮為淵藪如麥如麻寖肥大虚腸不免須侵人肯學夷齊甘死餓醯酸蜹聚理固然爾輩披攘我當坐但思努力自㓗清群蝨皆當逺逋播温國文正公文集卷第三, WYG: 光撰}
