  - {type: variant, offset: 2191, length: 578, content: 和聖俞詠昌言五物括蒼石屏主人小石屏得之括蒼山括蒼道里逺致此良亦難層崖萬仭餘騰出浮雲端呉兒采石時蘿蔓愁攀縁石文状松雪毫髪皆天然置之坐席旁清風常在顔願君善蔵蓄永日供餘閒御名勿示要人坐致求者繁將使括蒼民吁嗟山谷間淡樹石屏昔行鞏洛間馬瘦天復隂寒煙淡不收一拂横長林當時無畫工負此清賞心今朝石上迹歴歴皆可尋䡖素巳紛泊老榦仍蕭森坐令髙興還野氣生衣襟丹青不耐乆風日易消侵何如造化眞更彼歳月深昌言家素盆購此糜百金請鐫好事名千古無銷沈白鶻圖白鶻日邉来一息萬里遥横飛碧海晴六翮寒蕭蕭輕如朔雪花逈與長風飄傾身疊紺爪吟嘯何嘵哮瞥來疾驚電欻起先扶揺遂令狐與狸不敢矜凶妖罻羅不可取滅影還雲霄世人莫得見粉繪圖輕綃凛然堂牖間霜氣生春朝風雨夜如墨古木無鳴梟懷素書上人工書世所稀於今散落無復遺君從何處獲數幅敗絹蒼蒼不成軸雲流電走何縱横昬醉視之雙目明烈火焼林虎豹慄疾雷裂地龍蛇驚須㬰掛壁未收卷隂風颯颯來吹面秪疑神物在闇中寳秘不令関俗眼嗟予平生不識書但愛意氣豪有餘欲求數字置座側安得滿斗千金珠縛虎圖孫生非畫師趣尚頗竒偉爲人少諧合不肯畜妻子時時入深山信足動百里蕭然坐盤石盡日曾不起精心忽有得縦筆何恢詭萬象皆自然神工相表裏流傳落人間萬金易寸紙君家縛虎圖用意尤精緻雖云鎻紐牢觀者猶披靡昔聞劉綱妻制虎如犬豕繋之牀脚間垂頭受鞭箠孫生儻未見畫此亦何理明知非世人羽化實不死願君它日歸置之成都市必有乗槎人庶㡬能辨此, WYG: ''}
