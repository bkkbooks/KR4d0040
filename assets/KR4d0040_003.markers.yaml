  - {type: variant, offset: 7798, length: 1, content: 奈, WYG: 涼逸一字逸二句清風滿四境豈獨華榱下不若楚臺人披襟獨蕭灑芙蕖軒荷花爛漫紅不見方塘水嶣嶤結飛閣苒惹清香裏露重忽欹側翩然翠禽起惜花亭春意復蹉蛇園林日愁寂枝邉緑隂重砌下紅英積兹亭花最繁飄零尤可惜竹軒茂密正當軒欹垂欲侵案風枝忽交戛月影爭凌亂誠嘉君子心匪直林亭玩和昌言官舎十題石榴花靈根逐漢臣逺自河源至流離徧中壤今兹盡苖裔畏日助􅇻紅凍雨滌濃翠宜􅂝避暑客花下縱横醉薏苡佳實産南州流傳却山瘴如何馬伏波坐取丘山謗夫君道義白復為神明相厲氣與流言安能逞無狀石蘭楚人歌紫蘭華禁無傳乆循名意兹是誰得明眞否天憐菊性孤秀發秋風後固令芳物生聊作黄花友萱草葉濯宿露翠花迎朝日黄昔誰封殖}
