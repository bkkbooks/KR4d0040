  - {type: variant, offset: 7800, length: 1, content: 盃, WYG: 儼列侍髙堂逹生隠於吏孰為行與藏逍遥玩永日自無憂可忘蜀葵白若繒初斷紅如顔欲􅋳坐疑僊駕嚴幢節紛駢羅物性有常妍人情輕所多菖蒲儻日秀棄擲不吾過畦蔬隙土惜荒棄翦治成春畦講雩時澤洽葵荏髙參差釃渠若貫脉䟽塍如畫棊為吾謝來客桔橰毋語機水紅夢想水鄉遊階庭植籠古宛如江外行髙帆落寒浦煙枝靜踈秀風穗閒低舉於今㸔未好漠漠冝秋雨甘菊野菊細瑣物籬間私自全徒因氣味殊不為庖人捐采升白玉堂薦以黄金盤願若南陽守永扶君子年蘭賢者非無心園夫自臨課蓻植日繁滋芬芳時入座青蔥春茹擢皎潔秋英墮正苦郢}
