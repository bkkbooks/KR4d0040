  - {type: variant, offset: 5393, length: 1, content: 荅, WYG: 上許州吴給事書月日具官光謹再拜獻書某官執事光昔者未冠為書生從師友間得執事所對直言䇿及後䇿觀之喟然歎曰道之不明乆矣蔽於古者迃大而不可從溺於今者淺薄而不足用今執事論髙而不悖於今義實而不戾於古所譏切皆當世之病所區畫皆應事之宜粲然虞夏商周之道可以覆手而取舉足而登也非夫深明於道之本其孰克以致此哉由是私自望曰異日儻得出入門下承事之間以受一言之益使皦然暏道之正渙然識道之歸事君行己知所取捨而無所疑則私願足矣及舉進士幸免黜去始敢進謁朝之公卿大夫當是時蓄才徳負名聲出入帝廷榮耀輝赫照人者衆矣光皆未及徃見首求執事之門而叩之誠欲急於學術之明而成宿昔之志也并裒其所為文以為始見之贄執事不責其僣而辱賜之詩以振飾之且曰道為根抵言為華由來表裏相經緯光由是益知君子務知大者逺者則光願受學之志愈固而專矣不幸光獻文之明日西出之官自是巳來非奔走吏道則在苫凷衰絰之中矣東西南北﨑嶇􅇄坎過闕門上逆旅爨未及燃巳復出外矣是以役役十年而不得卒業也去年罷滑臺從事至京師則執事既為天子輔弼臣矣光賤士也其敢不自分限而屡以其不肖之跡汙辱門下之塵稱道舊恩以求瞻望几杖哉必若是而為天下之人謂之不營禄位而為道則難矣光是以屏身退䖏不敢屡進以煩將命非為輒自踈外誠懼不知者不能察其區區而有塵累於至公也今聖主以許田股肱大郡屈煩執事蹔鎮治之光然後敢復叙昔日之知而求畢其戇愚之志夫肝鬲之所崇聚而欲杼展於左右者固不可立談而盡也是敢復繕綴近所為文凡五巻而薦之非敢以為文也貴露下情而巳伏惟亮其狂簡之誅而矜其自㓜及長企仰之意副其所以來求考正道義之誠則沒齒衘戴盛徳永永為執鞭秉轡門下之士矣不宣光惶懼再拜答胙城郭大丞書光頓首再拜竊以前世郡縣以來朝廷唯置太守都尉令長自他掾屬皆官長所自辟除供趨走治文書而巳今幕府吏猶古之掾屬也職至輕位至㣲獨命於朝廷差異耳執事以老成之徳任百里之重官為三丞著籍於朝雖大君子卑遜不以自重然考之古視之今其事任位序不輕章矣而嵗時月朔必以賀牘為賜辭恭禮備若小邑長之事牧伯然此豈光之所能堪哉是以日夜鞠躬重足繼為書啟布之左右乞停此議以安反側而執事好謙之志確然愈固雖於盛徳益有光美將使無似之軀於何自置殆非所以相全愛之道也廼者韋城張祕丞亦然光具此意因書請焉韋城悟其不可幸賜惠許獨執事未炤愚欵祈請喋喋不垂允納每得一紙流汗霑足光聞君子與人恭而有禮固不若此也今不敢避煩再薦言庶㡬髙明垂意察古今之體酌重輕之宜凡此過禮率從翦削時有惠訓手筆徃來使得泰然自安無負踧踖幸之大者不宣光頓首再拜别劉孝叔雜端手啟光再拜前日暫得詣别悵戀何可勝言比宿起居何如舟艦具未觧維果在何時恭惟道勝名立餘無可貴外物土芥固不足以滑和唯冀親近藥物益自愛重區區所禱不宣光再拜與范堯夫經略龍圖書光啟昨在洛中及至京廣兩於河中逓次得所賜書值光治装赴陳州又得㫖詣闕尋又忝左省之命怱怱事多乆不修報明恕必察其非踈懈也曏承就移慶帥既踐世官復修舊治計堯夫必樂然就職然士論所􅓹欎者猶多也光今日忝竊皆由堯夫素加誨誘重以推挽其感戢固不在言今嵗大暑異常邉地必稍愈觸熱飲冷更祈莭慎不宣光再拜與范堯夫經略龍圖第二書光愚拙有素見事常若不敏不擇人而盡言此才性之蔽光所自知也加之閒居十五年本欲更求一任㪚官守候七十即如禮致事乆絶榮進之心分當委順田里凡朝廷之事未甞掛慮况數年以來昏忘特甚誠不意一旦冒居此地䝉人主知待之厚特異於常義難力辭黽勉就職故事多所遺忘新法固皆靣牆朝中士大夫百人中所識不過三四如一黄葉在烈風中㡬何其不危墜也又為世俗妄被以虚名不知其中實無所有上下責望不輕如何應副得及荷堯夫知待固非一日望深賜教督以所不及聞其短拙随時示諭勿復形迹此獨敢望於堯夫不敢望於佗人者也光再拜答}
