  - {type: variant, offset: 5026, length: 0, content: '', WYG: 欽定四庫全書傳家集巻五十三宋司馬光撰章奏三十六舉張舜民等充館閣劄子元祐元年上臣今月二十四日准尚書省劄子准二十二日詔書節文執政大臣冝各舉文學政事行誼之臣可以充館閣之選者三人臣竊見奉議郎張舜民材氣秀異讀書能文剛直敢言竭忠憂國通直郎孫凖學問優博文辭宏贍行義無缺乆淹下僚河南府左軍廵判官劉安世才而自晦愿而有立力學修已恬於進取其人並堪充館閣之選如後不如所舉臣甘當同罪取進止五月三日尚書省劄子光所患已安惟足瘡有妨拜跪不候叅假時放謝仍權免赴前後殿起居許乗轎子三日一至都堂聚議或門下省治事辭三日一至都堂劄子元祐元年上臣伏覩中書省録黄今月二日奉聖㫖以臣所患已安惟足瘡有妨拜跪不候參假特放正謝仍權免赴前後殿起居許乗轎子三日一至都堂聚議或門下尚書省治事者臣聞命震恐無地自處竊念臣臓腑雖安飲食如故但兩足無力瘡口未合歩履艱難拜起不得以此未果朝參至於數日一至政事堂乃唐世以來宿德元老髙年有疾朝廷尊禮特降此命豈伊微臣所敢倫擬况臣自正月二十一日請朝假至今百三十餘日豈有未見君父輒赴省供職况臣於病中除左僕射雖累具劄子辭免未􅂪開允仍􅂪就家賜以告身亦未敢祗受方俟入覲天顔面陳至懇豈可遽治尚書省事伏望聖慈俟臣歩履有力拜起得成參假了日與諸執政一例供職貴於微軀差得自安所有今月二日指揮乞賜寢罷取進止内降付中書省許肩輿至内東門扶掖入對小殿辭入對小殿劄子元祐元年上臣今月二日聞有聖㫖令臣不候參假特放正謝仍權免赴前後殿起居許乗轎子三日一至都堂聚議或門下尚書省治事臣以恩禮太優不敢輒當尋具劄子辭免今月四日又覩中書省録黄奉聖㫖依前降指揮不許辭免仍令閤門告示許肩輿至内東門外令男扶掖至小殿引對特免起居令引見前一日聞奏如此則禮數愈重尤不敢當臣竊惟富弼三世輔臣德髙望重神宗皇帝想見其人故特制此禮乃自古所無顧臣何人敢與為比况親屈乗輿特御小殿以臣勤君其罪至大縱陛下優借而天威咫尺恐隕越隨之似此異數臣决不敢受只候垂簾日於延和殿引見并乞上殿然事有不得已者雖知僭越不得不承順聖恩臣即目上下馬未得及足上有瘡深惡馬汗欲乞如今聖㫖許權乗轎子出入及入内至常時下馬處下轎子又臣兩足無力若無人扶掖委實全拜起不得欲乞今來入見及將來每遇入對並權許令臣男康入殿遇拜時扶掖候痊安日皆復舊規如此則曲成之仁已踰於天地非臣隕身䘮元所能報塞所有其餘恩禮並乞寢罷取進止三省同奉聖㫖令乗轎子至崇政殿門外於延和殿垂簾日引對餘並依前降指揮辭男康章服劄子元祐元年上臣乆在病假今月十二日於延和殿入見并辭免新命以兩足無力拜起不得聖恩特許令臣男康入殿扶掖臣既不得請臣男復賜章服父子忝竊誠不自安所有臣男恩命乞賜寢罷取進止乞與諸位徃來商量公事劄子元祐元年上臣近奉聖㫖許臣乗轎子三日一次至都堂聚議伏縁三省樞密院各有職事難以臣故必令三日一聚議檢㑹去嵗曽有指揮遇假日有公事許於東西府聚議其東西府近北舊有便門臣欲乞於近南更開一便門臣今縁足疾未愈乞遇假日或日晩執政出省後有司合商量公事許乗小竹轎子徃諸位商量其執政有欲商量公事者亦許來臣本位更不一一奏聞所貴論議詳盡事無留滯取進止}
