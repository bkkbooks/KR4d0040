  - {type: variant, offset: 271, length: 2138, content: 而節義立於下有以姧回巧僞致冨貴者不爲清議所容此乃徳化之本源王者所先務不可忽也熹平中詔引諸生能文賦者待制鴻都門下蔡邕力爭以爲辭賦小才無益於治不如經術自魏晉以降始貴文章而賤經術以詞人爲英俊以儒生爲鄙樸下至隋唐雖設明經進士兩科進士日隆而明經日替矣所以然者有司以帖經墨義試明經專取記誦不詢義理其弊至於離經析注務隱爭難多方以誤之是致舉人自㓜至老以夜継晝腐脣爛舌虚費勤勞以求應格詰之以聖人之道瞢若靣墻或不知句讀或音字乖訛乃有司之失非舉人之罪也至於以賦詩論策試進士及其末流專用律賦格詩取捨過落擿其落韻失平側偏枯不對蜂腰鶴膝以進退天下士不問其賢不肖雖頑如跖蹻苟程試合格不廢髙第行如淵騫程試不合格不免黜落老死衡茅是致舉人專尚辭華不根道德渉獵鈔節懷挾勦剽以取科名詰之以聖人之道未必皆知其中或遊處放蕩容止輕儇言行醜惡靡所不至者不能無之其爲弊亦極矣神宗皇帝深鍳其失於是悉罷賦詩及經學諸科專以經義論策試進士此乃革歴代之積弊復先王之令典百丗不易之法也但王安石不當以一家私學欲蓋掩先儒令天下學官講解及科場程試同已者取異己者黜使聖人坦明之言轉而䧟於竒僻先王中正之道流而入於異端若已論果是先儒果非何患學者不棄彼而從此何必以利害誘脅如此其急也又黜春秋而進孟子廢六藝而尊百家加之但考校文學不勉勵德行此其失也凡謀度國事當守公論不可希時又不可徇俗冝校是非之小大利害之多少使質諸聖人而不謬酌於人情而皆通稽於上古而克合施之當丗而可行然後爲善也今國家大議科埸之法欲盡善盡羙以臣所見莫若依先朝成法合明經進士爲一科立周易尚書詩周禮儀禮禮記春秋孝經論語爲九經令天下學官依注䟽講說學士慱觀諸家自擇短長各從所好春秋止用左氏傳其公羊榖梁陸淳等說並爲諸家孟子止爲諸子更不試大義應舉者聽自占習三經以上多少隨意皆須習孝經論語於家狀前開坐習某經某經又毎歳委陞朝文官保舉一人不拘見在任不在任是夲部非本部各舉所知若係親戚亦於舉狀内聲說其舉狀稱臣竊見某州某縣人某甲有何行能臣今舉堪應經明行修科於後不如所舉臣甘當連坐不詞候奏狀到朝廷下禮部貢院置簿各分逐路抄録本人姓名注舉主官位姓名於其下仍下夲州出給公據付夲人収執及令夲州亦如貢院置薄抄録准備開科埸日考驗公據其舉狀旣上之後若所舉之人犯贓私罪至徒以上情理重及違犯名敎候断訖仍収坐舉主奏乞朝廷取勘施行其人未及第者减五等巳及第者減三䒭坐之一如舉選人充京官法臣竊料此法𥘉行其奔競屬請固不能免若朝廷必坐舉主無有所赦三五人後自皆慎擇其人不敢妄舉如此則士之居郷居家獨處闇室立身行已不敢不慎惟懼玷缺有聞於外矣所謂不言之敎不肅而成不待學官日訓月察立賞告訐而士行自羙矣毎遇開科埸其有舉主者自稱應經明行修舉仍於所投家狀前開坐舉主官位姓名有司撿㑹簿上合同方許収接其無舉主者只稱應郷貢進士舉如常法毎舉人三人以上自相結爲一保止保委是正身及是夲貫不曽犯真刑無隠憂匿服此外皆不保其夲州及貢院考試並依舊法差封彌謄録監門廵鋪官程試之嚴加檢察相聚傳義傳本懷挾代筆違者扶出第一塲先試孝經論語大義五道内孝經一道論語四道先湏備載正文次述注疏大意次引諸家異義次以己見評其是非以援據精詳理長文優者爲通其次爲粗援據䟽略理短文拙者爲否三通以上爲合格不合格者先次駮放合格者牓引次埸就試如舊試經學諸科法或合格人數太少則委試官臨時短中求長詳酌放過次埸試尚書次埸試周禮次埸試儀禮次埸試禮記次埸試春秋次埸試周易大義各五道令舉人各隨所習經書就試考校過落如孝經論語法次埸試論二道一道於儒家諸子書内出題一道於歴代正史内岀題次埸試策三道皆問時務考䇿之日方依解額及奏名人數定去留編排髙下以經數多者在上經數均以諭策理長文優者在上其經明行修舉人並於進士前别作一項出牓解發及奏名至御前試時務策一道千字以上封彌官於號上題所明經數及舉主人數候考校詳定畢編排之時亦以經數多者在上經數均以策理長文優者在上文理均以舉主多者在上其經明行修舉人亦於進士前别作一項編排先放及第其推㤙注官比進士特加優異它時選擇清要官館閣臺諌等並湏先取經明行修人其舉主姓名常於官告前聲說如此則舉人皆務尊尚經術窮聖人指趣不敢不精旁覧子史不敢不博又不流放入於異端小說講求時務亦不敢不知所得之士旣有行義又能明道又能博學又知從政其爲國家之用豈不賢於今日之所取乎所有今来乞復詩賦者皆嚮日老舉人止習詩賦不習經義應舉不得故爲此說欲以動揺科埸制度爲已私便朝廷若不欲棄捐舊人候將來科埸進士有特奏名者令試詩賦隨其優劣等第推㤙亦無傷也不可以此輕改成法復從弊俗誤惑後生若以爲文章之士國家所不可無即乞試夲經合格日投狀乞試雜文於試論次埸引試或律詩或歌行或古賦或頌或銘或賛或四六表啓臨時委試官出題目試某文定篇數字數共湏及五百字以上取辝采髙下者爲合格候得解及奏名及第日編排姓名髙下各在數經同等人之上如此則文章之士亦不乏矣至於律令敕式皆當官者所湏何必置明法一科使爲士者䂊習之夫禮之所去刑之所取爲士者果能知道義自與法律冥合若其不知但日誦徒流絞斬之書習鍜錬文致之事爲士已成刻薄從政豈有循良非所以長育人材敦厚風俗也朝廷若不欲廢棄巳習之人其明法曽得解者依舊應舉未曽得解者不得更應則収拾無遺矣臣愚所見如此伏乞以臣所奏及禮部等官所議謗國子監門及徧下諸州有州學處牓州學門令舉人限一月内投狀指定何法爲善仰夲州附逓以聞候到京齊足更委其他執改看詳叅酌從長施行取進止賑濟劄子, WYG: ''}
