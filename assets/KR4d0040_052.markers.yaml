  - {type: variant, offset: 3565, length: 240, content: 乞先行經明行修科劄子元祐元年上臣先上言乞毎歳委陞朝文官保舉一人應經明行修科與進士並置程試一如進士惟扵及第後推恩優異以勸勉天下舉人使敦修士行昨巳有朝旨來年科塲且依舊法施行竊聞近有聖旨其進士經義並兼用注䟽及諸家之說或己見仍罷律義先次施行臣竊詳朝廷之意盖爲舉人經義文體專習王氏新學爲日巳乆來年科塲欲兼取舊學故有此指揮令舉人豫知而習之臣所乞置經明行修科者欲使舉人知向去科塲朝廷敦尚行義不專取文學所以美教化厚風俗比於經義文體尤爲要切冝使舉人豫知欲乞亦降朝旨先次施行况與進士舊法兩不相妨取進止, WYG: ''}
