  - {type: variant, offset: 15, length: 255, content: 乞撫納西人劄子詔意乞先行經明行修科劄子辭接續支俸劄子請罷將官劄子起請科場劄臣伏覩朝廷改科埸制度第一場試夲經義第二場試詩賦第三場試論第四埸試策試新科明法除斷案外試論語孝經義奉聖旨令禮部與兩省學士待制御史臺國子監司業集議聞奏臣竊有所見不敢不以聞凡取士之道常以德行爲先文學爲後就文學之中又當以經術爲先辭采爲後是故周禮大司徒以六德六行賔興萬民漢以賢良方正孝廉質樸敦厚取士中興以後取士尤爲精慎至於公府掾屬州從事郡國計吏丞史縣功曹郷嗇夫皆擇賢者爲之苟非其人則爲丗所譏貶是以人人思自砥礪教化興行風俗純厚乃至後丗陵夷雖政刑紊於, WYG: 元祐元年}
