  - {type: variant, offset: 5523, length: 0, content: '', WYG: 既賦以純美兮胡有徳而不年榮祿何後兮零落何先幾日不見兮邈然九泉士䘮師友兮國亡俊賢綠耳顛躓兮璵璠棄捐冥冥不可求兮杳杳不可追獨行過門兮怳焉自疑車馬不見兮逺行何之忽思長逝兮涕}
