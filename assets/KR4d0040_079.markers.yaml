  - {type: variant, offset: 3184, length: 276, content: 歲讀史不如一日聞公論此皆光親所覩聞當時士大夫所共知可謂實録而無愧矣公名高扵世歐陽公以文䧺天下固不待光言而後人信之然歲月益乆識公者益寡竊懼後之人見歐陽公之文以為如世俗之銘誌但飾虗美以取悅其子孫耳故冒進越之罪嗣書其末譬猶捧土以培泰山匊水以沃大河彼豈賴此以爲髙深㢤盖志在有以益之不自知非其任也書孫之翰唐史記後孫公昔著此書甚自重惜嘗别緘其槀扵笥必盥手然後啓之謂家人曰萬一有水火兵刃之急佗貨財盡棄之此笥不可失也每公私少間則增損改易未嘗去手其在江東爲轉運使出行部亦以自随過亭傳休止輒修之㑹宣州有急變乗馹遽往不暇挈以俱旣行於後金陵大火延及轉運𪠘含弟子察親負其笥避扵沼, WYG: 吳氏}
