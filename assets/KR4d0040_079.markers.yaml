  - {type: line-break, offset: 3635, content: '', id: KR4d0040_SBCK_079-9a02}
  - {type: variant, offset: 3650, length: 0, content: '', WYG: 非識慮高絶能如是乎古之人稱有國有家者其興衰無不本於閨門今於夫人益見古人之可信也銘曰貧不以汚其夫之名富不以為其子之累知力學可以顯其門而直道可以榮於世勉夫敎子底於光大夀不充徳福宜施於後嗣敘清河郡君元豐六年作清河郡君張氏冀州信都人禮部尚書致仕存之女端明殿學士司馬光之妻也年十六適司馬氏夫登朝封清河縣君及為學士改郡君年六十元豐五年正月壬子晦終於洛陽三月辛巳晦𦵏涑水先塋君性和柔敦實自始嫁至於瞑目未嘗見其有忿懥之色矯妄之言人雖以非意侵加黙而受之終不與之辨曲直已亦不復貯於懐也上承舅姑旁接娣姒下撫甥姪莫不恱而安之御婢妾寛而知其勞苦無妬忌心嘗夜濯足婢誤以湯沃之爛其一足君批其頰數下而止病足月餘方愈故其沒也自族􅊚至於厮養無親踈大小哭之極哀久而不衰咸出於惻怛非外飾也内外無一人私議其短者兹豈聲音笑貌之所能致邪平居謹於財不妄用自奉甚約及余用之以賙親戚之急亦未嘗吝也始余為學官笥中衣無幾一夕盗入室盡巻以去時天向寒衾無纊絮客至無衫以見之余不能不歎嗟君笑曰但願身安財須復有余賢其言為之釋然近世墓皆有誌刻石摹其文以遺人余以為婦人無外事有善不出閨門故止敘其事存於家庶}
  - {type: page-break, offset: 3650, content: '', id: KR4d0040_WYG_078-19b, image: WYG1094/WYG1094-0719d.png}
  - {type: page-break, offset: 3650, content: '', id: KR4d0040_WYG_078-20a, image: WYG1094/WYG1094-0720a.png}
  - {type: page-break, offset: 3650, content: '', id: KR4d0040_WYG_078-20b, image: WYG1094/WYG1094-0720b.png}
  - {type: variant, offset: 3651, length: 0, content: '', WYG: 後世為婦者有所矜式耳華隂侯仲連墓誌銘熙寧二年作華隂侯仲連字齊賢魏恭憲王元佐之曽孫郇國}
  - {type: variant, offset: 3652, length: 0, content: '', WYG: 允成之孫遂昭裕公宗顔之長子母曰太原郡君郭氏初除右内率府副率歴率府率右千牛衛将軍右監門衛大将軍英宗即位遷右武衛大将軍撫州刺史今上即位遷右羽林軍大将軍辰州團練使侯㓜不好弄長而樂善學尤精於漢書昭裕公素好學喜為詩藏書萬巻侯能嗣承其志目其詩曰貽慶集熙寧二年五月戊子以疾終享年三十有六上為之輟視朝一日追贈華州觀察使封華隂侯夫人長安縣君劉氏男二人長曰士轡蚤卒㓜曰士頖右内率府率女六人四早卒二未嫁以某年十一月癸酉𦵏永安縣銘曰昭裕愛子以詩書敎名而藏}
  - {type: page-break, offset: 3652, content: '', id: KR4d0040_WYG_078-21a, image: WYG1094/WYG1094-0720c.png}
  - {type: variant, offset: 3654, length: 0, content: '', WYG: 在則傚能守富貴為諸侯孝右屯衛大将軍令邦墓誌銘熙寧二年作右千牛衛大将軍令邦字安國冀康孝王惟吉之曾孫丹陽僖穆王守節之孫右龍武軍大将軍隴州防禦使世符之子也母曰南陽縣君張氏将軍生五年除太子内率府副率英宗即位遷右監門率府率今上踐阼遷右千牛衛将軍熙寧二年五月甲午遇疾卒年十九贈右屯衛大将軍治平初英宗詔宗子無㓜長皆就學差其年為大中小三品各置師以敎之将軍時年十二從父南康修孝王愛其才性命為小學録以表率群兒及年十五以新制試孝經論語於大宗正司二宗正以其誦習􅇰精屢稱歎之将軍起謝不敏拜於牀下衆益美其警悟而不伐遂升中學授左氏春秋将軍事親至孝有疾至焚香於臂以禱請然親有過未嘗不諌争其所為得禮義類皆如此不幸早世識之者無親疎共惜之二子男未名而卒女尚幼是嵗十一月癸酉𦵏於永安縣銘曰學則敏行則孝志}
  - {type: page-break, offset: 3654, content: '', id: KR4d0040_WYG_078-21b, image: WYG1094/WYG1094-0720d.png}
