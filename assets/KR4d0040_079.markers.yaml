  - {type: substitution, offset: 3023, original: 舘, replacement: 館, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-17344}}
  - {type: variant, offset: 3025, length: 1, content: 公, WYG: 校理震之女後君五年長男顥先夫人二年皆不祿獨少男幾復年未冠及幼女一人相與居家無一金之産幾復}
  - {type: variant, offset: 3027, length: 0, content: '', WYG: 孤貧中能自刻意為學取進士第今為太常博士知蓬州事累贈君官至太常博士夫人封仙源縣太君嫁其妹於北陽令李鵬嘉祐五年秋蓬州将之官泣謂}
  - {type: page-break, offset: 3027, content: '', id: KR4d0040_WYG_078-9b, image: WYG1094/WYG1094-0714d.png}
  - {type: variant, offset: 3028, length: 3, content: 爲前輩, WYG: 曰幾復奉先君夫人之遺體常恐不克續承祭祀今幸有祿秩室家苟完矣念先君先夫人之久未𦵏痛切不少忘於心况又逺宦於蜀忍置}
  - {type: substitution, offset: 3028, original: 爲, replacement: 為, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-19875}}
  - {type: variant, offset: 3032, length: 0, content: '', WYG: 去乎将以八月某日𦵏於梁縣之新豐鄉西成里子與我皆聶氏之甥也先君治行子皆知之其為我譔銘}
  - {type: variant, offset: 3033, length: 5, content: 服公才仰公, WYG: 曰懼不能堪子之命敢不諾銘曰御史之賢顯大於世及君恂恂清}
  - {type: 'kr:newline', offset: 3038, content: '

