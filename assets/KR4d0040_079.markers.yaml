  - {type: line-break, offset: 5460, content: '', id: KR4d0040_SBCK_079-12b11}
  - {type: variant, offset: 5460, length: 1, content: 衍, WYG: 又自商胡西徙趨恩冀朝廷皆以功大遂不復塞有李仲昌者建議請自商胡口下鑿六塔渠引河東注横隴故道用功省而利大詔遣使者與公行視利害公上言國家近議塞商胡計用薪蘇一千六百四十五萬役工五百八十三萬今仲昌奏塞六塔計用薪蘇三百萬共是一河其塞之工力不容若是之殊盖仲昌故}
  - {type: variant, offset: 5462, length: 2, content: 武勝, WYG: 小計以求興役殆非事實又即日河水廣二百餘步六塔渠廣四十餘歩必不能容且横隴下流自河徙以來填閼成高陸其西隄粗完東隄或在或亡前日六塔水㣲通分太河之水曽不及十分之三濵水之民䘮業者已三萬餘户就使如仲昌言全河東注必横潰汎濫齊博徳棣濵五州之民皆為魚鼈食矣今自六塔距海不啻千餘里若果欲壅河使東宜先治水所過兩隄使皆高厚仍備置吏兵分守其地多積薪蘇以防衝决乃可為也然其勞費甚大恐未易可辦以臣度之六塔實不可塞朝廷卒用仲昌議塞之既塞不終朝復决齊博等州果大被水害朝廷乃竄仲昌於嶺南諸阿附其議者亦扺罪衆始知公議為是公又上言民罹水災皆結廬隄冡粮乏可哀臣欲輒發近倉賑之顧大恩當自上出臣不敢竊取為名願亟遣使者案視收恤之朝廷從之未幾徙河東都轉運使踰年遷龍圗閣直學士知慶州兼環慶路經略安撫使邉民多䦨出塞販青鹽抵重法公請損官鹽之價犯者稍衰入判三班監兵部太常寺通進銀臺司仁宗山陵為鹵簿使又以遺留物奉使契丹公以二使皆有厚賚不欲専之因託以力不能兼辭使契丹不行士大夫美之英宗初即位契丹遣使賀乾元節公為館伴詔取書入置柩前使者固請見上曰取書非故典也上以方衰絰不許使者執書不肯授閤門公曰昔北朝有䘮南使至栁河而還今朝廷重鄰好聴君前至京師達命於先帝恩禮厚矣奈何更以取書為嫌乎使者立授書是時朝廷未知契丹主之年公從容雜佗語以問使者使者出不意􅃍以實對既而悔之相顧愕眙曰今復應兄事南朝矣頃之遷樞宻直學士知成徳}
