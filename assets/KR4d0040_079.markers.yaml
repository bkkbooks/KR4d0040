  - {type: variant, offset: 5504, length: 4, content: 范公大賢, WYG: 詩云淑人君子}
  - {type: variant, offset: 5509, length: 0, content: '', WYG: 儀一兮其儀一兮心如結兮昌}
  - {type: variant, offset: 5510, length: 0, content: '', WYG: 之謂邪於未沒數日光往見之起居}
  - {type: variant, offset: 5512, length: 1, content: 所, SBCK: 􅀁}
  - {type: variant, offset: 5512, length: 5, content: 所苟仐其銘, WYG: 恙一旦有人告曰昌言去夜得疾甚急未及問訊又有繼至者曰昌言沒矣嗚呼死者人之常善惡修短固不敢言何奪之之暴也前年光自晉陽歸昌言延我於中堂酌滑臺暑釀以飲我及往奠於畫像之前則依然昔時置酒處也嗚呼誰能睹是而不慟也哉廼為之辭}
