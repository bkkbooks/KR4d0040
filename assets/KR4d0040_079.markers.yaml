  - {type: variant, offset: 5465, length: 3, content: 莭度推, WYG: 兼真定府路安撫使土俗多棄親事浮圖公案籍閱其不知法者皆斥還其家凡斥數千人在真定數年以疾辭位治平四年以户部侍郎致仕其年八月丁未朔薨於公家年六十九公為人荘重動止皆有法不妄笑語居家孝友甚至而當}
  - {type: variant, offset: 5469, length: 0, content: '', WYG: 謹嚴始終如一鉏姦衛良摧彊撫弱去嘉興二十年人有過其縣聞民間猶思咏之以為前後無有罷潭州民遮道不得行公諭解不能却乃旋鞚而南曰當與汝歸耳衆喜奔呼争先道稍開躍馬北去追至境者尚數百人與僚佐議事其言當者立從之不當不面斥其短徐曰某意欲如此為安衆亦不能易也所部官屬有罪先以好言諭之不變乃誚責之懼而自改者盖十七八苟尚不變乃案致於法猶為虧除不盡繩也有死於官下其家孤貧不能自歸者必為賻斂衛送或無歸者則為存處立生業嫁其女誨其子弟視如親戚故人始望其貌皆懔然畏之久而求其心乃}
  - {type: page-break, offset: 5469, content: '', id: KR4d0040_WYG_079-11b, image: WYG1094/WYG1094-0727b.png}
  - {type: page-break, offset: 5469, content: '', id: KR4d0040_WYG_079-12a, image: WYG1094/WYG1094-0727c.png}
  - {type: variant, offset: 5470, length: 2, content: 沈丘, WYG: 實仁厚長者也先娶王氏再娶劉氏封彭城郡君皆先公即世三男莘将作監主簿百藥大理寺丞常大理評事二女適太常博士榮安道來安令江懋簡公薨之嵗十月已酉𦵏於先塋百藥暨常欲刻碑臨道俾異日郷人皆得瞻公之墓不忘公之徳請館閣校勘梁君燾状公之功行以授光命為之銘光昔通判并州事事公於河東雖自知無文不敢終辭銘曰古之君子徳盛道尊望之儼然即之也溫公正衣冠嚴不可干施之於政乃仁乃寛吏畏而悛民思不諼款銘垂美以告後昆行狀故處士贈都官郎中司馬君行状曾祖林祖政父炳皆不仕君諱沂陜州夏}
  - {type: page-break, offset: 5470, content: '', id: KR4d0040_WYG_079-12b, image: WYG1094/WYG1094-0727d.png}
  - {type: variant, offset: 5473, length: 0, content: '', WYG: 涑水鄉高堠里人其先出於晉安平獻王至征東大将軍陽始𦵏於河東安邑涑水之南後魏孝文帝太和中分安邑為夏縣遂為夏縣人自唐以來仕宦陵夷降在畎畝然累世兄弟未嘗異居故家之食口甚衆而生業素薄無以贍之君㓜而孝謹諸父兄悉以家}
  - {type: page-break, offset: 5473, content: '', id: KR4d0040_WYG_079-13a, image: WYG1094/WYG1094-0728a.png}
  - {type: variant, offset: 5474, length: 0, content: '', WYG: 委之君於是治田疇繕園圃修䦨笠完圂倉雖有傭保必}
  - {type: variant, offset: 5475, length: 0, content: '', WYG: 身先之使莫敢不盡力者夜則側板而枕之寐不熟輒寤當是時田不加廣而家用饒又未嘗為商賈竒衺之業一出於田畜而已諸父兄皆醉飽安佚而君無故不親酒肉遇鄉人之匱乏者或解衣以濟之年三十二以景徳三年十二月丙子終於家某年月日𦵏於南原待制府君常歎曰自吾兄之亡而家遂貧豈所以資生之具减於昔日勤惰不同而已矣嗚呼使天下之民皆若吾兄之為雖古治世何以加惜其無位而才不大施也夫人李氏同里人年二十八而寡二男詠里及一女皆㓜詠女尋又卒父母欲奪其志夫家尊章亦遣焉夫人自誓不許惡衣蔬食躬執勤苦使里之四方就學姑李氏老且病常卧一榻扶然後起哺然後食夫人左右就養未嘗小失其意如是積年以至於沒無懈倦之色既而里登進士第迎夫人之官夫人自㓜未嘗與其母别至是思慕成疾久之方愈里累遷為尚書都官郎中歴典數州贈君官至尚書都官郎中夫人封永夀縣太君夫人為人慈柔勤儉中外宗族咸慕仰之始終一無間言子為二千石極其榮養年八十三以嘉祐五年九月甲寅終於京師其年十一月壬寅祔於君之墓光不及事君而及事夫人故得書其聞見之實以請於今之徳行文辭為人信者以表其墓庶幾得於不朽而子孫有所法則焉謹状墓表贈比部郎中司馬君墓表天聖元年三月作兄諱某字嘉謨陜州夏縣人其先宗支所自出見於祖墓碣曾祖諱某祖諱某父諱某皆不仕兄為人謹厚孝於親友於兄弟自㓜及長無子弟之過不幸生二十八年以天禧四年六月辛夘終於家夫人同縣王氏進士禹之女長男未名而夭次男京生未踰歳而兄沒夫人年尚少自誓不嫁京既長以叔祖天章府君䕃入官為人彊直幹敏所至吏民稱之由是累遷尚書駕部貟外郎通判潞州軍州事贈兄官至比部郎中夫人享榮祿之養幾三十年封福昌縣太君年七十九以熙寧三年七月壬寅終二女長適鄉人曹中立早卒次適進士宋輔始兄之沒光生二年矣故於兄之材行不能詳知然苟非兄力為善於其身而無祿安能有遺福及其後邪兄以天聖六年三月乙巳塟於先塋及夫人之沒以其年十月辛酉祔於兄墓京懼嵗時之久不可以莫之識也泣請於光為之表贈衛尉少卿司馬府君墓表慶厯二年作府君諱浩於司徒}
