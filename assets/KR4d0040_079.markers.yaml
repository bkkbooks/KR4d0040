  - {type: line-break, offset: 3038, content: '', id: KR4d0040_SBCK_079-7b07}
  - {type: substitution, offset: 3038, original: 徳, replacement: 德, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-20773}}
  - {type: variant, offset: 3040, length: 0, content: '', WYG: 墜迨君之終家旤相繼㣲蓬州之立吳氏幾廢嗚呼以君之慈良而沈抑不遂宜其有嗣進士吳君墓誌銘君諱顥字某其先金鄉人曽祖某贈太常丞祖某侍御史父某鄰水縣令贈太常博士鄰水府君娶於祕閣校理聶君某於某為從母鄰水府君之沒也先妣在鄭君衰絰來入門哭且拜問故又哭先妣命與光處於是時君年尚未冠為人長大有容觀論議慷慨讀書屬文材敏過人為進士業已完美先妣歎曰吾妹不幸早䘮其良人今有是子也吾妹猶有望間二嵗君以疾卒於蒲阪年二十一先妣聞之哭曰吾妹何負于天使至此極也已而弟幾復負其䘮殯於汝州佛舍後二十六年幾復為太常博士乃舉其䘮𦵏于梁縣從鄰水府君之兆時某年月日也銘曰特苖之秀未實而朽繫時之逢無有美醜骨兮有歸祭兮有依下從先人夫又奚悲清逸處士魏君墓誌銘嘉祐八年作君諱閑字雲夫世家於陕之東郊父諱野真宗皇帝時有大名累召終不能起贈著作郎君少喜為詩學鼔琴不樂仕進一遵著作君之志皇祐二年仁宗皇帝祀明堂詔天下求遺逸草萊年耆徳茂者知府直史館李公昭遘薦君再世有高節上嘉之賜號清逸處士嘉祐八年八月癸未終於家年八十四君自始生至沒當國家隆盛偃兵無事之時家有舊田廬君謹守而治之朝廷以著作君之賢復其子孫無有所與以故沛然自足無衣食之累性不嗜酒謹潔守法度然與人和浮沈閭里不自摽揭以故其生也人樂與之遊其沒也無謗言府縣之官或時延禮亦與之往來然未嘗有毫髪之私以干之其政事失得未嘗納于耳出于口也以故皆愛重之無厭倦少好養生大要用沖澹自守不以一物累其心以故視聴步趨能老而不衰嗚呼今之名處士者多矣或力為竒譎以盗聲名萬一輩幸欲欺愚俗取美官或交游有位依其名勢乾沒射利以侵漁細民若是者雖不仕又足賢乎然則能保其福樂而免於過咎有如君者凡幾人耶君三娶曰臧氏曰趙氏曰皇甫氏子男一人曰樵女三人適進士梁軫張震左侍禁張宏孫男二人曰潜曰澤先僕射與著作君相愛如昆弟光拜君於髫齓之年今也其孤将以某年月日𦵏君於某地來求銘光何}
  - {type: page-break, offset: 3040, content: '', id: KR4d0040_WYG_078-10a, image: WYG1094/WYG1094-0715a.png}
  - {type: page-break, offset: 3040, content: '', id: KR4d0040_WYG_078-10b, image: WYG1094/WYG1094-0715b.png}
  - {type: page-break, offset: 3040, content: '', id: KR4d0040_WYG_078-11a, image: WYG1094/WYG1094-0715c.png}
  - {type: page-break, offset: 3040, content: '', id: KR4d0040_WYG_078-11b, image: WYG1094/WYG1094-0715d.png}
