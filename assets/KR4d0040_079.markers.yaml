  - {type: variant, offset: 5489, length: 1, content: 碑, WYG: 時熙寧六年五月辛酉也哀辭石昌言哀辭眉山石昌言年十八州舉進士倫軰數百人昌言為之首聲振西蜀四十三乃及第及第十八年知制誥又三年以疾終嗚呼少而秀宜}
  - {type: variant, offset: 5491, length: 12, content: 墓銘乃故參知政事范公所爲, WYG: 速成返齟齬不進晚而達宜其夀又未老而終天道幽逺真不可得而識邪昌言為人純素忠謹望之儼然以律度自居即之恂恂溫厚善談笑令人心醉不能舍去光為兒始執巻則聞昌言名已而同年登進士第與昌言遊凡二十年自始得見至於永訣其間迭有進退窮通相遇如一日既不可得而親亦不可得而踈}
