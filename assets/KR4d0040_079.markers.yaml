  - {type: variant, offset: 3579, length: 4, content: 家道益衰, WYG: 乃得其歸孝孫有立神實告之程夫人墓誌銘治平三年作治平三年夏蘇府君終於京師光往弔焉二孤軾轍哭且言曰某将奉先君之柩終𦵏於蜀蜀人之祔也同壟而異壙日者吾母夫人之𦵏也未之銘子為我銘其壙光固辭不獲命因曰夫人之徳非異人所能知也願聞其略二孤奉其事状拜以授光光拜受退而次之曰夫人姓程氏眉山人}
  - {type: page-break, offset: 3579, content: '', id: KR4d0040_WYG_078-17a, image: WYG1094/WYG1094-0718c.png}
  - {type: variant, offset: 3584, length: 1, content: 懼, WYG: 理寺丞文應之女生十八年歸蘇氏程氏富而蘇氏極貧夫人入門執婦職孝恭勤儉族人環視之無絲毫鞅鞅驕倨可譏訶状由}
  - {type: page-break, offset: 3584, content: '', id: KR4d0040_WYG_078-17b, image: WYG1094/WYG1094-0718d.png}
  - {type: variant, offset: 3586, length: 4, content: 書遂散逸, WYG: 共賢之或謂夫人曰若父母非乏於財以父母之愛若求之宜無}
  - {type: variant, offset: 3591, length: 1, content: 傳, WYG: 應者何為甘此􅂼糲獨不可以一發言乎夫人曰然以我求於父母誠無不可萬一使人謂吾夫為求}
  - {type: variant, offset: 3594, length: 0, content: '', WYG: 以活其妻子者将若之何卒不求時祖姑猶在堂老而性嚴家人過堂下履錯然有聲已畏獲􅓧獨夫人能順適其志祖姑見之必說府君年二十七猶不學一旦慨然謂夫人曰吾自視今猶可學然家待我而生學且廢生奈何夫人曰我欲言之久矣惡使子為因我而學者子苟有志以生累我可也即罄出服玩鬻之以治生不數年遂為富家府君由是得専志於學卒成大儒夫人喜讀書皆識其大義軾轍之幼也夫人親敎之常戒曰汝讀書勿効曹耦止欲以書自名而已每稱引古人名節以勵之曰汝果能死直道吾無戚焉已而二子同年登進士第又同登賢良方正科目宋興以來唯}
  - {type: page-break, offset: 3594, content: '', id: KR4d0040_WYG_078-18a, image: WYG1094/WYG1094-0719a.png}
  - {type: 'kr:newline', offset: 3595, content: '

      ', id: KR4d0040_krp_079-bkkkrnewl206}
  - {type: line-break, offset: 3595, content: '', id: KR4d0040_SBCK_079-8b12}
  - {type: variant, offset: 3595, length: 1, content: 録, WYG: 資政殿大學士吳公育與軾制䇿入三等轍所對語尤切直驚人繇夫人素勗之也若夫人者可謂知愛其子矣始夫人視其家財既有餘廼歎曰是豈所謂福哉不已且愚吾子孫因求族姻之孤貧者悉為嫁娶振業之郷人有急者時亦賙焉比其沒家無一年之儲夫人}
  - {type: page-break, offset: 3595, content: '', id: KR4d0040_WYG_078-18b, image: WYG1094/WYG1094-0719b.png}
  - {type: variant, offset: 3597, length: 1, content: 授, WYG: 嘉祐二年四月癸丑終於鄉里其年十一月庚}
  - {type: variant, offset: 3599, length: 4, content: 光昔聞公, WYG: 𦵏某地年四十八軾登朝追封武陽縣君凡生六子長男景山及三女皆早夭幼女}
  - {type: variant, offset: 3604, length: 5, content: 是書固願見, WYG: 夫人之風能屬文年十九既嫁}
  - {type: variant, offset: 3610, length: 8, content: 未之得得之驚喜曰, WYG: 卒嗚呼婦人柔順足以睦其族智能足以齊其家斯已賢矣况如夫人能開發輔𨗳成就其夫}
  - {type: page-break, offset: 3610, content: '', id: KR4d0040_WYG_078-19a, image: WYG1094/WYG1094-0719c.png}
