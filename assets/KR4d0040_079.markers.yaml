  - {type: variant, offset: 3619, length: 9, content: 之貺我兼金不如顧無, WYG: 使皆}
  - {type: variant, offset: 3629, length: 18, content: 爲報請受而蔵之遇同好則傳之異日或廣布, WYG: 文學顯重}
  - {type: substitution, offset: 3629, original: 爲, replacement: 為, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-19875}}
