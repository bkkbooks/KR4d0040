  - {type: variant, offset: 3017, length: 2, content: 中幸, WYG: 五年作熙寧二年春傅欽之遺光書曰昔我王考材氣過人宦不遂以沒堯俞幼鞠於王妣以至成人恩隐殊厚堯俞或以事夜艾未寝王妣常危坐待之及仕而之四方王妣不見再逾月則憂念氣濇而成癰逮王妣之亡竭堯俞之泣不足以償癰之血也今将以某月某日舉吾王考妣之柩𦵏於濟源吾嘗}
  - {type: page-break, offset: 3017, content: '', id: KR4d0040_WYG_078-5a, image: WYG1094/WYG1094-0712c.png}
