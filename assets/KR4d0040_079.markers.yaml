  - {type: variant, offset: 3041, length: 0, content: '', WYG: 辭銘曰天長不息兮地大無疆人寓其中兮細於毫芒奪攘紛糾兮非愚則狂惟君之生兮遭世寧昌依承先徳兮曄然有光笥有餘衣兮廪有餘糧養生}
  - {type: page-break, offset: 3041, content: '', id: KR4d0040_WYG_078-12b, image: WYG1094/WYG1094-0716b.png}
  - {type: variant, offset: 3042, length: 4, content: 同舍期也, WYG: 理兮行已有方居不煩人兮遊不出郷逍遥自適兮既夀而康視彼公侯兮金朱煌煌憂勞沒齒兮或罹咎殃為得孰多兮為謀孰長鄆州處士王君墓誌銘嘉祐六年作至和中光從故丞相龎公鎮鄆州公命光典州學學生王大臨通經有行誼光特愛重之後十五年王生來見光於京師曰大臨将以今年某月某日𦵏其親於須城縣長山之麓子為我銘其墓光辭以拙於文生曰大臨逺來非有佗故唯銘之求朝士大夫以百數大臨無所諂唯子之歸子何得拒之光愧其言不敢辭因曰}
  - {type: page-break, offset: 3042, content: '', id: KR4d0040_WYG_078-13a, image: WYG1094/WYG1094-0716c.png}
  - {type: variant, offset: 3047, length: 4, content: 粗能孰公, WYG: 則願聞先子}
  - {type: variant, offset: 3048, length: 1, content: 能, SBCK: 􅀎}
  - {type: variant, offset: 3052, length: 1, content: 爲, WYG: 行生乃出其邑}
  - {type: substitution, offset: 3052, original: 爲, replacement: 為, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-19875}}
  - {type: variant, offset: 3054, length: 2, content: 元豐, WYG: 試祕書省校書郎梁君燾之状以授光曰君諱惟徳字輔之始為童子父行戍於蜀君侍大父母撫諸弟以孝友聞其治家如成人大父母終君親負土成墳終䘮不嘗酒肉父自蜀歸家益富父好散施君竭力以助之有所與必稱父命以致之嘗舉三禮一試於禮部不中格喟然歸不復就舉專以養親治經為事著禮說}
  - {type: page-break, offset: 3054, content: '', id: KR4d0040_WYG_078-13b, image: WYG1094/WYG1094-0716d.png}
  - {type: variant, offset: 3057, length: 0, content: '', WYG: 十巻性溫厚喜𨗳人為善鄉里謂之王君子有闘者君徐以義理辨告皆恱曰君子幸敎我我何敢違即解去不復詣吏年若干病亟歎曰死生有命恨不得終為子之道以天聖五}
  - {type: 'kr:newline', offset: 3058, content: '

      ', id: KR4d0040_krp_079-bkkkrnewl176}
  - {type: line-break, offset: 3058, content: '', id: KR4d0040_SBCK_079-7b08}
  - {type: variant, offset: 3061, length: 1, content: 公, WYG: 辛亥終再娶皆楊氏其後夫人贈職方貟外郎旦之女也能成君之志順適舅姑使之終身無憂慍之容及老寝疾每祭祀猶强起執事年若干以嘉祐五年十二月已巳終子男五人長曰大順今為剡縣主簿次未名次大同皆早世次宗道次大臨女二人長適大學館學究劉應祥次亦早世君既沒家甚貧大臨以善講解為諸生師月受俸於州學錢二千積而不用滿三十萬乃舉兩世之柩而𦵏之光不及見君知其為人以其子之賢與梁君之言於是乎銘銘曰孝乎親友于其}
  - {type: page-break, offset: 3061, content: '', id: KR4d0040_WYG_078-14a, image: WYG1094/WYG1094-0717a.png}
  - {type: variant, offset: 3063, length: 0, content: '', WYG: 家有餘施及鄉里人恱其敎稱為君}
  - {type: page-break, offset: 3063, content: '', id: KR4d0040_WYG_078-14b, image: WYG1094/WYG1094-0717b.png}
  - {type: variant, offset: 3064, length: 13, content: 崇信令察示光以歐陽公所譔公, WYG: 嗚呼是亦為政奚必仕玉城縣君楊氏}
  - {type: variant, offset: 3074, length: 1, content: 所, SBCK: 􅀁}
