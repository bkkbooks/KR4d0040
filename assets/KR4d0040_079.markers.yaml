  - {type: variant, offset: 1515, length: 488, content: 冝衛尉少卿司馬府君墓表府君諱浩於司徒公爲從父兄其郷里先世見於祖墓碣曽祖諱某祖諱某父諱某皆不仕府君少治詩以學究舉凡八上終不遇遂絶意不復自進於有司專以治家爲事爲人魁岸慷慨尚氣義於宗族㤙尤篤司馬氏累世娶居食口衆而田園寡府君竭力營衣食以贈之均一無私孀婦孤兒皆獲其所凡數十年始衆無絲豪怨言家貧祖墓迫隘尊卑長㓜前後積若干䘮乆未之塟府君履行祖墓之西相地為新墓稱家之有無一旦悉舉而塟之弟子里早孤府君識其儁異自㓜教督甚嚴其後卒以文學取進士第仕至太常少卿所至著名迹前此郷人導涑水以漑田利甚博嵗以岸益深峭水不能復上田日磽薄将不足以輸租府君率郷人言縣官始請築塌扵下流水乃復行田間爲民用至于今賴之天聖八年四月癸己終於家年六十三慶暦二年八月癸酉塟西墓𥘉娶張氏早終生女適觧人南公佐公佐舉進士得同學究出身再娶蘇氏先府君十年終年五十八生男宣又娶郭氏無子後府君十六年終年若干宣用司徒公䕃𥙷郊社齋郎累官爲尚書駕部貟外郎知梁山軍今致仕居家駕部君寛厚有守練習法令善為政吏民不能欺既升朝累贈府君官至衛尉少卿夫人蘇氏追封長安縣太君駕部君謂古君子論譔其世先人之美著諸金石故命光直叙其實以表扵府君之墓道時熈寜六年五月辛酉也尚書, WYG: 宜}
