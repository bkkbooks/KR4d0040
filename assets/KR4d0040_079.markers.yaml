  - {type: line-break, offset: 3018, content: '', id: KR4d0040_SBCK_079-7b06}
  - {type: variant, offset: 3020, length: 1, content: 公, WYG: 子}
  - {type: variant, offset: 3023, length: 1, content: 舘, WYG: 諫省子幸而知我必為我銘其墓子苟自謂不能是愛其少頃之勤而使我抱終已之恨非仁人之為也光讀之愧且懼復書曰子以義責光光何敢辭然門内之美光不得聞也子為光敘其事以來光謹條次之則可矣有間欽之以其状來曰君諱某字寶臣其先大名内黄人世為富家曽祖考諱思進始讀書為儒祖考諱凝贈虞部貟外郎考諱世隆以春秋三傳登科官至駕部貟外郎知卭州事始家於鄆君少通尚書屢舉不中第用親䕃補三班借職累遷至右班殿直初監澶州酒稅歴齊州離濟賽酒稅廬州廵檢以事去官後監趙州倉知定州新樂縣復以事去官已而監博州酒稅以疾罷歸明道元年十月十日終於家夀六十一君為人忼慨方嚴家之子弟雖甚愛之不命坐不敢坐其當官明敏果斷在新樂有西山采木卒二百人謀刼其縣大呼自南門入君率左右操白挺逆之至則叱使坐卒不意君遽出皆愕不敢動君因罵之曰餓兵欲奚為捽其為魁者數人杖之各數十而縱之皆抑首去不敢出聲然不能與世浮沉平視貴要若無人故所至齟齬且老益窮因發狂疾棄官歸卧一嵗所忽起召家人與訣語言如平生人乃疑其非狂也故相國王沂公為諸生家居未與人接君即以公輔器之已而果然人不知其何用知之也夫人霍氏國子博士致仕若拙之孫篤於孝慈其父亡夫人未之知獨視雲烟草木皆慘悽變色泣下不能自止逾月而訃至後君二十二年年八十一而終男某仕至山南東道節度推官知磁州昭徳縣事贈工部郎中二女其長者蚤世㓜適楊氏孫七人長曰堯俞字欽之今為兵部貟外郎次舜俞郊社齋郎次君俞未仕餘皆早世欽之為諌官處大議正直無所顧避朝廷不能用其言除知雜御史欽之固辭不肯拜必求得罪以去知和州聲振天下嗚呼得非承其祖之風烈邪欽之以夫人嘗至濟源愛其土風遂𦵏焉銘曰氣直志剛難進易傷善抑不揚其後必昌皆理之常府州判官杜君墓誌銘嘉祐二年作嘉祐二年秋光在京師進士杜知臣涕泣來言曰大人昔以進士得見於先公又與子遊􅇰久今不幸而沒子為我銘其墓光既吊因辭以不文不敢為知臣固請曰佗人知臣所不敢請也故惟子之歸光廼曰然則願聞子先君世系治行之詳知臣退以其状來曰君諱陟字從聖其先自成都徙長江曽大父禮大父鍔皆不仕父昭文遂州長史君少好古學無所不闚著化坊三十一篇言王者以敎化坊民之道慶歴初天子詔諸州皆立學擇其士之賢有行者為之師州人共推上君君屢舉進士有司失之卒以三禮釋褐選􅈎道尉考滿遷府州軍事判官力於吏治轉運使提㸃刑獄交章薦之㑹屬官有以姦贓敗者怨恨反誣訟君坐罷官去君詣闕欲自理不果遇疾以八月己已終於里舍年五十有七娶譚氏生三子男知臣女長適卞宗建㓜適姚申皆舉進士嗚呼杜君觀其所學與所為書其志豈欲如是而止哉卒無遇以窮斯可哀矣知臣負其䘮歸以其年月日𦵏某地銘曰學之也勤守之也専仕進迍邅又不永年嗚呼孰知其然必歸之天贈太常博士吳君墓誌銘嘉祐五年作君之先世家金鄉曽大父諱賁不仕大父諱豫贈太常丞始𦵏洛陽金谷郷之尹里父諱蒨太平興國中進士高第以公直材敏立名朝廷數忤權貴由是不得居中連典大州官至侍御史亦𦵏尹里君諱元亨字子正用御史遺奏補太廟齋郎遷許州司士參軍選授永康尉歴河中府法曹參軍馮翊令馮翊華隂以漆沮為境中間洲上有美田民相與争之五十餘年吏不能决君檄華隂令㑹境上盡案兩郷之籍徧履其田執度以度之皆得其實自是民不敢復争時人稱之君為人謹㢘専以誠長者處官不能飾智巧以媚上故官久不遂官滿集吏部選除鄰水令還未至家道疾抵知洛陽縣李宋卿延之縣舍以天聖九年八月某日終年四十一宋卿主辦其䘮殯於水安佛室夫人聶氏祕}
