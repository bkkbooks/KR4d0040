  - {type: variant, offset: 2997, length: 0, content: '', WYG: 銘嘉祐六年作君諱某其先出自晉安平獻王自周隋之前家涑水之上至唐仕宦陵夷降在畎畆曽祖諱林祖諱政父諱炳累世同㸑食口甚衆父兄以君孝謹自㓜以家事委之君晝夜服勤不遺餘力專以稼穡畜牧致饒給不事竒衺末業所獲悉以奉六親有餘則及鄉人身無私焉年三十二以某年月日終某年月日𦵏於涑水南原先待制府君常歎曰自吾兄之亡而家始貧使天下之民皆若吾兄之為雖古至治之世何以尚諸惜其無位而才不大施也夫人李氏同里人年二十八而寡父母欲奪其志夫家尊章亦遣焉夫人自誓不許惡衣蔬食躬執勤苦敎畜二子詠里詠不幸早世里登進士第累遷尚書都官郎中歴典數州贈君官至尚書都官郎中夫人封永夀縣太君夫人為人孝慈勤儉中外宗族慕仰其徳一無間言子為二千石極其榮養年八十二以某年月日終於京師某月日祔於君之墓光不及事君而事夫人久敢書聞見之實而繫之以銘銘曰士不得位善無所施勤儉于躬家道以肥宗族是賴郷黨是師夀之少多命不可移有配有子}
