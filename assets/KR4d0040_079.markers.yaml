  - {type: variant, offset: 5442, length: 14, content: 曽孫偃師尉衍因就求觀公之遺文, WYG: 仍免其一年租三年役貧者縣官貸以種粮由是嶺南民復安集又奉使契丹還加天章閣待制為陜西都轉運使未幾改河北初河自横隴西徙趨徳博}
