  - {type: line-break, offset: 2998, content: '', id: KR4d0040_SBCK_079-7b05}
  - {type: variant, offset: 2998, length: 0, content: '', WYG: 無棄基淑慝之效昭然不欺蘇騏驥墓碣銘為器之作蘇氏之先出自重黎忿生為周武王司寇封於溫世為卿士或謂之溫子春秋時蘇子為狄所滅子孫以邑為氏歴世久逺散之四方在洛陽者秦厲代以口辨顯戰國世在杜陵者建為漢名将子武使匈奴中十九年不屈節在武功者綽仕宇文周以}
  - {type: page-break, offset: 2998, content: '', id: KR4d0040_WYG_077-17a, image: WYG1094/WYG1094-0708a.png}
  - {type: variant, offset: 2999, length: 0, content: '', WYG: 法令為某官子威隋文帝佐命功臣至唐瓌父子為賢相此其章章尤著者也周衰溫為晉邑漢屬河内郡隋以河内為懐州維修武之族不棄其故土留懐州不去公其後焉公諱某字某曽大父某大父某皆不仕父某贈左司衛率公㓜慷慨有逺志自力讀書不治家事宗族争笑且怒之曰汝世農家勤治耕桑以豐衣食汝忽棄業為書生窮餒無日矣公曽不顧為學益堅早䘮二親哀毁過禮鄉曲稱之弱冠舉三傳科景徳中契丹南侵河北盗賊蠭起公於是盡散家財糾合郷曲子弟結以信義扞禦群寇修武由是獲全大将軍某北征公踵軍門上謁延入與語兵事大恱即奏偕行至中山㑹契丹圍城甚急用公之䇿卒拒却之於是天子曰契丹犯塞河北士子躬被甲胄扞敵有功今天下貢舉巳畢朕憐夫北方賢士大夫不得以時充貢其皆召試賜第公由是解褐補符離尉縣多寇盗吏卒單弱公奨訓率厲擒馘七十餘人闔境清肅改河清主簿考滿吏民羣詣轉運使所請留詔聴更留成資而去遷遂州録事參軍本}
  - {type: page-break, offset: 2999, content: '', id: KR4d0040_WYG_077-17b, image: WYG1094/WYG1094-0708b.png}
  - {type: page-break, offset: 2999, content: '', id: KR4d0040_WYG_077-18a, image: WYG1094/WYG1094-0708c.png}
  - {type: variant, offset: 3000, length: 0, content: '', WYG: 論薦召對擢為大理寺丞知大名縣事尋除通判州事入朝遷太子}
  - {type: variant, offset: 3001, length: 0, content: '', WYG: 舍國家㳂前世故事分文武百官為二塗其遷次任使皆不相參涉有願相移易者聴之以}
  - {type: variant, offset: 3002, length: 0, content: '', WYG: 素善武事加習邊務遂改供備庫副使知威勝軍事繼興嵐莫石鳳蘷五州皆著聲績官歴東染院洛苑二副使其}
  - {type: variant, offset: 3003, length: 1, content: 華, WYG: 蘷}
  - {type: variant, offset: 3005, length: 0, content: '', WYG: 兼䕫梓兩路兵馬都監提舉諸州廵檢兵甲賊盗事久之上表乞朝因言邊防民政諸利害稱旨遷右騏驥副使同提㸃湖南兩浙刑獄公事年七十四以慶歴二年十月十三日終於長沙官舍公始雖以學術為文吏而性好勇有智略晚年夏寇苦邊諸将多敗北無功公聞之歎曰吾以布衣起家至方伯承兩朝恩渥不可勝紀家近趙魏粗習兵略今狂虜驕慢侵擾疆場而吾老病不得荷戈前驅以報萬一非命也夫然卒不得盡其志嗚呼哀哉夫人張氏先公即世子四人師古果州團練判官師顔衛州司法參軍夢臣獲嘉縣主簿季子師說及孫孝先曾孫叔元皆三班借職餘孫若干人㓜未官公之在荆湖也夢臣為三班奉職以公高年多疾求告省侍朝廷以武吏求省侍無故事不許乞改文職歸省方許之行及宛葉間聞䘮因號泣晝夜奔赴凡七日行千三百里近世宦逺方而沒者子孫多焚其柩以燼歸𦵏相習為常無譏誚者夢臣獨奮曰為人子孫忍行此豈人心也哉自長沙數千里奉柩以歸嗚呼其信知義而斷不與流俗者夫古人稱善人者其身不耀必在子孫豈信然耶某年月日𦵏於某所先府君之兆夫人張氏祔}
  - {type: page-break, offset: 3005, content: '', id: KR4d0040_WYG_077-18b, image: WYG1094/WYG1094-0708d.png}
  - {type: page-break, offset: 3005, content: '', id: KR4d0040_WYG_077-19a, image: WYG1094/WYG1094-0709a.png}
  - {type: page-break, offset: 3005, content: '', id: KR4d0040_WYG_077-19b, image: WYG1094/WYG1094-0709b.png}
  - {type: variant, offset: 3006, length: 0, content: '', WYG: 郷邑於公近又久承公之知故其於公之}
  - {type: variant, offset: 3007, length: 0, content: '', WYG: 終治行也於佗人為悉其諸子}
  - {type: variant, offset: 3008, length: 0, content: '', WYG: 碣文為請光何敢辭謹銘曰銘闕傳家集巻七十七欽定四庫全書傳家集巻七十八宋司馬光撰誌三縉雲縣尉張君墓誌銘故翰林侍讀學士張公有子曰某前公若干年卒殯楚州後若干年與公偕𦵏襄城時皇祐五年閏月甲申也其弟大理寺丞光以治行來求銘光獲事侍讀公為日久又與君之兄弟遊今也不敢以愚陋辭而不為姑譔次其所聞納諸壙云君字仲倩其世家郷黨見於侍讀公之碑君性嗜學年十五志節已皦皦出人有從母嫠居将從其女於保徳軍子㓜不能自致君奮曰人母子單弱如此於以涉逺我獨何心坐視之邪即白父母請送父母疑其尚少然聞其言甚恱即遣之君冒盛寒往返數千里曾不為勞人皆歎其仁而有立以䕃補}
  - {type: page-break, offset: 3008, content: '', id: KR4d0040_WYG_078-1a, image: WYG1094/WYG1094-0710a.png}
  - {type: page-break, offset: 3008, content: '', id: KR4d0040_WYG_078-1b, image: WYG1094/WYG1094-0710b.png}
  - {type: variant, offset: 3012, length: 0, content: '', WYG: 及長調縉雲尉治有聲迹縣有滛祠曰五通人嚴事之嵗旱君徧禱群祀不及五通吏民以為請君不}
  - {type: page-break, offset: 3012, content: '', id: KR4d0040_WYG_078-2a, image: WYG1094/WYG1094-0711a.png}
  - {type: variant, offset: 3013, length: 1, content: 謁, WYG: 已强往禱且卜之巫曰不吉必無雨比歸雨大至君笑曰果然雨不雨非妖鬼事也而敢屢為變怪以驚愚民是不可不除即部吏卒焚滅其祠捽土偶人投江中嵗亦大熟官滿歸道病或請留傳舍俟愈而行君曰吾官逺方不獲侍親之左右四年於此矣今幸歸至舍}
  - {type: variant, offset: 3015, length: 0, content: '', WYG: 吾親而死吾目瞑矣又何可留趣舟而前及楚州卒年二十八娶袁氏故諌議大夫煒之孫生二男絪試将作監主簿繼太常寺太祝二女其㓜者早夭初侍讀公有五子光知其三人焉而不及識君三人者皆甚才然猶自謂不如也侍讀公沒兄弟寓居汝潁間食口衆無田宅以自給咸泣曰縉雲在吾屬豈憂此乎言其知力足賴而不遺其親也嗚呼使顯於朝而老所施設豈若是而已哉銘曰苑彼嘉禾煒煒其華實而未碩孰披之柯人之明果胡夀不遐思而悲者豈伊其家大理寺丞龎之道墓誌銘嘉祐八年作龐之道名元魯故相國頴公之元子妣曰嘉興縣君邊氏其鄉里世系見於頴公之誌天聖中先君與頴公皆為群牧判官居相近光朝夕與之道遊兄事之之道時尚㓜性明頴於文辭不待力學而自能讀書初如不措意已盡得其精要前軰見之皆驚歎光年不相逺自視如土瓦之望珠玉頴公為廣南東路轉運使奏之道試祕書省校書郎及為知雜御史又奏守将作監主簿景祐五年光與之道同登進士第之道簽書懐州判官事未幾徙知河南縣事縣多豪貴家素號難治之道至繩案無所避豪貴為之斂手徙簽書河中府判官事後數年光過河南問於野人曰龐君為治何如曰明而有斷又問今宰曰不及龐君逺矣乃知野人最不可欺而論議甚公也頴公為鄜延經略安撫使奏之道書機宜文字時方用兵文書填委或中宵不得寐頴公入為樞宻副使欲奏其勞為之求升資之道辭曰将吏有功者願大人悉奏之元魯不足言也頴公喜而從之久之以大理寺丞監國子監書庫慶歴七年五月戊寅以疾終年三十二殯於薦嚴佛舍之道事繼母劉夫人撫畜諸弟始終無間言及沒哭之皆哀不自勝終頴公之世親友不敢語及之道語之頴公未嘗不悲慟始光知之道敏於為學及過河南又得其為政焉其沒也益知之道孝友之行深矣先娶孫氏故都官貟外郎道之女又娶張氏今吏部侍郎致仕存之女一女早卒遂無子嘉祐八年六月壬申弟先英遷之道之柩𦵏於雍丘頴公之墓側袝以孫氏光為之銘曰學施於治孝友兼美官不登朝沒纔壮齒如光何人榮祿及此噫才固不足言直命而已矣右班殿直傅君墓誌銘}
