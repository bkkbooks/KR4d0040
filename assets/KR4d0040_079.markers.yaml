  - {type: variant, offset: 3079, length: 0, content: '', WYG: 銘夫人姓楊氏故尚書工部郎中直史館韓公之配也公之世系事業龍圖閣直學士郭公誌之矣夫人之先在唐為盛族居靖恭坊五代之亂衣冠之緒零落殆盡唯靖恭楊氏徙家于吴世有顯人迄今不絶考諱蛻仕至尚書司封郎中精於吏治所至著聲迹始韓公娶夫人之姊生男鑑鐸及二女不幸早世公曰楊氏名族吾既謀於宗而卜於廟矣不可易也廼復請昏於夫人夫人年若干歸韓氏生男鎮鉞初封真定後更封玉城縣君為人慈和淵静不喜聲味自少及長家人伺其動靜語黙皆有常度未嘗移也其撫視六子衣服飲食無絲毫簿厚六子亦相與親愛如一雖中外族婣莫知其為異母也年三十九而䘮韓公三年不茹葷自是閉閤深居日誦佛書不復有自虞樂之意年五十以至和元年三月乙亥終其五月壬申祔于公之墓時鑑為某官鎮為某官鐸為某官鉞已前卒鐸與}
  - {type: page-break, offset: 3079, content: '', id: KR4d0040_WYG_078-15a, image: WYG1094/WYG1094-0717c.png}
  - {type: page-break, offset: 3079, content: '', id: KR4d0040_WYG_078-15b, image: WYG1094/WYG1094-0717d.png}
  - {type: variant, offset: 3080, length: 1, content: 讀, WYG: 遊素久因状夫人}
  - {type: variant, offset: 3082, length: 1, content: 怳, WYG: 行命光為之銘光不得辭曰允矣夫人徳則均一而行有常邪承祖之休宜于夫家而夀不将邪福祿當有餘而更不足子孫其昌邪彭城縣君劉氏墓誌銘嘉祐五年作嘉祐五年某月日太常博士知蓬州事吳君幾復祔其祖妣彭城縣君劉氏于祖考御史府君之墓始夫人之沒蓬州生二年矣比冠而父母兄皆即世家至貧漂泊汝洛間嘗記幼時聞其兄言夫人之殯在京師廣濟佛寺已而舉進士及第乃求所以廣濟佛寺者凡有二焉在城之東西往問夫人之殯皆莫能知蓬州刻志求之積年不置一旦至西寺有僧老矣忽來訊曰君非鄰水令吳君之子邪曰}
  - {type: page-break, offset: 3082, content: '', id: KR4d0040_WYG_078-16a, image: WYG1094/WYG1094-0718a.png}
  - {type: substitution, offset: 3082, original: 怳, replacement: 恍, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-17020}}
  - {type: variant, offset: 3084, length: 0, content: '', WYG: 僧曰去三十載之前吳君殯其母夫人于是某為童子手親塗之某亦吳姓也故能識之因指視其處蓬州未之敢信周視其塗圮剝且盡所餘}
  - {type: variant, offset: 3085, length: 0, content: '', WYG: 掌而鄰水府君之題識存焉乃奠而哭之又數年然後得合𦵏於洛陽之金谷鄉自始沒至𦵏四十二年矣噫㣲是孫也則夫人之柩其復得邪露殯積久而題識獨存豈非鄰水府君自悼其不幸未𦵏而天隂相之邪乃知誠孝可以動鬼神信矣御史府君諱某鄰水府君諱某夫人平生行事不可}
