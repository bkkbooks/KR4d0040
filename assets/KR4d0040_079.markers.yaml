  - {type: variant, offset: 5691, length: 0, content: '', WYG: 欽定四庫全書傳家集巻八十宋司馬光撰祭文豢龍廟祈雨文年月日宣徳郎将作監主簿權知常城縣事司馬光謹率吏民具清酌庶羞之奠致祭於豢龍之神昔者聖王設官分職畜擾神物以為人用後世䘮業神實繼之知龍嗜慾服事夏后王嘉神勞胙以此土嵗祀超忽廟貌仍存闔縣奔走春秋薦獻却災致福保佑斯人今大夏将盡而歴時不雨榖苗槁死不可復殖倉廪無儲民将何恃民實神主神實民休百姓不粒誰供神役邑長有罪神當罰之百姓無辜神當愛之天有甘澤龍實司之以時宣施神實使之稿者以榮死者以生旱氣削除化為豐登然後自邇及逺粢盛牲酒以承事神永永無斁伏惟尚饗祭齊國獻穆大長公主文為兩制諸公作惟靈襲慶皇家作嬪侯族環珮為節動顧禮文蘋藻必親無違婦職承天以順敎子以慈純素柔嘉自㤀王姬之貴肅雍明智居為里戚之規嗚呼遐福未終大期奄及去白日之昭晰歸下泉之窈㝠宸極惋傷具僚增欷祗陳薄薦庶達菲誠尚饗祭郭侍讀文維皇祐四年五月壬子尚書屯田貟外郎孫琳殿中丞司馬光太子左賛善大夫李端卿大理寺丞李杲卿前通州推官楚楷謹致祭於故侍讀學士郭公之靈嗚呼惟公之徳清夷純白恪慎匪懈勤劬朝夕文為國華行為士則抱牘拱編雍容帝側貧錫之金坐命之席絶衆逾倫恩輝備極如何不淑奄從窀穸某等庸蔽久泳公恩承乏下僚從公外藩庇其闕遺誨之話言如妷如甥心何敢諼今兹相顧失涕來門瞻望靈帷薦其蘋蘩凄風肅然髣髴如存嗚呼哀哉尚饗祭范尚書文以下二篇為兩制諸公作嗚呼天生儁賢為國之紀服休服采以翼天子冠帶立朝正色嶬嶬讜言直節奮不顧已廼率西師氐羌率俾廼賛公台緝熙物軌乃牧東夏刑清政理徳實光大才則茂矣宜其永齡享有多祉如何不淑逺塗中止輴車過都頓舍甚邇奠不手傷僣痌何巳靈底其衷歆茲馨旨尚饗祭觀文丁尚書文惟公抱素懐真含忠履厚賦才茂美逢世休嘉降集帝庭回翔禁署羽儀髦儁黼黻訓辭登賛機衡進叅台鼎物無疵癘民底又安陪侍殿帷雍容風議老成之徳中外式瞻宜享永年以毗大業如何不淑隕此哲人日月有時輴車首路興言僚舊哽涕無從薄薦醪羞式歆哀欵尚饗諸廟祈雪文竊以雪霜不時神實職之編室流亡吏當坐之今者自秋徂冬天澤未浹麰麥既寡又将槁枯意者吏不職歟民無告歟胡為困苦使至此極也惟神哀民之窮寛吏之辜使雪以時降而麥猶有收敢不牲酒鼓舞以承神休尚饗祭黄石公文維年月日具官某謹遣某官某敢以香酒告於黄石公之神惟公禀天至靈與聖同契幽賛人傑光啟漢家廟食於今千有餘祀惟是鄆土居神宇下曠冬無雪宿麥将枯舊廪既罄新場無望老穉遑遑濵於溝壑上聖夙夜苦心焦思中外百吏憂愧失圖惟神𨗳天之和寛上之慮救民之死赦吏之罪使膏澤下濟土脉僨興囘枯為榮變凶成稔敢不祇率所部逺邇之民以承事神永永無斁尚饗祭劉大卿文為始平公作維年月日具位某謹以清酌庶羞之奠致祭于同年留䑓大卿之靈昔與羣儁同登帝庭煜如春葩雜然秀發嵗陽四浹零落幾盡如何茲者又隕伊人惟君資性純和雅尚恬漠委逺繁要雍容外臺維汶之陽寔為故里間者相遇觴咏甚歡華軒西征逺送于野轍迹未滅遽以䘮歸永言痌嗟情何能極薦奠雖簿歆茲至誠尚饗諸廟祈雨文間以旱暵病于稼穡得請于神貺之甘澤來麰以登民以粒食荷神之休永久無極今兹禾黍尚穉菽麥未蓺土壤已槁霶潤無繼川澤将涸螟􅈮方熾婦子遑遑憂猶未艾神宜監民之窮憫物之沴沃灑嘉生𨗳迎和氣庶幾豐穰克終大恵敢不鼔舞以承神事尚饗諸廟謝雨文間以旱暵有謁于神神享其衷錫以嘉雨雖高下未浹逺邇未均田畆小濡民意差緩蒙神之恵不敢寕居選牲潔酒亟伸報賽惟神嗣降豐澤克終顯徳尚饗}
