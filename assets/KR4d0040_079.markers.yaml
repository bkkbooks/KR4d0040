  - {type: variant, offset: 3663, length: 1, content: 足, SBCK: 􅁕}
  - {type: variant, offset: 3665, length: 3, content: 少報乎, WYG: 例賜名除右内率府副率明年遷右監門率府率今上踐阼遷右千牛衛将軍㓜而秀慧不嬉戯異於常兒七嵗始就學授孝經孜孜不捨晝夜敎授劉仲章老儒生嘗於廣坐問之曰将軍誦孝經果有何得對曰事親孝故忠可移於君居家理故治可移於官此其所得也仲章驚歎曰異日成長必為徳器數年愈自修立有成人之風親親尊尊動皆應法問安視膳朝夕無倦不幸遇疾以熙寧二年五月丙戌卒年十二宗室共嗟惜之朝廷贈右屯衛大将軍其年十一月癸酉𦵏永安縣謹記傳家集巻七十八欽定四庫全書傳家集巻七十九宋司馬光撰碑河東節度使守太尉開府儀同三司潞國公}
