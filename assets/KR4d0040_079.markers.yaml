  - {type: variant, offset: 5476, length: 0, content: '', WYG: 為從父兄其鄉里先世見於祖墓碣曾祖諱某祖諱某父諱某皆不仕府君少治詩以學究舉凡八上終不遇遂絶意不復自進於有司専以治家為事為人魁㟁慷慨尚氣義於宗族恩尤篤司馬氏累世聚居食口衆而田園寡府君竭力營衣食以贈之均一無私孀婦孤兒皆獲其所凡數十年始終無私毫怨言家貧祖墓廹隘尊卑長㓜前後積若干䘮久未之𦵏府君履行祖墓之西相地為新墓稱家之有無一旦悉舉而𦵏之弟子里早孤府君識其儁異自㓜教督甚嚴其後卒以}
  - {type: page-break, offset: 5476, content: '', id: KR4d0040_WYG_079-16a, image: WYG1094/WYG1094-0729c.png}
  - {type: variant, offset: 5477, length: 2, content: 集及, WYG: 學取進士第仕至太常少卿所至著名迹前此郷人𨗳涑水以溉田利甚博嵗久岸益深峭水不能復上田日磽薄将不足以輸租府君帥郷人言縣官始請築塌於下流水乃復行田間為民用至于今賴之天聖八年四月癸巳終于家年六十三慶歴二年八月癸酉𦵏西}
