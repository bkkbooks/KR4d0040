  - {type: indent, offset: 5374, content: 　　　　, id: KR4d0040_krp_079-bkkind15}
  - {type: variant, offset: 5374, length: 0, content: '', WYG: 户部侍郎周公神道碑治平四年作周以國為氏漢魏以來世有顯人公之先家於益都曾祖考諱仁貴不仕祖考諱子元舉三禮登科為深州司法參軍契丹覆深州舉室罹禍朝廷哀之贈大理寺丞祖妣田氏追封仙遊縣太君考諱圭時適在外得免朝廷賜以官終太子中舍累贈尚}
  - {type: page-break, offset: 5374, content: '', id: KR4d0040_WYG_079-6b, image: WYG1094/WYG1094-0724d.png}
  - {type: variant, offset: 5375, length: 0, content: '', WYG: 左僕射妣李氏累封常山縣太君公諱沆字子真舉進士一上中第除膠水縣主簿初試吏事精敏如素習上下稱其能徙諸城主簿用蔡文忠公薦遷鎮海軍節度推官知勃海縣濵州大吏恃府勢築室鄣民居害其出入民訴縣以十數前令莫敢直公立表撤室收吏扺罪豪猾惕息嵗餘召入改著作佐郎縣民詣轉運使杜祁公請留祁公為奏詔許之㑹公以母老疾求監青州稅尋以憂去職服除知嘉興縣趙元昊擾西陲詔近臣舉可通判陜西諸州者富丞相時知制誥以公名聞擢通判鳳翔府以權發遣鹽鐵判官召還改江西轉運判官公固辭願得近鄉里一官以謀𦵏乃改知沂州過京師入對言事仁宗善之賜服銀緋到官數月召還為開封府推官俄遷判官㑹湖南蠻唐盤二族殺掠居民官軍討之數不利有詔本路遣人招撫蠻輒殺之乃以公為轉運使委之經畫辭行仍服金紫公至上言蠻驟勝方驕未易懐服宜須秋冬進兵擊之蠻地險氣毒其人驍悍善用鋋盾北軍不能與之确請選邕宜融三州澄海忠敢知其山川習其伎藝者三千人入𢷬巢穴餘兵絡山足出則獵取之俟其勢窮力屈然後可招撫也朝廷用其䇿二族皆降湖南遂平是時軍旅暴興運路險澁公隨宜區處資粮豐給而民不疲病召為度支判官行未至復加直史舘知潭州兼荆湖南路安撫使先是北軍戍湖南山谿者或期年或再期乃代去再期者多死瘴癘公奏以為不均請皆以期年為斷所生全甚衆歸朝除河東路轉運使自慶歴以來河東行鐵錢民多盗鑄吏以峻法懲之抵罪者日繁終不能禁公乃命高估鐵價盗鑄者無利不禁自息入為度支副使儂智高冦掠廣南既敗走詔以公為西路安撫使天子以嶺南地惡命公非賊所殘州縣不必往公曰天子之命至仁也然逺民新罹荼毒余敢不究宣天子之澤以面慰之乎遂徧行州縣雖窮僻無不到者民避賊多棄}
