  - {type: variant, offset: 3655, length: 2, content: 煒煌, WYG: 修宜逺到命不融衆所悼仁和縣君潘氏墓誌銘熙寧二年作皇從姪右武衛大将軍蓬州刺史令超之夫人曰仁和縣君潘氏故鄭王美之曽孫平州刺史惟熙之孫閤門祇候仁矩之子生十六年以選歸}
  - {type: variant, offset: 3658, length: 0, content: '', WYG: 蓬州使君封仁和縣君熙寧二年八月已未疾以卒享年二十有四生五子男子翺右内率府副率次二男未名二女早夭銘曰太勲之門克生令孫歸於帝族禀命天昏款文幽石以識塋園皇從姪右屯衛大将軍士虬墓記熙寧二年作右}
  - {type: page-break, offset: 3658, content: '', id: KR4d0040_WYG_078-23a, image: WYG1094/WYG1094-0721c.png}
  - {type: variant, offset: 3659, length: 5, content: 古庻㡬亦足, WYG: 牛衛将軍士虬右武衛大将軍果州團練使齊安郡公仲郃之子贈安化軍節度觀察留後高宻郡公宗望之孫贈安逺軍節度使同中書門下平章事宻國公允言之曽孫也母曰安康縣君李氏将軍生五嵗}
  - {type: substitution, offset: 3660, original: 庻, replacement: 庶, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-17347}}
