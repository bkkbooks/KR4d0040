  - {type: variant, offset: 5480, length: 4, content: 銘相示且, WYG: 初娶張氏早終生女適解人南公佐公佐舉進士得同學究出身再娶蘇氏先府君十年終年五十八生男宣又娶郭氏無子後府君十六年終年若干宣用司徒公䕃補郊社齋郎累官為尚書駕部貟外郎知梁山軍今致仕居家駕部君寛厚有守練習法令善為政吏民不能欺既升朝累贈府君官至衛尉少卿夫人蘇氏追封長安縣太君駕部君謂古君子必論譔其先人之美著諸金石故}
  - {type: page-break, offset: 5480, content: '', id: KR4d0040_WYG_079-17a, image: WYG1094/WYG1094-0730a.png}
  - {type: variant, offset: 5486, length: 2, content: 爲神, WYG: 直敘其實以表於府君之墓}
