  - {type: indent, offset: 3426, content: 　　　, id: KR4d0040_krp_031-bkkind19}
  - {type: variant, offset: 3426, length: 0, content: '', WYG: 言陳述古劄子治平二年正月十日上臣竊聞陜西都轉運使陳述古昨因巡邊妄奏朝廷稱邊鄙寜静不足爲慮後因權涇原路經略司事聞副緫管劉几稱西人㸃集將謀入冦請出兵防扞述古恐與前奏相違因此怒几奏稱不協軍情張皇生事擅移几知鳯翔府數日之間西人果大舉犯邊殺掠弓箭手及熟户蕃部述古亦不即時發兵救援致陷没數千户近者雖知朝廷已差臺官勘述古罪狀然竊聞所坐止於擅移劉几及奏狀有不實之處若以文吏議之罪不至重若以國計言之爲害實深何則國家承平日久人不習戰雖屯戍之兵亦臨敵難用唯弓箭手及熟户蕃部皆生長邉陲習山川道路知西人情偽材氣勇悍不懼戰鬬從来國家頼之以爲藩蔽今述古知西人欲来侵擾而自避飜覆之辜順成欺罔之謀抑遏將官不許救䕶遂以數千户生民委於虎口使父子流離骨肉塗炭豈惟已陷没者深可哀痛臣恐自今以後諸路弓箭手皆不敢於極邉居止熟户蕃部皆有叛國從賊之心以此觀之其害豈小哉况述古出於門䕃材氣庸鄙自歴官以来所至之處縱恣胷臆殘虐吏民不顧憲典輕侮王命驕暴狠狡天下共知屢曽坐事黜降旋復収用叨竊名位一朝至此誠過其分量故天奪之魄舉措乖謬駭人視聴陷敗民命挫辱國威内外之人無不憤疾臣聞舜誅四㓙而天下服如述古平生所爲亦可以謂之㓙人矣陛下縱不欲明加斧鉞以謝邉民亦當投之荒裔以禦魑魅庶使封疆之臣少加警懼取進止言皮公弼劄子治平二年正月十一日上臣伏覩近降詔書於初任第二任通判人中選人權發遣三司判官公事九年之後擢爲職司既使之久於其事又待以不次之位此誠用人之要術爲政之首務也然當兹選擢之初天下士大夫莫不延頸而望拭目而視若得清修孤直之人則皆勸慕爲善砥節礪行不肖者亦化爲賢矣若得貪汚諂偽之人則皆傾巧干進飾貌盗名安恬者亦變而爲躁矣此乃風俗之本原政治之樞機不可以不慎自非有竒材異績爲天下所知未可容易當此舉也竊見尚書都官員外郎皮公弼爲吏之處以貪饕致富資性狡猾善爲進取在京師則造請不倦在外則書啟相尋專用此術致舉主三十餘人一旦首膺兹選天下之人苟有知公弼所爲者但私議竊歎憤鬱喑嗚莫敢發言此豈可以稱陛下求賢之意副四方跂竦之望哉若所選之人皆如皮公弼之類乃是開此徼倖之門以爲佞邪躁進之塗恐非朝廷之福也所有皮公弼伏望聖慈追還前命勒歸本任况今中外之官本資序合入三司判官者尚不啻數十人豈得其中全無可選擇者願且選以補即目三司判官之闕俟果有竒材異績爲衆所知者然後依近降詔書舉而用之天下幸甚取進止言皮公弼第二劄子臣近曽上言乞罷皮公弼三司判官公事未聞朝廷施行臣聞周禮小宰以六計弊羣吏之治曰亷善亷能亷謹亷正亷法亷辨盖言爲吏者雖有六事皆以亷爲本也翼奉曰人誠向正雖愚爲用若乃懐邪智益爲害盖言人操心不正者雖有材能無所用也今以公弼材能求於朝士之間不爲難得若其貪汚諂偽則罕有其比陛下方欲簡㧞英賢待之不次以砥礪羣臣新美大化而得公弼之徒臣恐四方聞之無不觧體使亷正之士沈抑而不顯貪邪之人輻湊而競進其於虧損聖政敗壊風俗不爲細事伏望陛下早追還公弼前所授恩命勒歸東明本任取進止言王廣淵剳子治平二年正月十三日上臣伏見新除王廣淵直集賢院外廷之人無不怪惑偶語族談莫知其故或云廣淵以唇舌便佞遊走於公卿之門盖執政所薦也或云陛下龍潜之時廣淵以文章因陛下故人自薦逹素䝉知賞故特加㧞擢此二者臣莫知其虚實若果有其一皆非朝廷之美也夫端士進者治之表也憸人進者亂之階也臣窃聞廣淵雖薄有有文藝其餘更無所長於士大夫之間好奔競善進取稱為第一若以此獲公卿之知則其人固非端士矣曏以初任通判編排中書文字二年之間堂除知舒州搢紳已皆相與指目以為僥倖今又驟加美職安得不取外廷之怪惑乎陛下方涖政之初欲簡㧞天下賢材寘諸不次之位以率厲羣臣而執事之臣不能稱陛下之意前此用皮公弼權發遣三司判官今又用王廣淵直集賢院將何以使天下之人尚廉恥之莭崇敦厚之風乎若陛下龍潜之時廣淵果曽以文章自達於左右此尤不可昔漢文帝時景帝為太子嘗召上左右飲中郎将衛綰獨稱疾不往及即位寵待綰過於佗臣周太祖時世宗鎮澶州張美為三司吏掌州之錢穀世宗私有求假美悉力應奉及即位衆皆稱美材敏而世宗終薄其為人廣淵若當仁宗之世私以文章獻於陛下為臣忠謹者肯如是乎陛下今日當治其罪而又賞之將何以厲人臣之節也所有王廣淵新直集賢院勅伏乞追還言王廣淵第二劄子臣近曽上言乞罷王廣淵直集賢院事未聞朝廷施行外議籍籍至今未已臣備位諌職不敢塞黙竊見廣淵憸邪便佞勤於造請以此之故自幕職入京數年之間得堂除知州今又以特㫖直集賢院臣不知廣淵有何才徳過絶於人而受國家寵榮如此之速也議者皆言陛下在藩邸時廣淵因時君卿以文章筆札私有䞇獻深自結納故有今日之命若果如此大為非宜臣聞為人君者洗濯其心至公至正審察善惡明辨是非忠信者雖有怨讎而必用姦回者雖有私恩而必誅是以羣臣暁然各知所守一心同徳以事其上今廣淵若於仁宗之世私結陛下之知則陛下察其為人果為忠信果為姦回若以此獲美官則姦囘之臣欲求進身者將何所不為恐非陛下之利也自古以來惟英明之主能知此理伏望陛下追還廣淵恩命仍嚴加竄謫以懲憸巧之臣用心不一者取進止傳家集巻三十三欽定四庫全書傳家集巻三十四宋司馬光撰章奏十七乞罷陜西義勇劄子治平元年十一月二十二日上臣傳聞朝廷差陜西提㸃刑獄陳安石於本路人户三丁之内刺一丁充義勇不知虛實若果如此大爲非便臣竊意議者必以爲河北河東皆有義勇而陜西獨無近因趙諒祚寇邉故欲廣籍民兵以備緩急使之捍禦也臣伏見康定慶厯之際趙元昊叛亂王師屢敗死者動以萬數國家乏少正軍遂籍陜西之民三丁之内選一丁以爲鄉弓手尋又刺充保捷指揮差於㳂邉戍守當是之時閭里之間惶擾愁怨不可勝言耕桑之民不習戰鬭官中既費衣粮私家又須供送骨肉流離田園盪盡陜西之民比屋凋殘至今二十餘年終不復舊者皆以此也其謀策之失亦足以爲戒矣是時河北河東邉事稍緩故朝廷但籍其民以充義勇更不刺爲軍雖比之陜西保捷爲害差小然國家何甞使之捍禦戎狄得其分毫之益乎今議者但怪陜西獨無義勇不知陜西之民三丁之内已有一丁充保捷矣自西事以来陜西困於科調比於景祐以前民力減耗三分之二加之近嵗屢遭凶歉今秋方獲小稔且望息肩又值邉鄙有警衆心已揺若更聞此詔下必大致驚擾人人愁苦一如康定慶厯之時是賊寇未来而先自困弊也况即日陜西正軍甚多不至闕乏何爲遽作此有害無益之事以循覆車之轍也伏望朝廷審察利害特罷此事誠一方之大幸取進止乞罷陜西}
