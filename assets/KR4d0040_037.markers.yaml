  - {type: line-break, offset: 3779, content: '', id: KR4d0040_SBCK_037-9b12}
  - {type: variant, offset: 3782, length: 0, content: '', WYG: 節習尚浮華舊俗益敗然所舉秀孝猶以經術取之州郡}
  - {type: page-break, offset: 3782, content: '', id: KR4d0040_WYG_040-5a, image: WYG1094/WYG1094-0373c.png}
  - {type: variant, offset: 3783, length: 1, content: 腹, WYG: 置中正以品其才行一言一動之失或終身為累士猶兢兢不敢自放隋始置進士唐益以明經等科而秀孝遂絶止有進士明經二科皆自投牒求試不復使人察舉矣進士初但試䇿及長安神龍之際加試詩賦於是進士專尚屬辭不本經術而明經止於誦書不識義理至於徳行則不復誰何自是以來儒雅之風日益頽壊為士者狂躁險薄無所不為積日既乆不勝其弊於是又設謄錄封彌之法盖朝廷苦其難制而有司急於自營也夫欲搜羅海内之賢俊而掩其姓名以考之雖有顔閔之徳苟不能為賦詩論䇿則不免於遭擯棄為窮人雖有跖蹻之行苟善為賦詩論䇿則不害於取髙第為美官臣故曰取士之弊自古始以來未有若近世之甚者非虚言也今幸遇陛下聖眀}
  - {type: page-break, offset: 3783, content: '', id: KR4d0040_WYG_040-5b, image: WYG1094/WYG1094-0373d.png}
  - {type: variant, offset: 3785, length: 4, content: 耳目股肱, WYG: 知貢舉之極弊慨然發憤深詔羣臣使得博議利病更立新規是千載一時也議者或曰古人郷舉里選今欲知士之徳行宜委知州知縣者采察其實保而薦}
  - {type: variant, offset: 3791, length: 0, content: '', WYG: 獨以為不然古者分地建國自卿大夫士皆以其國人為之猶患處士之徳行不可得而詳}
  - {type: page-break, offset: 3791, content: '', id: KR4d0040_WYG_040-6a, image: WYG1094/WYG1094-0374a.png}
  - {type: variant, offset: 3792, length: 0, content: '', WYG: 故又擇其郷之賢者使為閭胥比長自幼及長朝夕察其所為然後士之徳行美惡莫得而隠也今夫知州知縣雜四海九州之人逺者三嵗而更近者數月而更或初到官即遇科塲遽責之知所部士人之徳行誠亦難矣又應開封府舉者常不减數千人而開封府獄訟之繁知府者自旦至暮耳不暇聴目不暇視又有餘裕可使之察數千人之徳行乎議者又曰宜去封彌謄錄委有司考其文辭参以行實而取之臣獨以為不然夫士之徳行知州縣者尚不能知而有司居京師一旦集天下之士獨以何術知之其術不過以衆人之毁譽決之孔子曰衆好之必察焉衆惡之必察焉夫衆之毁譽庸詎足以盡其實乎必如是行之臣見其愛憎互起毁譽交作請託公行賄賂上流謗讟並興獄訟不息將紛然殽亂朝廷必厭苦之而復用封彌謄錄矣夫封彌謄録固為此數者而設之也譬猶築防以鄣洚水也今不絶其源而徒去其防則横流之患愈不可救矣臣雖至愚平生固嘗竭其思慮欲以少救其弊今敢陳二䇿乞}
  - {type: page-break, offset: 3792, content: '', id: KR4d0040_WYG_040-6b, image: WYG1094/WYG1094-0374b.png}
  - {type: page-break, offset: 3792, content: '', id: KR4d0040_WYG_040-7a, image: WYG1094/WYG1094-0374c.png}
  - {type: variant, offset: 3794, length: 0, content: '', WYG: 俯加裁擇臣聞上之所為下之所歸也國家從來以賦詩論䇿取人不問徳行故士之求仕進者日夜孜孜專以習賦詩論䇿為事惟恐不能勝人父教其子兄勉其弟不是過也今若更以徳行取人則士之力於徳行亦猶是也}
  - {type: variant, offset: 3795, length: 0, content: '', WYG: 風化清濁之原歴代訛謬而不寤必待聖朝然後正之者也夫徳行修之於心藏之於身雖家人有所不知况於郷黨况於州縣况於朝廷將何從知之故必待明哲公正之臣知而舉之然後四海之士皆可得而官使也然舉薦之法既行則干求屬請誠所不}
  - {type: page-break, offset: 3795, content: '', id: KR4d0040_WYG_040-7b, image: WYG1094/WYG1094-0374d.png}
