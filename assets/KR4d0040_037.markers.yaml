  - {type: variant, offset: 4463, length: 0, content: '', WYG: 出入節其遊戯教以鈔節經史剽竊時文以夜繼晝習賦詩論䇿以取科名而已此豈先王立學之意邪於以修明聖道長育人材化民成俗固已疎矣臣欲乞自今天下州學只許置教授一人委本州長吏於本處命官中選擇無過犯有節行能講説為衆所服者舉奏補充若本州無人則奏乞下銓司選差委銓司於見在銓選人内揀選進士明經諸科出身人歴任無贓私罪能講說經書者奏補充逐州教授仍令國子監試講說經書應舉人初入學者並為外舍生唯赴聽講及公試外不得於學中宿食其教授每日講書畢取在學諸生姓名書於籖上雜置筩中抽取三人問以聽過書中疑義三條使對衆解說通者置簿記録粗者不問不者有罰每月中兩次公試各試所習舉業委教授考校定優劣等第具姓名出榜示訖亦置簿記錄其有過犯者小過則罰錢中過則降等謂自内舍髙等降為中等中等降為初等初等降為外舍生外舍生無等可降者勒出學大過則斥出學亦置簿記錄每遇春秋釋奠畢委教授選擇外舍生到學及半年以上自前次釋奠以來說書多通公試多在優等姓名近上即為優等過犯情輕少即升入内舍為初等生始聽於學中宿食又選擇初等生升為中等生中等生升為髙等生皆如外舍生之法其有}
