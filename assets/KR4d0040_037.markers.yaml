  - {type: variant, offset: 3688, length: 3, content: 敢當受, WYG: 傷罪不至死者並}
  - {type: variant, offset: 3692, length: 1, content: 乞, WYG: 取勅裁以為謀殺已傷而罪不至死者即是自首之人按尊長謀殺卑幼之類皆是巳傷而罪不至死不必因首也遵又引律疏問答條云謀殺凡人乃云是舅又云謀殺之罪首盡顯是謀殺}
  - {type: variant, offset: 3695, length: 11, content: 回納奉御寳批依奏臣㣲懇, WYG: 自首案彼皆謂謀而未傷方得首免若其巳傷何由可首凡議罪制刑當使重輕有叙今若使謀殺巳傷者得自首從故殺傷法假有甲乙二人甲因鬭毆人鼻中血出既而自首猶科杖六十罪乙有怨讐欲致其人於死地暮夜伺便推落河并偶得不死又不見血若來自首止科杖七十罪二人所犯絶殊而得罪相埒果然如此豈不長姦況阿云嫌夫醜陋親執腰刀就田野中因其睡寐斫近十刀斷其一指初不陳首直至官司執錄將行栲棰勢不}
