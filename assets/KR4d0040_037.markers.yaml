  - {type: line-break, offset: 3859, content: '', id: KR4d0040_SBCK_037-10a04}
  - {type: variant, offset: 3868, length: 553, content: 天下之事猶一堂之上陛下何患於不知哉今深處九重之内詢於近習之臣采道聽塗說之言納曲躬附耳之奏不驗虚實即行賞罰臣恐䜛邪得以逞其愛憎而陛下爲之受其譏謗也近聞王中正差往陜西句當公事有知涇州劉渙等曲加謟奉鄜延路鈐轄吴舜臣違失其意俄而渙等進擢舜臣降黜衆人皆言中正所爲審或如是則是中正弄權已有明驗今陛下又置之肘腋委以腹心臣恐天下之人將重足一迹而畏之輿金輦璧而奉之矣外議又言山陵禮畢韓琦必求引退兩府當有遷𥙷臣竊慮兩制巳上萬一有無廉恥之人或隂結此屬以求進用者夫以尭之聦明咨于四岳衆言僉同然後用人猶失之於鯀况可决於近習之口乎凡公忠正直之士必不肯借譽左右以求自售齊威王所以賞即墨大夫而烹阿大夫正謂此也昔漢唐之衰宦官所以能壞亂綱紀傾覆國家者皆由人主與之謀議幃幄進退群臣故也此乃治亂安危之夲不可不察伏望聖慈詳思臣言凡欲知天下之事當詢訪外庭之臣其王中正不可令句當御藥院或姦佞之臣豫設機謀以經營兩府者必不可用則天下幸甚取進止王中正第三劄子臣伏奉手詔莭文問王中正等事得之於何人可宻奏来臣以非才誤受陛下聖知擢爲御史中丞惟懼曠職孤忝大恩毎與賔客語言無不詢訪時事稍有毫髮裨益盛德率皆奏陳此事臣得之賔客前後非止一人誠恐玷累公朝所以有此論述中正有無此語惟陛下可以知之臣在闕門之外何由知其虚實若其果有此事陛下得以爲戒若其無有臣敢避妄言之罪但外人有此論議, WYG: 羣}
