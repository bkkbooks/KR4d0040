  - {type: variant, offset: 3677, length: 0, content: '', WYG: 九欽定四庫全書傳家集巻四十宋司馬光撰章奏二十三議謀殺巳傷案問欲舉而自首狀知登州許遵奏婦人阿云於母服内與韋阿大定婚成親後嫌韋阿大夜間就田中用刀斫傷縣尉令弓手勾到阿云問是你斫傷本夫實道來不打你阿云遂具實招通合作案問欲舉减二等大理寺不合作謀殺已傷絞罪㫁遣下刑部定得大理寺允當遵不服詔下光與安石定奪安石以為遵議是後朝廷竟從安石議右臣竊以為凡議法者當先原立法之意然後可以㫁獄竊詳律文其於人損傷不在自首之例注云因犯殺傷而自首者得免所因之罪仍從故殺傷法所謂因犯殺傷者言因犯他罪本無殺傷之意事不得巳致有殺傷除為盗之外如刼囚略賣人之類皆是也律意盖以於人損傷既不得首恐有别因餘罪而殺傷人者有司執文并其餘罪亦不許首故特加申明云因犯殺傷而自首者得免所因之罪然殺傷之中自有}
  - {type: page-break, offset: 3677, content: '', id: KR4d0040_WYG_040-1a, image: WYG1094/WYG1094-0371c.png}
  - {type: page-break, offset: 3677, content: '', id: KR4d0040_WYG_040-1b, image: WYG1094/WYG1094-0371d.png}
  - {type: variant, offset: 3678, length: 0, content: '', WYG: 等輕重不同其處心積慮巧詐百端掩人不備者則謂之謀直情徑行略無顧慮公然殺害者則謂之故謀者尤重故者差輕今此人因犯他罪致殺傷人他罪雖得首原殺傷不在首例若從謀殺則太重若從闘殺則太輕故酌中令從故殺傷法也其直犯殺傷更無他罪者惟未傷則可首但}
  - {type: page-break, offset: 3678, content: '', id: KR4d0040_WYG_040-2a, image: WYG1094/WYG1094-0372a.png}
  - {type: variant, offset: 3679, length: 3, content: 永昭陵, WYG: 已傷皆不可首也今許遵欲將謀之與殺分為兩事案謀殺故殺皆是殺人若將謀之與殺分為兩事則故之與殺亦是兩事也且律稱得免所因之罪彼刼囚略人皆是巳有所犯因而又殺傷人故刼略可首而殺傷不原若平常謀慮不為殺人當有何罪可得首免以此知謀字止因殺字生文不得别為所因之罪也若以刼鬭與謀皆為所因之罪從故殺傷法則是鬭傷自首反得加罪一等也遵所引蘇州洪祚㫁例案律疏云假有因盗故殺傷人而自首者盗罪得免故殺傷罪仍科疏既指言故殺傷人則是因盗謀殺傷人者自從謀法當}
  - {type: page-break, offset: 3679, content: '', id: KR4d0040_WYG_040-2b, image: WYG1094/WYG1094-0372b.png}
