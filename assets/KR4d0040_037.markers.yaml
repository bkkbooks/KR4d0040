  - {type: variant, offset: 3763, length: 4, content: 爲非冝陛, WYG: 為大理寺刑部所定巳得允當難從許遵所奏作案問欲舉减等而科今來與王安石各有所見難以同共定奪伏乞朝廷特賜裁酌施行議貢舉狀熈寕二年五月上臣准御史臺牒准勅節文天}
  - {type: variant, offset: 3768, length: 2, content: 内有, WYG: 學校貢舉之法宜令}
  - {type: variant, offset: 3773, length: 0, content: '', WYG: 省待}
  - {type: variant, offset: 3774, length: 0, content: '', WYG: 以上御史}
  - {type: variant, offset: 3775, length: 2, content: 諌外, WYG: 三司三館臣僚各限一月具議狀聞奏者臣聞詩云無競惟人四方其訓之言欲立强於天下者無如得人得人而任之以事則四方斯順之矣臣竊惟取士之弊自古始以來未}
  - {type: page-break, offset: 3775, content: '', id: KR4d0040_WYG_040-4b, image: WYG1094/WYG1094-0373b.png}
  - {type: variant, offset: 3778, length: 3, content: 提轉牧, WYG: 若近世之甚者也何以言之自三代以前其取士無不以徳為本而未嘗專貴文辭也漢氏始置茂才孝廉等科皆命公卿大夫州郡舉有經術徳行者䇿試以治道然後官人故其風俗敦尚名節降及末世雖政衰於上而俗清於下由取士之術素加奬厲故也魏晋以降貴通才而賤}
  - {type: 'kr:newline', offset: 3779, content: '

