  - {type: variant, offset: 1723, length: 556, content: 籍籍頗謂僥忝國初草創天歩尚艱故祖宗即位之始必拔擢左右之人以爲腹心羽翼豈以爲永丗之法哉乃遭時不得已而然也自後嗣君守承平之業継聖考之位亮隂未言之間有司因循踵爲故事凡東宫僚吏一槩超遷謂之隨龍以此昭選之徒得自厮役直除班行其爲幸已多矣乃敢妄有攀援邀求無巳曽不自省有何功勲小人之心終無厭極不可縱也且閤門祗候祖宗所以蓄養賢才以待任使之地也其班序差遣事事不同譬諸文臣則舘閣之流也豈可使厮役之人爲之哉况東宫其餘吏卒甚衆苟一人得之則皆有兾望之心此書所謂啓寵納侮者也陛下旣承大統則率土之濵誰不爲臣而獨私於東宫之人則所與親者至狹矣臣昨除御史中丞𥘉上殿之日首以官人賞罰爲言誠以三者致治之夲自上丗以來不易之道也今昭選等以賤隷而叨美職是官不擇人也無横草之勞而數月之間恩命相継是無功受賞也姦慝明著如髙居簡等尚保而庇之是有事不罰也陛下始初清明方勵精求治而乃輕其官爵慢其賞罰如此將以興太平之功猶適楚而北轅也今臣所以區區進言者但爲陛下惜此而巳所有昭選等新除隱門祗候乞賜追寢取進止帖黄或聞昭選等因告昌王入言得此㫖未知虚的審或如此尤爲不可陛下之於昌王但當極其友愛至於官爵刑賞乃陛下政柄湏决之聖心昌王亦不當關預陛下亦不當聽從如此則兄弟之恩全君臣之分正矣漢館陶公主爲子求郎明帝不許賜錢十萬曰郎官上應列宿出宰百里有非其人民受其殃是以難之彼爲其子猶不可况爲它人乎, WYG: ''}
