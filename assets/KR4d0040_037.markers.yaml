  - {type: line-break, offset: 0, content: '', id: KR4d0040_SBCK_037-1a01}
  - {type: variant, offset: 0, length: 1243, content: 温國文正公文集卷第三十七章奏二十二王廣淵第三劄子髙居簡第二劄子髙居簡第三劄子封事劄子髙居簡第四劄子郭昭選劄子帖黃髙居簡第五劄子王中正第一劄子辭賜金第一劄子第二劄子納賜金劄子王中正第二劄子王中正第三劄子石椁劄子王廣淵第三劄子臣前兩次上言王廣淵傾巧姦邪乞盡奪去職名與逺地監當近聞夲人帶職知齊州仍賜章服如此乃是賞之非黜之也曏使廣淵自改京官以来謹身守分不爲姦謟以至今日不過作第二任通判今所得乃如此豈可謂爲姦謟無益哉孔子稱唯噐與名不可以假人今之章服所謂器也職名所謂名也二者皆無用之物然而天下貴之者爲其非賢材則不能得之故也唐宣宗重惜章服不輕以與人有司製緋紫衣以備賜與經年不用三兩領故當時服緋紫者人以爲貴夫名器者譬如珠玉若使之易得如瓦礫尚安足貴乎近歳兩次覃恩服緋紫者巳爲汎濫今又如陳鑄王廣淵軰皆賜章服是使今後受賜服者皆以爲恥不以爲榮也且陛下使廣淵出補外官者必巳知其姦邪之迹也今又復以職名章服寵之是勸人使効廣淵所爲也臣竊恐非國家之福伏望聖断依臣前奏盡奪去廣淵職名并此来章服與逺地監當使賞善訓惡皦然明白取進止髙居簡第二劄子臣近曽上言句當御藥院髙居簡工䜛善佞乞逺加竄逐未蒙施行昔周公以立政戒成王至虎賁綴衣趣馬小尹左右攜僕百司庻府亦皆擇人穆王命伯冏爲太僕正曰昔在文武侍御僕從罔匪正人又曰慎簡乃僚無以巧言令色便辟側媚其惟吉士僕臣正厥后克正僕臣䛕厥后自聖自古聖帝明王雖左右小臣未甞不謹擇端良之人以自防逸豫之生也况陛下嗣膺寳命聖德惟新善惡興襄於此乎分而使䜛佞如居簡者旦夕常在左右又寵而信之此乃異日禍亂之根腹心之疾也臣職在去邪不敢不再三上言伏望聖明依祖宗舊制應句當御藥院官至崇班以上者並令出外其髙居簡仍乞逺加竄逐取進止髙居簡苐三劄子臣近曽兩次上言句當御藥院髙居簡工䜛善佞乞逺加竄逐至今不蒙降出施行居簡頃在先朝巳竊弄權柄依慿城社玷辱聖明物論洶洶切齒側目及陛下継统必謂首行誅竄以警邪臣不意居簡狡猾多端先自結於陛下使陛下寵愛信任更過於先帝之時朝廷公忠之士無不憤懣深為陛下惜之方今内侍之臣小心謹慎可以備陛下左右使令者何可勝數陛下足以擇而用之何必違祖宗舊典負天下譏謗獨保護居簡堅如金石臣竊惑之伏望聖慈取臺諌官前後所言居簡文序盡付所司明治其罪以彰至公之義順合衆心其餘句當御藥院者亦乞遵舊制官至内殿崇班以上並授以向外差遣取進止封事劄子臣伏以大舜舉賢敷納以言明試以功漢武帝詳延特起之士待以不次之位終獲其用威加胡越真宗皇帝緫覧群臣章奏用其言而顯其身以成咸平景德之治凡察言所以知人知人所以立政自古及今其道一也今陛下即政之𥘉首開言路令中外臣民皆得上封事海内欣欣咸畢精竭思以承休德若於此際能采其嘉謀舉其賢材而用之則太平之基可指日而望也若徒備外飾廢其言而不用棄其人而不取則天下頽弊之事當何時而振起乎臣與張方平先受詔詳定中外所上封事雖巳盡心料簡合於義理可施行者一一奏聞更望陛下擇其精者決自聖意必令行之其有識慮稍出於衆者願陛下特賜召對靣加詢訪考其虚實果有可采宻藉姓名遇有差遣隨材授任俟其實有顕効然後不次㧞擢如此則嘉言罔攸伏野無遺賢矣取進止髙居簡苐, WYG: ''}
