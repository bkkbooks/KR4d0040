  - {type: line-break, offset: 3799, content: '', id: KR4d0040_SBCK_037-10a01}
  - {type: variant, offset: 3800, length: 0, content: '', WYG: 者國家以嚴法繩之勿加恩貸則苟且狥私之人皆知懼矣且國家既以徳行取士則彼貪猾輕躁之人依附權要枉道求進者皆為清議所貶見棄於時雖有舉者必不多矣臣愚欲乞今後應係舉人令升朝官以上嵗舉一人提㸃刑獄以上差遣者嵗舉二人諫議大夫或待制以上嵗舉三人不以所部非所部鄉里非鄉里除自已親戚及曽犯真刑或私罪情理重曽經罰贖及不孝不友盗竊淫亂明有迹狀者不得舉外其餘皆得舉之仍於舉狀内眀言臣今保舉某州某科某人有學術節行乞賜召試若舉狀既上之後却有前後諸般違礙事發其舉主並依律文貢舉非其人分故失從公私罪定斷受贓而舉者以枉法論其舉狀逐時送下禮部貢院置簿記錄若應舉人而不舉者嵗終委貢院勘㑹姓名開奏乞嚴加朝典每遇三年一開貢舉委貢院截自詔下之日勘㑹選擇舉主最多者從上取之舉主數同則以舉狀到省月日先後為次其舉主曽有􅂍罪及見停閒身亡或在合舉人數外者並不}
  - {type: page-break, offset: 3800, content: '', id: KR4d0040_WYG_040-8a, image: WYG1094/WYG1094-0375a.png}
  - {type: page-break, offset: 3800, content: '', id: KR4d0040_WYG_040-8b, image: WYG1094/WYG1094-0375b.png}
  - {type: variant, offset: 3801, length: 0, content: '', WYG: 倍於每次科塲南省奏名人數具姓名聞奏乞下本貫發遣赴闕其本貫更不考試即具申狀解送赴貢院仍出公憑給付逐人令赴貢院照㑹限十一月内取齊十二月内引見正月内委貢院考試其試官或朝廷臨時添差進士試經義䇿三道子史䇿三道時務䇿三道更不試賦詩及論明經及九經等諸科試本經及論語孝經大義共四十道明經加試時務䇿三道其帖經墨義一切皆不試對䇿及大義但取義理優長不取文辭華巧唯所對經史乖僻時務疎濶者即行黜落其奏名人數並依科塲舊制若合格者少不滿舊數亦聽至御試時進士明經各試時務䇿一道九經等諸科試本經大義十道所有名字髙下並只以舉主多者為上舉主數同則以舉狀到省月日先後為次其舉人所納家狀及授官後吏部所給告身並湏開坐元初舉主人數姓名若及第後犯私罪情理重及贓罪其舉主並减一等坐}
  - {type: page-break, offset: 3801, content: '', id: KR4d0040_WYG_040-9a, image: WYG1094/WYG1094-0375c.png}
