  - {type: variant, offset: 2760, length: 0, content: '', WYG: 言王中正第二劄子臣竊聞陛下好令内臣采訪外事及問以羣臣能否臣愚竊以為非宜陛下内有兩府兩制臺諫外有提轉牧守皆腹心耳目股肱之臣也陛下誠能精擇其人使之各舉其職薦舉賢能糾案姦慝論政事得失述民間利病皆令列於奏牘明白啟陳其有尸祿偷安及挾私欺罔者小則罪黜大則誅竄誰敢不盡公竭誠以承休徳如此則天下之事猶一堂之上陛下何患於不知哉今若深處九重之内詢於近習之臣采道聽塗說之言納曲躬附耳之奏不騐虚實即行賞罰臣恐讒邪得以逞其愛憎而陛下為之受其譏謗也近聞王中正差徃陜西勾當公事有知涇州劉渙等曲加諂奉鄜延路鈐轄吴舜臣違失其意俄而渙等進擢舜臣降黜衆人皆言中正所為審或如此則是中正弄權已有明驗今陛下又置之肘腋委以腹心臣恐天下之人將重足一迹而畏之輿金輦璧而奉之矣外議又言山陵禮畢韓琦必求引退兩府當有遷補臣竊慮兩制以上萬一有無亷耻之人或隂結此屬以求進用者夫以尭之聦明咨於四岳衆言僉同然後用人猶失之於鯀況可决於近習之口乎凡公忠正直之士必不肯借譽左右以求自售齊威王所以賞即墨大夫而烹阿大夫正謂此也昔漢唐之衰宦官所以能壊亂綱紀傾覆國家者皆由人主與之謀議幃幄進退羣臣故也此乃治亂安危之本不可不察伏望聖慈詳思臣言凡欲知天下之事當詢訪外廷之臣其王中正不可令勾當御藥院或姦佞之臣豫設機謀以經營兩府者必不可用則天下幸甚取進止言王中正第三劄子臣伏奉手詔節文問王中正等事得之於何人可宻奏來臣以非才誤受陛下聖知擢為御史中丞惟懼曠職孤忝大恩每與賔客語言無不詢訪時事稍有毫髮禆益盛徳率皆奏陳此事臣得之於賓客前後非止一人誠恐玷累公朝所以有此論述中正有無此事惟陛下可以知之臣在闕門之外何由知其虚實若其果有此事陛下得以為戒若其無有臣敢避妄言之辜但外人有此議論臣不敢不令陛下知之萬一有益聖明皆微臣之幸也取進止言石椁劄子治平四年九月八日上臣伏見永厚陵皇堂巻軬石四重其二重並寄於枋木之上陛下孝心深逺以為異日枋木終歸朽腐石若隕墜於梓宫非便發自聖謀欲為石椁其修奉山陵都護宋守約鈐轄張若水以䇿非巳出百端沮難苟欲修飾目前自營私計不為梓宫萬世之慮為人臣子不忠如此乃敢令石匠作頭供狀稱八月二十七日進入梓宫後連夜造作計二十四時辰了畢如䝉別差人定奪却不依今來所定時辰先得了當甘軍令不辭公列奏牘誑惑朝廷是致掩閉皇堂及虞祭并木主到京之日皆曽改移臣昨充山陵儀仗使目覩内臣黄懐信用夷牀澁牀等下梓宫數刻之間安厝巳畢乃知守約若水等欺罔聰明輕侮邦憲若不懲戒則不公挾詐之人將何所忌憚伏望陛下治守約若水等罪嚴行責降若升袝畢有赦守約若水等縁修奉山陵得罪特乞不原其黄懐信等冝優與酧奬貴使賞罰明白人知聳畏取進止}
