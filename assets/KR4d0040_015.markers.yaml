  - {type: variant, offset: 4812, length: 1402, content: 薄今後不得爲例乞印行荀子楊子法言狀与舘閣諸君同上申本寺乞奏修築皇地祇壇狀皇祐三年五月上奉聖旨依式論劉平招䰟葬狀奏乞移髙禖壇狀皇祐三年十二月上論張堯佐除宣徽使狀皇祐二年十二月具草未上聞堯佐罷宣徽使遂不上論夏令公謚狀皇祐四年十月十三日上論夏令公謚第二狀二十二日上奉聖㫖改謚文莊論周琰事乞不坐溤浩狀請建儲副或進用宗室第一狀至和三年六月十九日上是歳仁宗違豫不臨朝者累月囯嗣未建天下寒心中外之臣勇悍不屈素以忠直自負如唐介等皆莫言惟范景仁時為諫官首建此議光聞而継之弟一狀留中第二第三狀降付中書論兩浙不冝添置弓手狀先公知杭州代作准勑命指揮云云臣竊觀兩浙一路與他路不同臣謹條列添置弓手不便事件如左伏惟聖恩省察少加詳擇焉當今西戎梗邊三方皆聳人心易動當務安之一旦聞異常詔書大加調發擐甲執兵學習戰陳置指揮使節級等名目頗似軍法以爲欲俲河北陜西㳂邊郷兵謂國家以權計點之假名捕盗漸欲收爲卒伍戍守邊防吴人輕怯易惑難曉道聽塗說衆情鼎沸至欲毀體捐生竄匿山澤臣雖明加告諭嚴行止約愚民無知不可户說誠恐差點之後揺動生憂其不可一也吴越素不習兵以故常少盗賊不過聚結朋黨私販茶塩時遇官司往往闘敵在於兩浙最爲劇賊然皆權時利合事訖則散不能乆相屯結又無銛利兵器止偷啇稅不敢剽掠平人近年以來雖亦頗有強盗然比諸内地要自稀踈今避差點者若竄匿無歸必例爲寇竊加以弓矢刀􅘫之類許其私置自今以後賊盗必多及私販茶塩之徒皆有利兵抵拒吏士益難擒討積㣲至著漸不可長其不可二也姦吏貪饕惟喜多事今計杭州管界當差若干人他州比率大凡有幾縣胥里長於兹相慶民旣憂愁而又脅之煩苦不安而又擾之所規自潤豈顧其外雖朝廷重爲懲禁特倍常科長吏勞心不能悉察厚利所誘死亦冒之加以版籍差誤户口異同毫氂不當互相告决追呼無時獄訟不歇則民未暇爲公上給役而先困於貪吏之誅求矣此之騷擾勢不能免其不可三也民皆生長畎畝天性敦愚所知不過播種之法所識不過耒耜之器加之吴人駑弱天下所知一旦使棄其所工學所不能恐徒煩教調終無所成就其有成不堪施用則是虚有煩費而與不添置無異其不可四也吴子壽夢以前世服於楚自申公巫臣得罪于楚逃奔于晉爲晉聘吴教之乗車教之戰陳其後楚人戎車歳駕早朝晏罷奔命不息以至吴亡自是以来號稱䡖狡逺則劉濞近至錢鏐其間承風倔強無数豈唯其人之跋扈亦由習俗之樂乱也幸頼祖宗之馴致陛下之敦化至徳之醲淪於骨髓暴乱之風移變無迹此皆上天降祐前世所不能庶幾者也今忽無故黷玩威稜狎侮危事示以逆徳弄之凶噐生姧回之心啓禍患之兆臣恐似非國家之至便所以萬全而無害其不可五也方今两浙雖水旱稍愆未至流殍閭閻無事盗賊不添縱使有之舊来吏士隨發擒討甚有餘力不假更求正恐平居興役有害無益而已臣職忝密近官俻藩方不敢黙然理湏上列伏望陛下特令两浙一路更不添置或以事湏過防舊人太少則乞只依近降勑命量加添𥙷更不立指揮使䓁名目閱習諸事一如舊規貴得衆情大安別無生事謹具狀奏聞㐲候敕旨爲孫太博乞免廣南轉運判官狀右臣今月九日樞宻院遞到勑牒一道差臣充廣南東路轉運判官臣昨自滑州簽判就除夲州通判未及半歳今又蒙恩授前件差遣於臣忝冒寔踰涯分供命陳力豈冝復辝嚮若止臣一身﨑嶇困苦雖更逺役靡不甘心敢以微誠䡖煩聖聽念臣二親垂白思戀郷里兩任滑州去家差近迎侍朝夕往來如意甘脆供湏頗爲私便一日離側倚門致念况復貪榮逺從吏道其在人子何心自安况轉運判官國家近置推擇委任務在得人以臣愚踈恐難堪稱伏惟聖慈詳求幹敏授以此職令臣且充滑州通判終滿一任庻得官政無廢侍養不闕君親之際恩義兩全棄骨畢身曷云補報論麦允言給鹵, WYG: ''}
