  - {type: variant, offset: 9306, length: 0, content: '', WYG: 論周琰事乞不坐馮浩狀皇祐四年十二月八日上臣伏奉聖㫖以鏁㕔應舉人周琰重疊用殊字既條制未明試官不申請定奪臣與馮浩各特罰銅五斤放仰荷含貸喜懼無量然臣昨在武成王廟考試之時其周琰所用殊字浩本疑不係重疊用韻由臣愚懵鑒别不精觀琰程試不見所善又據條制但言重疊用韻不云用佗韻引而恊之者非由此堅執輒行黜落鹵莽之罪盡皆在臣今浩與臣一例受罰臣雖無似能不愧心伏望聖慈特賜矜察與免馮浩責罰於臣更加嚴譴各得其分誠不敢辭奏乞移髙禖壇狀皇祐三年十二月上准敇節文髙禖壇地下仰依典故增修今據濠寨張徳等計料填疊修築都役右具如前竊縁見今所置髙禖壇處地勢極下若就彼填疊不惟功費甚大兼夏秋霖潦四集未免浸漬}
