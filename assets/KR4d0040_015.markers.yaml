  - {type: variant, offset: 0, length: 4792, content: 温國文正公文集卷第十五律詩十感物送伯淳監汝州酒酬安之謝光兄弟見過酬王安之聞罷眞率㑹和潞公伏日讌府園示坐客和子駿新荷司徒開府韓國冨公挽辭四首臧郎中挽歌二首和子華遊君貺園又和上元日遊南園賞梅花又和遊趙中令園又和遊吴氏園二首和子駿約遊一二園亭看花遇雨而止又即事二章上呈明日雨止復招子駿堯夫遊南園戲呈堯夫聞正叔與客過趙園歡飲戲成小詩和子華應天院行香歸過洛川寒食遊南園獨飲次前韻二首觀孫兒戲感懷陪子華燕醮聽酒半過趙令園和秉國寄子駿堯夫二留臺和伯常自郢州見寄和潞公行及白馬寺得留守相公書云名園例惜好花以俟同賞詩二章和子華喜潞公入覲歸置酒遊諸園賞牡丹陪致政開府太師留守相公致政内翰燕集輙歌盛美爲三公壽皆用公字爲韻景仁將歸頴昌輙爲詩二十韻紀贈復用三公燕集韻酬子駿堯夫和吴朝議執中字幾聖同年謝光與景仁同年見過伏蒙留守相公賜示陪太師潞公東田宴集詩輙敢屬和効趙學士體成口号十章上獻開府太師和潞公招堯夫不至和子華招潞公暑飲再和伯常見寄再和秉國約遊石淙送堯夫知河中府二首席君從於洛城種金橘今秋始結六實以其四獻開府大師招三客以賞之留守相公賦詩以紀竒事光竊不自揆輙依髙韻継成五章和留守相公九月八日與潞公宴趙令園有懷去年與景仁秉國遊賞和留守相公寄酒與景仁和秉國芙蓉五章安之朝議哀辭二首和堯大見寄華嚴真師以詩見貺聊成二章紀其趣尚和子華過王帥家見梅花盛開呈君實子駿兼簡堯夫和張伯常賀遷資政又書一絶戯呈又和南園真率㑹見贈春日思景仁神宗皇帝挽詞五首北京留守王太師挽歌詞二首感物朝看新鷰飛暮聴子規啼尺蠖身藏葉神龜尾曳泥韝鷹何用掣櫪馬不當嘶自伐憎狙巧頽然憂木雞送伯淳監汝州酒惟知負米樂不覺抱關卑出處兩得意是非皆自知酬安之謝光兄弟見過平時一二日不見巳相思况復閉關乆杳無攜手期清談勝妙藥髙韻敵涼颸愧乏機雲美虚承清眼知酬王安之聞罷真率㑹閉關寕是率辭疾似非真旣處譏嘲地誰爲長厚人虚舟非有意飄瓦不須嗔此過如何贖清秋宴席陳安之詩有解嘲意故以此戲之資一笑和潞公伏日讌府園示座客盛陽金氣伏華宇玉樽開真率除煩禮耆英集上才炎蒸疑逺避流景忘西頽幸忝俊逰並仍慙右席陪蒲葵參執扇氷果侑傳柸相國方留客如何務早回和子駿新荷懶不窺園乆元非効仲舒新荷滿沼緑籃舁出門踈借問含煙晚能勝裛露𥘉愧無魚戲句弄翰白紛如司徒開府韓國冨公挽辭四首天祐休明祚時生儁傑臣賢科首多士宰府澤生民煥爛三台正冲融四海春欲知甄冶力試問白頭人松漠驕無信漁陽廣聚兵移書侮中國决意背齊盟直氣輕軺入英辭左袵驚虜歸烽火滅㝢縣復升平大吕功名重鴻毛軒冕輕閑居容愈盛蹔出市皆傾溟海涵容大龍門謁見榮謙光儼在内慟哭望佳城杖屨還私第精誠在本朝愛君老不懈憂國没方昭東閤秋牢落西芒夜寂寥只應忠亮志氣運不能消臧郎中挽歌二首積慶承前烈呈才㑹聖時踐楊朝有籍治行吏爲師僚友皆親譽黎民每去思惜哉違丗早志業未全施素履存誠厚虚懷待物真郷閭昔相接朋友丗彌親遺扎蠅頭細長阡馬鬛新九原那可作空復想音塵和子華遊君貺園甲第朱門乆不開春風潜入發江梅今朝丞相雙車轍輾破林間水畔苔小桃似喜相君來爭發新花継落梅更仗環溪醒殘酒没蒿春水緑於苔大尉公引水繞園可以泛舟名曰環溪又和上元日遊南園賞梅花梅簇荒臺自可羞相君愛賞忘宵遊未言美實調羹味且薦清香泛酒甌又和遊趙中令園中舎園陪丞相遊百物恐誤勸酒不須愁春風陌上醒歸去只恐更爲桃李羞又和遊吴氏園二首天氣清和無喘牛花林爛漫竹林幽臨風髙詠足爲樂有勇方知笑仲由名園易主似行郵美竹髙松景自幽誰信本來天地物長爲己有固無由和子駿約遊一二園亭看花遇雨而止行樂及佳時官閑無所羈只知花正發不共雨爲期淺草碧無際濃雲冷四垂陪遊興未盡安得不相思來詩警向云人㝷載酒地雨破看花期又云感公行樂處蚤莫得相思又即事二章上呈雨不城遊半恐誤路歸逢花值柳倍依依朝來頼飲三盃酒醉卧西齋晝掩扉覺後追思氣味長歡情愁緒兩俱忘近來方得醉中趣熟寐沈沈是醉郷明日雨止復招子駿堯夫遊南園昨朝洛北阻遊陪惆悵中橋半醉回潑火旣經寒食雨解酲須撥凍醪醅詩傳曰春酒凍醪也遥思花寨交橫錦未分春心斗頓灰更與二三頭白友試擕薄具上髙臺戲呈堯夫近來朝野客無座不談禪顧我何爲者逢人獨懵然羡君詩旣好說佛衆誰先只恐前身是東都白樂天聞正叔與客過趙園歡飲戲成小詩吾廬寂寞類荒村但有林間鳥雀喧不似楚家多樂事笙歌拾得酔鄰園和子華應天院行香歸過洛川印節傳呼洛北還府庭無訟不妨閑度橋寒色侵春服按轡晴光露曉山香穗徘徊凝廣殿花籃繁㑹滿通闤自知白雪髙難和忍愧誰能寄我顔寒食遊南園獨飲寒食良辰無賞心雜花爛漫柳成隂若非獨酌酬佳景一日風光直万金次前韻二首頭白惜春情更深花間獨醉競分隂泉声醒耳自可樂不用歌拋滿䄂金南園莫笑獨追㝷明日未知晴與隂揮手一朝辝逆旅滿堂安用累千金觀孫兒戲感懷我昔垂髫今白頭中間萬事水東流此心争得還如尔戯走階前不識愁陪子華燕醮聽酒半過趙令園簮裾丞相閤林沼令君家煙曲香㝷篆盃深酒過花霏微燼沈水馥郁漬榠柤愧乏相如賦陪遊託後車和秉國寄子駿堯夫二留臺一臺二妙日追遊琥珀香醪白玉甌相下不厭賢者意尚言執友欠龍頭和伯常自郢州見寄西郊去歳揖行人栁暗花濃又一春坐想髙風清入骨沉吟佳句徤生神潺湲杳靄煙波古來書云郢西雨多潺湲杳靄散誕逍遥興趣新應笑洛陽車馬道緇衣未免化紅塵和潞公行及白馬寺得留守相公書云名園例惜好花以俟同賞詩二章雲漢成章湛露晞都門宴餞羽觴飛謝安不復東山去爭似阿衡得謝歸其一相國東郊迓帝師油幢交映碧參差都人共喜安輿到正是餘花可惜時其二和子華喜潞公入覲歸置酒遊諸園賞牡丹介圭成禮下中天春物雖䦨色尚妍園吏望塵皆闢户肩輿回歩即開筵波濤凌亂韡旁錦風雨縱横撥底絃洛邑衣冠陪後乗㝷花載酒願年年陪致政開府太師留守相公致政内翰燕集輙歌盛美爲三公壽皆用公字爲韻獨佐成康丗髙年有畢公神心降維嶽龜兆告非熊黄閤遵成範太常書茂功歸來保眉壽恩禮享優隆右太師東閤延髦士西都守别宮不忘如衛武難老似僖公位貌今雖逺官僚舊忝同開懷盡巵酒足以厚時風右相公眉似髙僧秀顔如童子紅忠純汲長孺髙㓗夏黄公矯矯遼東鶴冥冥塞北鴻自誇新酒量豫想百分空右内翰景仁將歸頴昌輙爲詩二十韻紀贈秀發西南美挺生河岳靈雕龍蔚文采老鸖瑩儀形落筆髙時儁飛緌侍帝庭英聲軼雲漢逺勢擊滄溟苦節專憂國嘉謀每據經温雖比圭璧直不避雷霆道勝軒裳薄神和氣體寜忠誠懷畎畆樂事寄林坰藻鑑評隨月過從德應星苦吟金出礦確論木銜釘賤子叨流軰髙風仰典刑巨川容滴水餘景借流螢乆别眉俱白重來眼更青淹留弦與晦遊集醉還醒有酒須相就無歌不共聽竒花喧夕市疊鼓咽春亭揚𬒮行辭洛回車去望陘許西北有陘山見來書往還天表鴈離合浪間萍異日期同傳景仁甞言它日與光若得在國史必同傳窮泉約互銘光與景仁約後死者當爲先死者作墓銘古今難得事交分保頽齡復用三公燕集韻酬子駿堯夫官閑虚室白粟飽太倉紅朝夕掃三徑往來從二公蒹葭徒倚玉燕雀豈知鴻相遇輙同醉惟愁樽酒空和吴朝議執中字幾聖同年謝光與景仁同年見過結綬東堂同發䇿白頭相值益相親却思景祐無多日共見元豐有幾人天下髙名歸廣受二公皆致仕古來交道重雷陳謝公身老才方壯落筆成章字字新伏蒙留守相公賜示陪太師潞公東田宴集詩輙敢屬和舞雩新雨浹公田水滿東溪上下天行逕乍迃𥘉見笋浮舟正好未生蓮絃収裂帛胡琴闋䄂結清風楚舞妍相國火城光滿路夜歸不假玉蟾圎効趙學士體成口号十章獻開府太師都人共喜太師回比頻必切戸爭迎不得催正值土樓灘水淺大家出手挽舡來東郊車馬走紅塵城外多於城裏人誰信今朝還政後過如前歳下車新歸來甫可及春殘丞相頻邀賞牡丹逺處名園多不到樽前日獻百餘盤洛陽風俗重繁華荷擔樵夫亦戴花貪看二公同宴㑹遊人昬黒忘還家公厨敕許釀芳樽屢喚賔朋醉後園謔浪略無名位間誰人知道太師尊過春稀復到諸園厭苦終朝鼔吹喧招得老僧江外至啜茶揮麈話松軒東田小籍選新聲歌吹胡琴色色精客少有時全不用天然水竹湛餘清首夏清和新雨晴緑莎細軟不妨行園夫遮道白何事梔子花開斑笋生矮帽長絛紫縠衫朱門深靜似重巖莫言永日渾無事種藥移花一一監八十聦明強徤身況從壯歳秉鴻鈞功名冨貴古亦有無事歸來能幾人和潞公招堯夫不至東閤尊壘招共飲後房羅綺約同觀旣無薊子分身術須欠車公一座歡和子華招潞公暑飲朱門近在府園東杖屨過從跬歩中避暑連翩投轄宴析酲蕭灑滿襟風閑來髙韻渾如鶴醉裏朱顔却變童剪燭添香歡未極但驚銅漏太怱忽再和伯常見寄誅茅宋玉宅邊人知醉冝城幾甕春細雨短蓑魚向市孤村極浦鼔迎神徧遊七澤身忘倦更賦千篇意轉新不必滄浪羡清泚曏來纓上巳無塵再和秉國約遊石淙上國分攜十五秋未甞偶坐捧茶甌石淙今㑹須如約彼此霜毛各滿頭送堯夫知河中府二首耆老承風舊絲綸錫命新展禽安屢黜原憲樂常貧執志窮通壹論交表裏真但祈深自重膏澤望斯民河抱城根曲山侵地勢斜周餘古樓觀舜俗舊人家回首從遊闊裝懷牒訴譁何時重載酒同醉洛陽花席君從於洛城種金橘今秋始結六實以其四献開府太師招三客以賞之留守相公賦詩以紀竒事光竊不揆輒依髙韻継成五章冝春果結洛陽枝太師云此果本出袁州正遇耆明㑹客時更引輕舟倚蘆岸香秔鮮鱠雅相冝圎小香黄珠顆垂結成洛邑重霜時相公和氣陶群物不是寒温變土冝君從好事不知疲種子成株凡幾時摘献帝師三取二自甞兩顆且隨冝物不須多且賞竒禦寒想見結庵時江南江北徒虚語尽信前書是不冝弊居橘亦自南移愛護栽培費歲時前此實成酸苦甚應由與德不相冝和留守相公九月八日與潞公宴趙令園有懷去年與景仁秉國遊賞今歲台星聚洛中甘棠前後兩隂濃英辝唱和詩千首高宴遊陪禄萬鍾木末霜繁花未落雲間字小鴈相從西湖在望親朋逺節物那堪處處逢和留守相公寄酒與景仁想對白衣初滿傾執盃未飲巳詩成懷賢孤坐悄無語不是朝來困宿酲和秉國芙蓉五章清曉霜華漫自濃獨慿愛日飬殘紅勸君秉燭須勤賞閶闔難禁一夜風地方稀見誠竒物筆界輕絲指捻紅楚蜀可怜人不賞牆根屋角數無躬平昔低顔避桃李英華今發歲云秋盛時已過渾如我醉舞狂歌挿滿頭後時獨立誠難事猶頼階庭有菊叢綽約霜前弄姿態非如群木万株紅但見渉江求水際豈知縁木采霜中微紅未肯全衰歇正似􅋳顔鶴髪翁安之朝議哀辝二首埸屋推聲價朝紳仰典刑朱衣老卿列白首戀親庭舟壑一朝失泉臺万古扃音容宛在目爭免涕飄零樂易春陽暖孤髙秋氣清老惟知自適貧不問爲生京兆開阡陌延陵題墓塋何如帝師筆純孝紀名卿和堯夫見寄志趣苦難合倀倀何所依逢君始相照知我信爲稀忽報除書下徒瞻征蓋飛相思千里逺洛浦又春歸仁政如慈父蒲人得所依教條前後接風迹古今稀試郡纔書最還朝必奮飛西臺舊班列猶望繡衣歸華嚴真師以詩見貺聊成二章紀其趣尚知足隨縁處處安一身温飽不爲難禪房窄小纔容榻此外從它丗界寛素髪青眸七十餘未甞遊學只安居旁無几杖身䡖徤應爲心閑得自如和子華過王帥家見梅花盛開呈君實子駿兼簡堯夫去年與客盡清歡今日重來立馬看猶足攜觴同醉在只愁風雨横相干和張伯常賀遷資政不駕使車開漢関相如不棲巖穴錬金丹子㣲豈無開徑三人友分著垂緌五寸冠情遊之士坐飽太倉猶自愧謬躋秘殿益難安願同野老嬉堯壤長守先生首蓿盤又書一絶戲呈伯常逺自郢中回喜與愁心相継來幸得蒹葭依玉樹愁將瓦礫報瓊瑰又和南園真率㑹見贈白頭難入少年埸林下相招莫笑狂緑篠影侵棊局暗黃梅花漬酒巵香任真自愧殽羞薄假寐初便枕簟涼酬應詩豪困牽帥從來懶放似嵆康春日思景仁去歳洛城中嬉遊處處同從離崿嶺北常夢潩泉東草逺春街碧花繁夕市紅臨風黙惆悵想像白眉翁神宗皇帝挽詞五首決事神明速任人金石堅天機先兆朕聖度藴淵泉仁義生知性恩威獨化權乹坤無毀息長與大名傳其一聽政渉中􅉴觀書逹夜分周王忘自逸漢祖不知勤棣蕚因心友雲章落筆文它年紬石室光大継皇墳其二至德成無象徽名避不居期門弋獵絶歩輦宴遊踈錢列金釭暗兵嚴武帳虚蓬萊日晏仗猶望駕宫車其三鼇禁叨承詔金華侍執經微生輕草芥聖澤闊滄溟鹿性安林野葵心注闕庭堯雲不可望白首涕飄零其四式道清行馬靈輴下陛簾雲奔同軌集雨泣兆民瞻石闕蒼煙暝松門白露霑戴弓徒隕絶無計附龍髯其五北京留守王太師挽歌詞二首盧肇時推重終軍衆共賢如何奪標日未及弃繻年官歴清塗徧名居美事先人間有五福視履豈非全其一昔日程文士光應舉公發解中間侍坐賔遊陪慙晚輩待遇過它人方歎龍門逺俄驚馬鬛新西園行樂處引領但霑巾其二温國文正公文集卷第十五温國文正公文集卷第十六章奏一論兩浙不冝添置弓手狀先公知杭州代作爲孫大博乞免廣南轉運判官狀論麦, WYG: ''}
