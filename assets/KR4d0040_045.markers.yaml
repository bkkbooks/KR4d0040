  - {type: indent, offset: 17, content: 　　　, id: KR4d0040_krp_045-bkkind4}
  - {type: variant, offset: 17, length: 3, content: 薦范夢, WYG: 奉聖㫖令體量應災傷人户委的飢乏不能自存者仰發省倉斛斗據第四第五以下人户各借二石今勘會永興軍諸縣第四等以下闕食人户約及十餘萬户若毎户支二石共計合支二十餘萬石其外縣雖有粮草亦是數目不多更難支充貸糧若並令在府省倉請領又更减却此數即軍糧約支更不及}
  - {type: variant, offset: 21, length: 0, content: '', WYG: 上項月數况去年陜西經夏大旱入秋霖雨五糓例皆不熟其永興軍放稅多者至七八分即今毎斗白米價錢一百文足稈草毎束價錢二十七文足雖差官開場糴買只糴得白米九百餘石稈草全無兼勘會軍資庫日近雜支錢盡底支絶准轉運司牒将三司提刑司鹽馬司封樁錢盡數充雜支錢止及四萬餘貫除支毎月料錢及軍府諸般使用並不住准轉運司牒支撥往㳂邉州軍及應副收買軍期物色見今無錢支與和糴場糶買糧草豈得謂之易得糧草之處臣竊謂大凡添屯軍馬先須約度本處糧草可以贍養與否今來關中饑饉倉庫空虚贍養舊兵猶恐不足更添新者何以枝梧雖朝廷更於左藏庫内藏庫支撥銀紬絹等降下本路添助支費亦不免令州縣配賣與百姓轉増貧困况糧草是重滯之物不可從逺處興販得來須本處土地所生方可計置今饑饉如此雖多積金銀髙估物價令轉運司與州縣多方擘畫其日下所要糧草何由可得况即今民間闕食流移死亡者已為不少諸縣處處申報驚刼若至向前二三月後舊糓已盡新麥未熟民間必轉更飢乏若官中愛惜倉庫坐視不救竊恐流移轉多死亡轉衆盗賊轉煩深為不便竊以戎狄擾邉手足之疾百姓離散腹心之憂豈可重外輕内逐末忘本兹事得失所繫不細伏望朝廷先将陜西諸州軍糧草約度合贍得若干軍馬一年支費仍須於十分中量留二三分救濟目下飢民外如有剰數然後據數添屯軍馬若苦無剰數之時伏乞朝廷更不添屯儻以邉鄙未寜須至量添軍馬之時即乞分散往諸州軍就糧各委逐處兵官精加訓練不須聚在永興軍邠州河中府三處更特置都鈐轄三貟候邉事稍定即乞速發遣歸住營處所貴公私稍得辦濟若不如此先約度粮草但務添屯軍馬竊恐一旦倉庫俱竭别有不虞至時悔無所及臣職在守藩不敢不言所有先准朝㫖令第四等以下人户借支斛斗二石未審今來支與不支若支與則軍粮轉更不足不支則人户正當飢乏伏願聖慈早降指揮臣不勝廹切之誠奏乞兵官與趙瑜同訓練駐泊兵士}
