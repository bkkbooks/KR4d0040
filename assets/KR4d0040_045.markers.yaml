  - {type: variant, offset: 4885, length: 816, content: 月二十六日受敕提舉西京嵩山崇福宫候滿三十箇月不候替人發来赴闕至今月此任當滿伏念臣性雖至愚粗常從學平生所守不敢忘信雖遇布衣未甞妄語况於朝廷豈敢欺罔臣今年六十有七耳目手足雖未衰數年以来昏忘特甚舉錯云爲動多差繆使之臨繁處劇實所不堪非敢愛身必恐敗事伹臣前後提舉崇福宫巳經四任坐享俸給全無所掌今復有求匄實自愧心竊見西京留司御史臺及國子監比於宫觀粗有職業伏望聖慈俯加矜察特於上件兩處差遣内除授一任庻使竊禄庇身以養殘年則陛下愛物曲盡始終之賜微臣陳力兩遂公私之便乞奔喪狀右臣先任提舉西京嵩山崇福宫於今年二月任滿臣以数年以来昏忘特甚臨繁處劇實所不堪㝷具狀奏陳乞於西京留司御史臺及國子監内除授一任未奉朝旨間於今月七日忽奉遺制大行皇帝奄棄天下臣哀荒摧絶無地自處伏念臣先帝踐阼以來過蒙知待特出倫軰首寘翰苑継處憲臺亦甞承乏俾佐樞府臣自知非才不敢冒居力辝事任願就冗散亦荷矜容曲從所欲養以俸禄不責職業優游自便十有五年近者書成又叨進職褒嘉賜賚皆踰等比聖㤙汪洋天隆地厚未足爲諭奉諱之𥘉即欲號哭奔走徑詣京師奉望梓宫展臣子之誠萬分之一又念國朝故事如昭厚二陵未甞有近臣奔喪之例加以前巳乞留臺國子監未奉進止彷徨疑慮不敢輒行今竊聞觀文殿學士孫固資政殿學士韓維巳至闕下臣方自咎責不敢寧居巳於今月十七日起離西京欲乞亦赴闕庭隨百官班入臨見於前路聽候指揮乞以除拜先後立班劄子臣於前月二十七日夜准閤門告報巳降告身授臣守門下侍郎二十八日三省樞宻院同奉聖旨除知樞宻院外門下中書侍郎左右丞同知樞宻院事班次等並以除拜先後爲序今月四日延和殿進呈竊見張璪等奏乞推臣在上今後依新得指揮伏縁臣以不才誤蒙朝廷抜擢寘諸執政之末巳爲忝竊况超越倫軰特出其右在臣愚分何以克堪兼臣在二十八日巳前伏乞依新得聖㫖以除拜先後爲序在安燾之下取進止第二劄子臣今月四日曾奏乞依新得聖旨以除拜先後爲序至今未奉指揮臣噐能學術素出人下執政之中最爲後來一旦起居衆人之上誠所未安伏望聖慈依臣前奏班在安燾之下取進止温國文正公文集卷第四十五, WYG: ''}
