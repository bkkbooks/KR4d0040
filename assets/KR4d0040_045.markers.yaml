  - {type: variant, offset: 1305, length: 271, content: 矣又潜遣邏卒聽市道之人謗議者執而刑之又出牓立賞募人告捕誹謗朝政者臣不知自古聖帝明王之政固如是耶昔堯稽于衆捨已從人舜戒群臣予違汝弼汝無面從退有後言此其所以爲帝王稱首者也秦惡聞其過殺直諫之士禁偶語之人及其禍敗行道之人皆知之而己獨不知此所以爲萬丗戒者也子産相鄭鄭人游于郷校以論執政然明請毀之子産曰何爲夫人朝夕退而游焉以議執政之善否其所善者吾則行之其所惡者吾則改之是吾師也若之何毀之我聞忠善以損怨不聞作威以防怨豈不遽止然猶防川大决所犯傷人必多吾不克救也不如小决使道不如吾聞而藥之也何今之執政異於古之執政乎齊景公謂梁丘據曰惟據與我和夫晏子對曰據亦同也焉, WYG: 管句}
