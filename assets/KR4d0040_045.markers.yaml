  - {type: variant, offset: 201, length: 260, content: 効也應中外文武臣寮並許實封直言朝政闕失朕將親覽考求其當以輔政理三事大夫務悉心交儆成朕志焉臣伏讀詔書喜極以泣昔成湯以六事自責今陛下以四事求諌聖人所爲異丗同符凡詔書所言皆即日之深患陛下旣巳知之群臣夫復何云曽子曰尊其所聞則髙明矣行其所知則光大矣陛下誠知其如是復能斷志無疑不爲左右所移則安知今日之災沴不如太戊之桑榖髙宗之雊雉成王之雷風宣王之旱魃更爲宗廟生民之福乎然自詔下以来臣不知中外之臣亦有以當今之急務生民之疾苦力爲陛下别白言之者乎蓋必有之矣而臣未得聞也臣竊不自揆伏念父子受國厚恩備位侍從曏在朝廷屢以狂瞽塵浼聖聦間以衰疾自求閑, WYG: 賔服舊兵官舊兵}
