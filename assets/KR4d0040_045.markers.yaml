  - {type: variant, offset: 3, length: 12, content: 十應詔言朝政闕失事論風俗, WYG: 箇月半有餘此只是據見在軍馬約度即不知今來所添屯軍馬計多少數目若只添一倍之時其人粮只約支得八箇月有餘馬料只約支得七箇月有餘稈草只支得六箇月有餘所添更多所費尤廣又先准中書}
