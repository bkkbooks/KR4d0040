  - {type: line-break, offset: 0, content: '', id: KR4d0040_SBCK_045-1a01}
  - {type: variant, offset: 0, length: 2, content: 温國, WYG: 揮申宣撫權住製造乾糧皺飯狀熈寜三年十二月一日上准都轉運司牒准宣撫使衙劄子節}
  - {type: substitution, offset: 0, original: 温, replacement: 溫, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:366e8ec95655b72d3205b878dc416602f82ff8a6b5dd240168f5ee5a7c65a61e', entry: vf-4515}}
  - {type: variant, offset: 3, length: 2, content: 正公, WYG: 製造乾糧州軍将􅔋一斗變造乾糧五斤仍量支與柴錢勘㑹近准宣撫使衙劄子節}
  - {type: variant, offset: 6, length: 2, content: 集卷, WYG: 指揮沿邉四路十四州軍并近裏永興軍河中府同耀乾州鳳翔府等州軍變造􅔋餅皺飯當司已兩次牒逐州軍疾早變造施行去訖今又准前項宣撫使衙劄子已牒逐州将􅔋一斗變造乾糧五斤仍量支與柴錢如闕􅔋即疾速計置收糴變造乾糧所是柴錢斟量支給施行去訖牒請照㑹施行者右具如前勘會先准中書劄子節文奉聖㫖今後起發義勇赴沿邉戰守並令自齎備一月口食與折将來本户稅物若不能自備只乞於起發州軍預請一月口食齎往者亦聴又勘會永興軍近准都轉運使司牒准宣撫使衙劄子近准朝㫖義勇上畨令附帯乾糧一秤至屯戍州軍須合預行變造乾糧准備支遣附帯前去右劄送陜西轉運司檢會近降義勇分畨條貫指揮㳂邉四路十四州軍并近裏永興河中同耀乾鳯翔六州府速行勘會義勇所居縣分近便省倉斛斗内有􅔋粟或白米便約義勇合附帯乾糧秤數中停變造􅔋餅皺飯如見在􅔋數不多即一色變造皺飯仍趂此時月造下兩畨令附帯數目免致非時蒸㬠易為損惡仍毎乾糧一秤破係官布造袋子封印如法收將來義勇上畨日依數附帯者光竊詳義勇戍守之時毎人逐日給米二升半其一月口食七斗五升若更加乾糧一秤并噐械衣装盤纒等物竊慮一人之力難以勝任兼今來變造乾糧皺飯須至差配百姓當此饑饉民間不易之際雖云量支柴薪亦不能全無搔擾况即今諸縣官倉􅔋米至少昨准朝㫖散支}
  - {type: page-break, offset: 6, content: '', id: KR4d0040_WYG_045-20a, image: WYG1094/WYG1094-0422a.png}
  - {type: page-break, offset: 6, content: '', id: KR4d0040_WYG_045-20b, image: WYG1094/WYG1094-0422b.png}
  - {type: page-break, offset: 6, content: '', id: KR4d0040_WYG_045-21a, image: WYG1094/WYG1094-0422c.png}
  - {type: variant, offset: 10, length: 0, content: '', WYG: 等第五等闕食人户各二石尚未有備若更造乾糧皺飯即将來二三月間正當闕食之際更將何物可以救濟必見大叚失所竊見慶厯年中議欲出兵討伐元昊亦曽令陜西諸州製造乾糧皺飯萬數不少後來旣不出兵其乾糧皺飯所在堆積經年朽腐不可復食盡為棄物今官中錢糓比於慶厯年尤更難得若復造此物徒使公私勞費卒無所用誠為可惜又國家備邉若止於戍守則㳂邉自有倉廪無用乾糧皺飯今來承准指揮製造上件乾糧皺飯仍令十日一申倉卒取辦竊慮百姓猜疑以為國家又欲出兵必致逺近驚憂無由觧諭至時不為便穏光已指揮本路前項五州軍且未令造乾糧皺飯更聴候宣撫衙指揮去訖謹具狀申宣撫使衙伏望裁酌早賜指揮乞罷修腹内城壁樓櫓及噐械狀熈寜四年正月三日上尋得㫖依奏准熈寜三年十一月初七日准樞宻院劄子節文檢會近為麟府路豐州及外堡寨官吏弛慢不職不修完城池樓櫓噐甲等已奉聖㫖降官等第斷遣及劄與三路轉運司徧牒轄下沿邉州軍知委去訖近又據陜西路提刑宣撫司奏華州甲仗庫弓弩不堪盖是監官并本州官貟全不用心㸃檢有誤緩急使用其鈐轄盧戭坐受優俸空占當直兵士略不營職朝廷已令鄜延路經略司舉官差替盧戭其華州甲庫弓弩不堪本州當職官貟全不用心㸃檢仍宣撫司差官取勘聞奏竊慮諸路亦有不修完城壁噐甲等去處奉聖㫖令河東河北陜西經略安撫司指揮轄下州軍委官吏子細㸃檢須管日近修完城壁樓櫓堅固噐甲精利如將來朝廷専差官㸃檢得却有未修城壁樓櫓噐甲等其應干官吏必當依此重行斷遣劄付本司者尋依准朝㫖行下本路諸州軍施行近准虢州申州司勘會本州雖係陜西路即不係近邉州軍其州城從來並不曽有敵樓戰棚為自來霖雨損壊摧塌及無兵功累年不曽修築今來亦不敢専擅役夫修築已牒在城兵馬都監吕士宣重行檢計損壊城邑去處才候檢計到合使人功物料别具狀供申乞差兵夫次及據觧州申准兵馬監押狀申准州牒備録到安撫使司牒内坐到聖㫖指揮修完城壁樓櫓等尋將帯壕寨木匠作頭等檢計外羅城面上只有更屋二十三座並係年深倒塌及城壁墜倒乆來亦不曽泥補修完伏乞據狀申上衙乞差官計料修城人工及剏添樓櫓免致將來朝廷差官檢視見並不修完城壁及剏盖樓櫓虚負責降停替州司勘會舊來城上並無樓櫓即目城面上濶處只及四五尺以來今若指揮使行剏造又縁合使人工材料數目不少今來未敢専擅剏修伏候指揮右謹具如前勘會管下永興等一十州軍城壁内有乆來已行安置樓櫓完備亦有城壁低下薄怯全未有樓櫓去處其逐州官吏旣准上項朝㫖及見麟府豐州官吏以不修完城壁櫓樓噐甲降官等第斷遣并華州官吏差替取勘仍恐朝廷非時差官㸃檢例各畏懼争欲日近興功完葺以避譴責伏縁營造樓櫓須藉城基厚濶方可安置今來觧虢兩州城壁皆稱濶處只及四五尺似此之類須是先貼築城基方可剏修樓櫓若非大叚興功無以辦濟况今本路州軍全闕廂軍應急差使官庫亦闕見錢收買材料若是差役人夫配率材料又縁陜西州軍已是去嵗夏麥薄收秋苖旱損當此饑饉人户流移之際若更如此差擾必是轉難存濟兼永興軍一路州軍盡在腹裏去沿邉絶逺設若蕃賊入冦亦未能卽到逐州軍城下其樓櫓修下數年不用不免損壊今來若盡令與沿邉州軍一例須管日近修完城壁樓櫓堅固噐甲精利顯見官私虚有勞費欲乞朝廷特降指揮其㳂邉及次邉州軍即一依近降朝㫖修完所有腹内州軍城壁樓櫓并候将來豐熟以漸營葺其噐甲即㨿不堪數目逐旋勒作院人匠依程課修整務令精利所貴公私皆得辦濟乞不添屯軍馬熈寜四年正月八日上今月七日准熈寜三年十二月二十九日陜西河東路宣撫使司劄子本司近已具奏聞乞於永興軍邠州河中府三州軍易得糧草之處别添屯軍馬選差将官専切訓練逐路不得句抽専聴宣撫司節制内一項乞於永興軍駐劄兵馬差本司准備差使莊宅使趙瑜充永興軍路都鈐轄與知府専管訓練者右具如前臣勘會永興軍所管今年正月一日見在軍糧麤細色斛斗共三十六萬九千七百石二斗四升據即目本府見駐泊及就糧并本城兵貟糧食及官僚請俸等共約支得向去一十七箇月半馬料三萬七千六百五十二石四斗二升約支得向去一}
