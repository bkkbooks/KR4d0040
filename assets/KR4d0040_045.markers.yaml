  - {type: variant, offset: 573, length: 648, content: 慕堯舜之隆下不失漢唐之盛擢俊傑之才使之執政言無不聽計無不從所譽者超遷所毀者斥退垂衣拱手聽其所爲推心置腹人莫能間雖齊淵聖御名公之任管仲蜀先主之任諸葛亮殆不及也執政者亦悉心竭力以副陛下之欲恥爲碌碌守法循故事之臣毎以周公自任是冝百度交正四民豐樂頌聲旁洽嘉瑞沓至乃其効也然六年之間百度紛擾四民失業怨憤之聲所不忍聞災異之大古今罕比其故何哉豈非執政之臣所以輔陛下者未得其道歟所謂未得其道者在於好人同巳而惡人異己是也陛下旣全以威福之柄授之使之制作新法以利天下是冝與衆共之捨短取長以求盡善而獨任己意惡人攻難群臣有與之同者則擢用不次與之異者則禍辱隨之人之情誰肯棄福而取禍去榮而就辱於是天下之士躁於冨貴者翕然附之爭勸陛下益加委信順從其言嚴断刑罰以絶異議如是者往往立取美官比年以來中外執事權者皆此属矣其懷忠直守廉恥者皆擯斥廢棄或罹罪譴無所容立至於臺諫之官天子耳目所以規朝政之闕失糾大臣之專恣此陛下所當自擇而亦使執政擇之彼專用其所親愛之人或小有違忤即加貶逐以懲後來必得佞䛕之尤者然後爲之如是則政事之愆謬群臣之姦詐下民之疾苦逺方之冤抑陛下何從得聞見之乎又奉使詢訪利害於四方者亦其所親愛之人皆先禀其意指慿其氣勢以驅迫州縣之吏善惡繫其筆端升黜由其脣吻彼州縣之吏承迎奉順之不贍何暇與之講利害立同異哉及其入奏則云州縣守宰咸以爲便經乆可行陛下但見其文書粲然可觀以謂法之至善詢謀僉同豈知其在外之所爲哉或者更増爲條目務求新巧互陳利病各事改張使畫一之法日殊月異乆而不定吏民莫知所從蓋由襲故則無功出竒則有賞彼皆進身之私計非有益國便民之志也又, WYG: 乞}
