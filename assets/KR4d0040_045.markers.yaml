  - {type: variant, offset: 4081, length: 364, content: 卿大夫好爲髙竒之論喜誦老莊之言流及科場亦相習尚新進後生未知臧否口傳耳剽翕然成風至有讀易未識卦爻巳謂十翼非孔子之言讀禮未知篇數巳謂周官爲戰國之書讀詩未盡周南召南巳謂毛鄭爲章句之學讀春秋未知十二公巳謂三傳可束之髙閣循守注䟽者謂之腐儒穿鑿臆說者謂之精義且性者子貢之所不及命者孔子之所罕言今之舉人發言秉筆先論性命乃至流蕩忘返遂入老莊縱虚無之談騁荒唐之辭以此欺惑考官獵取名第禄利所在衆心所趨如水赴壑不可禁遏彼老莊棄仁義而絶禮學非堯舜而薄周孔死生不以爲憂存亡不以爲患乃匹夫獨行之私言非國家教人之正術也魏之何晏晉之王衍相與祖述其道宅心事外選舉者以此爲賢仕宦者以此爲業遂使紀綱大壞胡夷並興生民塗炭神州陸沈今若於選士之際用此爲術臣懼向去任官之士皆何晏王衍之徒則政事安得不隳風俗安得不壞正始永嘉之弊將復見於今矣伏望朝廷特下詔書以此戒厲内外公卿大夫仍, WYG: 更賜敷奏乞早降}
