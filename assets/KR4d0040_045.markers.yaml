  - {type: variant, offset: 1577, length: 2377, content: 爲和和如羮焉水火醯醢鹽梅以烹魚肉宰夫和之齊之以味濟其不及以洩其過君子食之以平其心君臣亦然君所謂可而有否焉臣獻其否以成其可君所謂否而有可焉臣獻其可以去其否是以政平而不干民無爭心今據不然君所謂可據亦曰可君所謂否據亦曰否以水濟水誰能食之今朝廷之臣對揚啓沃亦有異於梁丘據者乎衛君言計非是而群臣和者如出一口子思曰以吾觀衛所謂君不君臣不臣者也人主自臧則衆謀不進事是而臧之猶却衆謀况和非以長惡乎夫不察事之是非而恱人賛已闇莫甚焉不度理之所在而阿䛕求容謟莫甚焉君闇臣謟以在民上民不與也若此不巳國無類矣子思言於衞侯曰君之國事將曰非矣出言自以爲是而卿大夫莫敢矯其非卿大夫出言自以爲是而士庻人莫敢矯其非君臣旣自賢矣而群下同聲賢之賢之則順而有福矯之則逆而有禍如此則善安從生今執政主新法群下同聲賢之有以異於衛國之政乎是以士大夫憤懣鬱結視屋竊歎而口不敢言庻人飢寒憔悴怨歎號泣而無所控告此則陛下所謂忠謀讜言鬱於上聞而阿䛕壅蔽以成其私者也苟忠讜退伏阿䛕滿側而望百度之正四民之樂頌聲之洽嘉瑞之臻固亦難矣方今朝之闕政其大者有六而巳一曰廣散青苗錢使民負債日重而縣官實無所得二曰免上戸之役歛下戸之錢以養浮浪之人三曰置市易司與細民争利而實耗散官物四曰中國未治而侵擾四夷得少失多五曰結保甲教習凶噐以疲擾農民六曰信狂狡之人妄興水利勞民費財若其它瑣瑣米塩之事皆不足爲陛下道也捨其大而言其細捨其急而言其緩外有獻替之迹内懷附㑹之心是姦邪之尤者臣不敢爲也凡此六者之爲害人無貴賤愚智莫不知之乃至陛下左右前後之臣曰譽新法之善者其心亦知其不可伹欲希合聖心附㑹執政盗貴冨耳一旦陛下之意移則彼之所言亦異矣臣今不敢復費簡札叙利害以煩聖聽但願陛下勿詢阿䛕之黨勿徇權臣之意斷志罷之必有能爲陛下言其詳者矣此六者之中青苗免役錢爲害尤大夫力者民之所生而有也榖帛者民可耕桑而得也至於錢者縣官之所鑄民不得私爲也自未行新法之時民間之錢固巳少矣冨商大賈藏鏹者或有之彼農民之冨者不過占田稍廣積榖稍多室屋脩完耕牛不假而巳未甞有積錢巨萬於家者也其貧者繿縷不蔽形糟糠不充腹秋指夏熟夏望秋成或爲人耕種資采拾以爲生亦有未甞識錢者矣是以古之用民者各因其所有而取之農民之役不過出力稅不過榖帛及唐末兵興始有稅錢者故白居易譏之曰私家無錢鑪平地無銅山言責民以所無也今有司爲法則不然無問市井田野之民由中及外自朝至暮唯錢是求農民值豐歳賤糶其所収之榖以輸官比常歲之價或三分減二於㪷斛之數或十分加二以求售於人若值凶年無榖可糶吏責其錢不巳欲賣田則家家賣田欲賣屋則家家賣屋欲賣牛則家家賣牛無田可售不免伐桑棗撤屋材賣其薪或殺牛賣其肉得錢以輸官一年如此明年將何以爲生乎故自行新法以来農民尤𬒳其患農者天下之夲農旣失業餘民安所取食哉今貨益重物益輕年雖饑榖不甚貴而民倍困爲國計者豈可不少思其故哉此皆歛錢之咎也北盡塞表東𬒳海涯南踰江淮西及卭蜀自去歲秋冬絶少雨雪井泉溪澗往往涸竭二麥無収民巳絶望孟夏過半秋種未入中户以下大抵乏食采木實草根以延朝夕若又如是數月將如何哉當此之際而州縣之吏督迫青苗助役錢不敢少緩鞭笞縲絀唯恐不迨婦子皇皇如在湯火之中號泣呼天無復生望臣恐鳥窮則啄獸窮則攫民窮困巳極而無人救恤羸者不轉死溝壑壯者不聚爲盗賊將何之矣若東西南北所在嘯聚連群結黨日滋月蔓彌漫山澤蹈藉城邑州縣不能禁官軍不能討當是時方議除去新法將奚益哉緑林赤眉黄巾黒山之徒自何而有皆疲於賦歛復值饑饉窮困無聊之民耳此乃宗廟社稷之憂而廟堂之上方晏然自得以爲太平之業八九巳成此臣所爲痛心疾首晝則忘食夜則忘寢不避死亡欲黙不能者也易復之𥘉六曰不逺復無祇悔元吉言過而能改雖悔不大也其上九曰迷復凶有災眚用行師終有大敗以其國君凶至于十年不克征言迷而不復凶且有災於君道尤不利也昔秦穆公敗於殽作秦誓曰唯古之謀人則曰未就予忌唯今之謀人姑將以爲親雖則云然尚猷詢兹黄髮則罔所愆蓋悔棄老成之逺慮用利口之淺謀以取覆敗而思𥙷其過也故能終雪前恥彊覇西戎漢武帝征代四夷中國虚耗賊盗群起又䘮貳師之軍乃下哀痛之詔曰廼者以縳馬書徧示丞相御史二千石諸大夫郎爲文學者皆以虜自縛其馬不祥甚哉公車方士太史太卜皆以爲吉今計謀卦兆皆反謬蓋始寤公卿方士之謟䛕對不以誠致誤國事有悔于心也故禁苛暴止擅賦力夲農天下復安自國家行新法以来天下之人心祈口禱唯冀陛下之覺寤而拯救其失以蘇疲民如望上天之膏澤日復一日以至于今及今改之猶可救也過是則民力屈竭一旦渙然離散乃始勞心安集豈不難哉竊觀陛下詔書寅畏天災深自咎責丁寕懇惻以求至言是陛下巳知前日之失而欲有所改爲也若徒著之空文而於新法無所變更是猶臨鼎哀魚之爛而益薪不巳將何𥙷哉陛下誠能垂日月之明奮乹剛之断放逺阿䛕勿使壅蔽自擇忠讜爲臺諫官収還威福之柄悉從己出詔天下青苗錢勿復散其見在民間逋欠者計從𥘉官夲分作數年催納更不収利息其免役錢盡除放差役並依舊法罷市易務其所積貨物依元買價出賣所欠官錢亦除利催夲罷拓圡闢境之兵先阜安中國然後征伐四夷罷保甲教閱使服田力穡所興修水利委州縣相度凡利少害多者悉罷之如此則中外讙呼上下感恱和氣薫蒸雨必霑洽矣彼阿䛕之人附㑹執政者皆縁新法以得冨貴若陛下以爲非而捨之彼如魚之失水必力争固執而不肯移願陛下勿問之也臣竊聞陛下以旱暵之故避殿撤膳其焦勞至矣而民終不預其澤不若罷此六者立有溥博之徳及於四海也又聞京師近雖獲雨而畿甸之外旱氣如故王者以四海爲家無有逺近皆陛下之赤子願陛下雖徇群臣之請御正殿復常膳猶應兢競業業憂勞四方不遽自寛以爲無復災也又諸州縣奏雨往往止欲解陛下之焦勞一寸云三寸三寸則云一尺多不以其實不可不察也又聞青苗之法災傷及五分則倚閣其間官吏不仁者至有抑遏百姓止放四分以下稅此尤可罪者也臣在冗散之地若朝政小小得失臣固不敢預聞今坐視百姓困於新法如此將爲朝廷深憂而陛下曽不知之又今年以來臣衰疾寖増恐萬一溘先朝露齎懷忠不盡之情長抱恨於黄泉是以冒死一爲陛下言之儻陛下猶棄忽而不之信此則天也臣不敢復言矣干冒宸扆臣無任懇切惶懼之至, WYG: 辦}
