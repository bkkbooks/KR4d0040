  - {type: variant, offset: 30, length: 4495, content: 䇿問五道䇿問十首學士院試李清臣等䇿目熙寕三年三月二十八日時王介甫言於上以爲天命不足畏祖宗不足法流俗不足恤故因策目以此三事質於所試者范景仁後主曰流俗不足恤一事我巳爲第目矣遂之明日禁中以帋帖其上别出䇿目試清臣等不以卑臨尊議大傳以爲武王克啇祀於牧室追王太王王季文王不以卑臨尊也夫父子之間譬猶天地之躰殊君臣之位絶尊卑之分天性自然是以子雖爲天子無害父之尊父雖爲士子不敢先之人道之大倫古今之通義也武王纂紹前迹登隆基緒追尊先世告成王業蓋以推功歸美崇戴前人非謂身臨四海之尊不可以諸侯爲祖父也竊謂記禮者探於聖人之旨失之何則太王王季文王追襃旣盛則太王之前公劉不窋之倫尚爲以卑臨尊未得謂之順也然則追稱継號終巳無窮豈可行哉謹案武成曰大王肇基王迹王季其勤王家我文考文王克成厥勲又周頌曰天作髙山大王荒之大雅曰維此王季受禄無喪奄有四方至言文王受命非一不可悉著然則周之王迹肇於大王茂於王季成於文王終於武王武王旣有四海追思王迹之所由興積功開業之艱難是故推三丗而王之以明非己功藉祖宗之餘烈也聖人之志昭晣若此而謂之不欲以卑臨尊其爲失也大矣且夫以大王之仁愛勤勞王季之孝友光明文王之布徳行化討叛懷柔三分天下之諸侯而有其二謙畏天命不輯大勲以授聖子武王因累丗之基用旣王之周推巳亡之商而取天位臨四海朝諸侯雖以中庸之君處之猶不敢蓋其祖宗之勲謂天禄由己而成徒以私意追王祖宗不使諸侯臨天子之尊而巳况於武王大聖豈得爾哉泰誓曰予克受非予武惟朕文考無罪受克予非朕文考有罪惟予小子無良夫武王歸美前人之意如此追王之理豈不明與情辨應幾有子生十年而喪之應幾悲哀甚旣而自諭曰是何益哉昔者吾甞聞於有道者矣曰死而悲哀者情也死生有時長短有命知其物理之常不足悲者道也故其始也悲不自制情勝道也及其乆也悲日益衰而理可以奪道勝情也予常以爲知言光辨之曰是非有道者之言也夫情與道一體也何甞相離哉始死而悲者道當然也乆而寖衰者亦道當然也故始死而不悲是犲狼也悲而傷生是忘親也犲狼不可忘親亦不可是以聖人制服日遠日輕有時而除之若此者非它皆順人情而爲之也夫情者水也道者防也情者馬也道者御也水不防則汎溢蕩潏無所不敗也馬不御則騰走奔放無所不之也防之御之然後洋洋焉注夫海駸駸焉就夫道由是觀之情與道何甞交勝哉善惡混辨孟子以爲人性善其不善者外物誘之也荀子以爲人性惡其善者聖人之教之也是皆得其偏而遺其大體也夫性者人之所受於天以生者也善與惡必兼有之是故雖聖人不能無惡雖愚人不能無善其所受多少之間則殊矣善至多而惡至少則爲聖人惡至多而善至少則爲愚人善惡相半則爲中人聖人之惡不能勝其善愚人之善不能勝其惡不勝則從而亡矣故曰惟上智與下愚不移雖然不學則善日消而惡日滋學焉則惡日消而善日滋故曰惟聖罔念作狂惟狂克念作聖必曰聖人無惡則安用學矣必曰愚人無善則安用教矣譬之於田稻梁藜莠相與並生善治田者耘其藜莠而飬其稻梁不善治田者反之善治性者長其善而去其惡不善治性者反之孟子以爲仁義禮智皆出乎性者也是豈可謂之不然乎然不知暴慢貪惑亦出乎性也是知稻梁之生於田而不知藜莠之亦生於田也荀子以爲爭奪殘賊之心人之所生而有也不以師法禮義正之則悖乱而不治是豈可謂之不然乎然殊不知慈愛羞愧之心亦生而有也是知藜莠之生於田而不知稻梁之亦生於田也故揚子以謂人之性善惡混混者善惡雜處於身中之謂也顧人擇而修之何如耳修其善則爲善人修其惡則爲惡人斯理也豈不曉然明白矣哉如孟子之言所謂長善者也如荀子之言所謂去惡者也楊子則兼之矣韓文公解楊子之言以爲始也混而今也善惡亦非知楊子者也賢良䇿邵興宗令余爲之皇祐四年國家比下詔書以延天下豪俊之士待之以不次之位豈特以學問之冨爲賢良文辤之麗爲方正邪蓋思得先古之至道當今要務施之於事以安元元此主上所以側席而求寤寐而思者也今子大夫裦然爲舉首固當有以副所以待之之意而不愧乎其名矣言及之而不言則幾於所謂隱者乎昔三代之王也逺者八百載近者不減四百後丗王天下者鮮能及之陵夷衰微至於五代或四三年敢問前之所以延者豈丗有哲王以守其業後之所以蹙者豈継嗣不肖不能享其功歟抑繇祖宗建法垂統明備固宻子孫不能敗邪至治之丗耕者讓畔漁者讓澤今國家修明禮義以切勵天下乆矣而退讓之風未甚行於朝爭奪之俗未盡絶於野秋毫之利捐仁廢誼而爲之而不恥上下病之而不能革也又内外百吏或侵牟細民苟不得其欲則轉賞爲罰倒直爲曲冤痛失職吁嗟滿道雖待之以重誅嚴刑而不能止也兹二者豈丗俗澆譌不可復振將教之禁之之道有所未備也漢有天下至於孝文纔三十年而帛朽於庫粟流於庾國家平定宇内嚮九十載而公私之積日以凋耗議者推測其故而未能明也憂者雖衆而莫能謀也敢問所以明之謀之亦有其術歟又若韓非之五蠧荀恱之三遊此皆先丗之患而今猶未息者也將何道以息之至於朝政之善有所未盡黎庶之病有所未聞子大夫其精心致思條析陳之靡有所遺有司將以復於上而行焉母悼後害以枉執事苞忠隱知而不自盡以取美禄榮名而巳䇿問五道第一道問昔季路冉有公西華曽晳間居縱言各陳其志趙文子觀於九原以爲死者可作想慕隨㑹之爲人夫材性散殊不可致之於一塗愛尚不同不可納之於一趣吾子懷材抱噐待時而用前言往行心所常存然則志於道者何術慕於古者何人當位得時施於政而何尚修身立行選於德而何從蓋聞言不及之而言謂之躁言及之而不言謂之隱今聽者雖非昔人之明而亦未爲不知巳則其言也可無隱焉第二道問昔者堯遭洪水咨於四岳曰有能俾乂四岳薦鯀堯曰吁咈哉方命圯族則知鯀之不可用亦明矣四岳復薦曰試可乃巳堯遂命之治水九年功用不成然後黜之而興禹焉夫唐堯聖人之盛者舉事興爲豈容過差顧後之學者不能辨明耳不然使不善之人任事九年蒸民汎濫所廢者大所害者廣然後去之仁聖用心固不如此愚智有涯不能測逺吾子其辨焉第三道問稽於經傳帝王之際玉帛諸侯亡慮萬國當是之時聲教所被東不踰海西距流沙南不盡荆蠻北不及獯鬻以五服之民飬萬國之君公有羡積私有餘儲征伐朝貢無歲而無咸岀其中未甞匱乏今國家奄有萬方囊括禹迹加以兵革不試垂三十年累聖恭儉與民休息宫室不崇苑囿不曠衣服不麗飲食不精然比歲以來有事西虜發輸滯積以餽一隅乃復財用竭而不継力役困而不給吁嗟之聲蕭然道路何曩者用民之後而有餘今者用民之狹而不足乎變而通之必有其道此最國家之急而從政者之所欲聞也吾子明於古之道而察於今之故何施何爲而得國用饒民力足以及於古之丗也仁者之言其利冝愽幸無讓焉第四道問夏書曰賞延于丗小雅裳裳者華刺幽王棄賢者之類絶功臣之丗是古有丗禄之道也周書數紂之罪則曰官人以丗言春秋者公羊氏亦云譏丗卿詩書春秋皆聖人所以儀範後丗也今其言乃違戾如是豈聖人之道淵微奥逺學者不足以至邪願聞所以辨之而毋讓第五道問王者受天命臨四海上承天之序下正人之統故政治之本莫先於暦數暦數之紀莫大於正朔正朔者暦數之大端而萬事之維首也是以聖人重之三代之王視斗招摇建寅建丑建子以爲正月仰應三光俯順三統揔象三材備在典䇿其傳詳矣至於唐虞以前則歴丗儒生各爲異見孔安國以爲建寅爲正得天之叙自古皆用之湯武放伐以有天下革故鼎新然後有改正朔易人視聽之事今据唐虞之前無異正朔之文則似孔說得之然鄭康成依尚書緯以爲正朔三而改自古皆相變若循環然非至於夏啇周而後變也孔子曰行夏之時自古皆用建寅何得謂之夏之時似鄭義復爲優夫正朔者帝王之盛節國家之大事而古今異論紛紛不决願吾子辨其得失明究其說使後來學者知其適從䇿問十道問夫佐天子治四海安萬民使諸侯軌道四夷賔服百吏稱職萬機辨治地平天成風雨和順者宰相之任也其功烈莫先焉王者封二王後所以存三統重絶先聖之丗也而班固漢書采漢興以來有金革之勤及蠻夷降王受爵邑者為功臣表又采椒房母舅之家僥倖獲封者爲外戚恩澤侯表而自平津以降由丞相得侯者及啇周之後皆不得附於功臣之列而猥編於外戚恩澤之間豈以爕理隂陽之重而居貫甲執兵之後先聖苗裔王者賔客而在武夫徤將之左邪抑史氏將有深旨非淺識所知乎將不思而巳矣願聞所以辨之問子曰侍於君子有三愆言未及之而言謂之躁言及之而不言謂之隱未見顔色而言謂之瞽夫聖人之道正直無隱豈司人顔色而言邪必有微旨幸爲辨之問祭典曰法施於民則祀之有功於民則祀之故厲山氏之子曰柱能殖百榖祀以爲稷共工氏之子曰句龍能平水土祀以爲社湯旣勝夏欲變先王之制以明革命於是乎以弃代而後丗無及句龍者故不易也夫平水土者莫尚於禹禹之功顧不及句龍邪湯不祀禹以爲社而云後丗無及句龍者其旨何哉聖人規爲必不妄也子大夫其懋明之問丗之爲詩者皆稱魯僖公能遵伯禽之法魯人尊之而爲之頌自孔子刪詩而存著不去非虚羙也今以春秋迹之或違禮而動或作事不時至於修泮宫伐淮夷作新廟皆無聞焉殆若與頌不相應者其故何哉問孟子稱盡信書不如無書吾於武成取二三䇿而已爲其以至仁伐至不仁而有血流漂杵也後之學者皆祖其言乃以書爲舛駮非若它經之純美也嗚呼彼孟子者果愈於聖人邪書者果是非相冐中有可信不可信者邪學者病於隨風而呼順流而攘未有能排其門上其堂探其室嚌其䏑而徒披猖横騖乎藩籬之外彼又烏知甘酸之正味邪乃欲信孟子而非書孟子又曰說詩者不以文害辭不以辭害志斯言也豈獨可施於詩而不可施於書邪孟子之云書不可盡信者果是歟願與諸君訂之問關雎麟趾之化王者之風故繫之周公鵲巢騶虞之德諸侯之風先王之所以教故繫之召公說者以爲先王謂大王王季今据二南之詩大抵皆言文王之化或羙召伯或美王姬烏在其爲大王王季也且如大王王季文王之詩何爲不編之雅頌而列於國風又文王之道被于天下何故其中雜有王者諸侯之風復何爲繫之周公召公皆憃昧所不識也二三君子奥愽於學願聞所以辨之其說何也問曲禮曰禮不下庶人刑不上大夫按王制修六禮以節民性冠昏喪祭郷相見此庶人之禮也舜典五服三就大夫於朝士於市此大夫之刑也夫禮與刑先王所以治群臣萬民不可斯須偏發也今曲禮乃云如是然則必有異旨其可見乎問春秋始隱之說誰氏爲通問春秋不書公即位何以特書王正月杜元凯以朝之化或羙召伯或美王姬烏在其爲大王王季也且如大王王季文王之詩何爲不編之雅頌而列於國風又文王之道被于天下何故其中雜有王者諸侯之風復何爲繫之周公召公皆憃昧所不識也二三君子奥愽於學願聞所以辨之其說何也問曲禮曰禮不下庶人刑不上大夫按王制修六禮以節民性冠昏喪祭郷相見此庶人之禮也舜典五服三就大夫於朝士於市此大夫之刑也夫禮與刑先王所以治群臣萬民不可斯須偏發也今曲禮乃云如是然則必有異旨其可見乎問春秋始隱之說誰氏爲通問春秋不書公即位何以特書王正月杜元凯以朝正於廟解之朝正于廟國家常禮非特行於君之始年也問春秋貴儀父者爲其能自通於大囯継好息民也夫小事大者盟不重於朝今犂來名而儀父字其說何也學士院試李清臣等䇿目熙寧三年三月二十八日時王介甫言於上以爲天命不足畏祖宗不足法沐俗不足恤故因䇿目以此三亊質於所試者范景仁後至曰流俗不足恤一事我巳爲䇿目矣遂删之明日禁中以帋帖其上别出策目試清臣等問先王之治盛矣其遺文餘事可見於今者詩書而巳矣詩曰文王陟降在帝左右書曰靣稽天若蓋言王者造次動靜未甞不考察天心而嚴畏之也詩曰母念爾祖聿修厥德書曰有典有則貽厥子孫蓋言三代嗣王未有不遵禹湯文武之法而能爲政者也詩曰先民有言詢于芻蕘書曰有廢有興出入自爾師虞庶言同則繹蓋言與衆同欲則令無不行功無不成也今之論者或曰天地與人了不相關薄食震摇皆有常數不足畏忌祖宗之法未必盡善可革則革不足循守庸人之情喜因循而憚改爲可與樂成難與慮始紛紜之議不足聽采意者古今異冝詩書陳迹不可盡信邪將聖人之言深㣲髙逺非常人所能知先儒之解或未得其旨邪願聞所以辨之温國文正公文集卷第七十二, WYG: ''}
