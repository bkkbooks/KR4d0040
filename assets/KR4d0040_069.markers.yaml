  - {type: variant, offset: 0, length: 448, content: 温國文正公文集卷第六十九贈諭訓樂詞贈書心經後贈紹鑒諭諭若訥訓訓儉示康樂詞樞宻院開啓聖節道埸排當散念作語御筵送李宣徽口號慶文公八十㑹口號書心經後贈紹鑒余甞聞學佛者言佛書入中國經律論三藏合五千四十八卷般若經獨居六百卷學者撮其要爲心經一卷爲之注者鄭預最簡而明余讀鄭注乃知佛書之要盡於空一字而巳或問楊子人有齊死生同貧冨等貴賤何如楊子曰作此者其有懼乎此經云照見五藴皆空度一切苦厄似與楊子同指然則釋老之道皆冝爲憂患之用乎丗稱韓文公不喜佛常排之余觀其與孟尚書書論大顛云能以理自勝不爲事物侵亂乃知文公於書無所不觀蓋甞徧觀佛書取其精粹而排其糟粕耳不然何以知不爲事物侵亂爲學佛者所先耶今之學佛者自言得佛心作佛事然曽不免侵亂於事物則其人果何如哉西京僧官凡六貟曰録曰首座曰副首座左右街各有一缺則選僧之有行業者補之又缺則以次上遷逮左録而止崇德僧紹鑒旣爲左首座矣㑹足有㣲疾乃嘆曰吾棄家爲僧固求自安逸今巳病而猶自勤於僧職豈吾本心哉即投牒自請解去時左録新物故其徒皆上之以爲冝待次補鑒不聽旣解去明日右録亦物故補其處者乃位於鑒下之人, WYG: ''}
