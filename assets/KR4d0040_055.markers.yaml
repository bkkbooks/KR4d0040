  - {type: line-break, offset: 0, content: '', id: KR4d0040_SBCK_055-1a01}
  - {type: variant, offset: 0, length: 1084, content: 温國文正公文集卷第五十五章奏四十謚議附論監司守資格任舉主劄子舉孫凖自劾第二劄子辭明堂宿衛劄子辭提舉修實録劄子乞合兩省爲一劄子乞令六曹長官專逹劄子乞令三省諸司無條方用例白劄子乞令監司州縣各舉按所部官吏白劄子乞不帖例貸配劄子再申明役法李文恭謚議錢宣靖謚議趙僖質公謚議侍衛親軍副都指揮使威塞軍節度使贈太尉馮守信謚議論監司守資格任舉主劄子臣竊見御史韓川上言諸路監司不當拘限資格專任舉主當令宰相自加選擇竊縁常調之人不可不爲之立資格以抑躁進塞倖門若果有賢材朝廷自當不次遷擢豈拘此制凡年髙資深之人雖未必盡賢然累任親民歴事頗多知在下艱難比於元不親民便任監司者必小勝矣朝廷執政止八九人若非交舊無以知其行能不惟渉徇私之嫌兼所取至狹豈足以盡天下之賢才若采訪聲譽則愛憎毀譽情僞萬端與其聽遊談之言曷若使之結罪保舉故臣奏設十科以舉士其中一科公正聦明可備監司誠知請屬挾私所不能無但有不如所舉者其舉主嚴加譴責無所寛宥則今後自然慎擇不敢妄舉矣至如楚潜等雖無聲名安知其無實用俟其到官無狀廢職并舉主坐之亦未爲晚取進止舉孫凖自劾第二劄子臣先舉孫凖行義無假堪充館閣之選如後不如所舉甘當同罪近聞凖與妻家爭訟罰銅六斤臣奏乞連坐責降㐲蒙聖慈批還云孫凖爲家私小事罰銅安有連罪伏縁臣舉狀稱凖行義無缺今凖閨門不睦妻妾交爭是行義有缺於臣爲貢舉非其人臣不敢逃刑况臣近奏設十科或有不如所舉其舉主從貢舉非其人律科罪雖見爲執政朝廷所不可輟者亦湏降官示罰臣備位宰相身自立法首先犯之此而不行何以齊衆乞如臣所奏從貢舉非其人律施行所貴率厲群臣審慎所舉取進止辭明堂宿衞劄子臣先奉聖旨將來明堂特與免侍祠攝事導駕及稱賀陪位肆赦立班止令宿衞在人臣恩禮優厚無以復加捐生隕命不足酬報然臣日近患左足掌厎腫痛全然履地不得跬步不能行未知痊愈之期所有將來明堂宿衛亦恐祗赴不得伏望聖慈特賜矜免乞㤙不巳慚懼無地取進止辭提舉修實録劄子臣先奉勑提舉修神宗皇帝實録臣自受命以來以衰羸多病罕曽得到局供職日近又患左足腫痛不能履地日甚一日未有痊愈之期所有修神宗皇帝實録伏乞别賜差官提舉取進止乞合兩省爲一劄子臣等聞三王不相襲禮五帝不相㳂樂况國家設官分職張立治具上下相維修飭明備何所愧於漢唐何必事事循其陳迹而失當今之冝也謹按西漢以丞相揔百官而九卿分治天下之事光武中興身親庻務事歸臺閣尚書始重而西漢公卿稍巳失職矣及魏佐漢𥘉建魏國置祕書令典尚書奏事文帝受禪改祕書爲中書有令有監而亦不廢尚書然中書親近而尚書踈外矣東晋以後天子以侍中常在左右多與之議政事不專任中書於是又有門下而中書權始分矣降及南北朝大抵皆循此制唐𥘉始合中書門下之職故有同中書門下三品同中書門下平章事其後又置政事堂蓋以中書出, WYG: ''}
