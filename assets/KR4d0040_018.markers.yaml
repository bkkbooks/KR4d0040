  - {type: variant, offset: 3512, length: 1746, content: 耳目習熟則不能究明利病非學古之士歷觀成敗則不能堅定是非竊見并州郷貢進士劉廱撰成邊議十卷援据古今指陳得失用意甚勤論理頗多不敢隱蔽謹具進呈伏乞少賜省覽如有可取欲乞朝廷略加甄獎進五規狀嘉祐六年八月十七日上右臣幸得備位諫官竊以國家之事言其大者逺者則汪洋濩落而無目前朝夕之益䧟於迃闊言其小者近者則叢脞委瑣徒足以煩浼聖聽失於苛細夙夜惶惑口與心謀渉歴累旬乃敢自决與其受苛細之責不若取迃闊之譏伏以祖宗開業之艱難國家致治之光美難得而易失不可以不慎故作保業隆平之基因而安之者易爲功頽壞之勢從而救之者難爲力故作惜時道前定則不窮事前定則不困人無逺慮必有近憂故作逺謀燎原之火生於熒熒懐山之氷漏於㳙㳙故作重㣲象龍不足以致雨畫餅不足以療飢華而不實無益於治故作務實合而言之謂之五規此皆守邦之要道當丗之切務戇陋狂瞽觸冒忌諱惟知納忠不敢愛死伏望陛下以萬幾之餘遊豫之間垂精留神特賜省覽萬一有取裁而行之則臣生於天地之間不與草木同朽矣謹貝狀奏聞伏候勑旨保業天下重器也得之至艱守之至艱王者始受天命之時天下之人皆我比肩也相與角智力而爭之智竭不能抗力屈不能支然後肯稽顙而爲臣當是之時有智相偶者則爲二相參者則爲三愈多則愈分自非智力首出於丗則天下莫得而一也斯不亦得之至艱乎及夫継體之君群雄已服衆心已定上下之分明彊弱之勢殊則中人之性皆以爲子孫萬丗如泰山之不可揺也於是有驕墯之心生驕者玩兵黷武窮泰極侈神怒不恤民怨不知一旦渙然四方糜潰秦隋之季是也惰者沈酣宴安慮不及逺善惡雜糅是非顛倒日復一日至於不振漢唐之季是也二者或失之彊或失之弱其致敗一也斯不亦守之至艱乎臣竊觀自周室東遷以來王政不行諸侯逐進分崩離析不可勝紀凡五百有五十年而合於秦秦虐用其民十有一年而天下亂又八年而合於漢漢爲天子二百有六年而失其柄王莽盗之十有七年而復爲漢更始不能自保光武誅除僣僞凡十有四年後能一之又一百五十有三年董卓擅朝州郡瓦解更相吞噬至于魏氏海内三分凡九十有一年而合於晉晉得天下纔二十年惠帝昏愚宗室構難群胡乗釁濁亂中原散爲六七聚爲二三凡二百八十有八年而合於隋隋得天下纔二十有八年焬帝無道九州幅裂八年而天下合於唐唐得天下一百有三十年明皇恃其承平荒于酒色養其疸囊以爲子孫不治之疾於是漁陽竊發而四海横流矣肅代以降方鎭跋扈號令不從朝貢不至名爲君臣實爲讎敵陵夷衰微至于五代三綱頽絶五常殄㓕懷璽未煖處官未安朝成夕敗有如逆旅禍亂相㝷戰爭不息流血成川澤聚骸成丘陵生民之類其不盡者無幾矣於是太祖皇帝受命于上帝起而拯之躬擐甲胄櫛風沐雨東征西伐掃除海内當是之時食不暇飽寢不遑安以爲子孫建太平之基大勲未集太宗皇帝嗣而成之凡二百二十有五年然後大禹之迹復混而爲一黎民遺種始有所息肩矣由是觀之上下一千七百餘年天下一統者五百餘年而已其間時時小有禍亂不可悉數國家自平河東以來八十餘年内外無事然則三代以來治平之丗未有若今之盛者也今民有十金之産猶以爲先人所營苦身勞志謹而守之不敢失墜况於承祖宗光美之業奄有四海傳作萬丗可不重哉可不慎哉夏書曰予臨兆民懔乎若朽索之馭六馬周書曰心之憂危若蹈虎尾渉于春冰臣願陛下夙興夜寐兢兢業業思祖宗之勤勞致王業之不易援古以鑒今知太平之丗難得而易失則天下生民至於鳥獸草木無不幸甚矣惜時夏至陽之極也而一隂生冬至隂之極也而一陽生故盛衰之相承治亂之相生天地之常經自然之至數也其在周易泰極則否否極則泰豐亨冝日中孔子傳之曰日中則􅉴月盈則食天地盈虚與時消息而况於人乎况於鬼神乎是以聖人當國家隆盛之時則戒懼彌甚故能保其令問永乆無疆也凢守太平之業者其術無它如守巨室而已今人有巨室於此將以傳之子孫爲無窮之規則必實其堂基壯其柱石彊其棟梁厚其茨蓋髙其垣墉嚴其關鍵旣成又擇子孫之良者使謹守之日省而月視欹者扶之弊者補之如是則雖亘千萬年無頽壞也夫民者國之堂基也禮法者柱石也公卿者棟梁也百吏者茨蓋也將帥者垣墉也甲兵者關鍵也是六者不可不朝念而夕思也夫継體之君謹守祖宗之成法苟不隳之以逸欲敗之以䜛謟則丗丗相承無有窮期及夫逸欲以墮之䜛謟以敗之神怒於上民怨於下一旦渙然而去之則雖有仁智恭儉之君焦心勞力猶不能救陵夷之運遂至於顛沛而不振嗚呼可不鑒哉今國家以此承平之時立綱布紀定萬丗之基使如南山之不朽江河之不竭可以指顧而成耳失今不爲已廼頓足扼腕而恨之將何益矣詩云我日斯邁而月斯征夙興夜寐無忝爾所生時乎時乎誠難得而易失也温國文正公文集卷第十八, WYG: ''}
