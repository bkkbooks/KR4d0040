  - {type: variant, offset: 137, length: 995, content: 謹再拜獻書某官執事光昔者未冠爲書生從師友間得執事所對直言䇿及後䇿觀之喟然嘆曰道之不明乆矣蔽於古者迂大而不可從溺於今者淺薄而不足用今執事論髙而不悖於今議實而不戻於古所譏切皆當丗之病所區畫皆應事之冝粲然虞夏商周之道可以覆手而取舉足而登也非夫深明於道之夲其孰克以致此哉由是私自誓曰異日儻得出入門下承事之間以受一言之教使皦然睹道之正渙然識道之歸事君行己知所取捨而無所疑則私願足矣及舉進士幸免黜去始敢進謁朝之公卿大夫當是時蓄才德負名聲出入帝廷榮耀輝赫照人者衆矣光皆未及往見首求執事之門而叩之誠欲急於學術之明而成宿昔之志也并褏其所爲文以爲始見之贄執事不責其僣而辱賜之詩以振飾之且曰道爲根抵言爲華由來表裏相經緯光由是益知君子務知大者逺者則光願受學之志愈固而專矣不幸光獻文之明日西出之官自是巳來非奔走吏道則在苫􅒘衰絰之中矣東西南北﨑嶇壈坎過闕門上逆旅㸑未及燃巳復出外矣是以役役十年而不得卒業也去年罷滑臺從事至京師則執事旣爲天子輔弼臣矣光賤士也其敢不自分限而屢以其不肖之跡汙辱門下之塵稱道舊恩以求瞻望几杖哉必若是而爲天下之人謂之不營禄位而爲道則難矣光是以屏身退處不敢屢進以煩將命非爲輙自踈外誠懼不知者不能察其區區而有塵累於至公也今聖主以許田股肱大郡屈煩執事蹔鎮治之光然後敢復叙昔日之知而求畢其戇愚之志夫肝鬲之所崇聚而欲杼展於左右者固不可立談而盡也是敢復繕綴近所爲文凡五卷而薦之非敢以爲文也貴露下情而巳伏惟亮其狂簡之誅而矝其自幼及長企仰之意副其所以來求考正道義之誠則沒齒銜戴盛德永永爲執鞭秉轡門下之士矣不宣光惶懼再拜荅胙城郭太丞書光頓首再拜竊以前丗郡縣以来朝廷唯置太守都尉令長自他掾屬皆官長所自辟除供趨走治文書而已今幕府吏猶古之掾屬也職至輕位至微獨命於朝廷差異耳執事以老成之德任百里之重官爲三丞著籍於朝雖大君子卑遜不以自重然考之古視之今其事任位序不輕章矣而歳時月朔必以賀牘爲賜詞恭禮備若小邑長之事牧伯然此豈光之所能堪哉是以日夜鞠躬重足継爲書啓布之左右乞停此儀以安反側而執事好謙之志確然愈固雖於盛德益有光美將使無似之軀於何自置殆非所以相全愛之道也廼者韋城張祕丞亦然光具此意因書請焉韋城悟其不可幸賜惠許獨執事未炤愚𣢾祈請喋喋不垂允納每得一紙流汗霑足光聞君子與人恭而有禮固不若此也今不敢避煩再薦言庶幾髙明垂意察古今之體酌重輕之冝凡此過禮率從翦削時有惠訓手筆往来使得㤗然自安無負踧踖幸之大者不宣光頓首再拜與薛子立秀才書, WYG: ''}
