  - {type: variant, offset: 5412, length: 248, content: 荅聞喜馬寺丞中庸書月日光頓首再拜明府寺丞閤下光頃日雖得邂逅奉望顔色然殊未暇陪從容杼悃𣢾也今者猥蒙記存逺賜之書仍以新與邑中賢士大夫治孔子祠命爲之記何采聽之過而責望之重也且愧且恐若無所容光資性頑蔽辭藝鄙薄平居爲朝夕近用之文猶多乖僻取人嗤傲况於語先聖之道載賢令之功鐫之金石傳之將來是猶執尫人而負之以千鈞之重雖欲自託於顯茂之業而貪不朽之榮獨不輕先聖而累明府羞邑中之賢士大夫乎此誠非光之所敢任也伏惟寛明當賜開察改求酣鬯於道而冨有於文者使爲之則冝與大名昭昭千古不窮矣若光類者正可相與誦咏而巳不宣司馬光頓首再拜, WYG: ''}
