  - {type: variant, offset: 2676, length: 1885, content: 謝校勘啓蒙恩充前件職者伏以聖哲之道悉載於書書之散訛道亦鬰滯是以國家開圗籍之府設校讎之官必求秀偉絶特之人使之執事誠以道爲重也光天與之分甚魯且愚徒以丗家相承習尚儒素故自免去襁褓初知語言父兄提擕授以經籍是以不執餘技而逢衣自名曽未能遊聖人之藩籬嚌六藝之糟粕遽用門䕃列於王官始舉郷舉徑叨上第常竊自恨道未至而受禄學未優而治民雖媮獲於一時終不足爲成人也巳而天降之旤服衰五年指景數刻幾無生望洎免䘮爲吏從事藩方則牒訢文移所居委塞是以舊學葢廢翦爲荆榛私心悵然毎用嘆邑不自意得承乏東序息肩薄領乃始脩勵錢鎛誅治荒穢庻幾克徇宿昔之志雖失之春芸猶得之秋獲足爲愈焉敢謂朝之輔臣不察駑朽遽列其名薦之法座上方倚信大臣議無不用遂發中詔引登書府使之欵朱闕蹈𬗋臺倐去蓬蒿頡頏霄漢榮耀過分不寒而栗夙夜循念罔知所來此蓋伏遇某官内竭忠力以勤王家外隆寛𥙿以延士類各適其噐不遺衆才顧眄所加人増大吕之重議論所與丗劇衮章之榮俾兹妄庸濫獲甄采敢不益自勤敕無違率履勉服故業期於有成庶幾不辱寵靈無負知鑒過此以往未知所裁授校勘謝龐參政啓蒙恩充前件職者伏以朋友道缺爲日乆矣陵夷至于近丗益以衰薄甚者旦爲好言暮而反之况於存沒之異貴賤之絶苟能言其姓名識其遊處斯可頌矣矧又収撫其孤誘掖成就使之自卵而翼去幽而光天下幾何人哉光質性愚陋動無可稱學古著文皆不逮衆徒以先人疇昔甞託僚寀獲友髙明道同志合出處如一分義之美近古所希光以童子獲執几杖侍見於前執事撫髫誨道俾之就學以至冒竊科級叨塵禄位始終之賜皆有自焉及夫上天降災旤罰崇大屏伏田里號咷待盡執事賜書吊撫俾能自存又譔著遺烈表之楸柏使其後祀焜燿無窮凡兹大恩固已無量矣而又以光樸懦自守謂其寡過毎賜祓飾多踰其實光或聞之流汗𬒳顙常懼不能堪副以累知言曁衰麻外除復從吏役執事以文武才實入賛樞極薦士之奏首列光名事雖報聞勤惻愈甚間二歳進參大政則又復前奏出之扆前上方推信大臣議無不用亟命近署試其所能藝術素踈果暴嗤鄙方自踧踖以湏譴絀不意天恩曲成引内祕府遽使頡頑禁闥依光紫霄校讎群書參奉遊豫豈光空薄所能堪稱承命震駭征營失據靜自循度罔知所來此非先人之餘休被及後昆執事之敦篤不遺故舊糠粃小生何階自致銜恩念親涕泗横集夫以執事之忠亮純明豈其私一不肖之人使汙衊文館羞士大夫蓋將驅一丗之人使媮者日敦薄者日醇誠有以賛天子之大化非獨苟然而巳乃知大君子之舉事用志逺矣光敢不夙夜刻勵寤寐訓辭進益所長攻去所短苟使不忝前人之教訓羞知己之偁論以負明詔之収擢而巳過此巳往不知所爲謝檢討啓蒙恩充前件職者仰戴寵靈俯循涯分任非才稱憂與愧并竊以帝王垂憲於典墳文武布政於方冊參天球赤刀之寳閟石室金匱之嚴豈繄記述之良抑亦討論之美自微貫穿前載浹洽舊聞稽古侔倚相之才叙事識子長之體則何以懋明得失考合異同訪逸事於名山求緒言於故老使聖哲丕績弊天壤而無窮俊乂隆名炳丹青而不朽原立官之甚重冝擇士以恪居豈容冒塵坐致隳曠如光者行能𥚹淺器質迂踈徒以儒術承家蚤用門資署吏甫任典謁巳辱聞詩愚者常專雖慕攻堅之業勤而無獲正如毁瓦之爲猥玷士科始陪賔幕􅃮雕之道未信尹何之傷實多旋屬家艱零丁苫􅒘比還官次汨沒道塗辭鋒頓而不修學殖落而亡幾分從塵役絶覬榮階俄承乏於瞽宗遂參華於天禄慶霄清晏蓬渚䆳嚴縑素牣盈率多未見英豪坌集叨與並逰顧鎻陋之無庸毎怔忪而自失所虞揚汰敢冀甄収何期佑弼之司誤辱褒稱之奏俾登史觀賛治信書緝記言記動之殊辨所見所聞之實詳明其故紬繹厭文竊惟累洽之辰方咏衆賢之冨弗圖嘉命遽及窳才靖究所來孰云無自此蓋伏遇某官獎延後進汲引下僚采其毫髮之長振以齒牙之論使不售之馬立享千金之酬無用之材或充萬乗之噐敢不劬勞從事恪慎處躬冀少荅於生成庻無慙於知遇過此以往未知所裁上宋侍讀書昔燕王有馬干里而天下無敢獻馬於燕者爲其皆不能及廏中之良也趙王有璧徑尺而天下無敢賈玉於趙者謂其皆不能及櫝中之羙也彼以物求售者誠然以道求售者則異矣請以周公言之夫周公之徳羙才智天下固無庻幾望其藩籬者然周公沐則捉髮飱則吐哺汲汲焉走迎天下之士惟恐一人伏於蓬萊之下者是以鍾石筦絃之音歌舞其德于今未衰曏者儻以己之才德求諸佗人則外踰四海舟車所極終無一人可収采者又安有曄曄光羙施於千載邪降及後丗賢公卿大夫未有不祖述此道而能具羙者也伏惟執事體純明以立質積學問以廣德自結聖主優游禁闥四表仰聲而響集群士希光而景附眄睞所被温於春陽咳唾所沾重於珪璧誠薦紳之表的後進之衡鑑也光才朽行僻學踈丈陋群居士林無與比數而不自屏絀妄以其技進於左右是猶獻馬於燕賈玉於趙也執事儻以二國之意遇之則光冝驅呵擯逐不得少留於門下矣以周公之道接之則光必得從七十子之後而俟見焉竊以古者見於公卿大夫必有贄今其禮亡乆矣士非文無用爲贄者是敢不自隱其嗤鄙雜録舊所爲文凡五卷執之立於屏外以待進退之命焉, WYG: ''}
