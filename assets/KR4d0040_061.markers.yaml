  - {type: variant, offset: 4646, length: 0, content: '', WYG: 之議而下與匹士合有不適中宜獲戾於朋友也既讀書乃釋然而喜曰得君實之書然後决知庶之法是而鎮之議為不謬庶之法與鎮之議於今之世用與不用未可知也然得附君實之書傳於後世使後世之人質之故終之以喜也君實之疑凡五而條目又十數安敢不盡言解之君實曰漢書傳於世久矣更大儒甚衆庶之家安得善本而有之是必謬為脫}
  - {type: page-break, offset: 4646, content: '', id: KR4d0040_WYG_061-22a, image: WYG1094/WYG1094-0553a.png}
  - {type: variant, offset: 4647, length: 0, content: '', WYG: 以欺於鎮也是大不然鎮豈可欺哉亦以義理而求之也春秋夏五之􅇅文禮記玉藻之脫簡後人豈知其闕文與脫簡哉亦以義理而知之也猶鎮之知庶也豈可逆謂其欺而置其義理哉又云一黍之起於劉子駿班孟堅之書為冗長者夫古者有律矣未知其長幾何未知其空徑幾何未知其容受幾何豈可直以千二百黍置其間哉宜起一黍積而至一千二百然後滿故曰一黍之起積一千二百黍之廣其法與文勢皆當然也豈得為冗長乎若如君實之說以尺生律漢書不當先言本起黄鍾之長而後論用黍之法也若爾是子駿孟堅之書不為冗長而反為顛倒也又云積一千二百黍之廣是為新尺一丈二尺者君實之意以積為排積之積廣為一黍之廣而然邪夫積者謂積於管中也廣者謂所容之廣也詩云乃積乃倉孟康云空徑之廣是也又云孔子曰必也正名乎者此孔子教子路以正衞之父子君臣之名分豈積與廣之謂邪又云古人制律與尺量權衡四器者以相參校以為三者苟亡得其一存則三者從可推也者是也又云黍者自然之物有常而不變者亦是也古人之慮後世其意或當如是然古以律生凡古人之意既知黍之於後世可以為尺豈不知黍之於後世亦可為律而故於其法為相戾乎若如君實之說則是古人知一而不知二也知彼而不知此也又云徑三分圍九分者數家之大要不及半分則棄之也者今三分四釐六毫其圍十分三釐八毫豈得謂不及半分而棄之哉漢書曰律容一龠得八十一寸謂以九分之圍乗九寸之長九九而八十一也今圍分之法既差則新尺與量未必是也如欲知庶之量與尺合姑試騐之乃可又云權衡與量据其容與其重必千二百黍而後可至於尺法止於一黍為分無用其餘若以生於一千二百是生於量也且夫黍之施於權衡則由黄鍾之重施於量則由黄鍾之龠施於尺則由黄鍾之長其實皆一千二百也此皆漢書正文也豈得謂一黍而為尺邪豈得謂尺生於量邪又云庶言太常樂太髙黄鍾適當古之仲吕不知仲吕者果后䕫之仲吕邪開元之仲吕耶若開元之仲吕則安知今之太髙非昔之太下者此正是不知聲者之論也無復議也又云方響與笛里巷之樂庸工所為不能盡得律吕之正者是徒知古今樂器之名為異而不知其律與聲之同也亦無復議也就使得真黍用庶之法制為律吕無忽微之差乃黄帝之仲吕也豈直后䕫開元之云乎書曰律和聲方舜之時使䕫典樂猶用律而後能和聲今律有四釐六毫之差以為適然而欲以求樂之和以副朝廷制作之意其可得乎其可得乎太史公曰不附青雲之士則不能成名君實欲成其名而知所附矣惟其是而附之則可其不是而附之安可哉諺曰抱橋柱而浴者必不溺君實之議無乃為浴者類乎君實見咨不敢不為此諓諓也再與景仁書九月二十三日光再拜景仁足下前者妄為書以干聦明意欲就大君子决所疑也退而懼曰房生老儒逺來景仁方欲就其名而我難問不置得無罪於景仁乎既又自得曰景仁惟義之從非人之私也我又何懼昨日得所示書然後釋然而不我罪而猶我教也幸甚幸甚然其中猶有未察愚意而直以彊辤抗之此所以憤憤不得飲黙必當自伸者也景仁曰我違群公之議而下與匹士合宜獲戾於朋友此何言也光雖不肖豈肯教景仁枉道上同以取容哉顧所論何如耳論苟是歟雖褐寛博當從而事之論苟非歟雖萬乗之君滋不受也若以為彼貴人也論雖是當非之此寒士也論雖非當是之亦非中正之道光所不為也景仁曰如光之說以尺生律漢書不當先言本起黄鍾之長而後論用黍之法是大不然光非謂太古以來律必生於度也特以近世古律不存故返從度法度求之耳安得不謂之度生於黄鍾之長邪景仁曰安知今之太髙非昔之太下是不知聲者之論是則然矣然能知聲之正者果誰耶又曰徒知今古樂器之名為異而不知其律與聲之同夫古今樂器與聲之同光亦知之所不知者今樂之太蔟或應古樂之大吕今樂之大吕或應古樂之黄鍾則非光所及知也豈徒光耳自非古之神瞽誰適知之景仁曰就使得真黍用庶之法制為律吕無忽㣲之差乃黄帝之仲吕也夫真黍或可得而律吕不難制若欲求無忽㣲之差則難矣乃􅃍以房生之智為與黄帝同亦以襃矣景仁謂光欲成其名而知所附若抱橋浴者光始聞景仁論房生尺則未敢謂之然當是時豈前知諸公絀房生之議乎盖景仁欲以此抑之使不敢語宜苟欲立論求是者安避此譏哉避此譏而不為非正直也若乃尺法之可疑者則前書論之巳詳惟景仁未賜熟察耳光復何言若終如是而不可變則願附景仁之言以達來世之君子而質是非焉古之朋友無不切磋琢磨以明其道景仁必不罪其不巳從而徃返不巳也景仁再答書九月二十四日鎮復書君實足下鎮豈不知君實者也君實之為人也其性介其言辯其性介故惡不介之名其言辯故能窮物之義理故鎮以不介之事加君實以起君實之辯而窮尺律之義理因之以為戯也孔子曰前言戯之耳詩曰善戯謔兮不為虐兮君實何恤而憤憤不得飲黙哉來書六百七十有八言而二百五十言及尺律就二百五十言去前書重􅃨者其言無㡬矣君實之辯義理於此止乎將亦有隠而未發者何其釋不介之事多而論尺律之事少也君實以為古者以律起尺後世以尺起律鎮以為古者以律起尺後世亦以律起尺前書盡之矣不復言也君實云今樂之太蔟或應古樂之大吕今樂之大吕或應古樂之黄鍾以為君實所不得知也者豈直君實哉古之神瞽亦不得知也豈直古之神瞽哉古之后䕫亦不得知也何哉無律也古者以律而考聲也書曰律和聲周禮曰執同律以聴軍聲是也前書盡之矣不復言也君實言鎮云用庶之法則黄帝之仲吕以為襃庶之智與黄帝侔者非也今農夫治田禾麻菽粟黍稷梁稻以時而布之或耕之或耘之或先種而後斂之或後種而先斂之有過之者曰此后稷之法也農夫之智果后稷乎老婢鑚木取火承以束緼傳以薪燎治鳥獸之肉炮之燔之烹之煮之有過之者曰此炎帝之法也老婢之智果炎帝乎醫者能知藥有隂陽配合子母兄弟根莖花葉金石骨肉有单行者有相須者有相使者有相畏者有相忌者有相反者有相制者又能知人之手足口耳眼鼻膚髪心腹腎膓受氣之䖏而療之過之者曰此神農之法也醫者果神農之智乎然則君實之允鎮亦未得也君實以為鎮不熟察君實之書尚有條目乎幸一一䟽示不宣鎮再拜傳家}
