  - {type: variant, offset: 4641, length: 2, content: 温國, WYG: 答孫長官察書十一月二十七日涑水司馬光再拜復書崇信賢令孫君足下䝉貺書兼示以尊伯父行状墓誌及所著唐史記令光為之碑以紀述遺烈以尊伯父之清節令望加之光自㓜稺至于成人得接侍周旋今日獲寓名豐碑之末附以不朽何榮如之雖}
  - {type: page-break, offset: 4641, content: '', id: KR4d0040_WYG_061-15b, image: WYG1094/WYG1094-0549d.png}
  - {type: substitution, offset: 4641, original: 温, replacement: 溫, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-20795}}
  - {type: variant, offset: 4644, length: 0, content: '', WYG: 字鄙拙亦不敢辭顧有必不可承命者惟足下察之光曏日亦不自揆妄為人作碑銘既而自咎曰凡刋琢金石自非聲名足以服天下文章足以傳後世雖強顔為之後人必随而棄之烏能流永乆乎彼孝子孝孫欲論譔其祖考之美垂之無窮而愚陋如光者亦敢膺受以為巳任是羞汚人之祖考而沒其徳善功烈也罪孰大焉遂止不為自是至今六七年所辤拒者且數十家如張龍圗文裕張侍郎子思錢舍人君倚樂卿損之宋監子才或師或友或僚寀或故􅃇不可悉數京洛之間盡知之儻獨為尊伯父為之彼數十家者必曰是人也盖擇賢不肖為之也為人子孫者有人薄其祖考宜如何讎疾之哉以光么麽使當此數十家之讎疾将何以堪之所以必不可承命者此也雖然竊有愚意敢試陳之惟足下采擇焉今世之人既使人為銘納諸壙中又使佗人為銘植之隧外壙中者謂之誌隧外者謂之碑其志盖以為陵谷有變而祖考之名猶庶㡬其不泯也然彼一人之身耳其辤雖殊其爵里勲徳無以異也而必使二人為之何哉愚竊以為惑矣今尊伯父既有歐陽公為之墓誌如歐陽公可謂聲名足以服天下文章足以傳後世矣佗人誰能加之愚意區區欲願足下止刻歐陽公之銘植於隧外以為碑則尊伯父之名自可光輝於無窮又足以}
  - {type: page-break, offset: 4644, content: '', id: KR4d0040_WYG_061-16a, image: WYG1094/WYG1094-0550a.png}
  - {type: page-break, offset: 4644, content: '', id: KR4d0040_WYG_061-16b, image: WYG1094/WYG1094-0550b.png}
  - {type: variant, offset: 4645, length: 0, content: '', WYG: 世俗之惑為後來之法不亦美乎未審足下以為何如答張尉來書五月五日陜人司馬光謹復書福昌少府祕校足下光行能固不足以髙於庸人而又退處冗㪚屬者車騎過洛乃䝉不辱而訪臨之其榮巳多今又承賜書兼示以新文七篇豈有人甞以不肖欺聽聞邪何足下所與之過也始懼中愧終於感藏以自慰知幸知幸光以居世百事無一長於文尤所不閑然竊見屈平始為騷自賈誼以來東方朔嚴忌王子淵劉子政之徒踵而為之皆蹈襲模倣若重景疊響訖無挺特自立於其外者獨栁子厚恥其然乃變古體造新意依事以叙懐假物以寓興髙颺横騖不可羈束若咸韶䕶武之不同音而為閑美條鬯其實鈞也自是寂寥無聞今於足下復見之苟非英才間出能如此乎欽服慕重非言可迨然彼皆失時不得志者之所為今明聖在上求賢如不及足下齒髪方壮才氣茂美官雖未達髙逺有漸異月方将冠進賢佩水蒼出入紫闥訏謨黄閤致人主於唐虞之隆納烝民於三代之厚如斯文者以光愚陋竊謂不可遽為也光頓首與景仁論樂書九月二十一日某再拜白景仁足下䝉示房生尺法云生嘗得古本漢書云度起於黄鍾之長以子榖秬黍中者一黍之起積一千二百黍之廣度之九十分黄鍾之長一為一分今文誤脱之起積一千二百黍八字故自前世以來累黍為之縱置之則太長横置之則太短今新尺横置之不能容一千二百黍則大其空徑四釐六毫是以樂聲太髙又嘗得開元中笛及方響校太常樂下五律教坊樂下三律皆由儒者誤以一黍為一分其法非是不若以一千二百黍實管中隨其短長㫁之以為黄鍾九寸之管九十分其長一為一分取三分以度空徑數合則律正矣景仁此來盛稱此論以為先儒用意皆不能到可以正積古之謬袪一世之惑光竊思之有所未諭者凡數條敢書布陳幸景仁教之景仁曰房生家有漢書異於今本光按累黍求尺其來久矣生所得書不知傳於何世而相承積謬由古至今更大儒甚衆曽不寤也又其書既云積一千二百黍之廣何必更云一黍之起此四字者將安施設劉子駿班孟堅之書不宜如此冗長也且生欲以黍實中乃求其長何得謂之積一千二百黍之廣孔子稱必也正名乎必若所云則為新尺一丈二尺得無求合其術而更戻乎景仁曰度量權衡皆生於律者也今先累黍為尺而後制律返生於度與黍無乃非古人之意乎光謂不然夫所謂律者果何如哉嚮使古之律存則龡其聲而知聲度其長而知度審其容而知量校其輕重而知權衡今古律巳亡矣非黍無以見度非度無以見律律不生於度與黍將何從生邪夫度量衡所以佐律而存法也古人所為制四器者以相參校以為三者雖亡苟其一存則三者從可推也又謂後世器或壊亡故載之於書形之於物夫黍者自然之物有常不變者也故於此寓法焉今四器皆亡不取於黍將安取之凡物之度其長短則謂之度量其多少則謂之量稱其輕重則謂之權衡然量有虚實衡有低昻皆易差而難精等之不若因度求律之為審也房生今欲先取容一龠者為黄鍾之律是則律生於量也量與度皆非律也捨彼用此將何擇焉景仁曰古律法空徑三分圍九分今新律空徑三分四釐六毫此四釐六毫者何從出耶光謂不然夫徑三分圍九分者數家言其大要耳若以密率言之徑七分者圍二十有二分也古之為數者患其空積微之大煩則上下輩之所為三分者舉成數而言耳四釐六毫不及半分故棄之也又律管至小而黍粒體圓其中豈無負載庣空之處而必欲責其絲忽不差邪景仁曰生以一千二百黍積實於管中以為九寸取其三分以為空徑此自然之符也光按量法方尺之量所受一斛此用累黍之法校之則合矣若從生言度法變矣而量法自如則一斛之物豈能滿方尺之量乎景仁曰量權衡皆以千二百黍為法何得度法獨用一黍光按黄鍾所生凡有五法一曰備數二曰和聲三曰審量四曰嘉量五曰權衡量與衡据其容與其重非千二百黍不可至於度法止於一黍為分無用其餘若數與聲則無所事黍矣安在其必以一千二百為之定率也景仁曰生云今樂太髙太常黄鍾適當古之仲吕不知生所謂仲吕者果后䕫之仲吕耶開元之仲吕邪若開元之仲吕則安知今之太髙非昔之太下耶笛與方響里巷之樂庸工所為豈能盡得律吕之正乃欲取以為法考定雅樂不亦難乎此皆光之所大惑也君子之論無固無我惟是之從景仁苟有以解之使瑩然明白則敢不斂衽服義豈欲徒為此諓諓也景仁復書九月二十二日鎮再拜復書君實足下昨日辱書以為鎮不當為議狀是房庶尺律法始得書􅋏然而懼曰鎮違羣}
