  - {type: variant, offset: 3097, length: 1514, content: 方其訓之言君欲立強於天下者無如得人得人而任之以事則四方斯順之矣臣竊惟取士之弊自古始以来未有若近世之甚者也何以言之自三代以前其取士無不以德爲夲而未甞專貴文辭也漢氏始置茂才孝廉等科皆命公卿大夫州郡舉有經術德行者䇿試以治道然後官之故其風俗敦尚名節降及末世雖政襄於上而俗清於下由取士之術素加奬勵故也魏晉以降貴通才而賤守節習尚浮華舊俗益敗然所舉秀孝猶以經術取之州郡皆置中正以品其才行一言一動之失或終身爲累士猶兢兢不敢自放隋始置進士唐益以明經等科而秀孝遂絶止有進士明經二科皆自投牒求試不復使人察舉矣進士初但試䇿及長安神龍之際加試詩賦於是進士專尚屬辭不夲經術而明經止於誦書不識義理至於德行則不復誰何矣自是以來儒雅之風日益頽壞爲士者狂躁險薄無所不爲積日旣乆不勝其弊於是又設封彌謄録之法蓋朝廷苦其難制而有司急於自營也夫欲搜羅海内之賢俊而掩其姓名以考之雖有顔閔之德苟不能爲賦詩論䇿則不免於遭擯棄爲窮人雖有跖蹻之行苟善爲賦詩論䇿則則不害於取髙第爲美官臣故曰取士之弊自古始以來未有若近丗之甚者非虚言也今幸遇陛下聖明心知貢舉之極弊慨然發憤深詔群臣使得慱議利病更立新規是千載一時也議者或曰古人郷舉里選今欲知士之德行冝委知州知縣者采察其實保而薦之臣獨以爲不然古者分地建國自卿大夫士皆以其國人爲之猶患處士之德行不可得而詳也故又擇其郷之賢者使爲閭胥比長自㓜及長朝夕察其所爲然後士之德行美惡莫得而隱也今夫知州知縣雜四海九州之人逺者三歲而更近者數月而更或𥘉到官即遇科場遽責之知所部士人德行誠亦難矣又應開封府舉者常不減數千人而開封府獄訟之繁知府者自旦至暮耳不暇聽目不暇視又有餘𥙿可使之察數千人之德行乎議者又曰冝去封彌謄録委有司考其文辭參以行實而取之臣獨以為不然夫士之徳行知州縣者尚不能知而有司居京師一旦集天下之士獨以何術知之其術不過以衆人之毀譽决之孔子曰衆好之必察焉衆惡之必察焉夫衆人之毀譽庸詎足以尽其實乎必如是行之臣見其愛憎互起毀譽交作請託公行賄賂上流謗讟並興獄訟不息將紛然殽乱朝廷必厭苦之而復用封彌謄録矣夫封彌謄録固為此數者而設之也譬猶築防以鄣洚水也今不絶其源而徒去其防則橫流之患愈不可救矣臣雖至愚平生固甞竭其思慮欲以少救其弊今敢試陳二䇿乞陛下俯加裁擇臣聞上之所爲下之所歸也國家從来以詩賦論䇿取人不問徳行故士之求仕進者日夜孜孜專以習賦詩論䇿爲事惟恐不能勝人父教其子兄勉其弟不是過也今若更以德行取人則士之力於德行亦猶是也誠風化清濁之原歴代訛繆而不寤必待聖朝然後正之者也夫德行修之於心藏之於身雖家人有所不知况於卿黨况於州縣况於朝廷將何從知之故必待明哲公正之臣知而舉之然後四海之士皆可得而官使也然舉薦之法旣行則干求屬請誠所不能無也要在所舉非其人者國家以嚴法繩之勿加恩貸則苟且徇私之人皆知懼矣且國家旣以德行取士則彼貪猾輕躁之人依附權要枉道求進者皆為清議所貶見棄於時雖有舉者必不多矣臣愚欲乞今後應係舉人令升朝官以上歲舉一人提點刑獄以上差遣者歲舉二人諌議大夫或待制以上歲舉三人不以所部非所部郷里非郷里除自己親戚及曽犯真刑或私罪情理重曽經罰贖及不孝不友盗竊淫亂明有迹狀者不得舉外其餘皆得舉之仍於舉狀内明言臣今保舉某州某科某人有學術節行乞賜召試若舉狀旣上之後却有前後諸般違礙事發其舉主並依律文貢舉非其人分故失從公私罪定断受贓而舉者以枉法論其舉狀逐時送下禮部貢院置簿記録若應舉人而不舉者歲終委貢院勘㑹姓名聞奏乞嚴加朝典毎遇三年一開貢舉委貢院截自詔下之日勘㑹選擇舉主最多者從上取之舉主數同則以舉狀到省日月先後爲次其舉主曽有贓罪及見停閑身亡或在合參人數外者並不准倍於每次科場南省奏名人數具姓名聞奏乞下夲貫發遺赴闕其夲貫更不考試即具申狀解送赴貢院仍出公慿給付遂人令赴貢院照㑹限十一月内取齊, WYG: ''}
