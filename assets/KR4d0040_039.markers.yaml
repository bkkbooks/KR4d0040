  - {type: variant, offset: 4690, length: 1408, content: 道其帖經墨義一切皆不試對䇿反大義但取義理優長不取文辭華巧唯所對經史乖僻時務踈闊者即行黜落其奏名人數並依科埸舊制若合格者少不满舊數亦聽至御試時進士明經各試時務䇿一道九經等諸科試夲經大義十道所有名字髙下並只以舉主多者爲上舉主數同則以舉狀到省月日先後爲次其舉人所納家狀及授官後吏部所給告身並湏開坐元初舉主人數姓名若及第後犯私罪情理重及贓罪其舉主並減一等坐之未及第者減三等皆不以去官及赦原如此則群臣不敢挾私妄舉士人皆崇尚經術重惜操履風俗丕變矣朝廷若不能行此保舉之法其次莫若修學校之法以取之臣伏見自慶暦以來天下諸州雖皆立學校大抵多取丁憂及停閑官貟以爲師長籍其供給以展私惠聚在事官貟及井市豪民子弟十數人遊戯其間坐耗糧食未甞講習修謹之士多恥而不入間有二千石自謂能興學者不過盛修室屋増置莊産廣積糧儲多聚生徒以邀虚名師長之人自謂能立教者不過謹其岀入節其遊戯教以鈔節經史剽竊時文以夜繼晝習賦詩論䇿以取科名而巳此豈先王立學之意邪於以修明聖道長育人材化民成俗固巳踈矣臣欲乞自今天下州學只許置教授一人委夲州長吏於夲處命官中選擇無過犯有節行能講說爲衆所服者舉奏𥙷充若夲州無人則奏乞下銓司選差委銓司於見在銓選人内㨂選進士明經諸科出身人歷任無贓私罪能講說經書者奏補充逐州教授仍令國子監試講說經書應舉人𥘉入學者並爲外舎生唯赴聽講及公試外不得於學中宿食其教授毎日講書畢取在學諸生姓名書於籖上雜置筩中抽取三人問以聽過書中疑議三條使對衆解說通者置簿記録粗者不問不者有罰毎月中兩次公試各試所習舉業委教授考校定優劣等第具姓名出牓示訖亦置簿記録其有過犯者小過則罰錢中過則降謂自内舎髙等降爲中等中等降爲𥘉䓁𥘉等降爲外舎生外舎生無等可降者勒出學大過則斥出學亦置簿記録毎遇春秋釋奠畢委教授選擇外舎生到學及半年以上自前次釋奠以來說書多通公試多在優等姓名近上即爲優等過犯情輕數少即升入内舎爲𥘉等生始聽於學中宿食又選擇𥘉等生升爲中等生中等生升爲髙等生皆如外舎生之法其有二人巳上比較難决者即特令說書及試所葉以决皆湏具狀申夲州委知州通判更加審覆委得公當然後給牒補之如後來有過降等者其牒即行抽取毀抹其敎授選擇糾舉升降等第若有不公委知州通判覺察取勘聞奏乞行衝替其開封府舉人舊無府學並令寓教於國子監其國子監舉人須實是品官子弟方得依條入學其敎試選升之法並與外州同以直講比教授判監同判監比知州通判凡國子監開封府及諸州軍内舎髙等生額並用夲處解額之半解額有竒數者入髙等生額假若解額三人則以二人爲髙等生額其中等倍髙等𥘉等倍中等若人數未足則闕之不得溢額𥙷人若遇詔下開貢舉委夲處判監同判監知州通判截自其曰勘㑹髙等生𥙷及半年以上者具姓名結罪保明聞奏開封府人只委判監同判監保明仍給公慿許令免解直就省試其髙等生占不盡解額方許本處其餘舉人取解其中等𥘉等生於取解時仍别立號常比其餘舉人多取分數所有髙等生至省試時亦别立號毎七人中取一人奏名如此則舉人亦稍嚮經術敦行誼矣夫經術深淺非程試所能知行誼羙惡非朝夕所能察今使之處於學校經二三年累經選擇升至髙等又占解額妨衆人進取之路若其行誼小有過差必不爲衆人所容矣由此觀之其髙等生經術則講說常通文藝則屢入優等過犯則全然輕少行誼則爲衆所服比之糊名謄録考其一日所試賦詩論䇿偶有所長而取之者相去逺矣况近年舉人或一無行能横遇㤙澤幸得免解者不可勝數今髙等生行能如此裁免一觧豈足惜哉此學校之法也若朝廷又不䏻如此只扵舊條之中毛舉數事微有更張則扵取士之道並無所益徒更煩苛不若悉循舊貫之為愈也, WYG: 宋}
