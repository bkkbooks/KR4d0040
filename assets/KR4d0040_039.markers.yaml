  - {type: variant, offset: 2006, length: 0, content: '', WYG: 論召陜西邊臣劄子熈寜二年六月臣曏任御史中丞日聞國家招納夏國降民曽上言方今百職未舉庶政未修百姓未安倉庫未實將帥未選軍法未立士卒未練器械未精八事不完不可興兵智慮迃疎不合聖心俄而种諤等起綏州之役楊定為夏虜所殺陜西騷然困於餽戍朝廷悔前之失故謫降种諤等以謝夏虜再三招撫方能得其稱臣奉表復遵舊約朝廷特遣使者以誓詔册命及金帛雜物賜之尚未返命今竊聞陛下復召种諤等詣闕引對不知陛下欲何所興為中外聞者無不寒心夫布衣不守信義猶見輕於鄉黨況王者臨御四方當叛則威之服則懐之使信義之明皎如日月若外域幸而臣服無故擾之及其背誕則從而嫗煦之得其臣服又從而擾之其於信義威懐如何哉國家以信義威懐邊庭百有餘年前日种諤等舉而棄之興兵掩其不備以邀一時之功僅能得不食之地百餘里饑虜萬餘人耳今地則歸之虜庭民則逃散略盡朝廷有何所得而發兵守衛轉粟饋餉公私之費以鉅萬計其為失䇿豈不昭然今瘡痍未復憂患未弭臣前所言八事一無所脩虜疑忌中國警偹巳嚴怨毒之心蓄而未發諤等乃欲復為前日所為臣見其無復綏州之功而必有大敗覆沒之事兵連禍結不可救解公私困竭盗賊將生此乃社稷之憂非獨邉鄙之患也孔子曰過而不改是謂過矣伏望陛下留神深念至於再至於三當先脩内政未可輕議用兵實天下幸甚取進止論風俗劄子熈寜二年六月上臣聞國之致治在於審官官之得人在於選士士之嚮道在於立教教之歸正在于擇術是知選士者治亂之樞機風俗之根原也竊見近歳公卿大夫好為髙竒之論喜誦老莊之言流及科場亦相習尚新進後生未知臧否口傳耳剽翕然成風至有讀易未識卦爻巳謂十翼非孔子之言讀禮未知篇數已謂周官為戰國之書讀詩未盡周南召南已謂毛鄭為章句之學讀春秋未知十二公已謂三傳可束之髙閣循守注疏者謂之腐儒穿鑿臆說者謂之精義且性者子貢之所不及命者孔子之所罕言今之舉人發口秉筆先論性命乃至流蕩忘返遂入老莊縱虚無之談騁荒唐之辭以此欺惑考官獵取名第祿利所在衆心所趨如水赴壑不可禁遏彼老莊棄仁義而絶禮學非堯舜而薄周孔死生不以為憂存亡不以為患乃匹夫獨行之私言非國家教人之正術也魏之何晏晉之王衍相與祖述其道宅心事外選舉者以此為賢仕官者以此為業遂使紀綱大壊胡夷並興生民塗炭神州陸沈今若於選士之際用此為術臣懼向去任官之士皆何晏玊衍之徒則政事安得不隳風俗安得不壊正始永嘉之弊將復見於今矣伏望朝廷特下詔書以此戒勵内外公卿大夫仍指揮禮部貢院豫先曉示進士將來程試若有僻經妄說其言渉老莊者雖復文辭髙妙亦行黜落庶幾不至疑誤後學敗亂風俗取進止論責降劉述等劄子熈寜二年九月十一日上臣竊聞知雜御史劉述集賢校理丁諷審刑詳議官王師元皆以執守謀殺刑名差官取勘侍御史劉琦錢顗皆以論列政府公事除員外郎降監酒稅中外聞之無不驚愕臣聞孔子曰守道不如守官孟子曰有言責者不得其言則去此古今之通義人臣之大節也彼謀殺已傷自首刑名天下皆知其非今朝廷既違衆議而行之又罪守官之人臣恐重失天下之心也夫紲食鷹鸇求其鷙也鷙而烹之將何用哉陛下踐阼以來待臣下以寛仁至如皮公弼陛下明知其貪閻充國陛下明知其猥也二人皆以知縣權發遣三司判官公事及得罪而出皆為知州今錢顗所坐不過狂直止以迕犯大臣遂降為監當然則狂直之罪重於貪猥得罪大臣甚於得罪陛下也臣不勝拳拳竊恐來者側目箝口以言為諱威福移於臣下聦明有所壅蔽非國家之福也臣備位近臣親被明詔覩朝廷政事之闕不敢不言伏望聖慈深察愚衷早賜指揮赦劉述等更不取勘其劉琦等别除一般資序差遣庶幾稍息羣議取進止再舉諫官劄子熈寕二年十月七日上臣昨日面奉聖㫖令臣采訪可任諫官者宻具姓名聞奏臣竊見龍圖閣直學士陳薦舊事陛下於藩邸其忠厚質直陛下必素知之直史館蘇軾制䇿入優等文學富贍曉逹時務勁直敢言職方貟外郎王元規自少至長志操堅正所居之官皆著風迹集賢校理趙彦若師民之子強學懿行不減於父平居恂恂如不勝衣遇事剛勁人莫能奪此四人者臣所素知竊謂可偹諫職伏乞聖明更賜裁擇取進止乞優賞宋昌言劄子熈寕二年十月七日上臣聞國家大政在於賞罰若賞罰明當功無不成臣去冬奉勅與張茂則相度二股河及生隄利害當時都水監丞宋昌言建議欲於二股河口西岸新灘上置立土約擗欄水勢令入東流候向去東流漸深北流淤淺即閉塞㫁北流放出御河胡蘆河下流以除恩冀深瀛以西諸州軍水患臣等因得其言尋具此利害奏聞䝉朝廷聴許令修置土約自後昌言同列提舉脩生隄者以䇿非已出百端沮毁以為二股河必不可成不如併力修生隄及李立之赴闕上殿所言陛下所親聞也頼陛下聖明斷在不疑必使之修置土約今秋擗欄得水勢一併入東流其北流尋已閉斷雖頗漂溺損近東滄徳等州民田廬舍然恩冀深瀛以西州軍蒙利亦為不少其宋昌言不可謂之無功今若與同列稱二股河不可成者一例受賞臣竊恐當官之人覩之無所沮勸況昌言因去嵗職當在外河決棗强獨奪一官今若止復舊官則是衆人受賞而昌言獨不得賞也設使曏者修置土約不成或背了二股併入北流其同列豈肯分昌言之罪伏望聖慈察昌言建議之功特與復舊官外更與董役之人等第别加酧奬庶使向去用心向公者朝廷必不負之也取進止再乞資䕃人試經義劄子熈寕三年二月六日上臣先曽起請應資䕃出身人初授差遣者更不試詩只委審官院流内銓試孝經論語大義共三道仍令主判臣僚更將所對義面加詢問若義理精通者特保明聞奏優與差遣稍通者依常調不通者且令脩學候一周年外再試必湏試中方得出官若年四十以上聴依舊制只冩家狀讀律自後不蒙朝廷施行臣今復差知審官院竊見資䕃人初授差遣者令試詩一首實為無益不惟其間有牆面者假手於人徒長姦偽就使自作詩得如曹劉沈宋其於立身治民有何所用古者二帝三王皆立太學之官以教公卿大夫子弟其故何哉盖以其人將嗣守官業苟無徳行道藝則必害及於民故也今若欲使公卿大夫子弟盡肄業於大學則其父兄不常在京師固難齊壹若但使之習業於家而考校於初授差遣之際業不習者不得出官則不煩勸督而人人自勉於學矣此乃事之易行者也嚮若使之盡通詩書禮樂則中材以下或有所不及今若使之習孝經論語倘能盡朞年之功則無不精熟矣此乃業之易習者也然孝經論語其文雖不多而立身治國之道盡在其中就使學者不能踐履亦知天下有周公孔子仁義禮樂其為益也豈可與一首律詩為比哉臣竊以為兹事用力不勤更張甚易而為益稍大别無所損伏望聖慈詳察或有可取乞檢臣前奏特賜施行取進止乞不揀退軍置淮南劄子熈寕三年二月十一日上臣竊聞道塗之言未審虚實或云朝廷欲揀在京禁軍年四十五以上微有呈切者盡減下請給并其妻孥徙置淮南以就糧食若實有此議臣竊以為非宜何則在京禁軍及其家屬率皆生長京師親姻聨布安居樂業衣食縣官為日固乆年四十五未為衰老微有呈切尚任征役一旦别無罪負減其請給徙之淮南是横遭降配也諸軍之内沙汰甚多必恐人情惶惑大致愁怨雖國家承平無事綱紀具張此屬恟恟不安亦無能為患然詔書一下若萬一有道路流言驚動百姓朝廷欲姑務省事復為收還則􅉐失威重向去無以復號令驕兵若遂推而行之則衆怒難犯專欲難成意外之變不可不防梁室分魏博之兵致張彦之亂此近事之可鑑者也故臣願朝廷更當深思熟議未宜遽下此詔也夫水未至而虚為之防水雖不至亦無所害謂水不足憂而不為之防一旦水至則防無所及矣故君子貴於思患而豫防之也且國家竭天下之財養長征兵士本欲備禦邊陲今淮南非用武之地而多屯禁兵坐費衣食是養無用之兵置諸無用之地也又使邊陲常無事則已異日或小有警急主兵之臣必争求益兵京師之兵既少必須使者四出大加召募廣為揀選將數倍多於今日所退之兵舊兵尚請衣糧未去而新兵更添衣糧是棄已教閱經戰之兵而收市井甽畆之人本欲減冗兵而冗兵更多本欲省大費而大費更廣竊恐非計之得者也臣愚伏願朝廷且依舊法每嵗減禁軍有不任征戰者減充小分小分復不任執役者放充百姓聽其自便在京居止但勿使老病者尚占名籍虛費衣糧人情既安於所習皆無怨嗟國家又得其力用不為虚設冗兵既去大費自省在理甚明於事為便臣備位近臣兹事繫國安危不敢不言取進止邇英奏對熈寕元年}
