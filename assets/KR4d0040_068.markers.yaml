  - {type: variant, offset: 0, length: 769, content: 温國文正公文集卷第六十八銘箴頌原說述銘䥫界方銘劒銘并序槃水銘四言銘箴勇箴逸箴友箴頌顔樂亭頌原原命說說玄述述國語四言銘系述銘䥫界方銘質重精剛端平直方進退無私法度攸資燥濕不渝寒暑不殊立身踐道是則是俲劒銘并序或曰古者君子居常佩劒以備不虞今也無之倉卒何恃焉應之曰君子恃道不恃劒道不在焉雖劒不去體不能救其死是故苟得其道則劒存可也亡可也作劒銘云昆吾之精太阿之靈深慮過防却除不祥倐忽縱横萬夫莫當用得其道利噐可保道之不明噐無足憑怙力棄常疋夫以亡敗徳阻兵國家以傾逆不敵順暴不犯仁上以守國下以全身長鋏䔥蕭七星炤腰不離於道神鋒可銷槃水銘槃水之盈止之則平平而後清清而後明勿使小欹小欹必傾傾不可收用毀其成嗚呼奉之可不兢兢四言銘聦明勇健之謂才忠信孝友之謂行正直中和之謂德深逺髙大之謂道修己箴三首勇箴何爲而正致誠則正何爲而勇蹈正則勇孟賁之材心動則回臨義不疑嗚呼勇哉逸箴百仞之木生本秋毫德隳於惰名立於勞宴安之娱窮乎一晝德著名成億年不朽可貪非道可愛非時没丗無稱君子恥之昔在周公作爲無逸大聖猶然况非其匹友箴余何遊乎余將遊聖之門仁之里非聖不師非仁不友可乎未可不若遊衆人之場聞善而遷觀過而改顔樂亭頌并序周翰孔子四十七丗孫名宗翰邦直李清臣也孔子舊宅東北可百歩有井魯人以爲昔顔氏之居也周翰思其人買其地犯御名亭其上命曰顔樂邦直爲之銘其言顔子之志盡矣無以加矣子瞻論韓子以在隱約而平寛爲哲人之細事以爲君子之於人必於其小焉觀之光謂韓子以三書抵宰相求官與于襄陽書謂先逹後進之士玄爲前後以相推援如市賈然以求朝夕芻犬僕賃之資又好恱人以銘誌而受其金觀其文知其志其汲汲於冨貴戚戚於貧賤如此彼又烏知顔子之所爲哉夫嵗寒然後知松柏之後彫士貧賤然後見其志此固哲人之所難故孔子稱之而韓子以爲細事韓子能之乎光實何人敢評先賢之得失聊因子瞻之言申而盡之頌曰貧而無怨難顔子在陋巷飲一瓢食一簞能固其守不戚而安此德之所以完, WYG: ''}
