  - {type: line-break, offset: 4265, content: '', id: KR4d0040_SBCK_032-10b07}
  - {type: variant, offset: 4275, length: 1004, content: 賢院外廷之人無不怪惑偶語族談莫知其故或云廣淵以脣舌便佞遊走於公卿之門蓋執政所薦也或云陛下潜龍之時廣淵以文章因陛下故人自薦逹素蒙知賞故特加㧞擢此二者臣莫知其虚實若果有其一皆非朝廷之美也夫端士進者治之表也憸人進者亂之階也臣竊聞廣淵雖有文藝其餘更無所長於士大夫之間好奔競善進取稱爲第一若以此獲公卿之知則其人固非端士矣曏以𥘉任通判編排中書文字二年之間堂除知舒州搢紳巳皆相與指目以爲僥倖今又驟加羙職安得不取外朝之怪惑乎陛下方蒞政之𥘉欲簡抜天下賢材寘諸不次之位以率厲群臣而執事之臣不能稱陛下之意前此用皮公弼權發遣三司判官今又用王廣淵直集賢院將何以使天下之人尚廉恥之節崇敦厚之風乎若陛下龍潜之時廣淵果曽以文章自逹於左右此尤不可昔漢文帝時景帝爲太子甞召上左右飲中郎將衞綰獨稱疾不往及即位寵侍綰過於它臣周太祖時丗宗鎮澶州張美爲三司吏掌州之錢榖丗宗私有求假羙悉力應奉及即位衆皆稱美材敏而丗宗終薄其爲人廣淵若當仁宗之丗私以文章獻於陛下爲臣忠謹者肯如是乎陛下今日當治其罪而又賞之將何以厲人臣之節也所有王廣淵新授直集賢院勑伏乞追還取進止皮公弼第二劄子臣近曽上言乞罷皮公弼權發遣三司判官公事未聞朝廷施行臣聞周禮小宰以六計弊群吏之治曰廉善廉能廉謹廉正廉法廉辨蓋言爲吏者雖有六事皆以廉為夲也翼奉曰人誠向正雖愚爲用若乃懷邪智益爲害蓋言人操心不正者雖有材能無所用也今以公弼材能求於朝士之間不爲難得若其貪汚謟僞則罕有其比陛下方欲簡㧞英賢待之不次以切厲群臣新羙大化而得公弼之徒臣恐四方聞之無不解體使廉正之士沉抑而不顯貪邪之人輻湊而競進其於虧損聖政敗壞風俗不爲細事伏望陛下早追還公弼前所授恩命勒歸東明夲任取進止王廣淵第二劄子臣近曽上言乞罷王廣淵直集賢院事未聞朝廷施行外議籍籍至今未已臣備位諌職不敢塞黙竊見廣淵憸邪便佞勤於造請以此之故自幕職入京數年之間得至除知州今又以特㫖直集賢院臣不知廣淵有何才德過絶於人而受國家寵榮如此之速也議者皆言陛下在藩邸時廣淵因時君卿以文章筆扎私有贄獻深自結納故有今日之命若果如此大爲非冝臣聞爲人君者洗濯其心至公至正審察善惡明辨是非忠信者雖有怨讎而必用姦回者雖有私恩而必誅是以群臣暁然各知所守一心同德以事其上今廣淵若於仁宗之丗私結陛下之知則陛下察其爲人果爲忠信果有姦回若以此獲羙官則姦回之臣欲求進身者將何所不爲恐非陛下之利也自古以来惟英明之主能知此理伏望陛下追還廣淵恩命仍嚴加竄謪以懲憸巧之臣用心不一者取進止温國文正公文集卷第, WYG: 巻}
