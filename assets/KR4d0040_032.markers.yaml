  - {type: variant, offset: 3393, length: 1, content: 點, SBCK: 􅀧}
  - {type: variant, offset: 3395, length: 685, content: 將謀入冦請出兵防托述古恐與前奏相違因此怒凡奏稱不恊軍情張皇生事擅移凡知鳯翔府數日之間西人果大舉犯邊殺掠弓箭手及熟戸蕃部述古亦不即時發兵救援致䧟沒數千戸近者雖知朝廷巳差臺官勘到述古罪狀然竊聞所坐止於擅移劉几及奏狀有不實之處若以文吏議之罪不至重若以國家計言之爲害實深何則國家承平日乆人不習戰雖屯戍之兵亦臨敵難用唯弓箭手及熟戸蕃部皆生長邊陲習山川道路知西人情僞材氣勇悍不懼戰闘從来國家頼之以爲藩蔽今述古知西人欲求侵擾而自避飜覆之辜順成欺罔之謀抑遏將官不許救護遂以數千戸王民委於虎口使父子流離骨肉塗炭豈唯巳䧟沒者深可哀痛臣恐自今巳後諸路弓箭手皆不敢於極邊居止熟戸蕃部皆有叛國從賊之心以此觀之其害豈小哉况述古出於明䕃材器庸鄙自歴官以來所至之處縱恣胷臆殘虐吏民不顧憲典輕侮王命驕暴狼狡天下共知屢曽坐事黜降旋復収用叨竊名位一朝至此誠過其分量故天奪之魄舉措乖繆駭人視聽䧟敗民命坐辱國威内外之人無不憤疾臣聞舜誅四凶而天下服如述古平生所爲亦可以謂之凶人矣陛下縱不欲明加斧鉞以謝邊民亦當投之荒裔以禦魑魅庻使封疆之臣少知驚懼取進止皮公弼劄子臣伏覩近降詔書於初任第二任通判人中選人權發遣三司判官公事九年之後擢爲職司旣使之乆於其事又待以不次之位此誠用人之要術爲政之首務也然當兹選擢之𥘉天下士大夫莫不延頸而望拭目而視若得清修孤直之人則皆勸慕爲善秖節礪行不肖者亦化而爲賢矣若得貪汚謟僞之人則皆傾巧干進飾貌盗名安恬者亦變而爲躁矣此乃風俗之本原政治之樞機不可以不慎自非有竒材異績爲天下所知未可容易當此舉也竊見尚書都宫貟外郎皮公弼爲吏之處以貪饕致冨資性狡猾善爲進取在京師則造請不倦在外則書啓相㝷專用此術致舉者, WYG: 巻}
