  - {type: variant, offset: 4299, length: 0, content: '', WYG: 言王廣淵第三劄子臣前兩次上言王廣淵傾巧姦邪乞盡奪去職名與逺地監當近聞本人帶舊職知齊州仍賜章服如此乃是賞之非黜之也曏使廣淵自改京官以來謹身守分不爲姦諂以至今日不過作第二任通判今所得乃如此豈可謂爲姦諂無益哉孔子稱惟噐與名不可以假人今之章服所謂噐也職名所謂名也二者皆無用之物然而天下貴之者爲其非賢才則不能得之故也唐宣宗重惜章服不輕以與人有司製緋紫衣以備賜與經年不用三兩領故當時服緋紫者人以爲貴夫名噐者譬如珠玉若使之易得如瓦礫尚安足貴乎近嵗兩次覃恩服緋紫者已爲汎濫今又如陳鑄王廣淵軰皆賜章服是使今後受賜章服者皆以爲耻不以爲榮也且陛下使廣淵出補外官者必已知其姦邪之迹也今又復以職名章服寵之是勸人使效廣淵所爲也臣竊恐非國家之福伏望聖斷依臣前奏盡奪去廣淵職名幷比來章服與逺地監當使賞善罰惡皦然眀白取進止言郭昭選劄子治平四年上臣竊聞陛下曏時直省官郭昭選等四人近有特㫖並除閤門祗候衆言籍籍頗謂僥忝國初草創天歩尚艱故祖宗即位之始必㧞擢左右之人以爲腹心羽翼豈以爲永世之法哉乃遭時不得已而然也自後嗣君守承平之業繼聖考之位亮隂未言之間有司因循踵爲故事凡東宫僚吏一槩超遷謂之隨龍以此昭選之徒得自厮役直除班行其爲幸已多矣乃敢妄有攀援邀求無已曽不自省有何功勲小人之心終無厭極不可縱也且閤門祗候祖宗所以蓄養賢才以待任使之地也其班序差遣事事不同譬諸文臣則館閣之流也豈可使厮役之人爲之哉况東宫其餘吏卒甚衆苟一人得之則皆有冀望之心此書所謂啟寵納侮者也陛下既承大統則率土之濵誰不爲臣而獨私於東宫之人則所與親者至狹矣臣昨除御史中丞初上殿之日首以官人賞罰爲言誠以三者致治之本自上世以來不易之道也今昭選等以賤𨽻而叨美職是官不擇人也無横草之勞而數月之間恩命相繼是無功受賞也姦慝眀著如髙居簡等尚保而庇之是有罪不罰也陛下始初清眀方勵精求治而乃輕其官爵慢其賞罰如此將以興太平之功猶適楚而北轅也今臣所以區區進言者但爲陛下惜此而已所有昭選等新除閤門祗候乞賜追寢取進止貼黄或聞昭選等因告昌王入言得此特㫖未知虛的審或如此尤爲不可陛下之於昌王但當極其友愛至於官爵刑賞乃陛下政柄須决之聖心昌王亦不當闗預陛下亦不當聼從如此則兄弟之恩全君臣之分正矣漢館陶公主爲子求郎眀帝不許賜錢十萬曰郎官上應列宿出宰百里有非其人民受其殃是以難之彼爲其子猶不可况爲他人乎傳家集巻三十八欽定四庫全書傳家集巻三十九宋司馬光撰章奏二十二言}
