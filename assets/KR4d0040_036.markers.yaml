  - {type: variant, offset: 5135, length: 0, content: '', WYG: 武侍御僕從㒺匪}
  - {type: variant, offset: 5136, length: 4, content: 公文集卷, WYG: 人又曰慎簡乃僚無以巧言令色便辟側媚其惟吉士僕臣正厥后克正僕臣諛厥后自聖自古聖帝明王雖左右小臣未嘗不謹擇端良之人以自防逸豫之生也况陛下嗣膺寳命聖徳惟新善惡興衰於此乎分而使讒佞如居簡者旦夕常在左右又寵而信之此乃異日禍亂之根腹心之疾也臣職在去邪不敢不再三上言伏望聖明依祖宗舊制應勾當御藥院官至崇班以上者並令出外其髙居簡仍乞逺加竄逐取進止言髙居簡}
  - {type: page-break, offset: 5136, content: '', id: KR4d0040_WYG_039-6a, image: WYG1094/WYG1094-0366a.png}
  - {type: variant, offset: 5142, length: 2, content: 十六, WYG: 上殿劄子臣近曽兩次上言勾當御藥院髙居簡工讒善佞乞逺加竄逐至今不䝉降出施行居簡頃在先朝巳竊弄權柄依慿城社玷辱聖明物論洶洶切齒側目及陛下繼統必謂首行誅竄以警邪臣不意居簡狡猾多端先自結於陛下使陛下寵愛信任更過於先帝之時朝廷公忠之士無不憤懣深為陛下惜之方今内侍之臣小小謹慎可以備陛下左右使令者何可勝數陛下足以擇而用之何必違祖宗舊典負天下譏謗獨保䕶居簡堅如金石臣竊惑之伏望聖慈取䑓諫官前後所言居簡文字盡付所司明治其罪以彰至公之義順合衆心其餘勾當御藥院者亦乞遵舊制官至内殿崇班以上並授以向外差遣取進止言髙居簡第}
