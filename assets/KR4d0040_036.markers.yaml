  - {type: variant, offset: 5132, length: 2, content: 温國, WYG: 言施行封事上殿劄子治平四年六月十七日上臣伏以大舜舉賢敷納以言明試以功漢武帝詳延特起之士待以不次之位終獲其用威加胡越真宗皇帝總覽羣臣章奏用其言而顯其身以成咸平景徳之治凡察言所以知人知人所以立政自古及今其道一也今陛下即政之初首開言路令中外臣民皆得上封事海内欣欣咸畢精竭思以承休徳若於此際能采其嘉謀舉其賢材而用之則太平之基可指日而望也若徒備外飾廢其言而不用棄其人而不取則天下頺弊之事當何時而振起乎臣與張方平先受詔詳定中外所上封事雖巳盡心料簡合於義理可施行者一一奏聞更望陛下擇其精者决自聖意必令行之其有識慮稍出於衆者願陛下特賜召對面加詢訪考其虚實果有可采宻籍姓名遇有差遣隨材授任俟其實有顯效然後可以不次拔擢如此則嘉言㒺攸伏野無遺賢矣取進止言髙居簡劄子治平四年六月十一日上臣聞古人有言堂上不糞則郊草不贍曠芸言近者不治則不暇及逺也竊見勾當御藥院髙居簡資性姦回工讒善佞乆處近職罪惡甚多臣謹按祖宗舊制勾當御藥院官至内殿崇班以上即湏出外盖以日月寖乆官資稍髙則防其慿恃威靈竊弄權柄逺鑒漢唐之禍深為子孫之慮故也陛下即位之初内臣以覃恩遷官者盡補外職獨留御藥院四人天下首以此一事譏陛下之失况居簡於衆人之中最為狡猾而陛下特加寵信待以腹心中外指目大玷聖徳臣職在繩紏不敢不言伏望聖慈遵祖宗令典應勾當御藥院官至崇班以上者盡授以向外差遣其髙居簡乞逺加竄逐以解天下之惑取進止言髙居簡第二劄子臣近曽上言勾當御藥院髙居簡工讒善佞乞逺加竄逐未䝉施行昔周公以立政戒成王至虎賁綴衣趣馬小尹左右􅂝僕百司庶府亦皆擇人穆王命伯冏為大僕正曰昔在}
