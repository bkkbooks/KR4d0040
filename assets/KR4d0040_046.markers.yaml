  - {type: variant, offset: 5502, length: 0, content: '', WYG: 乞開言路狀元豐八年四月上右臣昨在京師伏䝉太皇太后不以臣愚踈無取遣使訪以得失豈惟㣲臣有千載一遇之幸中外聞之踊躍相慶以為言路将開下情得以上通太平之期指日可待也當是時臣未暇備論天下之事先陳所急於三月三十日上言以近嵗風俗頺弊士大夫以偷合苟容為智以危言正論為狂致閭閻愁苦而上不得知明主憂勤而下無所訴公私兩困盗賊已繁冝下詔書不以有官無官之人有知朝政闕失及民間疾苦者並許進實封狀鼓院檢院州軍長吏不得抑退其義理精當者行其言而顯其人狂愚鄙陋者報聞罷去亦不加罪又於四月二十一日復上言皇帝陛下初即政於用人賞罰尤不可不當夫諌諍之臣人主之耳目也不可一日無之說命曰若跣弗視地厥足用傷設有人閉目而塞耳跣足而疾趨前遇險阻能無傷乎賈山有言人主之威非特雷霆也勢重非特萬鈞也開道而求諌和顔色而受之用其言而顯其身士猶恐懼而不敢自盡况震之以威壓之以重乎頃者王安石秉政欲蔽先帝聦明專威福行私意由是深疾諌者過於仇讎嚴禁誹謗甚於賊盗是以天下之人以言為諱百姓愁苦無聊靡所控告致怨謗之語上及先帝臣嘗痛心泣血思救其失是故首乞下詔開言路以通下情臣謂羣臣苟有肯進言者陛下必加褒擢以勸來者此乃古人市駿骨揖怒蛙之意也召誥曰王乃初服嗚呼若生子罔不在厥初生自貽哲命今皇帝陛下新即位太皇太后初垂簾天下之人莫不屬目傾耳臣自到西京以來朝夕伏聴朝廷惟新之政以為必務明四目逹四聦以發天下積年憤鬰之志今開言路之詔旣不聞頒於四方而太府少卿宋彭年言在京不可不並置三衙管軍臣僚水部貟外郎王諤乞令依保馬元立條限均定逐年命買之數又乞令太學増置春秋博士使諸生肄業朝廷以非其本職而言各罰銅三十斤臣忽聞之悵然失圖憤邑無已臣非私於二人直為朝廷惜治體耳夫阿意箝口容身竊禄此小臣之利也威福在巳人不敢言此大臣之利也然民怨於下而不聞國家阽危而不知於陛下有何利哉彼宋彭年王諤臣素不識不知其人為賢為不肖但惜陛下臨政之初而二臣首以言事獲罪臣恐中外聞之忠臣觧體直士挫氣欲仕者斂冠藏之欲諫者咋舌相戒則上之聦明猶有所不照下之情偽猶有所不逹太平之功尚未可期也宋彭年所言雖不識事體但當廢而不行亦不宜加罪至如孔子作春秋為萬世法王安石秉政輒黜之使不得與諸經並列於學官學者毋得習以為業王諤所言未為不當乃以越職為罪古者置諌鼓設謗木詢于芻蕘未聞有位於朝而以言事為越職者也若當職之人旣不肯言不當職之人又不得言則以四海之廣兆民之衆其政治利病天子深居九重何由得聞之哉昨日進奏院遞到告身差臣知陳州然則臣自今於一州之外言及佗事亦為越職何敢言矣今二臣之罰旣不可追伏望陛下如臣前奏下詔不以有官無官當職不當職之人皆得進言擇其可取者㣲加旌賞使天下之人知朝廷樂聞善言不惡論事無可取者寝而勿問庻幾願納忠之人猶肯源源而來也臣禀賦愚戇文學政事皆出人下惟不識忌諱不阿權貴遇事妄言無所顧避以此荷知於累朝見稱於衆人若亦不得言則無所復用於聖世矣上辜太皇太后陛下下問之意下負㣲臣平生願忠之心内自痛悼死不瞑目臣乆忝便安今朝廷授以名藩義不敢辭見牒本州索逺接公人起發赴任次到官之日但勉竭疲駑恪勤本職苟力所不逮伏領罪戾而已謝御前劄子催赴闕狀元豐八年五月十五日上右臣今月十五日平明准入内内侍省遞到太皇太后御前劄子一道令臣早至闕廷者臣狂瞽妄言冝從誅譴曲荷開納仍叨奨飾并以臣羸老抱疾過形矜恤螻蟻命㣲何階報謝臣専候陳州逺接兵士到卽起發赴闕次臣無任瞻天望聖激切屏營之至奏乞所欠青苗錢許重疊倚閣狀熈寜四年正月上勘會永興軍准提舉陜西路常平廣惠倉司牒准司農寺牒檢會近准熈寜二年九月四日勅節文所借過青苖錢斛令隨省稅日限送納如遇本户災傷五分已上合隨夏稅納者展至秋稅合隨秋稅納者展至次年夏稅寺司看詳上件勅意人户合隨夏稅送納者如本户災傷五分已上即展至當年秋稅若秋料内更遇災傷自合送納夏料錢斛了足不許再行倚閣若本户更曽借過秋料錢斛即令倚閣秋料數目展至次年夏料送納切慮内有州縣並不詳認上件勅條一例重疊倚閣牒當司請詳此及備録上件勅條徧下諸州軍如是夏料合納青苗錢斛本户災傷五分以上展至秋料送納如秋料内更遇災傷即却合催夏料數目仍將本路借過秋料錢斛展至次年夏料送納了足即不得將兩次災傷重疊倚閣免至人户積欠數多難為了納别致違悞如有昨來夏料係災傷倚閣展至今秋送納者如今秋本户更遇災傷便請疾速催納了足具數申寺仍關報提刑轉運司准此施行者右}
