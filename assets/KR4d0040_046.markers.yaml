  - {type: variant, offset: 5512, length: 4, content: 文正公文, WYG: 家為民父母置此二倉名為常平廣惠豈當如此今邉鄙用兵軍糧闕乏旣無餘剰可以賑貸伏望朝廷憫此農民遭值凶饑困窮憔悴鄰於死亡直將上件常平廣惠倉斛斗依先降朝㫖借貸與第四等以下人户更不取利若不能如此須欲作青苗錢俵散之時即乞不以元糶價貴賤更不紐作見錢只據所散與人户石斗至將來成熟令出息二分毎散得一斗米者納一斗二升細色或依倉式例折作粗色如此細民猶不至窮困官中取利雖薄亦不减二分元數如允所請伏乞早降指揮謹具狀奏聞伏候勅㫖乞以除拜先後立班劄子元豐八年六月四日上臣於前月二十七日夜准閣門告報巳降告身授臣守門下侍郎二十八日三省樞密院同奉聖㫖除知樞密院外門下中書侍郎左右丞同知樞密院事班次等並以除拜先後為序今月四日延和殿進呈竊見張璪等奏乞推臣在上今後依新得指揮伏縁臣以不才誤䝉朝廷拔擢寘諸執政之末已為忝竊况超越倫軰特出其右在臣愚分何以克堪兼臣在二十八日已前伏乞依新得聖㫖以除拜先後為序在安燾之下取進止乞以除拜先後立班第二劄子元豐八年六月五日上臣今月四日曽奏乞依新得聖㫖以除拜先後為序至今未奉指揮臣噐能學術素出人下執政之中最為後來一旦超居衆人之上誠所未安伏望聖慈依臣前奏班在安燾之下取進止傳家}
