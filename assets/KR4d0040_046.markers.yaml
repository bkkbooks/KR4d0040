  - {type: variant, offset: 5503, length: 1, content: 録, WYG: 具如前臣竊詳朝廷所散青苖錢斛本為救接窮困闕用之民使得至夏秋成熟所以春散夏斂夏散秋斂或遇本户災傷五分以上即展至次料送納盖以寛假飢民使有以自存非為乗此艱食規求利息今司農寺乃令不得將兩次災傷重疊倚閣如有昨來夏科災傷倚閣展至今秋送納者今秋本户更遇災傷便令疾速催納了足臣竊恐此事不合勅意盖縁一次災傷民間猶有舊來蓄積未至困窮其青苖錢尚許倚閣豈有連併兩次災傷百姓轉更不易之時却令須得送納舊來蓄積旣盡新糓又復不收更将何物可以供輸其逐州縣為見司農寺有此指揮不知有無務行督促嚴加科責使貧下百姓何以為生竊惟朝廷為民父母必不肯如此况災傷倚閣稅賦并借貸過斛斗准條並候豐熟日令分作料次送納如更遇災傷亦權住催理何故青苖錢斛最為緊急獨不許重疊倚閣臣已指揮本路災傷地分永興軍河中陜府同華耀乾觧八州軍請勘會去嵗夏料如係災傷倚閣青苗錢斛展限至秋送納去處若去秋本户更遇災傷其夏料錢斛未得依司農寺指揮催理更聴候朝㫖伏望聖慈特賜采察早降指揮謹具状}
