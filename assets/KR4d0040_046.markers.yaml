  - {type: variant, offset: 5508, length: 3, content: 勑旨温, WYG: 勅㫖奏去訖及牒提舉陜西路常平廣惠倉司奉聖㫖冝令提舉陜西路常平廣惠倉司疾速關牒永興軍本路州軍令詳司農寺牒一依修貫指揮即不得施行司馬光牒致誤百姓及時送納劄付司農寺仍仰關牒合屬去處准此次日乞留䑓奏為乞不將米折青苗錢狀熈寜四年正月上准提舉陜西常平廣惠倉司牒右謹具如前本司勘會朝廷元散青苗錢指揮取利不得過二分今來提舉常平廣惠倉司乃依見今饑饉之嵗在市貴價將本倉陳次斛斗紐作見錢支散與人又豫定將來粟麥之價粟毎斗二十五文足小麥毎斗四十文足夲司看詳向去夏秋五糓有豐有儉其糓麥之價固難豫定今將陳色白米毎斗紐作見錢七十五文若折計作小麥價錢支俵毎斗四十文共折計得小麥一斗八升七合半則是貧民於正二月間請得陳色白米一石却將來納着新好小麥一石八斗七升五合若折計作粟錢支俵毎斗二十五文足計支則一斗白米價錢七十五文足共折得粟三斗則是貧民闕乏之時只請得陳色白米一石却將來共納着新粟三石若只送納見錢即又須賤糶斛斗以償官中本利使貧下之民寒耕熱耘竭盡心力所收斛斗於正稅之外更以巧法取之至盡不問嵗豐嵗儉常受飢寒顯見所散青苖錢大為民害竊惟朝廷從初散青苖錢之意本以兼并之家放債取利侵漁細民故設此法抑其豪奪官自借貸薄收其利今以一斗陳米散與飢民却令納小麥一斗八升七合五勺或納粟三斗所取利約近一倍向去物價轉貴則取利轉多雖兼并之家乗此飢饉取民利息亦不至如此之重}
