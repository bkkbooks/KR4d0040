  - {type: variant, offset: 0, length: 5727, content: 温國文正公文集卷第七十八碑誌四皇從兄華隂侯墓誌銘皇姪右屯衞大將軍令邦墓誌銘皇從姪蓬州刺史夫人仁和縣君潘氏墓誌皇從姪右屯衛大將軍士虬墓記右班殿直傅君墓誌銘虞部郎中李君墓誌銘比部郎中司馬君墓表龍圖閣直學士李公墓誌銘户部侍郎周公神道碑皇從兄華隂侯墓誌銘華隂侯仲連字齊賢魏㳟顯王元佐之曽孫邭國公允成之孫遂昌𥙿公宗顔之長子母曰太原郡君郭氏𥘉除右内率府副率厯率府率右千牛衛将軍右監門衛大将軍英宗即位遷右武衛大将軍撫州刺史今上即位遷右羽林軍大将軍辰州團練使侯㓜不好㺯長而樂善學尤精於漢書昭𥙿公素好學喜為詩蔵書萬卷侯能嗣承其志目其詩曰貽慶集熈寜二年五月戊子以疾終享年三十有六上爲之輟視朝一日追贈華州觀察使封華隂侯夫人長安縣君劉氏男二人長曰士轡蚤卒㓜曰士頖右内率府率女六人四蚤卒二未嫁以某年十一月癸酉塟永安縣銘曰昭𥙿愛子以詩書教名而蔵之志在則傚能守冨貴為諸侯孝皇姪右屯衛大將軍令邦墓誌銘右千牛衛大將軍令邦字安國冀康孝王惟吉之曾孫丹陽僖穆王守莭之孫右龍武軍大将軍隴州防禦使世符之子也母曰南陽縣君張氏將軍生五年除太子内率府副率英宗即位遷古監門率府率今上踐祚遷右千牛衛将軍熈寜二年五月甲午遇疾卒年十九贈右屯衛大将軍治平𥘉英宗詔宗子無㓜長皆就學差其年爲大中小三品各置師以教之将軍時年十二從父南康修孝王愛其才性命爲小學錄以表率羣兒及年十五以新制試孝經論語於大宗正司二宗正以其誦習最精屢稱嘆之將軍起謝不敏拜於牀下衆益美其警悟而不伐遂升中學授左氏春秋将軍事親至孝有疾至焚香於臂以禱請然親有過未嘗不諌争其所爲得禮義類皆如此不幸蚤世識之者無親疎共惜之二子男未名而卒女尚㓜是歲十一月癸酉塟於永安縣銘曰學則敏行則孝志業修冝逺到命不融衆所悼皇從姪蓬州刺史夫人仁和縣君潘氏墓誌銘皇從姪右武衛大将軍蓬州刺史令超之夫人日仁和縣君潘氏故鄭王美之曽孫平州刺史惟熈之孫閤門祗候仁矩之子生十六年以選歸於蓬州使君封仁和縣君熈寜二年八月己未疾以卒享年二十有四生五子男子翺右内率府副率次二男未名二女早夭銘曰太勲之門克生令孫歸於帝族稟命天昏款文幽石以識塋園皇從姪右屯衛大將軍士虬墓記右千牛衛将軍士虬右武衛大將軍果州團練使齊安郡公仲郃之子贈安化軍莭度觀察留後髙宻郡公宗望之孫贈安逺軍莭度使同中書門下平章事宻國公允言之曽孫也母曰安康縣君李氏将軍生五歲以例賜名除右内率府副率眀年遷右監門率府率今上踐阼遷右千牛衛将軍㓜而秀慧不嬉戲異於常兒七歲始就學授孝經孜孜不捨晝夜教授劉仲章老儒生嘗於廣坐問之曰将軍誦孝經果有何得對曰事親孝故忠可移扵君居家理故治可移扵官此其所得也仲章驚嘆曰異日成長必爲徳器數年愈自修立有成人之風親親尊尊動皆應法問安視膳朝夕無倦不幸遇疾以熈寜二年五月丙戌卒年十二宗室共嗟惜之朝廷贈右屯衛大将軍其年十一月癸酉塟永安縣謹記右班殿直傳君墓誌銘熈寜二年春傅欽之遺光書曰昔我王考材氣過人䆠不遂以沒堯俞㓜鞠于王妣以至成人㤙隱殊厚堯俞或以事夜艾未寢王妣常危坐待之及仕而之四方王妣不見再逾月則憂念氣濇而成癰逮王妣之亡竭堯俞之泣不足以償癕之血也今将以某月某日舉吾王考妣之栕塟于濟源吾嘗與子同在諌省子幸而知我必為我銘其墓子茍自謂不能是愛其少頃之勤而使我抢終已之恨非仁人之為也光讀之媿且懼復書曰子以義責光光何敢辭然門内之美光不得聞也子為光叙其事以来光謹條次之則可矣有間欽之以其状来曰君諱某字寳臣其先大名内黄人世為冨家曽祖考諱思進始讀書爲儒祖考諱凝贈虞部貟外郎考諱世隆以春秋三傳登科官至駕部貟外郎知印州事始家於鄆君少通尚書屢舉不中苐用親䕃𥙷三班借職累遷至右班殿直𥘉監澶州酒稅厯齊州離濟賽酒稅廬州廵檢以事去官後監趙州倉知㝎州新樂縣復以事去官已而監博州酒稅以疾罷歸眀道元年十月十日終於家夀六十一君爲人忼慨方嚴家之子弟雖甚愛之不命坐不敢坐其當官眀敏果斷在新樂有西山采木卒二百人謀刼其縣大呼自南門入君率左右操白挺逆之至則叱使坐卒不意君遽出皆愕不敢動君因罵之曰餓兵欲奚為捽其為魁者數人杖之各數十而縱之皆抑首去不敢出聲然不能與世浮沉平視貴要若無人故所至齟齬且老益窮因發狂疾棄官歸臥一歲所忽起召家人與訣語言如平生人乃疑其非狂也故相國王沂公為諸生家居未與人接君即以公輔噐之巳而果然人不知其何用知之也夫人霍氏國子博士致仕若拙之孫篤扵孝慈其父亡夫人未之知獨視雲煙草木皆慘悽變色泣下不能自止逾月而訃至後君二十二年年八十一而終男某仕至山南東道莭度推官知磁州昭徳縣事贈工部郎中二女其長者蚤世㓜適楊氏孫七人長曰堯俞字欽之今爲兵部貟外郎次舜俞郊社齋郎次君俞未仕餘皆早世欽之爲諌官䖏大議正直無所顧避朝廷不能用其言除知雜御史欽之固辭不肯拜必求得罪以去知和州聲振天下嗚呼得非承其祖之風烈邪欽之以夫人嘗至濟源愛其土風遂塟焉銘曰氣直志剛難進易傷善抑不揚其後必昌皆理之常虞部郎中李君墓誌銘君之族出趙郡後家肥郷今爲𨳩封府人曽祖考諱滔洺州團練判官贈中書令妣魯國夫人苗氏祖考諱炳侍御史贈尚書令妣陳國夫人周氏考諱䞇虞部貟外郎贈司封貟外郎妣扶風縣太君宋氏司封之兄沆以清重知治體相真宗弟維以文辭髙仁宗𥘉爲翰林學士皆有傳在國史當世士族咸榮慕之君諱某字漢臣早孤始以相國夫人奏試将作監主簿復以翰林君奏爲守主簿𥘉監汝州塩酒稅在京茶庫西京糧料院遭扶風太君䘮服除監南京麴院在京豐濟倉㑹乆疾以國子博士分司西京尋又掌中嶽廟慶暦七年七月癸已終于官舍年五十二君喜爲詩有前人風挌爲人温良清謹睦扵族姻厚扵朋友故其生也人無與之爲怨沒也乆而思之夫人聶氏祕閣校理震之女封河南縣君生六子男攸今爲内閣承制女一適古班殿直王矞一適屯田郎中朱䖏仁餘一男二女早卒君之沒攸與二䖏妹皆㓜家極貧夫人婺矛牙居二十餘年撫育諸孤綱紀家事小大曲盡其冝李氏以復振熈寧二年六月戊午終於京師年七十五先是攸升朝贈君虞部郎中夫人封福昌縣太君攸所居官皆有能名異日必将有成者也光於夫人為姊子攸謂光将以今年某月日塟於洛陽賢相郷之墓子冝爲之銘光不辭銘曰生則人親之沒則人思之誠不盡扵中其誰能得之位則不充夀則不融冝其有子以收以祀以終厥祉比部郎中司馬君墓表兄諱某字嘉謨陕州夏縣人其先宗支所自出見扵祖墓碣曽祖諱某祖諱某父諱某皆不仕兄爲人謹厚孝扵親友於兄弟自㓜及長無子弟之過不幸生二十八年以天僖四年六月辛夘終於家夫人同縣王氏進士禹之女長男未名而夭次男京生未踰歲而兄沒夫人年尚少自誓不嫁京既長以叔祖天章府君䕃入官爲人彊直幹敏所至吏民稱之由是累遷尚書駕部貟外郎通判潞州軍州事贈兄官至比部郎中夫人享榮禄之養幾三十年封福昌縣太君年七十九以熈寜三年七月壬寅終二女長適郷人曹中立早卒次適進士宋輔始兄之沒光生二年矣故扵兄之材行不能詳知然茍非兄力爲善扵其身而無禄安能有遺福及其後邪兄以天聖六年三月乙已塟扵先塋及夫人之沒以其年十月辛酉祔于兄墓京懼嵗時之乆不可以莫之識也泣請扵光爲之表龍圖閣直學士李公墓誌銘公諱某字公素其先唐之宗室避亂入蜀家於邛州之依政曽大父諱殻大父諱扆父諱憲皆不仕大父以才行著郷曲朝廷褒之號静惠䖏士公生三嵗而孤性警敏過人兄綯教之書嚴其程課而出公遨戲自如比暮兄歸公徐取書乘月視之一過立誦數千言兄由是竒之稍長善屬文尤工謌詩氣格豪邁景祐五年舉進士爲天下苐二除大理評事通判邠州事州人以公少年高科始不以吏事期之公銳精爲冶所䖏畫皆出人意表吏民大驚㑹夏虜㓂西鄙劉平石元孫戰沒邉人恟懼邠州城惡吏民謀内徙以避之時州無守将公攝州事即發民治州城僚吏固争以事當言上侍報公日虜将至國外可暇顧文法爲身計耶且我實爲之有罪不爾累乃親度材庀㤙賦功董役不三旬而畢仁宗聞而嘉之下詔佗州守僃當完者視邠為比官滿召試除集賢院厯判登聞皷院吏部南曹開封府推官修起居注失執政意出為亰西轉運使復還修起居注判三司塩銕勾院時杜祁公爲宰相多採㧞英儁寘之臺省不利祁公者指公爲其黨左遷知潤州事徙知洪州事乆之谿變㓂亰湖朝廷議擇有材智者以爲轉運使鎭撫之上曰有舘職善飲酒者爲誰其材可用今安在宰相不能對上復曰是往歲城邠州者宰相即言公姓名乃除荆湖南路轉運使公乗驛至邵陵令諸州皆按兵母得進討遣使􅈬蠻居諭以禍福群蠻感悅皆罷兵受約束又召還修起居注糾察在京刑獄遂知制誥判吏部流内銓知審官院以龍圖直學士權知開封府事京師多老奸宿猾吏不能禽公推迹其物色起居一時録治略盡威令大行坐盗入慈孝寺竊章獻皇后御容大珠徙提舉在京諸司庫務頃之遇疾皇祐四年八月癸未終於家年四十官累遷至起居舍人公爲人踈明樂易倜儻不羈飲酒盡數斗不亂視金帛如糞壤厚於交友與之逰者乆而益親之爲布衣時周逰四方識其土風人情故平生喜言爲治之體及用兵方略數陳便冝書數十上仁宗杳秋䆮髙未有繼嗣公因侍祠髙禖遂奏賦大指言王者修身治國家逺嬖寵近柔良則神降之福子孫蕃衍上深嘉納命内侍石全育宣詔慰撫之公家至貧及病亟自爲表言母老不能終養以是累陛下上哀之􅉠恤甚厚時之士大夫無不惜公之志有餘而夀不給也夫人張氏封南陽郡君子男三人稷太子中舍秬大理寺丞秠太常寺奉禮郎女四人長適皇城使劉永吉次適進士謝少微次早夭次未嫁光與公同年進士也稷状公之治行命光爲之誌光不得辭銘曰材氣以爲實文學以為華孤舉秀出以大其家千里之足羈紲所不能制百圍之木鉤矩所不能加功可大施而夀禄不遐嗚呼天實使然其又奚嗟戸部侍郎周公神道碑周以國為氏漢魏以來世有顯人公之先家於益都曽祖考諱仁貴不仕祖考諱子元舉三禮登科為深州司法參軍契丹覆深州舉室罹禍朝廷哀之贈大理寺丞祖妣田氏追封仙逰縣太君考諱圭時適在外得免朝廷賜以官終太子中舎累贈尚書左㒒射妣李氏累封常山縣太君公諱沆字子眞舉進士一上中第除膠水縣主簿初試吏事精敏如素習上下稱其能徙諸城主簿用蔡文忠公薦遷鎭海軍節度推官知勃海縣濱州大吏恃府勢築室鄣氏居害其出入民訴縣以十數前令莫敢直公立表撤室收吏抵罪豪猾惕息歳餘召入改著作佐郎縣民詣轉運使杜祁公請留祁公爲奏詔許之㑹公以母老疾求監青州稅㝷以憂去職服除知嘉興縣趙元昊擾西陲詔近臣舉可通判陜西諸州者冨丞相時知制誥以公名聞擢通判鳳翔府以權發遣鹽鐡判官召還改江西轉運判官公固辭願得近郷里一官以謀葬乃改知沂州過京師入對言事仁宗善之賜服銀緋到官數月召還為開封府推官俄遷判官㑹湖南蠻唐盤二族殺掠居民官軍討之數不利有詔本路遣人招撫蠻輒殺之乃以公為轉運使委之經畫辭行仍服金紫公至上言蠻驟勝方驕未易懐服宜須秋冬進兵擊之蠻地險氣毒其人驍悍善用鋋盾北軍不能與之确請選邕宜融三州澄海忠敢知其山川習其伎藝者三千人入擣巢穴餘兵絡山足岀則獵取之俟其勢窮力屈然後可招撫也朝廷用其筞二族皆降湖南遂平是時軍旅暴興運路險澀公随宜區處資粮豐給而民不疲病召爲度支判官行未至復加直史館知潭州兼荆湖南路安撫使先是北軍戌湖南山谿者㦯朞年或再朞乃代去再朞者多死瘴癘公奏以為不均請皆以朞年為㫁所生全甚衆歸朝除河東路轉運使自慶暦以來河東行鐡錢民多盗鑄吏以峻法懲之抵罪者日繁終不能禁公乃命高估鐵價盗鑄者無利不禁自息入爲度支副使儂智高㓂掠廣南既敗走詔以公為西路安撫使天子以嶺南地惡命公非賊所殘州縣不必往公曰天子之命至仁也然遠民新罹荼毒余敢不究宣天子之澤以靣慰之乎遂徧行州縣雖窮僻無不到者民避賊多棄田里逺去吏以常法滿半歳不還者皆聴人占佃公曰是豈與凶年逃租役者同乎奏更延期一年召使復業有巳為人占佃者皆奪還之仍免其一年租三年役貧者縣官貸以種粮由是嶺南民復安集又奉使契丹還加天章閣待制為陜西都轉運使未幾改河北𥘉河自横隴西徙趋徳博後十餘年又自商胡西徙趋恩冀朝廷皆以功大遂不復塞有李仲昌者建議請自啇胡口下鑿六塔渠引河東注横隴故道用功省而利大詔遣使者與公行視利害公上言國家近議塞啇胡計用薪蘇一千六百四十五萬役工五百八十三萬今仲昌奏塞六塔計用薪蘇三百萬共是一河其塞之工力不容若是之殊盖仲昌故爲小計以求興役殆非事實又即日河水廣二百餘歩六塔渠廣四十餘步必不能容且横隴下流自河徙以東塡閼成高陸其西隄粗完東隄或在或亡前日六塔水㣲通分太河之水曽不及十分之三濵水之民喪業者巳三萬餘戶就使如仲昌言全河東注必横潰泛濫齊博徳棣濱五州之民皆爲魚鼈食矣今自六塔距海不啻千餘里若果欲壅河使東冝先治水所過两隄使皆高厚仍僃置吏兵分守其地多積薪蘇以防衝决乃可爲也然其勞費甚大恐未易可辨以臣度之六塔實不可塞朝廷卒用仲昌議塞之旣塞不終朝復决齊博等州果大𬒳水害朝廷乃竄仲昌於嶺南諸阿附其議者亦抵罪衆始知公議爲是公又上言民罹水災皆結廬隄冡粮乏可哀臣欲輒發近倉賑之顧大㤙當自上出臣不敢竊取爲名願亟遣使者案視收恤之朝廷從之未幾徙河東都轉運使踰年遷龍圖閣直學士知慶州兼環慶路經略安撫使邉民多䦨出塞販青鹽抵重法公請損官鹽之價犯者稍衰入判三班監兵部太常寺通進銀臺司仁宗山陵為鹵簿使又以遺留物奉使契丹公以二使皆有厚賚不欲專之因託以力不能兼辭使契丹不行士大夫美之英宗𥘉即位契丹遣使賀乾元莭公爲館伴詔取書入置柩前使者固請見上曰取書非故典也上以方衰絰不許使者執書不肯入閤門公曰昔北朝有喪南使至柳河而還今朝廷重鄰好聽君前至京師逹命於先帝恩禮厚矣奈何更以取書為嫌乎使者立授書是時朝廷未知契丹主之年公從容雜佗語以問使者使者出不意遽以實對既而悔之相顧愕眙曰今復應兄事南朝矣頃之遷樞宻直學士知成徳軍兼眞定府路安撫使土俗多棄親事浮屠公案籍閱其不知法者皆斥還其家凡斥數千人在眞定數年以疾辭位治平四年以戶部侍郎致仕其年八月丁未朔薨于家年六十九公為人荘重動止皆有法不妄笑語居家孝友甚至而當官謹嚴始終如一鉏姦衞良摧彊撫弱去嘉興二十年人有過其縣聞民間猶思咏之以爲前後無有罷潭州民遮道不得行公諭解不能却乃旋鞚而南曰當與汝歸耳衆喜奔呼爭先道稍開躍馬北去追至境者尚數百人與僚佐議事其言當者立從之不當不面斥其短徐曰某意欲如此爲安衆亦不能易也所部官屬有罪先以好言諭之不變乃誚責之懼而自改者盖十七八苟尚不變乃案致於法猶爲虧除不盡繩也有死於官下其家孤貧不能自歸者必爲賻歛衞送或無歸者則爲存處立生業嫁其女誨其子弟視如親戚故人始望其貌皆懔然畏之乆而求其心乃知實仁厚長者也先娶王氏再娶劉氏封彭城郡君皆先公即世三男莘将作監主簿百藥大理寺丞常大䋥評事二女適太常博士榮安道来安令江懋簡公薨之歳十月已酉塟於先塋百藥曁常欲刻碑臨道俾異日郷人皆得瞻公之墓不忘公之德請館閣校勘梁君燾状公之功行以授光命爲之銘光昔通判并州事事公於河東雖自知無文不敢終辭銘曰古之君子徳盛道尊望之儼然即之也温公正衣冠嚴不可干施之於政乃仁乃寛吏畏而悛民思不諼𣢾銘垂美以告後昆温國文正公文集卷第七十八, WYG: 薛}
