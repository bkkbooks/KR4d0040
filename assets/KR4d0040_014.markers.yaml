  - {type: variant, offset: 5206, length: 0, content: '', WYG: 送稻醴與子才昔賢尊道誼置醴待嘉賓今我樂閒放提壺餉故人螘浮杯面白味撇甕頭醇何以助髙興籬邊菊蘂新感物朝看新鷰飛暮聼子規啼尺蠖身蔵葉神龜尾曳泥韝鷹何用掣櫪馬不當嘶自伐憎狙巧頽然愛木雞酬安之謝光兄弟見過平時一二日不見已相思况復閉關久杳無􅂝手期清談勝妙藥髙韻敵凉颸愧乏機雲美虚承青眼知酬王安之聞罷真率㑹閉關寜是率辭疾似非真既處譏嘲地誰為長厚人虛舟非有意飄瓦不須嗔此過如何贖清秋宴席陳安之詩有解嘲意故以此戲之資一笑和潞公伏日讌府園示坐客盛陽金氣伏華宇玉樽開真率除煩禮耆英集上才炎蒸疑逺避流景忘西頽幸忝俊逰並仍慙右席陪蒲葵參執扇氷果侑傳杯相國方留客如何務早囬和子駿新荷嬾不窺園久元非效仲舒新荷滿沼宻藍舁出門疎借問含煙晚能勝裛露初愧無魚戯句弄翰白紛如和子華逰君貺園甲第朱門久不開春風潜入發江梅今朝丞相雙車轍碾破林間水畔苔小桃似喜相君來争發新花繼落梅更仗環溪醒殘酒沒篙春水緑於苔太尉公引水繞園可以延客名曰環溪又和上元日逰南園賞梅花梅簇荒臺自可羞相君愛賞忘宵逰未言美實調羮味且薦清香泛酒甌又和逰趙中令園中令園陪丞相逰百分勸酒不須愁春風陌上醒歸去只恐更為桃李羞又和逰呉氏園二首天氣清和無喘牛花林爛熳竹林幽臨風髙詠足爲樂有勇知方笑仲由名園易主似行郵美竹髙松景自幽誰悟本來天地物長為已有固無由和子駿約逰一二園亭看花遇雨而止行樂及佳時官閒無所覉只知花正發不共雨為期淺草碧無際濃雲冷四垂陪逰興未盡安得不相思來詩云人尋載酒地雨破看花期又云感公行樂處蚤莫得相思又即事二章上呈雨不成逰半路歸逢花值栁倍依依朝來頓飲三杯酒醉卧西齋晝掩扉覺後追思氣味長歡情愁緒兩俱忘近来方得醉中趣熟寐沈沈是醉鄉明日雨止復招子駿堯夫逰南園昨朝洛北阻逰陪惆悵中橋半醉囬潑火既經寒食雨解酲須撥凍醪醅詩傳曰春酒凍醪也遙思花寨交横錦未分春心斗頓灰更與二三頭白友試携薄具上髙臺戯呈堯夫近來朝野客無坐不談禪顧我何為者逢人獨懵然羡君詩既好説佛衆誰先只恐前身是東都白樂天聞正叔與客過趙園歡飲戯成小詩吾廬寂寞類荒村但有林間鳥雀喧不似楚家多樂事笙歌拾得醉鄰園和子華應天院行香歸過洛川印節傳呼洛北還府庭無訟不妨閒度橋寒色侵春服按轡晴光露曉山香穗徘徊凝廣殿花籃繁㑹滿通闤自知白雪髙難和忍愧誰能寄我顔寒食逰南園獨飲寒食良辰無賞心雜花爛熳栁成隂若非獨酌酬佳景一日風光直萬金次前韻二首頭白惜春情更深花間獨醉競分隂泉聲醒耳自可樂不用歌抛滿袖金南園莫笑獨追尋明日未知晴與隂揮手一朝辭逆旅滿堂安用累千金觀孫兒戯感懐我昔垂髫今白頭中間萬事水東流此心争得還如是戯走階前不識愁陪子華燕醮㕔酒半過趙中令園簮裾丞相閤林沼令君家煙曲香尋篆杯深酒過花霏㣲燼沈水馥郁漬榠柤愧乏相如賦陪逰託後車和秉國寄子駿堯夫二留臺一臺二妙日追逰琥珀香醪白玉甌相下不厭賢者意尚言執友欠龍頭和伯常自郢州見寄西郊去歳揖行人栁暗花濃又一春坐想髙風清入骨沈吟佳句健生神潺湲杳靄煙波右来書云郢西雨多潺湲杳靄散誕逍遙興趣新應笑洛陽車馬道緇衣未免化紅塵和潞公行及白馬寺得留守相公書云名園例惜好花以候同賞詩二章雲漢成章湛露晞都門宴餞羽觴飛謝安不復東山去争似阿衡得謝歸相國東郊迓帝師油幢交映碧參差都人共喜安輿到正是餘花可惜時和子華喜潞公入覲歸置酒逰諸園賞牡丹介圭成禮下中天春物雖闌色尚妍園吏望塵皆闢户肩輿囬步即開筵波濤凌亂鞾旁錦風雨縦横撥底絃洛邑衣冠陪後乗尋花載酒願年年陪致政開府太師留守相公致政内翰燕集輙歌盛美為三公夀皆用公字為韻獨佐成康世髙年有畢公神心降維嶽龜兆告非熊黄閤遵成範太常書茂功歸來保眉夀恩禮享優隆右太師東閤延髦士西都守别宫不忘如衞武難老似僖公位貌今雖逺官僚舊忝同開懐盡巵酒足以厚時風右相公眉似髙僧秀顔如童子紅忠純汲長孺髙潔夏黄公矯矯遼東鸖冥冥塞北鴻自誇新酒量像想百分空右内翰景仁將歸穎昌輙為詩二十韻紀贈秀發西南美挺生河嶽靈雕龍蔚文采老鸖瑩儀形落筆髙時雋飛緌侍帝庭英聲軼雲漢逺勢擊滄溟苦節專憂國嘉謀毎據經}
