織紞方知縷縷盡辛勤夫人閤四首壁帶非煙潤金鋪霽景鮮繡功添采縷和氣入繁絃翦綵催花發開簾望鷰歸蔵􅍐新過臘習舞競裁衣綺忩繡户又東風丹掖逰陪嵗嵗同但願太平無限樂何須三十六離宫聖主終朝勤萬幾燕居專事養希夷千門永晝春岑寂不用車前揷竹枝傳家集巻十四欽定四庫全書傳家集巻十五宋司馬光撰律詩十仁宗皇帝挽辭二首聲教萬餘里文明四十春茂勲留信史盛徳滿生民共適禽魚樂安知橐籥仁百年龍馭逺空復仰威神霧曉銅魚躍霜寒閶闔開哀聲際海發靈仗拂天来别寢嚴虚位重閽閟夜䑓柏城空有路無復屬車回英宗皇帝挽辭三首盛徳師堯舜英姿肖祖宗太陽光徧照滄海量兼容鴻業知能繼齊民望可封如何未五載已上鼎湖龍虹瑞流朱邸童髦侍紫宸簡心天與子授位帝知人學古功時敏鉤深道日新冝然三百載民物仰威神諫省臣無狀龍鱗昔屢嬰恩深忘位賤義重覺生輕不正誅鋤法仍䝉奬嘆榮百身何足報天造固難名神宗皇帝挽辭五首決事神明速任人金石堅天機先兆朕聖度藴淵泉仁義生知性恩威獨化權乾坤無毁息長與大名傳聴政渉中昃觀書度夜分周王忘自逸漢祖不知勤棣萼因心友雲章落筆文佗年紬石室光大繼皇墳至徳成無象徽名避不居期門弋獵絶歩輦宴逰疎錢列金釭暗兵嚴武帳虚蓬莱日晏仗猶望駕宫車鼇禁叨承詔金華侍執經㣲生輕草芥聖澤濶滄溟鹿性安林野葵心注闕庭堯雲不可望白首涕飄零式道清行馬靈輴下陛簾雲奔同軓集雨泣兆民瞻石闕蒼煙暝松門白露霑載弓徒隕絶無計附龍髯光獻慈聖太后挽辭二首麟閣承家慶軒星應徳暉帝猷隂有補嬪則動無違遽就蒼梧野空餘大練衣只應彤管在萬古播鴻徽四紀褘衣盛兩朝長樂尊九州貢甘㫖萬乘問晨昏明辟歸元子嘉謀賚孝孫群生資后土難答化光恩相國魏忠獻韓公琦挽辭三首瀛海訏謨定宗祧指顧安鴻勲柱石壯勁節雪霜寒翼亮三朝久初終一徳完如何未黄髮壟栢已丸丸愛物威容悴憂公宿疹加孤忠貫白日美志掩丹霞行路皆惆悵聞風悉嘆嗟英靈覲宗祖猶想佑皇家惻怛動旒扆鴻臚𦵏老臣簫鐃震塗口紼翣隘漳濵久大英名在哀榮異禮陳豐碑紀遺烈長泣鄴城人相國鄭元憲宋公庠挽辭二首仁聖初承緒敷天籲雋賢得人兹最盛射䇿獨居先禁省英聲逺巖廊至化宣辭榮還故第三事究髙年邦光華衮補家寳素書陳東閤簮裾散西芒宅兆新泉䑓無復曉柏逕不知春獨有髙文在芬芳繼古人相國祁正獻杜公衍挽辭三首舟楫才猷大冰霜徳操堅陶鈞成茂業書史樂髙年瞻望簮紳共吁嗟館舍捐舉時無異論方信令名全鈞玉呉䑓舊誅茅梁苑新位登華衮貴家似布衣貧直道髙當世清風遺後人千秋寒照目竹帛不棲塵先子同烏府知音誠皦然脱縗来拜伏撫首辱哀憐迨此泉扃掩空悲塵網牽無由懐酒絮撇涕望新阡相國廣平文簡程公琳挽辭二首明直君臣合安危將相兼金章四輔貴玉帳萬兵嚴禦侮長城隠臨繁利刃銛南山霣巖石何以慰民瞻帝誥封泥紫皇墳殺簡青坐談安玉壘專對讋龍庭黼黻昭文理冰霜瑩典刑英靈入箕尾終古作天星相國頴莊敏龐公籍挽辭三首儒衣臨絶塞廟畧運竒兵緩帶𦍑塵靜靈旗海霧清公心結明主隂徳庇羣生名遂身仍退人間五福并銘旌逺明㓕騎吹去低昻三鼎功名大重泉日月長鶴飛来弔客牛臥卜連岡車馬還城郭悲風滿白楊滄波與鄧林魚鳥久飛沉一旦成陳迹何人識寸心髙山亡景行流水失知音淚盡離東閤歸来破故琴司徒開府韓國富公弼挽辭四首天佑休明祚時生雋傑臣賢科首多士宰府澤生民煥爛三台正冲融四海春欲知甄冶力試問白頭人松漠驕無信漁陽廣聚兵移書侮中國决意背齊盟直氣輕軺入英辭左衽驚虜歸烽火㓕㝢縣復升平大吕功名重鴻毛軒冕輕閒居客愈盛蹔出市皆傾溟海涵容大龍門謁見榮謙光儼在目慟哭望佳城杖屨還私第精誠在本朝愛君老不懈憂國沒方昭東閤秋牢落西芒夜寂寥只應忠亮志氣運不能消參政正肅呉公育挽詩三首皇家延茂異鶚立逈無倫髙議誰能奪英才自有真驊騮寜受縶氷鑑不棲塵試為咨清論風流第幾人辭華已獨歩政治復無前吏不容三宂民皆戴二天於今知和寡自古愧才偏惆悵棠隂下仁風尚藹然公冄為陜牧光實陜人知公之政念昔少年日謬登君子堂重言何以稱厚徳不能忘光昔以文請見公答以長歌過有褒嘆玉麈聲容在泉䑓嵗月長憑誰寄清淚為我灑松岡北京留守太師王公拱辰挽辭二首盧肇時推重終軍衆共賢何如奪標日未及弃繻年官歴清塗徧名居美事先人間福有五視履豈非全昔日程文士光應舉公發解中間侍坐賔逰陪慙晚軰待遇過佗人方嘆龍門逺俄驚馬鬛新西園行樂䖏引領但霑巾贈太師文公挽辭三首汾晋地形美古今多鉅賢况承勲烈後冝有慶靈傳著位登朝古聲華出衆先起家從此始圭組遂蟬聮美化流民物薰然遺愛多欒公當日社邵父至今歌庭有三鱣集門容駟馬過欲知餘慶在公鼎格平和夏屋封何處山田有卧牛蟠根走伊水回首負嵩丘忠孝家風備哀榮禮秩優龍鸞舞宸翰萬古照松楸樞密太傅文恭胡公宿挽辭二首行冠鄉人品文為學者師黄裳藴厚徳玉律儼清規大節人難奪嘉謨世莫知儀型不可見遺烈滿豐碑徘徊㳺内禁宻勿賛鴻樞隂徳加民物清名服士夫天方遺一老星忽隕三呉疑從龍髯去來雲在帝都贈太子太傅康靖李公若谷挽辭二首黄髮今彫喪蒼生欲奈何散金纔極樂曳杖已成歌十郡餘恩在三䑓故吏多位崇仍有後五福更為多鹵簿去悠悠西郊亂葉秋旐翻寒日薄笳咽斷雲愁吊客門飛鶴佳城山卧牛靈車今不返洧水自東流宣徽惠穆吕公公弼挽辭二首奕世台衡貴盈門紱冕榮遐方流惠化殊俗讋威聲宥宻資忠力安平寄老成遽騎箕尾去何以慰蒼生維嶽人皆仰長城衆所依逺猷方克壯昭世忽長違象設儼如在英靈窅不歸唯應令名久竹素藹餘輝宣徽使文肅鄭公戬挽辭二首璿璣敷帝命金節護邉兵盡付將軍制真為儒者榮扶揺方上擊濛汜忽西傾罷市人相弔紛紛滿百城桞翣䘮容盛江山故國遥清時獨長往何日重来朝事與秋雲斷榮如曉夢消西風虎丘路馬鬛又嶣嶤又代孫檢討瑜作二首湖澄翠岫孤勝地古東呉氣象常時秀英靈何世無金閨演王綍玉帳綰兵符煒􅏎照鄉曲從兹益重儒人為天地客處世若浮休豈有生長在祗知名可留露沾寒草晚風嘯白楊秋地下求文友應從顧陸逰翰林彭學士乗挽辭三首夙昔逰清貫時流籍重名讐書石渠祕視草玉堂榮吉兆虚三鱓凶期告兩楹子雲思故國墳樹必西傾平生對交舊萬日正如初不復知榮賤都能忘戚疎遺靈瞻素几偽物屛塗車家事何蕭索空餘萬巻書祖奠垂將撤笳簫儼欲行野寒嘶故馬樹轉出新旌泉路幽無底魚燈曖不明如何齎美志欝欝向佳城楊侍郎察挽辭二首時論歸清徳皇心重老臣祖風終鯁直家學本深淳便殿談經久安車就第新如何金未盡奄忽棄鄉人憂國心如石當朝有古風掛冠雖在逺遺札不忘忠飛旐西歸洛新阡背倚嵩還令往來客下馬白楊中王侍郎琪挽辭二首弱冠獻竒䇿居然終賈才賦成平樂館歌奉柏梁杯侍郎天聖初以江都主簿上書獻十䇿召試館軄嘗侍宴後苑賦山水石歌首出諸文士獨被褒賞麗藻留昭世英逰隔夜䑓土中埋美玉誰見不興哀振鷺辭靈沼冥鴻翔太虚清朝觧鳴玉舊里掛安車詩酒江山勝園林俸祿餘所忠今不往誰奏茂陵書鄭侍郎紓挽辭雲夢氣回復比肩生雋豪司農家學富廷尉里門髙騏驥昔千里鳳凰今一毛即邱餘慶在終應吕䖍刀侍讀王學士挽辭二首石室書編富金華講席重薦神歸愽洽鳴玉稱雍容貳負纍囚象尸臣古瑑蹤老成今已矣咨訪欲誰從杖底潜蛇影門隂集戴鵀玉樓新記就石槨舊銘沈篋有封巒札籝無遺子金寂寥封馬鬛秋色淨松林參政尚書文簡丁公度挽辭二首鳳蹕遊汾曲非熊得偉人閨䑓尤顯重訓誥愈深淳論道參黄閣横經侍紫宸如何天不愸志業未全伸丹闕晨趨退蕭然忘世榮閒齋虚自白永日澹無營脱落簮纓累沈冥丘壑情貪夫誠有激千載素風清侍讀張學士瓌哀辭二首喜怒與榮枯居之悉晏如稍門多執筆至老不抛書常愧無能極曽霑清論餘秋風郭門外雨泣望喪車凶夢歌洹水妖巢集戴鵀未嘗餘俸祿無以具衣衾袁渙分倉榖翁歸賜府金佗年純固傳寜使令名沈朝廷以公清貧􅐠贈有加錢左丞明挽辭二首煒􅏎傳家學連翩射䇿榮走丸過省閣破竹取公卿埋玉嗟何早為山惜未成空令澤宫友相顧淚縱横同年致祭者二十二人象設如平昔升堂不見君尚疑言笑在忽念死生分清論千秋雪浮榮一片雲泉臺多少路何處復修文紫㣲石舍人昌言挽辭二首地勝岷峨秀時清雋乂生揚雄晚得祿何武少知名性有圖書癖心忘紱冕榮前年歸諭蜀不使里人驚顧我非君比最為相得歡平生逰䖏久美行始終完長夜忍埋玉秋霜不借蘭西風濕襟袖空有淚䦨干邵少卿挽辭北固啟佳城東呉霣徳星繐帷長寂寞羽扇遂飄零泉燭千年碧霜松數寸青餘慶知有在玉樹滿階庭梅都官堯臣挽辭二首兵形窮勝負史法貫興衰落落雖殊衆恂恂不迕時位卑名自重才大命須竒世俗那能識傷嗟止為詩漆燈無復曙柏徑不知春南紀光華减中朝俊秀貧淒清千古韻寂寞一邱塵異日昭亭下方多􅅹酒人臧郎中挽辭二首積慶承前烈呈才㑹聖時踐楊朝有籍治行吏為師僚友皆親譽黎民每去思惜哉違世早志業未全施素履存誠厚虚懐待物真鄉閭昔相接朋友世彌親遺札蠅頭細長阡馬鬛新九原那可作空復想音塵張元常挽辭二首為吏文無害臨民政不苛渾金生自美古井澹無波方喜風鵬舉旋聞隙駟過善人宜夀考報施定如何秀眉無足驗結轖遽為災鄉曲三年别江山萬里廻林閭飛旐入書劔逐舟来墳草枯還綠重泉不復開王朝議尚恭哀辭二首場屋推聲價朝紳仰典型朱衣老卿列白首戀親庭舟壑一朝失泉䑓萬古扄音容宛在目爭免淨飄零樂易春陽暖孤髙秋氣清老惟知自適貧不問為生京兆開阡貴延陵題墓榮如何帝師筆純孝紀名卿邵堯夫先生哀辭二首菽藿一簞樂蒿莱三畆寛蒲輪不能起甕牖有餘安髙節去圭角久要敦嵗寒今朝郊外客誰免涕汍瀾慕徳聞風久論交傾葢新何須半靣舊不待一言親講道切磋直忘懐笑語真重言䝉蹠實佩服敢書紳先生嘗以予為脚踏實地之人哭公素二首負書逰上國拾芹取榮名雅度津涯闊髙文風雨驚忘懐飜得謗縱酒遂傷生忍使泉䑓客悁悁不自明丹旌倚輤車榮辱盡虚無半道驊騮頓先秋蘭􅊉枯兒癡纔過齓親老不勝扶家事今蕭瑟寜將未第殊哭尚頴字公楚操業五常備艱難六極全仲尼難語命禆竈不知天弱女飄何許遺文散莫傳官輕史不錄後世孰稱賢哭劉仲邍父天下才無㡬夫君獨患多髙文粲列宿英辯瀉長河榮宦成朝夢浮生度尺波舊僚空執酒相與淚滂沱昔醉金明渚今来慧辯祠當年笑相視此日哭殊悲天逈川原淨風髙草木衰江梅靈氣在泉下復相知哭馬承之平生千里别書問亦常来隼拂秋雲擊鸞兼霏霧廻曏無髙世藝安見出倫才有紙盈箱箧扃封不忍開傳家集巻十五欽定四庫全書傳家集巻十六宋司馬光撰制詔殿前都指揮使節度使加宣徽南院使制限二百字以上成國家選果毅之材以守衞中禁委謹信之士以敷揚大猷自非忠力冠倫識略髙世折衝厭難外可以任爪牙之官諭志布和内可以受腹心之寄則何以克叶民望無曠天工在兹詳求固匪輕受爰發休命誕告明庭具官某心通武經材應時用以禮樂慈愛為制勝之本以智信仁勇為和衆之資羞孫呉而不為慕方召而自任嶷爾深念則物莫能窺截然長驅則敵不及避是以錫之六纛緫此八屯士皆知方國以増重嘉其扈從之久積是勤勞之多冝峻寵名以昭丕績俾奉宣於美徳庶敦懋於膚公永念厥艱必有以稱於戯竭股肱之效所以報恩榮罄夙夜之勤所以熈職業典聽朕毖無棄爾成翰林學士禮部侍郎除三司使制限一百五十字以上成朕荷天地之貺施承祖宗之慶靈四方無虞萬物咸遂而公私之積尚未豐衍嵗小不登民有菜色豈朕所以嫗煦撫循之未至將有司奉揚宣布之未稱與何其設心之勤而收效之寡也以爾具官某性質之美得於自然而發揮於文追琢於學多士之秀無爾為先雖禁林清塗秩宗美仕居之積久譽望已優而古之進賢必試以事財賦之任於今為急求稱其職僉曰汝能是用命汝典兹邦計汝其勿以金糓為末而不恤勿以簿領為煩而不為九功所歌八政所重登平之業將汝乎取之誡勵舉人敦修行檢詔限二百字以上成孔子稱徳成而上藝成而下故為四科以第門人而文學䖏末然則為士者文有餘而徳不足斯而已矣奚足尚哉國家憲章前古詳延俊乂敷奏以言明試以功何甞不勤求敦忠屏斥浮偽列于庶位得人已多尚慮有司教導之方不登盡善登進之法有所未精是以士或背本追末弃實取華不知從學所以立身為文所以行逺而謂能離章辨句則百行可遺非屬辭比事則六經無用習尚成俗安恬不非此豈聖人所以立教之心而朕所以待賢之志哉自今天下之士其務以道徳為師仁義為友進之於内而讓之於外治之於身而施之於人才雖美不敢以自驕善未至不敢以自怠如是則窮居閭閻何病乎不逹苟異於是朕無取焉仍敕有司明諭中外使咸稱朕意賜宰臣韓琦乞退第一表不允批答朕以寡薄少承基緒未及究明師保之訓更閲事物之變而遽失先帝之大庇膺四海之重任怵惕危懼若渉巨川踐于春冰實頼耆耋不貳心之臣朝夕左右同力恊義用濟于艱難夫選賢任能廣叅同異何損於政設官分職論列得失亦維其常至於天時數沴蓋以警誨朕躬非專輔弼而卿遽自咎責抗章辭位是重朕之不徳也卿其體兹眷倚之志專精致思廣裕厥心博采嘉謨以輔不逮賜新除知樞密院事陳升之辭免恩命不允斷來章詔敕升之省所奏劄子今樞密院使副四員無容其間更置一知院事旣非舊典驟増貟數當無事時四方聞之得無驚動耳目伏望聖慈如臣前所請若大名府永興軍已除用人即且乞授臣陳潁一郡事且悉卿志氣安裕明智自將屢更邉藩甞佐樞府出牧於外迨今朞年朕惟汝思俾復舊職冝夙夜竭力以副所期尚爾固辭殊失朕意夫登用賢雋憂在不多咨詢大猷患在不博設官隨世何必故常今邉境雖安而不虞當戒亟踐乃位毋違朕言所乞冝不允仍斷来奏故兹詔示想冝知悉賜資政殿大學士戸部侍郎知青州呉奎乞就差知兖州不允詔敕呉奎省所奏乞就差知兖州貴便頥養事具悉卿朝廷舊臣踐厯二府忠厚强直簡在朕心海岱之區土沃民庶風聲氣俗卿所習知雖宿疾未平而事務無廢式是重望底綏一方當體至懐未容辭避所乞冝不允賜文武百寮曽公亮已下上第三表乞上尊號不允斷来請批答省表具之朕荷祖宗之重寄元元困窮未獲厥所夙夜悼懼如渉春冰屬以報本之禮不敢堕曠故躬執犧牲祗見上帝固非昭告成功自營福祿也而羣公卿士猥見褒譽欲歸以溢美増其徽稱抗章勤請至于再三朕乏馨香之徳不能媚于神祗乃甲申地震淫雨為災天威彰著日虞罪悔尚何盛烈之可述鴻名之敢當心焉愧惕流汗霑足况尚在諒闇哀素未忘何冝此時亟舉盛典若斯之議非所敢聞冝體予至誠勿復為奏所請冝不允仍斷来請賜新除知樞宻院事陳升之上第一表辭恩命不允斷来章批答省表具之股肱之臣佐佑帝室樞機之職訏謨廟堂自非僉諧曷敢輕授卿歴事三世克肩一心事效已明時望攸屬膺兹圖任夫復何辭所辭冝不允仍斷来章賜宰臣曽公亮不允批答省表具之朕以不徳災及元元地震冀方隄防横潰流離壓覆靡所底居朕夙夜震懼不忘于心實頼祖考所遺耆儁之臣佐佑輔翼濟于艱難今乃遽自引咎抗章辤位朕何望焉卿其專精致思勉修職業以禆不逮所請冝不允賜觀文殿學士新除兵部尚書知青州歐陽修詔敕歐陽脩省所劄子奏准樞宻院遞到誥勅授臣兵部尚書依前觀文殿學士知青州伏念臣近以疾病累乞致仕未賜俞允欲望且守舊任冀得將理衰殘卿服采三朝佐佑大政朕惟東表之地事任至重自非宗工莫可付委况膂力未衰嘉猷克壯冝念王事勿復有辤所乞冝不允可便受告勅發赴本任除文彦博門下雖天子必有尊所以嚴自上之訓唯聖人能饗帝所以昭報本之誠朕祗紹丕基肇稱元祀禮文既備慶賜誕敷眷惟心膂之臣斡是機衡之任共膺神貺冝䖏衆先推忠協謀崇仁同徳賛治守正保運亮節佐理翊戴功臣樞宻使劔南西川節度管内觀察䖏置橋道等使開府儀同三司守司空檢校太師兼侍中兼羣牧制置使行成都尹上柱國潞國公食邑一萬六千二百户食實封六千三百户文彦博道茂國華才推人傑體忠厚以居徳壯謀猷而奮庸弼亮三朝周旋二紀􅄪司魁柄仍冠中樞仗鉞臨戎則兇渠折首秉鈞調化則黎獻承風内外荐更名實彌劭矧在纂承之際親聞顧託之言委寄至隆眷注為重協賛盛儀之舉克臻熈事之成是用進美號以褒功取閒田而増邑併伸異數式示優恩於戯慮危於安所以綏萬國懐逺以義所以靖四夷益懋乃官用副朕志可特授依前守司空檢校太師兼侍中兼羣牧制置使行成都尹潞國公充樞宻使劔南西川節度管内觀察䖏置橋道等使加食邑一千戸食實封四百户仍賜推忠恊謀崇仁同徳賛治守正保運亮節佐理翊戴功臣散官勲如故主者施行除皇弟頵門下立愛惟親治由近始因心則友化自上行朕合太宫逆釐后帝百神受職四海推恩矧孝弟之至隆冝寵章之光被皇弟山南西道節度管内觀察䖏置橋道等使光祿大夫檢校太尉同中書門下平章事興元尹上柱國髙宻郡王食邑一千七百戸食實封陸伯戸頵温良異禀聦逹夙成勝衣形信厚之風佩韘負老成之志孝友之性不强而安徳義之經未言而喻甫當就學亦既跡封予所撫憐同氣異息迨盛儀之具舉方渙澤之誕敷錫嘉號以記功進崇階而叙位仍加井賦益重藩維於戯寵而不驕以謙恭為之本滿而不溢以節儉為之先汝其念哉無替朕命可特授特進依前檢校太尉同中書門下平章事興元尹髙宻郡王充山南西道節度管内觀察䖏置橋道等使加食邑七百户仍賜崇仁保運功臣勲食實封如故主者施行除皇伯祖承顯門下朕惇宗盛禮祗遹先猷茂對三靈駿奔億醜臣工顯相后帝居歆嘉與親賢共膺戬􅂖皇伯祖昭化軍節度金州管内觀察䖏置等使金紫光祿大夫檢校工部尚書使持節金州諸軍事金州刺史兼御史大夫上柱國康國公食邑五千八百户食實封一千八百戸承顯治躬齋栗養志粹和挺宗室之令儀藹公侯之淑問地隆磐石任重藩垣春秋寖髙學問不倦被服儒素藴河間之雅材琢磨箴規蹈衛武之美徳助我毖祀恊於多儀是用進功伐之名益陪敦之賦仍加真食倂示徽恩於戯懐徳維寜昔王之明訓為善㝡樂前哲之徽猷勉思髙滿之危勿忘臨履之戒可特授依前檢校工部尚書使持節金州諸軍事金州刺史兼御史大夫康國公充昭化軍節度金州管内觀察䖏置等使加食邑七百戸食實封三百户賜推誠保順功臣散官勲如故主者施行除郝質門下朕順考古道率由舊章三嵗一郊四海大賚乃眷爪牙之士實惟心膂之臣冝渙茂恩以均景貺亮節保順功臣殿前都指揮使安武軍節度冀州管内觀察䖏置等使光祿大夫檢校尚書左僕射使持節冀州諸軍事冀州刺史兼御史大夫上柱國天水郡開國公食邑三千一百户食實封七百戸郝質温恭不犯沈毅有謀敢决應北方之强閒暇得晋國之勇仁能附衆忠以發身内總七萃之師外分十連之任訓兵肅給騶御習於義方逢時安平戎狄仰其威信屬是齋祠之謹復兼扈從之勞不有旌襃曷昭倚注論功加等益地從隆考諸僉諧允為冝稱於戯竭誠盡節所以享安榮徇公忘私所以報寵祿往服休命汝其懋哉可特授依前檢校尚書左僕射使持節冀州諸軍事冀州刺史兼御史大夫充殿前都指揮使安武軍節度冀州管内觀察䖏置等使加食邑七百户食實封三百户仍賜亮節保順翊戴功臣散官勲封如故主者施行賜文武百寮宰臣冨弼已下上第五表乞皇帝御正殿復常膳聴樂允批答省表具之朕秉徳不明隂陽謬戾旱暵為災辜及元元為人父母不能保養覆冒以厚其生朕甚愧之是用避去正寢貶膳徹樂夙夜悼懼内自刻責以請咎於神祗浹辰之間雖霡霂屢霑而不能周洽菽麥將槁禾麻未滋而羣公卿士以尊奉母慈誕揚顯號良日既戒冝以時行禮樂之文不可不偹當抑已復常以成大典苟協於義朕何敢違所請冝允西京應天禪院及㑹聖宫奏安仁宗英宗皇帝御容了畢徳音門下朕祗紹前烈寵綏庶邦率時典常㒺敢墜逸越兹有洛之汭自昔令王之都藝祖之所誕生迹存遺老寢園之所以宅神有餘威是用即西竺之仁祠因北胡之勝地儀刑二后鎮撫一方爰命宰司肅將使指鴻儀克舉熈事大成永惟畿甸之民能無供億之役冝敷渙澤用慰羣心應西京管内限徳音到日見禁罪人除故殺劫殺鬬殺謀殺十惡及偽造符印放火官典犯贓不赦外雜犯死罪降從流内情理切害奏取指揮其餘流罪降從徒徒罪降從杖杖罪已下並放見勾當修奉天禪院㑹聖宫影殿使臣官貟已下并工匠兵士及迎奉執擎并並與等第支賜應西京城都内耆老年八十已上者勘㑹詣實人數仰長吏等賜酒食仍量支賜每人茶三斤絹二匹常加存撫即不得於村縣追集致有勞擾於戯稱秩舊章克廣奉先之孝蠲除有罪式昭惠下之仁咨爾羣倫咸體予意主者施行賜樞宻使守司空檢校太師兼侍中文彦博乞退不允手詔省所􅄪上表乞罷樞府事具悉卿器質方厚謀猷明審憂公盡忠臨事能斷越自仁祖知卿美材入輔出藩于兹二紀􅄪冠台席一總鴻樞事功蔚然洽于黎庶任重道逺卿實有焉朕負荷前烈夙宵危懼若渉大川必慿舟楫卿當悉心致力以禆不逮而何嫌何疑遽求去位封奏荐至良用憮然撫覽再三殊失所望老成之徳重於典刑當體至懐安居厥職所請冝不允付彦博賜樞宻使守司空兼侍中文彦博不允手詔省所奏伏覩詔書宰臣陳升之位在臣之下者願寢異恩庶安孤跡事具悉卿翼亮三朝周旋二府國之􅂄儁望實素隆升之任用尚新甫登宰席原其雅意必欲推先是用斟酌禮文裁其宜稱發於朕志奚取常規盖以襃異老成豈與利用為比卿謙恭久著於此何嫌往安乃居毋逆朕命所乞冝不允付彦博除皇伯宗諤門下朕祗荷先烈誕受多方樂與宗支共其福祿儻率履之有立在襃表之敢忘皇伯推誠保順功臣集慶軍節度亳州管内觀察䖏置河隄等使光祿大夫檢校尚書左僕射使持節亳州諸軍事亳州刺史兼御史大夫上柱國虢國公食邑六千四百戸食實封一千八百户宗諤屬尊地親材髙性敏承累朝敦睦之慶膺列藩封建之榮間由思慮之疏麗于文法之禁眷是有司之議繫夫天下之公愛雖甚隆理不可居是用收還相印專秉節旄將警動於放心期輔成於盛徳迨兹周嵗克懋令圖勤被仁服義之風勵臨深履薄之戒朕於庶姓猶不弃人况九族之下文缺賜叅知政事王安石乞退不允批答省表具之卿文學髙一時名譽專四海勇於立事急於進賢朕心倚之以安平士論待之以康濟盖居位之尚淺或改命之未孚雖羣言之正讙豈同徳之有間遽求分務深用駭聞居就乃功期副予望所乞冝不允賜南平王李日尊示諭敕書敕南平王日尊省所上表稱於今年二月内親領本道兵甲乘駕舟航直抵南蕃與占城國及占臈國蕃兵交戰其占城國及占臈國蕃兵甲一時敗散臣帶領兵甲囬旋本道師旅保全舟航寜謐事具悉卿與占城等國交戰師出逾時今覩奏章備言勝㨗益敦忠順良用歎嘉朕子視兆民臣畜萬國思銷偃於中外共嬉逰於邇遐冝體至懐以綏後福故兹示諭想冝知悉賜叅知政事王安石不允斷來章批答省表具之朕以卿材髙古人名重當世召自巖穴寘諸廟朝推心委誠言聴計用人莫能間衆所共知今士夫沸騰黎民騷動乃欲委逺事任退䖏便安卿之私謀固為無憾朕所素望將以諉誰祗復官常無用辭費所乞冝不允仍斷來章賜叅知政事右諫議大夫趙抃乞退第一表不允批答省表具之朕躬攬庶政燭理未周思得博聞善言以參得失卿以清直之操夙夜在公遽求外遷殊匪朕志所乞冝不允賜殿前都指揮使安武軍節度使郝質不允詔敕郝質省所上表星未半周疾已十作伏望罷領殿帥俾外補於散官庶漸蘇於餘喘事具悉卿以沈勇冠軍忠厚許國内典嚴衛外秉節旄夙夜之勞簡于朕志偃息之便難徇爾懐所乞冝不允故兹詔示想冝知悉祁國長公主特進封衛國長公主制張尉門下帝妺中行易象賛其元吉王姬下嫁召南美其肅雍命服亞正后之尊主禮用上公之貴寵光之盛誰昔釋訓誰也昔疇昔而然矧同氣之至親推異數而何愛祁國長公主席靈長之緒承濬哲之祥禀乾坤之粹和鍾日月之明潤淵懿可度柔嘉有章志女功而忘勞承師教而不倦今玉笄在首厭翟戒塗方結帨於皇家將執笲音煩竹噐於士族冝疏沬土之邑俾適冨平之孫庸展茂恩誕孚醲化於戯琴瑟靜好式昭和樂之音雷風順承是為常久之道勿以夫家之貧素有虧婦徳之聴從祗服訓辭永綏福履可特進封衛國長公主仍令所司擇日備禮册命主者施行賜新除叅知政事韓絳辭恩命不允斷来章批答省表具之卿世濟明允時推儁良毗賛樞庭茂著功烈俾叅國論允叶衆心需章亟来謙志太過㩀引先誓祈還故棲夫顯親揚名斯為上孝建功立事莫若盡忠往即乃官勿替朕命所辭冝不允仍斷来章賜新除宣徽南院使特進檢校太保判太原府歐陽脩辤免恩命不允詔敕歐陽脩省所兩次劄子奏伏䝉特差中使齎到告敕除臣宣徽南院使判太原府事所有敕告未敢祗受欲望檢㑹臣前所陳乞於淮潁間移一小郡俾飬殘年事具悉卿才名素髙華夏所服中外備更文武咸適眷兹并部氣俗沈鷙綏和一方威懐二敵牧伯之任豈易其人詢謀僉諧然後發命朕所選付卿宜體識况風土髙涼其何恙不已往踐乃職毋復固辭所辭冝不允故兹詔示想冝知悉賜守司徒兼侍中判大名府韓琦不允詔敕韓琦省所四上劄子乞就移徐州一任事具悉卿倦居守之勤樂偃藩之逸眷是别都之重控夫北道之衝自非元臣疇克譽䖏是以臨遣近侍往宣至懐恩禮之隆所宜欽若而上兹固請良用憮然卿以衰疾為言則未愆於膂力以朴忠自許則可憚於劇煩安視爾師毋逆朕命所乞冝不允故兹詔示想冝知悉賜新除樞宻副使右諫議大夫馮京辭恩命不允斷来章批答省表具之樞衡之司基本攸託制勝帷幄折衝方隅苟非文武之兼資孰副安危之重委簡自朕志無若汝材故推不次之恩冀獲非常之效當思自勉勿或深辤所辭冝不允仍斷来章除董氊制門下國家蠲㓗大徳懐柔四方懋宣行葦之仁横被蓼蕭之澤遐邇無間内外一均西藩邈川首領保順軍節度洮州管内觀察䖏置押蕃落等使金紫光祿大夫檢校太傅使持節洮州諸軍事洮州刺史兼御史大夫上柱國常樂郡開國公食邑五千一百戸食實封一千一百戸董氊氣禀沈雄性資果毅載勲庸於奕世開土宇於西陲早膺旄鉞之榮撫有洮湟之地祗勤厥事忠誠著於皇家紏逖不䖍威令行於戎落修其職貢保我封畛冝陳錫於寵章用襃嘉於美志位進異等食衍真封豈繄鎮服於爾師抑亦光華於殊俗於戯王官至重固不徒施臣道惟艱諒無虛受勉服休命益思壯猷可特授特進依前檢校太傅使持節洮州諸軍事洮州刺史兼御史大夫充保順軍節度洮州管内觀察䖏置押蕃落等使仍舊西蕃邈川首領加食邑一千戸食實封三百戸勲封如故主者施行賜新除河陽三城節度使守司空檢校太師兼侍中充集禧觀使曽公亮辭免恩命不允詔敕公亮省所劄子奏伏望聖慈特賜停罷使相之命許只授正官充觀使事具悉卿久居宰席道茂勲隆屢以􅂄耋懇辭機政朕重違雅志曲成沖徳禮命之數愧於未厚而尚兹遜避良用憮然冝即欽承以副優飬所辭冝不允故兹詔示想冝知悉賜新除守司空檢校太師兼侍中充河陽三城節度使集禧觀使曽公亮辭免恩命第一表不允批答省表具之卿以耆明之徳寅亮皇家功成告休海内歸美崇報之典朕旋其薄沖挹之志卿以為優勇退難進益増嘉尚成命不易毋庸固辭所辭冝不允賜新除叅知政事馮京辤恩命不允斷来章批答省表具之卿負英異之才首俊造之選内尹京邑風績著聞外䕶邉兵民夷清謐入冠憲府進躋樞庭况觀爾能冝賛朕政往祗成命無或再辭所辭冝不允仍斷来章賜新除樞宻副使右諫議大夫呉充辭恩命不允斷來章批答省表具之卿之英聲著於士倫卿之嘉績簡在朕心是用擢諸計廷陟彼樞府乃更過自菲薄固辭寵光謙降之深歎尚不已所辭冝不允仍斷来章賜觀文殿學士户部尚書知陳州張方平乞南京留臺不允詔敕方平省所奏乞南京留臺事具悉卿學問精洽文辭雅奥荐登儁科久居邇列入賛大政出臨近藩晦明小愆何恙不巳遽祈散地良用憮然當體眷懐往安爾職所乞冝不允故兹詔示想冝知悉賜文彦博辭恩命第一表不允批答省表具之卿社稷元老股肱三朝黎庶具瞻百工矜式矧以丞弼相予毖祀書勞進律抑有舊章冝亮眷懐無庸辭避所辭冝不允賜殿前都指揮使郝質辤恩命不允批答省表具之卿緫領禁衛為王虎臣敦忠一心夙夜匪懈况兹戎祀之大兼有侍從之勤推恩報功固有常典尚兹沖避豈悉至懐所辭冝不允賜殿前都指揮使郝質辤恩命不允斷來章批答省表具之朕奉若訓典肅將禋祀嘉與臣工共兹休福卿董率王旅陪賛國容居則有侍衛之謹出則有扈從之勞考諸故常冝在襃進當體至意勿復有辭所辤冝不允仍斷来章賜皇伯祖昭化軍節度使檢校工部尚書康國公承顯辭恩命第一表不允批答省表具之朕仰稽唐虞惇叙九族矧以尊屬相予肆祀推恩進律禮亦冝之兹率典彛無為辭避所辭冝不允賜文彥博辤恩命不允斷來章批答省表具之朕躬執珪幣對越三靈惟時福祥不敢專享湛恩布濩覃及海隅卿國之耆明斡統機宻兹率常典奚煩固辭所辭冝不允仍斷來章賜皇弟髙宻郡王頵辭恩命第一表不允批答省表具之朕以郊禮大備廣敷慶澤物無遐遺况於親昵錫兹異數咸迪舊章汝其勿辭往服嘉命所辭冝不允賜皇弟髙宻郡王頵辭恩命第二表不允斷來章批答省表具之禋宗類帝國之盛儀施恩親賢由來盖久兄弟具邇悃愊無華汝往欽哉毋煩辭避所辭冝不允仍斷來章賜皇伯祖昭化軍節度使承顯辤恩命第二表不允斷來章批答省表具之朕躬祠郊丘誕布惠澤周浹庶姓况於宗英執謙固辭益昭令徳朕命不易往其欽承所辭冝不允仍斷來章賜宰臣冨弼等上表賀雲隂日食不及分数批答省表具之朕不明庶政上累三光天雖㣲隂人誰不見彼食分之少損由司厯之未精為懼方深奚賀之有矧明書於信史將取誚於異時宜懋乃誠以輔台徳所賀知賜宰臣曽公亮已下賀夀星出現批答省表具之司分底日垂象降休炳然徳星著見南極太史獻狀以為夀祺卿等浚明一心寅亮元化爕友氣物導迎善祥仍貢需章願書信牒眷言歸美重益愧懷所賀知仍依奏宣付史館賜樞宻使文彦博等賀夀星出見批答省表具之天垂文象依類而言世格隆平得臣是頼卿等懋建一徳光輔萬㣲格于上神錫兹嘉瑞昭申丙位申告永年剡章以聞傳信為請雖菲凉之可愧顧忠愛之敢忘所賀知傳家集卷十六欽定四庫全書傳家集巻十七宋司馬光撰表為龎相公讓眀堂加恩第一表展采合宫用成於盛禮推恩列位首冒於徽章内省空踈交深震慄中謝伏念臣出於單族素乏異能遭㑹聖辰襲承義訓肩隨羣士齒列具僚始更郡縣之勞遂玷閨䑓之美雖慕盡公之節力自拔摩迄無髙衆之名可容稱道頃由邉𤨏進貳樞庭復參丞弼之司旋總㡬㣲之務固已任踰才表榮出望涯十七物之珍羞居慙厚賜三百囷之重祿坐愧素餐雖僶俛以自安常忸怩而内訟屬國家講求闊典祗紹明禋幸千載之親逄叨一時之榮􅀚伏遇尊號皇帝陛下天𠂻廣覆聖道兼容不専享於神休俾下覃於朝衆謂臣職當扈蹕禮與執膰曲矜孱陋之蹤猥被殊尤之澤位列元功之次邑增真食之封事與志違名非徳稱惴如臨谷憂甚履氷豈可忽非據之災安無勞之賞俾衆庶有假人之議致朝廷䝉含垢之羞熟自省循誠難膺克伏望俯矜危欵曲軫睿慈特寢不貲之恩以全無似之質露誠獲允受賜益深第二表愚𠂻上列冀寢於殊恩睿志莫回必申於前命征營無措兢戰失圖中謝伏以陟配總章昔王之盛節追嚴廟祏前載之美談唐虞著五府之文商周增重屋之制久兹曠絶未暇修明伏遇尊號皇帝陛下祗若天常寅恭祭典謂五精之氣不可久契於神歡三祖之靈不可弗親於宗祀若稽古訓濬發聖謨崑崙放玉帯之圖路寢采康成之議八窗四戸屬象相依萬舞九成聲明具在臣謬居機近忝助祼將庀徒護法駕之嚴負璽託屬車之末奉汝上肅雝之慶無周南留滯之嗟其在蠢愚固為榮幸不可復妄膺髙位叨竊寵名况七萃有暴露之勞百司有供億之費欲加之賞宜用為先臣祿秩已豐勤劬至薄豈可復膺褒進以重愆尤伏惟天鑒崇髙下垂燭察物誠精至庶獲感通為龐相公謝眀堂禮成轉官表叨榮過厚揣分非宜制命益嚴懇辭不獲中謝伏念臣顓愚無術孤陋寡徒起家衡茅致位機近此皆出於天幸斷自宸知非才伎過絶於人豈朋援隂為之地是以每循涯知止以寵為憂獲一官若負譴訶進一位若懷疾眚非敢厭薄髙爵希慕虛名誠以居三府之崇賛萬機之大乆留不去妨廢實多况祿厚者衆之所趨勢尤者人之所疾不獨力綿任重失職是虞亦將智淺跡單處躬可畏方自謀於遜避以深逺於譏嫌豈謂伏遇尊號皇帝陛下濬發清𠂻述修盛禮合祛天地之祀嚴配祖宗之靈茂典既成鴻私勞洽謂臣屬當扈從與在駿奔疇其執事之勞均以受釐之慶遷地官之亞列增帝傅之寵名悉非庸虚所能堪稱是用力陳危欵冀寢殊恩葵藿之心徒自傾而無隱雨露之澤非已降而可收雖祗徇於詔文實内慙於靈府敢不益堅苦節愈厲樸忠當官而行蹈水火而無避惟力是視竭筋骨以為期為文相公謝賜神道碑文表命發宸庭文成禁署澤加存歿榮動邇遐中謝竊以金石之傳乆而彌茂風樹之感貴而自悲諒知為子之心咸有顯親之願伏念先臣䇿名休運接武辨朝陳力當官服勤沒齒臣荷析薪之業紹作室之功雖資性甚愚曾無肖似而義方未墜少逭譴尤伏遇尊號皇帝陛下過聴菲才遽加大任寘彼官師之首列於丞弼之司非藉世榮曷膺國寵頃以嵗時得卜宅兆圖新將論譔於豐碑用表章於大隧豈意睿明曲照優渥㳫臻䊸彼神翰掲諸螭首仍詔代言之職直書傳信之辭著琬琰以無忘與松楸而並列聲光不朽永䝉庇於昆孫精爽有知潜拜嘉於幽壤荷恩益腆撫已知輕且身體􅄠膚皆仰資於顧復而股肱心膂敢有愛於生成未識津涯徒知涕泗為文相公求退第二表臣省躬甚眀揣分已熟非敢外􅎖以邀上知天恩留連未見識察物意専慤期於感通中謝伏念臣本以諸生親逄盛世行能無出於萃類學術不際於㡬㣲所期觧韋布之衣霑斗石之祿竭簿領之效免耕稼之勤安敢企踵帝庭許身王佐伏遇尊號皇帝陛下嘉其木訥亮以孤忠課於近小之功粗能稱旨役以煩縟之事不至敗官乃謂榱桷之才可勝棟楹之任錡釡之器足兼鼎鼐之容逺自西州驟叨重柄躋宻地則不踰中宿參大政則曾未期年遽越等夷直登佐弼靜言遭際熟察基縁寧左右先為之容豈朋援隂為之地莫非睿鑒特振寒蹤雖以草木之㣲猶知雨露之澤况於有識詎敢忘恩豈欲違去旒扆之前逺離闕庭之外棄萬鍾之秩辭四輔之崇顧以義不可留情有所廹大易存覆餗之戒詩人著在梁之譏任重難勝位髙多懼雖人主含貸未賜於譴訶有司因循不加於䋲治臣敢不捫心自愧顧影知非乗疵吝之未形保名迹而先退必使愆尤增積謗讟流聞致陛下失終始之仁愚臣受逺邇之責非止謀身之過抑亦負國之深是用寢食震驚夙宵悸慓視金章於芒刺等黄閤於焦原苟未去身何能歉志伏望燭臨危欵矜恤苦言聴避位於上司得保躬於㪚地博求儁傑光輔休明則臣俯就下陳若獲九遷之喜出居外職無殊三接之榮干冒冕旒不勝惓惓之至為龎相公讓官表恩出非常位遷不次内循空薄交集震驚中謝臣識昧疏通學非殫洽依憑時㑹叨假國靈荐更要劇之權遂躋通顯之地陪侍帷幄參與機衡雖盡股肱之勞不遺餘力訖無毫􅄠之效克厭衆心居常自思敢忘内訟方且俟清閒之燕竭悃欵之私力辭宥宻之聨退祈冗散之秩庶逭官責少息人言豈期志願未從寵光愈峻遽以朽踈之質猥當佑弼之司承命以還措躬無所竊以緝熈帝術寅亮國成翼戴萬機統和三極得人則羣生䝉福失職則百度乖方詎可妄居豈容濫授臣雖欲冒榮不顧懷祿苟安儻衆庶責望之深誠朝廷倚毗之失是用夙宵愧恧寤寐兢憂不知列鼎之榮恍若臨淵之懼伏望尊號皇帝陛下俯從危款曲照孤蹤矜其驅策之勤為日已乆察其避讓之固於心不欺俾祗服於舊官特寢除於新命旁求雋徳式副輿情為龎相公再讓宰相表需奏仰陳冀安於涯分綸言俯及未照於悃誠蹐地載驚履冰逾畏中謝臣聞量能授職者人主之通術陳力就列者臣下之令圖義或此違治何由立臣是以退居深念申旦伏思竊惟佑弼之崇實繫安平之本總領衆職鎮撫四夷下遂萬物之冝上序三光之統凡將圖任豈易輕言至若黄霸循良朱博銳敏始為郡守皆號能臣暨陟宰司遂隳盛譽或受嗤於鶡雀或召咎於鼔妖豈前智而後愚盖任盈而量溢況臣空薄詎敢擬倫必欲使用不違才舉無敗事則莫若委之藩服俾敷寛大之條寘以邉方得奉綏懷之畧庶㡬展效不敢憚勤儻以服役有年居官無過不欲捐之草莽尚將留彼闕庭則願且守故棲未遷佗職私自寧於宻地得時望於清光忝幸已深感槩何極豈敢使巖廊曠位元鼎失和竊貪一日之榮不虞四海之責伏望尊號皇帝陛下曲垂矜恤靡賜勿遺察底裏之無欺全始終而可保特収渙命俯徇愚𠂻少安據蒺之憂尚免在梁之刺内惟懇廹期獲允俞為龎相公謝官表荷恩逾分瀝懇敷言成命莫回愧顔無寄中謝伏念臣賦能甚薄探道未深習詩禮以為儒師法令而補吏適際亨嘉之㑹誤膺濬哲之知亟陟顯塗荐膺煩使監邉則盡護羣師侍幄則恊賛萬㣲宻邇清光訏謨基命固已任逾器表榮溢望涯居無終日之間少忘素餐之責何意天恩横被宸睠曲成猥掄樗液之才専委棟隆之任靡由階漸遽爾直登冠冊府之華資總史臣之善志翻經演法進律加田甫聞出綍之言殆失措躬之地力陳丹悃仰黷䆳旒雖堅不奪之誠難變已行之令威顔甚邇私願莫從俯僂若驚徜徉自失此盖伏遇尊號皇帝陛下用人道廣愛物義深不求純備之功姑委燮調之職爰從隗始俾奉蕭規敢不祓飾厥心耀明其志識慮所及不敢顧私筋力可任期於盡瘁小助緝熈之化仰酬覆燾之仁為文相公許州謝上表避辭公鼎雖弛負擔違離天閽倍深眷戀中謝伏念臣材非出類識不先㡬逄辰休嘉致位通顯謹司斥候亟守於邉隅䖍布教條荐更於方鎮訖無聲迹可聳傳聞伏遇尊號皇帝陛下明燭幽㣲仁霑䟽逖遽選掄於遐服俾陪貳於中樞曾不浹旬遂參大政未能周嵗爰陟上司念遭際之非常求比倫之盖寡雖濵隕越豈謝生成是用杜僥倖之門窒竒衺之徑激揚㢘讓抑止浮華苟有利於公家固不為於私計然而力非其任智實有涯羣心萬殊理難稱愜衆目環視動成詆訶紛如鋒矢之衝浩若波濤之沸從之則懼傷國體違之則立致身殃進退靡遑啓居無所屢以清閒之侍力陳退避之誠盖揣分之甚詳恐敗官而為辱貴全終始不避顛危陛下察其愚𠂻必非縁飾愍其孤迹易致怨憎俾述職於近藩得免譏於尸祿仍進天官之秩復升殿幄之華禮數甚優恩輝愈洽脫吕梁之險亟就安瀾去焦原之危更遵夷路非曲叨於庇佑豈自信於保全惟許昌之奥區乃昆吾之故壤土毛豐衍民齒夥繁敢不致在拊循勤加訓𨗳奉承寛大之詔期臻富庶之風少副憂勤茲為報效為滑州張龍圖賀章獻章懿皇后袝廟表聖心追逺思慕慈親陟配禰宫順成大禮中謝伏以章獻明肅皇后輔佐先朝敷明隂教𨗳揚末命鎮綏大業章懿皇后淑慎在躬受天元祉茂育聖神光啓丕祚而猶分祀閟宫未登太室尊號皇帝陛下濬發孝思㳂情著制采開元之令典講國家之故事㳙選嘉辰咸升配侑述祖宗之志成母后之尊允所謂道隆列辟法垂後世禮行於宗廟孝通乎神眀日月所臨霜露所墜抃手蹈足小大同之況臣任居藩垣職參臺閣欣豫之志倍億等夷官守所拘不獲奔詣闕庭稱慶謝中冬衣襖表祗荷寵光心顔無措中謝恭惟皇帝陛下皇仁溥洽衣被九圍軫念祁寒寵錫嘉服臣雖無似䝉澤猶均濫承安燠之榮空慙不稱之責無任感恩激切之至進交趾獻竒獸賦表嘉祐八年九月初三日上臣光言今月二十五日有詔詣崇政殿觀交州所獻異獸曰麒麟者臣愚不學不足以識異物竊以麟瑞獸也曠世而不可覿其於經有名而無形傳記有形而去聖乆逺衆說紛揉自非聖人莫能識其真況承學之臣固不能决其是非也臣光中謝竊以王者道盛徳至格于神明則有仁獸不召而自至不羈而自馴此其所以為瑞也今是獸也生於遐荒拘之檻櫝載之方舟輿曵萬里致於闕庭形質詭異不應經傳真偽之間未易究測儻其真也則非自然而来設其偽也徒為逺夷所笑殆非所以發揚聖朝之光輝補益治平之實效也旅獒曰不作無益害有益功乃成不貴異物賤用物民乃足犬馬非其土性不畜珎禽竒獸不育于國不寳逺物則逺人格所寳惟賢則邇人安臣竊以為宜延見使者賚之金帛賜以詔書嘉答其意歸其麒麟使復故壤然後登俊傑之才修政治之實使家給人足禮興樂行四夷賔服天瑞自至以遵旅獒之意不亦盛乎臣不勝憤悱謹述交趾獻竒獸賦一篇奉表投進以聞進瞻彼南山詩表臣光言臣聞天尊地卑道之常也而乾下坤上謂之㤗豈非陽不下隂則無以行其施君不交臣則無以得其心是以詩人歌頌其君之徳多稱飲食飫燕之豐鐘鼔筦磬之樂車服旌旂之盛幣帛錫予之多盖以君臣兄弟朋友之際舍此無以相交也雖然人君不以誠心加之則此四者雖美無益也故鹿鳴曰我有㫖酒以燕樂嘉賔之心彤弓曰我有嘉賔中心貺之此言君臣之恩不由外来也中謝伏見體天法道欽文聰武聖神孝徳皇帝陛下以十二月二十三日二十七日再幸天章閣悉召宰輔侍從之臣徧觀瑞物及先帝御書御集又幸寳文閣親為飛白書并御墨紙筆以賜羣臣又賦詩命羣臣屬和又幸羣玉殿置酒作樂比暮而罷其酒醪殽䔩羅花金器多出禁中於二十七日仍面諭羣臣以前日之燕辦於造次未盡朕心故欲重與卿等為樂今天下方無事毋惜盡醉以稱朕意是日凡為燕之具又加厚於前其所以勞徕存撫羣臣莫非出於陛下之志者是以羣臣膏沐寵光被服徳音熏蒸條鬯浹於肌膚淪於骨髓固不待飲食而先醉飽矣退而詠歌聖徳流布四方聞者無不咨嗟歎息以為陛下之於羣臣可為無負而羣臣實負陛下多矣苟有可以死於其職補益萬分莫敢愛也中謝竊以羣臣前後受陛下爵位廪祿饗燕賜予固已多矣未有如今日之歡欣感激深厚切至上下如一者其故何哉此非外物豐衍所能致也正由陛下加之誠心而已矣陛下方將推廣此心以被天下至於朝廷之政進賢退不肖賞善罰惡無不盡誠以求之臣見四海之内如殿堂之上無不沈酣於茂恩饜飫於盛徳矣不勝鼓舞抃蹈之至謹成瞻彼南山詩七章隨表上進文采鄙野不自揣度羞汚盛時伏惟陛下察其狂簡而裁其罪罰焉進古文孝經指觧表嘉祐元年作臣光言臣聞聖人之徳莫加於孝猶江河之有源草木之有本源逺則流大本固則葉繁是以由古及今臣畜四海未有孝不先隆而能宣昭功化者也中謝伏惟尊號皇帝陛下純孝之性發於自然動靜云為必咨訓典起居出入不忘先烈以為滁州者太祖皇帝所以禽馘姦桀肇開王迹并州者太宗皇帝所以芟夷僣亂混一九圍澶州者真宗皇帝所以攘却貪殘億寧華夏皆大勲懿業威靈所存遂命有司分建原廟圖繢聖容躬題扁榜嚴奉之禮備盡恭勤羽衛供帳率從豐衍茲有以見陛下尊顯祖宗之意無不至矣經曰愛敬盡於事親而徳教加於百姓形于四海夫以陛下天授之資愛敬之志而又念夫百官者祖宗之百官不可以私非其人府庫者祖宗之府庫不可以賞非其功法令者祖宗之法令不可以罰非其罪慎之重之益自儆戒如是則為無不成求無不給榮名之彰炳如日月基緒之固巍如㤗山黎民乂安四夷懷服草木禽魚靡不茂豫此誠孝徳之極致也臣愚幸得補文館之缺以經史為職竊覩祕閣所藏古文孝經先秦舊書傳注遺逸孤學堙㣲不絶如綫是以不自揆量妄以所聞為之指觧雖才識褊淺無能發明庶㡬因聖人之言得少闗省覽則糞土之臣榮願足矣其古文孝經指觧一巻謹隨表奉進以聞進通志表臣光言臣聞治亂之原古今同體載在方冊不可不思中謝臣少好史學病其煩冗常欲刪取其要為編年一書力薄道悠久而未就今茲伏遇皇帝陛下丕承基緒留意藝文開延儒臣講求古訓臣有先所述通志八卷起周威烈王二十三年盡秦二世三年史記之外參以佗書於七國興亡之迹大畧可見文理迃疏無足觀采不敢自匿謹繕寫隨表上進謝二股河北流已閉賜奨諭勅書并對衣金帯鞍轡馬表聖言優渥寵錫便蕃顧循無勞何以堪稱中謝竊以去秋積雨河决棗強朝廷憂勞憫茲昏墊臣祗奉明詔相視所詢采衆言聞逹天聴捨短收長率由聖志處決利害昭晰如神今流勢東折徑趨渤碣恩冀西北公私安堵斯皆上帝儲休明主獨斷勞心建䇿則有當官之人勠力奏功則有執役之士臣進無運籌之智退無負薪之勤曾何施為膺茲貺賚辭之則渉於偽慢受之則實為尸素有靦靣目無地自容臣性雖頑愚靈於草木䝉被天地敢忘報效唯期竭忠庶禆萬一賀皇子降生表伏以熊羆之兆載於詩雅弓韣之祥著諸典禮盖以保育黎元莫茲為大本支既茂基祚益安是故百男昌而周興五宗强而漢熾隆替之源古今一揆中謝伏惟尊號皇帝陛下純孝奉先逺猷垂世錫類之祉久屬羣心皇穹降休誕啓茂緒蓬矢遵吉牢脩具儀斯實宗廟眷佑之靈衆庶無疆之福窮河際海聲教所霑儻曰有心率知相慶况臣職叨近署位備列藩竊聆嘉喜奚勝踊躍官守有繫阻逺闕庭臣無任瞻天望聖蹈舞屏營之至賀皇子昕建節表封建本支光隆基祚王室增維城之固萬方有磐石之安中謝恭惟皇帝陛下仁被海㝢道合天𠂻膺受純禧誕錫元胄采古昔之令典考今茲之盛務爰立藩邸恢建宏規假節秉鉞習以戎律赤舄衮衣崇其儀望苴茅胙土訓以政治明尊尚親資忠移孝一舉而善衆美具該斯實堂構之逺謀黎民之隆福也臣述職外方傳聞嘉喜不勝抃蹈激切之至謝賜資治通鑑序表臣光言伏䝉聖恩令臣讀所修資治通鑑仍面賜御製御書序一篇者臣性識駑鈍學問空淺偶自㓜齡粗渉羣史常欲芟去蕪雜發揮精儁窮探治亂之迹上助聖明之鑒功大力薄任重道悠徒懷寸心行將白首伏遇先皇帝若稽古道博采㣲言俾摭舊聞遂伸㣲志尚方紙墨分於奏御之餘内閣圖書從其假借之便未遑汗簡已泣遺弓陛下祗服駿命丕承前烈臣以屬槀有緒不可不成受詔所為不敢不上銓次無法牴牾實多仰汚覽觀伏湏罪戾豈謂皇帝陛下赦其狂簡賞其専勤思所以旌異於佗書焜燿於羣下特發殊恩不用常例屬當勸講之始俾參經史之末迨此清閒命之進讀而又序其本原冠於篇帙發言為典肆筆成書炳蔚互變如虎豹之明灝噩無涯逾商周之盛况復襃貶是非古人有所未至造端立意愚臣不能自言陛下一賜指陳渙然冰釋至於博而得其要簡而周於事典刑之總㑹冊牘之淵林臣實何人克堪此語若乃嘉文宣以作則授正觀而為師兹實生民之福豈伊㣲臣之幸中謝竊以周之南董漢之遷固皆推髙一時播美千載未有親屈帝文特紆宸翰曲䝉奬飾大振輝光如臣樸􅈪小才固非先賢之比便蕃茂澤獨専後世之榮退自揣循殆無容措遂使螢燐末照依日月以永存草木常名附天地而不朽臣不任懇款之至知永興軍謝上表荷恩至重任責尤深循撫吏民敷宣詔令中謝臣識慮闇淺規為闊踈唯知愚忠屢貢狂直奉事三世操守一心間以齒􅄠寢衰疾疹交集曾靡論思之效乆汚侍從之班既無補於本朝祈自安於散地不圖睿澤更委名都雖要重之權自知不稱而煩劇之地難以固辭受命以還措躬無所朅來就道甫爾到官惟此咸秦昔為畿甸山川美秀土地膏腴論其平時誠為樂土在於今日適值凶年經夏亢陽苗青乾而不秀涉秋淫雨穂腐黑而無收廪食一空家乏盖藏之粟襁負相屬道有流離之人老弱懐溝壑之憂姦猾蓄萑蒲之志正宜安静不可動揺譬諸烹魚勿煩擾則免於糜爛如彼種木任生殖則自然蕃滋謹當策勵疲駑彫磨朽鈍智力所及勤瘁無辭雖復失位危身終不病民負國庶幾小補用答大恩臣無任戴天荷聖激切屏營之至遺表元豐五年秋吾苦語澁疑為中風之候恐朝夕疾作猝然不救乃豫作遺表自書之常置臥内俟且死以授范堯夫范夢得使上之八年三月五日宫車晏駕此表無用留以示子孫欲使知吾事君區區之心耳臣世受國恩常思補報但以性識愚戇不合聖心是以比年以來屏居杜口不敢復言今衰疾日侵將填溝壑敢以平生忠懇一達天聰庶幾陛下知臣無求於朝廷而未嘗忘國家也中謝伏惟皇帝陛下天縱睿哲燭物精敏踐祚以來鋭志求治圖任奇傑恢張洪業得王安石委而信之不復疑貳聽其言從其計人有沮毁之者責而逐之雖周成王之信周公齊桓公之任管仲燕昭王之倚樂毅蜀先主之託諸葛亮殆無以及斯乃不世出之英主曠千載而難逢者也不幸所委不得其人安石既愚且愎不知擇祖宗之令典合天下之嘉謀以啓迪聰明佐佑丕烈乃足已自是謂古今之人皆莫已如有人與之同則喜與之異則怒喜則數年之間援引登青雲怒則黜逐擯斥終身沈草莱凡人之情誰不喜富貴而畏刑禍於是忠直逺屏姦䛕競進為之腹心羽翼以干禄徼利遂使中外權要之任非其黨與不得處也深疾諫者過於仇讎嚴禁誹謗甚於盜賊然後逞其胸臆變亂舊章興害除利捨是取非其尤病民傷國者畧舉四條其一曰青苗錢分命使者誘以重賞强散息錢朘民求利取新償舊負債嵗多官守空簿實無所獲貨重物輕公私兩困其二曰免役錢縱富彊應役之人使家居自逸征貧弱不役之戸使流離轉死凡農家所有不過糓帛與力自古賦役無出三者今皆不取専責以錢錢非私家所鑄要須貿易外求豐嵗糓賤已自傷農又迫於期限不得半價盡糶所收未能充數家之餱糧不暇更留若值凶年則又無糓可糶人人賣田無徃可售遂致殺牛賣肉伐桑鬻薪来年生計安敢復議用此雇浮浪之人以供百役使緩則為姦急則逃竄處事若此豈非倒置其三曰保甲自唐募長征之兵賦農民糓帛以給其衣糧農固已困矣今糓帛稅如故又使捨耕桑事戰陳一身二任民何以堪又罷廵檢兵士及尉司弓手皆易以保甲半月一代彼畎畝之民尚未能操弓挾矢已復代去用此擒盗不亦難乎夫奪其衣食使無以為生是驅民為盜也使比屋習戰勸以官賞是教民為盜也又撤去捕盜之人是縱民為盜也謀國如此果為利乎四曰市易遣吏坐列販賣與細民爭利下至菜果油麵駔儈所得皆㩁而奪之使道路怨嗟逺近羞笑商旅不行酒稅虧損奪彼與此得少失多又稱貸於民恣其所取使無頼子弟得醉飽之資在家父兄受督責之苦傾貲破産十有五六凡此四者皆逆人情違物理天下非之莫之肯從安石乃以峻法驅之彼十惡盜賊累更赦令猶得寛除獨違新法者不以赦降去官原免是其所犯重於十惡盜賊也安石苟欲遂其狠心無顧治體此其厲階至今為梗也又有姦詐之臣如种諤薛向王韶李憲王中正之徒行險徼幸懷諼罔上輕動干戈妄擾蠻夷夫兵者國之大事廢興存亡於是乎在而諤等苟營一身之官賞不顧百姓之死亡國家之利病輕慮淺謀發於造次深入自潰僅同兒戯使兵夫數十萬暴骸於曠野資仗巨億弃捐於異域昔王恢為馬邑之謀單于覺之遁去時漢軍無所失亡但無功耳武帝猶以為不誅恢無以謝天下今潰敗失亡狼籍如此而建議行師之人晏然若無愧畏或更䝉寵任竊見國家至仁重惜人命諸州論囚有法應流而誤入死者舉州官吏皆坐停廢柰何使數十萬人無罪就死反無所坐乎此所以使狂躁貪冒之人競為甞試之說而無所懲艾者也若舉事屢如此其於國家豈可不憂乎臣聞堂上不則郊草不瞻曠芸是以古聖王之治天下必先内而後外安近以服逺故書曰帝乃誕敷文徳七旬有苖格詩云王猷允塞徐方既来下至齊桓晋文亦先富教其民然後用之陛下何不視今日朝廷之政治何如羣臣之智能何如百姓之富樂何如士卒之精銳何如乃遽從事於四夷也臣所惜者以陛下之聖眀不師虞舜周宣之徳反慕秦皇漢武之所為借使能踰葱嶺絶大漠鏖臯蘭焚龍庭又何足貴哉自古人主喜於用兵疲弊百姓致内盜蠭起或外㓂覬覦者多矣申屠剛曰未至豫言固常為虚及其已至又無所及必若待四方糜沸如秦漢隋唐之季然後悔之固已晚矣夫諫爭之臣人主之耳目也安可一日無之書曰若跣弗視地厥足用傷設有人閉目塞耳跣而疾趨前遇險阻安有不顛躓者哉臣竊見十年以来天下以言為諱大臣偷安於祿位小臣苟免於罪戾閭閻之民憔悴困窮無所控告宗廟社稷危於累卵可為寒心人無賢愚貴賤莫不知之而訖無一人敢發口言者陛下深居九重徒日聞䛕臣之言以為天下家給人足太平之功十已八九成矣臣是以不勝憤懣為陛下忍死言之庶㡬陛下覽其垂盡之辭察其願忠之志廓然發日月之明毅然奮乾剛之斷悔既徃之失収將来之福登進忠直黜逺佞邪審黄􅄠之可任寤諞言之難信罷苖役廢保甲以寛農民除市易絶稱貸以恵工商斥退聚斂之臣褒顯循良之吏禁約邉將不使貪功而危國制抑近習不使握兵而兆亂除苛察之法以隆易簡之政變刻薄之俗以復敦樸之化使衆庶安農桑士卒保首領宗社永安傳祚無窮則臣沒勝於存死榮於生瞑目九泉無所復恨矣臣不勝瞻天戀聖之至慰太皇太后上仙表臣今月二十三日蒙西京宣示二十日太皇太后遺誥者旻天降禍仙馭上賔奉訃哀惶㒺知所措伏以太皇太后作配仁祖聴政英朝洪基所以固安景命由其保祐風化形於海内徳澤結於民心宜永享東朝之尊長膺天下之養而中夀未至大期有終哀纒兩宫痛浹萬宇恭惟皇帝陛下孝心罔極號慕難居瞻内寢以如存追慈顔而靡及伏望上為宗廟之重下庇烝民之生少抑聖情俯就中制臣忝列侍從不獲奔赴闕庭瞻望宸極謝提舉崇福宫表臣光言伏奉勅命宜令再任提舉西京崇福宫者囊奏上陳始虞報罷黈聰垂徳亟沐頒恩祗荷寛優伏增兢悸伏念臣器非適用學不知方被遇三朝忝塵二禁䊸天光之顧問侍經席之從容亦甞委總憲司訖無報稱擢陪樞府不敢叨居剖竹雍都蔑聞於治效分臺洛邑幸養於沉痾仍再領於祠庭遂十更於嵗籥頃自受命先帝俾刋舊聞逮陛下之纉圖發徳音而繼至而臣􅂝槀在外奏篇未經盖簡冊之浩繁致嵗時之淹久雖官守無事慙四體之不勤而史學紬書實寸隂之是惜懼先溝壑以負恩私乆去班行顧其佗而無補坐糜禄廪嘗自訟而靡遑尚或無厭復求自便輒披私懇輕冒宸嚴豈謂皇帝陛下大徳包荒至明燭逺罔責再三之瀆曲垂開可之私盖特出於異恩故不拘於盡法乾坤至大雖萬物皆遂其生雨露新霑或一夫獨被其澤惟顓愚之無狀容僥倖以兹多臣敢不深戒宴安祗勤夙夜畢精撰述圖報生成進資治通鑑表臣光言先奉勅編集厯代君臣事迹又奉聖㫖賜名資治通鑑今已了畢者伏念臣性識愚魯學術荒疏凡百事為皆出人下獨於前史粗甞盡心自㓜至老嗜之不厭每患遷固以来文字繁多自布衣之士讀之不徧况於人主日有萬機何暇周覽臣常不自揆欲刪削冗長舉撮機要専取闗國家興衰繫生民休戚善可為法惡可為戒者為編年一書使先後有倫精粗不雜私家力薄無由可成伏遇英宗皇帝資睿智之性敷文眀之治思厯覽古事用恢張大猷爰詔下臣俾之編集臣夙昔所願一朝獲伸踊躍奉承惟懼不稱先帝仍命自選辟官屬於崇文院置局許借龍圖天章閣三館秘閣書籍賜以御書筆墨繒帛及御前錢以供果餌以内臣為承受眷遇之榮近臣莫及不幸書未進御先帝違弃羣臣陛下紹膺大統欽承先志寵以冠序錫之嘉名每開經筵常令進讀臣雖頑愚荷兩朝知待如此甚厚隕身喪元未足報塞苟智力所及豈敢有遺㑹差知永興軍以衰疾不任治劇乞就冗官陛下俯從所欲曲賜容養差判西京留司御史臺及提舉嵩山崇福宫前後六任仍聴以書局自隨給之祿秩不責職業臣既無佗事得以研精極慮窮竭所有日力不足繼之以夜徧閱舊史旁采小說簡牘盈積浩如煙海抉擿幽隠校計毫釐上起戰國下終五代凡一千三百六十二年修成二百九十四巻又畧舉事目年經國緯以備檢尋為目錄三十巻又參考羣書評其同異俾歸一塗為考異三十巻合三百五十四巻自治平開局迨今始成嵗月淹久其間牴牾不敢自保罪負之重固無所逃中謝重念臣違離闕庭十有五年雖身處于外區區之心朝夕寤寐何嘗不在陛下之左右顧以駑蹇無施而可是以専事鉛槧用酬大恩庶竭涓塵少禆海嶽臣今筋骸癯瘁目視昏近齒牙無㡬神識衰耗目前所為旋踵遺忘臣之精力盡於此書伏望陛下寛其妄作之誅察其願忠之意以清閒之燕時賜省覽監前世之興衰考當今之得失嘉善矜惡取是捨非足以懋稽古之盛徳躋無前之至治俾四海羣生咸蒙其福則臣雖委骨九泉志願永畢矣賀立皇太子表臣光言伏覩制書節文皇太子延安郡王傭可立為皇太子仍賜名煦者主器惟長立邦家之基錫命以時為社稷之福中謝竊以天意與子人情愛親三王以来百世不易伏惟皇帝陛下光紹前烈濬發逺猷仰尊宗廟之嚴俯眷烝民之重寵建上嗣誕告多方離日昭布於重光震雷何啻於百里封畛之内聲教所覃凡有識知孰不鼔舞况臣叨居近列夙受大恩喜聞徽音逺踰庶品元豐八年三月奔國喪太皇太后遣入内供奉官梁惟簡宣諭邦家不幸大行升遐嗣君冲㓜同攝國政公厯事累朝忠亮顯著毋惜奏章賛予不逮謝宣諭表元豐八年三月二十三日上臣光言今月二十二日入内供奉官梁惟簡傳太皇太后陛下宣諭以臣厯事累朝令毋惜奏章者中謝臣文學政事一無所長䝉仁宗皇帝擢寘侍臣英宗皇帝引為學士大行皇帝初登宸極召入翰林繼處憲臺又承人乏俾貳樞府臣荷累聖大恩無以為報惟竭惷愚時進狂瞽秪知推誠不識忌諱每荷矜容未甞譴黜屬者大行皇帝遘疾彌留深惟萬㡬之重請陛下權同處分上天降禍奄及大故陛下建立聖嗣綏寧中外民物咸若神祗恊從此皆陛下之淵謀羣生之厚幸臣以進懷先帝盛徳奔赴闕庭上欲一望梓宫少展臣子之哀誠即退歸洛邑復就冗官不意陛下過有聴采特降中使曲加奬飾待以耆舊許之盡言臣聞商書曰木從䋲則正后從諌則聖后克聖臣不命其承陛下實有聖徳知所先務聴政之初首開言路臣本何人齒􅄠衰朽精力昏耗有何才識克堪兹任但冀天下之士由此識陛下之心嘉言響應正論輻凑民間疾苦何患不聞國家紀綱何患不治斯乃宗廟社稷之靈四海羣生之福豈伊㣲臣獨為慶幸謝門下侍郎表臣光言近上表辭免新除門下侍郎恩命伏奉批答不允者母慈臨御嗣聖亮隂登進弼臣眷求舊物才非稱任辭不獲從中謝伏念臣出自諸生幸承素業守泥古之朴學乏經世之逺猷逮事仁皇備員諌省容逆鱗之愚直無補衮之嘉謀㑹英祖之纂承進河圖之近宻最膺異禮深亮孤忠及先皇即政之初被内相代言之命委司天憲擢貳樞鈞終獲遂於懇辭盖曲成於志守而臣㳙埃㒺效精力早衰出守無能分臺得請留連祠館荏苒嵗華不圖仙駕之升永絶清光之望伏遇皇帝陛下丕承洪緒寅御中區訪落之謀亟先於羣辟賜還之詔屢出於中宸起於林壑之中處以廟堂之上矧今始初政事綏靖邦家四方翹首以向風萬姓傾心而聴上斯乃君臣儆懼之日宗社安危之機必得非常之才以濟維新之治臣避命弗獲居寵為憂謹當承元首之明竭股肱之力庶圖薄效仰答鴻私臣無任戴天荷聖激切屏營之至上皇帝謝賜生日禮物表臣光言伏蒙聖恩以臣生日特降詔書賜臣米麵羊酒者使車傳命宸檢頒恩乃眷㣲生特推異數中謝伏念臣本由孤進厯事先朝屬睿哲之統臨承賛襄之乏使無嘉謀之云補有素食之深譏適當生育之辰倍切劬勞之感累茵列鼎思負米以難追立身揚名在顯親而何有敢煩君賜下逮家庭雖邦禮之有常在臣愚而曷稱此盖伏遇皇帝陛下寵優近列仁育羣生隆餼廪之多儀廣雲天之麗澤先事後得顧慙錫與之榮移孝為忠誓竭糜捐之節上太皇太后謝賜生日禮物表臣光言伏䝉聖慈以臣生日特降詔書賜臣米麵羊酒者至仁垂眷多物分頒拜賜惟優汗顔有靦中謝伏念臣器能淺陋術學迃踈仰膺簡注之隆進備弼諧之職適及始生之旦復叨厚下之恩及飬無因感劬勞於兹日致禮有秩䝉慶澤以自天此盖伏遇太皇太后陛下坤厚兼容母慈廣被重近司之責任推異數以勸官特加餼廪之儀以示寵光之渥所生無忝敢忘夙夜之勤来事可為益圖忠義之報上皇帝辭免正議大夫表臣光言伏奉制命特授臣正議大夫者中天霈澤近輔書勞亦及罔功豈宜虚受中謝伏念臣素無佗技唯繫孤忠誤䝉累聖之知寢服近僚之列頃因人乏進貳宰司先帝審訓羣臣靡預誓言之末陛下嗣膺大寳曾無翊戴之勤豈弗畏於名言詎敢當於懋寵矧乃方任人而立政惟即命以記功將深戒於官師宜先從於近始伏望皇帝陛下慎司名器申勸臣鄰收出綍之過恩亮循墻之愚懇爵惟馭貴免上累於至公賞必及勞盖率由於舊典上太皇太后辭免正議大夫表人惟圖舊賞貴及勞義所當辭情難冒處中謝伏念臣早縁末學被遇累朝乏稽古之令猷無致君之逺業入陪經幄乆親日月之光出領祠宫實荷雲天之庇㑹慈宸之御極登嗣聖以承祧徒膺乏使之求進預同寅之列屬寵褒於近弼特序進於文階顧無横草之勤均被出綸之渥輿情共駭内忪靡遑伏望太皇太后陛下洪造聴卑至明燭隠慎守馭臣之柄無輕出器之名昭示大公輟已行之成命少安愚分息被已之深譏上皇帝謝轉正議大夫表臣光言伏奉告命授臣正議大夫上表辭免奉批答不允仍斷来章者離明繼照兊澤旁流祗受已還震惶無措中謝臣聞以資詔爵則民興忠誼眡功為賞則下絶覬覦故徳盛者其位隆力勤者其報厚勸沮斯在授受靡虚伏念臣學不適時才非經世謬塵近列最後諸臣辱體貎之兼隆竭股肱而無補屬舉懋官之典咸疇衛上之方績用蔑聞褒章誤及雖危誠之備列終成命之莫回居寵無名在顔有靦此盖伏遇皇帝陛下馭臣惟禮厚下以仁優其進等之恩責以致身之節乾坤至大均覆載以不遺日月無私委照臨而盡及永圖報塞唯􅊎糜捐上太皇太后謝轉正議大夫表明綸誤及渙汗難收弗獲懇辭終慙冒處中謝伏念臣自陪機政無補聖猷雖夙夜以自强惟事功之匪立每流年之是惜加衰疾之所嬰敢以瘝官復當懋賞是以歴陳故實備述悃誠荐奉詔音兩紆使節對天威之咫尺煩睿訓之丁寧循走無從强顔祗受此盖伏遇太皇太后陛下至仁勤施大徳兼容推均一於鳲鳩昭忠厚於行葦體乾坤之覆育品物不遺並日月以照臨光明下濟誓殫駑力仰答鴻恩謝起居減拜表臣光言伏准閤門告報今月十四日内降以臣與吕公著近各推恩轉官所有將来正謝特令兩拜起居餘免舞蹈仍於執政官班次後别作一班及自今後凡遇前殿應于大起居特令别作一班止兩拜起居恩出非常禮加異數優假太過慙負愈深中謝臣猥以𤨏才預聞機政去春以後疾疹屢生入冬以来飲食漸少迨茲嵗序之首頓覺筋力之衰拜起絶艱朝請殆廢内惟恩紀之重天地所不能踰退思績效之㣲絲毫未嘗有立欲避位則為罪益大欲就列則强力不前朝夕為衆目所觀啓處無措躬之地敢謂皇帝陛下太皇太后陛下仁霑枯朽明燭幽㣲特虧著定之儀曲遂形骸之便臣詢諸故老或謂有舊章然彼皆位躋宰輔之崇徳著耆眀之美豈臣么麽所敢比方欲辭則實所不支欲受則自知非分踧踖心悸戰兢汗流惟仰賴於寵靈冀有瘳於藥物病庶遄已禮得如初期於竭忠不敢愛死奏彈王安石表熈寧三年御史中丞光等累次全臺上疏叅知政事王安石不合妄生姦詐熒惑聖聰及公亮等各務依違未曾辨正乞眀其罪不䝉施行竊以易喻履霜示為君制臣之術書戒作福眀凶國害家之常易書之義其知㡬乎君子見㡬不俟終日是以自古君無過失而臣不姦欺盖知其㡬而遏其端也伏遇陛下即位以来日慎一日聞過則喜從諌如流四方翹企以望太平萬俗謳謡而陶羙化其以用安石為相斯見陛下焦中心而求治急先務以濟時者也而安石備政府必當輔國以伊周之道致時為堯舜之民發政施仁俾合輿意而安石首倡邪術欲生亂階違法易常輕革朝典學非言偽王制所誅非曰良臣是為民賊而又牽合衰世文飾姦言徒有嗇夫之辨談拒塞爭臣之正論加以朋黨鱗集親舊星攅式備近畿或居重任窺伺神器専制福威人心動揺天下驚駭苟陛下不遏其端則安石為禍不小夫書易之戒正急於斯且陛下以安石有師保之尊故舊之恩俾為相臣使預政事昔漢尊桓榮徒聞設几燕貴鄒衍惟見築宫豈有俾居顯重而妄使改為若不正其罪惡亦難以順乎衆意臣職居御史身為諌官非不能希意苟合以求寵榮盖以立君朝者當勵已以去邪食君祿者必輕身而為國臣之與安石猶冰炭之不可共器若寒暑之不可同時是以屢犯天顔輒陳狂瞽心既為國寧復愛身苟今日蒙鈇鉞之誅勝異日死賊臣之手伏願陛下獨􅁬乾剛専行夬決一遵祖憲無用邪謀誅逐亂臣延納正士上以順皇太后之意下以慰億兆人之心則臣等退就誅戮亦所甘心謝賜銀絹表臣光言伏䝉聖慈以臣編修百官年表成書特降詔奬諭仍賜臣銀一百兩絹一百匹者奏篇甫上褒詔爰頒荷寵若驚省躬無措中謝伏念臣淺才末學庸識卑辭乆塵侍從之班曾乏猷為之補頃膺睿㫖俾纂舊章恭惟祖宗創業垂統之難邦國立政任官之要必表年而紀月可鑒古以驗今畧舉宏綱庶存成式淹留累嵗銓次終篇仰稽乙夜之觀方虞曠職之咎豈期温詔發自淵𠂻錫外府之兼金加丘園之賁帛載惟虚受彌切靦顔此盖皇帝陛下順考百王丕承列聖剛健而篤學緝熈於光明眷執簡之㣲勤形賛書之重奬寵踰華衮既稽首以拜嘉賜厚百朋實無功而冒賞傳家集巻十七欽定四庫全書傳家集巻十八宋司馬光撰章奏一論兩浙不宜添置弓手狀先公知杭州為作臣竊􅀚兩浙一路與佗路不同臣謹條列添置弓手不便事件如左伏惟聖恩省察少加詳擇焉當今西戎梗邉三方皆聳人心易動當務安之一旦異常詔書大加調發擐甲執兵學習戰陳置指揮使節級等名目頗似軍法以為欲傚河北陕西㳂邉郷兵謂國家以權計㸃之假名捕盜漸欲收為卒伍戌守邉防吴人輕怯易惑難曉道聴塗說衆情鼎沸至欲毁體捐生竄匿山澤臣雖明加告諭嚴行止約愚民無知不可户說誠恐􅏔㸃之後揺動生憂其不可一也吳越素不習兵以故常少盗賊不過聚結朋黨私販茶鹽時遇官司徃徃鬭敵在於兩浙最為劇賊然皆權時則合事訖則㪚不能乆相屯結又無銛利兵器止偷商稅不敢剽掠平人近年以来雖亦頗有强盗然比諸内地要自稀踈今避差㸃者若竄匿無歸必列為冦加以弓矢刀鋸之類許其私置自今以後賊盗必多及私販茶鹽之徒皆有利兵拭拒吏士益難擒討積㣲至著漸不可乆其不可二也姦吏貪饕惟利是務不畏法令不顧公議幸得因縁惟喜多事今計杭州管界當差若干人他州比卒大凡有㡬縣胥里長於兹相慶民既憂愁而又脅之煩苦不安而又擾之所規自潤豈顧其外雖朝廷重為懲禁特倍常科長吏勞心不能悉察厚利所誘死亦冒之加以版籍差誤户口異同毫釐不當互相告决追呼無時獄訟不歇則民末暇為公上給役而先困於貪吏之誅求矣此之極擾勢不能免其不可三也民皆生長畎畂天性戇愚所知不過播種之法所識不過耒耜之器加之吳人駑弱天下所知一旦使棄其所工學所不能徒煩教調終無所成就其有成不堪施用則是虚有煩費而與不添置無異其不可四也吳子夀夢以前世服於楚自申公巫臣得罪于楚逃奔于晉為晉聘吳教之乗車教之戰陳其後楚人戎車嵗駕早朝晏罷奔命不息以至吳亡自是以来號稱輕狡逺則劉濞近至錢鏐其間承風倔强無數豈唯其人之跋扈亦由習俗之樂亂也幸頼祖宗之馴致陛下之敦化至徳之釀淪於骨髓暴亂之風移變無迹此皆上天降祐前世所不能庶㡬者也今忽無故黷玩威稜狎侮危事示以逆徳弄之凶器生姧回之心啟禍患之兆臣恐以久非國家之至便所以萬全而無害其不可五也方今兩浙雖水旱稍愆未至流殍閭閻無事盗賊不添縱使有之舊来吏士隨發擒討甚有餘力不假更求正恐平居興役有害無益而已臣職忝宻近官備藩方不敢黙黙理湏上列伏望陛下特令兩浙一路更不添置或以事湏過防舊人太少則乞只依近降敇命量加添補更不立指揮使等名目閱習諸事一如舊規貴得衆情大安别無生事為孫太􅀶乞免廣南轉運判官狀臣昨自滑州簽判就除本州通判未及半嵗今又䝉恩授前件差遣於臣忝冒實踰涯分供命陳力豈宜復辭嚮若止臣一身﨑嶇困苦雖更逺役靡不甘心敢以㣲誠輕煩聖聴念臣二親垂白思戀郷里兩任滑州去家差近迎侍朝夕徃来如意甘脆供湏頗為私便一日離側倚門致念况復貪榮逺從吏道其在人子何心自安轉運判官國家近置推擇委任務在得人以臣愚疎恐難堪稱伏惟聖慈詳求幹敏授以此職令臣且充滑州通判終滿一任庶得官政無廢侍養不闕君親之際恩義兩全棄骨殫身竭云補報論屈野河西修堡狀嘉祐二年上竊以為人臣者事君不避難有罪不逃刑臣先任通判并州軍州事日准經畧司牒差徃麟州勾當公事其屈野河西一帯田土積年以来為夏虜所侵臣委曲詢訪本州當職官吏以虜之侵盗為日已久諭之以理則不肯退縮逼之以兵則動成戰闘召之重定界至則偃蹇不来春種秋穫無有已期如何區處可以不戰而得所侵之地其本州官吏為臣言州城之西臨屈野河自河以西直抵界首五六十里並無堡障斥堠以此虜得恣耕其田遊騎徃徃直至城下或過城東州人不知去嵗已於河西置一小堡以處斥堠之人亦曽申經畧司乞於其西増置二堡㑹今春以来虜騎屯聚徧滿河西經畧司牒令候西人退散别申取指揮今虜衆盡已退去自州城以西至大横水浪爽平數十里間絶無一人一騎若乗此際急於州西二十里左右増置二堡每堡不過十日可成比至虜中再行㸃集此堡已皆有備虜不能為害如此則麟州永無侵軼之虞州兵出入有所宿頓堡外先侵之田虜皆不能耕種臣之愚心亦為國家固爭屈野河西田者非少此尺寸之地盖以虜侵耕至河則麟州孤危果能成此二堡以為麟州耳目藩蔽於事誠便遂歸具以官吏所言白於龎籍籍用臣言即牒麟州令依前申修築二堡仍令精加探候廣設隄備戒諭約束莫非丁寧盖欲乗間急修故不暇取㫖俟報但曾奏知而已不期牒到之後元未興修虜衆已復大集於五月五日彼處兵官引一千許人夜開城門徑徃屈野河西前無探候後無䇿應中無部伍但齎酒食不為戰備以此逄敵如何不敗遂令所謀之事悉皆無成此乃諸将恃勇輕敵臨事無備之所致本非修堡之過况自元昊納欵以来麟州修建堡塞及出兵過屈野河西前後非一雖與虜遇未甞敗北明知今日之敗在於無備不在修堡與過河也然臣竊聞議者乃以龎籍為擅修堡寨引惹邉事臣伏自惟省本因臣與麟州官吏商量傳道其言逹於龎籍籍未甞身至河西周知利害皆臣愚戇思慮不熟輕議大事當伏重誅今乃使議者悉歸咎於龎籍臣豈敢晏然不言苟求自脫上負聖朝死有餘責臣雖小人義不忍為伏望陛下察龎籍本心欲為國家保固疆圉發於忠赤不顧身謀過聴臣言以至於此獨治臣罪以正典刑雖蹈鼎鑊亦無所恨論屈野河西修堡第二狀臣先曾奏陳為麟州修堡事乞獨治臣罪至今未奉朝㫖今竊知龐籍移知青州夏倚等各有責降臣伏自惟念若朝廷不以修堡為非龐籍等必不受責若以為非則龐籍先已指揮麟州罷修此堡因臣至彼見虜騎退散方議再修武戡夏倚等雖建此䇿因臣至彼傳道其言方得逹於龐籍由是言之修堡之事皆臣所致若治其罪臣當為首今龐籍等先受其責而臣未䝉譴罰臣實内慙無以自處况臣在并州日受經畧司牒管句本司要重公事龐籍凡處置邉事未甞不詢及於臣采用其說臣亦夙夜竭盡愚慮知無不言庶㡬恊心禆補國家有萬一之益今乃以智識淺短思慮不精上為朝廷之憂下為龐籍之累若復苟求自脫不即大誅是臣以蕞爾之軀虧國家至平之法罪釁愈重不容於死伏望聖慈察臣前後所陳本宗事理嚴賜誅譴以正刑書臣不勝幸甚論麥}
