  - {type: variant, offset: 5217, length: 0, content: '', WYG: 宋司馬光撰律詩九送李才元知廣安軍歸成都覲省皁盖五驊騮今來異昔逰簞壺交里舍鐃吹下瀛州夀酒行當舉歸鞭不可留春光久相待先在錦江頭送上雒王推官經臣墨綬百里宰紅蕖幕府僚民淳無鬬辯地勝得逍遥日上雲未散春深雪不消知音已交薦勿茹紫芝苖送瀛州簽判蘇祕丞寀髙隂十萬兵幕府藉時英塞上風猶勁闗南春未生投壺邊柝静倚馬檄書成不忘塵中客征鴻可寄聲送周寺丞畋知洛南周華人太華指商於中間百里餘稍行山驛逺漸與世塵疎楚塞參差接秦民錯雜居惜哉非綮肯不足試投虚送齊學士廓字公闢知荆南漢家太守治才髙楚國山川氣象豪旗斾逶迤蟠夢澤樓船贔屭壓江濤雄名誰復知宣武遺愛猶應祀叔敖何必三年求奏計詔書朝夕賜金襃送王待制知陜府疇昔誠相契間關分不渝先君知鳳翔府待制通判府事以道誼相知非直僚友而已絶絃悲宿草撫首念諸孤位略尊榮間年忘徳齒殊清隂容息足重語辱嘘枯待制主漕京西光仕武成幕府仍叨奬引鶠閣騫雲表虹旌拂海隅明光新出綍陜陌重分符豐潤還桑梓讙謳復路衢寜須更條教耆舊已簞壺待制再為陕牧先實陜人送張景淳知邵武軍閩嶺窅何在東南千里遥仳離傷草草㑹合更迢迢隋岸㣲吹絮呉江欲上潮肯無同舍念回首弭輕橈送章伯鎮知湖州江外饒佳郡呉興天下稀蓴羮紫絲滑鱸膾雪花肥星斗寒相照煙波碧四圍桞侯還作牧草樹轉清輝送王伯初通判婺州煜爚屏星駕迢遥婺女區嵐光晴向背溪溜暖縈紆萬室鳴機杼千艘隘舶艫若逢耆舊問能説隱侯無送張少卿學士子憲知洪州相府典刑在朝閨望實髙紬書榮史觀典樂重卿曹夷路迎飛鞚桑林應奏刀家籝傳舊學廟鼎刻前勞袨服屯千騎連檣閲萬艘劔芒衝夜氣閣影動秋濤風色傳花信煙光拂酒膏使君專問俗無意在逰遨送昭逺兄歸陜種種親頭白帝城難少留倚門應有望列鼎本無求清夜多歸夢紅塵厭久逰此行殊捧檄轅下五驊騮送雲卿知衞州汗簡成新令褰帷刺劇州韋平家法在邵杜治聲優野竹交淇水秋𤓰蔓帝邱三年歸奉計肯顧石渠逰送石昌言知宿州煒煒符離守中流簇鼓旂桞隂濃不斷舟勢激如飛魏闕行歸奏承明秪蹔違星軺晨夜度尺素勿令稀送何濟川知漢州二首金馬從容樂問君何所之客心彯若梗親髮暠如絲舊學已孤陋素交仍别離執經時有問使我復從誰千騎擁朱轓青霞晝繡還復尋題柱迹重過棄繻闗曉棧流雲濕秋湖脱葉􅎋久逰今得意真不愧江山送程端明戡知成都髙陽將幕開濯錦使旌来欲識闗頭雪正如江上梅宵衣矜遠俗露冕寄良才豈待三年最脩梧茂帝臺送聶祕丞之美宰桐城二首問子青雲器胡為不少留未能充祿養安散及身謀卓爾千人俊居然百里憂連城價終在自是玉工羞七載一相值怳然如路衢形骸漸枯槁志業轉荒蕪往事雲過眼新愁雪染鬚眀朝又分首上馬即重湖送蒲中舎霖致政歸蜀前栗亭令二首厭苦折腰久飄然黄鵠飛田園未蕪沒鄰曲有光輝昔􅁬儒衣去今紆朝紱歸人生貴知足得此已為稀念昔兩髦日烏奴同燕逰随時自有樂何物可為愁豈意今頭白相逢欲涕流慿君訪題壁好在水西樓光侍先君為利州路轉運使與君屢逰烏奴山寺題名屋壁送李侍郎柬之西京留䑓先公勲烈盛塩梅清白仍聞世濟才華省拂衣辭簿領長衢回首謝塵埃嵩峯排霧依稀出洛水迎人迤邐来寄語馬前頭白吏何殊昔日李西䑓送元待制絳字厚之出牧福唐甌越東南美田肥果稼饒况懐新賜綬重過舊題橋食足姦回熄風移獄犴銷長才報政速鈴閤日逍遥送呉駕部䖏厚知真州曏託屏星駕同隨丞相車終朝容􅂴拙經嵗庇迃疎共此趨雲闕旋聞建隼旟江淮一都㑹逰刃必多餘送王著作慥西京簽判古來都邑美孰與雒陽先况復元侯貴兼之從事賢玦離横闕塞珠曲逗伊川熨眼登臨樂送君空惘然郭氏園送張仲通出刺棣州得朝字名園送嘉客冠葢去傾朝小雨塵㣲斂餘寒酒易消鴈歸春近塞日上海生潮北道平如掌東風五馬驕送裴中舎士傑赴太原幕府元戎台鼎舊大府節旄新邊候正無事賔筵况得人山寒太行曉水碧晋祠春齋釀蒲萄熟飛觴不厭頻送致仕朱郎中令孫世間榮利無窮物奔走勞勞何所之仕宦為郎非不逹功名有命待無時橐中雖乏千金直膝下常􅂝兩綬児細校人生能此少好從閭里樂期頥送宋郎中知鳳翔府昔解陳倉印於今二十秋雙鳬久東上五馬重西逰驍騎行闗外壺漿擁道周民心已化服條教不更修送王都官淑字尤之官滿還都粹美清廟器可嗟沉下僚優逰仲舉坐洋溢海沂謡奏課應居首知音况滿朝從今黄鵠舉眼令望青霄送昌言舍人得告還蜀三首迢逓銅梁道凝嚴青𤨏闈負書當日去鳴玉此時歸鄉樹迎朱轂江花照錦衣臨邛不足並榮耀古今稀悽愴懐桑梓劬勞詠蓼莪樹風今遠矣鼎食奈悲何劔閣登車近秦闗屈指過騰裝纔首路夕夢已江沱富貴動歸思由来光里閭戒門羞主父負弩笑相如外物有榮悴中心無戚疎遥知見親舊不改布衣初送張學士師中字吉老兩浙提㸃刑獄賦得清字朝家重典刑書府借時英鉦鼓喧江下雲山拂眼清秋風鱸鱠美書日錦衣榮勿似朱翁子空令守邸驚送王書記申字應辰之官永興白髮添新鑷紅塵滿弊衣人生適未值吾道豈云非鞏洛風煙逺函秦草樹㣲長安春酒美行樂勿令希送朱軄方䖏臣字表臣提舉江淮運鹽熬漉滄波耗征輸澤國貧嬰羅矜赤子運筴借能臣拜手觚􅏢晚浮舟浪蕩春東南待蘇息别酒莫逡巡送次道知太平州浪蕩春流滿蕪湖候吏迎旌旟曉日麗鉦鼔