  - {type: variant, offset: 4319, length: 0, content: '', WYG: 和邵興宗秋夜學舎宿直直舎逍遙度清夜暫投逢掖解儒冠髙樓影背星河轉踈竹氣兼風露寒籬下黄花新蘂亂門邊碧栁舊株殘折腰把板今無有勿似陶潛遂棄官和吳冲卿病中偶書呈諸同舎光時亦卧疾病來門不掃秋草翳吾廬棄置賢人酒蕭條長者車冥迷牀鬬蟻潤溽篋生魚藥物従無繼簞瓢自有餘形神寂可弔身世邈相疎何事文園客消中亦著書月下小飲美景賞心相值難良宵四座盡儒冠月華過冷衣襟潤酒力易消樽爼寒自有笑談供逸氣不須絲竹借餘歡坊樓五皷欲催曙桂影長先高興闌舉首孤輪不似遙尊前狂氣出雲霄常娥不惜借丹桂欲就高枝掛酒瓢馬病羸病何其久仁心到棧頻須憐苜蓿歉當認主人貧客舎同蕭索山程共苦辛未能逢伯樂且可自相親慶歴七年祀南郊禮畢賀赦雷皷千通破大幽天開獄鑰縦纍囚驛書散出先飛鳥一日恩流四百州送張太愽肅知岳州嚴風秀木折為薪得罪由來為出羣粥粥黄雞憎鸖介芄芄青蔓掩蘭薰天資䜛嫉多端巧人極精明不易分飲水豈言吳刺史謗書翻似馬將軍波濤洶涌動寒野樓閣嶣嶤壓暮雲紅葉寺深秋暖見蒼山鐘逈夜清聞何妨絶境聊為中正恐中朝亟用君身外百愁俱擲置放歌沈飲且醺醺和之美河西列岫亭}
  - {type: page-break, offset: 4319, content: '', id: KR4d0040_WYG_011-17a, image: WYG1094/WYG1094-0121c.png}
  - {type: page-break, offset: 4319, content: '', id: KR4d0040_WYG_011-17b, image: WYG1094/WYG1094-0121d.png}
  - {type: page-break, offset: 4319, content: '', id: KR4d0040_WYG_011-18a, image: WYG1094/WYG1094-0122a.png}
  - {type: variant, offset: 4320, length: 0, content: '', WYG: 首秋山對疎牖羇客倦登臨雨後嵐光活晴初落照深素波明别浦赤葉照衰林佇目寂無語何人知此心亭臯資逺矚秋思浩無涯鴈唼牽菱蔓童歌出荻花壟荒猶叱犢枝暗稍栖鵶煙靄蔵東渚憑軒莫望家書事志士喜功業感時心易勞蘖栽終栝柏荒蔓任蓬蒿梁竦慵為吏蕭咸恥詣曹風霜果不變㑹見出雲高釣魚有感二首垂竿臨晚岸堅坐據莓苔餌落萍初散魚驚荷暫開有求雖𤨏細未獲且低回君識磻磎老曽垂緑髪來野釣披榛竹無人知徃來高空飛不下鷗鳥已相猜憶龎之道疇昔兩垂髫知音結久要何言半塗别不待歳寒彫幸有才名在非隨氣運消英靈猶髣髴宿草已蕭蕭興宗約逰㑹靈久不聞問以詩趣之勝地何妨行樂頻萬雙白璧不餘春臘醅已老久未壓楊栁青青不待人清明日興宗飲趙道士東軒佳逰得令辰過此不為春一境風光秀萬家煙火新鷰初飛玉殿草不染香輪逼水蒲牙短圍堤栁帶勻縦談高出古落筆健生神日暮還醒去林花應笑人上已日與太學諸同舍飲王都尉園冠蓋欝相依名園花木稀游絲縈復展狂絮墮還飛積弩遺風陋蘭亭舊俗微何如詠沂水春服舞雩歸寄題洪州慈濟師西軒登臨傳勝絶悵息未成遊山氣高凌霽湖光碧照秋煙疎茶竈逈燈冷竹房幽安得聊憑檻蕭然洗客愁傳家集巻}
