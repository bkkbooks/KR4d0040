  - {type: variant, offset: 5207, length: 0, content: '', WYG: 雖比圭璧直不避雷霆道勝軒裳薄神和氣體寧忠誠懐畎畆樂事寄林坰藻鑒評隨月過従德應星苦吟金出礦確論木銜釘賤子叨流輩髙風仰典刑巨川容滴水餘景借流螢久别眉俱白重來眼更青淹留弦與晦逰集醉還醒有酒須相就無歌不共聼竒花喧夕市疊鼓咽春亭揚袂行辭洛囬車去望陘許西北有陘山見来書徃還天表鴈離合浪間萍異日期同傳景仁嘗言他日與光若得在}
  - {type: variant, offset: 5208, length: 0, content: '', WYG: 史必同傳窮泉約互銘光與景仁約後死者當為先死者作墓銘古今難得事交分保頽齡復用三公燕集韻酬子駿堯夫官閒虚室白粟飽太倉紅朝夕掃三徑徃來従二公蒹葭徒倚玉燕雀豈知鴻相過輙同醉惟愁樽酒空和吳朝議執中字幾聖同年謝光與景仁同年見過結綬東堂同發策白頭相值益相親却思景祐無多日共見元豐有幾人天下髙名歸廣受二公皆致仕古来交道重雷陳謝公身老才方壯落筆成章字字新伏䝉留守相公賜示陪太師潞公東田宴集詩輙敢屬和舞雩新雨浹公田水滿東溪上下天行徑乍迃初見筍浮舟正好未生蓮絃收裂帛胡琴闋袖結清風楚舞妍相國火城光滿路夜歸不假玉蟾圓和潞公招堯夫不至東閤樽罍招共飲後房羅綺約同觀既無薊子分身術須欠車公一座歡和子華招潞公暑飲朱門近在府園東杖屨過従跬步中避暑連翩投轄宴析酲蕭灑滿襟風閒来髙韻渾如鸖醉裏朱顔却變童剪燭添香歡未極但驚銅漏太怱怱再和伯常見寄誅茅宋玉宅邊人知醉宜城幾甕春細雨短蓑漁向市孤村極浦鼔迎神徧逰七澤身忘倦更賦千篇意轉新不必滄浪羡清泚曏来纓上已無塵再和秉國約逰石淙上國分擕十五秋未嘗偶坐捧茶甌石淙今㑹須如約彼此霜毛各滿頭席君従於洛城種金橘今秋始結六實以其四獻開府太師招三客以賞之留守相公時賦詩以繼其事光竊不自揆輙依髙韻繼成五章宜春果結洛陽枝太師云此果本出袁州正遇耆明㑹客時更引輕舟倚蘆岸香秔鮮鱠雅相宜圓小香黄珠顆垂結成洛邑重霜時相公和氣陶羣物不是寒溫變土宜君従好事不知疲種子成株凡幾時摘獻帝師三取二自甞兩顆且隨宜物不須多且賞竒禦寒相見結庵時江南江北徒虚語盡信前書是不宜弊居橘亦自南移愛䕶栽培費歳時前此實成酸苦甚應由與德不相宜和留守相公九月八日與潞公宴趙令園有懐去年與景仁秉國逰賞今歳台星聚洛中甘棠前後雨隂濃英辭唱和詩千首髙宴逰陪禄萬鍾木末霜繁花未落雲間字小鴈相従西湖在望親朋逺節物那堪處處逢和留守相公寄酒與景仁想對白衣初滿傾執杯未飲已詩成懐賢孤坐悄無語不是朝来困宿酲和秉國芙蓉五章清曉霜華漫自濃獨憑愛日飬殘紅勸君秉燭須勤賞閶闔難禁一夜風北方稀見誠竒物筆界輕絲指捻紅楚蜀可憐人不賞墻根屋角數無窮平昔低頭避桃李英華今發歳云秋盛時已過渾如我醉舞狂歌挿滿頭後時獨立誠難事猶賴階庭有菊叢綽約霜前弄姿態非如羣木萬林紅但見涉江求水際豈知勝木采霜中㣲紅未肯全衰歇正似􅋳顔鸖髪翁和堯夫見寄志趣苦難合倀倀何所依逢君始相照知我信為稀忽報除書下徒瞻征蓋飛相思千里逺洛浦又春歸仁政如慈父蒲人得所依教條前後接風迹古今稀試郡纔書最還朝必奮飛西臺􅃇班列猶望繡衣歸華嚴真師以詩見貺聊成二章紀其趣尚知足隨縁處處安一身溫飽不為難禪房窄小纔容榻此外従他世界寛素髪青眸七十餘未嘗逰學只安居旁無几杖身輕健應為心閒得自如和子華過王帥家見梅花盛開呈君實子駿兼簡堯夫去年與客盡清歡今日重来立馬看猶是擕觴同醉在只愁風雨横相干和張伯常賀遷資政不駕使車開漢關相如不棲巖穴鍊金丹子㣲豈無開徑三人友分著垂緌五寸冠隨逰之士坐飽太倉猶自愧謬躋祕殿益難安願同野老嬉堯壤長守先生苜蓿盤又書一絶戯呈伯常逺自郢中囬喜與愁心相繼来幸得蒹葭依玉樹慙將瓦礫報瓊瑰又和南園真率會見贈白頭難入少年塲林下相招莫笑狂緑篠影侵碁局暗黄梅花漬酒巵香任真自愧殽羞薄假寐初便枕簞凉酬應詩豪困牽率従来嬾放似稽康春日思景仁去歳洛城中嬉遊處處同従離崿嶺北常夣潩泉東草遶春街碧花繁夕市紅臨風黙惆悵想像白眉翁效趙學士體成口號十章獻開府太師都人共喜太師囬比頻必切戸争迎不得催正值土樓灘水淺大家出手挽船来東郊車馬走紅塵城外多於城裏人誰信今朝還政後過如前歳下車新歸来甫可及春殘丞相頻邀賞牡丹逺處名園多不到尊前日獻百餘盤洛陽風俗重繁華荷擔樵夫亦戴花貪看二公同宴㑹逰人昏黑忘還家公厨敕許釀芳樽屢喚賓朋醉後園謔浪畧無名位間誰人知道太師尊過春稀復到諸園厭苦終朝鼓吹喧招得老僧江外至啜茶揮麈話松軒東田小籍選新聲歌吹胡琴色色精客少有時全不用天然水竹湛餘清首夏清和新雨晴緑莎細軟不妨行園夫遮道白何事梔子花開斑笋生矮㡌長絛紫縠衫朱門深静似重巖莫言永日渾無事種藥移花一一監八十聰明强徤身况従壯歳秉鴻鈞功名富貴古亦有無事歸来能幾人自嘲盤飱羅新蔬充腹不求餘窮巷晝扄戸閒軒卧讀書有心齊塞馬無意羡川魚世道方邀逐如君術已疎虞部劉員外約逰金明光以賤事失期劉惠詩見嘲以詩四首謝之宗孟絲管嘈嘈耳不分綺羅雜踏自成春不唯漢帝昆明小更覺唐家曲水貧綘闕朝歸散玉珂不逰不飲奈春何皇仁聼使歡娛極白簡従君冷峭多碧栁紅桃照眼春綺肴芳醴集朝紳自嫌林野疎頑迹難預風流席上賓上苑花繁髙覆墻曲隄風暖栁絲長爐邊應有步兵尉甕下難尋吏部郎孫器之奉使淮浙至江為書見寄以詩謝之五首䪍矢迎山驛軺車下帝臺夜看牛斗分應有使星来曉棹旌旗逈暮河鉦皷喧商船極目避漢使一何尊呉釀木蘭春蘇州有木蘭堂酒紅鱸白錦鱗玉盤聊下筯初識紫絲蓴岫貼晴天濶舟緣石岸深吳江中石岸長數里遙知作書處䌫裊緑波心沙溆鸖争飛波光可染衣松江異淇水信美不如歸器之家衞州傳家集巻十二欽定四庫全書傳家集巻十三宋司馬光撰律詩八送導江李主簿君俞學海無涯富辭鋒一戰勲聲華掩終賈賦頌繼淵雲五斗為邊吏千倉飽戍軍明恩美尤異優秩賞能勤黄祖隂懐怒張湯巧用文折雖因木秀燒不變蘭薰迹有窮通異心無得䘮分龍蛇寜久蟄玉石豈俱焚蜀國花饒思臨邛酒易醺西風時有意尺紙慰離羣送峽州陳㢘祕丞三首冝都賢太守治迹古人齊虎負衆子去鳳環羣鳥棲行増潁川秩别降武都泥正恐還朝速春林未子規郡府猿聲外旌旗鳥道邊樓髙出楚塞煙霽識巴船襦袴嗟来暮簮紳惜外遷皇仁矜遠俗非謂意疎賢地險三巴口江流百折蟠騶珂通峽響門㦸照秋寒翠壁虎牙石素花狼尾灘孫劉置柵䖏細為冩圖看送聶之美攝尉韋城徒勞已足倦漂泊益栖遑短劔無三尺征衣共一囊折腰從事馬替謁使君堂併日屢承檄無時不裹糧官曹大児戯弓槊小軍行破柱翻偷窟傾林索盗贓村墟旅顔黑風日故衫黄暝宿投煙舍朝餐䕃道桑唯憂課書殿豈慕薦飛章志氣空磅礴才華浪激昻鐫鑱圭始瑩磨拂鑑尤光衣褐仍纒袴無羞俗吏裝送呉辨叔大名司户二首元宰司宫鑰旌旄壓大河敢言趨府倦私歎折腰多機發何妨避光塵未免和艱難方逺到慶閥肯蹉跎致逺必自近如君豈椽曹魚龍試春浪松栝露秋毫錯落辭華富䃘􅥁氣節髙垂天起膚寸無歎走塵勞送楊太祝忱知長洲縣三呉佳縣首民物舊熈熈專用清談治非如俗吏為林疎丹橘逈稻熟白芒欹冝使民無忘嚴修太伯祠送韓太祝縝知錢塘冠佩欝相映由来積徳家一時推雋異四海走聲華圖籍添舟重江山忘路賖夷塗指霄漢跼驥不須嗟送趙書記衆之官華州車馬西城外遥遥未有塵辭梁猶帶雪過洛漸生春幕府斜依嶽關山曲抱秦曩来謨畫拙不必笑前人送華亭沈主簿執袂青門道蕭蕭馬欲東暮雲零落翠逺樹淺深紅楚澤吟聲裏呉山醉眼中相思杳何許野鶴唳髙風送鄭推官戡赴邠州三首形便邠公國旌旗擁將壇秦雲低落日塞樹怯春寒草檄無留思投壺不廢歡還應笑黄巻寂寂守儒官百榼行春樂千弓從獵豪苦吟邊月冷飛鎬野風髙竒䇿鞭殊俗長纓繫不毛輸君躍馬貴一等著青袍驕虜已歸計聖朝方寢兵時聞候火入非復塞塵驚秋嶺無南牧春田恣北耕休窮西海路辛苦學甘英送何萬下第歸蜀二首十上終無就才髙定復論清時守儒術白首在丘園逺樹隱殘日孤煙生暮村揚鞭萬里去㡬許不銷䰟失意流年老殘春對夕陽可堪臨逺道更復舉離觴花栁已蕭索雲山復渺茫西風如有意音信勿相忘送王殿丞景陽知眉山縣二首先公與祕閣府君相繼為利州路轉運使予與眉山同年登第疇昔侍嚴親俱為綵服人遊蘭已多益得桂復同春風樹悲歡異萍波聚散頻峽中盡遺事何處不霑巾君行杳何許萬里蜀雲西野色春期近林煙曉意迷天蔵巴峽小星逼劔關低莫使鄉愁亂咬咬信子規送朱校理寀字㢘叔知濰州東國連年水傷稼使君到部即行春茫茫四野潢汙竭欝欝萬行桑柘新俗不好奢田器貴獄無留繫吏家貧齊人忽怨歸朝速自是承明侍從臣送孟著作翺字仲習知濟隂聖主焦勞意誰云百里輕東州比災害劇令選精明水去良田闊人歸旅糓生閭閻還舊觀鷄犬變新聲盗散疲民活姦窮老吏驚政成知不日雙耳為君傾送馮狀元京歸鄂州夙昔負竒節琅然為衆殊下韝連得雋出手盡成盧喜氣兼鄰曲榮名溢道塗風雲俱動色非復舊江湖送呉耿先生先生通六經大義客関中今還建陽北山儒服若煙海㡬人潜聖心難才成自昔賤學况于今夫子獨神解明時何陸沈大羮無和味至樂寡知音磳磴貂裘弊飄蕭鶴髮侵逰秦不得意思越動長吟甑米難求玉經囊益少金拂衣謝賔友縱棹指雲岑積葉迷幽逕荒藤絡舊林澗猿驚重至野老喜相尋山色猶當户絃聲不變琴人生貴適意何必慕華簮送髙陟歸金陵三舉不登科以好學孝弟聞於鄉里之子秣陵去悠悠天塹東帆開曉風疾潮落夜江空在昔才華盛至今人物豐山川氣雖盡龍虎勢猶雄卞玉已三獻齊禽㑹一冲當令關下吏洗目認終童送僧聦歸蜀翠柏老精舎紅塵倦帝城千山一錫逺萬里片雲輕江棧紆還直天星縱復横聴猿應更喜還是故鄉聲送史館任祠部顓河東轉運使問望簮紳舊恩華雨露重圖書周内史汾澮晉全封秀發千尋壁寒生百鍊鋒歸時門有㦸惜别更從容送冲卿通判河中府校理吴充聞道名都行有期依然想見昔逰時寒光一曲秋河轉翠嶺三條夕照移孤竹舊風民有讓重華餘教俗無疵不須到日方登厯已在君家十二詩送史館唐祠部詢字彦猷江南西路轉運使豪傑爭唐鹿江南號富强明時雖混一餘俗尚彫傷税版誅求急詞曹牒訴忙皇心愍頽弊使節付才良貪吏先投紱姦民盡越鄉閭閻無揷筆田畆有棲糧漢閣歸期闊隋河去驛長風髙片帆疾鉦鼓入秋光送張寺丞覲知富順監漢家五尺道置吏撫南夷欲使文翁教兼令孟獲知盤羞蒟醬實歌雜竹枝辭取酒須勤醉鄉關不可思送二同年使北華纓下玉除天子寵匈奴雖復夷風陋猶知漢使殊夜烽沈不舉秋柝寂無虞何必燕然刻蒼生肝腦塗右吕儕叔雲愁雪欲零四牡出郊坰古塞煙華紫寒沙日氣青金門祕雞樹朱節燿龍庭㡬夜天街北遥占漢使星右李公素送沈寺丞紳知南昌縣字公儀長江湛湛帶楓林古木寒雲縣寺深老吏不能容狡獪細民無復有寃侵洪崖丹井聞猶在徐孺衡門說可尋寜復淹留如寳劔更令牛斗氣沈沈送王校理懌字公和守瑯琊沂公兄子為公後金門倦鳴玉千騎出東方封略依滄海枌榆近故鄉秦碑苔蝕字鄅稻日翻芒國吏遥應識當年丞相郎送龔章判官之衞州新及第几硯昔年逰於今成十秋松堅終發石魚變即辭流近郡無飛檄清時不借籌淇園春竹美軍宴日椎牛送王瓘同年河南府司錄字文玉先君甞為此官綵服昔為兒隨親宦洛師至今餘夢想常記舊逰嬉佐史頭應白書樓樹已欹聞君行有日使我淚交頥送王彦臣同年通判亳州字伯逢先朝御六飛親謁瀬鄉祠牛酒當時惠衣冠此日思仙蹤丹有竈天瑞檜生枝聖主憐耆舊題輿得吏師送茹屯田孝標知無為軍疊鼓鳴鐃迎候新軍牙孑孑倚淮津聊應衣繡過鄉曲不作引章驚故人荻迸短芽淝水暖荷浮圓葉漅湖春使君此去榮夕夕少猶是當年書劔身送邵不疑知常州宦學不營身京華費十春非貪為郡樂意欲與民親祖帳青門道歸帆揚子津江山舊逰在煙火故鄉鄰敢惜離群闊欣聞得吏循嗟余一囊米深負鬢絲新送聶之美任雞澤令趙魏髙氣俠到今風俗然椎埋吏難禁擊斷世稱賢明府冝更瑟罷民庶息肩無如繭絲者急欲縱敲鞭送張祕校牧知分寜獻臣父百里大夫官不輕莫嗟領上髮垂星人生糓祿偏宜晩世路艱難不厭經數曲秋江縈縣白㡬峯霽色入簾青于公嚮日多隂徳已有鵷鶵在帝庭送韓直講鐸字子文鄆州寜親車馬儼何之東岡舊有陂三年别親意千里逹家時去仕元戎幕來為太學師寜須負斗米不復斷機絲物色迎歸鞚光輝入夀巵人生無此樂此樂獨君知送丁祕丞翊字公佐知雍邱古縣跨河流人繁軍市稠羽飛朝暮驛鮮疊往來舟兄擅才華久時推政治尤足猶妨老驥目不礙全牛從道西来近能無東望愁時因趨上府窮巷一相求送計先軰泰符尉宗城紅塵久帝城髙價動公卿竹栢寒方茂驊騮老更成冰霜驅馬瘦書劔束裝輕丞相虚東閣遥知倒屣迎送趙殿丞象字子輿歸成都祀明堂禮畢子輿新升朝以恩官其父大理評字事賜告歸寜得其除書以俱二三同舍為詩以紀其美僕得回字蜀棧錦衣来髙堂綬笥開恩輝同日至喜色共春回駟馬過鄰社朝裾捧夀杯吾生無此樂空使寸心摧送張都官肅字子莊江南東路提刑得前字楚俗號難治司刑尤擇賢危疑片言决舒慘一方專松不彫寒色絲曾斷直絃清風過江外應在下車前送楊祕丞秉通判揚州苦聞小杜説揚都當昔豪華今在無江勢横来控南楚地形前不瞰東呉萬商落日船交尾一市春風酒並壚得意莫忘京國友踏塵衝雪奉朝趨送光祿王卿周致仕歸荆南九列誰云非顯塗人生已不負為儒拂衣長揖蘷龍貴散髮還為黄綺徒白鶴歸飛心自逺青霞髙舉勢何孤千金盡與鄉人費不向江頭買木奴送王殿丞恪西京簽判清白世風存王公復有孫挺生如玉樹不竭似淮源日背嵩峯紫春添洛水喧幕中多勝友肯使負芳樽送謝都官顗知光化軍廐吏整車馬怱怱辦暁裝青緺出閶闔朱斾指滄浪野店杏初發津亭栁已黄行行不可駐猶及勸耕桑送仲更歸澤州太行横擁巨川回三晉由来産異才展墓乗春走鄉陌負書拂曉下蘭臺河陽路側花應合天井關頭雪未開㑹使鄉人驚六印莫羞今日弊裘来送劉觀察從廣知洺州漢家英俊士衮衮出金閶久襲通侯籍新腰太守章畛封連故趙廬井帶清漳春色迎鐃吹應忘道路長送晁校理仲衍字子長知懐州雞犬相聞桑柘春風光明潤帝鄉鄰群峯斜轉太行角萬谷同趨馬頰津簮組傾都邀别袂壺漿滿路候行塵非君厭薄承明直天子方今重治人席上賦得榛字㣲物生山澤蕭條荆棘鄰何人掇秋實此日待嘉賔雖無木桃贈投此寄情親送師道知長溪因歸覲省羇旅帝城久逢人青眼稀聞君又當去使我益思歸佳色鄰鄉樹髙堂望綵衣春流先自疾心出片帆飛送次道通判西京相府新承檄蘭臺舊校文題輿榮得士把袂惜離羣首夏郊原秀晴陽草樹曛觚稜日邊逺闗塞霧中分翠􅊐林端出飛泉竹外聞金羈逰爛熳珠履醉繽紛人服聲光重官無薄領勤歸期肯留滯漢主待淵雲送劉儀先軰大名尉潭潭相府開旌騎擁三䑓聞道廷中吏無非天下才䇿名新振拔把板尚低回勿為卑飛困青冥盡此來送皇甫寺丞穆知藍田縣南山三輔劇百里古諸侯誰為絃歌小不分宵旰憂煙横輞川暝雲照武闗秋安得無羈束從君一縱逰送祁嶠潁陽主簿蒼山臨縣郭雲木冷蕭騷人有漁樵樂官無簿領勞垂天起膚寸合抱本纎毫志意誠脩立歸飛羽翼髙送李尉以監丞致仕歸閩中行行歌式㣲浩歎返荆扉却著登山屐盡焚趨府衣溪清魚影亂竹闇筍牙肥應悔浮名誤空將白髮歸送李祠部復圭字審言知滑州東郡隄繇苦曏来煙火疎提封百里逺生齒萬家餘賢守車纔下疲人意已紓行聞謡五袴京廪滿郊墟送田校理諒字仲孚知晉州前判吏部南曹銓筦萃賢豪夫君主劇曹長才沛餘裕衆論蔚推髙逮此分符貴知無頓刃勞公卿如有缺不獨賜金褒送人為閩宰萬里東甌外溪山秀出羣鄉人皆嗜學太守復工}
