  - {type: variant, offset: 5, length: 795, content: 八韻呈明叔六月十八日夜大暑閑中有冨貴寄唐州吴辨叔二兄自題冩眞和安之乆雨和復古小園書事復古詩首句云獨歩復靜坐輙継二章右獨歩右静坐光詩首句云飽食復閑眠又成二章右飽食右閑眠寄題濟源李少卿章園亭和明叔九日邵堯夫先生哀辭二首閑居呈復古和明叔遊白龍溪和景仁七十一偶成六十寄景仁去春與景仁同至河陽謁晦叔館於府之後園旣去晦叔名其館曰禮賢夢得作詩以紀其事光雖愧其名亦作詩以継之與樂道約㑹超化寺比至樂道以疾先歸途中有詩見寄和樂道再以詩見寄晚春病起呈擇之治臣次韻和復古春日五絶句酬宋叔逹道復古之兄卜居洛城見寄和王安之題獨樂園和吴辨叔知鳳翔見寄和安之今春於鄭國相公及光處得綴珠蓮各一本植之一盆仲夏始見一花喜而成詠末句云未知先合謝誰家君貺環溪瞑目獨樂園二首放鸚鵡二首呈樂道太皇太后挽歌詞二首曹后和劉伯壽陪潞公禊飲南園雨霽景物粗佳有懷正叔安之和潞公與昌言正叔遊獨樂園徘徊乆之主人不至潞公遊龍門光以室家病不獲叅陪獻詩十六韻初夏獨遊南園二首和景仁荅才元寄示花圖或謂光嗤景仁談禪而自談又因用歬韻爲景仁解禪題傳燈録後奉和大夫同年張兄㑹南園詩徽字伯常荅張伯常之郢州塗中見寄獨樂園新春和潞公眞率㑹詩景仁書云去冬因酒病耳病牙遂不入洛以詩寄呈又云新鑄鬴斛與今太府寺尺及權衡若合符契復次前韻三月二十五日安之以詩二絶見招作眞率㑹光以無從者不及赴依韻和呈又用安之韵招君從安之正叔不疑二十六日南園爲眞率㑹二十六日作眞率㑹伯康与君從七十八歲安之七十七歲正叔七十四歲不疑七十三歲叔逹七十歲光六十五歲合五百一十五歲口号成詩用安之前韻别用韻其夕宿獨樂園詰朝將歸賦詩二十七日邀子駿堯夫賞西街諸花呈張子賤子賤親自安邑徙居洛二十八日㑹不疑家席上紀實三月三十日㣲雨偶成詩二十四韻書懷献留守開府太尉兼呈眞率諸公其日雨中聞姚黃開戯成詩二章呈子駿堯夫四月十三日立夏呈安之和子駿洛中書事安之令子河陽官舎作畦樂軒安之有詩寄題輙敢継和和安之喜雨逍遥四章呈欽之堯夫喜雨八韻, WYG: ''}
