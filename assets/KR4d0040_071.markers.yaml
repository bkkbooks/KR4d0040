  - {type: variant, offset: 6101, length: 0, content: '', WYG: 而又功徳及人若此其盛愍流俗之訛不可以莫之正}
  - {type: variant, offset: 6102, length: 3, content: 外顔氏, WYG: 於是題云書孫之翰唐史記後元豐二年作孫公昔著此書甚自重惜嘗别緘其槀於笥必盥手然後啓之謂家人曰萬一有水火兵刃之急佗貨財盡棄之此笥不可失也毎公私少間則増損改易未嘗去手其在江東為轉運使出行部亦以自随過亭傳休止輒取脩之㑹宣州有急變乘馹遽往不暇挈以俱既行於後金陵大火延及轉運廨舍弟子察親負其笥避於沼中島上公在宣州聞之亟還入門問曰唐書在乎察對曰在乃恱餘無所問自壮年至於白首乃成亦未以示人文潞公執政嘗從公借之公不與但録姚崇宋璟論以與之况佗人固不得見也元豐二年察自陽翟來洛陽以其書授光曰伯父平生之志萃於是書朝廷先嘗取之留禁中不出今沒二十餘年家道益衰大懼是書遂散逸不傳於人故録以授子光昔聞公有是書固願見而未之得得之驚喜曰}
