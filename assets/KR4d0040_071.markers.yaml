  - {type: variant, offset: 6114, length: 2, content: 内守, WYG: 哉此為傳者之過明矣夏桀桀走鳴條遂放而死桀謂人曰吾悔不遂殺湯於夏臺使至此剡曰是言也存為後世之懲勸其可乎周文王崇侯譛西伯於紂曰西伯積善累徳諸侯皆嚮之將不利於帝紂乃囚西伯於羑里云云既出乃獻洛西之地以請紂去炮烙之刑紂許之剡曰紂疑文王之得民故囚之既釋而又獻地以止其虐刑是正信崇侯虎之譛於紂也豈所謂遵養時晦以䝉大難者哉且紂惟不勝其淫虐之心故為炮烙之刑若能自止而不為則不待受西伯之地若不能自止雖受地於西伯而為之如故誰能禁之哉由余戎王使由余於秦秦穆公問曰}
  - {type: page-break, offset: 6114, content: '', id: KR4d0040_WYG_073-15a, image: WYG1094/WYG1094-0668c.png}
