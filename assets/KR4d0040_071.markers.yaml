  - {type: line-break, offset: 5801, content: '', id: KR4d0040_SBCK_071-13b11}
  - {type: variant, offset: 5801, length: 3, content: 斯巳賢, WYG: 清辨與同術恵宗治而新之今髙顯}
  - {type: variant, offset: 5805, length: 0, content: '', WYG: 願得子之文刻諸石}
  - {type: variant, offset: 5806, length: 0, content: '', WYG: 諗來者光謝曰光文不足以辱石刻加平生不習佛書不知所以云者師其請諸佗人曰佗人清辨所不敢請也故惟子之歸而子又何辭光固辭不獲乃言曰師之為}
  - {type: page-break, offset: 5806, content: '', id: KR4d0040_WYG_071-10b, image: WYG1094/WYG1094-0650d.png}
  - {type: variant, offset: 5807, length: 1, content: 觀, WYG: 堂也其志何如曰清辨之為是堂也屬堂中之人而告之曰二三子苟能究明吾佛之書為人講解者吾且南鄉坐而師之審或不能則将取於四方}
  - {type: variant, offset: 5810, length: 1, content: 乆, WYG: 者皆伏謝不能然後相率抵精嚴寺迎沙門道歡而師之又屬其徒而告之曰凡我二三子肇自今以及}
  - {type: substitution, offset: 5810, original: 乆, replacement: 久, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-19497}}
  - {type: variant, offset: 5812, length: 0, content: '', WYG: 後相與恊力同志堂圯則扶之師缺則補之以至於金石可弊山淵可平而講肄之聲不可絶也光曰師之志則美矣抑光雖不習佛書亦嘗剽聞佛之為人矣夫佛盖西域之賢者其為人也清儉而寡慾慈恵而愛物故服弊補之衣食蔬糲之食巖居壄處斥妻屏子所以自奉甚約而憚於煩人也雖草木蟲魚不敢妄殺盖欲與物並生而不相害也凡此之道皆以㳙潔其身不為物累盖}
  - {type: page-break, offset: 5812, content: '', id: KR4d0040_WYG_071-11a, image: WYG1094/WYG1094-0651a.png}
  - {type: variant, offset: 5813, length: 1, content: 庸, WYG: 國於陵仲子焦光之徒近之矣夫聖人之徳周賢}
  - {type: variant, offset: 5815, length: 18, content: 蓋鮮矣孔子曰智者樂仁者壽蓋言知夫中和, WYG: 之徳偏周}
  - {type: 'kr:newline', offset: 5821, content: '

      ', id: KR4d0040_krp_071-bkkkrnewl336}
  - {type: line-break, offset: 5821, content: '', id: KR4d0040_SBCK_071-13b12}
  - {type: variant, offset: 5835, length: 0, content: '', WYG: 不覆而末流之人猶不免弃本而背原况其偏者乎故後世之為佛書者日逺而日訛莫不侈大其師之言而附益之以滛怪誣罔之辭以駭俗人而取世資厚自豐殖不知饜極故一衣之費或百金不若綺紈之為愈也一飯之直或萬錢不若膾炙之為省也髙堂鉅室以自奉養佛之志豈如是哉天下事佛者莫不然而吴人為甚師之為是堂将以明佛之道也是必深思於本源而勿放蕩於末流則治斯堂之為益也豈其細哉竚瞻堂記元豐六年作元豐三年天子大饗明堂召河東節度使守司徒兼侍中潞國文公自北都}
  - {type: page-break, offset: 5835, content: '', id: KR4d0040_WYG_071-11b, image: WYG1094/WYG1094-0651b.png}
  - {type: page-break, offset: 5835, content: '', id: KR4d0040_WYG_071-12a, image: WYG1094/WYG1094-0651c.png}
  - {type: variant, offset: 5836, length: 0, content: '', WYG: 覲於京師以相祀事禮成天子以公勱相三后克底隆休澤敷乎烝民功安乎廟祧復命公以太尉留守西都於是公尹洛者三矣将行天子仍賜之詩云西都舊士女白首竚瞻公洛人喜公之來榮天子之言明年相與構堂於資聖佛祠肖公之像於其中名之曰竚瞻又二年河南進士宋師中李徹與其鄉里士民之衆以書抵光曰公再為宰相三守洛都雖恵化徧天下靡有不周而在洛為多今吾人日灑掃兹堂而奉事之至於子孫固不忘矣異時逺方之人有過兹堂}
  - {type: page-break, offset: 5836, content: '', id: KR4d0040_WYG_071-12b, image: WYG1094/WYG1094-0651d.png}
  - {type: variant, offset: 5838, length: 1, content: 自, WYG: 知其所以然者亦吾人之耻也子盍為我書其事著於石以傳告無窮光謝曰諸君以此屬我誠大幸然凡為士者頌一守令且猶秉筆不敢輕為况公之徳業位望崇顯如是乃使如光者紀之必}
  - {type: variant, offset: 5840, length: 0, content: '', WYG: 罪於識者}
