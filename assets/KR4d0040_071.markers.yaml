  - {type: line-break, offset: 6161, content: '', id: KR4d0040_SBCK_071-14b05}
  - {type: variant, offset: 6163, length: 1, content: 必, WYG: 不使之過亦不使之不及所以為中也不使之偏頗流散所以為正也中正道之根柢也聖人作禮樂修刑政立教化垂典謨凡所施為不啻萬端要在納民心於中正而巳然難}
  - {type: page-break, offset: 6163, content: '', id: KR4d0040_WYG_075-2a, image: WYG1094/WYG1094-0680a.png}
  - {type: variant, offset: 6165, length: 0, content: '', WYG: 而制者無若人之心也自非大賢守道敦固則放蕩傾移無不至求諸少選且不可得是故聖人廣為之術以求之投壺與}
  - {type: variant, offset: 6166, length: 3, content: 壽蓋言, WYG: 一焉觀夫臨壺發矢之際性無麤宻莫不聳然恭謹志存中正雖不能久可以習焉豈非治心之道歟一矢之失猶一行之虧也豈非修身之道乎兢兢業業慎終如始豈非為國之道歟}
  - {type: page-break, offset: 6166, content: '', id: KR4d0040_WYG_075-2b, image: WYG1094/WYG1094-0680b.png}
  - {type: variant, offset: 6171, length: 37, content: 動以中和爲節至於飲食起居咸得其冝則隂陽不能病天地不能夭雖不導引服餌不失其壽, WYG: 之為之}
