  - {type: variant, offset: 6502, length: 329, content: 所至氣必輔之君子乗之以爲善小人乗之以爲惡故曰氣者所適善惡之馬也君子守中和之心飬中和之氣旣得其樂又得其壽夫復何求哉孔子曰狂其内能如此乎故曰配義與道無是餒也凡人爲不善能欺天下之人不能欺其心雖忍而行之於其心不能無蔕芥焉然則浩然之氣不存矣故曰行有不慊於心則餒矣君子優游從容以飬其氣雖不敢忽忘亦不正以爲事欲其速成故曰必有事焉而勿正心勿忘勿助長也操之則存捨之則亡乆而無怠然後自得之此其所以難言也楊子曰藏心于淵美厥靈根君子存神於内應務於外雖往来万變未甞失其所守是以百骸治而德本植焉故曰神不外也志之所至氣必輔之君子乗之以爲善小人乗之以爲惡故曰氣者所適善惡之馬也君子守中和之心飬中和之氣旣得其樂又得其壽夫復何求哉孔子曰狂者進取又曰吾黨之小子狂簡斐然成章如光之謂矣雖然此皆纂述聖, WYG: ''}
