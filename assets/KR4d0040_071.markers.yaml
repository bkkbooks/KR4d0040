  - {type: variant, offset: 6117, length: 1, content: 和, WYG: 國以詩書禮樂法度為政然尚時亂今我夷無此何以為治由余笑曰此乃中國所以亂也夫自上聖作為禮樂法度僅以小治及其後世阻法度之威以督責於下下罷極則以仁義怨望於上上下交争怨而相簒弑夫戎狄不然上含淳徳以遇其下下懐忠信以事其上此真聖人之治也穆公以為賢乃離間戎之君臣卒得由余而用之遂霸西戎剡曰所貴乎有賢者為其能治人國家也治人國家舎詩書禮樂法度無由也今由余曰是六者中國之所以亂也不如我戎夷無此六者之為善如此而穆公以為賢而用之則}
  - {type: page-break, offset: 6117, content: '', id: KR4d0040_WYG_073-16a, image: WYG1094/WYG1094-0669a.png}
  - {type: variant, offset: 6119, length: 2, content: 幽隱, WYG: 亡國無難矣若之何其能霸哉是特老荘之徒設為此言以詆先王之法太史公遂以為實而載之過矣孔子齊景公欲以尼谿田封孔子晏嬰進曰夫儒者滑稽而不可軌法倨傲自順不可以為下㳺說乞貸不可以為國云云剡曰晏嬰忠信以有禮愛君而樂善於晋恱叔向於鄭悦子皮於吴悦季札豈於孔子獨不知而毁之乎楚昭王将以書社地七百里封孔子令尹子西曰文武百里之君卒王天下今孔丘得據土壌賢弟子為佐非楚之福也乃止剡曰子西楚之賢令尹也楚國賴之亡而復存危而復安其志猶晏嬰也其言豈容鄙淺之如是哉季布季布聞曹丘生招權顧金錢與竇長君書使絶之曹丘聞之往見布揖曰使僕逰揚足下名於天下顧不美乎何拒僕深也布大恱留數月為上客厚遣之剡曰曹丘與長君善而布與書使絶之是以曹丘為小人也及曹丘見以毁譽動巳而巳善之是養小人以自利也夫以毁譽動人及養小人以自利皆姦人之道也果如是則布惡得為賢大夫蕭何營未央宫蕭何作未央宫髙祖見宮闕壮甚怒何曰天下方未定故可因遂就宫室且天子以四海為家非壮麗無以重威且無令後世有以加也髙祖乃恱剡曰是必非蕭何之言審或有之何惡得為賢相哉天下方未定為之上者拊循煦嫗之不暇又安可重為煩費以壮宫室哉古之王者明其徳刑而天下服未聞宫室可以重威也創業埀統之君致其恭儉以訓子孫子孫猶滛靡而不可禁况示之以驕侈乎孝武卒以宫室靡弊天下惡在其無以加也是皆庸人之所及而謂蕭相國肯為此言乎傳家集巻七十三欽定四庫全書傳家集巻七十四宋司馬光撰迃書迃書序嘉祐二年作余生六齡而父兄教之書雖誦之不能知其義又七年始得稍聞聖人之道朝誦之夕思之至於今二十有七年矣雖其性之昏愚憊而不能進然勤亦至矣時有所獲書以示人人之論高者則曰子之書庸而無奇衆人所同知也論卑者則曰子之書迃而難用於世無益也嘻我窮我之心以求古之道力之所及者則取之庸與迃惟人之所名也我安得知之故命其書曰庸書亦曰迃書云釋迃或謂迃夫曰子之言太迃於世無益也迃夫曰子知迃之無益而不知其為益且大也子知迃之有益而不知其為損亦大也子不見夫樹木者乎樹之一年而伐之則足以給薪蘇而巳二年而伐之則足以為桷五年而伐之則足以為楹十年而伐之刖足以為棟夫豈非收功愈逺而為利愈大乎古之人惟其道閎大而不能狹也其志邃奥而不能邇也其言崇高而不能庳也是以所適齟齬而或窮為布衣}
