  - {type: variant, offset: 2267, length: 1, content: 機, WYG: 觀其詩其人之心可見矣今人親沒則畫像而事之畫像外貌也豈若詩之見其中心哉故樞宻直學士贈太尉薛公以文學政事顯於真宗仁宗之際其所施設見於國史及宋宣獻公所為神道碑此不詳書公既薨五十餘年少子中㪚大夫致仕俅集公詩二百二章以授光俾之譔序且為之名昔先人為郫尉公為轉運使知待甚厚薦之於朝光雖不肖其敢忘諸是以雖不文不敢辭謹按薛氏自姚秦以來世有偉人仕公卿将相行能功業光照簡冊號稱甲族迄於今不衰豈非河汾勝氣獨鍾於一門乎然而枝葉因遊宦多散之四方惟公一族留不去猶居河東請名之曰河汾集庶㡬子子孫孫繼公之志常保守奉事則而象之以傳慶於無窮也元豐八年三月丁未涑水司馬光序趙朝議丙文槀集在心為志發口為言言之美}
