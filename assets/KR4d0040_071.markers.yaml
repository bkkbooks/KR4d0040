  - {type: variant, offset: 6108, length: 0, content: '', WYG: 在其中豈非阨窮而不憫乎居鄉黨恂恂似不能言豈非由由與之偕而不自失乎是故君子邦有道則見邦無道則隠事其大夫之賢者友其士之仁者非隘}
  - {type: variant, offset: 6109, length: 0, content: '', WYG: 和而不同遯世無悶非不恭也苟毋失其中雖孔子由之何得云君子不由乎陳仲子避兄離母疑曰仲子以兄之禄為不義之禄盖謂不以其道事君而得之也以兄之室為不義之室盖謂不以其道取於人而成之也仲子盖甞諫其兄矣而兄不用也仲子之志以為吾既知其不義矣然且食而居之是口非之而身享之也故避之居於於陵於陵之室與粟身織屨妻辟纑而得之也非不義也豈當更問其築與種之者誰邪以所食之鵝兄所受之饋也故哇之豈以母則不食以妻則食之邪君子之責人當探其情仲子之避兄離母豈所願邪若仲子者誠非中行亦狷者有所不為也孟子過之何其甚與孟子將朝王元豐五年正月二十七日作疑曰孔子聖人也定哀庸君也然定哀召孔子孔子不俟駕而行過位色勃如也足躩如也過虚位且不敢不恭况召之有不往而佗適乎孟子學孔子者也其道豈異乎夫君臣之義人之大倫也孟子之徳孰與周公其齒之長孰與周公之於成王成王㓜周公負之以朝諸侯及長而歸政北面稽首畏事之與事文武無異也豈得云彼有爵我有徳齒可慢彼哉孟子謂蚳鼃居其位不可以不言言而不用不可以不去已無官守無言責進退可以有餘裕疑曰孟子居齊齊王師之夫師者𨗳人以善而救其惡者也豈得謂之無官守無言責乎若謂之為貧而仕邪則後車數十乘從者数百人仰食於齊非抱關擊柝之比也詩云彼君子兮不素餐兮夫賢者所為百世之法也余懼後之人挾其有以驕其君無所事而貪禄位者皆援孟子以自况故不得不疑沈同問伐燕元豐五年正月二十八日作疑曰孟子知燕之可伐而必待能行仁政者乃可伐之齊無仁政伐燕非其任也使齊之君臣不謀於孟子孟子勿預知可也沈同既以孟子之言勸王伐燕孟子之言尚有懐而未盡者安得不告王而止之哉夫軍旅大事也民之死生國之存亡皆繫焉苟動而不得其宜則民殘而國危仁者何忍坐視其終委乎父子之間不責善元豐五年作疑曰經云當不義則子不可不諍於父傳云愛子教之以義方孟子云父子之間不責善不責善是不諫不教也而可乎性猶湍水元豐八年作疑曰告子云性之無分於善不善猶水之無分於東西此告子之言失也水之無分於東西謂平地也使其地東髙而西下西髙而東下豈決𨗳所能致乎性之無分於善不善謂中人也瞽叟生舜舜生商均豈陶染所能變乎孟子云人無有不善此孟子之言失也丹朱商均自㓜及長日所見者堯舜也不能移其惡豈人之性無不善乎生之謂性元豐八年作疑曰孟子云白羽之白猶白雪之白白雪之白猶白玉之白告子當應之云色則同也性則殊矣羽性輕雪性弱玉性堅而告子亦皆然之此所以來犬牛人之難也孟子亦可謂以辯勝人矣齊宣王問卿疑曰禮君不與同姓同車與異姓同車嫌其偪也為卿者無貴戚異姓皆人臣也人臣之義諫於君而不聴去之可也死之可也若之何其以貴戚之故敢易位而處也孟子之言過矣若有大過無若紂紂之卿士莫若王子比干箕子㣲子之親且貴也㣲子去之箕子為之奴比干諫而死孔子曰商有三仁焉夫以紂之過大而三子之賢猶且不敢易位也况過不及紂而賢不及三子者乎必也使後世有貴戚之臣諫其君而不聴遂廢而代之曰吾用孟子之言也非篡也義也其可乎或曰孟子之志欲以懼齊王也是又不然齊王若聞孟子之言而懼則将愈忌惡其貴戚聞諫而誅之貴戚聞孟子之言又将起而蹈之則孟子之言不足以格驕君之非而適足以為篡亂之資也其可乎所就三所去三疑曰君子之仕行其道也非為禮貌與飲食也昔伊尹去湯就桀桀豈能迎之以禮哉孔子栖栖遑遑周逰天下佛肸召欲往公山弗擾召欲往彼豈為禮貌與飲食哉急於行道也今孟子之言曰雖未行其言也迎之有禮則就之禮貌衰則去之是為禮貌而仕也又曰朝不食夕不食君曰吾大者不能行其道又不能從其言也使饑餓於我土地吾耻之周之亦可受也是為飲食而仕也必如是是不免於鬻先王之道以售其身也古之君子之仕也殆不如此堯舜性之也湯武身之也五覇假之也疑曰所謂性之者天與之也身之者親行之也假之者外有之而}
