  - {type: variant, offset: 160, length: 357, content: 而不絶由是觀之天下烏有無士之國哉患在人主知之不明用之不固信之不專耳如是則人臣雖有才智而不得施雖有忠信而不敢效人主徒憂勞於上欲治而愈亂欲安而愈危欲榮而愈辱矣然則人主有賢不能知與無賢同知而不能用與不知同用而不能信與不用同不用賢而求功業之羙名譽之白難矣昔百里奚虞人也由余戎人也商鞅魏人也而用於秦苗賁皇申公巫臣楚人也而用於晉伍貟楚人也而用於吴韓信陳平項羽之人也而用於漢是五國者非無賢人也主不能知而驅之以資敵國此所謂有賢不能知與無賢同也齊御名公見郭氏之虚問於野人曰郭何故亡對曰以其善善而惡惡公曰善善而惡惡國所以興也而亡何故對曰善善而不能行惡惡而不能去所以亡也公歸以告管仲管仲曰君與其人俱來乎曰否管仲曰君亦一郭氏也公乃召而官之齊景公待孔子曰若季氏則吾不能以季孟之間待之齊王欲中國而授孟子室養孟子以禄萬鍾使諸大夫國人皆有所矝式是, WYG: 家集巻六十八欽定四庫全書傳家集卷六十九宋司馬光撰序}
