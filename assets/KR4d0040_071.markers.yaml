  - {type: variant, offset: 2323, length: 2111, content: 矣聖人精心審謹而後行之故百姓萬物皆頼焉小人知機權之道而誣竊其名妄行誖理所以福禄不乆而禍亂及之也請問聖人機權之道曰昔紂爲玉柸象箸而箕子佯狂衛靈公仰視蜚鴻而孔子行是皆知譏者也夫柸箸小噐飾以珠玉未爲大過而箕子知其必亡國者爲其奢淫㤗侈之漸由此始也仰視蜚鴻失理之細者而孔子去之者知其不能用聖而有厭怠之心不去則大禍將至也如此聖人之知機豈不偉哉伊尹放太甲微子去啇歸周周公誅管蔡是皆知權者也夫數君子豈不知放君畔宗戮親之爲不善哉誠以放君之責輕而淪喪大業之禍重畔宗之譏薄而保存宗祀之孝深戮親之嫌小而傾覆周室之害大故去彼而取此也夫太甲之𥘉欲敗度縱敗禮苟非苦其身體勞其思慮則不能變惡遷善克終允德成湯之業將墜於地伊尹躬受湯命阿衡王家故不得不放諸桐宫也受爲不道自絶於天微子不去與之偕亡則祖禰不祀宗族無主故不得不抱祭噐而歸周也管蔡奉廢姓伐宗國違天命逆人心傾危聖輔斵喪周室成王㓜弱周公攝政故不得不奮干戈揚斧鉞以治之蓋周公非自愛而愛周室故也嚮若太甲尚可諌而改則伊尹必不放君啇受苟可輔而存則微子必不畔宗管葵猶可教而治則周公必不戮親夫豈不思誠不得以已也是以太甲曰惟嗣王不惠于阿衡伊尹作書曰祗爾厥辟辟不辟忝厥祖是猶以辱先爲戒未欲正言覆亡之禍委蛇其辤以感切之也王惟庸罔念聞伊尹乃言曰無越厥命以自覆是正言禍敗以聳動之也王未克變伊尹乃以王生而榮逸不知勞辱狎近小人積習至此非其性惡故曰兹乃不義習與性成營于桐宫其訓無俾世迷言積習浸乆將成其性及今猶可沮詘而改此乃伊尹盡心盡力於成湯太甲之至也㣲子之誥曰啇其弗或亂正四方言受不可復正史必亡國已所以當出奔存湯後也父師若曰啇其淪喪我罔爲臣僕言啇旣亡宗族俱滅無所寄託也又曰王子弗出我乃顛躋言不可不行也此微子廣咨謀權輕重之審諦也大誥曰肆子冲人不卬自恤義爾邦君越爾多士尹氏御事言今東征非爲已也豳風曰旣取我子無毀我室子以喻管蔡也室以喻周家也言管蔡輕而周家重也曰子羽譙譙子尾翛翛言勤瘁也予室翹翹風雨所漂揺予唯音嘵嘵言三監背誕王室阽旎故我恐懼以憂之也此豈周公背公向私之志哉夫聖人之用權也如此故國家安而仁義立也後丗之人昧錙銖之利以放逐其君懷芥蔕之嫌以屠㓕其親而亦自比於伊周曰吾用機權不亦誣哉此乃亂臣賊子所以滋多也朋黨論黄介夫作壞唐論五篇以爲壞唐者非巢温與閹竪乃李宗閔李德𥙿朋黨之弊也是誠得其本矣雖然介夫知其一未知其二彼盗賊之興由閹竪閹竪之横由輔相則信然矣噫輔相樹立私黨更相排壓而不能正者又誰咎哉夫朋黨之患不專在唐自古有之以堯之明共工讙兠相薦於朝舜臣堯旣流共工又放讙兠除其邪黨然後四門穆穆百工咸熈仲虺數夏之惡曰簡賢附勢實繁有徒武王數啇之惡曰朋家作仇脅權相㓕是則治亂之丗未甞無朋黨堯舜聦明故能别白善惡而徳業昌明桀紂昏亂故不能區處是非而邦家覆亡由是言之興亡不在朋黨而在昏明矣洪範皇極曰無偏無陂遵王之義無有作好遵王之道無有作惡遵王之路無偏無黨王道蕩蕩無黨無偏王道平平無反無側王道正直周公戒成王曰孺子其朋孺子其朋其往無若火始𦦨𦦨厥攸灼叙弗其絶是以舜誅禹父而禹爲舜佐伊尹放太甲而相之周公放蔡叔而封蔡仲公之至也夫宗閔徳𥙿雖爲朋黨由文宗實使之文宗甞曰去河北賊易去朝中朋黨難殊不知群臣爲朋黨誰之過也由是觀之壊唐者文宗之不明宗閔德𥙿不足專罪也三勤論揚子曰民有三勤政善而吏惡一勤也吏善而政惡二勤也政吏駢惡三勤也愚謂勤民者一未甞有三也何則吏者民之司命吏良則民斯逸矣未有吏善而政惡者也亦未有政善而吏惡者也度吏之材而任之者君之政也形民之力而用之者吏之政也吏苟得人安有穀人不足於晝絲人不足於夜者乎故爲人君者謹於擇吏而巳矣它奚足事哉管仲小噐論孔子稱管仲之噐小哉先儒以爲管仲得君如此不勉之以主而僅止於霸此其所以爲小也愚以爲周天子尊而管仲勉齊淵聖御名公以王是教之篡也此管仲所恥而不爲孔子顧欲其爲之邪夫大人者顧時不用則巳用則必以禮樂正天下使綱紀文章粲然有萬丗之安豈直一時之功名已邪管仲相淵聖御名公霸諸侯禹迹所及冠帶所加未能使之皆率識也而偃然自以天下爲莫已若也朱紘而鏤簋反坫而三歸此其噐豈不小哉揚子曰大噐其猶規矩凖䋲乎先自治而後治人斯言得之矣荀息論晉獻公使荀息傳奚齊荀息曰臣竭其股肱之力不濟則以死継之及里克殺奚齊荀息死之君子曰詩所謂白圭之玷尚可磨也斯言之玷不可爲也荀息有焉杜元凱以爲荀息有此詩人重言之義以愚觀之元凱失左氏之意多矣彼生与君言死而背之者是小人穿窬之行君子所不譏也夫立嫡以長正也獻公溺於嬖寵廢長立少荀息爲國正卿君所倚信不能明白禮義以格君心之非而遽以死許之是則荀息之言玷於獻公未没之前而不可救於巳没之後也然則左氏之志所以貶荀息而非所以爲褒也致知在格物論人之情莫不好善而惡惡慕是而羞非然善且是者蓋寡惡且非者實多何哉皆物誘之也物迫之也桀紂亦知禹湯之爲聖也而所爲与之反者不能勝其欲心故也盗跖亦知顔閔之爲賢也而所爲与之反者不能勝其利心故也不軌之民非不知穿窬探囊之可羞也而冒行之驅於飢寒故也失節之臣亦非不知反君事讎之可愧也而忍處之逼於刑禍故也况於學者豈不知仁義之美㢘恥之尚哉斗升之秩錙銖之利誘於前則趨之如流水豈能安展禽之黜樂顔子之貧也動色之怒毫末之害迫於後則畏之如烈火豈能守伯夷之餓徇比干之死乎如此則何暇仁義之思廉恥之顧哉不惟不思与不顧也抑亦莫之知也譬如逐獸者不見泰山彈雀者不覺露之霑衣也, WYG: ''}
