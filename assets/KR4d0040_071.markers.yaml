  - {type: variant, offset: 2106, length: 158, content: 至微失之甚逺故聖人之用機也似之易曰機者動之微吉之先見者也又曰君子見幾而作不俟終日然則機者事之未著萌牙耑兆之時聖人眇然見之能去禍而取福迎吉而禦凶所以爲神也聖人之所慎無過機者故曰兢兢業業一日二日万機也權者銓也所以平輕重也聖人之用權也必將校輕重啇緩急彼重而此輕則舎此而取彼彼緩而此急則去彼而就此取捨去就之間不離於道乃所謂權, WYG: ''}
