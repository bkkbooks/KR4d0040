  - {type: line-break, offset: 6141, content: '', id: KR4d0040_SBCK_071-14b04}
  - {type: variant, offset: 6141, length: 1, content: 謂, WYG: 事}
  - {type: variant, offset: 6142, length: 1, content: 命, WYG: 者}
  - {type: variant, offset: 6144, length: 1, content: 能, WYG: 事之生未有不本乎意}
  - {type: variant, offset: 6146, length: 1, content: 飬, WYG: 也意必自欲欲既立於此矣於是乎有從有違從則有喜有樂有愛違則有怒有哀有惡此人之常情也愛實生貪惡實生暴貪暴惡之大者也是以聖人除其萌塞其源惡奚自而至哉或曰毋意於惡既聞矣敢問聖人亦毋意於善乎曰不然聖人之為善豈有意乎其間哉事至而應}
  - {type: page-break, offset: 6146, content: '', id: KR4d0040_WYG_074-11a, image: WYG1094/WYG1094-0675c.png}
  - {type: variant, offset: 6149, length: 0, content: '', WYG: 禮義耳禮者履也循禮則事無不行義者宜也守義則事無不得聖人執禮義以待事不為善而善至矣聖人豈有意乎其間哉或曰然則聖人之心其猶死灰乎曰不然聖人之心如宿火耳夫火宿之則晦發之則光引之則然鼓之則熾既而復掩之則乃晦矣深而不消久而不滅者其宿火乎聖人之心亦然治其心以待物物至而應事至而辨豈若死灰哉灰死則不復然矣奚所用哉或曰毋固毋必奚以異乎曰在我為固在人為必聖人出處語黙惟義所在無可無不可奚其固成敗禍}
  - {type: page-break, offset: 6149, content: '', id: KR4d0040_WYG_074-11b, image: WYG1094/WYG1094-0675d.png}
  - {type: variant, offset: 6150, length: 0, content: '', WYG: 繫命所遭誰得而知之奚其必或曰然則何以終於毋我曰有意有必有固則有我有我則私私實生蔽是故泰山觸額而不見雷霆破柱而不聞無意無必無固則無我無我則公公實生明是故秋毫過目無不見也飛蚊厯耳無不聞也其得失豈不逺哉求用元豐六年作或曰士不好富貴則為士者不得其用刑賞不行矣迃叟曰小人有才必求用於世以利其身不賞不勸不刑不懲君子有才亦求用於世以行其道勸不待賞懲不待刑自古亂臣賊子未有不出於好富貴者也為上者亦何利焉負恩元豐七年四月二十八日作迃叟曰受人恩而不忍負者其為子必孝為臣必忠羨厭元豐七年三月十五日作迃叟曰人情苦厭其所有羨其所不可得未得則羨巳得則厭厭而求新則為惡無不至矣老釋元豐七年十二月二日作或問老釋有取乎迃叟曰有或曰何取曰釋取其空老取其無為自然捨是無取也或曰空則人不為善無為則人不可治奈何曰非謂其然也空取其無利欲之心善則死而不朽非空矣無為取其因任治則一日萬㡬有為矣鑿龍門辨元豐七年十二月二日作或問禹鑿龍門闢伊闕有諸迃叟曰龍門伊闕天所為也禹治之耳非山横其前水壅其流禹始鑿而闢之然後通也或曰何以知之曰孟子云禹之行水行其所無事若鑿山以通水不可謂之無事矣無為賛元豐八年正月十九日作學黄老者以心如死灰形如稿木為無為迃叟以為不然作無為賛治心以正保躬以靜進退有義得失有命守道在巳成功則天夫復何為莫非自然聖窮聖人専以利人為心於術無不知也穀而可辟則不教人耒耜矣死而可違則不教人棺槨矣夫豈非天使民食且死雖聖人}
  - {type: page-break, offset: 6150, content: '', id: KR4d0040_WYG_074-12a, image: WYG1094/WYG1094-0676a.png}
  - {type: page-break, offset: 6150, content: '', id: KR4d0040_WYG_074-12b, image: WYG1094/WYG1094-0676b.png}
  - {type: page-break, offset: 6150, content: '', id: KR4d0040_WYG_074-13a, image: WYG1094/WYG1094-0676c.png}
  - {type: page-break, offset: 6150, content: '', id: KR4d0040_WYG_074-13b, image: WYG1094/WYG1094-0676d.png}
  - {type: variant, offset: 6152, length: 0, content: '', WYG: 違乎諱有人之情諱有而不諱無離婁之明人謂之瞽不愠矣栁下惠之和人謂之汚不怍矣斥莊或曰莊子之文人不能為也迃夫曰君子之學為道乎為文乎夫唯文勝而道不至}
  - {type: page-break, offset: 6152, content: '', id: KR4d0040_WYG_074-14a, image: WYG1094/WYG1094-0677a.png}
  - {type: variant, offset: 6153, length: 0, content: '', WYG: 君子惡諸是猶朽屋而塗丹雘不可處也眢井而羃綺繢不可履也烏喙而漬飴糖不可嘗也而子獨嗜之乎或曰莊子之辨雖當世宿學不能自解迃夫曰然則佞人也堯之所畏舜之所難孔子之所惡是青蠅之變白黑者也而子獨悦之乎辨揚或曰揚子之諂也以王莽為可以繼周公軼阿衡迃夫曰得巳哉揚子之為書也品藻當世蜀莊子真仲元靡不及焉莽宰天下而自況於伊周敢遺諸子何鮑之死不可不畏也雖然莽自況伊周則與之況黄虞則不與也其志將曰為伊周而止斯可矣不止而至於簒伊周豈然哉無黨或曰吾子擯莊而引揚或者為黨乎曰無黨也使莊為揚書斯與之矣揚為莊言斯拒之矣孰黨哉兼容或曰甚矣子道之隘也奚容之不兼迃夫曰沱潛之於江也榛楛之於山也兼容焉可也莠之於苖也冰之於火也欲兼得乎哉指過或曰有人於此人指其過而告之則喜何如迃夫曰君子也或曰曷若無過而指諸迃夫曰君子履中正而行者也故有過則人得而指諸若夫不中不正之人終日所為皆過也又安得而指之難能或曰堯舜之徳何以為難能迃夫曰舜自修於畎畝之中而聞於堯此舜之難也舜在畎畝之中而堯知之此堯之難也三欺迃夫曰鞠躬便辟不足為恭長號流涕不足為哀弊衣糲食不足為儉三者以之欺人可矣感人則未也君子所以感人者其惟誠乎欺人者不旋踵人必知之感人者益久而人益信之官失迃叟曰世之人不以耳視而目食者鮮矣聞者駭曰何謂也迃叟曰衣冠所以為容觀也稱體斯美矣世人捨其所稱聞人所尚而慕之豈非以耳視者乎飲食之物所以為味也適口斯善矣世人取果餌而刻鏤之朱綠之以為盤案之玩豈非以目食者乎天人迃叟曰天之所不能為而人能之者人也人之所不能為而天能之者天也稼穡人也豐歉天也傳家集巻七十四欽定四庫全書傳家集巻七十五宋司馬光撰格投壺新格熙寧五年作傳曰張而不弛文武弗能也弛而不張文武弗為也一張一弛文武之道也君子學道從政勤勞罷倦必從容宴息以養志游神故可久也蕩而無度將以自}
