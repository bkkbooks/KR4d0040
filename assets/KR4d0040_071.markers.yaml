  - {type: variant, offset: 6095, length: 3, content: 䊸朱懷, WYG: 吾素愛浮屠法里中有古寺廢已乆吾當帥里人脩之弃家處其中不復為爾母矣里人聞之争助以財不日立堂殿厨廡塑繪佛像營儲㣥皆備毎戒其子毋得至寺曰寺有衆人之財将以興佛事吾一毫不敢私也汝來使吾無以自明}
