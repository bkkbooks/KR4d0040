  - {type: variant, offset: 6154, length: 0, content: '', WYG: 故聖人制禮}
  - {type: variant, offset: 6155, length: 0, content: '', WYG: 為之節因以合朋友之和飾賔主之歡且寓其教焉夫投壺細事遊戲之類而聖人}
  - {type: page-break, offset: 6155, content: '', id: KR4d0040_WYG_075-1b, image: WYG1094/WYG1094-0679b.png}
  - {type: variant, offset: 6156, length: 1, content: 禍, WYG: 之以為禮用諸鄉黨用諸邦國其故何哉鄭康成曰投壺射之細也古者君子射以觀徳為其心平體正端壹審固然後能中故也蓋投壺亦猶是矣未審度於此而取中於彼仁道存焉疑畏則疎惰慢則失義方象焉左右前却過分則差}
  - {type: variant, offset: 6159, length: 3, content: 曰有德, WYG: 著焉得十失二成功盡棄誡慎明焉是故投壺可以治心可以修身可以為國可以觀人何以言之夫投壺}
  - {type: 'kr:newline', offset: 6161, content: '

