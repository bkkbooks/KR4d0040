  - {type: line-break, offset: 6121, content: '', id: KR4d0040_SBCK_071-14b03}
  - {type: variant, offset: 6123, length: 0, content: '', WYG: 困苦以終其身然其遺風餘烈數百千年而人猶以為法曏使其人狹道以求容邇志以取合庳言以趨功雖當時貴為卿相利止於其躬榮盡於其生惡得餘澤以及後世哉如余者患}
  - {type: variant, offset: 6124, length: 0, content: '', WYG: 能迃而巳矣迃何病哉辨庸或謂迃夫曰子之言甚庸衆人之所及也惡足貴哉迃夫曰然余學先王之道勤且久矣惟其性之惛也苦心勞神而不自知猶未免夫庸也雖然古之天地有以異於今乎古之萬物有以異於今乎古之性情有以異於今乎天地不易也日月無變也萬物自若也性情如故也道何為而獨變哉子之於道也將厭常而好新譬夫之楚者不之南而之北之齊者不之東而之西信可謂殊於衆人矣得無所適}
  - {type: page-break, offset: 6124, content: '', id: KR4d0040_WYG_074-2b, image: WYG1094/WYG1094-0671b.png}
  - {type: page-break, offset: 6124, content: '', id: KR4d0040_WYG_074-3a, image: WYG1094/WYG1094-0671c.png}
  - {type: variant, offset: 6126, length: 0, content: '', WYG: 所求愈勤而愈逺邪嗚呼孝慈仁義忠信禮}
  - {type: variant, offset: 6127, length: 0, content: '', WYG: 自生民以來談之至今矣安得不庸哉如余者懼不能庸而巳矣庸何病哉士則或曰為士何如迃夫曰士者事天以順交人以謹謹司其分不敢失隕而巳矣或曰為士者亦事天乎曰是何言}
  - {type: variant, offset: 6128, length: 2, content: 劉康, WYG: 天者萬物之父也父之命子不敢逆君之言臣不敢違父曰前子不敢不前父曰止子不敢不止臣之於君亦然故違君之言臣不順也逆父之命子不孝也不順不孝者人得而刑之順且孝者人得而賞之違天之命者天得而刑之順天之命者天得而賞之或曰何謂違天之命曰天使汝窮而汝强通之天使汝愚而汝强智之若是者必得天刑或曰何謂天刑曰人之刑賞刑賞其身天之刑賞刑賞其神故天之所賞者其神間靜而佚樂以考終其命天之所刑者其神勞苦而愁困以夭折其生彼雖僂然而白首猶貳負之臣桎梏而處諸石下雖踰千嵗惡足稱壽哉或曰夫士者當美國家利百姓功施當時澤及後世豈獨齪齪然謹司其分不敢失隕而巳乎曰非謂其然也智愚勇怯貴賤貧富天之分也君明臣忠父慈子孝人之分也僣天之分必有天災失人之分必有人殃堯舜禹湯文武勤勞天下周}
  - {type: page-break, offset: 6128, content: '', id: KR4d0040_WYG_074-3b, image: WYG1094/WYG1094-0671d.png}
  - {type: page-break, offset: 6128, content: '', id: KR4d0040_WYG_074-4a, image: WYG1094/WYG1094-0672a.png}
  - {type: variant, offset: 6131, length: 0, content: '', WYG: 輔相致太平孔子以詩書禮樂教洙泗顔淵簞食瓢飲安於陋巷雖徳業異守出處異趣如此其逺也何嘗捨其分而妄為哉言戒迃夫}
  - {type: page-break, offset: 6131, content: '', id: KR4d0040_WYG_074-4b, image: WYG1094/WYG1094-0672b.png}
  - {type: variant, offset: 6132, length: 1, content: 民, WYG: 言不可不重也子不見鐘鼓乎夫鐘鼓叩之然後鳴鏗訇鏜􅝅人不以為異也若不叩自鳴人孰不謂之祅邪可以言而不言猶叩之而不鳴也亦為廢鐘鼓矣䘌齒迃夫病䘌齒呻吟之聲達於四鄰通夕不寐有道士過之問曰子知病之所來乎曰不知也道士曰病來自天天且取子之齒以食食骨之蟲而子拒之以違天也夫天者子之所}
  - {type: page-break, offset: 6132, content: '', id: KR4d0040_WYG_074-5a, image: WYG1094/WYG1094-0672c.png}
  - {type: variant, offset: 6134, length: 0, content: '', WYG: 命也若之何拒之其必與之迃叟曰諾於是以齒與蟲惽然而寐一夕而愈蠆祝迃夫夜立於庭拊樹而蠆螫其手捧手吟呼痛徹於心家人呼祝師祝之祝師曰子姑勿以蠆為慘烈以為凡蟲而藐之曰是惡能苦我哉則痛巳矣從之少選而痛息迺謝祝師曰爾何術而能攘蠆之毒如是其速也祝師曰蠆不汝毒也汝自召之余不汝攘也汝自攘之夫召與攘皆非我術之所能及也子自為之也於是迃夫嘆曰嘻利害憂樂之毒人也豈直蠆尾而巳哉人自召之人自攘之亦若是而巳矣飯車天雨迃夫出見飯車息於高蹊者指謂其徒曰是車也將覆不久矣行未十步聞讙聲顧見其車巳覆其徒問曰子何由知之迃夫曰吾以人事知之夫天雨道濘而蹊獨不濡又狹而高是衆人之所趣也而車不量其力固狹擅高久留不去以妨衆人之欲進者其能無覆乎禍有鉅於此者奚飯車之足云拾樵迃夫見童子拾樵於道約曰見樵先呼者得之後毋得爭也皆曰諾既而行相與笑語戲狎至驩也瞲然見横芥於道其一先呼而衆童子爭之遂相撻擊有傷者迃夫惕然亟歸而嘆曰必天下之利大於横芥者多矣吾不知戒而日與人遊恃其驩而信其約一旦有先呼而鬭者能無傷乎知非嘉祐三年五月二十五日作或曰蘧伯玉五十而知四十九年非信乎曰何啻其然也古之君子好學者有垂死而知其未死之前所為非者況五十乎夫道如山也愈升而愈高如路也愈行而愈逺學者亦盡其力而止耳自非聖人有能窮其高逺者哉天人熙寧七年三月十六日作迃叟曰天力之所不及者人也故有耕耘斂藏人力之所不及者天也故有水旱螟蝗無怪迃叟曰有兹事必有兹理無兹理必無兹事世人之怪怪所希見由明者視之天下無可怪之事理性元豐二年十月二十八日作易曰窮理盡性以至於命世之高論者競為幽僻之語以欺人使人跂懸而不可及憒瞀而不能知則盡而捨之其實奚逺哉是不是理也才不才性也遇不遇命也事親元豐四年作迃叟事親無以踰人能不欺而巳矣其事君亦然事神元豐四年正月十六日作或問迃叟事神乎曰事神或曰何神之事曰事其心或曰其事之何如曰至簡矣不黍稷不犧牲惟不欺之為用君子上戴天下履地中函心雖欲欺之其可得乎寛猛元豐四年十月作迃叟曰寛而疾惡嚴而原情政之善者也回心或問子能無心乎迃叟曰不能若夫回心則庶㡬矣何謂回心曰去惡而從善捨非而從是人或知之而不能徙以為如制駻馬如斡磻石之難也靜而思之在我而巳如轉戸樞何難之有無益元豐六年二月十七日作迃叟曰言而無益不若勿言為而無益不若勿為余久知之病未能行也學要元豐六年五月二日作迃叟曰學者所以求治心也學雖多而心不治安以學為治心元豐六年六月二十三日作迃叟曰小人治迹君子治心文害元豐六年七月十八日作或謂迃叟子於道則得其一二矣惜乎無文以發之迃叟曰然君子有文以明道小人有文以發身夫變白以為黑轉南以為北非小人有文者孰能之道大元豐六年八月一日作迃叟曰聖人之道如天地}
