  - {type: variant, offset: 5781, length: 0, content: '', WYG: 弟永一尤孝友㢘謹過於人熈寕初巫咸水入夏縣城民溺死者以百數永一執竿立門首有佗人物流入門者輙擿出之有僧寓錢數萬於其室居無何僧自經死永一遽詣縣自陳請以錢歸其弟子郷人負其債乆不償者永一輒毁劵以愧其}
  - {type: variant, offset: 5782, length: 0, content: '', WYG: 其行事類如此有周文粲者其兄嗜酒仰文粲為生兄或時酗毆文粲其鄰人不平而唁之文粲怒曰吾兄未嘗毆我汝何離間吾兄弟也有蘇慶文者事繼母以孝聞嘗語其婦曰汝事吾母小不謹必逐汝繼母少寡而無子由是安其室終身元豐中朝廷脩景靈宫調天下畫工詣京師事畢有詔選試其優者留翰林授官禄有臺亨者名第一以父老固辭歸養於田里此五人與余同縣故余得而知之悲夫天下布衣之士刻志厲行而人莫知者可勝數哉始太之喪其父也余兄弟賻以千錢且為書致之曰禮凡有喪佗人助之珠玉曰含車馬曰賵貨財曰賻衣服曰襚今物雖薄欲人之可繼也乆之太請刻其書於石曰曏也郷人不知有賻禮自太父之喪郷人稍稍行之太欲廣其傳由吾郷以及鄰縣由鄰縣以逹四方使民間皆去弊俗而入於禮豈小補哉余益美其志因諭之曰是書不足刻余竊慕君子樂道人之善請書若兄弟及周文粲蘇慶文臺亨所為以傳於世庶㡬使為善者不以隠㣲而自懈焉元豐六年十一月壬寅朔涑水迂叟序傳家集巻六十九欽定四庫全書傳家集巻七十宋司馬光撰序三送即景微序送同年即兄景微歸會稽榮覲序進士此科見重於時乆矣自兩漢而下選舉之盛無與為比廼至販鬻給役之徒皆知以為美尚是以得之者矜夸滿志焜燿於物如謂天下莫巳若也亦何惑哉賢者居世㑹當蹈仁履義以徳自顯區區外名豈足恃邪即景微與余周旋甚悉余備知之其為人剛不可校柔不可犯和易以為樂節正以為禮由七品官舉進士一上中選可謂美矣然未嘗有偃蹇之容自滿之意或未識者卒然遇之尚不知其為舉人又焉知其有科級邪所謂以徳自顯者殆無過此乎家君與尊諫議景徳中同年登第在朝廷最名相善余又與景微以䕃籍同官偕舉進士送名於天府覆試於南廟以至登第未嘗異處古人有言朋友世親如我比者固不踈矣今将泛舟南下拜親於越謂余必以文序別余識荒陋非不知辭顧以非余無能紀其實美者故直書以贈之時景祐五年季夏司馬光序送李揆之序古者朋友将别必有言以相贈與處也近世多為之序序者其亦贈處之道歟然世俗失之往往崇虚辭相歎譽曽無一言以為規是豈昔人贈處之道哉愚以為朋友之道譽其善規其過專譽而不規路人而聚處飲酒於市道者耳光於揆之非直同官而已實朋友也於其行又可無言以贈之揆之名相子孫聦逹有美才習於時務觀其行能殆無所復擇矣然為之友者猶舉其毛髪之闕而告之誠欲就其全也夫人非至聖必有短非至愚必有長至愚之難值亦猶至聖之不世出也故短長雜者舉世比肩是也是以君子之取人也不求備稱其善不計其惡求其工不責其拙如此故人竭其用而恱從之怨憎不至而功業榮焉然則垢面而險眥操耒而胥靡者尚未可輕辱而易視也禹曰知人則哲惟帝其難之堯禹以為難則凡人安得謂之易人事常不可測夫又詎知操耒者不為阿衡而胥靡者不為傅説若之何其可以心目斷也竊嘗聞之夫智者攘患常於至微著而攘之則無及巳昔智伯一㑹而辱二主一臣以成鑿臺之禍以智伯之強人莫之害失一言於樽爼之際其禍章章如此况無其勢取侮易矣夏書曰一人三失怨豈在明不見是圖足下行矣慎之智或召災敏或賈禍愚不可忽鄙不可侮是皆無損於人不宜於身勉之哉時思鄙言光之贈盡此而已未知足下復何以處我也慶歴乙酉嵗二月庚戍序送李子儀序皇祐三年作寳元中光從事在蘇子儀僑居州下始得從之遊竊嘗與僚友議曰人之裕於才者或􅄶於行豐於行者或歉於才要之不能得兼若子儀者才如是行如是佗日吾屬其敢望乎間二年子儀升進士第名聲暴灼於薦紳間光聞之喜曰所期果不負矣又五年光與子儀俱官太學日夕相從講道甚樂不幸子儀遭先府君憂去職服除來還則光去遷佗官雖不得亟見然慕重其為人常若在旁也皇祐三年丞相文公出鎮許昌士大夫願從後車以自效於幕下者甚衆公無所取獨與子儀俱夫以文公之明且公而子儀獨應其選其不輕而重可知矣論者猶謂子儀不當舎中都遊外方夫玉巨用之則為璧為圭細用之則為環為玦玉能明潔潤澤而巳矣璧與圭環與玦唯工者之所為玉豈能自制哉行矣子儀君子之道猶玉也亦烏適而不見貴乎送孟翺宰宜君序天之所以賜人賢不肖之分曰心智而巳矣故佗可能也心智之叡明強識不肖者竭力無以及焉仲習為夏縣尉封域之内山澤之夷險道途之逺邇邑落之踈宻無不歴歴詳其名數吏卒數百人民踰萬室性行之善惡家貲之豐約居處之里囷倉之數皆能條例而詮次之凡人居官朞嵗不能悉吏卒之名氏而仲習小大畢舉如指諸掌抑可謂叡明而強識矣國家謂親於民事者無若令於三王之世伯子男之職也而以資秩乆次為之甚無謂乃詔二千石舉明逹政事者充其官仲習以是得宜君令夫為政者患於不知民之情偽下之得失上蔽下壅故賞罰糾紛而不治今仲習之精力乃如此以從小邑之政是猶激疾風以振鴻毛委洪波以滅炬火何足言者異日居相府立柱下總天下之圖書承明主之顧問應答如響畫地成圖亦誰得居其右哉戊寅嵗僕與仲習同登進士第辛巳嵗僕以憂去官歸鄉里日從仲習遊睹其強識未嘗不咨嗟駭服故於其行也書以贈之送丁浦江序始僕為児時家於夀之安豐浦江以年少氣雋誦書屬文聞於縣中家之父兄皆祝僕曰佗日得如丁君足矣及壮侍親之呉浦江為椽於潤州州人稱曰丁君為治精敏肅給凡州之僚吏無與比者僕乃知丁君非徒以文自髙又能以政自力信乎其才之周也謂其去此而升美仕若巨河之决駿馬之逸沛然莫之能禦也間九年復相遇於京師則猶服故時藍衫守銓門求一官礥然乆之乃得婺之浦江同時軰流及後來者仕宦率居其右僕然後喟然嘆曰才乎才乎信不足恃者邪抑又聞之天将降大任於是人也必先空乏其身行拂亂其所為浦江近是乎况浦江齒尚壮志尚鋭以斯之才而濟之以無倦則徳業之涯未易前知也於其行聊序以勸之送胡完夫序舜之取士敷納以言明庶以功車服以庸考其言中於道試之事克有功然後用之故能舉十六相恭巳不為而天下大治也近世取士不然一决之以文辭噫文辭豈能盡取士之道邪天下病是乆矣明天子知之廼詔有司自今進士髙第皆先試之小官使知為下之勞而熟於民之疾苦然後察其功而舉之雖置以為卿相無不可者嗚呼此誰發哉乃大舜之業也晋陵胡完夫以進士貢於州試於有司覆於天子之庭第其名未嘗在一二人之後則完夫之文辭可知矣其試於有司也光不佞尸其事得竊觀其論䇿盖非特文辭之美也廼能發明聖人之淵源叶於古而適於今信乎其言能中於道者邪既中於道矣自今日以往天子将又試之以事異日完夫能擴其道以充其言則天子将引而置之卿相之位庶㡬乎元凱之功復見於今日矣嗚呼天子一更法度復古之道其功業之歸廼巍巍如是豈不偉歟噫是道也不難至在完夫勉之而巳矣送通山令郝戭序通山郝明府年四十餘父嘗舉進士老而無成以其志之不獲也雖子登進士第仕至長吏終歉歉不自足明府亦以親之不怡也不以仕為榮乃詣闕上書請致仕而為其親匃一官朝廷雖嘉其意以無故事不之許明府将之官戚戚若受謫者且曰通山道險逺吾親必不肯行将留妻子侍吾親而單車之官至則復請期於成吾志焉明府於光母黨也光聞其言瞿然慙曰嘗聞古之人仕以為親非為身也若明府之仕其真無意於身者邪如光者禄既不及於親而又無補於君役役然耗廩食以飽妻子乆留而不能去得不為君子之罪人邪嗚呼明府誠可頌而礪世人矣嘉祐八年八月十六日涑水司馬光序送李公明序東之李相廸之子治平四年夏龍圖閣直學士工部尚書兼侍讀李公公明得謝於朝以太子少保致仕故事告老者不復謝辭徑歸其家天子謂公明歴事四朝清慎公方進退以禮不可與佗臣比特召入對賜之坐慰勞乆之又特置餞宴於資善堂唯講讀之官及記起居者凡七人得與焉比終宴天子六遣使者存問勸侑加賜白金御茶給優俸又詔以梓宫在殯不欲自為詩凡與宴之官皆命賦詩以寵其行仍别録一通以聞自前世稱告老而榮者莫若漢二踈當是時宣帝不過賜之二十金而巳未聞有恩禮若今之盛者也嗚呼天子之安養耆壽優崇有徳勤厚周宻誠古今所未有也公明少為丞相子長為臺閣顯官迄今老而去位耳目聦明手足輕利諸子為九卿牧守而性皆孝謹洛陽佳園宅此數者又二踈所不能備也然則公明福禄完美顯榮光大亦古今所未有也先皇帝時公明數求致仕未之得光嘗侍坐從容請曰近年雖七十而康寧如是獨不可強為天子少留邪公明曰所貴於致仕者欲及其身之無恙自樂於鄉黨耳必待不任朝謁輿疾而歸是不得巳豈止足之謂邪光忻然服其言益知賢者所存固非庸人所能及也昔先子登進士第先相國為舉首故光於公明兄弟行也資善之㑹光以新去經席不得與焉於其行也僚友復設祖道供張於西郊光又以御史之職不得與焉其恨恨可言邪故聊序其事以為別從表弟右諫議大夫權御史中丞涑水司馬光序傳家集巻七十欽定四庫全書傳家集巻七十一宋司馬光撰記仁宗賜張公御書記皇祐初故右諫議大夫張公為翰林侍讀學士仁宗皇帝謂侍臣曰朕宅帝位㡬三十年天下名儒皆率與之遊自得張某使我日聞所未聞因書紙為博學字命使者即其家賜之當是時國家中外無事天子方嚮藝文同侍殿閣者皆名臣之選無不環觀愧羨莫敢望云公既沒十有六年公之子子瑾字材之将摹著其書於石謂光曰必為之記光曰昔公知滑州光從事於幕下嘗聞公之言曰余平生喜書讀之不啻數十百過其簡編弊矣然毎發之必有新獲之意焉噫公之篤學如此宜其當明主之知為多聞之友受殊常之寵成不朽之名也使曩也先皇帝賞公以萬金於今何有固不若垂一言之褒其為子孫光榮世世無窮也夫知人則哲帝堯之所難仲尼門人以千數獨稱顔淵為好學今材之所為欲以彰先皇帝之知人而揚先公之好學也夫彰君之明忠也揚父之美孝也惟忠與孝材之兩有焉光也雖無文又焉敢無一言以表著其實乎韓魏公祠堂記元豐七年作沒而祠之禮也由漢以來牧守有恵政於民者或為之生祠雖非先王之制皆發於人之去思亦不可廢也然年時寖逺人寖忘之惟唐狄梁公為魏州刺史屬契丹㓂河北梁公省徹戰守之備撫綏彫弊之民民安而虜自退魏人祠之至今血食熈寜初河北水溢地大震官寺民居蕩覆者大半詔以淮南節度使司徒兼侍中韓魏公為河北安撫使判大名府兼北京留守公既愛民如愛子治民如治家去其疾忘巳之疾閔其勞忘已之勞未㡬居者以安流者以還饑者以充乏者以足羣心既和嵗則屢豐在魏五年徙判相州魏人泣涕遮止數日乃得去魏人思公而不得見也相與立祠於熈寜禪院塐公像而事之後二年公薨於相州魏人聞之争奔走哭祠下雲合而雷動連日乃稍息自是毎嵗公生及違世之日皆來致祠作佛事未嘗少懈噫公之徳及一方功施一時者魏人固知之矣至於徳及海内功施後世者亦嘗知之乎公為宰相十年當仁宗之末英宗之初朝廷多故公臨大節處危疑苟利國家知無不為若湍水之赴深壑無所疑憚或諫曰公所為如是誠善萬一蹉跌豈惟身不自保恐家無處所殆非明哲之所尚也公嘆曰此何言也凡為人臣者盡力以事君死生以之顧事之是非何如耳至於成敗天也豈可豫憂其不成遂輟不為哉聞者愧服其忠勇如此故能光輔三后大濟艱難使中外之人餔啜嬉遊自若曽無驚視傾聽竊語之警坐置天下於太寧公之力也嗚呼公與狄梁公皆有恵政於魏故魏人祠之然其為逺近所尊慕年時雖逺而不毁非有大功於社稷為神祗所相佑能如是乎况梁公之功顯天下皆知之魏公之功隠天下或未能盡知也然則魏公不又賢乎宜其與梁公之祠並立於魏享祀無窮公薨後九年魏人以状抵西京俾光為記将刻於石竊惟梁公二記乃李邕馮宿之文光實何人敢不自量顧魏人之美意不可抑又欲以其所未知者諗之故不敢辭陳氏四令祠堂記故左諫議大夫贈太師中書令秦國陳公某有三子長曰某國文忠公某官至樞宻使同平章事左僕射次曰鄭國文恵公某官至户部侍郎平章事太子太師致仕㓜曰某國康肅公某官至武寜軍節度使皆贈太師尚書令兼中書令始秦公為濟源令縣西龍潭有延慶佛舍三子相與為學其中既而相繼登進士科文忠康肅公仍居羣士之首遂接踵為将相始大其家子孫蕃衍多以才能致美官棊布中外故當世稱衣冠之盛者推陳氏其後文忠公自樞宻出判河陽文恵公與其子主客郎中某孫虞部員外郎某康肅公之子祠部郎中某前後皆為京西轉運使主客君之子某復為濟源尉濟源河陽之屬縣河陽京西之屬郡也四世凡七人莅官於是故濟源之人被陳氏之政為多秦公尤有恩於民能使其民既去而思之虞部君嘗行部過濟源遊龍潭佛舎見秦公善政銘真宗皇帝賜文忠公詩主客君題名皆刻於石歎曰吾家所以能顯大於世自非曽祖父勤施仁政於民三祖父力學以取富貴何從而致之乎至於今子孫䝉福禄不絶豈可不知其所自邪乃搆堂於佛舎之側畫四公之像而祠之集三石刻皆置祠下且屬光為之記光曰光之文不足以發揚先君之美不敢為虞部曰不然某之建是祠堂非敢自矜奕世之美盖欲來者見之知愛民好學可以大其家有以勸也光曰如君之言其志逺其益大矣光何敢辭若夫四公之事業則有國史在光不敢及也先公遺文記元豐三年}
