  - {type: variant, offset: 4628, length: 885, content: 下國家何爲而不治哉太學曰致知在格物格猶扞也禦也能扞禦外物然後能知至道矣鄭氏以格爲来或者猶未盡古人之意乎葬論葬者藏也孝子不忍其親之暴露故歛而藏之齎送不必厚厚者有損無益古人論之詳矣今人葬不厚於古而拘於隂陽禁忌則甚焉古者雖卜宅卜日蓋先謀人事之便然後質諸蓍龜庶無後艱耳無常地与常日也今之葬書乃相山川岡畎之形勢考歲月日時之支干以爲子孫貴賤貧冨壽夭賢愚皆繫焉非此地非此時不可葬也舉丗惑而信之於是喪親者往往乆而不葬問之曰歲月未利也又曰未有吉地也又曰遊宦逺方未得歸也又曰貧未能辨葬具也至有終身累丗而不葬遂弃失尸柩不知其處者嗚呼可不令人深歏愍哉人所貴於身後有子孫者爲能藏其形骸也其所爲乃如是曷若無子孫死於道路猶有仁者見而殣之耶先王制禮葬期逺不過七月今丗著令自王公以下皆三月而葬又禮末葬不變服食粥居倚廬哀親之未有所歸也旣葬然後漸有變除今之人背禮違法未葬而除喪從宦四方食稻衣錦飲酒作樂其心安乎人之貴賤貧冨壽天繫於天賢愚繫於人固無關預於葬就使皆如葬師之言爲人子者方當哀窮之際何忍不顧其親之暴露乃欲自營福利耶昔者吾諸祖之葬也家甚貧不能具棺槨自太尉公而下始有棺槨然金銀珠玉之物未甞以錙銖入於壙中將葬太尉公族人皆曰葬者家之大事奈何不詢隂陽此必不可吾兄伯康無如之何乃曰詢於隂陽則可矣安得良葬師而詢之族人曰近村有張生者良師也數縣皆用之兄乃召張生許以錢二萬張生野夫也丗爲葬師爲野人葬所得不過千錢聞之大喜兄曰汝能用吾言吾俾爾葬不用吾言將求它師張師曰惟命是聽於是兄自以己意處歳月日時及壙之淺深廣狹道路所從出皆取便於事者使張生以葬書縁飾之曰大吉以示族人族人皆恱無違異者今吾兄年七十九以列卿致仕吾年六十六忝備侍從宗族之後仕者二十有三人視它人之謹用葬書未必勝吾家也前年吾妻死棺成而歛裝辦而行壙成而葬未甞以一言詢隂陽家迄今亦無它故吾常疾隂陽家立邪說以惑衆爲丗患於喪家尤甚頃爲諌官甞奏乞禁天下葬書當時執政莫以爲意今著兹論庶俾後之子孫葬必以時欲知葬具之不必厚視吾祖欲知葬書之不足信視吾家元豐七年正月日具官司馬光述中和論君子從學貴於博求道貴於要道之要在治方寸之地而巳大禹謨曰人心惟危道心惟微惟精惟一允執厥中危則難安㣲則難明精, WYG: ''}
