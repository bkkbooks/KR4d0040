  - {type: variant, offset: 2051, length: 0, content: '', WYG: 為益豈不厚哉吕獻可章奏集序熈寕五年八月二十九日作歐陽觀文有言士學古懐道者仕於時不得為宰相必為諫官諫官與宰相等坐乎廟堂之上與天子論可否者宰相也立乎殿陛之前與天子争是非者諫官也宰相九卿而下失職者受責於有司諫官失職者取譏於君子有司之法行乎一時君子之譏著之䇿書而昭明垂之百世而不泯誠哉是言也然士之居其任果能不失職者亦鮮矣獻可為臺諫官前後凡若干年遇黜者三皆以彈奏執政確切不己天子重傷大臣意不得己而黜之其直聲赫然振動天下自餘百官之愆違政事之闕失苟與之同時無彊弱大小知無不言言無不盡如獻可者於其職業可謂無所愧負矣古之}
  - {type: page-break, offset: 2051, content: '', id: KR4d0040_WYG_069-3b, image: WYG1094/WYG1094-0635d.png}
