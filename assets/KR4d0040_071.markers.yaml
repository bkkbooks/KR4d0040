  - {type: variant, offset: 4438, length: 2, content: 物蔽, WYG: 由魏之壽亞之夭歟家公知杭州亞子噩以其先人詩集請因杭工刻諸板而傳之余以世俗不能識真貴於難得而賤於飽聞不若蔵之於家有同志者就而寫之則雖欲勿傳安得不傳若刻之於版有不知文者或敢譏評其否臧衆心無常從而和之是隕夫子之盛名不果刻序而歸之王内翰贈商雒龐主簿詩後序王詩云織女峯前貧主簿黄姑巖下舊詞臣乆棲枳棘方思替謾戴貂蟬不是真六里青山雲簇簇一條丹水石磷磷春來䰟夢應相似同是帝城南畔人至道初今觀文殿大學士始平公先君子贈中書令㫺為主簿商雒王公時自中書舎人謫官商州王公以文章獨歩當世乆宦巳通顯於朝加之剛簡峭直固不妄與人交然令君以九品官與相往來王公贈詩意好欵宻則令君為人可知巳至和初始平公以前相國在鄆從容出王公詩示光曰先君嘗有徳於商雒吏民至今思之其辭牒判署猶有寳蓄存者而况今守商州為我刻王公之詩於商雒以慰吏民之心光曰諾退而序其事并詩往刻焉并州學規後序嘉祐二年作天下所以化在於學百官所以治在於法然則學為化原法為治本兹二者又可忽歟前牧韓公既徙學而廣之又取法於大學及河南大名京兆府蘇州除苛補漏以為新規今牧龐公懼學者寖乆而寖忘}
