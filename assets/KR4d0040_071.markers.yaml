  - {type: page-break, offset: 6153, content: '', id: KR4d0040_WYG_074-16a, image: WYG1094/WYG1094-0678a.png}
  - {type: page-break, offset: 6153, content: '', id: KR4d0040_WYG_074-16b, image: WYG1094/WYG1094-0678b.png}
