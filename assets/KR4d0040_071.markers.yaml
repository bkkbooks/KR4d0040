  - {type: variant, offset: 6305, length: 7, content: 至大至剛以直飬, WYG: 俯身引臂挾巧取奇苟得}
  - {type: variant, offset: 6314, length: 1, content: 害, WYG: 愧豈非觀人之道歟由是言之聖人取以為禮宜矣彼博奕者以詭譎相高以殘賊相勝孔子猶曰飽食終日無所用心為之猶賢乎巳況投壺者又可鄙略而輕廢哉古者壺矢之制揖讓之容今雖闕焉然其遺風餘象猶彷彿也世傳投壺格圖皆以奇雋難得者為右是亦投瓊探􅍐之類耳非古禮之本意也余今更定新格増損舊圖以精宻者為右偶中者為下使夫用機徼倖者無所措其手焉壺口徑三寸耳徑一寸高一尺實以小豆壺去席二箭半箭十有二枚長二尺有四寸以全壺不失者為賢苟不能全則積算先滿百二十者勝後者負俱滿則餘算多者勝少者負為圖列之左方并各釋其指意焉有初箭十算首箭中者君子作事謀始以其能慎始故賞之第二箭以下連中不絶者皆五算若一箭不中次箭皆為散箭其違中内有貫耳及驍者其箭別計假若有初箭仍貫耳則二十算是也舊圖初箭一籌其次每箭加二籌盡四箭而止甚非勸功之道今自二箭以下連中不絶者皆賞之所以勉人於不解也全壺無算無算者不以耦之算數多少皆勝之也若兩人俱全則復計其餘算以次勝負夫為山九仞功虧一簣全壺實難故君子貴之有終十五算末箭中也靡}
  - {type: page-break, offset: 6314, content: '', id: KR4d0040_WYG_075-3a, image: WYG1094/WYG1094-0680c.png}
  - {type: page-break, offset: 6314, content: '', id: KR4d0040_WYG_075-3b, image: WYG1094/WYG1094-0680d.png}
  - {type: variant, offset: 6317, length: 0, content: '', WYG: 初鮮克有終故比之有初又加五算也散箭一算貫耳十算耳小於口而能中之是其用心愈精故賞之驍箭十算何謂之驍皆俊猛意也謂投而不中箭激反躍捷而得之復投而中者也為其巳失而復得之不逺復善補過者也故賞之若復投而貫耳者其算別計復投而不中者廢之敗壺不問巳有之算皆負謂十二箭皆不中大無功也若兩人皆敗則亦計餘算以決勝負横耳謂箭横加耳上舊五十籌横壺横加壺口舊四十籌皆依常算無賞偶然而横非投者工何足以賞若為後箭所擊而墜地者與不中同倚竿箭斜倚壺口中舊十五籌龍首倚竿正箭首正向已者舊十八籌龍尾倚竿而箭羽正向已者舊十五籌狼壺轉旋口上而成倚竿者舊十四籌帶劒貫耳不至地者舊十五籌耳倚竿舊十五籌皆廢其算傾邪險詖不在於善而舊圖以為奇箭多與之算甚無謂也今廢其算所以罰之然亦異於不中者故於連中全壺皆為通數若為後前所擊及同自墜壺若耳中者復計其算墜地者與不中倒中舊百二十籌倒耳舊不問籌數並滿壺中之算盡廢之顛倒反覆惡之大者奈何以為上賞今盡廢其算所以明逆應之}
