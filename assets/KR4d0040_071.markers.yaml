  - {type: variant, offset: 0, length: 1, content: 温, WYG: 也贈書心經後贈紹鑒元豐五年十二月十三日作余嘗聞學佛者言佛書入中國經律論三藏合五千四十八巻般若經獨居六百巻學者撮其要為心經一巻為之注者鄭預最簡而明余讀鄭注乃知佛書之要盡於空一字而已或問揚子人有齊死生同貧富等貴賤何如揚子曰作此者其有懼乎此經云照見五藴皆空度一切苦厄似與揚子同指然則釋老之道皆宜為憂患之用乎世稱韓文公不喜佛常排之余觀其與孟尚書書論大顛云能以理自勝不為事物侵亂乃知文公於書無所不觀盖嘗徧觀佛書取其精粹而排其糟粕耳不然何以知不為事物侵亂為學佛者所先邪今之學佛者自言得佛心作佛事然皆不免侵亂於事物則其人果何如哉西京僧官凡六員曰録曰首座曰副首座左右街各一有缺則選僧之有行業者補之又缺則以次上遷逮左録而止崇徳僧紹鑒既為左首座矣會足有㣲疾乃嘆曰吾弃家為僧固求自安逸今已病而猶自勤於僧職豈吾本心哉即投牒自請解去時左録新物故其徒皆止之以為宜待次補鑒不聴既解去明日右録亦物故補其處者乃位於鑒下之人也其徒皆為之恨鑒處之恬然噫鑒儻不知事物之空能如是乎鄭經刻石於天寳末今頗刓缺余賢鑒能不以所重易所輕且欲勸之俾全其所得乃命吏好冩一通以贈之諭諭若訥熈寧五年熈寧六年冬光在洛陽有衢州僧若訥袖書來見曰仁宗皇帝時得召對成化殿命講所學經且作頌三篇上甚喜後數日中使賜若訥紫衣辭曰臣所為不逺千里求見明主者欲獻其所學庶幾廣之於天下今陛下乃賜臣紫衣非臣志也臣不敢奉詔使者三返終辭不受上乃飛白安净二字以賜若訥若訥然後舉首加額受而藏之若訥野僧也生江湖間一旦萬乗之主召入禁中而訪所學授以二字盖師號之類也天下僧受師號者何可勝紀有能親屈帝筆如若訥之光榮者乎若訥是以不敢忘先帝不貲之恩思有以報之向聚吾師所述之經五千餘巻合為一藏名曰報恩經藏徧請朝廷輔佐之臣譔文書石瑑而立之今又將刻所賜二字於石以傳于後子為我序其事而記之光謝之曰光儒者素不習釋氏書將何以發明上人之學與受賜之由且文辭鄙陋何敢輙寓名諸公之末自陷不知量之罪乎若訥固請不已曰若訥去冬已嘗犯寒至洛值子西適秦不克見而返今兹復來非有他求欲得文而已若訥豈不知朝廷貴人及四方能文者甚衆欲為斯記者亦不鮮若訥皆不願得而唯子之求何子拒我之深乎光甚愧其言因諭之曰上人之志於光勤且厚如此光敢無辭以為復抑仁宗皇帝既嘉上人不受命服賜以二字豈師號之謂邪盖以褒勸上人之徳也上人亦嘗深思其指乎夫安净徳之美者也既曰安矣則於物宜無求既曰净矣則物不得而間之是故安如磐石雖加减萬鈞不為之低昻净如清水有一毫入之則累矣上人既能知先帝之大恩當謹守聖言而力行之以無負先帝之所期乃所以報也經藏奚為哉况光之文又足求邪訓訓儉示康吾本寒家世以清白相承吾性不喜華靡自為乳兒長者加以金銀華美之服輙羞赧弃去之二十忝科名聞喜宴獨不戴花同年曰君賜不可違也乃簮一花平生衣取蔽寒食取充腹亦不敢服垢弊以矯俗干名但順吾性而已衆人皆以奢靡為榮吾心獨以儉素為美人皆嗤吾固陋吾不以為病應之曰孔子稱與其不遜也寧固又曰以約失之者鮮矣又曰士志於道而恥惡衣惡食者未足與議也古人以儉為美徳今人乃以儉相詬病嘻異哉近歲風俗尤為侈靡走卒類士服農夫躡絲履吾記天聖中先公為羣牧判官客至未嘗不置酒或三行五行多不過七行酒沾於市果止於梨栗棗柿之類殽止於脯醢菜羮器用甆漆當時士大夫家皆然人不相非也會數而禮勤物薄而情厚近日士大夫家酒非内法果殽非逺方珍異食非多品器皿非滿案不敢會賔友常數日營聚然後敢發書苟或不然人争非之以為鄙吝故不隨俗靡者盖鮮矣嗟乎風俗頺弊如是居位者雖不能禁忍助之乎又聞昔李文靖公為相治居第於封邱門内㕔事前僅容旋馬或言其太隘公笑曰居第當傳子孫此為宰相㕔事誠隘為太祝奉禮㕔事已寛矣參政魯公為諫官真宗遣使急召之得於酒家既入問其所來以實對上曰卿為清望官柰何飲於酒肆對曰臣家貧客至無器皿殽果故就酒家觴之上以其無隱益重之張文節為相自奉飬如為河陽掌書記時所親或規之曰公今受俸不少而乃自奉若此公雖自信清約外人頗有公孫布被之譏公宜少從衆公嘆曰吾今日之俸雖舉家錦衣玉食何患不能顧人之常情由儉入奢易由奢入儉難吾今日之俸豈能常有身豈能常存一旦異於今日家人習奢已久不能頓儉必致失所豈若吾居位去位身在身亡常如一日乎嗚呼大賢之深謀逺慮豈庸人所及哉御孫曰儉徳之共也侈惡之大也共同也言有徳者皆由儉來也夫儉則寡欲君子寡欲則不役於物可以直道而行小人寡欲則能謹身節用逺罪豐家故曰儉徳之共也侈則多欲君子多欲則貪慕富貴枉道速禍小人多欲則多求妄用敗家喪身是以居官必賄居鄉必盗故曰侈惡之大也昔正考父饘鬻以餬口孟僖子知其後必有達人季文子相三君妾不衣帛馬不食粟君子以為忠管仲鏤簋朱紘山楶藻梲孔子鄙其小器公叔文子享衞靈公史鰌知其及禍及戍果以富得罪出亡何曽日食萬錢至孫以驕溢傾家石崇以奢靡誇人卒以此死東市近世冦莱公豪侈冠一時然以功業大人莫之非子孫習其家風今多窮困其餘以儉立名以侈自敗者多矣不可徧數聊舉數人以訓汝汝非徒身當服行當以訓汝子孫使知前輩之風俗云傳家集巻六十七欽定四庫全書傳家集巻六十八宋司馬光撰序一百官表總序四海至廣雖聖人不能獨治萬機至衆雖聖人不能徧知是故設官以分其事量能而授之任自生民以來有國家者莫之能易也唐虞夏商尚矣周官具存粲然大備降及秦漢迄于隋唐雖不能如三代之粹美然上下相維皆有條緒孔子稱惟器與名不可以假人又曰必也正名乎名之宜正者無若百官唐初職事官有六省一臺九寺三監十六衞十率府之屬其外又有勲官散官勲官以賞戰功散官以褒勤舊故必折馘執俘然後賜勲積資累考然後進階以其不可妄得故當時人以為榮及髙宗東封武后預政欲求媚於衆始有汎階自是品秩寖訛朱紫日繁矣肅宗之後四方糜沸兵革不息財力屈竭勲官不足以勸武功府庫不足以募戰士遂并職事官通用為賞不復選材無所愛吝將帥出征者皆給空名告身自開府至郎將聼臨事注名後又聴以信牒授人有至異姓王者於是金帛重而官爵輕矣或以大將軍告身纔易一醉其濫如此重以藩方䟦扈朝廷畏之窮極褒寵苟求姑息遂有朝編卒伍暮擁節旄夕解緹衣旦紆公衮者矣流及五代等衰益紊三公端揆之貴施於軍校衣紫執象之榮被於胥史名器之亂無此為甚大宋受命承其餘弊方綱紀大基未暇釐正故臺省寺監衞率之官止以辨班列之崇卑制廪祿之厚薄多無職業其所謂官者乃古之爵也所謂差遣者乃古之官也所謂職者乃古之加官也自餘功臣檢校官散官階勲爵邑徒為煩文人不復貴凡朝廷所以鼓舞羣倫緝熈庶績者曰官曰差遣曰職而已於三者之中復有名同實異交錯難知又遷徙去來常無虚日欲觀其大畧故自建隆以來文官知雜御史以上武官閤門使以上内臣押班以上遷除黜免刪其煩冗存其要實以倫類相從以先後相次為百官公卿表云河南志序元豐六年作周官有職方土訓誦訓之職掌道四方九州之事物以詔王知其利害後世學者為書以述地里亦其遺法也唐麗正殿直學士韋述為兩京記近故龍圖閣直學士宋君敏求字次道演之為河南長安志凡其廢興遷徙及宫室城郭坊市第舎縣鎮鄉里山川津梁亭驛廟寺陵墓之名數與古先之遺迹人物之俊秀守令之良能花卉之殊尤無不備載考諸韋記其詳不啻十餘倍開編粲然如指諸掌真慱物之書也次道性嗜學先正宣獻公蓄書三萬巻次道自毁齒至于白首從事其間未嘗一日捨置故其見聞博洽當時罕倫又閑習國家故事公私有疑咸往質焉又喜著書如唐書仁宗實録國史會要集注史記之類與衆共之或專脩而未成者皆不計外其手自纂述已成者凡四百五十巻盖昔人所著未有若此其多也次道既沒太尉潞公留守西京其子慶曽等奉河南志以請於公曰先人昔嘗佐此府叙其事尤詳惜其傳於世者甚鮮願因公刻印以廣之豈徒先人䝉不朽之賜於泉壌抑亦使四方之人未嘗至洛者得之如遊處已熟後世聞今日洛都之盛者得之如身逢目睹也幸公留意公從之且命光為之序光於次道友人也烏敢以固陋而辭劉道原十國紀年序皇祐初光為貢院屬官時有詔士能講觧經義者聴别奏名應詔者數十人趙周翰為侍講知貢舉問以春秋禮記大義其中一人所對最精詳先具注䟽次引先儒異説末以已意論而斷之凡二十問所對皆然主司驚異擢為第一及發糊名乃進士劉恕年十八矣光以是慕重之始與相識道原乃其字也道原是嵗賦詩論䇿亦入髙等殿試不中格更下國子監試講經復第一釋褐鉅鹿主簿遷和川令陸介夫為廣西帥奏掌機宜前世史自太史公所記下至周顯徳之末簡䇿極博而於科舉非所急故近歲學者多不讀鮮有能道之者獨道原篤好之為人强記紀傳之外閭里所録私記雜説無所不覽坐聴其談衮衮無窮上下數千載之細大之事如指掌皆有稽據可驗令人不覺心服英宗皇帝雅好稽古欲徧觀前世行事得失以為龜鑑光承乏侍臣嘗從容奏舊史文繁自布衣之士鮮能該通况天子一日萬機誠無暇周覧乞自戰國以還訖于顯徳凡闗國家之興衰繫衆庶之休戚善可為法惡可為戒者詮次為編年一書刪其浮長之辭庶於奏御差便上甚喜尋詔光編次歴代君臣事迹仍謂光曰卿自擇館閣英才共脩之光對曰館閣文學之士誠多至於専精史學臣未得而知所知者惟和川令劉恕一人而已上曰善退即奏召之與共脩書凡數年間史事之紛錯難治者則以諉之道原光䝉成而已今上即位更命其書曰資治通鑑王介甫與道原有舊深愛其才熈寧中介甫參大政欲引道原脩三司條例道原固辭以不習金穀之事因言天子方屬公以政事宜恢張堯舜之道以佐明主不應以財利為先介甫雖不能用亦未之怒道原嘗見之輙盡誠規益及吕獻可得罪知鄧州道原往見介甫曰公所以致人言盖亦有所未思因為條陳所更法令不合衆心者宜復其舊則議論自息介甫大怒遂與之絶未幾光出知永興軍道原曰我以直道忤執政今官長復去我何以自安且吾親老不可久留京師即奏乞監南康軍酒得之光尋判西京留臺奏遷書局於洛陽後數年道原奏請身詣光議脩書事朝廷許之道原水陸行數千里至洛陽自言比氣羸憊必病且死恐不復得再見留數月而歸未至家遭母䘮俄得風疾右手足偏廢伏枕再朞痛苦備至每呻吟之隙輙取書脩之病益篤乃束書歸之局中以元豐元年九月戊戌終官至秘書丞年止四十七嗟乎以道原之耿介其不容於人齟齬以沒固宜天何為復病而夭之邪此益使人痛惋惝怳而不能忘者也道原嗜學方其讀書家人呼之食至羮炙冷而不顧夜則卧思古今或不寐達旦在和川時以公事適野見劉聰太宰劉雄碑嘉平五年始改建元正舊史之失在洛陽與光偕如萬安山道旁有碑讀之乃五代列將人所不稱道者道原即能言其行事始終歸驗於舊史信然宋次道知亳州家多書道原枉道就借觀之次道日具酒饌為主人禮道原曰此非吾所為來也殊廢吾事願悉撤去獨閉門晝夜讀且抄留旬日盡其書而去目為之翳道原致疾亦由學之苦邪方介甫用事呼吸成禍福凡有施置舉天下莫能奪髙論之士始異而終附之面譽而背毁之口服而心非之者比肩是也道原獨奮厲不顧直指其事是曰是非曰非或面刺介甫至變色如鐵或稠人廣坐介甫之人滿側道原公議其得失無所隠惡之者側目愛之者寒心至掩耳起避之而道原曽不以為意見質厚者親之如兄弟姦諂者疾之如仇讎由是困窮而終不悔此誠人之所難也昔申棖以多慾不得為剛㣲生髙以乞醯不得為直如道原者可以為剛直之士乎道原家貧至無以給㫖甘一毫不妄取於人其自洛陽南歸也時已十月無寒具光以衣襪一二事及舊貂褥贐之固辭強與之行及潁州悉封而返之於光而不受於他人可知矣尤不信浮屠説以為必無是事曰人如居逆旅一物不可乏去則盡棄之矣豈得齎以自隨哉可謂知之明而决之勇矣道原好著書志欲籠絡宇宙而無所遺不幸早夭其成者十國紀年四十二巻包羲至周厲王疑年譜共和至熈寧年畧譜各一巻資治通鑑外紀十巻餘皆未成其成者亦未以傳人曰今栁芳唐厯本皆不同由芳書未成而傳之故也期於瞑目然後傳病亟猶汲汲借人書以參校已之書是非其失氣垂盡乃口授其子羲仲為書屬光使譔埋銘及十國紀年序且曰始欲諸國各作百官及藩鎮表未能就幸於序中言之光不為人譔銘文已累年所拒且數十家非不知道原託我之厚而不獲承命悲愧尤深故序平生所知道原之美附於其書以傳來世道原自言其先萬年人六世祖度唐末明經及第為臨川令卒官遇亂不能歸遂葬髙安因家焉南唐以髙安為筠州今為筠州人父煥字凝之進士及第為潁上令不能屈節事上官年五十棄官家廬山之陽且三十年矣人服其髙歐陽永叔作廬山髙以美之今為屯田員外郎致仕云名苑序慶厯九年作孔子稱名不正則言不順言不順則事不成乃至於百姓無所措手足甚矣聖人重名之至也劉子政述九流有名家者流曰尹文子公孫龍子等凡七家尹文子今存其術雜黄老刑名之言耳餘書更歴久逺世鮮傳之今有孫氏釋名盖亦其類也昔者魯哀公問社於宰我宰我對曰周人以栗曰使民戰栗孔子聞之深非之曰成事不說遂事不諫既往不咎戒其後復為也兩漢以來儒者務為此態旁貫曲取紆辭蔓説至有依聲襲韻強為立理誠可閔笑者甚衆此非宰我栗社之比邪今釋名之文亦猶是矣抑亦失聖人之㫖逺哉愚嘗念之久矣間因觀經傳諸書有可以正名者因記之竊以為備萬物之體用者無過於字包衆字之形聲者無過於韻今以集韻本為正先以平上去入衆韻正其聲次以說文解字正其形次以訓詁同異辯其理次以經傳諸書之言證其實命曰名苑其有法制云為時遷物變者亦畧叙其㳂革欲人知其源流變態云爾至於魚蟲草木之類雖纎苛煩碎非慷慨君子所當用心然亦重名之一節爾至於三才道徳禮樂善惡真偽之名輔佐世治其功亦不細哉所謂文武之道未墜於地在人賢者識其大者不賢者識其小者將來君子好學樂道庶幾亦有取焉古文孝經指解序聖人言則為經動則為法故孔子與曽參論孝而門人書之謂之孝經及傳授滋久章句漫差孔氏之人畏其流蕩失真故取其先世定本雜虞夏商周之書及論語藏諸壁中苟使人或知之則旋踵散失故雖子孫不以告也遭秦滅學天下之書掃地無遺漢興河間人顔芝之子得孝經十八章儒者相與傳之是為今文及魯恭王壊孔子宅而古文始出凡二十二章當是之時今文之學已盛故古文排擯不得列於學宫獨孔安國及後漢馬融為之傳諸儒黨同疾異信偽疑真是以歴載累百而孤學沉厭人無知者隋開皇中祕書學士王逸於陳人處得之河間劉炫為之作稽疑一篇将以興墜起廢而時人已多譏笑之者及唐明皇開元中詔議孔鄭二家劉知幾以為宜行孔廢鄭於是諸儒争難蠭起卒行鄭學及明皇自注遂用十八章為定先儒皆以為孔氏避秦禁而藏書臣竊疑其不然何則秦世科斗之書廢絶已久又始皇三十四年始下焚書之令距漢興纔七年耳孔氏子孫豈容悉無知者必待恭王然後廼出盖始藏之時去聖未逺其書最真與夫他國之人轉相傳授歴世踈逺者誠不侔矣且孝經與尚書俱出壁中今人皆知尚書之真而疑孝經之偽是何異信膾之可㗖而疑炙之不可食也嗟乎真偽之明皦若日月而歴世爭論不能自伸其中異同不多然要為得正此學者所當重惜也前世中孝經多者五十餘家少者亦不減十家今秘閣所藏止有鄭氏明皇及古文三家而已其古文有經無傳案孔安國以古文時無通者故以𨽻體冩尚書而傳之然則論語孝經不得獨用古文此盖後世好事者用孔氏傳本更以古文寫之其文則非其語則是也夫聖人之經髙深幽逺固非一人所能獨了是以前世並存百家之說使明者擇焉所以廣思慮重經術也臣愚雖不足以度越前人之胷臆闚望先聖之藩籬至於時有所見亦各言爾志之義是敢輙以𨽻寫古文為之指解其今文舊注有未盡者引而伸之其不合者易而去之亦未知此之為是而彼之為非然經猶的也一人射之不若衆人射之其為取中多也臣不敢避狂僣之罪而庶幾於先王之道萬一有所禆焉洛陽􅂄英會序元豐五年正月作昔白樂天在洛與髙年者八人遊時人慕之為九老圖傳於世宋興洛中諸公繼而為之者凡再矣皆圖形普明僧舍普明樂天之故第也元豐中潞}
