  - {type: variant, offset: 5776, length: 3, content: 又曰回, WYG: 而民間為甚至有初喪親家各具酒肉聚於其家與主人同醉飽者有以鼓樂導喪車者有因喪納婦者相習為常恬不知怪醫助教劉太居親喪獨不飲酒食肉終三年此乃今士大夫所難能}
