  - {type: variant, offset: 6137, length: 1, content: 中, WYG: 間靡所不有衆人之道如山川如陵谷如鳥獸如艸木如蟲沙各盡其分不知其外天地則無不包也無不徧也毋我知孔子曰殷有三仁焉蓋孔子之前為比干者則非微子矣為微子者則非比干矣為箕子者則非比干與微子矣至孔子然後人知三子者皆仁人也孔子曰微管仲吾其被髮左衽矣如其仁如其仁孟荀氏之言曰仲尼之門五尺童子羞稱五伯}
  - {type: page-break, offset: 6137, content: '', id: KR4d0040_WYG_074-9b, image: WYG1094/WYG1094-0674d.png}
  - {type: variant, offset: 6139, length: 0, content: '', WYG: 是觀之孟荀氏之道槩諸孔子其隘甚矣道同元豐六年作迃叟曰合天下而君之之謂王王者必立三公三公分天下而治之曰二伯一公處乎内皆王官也周衰二伯之職廢齊桓晉文糾合諸侯以尊天子天子因命之為侯伯修舊職也伯之語轉而為霸霸之名自是興自孟荀氏而下皆曰由王道而王由伯道而霸道豈有二哉得之有淺深成功有小大耳譬諸水為畎為澮為谷為谿為川為瀆若所鍾則海也大夫士畎澮也諸侯谿谷也州牧川也方伯瀆也天子海也小大雖殊水之性奚以異哉絶四元豐六年作或問子絶四何以始於毋意迃叟曰吉凶悔吝未有不}
  - {type: page-break, offset: 6139, content: '', id: KR4d0040_WYG_074-10a, image: WYG1094/WYG1094-0675a.png}
  - {type: page-break, offset: 6139, content: '', id: KR4d0040_WYG_074-10b, image: WYG1094/WYG1094-0675b.png}
  - {type: variant, offset: 6140, length: 1, content: 所, WYG: 乎}
