  - {type: variant, offset: 5882, length: 0, content: '', WYG: 臣為上為徳為下為民言其上下得也上下得者其惟禹稷與臯陶乎佐舜禹以阜安斯民君頼之如股肱民依之如父母功盛乎一時名髙乎百世公之徳其近是乎不然何天子之寵光便蕃而不厭下民之恱服悠乆而不忘若此其備乎衆皆曰然光曰然則請書此為之記獨}
