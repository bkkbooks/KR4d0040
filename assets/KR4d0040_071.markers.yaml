  - {type: variant, offset: 2052, length: 1, content: 臣, WYG: 稱死而不朽者如臧文仲既沒其言立是也然文仲之言傳於今者無㡬盖時人}
  - {type: variant, offset: 2055, length: 0, content: '', WYG: 存録遂使遺逸豈不惜哉光於獻可沗備僚友獻可平生造膝之言固不可得而聞今既沒其子曰庾等捜求章奏遺槀得二百餘篇光請而序之俾後之人察其言足以知獻可之心然則獻可身雖沒其心長存也嗚呼獻可以直道自}
  - {type: variant, offset: 2056, length: 1, content: 功, WYG: 始終無缺而官止於諫議大夫年止五十八彼不以其道得者或位極将相壽及胡耉從愚者視之則可為憤邑從賢者視之以此况彼所得所失孰為多少邪後之人得是書者宜寳蓄之當官事君苟能效其一二斯為偉人矣龐相國清風集略後序公之勲業治行范景仁所為清風集叙言之詳矣公性喜詩雖相府機務之繁邉庭軍旅之急未嘗一日置不為}
  - {type: page-break, offset: 2056, content: '', id: KR4d0040_WYG_069-4b, image: WYG1094/WYG1094-0636b.png}
