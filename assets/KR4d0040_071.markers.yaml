  - {type: variant, offset: 5864, length: 0, content: '', WYG: 子出公之門最乆其居洛又乆然則記兹堂也子於何避之夫登岱華者固不能盡其髙廣遊滄海者固不能窮其幽深苟身之所至目之所睹皆可得而言矣光既不得辭乃曰光僑居於洛巳十有三年日聞士民之譽公者如出一口敢問公之前後治洛其規為施置如何而得民心若是願條以告我得藉之以書衆皆曰公之為政其大者汪洋溥暢若化工之神膏雨之仁固非吾人之所測也其細者樵夫牧兒皆能道之又不足以盡公之美也姑以吾人之所及者言之其簡而有節安而不擾乎抑又聞之昔黄霸為潁川太守治為天下第一及作相時人不謂之賢謝安為吴興太守在官無當時譽及作宰相名振異域彼皆才有所不贍故用有所不周能兼之者其在公乎光曰諸君知其一未知其二光嘗學於史氏觀自古為人臣者或得於君而失於民或得於民而失於君君非不恱也如民疾之何民非不愛也如君惡之何若是者殆不可勝算也至於事君以忠養民以仁惻然至誠積於胸中夙夜不倦悠乆不渝晦之而益光隠之而益彰逃寵而寵不我捨避名而名常我隨若玉之在山珠之在淵擊鐘鼓於宫種草木在土逹于上下而不可掩者彌百千年無㡬人而巳矣詩云}
