  - {type: variant, offset: 6099, length: 0, content: '', WYG: 士則之妹余嫂也元豐中張氏自濰之泗省金氏又自泗之陜省余嫂徒歩數千里曰吾故時主家不可忘也嫂置諸園門之傍獨處一室日一􅂼食讀佛書毎與女僕語專誨以忠勤有不受而詬之者輒拜謝不與校遇勞辱之事則以身先之與之錢刀衣服固辭強之不得已辭多受少見尺薪寸帛不忍弃必拾以歸愛之如已物女僕之㓜者則為之櫛沐紉縫視之如已女至於猴犬飲食以時無不馴服張氏去輒數日悲鳴不食余熟察其所為而異之因諭之曰嫗已老幸有子不與之居以終其身而栖栖汲汲周遊四方竟何為乎張氏曰凡學佛者先應斷愛彼雖吾子乆已捨之不復思也嗚呼世之服儒衣冠讀詩書以君子自名者其忠孝㢘譲能如張氏者㡬希豈得以其㣲賤而忽之邪聞其風者能無作乎曏使生於劉子政之前使子政得而傳之雖古烈女何以尚之惜乎為浮屠所蔽不得入於禮義之塗然其處心有可重者余是敢私記之猫虪傳元豐七年作仁義天徳也天不獨施之於人凡物之有性識者咸有之顧所賦與有厚薄耳余家有猫曰虪毎與衆猫食常退處於後俟衆猫飽盡去然後進食之有復還者又退避之佗猫生子多者虪輒分置其栖與巳子並乳之愛視踰於巳子有頑猫不知其徳於巳乃食虪之子虪亦不與校家人以白澤圖云畜自食其子不祥見虪在旁以為共食之痛箠而斥之以畀僧舎僧飼之不食匿竇中近旬日餓且死家人憐而返之至家然後食家人毎得稺猫輒令虪母之嘗為佗猫子摶犬犬噬之㡬死人救獲免後老且病不復執䑕於家為長物余不忍弃常自飼之及死余命貯簏中瘞於西園時元豐七年十月甲午也自生至死近二十年昔韓文公作猫相乳説以為北平王之徳感應召致及余家有虪乃知物性各於其類自有善惡韓子之說㡬於諂耳嗟乎人有不知仁義貪冒争奪病人以利巳者聞虪所為得無愧哉司馬相如稱物有同類而殊能者故力稱烏獲㨗言慶忌人誠有之獸亦宜然昔余通判鄆州有猫曰山賔生數月遇鼷得巨䑕方食之前與鼷闘嚙鼷走奪䑕以歸後因汚余書余以畀都監常鼎始縶之跳擲髙數尺不可牽制乃囊盛以授之兩廨相距二里許後數日山賔復來歸余又囊以授之鼎命婢牢縶之山賔既識路即時歸䋲約滿身鼎責羣婢曰汝曹雖為人曽不及彼猫一心於其主余以既畀之不可復留卒囊以授之遂不復歸不知其為死為生也山賔非虪之比余獨嘉其不忘舊主故録之附於虪傳之末傳家集巻七十二欽定四庫全書傳家集巻七十三宋司馬光撰題跋題綘州鼓堆祠嘉祐元年九月作鼓堆在州治所西北二十五里樊紹述守居記作古州之圖志作鼓鼓者人馬踐之逢逢如鼓状盖水原充滿石下而然云紹述之文其必有據然今以耳目驗之則圖志亦未可全廢也堆之西山白馬首其東長陵纚屬相傳以為晋之九原其北水出澤堂别名清泉堆周圍四里髙三丈穹隆而圓状如覆釡水原數十環之觱沸雜發匯於南溶為深淵中多魚鱉蠏鱓水極清潔可鑑毛髪盛寒不氷大旱不耗霪雨不溢其南釃為三渠一載髙地入州城周吏民園沼之用二散布田間灌溉萬餘頃所餘皆歸於汾田之所生禾麻稌􅀈肥茂薌甘異佗水所溉堆上有神祠盖以水隂類也故其神為婦人像而祠中石刻乃妄以為堯后及舜之二妃噫是水也有清明之性温厚之徳常壹之操潤澤之功雖古聖賢無以加其廟食於民也固宜何必假於堯后舜妃然後可祀也嘉祐元年九月壬寅通判并州事司馬光以事至綘州從州之諸官尚書比部貟外郎薛長儒元卿國子博士劉常守道尹仲舒漢臣判官陳太初寓之同遊祠下愛其氣象之美登臨}
