  - {type: variant, offset: 6110, length: 1, content: 蓋, WYG: 實亡也堯舜湯武之於仁義也皆性得而身行之也五霸則強焉而巳夫仁義者所以治國家而服諸侯也皇帝王霸皆用之顧其所以殊者大小髙下逺近多寡之間耳假者文具而實不從之謂也文具而實不從其國家且不可保况能霸乎雖乆假而不歸猶非其有也瞽叟殺人疑曰虞書稱舜之徳曰父頑母嚚象傲克諧以孝烝烝乂不格姦所貴於舜者為其能以孝和諧其親使其進退以善自治而不至於惡也如是則舜為子瞽叟必不殺人矣若不能止其未然使至於殺人執於有司乃棄天下竊之以逃狂夫且猶不為而謂舜為之乎是特委巷之}
  - {type: page-break, offset: 6110, content: '', id: KR4d0040_WYG_073-11b, image: WYG1094/WYG1094-0666d.png}
  - {type: page-break, offset: 6110, content: '', id: KR4d0040_WYG_073-12a, image: WYG1094/WYG1094-0667a.png}
  - {type: variant, offset: 6112, length: 0, content: '', WYG: 也殆非孟子之言也且瞽叟既執於臯陶矣舜惡得而竊之雖負而逃於海濵臯陶猶可執也若曰臯陶外雖執之以正其法而内實縱之以予舜是君臣相與為偽以欺天下也惡得為舜與臯陶哉又舜既為天子矣天下之民戴之如父母雖欲遵海濵而處民豈聴之哉是臯陶之執瞽叟得法而亡舜也所亡益多矣故曰是特委巷之言殆非孟子之言也史剡并序愚觀前世之史有存之不如其亡者故作史剡其細𤨏䌓蕪固不可悉數此言其卓卓為士大夫所信者云虞舜堯以二女妻舜百官牛羊事舜於畎畆之中瞽叟與象猶欲殺之使舜塗廪而縱火舜以兩笠自扞而下又使舜穿井而實以土舜為匿空出佗人井剡曰頑嚚之人不入徳義則有矣其好利而畏害則與衆不殊也或者舜未為堯知而瞽叟欲殺之則可矣堯巳知之四岳舉之妻以二女養以百官方且試以百揆而禪天下焉則瞽叟之心豈得不利其子之為天子而尚欲殺之乎雖欲殺之亦不可得巳藉使得而殺之瞽叟與象将隨踵而誅雖甚愚人必不為之此特閭父里嫗之言而孟子信之過矣後世又承以為實豈不過甚矣哉舜南廵守崩於蒼梧之野𦵏於江南九嶷是為零陵剡曰昔舜命禹曰朕耄期倦于勤汝惟不怠揔朕師是以天子為勤故老而使禹攝也夫天子之職莫勤於廵守而舜猶親之卒死於外而葬焉惡用使禹攝哉是必不然或曰虞書稱舜陟方乃死孔安國以為升道南方巡守而死禮記亦稱舜葬於蒼梧之野皆如太史公之言予獨以為不然何如曰傳記之言固不可据以為實藉使有之又安知無中國之蒼梧而必在江南邪虞書陟方云者言舜在帝位治天下五十載升於至道然後死耳非謂巡守為陟方也嗚呼遂使後世愚悖之人或疑舜禹而非聖人豈非孔安國與太史公之過也哉夏禹禹以天下授益益避啓於箕山之陽禹子啓賢天下皆去益而歸啓啓遂即天子位剡曰父之位傳歸於子自生民以來如是矣堯以朱不肖故授舜舜以均不肖故授禹禹子啓果賢足以任天下而禹授益使天下自擇啓而歸焉是飾偽也益知啓之賢得天下心巳不足以間而受天下於禹是竊位也禹以天下授益啓以違父之命而為天子是不孝也惡有飾偽竊位不孝而謂之}
  - {type: page-break, offset: 6112, content: '', id: KR4d0040_WYG_073-12b, image: WYG1094/WYG1094-0667b.png}
