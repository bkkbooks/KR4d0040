  - {type: variant, offset: 4566, length: 0, content: '', WYG: 字皆附其名以寓訓焉京字亢宗京大也孟子曰天爵脩而人爵從之爾姑大其徳乎然後宗有所亢矣亮字信之孔子稱去食去兵而信不可去信者行之本也禀字從之從順也君子在家則禀於親}
