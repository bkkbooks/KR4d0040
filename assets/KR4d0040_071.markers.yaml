  - {type: variant, offset: 3, length: 0, content: '', WYG: 公留守西都韓國富公納政在里第自餘士大夫以老自逸於洛者於時為多潞公謂韓公曰凡所為慕於樂天者以其志趣髙逸也奚必數與地之襲焉一旦悉集士大夫老而賢者於韓公之第置酒相樂賔主凡十有一人既而圖形妙覺僧舍時人謂之洛陽􅂄英㑹孔子曰好賢如緇衣取其敝又改為樂善無厭也二公寅亮三朝為國元老入賛萬機出綏四方上則固社稷尊宗廟下則熈百工和萬民天子腹心股肱耳目天下所取安所取平其勲業閎大顯融豈樂天所能庶幾然猶慕效樂天所為汲汲如恐弗及豈非樂善無厭者與又洛中舊俗燕私相聚尚齒不尚官自樂天之㑹已然是日復行之斯乃風化之本可頌也宣徽工公方留守北都聞之以書請於潞公曰某亦家洛位與年不居數客之後顧以官守不得執巵酒在坐席良以為恨願寓名其間幸無我遺其為諸公嘉羡如此光未及七十用狄監盧尹故事亦預於㑹潞公命光序其事不敢辭時五年}
  - {type: page-break, offset: 3, content: '', id: KR4d0040_WYG_068-13b, image: WYG1094/WYG1094-0632b.png}
  - {type: page-break, offset: 3, content: '', id: KR4d0040_WYG_068-14a, image: WYG1094/WYG1094-0632c.png}
  - {type: variant, offset: 4, length: 0, content: '', WYG: 月壬辰端明殿學士兼翰林侍讀學士太中大夫提舉崇福宫司馬光序開府儀同三司守司徒武寧軍節度使致仕韓國公富弼字彦國年七十九河東節度使開府儀同三司守太尉判河南府兼西京留守司事潞國}
  - {type: page-break, offset: 4, content: '', id: KR4d0040_WYG_068-14b, image: WYG1094/WYG1094-0632d.png}
  - {type: variant, offset: 6, length: 3, content: 集卷第, WYG: 彦愽字寛夫年七十七司封郎中致仕席汝言字君從年七十七太常少卿致仕王尚宫字安之年七十六太常少卿致仕趙丙字南正年七十五秘書監致仕劉凡字伯壽年七十五衞州防禦使致仕馮行己字肅之年七十五太中大夫充天章閣待制提舉崇福宫樊建中字正叔年七十三司農少卿致仕王謹言字不疑年七十五太中大夫提舉崇福宫張問字昌言年}
  - {type: page-break, offset: 6, content: '', id: KR4d0040_WYG_068-15a, image: WYG1094/WYG1094-0633a.png}
  - {type: variant, offset: 12, length: 133, content: 論二功名論機權論朋黨論三勤論管仲小器論荀息論致知在格物論葬論中和論功名論自古人臣有功者誰哉愚以爲人臣未甞有功其有功者皆君之功也何以言之夫地有艸木天不雨露之則不能以生月有光華日不照望之則不能以明臣有事業君不信任之則不能以成此自然之道也古者大國不過百里小國半之然皆有賢卿, WYG: 龍圖閣直學士通議}
