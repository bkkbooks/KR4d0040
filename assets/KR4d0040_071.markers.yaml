  - {type: variant, offset: 6107, length: 0, content: '', WYG: 貺我兼金不如顧無以為報請受而藏之遇同好則傳之異日或廣布於天下使公之志業煒煌於千古庶㡬亦足以少報乎書田諫議錫碑隂光自始學未冠聞故諫議大夫田公當真宗踐阼之初求治方急公稽古以監今日有獻月有納以賛成咸平盛隆之治私心慕仰想見其為人熈寜中始識公之曽孫偃師尉衍因就求觀公之遺文後十餘年衍為武勝軍節度推官知沈丘縣事以公文集及墓銘相示且命光為神道碑其墓銘乃故叅知政事范公所為也范公大賢其言固無所苟今其銘曰嗚呼田公天下之正人也雖復使佗人竭其慕仰之心頌公之美累千萬言能有過於此乎光於范公無能為役范公恨不得見田公則田公果何如人哉光不惟愚陋不學且不為人作碑銘巳乆不敢承命然常怪世人論譔其祖禰之徳業壙中之銘道旁之碑必使二人為之彼其徳業一也銘與碑奚以異曷若刻大賢之言既納諸壙又植於道其為取信於永乆豈不無疑乎願審思之脫或可從請附刻於碑隂之末書孫之翰墓誌後元豐二年十二月作明道中公在華州光始以太廟齋即得謁見皇祐中幸與公俱在館閣公於光為前軰而光服公才仰公徳不敢以同舎期也然粗能熟公之為人元豐二年十二月公弟子崇信令察示光以歐陽公所譔公墓誌光讀之怳然如復見公得侍坐於旁也昔蔡伯喈嘗言吾為碑銘多矣皆有慙徳唯郭有道無愧色耳觀歐陽公此文其言公自初仕以美才清徳為時所重在諫院言宫禁事切直無所避在陜不飾厨傳凡當官公論不私其所愛淡然寡所好外和而内勁喜言唐事學者終嵗讀史不如一日聞公論此皆光親所睹聞當時士大夫所共知可謂實録而無愧矣公名髙於世歐陽公以文雄天下固不待光言而後人信之然嵗月益乆識公者益寡竊懼後之人見歐陽公之文以為如世俗之銘誌但飾虚美以取恱其子孫耳故冒進越之罪嗣書其末譬猶捧土以培泰山匊水以沃大河彼豈頼此以為髙深哉盖志在有以益之不自知非其任也疑孟伯夷隘桞下恵不恭元豐五年作疑曰孟子稱所願學者孔子然則君子之行孰先於孔子孔子歴聘七十餘國皆以道不合而去豈非非其君不事乎孺悲欲見孔子孔子辭以疾豈非非其友不友乎陽虎為政於魯孔子不肯仕豈非不立於惡人之朝乎為定哀之臣豈非不羞汙君乎為委吏為乘田豈非不卑小官乎舉世莫知之不怨天不尤人豈非遺佚而不怨乎飲水曲肱}
