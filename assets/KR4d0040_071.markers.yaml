  - {type: variant, offset: 2275, length: 1, content: 義, WYG: 為詩如鼓鐘者聲必聞於外灼龜者兆必見於表玉藴石而山木茂珠居淵而岸草榮皆物理自然雖欲揜}
  - {type: variant, offset: 2277, length: 1, content: 平, WYG: 不可得巳朝議大夫致仕趙君南正善屬文尤嗜為詩自初仕至歸老聚其槀凡十四編一旦走僕負之以書屬光為之序光實何人克膺兹任然嘗聞同僚楚正叔之言曰予與南正同登進士第又同居潁陽熟其為人其清白耿介佗人殆難能}
