  - {type: variant, offset: 4559, length: 5, content: 如辨黒白如, WYG: 者君子小人之大分也陜郡張君名共才甚美行甚脩舉進士登上科今從事於浙東光辱與張君為同郡人習其為人固乆竊以為古者名於親而字於朋友字必附名而為義焉光是敢輒廣其名之義而字曰大成以勉之異}
