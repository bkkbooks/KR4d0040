  - {type: variant, offset: 5784, length: 0, content: '', WYG: 十日作玉藻曰父沒而}
  - {type: variant, offset: 5785, length: 1, content: 違, WYG: 能讀父之書手澤存焉爾揚子曰書心畫也今之人親沒則畫像而事之畫像外貌也豈若心畫手澤之為深切哉今集先公遺文手書及碑誌行状共為一櫝寘諸影堂子子孫孫永祗保之諫院題名記嘉祐八年作古者諫無官自公卿大夫至於工商無不得諫者漢興以來始置官夫以天下之政四海之衆得失利病萃於一官使言之其為任亦重矣居是官者當志其大捨其細先其急後其緩專利國家而不為身謀彼汲汲於名者猶汲汲於利也其間相去何逺哉天禧初真宗詔置諌官六員責以職事慶歴中錢君始書其名於版光恐乆而漫滅嘉祐八年刻著於石後之人将歴指其名而議之曰某也忠某也詐某也直某也回嗚呼可不懼哉聞喜縣脩文宣王廟記嘉祐元年作或問太古何如曰不今日如也何以言之曰古之人寒衣而饑食貪生而畏死不殊於今也喜怒哀樂好惡畏欲與民俱生非今有而古無也古之人食鳥獸之肉草木之實而衣其皮鳥獸日益殫草木日益稀人日益衆物日益寡視此或不足視彼或有餘能相與守死而勿争乎争而不巳相賊傷相滅亡人之類盖可計日而盡也聖人者愍其然於是作而治之擇其賢智而君長之分其土田而疆域之聚其父子兄弟夫婦而安養之施其禮樂政令而綱紀之明其道徳}
