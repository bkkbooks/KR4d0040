  - {type: variant, offset: 5920, length: 142, content: 克己復禮爲仁蓋言禮者中和之法仁者中和之行故得禮斯得仁矣孔子間居曰無聲之樂志氣不違以至於氣志旣起樂記曰易直子諒之心生則樂以至於不言而信不怒而威蓋言樂以中和爲本以鍾鼔爲末也商頌曰不競不絿不剛不柔布政優優百禄是遒蓋言政以中和爲美也大雅曰惠此中國以綏四方無縱詭隨以謹無良蓋言刑以中和爲貴也子曰, WYG: ''}
