  - {type: variant, offset: 5772, length: 2, content: 民鮮, WYG: 居徳以中奚適而不利哉方字思之方道也孔子曰道不逺人苟思之精行之勤則道何逺之有哉爽字成徳爽明也明敏辯智天之才也中和正直人之徳也天與之才必資人徳以成之與其才勝徳不若徳勝才故願爾勉於徳而已矣衮字補之君子之事上進思盡忠退思補過異日爾仕於朝當以仲山甫為法乎章字晦之君子之道闇然而日章然則欲道之章者其惟晦乎奕字襲美詩云夙興夜寐毋忝爾所生奕世之美将待爾而襲之可不勉歟裔字承之爾於昆弟中為最㓜承祖之美者捨爾尚誰任哉嗚呼朝夕不離於口耳者名字而巳爾曹苟能言其名求其義聞其字念其道庶㡬吾宗其猶不為人後乎序賻禮元豐六年十一月一日作名以位顯行由學成此禮之常若夫身處草野未嘗從學志在為善不求聲利此則尤可尚也近世史氏專取髙官為之傳故閭閻之善人莫之聞喪禮之廢壊}
