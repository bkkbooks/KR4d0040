  - {type: variant, offset: 6092, length: 1, content: 楊, WYG: 此聖賢之樂非愚者所及也若夫鷦鷯巢林不過一枝鼴䑕飲河不過滿腹各盡其分而安之此乃迂叟之所樂也熈寜四年迂叟始家洛六年買田二十畒於尊賢坊北闢以為園其中為堂聚書出五千巻命之曰讀書堂堂南有屋一區引水北流貫宇下中央為沼方深各三尺䟽水為五𣲖注沼中状若虎爪自沼北伏流出北階懸注庭下状若象鼻自是分為二渠繞庭四隅㑹於西北而出命之曰弄水軒堂北為沼中央有島島上植竹圓周三丈状若玉玦攬結其杪如漁人之廬命之曰釣魚庵沼北横屋六楹厚其墉茨以禦烈日開户東出南北列軒牖以延凉颸前後多植美竹為清暑之所命之曰種竹齋沼東治地為百有二十畦雜塒草藥辨其名物而掲之畦北植竹方徑丈状若棊局屈其杪交相掩以為屋植竹於其前夾道如歩廊皆以蔓藥覆之四周植木藥為藩援命之曰采藥圃圃南為六欄芍藥牡丹雜花各居其二毎種止植兩本識其名状而巳不求多也欄北為亭命之曰澆花亭洛城距山不逺而林薄茂宻常苦不得見乃於園中築臺搆屋其上以望萬安轘轅至於太室命之曰見山臺迂叟平日多處堂中讀書上師聖人下友羣賢窺仁義之原探禮樂之緒自未始有形之前暨四逹無窮之外事物之理舉集目前所病者學之未至夫又何求於人何待於外哉志倦體疲則投竿取魚執袵采藥决渠灌花操斧剖竹濯熱盥手臨髙縱目逍遥徜徉唯意所適明月時至清風自來行無所牽止無所柅耳目肺腸悉為已有踽踽焉洋洋焉不知天壌之間復有何樂可以代此也因合而命之曰獨樂園或咎迂叟曰吾聞君子所樂必與人共之今吾子獨取足於巳不以及人其可乎迂叟謝曰叟愚何得比君子自樂恐不足安能及人况叟之所樂者薄陋鄙野皆世之所棄也雖推以與人人且不取豈得強之乎必也有人肯同此樂則再拜而獻之矣安敢專之哉記歴年圖後光頃嵗讀史患其文繁事廣不能得其綱要又諸國分列嵗時先後參差不齊乃上采共和以來下訖五代略記國家興衰大迹集為五圖毎圖為五重毎重為六十行毎行紀一年之事其年取一國為主而以朱書佗國元年綴於其下盖欲指其元年以推二三四五則從可知矣凡一千八百年命曰歴年圖其書雜亂無法聊以私便於討論不敢廣布於佗人也不意趙君摹刻於板傳之蜀人梁山令孟君得其一通以相示始光率意為此書苟天下非一統則漫以一國主其年固不能辨其正閏而趙君乃易其名曰帝統非光志也趙君頗有所増損仍變其巻秩又所為多脫誤今此淺陋之書既不可掩因刋正使復其舊而歸之傳家集巻七十一欽定四庫全書傳家集巻七十二宋司馬光撰傳范景仁傳范景仁名鎮益州華陽人少舉進士善文賦場屋師之為人和易脩敕故叅知政事薛簡肅公端明殿學士宋景文公皆噐重之補國子監生及貢院奏名皆第一故事殿廷唱第過三人則為奏名之首者必抗聲自陳以祈恩雖考校在下天子必擢賞上列以吴春卿歐陽永叔之耿介猶不免從衆景仁獨不然左右與並立者屢趣之使自陳景仁不應至七十九人始唱名及之景仁出拜退就列訖無一言衆皆服其安恬自是人始以自陳為耻舊風遂絶釋褐新安主簿到官數旬時宋宣獻公留守西京不欲使與下吏共勞辱召置國子監使教諸生秩滿又薦於朝為東監直講未㡬宋景文公奏同脩唐書又用叅知政事王公薦召試學士院詩用彩霓字學士以沈約郊居賦雌霓連蜷讀霓為入聲謂景仁為失韻由是除館閣校勘殊不知約賦但取聲律便美非霓不可讀為平聲也當時有學者皆為景仁憤􅉱而景仁處之晏然不自辨為校勘四年應遷校理丞相龐公薦景仁有美才不汲汲於進取特除直祕閣未㡬以起居舎人知諫院仁宗性寛仁言事者兢為激訐以采名或縁愛憎汚人以帷箔不可明之事景仁獨引大體自非關朝廷安危繫生民利病皆闊略不言陳恭公為相嬖妾張氏笞殺婢御史劾奏欲逐去之不能得乃誣之云私其女景仁上言朝廷設臺諫官使人除讒慝非使之為讒慝也審如御史所言則執中可斬如其不然御史亦可斬御史怒共劾景仁以為阿附宰相景仁不顧力為辨其不然深救當時之弊識者韙之仁宗即位三十五年未有繼嗣嘉祐初暴得疾旬日不知人中外大小之臣無不寒心而畏避嫌疑相倚仗莫敢發言景仁獨奮曰天下事尚有大於此者乎捨此不言顧惟抉擿細微以塞職是真負國吾不忍也即上言太祖捨其子而立太宗周王既薨真宗取宗室子養之宫中陛下冝為宗廟社稷計早擇宗室賢者優其禮數試之以政與圖天下之事以繫天下人心章累上寝不報景仁因闔門家居自求誅譴執政或諭以奈何效干名希進之人景仁上執政書言繼嗣不定将有急兵鎮義當死朝廷之刑不可死亂兵之下此乃鎮擇死之時尚安暇顧干名希進之嫌而不為去就之决哉又奏稱臣竊原大臣之意恐行之而事有中變故畏避而為容身之計也萬一兵起大臣家族首領顧不可保其為身計亦巳踈矣就使事有中變而死陛下之職與其死於亂兵不猶愈乎乞陛下以臣此章示大臣使其自擇死所聞者為之股栗尋除兼侍御史知雜事景仁固辭不受乞解言職就散地執政復諭以上之不豫諸大臣亦嘗建此䇿今姦言巳入為之甚難景仁復上執政書云但當論事之是非不當問其難易况事早則濟緩則不及此聖賢所以貴機㑹也諸公謂今日難於前日安知佗日不難於今日乎謂今日姦言巳入不可弭佗日可弭乎凡見上面陳者三奏章者十有七朝廷不能奪乃罷諫職改集賢殿脩撰頃之拜知制誥遷翰林學士英宗即位中書奏請追尊濮安懿王事下兩制議以為冝稱皇伯髙官大國極其尊榮大迕執政意更下尚書省集百官議之意朝士必有迎合者既而䑓諫争上言為人後者為之子不得顧私親今陛下既為仁宗後若復推尊濮王是貳統也殆非所以報仁宗之盛徳衆論鼎沸執政欲緩其事乃下詔罷百官集議曰當令禮官檢詳典禮以聞景仁時判太常寺即具列為人後之禮及漢魏以來論議得失悉奏之與兩制臺諫議合執政怒召景仁詰責之曰詔書云當令檢詳奈何遽列上邪景仁曰有司得詔書不敢稽留即以聞乃其職也奈何更以為罪乎㑹宰相遷官景仁當草制坐失於考按不合故事改侍讀學士出知陳州今上即位復召還翰林王介甫叅知政事置三司條例司變更祖宗法令專以聚斂為務斥逐忠直引進奸佞景仁上䟽極言其不可朝廷不報景仁時年六十三因上言即不用臣言臣無顔復居位食禄願聴臣致仕章累上語益切直介甫大怒自草制書極口醜詆使以本官户部侍郎致仕凡所應得恩例悉不之與於是當時在位者皆自愧景仁名益重於天下介甫雖詆之深人更以為榮焉景仁既退居有園第在京師專以讀書賦詩自娱客至無貴賤皆野服見之不復報謝故人或為具召之雖權貴不拒也不召則不往見之或時乘輿出遊則無逺近皆往嘗乘籃輿歸蜀與親舊樂飲賑施其貧者周覽江山窮其勝賞朞年然後返年益老而視聴尤聦明支體尤堅強嗚呼曏使景仁枉道希世以得富貴䝉屈辱任憂患豈有今日之樂邪然則景仁所失甚少所得殊多矣詩云愷悌君子神所勞矣又曰樂只君子遐不眉壽景仁有焉客有問今世之勇於迂叟者叟曰有范景仁者其為勇人莫之敵客曰景仁長僅五尺循循如不勝衣奚其勇叟曰何哉而所謂勇者而以瞋目裂眥髪上指冠力曵九牛氣陵三軍者為勇乎是特匹夫之勇耳勇於外者也若景仁勇於内者也自唐宣宗以來不欲聞人言立嗣萬一有言之者輒切齒疾之與背畔無異而景仁獨唱言之十餘章不巳視身與宗族如鴻毛後人見景仁無恙而繼為之者則有矣然景仁首冒不測之淵無勇者能之乎人之情孰不畏天子與執政親愛之至隆者孰若父子執政欲尊天子之父而景仁引古義以争之無勇者能之乎禄與位皆人所貪或老且病前無可冀猶戀戀不忍捨去况景仁身巳通顯有聲望視公相無跬歩之逺以言不行年六十三即拂衣歸終身不復起無勇者能之乎凡人有所不能而人或能之無不服焉如吕獻可之先見范景仁之勇决皆余所不及也余心誠服之故作范景仁傳圉人傳慶歴五年作汧侯有馬悍戾不可乘服以為無用將弃之野愛其疾足募有能馴之者禄以百金有圉人叩門而告曰臣能馴之汧侯使養馬數月馬益調服歩驟緩速折還左右唯人所志汧侯喜賞以百金之禄拜為圉師衆騶疾之謁於侯曰侯馬今馴矣彼何功而徒費侯金臣請代之侯逐圉人居數月馬復悍戾如故侯乃召圉人而謝曰子能使悍馬馴子去而馬復悍敢問何術也對曰臣賤夫也不知異術而惟養馬之知夫馬太肥則陸梁太瘠則不能任重䇿之急則駭而難馴緩則不肯盡力善為圉者渇之飢之飲之秣之視其肥瘠而豐殺其菽粟緩之以盡其材急之以禁其逸鞭䇿以警其怠恩隠以馴其心使之得其宜適而不勞亦不使有遺力焉其術甚㣲得於心應於手巳不能傳之於人人亦不能從巳傳也如此故馬之材在馬馬之性在我雖悍戾何傷哉汧侯曰善圉人曰是術也豈特養馬而巳抑治國亦猶是也夫材智之士治國者之悍馬也捨之則不能以興功業御之不以道則不獲其利而桀黠不可制故明君者能用材智之士而以爵禄賞罸御之是以爵太髙則驕禄太豐則墮驕墮之臣雖有智力君不得而使也制之急則不得盡其能制之緩則不肯宣其用不任恩渥一驅之以威則愁怨而離心故明君者節其爵禄裁其緩急恩澤足以結其心威嚴足以服其志則士生死貴賤之命在於君矣雖慓悍何憂哉汧侯恱位為上卿任以國政用其術推而行之汧國大治張行婆傳行婆張氏濰州昌樂人父為虎翼軍校張氏生七年繼母潜使儈者鬻之紿其父云失之父哭之一日失明由是落軍籍為民儈者鬻於故尚書左丞范公家字曰菊花范氏以媵其女適泗州人三班借職金士則張氏勤謹其主家愛之與父别凡二十一年一旦遇之於范氏之門而識之遂辭范氏與父俱歸父怒繼母欲毆而逐之張氏曰兒非母不得入貴人家母乃有徳於兒又何怨焉今頼天之力得復見父若兒歸而母逐兒何安焉父乃止父時年且八十無佗子家甚貧鬻薪為業昌樂有故田園為人所據張氏乃與父母歸鄉里訟於州而得之未㡬父卒張氏養繼母盡子道母老不能行所適稍逺則張氏負之母卒張氏嫁為里民王祐妻生一男二女祐早卒諸孤皆幼張氏鞠之不從人既長畢婚嫁乃謂其}
