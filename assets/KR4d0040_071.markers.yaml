  - {type: variant, offset: 5790, length: 4, content: 日月至焉, WYG: 勉之}
  - {type: variant, offset: 5796, length: 1, content: 日, WYG: 矣何憚不及於古邪人之言曰古民淳質故可教今民偽薄故不可教是瞽惑之言不足稽也於廟之成馬君謂光旁縣之人也冝為之記光以不文辭不敢為使者三返而不獲命因直述所聞而書秀州真如院法堂記皇祐四年作壬辰嵗夏四}
  - {type: page-break, offset: 5796, content: '', id: KR4d0040_WYG_071-10a, image: WYG1094/WYG1094-0650c.png}
  - {type: variant, offset: 5798, length: 2, content: 至焉, WYG: 有僧清辨踵門來告曰清辨秀州真如草堂僧也真如故有講堂庳狹不足以庥學}
