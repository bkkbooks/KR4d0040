  - {type: variant, offset: 518, length: 215, content: 君者非不知孔孟之爲聖賢也不能行其道而徒欲尊之以爲名是以孔孟以爲不義而不留也洪範曰凡厥正人旣富方榖汝弗能使有好于而家時人斯其辜此所謂知賢不能用與不知同也樂毅爲燕伐齊下七十餘城燕王疑之使騎刧代將田單詐騎刼而敗之盡失齊地廉頗爲趙將拒秦乆而不戰趙王疑之使趙括代將白起擊趙括而虜之阬其卒四十萬項羽用范増謀彊霸諸侯圍漢王滎陽幾拔矣聞漢之反間而疑之范増怒去而項羽卒爲漢擒夫駕車者旣服騏驥矣又以駑馬參之欲其並驅而前不可得也蓺田者旣樹嘉榖矣又以稂莠, WYG: 顔太初}
