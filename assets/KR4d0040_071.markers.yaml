  - {type: variant, offset: 6383, length: 1, content: 心, WYG: 芻蕘書曰有廢有興出入自爾師虞庶言同}
  - {type: variant, offset: 6385, length: 10, content: 餒矣君子優游從容以飬, WYG: 繹蓋言與衆同欲則令無不行功無不成也今之論者或曰天地與人了不相關薄食震揺皆有常數不足畏忌祖宗之法未必盡善可革則革不足循守庸人之情喜因循而憚改為可與樂成難與慮始紛紜之議不足聽采意者古今異宜詩書陳迹不可盡信邪將聖人之言深微高逺非常人所能知先儒之解或未得}
