  - {type: line-break, offset: 0, content: '', id: KR4d0040_SBCK_043-1a01}
  - {type: variant, offset: 0, length: 1343, content: 温國文正公文集卷第四十三章奏二十八請自擇臺諌劄子論李定劄子貼黄諫西征䟽乞罷修腹内城壁樓櫓及噐械狀乞不添屯軍馬請自擇臺諫劄子臣竊見近日臺諫官言制置三司條例司害民及吕惠卿姦邪者率𬒳責降或更加以惡名如吕公著告辝云乃誣方鎮有除惡之謀中外聞者無不駭愕臣竊惟朝廷之意無它止欲懲戒來者使不敢復言耳國家置臺諫官以爲天子耳目唯恐政事有闕失百姓有疾苦大臣專恣左右姦邪天子深居九重不能得聞故也今臺諫官稍有懷剛直之志畏天下公議憂念朝廷哀憫百姓忤犯大臣刺譏左右者陛下輒罪而逐之更使大臣自擇所親以代其任萬一又為公論則又逐之是必得庸懦阿䛕不知廉恥附下罔上背公死黨之人然後止耳若言路皆此等之人則禁闥之外陛下耳目之所不及者雖有至大之事迫切之禍陛下何從知之如此豈宗廟社稷之福也晏子曰君所謂可臣亦曰可君所謂否臣亦曰否若以水濟水誰能食之今陛下使大臣自擇臺諫官又取自於己者存之異於己者去之然則陛下獨與大臣爲天下足矣何必更置臺諫官也且條例司之害民吕惠卿之姦邪天下之人誰不知之獨陛下與王安石未之寤耳豈可更爲之黜逐臺諫以長其威福成其氣勢臣竊爲陛下寒心今臺諫官巳被逐者臣不敢留唯願陛下自擇公正剛直者布之言路以明四目逹四聦勿使爲群下所欺蔽則天下幸甚臣受陛下過分之恩不敢塞黙雖死怨讎之手猶賢於竊禄偷生者也取進止論李定劄子臣竊見近者朝廷除秀州推官李定爲監察御史裏行知制誥李大臨蘇頌等累次封還詞頭數日來外間皆言朝廷巳爲之寢罷今日復聞劄下舎人院須令草詞臣竊意朝廷知大臨等旣累次封還詞頭今復草之則爲反覆必難奉詔因欲以違命之罪罪之使今後凢朝廷所行政令群下無敢立異者若果如此則百執事之人自非偷合苟容者皆不得立於朝政令或有得失陛下復何從知之晏嬰所謂以水濟水賈山引秦之季丗以戒漢文帝者正患其如此耳前論逐臺諫官今又論大臨等非敢私此數人正爲國家惜言路之絶耳伏望陛下審思愼行之勿使聦明遂壅蔽則天下幸甚取進止貼黄國家不次用人固無常法然必使衆心厭服然後爲美是以堯舜非不聦明也其命官皆先謀岳牧旣衆言僉同復明試以功而後用之故舉不失能而上下雍熈也臣素不識李定實不知其行能何如陛下果知其賢何不且試之以漸俟其功効顯著衆皆知之然後不次拔用則誰曰不可何必今日與臣下力校勝負殆非人君廣大之體也諫西征䟽月日具位臣光謹昧死再拜上䟽皇帝陛下臣以不材誤承朝廷委用待罪長安兼領一路十州兵民大柄朝辭之日伏蒙陛下靣諭以凡邊防事機及朝廷得失有所聞見令一一奏聞臣受命以來且愧且懼所愧者聖知深厚責任至重所懼者智識淺短無以堪稱夙夜疚心不敢寧居臣自入境以來見流移之民道路相望詢訪閭里皆云今夏大旱禾苗枯瘁河渭以北絶無所収獨南山之下稍有所存而入秋霖雨經月不霽禾雖有穗往往無實雖有實往往無米雖有米率皆細黒一斗之粟舂簸之後不過得米三四升榖價踊貴民間累年困於科調素無蓄積不能相瞻以此湏至分房減口就食西京襄鄧啇􅉑等州或傭賃客作或燒炭采薪或乞匄剽竊以度朝夕當此之際國家惟冝鎮之以靜省息諸事減節用度則租稅自輕繇役自少逋負自寛科率自止四患旣除民力自足民財自饒閭里自安流亡自還固不待陛下憂勤於中宰相劬勞於外然後人人得其所也苟或不然國家雖欲輕租稅寛逋負其所費之財何由可得雖欲少繇役止科率其所管之事何由可成四患不除雖日下㤙澤之詔民猶不免於流移轉死也蓋欲止沸者莫若絶薪欲安民者莫若省事此目前之験非難知也臣到官以来伏見朝廷及宣撫等司指, WYG: ''}
