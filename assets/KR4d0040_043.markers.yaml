  - {type: variant, offset: 1332, length: 2955, content: 分義勇作四畨欲令以次於縁邊戍守選諸軍驍銳及募閭里惡少以爲竒兵造乾糧皺飯布囊力車以備餽運悉取嵗賜秉常之物散給縁邊諸路又竭内地府庫甲兵財物以助之且以永興一路言之所發人馬甲八千副錢九万貫銀二万三千兩銀椀六千枚其餘細瑣之物不可勝數動皆迫以軍期上下相驅急於星火官吏狼狽下民驚疑皆云國家將以今春大舉六師長駈深入以討秉常之罪臣以踈賤不得預聞廟堂之議未知兹事爲虚爲實昨者親承德音以爲方今邊計惟冝謹嚴守備俟其入冦則堅壁清野使之來无所得兵疲食盡可以坐収其弊臣退而思念聖謀髙逺深得王者御戎狄之道實天下之福及到関中乃見凡百處置皆爲出征調度臣不知有司在外不諭聖意以致有此張皇將陛下黙運神筭不令愚賤之臣得聞其實也臣不勝惶惑晝則忘食夜則廢寢心寒股栗竊爲陛下危之夫兵者凶噐聖人不得巳而用之自古以来國家冨彊將良卒精因人主好戰不巳以致危乱者多矣况今公私困竭將愚卒懦乃欲驅之塞外以捕狡悍之虜其无功必矣豈惟無功兼後患甚多不可盡言也若朝廷𥘉無出征之意則何爲坐散府庫之財疲生民之力訖無分毫之事萬一將来虜騎入冦府庫巳竭民力巳困將何以禦之臣先任御史中丞日朝廷將興綏州之役臣曽上言國家先當舉百職修庻政安百姓實倉庫選將帥立軍法練士卒精噐械八事皆備然後可以征伐四夷今此八事未有一者勝於曩時而况關中饑饉十室九空爲賊盗者紛紛巳多縣官倉庫之積所餘無幾乃欲輕動大衆横挑猛敵此臣之所大懼也或者又云國家未討秉常先欲試兵誅一小族若果如此猶爲不可何則今者竭關中之財力大興師衆乃捨有罪之強寇誅無事之小種勝之不武不勝爲笑將無以復號令戎狄矣此二䇿者皆爲不可伏望陛下深鍳安危之機消之於未萌救之於未形速下明詔撫諭關中之民以朝廷不爲出征之計其義勇更不分畨於縁邊戍守亦不選募竒兵凡諸調發爲饋運之具者悉令停罷愛惜内地倉庫之儲以備春深賙救饑窮之人如此豈惟生民之幸亦社稷之福也臣不勝憂迫直輸赤誠惟陛下裁察臣光昧死再拜上䟽乞罷修腹内城壁樓櫓及噐械狀三日上尋得旨依奏准熈寕三年十一月𥘉七日准樞宻院劄子節文檢㑹近爲麟府路豐州及外堡寨官吏弛慢不職不修完城池樓櫓噐甲等已奉聖旨降官等第断遣及劄與三路轉運司遍牒轄下㳂邊州軍知委去訖近又壉陜西路提刑宣撫司奏華州甲仗庫弓弩不堪蓋是監官并夲州官貟全不用心點撿有誤緩急使用其鈐轄盧戭坐受優俸空占當直兵士略不營職朝廷巳令鄜延路經略司舉官差替盧戭其華州甲庫弓弩不堪夲州當職官貟全不用心點檢仍宣撫司差官取勘聞奏切慮諸路亦有不修完城壁噐甲等去處奉聖旨令河東河北陜西經略安撫司指揮轄下州軍委長吏子細點檢須管日近修完城壁樓櫓堅固噐甲精利如將來朝廷專差官點檢得却有未修城壁樓櫓噐甲等其應干官吏必當依此重行断遣劄付夲司者㝷依准朝旨行下夲路諸州軍施行近准􅉑州申州司勘㑹夲州雖係陜西路即不係近邊州軍其州城從來並不曽有敵樓戰棚爲自來霖雨損壞摧搨及無兵功累年不曽修築今來亦不敢專擅役夫脩築巳牒在城兵馬都監吕士宣重行撿計損壞城邑去處才候撿計到合使人功物料别具狀供申乞差兵夫次及據解州申准兵馬監押狀申准州牒備録到安撫使司牒内坐到聖旨指揮修完城壁樓櫓等㝷將帶壕寨木匠作頭等檢計外羅城靣上只有更屋二十三座並係年深倒搨及城壁墜倒乆來亦不曽泥𥙷修完伏乞據狀申上衙乞差官計料脩城人工及刱添樓櫓兔致將來朝廷差官檢視見並不修完城壁及剏蓋樓櫓虚負責降停替州司勘㑹舊來城上並無樓櫓即目城靣上闊處只及四五尺已來今若指揮使行剏造又縁合使人工材料數目不少今來未敢專檀剏修伏候指揮右謹具如前勘㑹管下永興等一十州軍城壁内有乆来巳行安置樓櫓完備亦有城壁仾下薄怯全未有樓櫓去處其逐州官吏旣准上項朝旨及見麟府豊州官吏以不修完城壁樓櫓噐甲降官等第断遣并華州官吏差替取勘仍恐朝廷非時差官點檢例各畏懼爭欲日近興功完葺以避譴責伏縁營造樓櫓湏藉城基厚闊方可安置今来解􅉑兩州城壁皆稱闊處只及四五尺似此之類湏是先貼築城基方可剏脩樓櫓若非大叚興功無以辦濟况今夲路州軍全闕廂軍應急差使官庫亦闕見錢収買材料若是差役人夫配率材料又縁陜西州軍已是去歳夏麦薄収秋苗旱損當此饑䭚人户流移之際若更如此差擾必是轉難存濟兼永興軍一路州軍盡在腹裏去㳂邊绝逺設若蕃賊入冦亦未能便到逐州軍城下其樓櫓修下數年不用不免損壞今来若盡令與㳂邊州軍一例湏管日近修完城壁樓櫓堅固噐甲精利顯見官私虚有勞費欲乞朝廷特降指揮其㳂邊及次邊州軍即一依近降朝旨修完所有腹内州軍城壁樓櫓並候將来豊熟以漸營葺其器甲即據不堪數目逐旋勒作院人匠依程課修整務令精利所貴公私皆得辦濟乞不添屯軍馬今月七日准熈寧三年十二月二十九日陜西河東路宣撫使司劄子夲司近已具奏聞乞於永興軍邠州河中府三州軍易得粮草之處别添屯軍馬選差將官專切訓練逐路不得句抽專聽宣撫司莭制内一項乞於永興軍駐劄兵馬差夲司准備差使莊宅使趙瑜充永興軍路都鈐轄與知府專管訓練者右具如前臣勘㑹永興軍所管今年正月一日見在軍糧麤細色斛斗共三十六萬九千七百石二斗四升據即目夲府見駐泊及就糧并夲城兵貟糧食及官僚請俸等共約支得向去一十七箇月半馬料三萬七千六百五十二石四斗二升約支得向去一十五箇月有餘稈草四十萬六千二百二十二束約支得一十三箇月半有餘此只是據見在軍馬約度即不知今來所添屯軍馬計多少數目若只添一倍之時其人粮只約支得八箇月有餘馬料只约支得七箇月有餘稈草只支得六箇月有餘所添更多所費尤廣又先准中書劄子奉聖旨令體量應災傷人戸委的飢乏不能自存者仰撥省倉斛㪷據第四第五以下人户各借二石今勘㑹永興軍諸縣苐四等以下闕食人户約及十餘萬户若毎戸支二石共計合支二十餘万石其外縣雖有粮草亦是數目不多更難支充貸糧若並令在府省倉請領又更減却此數即軍粮約支更不及得上項月數况去年陜西經夏大旱入秋霖雨五榖例皆不熟某永興軍放稅多者至七八分即今毎㪷白米價錢一百文足稈草毎束價錢二十七文足雖差官開場糴買只糴得白米九百餘石稈草全無兼勘㑹軍資庫日近雜支錢盡㡳支絶准轉運司牒將三司提刑司塩馬司封椿錢盡數充雜支錢止及四萬貫除支毎月料錢及府庫雜使并不住准轉運司牒支撥往㳂邊州軍及應副収買軍期物色見今无錢支與和糴場糴買粮草豈得謂之易得粮草之處臣竊謂大凡添屯軍馬先湏约度夲處粮草可以贍養以備今來關中饑饉倉庫空虚贍養舊兵猶恐不足更添新者何以枝梧雖朝廷更於左藏庫内藏庫支撥銀紬絹等降下夲路添助支費亦不免令州縣配賣與百姓轉増貧困况粮草是重滯之物不可從逺處興販得來湏夲處土地所生方可計置今饑饉如此雖多積金銀髙估物價令轉運司與州縣多方擘畫其目下所要粮草何由可得况即今民間闕食流移死亡者已爲不少諸縣處處申報驚劫若至向前二三月後舊榖巳盡新麥未熟民間必轉更饑乏若官中愛惜倉庫坐視不救竊恐流移轉多死亡轉衆盗賊轉煩深爲不便竊以戎狄擾邊手足之疾百姓離散腹心之憂豈可重外輕内逐末忘夲兹事得失所繫不細伏望朝廷先將陜西諸州軍粮草約度合贍得若干軍馬一年支費仍湏於十分中量留二三分救濟目下饑民外如有剰數然後據數添屯軍馬若苦無剰數之時伏乞朝廷更不添屯儻以邊鄙未寧湏至量添軍馬之時即乞分散往諸州軍就糧各委逐處兵官精加訓練不湏聚在永興軍邠州河中府三處更特置都鈐轄三貟候邊事稍定即乞速發遣歸住營處所貴公私稍得辦濟若不如此先約度粮草但務添屯軍馬切恐一旦倉庫俱竭别有不虞至時悔無所及臣職在守藩不敢不言所有先准朝旨令第四等以下人户借支斛㪷二石未審今來支與不支若支與則軍粮轉更不足不支則人户正當饑乏伏願聖慈早降指揮臣不勝迫切之誠温國文正公文集卷第四十三, WYG: ''}
