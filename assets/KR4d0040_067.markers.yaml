  - {type: variant, offset: 0, length: 1470, content: 温國文正公文集卷第六十七記二傳附北京韓魏公祠堂記范景仁傳圉人傳張行婆傳猫虪傳北京韓魏公祠堂記没而祠之禮也由漢以來牧守有惠政於民者民或爲之生祠雖非先王之制皆發於人之去思亦不可廢也然年時浸逺人浸忘之惟唐狄梁公爲魏州刺史屬契丹㓂河北梁公省徹戰守之俻撫綏彫弊之民民安而虜自退魏人祠之至今血食熈寕𥘉河北水溢地大震官寺民居蕩覆者太半詔以淮南節度使司徒兼侍中韓魏公爲河北安撫使判大名府兼北京留守公旣愛民如愛子治民如治家去其疾忘己之疾閔其勞忘己之勞未幾居者以安流者以還飢者以充乏者以足群心旣和歲則屢豊在魏五年徙判相州魏人涕泣遮止數日乃得去魏人思公而不得見也相與立祠於熈寕禪院塐公像而事之後二年公薨于相州魏人聞之爭奔走哭祠下雲合而雷動連日乃稍息自是每嵗公生及違丗之日皆來致祠作佛事未甞少懈噫公之德及一方功施一時者魏人固知之矣至於德及海内功施後丗者亦甞知之乎公爲宰相十年當仁宗之末英宗之𥘉朝廷多故公臨大節處危疑苟利國家知無不爲若湍水之赴深壑無所疑憚或諌曰公所爲如是誠善萬一蹉跌豈惟身不自保恐家無處所殆非明哲之所尚也公歎曰此何言也凡爲人臣者盡力以事君死生以之顧事之是非何如耳至於成敗天也豈可豫憂其不成遂輟不爲哉聞者愧服其忠勇如此故能光輔三后濟大難使中外之人餔啜嬉遊自若曽無驚視傾聽竊語之警坐置天下於太寕公之力也嗚呼公與狄梁公皆有惠政於魏故魏人祠之然其爲逺近所遵慕年時雖逺而不毀非有大功於社稷爲神祇所相祐能如是乎况梁公之功顯天下皆知之魏公之功隱天下或未能盡知也然則魏公不又賢乎冝其與梁公之祠並立於魏享祀無窮公薨後九年魏人以狀抵西京俾光記將刻于石竊惟梁公二碑乃李邕馮宿之文光實何人敢不自量顧魏人之美意不可抑又欲以其所未知者諗之故不敢辤時元豊七年六月丙戌涑水司馬光記范景仁傳范景仁名鎮益州華陽人少舉進士善文賦場屋師之爲人和易修敕故參知政事薛簡粛公端明殿學士宋景文公皆噐重之𥙷國子監生及貢院奏名皆第一故事殿廷唱第過三人則爲奏名之首者必抗聲自陳以祈恩雖考校在下天子必擢寘上列以吴春卿歐陽永叔之耿介猶不免從衆景仁獨不然左右與竝立者屢趣之使自陳景仁不應至七十九人始唱名及之景仁岀拜退就列訖無一言衆皆服其安恬自是始以自陳爲恥舊風遂絶釋褐新安主簿到官數旬時宋宣獻公留守西京不欲使與下吏共勞辱召置國子監使教諸生秩滿又薦於朝爲東監直講未幾宋景文公奏同修唐書又用參知政事王公薦召試學士院詩用彩䨘字學士以沈約郊居賦雌霓連蜷讀霓爲入聲謂景仁爲失韻由是除館閣校勘殊不知約賦但取聲律便美非䨘不可讀爲平聲也當時有學者皆爲景仁積鬱而景仁處之晏然不自辯爲校勘四年應遷校理丞相龐公薦景仁有美才不汲汲於進取特除直祕閣未幾以起居舎人知諌院仁宗性寛仁言事者竸爲激訐以采名或縁愛憎汚人以帷箔不可明之事景仁獨引大體自非關朝廷安危擊生民利病皆闊略不言陳恭公爲相嬖妾張氏笞殺婢御史劾奏欲逐去之不能得乃誣之云私其女景仁上言朝廷設臺諌官使之除䜛慝也審如御史所言則執中可斬如其不然御史亦可斬御史怒共劾景仁以爲阿附宰相景仁不顧力爲辨其不然深救當時之弊識者韙之仁宗即位三十五年未有継嗣嘉祐初暴得疾旬日不知人中外大小之臣無不寒心而畏避嫌疑相倚仗莫敢發言景仁獨奮曰天下事尚有大於此者乎捨此不言顧惟抉擿細微以塞職是真負國吾不忍也即上言太祖捨其子而立太宗周王旣薨真宗取宗室子飬之宫中陛下冝爲宗廟社稷計早擇宗室賢者優其禮數試之以政與圖天下之事以系天下人心章累上寢不報景仁因闔門家居自求誅譴執政或諭以柰何效干名希進之人景仁上執政書言継嗣不定將有急兵鎮義當死朝廷之刑不可死亂兵之下此乃鎮擇死之時尚安暇顧干名希進之嫌而不爲去就之决哉又奏稱臣竊, WYG: ''}
