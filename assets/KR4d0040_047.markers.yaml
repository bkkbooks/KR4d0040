  - {type: variant, offset: 552, length: 1910, content: 則又無榖可糶人人賣田無往可售遂至殺牛賣肉伐桑鬻薪來年生計不敢復議此農民所以重困也又錢者流通之物故謂之泉布比年以來物價愈賤而閭閻益困所以然者錢皆聚於官中民間乏錢貨重物輕借使有人鬻薪糴米米價雖賤薪價亦賤故也臣愚以爲冝悉罷免役錢其州縣諸色役人並依舊制委夲縣令佐掲簿定差替見雇役人其衙前先召募人投充長名召募不足然後差郷村人戸毎經歴重難差遣依舊以優輕埸務充酬奬所有見在免役錢撥充州縣常平夲錢以戸口爲率常存三年之蓄有餘則歸轉運司凡免役之法縱冨強應役之人征貧弱不役之户利於冨者不利於貧者及今耳目相接猶可復舊若更年深冨者安之民不可復差役矣謹録奏聞伏候勑旨乞罷將官狀右臣伏以州縣者百姓之根夲長吏者州縣之根夲夲危則枝葉何以得安故自古以來凡置州郡必嚴其武備設長吏必盛其侍衛非以重其權驕其人也乃所以安百姓衛朝廷也秦懲周室幹弱枝強之弊旣滅六國以爲天下不復用兵雖分三十六郡置郡守更以御史監之隳名城消兵噐束以苛法舉動施爲皆不得自專是以陳勝吴廣以匹夫奮臂大呼郡縣莫能制多殺長吏以應之雖由其殘虐取亡亦守令無權無兵之所致也晉武帝平吴亦以爲天下旣壹兵無所用悉去州郡兵陶璜山濤皆言州郡武備不可廢帝不聽及永寕以後盗賊群起州郡無備不能擒制天下遂大亂夫兵者所以威不軌而昭文德誰能去兵州縣無虞則國家安矣州縣不守則國家危矣臣竊見國朝以來置緫管鈐轄都監押爲將帥之官凡州縣有兵馬者其長吏未甞不兼同管轄蓋知州即一州之將知縣即一縣之將故也先帝欲征伐四夷患諸州兵官不精勤訓練士卒懈弛於是有建議者請分河北陜西河東京東京西等路諸軍若干人爲一將别置將官使之專切訓練其逐州緫管以下及知州知縣皆不得關預及有差使量留羸弱下軍及剰貟以充夲州官白直及諸般差使其餘禁軍皆制在將官專事教閱臣愚以爲職事修舉在於擇人不在設官茍得其人雖緫管等皆能訓練士卒不得其人雖將官亦何所爲况今之將官即曏之爲緫管等者也豈爲緫管等則不能舉職爲將官乃能舉職乎此徒變易其名無益事實非惟無益兼復有害凡設官分職當上下相維如身之使臂臂之使指紀綱乃立今爲州縣長吏及緫管等而於所部士卒有不相統攝不得差使殆如路人者至於倉庫守宿街市巡邏亦皆乏人雖於條許差將下兵士而州縣不得直差須牒將官將官往往占護不肯差撥萬一有非常之變州縣長吏何以號令其衆制禦姦宄哉又頃歳以來自轉運使知州以下白直及迎送之人日朘月减出入導從大爲蕭條供承荷擔有所不給觀望削弱無以威服吏民臣略舉目覩一事以證其餘西京城郭周數十里卑薄頽缺犬豕可踰又瀍洛二水交貫其中毎夜諸門扄鐍雖嚴而灘流之際人皆可以平行往來其屬水南北巡檢下所管兵士除出軍外餘數不多通判以下諸官白直往來防送倉庫守宿街市巡邏盡出其間嚮者先帝違豫勑西京留守親詣嵩山起建道場其將下禁軍充白直者於條皆不得出城經宿所敢留者剰貟七八人而已西京天子别都也其守禦不固如此留守前宰相重官也其侍衛單寡如此况僻小州縣其守禦之備侍衛之衆可知矣萬一有凶狡之賊驅烏合之衆突入城邑或刼質戕賊長吏以焚燒廬舎殺掠吏民將何以制之哉此特天下太平之乆習俗淳厚群心安固賊不測虚實膽智怯弱故未敢爲之耳豈可忽略謂之必無而不爲之備哉今獨㳂邊州軍城隍完固士卒衆多可以守禦自餘腹内州縣旣無深溝髙城又乏士卒群盗猝至何以責其竭節守義不棄城竄匿或以酒食迎賊以甲兵獻賊歛民財以賂賊者乎群盗尚尔况戎狄傾國大舉長驅而來者哉易曰君子安不忘危存不忘亡治不忘亂兵法曰不恃敵之不我犯恃我之不可犯國家豈可恃即日平寕晏然髙枕不以爲慮謂其必不敢來乎臣愚以爲河北陜西河東京東京西等路腹内州縣冝以漸候豐年農安之際委提點刑獄與夲處長吏相度各修築所治之城州城稍髙縣城次之不必廣大所以然者髙則難踰小則易守故也其縁邊屯駐兵士遇春夏無事之際委經略安撫使與轉運使公共商量减放歸住營州軍或於内地就粮勿聽怯懦將帥多有虚占以自守衛其腹内州軍量其大小緊慢大藩常留千餘人小州亦留數百人不得差發往别州軍見兵不足即行招添悉罷將官其逐州縣禁軍並委長吏與緫管等官同共提舉教閱及諸多差使其有不能勤飭致士卒懈弛者委提點刑獄常切按察聞奏嚴行責降仍令逐縣各選有勇力武藝之人充弓手以守衛城邑討捕盗賊其州縣吏所給白直迎送之人皆如嘉祐編勑以前之數如此力可以守然後遇冦盗之至責其弃城等罪而誅之彼亦甘心矣謹録奏聞伏候勑旨乞開言路狀右臣昨在京師伏蒙太皇太后不以臣愚踈無取遣使訪以得失豈惟微臣有千載一遇之幸中外聞之踊躍相慶以爲言路將開下情得以上通太平之期指日可待也當是時臣未暇備論天下之事先陳所急於三月三十日上言以近歳風俗頽弊士大夫以偷合苟容爲智以危言正論爲狂致閭閻愁苦而上不得知明主憂勤而下無所訴公私兩困盗賊巳繁冝下詔書不以有官無官之人有知朝政闕失及民間疾苦者並許進實封狀皷院檢院州軍長吏不得抑退其義精當者行其言而顯其人狂愚鄙陋者報聞罷去亦不加罪又於四, WYG: 五}
