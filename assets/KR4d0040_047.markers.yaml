  - {type: variant, offset: 36, length: 479, content: 乞改求諌詔書劄子辭門下侍郎第一劄子第二劄子乞罷免役狀右臣竊以百姓出力以供在上之役蓋自古及今未之或改熙寕中執政者以爲百姓惟苦差役破産不憚增稅乃請據家貲髙下各令出錢雇人充役按因差役破産者惟郷戸衙前有之自餘散從承符弓手手力耆戸長壯丁未聞破産者其郷户衙前所以破産者蓋由山野愚戇之人不能幹事及主管官物或因水火損敗或謂上下侵欺是致欠折備償不足有破産者至於長名衙前乆在公庭句當精熟毎經重難差遣積累分数别得優輕埸務酬奬往往致冨何破産之有夫差役出於民錢亦出於民今使民出錢雇役何異割鼻飼口朝三暮四於民何所利哉又曏者役人皆上等户爲之其下戸單丁女戸及品官僧道夲來無役今更使之一槩輸錢則是賦歛愈重非所以寛之也故自行免役法以來富室差得自寛而貧者窮困日甚殆非所以抑兼并哀惸獨均賦役也又監司守令之不仁者於雇役人之外多取羡餘或一縣至數萬貫以冀恩賞規進取不顧爲民丗丗之患又國家舊制所以必差青苗户充役人者爲其有莊田家属有罪難以逃亡故頗自重惜今雇浮浪之人充役常日恣爲不法一旦事發單身竄匿何處州縣不可投名又農家所有不過榖帛與力自古賦役無出三者自行新法以來青苗免役及賦歛多責見錢錢非私家所鑄要須貿易外求, WYG: 元}
