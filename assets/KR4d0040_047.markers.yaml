  - {type: variant, offset: 2465, length: 1, content: 一, WYG: 八}
  - {type: variant, offset: 2467, length: 1, content: 復, WYG: ''}
  - {type: variant, offset: 2469, length: 1125, content: 言皇帝陛下初即政於用人賞罰尤不可不當夫諫爭之臣人主之耳目也不可一日無之說命曰若跣弗視地厥足用傷設有人閉目而塞耳跣足而疾趍前遇險阻能無傷乎賈山有言人主之威非特雷霆也勢重非特萬鈞也開道而求諌和顔色而受之用其言而顯其身士猶恐懼而不敢自盡况震之以威壓之以重乎頃者王安石秉政欲蔽先帝聦明專威福行私意由是深疾諌者過於仇讎嚴禁誹謗甚於盗賊是以天下之人以言爲諱百姓愁苦無聊靡所控告致怨謗之語上及先帝臣常痛心泣血思救其失是故首乞下詔開言路以通下情臣謂群臣苟有肯進言者陛下必加褒擢以勸來者此乃古人市駿骨揖怒蛙之意也召誥曰王乃初服烏呼若生子罔不在厥初生自貽哲命今皇帝陛下新即位太皇太后陛下初垂簾天下之人莫不屬目傾耳臣自到西京以來朝夕伏聽朝廷惟新之政以爲必務明四目逹四聦以發天下積年憤鬱之志今開言路之詔旣不聞頒於四方而太府少卿宋彭年言在京不可不並置三衙管軍臣僚水部貟外郎王諤乞令依保馬元立條限均定逐年合買之數又乞令太學増置春秋博士使諸生肄業朝廷以非其夲職而言各罰銅三十斤臣忽聞之倀然失圖憤邑無巳臣非私於二人直爲朝廷惜治體耳夫阿意箝口容身竊禄此小臣之利也威福在巳人莫敢言此大臣之利也然民怨於下而不聞國家阽危而不知於陛下有何利哉彼宋彭年王諤臣素不識不知其人爲賢爲不肖但惜陛下臨政之初而二臣首以言事獲罪臣恐中外聞之忠臣解體直士挫氣欲仕者歛冠藏之欲諌者咋舌相戒則上之聦明猶有所不昭下之情僞猶有所不逹太平之功尚未可期也宋彭年所言雖不識事體但當寢而不行亦不冝加罪至如孔子作春秋爲萬丗法王安石秉政輙黜之使不得與諸經並列於學官學者毋得習以爲業王諤所言未至不當乃以越職爲罪古者置諌皷設謗木詢于芻蕘未聞有位於朝而以言事爲越職者也若當職之人旣不肯言不當職之人又不得言則以四海之廣兆民之衆其政治利病天子深居九重何由得聞之哉昨日進奏院逓到告身差臣知陳州然則臣自今於一州之外言及它事亦爲越職何敢言矣今二臣之罰旣不可追伏望陛下如臣前奏下詔不以有官無官當職不當職之人皆得進言擇其可取者微加旌賞使天下之人知朝廷樂聞善言不惡論事毋可取者寢而勿問庶幾願納忠之人猶肯源源而來也臣禀賦愚戇文學政事皆岀人下惟不識忌諱不阿權貴遇事妄言無所顧避以此荷知於累朝見稱於衆人若亦不得言則毋所復用於聖丗矣上孤太皇太后陛下下問之意下負微臣平生願忠之心内自痛悼死不瞑目臣乆忝便安今朝廷授以名藩義不敢辤見牒夲州索逺接公人起發赴任次到官之日但勉竭疲駑恪勒夲職苟力所不逮伏須罪戾而已謹録奏聞伏候勑旨謝御前劄子催赴闕狀右臣今月十五日平明凖入内内侍省逓到太皇太后御前劄子一道令臣早至闕庭者臣狂瞽妄言冝從誅譴曲荷開納仍叨奬飾并以臣羸老抱疾過形矜恤螻蟻命微何階報謝臣專候陳州逺接兵士到即起發赴闕次臣無任瞻天望聖激切屏營之至謹録奏聞謹奏請更張新法劄子, WYG: ''}
