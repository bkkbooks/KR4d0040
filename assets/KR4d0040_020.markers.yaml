  - {type: variant, offset: 4388, length: 0, content: '', WYG: 拓跋寛祚年齒寖長猖狂好兵常分之外邀求無厭董氊㓙悍狡獪過其父兄朝廷官爵不滿其意頗懐怨懟與契丹結婚隂相表裏此朝廷所當旰食而憂也秦州居二邊之交為陜西四路之首軍馬民夷最號繁富而以怯懦輕易之人守之是委羔豚於虎狼之蹊也臣竊為國家危之况方平其他材識素無所長止以文辭致位至此姦險貪猥士論共知今不可使之守邉事狀昭然而朝廷掩覆其過曲加保全愛一人而失一方臣竊以為過矣}
