  - {type: variant, offset: 83, length: 2800, content: 論責降劉述等劄子臣竊聞知雜御史劉述集賢校理丁諷審刑詳議官王師元皆以執守謀殺刑名差官取勘侍御史劉琦錢顗皆以論列政府公事除貟外郎降監酒稅中外聞之無不驚諤臣聞孔子曰守道不如守官孟子曰有言責者不得其言則去此古今之通義人臣之大節也彼謀殺巳傷自首刑名天下皆知其非今朝廷旣違衆議而行之又罪守官之人臣恐重失天下之心也夫紲食鷹鸇求其鷙也鷙而烹之將何用哉陛下踐阼以来待臣下以寛仁至如皮公弼陛下明知其貪閻充國陛下明知其猥也二人皆以知縣權發遣三司判官公事及得罪而出皆爲知州今琦顗所坐不過狂直止以迕犯大臣遂降爲監當然則狂直之罪重於貪猥得罪大臣甚於得罪陛下也臣不勝拳拳竊恐來者側目箝口以言爲諱威福移於臣下聦明有所壅蔽非國家之福也臣備位近臣親𬒳明詔覩朝廷政事之闕不敢不言伏望聖慈深察愚忠早賜指揮赦劉述等更不取勘其劉琦等别除一夲資序差遣庻幾稍息群議取進止再舉諌官劄子臣昨日靣奉聖旨令臣采訪可任諌官者宻具姓名聞奏臣竊見龍圗閣直學士陳薦舊事陛下於藩邸其忠厚質直陛下必素知之直史館蘇軾制䇿入優等文學冨贍曉逹時務勁直敢言職方貟外郎王元規自少至長志操堅正所居之官皆著風跡集賢校理趙彦若師民之子強學懿行不減於父平居恂恂如不勝衣遇事剛勁人莫能奪此四人者臣所素知竊謂可備諌職伏乞聖明更賜裁擇取進止貼黄蘇軾王元規趙彦若官職臣不能審記竊慮差誤不敢訪問於人恐致漏泄趙彦若昨任淄州通判與知州解賔王爭公事見降充監當請優賞宋昌言劄子臣聞國家大政在於賞罰明當若賞罰明當功無不成臣去冬奉勑與張茂則相度二股河及生隄利害當時都水監丞宋昌言建議欲於二股河口西岸新灘上置立上約擗攔水勢令入東流候向去東流漸深北流淤淺即閉塞斷北流放出御河胡盧河下流以除㤙冀深瀛以西諸州軍水患臣等因得其言㝷具此利害奏聞蒙朝廷聽許令修置上約自後昌言同列提舉修生隄者以䇿非己出百端沮毀以爲二股河必不可成不如併力修生隄及李立之赴闕上殿所言陛下所親聞也頼陛下聖明断在不疑必使之修置上約今秋擗欄得水勢一併入東流其北流㝷巳閉断雖頗漂溺損近東滄德等州民田廬舎然㤙冀深瀛以西州軍蒙利亦爲不少其宋昌言不可謂之無功今若與同列稱二股河不可成者一例受賞臣竊恐當官之人覩之無所沮勸况昌言因去歲職當在外河決棗彊獨奪一官今若止復舊官則是衆人受賞而昌言獨不得賞也設使嚮者修上約不成或背了二股併入北流其同列豈肯分昌言之罪伏望聖慈察昌言建議之功特與復舊官外更與董役之人等第别加酬奬庶使向去用心向公者知朝廷必不負之也取進止再乞資䕃人試經義劄子臣先曽起請應資䕃出身人初授差遣者更不試詩只委審官院流内銓試孝經論語大義共三道仍令主判臣僚更將所對義靣加詢問若義理精通者特保明聞奏優與差遣稍通者依常調不通者且令修學候一年外再試必湏試中方得出官若年四十以上聽依舊制只冩家狀讀律自後不蒙朝廷施行臣今復差知審官院竊見資䕃人𥘉授差遣者令試詩一首實爲無益不惟其間有墻靣者假手於人徒長姦僞就使自作詩得如曹劉沈宋其於立身治民有何所用古者二帝三王皆立大學之官以教公卿大夫子弟其何故哉蓋以其人將嗣守官業苟無德行道藝則必害及於民故也今若欲使公卿大夫子弟盡肄業於太學則其父兄不常在京師固難齊一若但使之習業於家而考校於初授差遣之際業不習者不得出官則不煩勸督而人人自勉於學矣此乃事之易行者也嚮若使之盡通詩書禮樂則中材以下或有所不及今伹使之習孝經論語儻能盡朞年之功則無不精熟矣此乃業之易習者也然孝經論語其文雖不多而立身治國之道盡在其中就使學者不能踐履亦知天下有周公孔子仁義禮樂其爲益也豈可與一首律詩爲比哉臣竊以爲兹事用力不勤更張甚易而爲益稍大别無所損伏望聖明詳察或有可取乞檢臣前奏特賜施行取進止乞不㨂退軍置淮南劄子臣竊聞道塗之言未審虚實或云朝廷欲揀在京禁軍年四十五以上微有程切者盡減下請給兼其妻孥徙置淮南以就糧食若實有此議臣竊以爲非冝何則在京禁軍及其家属率皆生長京師親姻聮布安居樂業衣食縣官爲日固乆年四十五未爲襄老微有呈切尚任征役一旦别無罪負減其請給徙之淮南是横遭降配也諸軍之内沙汰甚多必恐人情惶惑大致愁怨雖國家承平無事綱紀具張此屬恟恟不安亦無能爲患然詔書一下若萬一有道路流言驚動百姓朝廷欲姑務省事復爲収還則頓失威重向去無以復號令驕兵若遂推而行之則衆怒難犯專欲難成意外之變不可不防梁室分魏愽之兵致張彦之亂且近事之可鑑者也故臣願朝廷更當深思熟議未宜遽下此詔也夫水未至而虚爲之防水雖不至亦無所害謂水不足憂而不爲之防一旦水至則防無听及矣故君子貴於思患而豫防之也且國家竭天下之財養長征兵士夲欲備禦邊陲今淮南非用武之地而多屯禁軍坐費衣食是養無用之兵寘諸無用之地也又使邊陲常無事則巳異日或小有警急主兵之臣必爭求益兵京師之兵旣少必湏使者四出大加召募廣爲㨂選將數倍多於今日所退之兵舊兵尚請衣糧未至而新兵更添衣粮是棄已教閱經戰之兵而収市井甽畒之人夲欲減冗兵而冗兵更多夲欲省大費而大費更廣竊恐非計之得者也臣愚伏願朝廷且依舊法毎歲㨂禁軍有不任征戰者減充小分小分復不任執役者放充百姓聽其自便在京居止但勿使老病者尚占名籍虚費衣粮人情旣安於所習皆無怨嗟國家又得其力用不爲虚設冗兵旣去大費自省在理甚明於事爲便臣備位近臣兹事繫國家安危不敢不言取進止辭樞宻副使第一劄子臣准閤門告報巳除臣樞宻副使續准句當御藥院陳承禮傳宣令臣即今授勑告者臣賦分樸愚不通時務近日以來加以衰疾恪居舊職猶恐隳敗况乃技擢待之不次竊惟宥宻之地日侍訏謨内訓六師外撫四海用人當否繫國安危豈臣無似所能堪稱伏望聖慈更擇賢材俾居其任聽臣且守舊職取進止辝樞宻副使苐二劄子臣准句當御藥院黎永德奉宣聖旨令臣即今入見者臣屢違嚴詔當伏重誅但以聞命以来揣分巳熟自㓜及長頗讀經史捨此之外一無所長當丗之務懵不通曉常日置之開官僅脫矌敗尚以屬文不工剸劇非長翰林審官毎欲辝免况於樞府要地任重責大一日失職則死及之臣雖至愚粗知自愛陳力就列古人所韙是以寧冐違詔之罪不敢當竊位之譏伏望聖慈察其悃𣢾㳏非虚飾特賜寢罷新命止守舊職天地更生之惠臣莫大之幸也取進止辝樞宻副使第三劄子臣前者兩次曽辝免樞宻副使未奉俞旨竊慮區區之誠未能上逹湏至詳悉復有奏陳臣聞人之材性各有能有不能人主量材然後授官人臣審能然後授事是以官不曠而事無敗也臣幸生承平之時家丗爲儒臣自髫齓至于弱冠杜門讀書不交人事仕宦以來多在京師少歴外任故於錢榖刑獄繁劇之務皆不能爲况於軍旅固所不習獨於解經述史及以愚直𥙷過拾遺不避怨怒則庻幾萬一或有可取是以毎於拜官之際辭所不能而不辭其所能曏者除開封府推官以繁劇曽辭後除修起居注知制誥翰林學士以文来不工曽辭除龍圖閣直學士以乆在諌職無効曽辭再除翰林學士兼侍讀學士以言事未了曽辭除史館修撰以方修資治通鑑恐朝廷修國史難以兩處供職曽辭自餘除國子監直講館閣校勘史館檢討集賢校理直秘閣起居舎人同知諌院天章閣待制兼侍講知諌院權御史中丞此皆朝廷清要之職除書始下臣即時受命未甞輙辭所以然者自度駑鈍可以䇿厲不至曠敗故也天下之人見臣屢辭㤙命或以爲不慕榮貴或以爲飾詐邀名是皆不知臣者也臣自㓜習賦詩論䇿應舉就試毎, WYG: 熈寜}
