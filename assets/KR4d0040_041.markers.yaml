  - {type: variant, offset: 5512, length: 0, content: '', WYG: 萬項羽用范增謀彊霸諸侯圍漢王滎陽㡬㧞矣聞漢之反間而疑之范增怒而去項羽卒為漢禽夫駕車者既服騏驥矣又以駑馬參之欲其並驅而前不可得也蓻田者既樹嘉榖矣又以稂莠雜之欲其滋生而茂不可得也為國者既置賢才矣又以小人間之欲其並立而治不可得也是故宓子賤為單父宰辭於君請君之近史二人與之俱至官使二史書方書輒掣其肘書不善則從而怒之二史患之辭請歸以告魯君魯君以問孔子孔子曰宓不齊君子也其才任王霸之佐屈節治單父將以自試也意者以此為諌乎公寤太息而嘆曰此寡人之不肖寡人亂宓子之政而責其善者數矣㣲二史寡人無以知其過㣲夫子寡人無以自寤遽發所愛之使告宓子曰自今以徃單父非吾有也從子之制有便於民者子决為之五年}
