  - {type: variant, offset: 5513, length: 0, content: '', WYG: 言其要宓子遂得行其政而單父大治大禹謨曰任賢勿貳去邪勿疑疑謀勿成百志惟熈荀子曰人主有六患使賢者為之則與不肖規之使智者慮之則與愚者論之使修士行之則與汚邪之人疑之雖欲成立得乎哉譬之是猶立直木而恐其影之枉也惑莫大焉語曰好女之色惡者之孽也公正之士衆人之痤也修乎道之人汚邪之賊也今使汚邪之人論其怨賊而求其無偏得乎哉譬之是猶立徃木而求其影之直也亂莫大焉噫人主苟不知其賢則已矣已審知其賢授之以政而復疑之何哉凢忠直之臣行其道於國家則必與夫天下之姦邪為怨敵矣非喜與之為怨也不與之為怨則君不尊國不治功不立也以一人之身日與天下之姦邪為怨更進迭毁於君前而君不能决兼聽而兩可之如是則忠直之臣求欲無危不可得也君子非愛死而不為也知其身死而功不立姦邪愈熾忠良愈恐政治愈亂國家愈危也是以君子難進易退辭貴就賤被髪佯狂逃匿山林者以此故也此所謂用賢不能専與不用同也眀主為之不然審求天下之大賢而亟用之專信之舉社稷百姓而委屬之雖有至親不能奪也雖有至貴不敢爭也雖有讒巧不能間也確然若膠漆之相合視其際而不可得見也然後賢者得竭其心而施其才不憂怨賊之口不懼猜嫌之迹人主端拱無為享其功利收其榮名而已矣古之聖帝明王用此道而光宅四海長育萬物功如天地名若日月者多矣固不待稱引而知也請言其時近而道卑者昔齊桓公得管仲三薫而三浴之觧其縲紲置以為相鮑叔桓公之傅也避太宰之位而安隨其後國子髙子天子之守卿也人率五卿而聽其政令況其餘四境之内上下之人其孰敢不戰戰栗栗從桓公而貴信之是以能九合諸侯一正天下為五霸首也陳平楚之亡將也漢髙祖得之使典護諸將綘灌之屬盡害之髙祖以平為護軍中尉盡監護諸將諸將乃不敢言韓信亡卒也髙祖用蕭何一言拔諸行伍之中以為大將諸將皆驚而不敢爭也是以五年之中滅項羽定天下創業垂統四百嵗而不絶蜀先主與闗羽張飛布衣之友周旋艱險恩若兄弟一旦得諸葛孔明待之過於闗張闗張不說先主曰孤之有孔明猶魚之有水願諸君勿復言是以能起於敗亡之中保有一方與魏吳為敵國苻永固得王景畧於處士以為丞相貴戚大臣有害之者永固輒殺之謂太子宏及長樂公丕曰汝事王公如事我也是以能東取燕西取涼南取襄陽北取拓跋奄有中原㡬平海内此五臣者從今日視之皆英傑之才也曏使四君知之不眀用之不固信之不専則管仲醢於齊庭陳平窮於户牖韓信餓於淮隂諸葛孔明老於隆中王景畧死於華山名氏埋滅不可復知烏有曄曄功烈施於後世如此哉是以大雅云徐方既同天子之功晋平公問叔向曰齊桓公之霸君之力乎臣之力乎叔向曰管仲善制割隰朋善削縫賔胥無善純縁桓公知衣而已亦其臣之力也師曠曰管仲善斷割之隰朋善煎熬之賔胥無善齊和之羮巳熟矣奉而進之而君不食誰能强之亦其君之力也魏文侯使樂羊將而攻中山三年而拔之返而論功文侯示之謗書一篋樂羊再拜稽首曰此非臣之功主君之力也由是言之人臣不能立功凡有功者皆其君之功也機權論慶厯五年作世之命機權也妄故作機權論以辨之機者弩之所以發矢者也機正於此而的中於彼差之至㣲失之甚逺故聖人之用機也似之易曰機者動之㣲吉凶之先見者也又曰君子見機而作不俟終日然則機者事之未著萌芽端兆之時聖人眇然見之能去禍而取福迎吉而禦凶所以為神也聖人之所慎無過機者故曰兢兢業業一日二日萬機也權者銓也所以平輕重者也聖人之用權也必將校輕重商緩急彼重而此輕則捨此而取彼彼緩而此急則去彼而就此取捨去就之間不離於道乃所謂權也然則機者仁之端也權者義之平也今世俗之為說者乃欲弃仁義而行機權不亦反哉夫不知機權則無以為聖人聖人未嘗斯湏不用者機權而已矣聖人精心審謹而後行之故百姓萬物皆頼焉小人不知機權之道而誣竊其名妄行誖理所以福祿不乆而禍亂及之也請問聖人機權之道曰昔紂為玉杯象箸而箕子佯狂衛靈公仰視蜚鴻而孔子行是皆知機者也夫杯箸小器飾以珠玉未為太過而箕子知其必亡國者為其奢淫泰侈之漸由此始也仰視蜚鴻失理之細者而孔子去之者知其不能用聖人而有厭怠之心不去則大禍將至也如此聖人之知機豈不偉哉伊尹放太甲㣲子去商歸周周公誅管蔡是皆知權者也夫數君子豈不知放君畔宗戮親之為不善哉誠以放君之責輕而淪喪大業之禍重畔宗之譏薄而保存宗祀之孝深戮親之嫌小而傾覆周室之害大故去彼而取此也夫太甲之初欲敗度縱敗禮苟非苦其身體勞其思慮則不能變惡遷善克終允徳成湯之業將墜於地伊尹躬受湯命阿衡王家故不得不放諸桐宫也受為不道自絶於天㣲子不去與之偕亡則祖禰不祀宗族無主故不得不抱祭器而歸周也管蔡奉廢姓伐宗國違天命逆人心傾危聖輔斵喪周室成王㓜弱周公攝政故不得不奮干戈揚斧鉞以治之盖周公非自愛而愛周室故也嚮若太甲尚可諌而改則伊尹必不放君商受苟可輔而存則㣲子必不畔宗管蔡猶可教而治則周公必不戮親夫豈不思誠不得已也是以太甲曰惟嗣王不恵于阿衡伊尹作書曰祗爾厥辟辟不辟忝厥祖是猶以辱先為戒未欲正言覆亡之禍委蛇其辭以感切之也王惟庸罔念聞伊尹乃言曰無越厥命以自覆是正言禍敗以聳動之也王未克變伊尹乃以王生而榮逸不知勞辱狎近小人積習至此非其性惡故曰茲乃不義習與性成營于桐宫宻邇先王其訓無俾世迷言積習寖乆將成其性及今猶可沮詘而改此乃伊尹盡心盡力於成湯太甲之至也㣲子之誥曰商其弗或亂正四方言受不可復正决必亡國已所以當出奔存湯後也父師若曰商其淪喪我罔為臣僕言商既亡宗族俱滅無所寄託也又曰王子弗出我乃顛隮言不可不行也此㣲子廣咨權謀輕重之審諦也大誥曰肆予沖人不卭自恤義爾邦君越爾多士尹氏御事言今東征非為巳也􅃎風曰既取我子無毁我室子以喻管蔡也室以喻周家也言管蔡輕而周家重也予羽譙譙予尾翛翛言勤瘁也予室翹翹風雨所漂揺予唯音嘵嘵言三監背誕王室阽危故我恐懼以憂之也此豈周公背公向私之志哉夫聖人之用權也如此故國家安而仁義立也後世之人昧錙銖之利以放逐其君懷芥帯之嫌以屠滅其親而亦自比於伊周曰吾用機權不亦誣哉此乃亂臣賊子所以滋多也朋黨論嘉祐三年五月二十三日作黄介夫作壞唐論五篇以為壞唐者非巢温與閹䜿乃李宗閔李徳裕朋黨之弊也是誠得其本矣雖然介夫知其一未知其二彼盜賊之興由閹竪閹竪之横由輔相則信然矣噫輔相樹立私黨更相排壓而不能正又誰咎哉夫朋黨之患不専在唐自古有之以堯之明共工驤兠相薦於朝舜臣堯既流共工又放驩兠除其邪黨然後四門穆穆百工咸熈仲虺數夏之惡曰簡賢附勢實繁有徒武王數商之惡曰朋家作仇脅權相滅是則治亂之世未嘗無朋黨堯舜聰明故能别白善惡而徳業昌明桀紂昏亂故不能區處是非而邦家覆亡由是言之興亡不在朋黨而在昏明矣洪範皇極曰無偏無詖遵王之義無有作好遵王之道無有作惡遵王之路無偏無黨王道蕩蕩無黨無偏王道平平無反無側王道正直周公戒成王曰孺子其朋孺子其朋其往無若火始燄燄厥攸灼叙弗其絶是以舜誅禹父而禹為舜佐伊尹放太甲而相之周公放蔡叔而封蔡仲公之至也夫宗閔徳裕雖為朋黨由文宗實使之文宗嘗曰去河北賊易去朝中朋黨難殊不知群臣為朋黨誰之過也由是觀之壞唐者文宗之不明宗閔徳裕不足専罪也中和論元豐七年十月三日作君子從學貴於博求道貴於要道之要在治方寸之地而已大禹謨曰人心惟危道心惟㣲惟精惟一允執厥中危則難安㣲則難明精之所以明其㣲也一之所以安其危也要在執中而已中庸曰喜怒哀樂之未發謂之中發而皆中節謂之和君子之心於喜怒哀樂之未發未始不存乎中故謂之中庸庸常也以中為常也及其既發必制之以中則無不中節中節則和矣是中和一物也養之為中發之為和故曰中者天下之大本也和者天下之逹道也智者知此者也仁者守此者也禮者履此者也樂者樂此者也政者正其不然者也刑者威其不從者也合而言之謂之道道者聖賢之所共由也豈惟人哉天地之所以生成萬物靡不由之故曰致中和天地位焉萬物育焉孔子曰君子無終食之間違仁造次必於是顛沛必於是故曰道不可湏臾離可離非道也孔子曰中庸之為徳也其至矣乎民鮮乆矣又曰回也其心三月不違仁其餘則日月至焉而已日月至焉者斯巳賢矣以是觀之能乆於中庸者盖鮮矣孔子曰智者樂仁者夀盖言知夫中和者無入而不自得能無樂乎守夫中和者清明在躬志氣如神能無夀乎小雅曰樂只君子邦家之基樂只君子萬夀無期又曰樂只君子邦家之光樂只君子萬夀無疆盖言君子有中和之徳則邦家安榮既樂且夀也孔子曰克已復禮為仁盖言禮者中和之法仁者中和之行故得禮斯得仁矣孔子閒居曰無聲之樂志氣不違以至於氣志既起樂記曰易直子諒之心生則樂以至於不言而信不怒而威盖言樂以中和為本以鐘鼔為末也商頌曰不競不絿不剛不柔敷政優優百祿是遒盖言政以中和為美也大雅曰恵此中國以綏四方無縱詭隨以謹無良盖言刑以中和為貴也子曰飯蔬食飲水曲肱而枕之樂亦在其中矣又曰回也一簞食一瓢飲不改其樂揚子曰紆朱懷金之樂也外顔氏子之樂也内盖言聖賢内守中和雖幽隠貧賤不失其樂也劉康公曰民受天地之中以生所謂命也能者養之以福不能者敗以取禍中庸曰大徳者必得其夀盖言君子動以中和為節至於飲食起居咸得其宜則隂陽不能病天地不能夭雖不𨗳引服餌不失其夀也孟子曰我善養吾浩然之氣夫志氣之帥也氣體之充也志至焉氣次焉故孟子養徳以氣言之盖能謹守中和之志不以喜怒哀樂亂其氣則志平氣順徳日新矣故曰持其志無暴其氣及夫徳之成也沛然不息確然不動挺然不屈故曰其為氣也至大至剛以直養而無害不有道義以充其内能如此乎故曰配義與道無是餒也凡人為不善能欺天下之人不能欺其心雖忌而行之於其心不能無蔕芥焉然則浩然之氣不存矣故曰行有不慊於心則餒矣君子優游從容以養其氣雖不敢忽忘亦不正以為事欲其速成故曰必有事焉而勿正心勿忘勿助長也操之則存捨之則亡乆而無怠然後自得之此其所以難言也揚子曰藏心于淵美厥靈根君子存神於内應務於外雖徃来萬變未嘗失其所守是以百骸治而徳本植焉故曰神不外也志之所至氣必輔之君子乗之以為善小人乗之以為惡故曰氣者所適善惡之馬也君子守中和之心養中和之氣既得其樂又得其夀夫復何求哉孔子曰狂者進取又曰吾黨之小子狂簡斐然成章如光之謂矣雖然此皆纂述聖賢之言非取諸􅎍臆也夫道猶的也射者莫不志於的其中否則未可知也必俟有道者乃能裁之才徳論慶厯五年作世之所謂賢者何㢤非才與徳之謂邪二者殊異不可不察所謂才者存諸天徳者存諸人智愚勇怯才也愚不可强智怯不可强勇四者有常分而不可移故曰存諸天善惡逆順徳也人苟弃惡而取善變逆而就順孰禦之㢤故曰存諸人譬之於物金可以為鐘可以為鼎玉可以為珪可以為璧此存諸人者也玉不可以為鐘鼎金不可以為珪璧此存諸天者也存諸天者聖人因而用之存諸人者聖人教而成之雖然自非上聖必有偏也厚於才者或薄於徳豐於徳者或殺於才鈞之不能兩全寧捨才而取徳昔者酆舒有三雋才恃之而不務徳晋滅之智宣子將以瑶為後智果曰不如宵也瑶之賢於人者五其不逮者一也美􅂡長大則賢射御足力則賢技藝畢給則賢巧文辯慧則賢彊毅果敢則賢如是而甚不仁以其五賢陵人而以不仁行之智宗必滅宣子弗聴智氏果亡故曰寧捨才而取徳抑又聞之為國家者進取莫若才守成莫若徳進取不以才則無功守成不以徳則不乆陳平貪汚之人也韓信無耻之士也樊噲屠者而酈食其酒徒也天下之至賤無行者也然其才皆有過人者漢祖舉而用之故蹶秦仆項而卒兼天下也魏國置相而用田文吳起不恱與之論功田文曰我戰鬬治民皆不如子若主㓜國危大臣未附百姓不信當是時屬之子乎屬之我乎吳起乃謝曰屬之子矣此言田文無佗技能唯忠厚可信也夫有徳者必不反其君故可以託六尺之孤寄百里之命為社稷臣有才者不必忠信故以羈筞御之而為徳者役也然則徳者掌也才者指也掌亡則指不可用矣是故民者田也國者苖也才耒耜也徳膏澤也進取不以才猶無耒耜而耕也雖勤灌溉不能生矣守成不以徳猶既種而無膏澤也苖槁無日矣故人主利其耒耜以墾治其民而封殖其國又引膏澤以溉之使其本根深固而枝葉葰茂故子孫謹守其畔獲而食之而已復何為㢤傳家集巻六十四欽定四庫全書傳家集巻六十五宋司馬光撰論二知人論嘉祐二年作考制度習威儀辯牢餼之等詳籩豆之數此宗人之職也察清濁别正邪恊律吕之音肄綴兆之容此太師之職也練士卒簡器械戰必勝攻必取此將帥之職也明法令審獄訟禁彊禦誅姦回此士師之職也豐衣食衍貨財通有無紆滯積此司㑹之職也便舟輿利器械守法度禁滛巧此工師之職也考龜筮占祲祥相吉凶視休咎此太卜之職也謹盖藏吝出納治文書精㑹計此府史之職也若夫選賢而進之量能而任之成功者賞敗官者誅此則人君之職也夫天下至廣也兆民至衆也萬機至繁也而天子兼而有之必將以一人之耳目智力為之則所及者寡所廢者多矣是以明主擇輔佐以論官師論官師以正羣吏正羣吏以和萬民則治約而事無曠矣益稷曰元首眀㢤股肱良㢤庶事康㢤此言君眀則臣良矣良則事康也立政曰宅乃事宅乃牧宅乃凖茲惟后矣又曰文王惟克厥宅心乃克立茲常事司牧人以克俊有徳文王罔攸兼于庶言庶獄庶慎惟有司之牧夫是訓用違庶獄庶慎文王罔敢知于茲此為人君急於知人緩於知事也魏文侯與田子方飲文侯曰鐘聲不比乎左髙田子方笑文侯曰何笑子方曰臣聞之君明樂官不明樂音今君審於音臣恐其聾於官也是以笑荀子曰治國有道人主有職若夫貫日而治詳一日而曲列之是所以使夫百吏官人為也不足以是傷遊玩安燕之樂若夫論一相以兼率之使臣下百吏莫不宿道鄉方而務是夫人主之職也人主者守至約而詳事至佚而功垂衣裳不下簟席之上而海内之民莫不願得以為帝王夫是之謂至約樂莫大焉人主者以官人為能者也匹夫者以自能為能者也人主得使人為之匹夫則無所移之百畝一守事業窮無所移之也今以一人兼聴天下日有餘而治不足者使人為之也大有天下小有一國必自為之然後可則勞苦耗悴莫甚焉如是則雖臧獲不肯與天子易勢業以是統天下一四海何故必自為之自為之者役夫之道也墨子之說也論徳使能而官施之者聖王之道也儒之所謹守也傳曰農分田而耕賈分貨而販百工分事而勸士大夫分職而聽建國諸侯之君分土而守三公揔方而議則天子恭已而已矣由是言之人君之事守莫大於知人也昔者舜𨗳百川不如禹殖百糓不如稷布五教不如契聽五刑不如臯陶典百工不如垂典山澤不如益典禮不如伯夷典樂不如䕫然而明此八者之本能知其人而任使之者舜也譬如車之有轂宫之有棟人之有心此羣聖所以為之役而歸之功也嗚呼帝王之事美矣大矣固不可得而言也齊桓公兄弟爭國暴於犲狼閨門不治甚於狗彘然獨能知管仲之賢舉國而委之一則仲父二則仲父是以兵車之㑹三乗車之㑹六指麾左右而諸侯莫敢不從後世言桓公者徒知其賢而不復知其惡也孔子言衛靈公之無道季康子曰夫如是奚而不喪子曰仲叔圉治賔客祝佗治宗廟王孫賈治軍旅夫如是奚其喪齊文宣帝荒滛狂悖甚於桀紂然而知楊愔之賢悉以國事委之時人以為主昏於上政清於下凡此皆滛昏暴亂之君也徒以能知賢人而用之大者以霸其次以安小者以存况乎以聖君而用賢臣是猶王良之御六驥逢䝉之闗繁弱孟賁之揮干將何適而不逹何射而不中何擊而不斷哉或曰人主之職在知人則既知之矣抑以堯之聖而失之四凶孔子之聖而失之宰我子羽夫人豈易知也哉曰是則然矣夫射者必志於的弓矢既調専精審固而發之雖或不中亦鮮矣與夫冥冥而射者不猶愈乎昔臯陶陳九徳曰寛而栗柔而立愿而恭亂而肅擾而毅直而温簡而㢘剛而塞彊而義彰厥有常吉哉日宣三徳夙夜浚明有家日嚴祗敬六徳亮采有邦翕受敷施九徳咸事俊乂在官百僚師師百工惟時孔子曰視其所以觀其所由察其所安人焉廋哉人焉廋哉李克曰居視其所親富視其所與逹視其所舉窮視其所不為貧視其所不取是亦知人之術也顧人主不深察而已矣三勤論揚子曰民有三勤政善而吏惡一勤也吏善而政惡二勤也政吏駢惡三勤也愚謂勤民者一未嘗有三也何則吏者民之司命吏良則民斯逸矣未有吏善而政惡者也亦未有政善而吏惡者也度吏之才而任之者君之政也形民之力而用之者吏之政也吏苟得人安有榖人不足於晝絲人不足於夜者乎故為人君者謹於擇吏而已矣佗奚足事哉十哲論慶歴二年作十哲於經無見而學者多稱之國家祀孔子十哲則祀於堂上其餘門人祀於東西廡下爼豆之數皆異焉愚竊以為過矣是十人者孔子雖以四科第之非謂門人之中唯十人為賢也至於柴也愚參也魯師也辟由也喭豈謂唯此四人為不肖邪以此觀之尊十哲非孔子意眀矣必若以一善取之則門人之賢者非止十人也以盡善取之則徳行之外未有無過者也孔子謂宰我曰朽木不可彫於予與何誅謂子貢曰賜不受命而貨殖焉億則屢中謂冉有曰求也非吾徒也小子鳴鼓而攻之可也謂子路曰由知徳者鮮矣謂子夏曰商也不及然則豈為盡善邪又十哲之外孔子之所稱譽多矣曾㸃與子路冉有俱侍坐各言其志而孔子獨曰吾與㸃也曽參以至孝顯孔子為之語孝經又謂子賤君子㢤若人然則十人之餘豈可盡誣邪且政事言語文學之髙者不足以當徳行之卑者是十人者其中固有差等矣豈可為之一槩耶四豪論慶厯二年作戰國之時天下禮義消亡下陵上替諸侯僣天子大夫僣諸侯陪臣之間有能約身抑志尊賢養士不愛煩費以樹聲名者齊有孟嘗魏有信陵趙有平原楚有春申雖不能以禮義佐其君以政教和其民合於至公槩於大道然自奮於濁世天下談士異口同舌咸謂之賢銓於四人臧否優劣亦可聞歟論者曰夫人臣者上以事君中以利國下以養民釋此三者非人臣也臣而不臣聖王當世必為誅首孟嘗君養士頼匿亡命廢公法樹私恩媮采名譽以竊國相之任迹其行事皆為身耳非能為國與民謀也至其晚節遂挾仇敵以覆宗國保薛中立自比諸侯臣而不臣孰甚於此春申君進書春宫觧楚國社稷之憂縱楚太子而自以身當不測之誅智勇忠信有足稱者至其柱石楚國權寵無貳割江東之封窮僣奢之樂十餘年間楚國益弱又納邪人之言造姦偽之謀亂其國嗣洿敗王家方諸田文罪又甚焉終為李園所襲身首屠裂則其智勇忠信果安在也平原君行事大倣孟嘗至於貪上黨之田致邯鄲之禍遂至國家大敗社稷㡬亡于以知其智謀尤出數子之下也然趙奢戮平原君之客奢諭釋以公義而平原君薦奢於朝卒著功名且平原君臣人之莭終始無􅃜此其賢於孟嘗春申逺矣信陵君以母弟之親卿相之尊抱闗鼓刀之人親執馭而事之詘而不耻勞而不倦非有髙世之材孰能如此且向使侯生朱亥皆實庸人公子雖事之如是不足稱也然公子所以降身詘志者審知二子之賢耳以區區之魏惴懼之衆當秦乗勝十倍之兵一戰却之邯鄲全六國安信陵君之功也秦乗公子之去魏急攻大梁公子一悟毛薛之言飜然易慮歸救宗國復破秦軍閉諸函谷可謂能矣魏王信讒猜阻公子公子遂滅迹酣飲全身逺害以其夀終可謂智矣智能如此而又守之以仁行之以恭必若采善於亂世論賢於俠㳺則彼三人者蔑以加其上矣故校其臧否當以信陵為首平原次之孟嘗又次之春申為其下矣或曰無忌盜國兵符矯殺晉鄙以赴平原君之私交雖有功於魏非忠臣也何以賢於三子對曰趙魏脣齒之國以虎狼之秦攻危亡之趙趙亡則魏斃理勢然矣魏王不逹事宜徒畏强秦之空言坐擁盛兵以觀成敗計之大失無過於此故無忌矯奪其軍以救趙非獨赴趙之難亦為魏謀也奚其不忠哉漢髙祖過大梁輒祠信陵君為置守冢者彼三子則皆無旌異髙祖英主也盖有以知之矣管仲論孔子稱管仲之器小哉先儒以為管仲得君如此不勉之以王而僅止於霸此其所以為小也愚以為周天子存而管仲勉齊桓公以王是教之篡也此管仲所耻而不為孔子顧欲其為之邪夫大人者顧時不用則已用則必以禮樂正天下使綱紀文章粲然有萬世之安豈直一時之功名而巳邪管仲相桓公霸諸侯禹迹所及冠帯所加未能使之皆率職也而偃然自以天下為莫已若也朱紘而鏤簋反坫而三歸此其器豈不小哉揚子曰大器其猶規矩凖繩乎先自治而後治人斯言得之矣荀息論晉獻公使荀息傳奚齊荀息曰臣竭其股肱之力不濟則以死繼之及里克殺奚齊荀息死之君子曰詩所謂白圭之玷尚可磨也斯言之玷不可為也荀息有焉杜元凱以為荀息有此詩人重言之義以愚觀之元凱失左氏之意多矣彼生與君言死而背之者是小人穿窬之行君子所不譏也夫立嫡以長正也獻公溺於嬖寵廢長立少荀息為國正卿君所倚信不能明白禮義以格君心之非而遽以死許之是則荀息之言玷於獻公未沒之前而不可救於已沒之後也然則左氏之志所以貶荀息而非所以為襃也㢘頗論慶歷五年作世稱藺相如以區區之趙抗虎狼之秦秦雖彊暴不能陵趙者相如之功也謂其賢於㢘頗愚竊疑之何則秦之所以不能陵趙者以其國治兵彊也固非口舌之間所能抗也然則國何以治兵何以彊豈非㢘頗在其位邪趙得和氏璧秦王聞而欲之請易之以土田相如奉璧銜命而徃秦王欲彊取之相如抗節不撓視死如歸卒欺秦王而歸璧於趙以是為相如之功噫又何足稱哉夫和氏之璧懷握之玩得之不足以為重失之不足以為輕而相如以死爭之以詐取之有如秦王赫然増怒肆其彊暴逞其毒螫菹醢相如移兵攻趙是為趙王愛數寸之玉喪國士之賢貪無用之器貽宗廟之憂人臣愛君果如是哉澠水之㑹秦王請趙王鼓瑟而詔史書之相如進缶於秦王秦王不可則挺劒劫之必得當而後止是何異賈竪小人矜豪恃氣不能相下者惡足言功哉昔桀為無道湯幽囚於夏臺戎狄侵豳太王避之於岐文王三分天下有其二就拘於羑里夫以幽拘之辱棄國而逃與一鼓瑟之間孰難哉然而三王忍耻行之卒蹶夏商撫綏四海相如儻能相趙王示㣲弱以驕秦忍小耻以怒趙崇徳修政以湏秦之可亡從而仆之濟黔首於塗炭救赤子於虎狼其功烈豈不煒􅂱光逺哉而於罇爼之間壇坫之上爭言暴氣取當而止英偉之士不亦可羞哉趙王不能逺觀嘉其一命之不辱賞其要劫之小䇿一旦位諸功實之上㢘頗日夜憤憤欲礪刃刺之而相如能不與之校此則賢矣然亦不可用一善掩大功世稱藺優於㢘非通論也賈生論慶歷三年作世皆以賈生聰明辯愽曉練治體若遭明主當治世誠得盡用其道三代可復帝皇可㡬不幸黜於絳灌踈廢早終可為痛惜愚以為賈生學不純正雖有儁才任之為治必不效矣何以知之觀其書而知之賈生數上䟽陳得失云可為痛哭者一流涕者二太息者六然所謂痛哭者謂侯太彊也以為指大於股脛大於要乆而不制必為國害夫為天下者患政刑之不立不患諸侯之太彊賈生言不見用然終文帝世諸侯帖服孝景初立晁錯不勝其憤而削之反者紛然響應起不踰時敗亡不救惡能為漢之大害哉所謂流涕者匈奴不賔也匈奴荒外之國與禽獸無殊天下治而不服不足損聖王之徳天下弊而得之不足為聖王之功而賈生孜孜愛其蕞爾之金絮忘其征討之大費忿其區區之禮節忽其勤民之鉅害惡在其為知治體也夫治天下之具孰先於禮義安天下之本孰先於嗣君禮義不張雖復四夷賔服彊場不聳當如内憂何儲嗣失教雖復諸侯㣲弱四方無虞其誰能守之然賈生以此二者列之於後以為餘事捨國家之紀綱遺天下之大本顧切切然以列國外夷為慮皆涕泣之可謂悖本末之統謬緩急之序謂之知治體何哉又曰仁義者人主之芒刃也法制者人主之斤斧也不能以道輔人主鎮撫諸侯緩之以徳齊之以禮而欲踈骨肉斷慈恵視仁義為虚器操刑法為利柄翦周孔之夷塗樹申商之險術由此觀之所學豈得為純正耶世人不察其所由之術苟見其材之茂學之博其言暐曄可觀而不得施於世因從而歎之不知夫駮濫刻深非吾黨也夫唯材髙而道不正者君子惡之龔君賔王莽慕龔君賔之名訹以尊爵厚祿劫以滛威重勢而必􅆀之君賔不勝逼迫絶食而死班固以薫膏之語譏焉未聞有為辨之者也可不大哀昔者紂為不道毒痡四海武王不忍天下困窮而征之斯則有道天子誅一亂政之匹夫爾於何不可而伯夷叔齊深非之義不食周粟而餓死狷隘如此仲尼猶稱之曰仁以為不殞其節而已况於王莽慿漢累世之恩因其繼嗣衰絶飾詐偽而盗之又欲誣洿清士以其臭腐之爵祿甘言諛禮期於必致不可以智免不可以義攘則志行之士舎死何以全其道哉或者謂其不能黜芳棄明保其天年然則虎豹之鞹何以異於犬羊之鞹庸人之行孰不如此又責其不詭辭曲對若薛方然然則將未免於諂豈曰能賢故君賔遭遇無道及此窮矣失節之徒排毁忠正以遂已非不察者又從而和之太史公稱伯夷叔齊不有孔子則西山之餓夫誰識知之信矣哉邴吉論邴吉為丞相出逄羣盗格鬬死傷横道過之不問見牛喘而問之以為詰禁盗賊守令之事隂陽不調此乃宰相職耳談者美之愚竊以為不然夫宰相所以治隂陽者豈拱手端署無所施設而隂陽自調盖亦佐人主治庶政安四海使和氣洋洋薄於宇宙旁暢周逹浸潤渗漉明則百姓洽幽則鬼神諧然後寒暑時至萬物阜安雖古昔聖人之治天下至於隂陽和寒暑時而至治極矣豈庸人所能致哉當邴吉為政之時政治之不得刑罰之失中不肖之未去忠賢之未進可勝紀哉釋此不慮而慮於牛喘以求隂陽不亦踈乎且京邑之内盗賊縱横政之不行孰甚於此詩云商邑翼翼四方之極近不能正如逺人何若曰守令之職守令不賢當責何人非執政者之過而又誰歟昔士㑹為政晉國之盗逃奔于秦子産為政桃李垂於街者英援若盗賊不禁而曰長安令之職風俗不和而曰三老之職刑罰不當而曰廷尉之職衣食不足而曰司農之職推而演之天下之事各有其官則宰相居於其間悉無所與而曰主調隂陽隂陽固可坐而調耶愚以為邴吉自知居其位而無益於世飾智譎問以揜其迹抑亦自欺而已矣致知在格物論元豐六年作人之情莫不好善而惡惡慕是而羞非然善且是者盖寡惡且非者實多何哉皆物誘之也物迫之也桀紂亦知禹湯之為聖也而所為與之反者不能勝其欲心故也盗跖亦知顔閔之為賢也而所為與之反者不能勝其利心故也不軌之民非不知穿窬探囊之可羞也而冒行之驅於饑寒故也失節之臣亦非不知反君事讎之可愧也而忍處之逼於刑禍故也况於學者豈不知仁義之美㢘耻之尚哉斗升之秩錙銖之利誘於前則趍之如流水豈能安展禽之黜樂顔子之貧乎動色之怒毫末之害迫於後則畏之如烈火豈能守伯夷之餓徇比干之死乎如此則何暇仁義之思㢘耻之顧哉不惟不思與不顧也抑亦莫之知也譬如逐獸者不見泰山彈雀者不覺露之霑衣也所以然者物蔽之也故水誠清矣泥沙汩之則俛而不見其影燭誠明矣舉掌翳之則咫尺不辨人眉目况富貴之汩其智貧賤之翳其心哉惟好學君子為不然已之道誠善也是也雖茹之以藜藿如粱肉臨之以鼎鑊如茵席誠惡也非也雖位之以公相如塗泥賂之以萬金如糞壤如此則視天下之事善惡是非如數一二如辨黒白如日之出無所不照如風之入無所不通洞然四逹安有不知者哉所以然者物莫之蔽故也於是依仁以為宅遵義以為路誠意以行之正心以處之修身以帥之則天下國家何為而不治哉大學曰致知在格物格猶扞也禦也能扞禦外物然後能知至道矣鄭氏以格為来或者猶未盡古人之意乎塟論元豐七年作塟者藏也孝子不忍其親之暴露故斂而藏之賫送不必厚厚者有損無益古人論之詳矣今人塟不厚於古而拘於隂陽禁忌則甚焉古者雖卜宅卜日盖先謀人事之便然後質諸蓍龜庶無後艱耳無常地與常日也今之塟書乃相山川岡畎之形勢考嵗月日時之支干以為子孫貴賤貧富夀夭賢愚皆繫焉非此地非此時不可塟也舉世惑而信之於是喪親者徃徃乆而不塟問之曰嵗月未利也又曰未有吉地也又曰遊宦逺方未得歸也又曰貧未能辦塟具也至有終身累世而不塟遂弃失尸柩不知其處者嗚呼可不令人深歎愍哉人所貴於身後有子孫者為能藏其形骸也其所為乃如是曷若無子孫死於道路猶有仁者見而殣之邪先王制禮塟期逺不過七月今世著令自王公以下皆三月而塟又禮未塟不變服食粥居倚廬哀親之未有所歸也既塟然後漸有變除今之人背禮違法未塟而除喪從宦四方食稻衣錦飲酒作樂其心安乎人之貴賤貧富夀夭繫於天賢愚繫於人固無闗預於塟就使皆如塟師之言為人子者方當哀窮之際何忍不顧其親之暴露乃欲自營福利邪昔者吾諸祖之塟也家甚貧不能具棺槨自太尉公而下始有棺槨然金銀珠玉之物未嘗以錙銖入於壙中將塟太尉公族人皆曰塟者家之大事柰何不詢隂陽此必不可吾兄伯康無如之何乃曰詢於隂陽則可矣安得良塟師而詢之族人曰近村有張生者良師也數縣皆用之兄乃召張生許以錢貳萬張生野夫也世為塟師為野人塟所得不過千錢聞之大喜兄曰汝能用吾言吾畀爾塟不用吾言將求佗師張師曰惟命是聴於是兄自以已意處嵗月日時及壙之淺深廣狹道路所從出皆取便於事者使張生以塟書縁飾之曰大吉以示族人族人皆恱無違異者今吾兄年七十九以列卿致仕吾年六十六忝備侍從宗族之從仕者二十有三人視佗人之謹用塟書未必勝吾家也前年吾妻死棺成而斂装辦而行壙成而塟未嘗以一言詢隂陽家迄今無佗故吾常疾隂陽家立邪說以惑衆為世患於喪家尤甚頃為諫官嘗奏乞禁天下塟書當時執政莫以為意今著茲論庶俾後之子孫塟必以時欲知塟具之不必厚視吾祖欲知塟書之不足信視吾家傳家集巻六十五欽定四庫全書傳家集巻六十六宋司馬光撰議不以卑臨尊議慶厯五年作大傳以為武王克商祀於牧室追王太王王季文王不以卑臨尊也夫父子之間譬猶天地之體殊君臣之位絶尊卑之分天性自然是以子雖為天子無害父之尊父雖為士子不敢先之人道之大倫古今之通義也武王纂紹前迹登隆基緒追尊先世告成王業盖以推功歸美崇戴前人非謂身臨四海之尊不可以諸侯為祖父也竊謂記禮者深於聖人之㫖失之何則太王王季文王追襃旣盛則太王之前公劉不窋之倫尚為以卑臨尊未得謂之順也然則追稱繼號終已無窮豈可行哉謹案武成曰太王肇基王迹王季其勤王家我文考文王克成厥勲又周頌曰天作髙山太王荒之大雅曰維此王季受祿無喪奄有四方至言文王受命非一不可悉著然則周之王迹肇於太王茂於王季成於文王終於武王武王既有四海追思王迹之所由興積功開業之艱難是故推三世而王之以明非已功藉祖宗之餘烈也聖人之志昭晰若此而謂之不欲以卑臨尊其為失也大矣且夫以太王之仁愛勤勞王季之孝友光明文王之布徳行化討叛懐柔三分天下之諸侯而有其二謙畏天命不輯大勲以授聖子武王因累世之基用既王之周推已亡之商而取天位臨四海朝諸侯雖以中庸之君處之猶不敢盖其祖宗之勲謂天祿由已而成徒以私意追王祖宗不使諸侯臨天子之尊而已况於武王大聖豈得爾哉泰誓曰予克受非予武惟朕文考無罪受克予非朕文考有罪惟予小子無良夫武王歸美前人之意如此追王之理豈不明與祔廟議嘉祐八年六月一日上禮天子七廟三昭三穆與太祖之廟而七太祖之廟萬世不毁其餘昭穆盡則毁示有終也自漢已來天子或起於布衣以受命之初太祖尚在三昭三穆之次故或祀四世或祀六世其太祖以上之主雖屬尊於太祖親盡則遷故漢元帝之世太上廟主瘞於寝園魏明帝之世處士廟主遷於園邑晉武帝祔廟遷征西府君惠帝祔廟又遷豫章府君自是以下大抵過六世則遷其神主盖以太祖未正東嚮之位故止祀三昭三穆若太祖已正東嚮之位則并三昭三穆為七世矣唐髙祖初立祀四世太宗増祀六世及太宗祔廟則遷洪農府君神主於夾室髙宗祔廟又遷宣皇神主於夾室皆祀六世此前世之成法也惟明皇立九室祀八世事不經見難可依據今若以太祖太宗為一世則大行皇帝祔廟之日禧祖親盡當遷於西夾室祀三昭三穆於先王典禮及近世之制無不符合太廟更不須添展一室配天議伏准中書劄子翰林學士王珪及知制誥錢公輔等奏季秋大饗明堂以仁宗皇帝配神作主事奉聖㫖令臺諫及經筵臣寮與兩制禮院同共再詳定聞奏者朝廷以祖宗事重不敢自專愽訪羣臣使各陳其意臣等愚懵不達古今但據所聞正禮以對至於取捨繫自聖明竊以孝子之心誰不欲尊其父者聖人制禮以為之極不敢踰也故祖已訓髙宗曰祀無豐于昵孔子與孟懿子論孝亦曰祭之以禮然則事親者不以數祭為孝貴於得禮而已矣祭法有虞氏禘黄帝而郊嚳祖顓頊而宗堯夏后氏禘黄帝而郊鯀祖顓頊而宗禹商人禘嚳而郊冥祖契而宗湯周人禘嚳而郊稷祖文王而宗武王先儒謂禘郊祖宗皆祭祀以配食也禘謂祭昊天於圓丘也祭上帝於南郊曰郊祭五帝五神於明堂曰祖宗故詩曰思文后稷克配彼天又我將祀文王於明堂此其證也下此皆不見於經矣前漢以髙祖配天後漢以光武配明堂以是觀之古之帝王自非建邦啓土及造有區夏者皆無配天之文故雖周之成康漢之文景明帝章帝其徳業非不美也然而子孫不敢推以配天者避祖宗也孝經曰嚴父莫大於配天則周公其人也孔子以周公有聖人之徳成太平之業制禮作樂而文王適其父也故引之以證聖人之徳莫大於孝答曽子之問而已非謂凡有天下者皆當尊其父以配天然後為孝也近世祀明堂者皆以其父配五帝此乃誤識孝經之意而違先王之禮不可以為法也景祐二年仁宗詔禮官稽案典籍辨崇配之序定二祧之位乃以太祖為帝者之祖比周之后稷太宗真宗為帝者之宗比周之文武然則祀真宗於明堂以配五帝亦未失古禮今仁宗雖豐功美徳洽於四海而不在二祧之位議者乃欲捨真宗而以仁宗配食明堂恐於祭法不合又以人情言之是絀祖而進父也夏父弗忌躋僖公先兄而後弟孔子猶以為逆祀書於春秋况維祖而進父乎必若此有之不獨乖違典禮恐亦非仁宗之意也議者又欲以太祖及三宗迭配郊丘及明堂臣等亦以為不可何則國家受天永命傳祚萬世若繼體守文之君皆得配天則子孫將有無窮之數與祖宗無别也凡為國家者制禮立法必思萬世之規不可專徇目前而已臣等竊謂宜遵舊禮以真宗配五帝於明堂行之為便}
