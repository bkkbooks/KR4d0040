  - {type: variant, offset: 5507, length: 0, content: '', WYG: 章髙出於衆議論為人所信者何可悉數足下不求於彼顧遣使者自衢至洛走數千里専以相委荷雅意期待如此之重乃敢仰違尊命俾使者虚返其為罪戾擢髮有餘所冀大君子聰明通恕知其非可為而不為也慙懅恐悸言不能盡答武功石令飛卿書光啓縣人来䝉示啓事千餘言大指以為明天子在上宜以時起佐萬一以澤斯民不宜専務自逸何足下期待之過而責望之重也捧讀戰悚流汗及踵光聞君子擬人必於其倫仲尼聖人也自生民以来未之有也而足下語及不肖動輒以仲尼况之此雖甚愚不辨菽麥之人亦不敢當無乃重增不肖之罪而為足下失言之累乎不可不可光自惟徳行文學言語政事一無所長在稠人間僅及下中但事君不敢欺得官非智力所任者不敢輕受此固為士者之常守無足言者而世俗閭閻之人遽相與驚恠從而譽之光聞之每踧踖發慙不自知其何以致之蓋所謂名浮於實者也性戇滯不曉時務比又苦衰疾不堪治民遂自乞冗員苟竊㣲禄以庇身養族天子憐其無佗惡直不才耳而嘗厯事三朝今雖昏耄無所用不忍棄捐俾之掌留臺道宫月給錢粟而不責以職事如疲牛老馬尚以莝豆飼之不求其任重致逺脫其紖鞅縱之林野使之徜徉自適以盡其天年此乃天子至仁雖天地之覆載滄海之涵容未足以諭而草木魚蟲無一毫之益以報盛徳乃光有負於朝廷而朝廷實無負於光也光豈敢養髙傲世釣名邀利邪光胷中何所有而足下欲迫之使立朝廷佐下風邪且明天子在上進賢退不肖褒勤黜惰皆决於掌握為人臣者身非巳有如金在鎔泥在鈞惟甄冶之所為用捨進退豈得自専邪竊恐足下誤信世俗之談而有是言也願勿以騏驥之皮䝉駑駘之背而䇿之使一日千里幸甚幸甚答懷州許奉世秀才書五月四日涑水司馬光再拜復書許君秀才足下去年十二月懷州人来䝉惠書自爾日欲因王判官寓書報謝俗事汩沒繼以國䘮奔走京師往返殊無暇稽慢之罪固無所逃光性愚魯自㓜誦諸經讀注疏以求聖人之道直取其合人情物理目前可用者而從之前賢髙竒之論皆如面牆亦不知其有内外中間為古為今也比老止成一樸儒而已曏屢聞王君具道盛美云道甚髙學甚精孝弟隆閨門名義著鄉里常延頸企踵晞仰聲采固非一日不意過聴遽詒之話言仍示以所述孝睦事迹夫孝弟者仁義之實敦睦者政化之本光以是闚足下之志固不待承顔接辭而後知之矣欽服欽服夫玉韞窮山十仞之土不能掩其光珠潜深淵岸草為之不枯足下姑進徳修業但恐大名不免彰徹於世勿病人之不已知也光屬受詔守陳不乆留於洛王君多㳂牒在外今日暫見之来旦復出輒走此布區區草率不悉仍封舊注古文孝經一冊容易上呈庶逹鄙志光頓首再拜與吕晦叔簡光啓自晦叔入都及得共事每與僚宷行坐不相離未甞得伸悃幅雖日夕接武猶隔闊千里也今不幸又在病吿杳未有展覿之期其邑邑可知光平生有國武子之疾好盡言以招人過遇庸人時或妄發以取恨怒况至交益友豈敢反懐情不盡乎晦叔自結􅄠至仕學而行之端方忠厚天下仰服垂老乃得秉國政平生所藴不施於今日將何俟乎比日以来物論頗譏晦叔慎嘿太過若此際不廷爭國事蹉跌則入彼朋矣願慎㫋慎旃光誠不肖豈敢以憂國為已任然昨日富家之諭已上聞矣光自病以来悉以身付醫家事付康惟國事未有所付今日屬於晦叔矣與吕晦叔第二簡介甫文章節義過人處甚多但性不曉事而喜遂非致忠直踈逺讒佞輻輳敗壞百度以至于此今方矯其失革其弊不幸介甫謝世反覆之徒必詆毁百端光意以謂朝廷特宜優加厚禮以振起浮薄之風苟有所得輒以上聞不識晦叔以為如何更不煩答以筆札扆前力言則全仗晦叔也答彭朝議寂書光啓辱書奬借太過期待太厚且愧且懼殆無所容光禀性甚愚求道多蔽徳行言語政事文章皆不迨人齪齪㢘謹自守而已不意時俗妄加虛名如火附螢如膏汚衣潜迯湔澣不知所避固㣲生之不幸未嘗敢取以為已有也屬者朝廷誤賜甄擢俾待罪政府辭不獲命僶俛就職每内訟非據如藉蒺藜素與足下未嘗得接聲采之熟陪從容之乆乃能不逺數千里教以所不及非光無似克堪大賜乃足下愛君仁民之志勤懇切至不暇擇其人之可否而語之也銜荷盛徳刻骨不㤀謹當寳藏時取伏讀以自警筞庶㡬少副萬分之一譬如駑馬聞騏驥嘶鳴不自量度踊躍躑躅亦欲疾歩而從之殊不知軼景遺風雖破骨絶筋而不可及也雖然朝廷近發詔書溥覃四海雖市㕓畎畒之民皆得直上封言事足下位為朝大夫任為部刺史於朝政闕失民間疾苦願不惜以時上聞俟禁中降出得與諸公評議恊同者即行之幸甚幸甚光再拜答程伯淳書光昨日承問及張子厚諡倉卒奉對以漢魏以来此例甚多無不可者退而思之有所未盡竊惟子厚平生用心欲率今世之人復三代之禮者也漢魏以下盖不足法郊特牲曰古者生無爵死無諡爵謂大夫以上者檀弓記禮所由失以謂士之有誄自縣賁父始子厚官比諸侯之大夫則已貴宜有諡矣然曾子問曰賤不誄貴㓜不誄長禮也唯天子稱天以誄之諸侯相誄猶為非禮况弟子而誄其師乎孔子之沒哀公誄之不聞弟子復為之諡也子路欲使門人為臣孔子以為欺天門人厚𦵏顔淵孔子嘆不得視猶子也君子愛人以禮今闗中諸君欲諡子厚而不合於古禮非子厚之志與其以陳文範陶靖節王文中子孟貞曜為比其尊之也曷若以孔子為比乎承闗中諸君决疑於伯淳而伯淳謙遜慱謀及於淺陋不敢不盡所聞而獻之以偹萬一惟伯淳裁擇而折𠂻之答吕由庚推官手書光再啓示諭史院所取文字光前此亦䝉􅂑禀兩朝所上章疏光以身今尚存難將諌草内授史官但答云所上䟽内多渉朝廷機宻不敢輒具録上伏乞朝廷於禁中及中書宻院檢尋如有可采者乞下史院修纂今來先中丞文字又似不同子孫正當發揮前烈垂之不朽唯於慈夀乞增奉養一事恐當諱避其餘言時政闕失彈奏大臣等事今日不録申史院則先公平生事業遂汩沒矣更希裁度光再啓貽劉道原光再拜光少時惟得髙氏小史讀之自宋訖隋正史并南北史或未甞得見或讀之不熟今因修南北朝通鑑方得細觀乃知李延夀之書亦近世之佳史也雖於禨祥談嘲小事無所不載然叙事簡徑比於南北正史無煩冗蕪穢之辭竊謂陳夀之後唯延夀可以亞之也渠亦當時見衆人所作五代史不快意故别自私著此書也但恨延夀不作志使數代制度㳂革皆沒不見道原五代長編若不費功計不日即成若與沈約蕭子顯魏收三志依隋志篇目刪次補葺别為一書與南北史隋志並行則雖正史遺逸不足患矣不知道原肯有意否其符瑞等皆無用可刪後魏釋老志􅂑其要用者附於崔浩傳後官氏志中氏族附於宗室及代初功臣傳後如此則南北史更無遺事矣今國家雖校定摹印正史天下人家共能有㡬本乆逺必不傳於世又校得絶不精只如沈約叙傳差却數板亦不寤其佗可知也以此欲告道原存録其律歷禮樂職官地里食貨刑法之大要耳不知可否如何如何光再拜答范夢得光前者削奏時將謂宫教二年改官不知新制乃須五年得無却成奉滯否慚悚慚悚夢得今来所作叢目方是將實録事目標出其實録中事應移在前後者必已注於逐事下訖假如實録貞觀二十三年李靖薨其下始有靖傳傳中自鎻告變事湏注在隋義寧元年唐公起兵時破蕭銑事湏注在武徳四年滅銑時斬輔公祐湏注在七年平江東時擒頡利湏注在貞觀四年破突厥時佗皆傚此自舊唐書以下俱未曾附注如何遽可作長編也請且將新舊唐書紀志傳及統紀補録并諸家傳記小說以至諸人文}
