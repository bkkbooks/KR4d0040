  - {type: variant, offset: 2885, length: 233, content: 一次投狀乞磨勘豈不慕榮貴者邪臣若隂有營求陽爲辭避乃可謂之飾詐邀名陛下察臣何甞如此豈飾詐邀名者邪臣之愚心正欲辭所不能而已今二府之任自非天下英傑之士不可輕處豈臣愚淺下材所能堪稱或遇國家大事叅陪末議有毫釐之差使陛下有旰食之憂以累知人之哲臣雖伏質橫分不足塞責加之素有目疾不能逺視近日以來頗多徤忘居常供職猶懼廢闕况以衰病當兹重任是用披肝瀝膽昧冒上陳違犯詔旨至于再三觸法抵罪不自知覺伏望聖慈持賜矜察依臣前奏追還新㤙俾守舊職不勝憂慙危切之誠臨𥿄叩頭俯伏俟命取進止乞罷條例司常平使䟽, WYG: ''}
