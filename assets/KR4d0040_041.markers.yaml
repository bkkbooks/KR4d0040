  - {type: variant, offset: 5510, length: 0, content: '', WYG: 一不可委提舉司相度彼雖本職藉賴役錢如魚之有水安肯放免必来沮難無疑也光見欲作一文字奏聞若降至三省望諸公同心叶力與賛成如此行之可以除乆弊蘇疲民凡法乆則難變此法行之已十五年下户雖愁苦上户頗優便常情論議已是非不一若不於此際决志改之恐異日遂為萬世膏肓之疾公家不得用民力貧民常苦富民優矣朝廷今欲整治天下蘇息疲民先湏十八路各得好監司一兩人忠厚曉事憂民忘私使之進賢退不肖興利除害朝廷於本路事有所不知問之則以實對委之措置則不至乖方然後可以倚仗為耳目股肱也苟非其人則百事倒置矣前日所草監司資格及委官薦舉文字不知諸公曽徧見未若如此可行則早告進呈施行然立格為易守格為難既出指揮以後願諸公堅執此格勿自隳壞始為有益也旱勢可懼若春更不雨必成大饑不可不豫為之備國家所賴為根本者莫若農民農民者衣食之原國家不可不先存恤也欲加存恤莫若察其乏食之初早加賑贍使各安土不至流移官費既省民不失業此上䇿也若已流移官雖多作擘畫散米煑粥徒聚為餓殍無益也為今之計莫若豫先將常平斛斗在州縣者十分中支撥一分充賑貸米委州縣樁管許一面支破常切覺察鄉村人户有闕食者許經本縣投狀據口數多少老小出給歷子每五七日一次赴縣請給口食先從下户為始縣亦置簿拘管請却之數如此救接直至成熟日方即一切住支却令還納所貸元數更不取利息如此始是實恵弋俊已獲未聞賞獲之者其將官討捕者不無搔擾宜早罷之前日蔡尹来言開封有巨盜朝廷有募人能禽之者賞以班行今既禽之止賞以錢孔子稱去食去兵無信不立聖朝政令豈當如此諸公更筭其多者范景仁當仁宗不豫未有繼嗣天下寒心莫敢啓口之時獨能首建大議以安宗廟社稷章十九上除官不拜可謂以身徇國之臣其功不在文富之下今文富重賞景仁獨不霑及太皇太后亦應知其功大願諸公進呈秉國文字時詳為敷奏乞優與推恩前日簾前宣諭上封事異等者宜畧加旌賞此乃聖朝美事光有看詳封事厯三巻官職姓名及所言事一一有之願諸公同於其間選擇才識出衆者具姓名敷奏量加襃異以成聖心宻院咨目光比日曵病入朝只為欲與諸公商議數事於簾前敷奏終不能得聚㕔今光飲食日減不能造朝未知㡬時復得瞻望顔色湏至具咨目如左吕大忠言夏虜乍恭乍驁由私市公行故也其延慶侵疆有害無用終當與之然今日未可與也俟大忠到官審察事勢先奏乞嚴禁私市不過年嵗間彼必屈服遣人来祈請然後朝廷下詔曠然歸以侵疆赦其罪戾自今貢賜徃来一切如故此筞大善請明公更召見詢訪其詳然如光愚見若只如去夏約束則大是悠悠徒為玩令一無所益湏别立法云應漢户熟户與西人私相交易者正犯人處斬妻子送江淮編管粉壁曉示許人陳告即時支係省錢五十貫充賞本地分廵檢寨主監押並衝替仍令經畧司本州常切覺察如此逐處行却一兩箇方能禁絶若西人徃年興兵壓境以脅慶州劉忱時亦莫之聴但堅壁清野使自疲弊而去河東經畧司總領二十餘州軍邉靣千餘里地接二邊帥府之重孰過於此而以吉甫處之果能稱職否且如昨者北敵侵火山地不與於初累石時更令撤去彼若放箭我射何傷仍眀據道理𦂳行文牒痛加詰責云當奏朝廷問諸北朝今朝廷亦不共理㑹示之以弱但恐春暖敵狃於得志以為南朝易與大興徒衆廣有占割朝廷亦坐視無如之何土地者國之本若虜惟意所欲無問多少要取便取成何國家此由邉帥不能防㣲杜漸故也渠自乞揚州諸公何不早許之别擇老成重厚有膽畧者以代之子厚方欲措置熈河為經乆之計而元帥乃一方頭目其人豈髙材英器憂國忘家者邪願早易之勿􅃱敗事御史所言保用罷按閱甚當宜從之彼得三時務農豈顧此㣲茫賞物而省國用不少但與逐旋置庫量留些小金帛遇冬教時委令佐選絶藝者賞以銀楪子銀盌綵叚如何又班行雖云猥賤亦是國家命官豈可如泥土與人其出等事藝及正長教人及分數欲更不與班行正長所以鞭撻保丁只為未及分數千賞故也前日見駕部来白沙苑地狭不能容京西所送騍馬且彼無牡馬徒多養騍馬何為但使之積死可惜耳欲令京西未發者皆烙退印還民已發者令沙苑估價出賣如何若可取望早指揮然監牧亦不可不一靣早差官相度興復漢唐都長安故養馬多在汧隴三輔之間國家都大梁故監牧在鄆鄭相衛許洛之間各取便於出入故也今宜且復近處一二監各有舊基故也子厚嘗言軍賞誤何時當與裁減改正邉人立小功者宜勿賞此宋璟所以安開元也封事大約已徧止有兩復吏云其籖子厚欲有去取既難得㑹議彼亦無大利害但請子厚欲去者去之餘令進入貴早結絶與三省宻院論西事簡不和西戎中國終不得髙枕光所上芻蕘果有可采否縱未欲遽以侵地歸之且下一詔數其不賀正旦生辰及登寳位臣禮不備諭以天子新即位務崇寛大曠然赦之自今貢奉賜予宜皆復舊規但不責其必来獻地分畫疆界而已令保安牒與如此則彼此相彌縫且有名又不失大體不乗此際為之萬一彼㣲為邉患或更出不遜語愈難處置願諸公筭其多者傳家集巻六十三欽定四庫全書傳家集巻六十四宋司馬光撰論一功名論嘉祐二年作自古人臣有功者誰哉愚以為人臣未甞有功其有功者皆君之功也何以言之夫地有草木天不雨露之則不能以生月有光華日不照望之則不能以眀臣有事業君不信任之則不能以成此自然之道也古者大國不過百里小國半之然皆有賢卿大夫以輔佐其君大者以王小者以霸下者猶能保其社稷世數十傳而不絶由是觀之天下烏有無士之國哉患在人主知之不明用之不固信之不専耳如是則人臣雖有才智而不得施雖有忠信而不敢效人主徒憂勞於上欲治而愈亂欲安而愈危欲榮而愈辱矣然則人主有賢不能知與無賢同知而不能用與不知同用而不能信與不用同不用賢而求功業之美名譽之白難矣昔百里奚虞人也由余戎人也商鞅魏人也而用於秦苖賁皇申公巫臣楚人也而用於晋伍員楚人也而用於吴韓信陳平項羽之人也而用於漢是五國者非無賢人也主不能知而驅之以資敵國此所謂有賢不能知與無賢同也齊桓公見郭氏之墟問於野人曰郭何故亡對曰以其善善而惡惡公曰善善而惡惡國所以興也而亡何故對曰善善而不能行惡惡而不能去所以亡也公歸以吿管仲曰君與其人俱来乎曰否管仲曰君亦一郭氏也公乃召而官之齊景公待孔子曰若季氏則吾不能以季孟之間待之齊王欲中國而授孟子室養弟子以祿萬鍾使諸大夫國人皆有所矜式是二君者非不知孔孟之為聖賢也不能行其道而徒欲尊之以為名是以孔孟以為不義而不留也洪範曰凡厥正人既富方榖汝弗能使有好于而家時人斯其辜此所謂知賢不能用與不知同也樂毅為燕伐齊下七十餘城燕王疑之使騎劫代將田單詐騎劫而敗之盡失齊地㢘頗為趙將拒秦乆而不戰趙王疑之使趙括代將白起擊趙括而虜之阬其卒}
