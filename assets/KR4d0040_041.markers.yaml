  - {type: variant, offset: 5508, length: 1, content: 卷, WYG: 稍干時事者皆湏依年月注所出篇巻於逐事之下實録所無者亦湏依年月日添附無日者附於其月之下稱是月無月者附於其年之下稱是嵗無年者附於其事之首尾如左傳稱初鄭武公娶于申之類及為某事張本起本者皆附事首者也如衛文公復國之初言季年乃三百乗因陳完奔齊而言完始生筮知八世之後成子得政因晋悼公即位而言其命官得人不失霸業因衛北宫文子聘於鄭而言禆諶草創子産潤色因吳亂而言吳夫槩王為棠谿氏注云傳終言之之類皆附事尾者也有無事可附者則約其時之早晚附於一年之下如左傅子罕辭玉之類必無的實年月也假使宰相有忠直姦邪事無處可附者則附於拜相時佗官則附於到官時或免卒時其有處可附者不用此法但稍與其事相渉者即注之過多不害假如唐公起兵諸列傳中有一兩句渉當時者但與注其姓名於事目之下至時雖别無事迹可取亦可以證異同者日月也嘗見道原云只此已是千餘巻書日看一兩巻亦湏二三年功夫也俟如此附注俱畢然後請從髙祖初起兵修長編至哀帝禪位而止其起兵以前禪位以後事於今来所看書中見者亦請令書吏别用草紙録出每一事中間空一行許素紙以備翦開粘綴故也隋以前者與貢父梁以後者與道原令各修入長編中盖縁二君更不看此書若足下止修武徳以後天祐以前則此等事盡成遺棄也二君所看書中有唐事亦當納足下處修入長編耳其修長編時請據事目下所該新舊紀志傳及雜史小說文集盡檢出一閱其中事同文異者則請擇一明白詳備者録之彼此互有詳畧則請左右采獲錯綜銓次自用文辭修正之一如左傳叙事之體也此並作大字寫若彼此年月事迹有相違戾不同者則請選擇一證據分明情理近於得實者修入正文餘者注於其下仍為叙述所以取此捨彼之意先注所捨者云某書云云某書云云今案某書證驗云云或無證驗則以事理推之云云今從某書為定若無以考其虚實是非者則云今兩存之其實録正史未必皆可據雜史小說未必皆無憑在髙鑒擇之凡年號皆以後来者為定假如武徳元年則從正月便為唐髙祖武徳元年更不稱隋義寧二年𤣥宗先天元年正月便不稱景雲三年梁開平元年正月便不稱唐天祐四年也詩賦等若止為文章詔誥若止為除官及妖異止於恠誕詼諧止於取笑之類便請直刪不妨或詩賦有所譏諷如中宗時回波詞諠譁竊恐非宜肅宗時李泌誦黄臺𤓰辭之類詔誥有所戒諭如徳宗奉天罪已詔李徳裕討澤潞諭河北三鎮詔之類及大政事號令四方或因功遷官以罪黜官其詔文雖非事實要知當時託以何功誣以何罪亦湏存之或文繁多節取要切者可也妖異有所儆戒凡國家災異本紀所書者並存之其本志强附時事者不湏也䜟記如李淳風言武氏之類及因而􅃱殺戮叛亂者並存之其妄有牽合如水入斗為朱字之類不湏也相貌符瑞或因此為人所忌或為人所附或人主好之而諂者偽造或實有而可信者並存之其餘不湏也妖恠或有所儆戒如􅄦書武三思門或因而生事如楊慎矜墓流血之類並存之其餘不湏也詼諧有所補益如黄幡綽謂自已兒㝡可憐石野猪謂諸相非相之類存之其餘不湏也並告存之大抵長編寧失於繁毋失於畧千萬切禱切禱今寄道原所修廣本兩巻去此即據長編録出者其長編已寄還道原恐要見式様故也甚思與足下相見熟共商𣙜無因可得企渇企渇中前寄去晋紀八巻寫净草者必已寫了其元本却告分付兒子康令帯来雖未了亦告分付盖為今夏􅉍徃南康軍路中遺失却三巻若更失此則都無本故也其寫了浄草續附􅉍来不妨曏所請出魏紀今令李永和帯去有改動者吿指揮别寫及楷改目痛燈下作此書恕其不謹光上凡有人初入長編者並告於其下注云某處人或父祖已見於前者則注云某人之子或某人之孫今更寄貢父所作長編一冊去恐要作式様並道原廣本兩巻並告存之向去不使却寄示也三省咨目光比日牽强入朝欲與諸公商議數事貢其短拙以求采擇無何上下馬不得湏至在朝假謹具咨目如左當今法度所宜最先更張者莫如免役錢不惟刻剥貧民使不聊生人雇得四方無頼浮民使供百役官不得力為今之計莫若盡罷免役錢依舊差役民間息肩者什已七八若慮逐處利害不同即委諸路轉運司及州縣具未便事理申陳朝廷更為相度别立一州一縣勅施行}
