  - {type: variant, offset: 5499, length: 0, content: '', WYG: 上䟽請自擇臺諫劄子熈寜三年四月十六日上臣竊見近日臺諌上言制置三司條例司害民及吕惠卿姦邪者率被責降或更加以惡名如吕公著告辭云乃誣方鎮有除惡之謀中外聞者無不駭愕竊惟朝廷之意無佗止欲懲戒來者使不敢復言耳國家置臺諌官以為天子耳目唯恐政事有闕失百姓有疾苦大臣專恣左右姦邪天子深居九重不能得聞故也今臺諫官稍有懐剛直之志畏天下公議憂念朝廷哀閔百姓忤犯大臣刺譏左右者陛下輒罪而逐之更使大臣自擇所親以代其任萬一又為公論則又逐之是必得庸懦阿諛不知廉耻附下罔上背公死黨之人然後止耳若言路皆此等之人則禁闥之外陛下耳目之所不及者雖有至大之事廹切之禍陛下何從知之如此豈宗廟社稷之福也晏子曰君所謂可臣亦曰可君所謂否臣亦曰否若以水濟水誰能食之今陛下使大臣自擇臺諫官大臣又取同於已者存之異於已者去之然則陛下獨與大臣為天下足矣何必更置臺諫官也且條例司之害民吕惠卿之姦邪天下之人誰不知之獨陛下與王安石未之寤耳豈可更為之黜逐臺諫以長其威福成其氣勢臣竊為陛下寒心今臺諌官已被逐者臣不敢留唯願陛下自擇公正剛直者布之言路以明四目逹四聦勿使為羣下所欺蔽則天下幸甚臣受陛下過分之恩不敢塞黙雖死怨讎之手猶賢於竊禄偷生者也取進止論李定劄子熈寜三年五月二日上臣竊見近者朝廷除秀州推官李定為監察御史裏行知制誥李大臨蘇頌等累次封還詞頭數日来外間皆言朝廷已為之寝罷今日復聞劄下舍人院須令草詞臣竊意朝廷知大臨等旣累次封還詞頭今復草之則為反覆必難奉詔因欲以違命之罪罪之使今後凡朝廷所行政令羣下無敢立異者若果如此則百執事之人自非偷合苟容者皆不得立於朝政令或有得失陛下復何從知之晏嬰所謂以水濟水賈山引秦之季世以戒漢文帝者正患其如此耳臣前論逐臺諌官今又論大臨等非敢私此數人正為國家惜言路之絶耳伏望陛下審思而慎行之勿使聦明遂至壅蔽則天下幸甚取進止貼黄國家不次用人固無常法然必使衆心厭服然後為羙是以堯舜非不聦明也其命官皆先謀岳牧旣衆言僉同復明試以功而後用之故舉不失能而上下雍熈也臣素不識李定實不知其行能何如陛下果知其賢何不且試之以漸俟其功效顯著衆皆知之然後不次擢用則誰曰不可何必今日與臣下力較勝負殆非人君廣大之體也乞免永興軍路苗役錢劄子熈寜三年十一月二日上臣奉勅差充永興軍一路安撫使臣竊見陜西百姓自城綏州以来供應諸般科配及支移稅賦往近邉州軍日近復有環慶事宜加之今年亢旱五稼不熟人户流移者已間不少國家所冝汲汲存恤使人户安集臣伏見先所散青苗錢貧破百姓為患不細臣已曽累次上言不敢重煩聖聼今又聞議者欲令州縣将諸色役人一時放罷官為顧人祗應却令人户均定免役錢隨二稅送納乃至單丁女户客户寺觀等並令均出若果行此法其為害必又甚於青苗錢何則上等人户自来更互充役有時休息今嵗嵗出錢是常無休息之期也下等人户及單丁女户等從来無役今盡使之出錢是孤貧鰥寡之人俱不免役也若錢少則不足以顧人若錢多則須重斂於民顧人不足則公家闕事重斂於民則衆心愁怨自古以来徭役皆出於民今一旦變之未見其利也且受顧者皆浮浪之人使之主守官物則必侵盗使之幹集公事則必為姦事發則挺身逃亡無有田宅宗族之累建議者亦自知其不可乃云若顧召人不足即依例輪差支與逐䖏所定顧錢足了役事則自當有人應募今既無人應募必是錢少不足充役是徒有免役之名而役猶不免但無故普増數倍之稅也彼青苗錢以債與民可取其息已是困民之法今又使横出數倍之稅民安有不困蹙者哉以冨庶之域猶不能堪况陜西累嵗奉邉民力彫弊豈可復為無益之事以擾之乎伏望聖慈特免永興軍一路青苗免役錢以愛惜民力專奉邉費其餘路分則繫自朝廷裁酌取進止乞不令陜西義勇戍邉及刺充正兵劄子熈寜三年十一月上臣先任諌官日伏見國家棟刺陜西義勇臣累曽論列以為徒使百姓愁苦無益於用近聞環慶路用義勇與西賊戰鬭望風奔潰死傷甚多致主将陷没此義勇不可用之明騐也臣竊聞議者猶欲教閲義勇以抗西賊若止令州縣教閲守䕶郷土猶於人情不至大擾若發以戍邉或如慶厯中刺為正兵則衆人覩環慶二敗譬如無罪往就死地恐於人情大有不安國家旣重賦斂以盡其財又逼之戰鬭以絶其命是驅良民使為盗賊也彼為官軍則惜生故望風退走彼為盗賊則必死自可以一敵百臣恐今日教之挽射擊刺乃佗日為盗之資也廟堂之議臣所不得知萬一有之詔下之日臣論列不及况當逺離朝廷故不得不先事而言也取進止乞留諸州屯兵劄子熈寜三年十一月上臣奉勅充永興軍一路兵馬都緫管安撫使臣竊聞本路十州所管屯駐禁軍至少大率皆是縁邉就糧兵士常時分為上下畨有一半在逐州或遇邉上稍有警急則盡皆抽去逐州並無守把兵士臣竊惟天下事不可忽必須思患豫防戎狄犯邉雖當竭力捍禦然腹内州軍豈可全無武備况逐州皆有軍資甲仗市邑民居萬一犬羊奔突間諜内應或盗賊乗虚姦人竊發其本州官吏手下無兵雖有智勇将安所施臣愚以為逐州冝各添一指揮禁軍屯駐内永興軍為關中根本冝添兩指揮若朝廷别無兵士可以差撥只乞於縁邉就糧兵士内依此數目皆留在逐州屯駐邉上更不得勾抽所貴緩急不至失備取進止傳家集巻四十四欽定四庫全書傳家集巻四十五宋司馬光撰章奏二十八諌西征䟽熈寜四年正月一日上月日具位臣光謹昧死再拜上䟽皇帝陛下臣以不材誤承朝廷委用待罪長安兼領一路十州兵民大柄朝辭之日伏蒙陛下面諭以凢邉防事機及朝廷得失有所聞見令一一奏聞臣受命以来且愧且懼所愧者聖知深厚責任至重所懼者智識淺短無以堪稱夙夜疚心不敢寜居臣自入境以来見流移之民道路相望詢訪閭里皆云今夏大旱禾苗枯瘁河渭以北絶無所收獨南山之下稍有所存而入秋霖雨經月不霽禾雖有穗往往無實雖有實往往無米雖有米率皆細黒一斗之粟舂簸之後不過得米三四升糓價踵貴民間累年困於科調素無積蓄不能相贍以此須至分房减口就食西京襄鄧商虢等州或庸賃客作或燒炭採薪或乞匄剽竊以度朝夕當此之際國家惟宜鎮之以静省息諸事减節用度則租稅自輕徭役自少逋負自寛科率自止四患旣除民力自足民財自饒閭里自安流亡自還固不待陛下憂勤於中宰相劬勞於外然後人人得其所也苟或不然國家雖欲輕租稅寛逋負其所費之財何由可得雖欲少徭役止科率其所營之事何由可成四患不除雖日下㤙澤之詔民猶不免於流移轉死也盖欲止沸者莫若絶薪欲安民者莫若省事此目前之騐非難知也臣到官以来伏見朝廷及宣撫等司指揮分義勇作四畨欲令以此於縁邉戍守選諸軍驍銳及募閭里惡少以為竒兵造乾糧皺飯布囊力車以偹餽運悉取嵗賜秉常之物散給縁邉諸路又竭内地府庫甲兵財物以助之且以永興一軍一作路言之所發人馬甲八千副錢九萬貫銀二萬三千両銀盌六千枚其餘細瑣之物不可勝數動皆廹以軍期上下相驅急於星火官吏狼狽下民驚疑皆云國家将以今春大舉六師長驅深入以討秉常之罪臣以踈賤不得預聞廟堂之議未知兹事為虚為實昨者親承徳音以為方今邉計唯冝謹嚴守備俟其入冦則堅壁清野使之来無所得兵疲食盡可以坐收其弊臣退而思念聖謀髙逺深得王者御戎狄之道實天下之福及到關中乃見凡百䖏置皆為出征調度臣不知有司在外不諭聖意以致有此張皇将陛下黙運神筭不令愚賤之臣得聞其實也臣不勝惶恐晝則忘食夜則廢寝心寒股栗竊為陛下危之夫兵者凶噐聖人不得已而用之自古以来國家冨彊将良卒精因人主好戰不已以致危亂者多矣况今公私困竭将愚卒懦乃欲驅之塞外以捕狡悍之虜其無功必矣豈惟無功兼後患甚多不可盡言也若朝廷初無出征之意則何為坐散府庫之財疲生民之力訖無分毫之事萬一将来虜騎入冦府庫已竭民力已困将何以禦之臣先任御史中丞日朝廷将興綏州之役臣曽上言國家先當舉百職修庻政安百姓實倉庫選将帥立軍法練士卒精噐械八事皆備然後可以征伐四夷今此八事未有一者勝於曩時而况關中饑饉十室九空為盗賊者紛紛已多縣官倉庫之積所餘無幾乃欲輕動大衆横挑猛敵此臣之所大懼也或者又云國家未討秉常先欲試兵誅一小族若果如此尤為不可何則今者竭關中之財力大興師衆乃捨有罪之彊冦誅無辜之小種勝之不武不勝為笑将無以復號令戎狄矣此二䇿者皆為不可伏望陛下深鍳安危之機消之於未萌救之於未形速下明詔撫諭關中之民以朝廷不為出征之計其義勇更不分畨於縁邉戍守亦不選募竒兵凡諸調發為餽運之具者悉令停罷愛惜内地倉庫之儲以備春深賙救飢窮之人如此豈惟生民之幸亦社稷之福也臣不勝憂迫直輸赤誠惟陛下裁察臣光昧死再拜上䟽應詔言朝政闕失状熈寜七年四月十八日上右臣准西京牒准三月三十日詔勅朕涉道日淺晻于致治政失厥中以干隂陽之和乃自冬迄春旱暵為虐四海之内被災者廣間詔有司損常膳避正殿冀以塞眚消變歴日滋乆未䝉休應嗷嗷下民大命近止中夜以興震悸靡寜永惟其咎未知攸出意者朕之聴納不得於理歟獄訟非其情歟賦斂失其節歟忠謀讜言欝於上聞而阿諛壅蔽以成其私者衆歟何嘉氣之乆不效也應中外文武臣寮並許實封直言朝政闕失朕将親覽考求其當以輔政理三事大夫務悉心交儆成朕志焉臣伏讀詔書喜極以泣昔成湯以六事自責今陛下以四事求諌聖人所為異世同符凡詔書所言皆即日之深患陛下旣已知之羣臣夫復何云曽子曰尊其所聞則髙明矣行其所知則光大矣陛下誠知其如是復能斷志無疑不為左右所移則安知今日之災沴不如太戊之桑糓髙宗之雊雉成王之雷風宣王之旱魃更為宗廟生民之福乎然自詔下以来臣不知中外之臣亦有以當今之急務生民之疾苦力為陛下别白言之者乎盖必有之矣而臣未得聞也臣竊不自揆伏念父子受國厚恩備位侍從曏在朝廷屢以狂瞽塵浼聖聦間以衰疾自求閒官不敢復預國家之議四年於兹矣幸遇陛下發不世之詔問以朝政闕失斯實千載一時古人雖在畎畝猶不忘君况居位食禄者乎是以不敢畏當塗避衆怒愛㣲軀保妻子心知時事之可憂而塞嘿不言也竊觀陛下英睿之性希世少倫即位以來鋭精求治耻為繼體守文之常主髙欲慕堯舜之隆下不失漢唐之盛擢俊傑之才使之執政言無不聴計無不從所譽者超遷所毁者斥退垂衣拱手聴其所為推心置腹人莫能間雖齊桓公之任管仲蜀先主之任諸葛亮殆不及也執政者亦悉心竭力以副陛下之欲耻為碌碌守法循故事之臣毎以周公自任是冝百度交正四民豐樂頌聲旁洽嘉瑞沓至乃其效也然六年之間百度紛擾四民失業怨憤之聲所不忍聞災異之大古今罕比其故何哉豈非執政之臣所以輔陛下者未得其道歟所謂未得其道者在於好人同已而惡人異已是也陛下旣全以威福之柄授之使之制作新法以利天下是冝與衆共之捨短取長以求盡善而獨任已意惡人攻難羣臣有與之同者則擢用不次與之異者則禍辱隨之人之情誰肯棄福而取禍去榮而就辱於是天下之士躁於冨貴者翕然附之争勸陛下益加委信順從其言嚴斷刑罰以絶異議如是者往往立取羙官比年以来中外執事權者皆此屬矣其懐忠直守廉耻者皆擯斥廢棄或罹罪譴無所容立至於臺諫之官天子耳目所以規朝政之闕失糾大臣之専恣此陛下所當自擇而亦使執政擇之彼專用其所親愛之人或小有違忤即加貶逐以懲後来必得佞諛之尤者然後使為之如是則政事之愆謬羣臣之姦詐下民之疾苦逺方之寃抑陛下何從得聞見之乎又奉使詢訪利害於四方者亦其所親愛之人皆先禀其意指憑其氣勢以驅廹州縣之吏善惡繫其筆端升黜由其脣吻州縣之吏承迎奉順之不贍何暇與之講利害立同異哉其入奏則云州縣守宰咸以為便經乆可行陛下但見其文書粲然可觀以謂法之至善詢謀僉同豈知其在外之所為哉或者更増為條目務求新巧互陳利病各事改張使畫一之法日殊月異乆而不定吏民莫知所從盖由襲故則無功出竒則有賞彼皆進身之私計非有益國便民之志也又令使者督責所在監司監司督責州縣上下相驅競為苛刻奉行新法稍不盡力則謂之非才不職及沮壊新法立行停替或未熟新法誤有違犯皆不理赦降去官與犯贓者罪同而重於犯私罪者州縣之吏唯奉行文書救免罪戾之不暇民事不復留心矣又潜遣邏卒聴市道之人謗議者執而刑之又出牓立賞募人告捕誹謗朝政者臣不知自古聖帝明王之政固如是耶昔堯稽于衆舍已從人舜戒羣臣予違汝弼汝無面從退有後言此其所以為帝王稱首者也秦惡聞其過殺直諌之士禁偶語之人及其禍敗行道之人皆知之而已獨不知此所以為萬世戒者也子産相鄭鄭人游于郷校以論執政然明請毁之子産曰何為夫人朝夕退而㳺焉以議執政之善否其所善者吾則行之其所惡者吾則改之是吾師也若之何毁之我聞忠善以損怨不聞作威以防怨豈不遽止然猶防川大决所犯傷人必多吾不克救也不如小决使道不如吾聞而藥之也何今之執政異於古之執政乎齊景公謂梁􅉌㩀曰惟㩀與我和夫晏子對曰㩀亦同也焉得為和和如􅃵焉水火醯醢鹽梅以烹魚肉宰夫和之齊之以味濟其不及以洩其過君子食之以平其心君臣亦然君所謂可而有否焉臣獻其否以成其可君所謂否而有可焉臣獻其可以去其否是以政平而不干民無爭心今㩀不然君所謂可㩀亦曰可君所謂否㩀亦曰否若以水濟水誰能食之今朝廷之臣對揚啓沃亦有異於梁丘㩀者乎衞君言計非是而羣臣和者如出一口子思曰以吾觀衞所謂君不君臣不臣者也人主自臧則衆謀不進事是而臧之猶却衆謀况和非以長惡乎夫不察事之是非而悦人賛已闇莫甚焉不度理之所在而阿諛求容諂莫甚焉君闇臣諂以在民上民不與也若此不已國無類矣子思言於衞侯曰君之國事将日非矣出言自以為是而卿大夫莫敢矯其非卿大夫出言自以為是而士庻人莫敢矯其非君臣旣自賢矣而羣下同聲賢之賢之則順而有福矯之則逆而有禍如此則善安從生今執政主新法羣下同聲賢之有以異於衞國之政乎是以士大夫憤懣欝結視屋竊歎而口不敢言庻人飢寒憔悴怨嗟號泣而無所控告此則陛下所謂忠謀讜言欝於上聞而阿諛壅蔽以成其私者也苟忠讜退伏阿諛滿側而望百度之正四民之樂頌聲之洽嘉瑞之臻固亦難矣方今朝之闕政其大者有六而已一曰廣散青苖錢使民負債日重而縣官實無所得二曰免上户之役斂下户之錢以養浮浪之人三曰置市易與細民爭利而實耗散官物四曰中國未治而侵擾四夷得少失多五曰結保甲教習凶噐以疲擾農民六曰信狂狡之人妄興水利勞民費貯若其佗瑣瑣米鹽之事皆不足為陛下道也捨其大而言其細捨其急而言其緩外有獻替之迹内懐附㑹之心是姦邪之尤者臣不敢為也凡此六者之為害人無貴賤愚智莫不知之乃至陛下左右前後之臣日譽新法之善者其心亦知其不可但欲希合聖心附㑹執政盗貴冨耳一旦陛下之意移則彼之所言亦異矣臣今不敢復費簡札叙利害以煩聖聴但願陛下勿詢阿諛之黨勿徇權臣之意斷志罷之必有能為陛下言其詳者矣此六者之中青苗免役錢為害尤大夫力者民之所生而有也糓帛者民可耕桑而得也至於錢者縣官之所鑄民不得私為也自未行新法之時民間之錢固已少矣冨商大賈藏鏹者或有之彼農民之冨者不過占田稍廣積糓稍多室屋修完耕牛不假而已未甞有積錢巨萬於家者也其貧者藍縷不蔽形糟糠不充腹秋指夏熟夏望秋成或為人耕種資採拾以為生亦有未甞識錢者矣是以古之用民各囙其所有而取之農民之役不過出力稅不過糓帛及唐末兵興始有稅錢者故白居易譏之曰私家無錢鑪平地無銅山言責民以所無也今有司為法則不然無問市井田野之民由中及外自朝至暮唯錢是求農民值豐嵗賤糶其所収之糓以輸官比常嵗之價或三分减二於斗斛之數或十分加二以求售於人若值凶年無糓可糶吏責其錢不已欲賣田則家家賣田欲賣屋則家家賣屋欲賣牛則家家賣牛無田可售不免伐桑棗撤屋材賣其薪或殺牛賣其肉得錢以輸官一年如此明年将何以為生乎故自行新法以來農民尤被其患農者天下之本農旣失業餘民安所取食哉今貨益重物益輕年雖饑糓不甚貴而民倍困為國計者豈可不少思其故哉此皆歛錢之咎也北盡塞表東被海涯南踰江淮西及卭蜀自去歲秋冬絶少雨雪井泉溪澗往往涸竭二麥無收民已絶望孟夏過半秋種未入中户以下大抵乏食採木實草根以延朝夕若又如是數月将如何哉當此之際而州縣之吏督廹青苗助役錢不敢少緩鞭笞縲紲唯恐不迨婦子遑遑如在湯火之中號泣呼天無復生望臣恐鳥窮則啄獸窮則攫民困窮已極而無人救恤羸者不轉死溝壑壮者不聚為盗賊将何之矣若東西南北所在嘯聚連羣結黨日滋月蔓彌漫山澤蹈藉城邑州縣不能禁官軍不能討當是時方議除去新法将奚益哉緑林赤眉黄巾黒山之徒自何而有皆疲於賦斂復值饑饉窮困無聊之民耳此乃宗廟社稷之憂而廟堂之上方晏然自得以為太平之業八九已成此臣所為痛心疾首晝則忘食夜則忘寝不避死亡欲黙不能者也易復之初六曰不逺復無祗悔元吉言過而能改雖悔不大也其上九曰迷復凶有災眚用行師終有大敗以其國君凶至于十年不克征言迷而不復凶且有災於君道尤不利也昔秦穆公敗於殽作秦誓曰唯古之謀人則曰未就予忌唯今之謀人姑将以為親雖則云然尚猷詢兹黄髪則罔所愆盖悔弃老成之逺慮用利口之淺謀以取覆敗而思補其過也故能終雪前耻彊霸西戎漢武帝征伐四夷中國虚耗賊盗羣起又喪貳師之軍乃下哀痛之詔曰廼者以縛馬書徧示丞相御史二千石諸大夫郎為文學者皆以虜自縛其馬不祥甚哉公車方士太史太卜皆以為吉今計謀卦兆皆反謬盖始寤公卿方士之諂諛對不以誠致誤國事有悔于心也故禁苛暴止擅賦力本農天下復安自國家行新法以來天下之人心祈口禱唯冀陛下之覺悟而拯救其失以蘇疲民如望上天之膏澤日復一日以至于今及今改之猶可救也過是則民力屈竭一旦渙然離散乃始勞心安集豈不難哉竊觀陛下詔書寅畏天災深自咎責丁寜懇惻以求至言是陛下已知前日之失而欲有所改為也若徒著之空文而於新法無所變更是猶臨鼎哀魚之爛而益薪不已将何補哉陛下誠能垂日月之明奮乾剛之斷放逺阿諛勿使壅蔽自擇忠讜為臺諌官收還威福之柄悉從已出詔天下青苗錢勿復散其見在民間逋欠者計從初官本分作數年催納更不收利息其免役錢盡除放差役並依舊法罷市易務其所積貨物依元買價出賣所欠官錢亦除利催本罷拓土開境之兵先阜安中國然後征伐四夷罷保甲教閲使服田力穡所興修水利委州縣相度凡利少害多者悉罷之如此則中外讙呼上下感悦和氣薫蒸雨必霑洽矣彼阿諛之人附㑹執政者皆縁新法以得冨貴若陛下以為非而捨之彼如魚之失水必力争固執而不肯移願陛下勿問之也臣竊聞陛下以旱暵之故避殿撤膳其焦勞至矣而民終不預其澤不若罷此六者立有溥博之徳及於四海也又聞京師近雖獲雨而畿甸之外旱氣如故王者以四海為家無有逺近皆陛下之赤子願陛下雖徇羣臣之請御正殿復常膳猶應兢兢業業憂勞四方不遽自覺以為無復災也又諸州縣奏雨往往止欲觧陛下之焦勞一寸則云三寸三寸則云一尺多不以其實不可不察也又聞青苗之法災傷及五分則倚閣其間官吏不仁者至有抑遏百姓止放四分以下稅此尤可罪者也臣在冗散之地若朝政小小得失臣固不敢預聞今坐視百姓困於新法如此将為朝廷深憂而陛下曽不知之又今年以來臣衰疾寝増恐萬一溘先朝露齎懐忠不盡之情長抱恨於黄泉是以冒死一為陛下言之儻陛下猶棄忽而不之信此則天也臣不敢復言矣干冒宸扆臣無任懇切惶懼之至薦范祖禹狀元豐七年十二月上右臣伏以報國之忠莫如薦士負國之罪莫如蔽賢臣伏見奉議郎同編修資治通鑑范祖禹智識明敏而性行温良如不能言好學能文而謙晦不伐如無所有操守堅正而圭角不露如不勝衣祖禹乃今正議大夫致仕范鎮兄孫自祖禹年未二十為舉人時臣巳識之今年四十餘行義完固常如一日祖禹所為本末無如臣最熟知臣於熈寜三年奏祖禹自前知資州龍水縣事同修資治通鑑至今首尾一十五年由臣頑固編集此書乆而不成致祖禹淹回沉淪不得早聞逹於朝廷而祖禹安恬静黙如可以終身下位曽無滯留之念臣誠孤陋所識至少於士大夫間罕遇其比况如臣者逺所不及凡臣所言莫非據實不敢溢美今所修書已畢祖禹應歸吏部别授差遣臣竊為朝廷惜此良寳委棄榛莽伏望皇帝陛下特賜采㧞或使之供職祕省觀其述作或使之入侍經筵察其學行自餘進用繫自聖忠如䝉朝廷擢用後有不如所舉臣甘與之同罪再乞西京留臺狀元豐八年二月上右臣先於元豐五年九月二十六日受勅提舉西京嵩山崇福宮候滿三十箇月不候替人發來赴闕至今月此任當滿伏念臣性雖至愚粗甞從學平生所守不敢忘信雖遇布衣未甞妄語况於朝廷豈敢欺罔臣今年六十有七耳目手足雖未全衰數年以來昏忘特甚舉錯云為動多差繆使之臨繁處劇實所不堪非敢愛身必恐敗事但臣前後提舉崇福宫已經四任坐享俸給全無所掌今復有求匄實自愧心竊見西京留司御史臺及國子監比於宫觀粗有職業伏望聖慈俯加矜察特於上件兩處差遣内除授一任庻使竊禄庇身以養殘年則陛下愛物曲盡始終之賜㣲臣陳力兩遂公私之便乞奔神宗皇帝喪狀元豐八年三月十七日上右臣先任提舉西京嵩山崇福宫於今年二月任滿臣以數年以來昏忘特甚臨繁處劇實所不堪尋具狀奏陳乞於西京留司御史臺及國子監内除授臣一任未奉朝㫖間於今月七日忽奉遺制大行皇帝奄弃天下臣哀荒摧絶無地自處伏念臣自先帝踐阼以來過䝉知待特出倫軰首寘翰苑繼處憲臺亦甞承乏俾佐樞府臣自知非才不敢冒居力辭事任願就冗散亦荷矜容曲從所欲養以俸禄不責職業優游自便十有五年近者書成又叨進職褒嘉賜賚皆踰等比聖㤙汪洋天隆地厚未足為諭奉諱之初即欲號哭奔走徑詣京師奉望梓宫展臣子之誠萬分之一又念國朝故事如昭厚二陵未甞有近臣奔喪之例加以前已乞留臺國子監未奉進止彷徨疑慮不敢輒行今竊聞觀文殿學士孫固資政殿學士韓維已至闕下臣方自咎責不敢寜居已於今月十七日起離西京欲乞亦赴闕廷隨百官班入臨見於前路聴候指揮申宣撫權住製造乾糧皺飯狀熈寜三年十二月一日上准都轉運司牒准宣撫使衙劄子節文製造乾糧州軍将􅔋一斗變造乾糧五斤仍量支與柴錢勘㑹近准宣撫使衙劄子節文指揮沿邉四路十四州軍并近裏永興軍河中府同耀乾州鳳翔府等州軍變造􅔋餅皺飯當司已兩次牒逐州軍疾早變造施行去訖今又准前項宣撫使衙劄子已牒逐州将􅔋一斗變造乾糧五斤仍量支與柴錢如闕􅔋即疾速計置收糴變造乾糧所是柴錢斟量支給施行去訖牒請照㑹施行者右具如前勘會先准中書劄子節文奉聖㫖今後起發義勇赴沿邉戰守並令自齎備一月口食與折将來本户稅物若不能自備只乞於起發州軍預請一月口食齎往者亦聴又勘會永興軍近准都轉運使司牒准宣撫使衙劄子近准朝㫖義勇上畨令附帯乾糧一秤至屯戍州軍須合預行變造乾糧准備支遣附帯前去右劄送陜西轉運司檢會近降義勇分畨條貫指揮㳂邉四路十四州軍并近裏永興河中同耀乾鳯翔六州府速行勘會義勇所居縣分近便省倉斛斗内有􅔋粟或白米便約義勇合附帯乾糧秤數中停變造􅔋餅皺飯如見在􅔋數不多即一色變造皺飯仍趂此時月造下兩畨令附帯數目免致非時蒸㬠易為損惡仍毎乾糧一秤破係官布造袋子封印如法收將來義勇上畨日依數附帯者光竊詳義勇戍守之時毎人逐日給米二升半其一月口食七斗五升若更加乾糧一秤并噐械衣装盤纒等物竊慮一人之力難以勝任兼今來變造乾糧皺飯須至差配百姓當此饑饉民間不易之際雖云量支柴薪亦不能全無搔擾况即今諸縣官倉􅔋米至少昨准朝㫖散支第四等第五等闕食人户各二石尚未有備若更造乾糧皺飯即将來二三月間正當闕食之際更將何物可以救濟必見大叚失所竊見慶厯年中議欲出兵討伐元昊亦曽令陜西諸州製造乾糧皺飯萬數不少後來旣不出兵其乾糧皺飯所在堆積經年朽腐不可復食盡為棄物今官中錢糓比於慶厯年尤更難得若復造此物徒使公私勞費卒無所用誠為可惜又國家備邉若止於戍守則㳂邉自有倉廪無用乾糧皺飯今來承准指揮製造上件乾糧皺飯仍令十日一申倉卒取辦竊慮百姓猜疑以為國家又欲出兵必致逺近驚憂無由觧諭至時不為便穏光已指揮本路前項五州軍且未令造乾糧皺飯更聴候宣撫衙指揮去訖謹具狀申宣撫使衙伏望裁酌早賜指揮乞罷修腹内城壁樓櫓及噐械狀熈寜四年正月三日上尋得㫖依奏准熈寜三年十一月初七日准樞宻院劄子節文檢會近為麟府路豐州及外堡寨官吏弛慢不職不修完城池樓櫓噐甲等已奉聖㫖降官等第斷遣及劄與三路轉運司徧牒轄下沿邉州軍知委去訖近又據陜西路提刑宣撫司奏華州甲仗庫弓弩不堪盖是監官并本州官貟全不用心㸃檢有誤緩急使用其鈐轄盧戭坐受優俸空占當直兵士略不營職朝廷已令鄜延路經略司舉官差替盧戭其華州甲庫弓弩不堪本州當職官貟全不用心㸃檢仍宣撫司差官取勘聞奏竊慮諸路亦有不修完城壁噐甲等去處奉聖㫖令河東河北陜西經略安撫司指揮轄下州軍委官吏子細㸃檢須管日近修完城壁樓櫓堅固噐甲精利如將來朝廷専差官㸃檢得却有未修城壁樓櫓噐甲等其應干官吏必當依此重行斷遣劄付本司者尋依准朝㫖行下本路諸州軍施行近准虢州申州司勘會本州雖係陜西路即不係近邉州軍其州城從來並不曽有敵樓戰棚為自來霖雨損壊摧塌及無兵功累年不曽修築今來亦不敢専擅役夫修築已牒在城兵馬都監吕士宣重行檢計損壊城邑去處才候檢計到合使人功物料别具狀供申乞差兵夫次及據觧州申准兵馬監押狀申准州牒備録到安撫使司牒内坐到聖㫖指揮修完城壁樓櫓等尋將帯壕寨木匠作頭等檢計外羅城面上只有更屋二十三座並係年深倒塌及城壁墜倒乆來亦不曽泥補修完伏乞據狀申上衙乞差官計料修城人工及剏添樓櫓免致將來朝廷差官檢視見並不修完城壁及剏盖樓櫓虚負責降停替州司勘會舊來城上並無樓櫓即目城面上濶處只及四五尺以來今若指揮使行剏造又縁合使人工材料數目不少今來未敢専擅剏修伏候指揮右謹具如前勘會管下永興等一十州軍城壁内有乆來已行安置樓櫓完備亦有城壁低下薄怯全未有樓櫓去處其逐州官吏旣准上項朝㫖及見麟府豐州官吏以不修完城壁櫓樓噐甲降官等第斷遣并華州官吏差替取勘仍恐朝廷非時差官㸃檢例各畏懼争欲日近興功完葺以避譴責伏縁營造樓櫓須藉城基厚濶方可安置今來觧虢兩州城壁皆稱濶處只及四五尺似此之類須是先貼築城基方可剏修樓櫓若非大叚興功無以辦濟况今本路州軍全闕廂軍應急差使官庫亦闕見錢收買材料若是差役人夫配率材料又縁陜西州軍已是去嵗夏麥薄收秋苖旱損當此饑饉人户流移之際若更如此差擾必是轉難存濟兼永興軍一路州軍盡在腹裏去沿邉絶逺設若蕃賊入冦亦未能卽到逐州軍城下其樓櫓修下數年不用不免損壊今來若盡令與沿邉州軍一例須管日近修完城壁樓櫓堅固噐甲精利顯見官私虚有勞費欲乞朝廷特降指揮其㳂邉及次邉州軍即一依近降朝㫖修完所有腹内州軍城壁樓櫓并候将來豐熟以漸營葺其噐甲即㨿不堪數目逐旋勒作院人匠依程課修整務令精利所貴公私皆得辦濟乞不添屯軍馬熈寜四年正月八日上今月七日准熈寜三年十二月二十九日陜西河東路宣撫使司劄子本司近已具奏聞乞於永興軍邠州河中府三州軍易得糧草之處别添屯軍馬選差将官専切訓練逐路不得句抽専聴宣撫司節制内一項乞於永興軍駐劄兵馬差本司准備差使莊宅使趙瑜充永興軍路都鈐轄與知府専管訓練者右具如前臣勘會永興軍所管今年正月一日見在軍糧麤細色斛斗共三十六萬九千七百石二斗四升據即目本府見駐泊及就糧并本城兵貟糧食及官僚請俸等共約支得向去一十七箇月半馬料三萬七千六百五十二石四斗二升約支得向去一十五箇月有餘稈草四十萬六千二百二十二束約支得一十三箇月半有餘此只是據見在軍馬約度即不知今來所添屯軍馬計多少數目若只添一倍之時其人粮只約支得八箇月有餘馬料只約支得七箇月有餘稈草只支得六箇月有餘所添更多所費尤廣又先准中書劄子奉聖㫖令體量應災傷人户委的飢乏不能自存者仰發省倉斛斗據第四第五以下人户各借二石今勘會永興軍諸縣第四等以下闕食人户約及十餘萬户若毎户支二石共計合支二十餘萬石其外縣雖有粮草亦是數目不多更難支充貸糧若並令在府省倉請領又更减却此數即軍糧約支更不及得上項月數况去年陜西經夏大旱入秋霖雨五糓例皆不熟其永興軍放稅多者至七八分即今毎斗白米價錢一百文足稈草毎束價錢二十七文足雖差官開場糴買只糴得白米九百餘石稈草全無兼勘會軍資庫日近雜支錢盡底支絶准轉運司牒将三司提刑司鹽馬司封樁錢盡數充雜支錢止及四萬餘貫除支毎月料錢及軍府諸般使用並不住准轉運司牒支撥往㳂邉州軍及應副收買軍期物色見今無錢支與和糴場糶買糧草豈得謂之易得糧草之處臣竊謂大凡添屯軍馬先須約度本處糧草可以贍養與否今來關中饑饉倉庫空虚贍養舊兵猶恐不足更添新者何以枝梧雖朝廷更於左藏庫内藏庫支撥銀紬絹等降下本路添助支費亦不免令州縣配賣與百姓轉増貧困况糧草是重滯之物不可從逺處興販得來須本處土地所生方可計置今饑饉如此雖多積金銀髙估物價令轉運司與州縣多方擘畫其日下所要糧草何由可得况即今民間闕食流移死亡者已為不少諸縣處處申報驚刼若至向前二三月後舊糓已盡新麥未熟民間必轉更飢乏若官中愛惜倉庫坐視不救竊恐流移轉多死亡轉衆盗賊轉煩深為不便竊以戎狄擾邉手足之疾百姓離散腹心之憂豈可重外輕内逐末忘本兹事得失所繫不細伏望朝廷先将陜西諸州軍糧草約度合贍得若干軍馬一年支費仍須於十分中量留二三分救濟目下飢民外如有剰數然後據數添屯軍馬若苦無剰數之時伏乞朝廷更不添屯儻以邉鄙未寜須至量添軍馬之時即乞分散往諸州軍就糧各委逐處兵官精加訓練不須聚在永興軍邠州河中府三處更特置都鈐轄三貟候邉事稍定即乞速發遣歸住營處所貴公私稍得辦濟若不如此先約度粮草但務添屯軍馬竊恐一旦倉庫俱竭别有不虞至時悔無所及臣職在守藩不敢不言所有先准朝㫖令第四等以下人户借支斛斗二石未審今來支與不支若支與則軍粮轉更不足不支則人户正當飢乏伏願聖慈早降指揮臣不勝廹切之誠奏乞兵官與趙瑜同訓練駐泊兵士狀熈寜四年正月十九日上右臣准今月三日宣命差下在京及外處拱聖等十四指揮計五千餘人赴永興軍權駐泊准備宣撫司抽差使及差荘宅使趙瑜充本路都鈐轄與臣専管句訓練臣本書生叨忝兩制軍旅之事素所不知加以近准宣撫司劄子坐到教閲新法令排日各習事藝臣所管永興軍一十三縣民事至多及應副㳂邉軍須物色文案填委毎日自旦至暮未甞暫閒實無餘力與趙瑜同監教閲又不可専委趙瑜獨行訓練又永興軍舊管屯駐駐泊就粮兵士自來並是鈐轄劉斌路分都監李應之同共管句今來所添兵士准宣命指揮只令趙瑜與臣専管句訓練所有舊來兵士不知趙瑜管與不管若令通管之時其新來兵士旣在永軍駐泊其劉斌李應之並是本路鈐轄都監豈可却管轄不得竊慮向去新兵士不賔服舊兵官舊兵官不應副新兵士各分彼我則致生事深為不便所有上件新差來永興軍權駐劄兵士臣欲乞令本路兵官與趙瑜同共訓練所貴公共同心管句得辦謹具状奏聞伏候勅㫖并申宣撫相公更賜敷奏乞早降指揮傳家集巻四十五欽定四庫全書傳家集巻四十六宋司馬光撰章奏二十九乞開言路劄子元豐八年三月三十日上臣聞周易天地交則為泰不交則為否君父天也臣民地也是故君降心以訪問臣竭誠以獻替則度政修治邦家乂安君惡逆耳之言臣營便身之計則下情壅蔽衆心離叛自生民以來未有不由斯道者也夫道猶歧路近差跬歩逺失千里今皇帝陛下新臨大寳徳性髙明太皇太后同斷萬幾聖謨光大初發號令不可不慎斯乃治亂之歧塗安危之所分也當以要切為先以瑣細為後臣竊見近年以來風俗頺弊士大夫以偷合苟容為智以危言正論為狂是致下情蔽而不上通上恩壅而不下達閭閻愁苦痛心疾首而上不得知明主憂勤宵衣旰食而下無所訴公私兩困盗賊已繁猶頼上帝垂休嵗不大飢祖宗詒謀人無異志不然者天下之勢可不為之寒心乎此皆罪在羣臣而愚民無知往往怨歸先帝此臣所以日夜憤痛焦心泣血不顧死亡思有開發於朝廷者也臣愚以為今日所宜先者莫若明下詔書廣開言路不以有官無官之人應有知朝政闕失及民間疾苦者並許進實封状盡情極言仍頒下諸路州軍於所在要閙處出牓曉示在京則於鼓院檢院投下委主判官畫時進入在外則於州軍投下委長吏即目附遞奏聞皆不得取責副本彊有抑退其百姓無産業人慮有姦詐則責保知在奏取指揮放令逐便然後陛下於聴政之暇略賜省覽其義理精當者即施行其言而顯擢其人其次取其所長捨其所短其狂愚鄙陋無可采取者報聞罷去亦不加罪如此則嘉言日進羣情無隠陛下雖深居九重四海之事如指諸掌舉措施為惟陛下所欲斯乃治安之源太平之基也陛下若以臣言為可取伏乞决自聖意下學士院草詔書施行羣臣若有沮難者其人必有姧惡畏人指陳専欲壅蔽聦明此不可不察取進止進修心治國之要劄子狀元豐八年四月十九日上右臣伏聞本固則末茂源濁則流渾昔仁宗皇帝擢臣知諌院臣初上殿即言人君之徳三曰仁曰明曰武致治之道三曰任官曰信賞曰必罰英宗皇帝時臣曽進歴年圖其後序言人君之道一其徳有三其志亦猶所以事仁宗也大行皇帝新即位擢臣為御史中丞臣初上殿言人君修心治國之要其志亦猶所以事英宗也今上天降災大行皇帝奄弃天下皇帝陛下新承大統太皇太后同聴萬幾不知臣愚猥䝉訪落臣且愧且懼無以塞責謹復以人君修心治國之要為獻其志亦猶所以事大行皇帝也所以然者臣歴觀古今之行事竭盡平生之思慮質諸聖賢之格言治亂安危存亡之道舉在於是不可移易是以區區首為累朝言之不知臣者以臣為進迃闊陳熟之語知臣者以臣為識天下之本源也夫治亂安危存亡之本源皆在人君之心仁明武所出於内者也用人賞功罰罪所施於外者也出於内者雖有厚有薄有多有寡禀之自天然好學則知所宜從力行則光美日新矣施於外者施之當則保其治保其安保其存不當則至於亂至於危至於亡行之由已者也所以能當在於至明所以能明在於至公是以明君善用人者博訪逺舉拔其殊尤徳行髙人謂之賢智勇出衆謂之能賢不必能能不必賢各隨所長授以位任有功則賞有罪則罰其人苟賢能雖讎必用其人苟庸愚雖親必弃賞必有所勸罰必有所懲賞不以喜罰不以怒賞不厚於所愛罰不重於所憎必與一國之人同共好惡是以古者爵人於朝與士共之刑人於市與衆弃之如此安有不當者乎臣故曰所以能當在於至明所以能明在於至公也昔齊桓公置射鉤而使管仲相漢髙祖知人善任使苟為不才雖見喜弃之苟才矣雖負販酒徒亡将戍卒亦用之此所以能奮布衣取天下也館陶公主為子求郎明帝不許而賜錢千萬郎賤官也猶惜之况其貴者乎故永平之治至今稱之宋髙祖事蕭太后甚孝太后欲以子道憐為揚州刺史髙祖以其貪愚不許故功業之髙冠於南朝唐太宗殺建成元吉而用其官屬魏鄭公王珪等與房杜無異卒得其效宣宗事鄭太后甚謹問舅鄭光以政事不能對罷其方鎮故時人稱美謂之小太宗此用人之公明者也韓昭侯惜弊袴不以賜左右之無功者漢髙祖深怨雍齒而不忘其功魏太祖勲勞冝賞不吝千金無功望施分毫不與唐宣宗重惜服章故當時得緋紫者以為榮此賞功之公明者也僮牛殺孟丙仲任立叔孫昭子昭子數其罪而殺之孔子善其不懐丁公脫漢祖於阨髙祖以為不忠而斬之武帝妹隆慮公主且死屬其子昭平君昭平君殺人武帝流涕而誅之唐明皇弄臣黄㼐掀捕盗官墜馬明皇杖殺之宣宗謂樂工汝惜羅程藝我惜髙祖太宗法此罰罪之公明者也臣略舉此數者以為明騐其餘在陛下博覽載籍以考之知臣所言不為謬妄臣以一夫之愚不能周知天下之務近曽上奏乞下詔書開言路伏望聖慈早賜施行今并治平四年五月三日上殿劄子具録進呈乞陛下留神幸察乞去新法之病民傷國者䟽元豐八年四月二十七日上月日具官臣司馬光謹昧死再拜上䟽太皇太后陛下皇帝陛下臣竊見先帝聦明睿智勵精求治思用賢輔以致太平委而任之言行計從人莫能間雖周成王之任周公齊桓公之任管仲燕昭王之任樂毅蜀先主之任諸葛亮殆不能及斯不世出之英主曠千載而難逄者也不幸所委之人於人情物理多不通曉不足以仰副聖志又足已自是謂古今之人皆莫已如不知擇祖宗之令典合天下之嘉謀以啓廸清衷佐佑鴻業而多以已意輕改舊章謂之新法其人意所欲為人主不能奪天下莫能移與之同者援引登青雲與之異者擯斥沈溝壑専欲遂其狠心不顧國家大體人之常情誰不愛冨貴而畏刑禍於是搢紳大夫望風承流競獻䇿畫務為竒巧捨是取非興害除利名為憂民其實病民名為益國其實傷國作青苖免役市易賖貸等法以聚斂相尚以苛刻相驅生此厲階迄今為梗又有邉鄙之臣行險徼倖大言面欺輕動干戈妄擾蠻夷夫兵者國之大事廢興存亡於是乎在而其人苟榮一身之官賞不顧百姓之死亡國家之利病輕慮淺謀發於造次御軍無法僅同兒戯深入敵境坐守孤城糧運旣竭狼狽奔潰築寨極邉功猶未畢輕敵不備闔城塗地使兵夫數十萬暴骸於曠野資仗臣億弃捐於異域又有生事之臣欲乗時干進建議置保甲户馬保馬以資武備變茶鹽鐡冶等法増家業侵街商稅等錢以供軍須遂使九土之民失業窮困如在湯火此皆羣臣躁於進取誤惑先帝使利歸於身怨歸於上非先帝之本志也臣荷先帝大恩常思報效曏在朝廷之時屢言新法非便觸忤權貴冒犯衆怒爭辯非一先帝憐其孤忠不以為罪仍蒙寵擢寘之樞廷臣以所言未行力辭不受臣非惡冨貴而好貧賤正欲感寤先帝知臣為國不為身庶幾采納狂瞽使百姓獲安基局永固而已旣又自乞冗官退伏閭里雖身䖏于外區區之心晨夕寤寐何甞不在先帝之左右所以不敢自赴闕廷如此之乆者亦猶辭樞廷之志也熈寜七年歴時不雨先帝遇災而懼深自刻責誕布詔書廣開言路臣當是時不勝踊躍極有開陳而建議之臣知所立之法不合衆心天下之人必盡指其非恐先帝覺寤而已受誤國之罪伏欺罔之刑乃勸先帝繼下詔書言新法已行必不可動臣之所言正為新法若新法不動臣尚何言自是閉口不敢復預朝廷論議十有一年矣然每覩生民之愁怨憂社稷之阽危於中夜之間一念及此未甞不失聲拊心也葵藿之志猶望先帝一賜召對訪以外事得吐心極言退就斧鉞死無所恨不意上天降禍先帝升遐臣之寸誠無由披露欝抑憤懣自謂終天及奔喪至京乃䝉太皇太后陛下特降中使訪以得失是臣積年之志一朝獲伸感激悲涕不知所從顧天下事務至多臣思慮未熟不敢輕有條對但乞下詔使吏民皆得實封上言庻幾民間疾苦無不聞逹旣而聞有㫖罷修城役夫撤詗邏之卒止御前造作京城之人已自歡躍及臣歸西京之後繼聞斥退近習之無状者戒飭有司奉法失當過為煩擾者罷物貨専場及民所養户馬又寛保馬年限四方之人無不鼓舞聖徳傳布一日千里頌嘆之聲如出一口溢于四表乃知太皇太后陛下深居禁闥皇帝陛下雖冨於春秋天下之事靡不周知民間衆情乆在聖度四海羣生可謂幸甚凡臣所欲言者陛下略已行之臣稽慢之罪實負萬死夫為政在順民心苟民之所欲者與之所惡者去之如决水於髙原之上以注川谷無不行者苟或不然如逆阪走丸雖竭力以進之其復走而下可必也今新法之弊天下之人無貴賤愚智皆知之是以陛下微有所改而逺近皆相賀也然尚有病民傷國有害無益者如保甲免役錢将官三事皆當今之急務釐革所冝先者臣今别具狀奏聞伏願决自聖志早賜施行議者必曰孔子稱孟莊子之孝其佗可能也其不改父之臣與父之政是難能也又曰三年無改於父之道可謂孝矣彼謂無害於民無損於國者不必以已意遽改耳必若病民傷國豈可坐視而不改哉易曰幹父之蠱有子考无咎象曰幹父之蠱意承考也蠱者事有蠱弊而治之也幹父之蠱迹似相違意則在於承繼其業成父之美也又曰裕父之蠱往見吝象曰裕父之蠱往未得也裕者饒益之名也若不忍違異益父之過往而不返未為得冝也昔漢文帝除肉刑斬右趾者弃市笞五百者多死景帝元年改之笞者始得全武帝作鹽鐡㩁酤均輸等法天下困弊盗賊羣起昭帝用賢良文學之議而罷之後世稱明唐代宗縱宦官公求賂遺置客省拘滯四方之人德宗立未三月悉禁止罷遣之時人望致太平德宗晩年有宫市五方小兒暴横為民患鹽鐡月進羨餘順宗即位皆罷之中外大悦是皆改父之政而當者人誰非之哉况先帝之志本欲求治而羣下干進競以私意紛更祖宗舊法致天下籍籍如此皆羣臣之罪非先帝之過也為今之計莫若擇新法之便民益國者存之病民傷國者悉去之使天下曉然知朝廷子愛黎庶之心吏之苛刻者必變而為忠厚民之離怨者必變而為親譽徳業光榮福祚無窮豈不盛哉夫天子之孝在於得萬國之歡心以事其親儻措置如此歡心孰大焉事親孰備焉今幅貟之内所在嗷嗷有倒垂之急延頸傾耳以俟改法庻得蘇息若朝廷不以爲意日復一日萬一遇數千里之蝗旱公私匱竭無以相救失業之民蜂起為盗安知無姦雄乘之而動則國家有累􅆑之危申屠剛曰未至豫言固常為虚及其已至又無所及朝廷當此之際觧兆民倒垂之急救國家累􅆑之危豈假必俟三年然後改之哉况今軍國之事太皇太后陛下權同行處分是乃母改子之政非子改父之道也何憚而不為哉惟聖明裁察臣光昧死再拜上䟽乞罷保甲狀元豐八年四月上右臣竊以兵出民間雖云古法然古者八百家纔出甲士三人歩卒七十二人閒民甚多三時務農一時講武不妨稼穡自上世相承習以為常民不驚擾自兩司馬以上皆選賢士大夫為之無侵漁之患故卒乗輯睦動則有功今籍鄉村之民二丁取一以為保甲皆投以弓弩教之戰陣是農民半為兵也三四年來又令河北河東陜西置都教場無問四時每五日一教特置使者比監司專切提舉州縣不得關預每一丁教閲一丁供送雖云五日而保正保長以泥堋除草為名日聚之教場得賂則縱之不則㽞之是三路耕耘收獲稼穡之業幾盡廢也自唐開元以來民兵法壊戍守戰攻盡募長征兵士民間何嘗習兵哉夫兵者凶器也聖人不得巳而用之國家承平百有餘年四夷順服戴白之老不識兵革一旦畎畝之人忽皆戎服執兵奔驅滿野見者孰不驚駭耆舊歎息以為不祥事旣草創調發無法比户搔擾不遺一家又廵檢指使按行鄉村往來如織保正保長依倚弄權坐索供給多責賂遺小不副意妄加鞭撻􅅙食行伍不知紀極中下之民罄家所有侵肌削骨無以供億愁苦困弊靡所投訴流移四方繦屬盈路又朝廷時遣使者徧行按閲所至犒設賞賚糜費金帛以巨萬計此皆鞭撻平民銖兩丈尺而斂之一旦用之如糞土而鄉村之民但苦勞役不感恩澤臣不知設保甲於農民之勞旣如彼為國家之費又如此終將何所用哉若使之捕盗賊衞鄉里則何必如此之多若使之戍邉境征戎狄則彼戎狄之民以騎射為業以攻戰為俗自幼及長更無佗務中國之民生長太平服田力穡雖復授以兵械教之擊刺在教場之中坐作進退有似嚴整必若使之與戎狄相遇填然鼓之鳴鏑始交其奔北潰敗可以前料决無疑也是猶驅羣羊而戰豺狼也當是時豈不誤國事乎又悉罷三路廵檢下兵士及諸縣弓手皆易以保甲令主簿兼縣尉但主草市以裏其鄉村盗賊悉委廵檢而廵檢兼掌廵按保甲教閲朝夕奔走猶恐不辦何暇逐捕盗賊哉又保甲中往往有自為盗者亦有乗保馬行刼者然則設保甲保馬本欲除盗乃更資盗也書曰民惟邦本本固邦寜又曰可畏非民夫川涸魚逝林燔鳥飛民喪其生業無以自存赴訴不受失其所依安得不去而為盗哉自教閲保甲以來河東陜西京西盗賊已多至敢白晝公行入縣鎮殺官吏官軍追討經歴嵗月終不能制况三路未至大飢而盗賊已昌熾如此萬一遇數千里之蝗旱而失業飢寒武藝成就之人所在蜂起以應之其為國家之患可勝言哉此非小事不可以忽夫奪其衣食使無以為生是驅民為盗也使比屋習戰勸以官賞是教民為盗也又撤去捕盗之人是縱民為盗也謀國如此果為利乎害乎且曏者干進之士説先帝以征伐四夷開邉拓土之䇿故立保甲户馬保馬等法近者登極赦書節文云應縁邉州軍仰逐處長吏并廵檢使臣鈐轄兵士及邉上人户不得侵擾外界務要静守彊場勿令搔擾此盖聖意欲惠綏殊俗休息中國華夷之人孰不歸戴然則保甲户馬保馬復何所用哉今雖罷户馬寛保馬而保甲猶存者盖未有以其利害之詳奏聞者也臣愚以為宜悉罷保甲使歸農召提舉官還朝量逐縣户口毎五十户置弓手一人略依縁邉弓箭手法許䕃夲户田二頃悉免其稅役除出賊地分嚴加科罰及令出賞錢外其賊發地分更不立三限科校但令捕賊給賞若獲賊數多及能獲强惡賊人者各隨功大小遷補職級或補班行務在優假弓手使人勸慕然後募本縣鄉村人户有勇力武藝者投充計即今保甲中有勇力武藝者必多願應募若一人闕額有二人以上爭投者即委本縣令尉選武藝髙强者充或武藝衰退者許佗人指名與之比校若武藝勝於舊者即令充替其被替者更不得䕃田如此則不必教閲武藝自然精熟一縣之中其壯勇者旣為弓手其羸弱者雖使為盗亦不能為患仍委本州及提㸃刑獄常切按察令佐有取捨不公者嚴行典憲若召募不足即且於鄉村户上依舊條權差候有投名者即令充替其餘廵檢兵士縣尉弓手耆長壯丁逐捕盗賊並乞依祖宗舊法乞開言路狀元豐八年四月上右臣昨在京師伏䝉太皇太后不以臣愚踈無取遣使訪以得失豈惟㣲臣有千載一遇之幸中外聞之踊躍相慶以為言路将開下情得以上通太平之期指日可待也當是時臣未暇備論天下之事先陳所急於三月三十日上言以近嵗風俗頺弊士大夫以偷合苟容為智以危言正論為狂致閭閻愁苦而上不得知明主憂勤而下無所訴公私兩困盗賊已繁冝下詔書不以有官無官之人有知朝政闕失及民間疾苦者並許進實封狀鼓院檢院州軍長吏不得抑退其義理精當者行其言而顯其人狂愚鄙陋者報聞罷去亦不加罪又於四月二十一日復上言皇帝陛下初即政於用人賞罰尤不可不當夫諌諍之臣人主之耳目也不可一日無之說命曰若跣弗視地厥足用傷設有人閉目而塞耳跣足而疾趨前遇險阻能無傷乎賈山有言人主之威非特雷霆也勢重非特萬鈞也開道而求諌和顔色而受之用其言而顯其身士猶恐懼而不敢自盡况震之以威壓之以重乎頃者王安石秉政欲蔽先帝聦明專威福行私意由是深疾諌者過於仇讎嚴禁誹謗甚於賊盗是以天下之人以言為諱百姓愁苦無聊靡所控告致怨謗之語上及先帝臣嘗痛心泣血思救其失是故首乞下詔開言路以通下情臣謂羣臣苟有肯進言者陛下必加褒擢以勸來者此乃古人市駿骨揖怒蛙之意也召誥曰王乃初服嗚呼若生子罔不在厥初生自貽哲命今皇帝陛下新即位太皇太后初垂簾天下之人莫不屬目傾耳臣自到西京以來朝夕伏聴朝廷惟新之政以為必務明四目逹四聦以發天下積年憤鬰之志今開言路之詔旣不聞頒於四方而太府少卿宋彭年言在京不可不並置三衙管軍臣僚水部貟外郎王諤乞令依保馬元立條限均定逐年命買之數又乞令太學増置春秋博士使諸生肄業朝廷以非其本職而言各罰銅三十斤臣忽聞之悵然失圖憤邑無已臣非私於二人直為朝廷惜治體耳夫阿意箝口容身竊禄此小臣之利也威福在巳人不敢言此大臣之利也然民怨於下而不聞國家阽危而不知於陛下有何利哉彼宋彭年王諤臣素不識不知其人為賢為不肖但惜陛下臨政之初而二臣首以言事獲罪臣恐中外聞之忠臣觧體直士挫氣欲仕者斂冠藏之欲諫者咋舌相戒則上之聦明猶有所不照下之情偽猶有所不逹太平之功尚未可期也宋彭年所言雖不識事體但當廢而不行亦不宜加罪至如孔子作春秋為萬世法王安石秉政輒黜之使不得與諸經並列於學官學者毋得習以為業王諤所言未為不當乃以越職為罪古者置諌鼓設謗木詢于芻蕘未聞有位於朝而以言事為越職者也若當職之人旣不肯言不當職之人又不得言則以四海之廣兆民之衆其政治利病天子深居九重何由得聞之哉昨日進奏院遞到告身差臣知陳州然則臣自今於一州之外言及佗事亦為越職何敢言矣今二臣之罰旣不可追伏望陛下如臣前奏下詔不以有官無官當職不當職之人皆得進言擇其可取者㣲加旌賞使天下之人知朝廷樂聞善言不惡論事無可取者寝而勿問庻幾願納忠之人猶肯源源而來也臣禀賦愚戇文學政事皆出人下惟不識忌諱不阿權貴遇事妄言無所顧避以此荷知於累朝見稱於衆人若亦不得言則無所復用於聖世矣上辜太皇太后陛下下問之意下負㣲臣平生願忠之心内自痛悼死不瞑目臣乆忝便安今朝廷授以名藩義不敢辭見牒本州索逺接公人起發赴任次到官之日但勉竭疲駑恪勤本職苟力所不逮伏領罪戾而已謝御前劄子催赴闕狀元豐八年五月十五日上右臣今月十五日平明准入内内侍省遞到太皇太后御前劄子一道令臣早至闕廷者臣狂瞽妄言冝從誅譴曲荷開納仍叨奨飾并以臣羸老抱疾過形矜恤螻蟻命㣲何階報謝臣専候陳州逺接兵士到卽起發赴闕次臣無任瞻天望聖激切屏營之至奏乞所欠青苗錢許重疊倚閣狀熈寜四年正月上勘會永興軍准提舉陜西路常平廣惠倉司牒准司農寺牒檢會近准熈寜二年九月四日勅節文所借過青苖錢斛令隨省稅日限送納如遇本户災傷五分已上合隨夏稅納者展至秋稅合隨秋稅納者展至次年夏稅寺司看詳上件勅意人户合隨夏稅送納者如本户災傷五分已上即展至當年秋稅若秋料内更遇災傷自合送納夏料錢斛了足不許再行倚閣若本户更曽借過秋料錢斛即令倚閣秋料數目展至次年夏料送納切慮内有州縣並不詳認上件勅條一例重疊倚閣牒當司請詳此及備録上件勅條徧下諸州軍如是夏料合納青苗錢斛本户災傷五分以上展至秋料送納如秋料内更遇災傷即却合催夏料數目仍將本路借過秋料錢斛展至次年夏料送納了足即不得將兩次災傷重疊倚閣免至人户積欠數多難為了納别致違悞如有昨來夏料係災傷倚閣展至今秋送納者如今秋本户更遇災傷便請疾速催納了足具數申寺仍關報提刑轉運司准此施行者右謹具如前臣竊詳朝廷所散青苖錢斛本為救接窮困闕用之民使得至夏秋成熟所以春散夏斂夏散秋斂或遇本户災傷五分以上即展至次料送納盖以寛假飢民使有以自存非為乗此艱食規求利息今司農寺乃令不得將兩次災傷重疊倚閣如有昨來夏科災傷倚閣展至今秋送納者今秋本户更遇災傷便令疾速催納了足臣竊恐此事不合勅意盖縁一次災傷民間猶有舊來蓄積未至困窮其青苖錢尚許倚閣豈有連併兩次災傷百姓轉更不易之時却令須得送納舊來蓄積旣盡新糓又復不收更将何物可以供輸其逐州縣為見司農寺有此指揮不知有無務行督促嚴加科責使貧下百姓何以為生竊惟朝廷為民父母必不肯如此况災傷倚閣稅賦并借貸過斛斗准條並候豐熟日令分作料次送納如更遇災傷亦權住催理何故青苖錢斛最為緊急獨不許重疊倚閣臣已指揮本路災傷地分永興軍河中陜府同華耀乾觧八州軍請勘會去嵗夏料如係災傷倚閣青苗錢斛展限至秋送納去處若去秋本户更遇災傷其夏料錢斛未得依司農寺指揮催理更聴候朝㫖伏望聖慈特賜采察早降指揮謹具状奏聞伏候勅㫖奏去訖及牒提舉陜西路常平廣惠倉司奉聖㫖冝令提舉陜西路常平廣惠倉司疾速關牒永興軍本路州軍令詳司農寺牒一依修貫指揮即不得施行司馬光牒致誤百姓及時送納劄付司農寺仍仰關牒合屬去處准此次日乞留䑓奏為乞不將米折青苗錢狀熈寜四年正月上准提舉陜西常平廣惠倉司牒右謹具如前本司勘會朝廷元散青苗錢指揮取利不得過二分今來提舉常平廣惠倉司乃依見今饑饉之嵗在市貴價將本倉陳次斛斗紐作見錢支散與人又豫定將來粟麥之價粟毎斗二十五文足小麥毎斗四十文足夲司看詳向去夏秋五糓有豐有儉其糓麥之價固難豫定今將陳色白米毎斗紐作見錢七十五文若折計作小麥價錢支俵毎斗四十文共折計得小麥一斗八升七合半則是貧民於正二月間請得陳色白米一石却將來納着新好小麥一石八斗七升五合若折計作粟錢支俵毎斗二十五文足計支則一斗白米價錢七十五文足共折得粟三斗則是貧民闕乏之時只請得陳色白米一石却將來共納着新粟三石若只送納見錢即又須賤糶斛斗以償官中本利使貧下之民寒耕熱耘竭盡心力所收斛斗於正稅之外更以巧法取之至盡不問嵗豐嵗儉常受飢寒顯見所散青苖錢大為民害竊惟朝廷從初散青苖錢之意本以兼并之家放債取利侵漁細民故設此法抑其豪奪官自借貸薄收其利今以一斗陳米散與飢民却令納小麥一斗八升七合五勺或納粟三斗所取利約近一倍向去物價轉貴則取利轉多雖兼并之家乗此飢饉取民利息亦不至如此之重國家為民父母置此二倉名為常平廣惠豈當如此今邉鄙用兵軍糧闕乏旣無餘剰可以賑貸伏望朝廷憫此農民遭值凶饑困窮憔悴鄰於死亡直將上件常平廣惠倉斛斗依先降朝㫖借貸與第四等以下人户更不取利若不能如此須欲作青苗錢俵散之時即乞不以元糶價貴賤更不紐作見錢只據所散與人户石斗至將來成熟令出息二分毎散得一斗米者納一斗二升細色或依倉式例折作粗色如此細民猶不至窮困官中取利雖薄亦不减二分元數如允所請伏乞早降指揮謹具狀奏聞伏候勅㫖乞以除拜先後立班劄子元豐八年六月四日上臣於前月二十七日夜准閣門告報巳降告身授臣守門下侍郎二十八日三省樞密院同奉聖㫖除知樞密院外門下中書侍郎左右丞同知樞密院事班次等並以除拜先後為序今月四日延和殿進呈竊見張璪等奏乞推臣在上今後依新得指揮伏縁臣以不才誤䝉朝廷拔擢寘諸執政之末已為忝竊况超越倫軰特出其右在臣愚分何以克堪兼臣在二十八日已前伏乞依新得聖㫖以除拜先後為序在安燾之下取進止乞以除拜先後立班第二劄子元豐八年六月五日上臣今月四日曽奏乞依新得聖㫖以除拜先後為序至今未奉指揮臣噐能學術素出人下執政之中最為後來一旦超居衆人之上誠所未安伏望聖慈依臣前奏班在安燾之下取進止傳家集巻四十六欽定四庫全書傳家集巻四十七宋司馬光撰章奏三十請更張新法劄子元豐八年五月二十八日上臣聞詩云毋念爾祖聿修厥德故夏遵禹訓商奉湯典周守文武之法漢循高祖之律唐行太宗之制子孫享有天禄咸數百年國家受天明命太祖太宗撥亂返正混一區夏規模宏逺子孫承之百有餘年四海治安風塵無警自生民以來罕有其比其法可謂善矣先帝以睿智之性切於求治而王安石不達政體專用私見變亂舊章誤先帝任使遂致民多失職閭里怨嗟陛下深知其弊即政之初變其一二歡呼之聲已洋溢於四表則人情所苦所願灼然可知陛下何憚而不并其餘悉更張哉譬如有人誤飲毒藥致成大疾苟知其毒斯勿飲而已矣豈可云姑少少减之俟積以歳月然後盡捨之哉臣曏曽上言教閱保甲公私勞費而無所用之斂免役錢寛富而困貧以飬浮浪之人使農民失業窮愁無吿將官專制軍政州縣無權無以偹倉猝萬一饑饉盗賊羣起國家可憂此皆所害者大所及者衆先宜變更借令皇帝陛下獨覽權綱猶當早發號令以解生民之急救國家之危収萬國之歡心復祖宗之令典况太皇太后陛下同斷國事捨非而取是去害而就利於體甚順何為而不可哉取進止乞改求諫詔書劄子元豐八年上臣先於三月三十日上言乞下詔書廣開言路不以有官無官之人並許進實封狀仍頒下諸路州軍於要閙處出榜曉示鼓院檢院州軍長吏不得抑退臣昨奉聖㫖令入見於今月二十三日到京䝉降中使以五月五日詔書賜臣看閱臣狂瞽妄言曲荷采納豈獨微臣之幸抑亦天下之幸此乃聖主之先務太平之本原也然臣伏讀詔書其間有愚心未安者不敢不冒萬死極竭}
