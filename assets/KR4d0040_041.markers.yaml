  - {type: variant, offset: 5501, length: 0, content: '', WYG: 竊見詔書始末之言固盡善矣中間有云若乃隂有所懐犯非其分或扇揺機事之重或迎合已行之令上則觀望朝廷之意以徼倖希進下則􅃷惑流俗之情以干取虚譽審出於此苟不懲艾必能亂俗害治然則黜罰之行是亦不得已也臣聞明主推心以待其下而無所疑忌忠臣竭誠以事其上而無所畏避故情無不通言無不盡今詔書求諫而又逆以六事防之臣以為人臣惟不上言上言則皆可以六事罪之矣其所言或於羣臣有所褒貶則可以謂之隂有所懐本職之外微有所涉則可以謂之犯非其分陳國家安危大計則可以謂之扇揺機事之重或與朝㫖暗合則可以謂之迎合已行之令言新法之不便當改則可以謂之觀望朝廷之意言民間之愁苦可閔則可以謂之􅃷惑流俗之情然則天下之事無復可言者矣是詔書始於求諫而終於拒諫也臣恐天下之士益箝口結舌非國家之福也又止令御史臺出牓朝堂自非趨朝之人莫之得見所詢者狹伏望聖明於詔書中删去中間一節如臣三月三十日所奏頒布天下使天下之人曉然知陛下務在求諫無拒諫之心各盡所懐不憂黜罰如此則中外之事逺近之情如指諸掌矣取進止辭門下侍郎劄子元豐八年五月二十八日上臣准閤門告報已降吿命除臣守門下侍郎者臣先於熈寧三年䝉先帝除臣樞宻副使臣以才力短拙固辭得免自是至今十有六年臣齒􅄠愈衰精力愈耗忽被恩詔力少任重非所克堪豈敢愛身實恐累國伏望聖慈特寢新命聽臣赴陳州本任所有吿身臣不敢祗受取進止辭門下侍郎第二劄子是日中使梁惟簡賜手詔云賜卿手詔深體予懐更不多免嗣君年德未高吾當同處萬務所賴方正之士賛佐邦國想宜知悉再宣諭前日所奏乞引對上殿訖赴任其日已降指揮除卿門下侍郎切要與卿商量軍國政事早來所奏偹悉卿意再降詔開言路俟卿供職施行遂止不上臣伏䝉聖恩差御藥吳靖方宣詔臣令受新除門下侍郎吿身者聖恩重複惶愧愈深臣性質愚魯學術淺短徒以素仗忠信竊慕公直偶為時俗被以虚名誤䝉累朝甄奨承乏侍臣熈寧初王安石說導先帝置三司條例司始議新法臣以為財聚則民散下怨則上危力曽開陳稱其不可言語拙訥不能感悟㝷䝉聖恩除樞宻副使臣貪愛富貴無異於人顧以君無虚授臣無虚受先帝用臣必以為有益國家苟言無足采臣何敢叨居其位是以累上章奏終辭不拜既而請補外郡又乞散官兩任留臺四任崇福臣區區之心惟望先帝察其何故辭貴就賤一賜召對訪以新法於民間果為利害臣得輸肝瀝膽極竭以聞退就鼎鑊死且不朽飲食寤寐不忘此志幽明難欺天實知之不圖先帝奄棄天下臣隕心泣血謂積年所懐生死莫伸及來奔國喪伏䝉太皇太后特降中使宣諭令無惜奏章臣不意愚誠復有所攄發千載一遇不勝踊躍遂首以開言路為請及其他新法之不便者略舉數條今䝉恩差知陳州又詔令過闕入覲到城之日䝉降中使以開言路詔書賜示臣芻蕘之言遽荷采納且喜且懼無地自容然詳讀詔書中間六事有所未安似名為求諫其實拒諫恐士民見者未達聖意莫敢進言方欲上殿論列不意忽奉恩命俾貳左省臣以非才未敢祗受及以言路不通新法為患皆當今切務遂於今早入一劄子辭免恩命并所准偹上殿劄子二道同於通進司投下未審聖意以臣前後所言果為何如若稍有可采乞特出神斷力賜施行則臣可以策勵疲駑少佐萬一若皆無可采則是臣狂愚無識不知為政豈可以汚高位尸重任使朝廷獲曠官之譏微臣受竊位之責他日有誤國事罪不容誅伏望聖慈特寢新命使得自安其分取進止乞申明求諫詔書劄子元豐八年六月十四日上臣伏見皇帝陛下初臨太寳太皇太后陛下同斷萬幾側身虚已渇於求諫特下詔書大開言路此誠明主之先務太平之本原也竊見中間有若廼隂有所懐至是亦不得已也一節天下見者未達聖心咸以為朝廷雖名求諫實惡人論事豫設科禁有上言者皆可以此六事罪之是以盤桓猶豫未敢盡言如此則上恩不得下䆒下情不得上通上下否閉萬事乖失又前來詔書止牓朝堂所詢不廣見者甚少臣愚欲望聖慈下學士院别草詔書除去中間一節務在勤求讜言使之盡忠竭誠無有所諱仍乞徧頒天下在京於尚書省前及馬行街出牓在外諸州府軍監各於要閙處曉示不以有官無官之人應有知朝政闕失及民間疾苦者並許進實封狀言事在京則於登聞鼓院檢院投下委主判官畫時進入在外則於州府軍監投下委長吏即日附逓聞奏不得取責副本强有抑退其百姓無家業人慮有姦詐即令本州責保知在奏取指揮放令逐便候有上件實封奏狀進入至内中伏望陛下以萬幾之暇畧賜省覽其所論至當者當用其言以顯其身其是非相半者捨短取長其言無可采事不可行者亦當矜容不可加罪如此則下情無不通嘉言㒺攸伏聦明周四逺海内如指掌矣或慮奏狀繁多難以親覽即乞降付三省委三省官看詳擇其可取者用黄紙簽出再進入或乞留置左右以偹規戒或乞降付有司施行取進止看閱吕公著所陳利害劄子臣今月一日夜䝉降到吕公著劄子一道付臣看閱所陳更張利害有無兼濟之才直書當與未當具悉奏來者臣自公著到京止於都堂衆中一見自後未嘗私相見及有簡帖往來今公著所陳與臣所欲言者正相符合盖由天下之人皆欲如此臣與公著但具衆心奏聞耳臣聞書曰有廢有興出入自爾師虞庶言同則繹言國家政事欲有所改更必先謀於衆人所言皆同然後行之則無失也傳曰上酌民言則下天上施言為人上者當采酌民言從其所欲則在下之人戴上如天受其恩施也伏望陛下察公著所陳參以臣民所上實封奏狀若與之同者斷志行之勿復有疑臣見太平之功不日可成矣公著一言而天下受其利可謂有兼濟之才所言無有不當惟有保甲一事欲就農隙教習臣愚以為朝廷既知其為害於民無益於國便當一切廢罷更安用教習容臣續具劄子奏聞次其公著劄子謹同封上取進止乞罷保甲劄子元豐八年七月三日上臣竊見先帝以戎狄驕傲侵據漢唐故地有征伐開疆之志故置保甲令開封府界及河北陜西河東三路皆五日一教閱京東西兩路保甲養馬仍各置提舉官權任比監司既而有司各務張皇以希功賞其提舉官專䕶本局不顧他司事干保甲州縣皆不得關預管内百姓不得處治其廵檢指使保正保長競為侵擾蠶食無厭稍不如意擅行捶撻其保丁習於遊惰不復務農或自為刼掠或侵陵鄉里其本家耕種耘穫率皆妨廢供送不辦率斂無窮貲産耗竭無以為生弱者流移四方壯者亡為盗賊行之數年先帝浸知其弊申勅州縣令保甲應有違犯并廵教官指使違法事件並許州縣覺察施行及陛下踐阼聽政首令京東西路保甲養馬並依元降年限収買其剰買過數目並以充次年之數又令開封府界三路團教已及半年經朝廷按閱者每月併教兩日未經按閱者併教三日陜西團教未及半年者每月兩次併教三日又令見教人身材弱小或久來疾病及本家止有一丁病患不堪營作并第五等巳下地土不及二十畝者並許州縣保明提舉司審驗放免又令一縣不得放免過二分此皆聖澤矜寛民力於保甲勞費雖什减五六然保甲保馬向去㸃擇買養補填尚猶如舊其廵教指使保正保長名目猶在於所轄保甲恐不免須有陵逼侵漁其四時教閱雖减日數未免妨農臣愚以為此保甲若使之逐捕賊盗則近已有指揮廵檢縣尉及弓手兵級人數並令依保甲未上畨以前人數復置其保甲更不令管勾捕盗若使之攻討四夷則此皆畎畝白徒教閱雖熟未嘗見敵與戎狄戰鬭必望風奔潰登極詔書戒勅邉吏令不侵擾外界務要静守疆場然則此保甲保馬的實有何所用徒令府界及五路農民不堪愁苦幸賴社稷之靈適值累年豐稔猶流民甚多盗賊充斥若遇如明道年之蝗康定年之旱至和年之水則其為國家大患豈可盡言近者羣盗王冲乗保馬諸處行刼置保馬本欲逐盗今更為盗資又獲鹿縣保甲斫射毆傷提勾孫文廵檢張宗師以下陵上是乃大亂之源漸不可長凡保甲保馬有害無利天下之人莫不知之臣不知朝廷何憚而乆不廢罷伏乞斷自聖志盡罷諸處保甲保正保長使歸農依舊置耆長壯丁廵捕盗賊戸長催督稅賦其所養保馬揀擇勾収太僕寺量給價錢分配兩騏驥院坊監及諸軍召提舉官還朝其勾當公事廵檢指使並送吏部與合入差遣如此則開封府界及五路之民孰不歡呼鼓舞荷戴聖德若以保甲中武藝已成之人可惜使之歸農即乞令逐縣戸數每五十戸置弓手一人略依縁邊弓箭手法許䕃本戸田二頃與免二稅或稅輕者與免若干石斗稅及戸下諸般科役本戸田不足聽䕃親戚田務在優假使人勸慕然後召募本縣鄉村戸有勇力武藝者投充弓手計即今保甲中有勇力武藝者必多願應募若一人闕額有二人以上争投者即委本縣令佐揀試武藝高强者充若見充弓手人有勇力武藝衰退許他人指名比較若勝於舊者即令充替如此則不須教閱武藝自然常得精熟一縣之中其勇壯者既充弓手其羸弱者雖使之為盗亦無能為患仍委本州及提㸃刑獄常切按察令佐有取捨不公者重加刑典若無人投名乞更議優法若尚召募不足即且於鄉村戸上依舊雇人候有投名者即令充替若弓手數多即令分畨更互在縣祗應一年一替其餘各分定地分廵捕賊盗每獲賊勘得赦後住止及窩藏去處其本地分嚴行科責及令出賞錢與獲賊之人其賊發地分更不作三限科校只令捕賊給賞如此則賊發之處捕盗之人不復掩蔽住止窩藏之處捕盗人不肯庇匿盗賊無所容身自然稀少取進止乞罷免役錢狀元豐八年上右臣竊以百姓出力以供在上之役盖自古及今未之或改熈寧中執政者以為百姓惟苦差役破産不憚増稅乃請據家貲高下各令出錢雇人充役按因差役破産者惟鄉戸衙前有之自餘散從承符弓手手力耆戸長壯丁未聞破産者也其鄉戸衙前所以破産者盖由山野愚戇之人不能幹事使之主管官物或因水火損敗或為上下侵欺是致欠折備償不足有破産者至於長名衙前乆在公庭句當精熟每經重難差遣積累分數别得優輕場務酬奨徃徃致富何破産之有夫差役出於民錢亦出於民今使民出錢雇役何異割鼻飼口朝三暮四於民何所利哉又曏者役人皆上等戸為之其下等單丁女戸及品官僧道本來無役今更使之一槩輸錢則是賦斂愈重非所以寛之也故自行免役法以來富室差得自寛而貧者困窮日甚殆非所抑兼并哀惸獨均賦役也又監司守令之不仁者於雇役人之外多取羨餘或一縣至數萬貫以冀恩賞規進取不顧為民世世之患又國家舊制所以必差青苗戸充役人者為其有莊田家屬有罪難以迯亡故頗自重惜今雇浮浪之人充役常日恣為不法一旦事發單身竄匿何處州縣不可投名又農家所有不過穀帛與力自古賦役無出三者自行新法以來青苗免役及賦斂多責見錢錢非私家所鑄要須貿易外求豐歳穀賤已自傷農况廹於期限不得半價盡糶所収未能充數家之餱粮不暇更留若值凶年則又無穀可糶人人賣田無所可售遂至殺牛賣肉伐桑鬻薪來年生計不敢復議此農民所以重困也又錢者流通之物故謂之泉布比年以來物價愈賤而閭閻益困所以然者錢皆聚於官中民間乏錢貨重物輕借使有人鬻薪糴米米價雖賤薪價亦賤故也臣愚以為宜悉罷免役錢其州縣諸色役人並依舊制委本縣令佐掲簿定差替見雇役人其衙前先召募人投充長名召募不足然後差鄉村人戸每經歴重難差遣依舊以優輕場務充酬奨所有見在免役錢撥充州縣常平本錢以戸口為率常存三年之蓄有餘則歸轉運司凡免役之法縱富强應役之人征貧弱不役之戸利於富者不利於貧者及今耳目相接猶可復舊若更年深富者安之民不可復差役矣傳家集巻四十七欽定四庫全書傳家集巻四十八宋司馬光撰章奏三十一乞罷將官狀元豐八年上右臣伏以州縣者百姓之根本長吏者州縣之根本根本危則枝葉何以得安故自古以來凡置州郡必嚴其武備設長吏必盛其侍衛非以重其權驕其人也乃所以安百姓衛朝廷也秦懲周室幹弱枝强之弊既滅六國以為天下不復用兵雖分三十六郡置郡守更以御史監之隳名城銷兵器束以苛法舉動施為皆不得自專是以陳勝吳廣以匹夫奮臂大呼郡縣莫能制多殺長吏以應之雖由其殘虐取亡亦守令無權無兵之所致也晉武帝平吳亦以為天下既一兵無所用悉去州郡兵陶璜山濤皆言州郡武備不可廢帝不聽及永寧以後盗賊羣起州郡無備不能擒制天下遂大亂夫兵者所以威不軌而昭文德誰能去兵州縣無虞則國家安矣州縣不守則國家危矣臣切見國朝以來置總管鈐轄都監監押為將帥之官凡州縣有兵馬者其長吏未嘗不兼同管轄盖知州即一州之將知縣即一縣之將故也先帝欲征伐四夷患諸州兵官不精勤訓練士卒懈弛於是有建議者請分河北陜西河東京東京西等路諸軍若千人為一將别置將官使之專切訓練其逐州總管以下及知州知縣皆不得關預及有差使量留羸弱下軍及剥員以充本州官白直及諸般差使其餘禁軍皆制在將官專事教閱臣愚以為職事修舉在於擇人不在設官苟得其人雖總管等皆能訓練士卒不得其人雖將官亦何所為况今之將官即曏之為總管等者也豈為總管等則不能舉職為將官乃能舉職乎此徒變易其名無益事實非惟無益兼復有害凡設官分職當上下相維如身之使臂臂之使指紀綱乃立今為州縣長吏及總管等官而於所部士卒有不相統攝不得差使殆如路人者至於倉庫守宿街市巡邏亦皆乏人雖於條許差將下兵士而州縣不得直差須牒將官將官往往占䕶不肯差撥萬一有非常之變州縣長吏何以號令其衆制禦姦宄哉又頃歳以來自轉運使知州以下白直及迎送之人日朘月減出入導從太為蕭條供承荷擔有所不給觀望削弱無以威服吏民臣略舉目覩一事以證其餘西京城郭周數千里卑薄頺缺犬豕可踰又􅈆洛二水交貫其中每夜諸門扃鐍雖嚴而灘流之際人皆可以平行往來其屬水南北廵檢下所管兵士除出軍外餘數不多通判以下諸官白直來往防送倉庫守宿街市巡邏盡出其間曏者先帝建豫勅西京留守親詣嵩山起建道場其將下禁軍充白直者於條皆不得出城經宿所敢留者剰員七八人而已西京天子别都也其守禦不固如此留守前宰相重官也其侍衞單寡如此况僻小州縣其守禦之備侍衞之衆可知矣萬一有凶校之賊驅烏合之衆突入城邑或刼質戕賊畏吏以焚燒廬舎殺掠吏民將何以制之哉此特天下太平之久習俗淳厚羣心安固賊不測虚實膽智怯弱故未敢為之耳豈可忽略謂之必無而不為之備哉今獨縁邊州軍城隍完固士卒衆多可以守禦自餘腹内州縣既無深溝高城又乏士卒羣盗猝至何以責其竭節守義不棄城竄匿或以酒食迎賊以甲兵獻賊斂民財以賂賊者乎羣盗尚爾况敵人傾國大舉長驅而來者哉易曰君子安不忘危存不忘亡治不忘亂兵法曰不恃敵之不我犯恃我之不可犯國家豈可恃即日平寧晏然高枕不以為慮謂其必不敢來乎臣愚以為河北陜西河東京東京西等路腹内州縣宜以漸候豐年農閒之際委提㸃刑獄與本處長吏相度各修築所治之城州城稍高縣城次之不必廣大所以然者高則難踰小則易守故也其縁邊屯駐兵士遇春夏無事之際委經略安撫使與轉運使公共商量减放歸住營州軍或於内地就糧勿聽怯懦將帥多有虚占以自守衛其腹内州軍量其大小𦂳慢大藩常留千餘人小州亦留數百人不得差發往别州軍見兵不足即行招添悉罷將官其逐州縣禁軍並委長吏與總管等官同共提舉教閱及諸多差使其有不能精勤致士卒懈弛者委提㸃刑獄常切按察聞奏嚴行責降仍令逐縣各選有勇力武藝之人充弓手以守衞城邑討捕盗賊其州縣吏所給白直迎送之人皆如嘉祐編勑以前之數如此力可以守然後遇㓂盗之至責其棄城等罪而誅之彼亦甘心矣乞降臣民奏狀劄子元豐八年七月十四日上臣伏見陛下詔開言路至今已涉旬月必有臣寮民庶上言朝廷闕失民間疾苦奏狀已多未見有付外令三省或樞宻院商量施行者如此則徒煩聽覽何所禆益昔漢昭帝時吏民上書言便宜有異輒下杜延年平處復奏先帝初即位詔中外上言得失亦令臣與張方平同詳定選擇可取者與元奏狀同進入内或降付三省樞宻院施行臣竊計今來臣民所上文字其間是非臧否雖錯雜嘉謀長䇿不可謂無以睿明所燭諒毫髮無遺豈可一概棄置全不采用欲乞選其可從者降出施行或以萬幾之繁未暇遍加省覽即乞依臣前奏降付三省委執政官分取看詳擇其可取者用黄紙簽出再進入或留置左右或降付有司施行取進止乞降封事簽帖劄子元豐八年八月八日上臣聞舜明四目達四聦王者視四海之内皆如戸庭閭閻之間皆如指掌然後能治其天下恭惟太皇太后陛下深居九重皇帝陛下富於春秋四海之廣大閭閻之隱微未嘗身親而目覩也非采聽臣民之言雖以天縱睿智之性何由知之陛下近詔天下臣民皆得上封事言朝政闕失民間疾苦仍降出令臣與諸執政官看詳其第一次降出者三十三巻臣謹與諸執政選擇其中除無取及冗長之辭外其可取者已用黄紙簽出進入訖伏乞陛下取簽出者更賜詳覽或留置左右以備規戒或降付有司商議施行如此則忠言日進聦明日廣誠生民之厚幸社稷之盛福也曏者執政請聽臣寮上殿陛下謙退以為國家政事多未習知臣寮欲言事者自有章䟽何必上殿今臣民章䟽舉集於前若非陛下勤加省覽則朝政闕失民間疾苦何由上聞國家政事無時而習知也其間亦有一事而衆人共言者臣亦重複簽出盖欲陛下知天下所共患衆情所同欲也夫為政在順民心民之所欲者行之所惡者去之則何患號令不行民心不附國家不安名譽不榮哉惟在陛下斷志而力行之耳取進止乞省覽農民封事劄子元豐八年九月三日上臣伏覩近降農民訴疾苦實封奏狀王嗇等一百五十道除所訴重􅃨外俱已簽帖進入竊惟四民之中惟農最苦農夫寒耕熱耘霑體塗足戴星而作戴星而息􅅙婦育􅅙治繭續麻紡緯縷縷而積之寸寸而成之其勤極矣而又水旱霜雹蝗􅈮間為之灾幸而収成則公私之債交争互奪穀未離場帛未下機已非已有矣農夫􅅙婦所食者糠籺而不足所衣者綈褐而不完直以世服田畝不知捨此之外更有可生之路故其子弟遊市井者食甘服美目覩盛麗則不復肯歸南畝矣至使世俗俳諧共以農為􅅓鄙誠可哀也又况聚斂之臣於租稅之外巧取百端以邀功賞青苗則强散重斂給陳納新免役則刻剥窮民収養浮食保甲則勞於非業之作保馬則困於無益之費可不念哉夫農蠺者天下衣食之原人之所仰以生也是以聖王重之臣不敢逺引前古竊聞太宗皇帝嘗遊金明池召田婦數十人於殿上賜席使坐問以民間疾苦田婦愚戇無所隱避賜帛遣之太宗興於側㣲民間事固無不知所以然者恐富貴而忘之也故每臨朝無一日不言及稼穡真宗皇帝乳母秦國夫人劉氏本農家也喜言農家之事真宗皇帝自㓜聞之故為開封尹以善政著聞及踐大位咸平景德之治為有宋隆平之極景德農田勅至今稱為精當昔周公相成王作無逸曰先知稼穡之艱難乃逸則知小人之依盖以一盂之飯一尺之帛莫不出於艱難人主既知之則不肯用之於無益散之於無功驕侈之心無自而生矣伏惟太皇太后陛下深居九重皇帝陛下富於春秋自非今者濬發德音大開言路使畎畝之民皆得上封事則此曹疾苦何由有萬分之一得達於天聽哉其文辭鄙俚語言叢雜皆身受實患直貢其誠不可忽也伏望太皇太后陛下與皇帝陛下同賜省覽庶以開廣聦明資益聖性於民間情偽靡不周知異日太平之業由此為始矣取進止與吕公著同舉程頥劄子元豐八年九月十五日上臣等竊見河南處士程頥力學好古安貧守節言必忠信動遵禮義年踰五十不求仕進真儒者之高蹈聖世之逸民伏望聖慈特加召命擢以不次足以矜式士類禆益風化取進止乞裁斷政事劄子元豐八年十月十七日上臣聞兩貴之不能相事兩賤之不能相使此乃物理自然人情之常也是以聖人立為君臣使人臣各獻其謀而人君裁决其是非若網在綱有條而不紊此國家所以治也若人君不加裁决使人臣各行其意則朝夕鬭訟弱不勝强寡不勝衆不則雷同詭隨尸位竊禄苟且偷安以度目前此國家所以衰也然人君於是非之間亦當三思精察昭然無疑然後决之自古興衰未有不由此塗出也夫人心不同各如其面雖以周公之聖召公之賢同輔成王猶有不恱况邪正忠佞各有所存者乎臣竊惟皇帝富於春秋太皇太后親臨萬幾事無大小皆委於執政垂拱仰成萬一羣臣有所見不同勢均力敵莫能相一者伏望陛下特留聖意審察是非若甲是而乙非當捨乙而從甲乙是而甲非當捨甲而從乙如此則羣臣莫敢不服善政日新矣不然陛下雖有求治之心事功無時而成也况書曰惟辟作福作威不可使用人賞罰之柄盡歸執政人主一不得而專也取進止議可劄子元豐八年十月二十四日上臣聞古人有言謀之在多斷之在獨陛下寛仁委政羣下或政有大疑議論難一儻陛下不决其是非則争辯紛紜無時而息事功何由可成臣謹案蔡邕獨斷叙漢制有疑事公卿百官㑹議若臺閣有正處而獨執異議者曰駁議其合於上意者文報曰某官某甲議可此所以各盡羣下之所見而人主亦不失操柄也今執政之臣雖相與竭力同寅協恭若萬一有議論必不可合者欲乞許令各具劄子奏聞望陛下精察其是非可否以聖意决之或於簾前宣諭或於禁中批出令依某人所奏若羣臣猶有固争執者則願陛下更加審察若前來處分果非則勿憚改為若灼然無疑則决行不移耳如此再思而行庶幾得盡衆心事亦少失矣取進止乞不貸强盗白劄子元豐八年八月上刑部奏鈔曹州勘到百姓趙倩吕德吕文於今年三月二十三日同打刼南華縣界頓榮家財物將鎗刺頓榮一鎗腮上血出打刼得財物被弓手捉獲醫人檢得頓榮元被吕文刺傷處有血是失物傷將刼到賘估定足錢陸貫玖拾玖文本州只為頓榮被刼刺傷時不曽申官檢定痕驗遂具案申奏大理寺㑹到進奏院今年三月六日赦七日到州准律勅合决重杖一頓處死刑部檢到例擬並特貸命决脊杖二十各刺面配廣南逺惡州軍牢城門下勘㑹近年以來諸州勘到劫賊但不曽殺人放火者並作情理可愍或刑名疑慮申奏朝廷率從寛貸竊詳逐人既為刼賊情理有何可愍赦後贓滿傷人刑名有何疑慮此皆逐州官吏避見失入罪名專務便文營已無去害疾惡之心况曹州素多盜賊係重法地分如趙倩等所犯如此皆得免死則是强盗不放火殺人者盡得免死竊恐盗賊轉加恣横良民無以自存殆非懲惡勸善之道其趙倩等欲乞並令本州依法處死仍乞立法自今後應天下州軍勘到强盗情理無可愍刑名無疑慮輒敢奏聞者並令刑部舉駁重行典憲更不得似日前用例破條乞不貸故鬭殺劄子元豐八年八月十四日上竊惟王者所以治天下惟在法令凡殺人者死自有刑法以來百世莫之或改若殺人者不死傷人者不刑雖堯舜不能以致治也近見刑部奏鈔泰寧軍勘到保正家人姜齊見本都代名大保長張存捽着百姓孫遇其孫遇捽着袁貴髻子張存道此人稱是東嶽急脚子胡亂打人不伏収領齊捽着孫遇􅉍互打三二十拳解擘放却袁貴齊與張存捽倒孫遇齊行拳踢打孫遇身死齊發心共張存捉縳袁貴虚做打死元相争人申解赴縣替得償命其袁貴到縣不肯虚招齊䝉枷項隔勘方具實招通又懐州勘到百姓魏簡與郭興争賭錢拽倒郭興家棚子郭興父郭昇拽着簡使頭撞簡簡為本人年老便道你共我不是抵對休扯着我待推揢郭昇圖放却簡用力去郭昇咽喉上揢一揢其人當下倒地身死又耀州勘到百姓張志松為再從弟張小六寃執稱呪罵堂兄弟男女偉志松乘酒嗔恨張小六因此行拳打張小六當時身死上件三人於條皆合處死本州並作情理可憫奏裁耀州仍稱張志松本無殺意刑部一切檢例擬特貸命决脊二十刺配斷所牢城竊詳孫遇不合詐稱東嶽急脚子胡亂打人雖是罪人然罪不至死其姜齊等既解臂放袁貴即合申送赴官依法施行其孫遇别更不曽拒捍及走兼巳就拘執豈可更捽倒毆撃直至於死又更誣執被苦人袁貴作殺人賊欲令替自已償命如此情理有何可憫其魏簡為郭昇年老不欲相打却用力去本人咽喉上一揢至死豈不更甚于歐打又張志松只為張小六寃執呪罵事理至輕遂歐本人致死並是鬭殺於情理皆無可憫凡人因忿相争迭相歐擊其意豈皆在於殺但一人於􅇳限内死則彼一人須當償命况此三人皆即時歐殺當死無疑止是逐州避見失入罪名妄作情理可憫或刑名疑慮奏裁刑部即引舊例一切貸命若因循不改為弊甚大所以然者從來律令勅式有該説不盡之事有司無以處决引例行之今鬭殺當死自有正條而刑部不問可貸與否承例盡免死决配作奏鈔施行是殺人者不死其鬭殺律條更無所用也於殺人者雖荷寛恩其被殺者何所告訴非所以禁制凶暴保安善良也欲乞今後應諸州所奏大辟罪人並委大理寺依法定斷如情理無可憫其刑名無疑慮即仰刑部退囘本州令依法施行如委實有可憫及疑慮即仰刑部於奏鈔後别用貼黄聲說情理如何可憫刑名如何疑慮今擬如何施行令門下省省審如所擬委得允當則用繳狀進入施行如有不當及用例破條即仰門下省駁奏乞行取勘庶使畫一之法不至隳壞凶暴之人有所畏憚其姜齊等縁係未立法以前今欲先次進入大辟貸配法草元豐八年十月二十日授刑部應開封府諸路州軍奏到大辟罪人稱是刑名疑慮及情理可憫者仰大理寺依法定斷并坐疑慮可憫條送刑部看詳如刑名實有疑慮情理實有可憫因依申奏取㫖若看詳得别無疑慮及可憫者即具鈔奏下本處依法施行不得一槩將舊例貸配破却律勅正條仍委門下中書尚書省㸃檢如有不當及用例破條奏乞取勘施行傳家集巻四十八欽定四庫全書傳家集巻四十九宋司馬光撰章奏三十二進孝經指解劄子元豐八年十二月二日上臣竊惟自古五帝三王未有不由學以成其聖德者所謂學者非誦章句習筆札作文辭也在於正心修身齊家治國明明德於天下也恭惟皇帝陛下肇承基緒雖年在㓜冲而執喪臨朝率禮弗越體貌尊嚴舉止安重顒顒卭卭有老成之德華夷瞻仰無不愛戴此乃聖性自然不聞亦式實天祐皇家宗廟社稷生民之盛福也然玉不琢不成器人不學不知道儻復資學問以成之則堯舜禹湯文武何逺之有伏見近降聖旨過冬至開講筵臣竊以聖人之德無以加於孝自天子至於庶人莫不始於事親終於立身揚名於後世誠為學所宜先也臣曏不自揆嘗撰古文孝經指解皇祐中獻於仁宗皇帝竊慮歳久遺失不存今則繕冩為一冊上進伏乞聖明少賜省覽取進止辭轉官劄子元豐八年十二月十二日上臣伏覩中書録黄奉聖旨神宗祔廟畢執政官依故事轉遷以臣為正議大夫者竊惟英宗皇帝親政之初以宰臣韓琦等於嘉祐之末有定䇿大功保佑聖躬濟於艱難故各特遷一官今陛下以神宗皇帝大漸之際宰臣蔡確等啓廸聖心建立儲貳傳授大寳各特遷一官固亦其宜臣當是時方閒居在西京凴几末命非所預聞豈得與確等同受褒賞且國家名位本以醻功報德不可但以祔廟禮畢檢舉故事虚有授受况臣於登極之初已䝉覃恩改官今曽未踰年安敢再叨殊渥縱臣貪冒不知愧恥天下之人其謂臣何所有授正議大夫吿身臣不敢祗受伏望聖慈特賜寢罷取進止辭轉官第二劄子元豐八年十二月上臣於今月十一日伏覩中書録黄䝉恩除正議大夫臣於十二日具劄子奏以蔡確等啓廸神宗皇帝建立儲貳傳授大寳宜遷一官臣閒居西京非所預聞所有正議大夫吿身臣不敢祗受自後未聞降出至十四日准閤門吿報令臣受上件告身臣竊惟富弼輔佐三朝名德老成當嘉祐之初亦是定策之臣但以不預顧命懇辭甚至如臣才德比於富弼無能為役當建儲顧命之際臣為庶僚在外初不預聞豈敢止因祔廟隨例遷官凡為政之要惟在賞功罰罪臣沗備執政無功受賞將何以裁抑他人所有新命伏望聖慈特賜寢罷取進止辭轉官第三劄子元豐八年十二月上臣伏奉詔書以臣辭免恩命所請宜不允者昔英宗皇帝入承大統宰臣韓琦等實有定䇿之功又踐阼之初聖躬違豫慈聖光獻皇太后權同聽政琦等盡忠竭力亦不為不至及英宗皇帝專制萬幾襃賞琦等各遷一官臣時為諫官猶上言以近歳官冗賞濫兩府大臣陛下即政之初宜懲革斯弊今自於朞年之間連併遷官則難以禁他人之幸進者恐宿衞將軍宗室外戚四方藩鎮内侍近臣皆有冀望至時陛下亦不能裁抑兩府亦不敢執奏當是時英宗皇帝雖不収還恩命而富弼亦有定策之功自以不預顧命力辭甚苦况臣既不預定策又不預顧命豈可來自冗散之地遽與輔臣同賞且臣昔日在人則言其不可受今日在已則受而不辭顧行復言能不自愧所有吿身臣不敢祗受伏望聖慈矜察特賜寢罷取進止辭轉官第四劄子元豐八年十二月上臣昨䝉恩除臣正議大夫臣三具劄子及簾前面陳至懇終未賜開允臣夙夜愧恐不能自已臣竊以為政之要惟在於賞功罰罪賞不當功則徼幸競進罰不當罪則善良憂恐亂之基也曏日神宗皇帝大漸之際臣屏居閭閻今乃與建儲受遺之臣一例遷官賞不當功何以過此陛下不知臣不肖使待罪執政執政當為陛下抑徼幸惜官職而身自冒賞何以表率他人臣非敢私飾小亷其志欲為國家慎重名器伏望聖慈矜察特賜寢罷新命所有吿身臣不敢祗受取進止辭轉官第五劄子元豐八年十二月上臣准閣門吿示以臣累上章辭免新命已降批荅不許所有吿身可吿示早令祗受者臣竊惟無功受賞士之所難䆒觀英宗皇帝神宗皇帝即政之初襃賞大臣皆以定策受遺之功非因祔廟禮畢臣既非定策又不受遺實難虚受至於政事日新皆陛下聖明衆賢協力在臣一人何能禆益而無名冒賞惟恐有玷清朝所有吿身臣不敢祗受伏乞早賜寢罷取進止請革弊劄子元豐八年十二月四日上臣伏見陛下自臨政以來夙夜孜孜以愛百姓安國家為事盖善治疾者必䆒其所來攻其所急救之欲速去之欲盡臣觀今日公私耗竭逺近疲弊其原大概出於用兵夫兵者凶器天下之毒財用之蠧聖人除暴定亂不得已而用之耳自有唐中葉藩鎮䟦扈降及五代羣雄角逐四海九州𤓰分縻潰兵相吞噬生民塗炭二百餘年太祖受天明命四征弗庭光啓景祚太宗繼之克成厥勲然後大禹之迹悉為宋有於是載戢干戈與民休息或自生至死年及期頥不見兵革吏守法度民安生業雞鳴狗吠烟火相望可謂太平之極致自古所罕侔矣及神宗繼統材雄氣英以幽薊雲朔淪於契丹靈夏河西專於拓䟦交趾日南制於李氏不得悉張置官吏収籍賦役比於漢唐之境猶有未完深用為恥遂慨然有征伐開拓之志於是邊鄙武夫窺伺小利敢肆大言祗知邀功不顧國患争賈餘勇自謂衞霍不死白面書生披文按圖玩習陳迹不知合變競獻竒策自謂良平更生聚斂之臣捃拾財利剖析秋毫以供軍費專務市恩不恤殘民各陳遺利自謂研桑復出相與誤惑先帝自求榮位於是置提舉官强配青苖多収免役以聚貨泉又驅畎畆之人為保甲使捨耒耜習弓矢又置都作院調筋皮角木以多造器甲又養保馬使賣耕牛市駔駿而農民始愁苦矣部分諸軍無問邊州内地各置將官以領之自知州軍總管鈐轄都監監押皆不得關預捨祖宗教閱舊制誦射法效北服機械陳圖競為新竒朝晡上塲罕得休息而士卒始怨嗟矣置市易司强市㩁取坐列販賣増商稅色件及菜果而商賈始貧困矣又立賖貸之法誘不肖子弟破其家又令民封狀増價以買坊塲致其子孫鄰保籍没貲産不能偹償又増茶鹽之額賤買貴賣强以配民食用不盡廹以威刑破産輸錢又設措置河北糴便司廣積糧穀於臨流州縣以備饋運教兵既久積財既多然後用之而承平日久人已忘戰將帥愚懦行伍驕惰加以運籌决勝者乃浮躁巧偽之士不知彼已妄動輕舉是以頓兵靈武力疲食盡自潰而歸執兵之士荷糧之夫暴骨塞外且數十萬築堡永樂怠忽無備縱冦延敵闔城之人翦為魚肉曽未足以威服戎狄而中國先自困矣先帝深悔其然厭截截諞言思畨畨良士及下哀痛之詔息兵富民奄棄天下此臣所為痛心疾首而泣血追傷者也伏惟皇帝陛下肇承基緒太皇太后同聽庶政首戒邊吏毋得妄出侵掠俾華夷兩安今契丹繼好秉常納貢乾德拜章征伐開拓之議皆已息矣則此置提舉官散青苗斂免役錢㸃教保甲置都作院養保馬置將官市易司封狀買坊塲増茶鹽額措置河北糴便司皆為虚設陛下幸詔臣民各言疾苦其已至者千有餘章未有不言此數事者足知其為天下公患衆人所共知非臣一人之私言也利害著明皎如日月何所復疑而羣臣猶習常安故憚於更張雖頗加裁抑而監司按堵將官具存保甲猶教閱保馬猶養飼邊州屯戍不减軍器造作不休茶鹽新額尚在差役舊法未復是用兵雖息而公私勞費猶未息也如此因循不知改轍數年之後萬一遇水旱大饑盗賊羣起其為國家憂患豈敢盡言哉伏願陛下斷自聖志凡王安石等所立新法果能勝於舊者則存之其餘臣民以為不如舊法之便者痛加釐革雖非一日可行之事欲乞陛下宣諭執政令因臣民上封事熟議利害進呈以聖鑒裁决而行之昔夏遵禹訓商用湯法周循文武之典盖創業垂統之王貽厥孫謀後世所宜謹守不可失也若凡百措置率由舊章但使政事悉如熈寧之初則民物熈熈海内太平更無餘事矣議者必曰革弊不可倉猝當徐徐有漸此何異使醫治疾而曰勿使遽愈且勿除其根原使盡也其為醫者謀則善矣其為疾者謀奚利哉取進止乞罷免役錢依舊差役劄子元祐元年正月二十二日上尋得㫖依奏臣竊見免役之法其害有五舊日差役之時上戸雖差充役次有所陪備然年滿之後却得休息數年營治家産以備後役今則年年出錢無有休息或有所出錢數多於徃日充役陪備之錢者此其害一也舊日差役之時下戸亢不充役今來一例出錢免役驅廹貧民剥膚椎髓家産既盡流移無歸弱者轉死溝壑强者聚為盗賊此其害二也舊日差役之時所差皆土着良民各有宗族田産使之作公人管勾諸事各自愛惜少敢大叚作過使之主守官物少敢侵盗所以然者事發迯亡有宗族田産以累其心故也今召募四方浮浪之人充役無宗族田産之累作公人則恣為姦偽曲法受贓主守官物則侵欺盗用一旦事發則挈家亡去變易姓名往别州縣投名官中無由追捕官物亦無處理索此其害三也自古農民所有不過穀帛與力凡所以供公賦役無出三者皆取諸其身而無窮盡今朝廷立法曰我不用汝力輸我錢我自雇人殊不知農民出錢難於出力何則錢非民間所鑄皆出於官上農之家所多有者不過莊田穀帛牛具桑柘而已無積錢數百貫者也自古豐歳穀賤已自傷農官中更以免役及諸色錢督之則穀愈賤矣平時一斗直百錢者不過直四五十文更急責之則直三二十矣豐年猶可以糶穀送納官錢若遇凶年則穀帛亦無不免賣莊田牛具桑柘以求錢納官既家家各賣如何得售惟有拆屋伐桑以賣薪殺牛以賣肉今歳如此來歳何以為生是官立法以殄盡民之生計此其害四也提舉常平倉司惟務多斂役錢廣積寛剰以為功效希求進用今朝廷雖有指揮令役錢寛剰不得過二分竊慮聚斂之臣猶依傍役錢别作名目隱藏寛剰使幽逺之人不被聖澤此其害五也陛下近詔臣民各上封事言民間疾苦所降出者約數千章無有不言免役錢之害者足知其為天下之公患無疑也以臣愚見為今之計莫若直降勅命應天下免役錢一切並罷其諸色役人並依熈寧元年以前舊法人數委本縣令佐親自掲五等丁産簿定差仍令刑部檢㑹熈寧元年見行差役條貫雕印頒下諸州所差之人若正身自願充役者即令充役不願充役者任便選雇有行止人自代其雇錢多少私下商量若所雇人逃亡即勒正身别雇若將帶却官物勒正身陪填如此則諸色公人盡得有根柢行止之人少敢作過官中百事無不修舉其見雇役人候差别役人各放逐便數内惟衙前一役最號重難曏者差役之時有因重難破家産者朝廷為此始議作助役法然自後條貫優假衙前諸公庫設厨酒庫茶酒司並差將校勾當諸上京綱運召得替官員或差使臣殿侍軍大將管押其麤色及畸零之物差將校或節級管押衙前苦無差遣不聞更有破産之人若今日差充衙前料民間陪備亦少於曏日不至有破家産者若猶以為衙前戸力難以獨任即乞依舊於官戸僧寺道觀單丁女戸有屋業每月掠錢及十五貫莊田中年所収斛斗及百石以上者並令隨貧富分等第出助役錢不及此數者與放免其餘産業並約此為准所有助役錢令逐州樁管據所有多少數目約本州衙前重難分數每分合給幾錢遇衙前合當重難差遣即行支給然尚慮天下役人利害逐處各有不同欲乞於今來勅内更指揮行下開封府界及諸路轉運司謄下諸州縣委逐縣官看詳若依今來指揮别無妨礙可以施行即便依此施行若有妨礙致施行未得即仰限勅到五日内具利害擘畫申本州仰本州類聚諸縣所申擇其可取者限勑書到一月内具利害擘畫申轉運司仰轉運司類聚諸州所申擇其可取者限勅書到一季内具利害擘畫奏聞朝廷候奏到委執政官再加看詳各隨宜修改别作一路一州一縣勅施行務要所在役法曲盡其宜取進止辭免醫官劄子元祐元年正月二十三日上臣以病在朝假伏䝉聖慈連日差中使押醫官沈士安朱有章楊文蔚陳易簡等到臣家各診候留藥臣上荷大恩天隆地厚隕首糜軀無足論報然臣竊聞陳易簡見在病假近皇太后服藥亦祗應不得今以臣故特煩聖㫖督廹令每日一到臣家看候醫治臣忝為人臣實不自安况臣私家亦須更請一醫人每日診候調理其陳易簡已知臣脉氣病狀欲乞特降聖㫖只令臣每日具病狀増减就易簡處取藥更不令易簡每日到臣家診候庶於體分稍得自安取進止辭放正謝劄子元祐元年上臣伏聞降聖㫖在閤門宰臣執政官近遷轉已正謝訖内有司馬光見患在假特放謝仍免赴景靈宫福寧殿恭謝臣聞命震駭無地自處豈有朝廷特遷一官卧家受之並不入謝君降異常之澤臣無一拜之勤自古以來未嘗有此臣雖頑暗必不敢當伏望聖慈早賜収還今來指揮候臣疾患稍痊只依前來指揮减拜入謝及赴景靈宫福寧殿恭謝庶使賤臣粗能自安取進止審内批指揮劄子元祐元年正月上内批依二十八日指揮臣昨日具劄子奏為聖㫖特放正謝仍免赴景靈宫福寧殿恭謝臣以自古以來未有此禮必不敢當當夜准御批依近降指揮臣勘㑹今月十四日内降以臣轉官所有將來正謝特令兩拜起居免舞蹈十七日又准内降所有臣將來合赴景靈宫恭謝逐殿宜止令兩拜二十八日又准入内供奉官劉永年傳宣放臣正謝及景靈宫福寧殿神御前恭謝臣未審御批依近降指揮是依十四日指揮十七日指揮依二十八日指揮須至再有奏禀取進止辭放正謝第二劄子臣昨夜准御批指揮今早再有奏禀䝉復降御批依二十八日指揮臣承命驚惶措躬無地伏念臣忝為人臣陛下賜之一顧賜之巵酒賜之𤓰果臣亦當稽首拜謝况進以高位加之寵名榮動搢紳澤流苗裔豈可即安私室專飬沉疴不造王庭坐受圭組不獨為海内之所共責有司之所直䋲天威違顔不出咫尺隕越斃踣為聖朝羞臣雖至愚粗知自愛何敢受此自納於不測之誅伏望聖慈矜閔候臣所患稍痊安日止依十四日十七日所降指揮减拜入謝及於景靈宫福寧殿神御前恭謝庶使差可自安其二十八日指揮臣以死自守必不敢奉詔取進止辭放正謝第三劄子元祐元年二月上今月五日准尚書省劄子以臣前奏乞候所患稍痊安日依正月十四日十七日所降指揮减拜入謝及於景靈宫福寧殿神御前恭謝今月二日三省同奉聖㫖依正月二十八日指揮臣聞君待臣以惠臣奉君以恭故能上下相親道用交泰陛下念臣衰老抱病筋力尫羸特損朝儀以從私便陛下之大惠也臣若不知禮有靦面目坐受優恩曽無辭避是君有惠而臣不恭上行施而下無報臣雖頑昧心豈敢安伏望聖慈如臣前奏依正月十四日十七日指揮庶使㣲軀有地自處取進止傳家集巻四十九欽定四庫全書傳家集巻五十宋司馬光撰章奏三十三論西夏劄子元祐元年正月上臣伏見神宗皇帝以夏國王趙秉常為臣下所囚興兵致討奮揚天威震動沙漠虜擕其種落竄伏河外諸將収其邊地建米脂義合浮圖葭蘆吳堡安疆等寨此盖止以藉口用為已功皆為其身謀非為國計臣竊聞此數寨者皆孤僻單外難於應援田非肥良不可以耕墾地非險要不足以守禦中國得之徒分屯兵馬坐費芻糧有久戍逺輸之累無拓土闢境之實此衆人所共知也王師既収靈州不克狼狽而歸卒疲食盡失亡頗多西人知中國兵力所至自此始有輕慢之心是以明年邊臣築永樂城虜潛師掩襲覆軍殺將塗炭一城久之又舉一國之衆攻圍蘭州期於必取將士堅守僅而得全虜自是銳氣少挫不敢輕犯邊矣臣聞此數寨之地中國得之雖無所利虜中失之為害頗多何則深入其境近其腹心常慮中國一朝討襲無以支梧不敢安居是以必欲得之不肯棄捨一年前虜嘗專遣使者詣闕深自辨訴請臣服如故其志無他止為欲求其舊境而已朝廷既許其臣服虜來請舊境朝廷乃降指揮其前則云所以興舉甲兵本欲執取罪人救㧞幽辱非有意侵取疆塲土地而已其後乃云止將已得些小邉土聊示削罰豈可更有陳乞還復之理此則朝㫖首尾已自相違又興師本為振㧞秉常拒命者國人之罪豈可更削秉常之地於理差似未安王者以大信御四海羗戎雖㣲恐未易以文辭欺也於是虜既失望憤怒怨懟移文保安軍辭理不遜云今來賀正旦人使難議遣發自是正旦生辰乃至陛下繼明皆不遣使入賀其不臣大矣然而去歳四遣使者詣闕弔慰祭奠吿其母喪并進遺物理雖不備稍示屈服臣竊料虜意不出於三一者猶冀朝廷萬一赦其罪戾返其侵疆二者陽為恭順使中國休怠便隂伺間隙入為邉患三者久自絶於上國其國中貧乏使者往來得賜賚之物且因為商販耳昔衞貳於晉晉取戚田及衞人既服郤缺曰日衞不睦故取其地今已睦矣可以歸之叛而不討何以示威服而不柔何以示懐非威非懐何以示德遂歸戚田于衞今西人所為如此朝廷既不能拒絶勿受其使又不能招納與之更始彼來則迎送館穀以賔客待之不來則一無所問日復一日將踰二年臣竊意朝廷謂西人勢已衰弱心實内附故來則不拒去則不追置之度外不以為虞殊不思數年前王師大舉深入將士所過烈於猛火割其疆埸屢請而不還彼怨毒欲讐報之心窺窬欲乘釁之意日夜不忘若渇者不忘飲盲者不忘視也譬如有虎狼在屋側垂頭熟寢人豈可見其不動狎而侮之循其頭躡其尾邪臣每思之終夕寒心以臣愚慮於今為之止有二策一者返其侵疆二者禁其私市何謂返其侵疆凡天子即位天地一新滌瑕蕩穢小大無遺昔趙佗自稱南越武帝倔强嶺南漢文帝即位赦其大罪遣單使往諭之佗稽首請服累世為臣李繼遷俶擾西陲十有餘年關中困弊真宗皇帝即位赦其大罪割靈夏等數州除其子趙德明為定難軍節度使由是邉境安寧者四十年此乃前世及祖宗之成法非無所依據也今秉常之罪不大於繼遷也米脂等寨不多於靈夏也陛下誠能於此踰年改元之際特下詔書數其累年不來賀正旦生辰及登寳位等不備之禮嘉其弔慰祭奠吿國母喪進遺物之勤曠然推恩盡赦前罪自今以後貢獻賜予悉如舊規廢米脂義合浮圖葭蘆吳堡安疆等寨令延慶二州悉加毁撤除省地外元係夏國舊日之境並以還之其定西城蘭州議者或謂本花麻所居趙元昊以女妻之覊縻役屬非其本土欲且存留以為後圖猶似有名禦夷狄者不壹而足俟其再請或留或與徐議其宜亦無所傷至於㑹州尚在化外而經略司遽稱熈河蘭㑹虜常疑中國更有闢境之心不若改為熈河岷蘭經略司如此則西人忽被德音出於意外雖禽獸木石亦將感動况其人類豈得不鼓舞忭蹈世世臣服者乎議者或曰先帝興師動衆所費億萬僅得數寨今復無故棄之此中國之恥也昔漢元帝棄珠崖詔曰朕日夜惟思議者之言羞威不行則欲誅之通於時變則憂萬民夫萬民之饑餓與逺蠻之不討危孰大焉遂棄之此乃帝王之大度仁人之用心如天地之覆燾父母之慈愛盛德之事何恥之有國家方制萬里今此尋丈之地惜而不與萬一西人積怨憤之氣逞凶悖之心悉舉犬羊之衆投間伺隙長驅深入覆軍殺將兵連禍結如曏日繼遷元昊之叛逆天下騷動當是之時雖有米脂等千寨能有益乎不唯待其攻圍自取固可深恥借使虜有一言不遜而還之傷威毁重固已多矣故不若今日與之之為美也此國大事伏望陛下留神熟慮更與執政詳議以聖意斷而行之不可後時失此機㑹悔將無及何謂禁其私市西夏所居氐羌舊壤地所産者不過羊馬氊毯其國中用之不盡其勢必推其餘與他國貿易其三面皆戎狄鬻之不售惟中國者羊馬氊毯之所輸而茶綵百貨之所自來也故其民如嬰兒而中國乳哺之矣寳元慶厯之間元昊負恩僣亂屢犯邉境大入則大利小入則小利中國未嘗蹈其境破其軍禽其將屠其城有害於社稷也而首尾六年元昊遣使因縁邉吏卑辭納款頓顙稱臣雖其惡積罪盈欲懐音革面原其私心未必不貪中國之財思私市之利故也舊制官給客人公據方聽與西人交易傳聞近歳法禁踈闊官吏弛慢邉民與西人私交易者日夕公行彼西人公則頻遣使者商販中國私則邉鄙小民竊相交易雖不獲歳賜之物公私無乏所以得偃蹇自肆數年之間似恭似慢示不汲汲於事中國由資用饒足與事中國時無以異故也陛下誠能却其使者責以累年正旦生辰及登寳位皆不來賀何獨遣此使者拒而勿内明勅邉吏嚴禁私市俟其年歳之間公私困弊使自謀而來禮必益恭辭必益遜然後朝廷責而赦之許通私市待之如初然邉民與西人交易為日積久習玩為常一旦禁之其事甚難何則若以常法治之則有司泥文動循䋲墨追問證左逮捕傳送之人停匿之家奏裁待報動涉半年如此則徒使邉民麗刑者衆獄犴盈溢而私市終不能禁也夫三尺之限空車不能登峭峻故也百仭之山重載陟其上陵夷故也今必欲嚴禁邉民與西人私市須權時别立重法犯者必死無赦本地分吏卒應廵邏者不覺透漏官員衝替兵士降配仍許人吿捉獲者賞錢若干當日内以官錢支給更不以犯事人家財充如此則縁邉六路各行得一兩人則庶幾可以聳動人耳目令行禁止人不敢犯矣然人存政舉此事全在邉帥得人昔龎籍為河東經畧使下令禁邉民與西人私市有熟戸犯禁籍斬於犯處妻拏皆送淮南編管一境凛然無敢犯者其後施昌言為環慶路經略使亦禁私市西人發兵壓境昌言遣使問其所以來之故西人言無他事只為交易不通使者懼其兵威輒私許之法遂復壊若邉帥未能盡得其人則此法恐未易可行不若前策道大體正萬全無失也取進止乞未禁私市先赦西人劄子元祐元年二月上臣於今月三日上言以西人未服中國不得無憂而邉備不敢少弛不自揆其狂妄獻二策上策欲因天子繼統曠然赦之歸其侵地與之更始下策欲嚴禁私市俟其屈服然後赦之然禁私市甚難立法極嚴又邉帥得人然後能行不若前策之道大體正萬全無失也今竊聞執政用臣下策止令禁私市又立法不嚴邉師未盡得人若邉吏拘文獲一漏百私市滔滔如故或此路禁絶而彼路放行如隄防一存一亡將何所益如此適足以激怒西人使益發悖心安肯屈服萬一㣲犯邉境或表牒中形不遜語至時朝廷轉難處置悔之無及不若用臣上策早相彌縫縱未欲還其侵地且下詔書責而赦之使彼此安心時難得而易失不可忽也况本欲因天子繼統蕩滌其罪今日行之已為太晩若更遷延則赦之無名兹事繫國安危若俟執政論議僉同恐失機㑹誤國大事伏望聖意獨斷行之勿復有疑天下幸甚若有執政立異議乞令其人自入文字若依從其議他日因此致引惹邉事當專執其咎取進止乞先赦西人第二劄子元祐元年二月上臣於今月十二日上言乞以天子繼統曠然更始宜下詔數西人之罪而赦之縱未還其侵地且行此策以安邉境至今聞執政議尚未决臣之愚意以為封内未安未可圖外故欲急行臣前策以羈縻西人且可數年邉鄙無事朝廷得休息戍兵安養百姓待國力完偹家給人足然後奮揚天威討貳柔服何所不可若行臣前策可以萬全行臣後策有得有失豈可棄上策而用下策捨萬全而就有失也本平興國中李繼遷反西陲不解甲者十餘年關中困竭寳元慶厯之間趙元昊叛屢入為冦覆軍殺將自是中國虚耗不復富實今國家理財未得其道民力困窮於下府庫窘乏於上又新遭大喪山陵纔畢自去年十月初以來不雨雪旱勢甚大若萬一激怒西人㣲出一不遜語則并臣前策亦不可行矣今因天子即位未久西人外迹未有不順故臣願朝廷旦夕汲汲行之機㑹難得時不可失此臣所以惓惓進言不已者也若萬一激怒西人致生邉患兵連禍結士卒殄盡於鋒鏑生民困竭於轉餉餓殍蔽地盗賊鋒起為國家慮豈不危哉而執政方以為西人㣲弱不敢復動數遣使來誠心内附置之度外不以為虞今復固執先禁私市之議又立法不嚴邉帥不才者不先易去行之太早不能中節一旦禍生所忽邉鄙震驚乃始歸罪戎狄豈不害國事乎臣於今月三日所上言措置西邉事雖畫二策固以還其侵地責而赦之為上策嚴禁私市待其數年貧困來服然後赦之為下策所謂絶私市非立法至嚴帥臣智勇此法恐未易可行不若前策道大體正萬全無失非臣前後返覆静言庸違也朝廷比來擢臣於冗散之中使預聞國論盖亦誤謂臣㣲有益於國家非徒采其虚名也臣之不敢終辭亦欲竭盡疲駑少酬大恩非苟貪於禄位也今盡忠謀國而為衆所挫臣尚留此有何所用此國大事伏望陛下早審察二議從其長者若聖意以臣言為然乞御批依臣前策若降付三省樞宻院執政仍有固守已見争之最力者乞如臣前奏令自入文字言先禁私市保得他日必不致引惹邉事如其不然身執其咎取進止乞不改更罷役錢敕劄子元祐元年上臣近以抱病家居恐溘先朝露無以少報盛徳是以力疾貪陳所見竊以即日為小民病者無若免役錢欲乞悉行廢罷復祖宗差役舊法識慮愚短誠不意朝廷盡從其說非陛下明斷不能如是此乃天下之幸非獨微臣之幸也然臣聞令出惟行弗惟反彼免役錢雖於下戸困苦而上戸優便行之已近二十年人情習熟一旦變更不能不懐異同又復行差役之初州縣不能不小有煩擾又提舉官專以多斂役錢為功惟恐役錢之罷若見朝廷於今日所下勅微有變動必須相吿曰朝廷之勅果尚未定宜且觀望必競言役錢不可罷朝廷萬一聽之則良法復壊矣伏望朝廷執之堅如金石雖有小小利害未偹俟諸路轉運司奏到徐為改更亦未為晩當此之際則願朝廷勿以人言輕壊利民良法取進止乞罷提舉官劄子元祐元年上臣聞書稱明王立政不惟其官惟其人臣少時見天聖中諸路止各有轉運使一員亦無提㸃刑獄惟河北陜西以地重事多置轉運使兩員然朝廷必擇朝士累任知州有聲迹曉錢穀者乃得為之未嘗輕以授人凡一路之事無所不總使按察官吏薦賢發姦愛飬百姓興利除害或朝廷有本路事務未能細知利害者則委之相度措置當是之時官少民安事無不舉公私饒樂海内晏清景祐初始復置提㸃刑獄其後或時置轉運判官以其冗長害事尋復廢罷自王安石執政以來欲力成新法諸路始置提舉常平廣惠農田水利官其後每事各置提舉官皆得按察官吏事權一如監司又増轉運副使判官等員數皆選年少資淺輕俊之士為之或通判知縣監當資序及選人以權發遣處之有未嘗歴親民即為監司者能順已意則不次遷擢小有乖違則送審官院與合入差遣更加責降彼年少則歴事未多資淺則衆所不服輕俊則舉措率易歴事未多故措置百事往往乖方衆所不服故依勢立威以行號令舉措率易故慮事不熟壊法害民又利禄誘於前罪戾俟於後由是往往上不顧國家事體下不恤百姓怨咨止務希合以圖進取致今日天下籍籍如此皆由此來也陛下幸念民惟邦本本固邦寧知元元困窮於國家非便欲救而安之詔青苗錢不得抑配免役錢寛剰不得過二分竊聞諸路提舉官州縣猶有於春首抑配青苗錢勒百姓供情願狀别作名目占免役寛剰錢但取文具而已如此則朝廷號令廢格不行於臣下恩澤壅塞不被於黎民徒存空文何以為政臣聞去草者絶其本救水者回其原提舉官者乃病民之本原也陛下必欲蘇息疲瘵乞盡罷諸路提舉官其轉運使除河北陜西河東外餘路只置使一員判官一員提㸃刑獄分兩路者合為一路共差文臣兩員凡本路錢穀財用事悉委轉運司刑獄常平兵甲賊盗事悉委提㸃刑獄管勾仍選知州已上資序累歴親民差遣所至有政迹聦明公正之人方得為監司聰明則知官吏賢不肖公正則黜陟無私部下官吏既皆得人事務安有不幹集百姓安有不富庶此乃國家鎮撫四方之本也若以提舉官累年積蓄錢榖財物不少恐轉運司一旦得之妄有耗散即乞盡椿作常平倉錢物委提㸃刑獄一面交割主管依常平倉法謹伺穀價賤糴貴糶及准備災傷賑貸其餘不得支用若轉運司委的窘乏須至兌那常平錢物者必須具數先奏朝廷得㫖乃得移牒支撥若以監司數少路分闊逺處廵歴及管勾不辨即乞只依舊法每歳徧廵諸州更不徧廵諸縣自非要切大事朝廷不令監司親往勾當只令選差本部官除司理司法縣尉獨員監當之類舊條不許差出外其舊條不得隔州差選人勾當差及被差之人皆有罪新條諸州管勾官及主簿當給散月分不得差出之類指揮乞更不施行所貴監司有官可差幹得事務若遇有賊盗乞朝廷只委提㸃刑獄差官或行移文字監督捕盗官捉殺察其不稱職及有可以代之者先令權攝仍奏乞替換許一面相度賊盗强弱立賞錢數目其捕盗官若立功許隨功大小保明乞轉官及升差遣或减年磨勘朝廷更不下刑部磨勘詰難住滯臨時詳酌恩澤直賜指揮賊盗自然無不敗獲不須令親出入監逐捉殺於事無益如此則監司廵歴管勾職事簡要易為辦集取進止傳家集巻五十欽定四庫全書傳家集巻五十一宋司馬光撰章奏三十四論錢榖宜歸一劄子元祐元年上臣竊以洪範八政食貨為先故古者國用必使冡宰制之祖宗之制天下錢榖自常平倉𨽻司農寺外其餘皆總於三司一文一句以上悉申帳籍非條例有定數者不敢擅支故能知其大數量入為出詳度利害變通法度分畫移用取被有餘濟此不足指揮百司轉運使諸州如臂使指朝廷常慎選健吏精於理財者為三司官如陳恕林特李參之類皆稱職有名者也其餘非通曉錢榖者亦罕得叨居其任故能倉庫充溢用度有餘民不疲乏邦家乂安自改官制以來備置尚書省六曹二十四司及九寺三監各有職事將舊日三司所掌事務散在六曹及諸寺監應支用錢物五曹得以自專有司得符即時應副而户部不能制申發帳籍又不盡歸户部户部既不得總天下財賦無由盡知錢糓出内見在之數既不盡知何由量入為出又五曹及内外百官各具理財之法申奏施行户部不得一一關預無由盡公共一利害今之户部尚書舊三司使之任也而左曹𨽻尚書右曹不𨽻尚書天下之財分而為二視彼有餘視此不足不得移用天下皆國家之財而分張如此無專主之者誰為國家公共愛惜通融措置者乎譬人家有財必使一人專主管支用若使數人主之各務已分所有者多互相侵奪又人人得取而用之財有増益者乎故利權不一雖使天下財如江海亦恐有時而竭况民力及山澤所出有限劑乎此臣所以日夜為國家深憂者也今縱未能大有更張欲乞且令尚書兼領左右曹侍郎則分職而治其右曹所掌錢物尚書非奏請得㫖不得擅支諸州錢糓金帛𨽻提舉常平倉司者每月亦須具帳申户部六曹及寺監欲支用錢物皆須先闗户部符下支撥不得一面奏乞直支應掌錢物諸司不見户部符不得應副其舊日三司所管錢榖財用事有㪚在五曹及諸寺監者並乞收歸户部若謂户部事多官少難以辦集即乞减户部冗末事務付閒曹比司兼領而通𨽻户部如此則利權歸一若更選用得人則天下之財庶㡬可理矣取進止乞申勅州縣依前勅差役劄子元祐元年上臣伏見御批指揮以臣近建明差役法慮其間未得盡備差韓維吕大防孫永范純仁專切詳定聞奏臣竊以免役錢之病民自曏日臣僚民庶上封事及日近劉摯等奏陳言之甚詳非獨出臣一人之私意也陛下幸用臣言悉罷免役錢依舊差役詔下之日中外歡呼徃來之人聞道路農民迭相慶賀云今後這囬快活也然則此令之下深合人心明白灼然無可疑者其間條目未備不能委曲盡善固須有之臣所以乞下諸路州縣官吏令㸔詳若有妨礙施行未得即具利害擘畫以次上聞誠以畎畒幽隠南北異宜自非在彼親民小官無以知其詳悉故令各具所見指陳利害所以盡下情求民瘼非謂勅書一下禁人不得復議也俟其奏到徐議添改何後之有要在早罷役錢復差役為大利而已如搆造大厦棟宇已立雖户牖未備可以徐圖今陛下令韓維等再行詳定考究利害宇補漏略成就良法固無所妨但勅下已踰半月州縣差役約以及半方行遣紛紜臣愚竊恐聞此指揮謂朝廷前日之勅改更未定或斂錢或差役尚未可知官吏惶惑不知所從衆庶失望怨嗟益甚必有本因新法得進之臣乘此間隙爭言免役錢不可罷因聚斂獲功之吏稱舊條未改督責免役錢愈急是民出湯火濯清泉復入湯火也伏望朝廷特賜申勅州縣言今來止為其間條目未備令維等詳定所有差役仰州縣依前勅一面施行候詳定到事節續降下次免致於差役中半紛紜之際令出反汗人情大揺實天下幸甚取進止隨乞宫觀表辭位劄子元祐元年上臣以病羸拜起及上下馬不得請朝假將治已及月餘旬日以來疾大勢雖退飲食亦稍進然氣體疲乏足腫生瘡歩履甚難策杖而行不出堂室况於拜起固所未易臣自料度筋力完復可以朝趨近亦數月逺則半年或過此期未可前定豈有執政之臣身據髙位坐受厚俸既不趨朝又不供職宴安偃仰養病於家何待人言獨不内愧臣是用夙宵惶愧無地自處今不免有表上瀆聖聰乞除宫觀差遣一任以養衰殘竊慮陛下怪其忽有此奏故别具劄子披瀝肝膽伏望聖慈早賜開允取進止辭位第二劄子元祐元年上臣伏䝉聖慈以臣乞宫觀差遣特命入内内侍省東頭供奉官陳衍賜臣批答不允仍斷來章者伏念臣自結髪從學講先王之道聞君子之風竊不自揆常妄有尊主庇民之志不意天幸䝉陛下誤采虚名擢於閭閻之間寘之廟堂之上禮遇過優委任至重臣非木石豈不知荷戴天恩銘心鏤骨願竭駑蹇少報萬分眷戀天庭豈肯輕去不謂一旦嬰此沉痾累月不愈害於飲食不能造朝今雖疾勢漸平飲食亦進而肌骨羸瘠氣力疲乏腫足骭痬餘毒方熾旬月之間必未能趨伏闕廷瞻望天光端居私家尸位竊禄縱陛下寛仁微臣不知廉耻中外有識之士及天下衆庻其謂臣何伏望聖慈矜察依臣前奏除宫觀差遣一任使得自安其分取進止為病未任入謝劄子元祐元年閠二月二日上臣今月二日准閤門承受范禹臣告報已降白麻除臣守尚書左僕射兼門下侍郎令當日入謝者臣先為乆病在假不能朝叅乞一宫觀差遣未奉俞㫖今忽聞制命超升左輔俾之師長百僚豈臣空踈所能堪可臣方别具悃欵辭免未敢祗受况臣即今以乆病少力足瘡未愈歩履甚艱拜起不得未任朝見乞候臣筋力稍完入覲宸扆面陳至誠取進止辭左僕射第一劄子元祐元年閠二月上臣今月二日伏聞已降白麻除臣左僕射兼門下侍郎者臣資性愚鈍學術膚淺誤䝉甄采預聞政事常懼不稱䧟于罪戾加以近嬰疾疹乆不朝參方乞宫觀以便頥養豈意天恩出於意表即長中䑓直升元宰躐等踰分近世罕倫愧赧驚懼汗流霑踵况今中外舊臣或輔佐累朝或踐揚兩府髙才碩德顯著甚多若以代臣皆出臣右又即今執政臣位在四若以次而舉亦未至臣伏望聖明歴選其人俾居斯任如臣無狀何敢克當所有新命臣不敢祗受取進止辭左僕射第二劄子元祐元年閠二月上臣今月六日伏䝉聖慈差東上閤門副使王舜封賜臣左僕射兼門下侍郎告身者臣近聞恩命自知非分不敢膺克已累有文字辭免恭俟俞旨今䝉降到告身臣未敢祗受欲乞且留在閤門取進止辭左僕射第三劄子元祐元年閏二月上臣於今月二十三日相繼有劄子辭免新除尚書左僕射恩命未奉俞旨六日又䝉聖恩差東上閤門副使王舜封就臣本家賜臣告身臣亦未敢祗受乞且留在閤門今早勾當御藥院馮宗道傳宣并降到御批早令祗受臣上戴天恩下顧無狀進退惟谷無地自處臣聞髙宗命傅說為相戒之曰若作酒醴爾惟麴糵若作和羮爾惟鹽梅夫釀酒者多麴則太苦多糵則太甘調羮者多鹽則太鹹多梅則太酸和調適冝㝡為難事故以諭良相酌寛猛之政處大小之事必平和允愜曲盡其冝然後為善臣才性長短敢不自知賦分於天樸鈍戇直至於守事君之忠懐愛民之志不為欺罔不渉佞邪如此數條臣敢自保然燭理不明見事不敏度量􅄶隘關防淺露若位以元宰委之機務分畫措置必有差違至時雖自納於刑亦無所益臣非敢愛身實恐誤國况臣之少壯猶不如人今年齒衰老目視近昏事多健忘目前所為轉首不記舉措語言動多差失自近病來耳頗重聽此皆事實衆所共見非臣以虚辭文餙如此豈可首居相位毗賛萬㡬方今老成碩德已試有效及抱道藏噐藴積未施中外之臣不為無人伏望聖慈博訪選以代臣必能稱職所有告身臣未敢祗受縁臣即日歩趨拜起皆所未能朝覲之期無由預定告身留臣本家於理非是伏乞依臣前奏早賜宣取且留在閤門候臣所患痊平堪歩趨拜起入覲天顔靣陳至誠至時若不允許祗受未晩取進止乞黄庭堅同校資治通鑑劄子元祐元年上臣先奉勅編修資治通鑑共成二百餘巻於去年九月内奉聖旨令祕書省正字范祖禹及臣男康用副本重行校定聞奏近又奉聖旨令據巳校到定本逐旋送國子監鏤板竊縁上件文字巻秩稍多其范祖禹近差充修神宗皇帝實録檢討官在彼自有職事慮恐日近校定不辦有妨鏤板臣竊見秘書省校書郎黄庭堅好學有文即日在本省别無職事欲望聖慈特差令與范祖禹及臣男康同校定上件資治通鑑所貴早得了當取進止傳家集巻五十一欽定四庫全書傳家集巻五十二宋司馬光撰章奏三十五乞令校定資治通鑑所冩稽古録劄子元祐元年上臣聞史者今之所以知古後之所以知先是故人主不可以不觀史善者可以為法不善者可以為戒自生民以來帝王之盛者無如堯舜書稱其德皆曰稽古然則治天下者安可以不師古哉伏見皇帝陛下初開經筵先講論語讀祖宗寳訓論語記孔子之言行寳訓述祖宗之聖謀誠為從學之要然國家未有天下以前帝王之事臣愚以為亦不可不知也顧以年祀悠逺載籍浩愽非一日二日所能徧閱而周知所冝提其綱目撮其精英然後可以見治亂存亡之大略也臣先於英宗皇帝時嘗采獵經史上自周威烈王二十三年下盡周世宗顯德六年略舉每年大事編次為圖年為一行六十行為一重五重為一巻凡一千三百六十二年共成五巻謂之歴年圖上之以省煩文便觀覽臣又於神宗皇帝時受詔修國朝百官公卿表臣依司馬遷法自建隆元年至治平四年各記大事於上方書成上之有詔附於國史臣今更討論經史上自伏羲下至周威烈王二十二年略序大要以補二書之闕合為二十巻名曰稽古録欲繕冩奏御而私家少得筆吏恐日近不能了畢竊見先有聖旨令秘書省正字范祖禹等就本省校定臣所編修資治通鑑見有筆吏及紙札等物伏望聖慈特降指揮許臣并上件稽古録送祖禹等令就本局繕冩校對訖先次上進候將來讀祖宗寳訓了日若别未有書可讀欲乞且取臣此書進讀仍令侍讀官隨文觧釋則前王軌轍皆可槩見庶㡬足以資稽古之萬一輔聖性之聰明取進止論賑濟劄子元祐元年上臣竊惟鄉村人户播殖百榖種蓺桑麻乃天下衣食之原比於餘民尤宜存恤凡人情戀土各願安居苟非無以自存豈願流移他境國家若於未流移之前早行賑濟使糧食相接不至失業則比屋安堵官中所費少而民間實受賜若於既流移之後方散米煑粥以有限之儲蓄待無窮之流民徒更聚而餓死官中所費多而民實無所濟伏覩近降朝旨令户部指揮府界諸路提㸃刑獄司體量州縣人户如委是闕食據見在義倉及常平米榖速行賑濟仍丁寧指揮州縣多方存恤無致流移失所此誠得安民之要道然所以能使民不流移者全在本縣令佐得人欲乞更令提㸃刑獄司指揮逐縣令佐專切體量鄉村人户有闕食者一靣申知上司及本州更不候回報即將本縣義倉及常平倉米榖直行賑貸仍據鄉村五等人户逐户計口出給歴頭大人日給二升小兒日給一升令各從民便或五日或十日或半月一次齎歴頭詣縣請領縣司亦置簿照㑹若本縣米榖數少則先從下户出給歴頭有餘則並及上户其不願請領者亦聽候將來夏秋成熟糧食相接日即據簿歴上所貸過糧令隨稅送納一斗只納一斗更無利息其令佐若别有良法簡易便民勝於此法者亦聽從便要在民不乏食不至流移而已仍令提㸃刑獄司常切體量逐縣令佐有能用心存恤闕食人户雖係災傷並不流移者保明聞奏優與酬奬其全不用心賑貸致户口多流移者取勘聞奏乞行停替庻使官吏有所勸沮百姓實霑聖澤取進止乞撫納西人劄子元祐元年三月上臣先於二月中曾上言乞因新天子繼統下詔悉赦西人之罪與之更始雖未還其侵疆且嵗給賜待之如故此道大體正萬全無失既而執政所見各有異同沮難遷延遂屏弃不行臣竊聞今來西人已有關報定使副詣闕賀登寳位國家若於此際又不下詔開而納之萬一西人蓄怨積憤肆其悖心或有一騎犯邉或於表牒中有一語不遜當是之時雖欲招納乃是畏其陸梁傷威毁重何耻如之臣之前䇿亦不可行矣伏望陛下令三省樞密院將臣三月三日十二日十六日并今來所上文字一處進呈臣愚欲為國家消患於未萌誠惜此機㑹夙夜遑遑廢寢忘食陛下若俟詢謀僉同然後施行則執政人人各有所見臣言必又屏弃凡邊境安則中國安此乃國家安危之機伏望陛下察臣所言甚易行而無後害可使華夷兩安為利甚大斷自聖旨勿復有疑取進止撫納西人詔意元祐元年三月上朕聞王者奄有四極至仁無私靡間華夷視之如一夏國主秉常世守西土藩衛中邦自其祖彛興以來沐浴皇化職貢時至率多忠勤仁宗皇帝加之寵名胙以大國錫予之數嵗則有常曏因邊臣奏陳云彼君臣失職及移文詰問曽無報應神宗皇帝乃出師命將拯彼阽危在於夏國主秉常實有大造而所部之人􅃍敢自絶侵軼我邊鄙䖍劉我吏民正旦同天皆不入賀國家包以大度置而不問但絶嵗賜以俟悛心不幸先帝違弃萬國朕嗣守令緒祗承前志夙夜寅畏迨今朞年宣廣恩澤無幽不振而夏國主秉常屢遣使者造于闕庭弔祭訃告寖修常軄朕惟江海之大來則受之豈復追念徃昔校計細故冝捨其前日之不恭取其今茲之效順曠然湔滌與之更始自今申敕將吏嚴戢兵民毋得輙規小利擾彼疆場凡嵗時頒賚命有司率由舊章必使桴皷不鳴􅇏燧無警彼此之民早眠晏起同底太寜不亦休哉可布告中外咸使聞知辭接續支俸劄子元祐元年三月上臣以假滿百日自四月以後不敢勘請俸給聞近有聖㫖特再給臣寛假將治其俸給等接續支給臣自正月二十一日以病在朝假乆而不愈亦曽陳乞宫觀以養衰殘聖恩不許更除左僕射臣惶恐失圖不敢復言自爾日望痊平入覲丹扆面陳至誠庻得極竭疲駑且供舊職以補報萬分而臓府雖寧瘡瘍未愈肌體羸瘠足力全無步履甚難拜起不得以此無由朝叅計在假不管本職公事巳及一百一十餘日入覲之期未能自定竊以百日停俸著在舊章况臣當表率百僚豈敢廢格不行臣聞孔子曰先事後得詩云不素餐兮今雖聖澤優厚曲加矜恤而使臣違先事之義重素餐之罪四海指目何以自安伏望聖慈許臣依條百日外住支請受候叅假日依舊庶使臣得安心養疾保全㣲軀取進止乞罷將官劄子元祐元年三月上臣於去年四月二十七日曽上言州縣者百姓之根本長吏者州縣之根本根本危則枝葉何以得安故自古以來置州郡必嚴其武偹設長吏必盛其侍衛所以安百姓衛朝廷也秦㓕六國以為兵不復用雖置郡守而以御史監之墮名城銷鋒鏑故陳勝呉廣起而郡縣不能制國隨以亡晉武帝平呉悉罷州郡兵陶璜山濤皆言州郡武偹不可廢及永寧以後盗賊羣起州郡無備天下遂大亂國朝置總管鈴轄都監監押為將帥之官凡州縣兵馬其長吏未嘗不同管轄葢知州則一州之將知縣則一縣之將也熈寧中謀臣建議分天下禁軍每數千為一將别置將官以領之訓練差使抽那一出其手其逐州總管以下及知州知縣皆不得關預量留羸弱下軍及剰員以充本州白直及諸般差使而已凡設官分職當上下相維如身之使臂臂之使指紀綱乃立今為州縣長及總管等官而於所部士卒有不相統攝殆如路人者至於倉庫守宿街市廵邏亦皆乏人雖於條有許差將下兵士者而州縣不得直差須牒將官將官徃徃占䕶不肯差撥萬一有非常之變州縣長吏何以號令其衆制禦姧宄哉臣目覩前宰相西京留守韓綘謁嵩山起建道埸其將下禁軍充白直者於條不得出城經宿所敢留者剰員七八人而已况僻小州縣其守禦之備侍衛之衆可知矣臣當時乞悉罷將官其逐州縣禁軍並委長吏與總管等官同共提舉教閱及諸處差使其州縣長吏所給白直皆如嘉祐編勅以前之數臣自上此文字後來不聞朝廷有所施行竊見近嵗諸處多闕雨澤盗賊頗多州縣全無武備長吏侍衛單寡禁軍盡屬將官將官多與長吏爭衡長吏勢力逺出其下萬一有如李順王倫攻城䧟邑之冦或如王均王則竊發肘腋之變豈不為朝廷旰食之憂邪王者制治於未亂保邦於未危豈可自恃太平之乆謂必無此等事邪又自祖宗以來諸軍少曽在營常分畨徃縁邊及諸路屯駐駐泊盖欲使之均勞逸知艱難識戰闘習山川自置將官以來苟非有所征討全將起發與將官偕行外其餘常在本營不復分畨屯駐駐泊飽食安坐養成驕惰之性歲月滋乆恐不可復用又每將下各有部隊將准備差遣指使之類一二十人而諸州總管鈐轄都監監押員數亦如舊設官重􅃨虚費廪禄凢將官之設有害無利天下曉軍政者莫不知之臣愚伏望朝廷如臣前奏盡罷諸路將官其禁軍各委本州縣長吏與總管鈐轄都監監押等管轄一如未置將官已前之法其諸州軍兵馬全少不足守禦之處量與立額招添其守禦有備而冦賊之發不能式遏或弃城逃避或率吏民迎賊或斂民財賂賊雖責之以死彼亦甘心今平居騶從且不能備一旦冦至責以死節不亦難哉取進止傳家集巻五十二欽定四庫全書傳家集巻五十三宋司馬光撰章奏三十六舉張舜民等充館閣劄子元祐元年上臣今月二十四日准尚書省劄子准二十二日詔書節文執政大臣冝各舉文學政事行誼之臣可以充館閣之選者三人臣竊見奉議郎張舜民材氣秀異讀書能文剛直敢言竭忠憂國通直郎孫凖學問優博文辭宏贍行義無缺乆淹下僚河南府左軍廵判官劉安世才而自晦愿而有立力學修已恬於進取其人並堪充館閣之選如後不如所舉臣甘當同罪取進止五月三日尚書省劄子光所患已安惟足瘡有妨拜跪不候叅假時放謝仍權免赴前後殿起居許乗轎子三日一至都堂聚議或門下省治事辭三日一至都堂劄子元祐元年上臣伏覩中書省録黄今月二日奉聖㫖以臣所患已安惟足瘡有妨拜跪不候參假特放正謝仍權免赴前後殿起居許乗轎子三日一至都堂聚議或門下尚書省治事者臣聞命震恐無地自處竊念臣臓腑雖安飲食如故但兩足無力瘡口未合歩履艱難拜起不得以此未果朝參至於數日一至政事堂乃唐世以來宿德元老髙年有疾朝廷尊禮特降此命豈伊微臣所敢倫擬况臣自正月二十一日請朝假至今百三十餘日豈有未見君父輒赴省供職况臣於病中除左僕射雖累具劄子辭免未􅂪開允仍􅂪就家賜以告身亦未敢祗受方俟入覲天顔面陳至懇豈可遽治尚書省事伏望聖慈俟臣歩履有力拜起得成參假了日與諸執政一例供職貴於微軀差得自安所有今月二日指揮乞賜寢罷取進止内降付中書省許肩輿至内東門扶掖入對小殿辭入對小殿劄子元祐元年上臣今月二日聞有聖㫖令臣不候參假特放正謝仍權免赴前後殿起居許乗轎子三日一至都堂聚議或門下尚書省治事臣以恩禮太優不敢輒當尋具劄子辭免今月四日又覩中書省録黄奉聖㫖依前降指揮不許辭免仍令閤門告示許肩輿至内東門外令男扶掖至小殿引對特免起居令引見前一日聞奏如此則禮數愈重尤不敢當臣竊惟富弼三世輔臣德髙望重神宗皇帝想見其人故特制此禮乃自古所無顧臣何人敢與為比况親屈乗輿特御小殿以臣勤君其罪至大縱陛下優借而天威咫尺恐隕越隨之似此異數臣决不敢受只候垂簾日於延和殿引見并乞上殿然事有不得已者雖知僭越不得不承順聖恩臣即目上下馬未得及足上有瘡深惡馬汗欲乞如今聖㫖許權乗轎子出入及入内至常時下馬處下轎子又臣兩足無力若無人扶掖委實全拜起不得欲乞今來入見及將來每遇入對並權許令臣男康入殿遇拜時扶掖候痊安日皆復舊規如此則曲成之仁已踰於天地非臣隕身䘮元所能報塞所有其餘恩禮並乞寢罷取進止三省同奉聖㫖令乗轎子至崇政殿門外於延和殿垂簾日引對餘並依前降指揮辭男康章服劄子元祐元年上臣乆在病假今月十二日於延和殿入見并辭免新命以兩足無力拜起不得聖恩特許令臣男康入殿扶掖臣既不得請臣男復賜章服父子忝竊誠不自安所有臣男恩命乞賜寢罷取進止乞與諸位徃來商量公事劄子元祐元年上臣近奉聖㫖許臣乗轎子三日一次至都堂聚議伏縁三省樞密院各有職事難以臣故必令三日一聚議檢㑹去嵗曽有指揮遇假日有公事許於東西府聚議其東西府近北舊有便門臣欲乞於近南更開一便門臣今縁足疾未愈乞遇假日或日晩執政出省後有司合商量公事許乗小竹轎子徃諸位商量其執政有欲商量公事者亦許來臣本位更不一一奏聞所貴論議詳盡事無留滯取進止乞進呈文字劄子元祐元年上臣先奉聖㫖權免赴前後殿起居許乘轎子三日一至都堂聚議又許肩輿至内東門外令男康扶掖至小殿引對臣以恩禮大重不敢輒當只乞於延和殿引見以兩足無力若無人扶掖委實全拜起不得乞今來入見及將來每遇入對並許令臣男康入殿遇拜時扶掖奉聖㫖令乗轎子至崇政殿門外於延和殿垂簾日引對餘並依前降指揮臣今月十八日合至都堂遇其日垂簾臣欲隨執政赴延和殿常起居及上殿進呈文字竊慮閣門以前來聖㫖有免赴起居字及只云三日一至都堂後來聖㫖無將來每遇入對並許令臣男康入殿遇拜時扶掖字不聴臣及男康入殿伏望聖慈傳宣閣門十八日許臣隨執政赴延和殿常起居及上殿進呈文字令臣男康入殿遇拜時扶掖仍自今後每遇入對並乞准此取進止中使徐湜封還傳宣聖㫖且令入都堂尚書省門下省治事所有入殿起居且頥養筋力直候秋涼引對所有元上劄子今却令封還并賜食二合乞進呈文字第二劄子元祐元年上臣今月十六日曽具劄子奏乞於十八日隨執政赴延和殿常起居及上殿進呈文字尋􅂪聖恩差入内東頭供奉官徐湜封還仍傳宣且令入門下尚書省治事所有入殿起居且頥養筋力直候秋涼引對此乃聖恩憐臣疲羸恐不堪勞苦欲且就安逸雖父母之愛其子恐不能如此之備臣隕身喪元無以為報然臣既參假治事若不以時入對面盡愚忠少禆萬一則與未參假時無異所以區區陳請不能自巳臣今欲再乞於二十六日隨執政赴延和殿常起居及上殿進呈文字臣至時自度若筋力委實不能支梧即乞如今來聖㫖且只入門下尚書省治事候筋力稍完再有陳請若且可以支梧即乞每遇垂簾日許隨執政赴延和殿常起居及進呈文字仍乞傳宣閣門自今後每遇臣入對許令臣男康入殿遇拜時扶掖取進止乞進呈文字第三劄子臣自前月十二日參假以來兩曽具劄子奏乞隨執政官於延和殿進呈文字皆􅂪聖恩遣中使封囬令候秋凉陛下矜愛微臣誠至深至厚然陛下不知臣不肖使待罪宰相宰相之職在輔佐天子謨明萬幾朝夕在前啟沃獻替臣自閠二月二日降麻除左僕射屬在病假至今未嘗得一日與諸執政至簾前參陪國論雖許投進文字然中心委細無由一一面陳陛下徒閔其衰病欲使便安於一身不若使之竭盡愚忠庶幾有補於天下臣為私計豈不願宴安在家若顧公義豈得内無愧懼竊恐上則失陛下所以擢用臣之意下則失㣲臣忘身徇國之心况已先奉聖㫖權免前後殿起居朝㑹之勞什减七八臣自體當近日以來病勢亦似更减歩履比曏時稍輕但兩足少力若無人扶掖則全拜不得今不免冒犯無厭之罪伏望聖慈特降指揮令臣每遇殿上問聖體及謝恩等合拜之時特令免拜若在殿下常起居許令臣男康扶掖仍乞傳宣閣門每遇臣入朝許令臣男康隨入殿門如此則於臣羸病之軀優假巳極於公家之務亦無所廢臣今欲乞如臣前奏於今月八日隨執政赴延和殿常起居及上殿進呈文字取進止此劄子若降付三省再候進呈則八日以前皆值假故不坐八日入朝不及如允臣所奏乞直批降指揮依奏乞進呈文字第四劄子臣近曽三次具劄子奏乞與諸執政赴延和殿進呈文字皆䝉聖慈遣中使封還云候秋凉雖天恩矜憫隆厚無窮然臣既待罪宰相豈可不於簾前參陪國論况今已立秋兼臣自體當得筋力差勝於前可以枝梧只是無人扶掖全拜起不得欲乞如臣前奏候垂簾日許令與諸執政赴延和殿常起居同進呈文字并乞特降指揮自今後每遇臣入對許令臣男康隨入殿門取進止聖意若不欲批指揮即乞降赴三省乞赴延和殿起居劄子尋封囬臣昨乞自今後遇延和殿垂簾日赴起居奏事䝉聖恩依所乞為足瘡所有起居等冝特與權免拜及令男康扶掖入殿者臣若得男康扶掖實可以拜起臣既乆不面天顔豈有全不拜之理欲乞每遇延和殿垂簾日與吕公著同班常起居取進止乞官劉恕一子劄子元祐元年上臣伏覩祕書少監劉攽等奏故祕書丞劉恕同編修資治通鑑功力最多比及書成編修屬官皆䝉甄録惟恕身亡其家獨未霑恩門户單露子孫並無人食禄乞依黄鑑梅堯臣例官其一子臣徃嵗初受勅編修資治通鑑首先奏舉恕同修恕愽聞强記尤精史學舉世少及臣修上件書其討論編次多出於恕至於十國五代之際羣雄競逐九土分裂傳記訛謬簡編缺落嵗月交互事迹差舛非恕精慱他人莫能整治所以攽等衆共推先以為功力最多不幸早夭不見書成未死之前未嘗一日捨書不修今書成奏御臣等皆䝉天恩襃賞甚厚獨恕一人不得霑預降為編户良可矜憫欲乞如攽等所奏用黄鑑梅堯臣例除一子官使其平生苦心竭力不為虚設取進止乞不拒絶西人請地劄子元祐元年上臣近具劄子奏乞於今月八日隨執政延和殿進呈文字復䝉聖慈遣中使封還令依前降指揮臣不敢再三固違聖㫖然臣區區之心所以欲於八日入對者竊見夏國宥州有牒稱已差人詣闕計㑹所侵疆土城寨竊慮其日進呈上件文字此乃邊鄙安危之機生民休戚之本不可不察臣自今年二月初以來累曽上言乞因新天子即位西人恭順之際早下詔書赦其罪戾待遇如故如此則控縱在我天子之體正休兵息民夷夏之心安不幸虜人有一語不遜一騎犯邊則此詔不可復下無何臣在病假不得靣論人心不同為衆所奪日復一日遷延至今虜先遣使來直求侵地指陳兵端辭意寖慢前所議詔書已不可下矣既失此機㑹即日使至應答亦難若悉從其所請則彼益驕而無厭若悉拒而不從則邊患由此而起今就二者之中寧為百姓屈已少從所請以紓邊患不可激令憤怒致興兵犯塞以困生民所以然者靈夏之役本由我起新開數寨皆是彼田今既許其内附豈可猶靳所侵地而不與彼必曰我自天子新即位卑辭厚禮以事中國庻㡬歸我侵疆今猶不許則是恭順無益不若以武力取之彼小則上書悖慢大則攻䧟新城當是之時不得已而與之其為國家之耻無乃甚於今日乎以小喻大譬如甲奪乙田未請而與之勝於請而後與若更請而不與則彼必興鬭訟矣此是非利害明如白黒臣竊慮進呈之際羣臣猶有見小忘大守近遺逺惜此不毛無用之地結成覆軍殺將之禍兵連不觧為國家憂伏望陛下决自聖志勿聽浮言為兆民計文彦愽輔佐四朝熟知虜情此可謂軍國重事願陛下詢彦愽以决之取進止傳家集巻五十三欽定四庫全書傳家集巻五十四宋司馬光撰章奏三十七乞以十科舉士劄子元祐元年上尋依此行臣竊惟為政之要莫如得人百官稱職則萬務咸治然人之才性各有所能或優於德而嗇於才或長於此而短於彼雖皐䕫稷契止能各守一官况於中人安可求備是故孔門以四科論士漢室以數路得人若指瑕掩善則朝無可用之人苟隨噐授任則世無可弃之士臣誤䝉甄擢備位宰相慎選百官乃其職業而智識淺短見聞褊狹知人之難聖賢所重寰宇至廣俊彦如林或以恬退滯淹或以孤寒遺逸被褐懐玉豈能周知若専引知識則嫌於狹私難服衆心若止循資序則官非其人何以致治莫若使在位逹官人舉所知然後克恊至公野無遺賢矣臣不勝狂愚欲乞朝廷設十科舉士一曰行義純固可為師表科有官無官人皆可舉二曰節操方正可備獻納科舉有官人三曰智勇過人可備將帥科舉文武有官人此科亦許鈐轄以上武臣舉四曰公正聰明可備監司科舉知州以上資序五曰經術精通可備講讀科有官無人人皆可舉六曰學問該慱可備顧問科有官無官人皆可舉七曰文章典麗可備著述科有官無官人皆可舉八曰善聽獄訟盡公得實科舉有官人九曰善治財賦公私俱便科舉有官人十曰練習法令能斷請讞科舉有官人應職事官自尚書至給舎諫議寄禄官自開府儀同三司至太中大夫職自觀文殿大學士至待制每嵗須得於十科中舉三人非謂每科各舉三人謂各随所知某人堪充某科共計三人其狀云臣竊見某人有何行能並須指陳事實不得徒餙虚辭位在上者得舉在下之人位在下者不得舉在上之人臣今保舉堪充某科如䝉朝廷擢用後不如所舉謂若舉行義純固而違犯名教節操方正而佞邪險躁智勇過人而愚懦致敗公正聰明而私曲昏闇經術精通而不能講讀學問該愽而空踈牆面文章典麗而鄙拙紕繆善聽獄訟而寃滯失實善治財賦而病民耗國練習法令而屢致出入及犯正入已贓臣甘伏朝典不辭候奏狀到日付中書省擇勤謹吏人二人専切收掌仍十科各置簿畫時抄録年月日某官姓名舉某官姓名别置合舉官臣僚簿嵗終不舉及人數不足按劾施行或遇在京及外方有事須合差官體量相度㸃檢磨勘剗刷催促推勘定奪則委執政親檢逐簿各隨所舉之科選差令試管勾上件事務若能辦集即别置簿記其勞績遇本科職任有闕謂若經筵或學官有闕即用行義純固經術精通學問該愽等科人臺諫有闕即用節操方正科人之類則委執政親檢逐簿選名實相稱或舉主多有勞績之人補充仍於本人除官勅告前盡開坐舉主姓名於後或不如所舉其舉主從貢舉非其人律科罪犯正入已贓舉主减三等科罪若因受賄徇私而舉之罪名重者自從重法期在必行不可寛宥雖見為執政官朝廷所不可輟者亦須降官示罰即朝廷臨時因事特詔舉官謂若舉知河渠馬牧等處之類不在十科之内者有不如所舉亦同此法所貴人人重慎所舉官皆得人取進止起請科場劄子元祐元年上臣伏覩朝廷改科場制度第一場試本經義第二場試詩賦第三場試論第四場試策試新科明法除斷案外試論語孝經義奉聖㫖令禮部與兩省學士待制御史臺國子監司案集議聞奏臣竊有所見不敢不以聞凡取士之道當以德行為先文學為後就文學之中又當以經術為先辭采為後是故周禮大司徒以六德六行賔興萬民漢以賢良方正孝亷質樸敦厚取士中興以後取士尤為精慎至於公府掾屬州從事郡國計吏丞史縣功曹鄉嗇夫皆擇賢者為之苟非其人則為世所譏貶是以人人思自砥礪教化興行風俗純厚乃至後世陵夷雖政刑紊於上而節義立於下有以姧囬巧偽致富貴者不為清議所容此乃德化之本原王者所先務不可忽也熹平中詔引諸生能文賦者待制鴻都門下蔡邕力争以為辭賦小才無益於治不如經術自魏晉以降始貴文章而賤經術以詞人為英俊以儒生為鄙樸下至隋唐雖設明經進士兩科進士日隆而明經日替矣所以然者有司以帖經墨義試明經專取記誦不詢義理其弊至於離經析注務隠争難多方以誤之是致舉人自㓜至老以夜繼晝腐脣爛舌虚費勤勞以求應格詰之以聖人之道瞢若靣牆或不知句讀或音字乖訛乃有司之失非舉人之罪也至於以賦詩論策進士及其末流專用律賦格詩取捨過落擿其落韻失平側偏枯不對蜂腰鶴膝以進退天下士不問其賢不肖雖頑如跖蹻苟程試合格不廢髙第行如淵騫程試不合格不免黜落老死衡茅是致舉人專尚辭華不根道德渉獵鈔節懐挾勦剽以取科名詰之以聖人之道未必皆知其中或遊處放蕩容止輕儇言行醜惡靡所不至者不能無之其為弊亦極矣神宗皇帝深鑒其失於是悉罷賦詩及經學諸科專以經義論策試進士此乃革歴代之積弊復先王之令典百世不易之法也但王安石不當以一家私學欲盖掩先儒令天下學官講觧及科場程試同已者取異已者黜使聖人坦明之言轉而䧟於竒僻先王中正之道流而入於異端若已論果是先儒果非何患學者不弃彼而從此何必以利害誘脅如此其急也又黜春秋而進孟子廢六藝而尊百家加之但考校文學不勉勵德行此其失也凡謀度國事當守公論不可希時又不可徇俗冝校是非之小大利害之多少使質諸聖人而不謬酌於人情而皆通稽於上古而克合施之當世而可行然後為善也今國家大議科場之法欲盡美以臣所見莫若依先朝成法合明經進士為一科立周易尚書詩周禮儀禮禮記春秋孝經論語為九經令天下學官依注疏講說學士愽觀諸家自擇短長各從所好春秋止用左氏傳其公羊糓梁陸淳等說並為諸家孟子止為諸子更不試大義應舉者聴自占習三經以上多少隨意皆須習孝經論語於家狀前開坐習某經某經又每歲委升朝文官保舉一人不拘見在任不在任是本部非本部各舉所知若係親戚亦於舉狀内聲說其舉狀稱臣竊見某州某縣人某甲有何行能臣今保舉堪應經明行修科於後不如所舉臣甘當連坐不辭候奏狀到朝廷下禮部貢院置簿各分逐路抄録本人姓名注舉主官位姓名於其下仍下本州出給公據付本人收執及令本州亦如貢院置簿抄録准備開科場日考驗公據其舉狀既上之後若所舉之人犯贓私罪至徒已上情理重及違犯名教候斷訖仍收坐舉主奏乞朝廷取勘施行其人未及第者减五等已及第者减叄等坐之一如舉選人充京官法臣竊料此法初行其奔競屬請固不能免若朝廷必坐舉主毋有所赦行三五人後自皆慎擇其人不敢妄舉如此則士之居鄉居家獨處闇室立身行已不敢不慎惟懼玷缺有聞於外矣所謂不言之教不肅而成不待學日訓月察立賞告訐而士行自美矣每遇開科場其有舉主者自稱應經明行修舉仍於所投家狀前開坐舉主者位姓名有司檢㑹簿上合同方許收接其無舉主者只稱應鄉貢進士舉如常法每舉人三人以上自相結為一保止保委是正身及是本貫不曽犯真刑無隠憂匿服此外皆不保其本州及貢院考試並依舊法差封彌謄録監門廵鋪官程試之日嚴加檢察如舊試經學諸科法各令求已毋得移坐位相從託商量相聚傳義傳本懷挾代筆違者扶出第一場先試孝經論語大義五道内孝經一道論語四道先須備載正文次述注疏大意次引諸家異義次以已見評其是非以援據精詳理長文優者為通其次為粗援㨿踈略理短文拙者為否三通以上為合格不合格者先次駮放合格者榜引次場就試如舊試經學諸科法或合格人數太少則委試官臨時短中求長詳酌放過次場試尚書次場試周禮次場試儀禮次場試禮記次場試春秋次場試周易大義各五道令舉人各隨所習經書就試考校過落如孝經論語法次場論二道一道於儒家諸子書内出題一道於歴代正史内出題次場試策三道皆問時務考策之日方依觧額及奏名人數定去留編排髙下以經數多者在上經數均以策論理長文優在上其經明行修舉人並於進士前别作一項出榜解發及奏名至御前試時務策一道千字以上封彌官於號上題所明經及舉主人數候考校詳定畢編排之時亦以經數多者在上經數均以策理長文優者在上文理均以舉主多者在上其經明行修舉人亦於進士前别作一項編排先放及第其推恩注官比進士特加優異他時選擇清要官館閣臺諫等並須先取經明行修人其舉主姓名常於官告前聲說如此則舉人皆務尊尚經術窮聖人指趣不敢不精旁覽子史不敢不慱又不流放入於異端小說講求時務亦不敢不知所得之士既有行義又能明道又能慱學又知從政其為國家之用豈不賢於今日之所取乎所有今來乞復詩賦者皆嚮日老舉人止習詩賦不習經義應舉不得故為此說欲以動揺科場制度為已私便朝廷若不欲棄捐舊人候將來科場進士有特奏名者令試詩賦隨其優劣等第推恩亦無傷也不可以此輕改成法復從弊俗誤惑後生若以為文章之士國家所不可無即乞許人於試本經合格日投狀乞試雜文於試論次場引試或古詩或律詩或歌行或古賦或頌或銘或賛或四六表啟臨時委試官出題目試某文定篇數字數共須及五百字以上取辭采髙者為合格候得觧及奏名及第日編排姓名髙下各在經數同等人之上如此則文章之士亦不乏矣至於律令勅式皆當官者所須何必置明法一科使為士者豫習之夫禮之所去刑之所取為士者果能知道義自與法律冥合若其不知但日誦徒流絞斬之書習鍜鍊文致之事為士已成刻薄從政豈有循良非所以長育人材敦厚風俗也朝廷若不欲廢弃巳習之人其明法曽得觧者依舊應舉未曽得觧者不得更應則收拾無遺矣臣愚所見如此伏乞以臣所奏及禮部等官所議榜國子監門及編下諸州有州學處榜州學門令舉人限一月内投狀指定何法為善仰本州附遞以聞候到京齊足更委其他執政㸔詳參酌從長施行取進止謝免北使朝見日起居狀元祐元年上右臣伏覩中書省録黄以今月十一日北使朝見奉聖㫖許臣與文彦愽免赴起居仍候人使升殿降階訖權歸幕次將欲賜茶即升殿臣以乆患脚膝逺行乆立實所未堪方欲奏陳伏䝉聖恩差句當御藥院梁某宣諭令臣於人使見辭日更不赴臣無任感天荷聖激切屏營之至謹録奏謝以聞謹奏傳家集巻五十四欽定四庫全書傳家集巻五十五宋司馬光撰章奏三十八申明役法劄子元祐元年上臣先曽上言乞直降勅命應天下免役錢一切並罷其諸色役人並依熈寧元年以前舊法人數委令佐揭簿定差䝉朝廷一一如臣所請臣竊聞降勅之初百姓莫不喜恱一兩月間州縣定差已了别無詞訟人情安帖無何續有顧募不足方行定差指揮人始疑惑既而屢有更張號令不一又轉運使各以已見欲合本路共為一法不令州縣各從其冝是致州縣惶惑不知所從或已差役人却放或已放顧人却收或依舊用役錢顧人或不用錢招人充役朝夕不定上下紛紜徃徃與二月六日勅意相違竊縁臣元初起請及朝廷所降勅節文明言委州縣官㸔詳依今來指揮若有方礙致施行未得仰具利害擘畫申州州申轉運司轉運司奏聞委執政官再加㸔詳隨冝修改别作一路一州一縣勅施行務要曲盡其冝豈是當日所言一字不可移易但患轉運司州縣不肯奏陳臣今欲申明元初起請内聲說不明不盡事件謹具畫一如後一臣起請雖云依熈寧元年舊法人數定差若舊法人數有於今日不可行者即是妨礙合申乞改更人數或太多或太少惟本州縣知得的確合消數目合酌中立額申乞依數定差朝廷難為遥度一臣起請雖云若所差人不願充役任便選顧有行止人自代其顧錢多少私下商量若所顧之人邀勒被差之人廣求顧直官司亦當裁定不得過自來官中顧錢之數其州縣官員即不得指占所顧之人令被差之人顧覔一臣起請雖云見􅃹役人候差到役人各放令逐便者若所顧之人自有田産情願充役者亦自可依舊存留又曹司一役新差之人多不諳熟書算行遣及案下文字未曽交割合留所顧之人給與顧錢令與新差之人同共行遣限半年内交割了畢才放逐便一臣起請云今日衙前陪備少於曏日不至破家若猶以為户力難任即乞於官户僧道單丁女户有屋業每月掠錢及十五貫莊田中年所收斛斗及百石以上者並等第出助役錢不及此數者與放免臣意以為十口之家歲收百石足供口食月掠房錢十五貫足供日用二者相須此外有餘者始令出助役錢非謂止收百石即令助役也若猶嫌太少及所收掠課利難知實數即乞應係第三等以上令出助役錢第四等已上放免若本州坊場河渡等錢自可支酬衙前重難分數得足則官户等更不消出助役錢一從来諸州招募人投充長名衙前若招募不足方始差到鄉户衙前此自是舊法今來别無改更惟是舊日將坊場河渡折酬長名衙前重難令自出賣今來官中出賣坊場河渡收錢依分數折酬長名衙前重難只此與舊法有異若鄉户差補已足續有投名者即先從貧下放鄉户歸農鄉户願投充長名亦聴一臣起請委逐縣㸔詳具利害擘畫申州本州類聚擇其可取者擘畫申轉運司轉運司類聚諸州所申擇其可取者擘畫奏聞朝廷伏縁知逐處民間利害子細轉運司不如州州不如縣竊慮逐縣逐州有擘畫得事理切當而本州及轉運司抑遏刪去不以上聞致勅下之日依舊妨礙施行未得欲乞更降指揮下州縣如有似此擘畫切當被在上刪去者許逐縣直申轉運司本州直申奏所貴下情無壅曲盡事冝仍乞降指揮下詳定役法所只得以諸路州縣申到利害詳其可否立為定法其不當職之人為髙竒之論不切事情者不得施行亦不可將一路一州一縣利害作海行條貫一詳定役法所奏請行下指揮若有妨礙難行之事亦乞如臣起請委逐路州縣看詳具利害擘畫申上隨宜修改右臣所言若有可取乞遍下諸州縣除此外並依二月六日所降勅命施行取進止乞罷保甲招置長名弓手劄子元祐元年上臣竊見府界及三路保甲雖罷團教猶冬教一月於民有損於官無益不若盡罷之便何則比於團教之時民間勞費雖什减六七然猶有三四此所謂於民有損也朝廷每歲遣使按閱所費金帛以百萬計而終無所用之此所謂於官無益也臣以為不若盡罷之便自置保甲以來盗賊倍多所以然者鄉村無頼子弟乍渉城市聞見紛華自恃身為保丁坐索本家供給飲愽遊蕩習以成性今雖罷團教不肯復歸南畆服田力穡逸欲既深資用不足既家藏利兵又身挾武藝由是邀結黨友群行攻劫父兄不能禁州縣不能制此自然之勢也是以數年以來年不甚饑而府界三路盗賊縱横入縣鎮殺官吏若遇蟲蝗水旱大饑之歲將若之何此不可不為之先慮也以臣愚見莫若盡罷府界及諸路保甲據逐縣主户數目盗賊多少委提㸃刑獄相度每若干户置長名弓手一人與免户下租稅支移折變及夫役諸般差徭科配一無所預務為優假使人歆慕每十人置節級一員五十人置十將一員百人置員寮一員二百人以上置指揮使副指揮使各一員雖不及二百人亦置指揮使副指揮使名目盡􅃹一縣弓手以為賞功資級其節級始初且令本縣令佐依上下名次或選有部轄者權管候有長行捉殺到强盗一人即補充正節級替下權管之人自後每捉殺到强盗一人依此遷一級若未有闕且為守闕不得管人候有闕日補正其累功勞遷至正指揮使滿三年以上又曽捉殺到强盗三人從來不曽犯贓罪者仰本縣官吏結罪保明申州本州官吏結罪保明申奏乞朝廷與於三班借差内安排若遇有强惡賊人朝廷臨時别立賞格者不在此限如此則保申中勇健之士見前有出官之望來應募者必多除第一第二等户物力髙强合充重役不得應募外其餘但於本縣有户籍田産不以等第髙下並許投充長名弓手永無觧役之期若第一第二等户情願以一丁為弓手餘丁充重役者亦聽若一人闕額有二人以上爭投者即委令佐揀試武藝髙强者充之如此則本縣勇健者皆充弓手其餘懦弱者雖使之為盗亦無能為患若見充長名弓手人有勇力武藝衰退者許令外人指名比較若勝於舊者即令充替如此則不須教閱武藝自然長得精熟仍委本州及提㸃刑獄常切覺察令佐有取捨不公者取勘依法施行若應募未滿見今鄉差弓手之數即且令鄉差弓手相兼祗應候招到長名弓手一人即替鄉差弓手一人歸農其鄉差弓手願投長名者亦聴若長名弓手及百人以上即令分一半作兩畨二百人以上每百餘人分作一畨並年終交替其上畨者隨縣尉逐捕盗賊自節級以上各令管所轄之人若所轄之人有小可過犯許一面區分不得過小杖十下若所轄之人敢陵犯本轄人員者杖一百毆者徒一年雖權管亦同本轄人員若於所轄人處取受財物並依律科罪犯贓罪杖者若係管轄權管即降充長行下名若係正人員即降一資自後每捉殺到强盗兩人始當一人罪至徒者不以權正並降充長行下名自後每捉殺到强盗三人始當一人雖許遷資並係額外不得管人不得出官若遇下畨則不相管轄亦無階級其下畨者自十將以下各隨所居之處與耆長同覺察本管地分内曽為强盗之人及窩藏之家凡為强盗者不肯於本管地分作過須在他處盖恐累及本地分捕盗人無所自容故也其本地分捕盗人徃徃知之莫肯發舉盗既得財分贓則絶迹逺遁其賊發地分捕盗人雖欲擒捕莫知其處官中雖立三限科校終無所益由此賊發地分捕盗人每有賊發莫肯申舉若變主懦弱則多方抑塞不令聲賊變主强梁則共陪所失之財勸和使休是致羣盗無所忌憚日益昌熾又告捕得賊多被賊人讎報焚燒莊舎屠害老少其賞錢豈冝留滯而徃徃為州縣沮難有司靳惜動有經年請領不得使之觧體欲乞今後應賊發地分其捕盗人更不立三限科校捕盗官亦不批罰只以擒賊多少論其功賞若敢抑塞隠蔽從嚴法施行仍每州各隨大小賊盗多少借官錢數千貫專充告捕賞錢每獲强盗勘得從來住止窩藏去處候斷遣巳了委本州長吏當日先以官錢支給告捕之人即移牒出賊州縣勾追住止窩藏地分捕盗人科不覺察罪弓手杖一百耆長杖八十壯丁笞四十先籍没賊人及窩藏家財産償所支賞錢外其不足之數令捕盗人等均攤限壹月催足津般赴給賞州軍補填官錢若路逺難以津般則各於本州官錢内關牒折兊其强惡賊人朝廷特於常法外多立賞錢者自以省錢充不在捕盗人均攤之限如此賊盗則無所容身必思改過自新若果行此法府界三路既免教閲勞費之患無頼子弟又有所歸投得以羈縻諸路正鄉村之名復國家舊制勇健之士前有仕進之望爭討賊立功不待教閱而弓手武藝自然不敢衰退不須㸃差而鄉兵自足兼有所用人雖衆多而上下有綱紀不敢相侵暴賊發地分捕盗人不知賊處免虚受刑責出賊地分為累及身不敢蔽匿景跡之人被盗之家無人抑塞有所伸訴賊盗窮窘無所容身稍冀衰息取進止乞令六曹刪减條貫白劄子勘㑹近歲法令尤為繁多凢法貴簡要令貴必行則官吏易為檢詳咸知畏避近㨿中書門下後省修成尚書六曹條貫共計三千六百九十四冊寺監在外又㨿編修諸司勅式所申修到勅令格式一千餘巻冊雖有官吏彊力勤敏者恐不能遍觀而詳覽况於備記而必行之其間條目苛密抵捂難行者不可勝數昨者條貫初下吏部侍郎左選差注不行者數日不免再有奏陳復依舊法必料諸曹條貫皆有似此拘礙難行者今欲特降指揮下尚書六曹委長貳郎官同共㸔詳本曹新舊條貫内有海行已有及全無義理於事無益防禁太繁難為遵守者盡令刪去惟取紀綱大體切近事情朝夕不可無者方始存留作本司條貫限兩月申奏施行傳家集巻五十五欽定四庫全書傳家集巻五十六宋司馬光撰章奏三十九乞先行經明行修科劄子元祐元年上臣先上言乞每嵗委陞朝文官保舉一人應經明行修科與進士並置程試一如進士惟於及第後推恩優異以勸勉天下舉人使敦修士行昨已有朝㫖來年科塲且依舊法施行竊聞近有聖㫖其進士經義並兼用注䟽及諸家之説或已見仍罷律義先次施行臣竊詳朝廷之意盖為舉人經義文體専習王氏新學為日已久來年科塲欲兼取舊學故有此指揮令舉人豫知而習之臣所乞置經明行修科者欲使舉人知向去科塲朝廷敦尚行義不専取文學所以美教化厚風俗比於經義文體尤為要切宜使舉人豫知欲乞亦降朝㫖先次施行况與進士舊法兩不相妨取進止所舉孫準有罪自劾劄子元祐元年上臣先准詔書舉文學政事行誼之臣可以充館閣之選者三人臣舉通直郎孫凖近聞孫準與妻趙氏因爭女使與妻兄趙元裕相論訴状内有虚妄事罰銅六斤臣昧扵知人所舉有罪理當連坐乞賜責降取進止所舉孫凖有罪自劾第二劄子臣先舉孫凖行義無缺堪充館閣之選如後不如所舉甘當同罪近聞凖與妻家爭訟罰銅六斤臣奏乞連坐責降伏䝉聖慈批還云孫凖為家私小事罰銅安有連罪伏緣臣舉状稱凖行義無缺今凖閨門不睦妻妾交爭是行義有缺於臣為貢舉非其人臣不敢逃刑况臣近奏十科或有不如所舉其舉主從貢舉非其人律科罪雖見為執政朝廷所不可輟者亦須降官示罰臣備位宰相身自立法首先犯之此而不行何以齊衆乞如臣所奏從貢舉非其人律施行所貴率厲羣臣審慎所舉取進止後殿常起居乞拜劄子元祐元年上臣竊以人臣見君禮無不拜文彦慱年齡位望皆逺踰於臣每後殿起居猶須拜伏獨臣一人恩㫖不拜忝為臣子實不自安欲乞今後遇文彦慱入朝與之同班不入朝即别為一班依羣臣例常起居况臣自揣近日筋力㣲増若得臣男扶掖其常起居四拜殊不為難伏望聖慈聴許以存朝廷之禮取進止辭大禮使劄子尋改差臣先奉勅差充明堂大禮使伏緣臣自去冬以來脚膝無力拜起艱難至今正月下旬全妨拜起遂請朝假至今首尾八箇月若無人扶掖委實獨自拜起不得每次朝見幸䝉聖恩許男扶掖將來饗明堂在上帝前不可使人扶掖又随皇帝陟降拜伏必恐未能一一如禮欲望聖慈矜憫别賜差官充大禮使取進止論監司守資格任舉主劄子元祐元年上臣竊見御史韓川上言諸路監司不當拘限資格專任舉主當令宰相自加選擇竊緣常調之人不可不為之立資格以抑躁進塞倖門若果有賢才朝廷自當不次選擢豈拘此制凡年髙資深之人雖未必盡賢然累任親民歴事頗多知在下艱難比於元不歴親民便任監司者必小勝矣朝廷執政止八九人若非交舊無以知其行能不惟渉狥私之嫌兼所取至狹豈足以盡天下之賢才若采訪毁譽則愛憎毁譽情偽萬端與其聴逰談之言曷若使之結罪保舉故臣奏設十科以舉士其中一科公正聦明可備監司誠知請屬挾私所不能無但有不如所舉者嚴加譴責無所寛宥則今後自然慎擇不敢妄舉矣至如楚潜等雖無聲名安知其無實用俟其到官無狀廢職并舉主坐之亦未為晩取進止薦王大臨劄子元祐元年八月八日上大臨除太學錄已卒臣竊見鄆州處士王大臨通經術善講説安仁樂義譽髙鄉曲貧不易志老不變節曏嘗有詔敦遣固辭不起伏望聖慈召致京師寘之學官為士類矜式取進止乞官陳洙一子劄子元祐元年上臣竊以嘉祐中仁宗皇帝未有繼嗣故殿中侍御史陳洙奏乞擇宗室之賢者立以為後既發奏状謂家人曰我今日入一文字言社稷大計若得罪大者死小者貶竄汝輩當為之備下奏状者未返洙得疾而卒臣時為諌官親聞見此事竊憐其亡身狥國繼之以死而天下莫之知近見故職方員外郎張術亦以當時乞建儲貳子申伯特補太廟齋郎伏望聖慈依張術例除一子官以旌忠義取進止辭明堂宿衞劄子元祐元年上臣先奉聖㫖將來明堂特與免侍祠攝事導駕及稱賀陪位肆赦立班止令宿衞在於人臣恩禮優厚無以復加捐生隕命不足酬報然臣日近患左足掌底腫痛全然履地不得跬歩不能行未知痊愈之期所有將来明堂宿衛亦恐祗赴不得伏望聖慈特賜矜免乞恩不已慙懼無地取進止辭提舉修實錄劄子元祐元年上臣先奉勅差提舉修神宗皇帝實録臣自受命以來以衰羸多病罕曽得到局供職日近又患左足腫痛不能履地日甚一日未有痊愈之期所有修神宗皇帝實錄伏乞别賜差官提舉取進止進呈上官均奏乞尚書省事類分輕重某事闗尚書某事關二丞某事關僕射白劄子尋得㫖依今欲應尚書省事舊有條例事不至大者並委六曹長官一面專决應奏上者奏上應行下者行下其有衝改條貫或應臨時特取㫖及事體大非六曹所能専决者即申都省委僕射左右丞同商量或送中書取㫖或直批判指揮所有都省常程文字並只委在右丞一面批判指揮施行事體稍大及有所疑者方與僕射商量同批判所有諸色人辭状只委左右丞一面収接可留即留可退即退若六曹判㫁不當及住滯不决即别委不千礙官定奪是非及根究住滯因依若顯有不當及無故住滯其本曹官吏即行按劾所貴上下相承各有職分行遣簡徑事務辦集乞趂時収糴常平斛斗白劄子元祐元年上尋得㫖依奏勘會舊常平倉法以豐嵗糓賤傷農故官中比在市添價収糴使蓄積之家無由抑塞農夫須令賤糶凶嵗糓貴傷民故官中比在市减價出糶使蓄積之家無由邀勒貧民須令貴糴物價常平公私兩利此乃三代之良法也曏者有因州縣闕常平糴本錢雖遇豐嵗無錢収糴又有官吏怠慢厭糴糶之煩雖遇豐嵗不肯収糴又有官吏不能察知在市斛斗實價只信憑行人與蓄積之家通同作弊當収成之初農夫要錢急糶之時故意小估價例令官中収糴不得盡入蓄積之家直至過時蓄積之家倉廪盈滿方始頓添價例中糶入官是以農夫糶榖止得賤價官中糴榖常用貴價厚利皆歸蓄積之家又有官吏雖欲趂時収糴而縣申州州申提㸃刑獄提㸃刑獄申司農寺取候指揮比至回報動渉累月已是失時榖價倍貴是致州縣常平倉斛斗有經隔多年在市價例終不及元糴之價出糶不行堆積腐爛者此乃法因人壞非法之不善也熈寧之初執政以舊常平法為不善更將糴本作青苗錢散與人户令出息二分置提舉官以督之豐嵗則農夫糶榖十不得四五之價凶年則屠牛賣肉伐桑賣薪以輸錢於官錢貨愈重榖直愈輕朝廷深知其弊故罷提舉官令將累年蓄積錢榖財物盡樁作常平倉錢物委提㸃刑獄交割主管依舊常平倉法施行今嵗諸路除有水災州軍外其餘豐熟䖏多今欲特降指揮下諸路提㸃刑獄司乗有此糴本之時委豐熟州縣官各體察在市斛斗實價多添錢數廣行収糴如闕少倉厫之處以常平倉錢添盖仍令少糴麥荳多糴榖米其南方及川界卑濕之地有斛斗難以乆貯者即委提㸃刑獄相度逐州縣合銷數目抛降収糴纔候將来在市物貨價比元糴價稍増即行出糶不得令積壓損壞仍令州縣各勒行人將十年以来在市斛斗價例比較立定貴賤酌中價例然後將逐色價分為三等自幾錢至幾錢為中等價幾錢以上為上等價幾錢以下為下等價令逐處臨時斟酌加减務在合宜既約定三等價仰自今後州縣每遇豐嵗斛斗價賤至下等之時即比市價相度添錢開塲収糴凶年斛斗價貴至上等之時即比市價相度减錢開塲出糶若在市見價只在中等之内即不糴糶更不申取本州及上司指揮免有稽滯失時之患仍委提㸃刑獄常提舉覺察若州縣斛斗價及下等而不収糴價及上等而不出糶及収貯不如法變轉不以時致有損壞并監官不逐日入塲致壅滯糶糴人户並取勘施行若州縣長吏及監官能用心及時糴糶至得替時酌中價錢與斛斗通行比折與初到任時増剰及十分中一分以上許批書上厯子候到吏部日與升半年名次及二分以上許指射家便差遣一次所貴官吏各各用心州縣皆有儲蓄雖遇荐饑民無菜色又得官中所積之錢稍稍散在民間可使物貨流通其河北州縣有糴便司斛斗見多沿邉州縣轉運司見糴軍糧處更不糴常平倉斛斗若今來指揮内有未盡未便事仰委提㸃刑獄司逐旋擘畫申奏施行乞約束州縣不得抑配青苗錢白劄子元祐元年上撿會先朝初散青苖錢本為利民故當時指揮並取人户情願不得抑配自後因提舉官速要見功務求多散諷脇州縣廢格詔書名為情願其實抑配或舉縣勾集或排門抄劄亦有無頼子弟謾昧尊長錢不入家亦有他人冒名詐偽請去莫知為誰及致追催皆歸本户朝廷深知其弊故悉罷提舉官不復立額考較天下莫不欣戴昨於四月二十六日有勅命令給常平錢榖限二月或正月只為人户欲借請者及時得用又令半留倉庫半出給者只為所給不得輒過此數至於取人户情願不得抑配一遵先朝本意慮恐州縣不曉勅意將謂朝廷復欲多散青苗錢廣収利息勾集抑配督責嚴急一如曏日置提舉官時令欲續降指揮下諸路提㸃刑獄司告示州縣並須候人户自執状結保赴縣乞請常平錢之時方得勘會依條支給不得依前勾集抄劄強行抑配仍仰提㸃刑獄常切覺察如有官吏似此違法騷擾者即時取勘施行若提㸃刑獄不切覺察委轉運司安撫司覺察聞奏乞罷散青苖錢白劄子元祐元年上得㫖依昨於四月二十六日降指揮令於正月二月支散常平倉錢􅂖竊慮州縣多不曉朝廷之意將謂却欲廣散青苗錢多収利息嚴行督責一如未罷提舉官時勘會青苗錢利民甚少害民極多臣民上言前後非一今欲遍行指揮下諸路提㸃刑獄司自今後其常平倉錢榖只令州縣依舊法趂時糴糶其青苗錢更不支俵所有舊欠二分之息盡皆除放只令提㸃刑獄契勘逐州縣元支本錢随見欠多少分作料次令隨稅送納傳家集巻五十六欽定四庫全書傳家集巻五十七宋司馬光撰章奏四十乞合兩省為一劄子元祐元年與三省同上臣等聞三王不相襲禮五帝不相沿樂况國家設官分職張立治具上下相維修飾明備何所愧於漢唐何必事事循其陳迹而失當今之宜也謹案西漢以丞相縂百官而九卿分治天下之事光武中興身親庶務事歸臺閣尚書始重而西漢公卿稍已失職矣及魏武佐漢初建魏國置祕書令典尚書奏事文帝受禪改祕書為中書有令有監而亦不廢尚書然中書親近而尚書踈外矣東晉以後天子以侍中常在左右多與之議政事不得任中書於是又有門下而中書權始分矣降及南北朝大抵皆循此制唐初始合中書門下之職故有同中書門下三品同中書門下平章事其後又置政事堂盖以中書出詔令門下掌封駮日有爭論紛紜不决故使兩省先於政事堂議定然後奏聞開元中張説奏改政事堂為中書門下自是相承至于國朝莫之能改非不欲分也理勢不可復分也曏日所謂中書者乃中書門下政事堂也唐末諸司使皆内臣領之樞宻使參預朝政始與宰相分權矣降及五代改用士人樞宻使皆天子腹心之臣曰與議軍國大事其權重於宰相太祖受命以宰相專主文事叅知政事佐之樞宻使專掌武事副使佐之自是以來百有餘年官師相承中外安帖百司長官及諸路監司諸州長吏皆得專達或申奏朝廷或止申中書樞宻院事大則中書樞宻院進呈取㫖降勅劄宣命指揮事小則批状直下本司本路本州本人故文書簡徑事無留滯神宗皇帝以唐自中葉以後官職繁冗名器紊亂欲革而正之誠為至當然但當據今日之事實考前世之訛謬刪去重復去其冗長必有此事乃置此官不必一依唐之六典分中書為三省令中書取㫖門下覆奏尚書施行凡内降文書及諸處所上奏状申状至門下中書省者大率皆送尚書省尚書省下六曹六曹付諸案勘當檢尋文書會問事節近則寺監逺則州縣一切齊足然後相度事理定奪歸着申尚書省尚書省送中書取㫖中書既得㫖送門下省覆奏畫可然後飜錄下尚書省尚書省復下六曹方符下諸處以此文字繁冗行遣迂回近者數月逺者踰年而未曽結絶或四方急奏待報或吏民辭訟求决皆困於留滯又本置門下省欲以封駮中書省録黄樞宻院錄白恐有未當若令舉職則須日有駁正争論紛紜執政大臣遂成不恊故自置門下省以來駁議甚少又門下不得直取㫖行下雖有駮議必須却送中書取㫖中書或不捨前見復行改易又内批文字及諸處奏請多降付三省同共進呈則門下之官已經商量奏决若復有駮正則為反復近日中書文字有急速者往往更不送門下省然則門下一官殆為虚設徒使吏員倍多文書繁冗無益於事臣等今衆共商量欲乞依舊令中書門下通同職業以都堂為政事堂每有政事差除及臺諌官章奏已有聖㫖三省同進呈外其餘並令中書門下官同商議簽書施行事大則進呈取㫖降勅劄事小則直批状指揮一如舊日中書門下故事併兩省十二房吏人為六房同共㸃檢鈔状行遣文書若有溢員除揀選留住外並特與减三年出職不及三年應出職者與减磨勘年限若政事有差失委給事中封駮差除有不當委中書舍人封還詞頭又兩省諌官皆得論列則號令之出亦不為不審慎矣如此則政事歸一吏員不冗文書不繁行遣徑直於先帝所建之官並無所變更但於職業㣲有修改欲令於事務時宜差為簡便其委曲條目並候得㫖允許續議修立取進止乞令六曹長官專逹劄子元祐元年上臣等聞王者設官分職居上者所緫多故治其大要居下者所分少故治其詳細此理勢之自然綱紀所由立也是以周官小宰以官府之六屬舉邦治大事則從其長小事則専達凡宰相上則啓沃人主論道經邦中則選用百官賞功罰罪下則阜安百姓興除利害乃其職也至扵簿領之差失期會之稽違獄訟之曲直胥史之選補皆郎吏之任非宰相所宜親也故人有言察目睫者不能見百歩察百歩者亦不能見目睫言詳於近者必略於逺謹於細者必遺於大也今尚書省事無大小皆决於僕射僕射自朝至暮省覽文書受接辭状未嘗暫息精力疲弊於米鹽細故其於經國之大體安民之逺猷不暇復精思而熟慮恐非朝廷所以責宰相之事業也竊以六曹長官古之六卿事之小者豈可不令專達臣等商量欲乞今後凡有詔令降付尚書省者僕射左右丞簽訖官告黄牒之類已簽訖者更不簽分付六曹謄印符下諸司及諸路諸州施行其臣民所上文字降付尚書省僕射左右丞簽訖亦分付六曹本曹尚書侍郎及本㕔郎官次第簽訖委本㕔郎官討尋公案會問事節相度理道檢詳條貫下筆判云今欲如何施行次第通呈侍郎尚書若郎官所判已得允當則侍郎簽過尚書判准應奏上者直奏上應行下者直行下即未得允當者委侍郎尚書改判事之可否皆决於本曹長官其文字分付本㕔郎官之時委本曹長官随事大小鑿限若有稽遲即行紏劾即委的有事故結絶未得者申長官展吏部尚書如舊日判東西審官院左選侍郎如舊日判流内銓右選侍郎如舊日判三班院户部長官如舊日三司使刑部長官如舊日判審刑院舊日本司文字並直奏直下今欲令六曹長官准此更不由經僕射左右丞即改更條法或奏乞特㫖謂如刑部刑名疑慮或情理可憫或情重法輕特乞停替編配之類或事體稍大或理有可疑非六曹所能專决者聴詣僕射左右丞咨白或具状申都省委僕射左右丞商議或上殿取㫖或頭簽劄子奏聞或入熟状或直批判指揮其諸色人辭状並只令經本曹長官陳過尚書侍郎本㕔郎官次第簽押判决一如朝廷降下臣民所上文字次第施行若六曹不為収接及乆不結絶或判斷不當即令經登聞皷院進状降下尚書省委僕射左右丞判付本省不干礙官員看詳定奪若本曹顯有不當即行紏劾所貴上下相承各有職分行遣簡徑事務易集取進止乞令三省諸司無條方用例白劄子元祐元年上勘會舊例只是前官所行或是或非豈足永為後法近嵗三省及百司多用例破條諸色人亦多於條外攀援體例希求恩澤欲令今後凡有正條者並須依條無條方許用例前例若是所當遵行前例若非即宜釐革只委本省六曹本司長官相度理道與奪批判所貴向去漸除弊例乞令監司州縣各舉按所部官吏白劄子元祐元年上檢會監司知州通判於本部官吏内有罪惡顯著而有失覺察者並連累責降雖有舊條然未嘗一一行遣又慮一路一州官吏衆多上位覺察不盡又未指定合覺察事件致寛者則一切不問急者則濫及無辜又凡為監司州縣長吏當進賢退不肖不可但令覺察有罪不令舉薦賢才今欲立舉薦四條一曰仁惠謂安民利物衆所畏愛非疲軟不立曲取人情者二曰公直謂心無適􅇀事不吐茹非内私外公實佞詐直者三曰明敏謂深察情理應機辦事非飾詐掠美利口矜功者四曰亷謹謂安貧守分動遵法度非詐清釣名偷安避事者按察四條一曰苛酷謂用刑繁苛殘虐踰法者二曰狡佞謂傾險巧詐危人自安者三曰昏懦謂不曉物情依阿無守者四曰貪縱謂饕餮無厭任情不法者凡監司州縣於所部之内皆得以此八條舉按官吏其舉薦者於本部官吏之内有仁惠公直明敏亷謹者可舉則舉無有定數縣舉之州州置簿記姓名州舉之監司監司置簿記姓名監司舉之朝廷中書置簿記姓名各随所舉行能任使以試之果有實効則漸加旌異其按察者監司專按察知州軍通判路分都監以上知州軍通判專按察在州官吏及諸知縣知縣專按察簿尉及縣界内官吏若有苛酷狡佞昏懦貪縱者縣體量申州州體量申監司監司體量申奏續更體量的確事迹紏發施行若有失察覺别致因事彰露其監司降知州軍知州降通判通判各降一資知縣降監當其餘所部官吏監司知州軍通判皆得按察但不坐失覺察之罪即挾情按察不以公者候勘鞫見實自依常法知縣惟得具事迹申州不得擅勘命官乞不帖例貸配劄子元祐元年十月二十日上勘㑹守法者有司之職揆道者君相之權伏見從來命官犯罪大理寺既依法定斷更令刑部檢例或追官或勒停或衝替或差替之類朝廷依而行之謂之特㫖凡人之罪犯千端而事體萬計豈可求其比類能得正同又既謂之特㫖當臨時㫁在朝廷若先令刑部帖例朝廷依此施行乃是輕重之權返在有司也欲今後應命官犯罪大理寺既定㫁委刑部看詳内有法重情輕或法輕情重並具状申中書省更不帖例委中書省官相度情理輕重同共商量除依法外自貸命編配至特放臨時擬定進呈取㫖施行其百姓犯大辟罪諸州奏稱刑名疑慮及情理可憫者大理寺依法定斷委刑部看詳委的有疑慮可憫之状即具状申門下省更不帖例委門下省官相度事理同共商量臨時擬定或依法或貸命編配進呈取㫖施行再申明役法劄子元祐元年上檢會二月六日勅文止是罷免役錢其諸色役人並依熈寧元年以前舊法委令佐掲簿定差尚慮諸路州縣利害各有不同所以下文云委逐縣看詳若有妨礙施行未得即具利害擘畫申州仰本州類聚諸縣所申擇其可取者具利害擘畫申轉運司轉運司類聚諸州所申擇其可取者具利害擘畫奏聞其意欲使本州體量諸縣所申利害之虚實擘畫之是非擇其實而是者條例申轉運司云某縣當如何措置某縣當如何措置其餘已依舊法定差施行轉運司得諸州所申亦如此體量條例申奏盖欲随處差役曲盡其宜非謂使逐路共為一法也今訪聞諸路轉運司不遵用熈寧元年以前舊法又不取諸州縣所擘畫各以已意撰成一路役法差官分詣諸州縣名為商量其實諷諭令随已意却作州縣擘畫立法申奏州縣稍有違異輒加責怒以此多不依應得逐處利便不合民心又諸路州縣見朝廷置詳定役法所以為當别撰役法頒下往往等候下即定差殊不知看詳役法所專候諸路州縣具到利害擘畫即作一路一州勅行下以此觀望遷延乆不了絶今欲特降指揮下諸州縣除有舊法妨礙難行之事速具申陳外其餘並依舊法一面定差其看詳役法㨿逐處先申到利害擘畫事件如得允當逐旋奏乞令本處依此施行所貴差役之法日近早見結絶傳家集巻五十七欽定四庫全書傳家集巻五十八宋司馬光撰書啓一謝檢討啓仰戴寵靈俯循涯分任非才稱憂與愧并竊以帝王垂憲於典墳文武布政於方􅉺參天球赤刀之寳閟石室金匱之嚴豈繄記述之良抑亦討論之美自㣲貫穿前載浹洽舊聞稽古侔倚相之才叙事識子長之體則何以懋明得失考合異同訪逸事於名山求緒言於故老使聖哲丕績蔽天壌而亡窮俊乂隆名炳丹青而不朽原立官之甚重宜擇士以恪居豈容冒塵坐致􅈥曠如光者行能褊淺器質迂踈徒以儒術承家蚤用門資署吏甫任典謁已辱聞詩愚者常專雖慕攻堅之業勤而無獲正如毁瓦之為猥玷士科始陪賔幕漆雕之道未信尹何之傷實多旋屬家艱零丁苫凷比還官次汩沒道塗辭鋒頓而不修學殖落而亡幾分從塵役絶覬榮階俄承乏於􅎩宗遂參華於天祿慶霄清晏蓬渚邃嚴縑素牣盈率多未見英豪坌集叨與並遊顧𤨏陋之無庸每怔忪而自失所虞揚汰敢冀甄収何期佑弼之司誤辱襃稱之奏俾登史觀賛治信書緝記言記動之殊辨所見所聞之實詳明其故紬繹厥文竊惟累洽之辰方咏衆賢之富弗圖嘉命􅃍及窳才靖究所来孰云無自此盖伏遇某官奨延後進汲引下僚采其毫􅄠之長振以齒牙之論使不售之馬立享千金之酬無用之材或充萬乗之器敢不劬勞從事恪慎處躬冀少答於生成庶無慙於知遇謝校勘啓伏以聖哲之道悉載於書書之散訛道亦欝滯是以國家開圖籍之府設校讎之官必求秀􅊆絶特之人使之執事誠以道為重也光天與之分甚顓且愚徒以世家相承習尚儒素故自免去襁褓初知語言父兄提携授以經籍是以不執餘技而逢衣自名曽未能逰聖人之藩籬嚌六藝之糟粕遽用門䕃列於王官始就郷舉徑叨上第常竊自恨道未至而受祿學未優而治民雖媮獲於一時終不足為成人也已而天降之禍服衰五年指景數刻幾無生望洎免喪為吏從事藩方則牒訴文移所居委塞是以舊學益廢剪為荆榛私心悵然每用嘆邑不自意得承乏東序息肩簿領乃始修礪錢鏄誅治荒穢庶幾勉狥宿昔之志雖失之春芸猶得之秋穫足為愈焉敢謂朝之輔臣不察駑朽遽列其名薦之法座上方倚信大臣議無不用遂發中詔引登書府使之款朱闕蹈紫臺倐去蓬蒿頡頏霄漢榮耀過分不寒而栗夙夜循念罔知所來此盖伏遇某官内竭忠力以勤王家外隆寛裕以延士類各適其器不遺衆才顧盼所加人増大吕之重議論所與世劇衮章之榮俾兹妄庸濫獲甄采敢不益自勤敕無違率履勉服故業期於有成庶幾不辱寵靈無負知鑒又謝龐參政啓伏以朋友道缺為日久矣陵夷至於近世益以衰薄甚者旦為好言暮而反之况於存沒之異貴賤之絶苟能言其姓名識其逰處斯可頌矣矧又収撫其孤誘掖成就使之自邜而翼去幽而光天下幾何人哉光質性愚陋動無可稱學古著文皆不逮衆徒以先人疇昔嘗託僚寀獲友髙明道同志合出處如一分義之美近古所希光以童子獲執几杖侍見扵前執事撫髫誨導俾之就學以至冒竊科級叨塵祿位始終之賜皆有自焉及夫上天降災禍罰崇大屏伏田里號咷待盡執事賜書弔撫俾能自存又譔著遺烈表之楸柏使其後祀焜燿無窮凡兹大恩固巳無量矣而又以光樸懦自守謂其寡過每賜祓飾多踰其實光或聞之流汗被顙常懼不能堪副以累知言暨衰麻外除復從吏役執事以文武才實入賛樞極薦士之奏首列光名事雖報聞勤惻愈甚間二嵗進參大政則又復前奏出之扆前上方推信大臣議無不用亟命近署試其所能藝術素踈果暴媸鄙方自踧踖以須譴絀不意天恩曲成引内袐府遽使頡頏禁闥依光紫霄校讐羣書參奉逰豫豈光空薄所能堪稱承命震駭征營失據静自循度罔知所来此非先人之餘休被及後昆執事之敦篤不遺故舊糠粃小生何階自致衘恩念親涕洟横集夫以執事之忠亮純明豈其私一不肖之人使汙衊文館羞士大夫盖將驅一世之人使媮者日醇薄者日敦誠有以賛天子之大化非獨苟然而已乃知大君子之舉事用志逺矣光敢不夙夜刻勵寤寐訓辭進益所長攻去所短冀不忝前人之教誨羞知已之稱論以負明詔之収擢而已過此以往不知所為上宋侍讀書昔燕王有馬千里而天下無敢獻馬於燕者為其皆不能及廐中之良也趙王有璧徑尺而天下無敢賈玉於趙者為其皆不能及櫝中之美也彼以物求售者誠然以道求售者則異矣請以周公言之夫周公之徳美才智天下固無庶幾望其藩籬者然周公沐則捉髪飱則吐哺汲汲焉走迎天下之士惟恐一人伏於蓬蓽之下者是以鍾石筦絃之音歌舞其徳于今未衰曏者儻以已之才徳求諸他人則外踰四海舟車所極終無一人可収采者又安有曄曄光美施於千載邪降及後世賢公卿大夫未有不祖述此道而能具美者也伏惟執事體純明以立質積學問以廣徳自結聖主優㳺禁闥四表仰聲而響集羣士希光而㬌附眄睞所被}
