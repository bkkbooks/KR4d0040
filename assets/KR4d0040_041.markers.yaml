  - {type: variant, offset: 5505, length: 0, content: '', WYG: 先集欲刻板摹之廣傳於世光幸以鄰居公廙每有一事未明一字未正必垂訪問苟淺學所能及者未甞敢有隠也所不能及者亦不敢質而􅇅之請公廙訪諸能者此特磨研編削之比耳豈足為有功於先集哉乃䝉足下勤勤相謝又襃借太過雖増君子謙謙之美顧小人不敢受而有殆無地以自䖏所幸者得閟藏先集以詒子孫俾轉相授受以永其傳乃其志也答范景仁書近於夢得䖏連得所賜兩書聞泛西湖浮潩水登香菜樓望陘山起居甚適差慰勤想又䝉教以宜觀素問病原有療病導引之方且云鑄周鬴漢斛巳成欲令光至潁昌就觀之雖古之儒者聞善相告見善相示勤勤懇懇殆不過此其幸與感何可勝言但以家兄約非乆入洛湏留此待之不可捨去故未敢輕諾徒増耿耿耳景仁所教誠善矣孔子曰盍各言爾志竊不自揆輒敢以所聞養生及治樂之道薦於左右譬猶嘉榖既殖必使傭役從而耘耨之大厦既構必使賤工從而礱斵之然後克成其粹美也景仁可能不鄙而聴之乎常記昔者與景仁同在貢院充㸃檢官主文試進士民受天地之中以生論當是時塲中秉筆者且千人皆以為民之始生無不禀天地中和之氣也其文辤之美固多矣以愚觀之似皆未得劉康公之指常欲私出鄙意而論之因循汩沒卒不能就於今三十五年矣因景仁教以養生之道敢試言之康公之言曰民受天地之中以生所謂命也是以有動作禮義威儀之則以定命也能者養之以取福不能者敗之以取祸今成子惰棄其命矣盖所謂生者乃生存之生非始生之生也夫中者天地之所以立也在易為太極在書為皇極在禮為中庸其徳大矣至矣無以尚矣上焉治天下下焉脩一身捨是莫之能矣就其小小者言之則養生亦其一也何以知之夫人之有疾也必自於過與不及而得之隂陽風雨晦明必有過者焉飢飽寒燠勞逸喜怒必有偏者焉使二者各得其中無疾矣隂陽風雨晦明天之所施也飢飽寒暑勞逸喜怒人之所為也人之所為苟不失其中則天之所施雖過亦弗能傷矣木朽而蝎䖏焉肉腐而蟲聚焉人之所為不得其中然後病襲焉故曰養僃而動時則天不能病也是以聖人制動作禮義威儀之則所以教民不離於中不離於中所以定命也能者則養其中以享福不能者則敗其中以取禍是皆在己非在佗也詩云人而無禮胡不遄死記曰人有禮則生無禮則死人無禮則失中失中則棄命矣劉康公所以能知成肅公之將死盖用此道也彼素問病原之說雖佳恐漫汗支離不若此道之為明且約也昔者聖人造次而動不爽於和縱心所欲不失其中施之於身則有餘矣將以教天下垂後世則未能也是故調六律五聲八音七始以形容其心制吉凶賔軍嘉禮以軌物其徳使當時及後世之人雖四海之逺千載之乆聴其樂則洋洋乎其心和常若聖人之在其上循其禮則肅肅然其體正常若聖人之䖏其旁是以大夫無故不撤簨簴士無故不撤琴瑟朝夕出入起居未甞不在禮樂之間以收其放心檢其慢志此禮樂之所以為用也周室既衰禮缺樂弛典章亡逸疇人流散律度量衡不存乎世咸英韶頀不傳乎人重以暴秦焚滅六籍樂之要妙存乎聲音其失之甚易求之甚難自漢以來諸儒取諸胷臆以億度古法牽於文義拘於名數較竹管之短長計黍粒之多寡競於無形之域訟於無證之庭迭相否臧紛然無已雖使后䕫復生亦不能决彼周鬴出於考工記事非經見是非固未得而知如漢斛者乃劉歆為王莽為之就使其真器尚存亦不足法况景仁復改其制度恐徒役心力費銅炭而巳孔子曰禮云禮云玉帛云乎哉樂云樂云鐘皷云乎哉今先王之樂餘音遺文既不可得而睹聞矣盍亦返其本乎樂記曰禮樂不可斯須去身致樂以治心則易直子諒之心油然生矣易直子諒之心生則樂樂則安安則乆乆則天天則神天則不言而信神則不怒而威致樂以治心者也致禮以治躬則荘謹莊謹則嚴威中心斯須不和不樂而鄙詐之心入之矣外貌斯須不莊不謹而易慢之心入之矣樂也者動於内者也禮也者動於外者也樂極和禮極順内和而外順則民瞻其顔色而弗與争也望其容貌而民不生易慢焉此樂之本禮之原也夫樂之用不過於和禮之用不過於順二者非徒宜於治民乃兼所以養生也如某者雖知之常病未能行之今老矣猶庶㡬強勉而學焉以養其餘生亦願景仁共勤此道捐其末求其本捨其流取其原致樂以和其内致禮以順其外内和則疾疹不生外順則災患不至疾疹不生則樂災患不至則安既樂且安志氣平泰精神清明暢乎四支浹乎百體如此則功何以不若伶倫師曠夀何以不若召康衞武醫經病原皆可焚周鬴漢斛皆可銷矣景仁以為何如哉抑禮樂乃天地人之大倫自古大賢君子尚不敢輕議而狂簡小子輒妄言及之是宜得誅絶之罪於聖人賴景仁之知我如鮑叔之知管仲也不以為僣不以為狂庶㡬有可采擇於其中焉景仁又答書某啟辱書言考工記及劉歆所鑄斛并素問病原不可不復竊謂舜廵四岳則同律度量衡孔子曰謹􅁠量四方之政行焉以是知聖人之於尺量􅁠衡恃以為治者而尺量􅁠衡必本於律律必有聲以考其和此樂之所由作也周之鬴漢之斛其法具存魏晉以來其尺至有十五種盖由横黍縱黍所為而不禀於律也然卒不能作樂止用􅃇聲終唐之世無變改者至周王朴始用魏晉所棄之法遂以仲吕為黄鍾太祖皇帝患之特下一律仁宗皇帝留意數十年終無所得及上仙太皇猶以李照胡瑗所鑄銅律置神御前然李照以縱黍累尺與今太府其律又應古樂而鐘磬才中太蔟是樂與律自相矛盾也胡瑗之樂君實詳知之此不復云前嵗議樂按太常鏄鐘皆有小大輕重非三代不能為然最大者今為林鍾而仲吕乃居黄鍾子位考之正差五律與前後言者相符雖經鐫鑿尚可補治若以大小次之必得其正近又用李照之樂則不若仲吕之愈也何則太蔟商聲宋子京所謂君實寄於臣管是也是大不可又况十二律皆有清聲花日新撰譜與鄭衛無異而以薦郊廟可乎考工記世以為漢儒所為漢志載劉歆之說多所牽合某亦於二書深疑之近因鬴斛考其制作不復疑矣又知太府之尺與􅁠衡皆古之禀於律者惟量出於晉魏之貪政與律不合須君實靣言乃悉竊以為論此者今世無如吾二人講求問難之多而且乆也得君實來恊同其說以破千餘年之惑為後世之傳則吾徒事業固亦不細矣難兄若朝夕來不敢奉邀候歸陜嵗首垂訪春中却同入洛幸也劉康公論極佳此誠非舉人之所能到然素問專主於醫非黄帝莫能為者某至穎昌已再讀矣須有所得恨讀之之晩病原乃申素問之說易為觀覧若君實不倦亦不可忽於身大有所益聖人之於後世如此但恐未可焚燒鬴斛費銅炭則然亦不可錯棄恃念不宣某再拜與范景仁第四書某啟近領正月十二日書續又領所賜論醫及樂書教誨勤勤感藏無巳醫書固難測素問巢源在其中最精奥誠如所諭光前書所云者非敢廢棄之也竊謂醫書治巳病平心和氣治未病冀景仁既得其本則末可焚也然謂素問為真黄帝之書則恐未可黄帝亦治天下豈可終日坐明堂但與岐伯論醫藥鍼灸耶此周漢之間醫者依託以取重耳古律既亡胡李之律生於尺房庶之律生於量皆難以定是非光為景仁言之熟矣今不復云權量雖聖所重又須更審法制修廢官然後政行於四方恐未可專恃以為治也又今之權量未必合於聖人之權量也夫中和樂之本也鍾律樂之末也本巧也末規矩也雖不盡善猶能成器若規不規矩不矩雖使良工執之猶將惑焉光是以願景仁銷新鑄之鬴斛不欲使傳於後世萬一有知樂者音律既合於古矣不幸得景仁之器考之而不合反以自疑曰景仁賢者豈肯作器以誤我更惑於其所學矣此光之所大懼也望景仁察之數日來頓暄洛城花卉如錦家兄巳到光未可離此景仁既許來千萬勿食言也景仁答第四書人來得二月十六日手書承體候巳就平復不勝喜慰又云平心和氣以治未病君實之心未甞不平其氣未甞不和而不能治未病某竊恐所有之樂如議之樂爾醫與樂皆出於黄帝岐伯乃當時之工也聖人立法之時不可不如此周悉其書不若虞書周漢間依記以取重者亦然也尺量權衡亦起於當時何則已有律至虞書同律度量衡舜慮四方而此三物者不禀於律則風俗不可以統同故每嵗廵於方岳下考而齊一之安得為不恃此以為治今之尺乃古之尺今之權衡乃古之權衡前年以古樂聲為黄鍾長九寸三分損一為林鍾長六寸律皆圍九分黄鍾積實得八百一千分三分損一林鍾得五百四十分十二律皆如此率而其聲恊此乃増律之一寸以為尺豈生於量也與今之太府尺正同又以黄金方寸得一斤乃知太古權衡皆古法也惟量比律十三分二之大此盖出於魏晉以來貪政也即以所制律考太常鏄鐘未位最大者乃應黄鍾子位中者應仲吕前後人言髙五律者不虚矣古者十二鍾皆有大小猶十二律之有長短也猶鬴斛之有輕重也以律之徑三分至鬴之方尺圓其外之百三萬六千八百分斛之方尺圓其外庣旁九釐五毫之百六十二萬分皆無差也律者樂之本也鐘皷云乎哉盖病後世專事鐘皷而不知本也刑名之書謂之律者取此也五刑之屬三千其罪之大小情之輕重苟不以律則不得其當猶無律而定樂也胡先生律圍十三分三釐八毫者八圍九分者一圍八分四釐者一圍七分九釐五毫者一外有損益而内無損益何也為聲之不恊此也黄鍾之律短也黄鍾之律短者由以尺而生律也君實若不見過一觀鬴斛某懼後世待君實為執一而不變人也非所聞之君實也與景仁第五書光啟范朝散來領二月二十三日及晦日兩書所云􅉍中書未甞得盖二十三日書即是也夫治心以中此舜禹所以相戒也治氣以和此孟子所以養浩然者也孔子曰爵禄可辭也白刄可蹈也中庸不可能也然則中和者聖賢之所難而來示謂光心未甞不平氣未甞不和猶不免於病此言過矣以光方於古人乃下之下者也於聖賢之道曽不能望其藩籬然亦知中和之美可以為養生作樂之本譬諸萬物皆知天之為髙日之為明莫不瞻仰而歸向之誰能跂而及之耶曏所以薦於左右者欲與景仁黽勉共學之爾安能􅃍入其域邪至於景仁去冬為酒所困發於耳發於牙是亦過中之所為也又云今之尺乃古之尺今之權衡乃古之權衡惟量比所為律十三分二之大此無他出於魏晉以來貪政也光為尺量權衡自秦漢以來變更多矣今之尺與權衡豈得猶是先王之所用邪彼貪者知大其量以多取人榖豈不知大其尺以多取人帛大其權衡以多取人金乎且尺量權衡公私所其用也斂之以大量則給之亦以大量貪者何所得乎此則衆人共知其不然明矣黄金方寸其重一斤恐亦㩀今之尺與權衡言之爾唐自安史之亂雅樂工器什不一存逮於黄巢蕩無孑遺有殷盈孫者更案考工記始鑄鏄鐘十二五代用之周世宗更命王朴考正其音後今以景仁律騐之在未位者已中黄鍾則是太常鏄鐘下七律也不知何故反以為合又景仁所謂律與鬴斛之分數光未甚觧豈非語其容受耶景仁亦以千二百黍為一龠則二百四十萬黍為一斛以今斛槩之何啻大十三分之二耶此皆愚所不及非靣議莫能盡也曏謂景仁必入洛庶得相與極論養生作樂之本今景仁既不來光又不得徃欝欝之志殊未便也景仁復第五書某復書君實足下辱手書言中和之難誠是也禮云致中和天地位焉萬物育焉言帝王中和之化行則隂陽和動植之類蕃非為一身除病而禁醫書也孟子養浩然之氣榮辱禍福之不能動其心非除病之謂也某向之病誠由飲食過中是飲食過中非中和也尺與權衡合於律惟量為三分之大自魏晉自秦漢俱不載於書不可知也大斂之大給之亦不可知也古有什一之稅而魯什二漢什五秦大半皆大斂也不必大其量是也亦恐便於用而致然爾今尺合於律權衡合於律而鬴斛之輕重合於權衡尺之方深合於量又與古樂聲正同所謂量者一律之容為一龠千六百四十龠為一鬴百三萬六千八百分之實也二千龠為一斛百六十二萬分之實也自古至今黄金無變者尺之法權衡之法不可變亦猶是也其數與聲與尺與權衡皆禀於律獨量為不禀必有自來矣不見於書所以疑其自魏晉也以胡先生樂書考之乃知其律短而聲髙君實不求此而襲先儒之誤乃云未甚觧鬴斛之分者正以此也君實深於筭請自律分推而至於權衡尺量則煥然無疑矣求位最正者曰林鍾自六月至十一月則黄鍾位也非有七律子位中者曰仲吕自十一月至四月則仲吕位也前所謂各髙五律非謬矣太常鏄鐘恐非盈孫所為是時尺法亡乆矣安得如考工記有大小輕重之法乎故曰非周以前莫能為者累諭議不决時以漢書脫文及隋書所載先儒之誤非君實誤也更詳思之與范景仁論中和書光再拜自四月來連於夣得䖏領三書以無的便乆未之報惟景仁必能察其非惰慢也來書主鬴斛論甚確光寡學於鍾律實所不觧不足以辨是非曏者互相攻難聊資戯笑耳今若喋喋為報乃是求勝而強相加爭言而競後息非素志也且置是論至於中和為養生作樂之本此皆見於經傳非取諸光之胷臆不可忽也詩云呦呦鹿鳴食野之苹鹿得美草猶呼其類共食之况君子得美道可不告其執友而共學之乎何光區區仰告之勤而景仁却之之堅曽不熟察也來示云致中和天地位焉萬物育焉言帝王中和之化行則隂陽和動植之類蕃非為一身除病也夫和者大則天地中則帝王下則匹夫細則昆蟲草木皆不可須㬰離者也豈帝王則可行而一身則不可行耶人苟能無失中和則無病豈待巳病然後除之邪夫養生用中和猶割雞用牛刀所益誠㣲然生非中和亦不可養也譬如用勺水滌一器景仁見而責之曰夫水所以浮天載地生育萬物汝何得用之滌器如此則可乎不可乎又云孟軻養浩然之氣言榮辱禍福不能動其心非除病之謂也夫志氣之帥也苟不以中和養其志氣能浩然乎苟氣不浩然則榮辱禍福交攻之終日戚戚隕穫充詘能無病乎孔子曰仁者夀又曰大徳必得其夀彼仁與徳捨中和能為之乎又云向之病誠由飲食過中是過飲食之中非中和也光誠愚不知飲食之中非中和更為何物也光所以願者欲景仁舉措云為造次顛沛未始不存乎中和豈於飲食獨捨之乎此則尤所不觧也夫中和之道崇深閎逺無所不周無所不容人從之者如鳥獸依林去之者如魚蝦出水得失在此於彼奚損益焉而光重複反覆言之猶嘘温以助春吹寒以佐冬徒自困苦夫何為哉正身遇所忠愛不能自黙耳夫巳自未能力行而􅃍以強人此孔子所謂道聴而塗說宜人之不見信也然景仁明如離朱中和之益著於南山豈景仁所不能睹哉或者偶未之思耳曏者所䝉教誨何敢忘之但承其意不承其術謹當熟讀中庸以代素問巢原熟讀樂記以代考工記律歴志庶㡬有得於桑榆啟發其端皆自益友之賜也至幸至幸至感至感不宣光再拜景仁答中和書君實示諭在書為皇極在禮為中庸在天為中和在人為中和天不中不和則病人人不中不和則病天此所謂天人相與之道也孔子大聖不能救周之衰孟子養浩然之氣至大至剛不能救戰國諸侯之亂何則無位也若夫閭巷之間數十百家同一日時無貧富貴賤賢不肖或病或死此所謂天病人也天病人者人病天也豈一人之身所致哉有位者之職也君實體孔孟之道者家居而欲天地位焉萬物育焉難矣哉語曰子疾病孟子曰昨日病今日愈是病亦不能除也樂議終未見果决續附三篇皆前議闕者幸詳覧焉與景仁再論中和書光啟許人至得五日所賜書承氣體休佳至慰至喜示諭孔子孟軻亦病凡議論者以此所有佐彼所􅇅以此之是變彼之非告之以忠進之以直彼當察之以公受之以虚若饋獻之相交貿易之相資各得所求故可貴也光前獻樂議景仁已拒之今獻中和之論又不售若墨翟守千仞之城以待勍敵使光何自而入焉夫聚財異於用兵用兵則貴必勝聚財則貴多得今光屢有所獻皆不克納借使光服其不勝然於景仁亦何得哉豈可徒競無窮之辭請亦置是論䖏暑以來天氣頓凉望慎䕶自愛而巳景仁再答中和書以律生尺黄帝之法也以尺生律蔡邕及魏以來諸儒之誤也邕又謂銅律為銅龠君實以邕及魏晉以來諸儒之誤見貺某報以黄帝之法豈非諒直而忠告者邪至若人有生而中和者有生而暴戾者生而中和得禮樂以輔導之則為賢為聖以至於神而不可知生而暴戾得禮樂以教訓之則為善良為賢才矣不得禮樂則遂為惡人不可悛革者也至於天地位萬物育要須見在位設施之如何某以所有以所是奉獻而君實略不虚以受之􅃍欲置是二說二說皆未可置必是非定乃巳然後為公而不競於為彊辭也與范景仁第八書來論云以中和作樂及飬生之議未可置必是非有定乃止此議上有先聖下有來哲是非必有所定若但以筆舌相攻則光與景仁借令有老彭夀是非何時而定耶是以置之昨在鄉里作絶四及致知在格物二論輒敢録呈有不合於理䖏更告景仁攻難庶得求其是而從之勿以前不受教遂棄之也景仁復第八書皇祐中與君實官太常同議大樂阮天隠胡先生深詆李照非是最後房庶來又言二人者亦非是何則以尺而起律也又謂王朴之樂髙五律巳而依庶之說令制尺律龠三種而律才下三格與李照同是時朝廷特授庶一官罷歸庶亦自黜其言之不中然君實初與胡阮非李照者近時又以前史不可刋今按前史抵誤獻十條才録七條以呈請詳觀之於義理可刋不可刋大抵吾儕讀經史經有注釋之未安者史有談録之害義理者或為論或為辯以正之所以見為學之志而示於世注者子是也今夫樂自太祖病之太宗真宗仁宗講求之至必欲救正之列聖之所拳拳者盖以禮樂治國之大而不可一日慢况樂之太簇為黄鍾宫商易位哉君實今所主是前與胡阮非之者君實前非李照今復主之豈未思之邪王朴樂某亦同房庶非之雖髙五律君臣民事物不相干今復欲用之照樂得也胡瑗所作比王朴下半律仲更甞言之君實巳悉李照之樂聲雖發掦又下三律然君臣民事物皆失其位不可不深念之與范景仁第九書聞景仁欲奏所為樂此大不可恐為累非細是非未論或招悔吝尚可舉措所宜慎惜也區區之懇盡託尋叟布之左右願垂識察光寧可為景仁屈服景仁所論為是光所論為非不願景仁上此奏也且景仁所論果是但存文字傳於後世必有施行之時何必汲汲自薦於今日也切告切告不可不可景仁復第九書義有輕重事有取捨悔吝舉措輕也可捨也樂重也不可不奏前年定樂樂工有言其非者朝廷鞭配之樂之誤不及匿名事又一救得其義與悔吝取捨孰為重哉景仁又復書郊壇設黄道午陛執政大臣及從官賛引初獻而引亞獻終獻可乎誤則百官瞻望以為何如天地神祗宗廟社稷之靈以為何如此禮之失易見者也况樂隠奥而律吕君臣自有上下次序失則又不能知而天地神祗宗廟社稷亦見之矣以是而思不可不論重焉與景仁論積黍書六月中於夢得䖏連辱兩書自爾以通鑑欲進御結絶文字日不暇給以是􅇅然乆不修報計景仁雖恠之必知其非踈怠也光與景仁自皇祐中論樂迄今三十年筆舌徃返前後非一今更欲竭肺肝以仰告亦止於陳言重複秪増煩凟無益於析理也然景仁今書所詰責者亦不可不略自辨來示云光與胡阮前非李照今又復主之光曏時所上聞者正以房庶妄改漢書以就私意謂景仁不宜信而從之近日所上聞者止為景仁以今之太府尺即黄帝時尺恐不然耳至於音律髙下素非光所習學實不曉其是非亦不知王李胡阮之相去㡬律何甞敢不所主有所非邪此則所不敢當也來示云經有注釋之未安史有記錄之害義理者不可不正此則誠然然須新義勝舊義新理勝舊理乃可奪耳如浴乎沂十月五日星聚東井之類是也至於房庶所改漢書云一黍之起積一千二百黍之廣全不成文理豈可􅃍改舊書邪其餘則與景仁之志殊塗而同歸景仁以禮樂為治國之大而不可慢光豈以為小而可慢耶景仁吹律吕考鐘磬校尺量鑄鬴斛以求先王之樂光謂先王之樂大要主於中和而巳亦猶景仁謂衣有青赤黄白黒之異光謂主於温而巳矣景仁謂食有酸苦甘辛鹹之異光謂主於飽而已矣然則景仁豈能全廢光之說光豈敢盡不用景仁之論邪彼諸家言樂者各有十二律五音更相是非如五方之人言語不通飲食不同各謂我是而彼非孰能正之從景仁之樂視之則王朴君臣民事物全不相干李照皆失其位使二人復生於今日視景仁之樂未知其云何也若欲知其真是真非必有如伶倫后䕫師曠者始能知之耳今既未有其人願景仁且以所著樂說與光書合藏之以俟後世必有知樂者能辨之也光之言止於此自今景仁復以樂論相示亦不敢對也景仁答積黍書某與君實議樂前後㡬萬言不出於以尺起律以律起尺二事為異同爾其餘則汎同傳記證左而巳最先者君實以為房庶改漢書一黍之起積一千二百黍之廣八字某以為漢書前言分寸尺丈引本起黄鍾之長後言九十分黄鍾之長則八字者不可謂庶自為且庶亦不能為也尺量權衡皆以千二百黍在尺則曰黄鍾之長在量則曰黄鍾之龠在權衡則曰黄鍾之重皆千二百黍也豈獨於尺而為不成文理乎隋書諸儒之論始以一黍為一分之說若爾則黄鍾積實一千二百分而八百一十分者非也自蔡邕不能知謂銅律尺為銅龠尺黄鍾萬事根本尺量權衡之所亶者而諸儒尺至有一十五種逮今千餘年無人是正吾儕業已留意可不為終之乎君實以青赤黄白黒主於温酸苦甘辛鹹主於飽謂為某說不然五色者之於衣華於身而巳五味者之於食適於口而巳烏取於温飽而云乎哉見君實議樂正如是矣王朴之樂君臣民事物全不相干以仲吕為黄鍾而次比之知其然也李照之樂皆失位者以太蔟為黄鍾而次比之知其然也此非靣陳不可持國約石淙相見至時亦當一徃以究其說君實云必有伶倫后䕫師曠始能知之某以為三人亦不能知何則無律也書云律和聲禮云吹律聴軍聲傳云雖有師曠之聦不以六律不能正五音故知三人者有亦不能知之無律故也君實云示諭七條或然或否不知何者為然何者為否請一䟽示當為脩改某謂太府尺為黄帝時尺考李照之律與尺而知其然李照以太府尺縱黍而累之亦牽於隋書之說也然其樂比其律髙三律律是而樂非也何以知今之尺是黄帝時尺以黄帝之法為律以起尺十二律内外皆有損益其聲和而與古樂合以為鬴斛而其分數其輕重又與周官漢斛銘並同無毫釐之差以此知太府尺太府權衡皆黄帝時物也其法與黄帝之法同起於律也隋謂之開皇官尺歴唐以至於今者謂隋唐尺則人皆信之謂黄帝時尺則皆駭矣自隋以來至唐以及五代最為亂世而此物不變則自秦至三代至五帝而上黄帝又何疑哉千嵗之日今日是也謹此復命又小簡樂為小事為大事王朴李照胡瑗三家君實不决是非是慢而小之也但看今之君臣民事物可知之徃年孫宣公馮章靖宋之京非李照樂乃召阮逸胡瑗房庶令修之君實當時與胡阮同非李照者今所用乃李照樂君實云不改何也持國大地失脚正可以君實中和樂呼之五方之人言語不通信然至於歌樂則一豈有我是而彼非君實之言可全廢某之言不可不盡用何則葢無不是也古人之皆不到也十二律皆有損益而和也豈不為新義勝舊義新理勝舊理乎所恨至是未有人是之景仁答中和論中庸曰中者天下之大本其傳曰中為大本者以其含喜怒哀樂禮之所由生政教自此出也某以為中者對外而為言也君實曰中皆不近四旁之名也指形而言之則有中有外此書以中庸為名所指者盖徳也非形也某以為心者在身之中有知而無形者也請以堂論之身形也猶堂也對外而言則舉堂之内皆中也若以不近四旁為中則堂之中又有中焉非所謂舍藏之中乃得中之中也君實又曰喜怒哀樂之未發既謂之中則及其既發當謂之外某又以為發者由中出者也出而中節非外而何亦何必曰外又如君實之說此書以中庸為名指徳而言則有中有和若然則經當云喜怒哀樂之未發謂之中發而皆中節謂之庸也此書雖以中庸為名至於左右其說始終其義不害旁有證援也君實不喜老莊及輔嗣之說不敢復有稱引今直以本篇義明之經曰誠者天之道也誠之者人之道也誠者不勉而中不思而得從容中道聖人也誠之者擇善而固執之也故有博學審問慎思明辨之說君實又曰曷若治心養氣專以中為事動静黙語未甞不在乎中此正所謂擇善而固執之誠之者也至於不勉而中不思而得從容中道豈治心養氣者所能辦哉所謂誠者非别有一物也但誠其心而巳矣心至於不勉不思而中道至矣譬如鍾大叩之則大鳴小叩之則小鳴以其中虚也大小自外而至者也鐘豈預設小大於中而應之哉所謂過與不及者亦因時稱事而為之中也時有異變事有異宜亦豈可預設中於心而待之也荀卿大學君實之所信也其論心不過曰虚曰静曰定虚静定雖非兀然如木石亦豈可形容哉孟子曰操則存捨則亡出入無時莫知其郷惟心之謂歟亦言心之無定在也書曰惟精惟一允執厥中盖言心能精一則信執其中也君實既以大本之中便為無過與不及則其下豈當復云發而皆中節也經云惟至誠為能盡其性盡其性則能盡人之性盡人之性則盡物之性盡物之性則可以賛天地之化育然則位天地育萬物盖聖人得位者之所能也孔子曰予欲無言天何言哉四時行焉百物生焉此聖人有其道無其位者也經之末又引子曰聲色之於化民末也詩曰徳輶如毛毛猶有倫以毛為猶有倫則又明以上天之載無聲無臭則聖人之心之徳與天地叅矣但可以意通而不可以形得也今夫穹然而體髙蒼然而色正者天之形也雷風日月山澤為天之用者聖人深拱法宫其迹則百官承序萬物樂生究其用盖有不可見者矣易曰形而上者謂之道形而下者謂之器語器則自天以下皆器也語道則不可見者皆道也孟子曰大而化之之謂聖聖而不可知之之謂神非立天下大本者其孰能與於斯愚故曰明乎此者其見天地聖人之心乎韓秉國書維啟春氣斗温伏惟動止安和相見之期竟未有定殊増耿耿見與景仁書似恠鄙拙論議於公有所未盡者向讀中和論疑中字觧釋未甚明然未敢决然以為非也今試妄言煩公一閲是非幸復垂諭以觧愚蔽胷中所欲言者非可以書盡惟冀自愛重而巳謹手啟不宣秉國論中和書中之說有二對外而為言一也無過與不及一也喜怒哀樂之未發漠然無形及其既發然後見其中節與不中節也故喜怒哀樂之未發謂之中發而中節謂之和人之心虚則明塞則暗虚而明則燭理而無滯應物而不窮喜怒哀樂之發有不中節乎中節則無過與不及矣有不和乎在易之卦虚其中曰離為日為南方為火王弼觧復其見天地之心云天地以本為心者也雷動風行運變萬化寂然至無是其本也春萌夏長秋落冬閉日月之行星斗之運此天地之迹可見於外者也張官置吏發􅃅施令事功之修舉民物之茂遂此聖人治天下之迹可見於外者也若其所以迹者盖莫得而擬議也凡物莫不有此本又衆本之所自出故曰大本凡物不得其節則過與不及施於用則為蔽塞為睽乖為不行為患難無此四者和矣故曰達道明乎此者其見天地聖人之心乎傳家集巻六十二欽定四庫全書傳家集巻六十三宋司馬光撰書啓六答韓秉國書元豐八年二月二十九日作光啓丁通直来蒙貺書審起居安和至喜示諭見與景仁書似恠論議有所不同此何言哉朋友道廢乆矣光述中和論所以必欲呈秉國者正為求切磋琢磨庶㡬近是耳豈欲秉國雷同而巳雅聞秉國有論光不勝其喜故因景仁請見之何謂恠也然光至愚於秉國之論猶有所未逹者請試陳之惟秉國擇焉秉國云中之說有二對外而言一也無過與不及一也此誠如諭然中者皆不近四旁之名也指形而言之則有中有外指徳而言之則有和此書以中庸為名其所指者盖徳也非形也如秉國所諭則中庸應云喜怒哀樂之未發謂之中及其既發謂之外不則云喜怒哀樂之未發謂之虚發而皆中節謂之和乃相應也秉國又云虛則明塞則暗此誠如所諭然所謂虛者非空洞無物之謂也不以好惡利害蔽其明是也夫心動物也一息之間升天沉淵周流四海固不肯兀然如木石也惟賢者治之能止於一擇其所止莫如中庸故虞書曰惟精惟一允執厥中也凡人固有無喜怒哀樂之時當此之際其心必有所在小人則追求嗜好靡所不之帷君子􅀎自處於中庸之地不動以待事也大學曰知止而後有定定而後能靜靜而後能安安而後能慮慮而後能得又曰為人君止於仁為人臣止於敬為人子止於孝為人父止於慈與國人交止於信言所止各有在也荀子曰徳操然後能定能定然後能應能定能應夫是之謂成人亦言所定在於徳也又曰人何以知道曰心心何以知曰虚一而静心未嘗不蔵也然而有所謂虚不以所已蔵害所將受謂之虚心未嘗不兩也然而有所謂靜不以夢劇亂知謂之靜然則虛者固不為空洞無物靜者固不謂兀然而木石也凡曰虛曰靜曰定云者如大學與荀卿之言則得中而近道矣如佛老之言則失中而逺道矣光所以不好佛老者正謂其不得中道可言而不可行故也借使有人真能獨居宴坐屏物棄事以求虛無寂滅心如死灰形如槁木及有物歘然来感之必未免出應之則其喜怒哀樂未必皆能中節也曷若治心養氣専以中為事動靜語黙飲食起居未始不在乎中則物雖輻湊横至一以中待之無有不中節者矣秉國又引王輔嗣觧復其見天地之心以證虚無為衆本之所自出夫萬物之有誠皆出於無然既有則不可以無治之矣常病輔嗣好以老莊觧易恐非易之本指未足以為據也輔嗣以雷動風行運變萬化為非天之心然則為此者果誰邪夫雷風日月山澤此天地所以生成萬物者也若皆寂然至無則萬物何所資仰邪天地之有雲雷風雨猶人之有喜怒哀樂必不能無亦不可無也故易曰雲行雨施品物流形詩曰君子如怒亂庶遄沮君子如祉亂庶遄已但動靜有節隠見有時不可過與不及過與不及皆為災害必得中然後和和然後能育萬物也自有天地以来陽極則隂生隂極則陽生動極則靜靜極則動盛極則衰衰極則盛否極則泰泰極則否若循環之無端萬物莫不由之故曰一隂一陽之謂道此皆天地之心然復者陽生之卦也天地之大徳曰生故聖人賛之曰復其見天地之心乎言天地之道雖一徃一来本以好生為心也易道幽深而輒敢妄為之觧其罪甚大亦不自識其是與非也抑求之空言不若驗之實事竊聞秉國平日好習靜光不勝區區願秉國試輟習靜之心以為習中之心動靜語黙飲食起居皆在於中勿湏臾離也乆而觀其所得所失孰少孰多則秉國必自得之矣豈待光之煩言哉愚慮如此所不及者不惜更示不宣光再拜答秉國第二書元豐八年三月十五日作光啓辱四日所恵書誨以所未諭幸甚幸甚書文甚多援据甚廣光欲一一條對則恐逐枝葉而忘本根徒費紙劄視聴無益於進道是宜直指其大要而言之今光與秉國皆知中庸之為至徳而信之矣所未合者秉國以無形為中光以無過與不及為中此所謂同門而異户也夫喜怒哀樂之未發常設中于厥心豈有形於外哉荀卿太學所謂虛靜定者非寂然無思慮也虚者不以欲惡蔽其明也靜者不以怵迫亂其志也定者不以得喪易其操也中庸所謂中者動靜云為無過與不及也二者雖皆為治心之術其事則殊矣今秉國合而為一恐未然也周公思兼三王以施四事有不合者仰而思之夜以繼日孔子終日不食終夜不􅃦以思道豈得寂然無思慮哉苟為不思又不慮直情徑行雖聖人亦恐喜怒哀樂不能皆中節也中庸所謂誠者天之道言聰明睿智天所賦也誠之者人之道言好學從諫人所為也不勉而中不思而得從容中道謂聖徳之已成者也擇善而固執之愽學審問慎思明辨篤行謂賢人之好學者也人一能之已百之謂愚者之求益者也夫不歴坱埤不能登山不㳂江河不能至海聖人亦人耳非生而聖也雖聰明睿智過絶於人未有不好學從諫以求道之極致由賢以入於聖者也故孔子曰我非生而知之好古敏以求之者也又曰吾十有五而志於學至於七十然後從心所欲不踰矩以孔子之徳性猶力學五十有五年乃能成其聖况佗人不學而能之乎若謂聖人生知自天必不可及則顔子何為欲罷不能孟子何為自比於舜哉舜戒羣臣曰予違汝弼汝無面從使舜生而聖不勉而中不思而得夫又何弼哉詩稱文王不聞亦式不諫亦入言其性近於道處師弗煩在傳弗勤非謂不學而不諌也光前書論中已備矣恐秉國尚未詳覽而熟察也光前書云願秉國動靜語黙飲食起居皆在於中勿湏臾離也乆必自得之秉國亦嘗留意采其言乎今有人饋食於吾二人者吾二人未嘗而先爭之一人曰鹹一人曰酸曷若相與共嘗則知其味矣又有饋藥於吾二人者吾二人未服而先爭之一人曰寒一人曰温曷若相與共服則知其驗矣中美食也良藥也光願與秉國强勉而試行之師曠曰秉燭之明孰與夜行吾人雖老矣繼今而學猶庶㡬其有益也徃来之言奚以多為答兩浙提舉趙宣徳㞦書光頓首再拜比見邸報聞先大資少保違去盛世驚怛惋痛𠂻懐如割以道逺無便無由發疏致慰昨晚兵人来忽辱示問并鄭君所為行狀欲令光作誌文光實何人望先公名徳何啻倍蓰什百曏獲接侍之乆蒙知顧之厚今得論譔盛美自託不朽何幸如之顧以光不為人作碑誌已十餘年所辭拒者甚多徃嵗有孫令以書見屬欲令光譔其伯父之翰碑光時復書叙不可為之故頗詳是後又辭王樂道曾子固等數家皆以此書呈之去年富公初薨光往弔酹其孤朝奉在草土中號哭自擲必欲使光作墓誌又遣人来垂諭至于三四光亦以所以語孫令者告之竟辭不為今若獨為先公為之則是有所輕重厚薄足下試以尊意度之謂光敢為之乎不敢為乎此則不待光辭之畢足下必盡察之矣况先公清節直道著於海内皎如列星决不沉沒佗年所以取信於世者在國史列傳豈待光鄙陋之文然後彰彰乎然方今羣}
