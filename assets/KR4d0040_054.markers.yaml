  - {type: variant, offset: 372, length: 0, content: '', WYG: 所舉孫凖有罪自劾第二劄子臣先舉孫凖行義無缺堪充館閣之選如後不如所舉甘當同罪近聞凖與妻家爭訟罰銅六斤臣奏乞連坐責降伏䝉聖慈批還云孫凖為家私小事罰銅安有連罪伏緣臣舉状稱凖行義無缺今凖閨門不睦妻妾交爭是行義有缺於臣為貢舉非其人臣不敢逃刑况臣近奏十科或有不如所舉其舉主從貢舉非其人律科罪雖見為執政朝廷所不可輟者亦須降官示罰臣備位宰相身自立法首先犯之此而不行何以齊衆乞如臣所奏從貢舉非其人律施行所貴率厲羣臣審慎所舉取進止}
