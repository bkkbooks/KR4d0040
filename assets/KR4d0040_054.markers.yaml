  - {type: variant, offset: 4, length: 1, content: 公, WYG: 休兵息民夷夏之心安不幸虜人有一語不遜一騎犯邊則此詔不可復下無何臣在病假不得靣論人心不同為衆所奪日復一日遷延至今虜先遣使來直求侵地指陳兵端辭意寖慢前所議詔書已不可下矣既失此機㑹即日使至應答亦難若悉從其所請則彼益驕而無厭若悉拒而不從則邊患由此而起今就二者之中寧為百姓屈已少從所請以紓邊患不可激令憤怒致興兵犯塞以困生民所以然者靈夏之役本由我起新開數寨皆是彼田今既許其内附豈可猶靳所侵地而不與彼必曰我自天子新即位卑辭厚禮以事中國庻㡬歸我侵疆今猶不許則是恭順無益不若以武力取之彼小則上書悖慢大則攻䧟新城當是之時不得已而與之其為國家之耻無乃甚於今日乎以小喻大譬如甲奪乙田未請而與之勝於請而後與若更請而不與則彼必興鬭訟矣此是非利害明如白黒臣竊慮進呈之際羣臣猶有見小忘大守近遺逺惜此不毛無用之地結成覆軍殺將之禍兵連不觧為國家憂伏望陛下决自聖志勿聽浮言為兆民計}
