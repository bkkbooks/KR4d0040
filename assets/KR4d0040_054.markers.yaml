  - {type: variant, offset: 5, length: 0, content: '', WYG: 曰善治財賦公私俱便科舉有官人十曰練習法令能斷請讞科舉有官人應職事官自尚書至給舎諫議寄禄官自開府儀同三司至太中大夫職自觀文殿大學士至待制每嵗須得於十科中舉三人非謂每科各舉三人謂各随所知某人堪充某科共計三人其狀云臣竊見某人有何行能並須指陳事實不得徒餙虚辭位在上者得舉在下之人位在下者不得舉在上之人臣今保舉堪充某科如䝉朝廷擢用後不如所舉謂若舉行義純固而違犯名教節操方正而佞邪險躁智勇過人而愚懦致敗公正聰明而私曲昏闇經術精通而不能講讀學問該愽而空踈牆面文章典麗而鄙拙紕繆善聽獄訟而寃滯失實善治財賦而病民耗國練習法令而屢致出入及犯正入已贓臣甘伏朝典不辭候奏狀到日付中書省擇勤謹吏人二人専切收掌仍十科各置簿畫時抄録年月日某官姓名舉某官姓名别置合舉官臣僚簿嵗終不舉及人數不足按劾施行或遇在京及外方有事須合差官體量相度㸃檢磨勘剗刷催促推勘定奪則委執政親檢逐簿各隨所舉之科選差令試管勾上件事務若能辦集即别置簿記其勞績遇本科職任有闕謂若經筵或學官有闕即用行義純固經術精通學問該愽等科人臺諫有闕即用節操方正科人之類則委執政親檢逐簿選名實相稱或舉主多有勞績之人補充仍於本人除官勅告前盡開坐舉主姓名於後或不如所舉其舉主從貢舉非其人律科罪犯正入已贓舉主减三等科罪若因受賄徇私而舉之罪名重者自從重法期在必行不可寛宥雖見為執政官朝廷所不可輟者亦須降官示罰即朝廷臨時因事特詔舉官謂若舉知河渠馬牧等處之類不在十科之内者有不如所舉亦同此法所貴人人重慎所舉官皆得人取進止起請科場劄子元祐元年上臣伏覩朝廷改科場制度第一場試本經義第二場試詩賦第三場試論第四場試策試新科明法除斷案外試論語孝經義奉聖㫖令禮部與兩省學士待制御史臺國子監司案集議聞奏臣竊有所見不敢不以聞凡取士之道當以德行為先文學為後就文學之中又當以經術為先辭采為後是故周禮大司徒以六德六行賔興萬民漢以賢良方正孝亷質樸敦厚取士中興以後取士尤為精慎至於公府掾屬州從事郡國計吏丞史縣功曹鄉嗇夫皆擇賢者為之苟非其人則為世所譏貶是以人人思自砥礪教化興行風俗純厚乃至後世陵夷雖政刑紊於上而節義立於下有以姧囬巧偽致富貴者不為清議所容此乃德化之本原王者所先務不可忽也熹平中詔引諸生能文賦者待制鴻都門下蔡邕力争以為辭賦小才無益於治不如經術自魏晉以降始貴文章而賤經術以詞人為英俊以儒生為鄙樸下至隋唐雖設明經進士兩科進士日隆而明經日替矣所以然者有司以帖經墨義試明經專取記誦不詢義理其弊至於離經析注務隠争難多方以誤之是致舉人自㓜至老以夜繼晝腐脣爛舌虚費勤勞以求應格詰之以聖人之道瞢若靣牆或不知句讀或音字乖訛乃有司之失非舉人之罪也至於以賦詩論策進士及其末流專用律賦格詩取捨過落擿其落韻失平側偏枯不對蜂腰鶴膝以進退天下士不問其賢不肖雖頑如跖蹻苟程試合格不廢髙第行如淵騫程試不合格不免黜落老死衡茅是致舉人專尚辭華不根道德渉獵鈔節懐挾勦剽以取科名詰之以聖人之道未必皆知其中或遊處放蕩容止輕儇言行醜惡靡所不至者不能無之其為弊亦極矣神宗皇帝深鑒其失於是悉罷賦詩及經學諸科專以經義論策試進士此乃革歴代之積弊復先王之令典百世不易之法也但王安石不當以一家私學欲盖掩先儒令天下學官講觧及科場程試同已者取異已者黜使聖人坦明之言轉而䧟於竒僻先王中正之道流而入於異端若已論果是先儒果非何患學者不弃彼而從此何必以利害誘脅如此其急也又黜春秋而進孟子廢六藝而尊百家加之但考校文學不勉勵德行此其失也凡謀度國事當守公論不可希時又不可徇俗冝校是非之小大利害之多少使質諸聖人而不謬酌於人情而皆通稽於上古而克合施之當世而可行然後為善也今國家大議科場之法欲盡美以臣所見莫若依先朝成法合明經進士為一科立周易尚書詩周禮儀禮禮記春秋孝經論語為九經令天下學官依注疏講說學士愽觀諸家自擇短長各從所好春秋止用左氏傳其公羊糓梁陸淳等說並為諸家孟子止為諸子更不試大義應舉者聴自占習三經以上多少隨意皆須習孝經論語於家狀前開坐習某經某經又每歲委升朝文官保舉一人不拘見在任不在任是本部非本部各舉所知若係親戚亦於舉狀内聲說其舉狀稱臣竊見某州某縣人某甲有何行能臣今保舉堪應經明行修科於後不如所舉臣甘當連坐不辭候奏狀到朝廷下禮部貢院置簿各分逐路抄録本人姓名注舉主官位姓名於其下仍下本州出給公據付本人收執及令本州亦如貢院置簿抄録准備開科場日考驗公據其舉狀既上之後若所舉之人犯贓私罪至徒已上情理重及違犯名教候斷訖仍收坐舉主奏乞朝廷取勘施行其人未及第者减五等已及第者减叄等坐之一如舉選人充京官法臣竊料此法初行其奔競屬請固不能免若朝廷必坐舉主毋有所赦行三五人後自皆慎擇其人不敢妄舉如此則士之居鄉居家獨處闇室立身行已不敢不慎惟懼玷缺有聞於外矣所謂不言之教不肅而成不待學日訓月察立賞告訐而士行自美矣每遇開科場其有舉主者自稱應經明行修舉仍於所投家狀前開坐舉主者位姓名有司檢㑹簿上合同方許收接其無舉主者只稱應鄉貢進士舉如常法每舉人三人以上自相結為一保止保委是正身及是本貫不曽犯真刑無隠憂匿服此外皆不保其本州及貢院考試並依舊法差封彌謄録監門廵鋪官程試之日嚴加檢察如舊試經學諸科法各令求已毋得移坐位相從託商量相聚傳義傳本懷挾代筆違者扶出第一場先試孝經論語大義五道内孝經一道論語四道先須備載正文次述注疏大意次引諸家異義次以已見評其是非以援據精詳理長文優者為通其次為粗援㨿踈略理短文拙者為否三通以上為合格不合格者先次駮放合格者榜引次場就試如舊試經學諸科法或合格人數太少則委試官臨時短中求長詳酌放過次場試尚書次場試周禮次場試儀禮次場試禮記次場試春秋次場試周易大義各五道令舉人各隨所習經書就試考校過落如孝經論語法次場論二道一道於儒家諸子書内出題一道於歴代正史内出題次場試策三道皆問時務考策之日方依觧額及奏名人數定去留編排髙下以經數多者在上經數均以策論理長文優在上其經明行修舉人並於進士前别作一項出榜解發及奏名至御前試時務策一道千字以上封彌官於號上題所明經及舉主人數候考校詳定畢編排之時亦以經數多者在上經數均以策理長文優者在上文理均以舉主多者在上其經明行修舉人亦於進士前别作一項編排先放及第其推恩注官比進士特加優異他時選擇清要官館閣臺諫等並須先取經明行修人其舉主姓名常於官告前聲說如此則舉人皆務尊尚經術窮聖人指趣不敢不精旁覽子史不敢不慱又不流放入於異端小說講求時務亦不敢不知所得之士既有行義又能明道又能慱學又知從政其為國家之用豈不賢於今日之所取乎所有今來乞復詩賦者皆嚮日老舉人止習詩賦不習經義應舉不得故為此說欲以動揺科場制度為已私便朝廷若不欲棄捐舊人候將來科場進士有特奏名者令試詩賦隨其優劣等第推恩亦無傷也不可以此輕改成法復從弊俗誤惑後生若以為文章之士國家所不可無即乞許人於試本經合格日投狀乞試雜文於試論次場引試或古詩或律詩或歌行或古賦或頌或銘或賛或四六表啟臨時委試官出題目試某文定篇數字數共須及五百字以上取辭采髙者為合格候得觧及奏名及第日編排姓名髙下各在經數同等人之上如此則文章之士亦不乏矣至於律令勅式皆當官者所須何必置明法一科使為士者豫習之夫禮之所去刑之所取為士者果能知道義自與法律冥合若其不知但日誦徒流絞斬之書習鍜鍊文致之事為士已成刻薄從政豈有循良非所以長育人材敦厚風俗也朝廷若不欲廢弃巳習之人其明法曽得觧者依舊應舉未曽得觧者不得更應則收拾無遺矣臣愚所見如此伏乞以臣所奏及禮部等官所議榜國子監門及編下諸州有州學處榜州學門令舉人限一月内投狀指定何法為善仰本州附遞以聞候到京齊足更委其他執政㸔詳參酌從長施行取進止}
