  - {type: variant, offset: 641, length: 0, content: '', WYG: 論監司守資格任舉主劄子元祐元年上臣竊見御史韓川上言諸路監司不當拘限資格專任舉主當令宰相自加選擇竊緣常調之人不可不為之立資格以抑躁進塞倖門若果有賢才朝廷自當不次選擢豈拘此制凡年髙資深之人雖未必盡賢然累任親民歴事頗多知在下艱難比於元不歴親民便任監司者必小勝矣朝廷執政止八九人若非交舊無以知其行能不惟渉狥私之嫌兼所取至狹豈足以盡天下之賢才若采訪毁譽則愛憎毁譽情偽萬端與其聴逰談之言曷若使之結罪保舉故臣奏設十科以舉士其中一科公正聦明可備監司誠知請屬挾私所不能無但有不如所舉者嚴加譴責無所寛宥則今後自然慎擇不敢妄舉矣至如楚潜等雖無聲名安知其無實用俟其到官無狀廢職并舉主坐之亦未為晩取進止薦王大臨劄子元祐元年八月八日上大臨除太學錄已卒臣竊見鄆州處士王大臨通經術善講説安仁樂義譽髙鄉曲貧不易志老不變節曏嘗有詔敦遣固辭不起伏望聖慈召致京師寘之學官為士類矜式取進止乞官陳洙一子劄子元祐元年上臣竊以嘉祐中仁宗皇帝未有繼嗣故殿中侍御史陳洙奏乞擇宗室之賢者立以為後既發奏状謂家人曰我今日入一文字言社稷大計若得罪大者死小者貶竄汝輩當為之備下奏状者未返洙得疾而卒臣時為諌官親聞見此事竊憐其亡身狥國繼之以死而天下莫之知近見故職方員外郎張術亦以當時乞建儲貳子申伯特補太廟齋郎伏望聖慈依張術例除一子官以旌忠義取進止辭明堂宿衞劄子元祐元年上臣先奉聖㫖將來明堂特與免侍祠攝事導駕及稱賀陪位肆赦立班止令宿衞在於人臣恩禮優厚無以復加捐生隕命不足酬報然臣日近患左足掌底腫痛全然履地不得跬歩不能行未知痊愈之期所有將来明堂宿衛亦恐祗赴不得伏望聖慈特賜矜免乞恩不已慙懼無地取進止辭提舉修實錄劄子元祐元年上臣先奉勅差提舉修神宗皇帝實録臣自受命以來以衰羸多病罕曽得到局供職日近又患左足腫痛不能履地日甚一日未有痊愈之期所有修神宗皇帝實錄伏乞别賜差官提舉取進止進呈}
