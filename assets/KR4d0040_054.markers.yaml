  - {type: variant, offset: 280, length: 0, content: '', WYG: 傳家集巻五十四欽定四庫全書傳家集巻五十五宋司馬光撰章奏三十八申明役法劄子元祐元年上臣先曽上言乞直降勅命應天下免役錢一切並罷其諸色役人並依熈寧元年以前舊法人數委令佐揭簿定差䝉朝廷一一如臣所請臣竊聞降勅之初百姓莫不喜恱一兩月間州縣定差已了别無詞訟人情安帖無何續有顧募不足方行定差指揮人始疑惑既而屢有更張號令不一又轉運使各以已見欲合本路共為一法不令州縣各從其冝是致州縣惶惑不知所從或已差役人却放或已放顧人却收或依舊用役錢顧人或不用錢招人充役朝夕不定上下紛紜徃徃與二月六日勅意相違竊縁臣元初起請及朝廷所降勅節文明言委州縣官㸔詳依今來指揮若有方礙致施行未得仰具利害擘畫申州州申轉運司轉運司奏聞委執政官再加㸔詳隨冝修改别作一路一州一縣勅施行務要曲盡其冝豈是當日所言一字不可移易但患轉運司州縣不肯奏陳臣今欲申明元初起請内聲說不明不盡事件謹具畫一如後一臣起請雖云依熈寧元年舊法人數定差若舊法人數有於今日不可行者即是妨礙合申乞改更人數或太多或太少惟本州縣知得的確合消數目合酌中立額申乞依數定差朝廷難為遥度一臣起請雖云若所差人不願充役任便選顧有行止人自代其顧錢多少私下商量若所顧之人邀勒被差之人廣求顧直官司亦當裁定不得過自來官中顧錢之數其州縣官員即不得指占所顧之人令被差之人顧覔一臣起請雖云見􅃹役人候差到役人各放令逐便者若所顧之人自有田産情願充役者亦自可依舊存留又曹司一役新差之人多不諳熟書算行遣及案下文字未曽交割合留所顧之人給與顧錢令與新差之人同共行遣限半年内交割了畢才放逐便一臣起請云今日衙前陪備少於曏日不至破家若猶以為户力難任即乞於官户僧道單丁女户有屋業每月掠錢及十五貫莊田中年所收斛斗及百石以上者並等第出助役錢不及此數者與放免臣意以為十口之家歲收百石足供口食月掠房錢十五貫足供日用二者相須此外有餘者始令出助役錢非謂止收百石即令助役也若猶嫌太少及所收掠課利難知實數即乞應係第三等以上令出助役錢第四等已上放免若本州坊場河渡等錢自可支酬衙前重難分數得足則官户等更不消出助役錢一從来諸州招募人投充長名衙前若招募不足方始差到鄉户衙前此自是舊法今來别無改更惟是舊日將坊場河渡折酬長名衙前重難令自出賣今來官中出賣坊場河渡收錢依分數折酬長名衙前重難只此與舊法有異若鄉户差補已足續有投名者即先從貧下放鄉户歸農鄉户願投充長名亦聴一臣起請委逐縣㸔詳具利害擘畫申州本州類聚擇其可取者擘畫申轉運司轉運司類聚諸州所申擇其可取者擘畫奏聞朝廷伏縁知逐處民間利害子細轉運司不如州州不如縣竊慮逐縣逐州有擘畫得事理切當而本州及轉運司抑遏刪去不以上聞致勅下之日依舊妨礙施行未得欲乞更降指揮下州縣如有似此擘畫切當被在上刪去者許逐縣直申轉運司本州直申奏所貴下情無壅曲盡事冝仍乞降指揮下詳定役法所只得以諸路州縣申到利害詳其可否立為定法其不當職之人為髙竒之論不切事情者不得施行亦不可將一路一州一縣利害作海行條貫一詳定役法所奏請行下指揮若有妨礙難行之事亦乞如臣起請委逐路州縣看詳具利害擘畫申上隨宜修改右臣所言若有可取乞遍下諸州縣除此外並依二月六日所降勅命施行取進止乞罷保甲招置長名弓手劄子元祐元年上臣竊見府界及三路保甲雖罷團教猶冬教一月於民有損於官無益不若盡罷之便何則比於團教之時民間勞費雖什减六七然猶有三四此所謂於民有損也朝廷每歲遣使按閱所費金帛以百萬計而終無所用之此所謂於官無益也臣以為不若盡罷之便自置保甲以來盗賊倍多所以然者鄉村無頼子弟乍渉城市聞見紛華自恃身為保丁坐索本家供給飲愽遊蕩習以成性今雖罷團教不肯復歸南畆服田力穡逸欲既深資用不足既家藏利兵又身挾武藝由是邀結黨友群行攻劫父兄不能禁州縣不能制此自然之勢也是以數年以來年不甚饑而府界三路盗賊縱横入縣鎮殺官吏若遇蟲蝗水旱大饑之歲將若之何此不可不為之先慮也以臣愚見莫若盡罷府界及諸路保甲據逐縣主户數目盗賊多少委提㸃刑獄相度每若干户置長名弓手一人與免户下租稅支移折變及夫役諸般差徭科配一無所預務為優假使人歆慕每十人置節級一員五十人置十將一員百人置員寮一員二百人以上置指揮使副指揮使各一員雖不及二百人亦置指揮使副指揮使名目盡􅃹一縣弓手以為賞功資級其節級始初且令本縣令佐依上下名次或選有部轄者權管候有長行捉殺到强盗一人即補充正節級替下權管之人自後每捉殺到强盗一人依此遷一級若未有闕且為守闕不得管人候有闕日補正其累功勞遷至正指揮使滿三年以上又曽捉殺到强盗三人從來不曽犯贓罪者仰本縣官吏結罪保明申州本州官吏結罪保明申奏乞朝廷與於三班借差内安排若遇有强惡賊人朝廷臨時别立賞格者不在此限如此則保申中勇健之士見前有出官之望來應募者必多除第一第二等户物力髙强合充重役不得應募外其餘但於本縣有户籍田産不以等第髙下並許投充長名弓手永無觧役之期若第一第二等户情願以一丁為弓手餘丁充重役者亦聽若一人闕額有二人以上爭投者即委令佐揀試武藝髙强者充之如此則本縣勇健者皆充弓手其餘懦弱者雖使之為盗亦無能為患若見充長名弓手人有勇力武藝衰退者許令外人指名比較若勝於舊者即令充替如此則不須教閱武藝自然長得精熟仍委本州及提㸃刑獄常切覺察令佐有取捨不公者取勘依法施行若應募未滿見今鄉差弓手之數即且令鄉差弓手相兼祗應候招到長名弓手一人即替鄉差弓手一人歸農其鄉差弓手願投長名者亦聴若長名弓手及百人以上即令分一半作兩畨二百人以上每百餘人分作一畨並年終交替其上畨者隨縣尉逐捕盗賊自節級以上各令管所轄之人若所轄之人有小可過犯許一面區分不得過小杖十下若所轄之人敢陵犯本轄人員者杖一百毆者徒一年雖權管亦同本轄人員若於所轄人處取受財物並依律科罪犯贓罪杖者若係管轄權管即降充長行下名若係正人員即降一資自後每捉殺到强盗兩人始當一人罪至徒者不以權正並降充長行下名自後每捉殺到强盗三人始當一人雖許遷資並係額外不得管人不得出官若遇下畨則不相管轄亦無階級其下畨者自十將以下各隨所居之處與耆長同覺察本管地分内曽為强盗之人及窩藏之家凡為强盗者不肯於本管地分作過須在他處盖恐累及本地分捕盗人無所自容故也其本地分捕盗人徃徃知之莫肯發舉盗既得財分贓則絶迹逺遁其賊發地分捕盗人雖欲擒捕莫知其處官中雖立三限科校終無所益由此賊發地分捕盗人每有賊發莫肯申舉若變主懦弱則多方抑塞不令聲賊變主强梁則共陪所失之財勸和使休是致羣盗無所忌憚日益昌熾又告捕得賊多被賊人讎報焚燒莊舎屠害老少其賞錢豈冝留滯而徃徃為州縣沮難有司靳惜動有經年請領不得使之觧體欲乞今後應賊發地分其捕盗人更不立三限科校捕盗官亦不批罰只以擒賊多少論其功賞若敢抑塞隠蔽從嚴法施行仍每州各隨大小賊盗多少借官錢數千貫專充告捕賞錢每獲强盗勘得從來住止窩藏去處候斷遣巳了委本州長吏當日先以官錢支給告捕之人即移牒出賊州縣勾追住止窩藏地分捕盗人科不覺察罪弓手杖一百耆長杖八十壯丁笞四十先籍没賊人及窩藏家財産償所支賞錢外其不足之數令捕盗人等均攤限壹月催足津般赴給賞州軍補填官錢若路逺難以津般則各於本州官錢内關牒折兊其强惡賊人朝廷特於常法外多立賞錢者自以省錢充不在捕盗人均攤之限如此賊盗則無所容身必思改過自新若果行此法府界三路既免教閲勞費之患無頼子弟又有所歸投得以羈縻諸路正鄉村之名復國家舊制勇健之士前有仕進之望爭討賊立功不待教閱而弓手武藝自然不敢衰退不須㸃差而鄉兵自足兼有所用人雖衆多而上下有綱紀不敢相侵暴賊發地分捕盗人不知賊處免虚受刑責出賊地分為累及身不敢蔽匿景跡之人被盗之家無人抑塞有所伸訴賊盗窮窘無所容身稍冀衰息取進止乞令六曹刪减條貫白劄子勘㑹近歲法令尤為繁多凢法貴簡要令貴必行則官吏易為檢詳咸知畏避近㨿中書門下後省修成尚書六曹條貫共計三千六百九十四冊寺監在外又㨿編修諸司勅式所申修到勅令格式一千餘巻冊雖有官吏彊力勤敏者恐不能遍觀而詳覽况於備記而必行之其間條目苛密抵捂難行者不可勝數昨者條貫初下吏部侍郎左選差注不行者數日不免再有奏陳復依舊法必料諸曹條貫皆有似此拘礙難行者今欲特降指揮下尚書六曹委長貳郎官同共㸔詳本曹新舊條貫内有海行已有及全無義理於事無益防禁太繁難為遵守者盡令刪去惟取紀綱大體切近事情朝夕不可無者方始存留作本司條貫限兩月申奏施行傳家集巻五十五欽定四庫全書傳家集巻五十六宋司馬光撰章奏三十九乞先行經明行修科劄子元祐元年上臣先上言乞每嵗委陞朝文官保舉一人應經明行修科與進士並置程試一如進士惟於及第後推恩優異以勸勉天下舉人使敦修士行昨已有朝㫖來年科塲且依舊法施行竊聞近有聖㫖其進士經義並兼用注䟽及諸家之説或已見仍罷律義先次施行臣竊詳朝廷之意盖為舉人經義文體専習王氏新學為日已久來年科塲欲兼取舊學故有此指揮令舉人豫知而習之臣所乞置經明行修科者欲使舉人知向去科塲朝廷敦尚行義不専取文學所以美教化厚風俗比於經義文體尤為要切宜使舉人豫知欲乞亦降朝㫖先次施行况與進士舊法兩不相妨取進止}
