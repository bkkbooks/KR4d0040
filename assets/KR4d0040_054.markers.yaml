  - {type: line-break, offset: 0, content: '', id: KR4d0040_SBCK_054-1a01}
  - {type: variant, offset: 0, length: 1, content: 温, WYG: 止乞進呈文字劄子元祐元年上臣先奉聖㫖權免赴前後殿起居許乘轎子三日一至都堂聚議又許肩輿至内東門外令男康扶掖至小殿引對臣以恩禮大重不敢輒當只乞於延和殿引見以兩足無力若無人扶掖委實全拜起不得乞今來入見及將來每遇入對並許令臣男康入殿遇拜時扶掖奉聖㫖令乗轎子至崇政殿門外於延和殿垂簾日引對餘並依前降指揮臣今月十八日合至都堂遇其日垂簾臣欲隨執政赴延和殿常起居及上殿進呈文字竊慮閣門以前來聖㫖有免赴起居字及只云三日一至都堂後來聖㫖無將來每遇入對並許令臣男康入殿遇拜時扶掖字不聴臣及男康入殿伏望聖慈傳宣閣門十八日許臣隨執政赴延和殿常起居及上殿進呈文字令臣男康入殿遇拜時扶掖仍自今後每遇入對並乞准此取進止中使徐湜封還傳宣聖㫖且令入都堂尚書省門下省治事所有入殿起居且頥養筋力直候秋涼引對所有元上劄子今却令封還并賜食二合乞進呈文字第二劄子元祐元年上臣今月十六日曽具劄子奏乞於十八日隨執政赴延和殿常起居及上殿進呈文字尋􅂪聖恩差入内東頭供奉官徐湜封還仍傳宣且令入門下尚書省治事所有入殿起居且頥養筋力直候秋涼引對此乃聖恩憐臣疲羸恐不堪勞苦欲且就安逸雖父母之愛其子恐不能如此之備臣隕身喪元無以為報然臣既參假治事若不以時入對面盡愚忠少禆萬一則與未參假時無異所以區區陳請不能自巳臣今欲再乞於二十六日隨執政赴延和殿常起居及上殿進呈文字臣至時自度若筋力委實不能支梧即乞如今來聖㫖且只入門下尚書省治事候筋力稍完再有陳請若且可以支梧即乞每遇垂簾日許隨執政赴延和殿常起居及進呈文字仍乞傳宣閣門自今後每遇臣入對許令臣男康入殿遇拜時扶掖取進止乞進呈文字第三劄子臣自前月十二日參假以來兩曽具劄子奏乞隨執政官於延和殿進呈文字皆􅂪聖恩遣中使封囬令候秋凉陛下矜愛微臣誠至深至厚然陛下不知臣不肖使待罪宰相宰相之職在輔佐天子謨明萬幾朝夕在前啟沃獻替臣自閠二月二日降麻除左僕射屬在病假至今未嘗得一日與諸執政至簾前參陪}
