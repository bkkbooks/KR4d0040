  - {type: substitution, offset: 0, original: 温, replacement: 溫, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:366e8ec95655b72d3205b878dc416602f82ff8a6b5dd240168f5ee5a7c65a61e', entry: vf-4515}}
  - {type: variant, offset: 2, length: 0, content: '', WYG: 論雖許投進}
  - {type: variant, offset: 3, length: 0, content: '', WYG: 字然中心委細無由一一面陳陛下徒閔其衰病欲使便安於一身不若使之竭盡愚忠庶幾有補於天下臣為私計豈不願宴安在家若顧公義豈得内無愧懼竊恐上則失陛下所以擢用臣之意下則失㣲臣忘身徇國之心况已先奉聖㫖權免前後殿起居朝㑹之勞什减七八臣自體當近日以來病勢亦似更减歩履比曏時稍輕但兩足少力若無人扶掖則全拜不得今不免冒犯無厭之罪伏望聖慈特降指揮令臣每遇殿上問聖體及謝恩等合拜之時特令免拜若在殿下常起居許令臣男康扶掖仍乞傳宣閣門每遇臣入朝許令臣男康隨入殿門如此則於臣羸病之軀優假巳極於公家之務亦無所廢臣今欲乞如臣前奏於今月八日隨執政赴延和殿常起居及上殿進呈文字取進止此劄子若降付三省再候進呈則八日以前皆值假故不坐八日入朝不及如允臣所奏乞直批降指揮依奏乞進呈文字第四劄子臣近曽三次具劄子奏乞與諸執政赴延和殿進呈文字皆䝉聖慈遣中使封還云候秋凉雖天恩矜憫隆厚無窮然臣既待罪宰相豈可不於簾前參陪國論况今已立秋兼臣自體當得筋力差勝於前可以枝梧只是無人扶掖全拜起不得欲乞如臣前奏候垂簾日許令與諸執政赴延和殿常起居同進呈文字并乞特降指揮自今後每遇臣入對許令臣男康隨入殿門取進止聖意若不欲批指揮即乞降赴三省乞赴延和殿起居劄子尋封囬臣昨乞自今後遇延和殿垂簾日赴起居奏事䝉聖恩依所乞為足瘡所有起居等冝特與權免拜及令男康扶掖入殿者臣若得男康扶掖實可以拜起臣既乆不面天顔豈有全不拜之理欲乞每遇延和殿垂簾日與吕公著同班常起居取進止乞官劉恕一子劄子元祐元年上臣伏覩祕書少監劉攽等奏故祕書丞劉恕同編修資治通鑑功力最多比及書成編修屬官皆䝉甄録惟恕身亡其家獨未霑恩門户單露子孫並無人食禄乞依黄鑑梅堯臣例官其一子臣徃嵗初受勅編修資治通鑑首先奏舉恕同修恕愽聞强記尤精史學舉世少及臣修上件書其討論編次多出於恕至於十國五代之際羣雄競逐九土分裂傳記訛謬簡編缺落嵗月交互事迹差舛非恕精慱他人莫能整治所以攽等衆共推先以為功力最多不幸早夭不見書成未死之前未嘗一日捨書不修今書成奏御臣等皆䝉天恩襃賞甚厚獨恕一人不得霑預降為編户良可矜憫欲乞如攽等所奏用黄鑑梅堯臣例除一子官使其平生苦心竭力不為虚設取進止乞不拒絶西人請地劄子元祐元年上臣近具劄子奏乞於今月八日隨執政延和殿進呈文字復䝉聖慈遣中使封還令依前降指揮臣不敢再三固違聖㫖然臣區區之心所以欲於八日入對者竊見夏國宥州有牒稱已差人詣闕計㑹所侵疆土城寨竊慮其日進呈上件文字此乃邊鄙安危之機生民休戚之本不可不察臣自今年二月初以來累曽上言乞因新天子即位西人恭順之際早下詔書赦其罪戾待遇如故如此則控縱在我天子之體}
