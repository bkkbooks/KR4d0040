  - {type: variant, offset: 2498, length: 125, content: 薦王大臨劄子八月八日上大臨除太學録巳卒臣竊見鄆州處士王大臨通經術善講說安仁樂義譽髙鄉曲貧不易志老不變節曏常有詔敦遣固辭不起伏望聖慈召致京師寘之學官爲士類矜式取進止乞官陳洙一子劄子嘉祐中仁宗皇帝未有継嗣故殿中侍御史陳洙奏乞擇宗室之賢者立以爲後旣發奏狀謂, WYG: 傳}
