  - {type: indent, offset: 0, content: 　　, id: KR4d0040_krp_054-bkkind1}
  - {type: variant, offset: 4, length: 0, content: '', WYG: 七乞以十科舉士劄子元祐元年上尋依此行臣竊惟為政之要莫如得人百官稱職則萬務咸治然人之才性各有所能或優於德而嗇於才或長於此而短於彼雖皐䕫稷契止能各守一官况於中人安可求備是故孔門以四科論士漢室以數路得人若指瑕掩善則朝無可用之人苟隨噐授任則世無可弃之士臣誤䝉甄擢備位宰相慎選百官乃其職業而智識淺短見聞褊狹知人之難聖賢所重寰宇至廣俊彦如林或以恬退滯淹或以孤寒遺逸被褐懐玉豈能周知若専引知識則嫌於狹私難服衆心若止循資序則官非其人何以致治莫若使在位逹官人舉所知然後克恊至公野無遺賢矣臣不勝狂愚欲乞朝廷設十科舉士一曰行義純固可為師表科有官無官人皆可舉二曰節操方正可備獻納科舉有官人三曰智勇過人可備將帥科舉文武有官人此科亦許鈐轄以上武臣舉四曰公正聰明可備監司科舉知州以上資序五曰經術精通可備講讀科有官無人人皆可舉六曰學問該慱可備顧問科有官無官人皆可舉七曰文章典麗可備著述科有官無官人皆可舉八曰善聽獄訟盡公得實科舉有官人}
