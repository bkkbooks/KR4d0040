  - {type: variant, offset: 3555, length: 879, content: 乞朝廷與於三班借差内安排若遇有強惡賊人朝廷臨時别立賞格者不在此限如此則保甲内勇徤之士見前有出官之望來應募者必多除第一第二等户物力髙強合充重役不得應募外其餘但於本縣有户籍田産不以等第髙下並許投充長名弓手永無解役之期若第一第二等户情願以一丁爲弓手餘丁充重役者亦聽若一人闕額有二人以上争投者即委令佐㨂試武藝髙強者充如此則本縣勇健者皆充弓手其餘怯弱者雖使之爲盗亦無能爲患若見充長名弓手人有勇力武藝衰退者許令外人指名比校若勝於舊者即令充替如此則不須敎閱武藝自然長得精熟仍委本州及提點刑獄常切覺察令佐有取捨不公者取勘依法施行若應募未滿見今郷差弓手之數即且令與郷差弓手相兼祗應候招到長名弓手一人即替郷差弓手一人歸農其郷差弓手願投長名者亦聽若長名弓手及百人以上即令分一半作兩畨二百人以上毎百餘人分作一畨並年終交替其上畨者隨縣尉逐捕盗賊自節級以上各令管所轄之人若所轄之人有小可過犯許一靣區分不得過小枤十下若所轄之人敢陵犯本轄人貟者杖一百歐者杖徒一年雖權管亦同本轄人貟若於所轄人處取受財物並依律科罪犯贓罪杖者若係權管即降充長行名若係正人貟即降一資自後毎捉殺到強盗三人如當一人雖許遷資並係額外不得管人不得出官若遇下畨則不相管轄亦無階級其下畨者自十將以下各隨所居之處與耆長同覺察本管分内曽爲強盗之人及窩藏之家凡爲強盗者不肯於本管分作過須在它處蓋恐累及本地分捕盗人無所自容故也其本地分捕盗人往往知之莫肯發舉盗旣得財分贓則絶迹逺遁其賊發地分捕盗人雖欲擒捕莫知其處官中雖立三限科校終無所益由此賊發地分捕盗人毎有賊發莫肯申舉若變主懦弱則多方抑塞不令聲賊變主強梁則共陪所失之財勸和使休是致群盗無所忌憚日益昌熾又告捕得賊多𬒳賊人讎報焚焼莊舎屠害老小其賞錢豈冝留滯而往往爲州縣沮難有司靳惜動有經年請領不得使之懈體欲乞今後應賊發地分其捕盗人更不立三限科校捕盗官亦不批罰只以擒賊多少論其功賞若敢抑塞隱蔽從嚴法施行仍毎州各隨大小賊盗多少借官錢千貫専充告捕賞錢毎獲強盗勘得從來住止窩藏去處候断遣巳了委本州長吏當日先以官錢支給告捕之人即移牒出賊州縣句追住止􅌪藏地分捕盗人科不覺察罪弓手杖一百耆長杖八十壯丁笞, WYG: ''}
