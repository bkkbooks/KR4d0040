  - {type: variant, offset: 2624, length: 738, content: 人曰我今日入一文字言社稷大計若得罪大者死小者貶竄汝軰當爲之備下奏狀者未返洙得疾而卒臣時爲諌官親聞見此事竊憐其亡身徇國継之以死而天下莫之知近見故職方貟外郎張術亦以當時乞建儲貳子申伯特𥙷太廟齋郎伏望聖慈依張術例除一子官以旌忠義取進止乞令六曹刪減條貫劄子八月十二日三省同上得㫖依勘㑹近歲法令尤為繁多凡法貴簡要令貴必行則官吏易爲檢詳咸知畏避近據中書門下後省修成尚書六曹條貫共計三千六百九十四冊寺監在外又據編修諸司勑式所申脩到敕令格式一千餘卷冊雖有官吏彊力勤敏者恐不能遍觀而詳覧况於備記而必行之其間條目苛宻抵梧難行者不可勝數昨者條貫初下吏部侍郎左選差注不行者數日不免再有奏陳復依舊法必料諸曹條貫皆有似此拘礙難行者今欲特降指揮下尚書六曹委長貳郎官同共看詳本曹新舊條貫内有海行巳有及全無義理於事無益防禁太繁難爲遵守者盡令刪去惟取紀綱大體切近事情朝夕不可無者方始存留作本司條貫限兩月申奏施行乞罷保甲招置長名弓手劄子臣竊見府界及三路保甲雖罷團敎猶冬敎一月於民有損於官無益不若盡罷之便何則比團敎之時民間勞費雖十減六七然猶有三四此所謂於民有損也朝廷毎歳遣使按閱所費金帛以百萬計而終無所用之此所謂於官無益也臣以爲不若盡罷之便自置保甲以來盗賊倍多所以然者郷村無頼子弟乍渉城市聞見紛華自恃身爲保丁坐索本家供給飲博遊蕩習以成性今雖罷團敎不肯復歸南畒服田力穡逸欲旣深資用不足旣家藏利兵又身挾武藝由是邀結黨友群行攻刼父兄不能禁州縣不能制此自然之勢也是以數年以来年不甚飢而府界三路盗賊縱横入縣鎮殺官吏若遇蟲蝗水旱大饑之歳將若之何此不可不爲之先慮也以臣愚見莫若盡罷府界及諸路保甲據逐縣主戸數目盗賊多少委提點刑獄相度每若干戸置長名弓手一人與免戸下租稅支移折變及夫役諸般差徭科配一無所預務爲優假使人歆慕毎十人置節級一貟, WYG: 集巻}
