  - {type: variant, offset: 3040, length: 0, content: '', WYG: 言王逵第二劄子尋改除逵西京留臺臣先曽上言新差知萊州王逵暴戾凶狡殘害民物乞檢會逵年紀及平生事迹勒令致仕或只與監當差遣至今未聞朝廷追改前命臣竊以善為政者視民如子見不仁者誅之如鷹鸇之逐鳥雀也故害民之吏患在不知知而不除使戕賊良善不愛一州而愛一酷吏豈為民父母之意哉伏望朝廷檢會臣前來所奏早賜施行取進止言陳烈劄子嘉祐七年十二月十八日上臣等伏見朝廷曏以福州處士陳烈好學篤行動遵禮法樂道養志名聞京師故舉之閭閻之中以為學官烈辭譲未至今聞福建路提刑王陶奏據福州勘到烈為妻林氏疾病瘦醜遣歸其家十年不視陶因言烈貪汚險詐行無纎完乞盡追奪前後所受恩命臣等素不識烈不知其人果為如何惟見國家常患士人不修名檢故舉烈等以奬勵風俗若烈平生操守出於誠實雖有底滯迂闊之行不能合於中道猶為守節之士亦當保而全之豈可毁壊挫辱疾之如讐書曰不恊于極不罹于咎皇則受之古人所以禮九九市駿骨蓋以此也若其内懐姦惡虧敗名教外飾詐偽沽釣聲利則朝廷曏者以為有道之士不次用之今乃醜行布於四方其為愧耻亦不細矣其始者薦舉之人安可置其罪而不問臣等欲望陛下委鄰路監司再行體量本人平生事迹善惡虚實或選差公正官吏通儒術識大體者覆勘前件公事若情理不至深重止於夫妻不相安諧則使之離絶而已湔洗其過庶幾復伸眉於後又使四方節行之士不憂橫辱得以安恬於閭里若實有醜惡之迹敗亂名教則當嚴賜刑誅并治舉者之罪以明至公}
