  - {type: variant, offset: 4362, length: 572, content: 永乆之患臣恐釁隙一開則朝廷未得髙枕而卧也昔孫蒯毀缾而曹衞御名難鄫人漚菅而魯國喪邑渉佗捘手而晋失諸侯女子爭桑而吴師入郢故禍常起於細微而事或生於所忽凡二國所以相交之道不可以不愼也雄州當虜之衝平居則行李之所往來有事則戎馬之所出入典州之將不可不精擇其人滋禀性狂很恐不可乆寘於彼乞落軍職徙之内地母使邊將相效爲國生事實天下幸甚取進止陳烈劄子臣等伏見朝廷曏以福州處士陳烈好學篤行動遵禮法樂道養志名聞京師故舉之閭閻之中以爲學官烈辭讓未至今聞福建路提點刑獄王陶奏據福州勘到烈爲妻林氏疾病瘦醜遣歸其家十年不視陶因言烈貪汚險詐行無纎完乞盡追奪前後所受恩命臣等素不識烈不知其人果爲如何惟見國家常患士人不修名檢故舉烈等以獎勵風俗若烈平生操守出於誠實雖有底滯汚闊之行不能合於中道猶爲守節之士亦當保而全之豈可毀壞挫辱疾之如讎書曰不恊于極不罹于咎皇則受之古人所以禮九九市駿骨蓋以此也若其内懷姦惡虧敗名教外飾詐僞沽釣聲利則朝廷曏者以爲有道之士不次用之今乃醜行布於四方其爲愧恥亦不細矣其始者薦舉之人安可置其罪而不問臣等欲望陛下委鄰路監司再行體量本人平生事迹善惡虚實或選差公正官吏通儒術識大體者覆勘前件公事若情理不至深重止於夫妻不相安諧則使之離絶而巳湔洗其過庶幾復伸眉於後又使四方節行之士不憂撗辱得以安恬於閭里若實有醜惡之迹敗亂名敎則當嚴賜刑誅并治舉者之罪以明至公取進止温國文正公文, WYG: ''}
