  - {type: variant, offset: 4400, length: 1, content: 中, WYG: 寧公之力也嗚呼公與狄梁公皆有恵政於魏故魏人祠之然其為逺近所尊慕年時雖逺而不毁非有大功於社稷為神祗所相佑能如是乎况梁公之功顯天下皆知之魏公之功隠天下或未能盡知也然則魏公不又賢乎宜其與梁公之祠並立於魏享祀無窮公薨後九年魏人以状抵西京俾光為記将刻於石竊惟梁公二記乃李邕馮宿之文光實何人敢不自量顧魏人之美意不可抑又欲以其所未知者諗之故不敢辭陳氏四令祠堂記故左諫議}
