  - {type: variant, offset: 5035, length: 583, content: 之士刻志厲行而人莫知者可勝數哉始太之喪其父也余兄弟賻以千錢且爲書致之曰禮凡有喪它人助之珠玉曰含車馬曰賵貨財曰賻衣服曰襚今物雖薄欲人之可継也乆之太請刻其書於石曰郷也郷人不知有􅉠禮自太父之喪郷人稍稍行之太欲廣其傳由吾郷以及鄰縣由鄰縣以逹四方使民間皆去弊俗而入於禮豈小𥙷哉余益美其志因諭之曰是書不足刻余竊慕君子樂道人之善請書若兄弟及周文粲蘇慶文臺亨所爲以傳於丗庶幾使爲善者不以隱微而自懈焉元豐六年十一月壬寅朔涑水迃叟序河南志序周官有職方土訓誦訓之職掌道四方九州之事物以詔王知其利害後丗學者爲書以述地理亦其遺法也唐麗正殿直學士韋述爲兩京記近故龍圖閣直學士宋君敏求字次道演之爲河南長安志凡其廢興遷徙及宫室城郭坊市第舎縣鎮郷里山川津梁亭驛廟寺陵墓之名數與古先之遺迹人物之俊秀守令之良能花卉之殊尤無不備載考諸韋記其詳不啻十餘倍開編粲然如指諸掌其博物之書也次道性嗜學先正宣獻公蓄書三万卷次道自毀齒至于白首從事其間未嘗一日捨置故其見聞博洽當時罕倫又閑習國家故事公私有疑咸往質焉又喜著書如唐書仁宗實録國史㑹要集注史記之類與衆共之或專修而未成者皆不計外其手自繤述巳成者凡四百五十卷蓋昔人所著未有若此其多也次道旣没太尉潞公留守西京其子慶曽等奉河南志以請於公曰先人昔甞佐此府叙其事尤詳惜其傳於丗者甚鮮願因公刻印以廣之豈徒先人蒙不朽之賜於泉壤抑亦使四方之人未甞至洛者得之如遊處巳熟後丗聞今日洛都, WYG: 冠}
