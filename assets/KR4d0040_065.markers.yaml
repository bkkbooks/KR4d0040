  - {type: variant, offset: 632, length: 133, content: 可乆也蕩而無度將以自敗故聖人制禮以爲之節因以合朋友之和飾賔主之歡且寓其教焉夫投壷細事遊戲之類而聖人取之以爲禮用諸卿黨用諸邦國其故何哉鄭康成曰投壷射之細也古者君子射以觀德爲惎平體正端壹審固然後能中故也蓋投壷亦猶是矣夫審度於此而取中於彼仁道存焉疑畏則踈惰慢則失義方象焉左, WYG: ''}
