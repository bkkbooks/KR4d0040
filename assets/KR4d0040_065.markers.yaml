  - {type: indent, offset: 40, content: 　　　, id: KR4d0040_krp_065-bkkind9}
  - {type: variant, offset: 40, length: 0, content: '', WYG: 以勸之送胡完夫序舜之取士敷納以言明庶以功車服以庸考其言中於道試之事克有功然後用之}
  - {type: variant, offset: 41, length: 0, content: '', WYG: 能舉十六}
  - {type: variant, offset: 42, length: 7, content: 國龐公清風集略, WYG: 恭巳不為而天下大治也近世取士不然一决之以文辭噫文辭豈能盡取士之道邪天下病是乆矣明天子知之廼詔有司自今進士髙第皆先試之小官使知為下之勞而熟於民之疾苦然}
  - {type: page-break, offset: 42, content: '', id: KR4d0040_WYG_070-7a, image: WYG1094/WYG1094-0644a.png}
  - {type: variant, offset: 50, length: 0, content: '', WYG: 察其功而舉之雖置以為卿相無不可者嗚呼此誰發哉乃大舜之業也晋陵胡完夫以進士貢於州試於有司覆於天子之庭第其名未嘗在一二人之後則完夫之文辭可知矣其試於有司也光不佞尸其事得竊觀其論䇿盖非特文辭之美也廼能發明聖人之淵源叶於古而適於今信乎其言能中於道者邪既中於道矣自今日以往天子将又試之以事異日完夫能擴其道以充其言則天子将引而置之卿相之位庶㡬乎元凱之功復見於今日矣嗚呼天子一更法度復古之道其功業之歸廼巍巍如是豈不偉歟噫是道也不難至在完夫勉之而巳矣送通山令郝戭}
  - {type: page-break, offset: 50, content: '', id: KR4d0040_WYG_070-7b, image: WYG1094/WYG1094-0644b.png}
  - {type: 'kr:newline', offset: 51, content: '

