  - {type: variant, offset: 6845, length: 1, content: 継, WYG: 永祗保之諫院題名記嘉祐八年作古者諫無官自}
  - {type: variant, offset: 6847, length: 0, content: '', WYG: 卿大夫至於工商無不得諫者漢興以來始置官夫以天下之政四海之衆得失利病萃於一官使言之其為任亦重矣居是官者當志其大捨其細先其急後其緩專利國家而不為身謀彼汲汲於名者猶汲汲於利也其間相去何逺哉天禧初真宗詔置諌官六員責以職事慶歴中錢君始書其名於版光恐乆而漫滅嘉祐八年刻著於石後之人将歴指其名而議之曰某也忠某也詐某也直某也回嗚呼可不懼哉聞喜縣脩文宣王廟記嘉祐元年作或問太古何如曰不今日如也何以言之曰古之人寒衣而饑食貪生而畏死不殊於今也喜怒哀樂好惡畏欲與民俱生非今有而古無也古之人食鳥獸之肉草木之實而衣其皮鳥獸日益殫草木日益稀人日益衆物日益寡視此或不足視彼或有餘能相與守死而勿争乎争而不巳相賊傷相滅亡人之類盖可計日而盡也聖人者愍其然於是作而治之擇其賢智而君長之分其土田而疆域之聚其父子兄弟夫婦而安養之施其禮樂政令而綱紀之明其道徳仁義孝慈忠信㢘譲而教𨗳之猶有狂愚傲狠之民悖戾而不從者於是鞭朴以威之鈇鉞以戮之甲兵以殄之是以民相與安分而保常養生而送終繁衍而乆長也及周之衰先王之道蕩覆崩壊㡬無餘矣其不絶者纎若毫芒自非孔子起而振之廓而引之使閎大顯融以迄于今則生民之衆㡬何其不淪而為禽夷也今國家所以􅆢事孔子非輕也廟食於國於州於縣以嵗時陳其俎豆鳴其金石以禮饗之自天子之貴親北面而拜焉所以然者非一人之私為道存也然吏於州縣者或以簿領鞭朴為急務視孔子之祠及學校廢為餘事置之曽不誰何彼真俗吏無足道者聞喜自前世固搢紳大夫之林藪也縣有孔子廟咸平中武吏慈釋回脩之尉李垂為之記厥後繼而為長者其嚴事孔子之心不能及釋回於是廟屋隳頓垣墉圯缺草樹荒椔碑石斷仆况於鄉飲酒之容絃誦之音固不可得而睹聞矣今大夫馬君至而嘆曰嗚呼為川者知防而不知濬則横潰而不禁為民者知怒而不知教則愁怨而不從故善為川者相髙下而導之善為民者明是非而告之是以為者逸而從者易物遂性而功速成也今為吏者不能掲先王之道以教人而曰吾專任刑罰亦足為治者是掩民之耳目而以䧟穽俟之也不仁孰大焉乃屬邑中之賢士大夫而告之曰今孔子之廟廢而不脩士無所講其業民無所承其化斯豈惟令之辠亦二三子之恥也皆曰斯固邑人日夜所不忘而不敢請者也今明府有命是天相聖人之道而以明府賜邑人也敢不奔走而承之乃相與斂材聚工葺屋之隳而壮大之脩垣之圯而髙厚之去木之椔而改樹之起碑之仆而更刻之民不加賦吏不告勞不日而新廟煥然成矣於是邑中之賢士大夫相與朝夕誦堯舜之書咏商周之詩於其中彬彬然有鄒魯之風矣噫馬君之於學也既正其基矣猶未也今之吏率三嵗而更後之人繼而長於斯者宜勿替馬君之功引而伸之學者冝卒成馬君}
