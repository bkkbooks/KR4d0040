  - {type: variant, offset: 4399, length: 0, content: '', WYG: 仁宗皇帝謂侍臣曰朕宅帝位㡬三十年天下名儒皆率與之遊自得張某使我日聞所未聞因書紙為博學字命使者即其家賜之當是時國家中外無事天子方嚮藝文同侍殿閣者皆名臣之選無不環觀愧羨莫敢望云公既沒十有六年公之子子瑾字材之将摹著其書於石謂光曰必為之記光曰昔公知滑州光從事於幕下嘗聞公之言曰余平生喜書讀之不啻數十百過其簡編弊矣然毎發之必有新獲之意焉噫公之篤學如此宜其當明主之知為多聞之友受殊常之寵成不朽之名也使曩也先皇帝賞公以萬金於今何有固不若垂一言之褒其為子孫光榮世世無窮也夫知人則哲帝堯之所難仲尼門人以千數獨稱顔淵為好學今材之所為欲以彰先皇帝之知人而揚先公之好學也夫彰君之明忠也揚父之美孝也惟忠與孝材之兩有焉光也雖無文又焉敢無一言以表著其實乎韓魏公祠堂記元豐七年作沒而祠之禮也由漢以來牧守有恵政於民者或為之生祠雖非先王之制皆發於人之去思亦不可廢也然年時寖逺人寖忘之惟唐狄梁公為魏州刺史屬契丹㓂河北梁公省徹戰守之備撫綏彫弊之民民安而虜自退魏人祠之至今血食熈寜初河北水溢地大震官寺民居蕩覆者大半詔以淮南節度使司徒兼侍中韓魏公為河北安撫使判大名府兼北京留守公既愛民如愛子治民如治家去其疾忘巳之疾閔其勞忘已之勞未㡬居者以安流者以還饑者以充乏者以足羣心既和嵗則屢豐在魏五年徙判相州魏人泣涕遮止數日乃得去魏人思公而不得見也相與立祠於熈寜禪院塐公像而事之後二年公薨於相州魏人聞之争奔走哭祠下雲合而雷動連日乃稍息自是毎嵗公生及違世之日皆來致祠作佛事未嘗少懈噫公之徳及一方功施一時者魏人固知之矣至於徳及海内功施後世者亦嘗知之乎公為宰相十年當仁宗之末英宗之初朝廷多故公臨大節處危疑苟利國家知無不為若湍水之赴深壑無所疑憚或諫曰公所為如是誠善萬一蹉跌豈惟身不自保恐家無處所殆非明哲之所尚也公嘆曰此何言也凡為人臣者盡力以事君死生以之顧事之是非何如耳至於成敗天也豈可豫憂其不成遂輟不為哉聞者愧服其忠勇如此故能光輔三后大濟艱難使中外之人餔啜嬉遊自若曽無驚視傾聽竊語之警坐置天下於}
