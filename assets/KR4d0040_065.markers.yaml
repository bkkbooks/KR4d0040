  - {type: variant, offset: 0, length: 2, content: 温國, WYG: 三送即景微序送同年即兄景微歸會稽榮覲序進士此科見重於時乆矣自兩漢而下選舉之盛無與為比廼至販鬻給役之徒皆知以為美尚是以得之者矜夸滿志焜燿於物如謂天下莫巳若也亦何惑哉賢者居世㑹當蹈仁履義以徳自顯區區外名豈足恃邪即景微與余周旋甚悉余備知之其為人剛不可校柔不可犯和易以為樂節正以為禮由七品官舉進士一上中選可謂美矣然未嘗有偃蹇之容自滿之意或未識者卒然遇之尚不知其為舉人又焉知其有科級邪所謂以徳自顯者殆無過此乎家君與尊諫議景徳中同年登第在朝廷最名相善余又與景微以䕃籍同官偕舉進士送名於天府覆試於南廟以至登第未嘗異處古人有言朋友世親如我比者固不踈矣今将泛舟南下拜親於越謂余必以}
