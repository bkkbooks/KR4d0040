  - {type: variant, offset: 51, length: 1, content: 百, WYG: 通山郝明府年四十餘父嘗舉進士老而無成以其志之不獲也雖子登進士第仕至長吏終歉歉不自足明府亦以親之不怡也不以仕為榮乃詣闕上書請致仕而為其親匃一}
  - {type: variant, offset: 53, length: 3, content: 表緫序, WYG: 朝廷雖嘉其意以無}
