  - {type: variant, offset: 37, length: 1, content: 南, WYG: 之决駿馬之逸沛然莫之能禦也間九年復相遇於京師則猶服故時藍衫守銓門求一官礥然乆之乃得婺之浦江同時軰流及後來者仕宦率居其右僕然後喟然嘆曰才乎才乎信不足恃者邪抑又聞之天将降大任於是人也必先空乏其身行拂亂其所為浦江近是乎况浦江齒尚壮}
  - {type: variant, offset: 39, length: 0, content: '', WYG: 尚鋭以斯之才而濟之以無倦則徳業之涯未易前知也於其行聊}
