  - {type: variant, offset: 57, length: 21, content: 樞宻直學士薛公諱田詩集序趙朝議丙字南正文藁, WYG: 事不之許明府将之官戚戚若受謫者且曰通山道險逺吾親必不肯行将留妻子侍吾親而單車之官至則復請期於成吾志焉明府於光母黨也光聞其言瞿然慙曰嘗聞古之人仕以為親非為身也若明府之仕其真無意於身者邪如光者禄既不及於親而又無補於君役役然耗廩食以飽妻子乆留而不能去得不為君子之罪人邪嗚呼明府誠可頌而礪世人矣嘉祐八年八月十六日涑水司馬光}
