  - {type: variant, offset: 2514, length: 1879, content: 所記下至周顯德之末簡䇿極愽而於科舉非所急故近嵗學者多不讀鮮有能道之者獨道原篤好之爲人強記紀傳之外閭里所録私記雜說無所不覧坐聽其談衮衮無窮上下數千載間細大之事如指掌皆有稽據可考驗令人不覺心服英宗皇帝雅好稽古欲徧觀前丗行事得失以爲龜鑑光承乏侍臣甞從容奏舊史文繁自布衣之士鮮能該通況天子一日萬機誠無暇周覧乞自戰國以還訖于顯德凡開國家之興衰繫衆庶之休戚善可爲法惡可爲戒者詮次爲編年一書刪其浮長之辭庶於奏御差便上甚喜㝷詔光編次歴代君臣事仍謂光曰卿自擇館閣英才共修之光對曰館閣文學之士誠多至於專精史學臣未得而知者唯和川令劉恕一人而巳上曰善退即奏召之與共修書凡數年史事之紛錯難治者則以諉之光蒙成而巳今上即位更命其書曰資治通鑑王介甫與道原有舊深愛其才熈寧中介甫參大政欲引道原修三司條例道原固辭以不習金榖之事因言天子方属公以政事冝恢張堯舜之道以佐明主不應以財用爲先介甫雖不能用亦未之怒道原毎見之輙盡誠規益及吕獻可得罪知鄧州道原往見介甫曰公所以致人言蓋亦有所未思因爲條陳所更法令不合衆心者冝復其舊則議論自息介甫大怒遂與之絶未幾光出知永興軍道原曰我以直道忤執政今官長復去我何以自安且吾親老不可乆留京師即奏乞監南康軍酒得之光㝷判西京留臺奏遷書局於洛陽後數年道原奏請身詣光議修書事朝廷許之道原水陸行數千里至洛陽自言比氣羸憊必病且死恐不復再見留數月而歸未至家遭母喪俄得風疾右手足偏廢伏枕再期痛苦備至毎呻吟之隙輙取書修之病益篤乃束書歸之局中以元豐元年九月戊戍終官至祕書丞年止四十七嗟乎以道原之耿介其不容於人齟齬以没固冝天何爲復病而夭之邪此益使人痛惋惝怳而不能忘者也道原嗜學方其讀書家人呼之食至羹炙冷而不顧夜則卧思古今或不寐逹旦在和川甞以公事適野見劉聦太宰劉雄碑知嘉平五年始改建元正舊史之失在洛陽與光偕如萬安山道旁有碑讀之乃五代列將人所不稱道者道原即能言其行事始終歸驗於舊史信然宋次道知亳州家多書道原枉道就借觀之次道日具酒饌爲主人禮道原曰此非吾所爲來也殊廢吾事願悉撤去獨閉閤晝夜讀且抄留旬日盡其書而去目爲之翳道原致疾亦由學之苦邪方介甫用事呼吸成禍福凡有施置舉天下莫能奪髙論之士始異而終附之靣譽而背毀之口是而心非之者比肩是也道原獨奮厲不顧直指其事是曰是非曰非或靣刺介甫至變色如鐵或稠人廣坐介甫之人滿側道原公議其得失無所隱惡之者側目愛之者寒心至掩耳起避之而道原曽不以爲意見質厚者親之如兄弟姦謟者疾之如讎用是困窮而終不悔此誠人之所難也昔申棖以多欲不得爲剛微生髙以乞醯不得爲直如道原者可以爲剛直之士乎道原家貧至無以給旨甘一毫不妄取於人其自洛陽南歸也時已十月無寒具光以衣襪一二事及舊貂褥賮之固辤強與之行及頴州悉封而返之於光而不受於它人可知矣尤不信浮屠說以爲必無是事曰人如居逆旅一物不可乏去則盡弃之矣豈得齎以自隨哉可謂知之明而決之勇矣道原好讀書志欲籠絡宇宙而無所遺不幸早夭其成者十國紀年四十二卷包羲至周厲王疑年譜共和至熈寜年略譜各一卷資治通鑑外紀十卷餘皆未成其成者亦未以傳人曰今柳芳唐曆本皆不同由芳書未成而傳之故也期於瞑目然後傳病亟猶汲汲借人書以參校己之書是正其失氣垂盡乃口授其子羲仲爲書属光使譔埋銘及十國紀年序且曰始欲諸國各作百官及藩鎭表未能就幸於序中言之光不爲人譔銘文巳累年所拒且數十家非不知道原託我之厚而不獲承命悲愧尤深故序平生所知道原之美附於其書以傳來丗道原自言其先萬年人六丗祖度唐末明經及第爲臨川令卒官遇亂不能歸遂葬髙安因家焉南唐以髙安爲筠州今爲筠州人父渙字凝之進士及第爲潁上令不能屈節事上官年五十弃官家廬山之陽且三十年矣人服其髙歐陽永叔作廬山髙以美之今爲屯田貟外郎致仕云洛陽耆英㑹序昔白樂天在洛與髙年者八人遊時人慕之爲九老圖傳於丗宋興洛中諸公継而爲之者凡再矣皆圗形普明僧舎普明樂天之故第也元豐中文潞公留守西都韓國冨公納政在里第自餘士大夫以老自逸於洛者於時爲多潞公謂韓公曰凢所爲慕於樂天者以其志趣髙逸也奚必數與地之襲焉一旦悉集士大夫老而賢者於韓公之第置酒相樂賔主凡十有一人旣而圗形妙覺僧舎時人謂之洛陽耆英㑹孔子曰好賢如緇衣取其敝又改爲樂善無厭也二公寅亮三朝爲國元老入賛萬機出綏四方上則固社稷尊宗廟下則熙百工和萬民天子心腹股肱耳目天下所取安所取平其勲業閎大顯融豈樂天所能庶幾然猶慕効樂天所爲汲汲如恐不及豈非樂善無厭者與又洛中舊俗燕私相聚尚齒不尚官自樂天之㑹巳然是日復行之斯乃風化之本可頌也宣徽王公方留守北都聞之以書請於潞公曰某亦家洛位與年不居數客之後顧以官守不得執巵酒在坐席良以爲恨願寓名其間幸無我遺其爲諸公嘉羡如此光未及七十用狄監盧尹故事亦預於㑹潞公命光序其事不敢辭時五年正月壬辰端明殿學士兼, WYG: 為}
