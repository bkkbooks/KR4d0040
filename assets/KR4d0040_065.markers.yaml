  - {type: variant, offset: 766, length: 1474, content: 前却過分則差中庸著焉得十失二成功盡弃誡慎明焉是故投壷可以治心可以修身可以爲國可以觀人何以言之夫投壷者不使之過亦不使之不及所以爲中也不使之偏頗流散所以爲正也中正道之根柢也聖人作禮樂修刑政立教化垂典謨凡所施爲不啻萬端要在納民心於中正而巳然難得而制者無若人之心也自非大賢守道敦固則放蕩傾移無所不至求諸少選且不可得是故聖人廣爲之術以求之投壷與其一焉觀夫臨壷荷矢之際性無麤宻莫不聳然恭謹志存中正雖不能乆可以習焉豈非治心之道歟一矢之失猶一行之虧也豈非修身之道歟兢兢業業慎終如始豈非爲國之道歟君子之爲之也確然不動其心儼然不改其容未得之而不懾旣得之而不驕小人爲之也俯身引臂挾巧取竒苟得而無愧豈非觀人之道歟由是言之聖人取以爲禮冝矣彼博弈者以詭譎相髙以殘賊相勝孔子猶曰飽食終日無所用心爲之猶賢乎已况投壷者又可鄙略而輕廢哉古者壷矢之制揖遜之容今雖闕焉然其遺風餘象猶髣髴也世傳投壷格圖皆以竒儁難得者爲右是亦投瓊􅍐之類耳非古禮之本意也余今更定新格増損舊圖以精宻者爲右偶中者爲下使夫用機徼幸者無所措其手焉壷口徑三寸耳徑一寸髙一尺實以小豆壷去席二箭半箭十有二枚長二尺有四寸以全壷不失者爲賢苟不能全則積算先滿百二十者勝後者負俱滿則餘算多者勝少者負為圖列之左方并各釋其旨意焉有初箭十算首箭中者君子作事謀始以其能慎始故賞之第二箭以下連中不絶者皆五算若一箭不中次箭皆爲散箭其違中内有貫耳及驍者其箭别計假若有初箭仍貫耳則二十算是也舊圖𥘉箭一籌其决每箭加二籌盡四箭而止甚非勸功之道今自二箭以下連中不絶者皆賞之所以勉人扵不觧也全壷無算無算者不以耦之算數多少皆勝之也若兩人俱全則復計其餘算以决勝負夫為山九仞功虧一簣全壷實難故君子貴之有終十五算末箭中也靡不有初鮮克有終故比之有𥘉又加五算也散箭一算貫耳十算耳小扵口而能中之是其用心愈精故賞之驍箭十算亦謂之驍皆俊猛意也謂投而不中箭激反躍捷而得之復投而中者也爲其巳失而復得之不逺復善補過者也故賞之若復投而貫耳者其算别計復投而不中者廢之敗壷不問巳有之算皆負謂十二箭皆不中大無功也若兩人皆敗則亦計餘算以决勝負横耳謂箭横加耳上舊五十籌橫壷横加壷口舊四十籌皆依常算無賞偶然而横非投者工何足以賞若爲後箭所撃而墜地者與不中同倚竿箭斜倚壷口中舊十五籌龍首倚竿正箭首正向巳者舊十八籌龍尾倚竿而箭羽正向己者舊十五籌狼壷轉旋口上而成倚竿者舊十四籌帶劒貫耳不至地者舊十五籌耳倚竿舊十五籌皆廢其算傾斜險詖不在扵善而舊圖以爲竒箭多與之筭甚無謂也今廢其算所以罰之然亦異扵不中者故於連中全壷皆得通數若爲後箭所擊及自墜壷若耳中者復計其筭墜地者與不中同矣倒中舊百二十籌倒耳舊不門籌數並滿壷中之筭盡廢之顛倒反覆悪之大者柰何爲上賞今盡廢其筭所以明逆順之道吕獻可章奏集序歐陽觀文有言士學古懷道者仕於時不得爲宰相必爲諌官諌官與宰相等坐乎廟堂之上與天子相可否者宰相也立乎殿陛之前與天子爭是非者諌官也宰相九卿而下失職者受責於有司諌官失職者取譏於君子有司之法行乎一時君子之譏著之䇿書而昭明垂之百丗而不泯誠哉是言也然士之居其任果能不失職者亦鮮矣獻可爲臺諌官前後凡若干年遇黜者三皆以彈奏執政確切不巳天子重傷大臣意不得巳而黜之其直聲赫然振動天下自餘百官之愆違政事之闕失苟與之同時無彊弱大小知無不言言無不盡如獻可者於其職業可謂無所愧負矣古之人稱死而不朽者如臧文仲旣没其言立是也然文仲之言傳於今者無幾蓋時人不能存録遂使遺逸豈不惜哉光於獻可忝備僚友獻可平生造膝之言固不可得而聞今旣没其子由庚等捜求章奏遺藁得二百餘篇光請而序之俾後之人察其言足以知獻可之心然則獻可身雖没其心長存也嗚呼獻可以直道自立終始無缺而官止於諌, WYG: 諫}
