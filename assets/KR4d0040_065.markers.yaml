  - {type: variant, offset: 34, length: 2, content: 􅉠禮, WYG: 者其亦贈處之道歟然世俗失之往往崇虚辭相歎譽曽無一言以為規是豈昔人贈處之道哉愚以為朋友之道譽其善規其過專譽而不規路人而聚處飲酒於市道者耳光於揆之非直同官而已實朋友也於其行又可無言以贈之揆之名相子孫聦逹有美才習於時務觀其行能殆無所復擇矣然為之友者猶舉其毛髪之闕而告之誠欲就其全也夫人非至聖必有短非至愚必有長至愚之難值亦猶至聖之不世出也故短長雜者舉世比肩是也是以君子之取人也不求備稱其善不計其惡求其工不責其拙如此故人竭其用而恱從之怨憎不至而功業榮焉然則垢面而險眥操耒而胥靡者尚未可輕辱而易視也禹曰知人則哲惟帝其難之堯禹以為難則凡人安得謂之易人事常不可測夫又詎知操耒者不為阿衡而胥靡者不為傅説若之何其可以心目斷也竊嘗聞之夫智者攘患常於至微著而攘之則無及巳昔智伯一㑹而辱二主一臣以成鑿臺之禍以智伯之強人莫之害失一言於樽爼之際其禍章章如此况無其勢取侮易矣夏書曰一人三失怨豈在明不見是圖足下行矣慎之智或召災敏或賈禍愚不可忽鄙不可侮是皆無損於人不宜於身勉之哉時思鄙言光之贈盡此而已未知足下復何以處我也慶歴乙酉嵗二月庚戍序送李子儀序皇祐三年作寳元中光從事在蘇子儀僑居州下始得從之遊竊嘗與僚友議曰人之裕於才者或􅄶於行豐於行者或歉於才要之不能得兼若子儀者才如是行如是佗日吾屬其敢望乎間二年子儀升進士第名聲暴灼於薦紳間光聞之喜曰所期果不負矣又五年光與子儀俱官太學日夕相從講道甚樂不幸子儀遭先府君憂去職服除來還則光去遷佗官雖不得亟見然慕重其為人常若在旁也皇祐三年丞相文公出鎮許昌士大夫願從後車以自效於幕下者甚衆公無所取獨與子儀俱夫以文公之明且公而子儀獨應其選其不輕而重可知矣論者猶謂子儀不當舎中都遊外方夫玉巨用之則為璧為圭細用之則為環為玦玉能明潔潤澤而巳矣璧與圭環與玦唯工者之所為玉豈能自制哉行矣子儀君子之道猶玉也亦烏適而不見貴乎送孟翺宰宜君序天之所以賜人賢不肖之分曰心智而巳矣故佗可能也心智之叡明強識不肖者竭力無以及焉仲習為夏縣尉封域之内山澤之夷險道途之逺邇邑落之踈宻無不歴歴詳其名數吏卒數百人民踰萬室性行之善惡家貲之豐約居處之里囷倉之數皆能條例而詮次之凡人居官朞嵗不能悉吏卒之名氏而仲習小大畢舉如指諸掌抑可謂叡明而強識矣國家謂親於民事者無若令於三王之世伯子男之職也而以資秩乆次為之甚無謂乃詔二千石舉明逹政事者充其官仲習以是得宜君令夫為政者患於不知民之情偽下之得失上蔽下壅故賞罰糾紛而不治今仲習之精力乃如此以從小邑之政是猶激疾風以振鴻毛委洪波以滅炬火何足言者異日居相府立柱下總天下之圖書承明主之顧問應答如響畫地成圖亦誰得居其右哉戊寅嵗僕與仲習同登進士第辛巳嵗僕以憂去官歸鄉里日從仲習遊睹其強識未嘗不咨嗟駭服故於其行也書以贈之送丁浦江序始僕為児時家於夀之安豐浦江以年少氣雋誦書屬文聞於縣中家之父兄皆祝僕曰佗日得如丁君足矣及壮侍親之呉浦江為椽於潤州州人稱曰丁君為治精敏肅給凡州之僚吏無與比者僕乃知丁君非徒以文自髙又能以政自力信乎其才之周也謂其去此而升美仕若巨}
