  - {type: variant, offset: 2243, length: 270, content: 年止於五十八彼不以其道得者或位極將相壽及胡耇從愚者視之則可爲憤邑從賢者視之以此况彼所得所失孰爲多少邪後之人得是書者冝寳蓄之當官事君苟能効其一二斯爲偉人矣熈寕五年八月二十九日司馬光序劉道原十國紀年序皇祐𥘉光爲貢院属官時有詔士能講解經義者聽别奏名應詔者數十人趙周翰爲侍講知貢舉問以春秋禮記大義其中一人所對最精詳先具注䟽次引先儒異說末以巳意論而断之凡二十問所對皆然主司驚異擢爲第一及發糊名乃進士劉恕年十八矣光以是慕重之始與相識道原乃其字也道原是歲賦詩論䇿亦入髙等殿試不中格更下國子監試講經復第一釋褐鉅鹿主簿和川令陸介夫爲廣西帥奏掌機冝前丗史自太史, WYG: 張}
