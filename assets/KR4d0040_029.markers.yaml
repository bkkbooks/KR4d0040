  - {type: variant, offset: 3327, length: 0, content: '', WYG: 乞罷近臣恩命}
  - {type: variant, offset: 3331, length: 716, content: 二道臣前者兩次上言乞詔侍從臣每日輪一貟直資善堂夜則宿於崇文院以備非時宣召若有事故請假則與以次官互換直宿亦曽靣奉德音云欲自以聖意宣諭政府施行此事自後至今未聞施行臣不避煩瀆天聽再三進言者蓋以爲國之要在於審察人材周知下情而巳審察人材之謂明周知下情之謂聦明則百官稱其職聦則萬機當其理百官稱其職萬穖當其理治之極也賢不肖渾殽之謂昏下情不上通之謂蔽昏則百職隳曠蔽則萬機乖戾百職隳曠萬機乖戾亂之至也極治則安至亂則危故聦明昬蔽者治亂之大本也今陛下即政之𥘉厲精求治而不以此事爲先欲以興隆祖業垂𥙿後昆是猶却行而求及前人也故臣不得不勤勤懇懇爲陛下再三言之書稱尭之德曰稽于衆捨已從人稱舜之德曰賔于四門明四目逹四聦故能咸熈庻績格于上下至今言聖人者無不以二帝爲首何哉聦明故也秦二丗納趙髙之謀恐譴舉不當見短於大臣而深拱禁中漢靈帝惑趙忠之言謂人君登髙則百姓散離而不敢登臺榭北齊後主忠度儒懦不喜見朝士非私昵未甞交語隋煬帝沈湎淫泆常在後宮盗賊滿天下惡人言之是以上下怨叛至於殺身滅國而終不自知後丗言無道者無不以四君爲首何哉昬蔽故也太祖太宗起於側微天下艱難民間情僞無不備知然南靣之日延訪群臣惟恐不及晝日不足継之以夜下至役夫田婦無不詢察以盡其情用能創業垂統力致太平陛下以帝王子孫生長冨貴朝士大夫素未相接耕織勞苦不經耳目當兹親政之始雖孜孜下問朝夕不倦以察人情猶恐不盡况深居九重非視朝之時不見群臣群臣非官位職事有列上殿無由進見顒卭淵黙以嚴重自居將使幽逺之民銜冤失職者何由上聞踈賤之臣懷材藴徳者何由自逹哉國家安危之所分將於此乎在臣是以不勝憤懣區區盡忠重爲陛下陳之伏望陛下察爲國之要觀唐虞之所以興秦漢齊隋之所以亡継祖宗之志以守太平之業檢㑹臣前來所奏兩劄子内事節早賜施行實天下幸甚取進止, WYG: ''}
