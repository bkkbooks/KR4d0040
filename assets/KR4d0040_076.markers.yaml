  - {type: variant, offset: 4359, length: 1342, content: 龐之道墓誌銘龎之道名元魯故相國頴公之元子妣曰嘉興縣君邉氏其郷里世系見於頴公之誌天聖中先君與穎公皆為群牧判官居相近光朝夕與之道逰兄事之之道時尚㓜性明頴於文辭不待力學而自能讀書初如不措意巳盡得其精要前軰見之皆驚嘆光年不相逺自視如土瓦之望珠玉頴公為廣南東路轉運使奏之道試祕書省校書郎及為知雜御史又奏守将作監主簿景祐五年光與之道同登進士第之道簽書懷州判官事未㡬徙知河南縣事縣多豪貴家素號難治之道至繩案無所避豪貴為之歛手徙簽書河中府判官事後数年光過河南問於野人曰龐君為治何如曰明而有㫁又問今宰曰不及龐君逺矣乃知野人最不可欺而論議甚公也頴公為鄜延經略安撫使奏之道書機宜文字時方用兵文書填委或中宵不得寐頴公入為樞宻副使欲奏其勞為之求升資之道辭曰将吏有功者願大人悉奏之元魯不足言也頴公喜而從之乆之以大理寺丞監國子監書庫慶暦七年五月戊寅以疾終年三十二殯於薦嚴佛含之道事継母劉夫人撫畜諸弟始終無間言及没哭之皆哀不自勝終頴公之世親友不敢語及之道語之頴公未甞不悲慟始光知之道敏於為學及過河南又得其為政焉其沒也益知之道孝友之行深矣先娶孫氏故都官貟外郎道之女又娶張氏今吏部侍郎致仕存之女一女早卒遂無子嘉祐八年六月壬申弟元英遷之道之柩葬於雍丘頴公之墓側祔以孫氏光為之銘曰學施於治孝友兼美官不登朝沒纔壮齒如光何人榮禄及此噫才固不足言直命而已矣蘇主簿夫人墓誌銘治平三年夏蘇府君終于京師光往弔焉二孤軾轍哭且言曰某将奉先君之柩歸葬於蜀蜀人之祔也同壟而異壙日者吾母夫人之葬也未之銘子為我銘其壙光固辭不獲命因曰夫人之徳非異人所能知也願聞其略二孤奉其事状拜以授光光拜受退而次之曰夫人姓程氏眉山人大理寺丞文應之女生十八年歸蘇氏程氏富而蘇氏極貧夫人入門執婦職孝㳟勤儉族人環視之無絲毫鞅鞅驕倨可譏訶状由是共賢之或謂夫人曰若父母非乏於財以父母之愛若求之宜無不應者何為甘此𬞞糲獨不可以一發言乎夫人曰然以我求於父母誠無不可萬一使人謂吾夫為求於人以活其妻子者将若之何卒不求時祖姑猶在堂老而性嚴家人過堂下履錯然有聲巳畏獲􅓧獨夫人能順適其志祖姑見之必說府君年二十七猶不學一旦慨然謂夫人曰吾自視今猶可學然家待我而生學且廢生奈何夫人曰我欲言之久矣悪使子為因我而學者子茍有志以生累我可也即罄出服玩鬻之以治生不数年遂為富家府君由是得專志於學卒成大儒夫人喜讀書皆識其大義軾轍之㓜也夫人親教之常戒曰汝讀書勿効曹耦止欲以書自名而已每稱引古人名節以勵之曰汝果能死直道吾無戚焉巳而二子同年登進士弟又同登賢良方正科目宋興以来唯故資政殿大學士吴公育與軾制䇿入三等轍所對語尤切直驚人繇夫人素朂之也若夫人者可謂知愛其子矣始夫人視其家財既有餘廼歎曰是豈所謂福哉不巳且愚吾子孫因求族姻之孤窮者悉為嫁娶振業之郷人有急者時亦賙焉比其沒家無一年之儲夫人以嘉祐二年四月癸丑終於郷里其年十一月庚子葬某地年四十八軾登朝進封武陽縣君几生六子長男景山及三女皆早夭㓜女有夫人之風能屬文年十九既嫁而卒嗚呼婦人柔順足以睦其族智能足以齊其家斯已賢矣况如夫人能開發輔導成就其夫子使皆以文學顯重於天下非識慮高絶能如是乎古之人稻有國有家者其興衰無不於閨門今於夫人益見古人之可信也銘曰貧不以汚其夫之名富不以為其子之累知力學可以顯其門而直道可以榮於世勉夫教子底于光大夀不充徳福宜施於後嗣温國文正公文集卷第七十六, WYG: ''}
