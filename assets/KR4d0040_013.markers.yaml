  - {type: variant, offset: 20, length: 636, content: 爲霜風所損又和惜春謡還陳殿丞原人論宗宻所撰破自然破元氣破天命明佛性和王秀才虞仲字道濟以光始自陜右遊山歸復登少室爲詩見寄西湖泛舟輙用前韻寄呈君實鎮奉和新買疊石溪莊再用前韻招景仁和鎭戲書宋子才止足堂寄題宇文中允之邵所居貽夸者春遊和潞公遊天章楚諌議園宅還張景昱景昌秀才兄弟詩卷寄題張著作中理善頌堂嘉州公裕學士之父和宇文公南塗中見寄酬張二十五秀才南園遣意景昱字明叔酬張三十秀才見贈景昌字子京八月十五夜陪留守宣徽登西樓值雨待月乆不見秋雨新霽遊水北馬上偶成運使虞部桉行洛西諸縣因遊所過名山有詩百餘首合爲一編䝉賜寵示俾之継作一首吕宣徽挽歌二首和君貺暮秋四日登石家寺閣晚泛洛舟又和六日四老㑹并宋子才大監李幾先将軍和王少卿尚恭字安之十日與留臺國子監崇福宫諸官赴王尹賞菊之㑹和白都官序見贈和白都官歸長安送雷章秘丞知芮城酬邵堯夫見示安樂􅌪中打乖吟和邠守宋度支迪來卜居與南園爲鄰和張文𥙿𥘉寒十首寄題刁景純藏春塢景純致政歸京口治其所居命曰藏春塢前有一岡皆松林命曰萬松嶺和君貺少林寺又和嶽祠謝雪題嶽寺平法華庵望日示康廣宏和君貺題潞公東莊和君貺任少師園賞梅別韻一首又和開叔和公廙喜雪用莊字韻和史誠之謝送張明叔梅䑓三種梅花早春寄景仁和君貺宴張氏梅䑓看花四絶句和君貺清明與上巳同日泛舟洛川十韻和君貺寄河陽侍中牡丹又和安國寺及諸園賞牡丹送酒與邵堯夫因戲之前送牡丹藥苗堯夫皆有詩酬仲通初提舉崇福宫見寄魏忠献公挽歌辝三首酬君貺和景仁對酒見寄三首野軒以下四首和安之汙亭藥軒晚暉亭奉同運使陳殿丞知儉字公廙惜洛陽牡丹爲, WYG: 為}
