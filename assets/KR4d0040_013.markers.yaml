  - {type: variant, offset: 4034, length: 0, content: '', WYG: 留别友生野際共為别客亭芳草新何心更執酒滿目盡傷春今古無窮路東西相背塵行行復回首不欲著鞭頻二月六日初見待漏房前栁色微緑欣然成詠宫城映出絲絲緑頓覺皇州春意逥従此不辭驅瘦馬六街終日踏塵埃垂栁天意清和二月初春風不動整如梳陶潜宅外時無此想更蕭條不易居閒居故人通貴絶相過門外真堪置雀羅我已幽慵僮更懶雨來春草一畨多中秋陪張龍圖讌射堂初夕隂雲酒行頓解喜而成詠飛葢共徘徊西園髙宴開秋雲惜明月留待庾公來貽宋四行簡迪離羣如幾辰屈指十青春不意輪蹄跡共兹京洛塵文場投漆契客路轉蓬身别易相逢闊過従莫厭頻和國子夏主簿李花有章儒官岑寂覺春閒仙李繁花重壓欄碎錦不飛蒙樹合素雲欹亞舉枝難能詩此日當推謝捧賜他年足繼桓更約雕盤薦秋實豈徒穠􅃩一朝看傳家集巻十欽定四庫全書傳家集巻十一宋司馬光撰律詩六}
