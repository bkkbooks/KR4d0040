  - {type: variant, offset: 0, length: 3602, content: 温國文正公文集卷第十律詩五致政邵少卿挽辭之美訪及不獲展奉以詩爲謝送聶祕丞希甫字之美宰桐城二首送蒲中舍霜致政歸蜀前栗亭令蘇門先生和冲卿喜雨偶成寄贈致仕劉都官諷張元常云諷年六十三致仕夫婦皆徤居簡州賴山中有二子皆有官其一登進士第諸孫皆好書和宋郎中選字子才孟秋省直八月五夜省直送王著作慥西京簽判夢穉子梅聖俞挽歌二首次韻和王勝之十二月十五日退朝馬上作又和雪送裴中舎士傑赴太原幕府和吴省副中復字仲庶梅花半開招慿由張司封飲伯平字公達郭氏園送仲通出刺棣州得朝字賞花釣魚二首御製後苑賞花釣魚七言四韻詩一首奉聖旨次韻秦人送致仕朱郎中令孫依韻和仲庶省壁畫山水太博同年葉兄紓以詩及建茶爲貺家有蜀牋二軸輙敢繫詩二章獻於左右亦投挑報李之意也送宋郎中知鳯翔府秋夕不寢呈諌長樂道龍圖始平公以光得免使北賜之以詩謹依韻酬和孟甞喜李侍郎東之得西京留臺始平公作雙樗庵命光爲詩忝職諌垣日負憂畏𬗟思雲夫處土老兄䔥然物外何樂如之因成浮槎詩寄獻以杼鄙懷邇英閤讀畢後漢書蒙恩賜御筵詩送李侍郎東之西京留臺送元待制絳字厚之出牧福唐送吴駕部處厚知真州和趙子輿龍州吏隱堂寄題錢君倚明州重修衆樂亭冬夜張元常挽歌二首和景仁夜讀試卷奉和御製龍圖等閣觀三聖御書詩又和雪霽又和二月五日夜風雪仁宗皇帝挽歌詞二首故相國頴公挽歌詞三首致政邵少卿挽詞北固啓佳城東吴霣德星繐帷長寂寞羽扇遂飄零泉燭千年碧霜松數寸靑慶餘知有在玉樹滿階庭之美訪及不獲展奉以詩爲謝昔君来闕下定館必吾廬今者雖相值依然是索居之美館於僧舎不堪休沐少便使往還踈深愧原思巷空回長者車送聶秘丞希甫字之美宰桐城二首問子青雲器胡爲不少留未能充禄養安敢及身謀卓爾千人俊居然百里優連城價終在自是玉工羞七載一相見怳然如路衢形骸漸枯槁志業轉荒蕪往事雲過眼新悲雪染鬚明朝又分首上馬即重湖送蒲中舎霜致政歸蜀前栗亭令厭苦折腰乆飄然黄鵠飛田園未蕪没鄰曲有光輝昔奮儒衣去今紆朝紱歸人生貴知足得此巳爲希念昔兩髦日烏奴同燕遊随時自有樂何物可爲愁豈意今頭白相逢欲涕流慿君訪題壁好在水西樓光侍先君爲利州路轉運使與君屢遊烏奴山寺題名屋壁蘇門先生長嘯蘇門石行藏丗莫知逍遥心迹逺寂寞姓名誰郷在無何有時方不可爲麟麟本神物安得係而羈和沖卿喜雨偶成萬里風隨快雨來塵昏消伏旱光開物情濯熱參差喜天意爲仁容易湖簾映薄寒燈有量䆫含虗曰麝成煤君侯雅有江湖興蕭灑何湏氣象催寄贈致事劉都官諷張元常云諷年六十三致事夫婦皆徙居簡州頼山中有二子皆有官其一登進士第諸孫皆好書星郎年未至辭禄一何髙目瑩棲靈氣眉踈出秀豪胷中自有樂身外盡徒勞囬首紅塵地紛紛笑我曹解紱沱江外誅茅井絡邊老萊夫婦隠韋孟子孫賢浮蟻邀旁舎蹲鴟種薄田不湏親􅕇杖想望巳蕭然范景仁詩云移家尚恐青雲淺隱几唯知白日長朱公綽詩云䟽草焚来應見史橐金散盡只留書和宋郎中選字子才孟秋省直夜乆殘暑盡好風來滿襟牀空唯置枕冠小不施簮竹影亂涼月林梢轉曉參人心有喧寂何必欲雲岑八月五夜省直大火巳西落温風猶襲人留連惜紈扇散誕脫紗巾蟾影夜色淺蛩聲秋意新圗書足自適何物更關身送王著作慥西京簽判古來都邑美孰與雒陽先況復元侯貴兼之從事賢玦離横闕塞珠曲逗伊川慰眼登臨樂送君空惘然夢稺子窮泉纎骨巳成塵幽草閑花二十春昔日相逢猶是夢今宵夢裏更非真梅聖俞挽歌二首兵形窮勝負史法貫興衰落落雖殊衆恂恂不迕時位卑名自重才大命湏竒丗俗那能識傷嗟正爲詩􅃮燈無復曙柏徑不知春南紀光華減中朝俊秀貧淒清千古韻寂莫一丘塵異日昭亭下方多瀝酒人次韻和王勝之十二月十五日朝退馬上作瓦溝微白雪光清闕角𥘉紅海日騰塵息長街千騎人鞘鳴深殿六龍昇雲巖有客空囬首圭蓽何人尚曲肱自笑鯫生章綬縛不容逃去正如􅊻又和雪四簷冰管未全晞一夕隂風雪又飛客卧牛衣憂死别人留玉塞望生歸公車歳晚憐東郭遼海雲深失令威頗憶當年映書否物華如舊鬢毛非送裴中舎士傑赴太原幕府元戎台鼎舊大府節旄新邊候正無事賔筵况得人山寒太行暁水碧晉祠春齋釀蒲萄熟飛觴不厭頻和吴省副中復字仲庻梅花半開招慿由張司封飲伯玉字公逹帝郷春色嶺頭梅髙壓年華犯雪開正與嘉賔思共醉不湏芳物重相催從車貯酒傳呼岀側弁簮花倒載囬風雨難期王事劇未知休沐幾旬來郭氏園送仲通岀刺棣州得朝字名園送嘉客冠蓋去傾朝小雨塵微歛餘寒酒易消鴈歸春近塞日上海生潮北道平如掌東風五馬驕賞花釣魚二首飛廉通上苑鳷鵲帶夫淵樹色含春霧波光靜曉煙香飄仙仗外花舞御巵前籊籊文竿裊簁簁素鮪鮮誤陪金馬籍愧奉栢梁篇願獻南山壽宸遊侍億年日麗芙蓉闕春濃太液波苑門鳴玉集輦路翠華過芳樹周阿宻嘉魚在渚多浮英入樽斝頒首出蒲荷人樂熈熈德臣賡旦旦歌萬生同皷舞相與醉天和御製後苑賞花釣魚七言四韻詩一首奉聖旨次韻馺娑蜚廉次第開鳴鞘傳蹕自天來雲隨綵仗低臨幄栁壓金隄翠入杯檻倚柔風絲縹緲花翻麗日影徘徊上林春色長如舊玉輦嬉遊歳歳陪秦人楚旗獵獵蓋山紅回首咸陽一炬空惆悵秦人虚用意幾年辛苦得山東送致仕朱郎中令孫丗間榮利無窮物奔走勞勞何所之仕宦爲郎非不逹功名有命待無時橐中雖乏千金直膝下常攜兩綬兒細校人生能此少好從閭里樂期頥依韻和仲庶省壁畫山水畫工執筆巳心遊稍稍蘅臯引杜洲堆案煩文猶倦暑滿軒新意忽驚秋天生賢者非無爲官遇明時未易休正恐怒飛朝暮事丹青難得乆淹留太博同年葉兄紓以詩及建茶爲貺家有蜀牋二軸輙敢繫詩二章獻於左右亦投桃報李之意也閩山草木未全春破纇真茶采擷新雅意不忘同臭味先分疇昔桂堂人西來萬里浣花牋舒卷雲霞照手鮮書笥乆蔵無可稱願投詩客助新編送宋郎中知鳯翔府昔解陳倉印於今二十秋雙鳬乆東上五馬重西遊鐃騎行關外壷漿擁道周民心巳化服條敎不更修秋夕不寢呈諫長樂道龍圗雨氣生燈暈霜寒入漏聲踈籬過螢影腐葉掩蟲鳴丘壑違𥘉願簮𥚑徇外榮丹心終夜苦白髮詰朝生恩與乾坤大身如草木輕何階致明主垂拱視升平始平公以光得免使北賜之以詩謹依韻酬和皇華將命得人難專對非才輒自言幸免驅車渉沙漠尚容載筆待宣温不惟羞屈穹廬膝無奈常逰魏闕魂衮職區區未能補何時餘諭奉清樽孟甞冠蓋盈門意氣豪海魚兼兩未充庖歸来散盡三千客方寤時人市道交喜李侍郎東之得西京留臺賤子何爲者栖栖今二毛滄波浮片葉大塊載秋毫利物物何補營身身巳勞羡君遣世網脫屣一何髙始平公新作雙樗庵命光爲詩間氣生王佐多材秉國鈞㨂隆慿𣏌梓節勁仰松筠底績承平業遺榮壽考身結廬依散木退讓樂天真忝職諌垣日負憂畏𬗟思雲夫處士老兄蕭然物外何樂如之因成浮槎詩寄獻以杼鄙懷秋水浮槎客漂如一葉䡖鷗群雖仗信鯨口幾忘生耿耿天津闊滔滔海浪驚何時還故土懷糈問君平邇英閤讀畢後漢書蒙㤙賜御筵詩赤伏開興運昆陽定壯圗官儀還舊物郊兆建新都杲日群隂破油雲萬類蘇鑾輿陟喬嶽璽綬撫匈奴厚禄優諸將嘉猷訪大儒重明紹堂御名奕葉奉規摹叔世綱條紊遺風節義扶袁安空隕涕揚震卒蒙辜倿指車前鹿人瞻屋上烏炎精盡河渚黄眚兆當塗青簡傳良直金華侍燕娱興衰炳轍跡淑慝粲龜符赫赫天光照孳孳睿思䊸方齊建武治不啻永平俱化盛文明止恩隆飲食需晞陽慙祀棘濡咮愧鵜鶘帝力生成大臣功報効無先民誠可監願不忘斯湏送李侍郎東之西京留臺先公勲烈盛鹽梅清白仍聞世濟才華省拂衣辭簿領長衢囬首謝塵埃嵩峯排霧依俙出洛水迎人迤邐來寄語馬前頭白吏何殊昔日李西臺送元待制絳字厚之出牧福唐甌越東南羙田肥果稼饒況懷新賜綬重過舊題橋食足姦回熄風移獄犴銷長才報政速鈴閤日逍遥送吴駕部處厚知真州曏託屏星駕同隨丞相車終朝容懶拙經歲庇迃踈共此趨雲闕旋聞建隼旟江淮一都㑹遊刃必多餘和趙子輿龍州吏隠堂四望逶迤萬疊山微通雲棧落塵寰誰知吏道自可隠未必仙家有此閑酒熟何人能共醉詩成無事復相關浮生適意即爲樂安用腰金鼎鼐間寄題錢君倚明州重修衆樂亭横橋通廢島華宇出荒榛風月逢知己湖山得主人使君如獨樂衆庶必深顰何以知家給笙歌滿水濵張元常挽歌二首爲吏文無害臨民政不苛渾金生自羙古井澹無波方喜風鵬舉旋聞隙駟過善人宜壽考報施定如何秀眉無足驗結轖遽爲災郷曲三年别江山萬里回林閭飛旐入書劒逐舟來墳草枯還緑重泉不復開冬夜冬夜何其永寒光四泬漻鴈橫星歴歴人靜漏迢迢破屋霜應重荒庭雪未消不眠何所念逹暁思無憀奉和御製龍圖等閣觀三聖御書詩積厚丕丕業重光郁郁文寳書垂列宿玉字切浮雲散帙鳴鑾駐充庭雜佩分願移天縱藝似續聖功勤和景仁夜讀試卷案前宫燭墮花頻滿目髙文妙入神勇氣先登勢無敵巧心後發語尢新好賢何啻三薫貴求寳方知百汰真愚魯自非慿驥髮崑山千里到無因又和雪霽南宫來幾時挾纊易春衣意謂花將晚何言雪尚飛夜聲通旅枕暁色弄晴暉繼日勞王事離鴻巳北歸又和二月五日夜風雪春風正豪怒夜雪復飄揚勿使羇愁乱自知清興長簾踈聲淅瀝燈冷暈微茫此夕牛衣客成名不可忘仁宗皇帝挽歌詞二首聲教萬餘里文明四十春茂勲留信史盛福滿生民共適禽魚樂安知橐籥仁百年龍馭逺空復仰威神霧曉銅魚躍霜寒閶闔開哀聲際海發靈仗拂天來别寢嚴虗位重閽閟夜臺栢城空有路無復屬車回故相國頴公挽歌辭三首儒衣臨絶塞廟略運竒兵緩帶羌塵靜靈旗海霧清公心結明主隂德庇群生名遂身仍退人間五福并銘旌逺明㓕騎次去低昻三鼎功名大重泉日月長鶴飛來弔客牛卧卜連岡車馬還城郭悲風滿白楊滄波與鄧林魚鳥乆飛沈一旦成陳迹何人識寸心髙山亡景行流水失知音淚盡離東閤歸來破故琴温國文正公文集卷第十, WYG: ''}
