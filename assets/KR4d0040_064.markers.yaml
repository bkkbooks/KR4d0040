  - {type: variant, offset: 1, length: 5982, content: 一送同年郎兄景微歸㑹稽榮覲序顔太𥘉雜文序名苑序送李揆之推官序諸兄子字序送李子儀序越州張推官字序馮亞詩集序送孟翺宰冝君序送丁浦江序古文孝經指解序王内翰贈啇雒寵主簿詩後序并州學規後序送胡完夫序送通山郝令序敘清河郡君送同年郎兄景微歸㑹稽榮覲序進士此科見重於時久矣自兩漢而下選舉之盛無與爲比廼至敗鬻給役之徒皆知以爲美尚是以得之者矝夸滿志焜耀於物如謂天下莫己若也亦何惑哉賢者居丗㑹當蹈仁履義以徳自顯區區外名豈足恃邪郎景微與余周旋甚悉余備知之其爲人剛不可挍柔不可犯和易以爲樂節正以爲禮由七品官舉進士一上十選可謂美矣然未甞有偃蹇之容自滿之意或未識者卒然遇之尚不知其爲舉人又焉知其有科級邪所謂以德自顯者殆無過此乎家君與尊諌議景徳中同年登第在朝廷最名相善余又與景微以䕃籍同官偕舉進士送名於天府覆試於南廟以至登第未甞異處古人有言朋友丗親如我比者固不踈矣今將泛舟南下拜親于越謂余必以文序别余誠荒陋非不知辭顧以非余無能紀其實美者故直書以贈之時景祐五年季夏司馬光序顔太𥘉雜文序天下之不尚儒乆矣今丗之士大夫發言必自稱曰儒儒者果何如哉髙冠博帶廣袂之衣謂之儒邪執簡伏冊呻吟不息謂之儒邪又况點墨濡翰織製綺組之文以稱儒亦遠矣捨此勿言至於西漢之公孫丞相蕭望之張禹孔光東漢之歐陽歙張酺胡廣丗之所謂大儒果足以充儒之名乎魯人顔太初字醇之常憤其然讀先王之書不治章句必求其理而已矣旣得其理不徒誦之以誇誑於人必也蹈而行之在其身與郷黨無餘於其外則不光不光先王之道猶蘙如也廼求天下國家政理風俗之得失爲詩謌洎文以宣暢之景祐初青州牧有以荒淫放蕩爲事慕嵆康阮籍之爲人當時四方士大夫樂其無名教之拘翕然效之寖以成風太初惡其爲大亂風俗之本作東州逸黨詩以刺之詩遂上聞天子亟治牧罪又有鄆州牧怒屬令之清直與己異者誣以罪榜掠死獄中妻子弱不能自訴太初素與令善憐其冤死作哭友人詩牧亦坐是廢於時或薦太初博學有文詔用爲國子監直講㑹有御史素不善太初者上言太初狂狷不可任學官詔即行所至改除河中府臨晉主簿太𥘉爲人實寛良有治行非狂人也自臨晉改應天府户曹掌南京學卒於睢陽舊制判司簿尉四考無殿負例爲令録雖愚懦昏耄無所取者積以年數必得之而太初才識如此舉進士解褐近十年卒不得脫判司簿尉之列以終身死時蓋年四十餘噫天喪儒者使必至於大壞乎將犬吠所恠者必見鋤也何其仕與壽兩窮如此丗人見太𥘉官職不能動人又其文多指訐有疵病者所惡聞雖得其文不甚重之故所弃失居多余止得其兩卷在同州又得其所爲題名記今集而序之前丗之士身不顕於時而言立於後丗者多矣太初雖賤而夭其文豈必不傳異日有見之者觀其後車詩則不忘鑒戒矣觀其逸黨詩則禮義不壞矣觀其哭友人詩則酷吏愧心矣觀其同州題名記則守長知弊政矣觀其望仙驛記則守長不事厨傳矣由是言之爲益豈不厚哉名苑序孔子稱名不正則言不順言不順則事不成乃至於百姓無所措手足甚矣聖人重名之至也劉子政述九流有名家者流曰尹文子公孫龍子等凡七家尹文子今存其術雜黄老刑名之言耳餘書更歷乆逺丗鮮傳之今有孫氏釋名盖亦其類也昔者魯哀公問社於宰我宰我對曰周人以栗曰使民戰栗孔子聞而深非之曰成事不說遂事不諫旣往不咎戒其後復爲也兩漢以來儒者務爲此態旁貫曲取紆辝蔓說至有依聲襲韻強爲立理誠可閔笑者甚衆此非宰我栗社之比邪今釋名之文亦猶是矣抑亦失聖人之旨逺哉愚甞念之乆矣間因觀經傳諸書有可以正名者因記之竊以爲備萬物之體用者無過於字包衆字之形聲者無過於韻今以集韻本爲正先以平上去入衆韻正其聲次以說文解字正其形次以訓詁同異辨其理次以經傳諸書之言證其實命曰名苑其有法制云爲時遷物變者亦略敘其㳂革欲人知其源流變態云爾至於魚蟲草木之類雖纎苛煩碎非忼慨君子所當用心然亦重名之一節爾至於正三才道德禮樂善惡真僞之名輔佐丗治其功亦不細哉謂文武之道未墜於地在人賢者識其大者不賢者識其小者將來君子好學樂道庶幾亦有取焉送李揆之推官序古者朋友將别必有言以相贈與處也近丗多爲之序序者其亦贈處之道歟然丗俗失之往往崇虚辭相歎譽曽無一言以爲規是豈昔人贈處之道哉愚以爲朋友之道譽其善規其過專譽而不規路人而聚處飲酒於市道者耳光於揆之非直同官而巳實朋友也於其行又可無言以贈之揆之名相子孫聦逹有羙才習於時務觀其行能殆無所復擇矣然爲之友者猶舉其毛髮之闕而告之誠欲就其全也夫人非至聖必有短非至愚必有長至愚之難值亦猶至聖之不丗出也故短長雜者舉丗比肩是也是以君子之取人也不求備稱其善不計其惡求其工不責其拙如此故人竭其用而恱從之怨憎不至而功業榮焉然則垢靣而眥操耒而胥靡者尚未可輕辱而易視也禹曰知人則哲惟帝其難之堯禹以爲難則凡人安得謂之易人事常不可測夫又詎知操耒者不爲阿衡而胥靡者不爲傅說若之何其可以心目断也竊甞聞之夫智者攘患常於至微著而欀之則無及巳昔智伯一㑹而辱二主一臣以成鑿臺之禍以智伯之強人莫之害失一言於樽爼之際其禍章章如此况無其勢取悔易矣夏書曰一人三失怨豈在明不見是圖足下行矣慎之智或召災敏或賈禍愚不可忽鄙不可侮是皆無損於人不冝於身勉之哉時思鄙言光之贈盡此而巳未知足下復何處我也慶暦乙酉嵗二月庚戍序諸兄子字序余兄子十四人大抵未字皇祐二年告歸過家徧爲之字皆附其名以寓訓焉京字亢宗京大也孟子曰修其天爵而人爵從之爾姑大其德乎然後宗有所亢矣亮字信之孔子稱去食去兵而信不可去信者行之本也禀字從之從順也君子在家則禀於親出則禀於君無所不用其順焉夫順者天之所助也元字茂善元者善之長也勉善不巳能無長乎育字龢之致中和天地位焉萬物育焉况其邇者乎良字希祖詩云母念爾祖聿修厥德君子修德以爲祖也可不勉乎冨字希道智者冨於道愚者冨於賄爾其勉於智乎齊字居德齊中也孔子曰中庸之爲德其至矣乎居德以中奚適而不利哉方字思之方道也孔子曰道不逺人苟思之精行之勤則道何逺之有哉爽字成德爽明也明敏辯智天之才也中和正直人之德也天與之才必資人德以成之與其才勝德不若德勝才故願爾勉於德而巳矣衮字𥙷之君子之事上進思盡忠退思𥙷過異日爾仕於朝當以仲山甫爲法乎章字晦之君子之道闇然而日章然則欲道之章者其惟晦乎弈字襲美詩云夙興夜寐母忝爾所生弈丗之美將待爾而襲之可不勉歟裔字承之爾於昆弟中爲最㓜承祖之美者捨爾尚誰任哉嗚呼朝夕不離於口耳者名字而巳爾曹苟能言其名求其義聞其字念其道庶幾吾宗其猶不爲人後乎送李子儀序寳元中光從事在華子儀僑居州下始得從之遊竊甞與僚友議曰人之𥙿於才者或𥚹於行豐於行者或歉於才要之不能得兼若子儀者才如是行如是他日吾屬其敢望乎間二年子儀升進士第名聲暴灼於縉紳間光聞之喜曰所期果不負矣又五年光與子儀俱官太學下日夕相從講道甚樂不幸子儀遭先府君憂去職服除來還則光去遷他官雖不得亟見然慕重其爲人常若在旁也皇祐三年丞相文公出鎮許昌士大夫願從後車以自効於幕下者甚衆公無所取獨與子儀俱夫以文公之明且公而子儀獨應其選其不輕而重可知矣論者猶謂子儀不當舎中都遊外方夫玉巨用之則爲璧爲圭細用之則爲環爲玦玉能明㓗潤澤而已矣璧與圭環與玦唯工者之所爲玉豈能自制哉行矣子儀君子之道猶玉也亦烏適而不見貴乎陜郡司馬光序越州張推官字序天下之事未甞不敗於專而成於共專則隘隘則睽睽則窮共則博博則通通則成故君子修身治心則與人共其道興事立業則與人共其功道隆功著則與人共其名志得欲從則與人共其利是以道無不明功無不成名無不榮利無不長小人則不然專己之道而不能從善服義以自廣也專己之功而不能任賢與能以自大也專己之名而日恐人之勝之也專己之利而不欲人之有之也是以道不免於蔽功不免於楛名不免於辱利不免於亡此二者君子小人之大分也陜郡張君名共才甚美行甚修舉進士登上科今從事於浙東光辱與張君爲同郡人習其爲人固乆竊以爲古者名於親而字於朋友字必附名而爲義焉光是敢輙廣其名之義而字曰大成以勉之異日張君克充其名顯𥙿光大庸可量哉馮亞詩集序文章之精者盡在於詩觀人文徒觀其詩斯知其才之逺近矣陜人馮亞字希顔學詩於處士魏野偏得其道潘逍遥深重之未四十而終魏詩大行於時亞詩去魏不逺而所傳者郷曲而巳所以然者由魏之壽亞之夭歟家公知杭州亞子噩以其先人詩集請因杭工刻諸板而傳之余以爲世俗不能識真貴於難得而賤於飽聞不若藏之於家有同志者就而冩之則雖欲勿傳安得不傳若刻之於版有不知文者或敢譏評其臧否衆心無當從而和之是隕夫子之盛名也不果刻序而歸之送孟翺宰冥君序天之所以賜人賢不肖之分曰心智而已矣故它可能也心智之叡明強識不肖者竭力無以及焉仲習爲夏縣尉封域之内山澤之夷險道塗之遠邇邑落之踈宻無不歴歴詳其名數吏卒數百人民踰萬室性行之善惡家貲之豐約居處之里囷倉之數皆能修列而詮次之凡人居官朞嵗不能悉吏卒之名氏而仲習小大畢舉如指諸掌抑可謂叡明而強識矣國家謂親於民事者無若令於三王之丗伯子男之職也而以資秩乆次爲之甚無謂乃詔二千石舉明逹政事者充其官仲習以是得冝君令夫爲政者患於不知民之情僞下之得失上蔽下壅故賞罰糾紛而不治今仲習之精力乃如此以從小邑之政是猶激疾風以振鴻毛委洪波以滅炬火何足言者異日居相府立柱下緫天下之圖書承明主之顧問應荅如響畫地成圖亦誰得居其右哉戊寅嵗僕與仲習同登進士第辛已歲僕以憂去官歸郷里日從仲習遊睹其強識未甞不咨嗟駭服故於其行也書以贈之送丁浦江序始僕爲兒時家扵壽之安豊浦江以年少氣儁誦書屬文聞於縣中家之父兄皆祝僕曰他日得如丁君足矣及壯侍親之吴浦江爲椽於潤州人稱曰丁君爲治精敏肅給凡州之僚吏無與比者僕乃知丁君非徒以文自髙又能以政自力信乎其才之周也謂其此去而升美仕若巨河之決駿馬之逸沛然莫之能禦也間九年復相遇於京師則猶服故時藍衫守銓門求一官礥然乆之乃得婺之浦江同時軰流及後來者仕宦率居其右矣僕然後喟然歎曰才乎才乎信不足恃者邪抑又聞之天將降大任於是人也必先空乏其身行拂乱其所爲浦江近是乎况浦江齒尚壯志尚銳以斯之才而濟之以無倦則徳業之涯未易前知也於其行聊序以勸之古文孝經指解聖人言則爲經動則爲法故孔子與曽參論孝而門人書之謂之孝經及傳授滋乆章句寖差孔氏之人畏其流蕩失真故取其先丗定夲雜虞夏商周之書及論語藏諸壁中苟使人或知之則旋踵散失故雖子孫不以告也遭秦滅學天下之書掃地無遺漢興河間人顔芝之子得孝經十八章儒者相與傳之是爲今文及魯恭王壞孔子宅而古文始出凡二十二章當是之時今文之學巳盛古文排擯不得列於學官獨孔安國及後漢馬融爲之傳諸儒黨同疾異信僞疑真是以歷載數百而孤學沉厭人無知者隋開皇中秘書學士王逸於陳人處得之河間劉炫爲之作稽疑一篇將以興墜起廢而時人巳多譏笑之者及唐明皇開元中詔議孔鄭二家劉知幾以爲冝行孔廢鄭於是諸儒爭難蠭起卒行鄭學及明皇自注遂用十八章爲定先儒皆以爲孔氏避秦禁而藏書臣竊疑其不然何則丗科斗之書廢絶巳乆又始皇三十四年始下焚書之令距漢興纔七年耳孔氏孫豈容悉無知者必待恭王然後廼出蓋始藏之時去聖未逺其書最真與夫他國之人轉相傳授歴丗踈逺者誠不侔矣且孝經與尚書俱出壁中今人皆知尚書之真而疑孝經之僞是何異信膾之可㗖而疑䏑之不可食也嗟乎真僞之明皦若日月而歷丗爭論不能自伸雖其中異同不多然要爲得正此學者所當重惜也前丗中孝經多者五十餘家少者亦不減十家今祕閣所藏止有鄭氏明皇及古文三家而巳其古文有經無傳案孔安國以古文時無通者故以隷體冩尚書而傳之然則論語孝經不得獨用古文此蓋後丗好事者用孔氏傳夲更以古文冩之其文則非其語則是也夫聖人之經髙深幽逺固非一人所能獨了是以前丗竝存百家之說使明者擇焉所以廣思慮重經術也臣愚雖不足以度越前人之胷臆闚望先聖之藩籬至於時有所見亦各言爾志之義是敢輙以隷冩古文爲之指解其今文舊注有未盡者引而伸之其不合者易而去之亦未知此之爲是而彼之爲非然經猶的也一人射之不若衆人射之其爲取中多也臣不敢避狂僣之罪而庶幾於先王之道萬一有所禆焉王内翰贈啇雒龐主簿詩後序王詩云織女峯前貧主簿黄姑巖下舊詞臣乆棲枳棘方思替謾戴貂蟬不是真六里青山雲簇簇一條丹水石磷磷春来䰟夢應相似同是帝城東畔人至道初今觀文殿大學士始平公先君子贈中書令諱格爲主簿啇雒王公時自中書舎人謫官啇州王公以文章獨歩當丗乆宦巳通顯於朝又剛簡峭直固不妄與人交然令君以九品官與相往來王公贈詩意好𣢾宻則令君爲人可知巳至和𥘉始平公以前相國在鄆從容出王公詩示光曰先君甞有徳於商雒吏民至今思之其辭牒判署猶有寳蓄存者而兄今守啇州爲我刻王公之詩於啇雒以慰吏民之心光曰諾退而序其事并詩往刻焉并州學規後序天下所以化在於學百官所以治在於法然則學爲化原法爲治夲兹二者又可忽歟前牧韓公旣徙學而廣之又取法於大學及河南大名京兆府蘇州除苛𥙷漏以爲新規今牧龐公懼學者寑乆而寖忘之也廼命刻著于石嗚呼是規也存雖屋不加美食不加豐生徒不加衆猶爲學興也是規也亡雖列屋萬區糗粻如陵生徒如雲猶爲學廢也後之人司是學者可不慎與年月日具官司馬光序送胡完夫序舜之取士敷納以言明試以功車服以庸考其言中於道試之事克有功然後用之故能舉十六相恭已不爲而天下大治也近丗取士不然一決之以文辭噫文辭豈能盡取士之道邪天下病是乆矣明天子知之廼詔有司自今進士髙第皆先試之小官使知爲下之勞而熟於民之疾苦然後察其功而舉之雖置以爲卿相無不可者嗚呼此誰發哉乃舜之業也晉陵胡完夫以進士貢於州試於有司覆於天子之庭第其名未甞在一二人之後則完夫文辭可知矣其試於有司也光不佞尸其事得竊觀其論䇿蓋非特文辭之美也廼能發明聖人之淵原叶於古而適於今信乎其言能中於道者邪言旣中於道矣自今日以往天子將又試之以事異日完夫能擴其道以充其言則天子將引而置之卿相之位庶幾乎元凱之功復見於今日矣嗚呼天子一更法度復古之道其功業之歸廼巍巍如是豈不偉與噫是道也不難至在完夫勉之而巳矣送通山郝令戭序通山郝明府年四十餘父甞舉進士老而無成以其志之不獲也雖子登進士第仕至長吏終歉歉不自足明府亦以親之不怡也不以仕爲榮乃詣闕上書請致仕而爲其親匄一官朝廷雖嘉其意以無故事不之許明府將之官戚戚若受謫者且曰通山道險逺吾親必不肯行將留妻子侍吾親而單車之官至則復請期於成吾志焉明府於光母黨也光聞其言瞿然慙曰甞聞古之人仕以爲親非爲身也若明府之仕其真無意於身者邪如光者禄旣不及於親而又無𥙷於君役役然耗廪食以飽妻子留而不能去得不爲君子之罪人邪嗚呼明府誠可頌而礪丗人矣嘉祐八年八月十六日涑水司馬光序敘清河郡君元豊六年清河郡君張氏冀州信都人禮部尚書致仕存之女端明殿學士司馬光之妻也年十六適司馬氏夫登朝封清河縣君及為學士改郡君年六十元豐五年正月壬子晦終於洛陽三月辛己晦葬涑水先塋君性和柔敦實自始嫁至于瞑目未嘗見其有忿懥之色矯妄之言人雖以非意侵加黙而受之終不與之辨曲直己亦不復貯於懐也上承舅姑旁接娣姒下撫甥姪莫不恱而安之御婢妾寛而知其勞苦無妬忌心甞夜濯足婢誤以湯沃之爛其一足君批其頰數下而止病足月餘方愈故其沒也自族姻至於厮養無親踈大小哭之極哀乆而不衰咸出於惻怛非外飾也内外無一人私議其短者兹豈聲音笑貌之所能致邪平居謹於財不妄用自奉甚約及余用之以賙親戚之急亦禾甞吝也始余爲學官笥中衣無幾一夕盗入室盡卷以去時天向寒衾無纊絮客至無衫以見之余不能不嘆嗟君笑曰但願身安財須復有余賢其言爲之釋然近世墓皆有誌刻石摹其文以遺人余以爲婦人無外事有善不出閨門故止叙其事存於家庶使後世爲婦者有所矜式耳温國文正公文集卷第六十四, WYG: ''}
