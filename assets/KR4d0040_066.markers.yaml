  - {type: variant, offset: 5125, length: 0, content: '', WYG: 書此為之記獨樂園記熈寜六年作孟子曰獨樂樂不如與人樂樂與少樂樂不如與衆樂樂此王公大人之樂非貧賤者所及也孔子曰飯蔬食飲水曲肱而枕之樂亦在其中矣顔子一簞食一瓢飲不改其樂此聖賢之樂非愚者所及也若夫鷦鷯巢林不過一枝鼴䑕飲河不過滿腹各盡其分而安之此乃迂叟之所樂也熈寜四年迂叟始家洛六年買田二十畒於尊賢坊北闢以為園其中為堂聚書出五千巻命之曰讀書堂堂南有屋一區引水北流貫宇下中央為沼方深各三尺䟽水為五𣲖注沼中状若虎爪自沼北伏流出北階懸注庭下状若象鼻自是分為二渠繞庭四隅㑹於西北而出命之曰弄水軒堂北為沼中央有島島上植竹圓周三丈状若玉玦攬結其杪如漁人之廬命之曰釣魚庵沼北横屋六楹厚其墉茨以禦烈日開户東出南北列軒牖以延凉颸前後多植美竹為清暑之所命之曰種竹齋沼東治地為百有二十畦雜塒草藥辨其名物而掲之畦北植竹方徑丈状若棊局屈其杪交相掩以為屋植竹於其前夾道如歩廊皆以蔓藥覆之四周植木藥為藩援命之曰采藥圃圃南為六欄芍藥牡丹雜花各居其二毎種止植兩本識其名状而巳不求多也欄北為亭命之曰澆花亭洛城距山不逺而林薄茂宻常苦不得見乃於園中築臺搆屋其上以望萬安轘轅至於太室命之曰見山臺迂叟平日多處堂中讀書上師聖人下友羣賢窺仁義之原探禮樂之緒自未始有形之前暨四逹無窮之外事物之理舉集目前所病者學之未至夫又何求於人何待於外哉志倦體疲則投竿取魚執袵采藥决渠灌花操斧剖竹濯熱盥手臨髙縱目逍遥徜徉唯意所適明月時至清風自來行無所牽止無所柅耳目肺腸悉為已有踽踽焉洋洋焉不知天壌之間復有何樂可以代此也因合而命之曰獨樂園或咎迂叟曰吾聞君子所樂必與人共之今吾子獨取足於巳不以及人其可乎迂叟謝曰叟愚何得比君子自樂恐不足安能及人况叟之所樂者薄陋鄙野皆世之所棄也雖推以與人人且不取豈得強之乎必也有人肯同此樂則再拜而獻之矣安敢專之哉記歴年圖後光頃嵗讀史患其文繁事廣不能得其綱要又諸國分列嵗時先後參差不齊乃上采共和以來下訖五代略記國家興衰大迹集為五圖毎圖為五重毎重為六十行毎行紀一年之事其年取一國為主而以朱書佗國元年綴於其下盖欲指其元年以推二三四五則從可知矣凡一千八百年命曰歴年圖其書雜亂無法聊以私便於討論不敢廣布於佗人也不意趙君摹刻於板傳之蜀人梁山令孟君得其一通以相示始光率意為此書苟天下非一統則漫以一國主其年固不能辨其正閏而趙君乃易其名曰帝統非光志也趙君頗有所増損仍變其巻秩又所為多脫誤今此淺陋之書既不可掩因刋正使復其舊而歸之傳家集巻七十一欽定四庫全書傳家集巻七十二宋}
