  - {type: variant, offset: 4434, length: 0, content: '', WYG: 一日上臣准勾當御藥院陳承禮傳宣令臣即今入見者臣仰煩聖恩重沓如此雖頑如木石亦當遷變然臣固守愚志不移者誠以荷盛徳者必有以酧報居重位者不可以無功臣自惟立朝材器短淺一無所用獨有補過拾遺可裨萬一方今為天下患者唯有制置三司條例司及諸路提舉勾當常平廣惠倉使者若陛下朝發一詔罷之則夕無事矣故臣不量力勢輕用上陳倘陛下以臣言為是乞早賜施行若以為非則臣乃狂愚之人於今英俊滿朝而擢用狂愚之人使汚宥宻之地豈不為聖政之累也伏望聖慈追還樞宻副使恩命令臣且供舊職取進止辭樞宻副使第五劄子熈寕三年二月二十二日上臣准勾當御藥院李舜舉傳宣令臣即今赴閤門受勅告者陛下聖恩無窮愚臣辭避不已盡下之徳愈盛慢上之罪愈深憂惶失圖無地自處臣竊惟陛下今兹不次用臣必以識慮為小有可采臣亦以受陛下非常之知不可以全無報效是以乞罷制置三司條例司及諸路提舉勾當常平廣惠倉使者若陛下果能行此勝於用臣為兩府臣若得此言果行勝於居兩府之位倘或所言皆無可采臣獨何顔敢當重任伏望聖慈矜察更不復遣使臣宣召追還樞宻副使恩命庶使賤臣差獲自安取進止貼黄李舜舉傳聖㫖諭臣以樞宻院本兵之地各有職分不當更引他事為辭臣今若已受樞宻副使勅告即誠如聖㫖不敢更言軄外之事今未受恩命猶是侍從之臣於朝廷闕失無不可言者所以區區貪進小忠庻㡬少補聖政之萬一況所言二事並是去年已曽上言以其無效所以不敢當今日新恩非為侵官乞聖明裁察兼臣右膝下見患一瘡有妨拜起入見未得伏望聖慈更不差使臣宣召臣只候膝瘡稍愈自乞入見面奏懇誠辭樞宻副使第六劄子熈寕三年二月二十七日上尋得㫖聴許臣伏准勾當御藥院劉有方傳宣撫問兼問臣取幾日入見令早入者聖恩深厚不忘微賤存恤勤至臣螻蟻之命無足報塞惶恐無措伏念臣即今膝瘡雖稍減可尚未全愈有妨拜起未知可以入見之日不獨如此兼為臣近曽上疏言乞罷制置三司條例司及追還諸路常平廣惠倉使者未聞朝廷少賜采錄但聞條例司愈用事催散青苗錢愈急中外人情愈遑遑不安臣當此際獨以何心敢當髙位故寜被嚴譴未敢輒出臣聞古者國有大事謀及卿士謀及庶民叅酌下情與衆同欲是以事無不當令無不行未嘗有四海之内卿士大夫農商工賈異口同辭咸以為非獨信二三人之偏見而能成功致治者也伏望陛下出臣近所上疏宣示中外臣庻使共決是非若臣言果是乞早賜施行若臣言果非乞更不差使臣宣召早收還樞宻副使勅告治臣妄言及違慢之罪明正刑書庻使是非不至混殽㣲臣進退有地不為天下之所疑怪取進止傳家集巻四十三欽定四庫全書傳家集巻四十四宋司馬光撰章奏二十七}
