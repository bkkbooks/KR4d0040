  - {type: variant, offset: 4425, length: 6, content: 文正公文集卷, WYG: 家大事叅陪末議有毫釐之差使陛下有旰食之憂以累知人之哲臣雖伏質横分不足塞責加之素有目疾不能逺視近日以來頗多健忘居常供職猶懼廢闕況以衰病當兹重任是用披肝瀝膽昧冐上陳違犯詔㫖至於再三觸法抵罪不自知覺伏望聖慈特賜矜察依臣前奏追還新恩俾守舊職不勝憂慙危切之誠臨紙叩頭俯伏俟命取進止辭樞宻副使}
