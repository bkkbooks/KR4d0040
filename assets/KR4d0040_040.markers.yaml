  - {type: variant, offset: 4417, length: 0, content: '', WYG: 上疏辭樞宻副使劄子熈寕三年二月十二日上臣准閤門告報已除臣樞宻副使續准勾當御藥院陳承禮傳宣令臣即今受勅告者臣賦分樸愚不通時務近日以來加以衰疾恪居舊職猶恐隳敗況乃拔擢待之不次竊惟宥宻之地日侍訏謨内訓六師外撫四海用人當否繫國安危豈臣無似所能堪稱伏望聖慈更擇賢材俾居其任聴臣且守舊職取進止辭樞宻副使第二劄子熈寕三年二月十二日上臣准勾當御藥院黎永德奉宣聖㫖令臣即今入見者臣屢違嚴詔當伏重誅但}
  - {type: page-break, offset: 4417, content: '', id: KR4d0040_WYG_043-13a, image: WYG1094/WYG1094-0402a.png}
  - {type: variant, offset: 4419, length: 2, content: 皇帝, WYG: 命以來揣分已熟自幼及長頗讀經史捨此之外一無所長當世之務懵不通曉常日置之閒官僅脫曠敗尚以屬文不工剸劇非長翰林審官每欲辭免況於樞府要地任重責大一日失職則死及之臣雖至愚粗知自愛陳力就列古人所韙是以寜冒違詔之罪不敢當竊位之譏伏望聖慈察其悃欵決非虚飾特賜寢罷新命止守舊職天地更生之惠下臣莫大之幸也取進止辭樞宻副使第三劄子熈寕三年二月十九日上臣前者兩曽辭免樞宻副使未奉俞㫖竊慮區區之誠未能上逹須至詳悉復有奏陳臣聞人之材性各有能有不能人主量材然後授官人臣審能然後受事是以官不曠而事無敗也臣幸生承平之時家世為儒臣自髫齔至於弱冠杜門讀書不交人事仕宦以來多在亰師少厯外任故於錢穀刑獄繁劇之務皆不能為況於軍旅固所不習獨於解經述史及以愚直補過拾遺不避怨怒則庻幾萬一或有可取是以每於拜官之際辭所不能而不辭其所能曏者除開封府推官以繁劇曽辭後除修起居注知制誥翰林學士以文采不工曽辭除龍圖閣直學士以久在諫職無效曽辭再除翰林學士兼侍讀學士以言事未了曽辭除史館修撰以方修資治通鑑恐朝廷修國史難以兩處供職曽辭自餘除國子監直講館閣校勘史館檢討集賢校理直祕閣起居舍人同知諫院天章閣待制兼侍講知諌院權御史中丞此皆朝廷清要之職除書始下臣即時受命未甞輒辭所以然者自度駑鈍可以䇿勵不至曠敗故也天下之人見臣屢辭恩命或以為不慕榮貴或以為飾詐邀名是皆不知臣者也臣自幼習賦詩論䇿應舉就試每三年一次投狀乞磨勘豈不慕榮貴者邪臣若隂有營求陽為辭避乃可謂之飾詐邀名}
