  - {type: variant, offset: 4423, length: 1, content: 温, WYG: 察臣何嘗如此豈飾詐邀名者邪臣之愚心正欲辭所不能而已今二府之任自非天下英傑之士不可輕處豈臣愚淺下材所能堪稱或遇}
