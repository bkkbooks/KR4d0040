  - {type: variant, offset: 0, length: 8873, content: 温國文正公文集卷第六律詩一夏日西齋書事過故洛陽城二首華清宫初春登興國寺塔虎牢關和李殿丞倉中對菊三首送何萬下第歸蜀二首執酒河橋春别荅陳進士謂之憶江東舊遊見贈又贈謂之重九日憶菊客思前年春與楚正叔同遊陟屺寺今兹巳復周歳窅然思之曉霽觀江上人壁許道寕畫寒林自都往餘杭懷聶之美夢與之美爲寒食之遊梧桐秋日登觀信亭湖上村家别聶之美松江潮水二首雙竹并序旅宿睢陽南湖南湖二首西谿公讌二首西湖金山寺出塞古松聞龔伯建下第故絳城題陳秀才鳯園林九日登麻藺披遊延安宿馬太愽東館字承之塞上四首送何濟川爲龐公使慶陽席上探得冬字延安道中作鄜州懷聶之美和張推官同年師奭春隂無緒偶成歸田詩五首并序春曉詠史三首秋夜望月漢宫詞讀漢武帝紀鷺鷥待詔二首觀僧室畫山水詠寒士贈外兄吴之才挺九日懷聶之美時余在河南聶在陳州飲吴之才家晚秋洛中思歸東園普明寺荷塘上置酒送孟仲習冝君令翺野廟吕禄廟雪霽登普賢閣上郡南三十里有相思亭在本山之麓二水所交平臯之上往來者徒習其名莫詳其義慶暦甲申歳余適延安過於其下于時夏虜梗邊征戍未息竊感東山采薇之義敘其情而愍其勞因作五詩庶幾不違周公之指且以釋亭之名爾梅花三首友人楚孟德過余縱言及神仙余謂之無孟德謂之有伊人也非誕妄者蓋有以知之矣然余俗士終疑之故作遊仙曲五章以佐戲笑云雲際亭和孫噐之清風樓龍女祠後塘自生荷花數枝與史誠之更相酬和贈楚法曹叔度揩先春亭寄揚州侯都監仲倫沉隂欲雪與同列㑹飲南齋感懷之美舉進士寓京師此詩寄之風雪數日不見叔度晚約公明共詣之贈吴之才寒食許昌道中寄幕府諸君和叔度獨登天臺水亭五哀詩并序屈平李牧晁大夫馬伏波斛律丞相留别東郡諸僚友遣興閽吏追和張學士從沂公遊廣固城去歲與東郡幕府諸君同遊河亭望太行雪飲酒賦詩今冬罷歸京邑悵然有懷哭馬承之山家風送王殿丞景陽知眉山縣先公與祕閣府君相繼爲利州路轉運使予與眉山同年登第送朱校理寀字廉叔知濰州貢院中戲從元禮求酒太常博士畢田黃甘寒食南官夜飲送孟著作翺字仲習知濟隂同次道陪宴瓊林校勘朱敏求送馮狀元京歸鄂州送吴耿先生先生通六經大義乆客關中今還建陽北山送髙陟歸金陵三舉不登科以好學孝涕聞於郷里子髙有徐浩詩碑昌言借模其文甫及數本石有微釁懼而歸之子髙荅簡有碎珊瑚之戲昌言以詩贈子髙同舎皆和司諫錢彦逺送僧聦歸蜀送史館任祠部顓河東轉運使送冲卿通判河中府校理吴充故翰林彭學士挽歌三首乗景福東廂詩夜意即日依韻柏寒御溝秋賜酒霜菊同景仁寄修書諸同舎賜果賜書御書四民安康字怪石葉未開木芙蓉無讀武士䇿風觀試騎射自喜景仁直祕閣范鎮賜酒霜菊同景仁寄修書諸同舎賜果賜書御書四民安康字怪石葉未開木芙蓉無讀武士䇿風觀試騎射自喜景仁直祕閣范鎮夏日西齋書事榴花映葉未全開槐影沉沉雨勢来小院地偏人不到滿庭鳥迹印蒼苔過故洛陽城二首四合連山繚繞青三川滉漾素波明春風不識興亡意草色年年滿故城煙愁雨嘯黍華生宫闕簮裳舊帝京若問古今興廢亊請君只看洛陽城華清宫新豊雞犬稀薊北馬秋肥金殿翠華去玉階紅葉飛荒林上路廢温谷舊流微嗟此非人事何湏問是非𥘉春登興國寺塔雨過風清露氣匀林花變色栁條新爲君作意登高處試望皇州表裏春虎牢關天險限西東難知造化功路邀三晉㑹勢壓兩河雄餘雪霑枯草驚飈卷断蓬徒觀戰争處今古索然空和李殿丞倉中對菊三首髙士寄朝市逈然心迹殊秋風太倉裏黄菊滿庭隅陶令成詩後王公送酒無遥知厭俗亊未免強躊蹰文案漸消散倉閑吏巳稀庭空數蝶下夜靜一螢飛爱賞忽成句淹留時忘歸髙情雖不繫遇此獨依依涼風正蕭瑟好月復徘徊幽興眇不盡芳罇時一開餘英蓋紅葉墜露濕蒼苔從此東籬下應忘歸去来送何萬下第歸蜀二首十上終無就才髙定復論清時守儒術白首在丘園逺樹隱殘日孤煙生暮村揚鞭萬里去幾許不銷魂失意流年老殘春對夕陽可堪臨逺道更復舉離觴花栁巳蕭索雲山復渺茫西風如有意音信勿相忘執酒執酒勸君君盡之今朝取醉不當疑好風好景心無事閑利閑名何足知河橋春别河橋春盡送君歸又惜無歡度此時亂花滿眼遮人望不見行塵空酒旗荅陳進士謂之憶江東舊遊見贈客路今東去亭臯木葉飛居然不堪恨况與賞心違頋渚煙波闊長洲草樹微江邊好春色行望錦標歸又贈謂之文藻兼名理三吴第一賢郷心幾千里飛鴈滿秋天籬下多新菊淵明歸思長主人方愛客未得傲羲皇君念東歸日應湏晝繡榮當令故關吏還識弃繻生重九日憶菊節物都何晚佳辰容易過黄花不足念當奈酒盃何客思客思倦漂泊居然感物華關頭望紅葉馬上見黄花薄宦終無定閑愁詎有涯今朝書至否幾夕夢還家前年春與楚正叔同遊陟屺寺今兹巳復周歳窅然思之陟屺寺南山曽陪半日閑春來夢携手宛在白雲間曉霽夢覺繁聲絶林光透隙來開門驚烏鳥餘滴墮蒼苔觀江上人壁許道寧畫寒林昔曽驅瘦馬衝雪過滎陽不悟當時景蕭然在此堂自都往餘杭懷聶之美閣上新文卷欲逢知巳開相思不能巳欹枕夢君來夢與之羙爲寒食之遊寒食無佳賞芳菲半巳空夜來逢勝友未至負東風梧桐紫極宫庭闊扶踈四五栽𥘉聞一葉落知是九秋來實滿風前地根添雨後苔群仙儻来㑹霊鳯必徘徊秋日登觀信亭西風連夜雨草樹巳蕭條宿靄稍零落寒山更寂寥林紅猶帶日岸白欲生潮新鴈來何處離離天際遥湖上村家萬湏寒煙外茅茨枕碧流楓林巢乳鶴沙溆亂鳴鷗漠漠菰蒲晚蒼蒼蘆荻秋欲過南浦去籬下岀漁舟别聶之羙客宦常漂泊離懷徒自勞貧無衣換酒空有涕霑袍木葉寒猶在江湖暮更豪行舟逺不見頼有片帆髙松江吴山黯黯江水清欲雨未雨傷交情扁舟蕩漾泊何處紅蓼白蘋相映生秋風索索連江起暮過煙波十餘里長蘆瘦竹映漁家燈火渺茫寒照水潮水二首平江欲上潮古木自䔥䔥兩岸饒葭葦寒波浸寂寥淋淋岀海門百里雪花噴坐看東歸去平沙空有㾗雙竹并序草木類同而種殊者竹爲多杭州廣嚴寺有雙竹相比而生舉林皆然其尤異生於枯樹腹中自其頂出森然駢竦樹如龍虵相縈矯首呀然余遊見而賦之雙幹標枯腹青青凡幾霜龍騰雙角直鯨噴兩鬚長詎欲尋支遁安能問辟彊屢來非别意未與此君忘旅宿睢陽南湖梁王棄宫館時丗古今違猶有南湖水春來鴈鶩飛樓臺沉倒影林薄挂餘暉豪侈終何在行人得暫依南湖二首宋都南野水花桞媚名園鳥起沙留迹魚驚浪結痕朱橋通别島白路出荒村城邑雖云邇常無車馬喧海鴈長橋北乗閑日日來游魚自應樂宿鳥不相猜弱栁週遭合芳花次第開梁王昔遊集後乗列鄒枚西谿公讌二首五馬非從樂西城念勸功翠帷仾映水紅斾不勝風乗脫青山靜雲歸碧落空淹留盡佳興新月漸朦朧謝守愛山水軍城況不賖魚驚避落葉息倦立浮查古柏依崗逺垂楊帶岸斜秋風吹急管一曲度荷花西湖佳麗三吴國湖光蕩日華魚驚動蘋葉鷰喜掠楊花雲過山腰黒風驅雨脚科煙波遥盡處髣髴見漁家金山寺香刹冠嵳峩松門落薜蘿風清塵不到岸闊鳥難過欲雨江聲怒新晴海氣多行舟未揺掉逥望隔煙波出塞邊草荒無路星河秋夜明卷旗遮虜塞歇馬受降城霜重征衣薄風髙戰鼓鳴將軍功未厭士卒不湏生古松摧頽巖壑間磊落得天頑香葉仾漸水餘根倒挂山白猿窺子落黄鶴認巢還不乆應爲石莓苔舊巳班聞壟伯建下第文章真長物堪歎又遺賢利器空埋土靈光乆照天趙錐猶未出荆璧㑹湏傳道在雖窮困知君不慨然故絳城文公恢覇略征討輔周衰奕丗爲盟主諸侯聽㑹期山河表裏在朝市古今移欲訪祁箎處郷人亦不知題陳秀才鳯園林劇談驚滿座音貌獨琅然可惜酈生老誰知蘇季賢青囊丗外藥碧幕醉中天不佩黄金印都縁負郭田九日登麻藺坂客路逢佳節無歡更益愁前山造雲日登陟不因遊游延安宿馬太愽東館字承之髙館寂無譁安閑勝在家暮煙凝塞上候火落天涯坐乆筆生凍夜䦨灯作花主人意未盡歸路不爲賖塞上四首節物正防秋関山落葉稠霜風壯金鼓霧氣濕旌裘未得西羌滅終爲大漢羞慙非班定逺棄筆取封侯鴻鴈秋先到牛羊夕未還旌旗遥背水亭候逺依山落日衘西塞隂煙澹北門何時獻戎捷鞌甲一朝閑瀚海秋風至䔥䔥木葉飛如何逢漢使猶未寄征衣不歎千里逺難甘一信稀年年沙漠鴈隨意得南歸劔客蒼鷹隊將軍白虎牙分兵邏圁水縱騎獵鳴沙浪有書藏䄂難慿信逹家不堪聞曉角吹盡落梅花送何濟川爲龐公使慶陽席上探得冬字渉幕府遥三合傳車乗一封忠深䡖逺道醉暖失嚴冬圁水猶飛撽蘆関未滅烽賢侯雖喜士難得乆從容延安道中作覊旅兼邊思川原蹀血新煙雲長帶雨草樹不知春細水淘沙骨驚飈轉路塵今朝見烽火白首太平人鄜州懷聶之羙何言内外家憂患兩如麻别淚行三歳思心各一涯海邊昬霧雨塞外慘風沙安得雲飛術乗空去不遐和張推官同年師奭春隂無緒偶成澹泊䡖雲寒不収未成春雨只添愁風煙寂寞幾何限盡入慿高一寸眸薄寒未去臘纔過春色先知在緑波不是宿雲能作思大都王粲自情多歸田詩五首并序同年張周輔甞語及仕宦之多端因稱仲長子有言使吾有良田美宅背山臨流適意極樂誠無事於此慨然感之作歸田詩五章秋水風波大嗟嗟未可遊漁樵自應樂珪組爲誰憂直木知先伐明珠忌暗投果然鈎可曲不惜取封侯紱冕誠虚器簪裳悉畏塗觸機身未保好直道先孤甔石曽何有田園浪更蕪可能推兩耜沮溺共爲徒聖哲雖云逺遺文幸未亡沉冥觀禮樂髣髴見虞黄雞黍延三逕琴書樂一堂逍遥名敎内冨貴亦微茫松菊陶潜宅蓬蒿仲蔚家行遊笻杖瘦嘯傲幅巾斜屋小踈茅覆門深亂栁遮村童迎客至竹帚掃桃花桑柘緑無際田間戴勝飛清醪迎社熟鳴雉向春肥執耒時將急衘盃日漸稀四鄰能共樂招飲莫相違春曉鐘漏初傳曉滿䆫風雨寒東崗行可種欹枕不成安詠史三首不事王侯者脩然鄭子真開田谷口美荷􅓩白渠春德化移郷曲聲光動搢紳一時鐘鼎貴磨滅彼何人延陵腰利劒上國使𥘉通待我周遊徧逢君遣奠終晶熒繫髙樹蕭瑟動寒風誰敢欺生死蒼蒼照爾衷春風三閣上珠翠日紛紛樂飲陶江月清歌遏海雲醉中失陳國夢裏入隋軍玉樹庭花曲淒涼不可聞秋夜望月萬里氛昏歇金波秋更明星連河渚闇風繞桂枝生鳷鵲臨華館新豐落故城古今佳賞盡殊自有餘清漢宫詞苜蓿花猶短昌蒲葉未齊更衣過栢谷走馬宿棠黎逆旅聊懷璽田間共闘雞猶思飲雲露髙舉出虹蜺讀漢武帝紀方士陳僊術飄飄意不疑雲浮仲山鼎風降壽宫祠上藥行當就殊庭庶可期蓬萊何日返五利不吾欺鷺鷥清閑自合無憂累白髮何因更颯然遥望孤飛下秋水雪花一片落晴天待詔二首京洛風塵裏相逢眼盡青故人多密近誰誦四隅銘待詔乆公車囊裝半巳虚雄文雖雅麗未得似相如觀僧室畫山水畫精禪室冷方暑乆徘徊不盡林端雪長青石上苔心閑對巖岫目浄失塵埃坐乆清風至疑從翠澗来詠寒士洋洋泌水側蓬室坐蕭條衣薄難勝夜厨閑空過朝笑談東郭履歌誦買目樵但問才何似無疑卿相遥贈外兄吴之才挺何湏親始重友分固非踈况復覊孤極同經憂患餘晚成應大器先得類凡魚遊衍陪嚴忌聲華誦子虚蒲輪詔枚叔駟馬寵相如莫忘西都日寒牎夜讀書九日懷聶之羙時余在河南聶在陳州錢唐江裏扁舟上别後籬花幾度黄憂患縈心何繚繞風光滿目盡淒凉誰同鑿落盃中酒獨繫茱茰肘後囊可復無書道情素雲間空有鴈南翔太室横山蔽千里相思空復上髙臺瓮頭白酒行當熟籬下黄花稍復開陶令不無同醉興孟君况有解嘲才欲慿西北髙風勢飛度轘轅勸一盃飲吴之才家京洛相逢設主人富家鼎食不如貧解衣換酒同爲樂知是交情百倍親晚秋洛中思歸東園不利不名空去國鴈飛葉落未歸來秋風肯待主人至籬下黄花隨意開普明寺荷塘上置酒菡蓞飄零水寂寥敗荷踈柳共蕭條煙斜雨細愁無限醇酒千分不易銷送孟仲習冝君令翺合抱生毫末無爲厭小官政成心更逸道勝意常寛野逈山形秀雲踈雪意䦨離盃如不盡何用禦祁寒野廟古廟崩榱在牆閒雜樹荒依俙餘像設寂寞閟祠堂舊日牲豭地今晨狐兔郷英靈如未滅何以度淒涼吕禄廟赤帝祚四百徒然諸吕謀出遊逢友賣未返見家収蔽冢昔無記遺祠今幸留士心俱左祖何怨曲周侯雪霽登普賢閣積雪明朝日山河坐可分嶄巖𥘉解凍片叚未歸雲闊望窮人境髙㝷府鴈羣開門枝烏散玉絮墮紛紛上郡南三十里有相思亭在太山之麓二水所交平臯之上往来者徒習其名莫詳其義慶暦甲申歳余適延安過於其下于時夏虜梗邊征戍未􅒚竊感東山采薇之義叙其情而愍其勞因作五詩庶幾不違周公之指且以釋亭之名爾嶺上雙流水猶知㑹合時行人過於此那得不相思偃蹇登脩阪髙侵雲日間幾人征戍客跋馬望家山塞下春寒在東風雪滿鬚河陽機上婦知我苦辛無栁似妖饒舞花如爛漫粧那堪隴頭水嗚咽断人膓空外遊絲轉飄楊似妾心别來今幾日髣髴近雕隂梅花三首從與夫君别寒花幾度春坐愁芳樹老况乃鑑中人塞比爲君戍江南是妾家遥知關外雪正似嶺頭花驛使何時發憑君寄一枝隴頭人不識空向笛中吹友人楚孟德過余縱言及神仙余謂之無孟德謂之有伊人也非誕妄者蓋有以知之矣然余俗士終疑之故作逰仙曲五章以佐戯笑云神仙謂無還似有秦漢可怜空白首㑹湏一躡青雲梯與子同祛千古疑仙術有無終未知眼看白髮亂如絲何時得接浮丘𬒮滄海横飛萬餘里若士北遊窮地角還食蛤蜊卷龜殻盧敖凡骨不能飛今朝九陔何處期仙家不似人間歡瑶漿琅菜青玉盤乗醉東遊憩陽谷酒瓢閑桂扶枽木柂師知子能操舟稳過茫茫滄海流白浪駕天千萬里真令挂骨長鯨齒雲際亭髙齊杳冥際迴與丗塵違席上山河近天邊桑柘微人間巳飄灑棟裏始紛飛草樹収殘照逍遥乆未歸和孫器之清風樓賢侯宴枚馬歌皷事繁華晚吹來千里清啇落萬家平原轉踈雨逺樹隔殘霞宋玉雖能賦還湏念景差龍女祠後塘自生荷花數枝與史誠之更相酬和平湖漠漠芰荷稠水國芳春不勝秋空有棹歌人不見晚風一曲去悠悠越女行歌縱棹輕蒼茫别浦晚煙凝荷花折盡未歸去㶑灔扁舟不易勝荷底清漣照綺羅長安公子舊情多躊躇不去知君意重唱吴音白紵歌賀監家居逸興饒枝分鑑水闊容舠穿荷冝去邀漁叟共醉舡頭半榼醪清江向晚採蓮稀獨倚蘭舟乆未歸目断可堪人不至斜風細雨濕羅衣素舸朱蓬青竹篙棹歌風散近還遥斜陽借問歸何處家住水村郎姓蕭别殿無人利自芳玉階朱檻繞金塘館娃寂寞無西子羞與吴宫競曉粧贈楚法曹叔度楷夫君能直節不耻揚曹䡖道果因時屈官無當巳榮松杉雖偃蹇霜霰苦崢嶸㑹有良工識終觀大器成先春亭園林近鈴閣旦夕𬒳仁風自得芳菲早豈將踈逺同冰開半塘緑雨借數枝紅㑹待韶光徧還應到野叢寄楊州侯都監仲倫木落淮南樹秋風日夜髙月臨楊子渡雪卷廣陵濤不得同蕭散何因破鬱陶空慿尺書速未解夢䰟勞沉隂欲雪與同列㑹飲南齋簿領日沉迷從容樂事稀賔朋幸相值樽酒不湏違慘澹愁雲積參差逺樹微淹留勿輕散待取雪花飛感懷昨日春冰破水邊今朝臘雪墜風前歳華過目疾飛鳥壯志如何不着鞭之羙舉進士寓京師此詩寄之結髪聲華盛無疑屈未伸何妨乆垂翅從此欲驚人鷹撃天風壯鵬飛海浪春行當解故褐不惜化京塵風雪數日不見叔度晚約公明共詣之雲雪連朝闇朋從歎坐違臨文與誰共開卷爲君稀趣掃六花散聊通一徑微當攜兔園賦同映讀書幃南榮巵酒罷君返道東居坐作三朝别杳疑千里餘閑門嗟雀網深濘怯柴車向晚開簾喜同雲稍覺踈贈吴之才勝冠自立艱難裏犬器由來貴晚成松栢儻非生磊落巖崖何易出崢嶸蘇秦遊困羞妻㛐主父居貧厭弟兄六印他年擁車騎㑹湏重過洛陽城寒食許昌道中寄幕府諸君原上煙蕪淡復濃寂寥佳節思無窮竹林近水半邊緑桃樹連村一片紅盡日解鞌山店雨晚天廽首酒旗風遥知幕府清明飲應笑驅驅羈旅中和叔度獨登天臺水亭郊外靈潭闊新亭占曲隄戯魚迎墜絮驚短疑是雉字出荒蹊緑倒楊梢亂光飜芰葉齊雨餘纎月偃野逈断雲伭水氣常噴薄天風助慘悽何知塵外境近在郡樓西五哀詩并序孔子惡利口之覆邦家者甚矣䜛之爲害不可一二數也聊觀戰國以来楚之屈原趙之李牧漢之晁錯何其設心之勤而收効之寡也以爾具官某性質之美得於自然而發揮於文追琢於學多士之秀無爾為先雖禁林清塗秩宗美仕居之積乆譽望巳優而古之進賢必試以事財賦之任於今爲急求稱其職僉曰汝能是用命汝典兹邦計汝其勿以金榖爲末而不恤勿以簿領爲煩而不爲九功所歌八政所重登平之業將汝乎取之誡勵舉人敦修行檢詔限二百字以上成孔子稱德成而上藝成而下故爲四科以第門人而文學處末然則爲士者文有餘而德不足斯而巳矣奚足尚哉國家憲章前古詳延俊乂敷奏以言明試以功何甞不勤求敦忠屏斥浮僞列于庶位得人巳多尚慮有司教導之方不能盡善登進之法有所未精是以士或背本追末弃實取華不知從學所以立身爲文所以行遠而謂能離章辨句則百行可遺非屬辭比事則六經無用習尚成俗安恬不非此豈聖人所以立教之心而朕所以待賢之志哉自今天下之士其務以道德爲師仁義爲友進之於内而讓之於外治之於身而施之於人才雖美不敢以自驕善未至不敢以自怠如是則窮居閭閻何病乎不逹苟異於是朕無取焉仍敕有司明諭中外使咸稱朕意賜宰臣韓琦乞退第一表不允批荅朕以寡薄少承基緒未及究明師保之訓更閱事物之變而遽失先帝之大庇膺四海之重任怵惕危懼楚國良金百錬精深藏求售價連城豈徒豊獄吹毛利兼有秦臺照膽明祖帳飄揚隄栁邊北來飛蓋復連翩追隨不忍䡖言别廽首城樓沒晚煙空府同来賢大夫短亭門外即長塗不辭爛醉樽前倒明日此歡重得無遣興京洛紅塵裏閉門常獨居雖無守道愧終與趣時踈文舉徒飛表曹丘懶挾書誰怜從宦乆不及䇿名𥘉待兔謀真拙屠龍藝亦虚何當治歸計松菊繞吾廬閽吏弊車羸馬犯塵泥愁到朱門遍遍辭相國舎人雖驟見將軍馬監豈相知因循歳月勞何補㒹倒風埃辱固冝惆悵東崗舊陂在素心空負白雲期追和張學士從沂公遊廣固城蒼鵝集宋幕遊鹿上燕臺覊氣山河盡王師江漢來重圍經歳合嚴鏁夜深開廢殿餘沙礫頽牆蘙草萊清時間千歳良牧借三台獄市乗餘暇蕪城賦上才去歳與東郡幕府諸君同遊河亭望太行雪飲酒賦詩今冬罷歸京邑悵然有懷疇昔追清景狂吟忘苦寒河冰塞津口山雪照林端徤筆千篇富醇醪一醉歡困猶揮落麈瞑不顧歸鞍多事光隂駛離羣㑹合難誰知塵滿䄂今日客長安哭馬承之平生千里别書問亦常來隼拂秋雲擊鸞兼霏霧廽曏無髙丗藝安見出倫才有紙盈箱篋扄封不忍開山家林下脫雙履䆫邊挂幅巾閑堂風掩户断嶺月窺人風隴首紅旌急樽前翠幕重林端翻逺刹在恐誤外轉踈鍾夜寂清機發春䦨别意濃如何玉琴韻併欲在青松送王殿丞景陽知眉山縣先公與秘閣府君相継爲利州路轉運使予與眉山同年登第疇昔侍嚴親俱爲綵服人遊蘭巳多益得桂復同春風樹悲驩異萍波聚散頻峽中盡遺事何處不霑巾君行杳何許萬里蜀雲西野色春期近材煙曉意迷天藏巴峽小星逼劒關仾莫使郷愁亂咬咬信子䂓送朱校理寀字廉叔知濰州東國連年水傷稼使君到部即行春茫茫四野潢汙竭鬱鬱萬行桑柘新俗不好奢田器貴獄無留繫吏家貧齊人勿怨歸朝速自是承明侍從臣貢院中戯從元禮求酒太常博士畢田顧我虚罍耻知君餘瀝多庭前有春雪如此薄寒何黄甘黄金綴縹蔕揺落楚江涯采助盃盤勝羞將橘柚偕時移香不變物逺味尤佳欲種滄洲樹何季此意諧寒食南宫夜飲積旬留省署容易度春華芳草踏青晚長楸行樂賖雲踈時送雨風細闇飛花直有黄金百無因過酒家送孟著作翶字仲習知濟隂聖主焦勞意誰云百里輕東州比烖害劇令選精明水去良田闊人歸旅榖生閭閻還舊觀雞犬變新聲盗散疲民活姦窮老吏驚政成知不日雙耳爲君傾同次道陪讌瓊林校勘宋敏求冠蓋連翩數里塵帝家全借上林春鵷行不動煙霞秀龍角正髙雷雨新喜氣晴曛宫樹緑飛花醉墮玉巵頻蒲萄盧橘應相識半是當季舉酒人是日在席同年七人送馮狀元京歸鄂州夙昔負竒節琅然爲衆殊下韝連得儁出手盡成盧喜氣兼鄰曲榮名溢道塗風雲俱動色非復舊江湖送吴耿先生先生通六經大義乆客關中今還建陽此山儒服若煙海幾人潜聖心難才誠自昔賤學況于今夫子獨神解明時何陸沉大羮無和味至樂寡知音磳磴貂裘弊飄蕭鶴髮侵遊秦不得意思越動長吟甑米難求玉經囊益少金拂衣謝賔友縱棹指雲岑積葉迷幽逕荒藤絡舊林澗猿驚重至野老喜相尋山色猶當户絃聲不變琴人生貴適意何必慕華簮送髙陟歸金陵三舉不登科以好學孝弟聞於鄉里之子秣陵去悠悠天塹東㠶開曉風疾潮落夜江空在昔才華盛至今人物豐山川氣雖盡龍虎勢猶雄卞玉巳三獻齊禽㑹一沖當令關下吏洗目認終童子髙有徐浩詩碑昌言借摹其文甫及數本石有微釁懼而歸之子髙荅簡有碎珊瑚之戯昌言以詩贈子髙同舎皆和司諌錢彦逺徐公精筆老生神石刻猶能妙奪真幾爲通書飜喪宝愈令好事惜傳人鋒鋩半折猶能徤圭壁微瑕自足珍直使盡隨如意碎石家玉樹未全貧昌言家圖書所収最多送僧聦歸蜀翠栢老精金紅塵倦帝城千山一錫逺萬里片雲輕江棧紆還直天星縱復横聽猿應更喜還是故郷聲送史館任祠部顓河東轉運使問望簮紳舊恩華雨露重圗書周内史汾澮晉全封秀發千尋壁寒生百錬鋒歸時門有㦸情别更從容送沖卿通判河中府校理吴充聞道名都行有期依然想見昔遊時寒光一曲秋河轉翠領三條夕照移孤竹舊缺字民有讓重華餘教俗無疪不湏到日方登歷巳在君家十二詩故翰林彭學士挽歌三首乗夙昔遊清貫時流藉重名讎書石渠秘視草玉堂榮吉兆虚三鱓凶期告兩楹子雲思故國墳樹必西傾平生對交舊萬日正如𥘉不復知榮賤都能志戚踈遺靈瞻素几僞物屏塗車家事何蕭索空餘萬卷書祖奠垂將撒笳簫儼欲行野寒嘶故馬樹轉出新旌泉路幽無底魚燈曖不明如何賫羙志鬱鬱向佳城景福東廂詩皇祐元年秋八月皇帝臨䇿賢良方正及武舉進士僕與景仁受詔讎校䇿卷寓直於景福殿東廂凡三日得詩十三首編之左方夜意清夜四無譁深嚴上帝家星飜珠網白斗挂玉樓斜風靜虚成韻霜輕未作花還疑漢津客浩蕩寄流槎即日依韻枍栺留深殿倉琅祕九門日長人對直風逈鷰髙飜林有蕭踈意雲無片縷痕鈞天真自到不獨暫飛䰟柏寒落落抱髙節秀岀青雲端無言磵谷幽自致宫廷難芳風襲玉宇餘露分銅槃不使萬年木嘉名髙歳寒御溝秋萬户鬱相鈎枝分瑟瑟流縈䊸通桂觀隱見帶龍樓碧映千林曙紅彯一葉秋寒波長不竭歳歳奉宸遊賜酒霜和氣盈金榼恩光湛玉觴應知北山羽猶怯上林霜醇味回秋色清都近醉郷山茅霑雨露誓極寸心長菊瑣瑣南陽菊秋潭歳自開孤根擁紅葉落蘂媚蒼苔正以參靈藥因之植紫臺願兼金掌露同入栢梁杯同景仁寄修書諸同舎烈火非不猛不耗百錬金寒霜非不嚴不彫竹柏林小人勢利合傾覆無常心君子道德親白首猶視今諸君閨臺秀相得如璆琳離群一昔期乃爾動悲吟古風乆巳衰交道日頽侵願名思友操播之清微琴賜果南海荔支來别館蒲萄成匪頒浹下陳捧拜同驩榮置黍敢先食覽槃多未名懷核待歸種復愁千歳生賜書御書四民安康字上聖固天縱英藝皆絶倫時乗萬幾閑翰動如有神用之當豫遊不忘安四民匪頒及群下絡繹來中宸毰毸靈鳯翔鬱怒虬龍振清若四海秋熈如天下春愚臣土芥微亦受雨露均願推賜書意直以古義陳士夲學先王所求誼與仁農當服稼穡昬作甽畝勤百工備用器不治刺繡文萬商遷有無不通珠翠珍四業旣交修坐令風化純人和衣食豐天應殊祥臻皇心正在此非以能髙人怪石葉㫺去江湖郷來與松桂接圭角老龍脊鋒稜秋劒鋏歷亂枯苔點交横敗莎葉會使成都人更取神蓍揲未開木芙蓉無木末采芙蓉騷人歌所無何言霜花豔不與水芝殊香苞麝臍結茂葉桐隂敷豈若龜巢類飄零老五湖讀武士策風漢家求猛士雲集未央宫天外朝星淡山西將種空竒謀紛並進壯節凛生風八陣縱横勢依然見目中觀試騎射自閶闔風正清觚稜日初媚材雄集便殿玉座親臨視三河俠少兒初識天子貴天山汗血騮蹀躞金鐶轡揚鞭秋雲髙顧眄有餘銳縈回勢可觀罄控動如志毫氂應心目審固參身臂鳴弦電雹驚寸的冰瓦碎龍顔薄笑青喜色連傍侍旦爲徒歩人暮作彯纓使揚揚出九門親友生意氣須知天地德慎勿忘所自黠羗猶旅拒獫狁方繁熾求爲忠義臣無負搜羅意喜景仁直秘閣范鎮延閣屹中天積書雲漢連神宗重其選國士此爲偏夫子岷嶓秀聲名俊造先清標峻不極勝氣駛無前待價猶懷璧臨𡵨肯著鞭介推不求顯張季乆方遷玉檻鈎陳上丹梯比斗邊帝容瞻日角閣有太宗聖容宸翰照星躔職秩曽無貴光華在得賢公卿殊未晚尚少買臣年温國文正公文集卷第六, WYG: ''}
