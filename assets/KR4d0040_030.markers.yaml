  - {type: variant, offset: 4, length: 0, content: '', WYG: 陳治要上殿劄子治平元年七月十八日上臣聞舜與臯陶賡歌相戒以明良爲美以叢脞爲非盖以王者奄有四海君臨億兆若事無巨細皆以身親之則所得至寡所失至多矣古語有之曰察目睫者不能見百歩察百歩者亦不能見目睫非不欲兼之勢不可也是以明王緫其大體執其樞要精選賢能任以百職有功者賞有罪者誅故處躬不勞而収功甚大用此道也臣伏見陛下自親政以来厲精求治孳孳不倦未明求衣日昃不食雖大禹之勤勞文王之懿恭無以過此然而政有本末事有細大舉其綱則百目張挈其領則衆毛理臣願陛下先其本後其末急其大緩其細擇人而任之此政之本也賞善而罰惡此事之大也陛下當先察羣臣之邪正與其材能之所堪然後思天下有某事不治者當使某人治之其公忠勤恪功效顯著者勸之以厚賞姦回惰慢無功敗事者威之以嚴刑如是則萬事無不舉兆民無不安陛下可以髙拱無爲而名配堯舜矣至於簿書之煩碎文法之㣲宻錢糓之出納體例之有無此乃羣臣百吏之所守非陛下所當留意也陛下若捨彼而取此則臣恐徒有大禹之勤勞而不獲其功文王之懿恭而不見其治也臣以獻替爲職遇陛下勤政之初虛心求諫此乃千載一時誠不敢以細末之事煩汙聦明伏望陛下深思此道乃自古及今致治之大本勿以爲迂闊陳熟之言而忽之則天下幸甚取進止言程戡施昌言劄子治平元年七月二十八日上臣竊聞近者夏國屢起事端邊境之變不可不備爲備之要在於擇帥伏見鄜延路經略使程戡資性姦回涇原路經略使施昌言老病昏昧皆以斗筲罷愞之才當折衝禦侮之任平居之時未見有闕一旦警急必敗大事譬如開門揖盗以肉餧虎臣竊爲國家危之伏望朝廷早擇智勇之將以代其任二人並除致仕以安邊境之民戒偷禄之臣取進止言任守忠劄子治平元年七月十八日上臣竊聞入内内侍省都都知任守忠擅取奉宸庫金珠數萬兩獻遺中宫自以爲功仍受中宫賞賜外議籍籍無不駭愕伏以守忠從来罪惡極多不可遽數陛下體元繼統聖政方新守忠曽無畏惮益恣巧諂公取官物自眩私恩賛𨗳椒房首爲侈靡既求權寵又分厚利姦邪之臣無大於此伏望陛下特發神斷以守忠付所司窮治所犯明正典刑以示天下取進止言任守忠第二劄子臣近曽上言任守忠姦邪事迹乞正典刑未聞施行臣案守忠懐姦罔上諂佞貪惏竊弄權柄固非一日專爲讒慝交搆兩宫狡詐反覆陛下所知若非先帝聖明皇太后仁慈則社稷可憂天位不安今又盗取庫物曲求容媚教中宫爲不順陷陛下爲不義此而不誅典刑安用據守忠罪惡臣久合奏陳但以陛下踐阼之初天威未振欲望陛下親發英斷戮此大姦使内外之臣莫不震肅今聖恩容貸已及嵗餘外議皆言守忠以諂佞之故受陛下寵遇過於先帝之時臣備位諫官不敢塞黙守忠職在宫禁久專威福若不早除恐别生事伏望陛下如臣前奏速以守忠付所司窮治所犯肆之市朝以副天下之望取進止言任守忠第三劄子次日守忠除保信軍節度副使蘄州安置臣近者兩次上言任守忠姦邪事迹乞正典刑至今未聞施行臣廹於忠懇不能自已竊見守忠早以小臣獲事先帝幸蒙奬抜榮禄俱極日侍左右不能以忠言正道補益萬分專以詼諧諂諛苟求悦媚其罪一也緫領近侍委之差遣而陵忽同列與奪自恣附已則愛悦逆意則憎疾援引親黨排抑孤寒任情狥私略無顧避其罪二也從来所受俸禄賞賜亦爲不少而資性貪惏老而益甚盗竊官物受納貨賂金帛珍玩溢於私家第宅産業甲於京師聚斂之心曽無紀極其罪三也交結朋援專權據勢縱逞胷臆妄行威福所愛者雖有大罪掩盖不言所惡者小有瑕疵紏擿成事使宫禁之内側足屏息畏憚守忠無以爲比其罪四也濮王之薨守忠監䕶𦵏事賣弄國恩輕蔑皇族乗其有喪丐奪財物所得甚多終不滿意遂誣長子宗懿以爲不孝使被譴謫感憤成疾以至没身不能自雪其罪五也先帝以春秋寖髙未有繼嗣深思宗廟生民之重屬意聖明固非一日而守忠隂蓄姦心沮壊大䇿深忌國家立長立賢自欲於倉猝之際居中建議擇㓜弱昬懦之君以邀大利如有唐之季定䇿國老門生天子頼先帝聦明卓然逺覽斷志不疑不然則太平之業幾墜於地其罪六也及陛下既爲皇子守忠内懐憂懼日於先帝之前離間百端隔絶内外進對甚希使先帝爲陛下之父不得施爲父之恩陛下爲先帝之子不得展爲子之親其罪七也及先帝晏駕陛下纉統不幸遇疾皇太后權同聴政守忠乗此之際大逞姦謀闚伺語言撰造事迹往來革面進退異辭使皇太后以文母之慈不免投杼之疑陛下以曽閔之孝立有負恩之謗交搆兩宫遂成深隙計其隂謀無所不至頼皇太后聦明確然執義不可傾移不然禍變之興豈可具道其罪八也及聖體既安皇太后恭還大政守忠不勸𨗳陛下以勤修子道承顔順意報答盛徳恢廣令譽而相時隨勢斗異炎凉欲詐輸新忠以巧遮舊惡用昔時讒陛下之計爲今日讒皇太后之辭雖陛下未必聴受而使皇太后聞之不能不以介意終日涕泣悒怏成疾守忠但欲左右反覆自爲身謀並不顧天下之人議陛下之善惡其罪九也皇后正位尚新天下聳觀令徳守忠輒爲皇后畫策並不禀問皇太后矯傳教旨開祖宗寳藏擅取金珠數萬兩以獻皇后既取悦一時又坐享厚賜逆婦姑之禮開驕侈之源使皇后受其惡名而已身収其重利爲臣姦邪孰甚於此其罪十也守忠有大罪十皆陛下所親見衆人所共知其餘欺謾爲姦恣横不法事類繁多不可勝言誠國之大賊人之巨蠹伏望陛下盡發守忠之罪明示四方斬於都市以懲姦慝取進止言内侍差遣上殿劄子治平元年上臣曏時上殿伏見陛下宣諭以内臣差遣並一切委之都知司臣當時已曽奏陳以爲非便今入内内侍省都都知任守忠恃此權勢背公立私奉之者坐獲進擢忤之者立致排擯威福之柄盡在其手遂使宫禁之中畏憚其人過於人主罪盈惡積幸頼陛下神斷已斥而去之然儻不収還威福之柄則是去一守忠生一守忠終無益也臣愚伏望陛下自今日已後除内臣常程差遣依舊令都知司定差外其勾當御藥院内東門龍圖天章閣後苑化成殿延福宫等處及非時差管勾裏外要切公事之人並乞陛下親加選擢試之以事觀其爲人忠謹有功者則加賞拔姦邪不職者則加貶退不必一一勘㑹資序檢尋體例如此則誰不懐徳畏威輸忠竭力豈獨内臣而已雖外朝之人臣亦可用此道而治也取進止}
