  - {type: variant, offset: 78, length: 222, content: 伏見國家間歳一開科場詔下州郡使之郷舉里選遣詣京師覆試於禮部雖幽逺之士咸與其進然而天下發解進士到省常不下二千餘人南省取者纔及二伯而開封國學鏁㕔預奏名者殆將太半其諸路州軍所得者僅百餘人爾惟陜西河東河北荆湖北廣南東西等路州軍舉人近年中第者或一二竊以科舉旣頻天下之士誠奔走之不易而嶺外尤爲遐僻毎隨計動經五七千里往来不啻百餘程跋履道塗蒙犯風雪比至京師扶持困躓之不暇使與郊圻安燕之士角其藝能固不可得也旣而不第孤寒之路最爲蹭蹬千進且難往往廢學於臣愚見似有未均, WYG: ''}
