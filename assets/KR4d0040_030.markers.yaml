  - {type: variant, offset: 2170, length: 562, content: 上殿劄子臣聞舜與臯陶𢋫歌相戒以明良爲美以叢脞爲非蓋以王者奄有四海君臨億兆若事無巨細皆以身親之則所得至寡所失至多矣古語有之曰察者不能見目睫非不欲兼之勢不可也是以明王爲之不然緫其大體執其樞要精選賢能任以百職有功者賞有罪者誅故處躬不勞而収功甚大用此道也臣伏見陛下自親政以來厲精求治孳孳不倦未明求衣日􅉴不食雖大禹之勤勞文王之懿恭無以過此然而政有夲末事有細大舉其綱則百目張挈其領則衆毛理臣願陛下先其夲後其末急其大緩其細擇人而任之此政之夲也賞善而罰惡此事之大也陛下當先察群臣之邪正與其材能之所堪然後思天下有某事不治者當使某人治之其公忠勤恪功効顯著者勸之以厚賞姦回惰慢無功敗事者威之以嚴刑如是則萬事無不舉兆民無不安陛下可以髙拱無爲而名配堯舜矣至於簿書之煩碎文法之微宻錢榖之出納體例之有無此乃群臣百吏之所守非陛下所當留意也陛下若捨彼而取此則臣恐徒有大禹之勤勞而不獲其功文王之懿恭而不見其治也臣以獻替爲職遇陛下勤政之𥘉虚心求諌此乃千載一時誠不敢以細末之事煩汙聦明伏望陛下深思此道乃自古及今致治之大勿以爲迃闊陳熟之言而忽之則天下幸甚取進止擇帥劄子臣竊聞近者夏國屢起事端邊境之變不可不備爲備之要在於擇帥伏見鄜延路經略使程戡資性姦回涇原路經略使施昌言老病昏昧皆以斗筲罷愞之才當折衝禦侮之任平居之時未見有闕一旦警急必敗大事譬如開門揖盗以肉餧虎臣竊謂國, WYG: 傳}
