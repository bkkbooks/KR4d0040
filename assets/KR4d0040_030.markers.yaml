  - {type: variant, offset: 2733, length: 2402, content: 危之伏望朝廷早擇智勇之將以代其任二人並除致仕以安邊境之民戒偷禄之臣取進止延訪群臣第四劄子臣屢曽上言乞詔侍從近臣毎日輪一貟直資善堂夜則宿於崇文院内備非時宣召亦曽面奉徳音云候秋凉當頻有宣召今巳秋凉尚未聞有曽被召之人臣始者上言之時竊見陛下欣然開納將謂即時施行自後遷延日乆聖意漸以爲難臣竊意内外之臣必有欺惑天聽沮難此事欲陛下常居禁中不與群下相接以壅蔽聦明專固權寵者此豈忠臣之所爲而陛下之福邪臣願陛下深察此情断自聖志使之更直陛下毎日聽政餘暇宫中無事之時特賜召對與之從容講論古今治體民間情僞使各竭其胷臆所有而陛下更加采擇是者取之非者捨之忠者進之邪者黜之如此則下情盡逹聖徳日新矣若以資善堂體例稍生則學士待制於崇文院輪宿自有舊條只乞陛下傳宣崇文院今後直宿者並湏從早在彼祗候宣召其有事故請假者湏與以次官互換直宿此事極不難行而所益甚大惟陛下留意取進止任守忠劄子臣竊聞入内内侍省都都知任守忠擅取奉宸庫金珠數萬兩獻遺中宮自以爲功仍受中宮賞賜外議籍籍無不駭愕伏以守忠從來罪惡極多不可遽數陛下體元繼統聖政方新守忠曽無畏憚益恣巧謟公取官物自眩私㤙賛導椒房首爲侈靡旣求權寵又分厚利姦邪之臣無大於此伏望陛下特發神斷以守忠付所司窮治所犯明正典刑以示天下取進止第二劄子臣近曽上言任守忠姦邪事跡乞正典刑未聞施行臣案守忠懷姦罔上謟倿貪惏竊弄權柄固非一日專爲䜛慝交御名兩宫狡詐反覆陛下所知若非先帝聖明皇太后仁慈則社稷可憂天位不安今又盗取庫物曲求容媚教中宫爲不順䧟陛下爲不義此而不誅典刑安用據守忠罪惡臣乆合奏陳但以陛下踐阼之初天威未震欲望陛下親發英斷戮此大姦使内外之臣莫不震肅今聖㤙容貸巳及歲餘外議皆言守忠以謟佞之故受陛下寵遇過於先帝之時臣俻位諌官不敢塞黙守忠職在宮禁乆專威福若不早除恐别生事伏望陛下如臣前奏速以守忠付所司窮治所犯肆之市朝以副天下之望取進止第三劄子二十日上殿明日守忠除保信軍節度副使蘄州安置臣近者兩次上言任守忠姦邪事跡乞正典刑至今未聞施行臣迫於忠懇不能自已竊見守忠早以小臣獲事先帝幸蒙奬拔榮禄俱極日侍左右不能以忠言正道𥙷益萬分専以詼諧謟䛕苟求恱媚其罪一也緫領近侍委之差遣而陵忽同列與奪自恣附己則愛恱逆意則憎疾援引親黨排抑孤寒任情徇私略無顧避其罪二也從来所受俸禄賞賜亦爲不少而資性貪惏老而益甚盗竊宮物受納貨賂金帛珍玩溢於私家第宅産業甲於京師聚歛之心曽無紀極其罪三也交結朋援專權據勢縱逞胷臆妄行威福所愛者雖有大罪掩蓋不言所惡者小有瑕疵紏擿成事使宮禁之内側足屏息畏憚守忠無以爲比其罪四也濮王之薨守忠監護葬事賈弄國㤙輕蔑皇族乗其有䘮匄奪財物所得甚多終不滿意遂誣長子宗懿以爲不孝使𬒳譴謫感憤成疾以至没身不能自雪其罪五也先帝以春秋寖髙未有継嗣深思宗廟生民之重屬意聖明固非一日而守忠隂蓄姦心沮壞大䇿深忌國家立長立賢自欲於倉猝之際居中建議擇㓜弱昬懦之君以邀大利如有唐之季定䇿國老門生天子頼先帝聦明卓然逺覧断志不疑不然則太平之業幾墜於地其罪六也及陛下旣爲皇子守忠内懷憂懼日於先帝之前離間百端隔絶内外進對甚希使先帝爲陛下之父不得施爲父之㤙陛下爲先帝之子不得展爲子之親其罪七也及先帝晏駕陛下纉統不幸遇疾皇太后權同聽政守忠乗此之際大逞姦謀闚伺語言撰造事迹往來革靣進退異辝使皇太后以文母之慈不免投杼之疑陛下以曽閔之孝立有負㤙之謗交犯御名兩宫遂成深隙計其隂謀無所不至頼皇太后聦明確然執義不可傾移不然禍變之興豈可具道其罪八也及聖體旣安皇太后恭還大政守忠不勸導陛下以勤修子道承顔順意報荅盛徳恢廣令譽而相時隨勢斗異炎凉欲詐輸新忠以巧遮舊惡用昔時䜛陛下之計爲今日䜛皇太后之辝雖陛下未必聽受而使皇太后聞之不能不以介意終日涕泣邑怏成疾守忠但欲左右反覆自爲身謀並不顧天下之人議陛下之善惡其罪九也皇后王位尚新天下聳觀令徳守忠輙爲皇后晝䇿並不禀問皇太后矯傳教旨開祖宗寳藏擅取金珠數萬兩以獻皇后旣取恱一時又坐享厚賜逆婦姑之禮開驕侈之源使皇后受其惡名而已身収其重利爲臣姦邪孰甚於此其罪十也守忠有大罪十皆陛下所親見衆人所共知其餘欺慢爲姦恣横不法事類繁多不可勝言誠國之大賊人之巨蠹伏望陛下盡發守忠之罪明示四方斬於都市以懲姦慝取進止奉養劄子臣伏見陛下曏者即位之𥘉奉事皇太后䖍恭𣢾至皇太后撫愛陛下㤙渥周備數日之間慈孝之譽逹於中外播於逺近聞者無不相慶自聖體不安旬月之間道路之人漸有異議皆云因任守忠等夲不樂陛下爲嗣故於皇太后之處則言陛下與中宫之短於陛下與中宮之處則言皇太后之失遂使兩宮之心互相猜貳間隙一開猝難復合今陛下奮發英断屏黜䜛邪守忠等皆降逐出外中外之人不勝抃恱然臣愚竊恐皇太后尚未能盡知姦人之情與陛下所以斥去之意伏望陛下與中宫親詣皇太后閤頓首陳謝具述從来爲守忠等所悞致屢有違忤皇太后之意今守忠等旣去願與皇太后母子之㤙一如舊日然後朝夕與中宫侍飬左右膳羞藥餌躬親進獻承顔順色皆如臣庻之家母子婦姑之禮若左右之人尚有敢相離間者願陛下立行誅竄勿復有疑如此則䜛慝黜逺内外雍睦善氣興行災沴消亡宗廟永安令聞長丗若失此之際兩宫之歡不能復舊則恐長無可復之期豈唯當今天下之人以陛下爲非將傳於史䇿取譏万世矣此皆聖明所自知而臣復區區進言者欲陛下深更留意取進止内侍差遣劄子臣曏時上殿伏見陛下宣諭以内臣差遣並一切委之都知司臣當時已曽奏陳以爲非便今入内内侍省都都知任守忠恃此權勢背公立私奉之者坐獲進擢忤之者立致排擯威福之柄盡在其手遂使宫禁之中畏憚其人過於人主罪盈悪積幸頼陛下神断已斥而去之然儻不収還威福之抦則是去一守忠生一守忠終無益也臣愚伏望陛下自今日已後除内臣常程差遣依舊令都知司定差外其勾當御藥院内東門龍圖天章閣後苑化成殿延福宫等處及非時差管勾裏外要切公事之人並乞陛下親加選擢試之以事觀其爲人忠謹有功者則加賞拔姦邪不職者則加貶退不必一勘㑹資序檢㝷體例如此則誰不懷德畏威輸忠竭力豈獨内臣而已雖外朝之臣亦可用此道而治也取進止貼黄所有見御四人亦乞陛下一按舊例於内供奉官以下自以聖意選擇忠信謹慤可託心腹之人使之勾當温國文正公文, WYG: ''}
