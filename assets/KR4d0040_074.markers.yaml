  - {type: variant, offset: 0, length: 5765, content: 温國文正公文集卷第七十四史剡史剡序虞舜又夏禹夏桀周文王由余蕭何營未央宫孔子又季布迃書序釋迃辨庸士則言戒􅉶齒蠆祝飯車拾樵知非天人無怪理怪事親事神寛猛回心無益學要治心文害道大毋我道同絶四論求用負恩羡厭釋老鑿龍門辨無爲賛貽邢和聖窮諱有斥莊辨楊無黨兼容指過難能三欺官失天人史剡序愚觀前世之史有存之不如其亡者故作史剡其細瑣繁蕪固不可悉數此言其卓卓爲士大夫所信者云虞舜堯以二女妻舜百官牛羊事舜於畎畒之中瞽瞍與象猶欲殺之使舜塗廪而縱火舜以兩笠自扞而下又使舜穿井而實以土舜爲匿空出它人井剡曰頑嚚之人不入德義則有矣其好利而畏害則與衆不殊也或者舜未爲堯知而瞽瞍欲殺之則可矣堯已知之四岳舉之妻以二女養以百官方且試以百揆而禪天下焉則瞽瞍豈得不利其子之爲天子而尚欲殺之乎雖欲殺之亦不可得巳藉使得而殺之瞽瞍與象將隨踵而誅雖甚愚人必不爲也此特閭父里嫗之言而孟子信之過矣後世又承以爲實豈不過甚矣哉又舜南廵守崩於蒼梧之野葬於江南九疑是爲零陵剡曰昔舜命禹曰朕耄期倦于勤汝惟不怠揔朕師是以天子爲勤故老而使禹攝也夫天子之職莫勤於廵守而舜猶親之卒死於外而葬焉惡用使禹攝哉是必不然或曰虞書稱舜陟方乃死孔安國以爲升道南方廵守而死禮記亦稱舜葬於蒼梧之野皆如太史公之言子獨以爲不然何如曰傳記之言固不可据以爲實藉使有之又安和無中國之蒼梧而必在江而邪虞盡陟方云者言舜在帝位治天下五十載升於至道然後死耳非謂廵守爲陟方也嗚呼遂使後世愚悖之人或疑舜禹而非聖人豈非孔安國與太史公之過也哉夏禹禹以天下授益益避啓於箕山之陽禹子啓賢天下皆去益而歸啓啓遂即天子位剡曰父之位傳歸於子自生民以來如是矣堯以未不肖故授舜舜以均不肖故授禹禹子啓果賢足以任天下而禹授益使天下自擇啓而歸焉是飾僞也益知啓之賢得天下心已不足以間而受天下於禹是竊位也禹以天下授益啓以違父之命而爲天子是不孝也惡有飾僞竊任不孝而謂之聖賢哉此爲傳者之過明矣夏桀桀走鳴條逐放而死桀謂人曰吾悔不遂殺湯於夏臺使至此剡曰是言也存爲後世之懲勸其可乎周文王崇侯譛西伯於紂曰西伯積善累德諸侯皆嚮之將不利於帝紂乃囚西伯於羑里云云西伯旣出乃獻洛西之地以請紂去炮烙之刑紂許之剡曰紂疑文王之得民故囚之旣釋而又獻地以止其虐刑是正信崇侯虎之譛於紂也豈所謂遵養時晦以蒙大難者哉且紂惟不勝其淫虐之心故爲炮烙之刑若能自止而不爲則不待受西伯之地若不能自止雖受地於西伯而爲之如故誰能禁之哉由余戎王使由余於秦秦穆公問曰中國以詩書禮樂法度爲政然尚時亂今戎狄無此何以爲治由余笑曰此乃中國所以亂也夫自上聖作爲禮樂法度僅以小治及近世阻法度之威以督責於下下罷極則以仁義怨望於上上下交爭怨而相篡弑夫戎狄不然上含淳德以遇其下下懷忠信以事其上此真聖人之治也穆公以爲賢乃離間戎之君臣卒得由余而用之遂覇西戎剡曰所貴乎有賢者爲其能治人國家也治人國家捨詩書禮樂法度無由也今由余曰是六者中國之所以亂也不如我戎夷無此六者之爲善如此而穆公以爲賢而用之則雖亡國無難矣若之何其能覇哉是特老莊之徒設爲此言以詆先王之法太史公遂以爲實而載之過矣蕭何營未央宫蕭何作未央宫髙祖見宫闕壯甚怒何曰天下方未定故可因遂就宫室且天子以四海爲家非壯麗無以重威且無令後丗有以加也髙祖說說剡曰是必非蕭何之言審或有之何惡得爲賢相哉天下方未定爲之上者拊循喣嫗之不暇又安可重爲煩費以壯宮室哉古之王者明其德刑而天下服未聞宫室可以重威也創業垂統之君致其恭儉以訓子孫子孫猶淫靡而不可禁况示之以驕侈乎孝武卒以宫室糜弊天下惡在其無以加也是皆庸人之所及而謂蕭相國肯爲此言乎孔子齊景公欲以尼谿田封孔子晏嬰進曰夫儒者滑稽而不可軌法倨傲自順不可以爲下游說乞貸不可以爲國云云剡曰晏嬰忠信以有禮愛君而樂善於晉恱叔向於鄭悅子皮於呉恱季扎豈於孔子獨不知而毀之乎又楚昭王將以書社地七百里封孔子令尹子西曰文武百里之君卒王天下今孔丘得據土壌賢弟子爲佐非楚之福也乃止剡曰子西楚之賢令尹也楚國頼之亡而復存危而復安其志猶晏嬰也其言豈容鄙淺之如是哉季布季布聞曹丘生招權顧金錢與竇長君書使絶之曹丘聞之徃見布揖曰使僕游揚足下名於天下顧不羙乎何拒僕深也布大恱留數月爲上客厚遣之剡曰曹丘與長君善而布與書使絶之是以曹丘爲小人也及曹丘見以毀譽動已而已善之是養小人以自利者也夫以毀譽動人及養小人以自利皆姦人之道也果如是則布惡得爲賢大夫迃書迃書序余生六齡而父兄敎之書雖誦之不能知其義又七年始得稍聞聖人之道朝誦之而夕思之至於今二十有七年矣雖其性之昏愚憊而不能進然勤亦至矣時有所獲書以示人人之論髙者則曰子之書庸而無竒衆人所同知也論卑者則曰子之書迃而難用於丗無益也嘻我窮我之心以求古之道力之所及者則取之庸與迃惟人之所名也我安得知之故命其書曰庸書亦曰迃書云釋迃或謂迃夫曰子之言太迃於丗無益也迃夫曰子知迃之無益而不知其爲益旦大也子知逕之有益而不知其爲損亦大也子不見夫樹木者乎樹之一年而伐之則足以給新蘇而巳二年而伐之則足以爲桷五年而伐之則足以爲楹十年而伐之則足以爲棟夫以爲収功愈遠而爲利愈大乎古之人惟其道閎大而不狹也其志邃奥而不能邇也其言崇髙而不能􅋻也是以所適齟齬而或窮爲布衣貧賤困苦以終其身然其遺風餘烈數百千年而人猶以爲法曏使其人狹道以求容邇志以取合痺言以趨功雖當時貴爲卿相利止於其躬榮盡於其生惡得餘澤以及後丗哉如余者患不能迃而巳矣迃何病哉辨庸或謂迃夫曰子之言甚庸衆人之所及也惡足貴哉迃夫曰然余學先王之道勤且乆矣惟其性之惛也苦心勞神而不自知猶未免夫庸也雖然古之天地有以異於今乎古之萬物有以異於今乎古之性情有以異於今乎天地不易也日月無變也萬物自若也性情如故也道何爲而獨變哉子之於道也將厭常而好新譬夫之楚者不之南而之北之齊者不之東而之西信可謂殊於衆人矣得無所適失其所求愈勤而愈逺邪嗚呼孝慈仁義忠信禮樂自生民以来談之至今矣安得不庸哉如余者懼不能庸而巳矣庸何病也士則或曰爲士何如迃夫曰士者事天以順交人以謹謹司其分不敢失隕而巳矣或曰爲士者亦事天乎曰是何言也天者萬物之父也父之命子不敢逆君之言臣不敢違父曰前子不敢不前父曰止子不敢不止臣之於君亦然故違君之言臣不順也逆父之命子不孝也不順不孝者人得而刑之順且孝者人得而賞之違天之命者天得而刑之順天之命者天得而賞之或曰何謂違天之命曰天使汝窮而汝強通之天使汝愚而汝強智之若是者必得天刑或曰何謂天刑曰人之刑賞刑賞其身天之刑賞刑賞其神故天之所賞者其神間靜而佚樂以考終其命天之所刑者其神勞苦而愁困以夭折其生彼雖僂然而白首哉猶貳負之臣桎梏而處諸石下雖踰千歲惡足稱壽哉或曰夫士者當美國家利百姓功施當時澤其後丗豈獨齪齪然謹司其分不敢失隕而巳乎曰非謂其然也智愚勇怯貴賤貧冨天之分也君明臣忠父慈子孝人之分也僣天之分必有天災失人之分必有人殃堯舜禹湯文武勤勞天下周公輔相致太平孔子以詩書禮樂教洙泗顔淵簞食瓢飲安於陋巷雖德業異等出處異趣如此其逺也何甞捨其分而妄爲哉言戒迃夫曰言不可不重也子不見鍾皷乎夫鍾皷叩之然後鳴鏗訇鏜鞈人不以爲異也若不叩自鳴人孰不謂之祅邪可以言而不言猶叩之而不鳴也亦爲廢鍾皷矣􅉶齒迃夫病􅉶齒呻吟之聲逹於四鄰通夕不寐有道士過之問曰子知病之所來乎曰不知也道士曰病来於天天且取子之齒以食食骨之蟲而子拒之是違天也夫天者子之所受命也若之何拒之其必與之迃叟曰諾於是以齒與蟲惽然而寐一夕而愈蠆祝迃夫夜立於庭拊樹而蠆螫其手捧手吟呼痛徹於心家人呼祝師祝之祝師曰子姑勿以蠆為慘烈以爲凡蟲而藐之曰是惡能苦我㢤則痛巳矣從之少選而痛息廼謝祝師曰爾何術而能攘蠆之毒如是其速也祝師曰蠆不汝毒也汝自石之余不汝攘也汝自攘之夫召與攘皆非我術之所能及也子自為之也於是迃夫歎曰嘻利害憂樂之毒人也豈直蠆尾而巳哉人自召之人自攘之亦若是而巳矣飯車天雨迃夫出見飯車息扵高蹊者指謂其徒曰是車也將䨱不乆矣行未十歩聞讙聲顧見其車巳覆其徒問曰子何用知之迃夫曰吾以人事知之夫天雨道濘而蹊獨不濡又狹而髙是衆人之所趣也而車不量其力固狹擅髙乆留不去以妨衆人之欲進者其能無覆乎禍有鉅於此者奚飯車之足云拾樵迃夫見童子拾樵於道約曰見樵先呼者得之後母得争也皆曰諾旣而行相與笑語戯狎至驩也瞲然見撗芥於道其一先呼而衆童爭之遂相撻撃有傷者迃夫愓然亟歸而嘆曰噫天下之利大於横芥者多矣吾不知戒而日與人遊恃其驩而信其約一旦有先呼而闘者能無傷乎知非或曰蘧伯玉五十而知四十九年非信乎曰何啻其然也古之君子好學者有垂死而知其未死之前所爲非者况五十乎夫道如山也愈升而愈髙如路也愈行而愈逺學者亦盡其力而止耳自非聖人有能窮其髙逺者哉天人迃叟曰天力之所不及者人也故有耕耘歛藏人力之所不及者天也故有水旱螟蝗無怪迃叟曰有兹事必有兹理無兹理必無兹事丗人之怪所希見由明者視之天下無可怪之事理性易曰窮理盡性以至於命丗之髙論者競爲幽僻之語以欺人使人跂縣而不可及憒瞀而不能知則畫而捨之其實奚遠哉是不是理也才不才性也遇不遇命也事親迃叟事親無以踰人能不欺而巳矣其事君亦然事神或問迃叟事神乎曰事神或曰何神之事曰事其心神或曰其事之何如曰至簡矣不黍稷不犧牲惟不欺之爲用君子上戴天下履地中函心雖欲欺之其可得乎寛猛迃叟曰寛而疾惡嚴而原情政之善者也回心或問子能無心乎迃叟曰不能若夫回心則庻幾矣何謂回心曰去惡而從善捨非而從是人或知之而不能徙以爲如制駻馬如斡磻石之難也靜而思之在我而已如轉户樞何難之有無益迃叟曰言而無益不若勿言爲而無益不若勿爲余乆知之病未能行也學要迃叟曰學者所以求治心也學雖多而心不治安以學爲治心迃叟曰小人治迹君子治心文害或謂迃叟子於道則得其一二矣惜乎無文以發之迃叟曰然君子有文以明道小人有文以發身夫變白以爲黒轉南以爲北非小人有文者孰能之道大迃叟曰聖人之道如天地天地之間靡所不有衆人之道如山川如陵谷如鳥獸如草木如蟲沙各盡其分不知其外天地則無不包也無不徧也毋我孔子曰殷有三仁焉蓋孔子之前爲比干者則非微子矣爲微子者則非比干矣爲箕子者則非比干與微子矣至孔子然後人知三人者皆仁人也孔子曰微管仲吾其𬒳髮左祍矣如其仁如其仁孟荀氏之言曰仲尼之門五尺童子羞稱五伯以是觀之孟荀氏之道槩諸孔子其隘甚矣道同迃叟曰合天下而君之之謂王王者必立三公三公分天下而治之曰二伯一公處乎内皆王官也周衰二伯之職廢齊淵聖御名晉文糾合諸侯以尊天子天子因命之爲侯伯修舊職也伯之語轉而爲覇覇之名自是興自孟荀氏而下皆曰由何道而王由何道而覇道豈有二哉得之有淺深成功有小大爾譬諸水爲畎爲澮爲谷爲谿爲川爲瀆若所鍾則海也大夫士畎澮也諸侯谿谷也州牧川也方伯瀆也天子海也小大雖殊水之性奚以異哉絶四論或問子絶四何以始於毋意迃叟曰吉凶悔吝未有不生乎事者也事之生未有不本乎意者也意必自欲欲旣立於此矣於是乎有從有違從則有喜有樂有愛違則有怒有哀有惡此人之常情也愛實生貪惡實生暴貪暴惡之大者也是以聖人除其萌塞其原惡奚自而至哉或曰毋意於惡旣聞矣敢問聖人亦毋意於善乎曰不然聖人之爲善豈有意乎其間哉事至而應之以禮義耳禮者履也循禮則事無不行義者冝也守義則事無不得聖人執禮義以待事不爲善而善至矣聖人豈有意乎其間哉或曰然則聖人之心其猶死灰乎曰不然聖人之心如宿火爾夫火宿之則晦發之則光引之則燃皷之則熾旣而復掩之則乃晦矣深而不消乆而不滅者其宿火乎聖人之心亦然治其心以待物物至而應事至而辨豈若死灰哉灰死則不復然矣奚所用哉或曰母固母必奚以異乎曰在我爲固在人爲必聖人出處語黙惟義所在無可無不可奚其固成敗禍福繫命所遭誰得而知之奚其必或曰然則何以終於無我曰有意有必有固則有我有我則私私實生蔽是故泰山觸額而不見雷霆破柱而不聞無意無必無固則無我無我則公公實生明是故秋毫過目無不見也飛蚊歴耳無不聞也其得失豈不逺哉求用或曰士不好冨貴則爲上者不得其用刑賞不行矣迃叟曰小人有才必求用於丗以利其身不賞不勸不刑不懲君子有才亦求用於丗以行其道勸不待賞懲不待刑自古亂臣賊子未有不出於好冨貴者也爲上者亦何利焉負恩迃叟曰受人恩而不忍負者其爲子必孝爲臣必忠羡厭迃叟曰人情苦厭其所有羡其所不可得未得則羡巳得則厭厭而求新則爲惡無不至矣釋老或問釋老有取乎迃叟曰有或曰何取曰釋取其空老取其無爲自然捨是無取也或曰空則人不爲善無爲則人不可治柰何曰非謂其然也空取其無利欲之心善則死而不朽非空矣無爲取其因在治則一日萬幾有爲矣鑿龍門辨或問禹鑿龍門闢伊闕有諸迃叟曰龍門伊闕天所爲也禹治之耳非山撗其前水壅不流禹始鑿而闢之然後通也或曰何以知之曰孟子云禹之行水行其所無事若鑿山以通水不可謂之無事矣無爲賛貽邢和叔學黄老者以心如死灰形如槁木爲無爲迃叟以爲不然作無爲賛治心以正保躬以靜進退有義得失有命守道在巳成功則天夫復何爲莫非自然聖窮聖人專以利人爲心於術無不知也榖而可辟則不敎人耒耜矣死而可違則不敎人棺椁矣失豈非天使民食且死雖聖人不能違乎諱有人之情諱有而不諱無離婁之明人謂之瞽不愠矣枊下惠之和人謂之汚不怍矣斥莊或曰莊子之文人不能爲也迃夫曰君子之學爲道乎爲文乎夫唯文勝而道不至者君子惡諸是猶朽屋而塗丹艧不可處也眢井而羃綺續不可履也烏喙而漬飴糖不可甞也而子獨嗜之乎或曰莊子之辯雖當丗宿學不能自解迃夫曰然則佞人也堯之所畏舜之所難孔子之所惡是青蠅之變白黒者也而子獨恱之乎辨揚或曰楊子之謟也以王莽爲可以継周公軼阿衡迃夫曰得巳哉楊子之爲書也品藻當丗蜀莊子真仲元靡不及焉莽宰天下而自况於伊周敢遺諸乎何鮑之死不可不畏也雖然莽自况伊周則與之况黄虞則不與也其志將曰爲伊周而止斯可矣不止而至於簒伊周豈然哉無黨或曰吾子擯莊而引楊或者爲黨乎曰無黨也使莊爲楊言斯與之矣楊爲莊言斯拒之矣孰黨哉兼容或曰甚矣子道之隘也奚容之不兼迃夫曰沱潜之於江也榛楛之於山也兼容焉可也莠之於苗也氷之於火也欲兼得乎哉指過或曰有人於此指其過而告之則喜何如迃夫曰君子也或曰曷若無過而指諸迃夫曰君子履中正而行者也故有過則人得而指諸若夫不中不正之人終日所爲皆過也又安得而指之難能或曰堯舜之德何以爲難能迃夫曰舜自脩於畎畒之中而聞於堯此舜之難也舜在畎畆之中而堯知之此堯之難也三欺迃夫曰鞠躬便辟不足爲恭長號流涕不足爲哀弊衣糲食不足爲儉三者以之欺人可矣感人則未也君子所以感人者其惟誠乎欺人者不旋踵人必知之感人者益乆而人益信之官失迃叟曰丗之人不以耳視而目食者鮮矣聞者駭曰何謂也迃叟曰衣冠所以爲容觀也稱禮斯羙矣丗人捨其所稱聞人所尚而慕之豈非以耳視者乎飲食之物所以爲味也適口斯善矣丗人取果餌而刻鏤之朱緑之以爲盤案之玩豈非以目食者乎天人迃叟曰天之所不能爲而人能之者人也人之所不能爲而天能之者天也稼穡人也豐歉天也温國文正公文集卷第七十四, WYG: ''}
