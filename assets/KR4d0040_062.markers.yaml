  - {type: variant, offset: 231, length: 795, content: 碑銘旣而自咎曰凡刋瑑金石自非聲名足以服天下文章足以傳後丗雖強顔爲之後人必隨而棄之烏能流永久乎彼孝子孝孫欲論譔其祖考之羙垂之無窮而愚陋如光者亦敢膺受以爲已任是羞汚人之祖考而没其德善功烈也罪孰大焉遂止不爲自是至今六七年所辭拒者且數十家如張龍圗文𥙿張侍郎子思錢舎人君倚樂卿損之宋監子才或師或友或僚宩或故舊不可悉數京洛之間盡知之儻獨爲尊伯父爲之彼數十家者必曰是人也蓋擇賢不肖而爲之也爲人子孫者有人薄其祖考宜如何讎疾之哉以光么麽使當此數十家之讎疾將何以堪之所以必不可承命者此也雖然竊有愚意敢試陳之唯足下采擇焉今丗之人旣使人爲銘納諸壙中又使它人爲銘植之隧外壙中者謂之誌隧外者謂之碑其志葢以爲陵谷有變而祖考之名猶庻幾其不泯也然彼一人之身爾其辭雖殊其爵里勲德無以異也而必使二人爲之何哉愚竊以爲感矣今尊伯父旣有歐陽公爲之墓誌如歐陽公可謂聲名足以服天下文章足以傳後丗矣它人誰能加之愚意區區欲願足下止刻歐陽公之銘植於隧外以爲碑則尊伯父之名自可光輝於無窮又足以正世俗之惑爲後來之法不亦羙乎未審足下以爲何如光再拜荅福昌張尉来書五月五日陜人司馬光謹復書福昌少府祕校足下光行能固不足以髙於庸人而又退處冗散屬者車騎過洛乃蒙不辱而訪臨之其榮巳多今又承賜書兼示以新文七篇豈有人甞以不肖欺聽聞邪何足下所與之過也始懼中愧終於感藏以自慰知幸知幸光以居丗百事無一長於文尤所不閑然竊見屈平始爲騷自賈誼東方朔嚴忌王子淵劉子政之徒踵而爲之皆蹈襲模倣若重景疊響訖無挺特自立於其外者獨柳子厚恥其然乃變古體造新意依事以叙懷假物以寓興髙揚横騖不可覊束若咸韶護武之不同音而爲閎美條鬯其實鈞也自是寂寥無聞今於足下復見之苟非英才間出能如此乎欽服慕重非言可迨然彼皆失時不得志者之所爲今明聖在上求賢如不及足下齒髪方壯才氣茂美官雖未逹髙逺有漸異日方將冠進賢佩水蒼出入紫闥訏謨黄閤致人主於唐虞之隆納烝民於三代之厚如斯文者以光愚陋竊謂不可遽爲也不宣光再拜與王樂道書, WYG: ''}
