  - {type: variant, offset: 3862, length: 1, content: 央, WYG: 便也景仁復第五書某復書君實足下辱手書言中和之難誠是也禮云致中和天地位焉萬物育焉言帝王中和之化行則隂陽和動植之類蕃非為一身除病而禁醫書也孟子養浩然之氣榮辱禍福之不能動其心非除病之謂也某向之病誠由飲食過中是飲食過中非中和也尺與權衡合於律惟量為三分之大自魏晉自秦漢俱不載於書不可知也大斂之大給之亦不可知也古有什一之稅而魯什二漢什五秦大半皆大斂}
