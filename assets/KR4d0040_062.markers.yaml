  - {type: line-break, offset: 5598, content: '', id: KR4d0040_SBCK_062-13a09}
  - {type: substitution, offset: 5602, original: 毎, replacement: 每, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-20789}}
  - {type: variant, offset: 5611, length: 1, content: 何, WYG: 郷惟心之謂歟亦言心之無定在也書曰惟精惟一允執厥中盖言心能精一則信執其中也君實既}
  - {type: variant, offset: 5613, length: 1, content: 致, WYG: 大本}
  - {type: variant, offset: 5615, length: 8, content: 蓋所謂名浮於實者, WYG: 中便為無過與不及則其下豈當復云發而皆中節}
  - {type: 'kr:newline', offset: 5618, content: '

