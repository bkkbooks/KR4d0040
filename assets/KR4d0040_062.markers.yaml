  - {type: line-break, offset: 5618, content: '', id: KR4d0040_SBCK_062-13a10}
  - {type: variant, offset: 5624, length: 108, content: 性戇滯不暁時務比又苦衰疾不堪治民遂自乞冗貟苟竊微禄以庇身養族天子憐其無它惡直不才耳而甞歴事三朝今雖昬耄無所用不忍棄捐俾之掌留臺道宫月給錢粟而不責以職事如疲牛老馬尚以莝豆飼之不求其任重致逺脫其紖鞅縱之林野使之徜徉自適以, WYG: 經云惟至誠為能}
  - {type: substitution, offset: 5628, original: 暁, replacement: 曉, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-20644}}
