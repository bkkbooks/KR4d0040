  - {type: line-break, offset: 5578, content: '', id: KR4d0040_SBCK_062-13a08}
  - {type: variant, offset: 5580, length: 29, content: 足言者而丗俗閭閻之人遽相與驚怪從而譽之光聞之毎踧踖發慙不自, WYG: 時莫}
  - {type: 'kr:newline', offset: 5598, content: '

