  - {type: variant, offset: 5530, length: 0, content: '', WYG: 景仁復第九書義有輕重事有取捨悔吝舉措輕也可捨也樂重也不可不奏前年定樂樂工有言其非者朝廷鞭配之樂之誤不及匿名事又一救得其義與悔吝取捨孰為重哉景仁又復書郊壇設黄道午陛執政大臣及從官賛引初獻而引亞獻終獻可乎誤則百官瞻望以為何如天地神祗宗廟社稷之靈以為何如此禮之失易見者也况樂隠奥而律吕君臣自有上下次序失則又不能知而天地神祗宗廟社稷亦見之矣以是而思不可不論重焉與景仁論積黍書六月中於夢得䖏連辱兩書自爾以通鑑欲進御結絶文字日不暇給以是􅇅然乆不修報計景仁雖恠之必知其非踈怠也}
  - {type: page-break, offset: 5530, content: '', id: KR4d0040_WYG_062-23a, image: WYG1094/WYG1094-0567c.png}
  - {type: page-break, offset: 5530, content: '', id: KR4d0040_WYG_062-23b, image: WYG1094/WYG1094-0567d.png}
  - {type: variant, offset: 5531, length: 0, content: '', WYG: 與景仁}
  - {type: variant, offset: 5532, length: 3, content: 惟德行, WYG: 皇祐中論樂迄今三十年筆舌徃返前後非一今更欲竭肺肝以仰告亦止於陳言重複秪増煩凟無益於析理也然景仁今書所詰責者亦不可不略自辨來示云光與胡阮前非李照今又復主之光曏時所上聞者正以房庶妄改漢書以就私意謂景仁不宜信而從之近日所上聞者止為景仁以今之太府尺即黄帝時尺恐不然耳至於音律髙下素非光所習學實不曉其是非亦不知王李胡阮之相去㡬律何甞敢不所主有所非邪此則所不敢當也來示云經有注釋之未安史有記錄之害義理者不可不正此則誠然然須新義勝舊義新理勝舊理乃可奪耳如浴乎沂十月五日星聚東井之類是也至於房庶所改漢書云一黍之起積一千二百黍之廣全不成}
  - {type: page-break, offset: 5532, content: '', id: KR4d0040_WYG_062-24a, image: WYG1094/WYG1094-0568a.png}
  - {type: page-break, offset: 5532, content: '', id: KR4d0040_WYG_062-24b, image: WYG1094/WYG1094-0568b.png}
  - {type: variant, offset: 5536, length: 1, content: 學, WYG: 理豈可􅃍改舊書邪其餘則與景仁之志殊塗而同歸景仁以禮樂為治國之大而不可慢光豈以為小而可慢耶景仁吹律吕考鐘磬校尺量鑄鬴斛以求先王之樂光謂先王之樂大要主於中和而巳亦猶景仁謂衣有青赤黄白黒之異光謂主於温而巳矣景仁謂食有酸苦甘辛鹹之異光謂主於飽而已矣然則景仁豈能全廢光之說光豈敢盡不用景仁之論邪彼諸家言樂者各有十二律五音更相是非如五方之人}
  - {type: page-break, offset: 5536, content: '', id: KR4d0040_WYG_062-25a, image: WYG1094/WYG1094-0568c.png}
  - {type: 'kr:newline', offset: 5538, content: '

      ', id: KR4d0040_krp_062-bkkkrnewl317}
  - {type: line-break, offset: 5538, content: '', id: KR4d0040_SBCK_062-13a06}
  - {type: variant, offset: 5539, length: 1, content: 政, WYG: 不通飲食不同各謂我是而彼非孰能正之從景仁之樂視之則王朴君臣民}
  - {type: variant, offset: 5541, length: 0, content: '', WYG: 物全不相干李照皆失其位使二人復生於今日視景仁之樂未知其云何也若欲知其真是真非必有如伶倫后䕫師曠者始能知之耳今既未有其人願景仁且以所著樂說與光書合藏之以俟後世必有知樂者能辨之也光之言止於此自今景仁復以樂論相示亦不敢對也景仁答積黍書某與君實議樂前後㡬萬言不出於以尺起律以律起尺二事為異同爾其餘則汎同傳記證左而巳最先者君實以為房庶改漢書}
  - {type: page-break, offset: 5541, content: '', id: KR4d0040_WYG_062-25b, image: WYG1094/WYG1094-0568d.png}
  - {type: variant, offset: 5542, length: 2, content: 無所, WYG: 黍之起積一千二百黍之廣八字某以為漢書前言分寸尺丈引本起黄鍾之長後言九十分黄鍾之長則八字者不可謂庶自為且庶亦不能為也尺量權衡皆以千二百黍在尺則曰黄鍾之}
  - {type: variant, offset: 5546, length: 1, content: 稠, WYG: 量則曰黄鍾之龠在權衡則曰黄鍾之重皆千二百黍也豈獨於尺而為不成文理乎隋書諸儒之論始以一黍為一分之說若爾則黄鍾積實一千二百分而八百一十分者非也自蔡邕不能知謂銅律尺為銅龠尺黄鍾萬事根本尺量權衡之所亶者而諸儒尺至有一十五種逮今千餘年無}
  - {type: page-break, offset: 5546, content: '', id: KR4d0040_WYG_062-26a, image: WYG1094/WYG1094-0569a.png}
  - {type: variant, offset: 5548, length: 2, content: 間僅, WYG: 是正吾儕業已留意可不為終之乎君實以青赤黄白黒主於温酸苦甘辛鹹主於飽謂為某說不然五色者之於衣華於身而巳五味者之於食適於口而巳烏取於温飽而云乎哉見君實議樂正如是矣王朴之樂君臣民事物全不相干以仲吕為黄鍾而次比之知其然也李照之樂皆失位者以太蔟為黄鍾而次比之知其然也此非靣陳不可持國約石淙相見至時亦當一徃以究其說君實云必有伶倫后䕫師曠始能知之某以為三人亦不能知何則無律也書云律和聲禮云吹律聴軍聲傳云雖有師曠之聦不以六律不能正五音故知三人者有亦不能知之無律故也君實云示諭七條或然或否不知何者為然何者為否請一䟽示當為脩改某謂太府尺為黄帝時尺考李照之律與尺而知其然李照以太府尺縱黍而累之亦牽於隋書之說也然其樂比其律髙三律律是而樂非也何以知今之尺是黄帝時尺以黄帝之法為律以起尺十二律内外皆有損益其聲和而與古樂合以為鬴斛而其分數其輕重又與周官漢斛銘並同無毫釐之差以此知太府尺太府權衡皆黄帝時物也其法與黄帝之法同起於律也隋謂之開皇官尺歴唐以至於今者謂隋唐尺則人皆信之謂黄帝時尺則皆駭矣自隋以來至唐以}
  - {type: page-break, offset: 5548, content: '', id: KR4d0040_WYG_062-26b, image: WYG1094/WYG1094-0569b.png}
  - {type: page-break, offset: 5548, content: '', id: KR4d0040_WYG_062-27a, image: WYG1094/WYG1094-0569c.png}
  - {type: page-break, offset: 5548, content: '', id: KR4d0040_WYG_062-27b, image: WYG1094/WYG1094-0569d.png}
  - {type: variant, offset: 5551, length: 0, content: '', WYG: 五代最為亂世而此物不變則自秦至三代至五帝而上黄帝又何疑哉千嵗之日今日是也謹此復命又小簡樂為小事為大事王朴李照胡瑗三家君實不决是非是慢而小之也但看今之君臣民事物可知之徃年孫宣公馮章靖宋之京非李照樂乃召阮逸胡瑗房庶令修之君實當時與胡阮同非李照者今所用乃李照樂君實云不改何也持國大地失脚正可以君實中和樂呼之五方之人言語不通信然至於歌樂則一豈有我是而彼非君實之言可全廢某之言不可不盡用何則葢無不是也古人之皆不到也十二律皆有損益而和也豈不為新義勝舊義新理勝舊理乎所恨至是未有人是之景仁答中和論中庸曰中者天}
  - {type: page-break, offset: 5551, content: '', id: KR4d0040_WYG_062-28a, image: WYG1094/WYG1094-0570a.png}
  - {type: page-break, offset: 5551, content: '', id: KR4d0040_WYG_062-28b, image: WYG1094/WYG1094-0570b.png}
  - {type: variant, offset: 5552, length: 0, content: '', WYG: 之大本其傳曰}
  - {type: variant, offset: 5553, length: 2, content: 但事, WYG: 為大本者以其含喜怒哀樂禮之所由生政教自此出也某以為中者對外而為言也}
  - {type: variant, offset: 5556, length: 0, content: '', WYG: 實曰中皆不近四旁之名也指形而言之則有中有外此書以中庸為名所指者盖徳也非形也某以為心者在身之中有知而無形者也請以堂論之身形也猶堂也對外而言則舉堂之内皆中也若以不近四旁為中則堂之中又有中焉非所謂舍藏之中乃得中之中也君實又曰喜怒哀樂之未發既謂之中則及其既發當謂之外某又以為發者由中出者也出而中節非外而何亦何必曰外又如君實之說此書以中庸為名指徳而言則有中有和若然則經當云喜怒哀樂之未發謂之中發而皆中節謂之庸也此書雖以中庸為名至於左右其說始終其義不害旁有證援也君實不喜老莊及輔嗣之說}
  - {type: page-break, offset: 5556, content: '', id: KR4d0040_WYG_062-29a, image: WYG1094/WYG1094-0570c.png}
  - {type: 'kr:newline', offset: 5558, content: '

      ', id: KR4d0040_krp_062-bkkkrnewl318}
  - {type: line-break, offset: 5558, content: '', id: KR4d0040_SBCK_062-13a07}
  - {type: variant, offset: 5558, length: 8, content: 欺得官非智力所任, WYG: 復有稱引今直以本篇義明之經曰誠者天之道也誠之者人之道也誠}
  - {type: variant, offset: 5568, length: 3, content: 敢䡖受, WYG: 勉而中不思而得從容中道聖人也誠之者擇善而固執之也故有博學審問慎思明辨之說君實又曰曷若治心養氣專以中為事動静黙語未甞不在乎中}
  - {type: page-break, offset: 5568, content: '', id: KR4d0040_WYG_062-29b, image: WYG1094/WYG1094-0570d.png}
  - {type: substitution, offset: 5569, original: 䡖, replacement: 輕, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-5441}}
  - {type: variant, offset: 5572, length: 0, content: '', WYG: 正所謂擇善而}
  - {type: variant, offset: 5573, length: 2, content: 爲士, WYG: 執之誠之}
  - {type: substitution, offset: 5573, original: 爲, replacement: 為, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-19875}}
  - {type: variant, offset: 5576, length: 0, content: '', WYG: 也至於不勉而中不思而得從容中道豈治心養氣者所能辦哉所謂誠者非别有一物也但誠其心而巳矣心至於不勉不思而中道至矣譬如鍾大叩}
  - {type: variant, offset: 5577, length: 2, content: 常守, WYG: 則大鳴小叩之則小鳴以其中虚也大小自外而至者也鐘豈預設小大於中而應之哉所謂過與不及者亦因時稱事而為之中也時有異變事有異宜亦豈可預設中於心而待之也荀卿大學君實之所信也其論心不過曰虚曰静曰定虚静定雖非兀然如木石亦豈可形容哉孟子曰操則存捨則亡出入}
  - {type: page-break, offset: 5577, content: '', id: KR4d0040_WYG_062-30a, image: WYG1094/WYG1094-0571a.png}
  - {type: 'kr:newline', offset: 5578, content: '

