  - {type: variant, offset: 4625, length: 0, content: '', WYG: 啟許人至得五日所賜書承氣體休佳至慰至喜示諭孔子孟軻亦病凡議論者以此所有佐彼所􅇅以此之是變彼之非告之以忠進之以直彼當察之以公受之以虚若饋獻之相交貿易之相資各得所求故可貴也光前獻樂議景仁已拒之今獻中和之論又不售若墨翟守千仞之城以待勍敵使光何自而入焉夫聚財異於用兵用兵則貴必勝聚財則貴多得今光屢有所獻皆不克納借使光服其不勝然於景仁亦何得哉豈可徒競無窮之辭請亦置是論䖏暑以來天氣}
