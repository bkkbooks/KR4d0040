  - {type: variant, offset: 107, length: 123, content: 二十七日涑水司馬光再拜復書崇信賢令孫君足下蒙眖書兼示以尊伯父行狀墓誌及所著唐史記令光爲之碑以紀述遺烈以尊伯父之清節令望加之光自㓜稚至于成人得接侍周旋今日獲寓名豐碑之末附以不朽何榮如之雖文字鄙拙亦不敢辭顧有必不敢承命者惟足下察之光曏日亦不自揆妄爲人, WYG: ''}
