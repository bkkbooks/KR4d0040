  - {type: variant, offset: 3255, length: 0, content: '', WYG: 景仁又答書某啟辱書言考工記及劉歆所鑄斛并素問病原不可不復竊謂舜廵四岳則同律度量衡孔子曰謹􅁠量四方之政行焉以是知聖人之於尺量􅁠衡恃以為治者而尺量􅁠衡必本於律律必有聲以考其和此樂之所由作也周之鬴漢之斛其法具存魏晉以來其尺至有十五種盖由横黍縱黍所為而不禀於律也然卒不能作樂止用􅃇聲終唐之世無變改者至周王朴始用魏晉所棄之法遂以仲吕為黄鍾太祖皇帝患之特下一律仁宗皇帝留意數十年終無所得及上仙太皇猶以李照胡瑗所鑄銅律置神御前然李照以縱黍累尺與今太府其律又應古樂而鐘磬才中太蔟是樂與律自相矛盾也胡瑗之樂君實詳知之此不復云前嵗議樂按太常鏄鐘皆有小大輕重非三代不能為然最大者今為林鍾而仲吕乃居黄鍾子位考之正差五律與前後言者相符雖經鐫鑿尚可補治若以大小次之必得其正近又用李照之樂則不若仲吕之愈也何則太蔟商聲宋子京所謂君實寄於臣管是也是大不可又况十二律皆有清聲花日新撰譜與鄭衛無異而以薦郊廟可乎考工記世以為漢儒所為漢志載劉歆之說多所牽合某亦於二書深疑之近因鬴斛考其制作不復疑矣又知太府之尺與􅁠衡皆古之禀於律者惟量出於晉魏之貪政與律不合須君實靣言乃悉竊以為論此者今世無如吾二人講求問難之多而且乆也得君實來恊同其說以破千餘年之惑為後世之傳則吾徒事業固亦不細矣難兄若朝夕來不敢奉邀候歸陜嵗首垂訪春中却同入洛幸也劉康公論極佳此誠非舉人之所能到然素問專主於醫非黄帝莫能為者某至穎昌已再讀矣須有所得恨讀之之晩病原乃申素問之說易為觀覧若君實不倦亦不可忽於身大有所益聖人之於後世如此但恐未可焚燒鬴斛費銅炭則然亦不可錯棄恃念}
