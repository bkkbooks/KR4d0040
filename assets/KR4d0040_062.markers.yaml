  - {type: variant, offset: 3865, length: 5, content: 宣光再拜荅, WYG: 必大其量是也亦恐便於用而致然爾今尺合於律權衡合於律而鬴斛之輕重合於權衡尺之方深合於量又與古樂聲正同所謂量者一律之容為一龠千六百四十龠為一鬴百三萬六千八百分之實也二千龠為一斛百六十二萬分之實也自古至今黄金無變者尺之法權衡之法不可變亦猶是也其數與聲與尺與權衡皆禀於律獨量為不禀必有自來矣不見於書所以疑其自魏晉也以胡先生樂書考之乃知其律短而聲髙君實不求此而襲先儒之誤乃云未甚觧鬴斛之分者正以此也君實深於筭請自律分推而至於權衡尺量則煥然無疑矣求位最正者曰林鍾自六月至十一月則黄鍾位也非有七律子位中者曰仲吕自十一月至四月則仲吕位也前所謂各髙五律非謬矣太常鏄鐘恐非盈孫所為是時尺法亡乆矣安得如考工記有大小輕重之法乎故曰非周以前莫能為者累諭議不决時以漢書脫文及隋書所載先儒之誤非君實誤也更詳思之與范}
