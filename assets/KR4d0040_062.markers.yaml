  - {type: variant, offset: 3272, length: 0, content: '', WYG: 第四書某啟近領正月十二日書續又領所賜論醫及樂書教誨勤勤感藏無巳醫書固難測素問巢源在其中最精奥誠如所諭光前書所云者非敢廢棄之也竊謂醫書治巳病平心和氣治未病冀景仁既得其本則末可焚也然謂素問為真黄帝之書則恐未可黄帝亦治天下豈可終日坐明堂但與岐伯論醫藥鍼灸耶此周漢之間醫者依託以取重耳古律既亡胡李之律生於尺房庶之律生於量皆難以定是非光為景仁言之熟矣今不復云權量雖聖所重又須更審法制修廢官然後政行於四方恐未可專恃以為治也又今之權量未必合於聖人之權量也夫中和樂之本也鍾律樂之末也本巧也末規矩也雖不盡善猶能成器若規不規矩不矩雖使良工執之猶將惑焉光是以願景仁銷新鑄之鬴斛不欲使傳於後世萬一有知樂者音律既合於古矣不幸得景仁之器考之而不合反以自疑曰景仁賢者豈肯作器以誤我更惑於其所學矣此光之所大懼也望景仁察之數日來頓暄洛城花卉如錦家兄巳到光未可離此景仁既許來千萬勿食言也景仁答第四書人來得二月十六日手書承體候巳就平復不勝喜慰又云平心和氣以治未病君實之心未甞不平其氣未甞不和而不能治未病某竊恐所有之樂如議之樂爾醫與樂皆出於黄帝岐伯乃當時之工也聖人立法之時不可不如此周悉其書不若虞書周漢間依記以取重者亦然也尺量權衡亦起於當時何則已有律至虞書同律度量衡舜慮四方而此三物者不禀於律則風俗不可以統同故每嵗廵於方岳下考而齊一之安得為不恃此以為治今之尺乃古之尺今之權衡乃古之權衡前年以古樂聲為黄鍾長九寸三分損一為林鍾長六寸律皆圍九分黄鍾積實得八百一千分三分損一林鍾得五百四十分十二律皆如此率而其聲恊此乃増律之一寸以為尺豈生於量也與今之太府尺正同又以黄金方寸得一斤乃知太古權衡皆古法也惟量比律十三分二之大此盖出於魏晉以來貪政也即以所制律考太常鏄鐘未位最大者乃應黄鍾子位中者應仲吕前後人言髙五律者不虚矣古者十二鍾皆有大小猶十二律之有長短也猶鬴斛之有輕重也以律之徑三分至鬴之方尺圓其外之百三萬六千八百分斛之方尺圓其外庣旁九釐五毫之百六十二萬分皆無差也律者樂之本也鐘皷云乎哉盖病後世專事鐘皷而不知本也刑名之書謂之律者取此也五刑之屬三千其罪之大小情之輕重苟不以律則不得其當猶無律而定樂也胡先生律圍十三分三釐八毫者八圍九分者一圍八分四釐者一圍七分九釐五毫者一外有損益而内無損益何也為聲之不恊此也黄鍾之律短也黄鍾之律短者由以尺而生律也君實若不見過一觀鬴斛某懼後世待君實為執一而不變人也非所聞之君實也與景仁第五}
