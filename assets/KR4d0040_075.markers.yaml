  - {type: variant, offset: 1663, length: 0, content: '', WYG: 二十八日作易曰窮理盡性以至於命世之高論者競為幽僻之語以欺人使人跂懸而不可及憒瞀而不能知則盡而捨之其實奚逺哉是不是理也才不才性也遇不遇命也事親元豐四年作迃叟事親無以踰人能不欺而巳矣其事君亦然事神元豐四年正月十六日作或問迃叟事神乎曰事神或曰何神之事曰事其心或曰其事之何如曰至簡矣不黍稷不犧牲惟不欺之為用君子上戴天下履地中函心雖欲欺之其可得乎寛猛元豐四年十月作迃叟曰寛而疾惡嚴而原情政之善者也回心或問子能無心乎迃叟曰不能若夫回心則庶㡬矣何謂回心曰去惡而從善捨非而從是人或知之而不能徙以為如制駻馬如斡磻石之難也靜而思之在我而巳如轉戸樞何難之有無益元豐六年二月十七日作迃叟曰言而無益不若勿言為而無益不若勿為余久知之病未能行也學要元豐六年五月二日作迃叟曰學者所以求治心也學雖多而心不治安以學為治心元豐六年六月二}
  - {type: page-break, offset: 1663, content: '', id: KR4d0040_WYG_074-7b, image: WYG1094/WYG1094-0673d.png}
  - {type: page-break, offset: 1663, content: '', id: KR4d0040_WYG_074-8a, image: WYG1094/WYG1094-0674a.png}
