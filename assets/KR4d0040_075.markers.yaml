  - {type: variant, offset: 1666, length: 0, content: '', WYG: 作迃叟曰小人治迹君子治心文害元豐六年七月十八日作或謂迃叟子於道則得其一二矣惜乎無文以發之迃叟曰然君子有文以明道小人有文以發身夫變白以為黑轉南以為北非小人有文者孰能之道大元豐六年八月一日作迃叟曰聖人之道如天地天地之間靡所不有衆人之道如山川如陵谷如鳥獸如艸木如蟲沙各盡其分不知其外天地則無不包也無不徧也毋我知孔子曰殷有三仁焉蓋孔子之前為比干者則非微子矣為微子者則非比干矣為箕子者則非比干與微子矣至孔子然後人知三子者皆仁人也孔子曰微管仲吾其被髮左衽矣如其仁如其仁孟荀氏之言曰仲尼之門五尺童子羞稱五伯以是觀之孟荀氏之道槩諸孔子其隘甚矣道同元豐六年作迃叟曰合天下而君之之謂王王者必立三公三公分天下而治之曰二伯一公處乎内皆王官也周衰二伯之職廢齊桓晉文糾合諸侯以尊天子天子因命之為侯伯修舊職也伯之語轉而為霸霸之名自是興自孟荀氏而下皆曰由王道而王由伯道而霸道豈有二哉得之有淺深成功有小大耳譬諸水為畎為澮為谷為谿為川為瀆若所鍾則海也大夫士畎澮也諸侯谿谷也州牧川也方伯瀆也天子海也小大雖殊水之性奚以異哉絶四元豐六年作或問子絶四何以始於毋意迃叟曰吉凶悔吝未有不生乎事者也事之生未有不本乎意者也意必自欲欲既立於此矣於是乎有從有違從則有喜有樂有愛違則有怒有哀有惡此人之常情也愛實生貪惡實生暴貪暴惡之大者也是以聖人除其萌塞其源惡奚自而至哉或曰毋意於惡既聞矣敢問聖人亦毋意於善乎曰不然聖人之為善豈有意乎其間哉事至而應之以禮義耳禮者履也循禮則事無不行義者宜也守義則事無不得聖人執禮義以待事不為善而善至矣聖人豈有意乎其間哉或曰然則聖人之心其猶死灰乎曰不然聖人之心如宿火耳夫火宿之則晦發之則光引之則然鼓之則熾既而復掩之則乃晦矣深而不消久而不滅者其宿火乎聖人之心亦然治其心以待物物至而應事至而辨豈若死灰哉灰死則不復然矣奚所用哉或曰毋固毋必奚以異乎曰在我為固在人為必聖人出處語黙惟義所在無可無不可奚其固成敗禍福繫命所遭誰得而知之奚其必或曰然則何以}
