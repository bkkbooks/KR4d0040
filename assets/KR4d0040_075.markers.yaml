  - {type: variant, offset: 4295, length: 0, content: '', WYG: 云禹之行水行其所無事若鑿山以通水不可謂之無事矣無為賛元豐八年正月十九日作學黄老者以心如死灰形如稿木為無為迃叟以為不然作無為賛治心以正保躬以靜進退有義得失有命守道在巳成功則天夫復何為莫非自然聖窮聖人専以利人為心於術無不知也穀而可辟則不教人耒耜矣死而可違則不教人棺槨矣夫豈非天使民食且死雖聖人不能違乎諱有人之情諱有而不諱無離婁之明人謂之瞽不愠矣栁下惠之和人謂之汚不怍矣斥莊或曰莊子之文人不能為也迃夫曰君子之學為道乎為文乎夫唯文勝而道不至者君子惡諸是猶朽屋而塗丹雘不可處也眢井而羃綺繢不可履也烏喙而漬飴糖不可嘗也而子獨嗜之乎或曰莊子之辨雖當世宿學不能自解迃夫曰然則佞人也堯之所畏舜之所難孔子之所惡是青蠅之變白黑者也而子獨悦之乎辨揚或曰揚子之諂也以王莽為可以繼周公軼阿衡迃夫曰得巳哉揚子之為書也品藻當世蜀莊子真仲元靡不及焉莽宰天下而自況於伊周敢遺諸子何鮑之死不可不畏也雖然莽自況伊周則與之況黄虞則不與也其志將曰為伊周而止斯可矣不止而至於簒伊周豈然哉無黨或曰吾子擯莊而引揚或者為黨乎曰無黨也使莊為揚書斯與之矣揚為莊言斯拒之矣孰黨哉兼容或曰甚矣子道之隘也奚容之不兼迃夫曰沱潛之於江也榛楛之於山也兼容焉可也莠之於苖也冰之於火也欲兼得乎哉指過或曰有人於此人指其過而告之則喜何如迃夫曰君子也或曰曷若無過而指諸迃夫曰君子履中正而行者也故有過則人得而指諸若夫不中不正之人}
