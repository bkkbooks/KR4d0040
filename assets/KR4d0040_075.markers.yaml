  - {type: variant, offset: 2638, length: 1581, content: 恙一旦有人告曰昌言去夜得疾甚急未及問訊又有継至者曰昌言沒嗚呼死者人之常善惡脩短固不敢言何奪之之暴也前年光自晉陽歸昌言延我於中堂酌滑臺暑釀以飲我及往奠於畫像之前則依然昔時置酒處也嗚呼誰能睹是而不慟也哉迺爲之辭曰嗚呼昌言天旣賦以純羙兮胡有德而不年榮禄何後兮零落何先幾日不見兮邈然九泉士喪師友兮國亡俊賢緑耳顛躓兮璵璠棄捐冥冥不可求兮杳杳不可追獨行過門兮怳焉自疑車馬不見兮逺行何之忽思長逰兮涕下交頥寒暑回薄兮宿草離離哭也有終兮忘也無時宋故渠州鄰水縣令贈太常博士吴君墓誌銘君之先丗家金郷曽大父諱賁不仕大父諱豫贈太常丞始葬洛陽金谷郷之尹里父諱蒨太平興國中進士髙第以公直材敏立名朝廷數迕權貴由是不得居中連典大州官至侍御史亦葬尹里君諱元亨字子正用御史遺奏𥙷太廟齋郎遷許州司士叅軍選授永康尉歴河中府法曹叅軍馮翊令馮翊華隂以􅃮沮爲境中間洲上有美田民相與爭之五十餘年吏不能決君檄華隂令㑹境上盡案兩郷之籍徧履其田執度以度之皆得其實自是民不敢復爭時人稱之君爲人勤廉專以誠長者處官不能飾智巧以媚上故官乆不遂官滿集吏部選除鄰水令還未至家道疾抵知洛陽縣李宋卿宋卿延之縣舎以天聖九年八月二日終年四十一宋卿主辦其喪殯於永安佛室夫人聶氏秘閣校理震之女後君五年長男顥先夫人二年皆不禄獨少男幾復年未冠及幼女一人相與居家無一金之産幾復於孤貧中能自刻意爲學取進士第今爲太常愽士知蓬州事累贈君官至太常愽士夫人封仙源縣太君嫁其妹於比陽令李鵬嘉祐五年秋蓬州將之官泣謂光曰幾復先君夫人之遺體常恐不克續承祭祀今幸有禄秩室家苟完矣念先君先夫人之久未葬痛切不少忘于心况又逺宦於蜀忍置而去乎將以八月某日葬於梁縣之新豐郷西成里子與我皆聶氏甥也先君治行子皆知之其爲我譔銘光曰懼不能堪子之命敢不諾銘曰御史之賢顯大於丗及君恂恂清德不墜迨君之終家旤相継㣲蓬州之立吴氏幾廢嗚呼以君之慈良而沉抑不遂冝其有嗣宋故進士呉君墓誌銘君諱顥字某其先金郷人曽祖某贈太常丞祖某侍御史父某鄰水縣令贈太常博士鄰水府君娶於秘閣校理聶君某於某爲從母鄰水府君之没也先妣在鄭君衰絰來入門哭且拜問故又哭先妣命與某處於是時君年尚未冠爲人長大有容觀論議忼慨讀書屬文材敏過人爲進士業巳完美先妣嘆曰吾妹不幸早喪其良人今有是子也吾妹猶有望間二歳君以疾卒於蒲阪年二十一先妣聞之哭曰吾妹何負於天使至此極也巳而弟幾復負其喪殯於汝州佛舎後二十六年幾復爲太常愽士乃舉其喪葬於梁縣以從鄰水府君之兆時某年月日也銘曰特苗之秀未實而朽繫時之逢無有美醜骨兮有歸祭兮有依下從先人夫又奚悲宋故侍御史呉君夫人彭城縣君劉氏墓誌銘嘉祐五年某月日太常愽士知蓬州事呉君幾復袝其祖妣彭城縣君劉氏下祖考御史府君之墓始夫人之没蓬州生二年矣比冠而父母兄皆即丗家至貧漂泊汝洛間甞記㓜時聞其兄言夫人之殯在京師廣濟寺巳舉進士及第乃求所謂廣濟佛寺者凢有二焉在城之東西往問夫人之殯皆莫能知蓬州刻志求之積年不得一旦至西寺有僧老矣忽來訊曰君非鄰水令呉君之子邪曰然僧曰去三十載之前呉君殯其母夫人於是某爲童子手親塗之某亦呉姓也故能識之因指示其處蓬州未之敢信周視其塗圯剥且盡所餘如掌而鄰水府君之題識存焉乃奠而哭之又數年然後得合葬於洛陽之金谷郷自始没至葬四十二年矣噫㣲是孫也則夫人之柩其不可復得邪露殯積乆而題識獨存豈非鄰水府君自悼其不幸未葬而天隂相之邪乃知誠孝可以動鬼神信矣御史府君諱某鄰水府君諱某夫人平生行事不可復見其先單父人父爲尚書郎云銘曰夫人旣終呉氏中微四十餘年乃得其歸孝孫有立神實告之故處士贈尚書都官郎中司馬君行狀曽祖林祖政父炳皆不仕君諱沂陜州夏縣涑水郷髙堠里人其先出於晉安平献王至征東大將軍陽始葬於河東安邑涑水之南後魏孝文帝大和中分安邑爲夏縣遂爲夏縣人自唐以来仕宦陵夷降在畎畒然累丗兄弟未甞異居故家之食口甚衆而生業素薄无以贍之君㓜以孝謹諸父兄悉以家事委之於是治田疇繕園圃修闌笠完囷倉雖有傭保必以身先之使莫敢不盡力者夜則側板而枕之寐, WYG: ''}
