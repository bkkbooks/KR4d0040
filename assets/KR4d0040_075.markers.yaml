  - {type: variant, offset: 1997, length: 358, content: 張氏祔某郷邑於公近又乆承公之知故其於公之始終治行也於佗人爲悉其諸子以碣文爲請光何敢辭謹銘銘闕故府州軍事判官杜君墓誌銘嘉祐二年秋光在京帥進士杜知臣涕泣來言曰大人昔以進士得見於先公又與子遊最乆今不幸而沒子爲我銘其墓光旣吊因辭以不文不敢爲知臣固請曰佗人知臣所不敢請也故唯子之歸光廼曰然則願聞子先君丗系治行之詳知臣退以其狀求曰君諱陟字從聖其先自成都徙長江曽大父禮大父鍔皆不仕父昭文遂州長史君少好古學無所不闚著化坊三十一篇言王者以敎化坊民之道慶暦𥘉天子詔諸州皆立學擇其士之賢有行者爲之師州人共推上君君屢舉進土有司失之卒以三禮釋褐選𤏡道尉考蒲遷府州軍事判官力於吏治轉運使提點刑獄交章薦之㑹屬官有以姦贜敗者怨恨反誣訟君坐罷官去君詣闕欲自理未果遇疾以八月巳巳終於里舎年五十有七娶譚氏生三子男知臣女長適卞宗建幼適姚申皆舉進士嗚呼杜君觀, WYG: 情苦厭}
