  - {type: variant, offset: 4451, length: 2, content: 左右, WYG: 規為必不妄也子大夫其懋明之問世之為詩者皆稱魯僖公能遵伯禽之法魯人尊之而為之頌自孔子刪詩存而不去非虛美也今以春秋迹之或違禮而動或作事不時至於修泮宫伐淮夷作新廟皆無聞焉殆若與頌不相應者其故何哉問孟子稱盡信書不如無書吾於武成取二三䇿而巳為其以至仁伐至不仁而有血流漂杵也後之學者皆祖其言乃以書為舛駮非若他經之純美也嗚呼彼孟子者果愈於聖人邪書者果是非相冒中有可信不可信者邪學者病於隨風而呼順流而攘未有能排其門上其堂探其室嚌其䏑而徒披猖横騖乎藩籬之外彼又烏知甘酸之正味邪乃欲信孟子而非書孟子又曰說詩者不以文害辭不以辭害志斯言也豈獨可施於詩而不可施於書邪孟子之云書不可盡信者果是歟願與諸君訂之問關雎麟趾之化王者之風故繫之周公鵲巢騶虞之徳諸侯之風先王之所以教故繫之召公説者以為先王謂太王王季今據二南之詩大抵皆言文王之化或美召伯或美王姬烏在其為太王王季也且如太王王季文王之詩何為不編之雅頌而列於國風又文王之道被於天下何故其中雜有王者諸侯之風復何為繫之周公召公皆惷昧所不識也二三君子奥博於學願聞所以辨之其説何也問曲禮曰禮不下庶人刑不上大夫按王制修六禮以節民性冠婚喪祭鄉相見此庶人之禮也舜典五服三}
