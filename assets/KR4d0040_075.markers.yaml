  - {type: variant, offset: 4390, length: 11, content: 㓜詠及女㝷又卒父母欲奪, WYG: 先世之患而今猶未息者也將何道以息之至於朝政之善有所未盡黎庶之病有所未聞子大夫其精心致思條析陳之靡有所遺有司將以復於上而行之焉毋悼後害以枉執事苞忠隠知而不自盡以取美禄榮名而巳進士䇿問十五首問昔季路冉有公西華曽晳閒居縱言各陳}
