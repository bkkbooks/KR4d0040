  - {type: variant, offset: 4334, length: 20, content: 不同而已矣嗚呼使天下之民皆若吾兄之爲雖古, WYG: 慢則失義方象焉左右前却過分則差中庸著焉得十失二成功盡棄誡慎明焉是故投壺可以}
