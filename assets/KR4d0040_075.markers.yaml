  - {type: variant, offset: 1752, length: 218, content: 報萬一豈非命也然卒不得盡其志嗚呼哀哉夫人張氏先公即丗子四人師古果州團練判官師顔衞州司法叅軍夢臣獲嘉縣主簿季子師說及孫孝先曽孫叔元皆三班借職餘孫若干人㓜未官公之在荆湖也夢㠯爲三班奉職以公髙年多疾求告省侍朝廷以武吏求省侍無故事不許即乞改文職歸省方許之行及苑葉間聞喪因號泣晝夜奔赴凡七日行千三百里近丗官逺方而殁者子孫多焚其柩以燼歸葬相習爲常無譏誚者夢臣獨奮曰爲人子孫忍行此豈人心也哉自長沙數千里奉柩以歸嗚呼其信知義而断不與俗流者夫古人稱善人者, WYG: 利}
