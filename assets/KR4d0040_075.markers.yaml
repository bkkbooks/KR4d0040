  - {type: variant, offset: 151, length: 6, content: 弟大理寺丞某, WYG: 志邃奥而不能邇也其言崇高而不能庳也是}
  - {type: variant, offset: 158, length: 2, content: 治行, WYG: 所適齟齬而或窮為布衣貧賤困苦以終其身然其遺風餘烈數百千年而人猶以為法曏使其人狹道以求容邇志以取合庳言以趨功雖當時貴為卿相利止於其躬榮盡於其生惡得餘澤以及後世哉如余者患不能迃而巳矣迃何病哉辨庸或謂迃夫曰子之言甚庸衆人之所及也惡足貴哉迃夫曰然余學先王之道勤且久矣惟其性之惛也苦心勞神而不自知猶未免夫庸也雖然古之天地有以異於今乎古之萬物有以異於今乎古之性情有以異於今乎天地不易也日月無變也萬物自若也性情如故也道何為而獨變哉子之於道也將厭常而好新譬夫之楚者不之南而之北之齊者不之東而之西信可謂殊於衆人矣得無所適失其所求愈勤而愈逺邪嗚呼孝慈仁義忠信禮樂自生民以}
  - {type: page-break, offset: 158, content: '', id: KR4d0040_WYG_074-2b, image: WYG1094/WYG1094-0671b.png}
  - {type: page-break, offset: 158, content: '', id: KR4d0040_WYG_074-3a, image: WYG1094/WYG1094-0671c.png}
  - {type: variant, offset: 161, length: 4, content: 求銘光獲, WYG: 談之至今矣安得不庸哉如余者懼不能庸而巳矣庸何病哉士則或曰為士何如迃夫曰士者}
  - {type: variant, offset: 164, length: 1, content: 獲, SBCK: 􅀗}
  - {type: variant, offset: 166, length: 8, content: 侍讀公爲日乆又與, WYG: 天以順交人以謹謹司其分不敢失隕而巳矣或曰為士者亦事天乎曰是何言也天者萬物之父也父之命子不敢逆}
