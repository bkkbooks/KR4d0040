  - {type: variant, offset: 4444, length: 2, content: 起哺, WYG: 去之仁聖用心固不如此愚智有涯不能測逺吾子其辨也問稽於經傳帝王之際玉帛諸侯亡慮萬國當是之時聲教所被東不踰海西距流沙南不盡荆蠻北不及獯鬻以五服之民養萬國之君公有羡積私有餘儲征代朝貢無歲而無咸出其中未嘗匱乏今國家奄有萬方囊括禹迹加以兵革不試垂三十年累聖恭儉與民休息宫室不崇苑囿不廣衣服不麗飲食不精然比歲以来有事西虜發輸滯積以饋一隅乃復財用竭而不繼力役困而不給吁嗟之聲蕭然道路何曩者用民之侈而有餘今者用民之狹而不足乎變而通之必有其道此最國家之急而從政者之所欲聞也吾子明於古之道而察於今之故何施何為而得國用舒民力足以及於古之世也仁者之言其利宜漙幸毋讓焉問夏書曰賞延於世小雅裳裳者華刺幽王棄賢者之類絶功臣之世是古有世祿之道也周書數紂之罪則曰官人以世而言春秋者公羊氏亦云譏世卿詩書春秋皆聖人所以儀範後世也今其言乃違戾如是豈聖人之道淵微奥逺學者不足以至邪願聞所以辨之而毋讓問王者受天命臨四海上承天之序下正人之統故政治之本莫先於厯數厯數之紀莫大於正朔正朔者厯數之大端而萬事之維首也是以聖人重之三代之王視斗招揺建寅建丑建子以為正月仰應三光俯順三統總象三材備在典䇿其傳詳矣正於唐虞以前則厯世儒生各為異見孔安國以為建寅為正得天之數自古皆用之湯武放伐以有天下革故鼎新}
