  - {type: variant, offset: 4310, length: 13, content: 常嘆曰自吾兄之亡而家遂貧豈, WYG: 子}
  - {type: variant, offset: 4325, length: 2, content: 資生, WYG: 感人者其惟誠乎欺人者不旋踵人必知}
  - {type: variant, offset: 4328, length: 2, content: 具减, WYG: 感人者益久而人益信之官失迃叟曰世之人不以耳視而目食者鮮矣聞者駭曰何謂也迃叟曰衣冠所以為容觀也稱體斯美矣世人捨其所稱聞人所尚而慕之豈非以耳視者乎飲食之物所以為味也適口斯善矣世人取果餌而刻鏤之朱綠之以為盤案之玩豈非以目食者乎天人迃叟曰天之所不能為而人能之者人也人之所不能為而天能之者天也稼穡人也豐歉天也傳家集巻七十四欽定四庫全書傳家集巻七十五宋司馬光撰格投壺新格熙寧五年作傳曰張而不弛文武弗能也弛而不張文武弗為也一張一弛文武之道也君子學道從政勤勞罷倦必從容宴息以養志游神故可久也蕩而無度將以自敗故聖人制禮以為之節因以合朋友之和飾賔主之歡且寓其教焉夫投壺細事遊戲之類而聖人取之以為禮用諸鄉黨用諸邦國其故何哉鄭康成曰投壺射之細也古者君子射以觀徳為其心平體正端壹審固然後能中故也蓋投壺亦猶是矣未審度}
