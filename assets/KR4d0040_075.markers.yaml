  - {type: variant, offset: 11, length: 3, content: 五碑誌, WYG: 有七年矣雖其性之昏愚憊而不能進然勤亦至矣時有所獲書以示人人之論高者則曰子之書庸而無奇衆人所同知也論卑者則曰子之書迃而難用於世無益也嘻我窮我之心以求古之道力之所及者則取之庸與迃惟人之所名也我安得知之故命其書曰庸書亦曰迃書云釋迃或謂迃夫曰子之言太迃於世無益也迃夫曰子知迃之無益而不知其為益且大也子知迃之有益而不知其為損亦大也子不見夫樹木者乎樹之}
