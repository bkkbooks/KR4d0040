  - {type: variant, offset: 253, length: 1, content: 母, WYG: 之刑賞刑賞其身天之刑賞刑賞其神故天之所賞者其神間靜而佚樂以考終其命天之所刑者其神勞苦而愁困以夭折其生彼雖僂然而白首猶貳負之臣桎梏而處諸石下雖踰千嵗惡足稱壽哉或曰夫士者當美國家利百姓功施當時澤及後世豈獨齪齪然謹司其分不敢失隕而巳乎曰非謂其然也智愚勇怯貴賤貧富天之分也君明臣忠父慈}
  - {type: page-break, offset: 253, content: '', id: KR4d0040_WYG_074-4a, image: WYG1094/WYG1094-0672a.png}
  - {type: variant, offset: 255, length: 2, content: 單弱, WYG: 孝人之分也僣天之分必有天災失人之分必有人殃堯舜禹湯文武勤勞天下周公輔相致太平孔子以詩書禮樂教洙泗顔淵簞食瓢飲安於陋巷雖徳業異守出處異趣}
  - {type: variant, offset: 259, length: 3, content: 於以渉, WYG: 其}
