  - {type: variant, offset: 4293, length: 1, content: 丙, WYG: 二日作或問老釋有取乎迃叟曰有或曰何取曰釋取其空老取其無為自然捨是無取也或曰空則人不為善無為則人不可治奈何曰非謂其然也空取其無利欲之心善則死而不朽非空矣無為取其因任治則一日萬㡬有為矣鑿龍門辨元豐七年十二月二日作或問禹鑿龍門闢伊闕有諸迃叟曰龍門伊闕天所為也禹治之耳非山横其前水壅其流禹始鑿而闢之然後通也或曰何以知之曰孟}
