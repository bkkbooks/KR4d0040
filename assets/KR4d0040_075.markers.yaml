  - {type: variant, offset: 4597, length: 1, content: 墓, WYG: 始年也問春秋貴儀父者為其能自通於大國繼好息民也夫小事大者盟不重於朝今犂来名而儀父字其説何也樂詞樞宻院開啟聖節道場排當詞散念紫電流樞元聖誕膺於丕運妙花雨地輔臣祗奉於仁祠憑不垢之勝因佑無疆之遐算仍修高㑹共洽多娛宜盡從容式昭慈惠䕫龍滿座集紳紳花雨仍添一日春欲識華胥何處在只應近與醉鄉鄰作語徳水澄瀾上聖應期而降誕崇邱儲粹大賢名世以挺生蓋精神之㑹昌若符契之相合必資同徳用底太寧恭惟尊號皇帝陛下容覆如天照臨若日躋羣生於富壽之域納庶俗於仁讓之塗雷雨弗迷魚鼈咸若伏惟某官某官丕宣忠力克壯逺猷筦樞機而均四時撫韜鈐而制八狄屬呈祥於里社冀徼福於香城大啓梵筵同祈睿算玉毫珠髻既瞻仰於慈雲寶案金觴仍涵濡於湛露肴羞交錯笙磬駢羅仁澤醲於惠風喜色饒於淑氣某謬㕘樂吏獲對台廷不揆蕪才敢獻口號華渚流星表聖期宗工齋祓欵仁祠異花散漫承嚴供妙樂從容奉宴嬉印紱相鮮金錯落珮環交映玉葳蕤乾坤長久南山固此地年年捧羽巵勾曲八音繁㑹七律鈞諧上悦台顔把色合曲御筵送李宣徽昭亮知真定府口號匈奴舊畏李將軍今日重來㡬代孫旗尾飄揚山燒裂馬蹄騰踏塞塵昏降王稽顙朝南闕天子垂衣御北門幕府事閒刁斗靜碧潭佳景日開樽作語天文垂象貴將陪扈於太微地險流形常山控臨於大漠矧聖神之御辨懐荒憬以嚮風秋塵無驚夜戸不閉眷是股肱之郡委於心膂之臣某官武節兼人雄規絶衆元戎十乗董鋭士以啓行清酒百壺命賢王而出餞榮生道路威動塞垣駐大斾於近郊留朱輪於清籞某叨居樂部幸對台}
