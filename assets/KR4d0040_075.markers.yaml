  - {type: line-break, offset: 4450, content: '', id: KR4d0040_SBCK_075-11a04}
  - {type: variant, offset: 4450, length: 0, content: '', WYG: 正朔者帝王之盛節國家之大事而古今異論紛紛不決願吾子辨其得失明究其說使後來學者知其適從問夫佐天子治四海安萬民使諸侯軌道四夷賔服百吏稱職萬機辨治地平天成風雨和順者宰相之任也其功烈莫先焉王者封二王後所以存三統重絕先聖之世也而班固漢書采漢興以來有金革之勤及蠻夷降王受爵邑者為功臣表又采椒房母舅之家徼倖獲封者為外戚恩澤侯表而自平津以降由丞相得侯者及商周之後皆不得附於功臣之列而猥編於外戚恩澤之間豈以燮理隂陽之重而居貫甲執兵之後先聖苖裔王者賔客而在武夫健將之左邪抑史氏將有深㫖非淺識所知乎將不思而巳矣願聞所以辨之問祭典曰法施於民則祀之有功於民則祀之故厲山氏之子曰柱能殖百穀祀以為稷共工氏之子曰勾龍能平水土祀以為社湯既勝夏欲變先王之制以明革命於是乎以棄代而後世無及勾龍者故不易也夫平水土者莫尚於禹禹之功顧不及勾龍邪湯不祀禹以為社而云後世無及勾龍者其㫖何哉聖}
