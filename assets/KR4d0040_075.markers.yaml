  - {type: variant, offset: 4304, length: 5, content: 南原待制府, WYG: 堯此舜之難也舜在畎畝之中而堯知之此堯之難也三欺迃夫曰鞠躬便辟不足為恭長號流涕不足為哀弊衣糲食不足為儉三者以之欺人可矣感人則未也}
