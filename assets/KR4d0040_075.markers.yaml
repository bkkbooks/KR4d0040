  - {type: variant, offset: 4448, length: 1, content: 食, WYG: 有改正朔易人視聴之事今據唐虞之前無異正朔之文則似孔說得之然鄭康成依尚書緯以為正朔三而改自古皆相變若循環然非至於夏商周而後變也孔子曰行夏之時自古皆用建寅何得謂之夏之時似鄭義復為優}
