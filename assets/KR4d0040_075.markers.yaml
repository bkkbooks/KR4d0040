  - {type: variant, offset: 4383, length: 6, content: 男詠里及一女, WYG: 者豈世俗澆偽不可復振將教之禁之之道有所未備也漢有天下至於孝文纔三十年而帛朽於庫粟流於庾國家平定宇内嚮九十載而公私之積日以凋耗議者推測其故而未能明也憂者雖衆而莫能謀也敢問所以明之謀之亦有其術歟又若韓非之五蠧荀悦之三遊此}
