  - {type: line-break, offset: 4370, content: '', id: KR4d0040_SBCK_075-10b12}
  - {type: variant, offset: 4372, length: 4, content: 氏同里人, WYG: 清臣等䇿問一首熙寧三}
  - {type: variant, offset: 4377, length: 0, content: '', WYG: 三月}
  - {type: variant, offset: 4380, length: 0, content: '', WYG: 日王介甫言於上以為天命不足畏祖宗不足法流俗不足恤故因䇿目以此三事質於所試者范景仁復至曰流俗不足恤一事我巳為䇿目矣遂刋之明日禁中以紙帖其上别出䇿目試清臣等問先王之治盛矣其遺文餘事可見於今者詩書}
  - {type: page-break, offset: 4380, content: '', id: KR4d0040_WYG_075-5a, image: WYG1094/WYG1094-0681c.png}
  - {type: variant, offset: 4381, length: 1, content: 寡, WYG: 巳矣詩曰文王陟降在帝左右書曰面稽天若蓋言王者造次動靜未嘗不考察天心而嚴畏之也詩曰毋念爾祖聿修厥徳書曰有典有則貽厥子孫蓋言三代嗣王未有不遵禹湯文武之法而能為政者也詩曰先民有言詢於芻蕘書曰有廢有興出入自爾師虞庶言同則繹蓋言與衆同欲則令無不行功無不成也今之論者或曰天地與人了不相關薄食震揺皆有常數不足畏忌祖宗之法未必盡善可革則革不足循守庸人之情喜因循而憚改為可與樂成難與慮始紛紜之議不足聽采意者古今異宜詩書陳迹不可盡信邪將聖人之言深微高逺非常人所能知先儒之解或未得其㫖邪願聞所以辨之賢良䇿問一首為邵興宗作皇祐四年問國家比下詔書以延天下豪俊之士待之以不次之位豈特以學問之富為賢良文辭之麗為方正邪蓋思得先古之至道當今之要務施之於事以安元元此主上所以側席而求寤寐而思者也今子大夫褎然為舉首固當有以副所以待之之意而不愧乎其名矣言及之而不言則㡬於所謂隠者乎昔三代之王也逺者八百載近者不減四百後世王天下者鮮能及之陵夷衰微至於五代或四三年敢問前之所以延者豈世有哲王以守其業後之所以蹙者豈繼嗣不肖不能享其功歟抑繇祖宗建法垂統明備固宻子孫不能敗邪至治之世耕者讓畔漁者讓澤今國家修明禮義以切勵天下久矣而退讓之風未甚行於朝爭奪之俗未盡絶於野秋毫之利捐仁廢誼為之而不恥上下病之而不能革也又内外百吏或侵牟細民苟不得其欲則轉賞為罰倒直為曲寃痛失職吁嗟滿道雖待之以重誅嚴刑而不能止也兹}
