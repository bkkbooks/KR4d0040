  - {type: variant, offset: 4404, length: 3, content: 家尊章, WYG: 材性散殊不可致之於一塗愛尚不同不可納之於一趣吾子懐材抱器待時而用前言往行心所常存然則志於道者何術慕於古者何人當位得時施於政而何尚修身立行選於徳而何從蓋聞言不及之而言謂之躁言及之而不言謂之隠今聴者雖非昔人之明而}
