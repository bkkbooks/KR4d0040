  - {type: variant, offset: 2892, length: 623, content: 取進止辭轉官第三劄子臣伏奉詔書以臣辭免恩命所請冝不允者昔英宗皇帝入承大統宰臣韓琦等實有定策之功又踐阼之𥘉聖躬違豫慈聖光獻皇太后權同聽政琦等盡忠竭力亦不爲不至及英宗皇帝專制萬機褒賞琦等各遷一官臣時爲諌官猶曽上言以近歳官冗賞濫兩府大臣陛下即政之𥘉冝懲革斯弊今自於朞年之間連併遷官則難以禁它人之幸進者恐宿衛將帥宗室外戚四方藩鎮内侍近臣皆有冀望至時陛下亦不能裁抑兩府亦不敢輙奏當是時英宗皇帝雖不収還恩命而冨弼亦有定策之功自以不預顧命力辭甚苦况臣旣不預定策又不預顧命豈可來自冗散之地遽與輔臣同賞且臣昔日在人則言其不可受今日在已則受而不辤顧行復言能不自愧所有告身臣不敢祗受伏望聖慈矜察特賜寢罷取進止辭官第四劄子昨蒙恩除臣正議大夫臣三具劄子及簾前面陳至懇終未賜開允臣夙夜愧恐不能自巳臣切以爲政之要惟在於賞功罰罪賞不當功則徼幸競進罰不當罪則善良憂恐亂之基也曏日神宗大漸之際臣屏居閭閻今乃與建儲受遺之臣一例遷官賞不當功何以過此陛下不知臣不肖使待罪執政執政當爲陛下抑徼幸惜官職而身自冒賞何以表率它人臣非敢私飾小廉其志欲爲國家慎重名器伏望聖慈矜察特寢罷新命所有告身臣不敢祗受取進止辭官第五劄子臣准閤門告示以臣累上章辭免新命已降批荅不許所有告身可告示早令祗受者臣竊惟無功受賞士之所難究觀英宗皇帝神宗皇帝即政之𥘉褒賞大臣皆以定策受遺之功非因祔廟禮畢臣旣非定䇿又不受遺實難虚受至於政事日新皆陛下聖明衆賢恊力在臣一人何能禆益而無名冐賞惟恐有玷清朝所有告身臣不敢祗受伏乞早賜寢罷, WYG: ''}
