  - {type: variant, offset: 4992, length: 2, content: 公文, WYG: 謝劄子元祐元年上臣伏聞降聖㫖在閤門宰臣執政官近遷轉已正謝訖内有司馬光見患在假特放謝仍免赴景靈宫福寧殿恭謝臣聞命震駭無地自處豈有朝廷特遷一官卧家受之並不入謝君降異常之澤臣無一拜之勤自古以來未嘗有此臣雖頑暗必不敢當伏望聖慈早賜収還今來指揮候臣疾患稍痊只依前來指揮减拜入謝及赴景靈宫福寧殿恭謝庶使賤臣粗能自安取進止審内批指揮劄子元祐元年正月上内批依二十八日指揮臣昨日具劄子奏為聖㫖特放正謝仍免赴景靈宫福寧殿恭謝臣以自古以來未有此禮必不敢當當夜准御批依近降指揮臣勘㑹今月十四日内降以臣轉官所有將來正謝特令兩拜起居免舞蹈十七日又准内降所有臣將來合赴景靈宫恭謝逐殿宜止令兩拜二十八日又准入内供奉官劉永年傳宣放臣正謝及景靈宫福寧殿神御前恭謝臣未審御批依近降指揮是依十四日指揮十七日指揮依二十八日指揮須至再有奏禀取進止辭放正謝第二劄子臣昨夜准御批指揮今早再有奏禀䝉復降御批依二十八日指揮臣承命驚惶措躬無地伏念臣忝為人臣陛下賜之一顧賜之巵酒賜之𤓰果臣亦當稽首拜謝况進以高位加之寵名榮動搢紳澤流苗裔豈可即安私室專飬沉疴不造王庭坐受圭組不獨為海内之所共責有司之所直䋲天威違顔不出咫尺隕越斃踣為聖朝羞臣雖至愚粗知自愛何敢受此自納於不測之誅伏望聖慈矜閔候臣所患稍痊安日止依十四日十七日所降指揮减拜入謝及於景靈宫福寧殿神御前恭謝庶使差可自安其二十八日指揮臣以死自守必不敢奉詔取進止辭放正謝第三劄子元祐元年二月上今月五日准尚書省劄子以臣前奏乞候所患稍痊安日依正月十四日十七日所降指揮减拜入謝及於景靈宫福寧殿神御前恭謝今月二日三省同奉聖㫖依正月二十八日指揮臣聞君待臣以惠臣奉君以恭故能上下相親道用交泰陛下念臣衰老抱病筋力尫羸特損朝儀以從私便陛下之大惠也臣若不知禮有靦面目坐受優恩曽無辭避是君有惠而臣不恭上行施而下無報臣雖頑昧心豈敢安伏望聖慈如臣前奏依正月十四日十七日指揮庶使㣲軀有地自處取進止傳家}
