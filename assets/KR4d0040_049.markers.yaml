  - {type: variant, offset: 5000, length: 0, content: '', WYG: 欽定四庫全書傳家集巻五十宋司馬光撰章奏三十三論西夏劄子元祐元年正月上臣伏見神宗皇帝以夏國王趙秉常為臣下所囚興兵致討奮揚天威震動沙漠虜擕其種落竄伏河外諸將収其邊地建米脂義合浮圖葭蘆吳堡安疆等寨此盖止以藉口用為已功皆為其身謀非為國計臣竊聞此數寨者皆孤僻單外難於應援田非肥良不可以耕墾地非險要不足以守禦中國得之徒分屯兵馬坐費芻糧有久戍逺輸之累無拓土闢境之實此衆人所共知也王師既収靈州不克狼狽而歸卒疲食盡失亡頗多西人知中國兵力所至自此始有輕慢之心是以明年邊臣築永樂城虜潛師掩襲覆軍殺將塗炭一城久之又舉一國之衆攻圍蘭州期於必取將士堅守僅而得全虜自是銳氣少挫不敢輕犯邊矣臣聞此數寨之地中國得之雖無所利虜中失之為害頗多何則深入其境近其腹心常慮中國一朝討襲無以支梧不敢安居是以必欲得之不肯棄捨一年前虜嘗專遣使者詣闕深自辨訴請臣服如故其志無他止為欲求其舊境而已朝廷既許其臣服虜來請舊境朝廷乃降指揮其前則云所以興舉甲兵本欲執取罪人救㧞幽辱非有意侵取疆塲土地而已其後乃云止將已得些小邉土聊示削罰豈可更有陳乞還復之理此則朝㫖首尾已自相違又興師本為振㧞秉常拒命者國人之罪豈可更削秉常之地於理差似未安王者以大信御四海羗戎雖㣲恐未易以文辭欺也於是虜既失望憤怒怨懟移文保安軍辭理不遜云今來賀正旦人使難議遣發自是正旦生辰乃至陛下繼明皆不遣使入賀其不臣大矣然而去歳四遣使者詣闕弔慰祭奠吿其母喪并進遺物理雖不備稍示屈服臣竊料虜意不出於三一者猶冀朝廷萬一赦其罪戾返其侵疆二者陽為恭順使中國休怠便隂伺間隙入為邉患三者久自絶於上國其國中貧乏使者往來得賜賚之物且因為商販耳昔衞貳於晉晉取戚田及衞人既服郤缺曰日衞不睦故取其地今已睦矣可以歸之叛而不討何以示威服而不柔何以示懐非威非懐何以示德遂歸戚田于衞今西人所為如此朝廷既不能拒絶勿受其使又不能招納與之更始彼來則迎送館穀以賔客待之不來則一無所問日復一日將踰二年臣竊意朝廷謂西人勢已衰弱心實内附故來則不拒去則不追置之度外不以為虞殊不思數年前王師大舉深入將士所過烈於猛火割其疆埸屢請而不還彼怨毒欲讐報之心窺窬欲乘釁之意日夜不忘若渇者不忘飲盲者不忘視也譬如有虎狼在屋側垂頭熟寢人豈可見其不動狎而侮之循其頭躡其尾邪臣每思之終夕寒心以臣愚慮於今為之止有二策一者返其侵疆二者禁其私市何謂返其侵疆凡天子即位天地一新滌瑕蕩穢小大無遺昔趙佗自稱南越武帝倔强嶺南漢文帝即位赦其大罪遣單使往諭之佗稽首請服累世為臣李繼遷俶擾西陲十有餘年關中困弊真宗皇帝即位赦其大罪割靈夏等數州除其子趙德明為定難軍節度使由是邉境安寧者四十年此乃前世及祖宗之成法非無所依據也今秉常之罪不大於繼遷也米脂等寨不多於靈夏也陛下誠能於此踰年改元之際特下詔書數其累年不來賀正旦生辰及登寳位等不備之禮嘉其弔慰祭奠吿國母喪進遺物之勤曠然推恩盡赦前罪自今以後貢獻賜予悉如舊規廢米脂義合浮圖葭蘆吳堡安疆等寨令延慶二州悉加毁撤除省地外元係夏國舊日之境並以還之其定西城蘭州議者或謂本花麻所居趙元昊以女妻之覊縻役屬非其本土欲且存留以為後圖猶似有名禦夷狄者不壹而足俟其再請或留或與徐議其宜亦無所傷至於㑹州尚在化外而經略司遽稱熈河蘭㑹虜常疑中國更有闢境之心不若改為熈河岷蘭經略司如此則西人忽被德音出於意外雖禽獸木石亦將感動况其人類豈得不鼓舞忭蹈世世臣服者乎議者或曰先帝興師動衆所費億萬僅得數寨今復無故棄之此中國之恥也昔漢元帝棄珠崖詔曰朕日夜惟思議者之言羞威不行則欲誅之通於時變則憂萬民夫萬民之饑餓與逺蠻之不討危孰大焉遂棄之此乃帝王之大度仁人之用心如天地之覆燾父母之慈愛盛德之事何恥之有國家方制萬里今此尋丈之地惜而不與萬一西人積怨憤之氣逞凶悖之心悉舉犬羊之衆投間伺隙長驅深入覆軍殺將兵連禍結如曏日繼遷元昊之叛逆天下騷動當是之時雖有米脂等千寨能有益乎不唯待其攻圍自取固可深恥借使虜有一言不遜而還之傷威毁重固已多矣故不若今日與之之為美也此國大事伏望陛下留神熟慮更與執政詳議以聖意斷而行之不可後時失此機㑹悔將無及何謂禁其私市西夏所居氐羌舊壤地所産者不過羊馬氊毯其國中用之不盡其勢必推其餘與他國貿易其三面皆戎狄鬻之不售惟中國者羊馬氊毯之所輸而茶綵百貨之所自來也故其民如嬰兒而中國乳哺之矣寳元慶厯之間元昊負恩僣亂屢犯邉境大入則大利小入則小利中國未嘗蹈其境破其軍禽其將屠其城有害於社稷也而首尾六年元昊遣使因縁邉吏卑辭納款頓顙稱臣雖其惡積罪盈欲懐音革面原其私心未必不貪中國之財思私市之利故也舊制官給客人公據方聽與西人交易傳聞近歳法禁踈闊官吏弛慢邉民與西人私交易者日夕公行彼西人公則頻遣使者商販中國私則邉鄙小民竊相交易雖不獲歳賜之物公私無乏所以得偃蹇自肆數年之間似恭似慢示不汲汲於事中國由資用饒足與事中國時無以異故也陛下誠能却其使者責以累年正旦生辰及登寳位皆不來賀何獨遣此使者拒而勿内明勅邉吏嚴禁私市俟其年歳之間公私困弊使自謀而來禮必益恭辭必益遜然後朝廷責而赦之許通私市待之如初然邉民與西人交易為日積久習玩為常一旦禁之其事甚難何則若以常法治之則有司泥文動循䋲墨追問證左逮捕傳送之人停匿之家奏裁待報動涉半年如此則徒使邉民麗刑者衆獄犴盈溢而私市終不能禁也夫三尺之限空車不能登峭峻故也百仭之山重載陟其上陵夷故也今必欲嚴禁邉民與西人私市須權時别立重法犯者必死無赦本地分吏卒應廵邏者不覺透漏官員衝替兵士降配仍許人吿捉獲者賞錢若干當日内以官錢支給更不以犯事人家財充如此則縁邉六路各行得一兩人則庶幾可以聳動人耳目令行禁止人不敢犯矣然人存政舉此事全在邉帥得人昔龎籍為河東經畧使下令禁邉民與西人私市有熟戸犯禁籍斬於犯處妻拏皆送淮南編管一境凛然無敢犯者其後施昌言為環慶路經略使亦禁私市西人發兵壓境昌言遣使問其所以來之故西人言無他事只為交易不通使者懼其兵威輒私許之法遂復壊若邉帥未能盡得其人則此法恐未易可行不若前策道大體正萬全無失也取進止}
