  - {type: variant, offset: 124, length: 1310, content: 踰五十不求仕進真儒者之髙蹈聖丗之逸民伏望聖慈特加召命擢以不次足以矝式士類禆益風化取進止乞裁断政事劄子臣聞兩貴之不能相事兩賤之不能相使此乃物理自然人情之常也是以聖人立爲君臣使人臣各獻其謀而人君裁决其是非若網在綱有條而不紊此國家所以治也若人君不加裁决使人臣各行其意則朝夕闘訟弱不勝強寡不勝衆不則雷同詭隨尸禄竊位苟且偷安以度目前此國家所以衰也然人君於是非之間亦當三思清察昭然無疑然後决之自古興衰治乱未有不由此塗出也夫人心不同各如其面雖以周公之聖召公之賢同輔成王猶有不恱况邪正忠佞各有所存者乎臣竊惟皇帝冨於春秋太皇太后親臨萬機事無大小皆委於執政垂拱仰成萬一群臣有所見不同勢均力敵莫能相壹者伏望陛下特留聖意審察是非若甲是而乙非當捨乙而從甲乙是而甲非當捨甲而從乙如此則群臣莫敢不服善政日新矣不然陛下雖有求治之心事功無時而成也况書曰惟辟作福作威不可使用人賞罰之柄盡歸執政人主一不得而專也取進止議可劄子臣聞古人有言謀之在多断之在獨陛下寛仁委政群下或群疑議論難一儻陛下不决其是非則爭辯紛紜無時而息事功何由可成臣謹按蔡邕獨断敘漢制有疑事公卿百官㑹議若臺閣有正處而獨執異意者曰駮議其合於上意者文報曰某官某甲議可此所以各盡臣下之所見而人主亦不失操柄也今執政之臣雖相與竭力同寅恊恭若萬一有議論必不可合者欲乞許令各具劄子奏聞望陛下精察其是非可否以聖意决之或於簾前宣諭或於禁中批出令依某人所奏若群臣猶有固爭執者則願陛下更加審察若前來處分果非則勿憚改爲若灼然無疑則决行不移耳如此再思而行庶幾得盡衆心事亦少失矣取進止大辟貸配法草應開封府諸路州軍奏到大辟罪人稱是刑名疑慮及情理可憫者仰刑部大理寺依條定断并坐疑慮可憫條送刑部看詳如刑名實有疑慮情理實有可憫因依申奏取旨若看詳得别無疑慮及可憫者即具鈔奏下夲處依法施行不得一槩將舊例貸配破却律勑正條仍委門下中書尚書省點撿如有不當及用例破條奏乞取勘施行進孝經指解劄子臣竊惟自古五帝三王未有不由學以成其聖德者所謂學者非誦章句習筆扎作文辭也在於正心修身齊家治國明明德於天下也恭惟皇帝陛下肇承基緒雖年在幼冲而執喪臨朝率禮弗越體兒尊嚴舉止安重顒顒卭卭有老成之德華夷瞻仰無不愛戴此乃聖性自然不聞亦式實天祐皇家宗廟社稷生民之盛福也然玉不琢不成噐人不學不知道儻復資學問以成之則堯舜禹湯文武何逺之有伏見近降聖旨過冬至開講筵臣竊以聖人之德無以加於孝自天子至於庶人莫不始於事親終於立身揚名於後丗誠爲學所冝先也臣曏不自揆甞撰古文孝經指解皇祐中献於仁宗皇帝竊慮歲乆遺失不存今别繕冩爲一冊上進伏乞聖明少賜省覧取進止辭特轉官第一劄子臣伏覩中書録黄奉聖旨神宗祔廟畢執政官依故事轉遷以臣爲正議大夫者臣竊惟英宗皇帝親政之𥘉以宰臣韓琦等於嘉祐之末有定策大功保祐聖躬濟于艱難故各特遷一官今陛下以神宗皇帝大漸之際宰臣蔡確等啓迪聖心建立儲貳傳授大寳各特遷一官固亦其冝臣當是時方閑居西京慿几末命非所預聞豈得與確等同受褒賞且國家名位本以醻功報德不可但以祔廟禮畢檢舉故事虚有授受况臣於登極之𥘉巳蒙覃恩改官今曾未踰年安敢再叨殊渥縱臣貪冒不知愧耻天下之人其謂臣何所有授正議大夫告身臣不敢祗受伏望聖慈特賜寢罷取進止辭官第二劄子臣於今月十一日伏覩中書録黄蒙恩除正議大夫臣於, WYG: ''}
