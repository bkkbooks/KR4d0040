  - {type: variant, offset: 3080, length: 352, content: 者州縣長官量事貶降隱而不言委録事叅軍糾察聞奏刑统叅詳條部内有犯惡逆以上罪者今後刺史以上附表自劾以敦風教責与不責並聽敕裁朝廷近年務行寛政吏有故出人罪者率皆不問或小有失入則終身廢棄以此民有謀殺及毆詈尊長者州縣之吏專務掩蔽縦釋惟恐上聞往往止從杖罪断遣少肯處以正法蓋避自劾之耻務爲身謀遂使頑民益無顧憚名敦風教其實壞之王者之政當善善惡惡若寛此悖逆之民以爲仁政臣實愚淺未之前聞況教化之失風俗之弊任其責者豈特州縣長吏而巳若長吏隱而不言乃使録事叅軍糺察聞奏斯亦難矣臣愚伏望朝廷今後除去上件貶降長官及附表自劾二條更不施行在京則委糺察刑獄畿内則委府界提點在外則委轉運使提點刑獄常切覺察州縣官吏如有敢將惡逆不孝不睦等罪寛縱隱蔽不依正法勘鞫断遣並畫時糺舉聞奏隨其輕重各以故出人罪論若上件諸司不糺舉者委臺諌官察訪聞奏取進止二先劄子, WYG: ''}
