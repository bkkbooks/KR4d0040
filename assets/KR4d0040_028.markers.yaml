  - {type: variant, offset: 1625, length: 0, content: '', WYG: 言奉養上殿第四劄子臣伏見陛下曏者即位之初奉事皇太后䖍恭欵至皇太后撫愛陛下恩渥周備數日之間慈孝之譽逹于中外播於逺近聞者無不相慶自聖體不安旬月之間道路之人漸有異議皆云因任守忠等本不樂陛下為嗣故於皇太后之處則言陛下與中宫之短於陛下與中宫之處則言皇太后之失遂使兩宫之心互相猜貳間隙一開猝難復合今陛下奮發英斷屏黜讒邪守忠等皆降逐出外中外之人不勝忭恱然臣愚竊恐皇太后尚未能盡知姦人之情與陛下所以斥去之意伏望陛下與中宫親詣皇太后閤頓首陳謝具述從來為守忠等所誤致屢有違忤皇太后之意今守忠等既去願與皇太后母子之恩一如舊日然後朝夕與中宫侍養左右膳羞藥餌躬親進獻承順顔色皆如臣庶之家母子婦姑之禮若左右之人尚有敢相離間者願陛下立行誅竄勿復有疑如此則讒慝黜逺内外雍睦善氣興行災沴消亡宗廟永安令聞長世若失此之際兩宫之歡不能復舊則恐長無可復之期豈惟當今天下之人以陛下為非將傳於史䇿取譏萬世矣此皆聖明所自知而臣復區區進言者欲陛下深更留意取進止言}
