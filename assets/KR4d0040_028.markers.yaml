  - {type: indent, offset: 2127, content: 　　　　, id: KR4d0040_krp_028-bkkind14}
  - {type: variant, offset: 2127, length: 0, content: '', WYG: 乞車駕早出祈雨劄子治平元年四月十七日上臣伏見權御史中丞王疇等建言乞陛下循真宗故事幸諸寺觀祈雨朝廷雖從其所請而講議選日巳踰旬浹至今車駕未出衆論狐疑皆云事恐中輟臣愚竊以陛下踐阼巳踰朞年京城百姓未聞屬車之音重以曏者聖體不安逺方之人妄造事端訛言未息若聞車駕一出則逺近釋然莫不喜恱況今春少雨麥田枯旱禾種未入倉廪虚竭閭里饑愁陛下為民父母當與之同其憂勞祈禱羣神豈可晏然視之不以疚懷況詔命已降流聞四方若復遷延久而不出則道路之人愈増猜惑不若曏時初無此議也且王者以四海為家故稱乗輿或稱行在今車駕暫出近在京城之内亦何必拘瞽史之言選揀時日而忘萬民朝夕之急殆非成湯桑林周宣雲漢之意也臣愚伏望陛下斷自聖志於一兩日之間車駕早出為民祈雨以副中外喁喁之望取進止乞今後有犯惡逆不令長官自劾劄子治平元年四月二十四日上臣竊以國家承百王之弊俗化陵夷不肖愚民犯誼侵禮無所不至此朝廷所宜留意不可忽也昔賈誼歎秦俗之薄惡以為借父耰鉏慮有徳色母取箕帚立而誶語抱哺其子與公併倨婦姑不相說則反脣而相稽以今閭巷之民旦夕所為如彼數者皆何足言近聞開封府屢有子殺父母者相繼事發以京邑之中猶有如此悖逆之民況於逺方教化之所不及哉臣竊見刑部格勑百姓間有犯惡逆以上者州縣長官量事貶降隠而不言委錄事叅軍糾察聞奏刑統叅詳條部内有犯惡逆以上罪者今後刺史以上附表自劾以敦風教責與不責並聽勑裁朝廷近年務行寛政吏有故出人罪者率皆不問或小有失入則終身廢棄以此民有謀殺及毆詈尊長者州縣之吏專務掩蔽縱釋惟恐上聞往往止從杖罪斷遣少肯處以正法葢避自劾之恥務為身謀遂使頑民益無顧憚名敦風教其實壊之王者之政當善善惡惡若寛此悖逆之民以為仁政臣實愚淺未之前聞況教化之失風俗之弊任其責者豈特州縣長吏而已若長吏隠而不言乃使錄事叅軍糾察聞奏斯亦難矣臣愚伏望朝廷今後除去上件貶降長吏及附表自劾二條更不施行在京則委糾察刑獄畿内則委府界提㸃在外則委轉運使提㸃刑獄常切覺察州縣官吏如有敢將惡逆不孝不睦等罪寛縱隠蔽不依正法勘鞫斷遣者並畫時糾舉聞奏隨其輕重各以故出人罪論若上件諸司不糾舉者委臺諫官察訪聞奏取進止}
