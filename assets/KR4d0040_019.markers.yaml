  - {type: variant, offset: 33, length: 5, content: 覽制䇿劄子, WYG: 而月視欹者扶之敝者補之如是則雖亘千萬年無頽壊也夫民者國之堂基也禮法者柱石也公卿者棟梁也百吏者茨葢也將帥者垣墉也甲兵者闗鍵也是六者不可不朝念而夕思也夫繼體之君謹守祖宗之成法苟不隳之以逸欲敗之以讒謟則世世相承無有窮期及夫逸欲以隳之讒謟以敗之神怒於上民怨於下一旦渙然而去之則雖有仁智恭儉之君焦心勞力猶不能救陵夷之運遂至於顛沛而不振嗚呼可不鍳哉今國家以此承平之時立綱布紀定萬世之基使如南山之不朽江河之不竭可以指顧而成耳失今不為已乃頓足扼腕而恨之將何益矣詩云我日斯邁而月斯征夙興夜寐無忝爾所生時乎時乎誠難得而易失也}
