  - {type: variant, offset: 21, length: 0, content: '', WYG: 上乞改知衛州叔詹遂乞致仕朝廷許之右臣竊見前知壽州張叔詹因本路監司奏以本州水災叔詹非才乞别差人尋移知蔡州伏縁壽蔡之民皆陛下赤子叔詹若為政無狀於民有害移彼置此有何所殊况蔡州封部闊逺户口繁庻土饒山林素多盗賊地望之重過於壽州牧守之任尤須擇人豈有因不才被斥更得善處若叔詹實有才能惠及於民則當治本路監司罔上誣賢之罪使叔詹仍居舊任不復移易今臧否不分進退無據衆口籍籍皆云未允臣前上言為治之要在於擇人賞罰此亦擇人不精賞罰不當之一事也况叔詹資性庸下老而益昏本無片長授任過分其為忝冒人盡知之使之從政所至為害伏乞朝廷直令致仕或授以冗散之職勿使親民庶幾黜陟明白無損政體傳家集巻二}
  - {type: page-break, offset: 21, content: '', id: KR4d0040_WYG_020-16b, image: WYG1094/WYG1094-0214d.png}
  - {type: variant, offset: 22, length: 0, content: '', WYG: 欽定四庫全書傳家集巻}
  - {type: page-break, offset: 22, content: '', id: KR4d0040_WYG_021-1a, image: WYG1094/WYG1094-0215a.png}
  - {type: variant, offset: 23, length: 1, content: 等, WYG: 十一宋司馬光撰章奏四進五規狀嘉祐六年八月十七日止右臣幸得備位諌官竊以國家之事言其大者逺者則汪洋濩落而無目前朝夕之益䧟於迃闊言其小者近者則叢脞委瑣徒足以煩凂聖聴失於苛細夙夜惶惑口與心謀渉瀝累旬乃敢自决與其受苛細之責不若取迃闊之譏伏以祖宗開業之艱難國家致治之光美難得而易失不可以不慎故作保業隆平之基因而安之者易為功頽壊之勢從而救之者難為力故作惜時道前定則不窮事前定則不困人無逺慮必有近憂故作逺謀燎原之火生於熒熒懐山之水漏於涓涓故作重㣲象龍不足以致雨畵餅不足以療饑華而不實無益於治故作務實合而言之謂之五規此皆守邦之要道當世之切務戇陋狂瞽觸冒忌諱惟知納忠不敢愛死伏望陛下以萬幾之餘㳺豫之間垂精留神特賜省覧萬一有取裁而行之則臣生於天地之間不與草木同朽矣五規保業天下重噐也得之至艱守之至艱王者始受天命之時天下之人皆我比肩也相與角智力而爭之智竭不能抗力屈不能支然後肯稽顙而為臣當是之時有智相偶者則為二力相參者則為三愈多則愈}
