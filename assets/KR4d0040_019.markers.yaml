  - {type: variant, offset: 4905, length: 1, content: 九, WYG: 五日十三公主薨其日宫中送殯出城留宫門及城門至夜深方閉物情駭異以為非冝雖陛下慈愛至深然門闕之禁不可不嚴若以式律言之夜開宫殿門及城門者皆須有墨勅魚符其受勅人具録所開之門并出入人帳送中書門下自監門衛大將軍以下俱詣閤覆奏御注聴即請合符門鑰監門官司先嚴門仗所開之門内外並立隊燃炬火對勘符合然後開之符雖合不勘而開若勘符不合而為開及不承勅而擅開閉若得出入者剰將人出入其刑名輕者徒流重者處絞今以乳兒出殯之故内自禁掖外逹郊野諸門洞開一如晝日車馬徃來絡繹不絶出入之人無復譏訶有如萬分之一姦險不逞之人雜處其間豈可不為之寒心哉伏望陛下深鑒安危防㣲杜漸自今宫殿門城門並須依時開閉非有急切大事勿復夜開必不得巳須至夜開者即乞陛下親降手勅加以御寳受勅之人仍冩出入人帳委宿衛當上之官衆共驗勅文真的然後覆奏候再見御批方請門鑰與監門官親自監開依帳㸃閲人數放令出入即時下鏁進納門鑰其宿衛監門官司若不見手勅及御批而輙敢開者依不承勅而擅開閉律文施行雖有手勅御批不叅驗及不親自監開㸃閲人數者依符雖合不勘而開律文施行庻可以養萬乗之威尊消姦宄於未萌也}
