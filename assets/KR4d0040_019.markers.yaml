  - {type: variant, offset: 4897, length: 0, content: '', WYG: 家至大至急之務無先於此若捨而不言專以冗細之事煩凟聖聴厭塞職業是臣懐姦以事陛下罪不容於葅醢伏望陛下取臣曏時所進三狀少加省察或有可取乞斷自聖志早賜施行如此則天地神祗宗廟社稷羣臣百姓並受其福惟在陛下一言而巳取進止乞建儲上殿第二劄子尋有詔以濮王子宗實知宗正寺臣近於前月二十六日上殿敷奏乞檢㑹臣在并州所奏三狀早定繼嗣事陛下聖意昭然即垂聴納凡所宣諭皆非愚臣所能及此乃天神地祗保佑皇家實萬世無疆之休也臣謂陛下朝夕當發德音宣告大臣施行其事今將近一月未有所聞豈陛下以兹事體大慎選宗室未得其人將左右之人有所間阻熒惑聖聴臣皆不得而知也臣聞為人後者為之子也著於禮律皆有明}
  - {type: page-break, offset: 4897, content: '', id: KR4d0040_WYG_022-1b, image: WYG1094/WYG1094-0224b.png}
  - {type: page-break, offset: 4897, content: '', id: KR4d0040_WYG_022-2a, image: WYG1094/WYG1094-0224c.png}
  - {type: variant, offset: 4898, length: 0, content: '', WYG: 漢孝成帝即位二十五年年四十五以未有繼嗣立弟子定陶王欣為太子今陛下即位之年及春秋皆巳過之豈可不為宗廟社稷深思逺慮哉况今亦未使之}
  - {type: page-break, offset: 4898, content: '', id: KR4d0040_WYG_022-2b, image: WYG1094/WYG1094-0224d.png}
  - {type: variant, offset: 4899, length: 0, content: '', WYG: 東宫之名但願陛下自擇宗室仁孝聪明者養以為子官爵居處稍異於衆使天下之人皆知陛下意有所屬以係逺近之心俟他日皇子生復使之退歸藩邸有何所傷此誠天下安危之繫願陛下决意而速行之取進止論荒政上殿劄子臣竊聞淮南両浙今嵗水災民多乏食徃徃羣軰相聚操執兵仗販鬻私鹽以救朝夕至有與官軍拒鬭相殺傷者若浸淫不止將成大盗朝廷不可不深以為憂葢由所司㩁之太急故抵冒為姦臣聞周禮以荒政十有二聚民近者朝廷略以施行惟舎禁除盗賊二者似未留意今赤子凍餒濵於溝壑柰何尚與之爭錙銖之利豈為民父母之意哉臣謂陛下冝戒諭職司使明體朝意稍弛鹽禁而嚴督盗賊緩課利不充之罰急羣行剽刼之誅廢告捕私鹽之賞旌討擒彊暴之功棄聚斂之小得保安全之大福除惡於纎介弭亂於未形最䇿之得者也取進止論勸農上殿劄子嘉祐六年上得㫖依臣聞食者生民之大本為政之首務也饑饉之世珠玉金銀等於糞土惟糓之為寳不可一日無也今國家每下詔書必以勸農為先然而農夫日寡㳺手日繁豈非為利害所驅耶今農夫苦身勞力惡衣糲食以殖百糓賦斂萃焉徭役出焉嵗豐則賤糶以應}
  - {type: page-break, offset: 4899, content: '', id: KR4d0040_WYG_022-3a, image: WYG1094/WYG1094-0225a.png}
  - {type: page-break, offset: 4899, content: '', id: KR4d0040_WYG_022-3b, image: WYG1094/WYG1094-0225b.png}
  - {type: variant, offset: 4900, length: 0, content: '', WYG: 上之須給債家之求嵗㓙則流離異鄉轉死溝壑如是而欲使夫商賈末作之人坐漁厚利鮮衣美食者轉而縁南畮斯亦難矣然則勸農者言也害農者政也天下生之者益少食之者益多欲糓之無涸得乎哉為今之術勸農莫如重糓重糓莫如平糴使諸路轉運使及州軍長吏遇豐嵗能廣謀糴入官滿之日倉庫之實比於始至増羨多者賞之其無水旱之災益兵之費而蓄積耗減者黜之又令民能力田積糓者不以為家貲數如是則糓重而農勸雖有饑饉常無流亡盗賊之患矣今嵗河北河東㳂邉糓糴至賤此亦國家所冝留意者也取進止論臣寮上殿屏人劄子嘉祐六年九月二十八日奉聖㫖依行臣等竊聞自先帝以來應兩府臺諌官等上殿奏事左右侍臣悉皆屏退葢以君不宻則失臣臣不密則失身重愼樞機不得不爾竊見近日臣寮上殿奏事左右侍臣不遵舊制或有進至殿角板障門以裏與御坐相去不過數歩陛下徳音及羣臣敷奏之語皆可聴聞其間有機宻大事若致漏泄大為不便欲乞一依舊制今後應遇兩府臺諌官等上殿奏事其左右侍臣並於殿角板障門外踏道下祗候仍乞委都知押班於兩邊板障門外檢校如敢竊有覘聴者並具姓名聞奏勘罪施行取進止論制䇿等第狀既上而執政以􅝲所試進呈欲黜之上曰其言切直不可棄也乃降一等収之即蘇轍也右臣近䝉差赴崇政殿後覆考應制舉人試巻内􅱹􅝲両號所對策辭理俱髙絶出倫軰然􅝲所對命秩之差虚實之相養者一兩事與所出差舛臣遂與范鎮同議以􅱹為第三等􅝲為第四等詳定官巳定從覆考竊知初考官以為不當朝廷更為之差官重定復從初考以􅝲為不入等臣竊以國家置此六科本欲取材識髙逺之士固不以}
