  - {type: variant, offset: 2241, length: 504, content: 論舉選狀右臣竊以取士之道當以德行爲先其次經術其次政事其次藝能近丗以來專尚文辭夫文辭者廼藝能之一端耳未足以盡天下之士也國家雖設賢良方正等科其實皆取文辭而已近以祫享赦節文應天下士人有素敦節行兼通學術乆爲郷里所推者委轉運使提點刑獄同加搜訪每路各三兩人仍與本處長吏連署結罪保舉聞奏所舉之人朝廷命本州敦遣至則館於太學待遇甚厚考試之際不糊名謄録旣而署等𥙷官皆過所望此誠合先王取士之道臣謂國家將除積乆之弊立太平之基天下士大夫皆靡然嚮風矣行之未㡬忽聞朝廷一切罷之無不悵然失望臣誠戇愚不識所謂若以所舉之人多非實有材行則當治舉將之罪别加捜訪豈可以一二人謬濫廢天下之舉賢是由因溺而廢天下之舟因噎而廢天下之食也且人之毀譽或出愛憎雖復聖賢不能自免孔子曰衆好之必察焉衆惡之必察焉恐國家亦未可以此遥断否臧遽行黜陟也就使其人平昔所行誠有虧缺古之人或舉於漁鹽或舉於盗賊豈可不容其改行自新而終身弃之乎且人之行能迭有短長若不弃瑕録用而以一節廢之則失之多矣臣愚以爲天子撫有四海海内之士不可一一身察之也必資舉者然後能盡天下之才旣用舉者之言授之爵禄苟不嚴爲禁約以防其私則請託欺罔無不至矣竊以孝者士之尊行㢘者吏之首務故漢丗舉士皆用孝㢘行之最乆得人爲多臣欲, WYG: ''}
