  - {type: variant, offset: 2746, length: 982, content: 應天下知州府軍監任内聽舉孝㢘一人大藩聽舉二人轉運使提點刑獄任内聽舉三人並須到任及一年以上方得奏舉夫郷舉里選雖爲古法今之爲吏者不得乆於其任士之素行或不能盡知若本部無人可舉即聽舉别部之人素所知者以充其數其在京兩制以上聽歲舉一人其舉狀逐時送下貢院置簿收掌每遇科埸詔下即委貢院選擇其日以前舉主最多者取三十人申奏降指揮下本貫敦遣赴闕若舉主數同者即以發狀先後爲次謂君俱有三人舉主則取第三狀日月有前者仍於進士奏名額内减三十人候到闕日或陛下臨軒親試或委中書門下試經義䇿一道時務䇿一道但以義理優長爲上不取文辭華美若所對經義乖戾聖意及時務全不通曉方行黜落其及第授官並與進士第一甲同在明經之上仍於告身前列坐舉主姓名其所舉之人若犯私罪情理重及正入已贓未及第者舉主減三等巳及第者減一等坐之並不以赦原其公罪及私罪情理輕者舉主不坐其未舉以前若曽犯罪除公案見在證驗明白外舉主亦不坐即因勢要屬請求舉及爲人屬請并受屬請而舉之者並科違制之罪受贓者並以枉法論即敦遣不至者更不就除官若累經敦遣不至即乞朝廷臨時裁度特加聘召不爲定制又國家置明經一科少有應者及諸科所試大義有司不以定去留蓋由始者立格太髙致舉人合格者少臣欲乞今後明經所試墨義止問正文不問注䟽其所試大義不以明經諸科但能具注䟽本意說解稍詳者爲通雖不失本意而講解踈略者爲粗餘並爲不若能先具注䟽本意次引諸家雜說更以己意裁定援據該贍義理髙逺雖文辭質直皆爲優等與折二通若不能記注䟽本意但以己見穿鑿不合正道雖文辭辨給亦降爲不其明經以六通諸科以四通以上爲合格若合格人少即并取粗多者合格人多即減去通少者委試官臨時相度令合元額又舊制明經以周易尚書爲小經今欲乞以周易尚書毛詩爲一科三禮爲一科春秋三傳爲一科皆習孝經論語爲帖經又說書一科議者多以爲不當廢欲乞與明經並置但每次科埸止取十人奏名在諸科額内試中受官並與諸科同若自以本科及第或出身者更不得就試說書如此則求賢之路廣請託之源絶浮僞之風息得人之頌興矣謹具狀奏聞伏候勑旨論張叔詹知蔡州狀八月下旬上㝷改知衛州叔詹遂乞致仕朝廷許之右臣竊見前知壽州張叔詹因本路監司奏以本州水災叔詹非才乞别差人㝷移知蔡州伏縁壽蔡之民皆陛下赤子叔詹若爲政無狀於民有害移彼置此有何所殊况蔡州封部闊逺户口繁庶土饒山林素多盗賊地望之重過於壽州牧守之任尤須擇人豈有因不才彼斥更得善處若叔詹實有才能惠及於民則當治本路監司罔上誣賢之罪使叔詹仍居舊任不復移易今臧否不, WYG: ''}
