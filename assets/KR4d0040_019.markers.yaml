  - {type: variant, offset: 25, length: 5, content: 職任差遣劄, WYG: 自非智力首出於世則天下莫得而一也斯不亦得之至艱乎及夫繼體之君羣雄已服衆心已定上下之分明彊弱之勢殊則中人之性皆以為}
