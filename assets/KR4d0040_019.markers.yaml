  - {type: variant, offset: 14, length: 0, content: '', WYG: 即敦遣不至者更不就除官若累經敦遣不至即乞朝廷臨時裁度特加聘召不為定制又國家置明經一科少有應者及諸科所試大義有司不以定去留葢由始者立格太髙致舉人合格者少臣欲乞今後明經所試墨義止問正文不問注䟽其所試大義不以明經諸科但能具注䟽本意講觧稍詳者為通雖不失本意而講觧踈略者為粗餘並為不通若能先具注䟽本意次引諸家雜説更以巳意裁定援據該贍義理髙逺雖文辭質直皆為優等與折二通若不能記注䟽本意但以巳見穿鑿不合正道雖文辭辯給亦降為不通其明經以六通諸科以四通以上為合格若合格人少即并取粗多者合格人多即减去通少者委試官臨時相度令合元額又舊制明經以周易尚書為小經今欲乞以周易尚書毛詩為一科三禮為一科春秋三傳為一科皆習孝經論語為帖經又説書一科議者多以為不當廢欲乞與明經並置但每次科場止取十人奏名在諸科額内試中受官並與諸科同若自以本科及第或出身者更不得就試説書如此則求賢之路廣請託之源絶浮偽之風息得人之頌興矣論移}
