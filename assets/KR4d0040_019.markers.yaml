  - {type: variant, offset: 13, length: 0, content: '', WYG: 嘉祐六年八月二十一日上右臣竊以取士之道當以德行為先其次經術其次政事其次藝能近世以來專尚文辭夫文辭者乃藝能之一端耳未足以盡天下之士也國家雖設賢良方正等科其實皆取文辭而巳近以祫享赦節文應天下士人有素敦節行兼通學術乆為鄉里所推者委轉運使提㸃刑獄同加捜訪每路各三兩人仍與本䖏長吏連署結罪保舉聞奏所舉之人朝廷命本州敦遣至則館於太學待遇甚厚考試之際不糊名謄録既而署等補官皆過所望此誠合先王取士之道臣謂國家將除積乆之弊立太平之基天下士大夫皆靡然嚮風矣行之未幾忽聞朝廷一切罷之無不悵然失望臣戇愚不識所謂若以所舉之人多非實有材行則當治舉將之罪别加捜訪豈可以一二人謬濫廢天下之舉賢是猶因溺而廢天下之舟因噎而廢天下之食也且人之毁譽或出愛憎雖復聖賢不能自免孔子曰衆好之必察焉衆惡之必察焉恐國家亦未可以此遥斷否臧遽行黜陟也就使其人平昔所行誠有虧缺古之人或舉於漁鹽或舉於盗賊豈可不容其改行自新而終身棄之乎且人之行能迭有短長若不棄瑕録用而以一節廢之則失人多矣臣愚以為天子撫有四海海内之士不可一身察之也必資舉者然後能盡天下之才既用舉者之言授之爵禄苟不嚴為禁約以防其私則請託欺罔無不至矣竊以孝者士之尊行廉者吏之首務故漢世舉士皆用孝廉行之最乆得人為多臣欲乞應天下知州府軍監任内聴舉孝亷一人大藩聴舉二人轉運使提㸃刑獄任内聴舉三人並須到任及一年以上方得奏舉夫鄉舉里選雖為古法今之為吏者不得乆於其任士之素行或不能盡知若本部無人可舉即聴舉别部之人素所知者以充其數其在京兩制以上聴嵗舉一人其舉狀逐時送下貢院置籍收掌每遇科場詔下即委貢院選擇其日以前舉主最多者取三十人申奏降指揮下本貫敦遣赴闕若舉主數同者即以發狀先後為次謂若俱有三人舉主則取第三狀日月在前者仍於進士奏名額内减三十人候到闕日或陛下臨軒親試或委中書門下試經義䇿一道時務䇿一道但以義理優長為上不取文辭華美若所對經義乖戾聖意及時務全不通曉方行黜落其及第授官並與進士第一甲同在明經之上仍於告身前列坐舉主姓名其所舉之人若犯私罪情理重及正入已贓未及第者舉主減三等已及第者減一等坐之並不以赦原其公罪及私罪情理輕者舉主不坐其未舉以前若曽犯罪除公案見在證騐明白外舉主亦不坐即因勢要屬請求舉及為人屬請并受屬請而舉之者並科違制之罪受􅂍者並以枉法}
