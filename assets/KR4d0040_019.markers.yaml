  - {type: variant, offset: 4901, length: 2, content: 集卷, WYG: 辭華靡記誦雜傳為賢􅝲所試文辭臣不敢復言但見其指陳朝廷得失無所顧慮於四人之中最為切直今若以此不䝉甄收則臣恐天下之人皆以為朝廷虚設直言極諌之科而􅝲以直言被黜從此四方以言為諱其於聖王寛明之德虧損不細臣區區所憂正在於此非為臣已考為髙等苟欲遂非取勝而已也伏望陛下察臣愚心特收􅝲入等使天下之人皆曰􅝲所對事目雖有漏落陛下特以其切直收之豈不美哉乞免北使状嘉祐六年閏八月六日上右臣竊知已降勅命差臣充北朝國信使臣縁名犯北朝諱所行文字雖可以更改竊慮臨時語言不能記憶或有觸犯兼臣體羸多病性不耐寒若渉窮荒必生疾病非敢自愛恐於王事有所廢闕伏望聖慈矜憫别賜差官在於愚臣實為至幸}
  - {type: page-break, offset: 4901, content: '', id: KR4d0040_WYG_022-6a, image: WYG1094/WYG1094-0226c.png}
  - {type: page-break, offset: 4901, content: '', id: KR4d0040_WYG_022-6b, image: WYG1094/WYG1094-0226d.png}
  - {type: variant, offset: 4904, length: 0, content: '', WYG: 二狀尋改差人右臣先曽奏乞免充北朝國信使至今未奉朝㫖竊以專對之任亦須擇才臣不惟名犯北朝諱及性不耐寒兼臣不經接伴未能諳練南北事體資性拙訥恐辱王命伏望聖慈矜察早賜選差曽經接伴之人充國信使所貴臨事不至闕誤論燕飲狀嘉祐六年與王樂道同上右臣等竊見今嵗以來災異屢臻日食地震江淮騰溢風雨害稼民多菜色此正陛下側身克己眚禮蕃樂之時而道路之言皆云陛下近日宫中燕飲㣲為過差賞賚之費動以萬計耗散府庫調斂細民况酒之為物傷性敗徳禹湯所禁周公所戒殆非所以承天憂民輔養聖躬之道也陛下恭儉之徳彰信兆民議者皆以為後宫奢縱務相誇尚左右近臣利於賞賚陛下重違其請屈意從之夫天以剛健為徳君以正固為事柰何狥後宫左右之欲上忽天戒下忘民病中不為宗廟社稷深自重惜臣等愚惑竊為陛下不取也伏望陛下當此之際悉罷燕飲安神養氣後宫妃嬪進見有度左右小臣賞賚有節及厚味腊毒之物無益奉養者皆不冝數御以傷天和乃可以解皇天譴告之威慰元元困窮之望保壽命無疆之休天下羣生不勝幸甚臣等區區納忠忘死惟陛下裁察論兩府遷官狀右臣伏見朝廷因進用宰臣韓琦等凡兩府之臣盡遷一官臣愚不明大體未識所謂竊恐從此相承遂為故事凡公卿者百吏之表率今國家方以百吏繁冗思革其弊而公卿無故一切遷官將何以使三百赤芾受爵不讓者有所愧心哉况慶厯中陛下以數月不雨執政之臣皆降一官以荅天戒今嵗日食地震河及江淮汎溢横流烈風淫雨賊傷五稼四方之民墊溺流餓不可勝紀比於慶厯災害尤衆而兩府大臣無問新舊皆被褒遷殆非所以仰承天心下慰衆庻之意也竊計大臣當此之際亦必不敢受無名之賞伏望陛下因其辭讓内惟樞密使副使不可以給諌及即中為之者依舊制外其餘皆不遷官以飬大臣廉讓之節無使之負謗於海内則其為徳澤愈厚矣論夜開宫門狀有㫖劄送皇城司右臣竊聞今月二}
