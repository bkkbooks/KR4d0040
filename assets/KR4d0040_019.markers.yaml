  - {type: variant, offset: 31, length: 1, content: 乞, WYG: 孫萬世如泰山之不可揺也於是有驕墮之心生驕者玩兵黷武窮泰極侈神怒不恤民怨不知一旦渙然四方糜瀆秦隋之季是也惰者沈酣宴安慮不及逺善惡雜揉是非顛倒日復一日至於不振漢唐之季是也二者或失之彊或失之弱其致敗一也斯不亦守之至艱乎臣竊觀自周室東遷以來王政不行諸侯並僭分崩離析不可勝紀凡五百有五十年而合於秦秦虐用其民十有一年而天下亂又八年而合於漢漢為天子二百有六年而失其柄王莽盗之十有七年而復為漢更始不能自保光武誅除僭偽凡十有四年然後能一之又一百五十有三年董卓擅朝州郡瓦觧更相吞噬至於魏氏海内三分凡九十有一年而合於晉晉得天下纔二十年惠帝昏愚宗室皆構難羣胡乗釁濁亂中原散為六七聚為二三凡二百八十有八年而合於隋隋得天下纔二十有八年煬帝無道九州幅裂八年而天下合於唐唐得天下一百有三十年明皇恃其承平荒於酒色養其疽嚢以為子孫不治之疾於是漁陽竊發而四海横流矣肅代以降方鎮跋扈號令不從朝貢不至名為君臣實為讎敵陵夷衰㣲至於五代三綱頺絶五常殄滅懐璽未煖䖏宫未安朝成夕敗有如逆旅禍亂相尋戰争不息流血成川澤聚骸成丘陵生民之類其不盡者無幾矣於是太祖皇帝受命於上帝起而拯之躬擐甲胄櫛風沐雨東征西伐掃除海内當是之時食不暇飽寢不遑安以為子孫建太平之基大勲未集太宗皇帝嗣而成之凡二百二十有五年然後大禹之迹復混而為一黎民遺種始有所息肩矣由是觀之上下一千七百餘年天下一統者五百餘年而已其間時時小有禍亂不可悉數國家自平河東以來八十餘年内外無事然則三代以來治平之世未有若今之盛者也今民有十金之産猶以為先人所營苦身勞志謹而守之不敢失墜况於承祖宗光美之業􅍕有四海傳祚萬世可不重哉可不慎哉夏書曰予臨兆民懔乎若朽索之馭六馬周書曰心之憂危若蹈虎尾渉於春冰臣願陛下夙興夜􅄰兢兢業業思祖宗之勤勞致王業之不易援古以鍳今知太平之世難得而易失則天下生民至於鳥獸草木無不幸甚矣惜時夏至陽之極也而一隂生冬至隂之極也而一陽生故盛衰之相承治亂之相生天地之常經自然之至數也其在周易泰極則否否極則泰豐亨冝日中孔子傳之曰日中則昃月盈則食天地盈虚與時消息而况於人乎况於鬼神乎是以聖人當國家隆盛之時則戒懼彌甚故能保其令問永乆無疆也凡守太平之業者其術無他如守巨室而已今人有巨室於此將以傳之子孫為無窮之規則必實其堂基壯其柱石彊其棟梁厚其茨葢髙其垣墉嚴其闗鍵既成又擇子孫之良者使謹守之日}
