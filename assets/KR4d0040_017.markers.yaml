  - {type: line-break, offset: 0, content: '', id: KR4d0040_SBCK_017-1a01}
  - {type: variant, offset: 0, length: 2174, content: 温國文正公文集卷第十七奏章二第三狀論屈野河西修堡狀二道乞􅉑州三狀辭修注五狀第三狀先於六月十九日八月一日两曽上言乞擇宗室賢者進而用之蓋以上則輔衛聖躬下則鎮安百姓迄今未聞聖朝少垂采聽臣誠愚昧不逹國家髙逺之意若臣所言非邪當明治其罪以示天下若其是邪亦謂聖心不冝弃忽豈可直以臣之愚賤不察其言若投羽毛於滄海之中杳然莫知其所之豈踈逺所望哉臣不勝憤懣敢復剖析肝膽陳布以聞雖抵罪萬死亦無怨悔臣聞書曰逺乃猷詩云猶之未逺是用大諌凡國家之弊在於樂因循而多忌諱不於治安之時豫爲長逺之謀此患難所從而生也竊觀漢室以至有唐簡䇿所載帝王即位則立太子此乃古今不易之道也其或謙譲未暇則有司請之所以尊宗廟重社禝皆國家莫大之慶未聞人主以爲諱惡也及唐中葉以來人主始有惡聞立嗣者群臣莫敢發言言則刑戮隨之是以旤乱相㝷不可復振殊不知本強則茂基壯則安此乃國家所當深鑒而不足以爲法也今天下之人上自公卿下至庻人苟有知識忠於國家者其心皆知當今之務無此爲大無此爲急然而各畏忤旨之誅莫敢進言臣獨不愛犬馬之軀爲陛下言之陛下豈可不少留聖思而聽察之邪臣甞歴觀春秋以來迨至國𥘉積一千六百餘年其間天下混一内外無患兵寢不用者不過四百餘年而已至如聖朝芟夷僣亂壹統四海内平外順上安下和使在朝在野之人自祖及孫耳目相傳不識戰闘蓋自上世以來治平之乆未有若今之盛者也竊見國家於州縣倉庫斗粮尺帛未甞不嚴固扄鐍擇人而守之況如是融明閎茂之業豈可不謹擇親戚可信任者使助陛下守之乎此則賢愚之人所共爲陛下重惜者也陛下當此之時頥指如意不早決至䇿以固萬丗不拔之基獨不念太柤太宗跋履山川經營天下真宗宵衣旰食以致太平之艱難乎此臣所以夙夜遑遑起則思之卧則夢之感嘆涕泗不能自巳不避煩瀆之誅再三進言者也或者謂臣身賤居外而言朝廷之事侵官也臣愚以爲治古諌爭無官自公卿大夫士至於庻人百工啇旅矇瞍芻蕘無有不得言者所以逹下情而察國政也若置官而守之非其官者皆不得言則下情壅而不通如是則國家雖有迫切之憂行道之人皆知之而在上者莫得聞也此其爲害豈不深乎況臣食陛下之禄於今三世矣先臣某以廉直恬退特爲陛下所知擢自孤微升之侍從此恩之重子子孫孫何時敢忘而又陛下曏以水災親下明詔延訪中外勤求得失臣獨何人身逢盛際捨此大節隐而不言其餘瑣碎豈足道哉抑又聞之元后作民父母陛下臣父也安有爲人之子見危而不告其父乎伏望陛下察臣區區之心不爲私其一身不惜少頃之間取臣前後所奏略賜省覧其中萬一苟有可施行者乞以陛下之意断而行之宣告中外使逺近渙然無復憂疑則自然神靈恱於上而災異伏衆庶喜於下而姦宄消至於草木昆蟲靡不蒙𬒳其福其爲功業豈不盛哉夫時者難得而易失惟陛下早留神詳察論屈野河西修堡狀竊以爲人臣者事君不避難有罪不逃刑臣先任通判并州軍州事准經略司牒差往麟州勾當公事其屈野河西一帶田土積年以來爲夏虜所侵臣委曲詢訪本州當職官吏以虜之侵盗爲日巳乆諭之以理則不肯退縮逼之以兵則動成戰闘召之重定界至則偃蹇不來春種秋穫無有巳期如何區處可以不戰而得所侵之地其本州官吏爲臣言州城之西臨屈野河自河以西直抵界首五六十里並無堡障斥候以此虜得恣耕其田逰騎往往直至城下或過城東州人不知去歳巳於河西置一小堡以處斥候之人亦曽申經略司乞於其西増置二堡㑹今春以来虜騎屯聚徧滿河西經略司牒令候西人退散別申取指揮今虜衆盡已退去自州城以西至大横水爽平數十里間絶無一人一騎若乗此際急於州西二十里左右増置二堡每堡不過十日可成比至虜中再行點集此堡巳皆有備虜不能爲害如此則麟州永無侵軼之虞州兵出入有所宿頓堡外先侵之田虜皆不能耕種臣之愚心亦以爲國家固爭屈野河西田者非少此尺寸之地蓋以虜侵耕至河則麟州孤危果能成此二堡以爲麟州耳目藩蔽於事誠便遂㱕貝以官吏所言白於龐籍籍用臣言即牒麟州令依前申修築二堡仍令精加探候廣設隄俻戒諭約束莫非丁寕蓋欲乘間急修故不暇取旨俟報但曽奏知而已不期滿到之後元末興修虜衆已復大集於五月五日彼處兵官引一千許人夜開城門徑往屈野河西前無探候後無䇿應中無部伍但賫酒食不爲戰備以此逢敵如何不敗遂令所謀之事悉皆無成此乃諸將恃勇輕敵臨事無備之所致本非修堡之過況自元昊納欵以來麟州修建堡寨及出兵過屈野河西前後非一雖與虜遇未甞敗北明知今日之敗在於無備不在修堡與過河也然臣竊聞議者乃以龐籍爲擅修堡寨引惹邊事臣伏自惟省本因臣與麟州官吏啇量傳道其言逹於龐籍籍未甞身至河西周知利害皆臣愚戇思慮不熟䡖議大事當伏重誅今乃使議者悉歸咎於龐籍臣豈敢晏然不言苟求自脫上負聖朝死有餘責臣雖小人義不忍爲伏望陛下察龐籍本心欲爲國家保固疆圉發於忠赤不顧身謀過聽臣言以至於此獨治臣罪以正典刑雖蹈鼎鑊亦無所畏干冒宸嚴臣無任戰汗激切屏營之至第二狀右臣先曽奏陳爲麟州修堡事乞獨治臣罪至今未奉朝旨今竊知龐籍移知青州夏倚等各有責降臣伏自惟念若朝廷不以修堡爲非龐籍等必不受責若以爲非則龐籍先巳指揮麟州罷修此堡因臣至彼見虜騎退散方議再修武戡夏倚等雖建此䇿因臣至彼傳導其言方得逹於龐籍由是言之修堡之事皆臣所致若治其罪臣當爲首今龐籍等先受其責而未蒙譴罰臣實内慙無以自處況臣在并州日受經略司牒管勾夲司要重公事龐籍凡處置邊事未甞不詢及於臣采用其說臣亦夙夜竭盡愚慮知無不言庻幾恊心禆𥙷國家有萬一之益今乃以智識淺短思慮不精上爲朝廷之憂下爲龐籍之累若復苟求自脫不即大誅是臣以蕞爾之軀虧國家至平之法罪舋愈重不容於死伏望聖慈察臣前後所陳夲未事理嚴賜誅譴以正刑書不勝幸甚干冒宸嚴臣無任惶恐屏營之至謹貝狀奏聞伏候勅旨乞􅉑州狀, WYG: ''}
