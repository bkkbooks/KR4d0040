  - {type: variant, offset: 5141, length: 0, content: '', WYG: 脉能知災福今亦出入禁庭叨忝章服察其療疾實無所益伏乞奪去紫衣放歸本州凡用醫之道在謹擇其人而專任之然後良工得盡其術而功效可見今聞診御脉者常以十數工拙相雜是非混殽發言進藥更相倚伏前䟦後疐左瞻右顧雖有俞扁之術將安所施於是彊者自專弱者附㑹雷同比周共為誣罔不顧聖體但為身謀俱云脉氣平和臟府無疾然而旁側衆人竊觀形證豈得為安寜復舊如醫官所言哉日月愈深根柢益固四海憂畏焦心墜膽臣愚伏望陛下思一身之安危繫羣生之禍福深自重惜不可因循博訪亰邑四方通醫術者精擇一人使之專診御脉聽用其言服食其藥若旬月之間全無應效則斥去不用别更擇人如此必遇良醫痊復有日臣不勝區區伏望聖慈少加采察天下幸甚取進止言}
