  - {type: variant, offset: 3942, length: 0, content: '', WYG: 言趙滋第二劄子臣先曽上言趙滋為人剛愎不可管軍朝廷不以為信臣亦自恐聞聽未審不敢復有所陳自後又聞滋對契丹使人禮貎驕倨不遵舊式近者又聞本路帥臣奏滋任意行事恐致引惹竊以㬌徳以前契丹未和親之時戎車嵗駕疆埸日駭乗輿暴露於澶淵敵騎慿陵於齊鄆兩河之間暴骨如莽先帝深惟安危之大體得失之至計親屈帝王之尊與之約為兄弟嵗捐金帛以餌之聘問往來待以敵國之禮陛下承統一遵故約夫豈以此為不辱哉志存生民故也是以兵革不用百姓阜安垂六十年今契丹所以事中國之禮未有闕也為邊臣者當訓卒乗繕器械以戒不虞厚饔餼慎威儀以待使者内不失備外不失好以副朝廷之意而已今滋數乗客氣以傲使人争小勝以挑强胡苟為夸大於目前以求一時之聲名而不顧國家永久之患臣恐釁隙一開則朝廷未得髙枕而臥也昔孫蒯毁缾而曹衛構難鄫人漚菅而魯國喪邑渉佗捘手而晉失諸侯女子争桑而呉師入郢故禍常起於細微而事或生於所忽凡二國所以相交之道不可以不慎也雄州當虜之衝平居則行李之所往來有事則戎馬之所出入典州之將不可不精擇其人滋禀性狂狠恐不可久置於彼乞落軍職徙之内地毋使邊將相效為國生事實天下幸甚取進止乞撤去}
