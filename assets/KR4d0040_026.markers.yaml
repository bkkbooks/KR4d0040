  - {type: variant, offset: 3153, length: 413, content: 臣伏見舊醫官宋安道等四人昨以侍先帝醫藥無狀降授諸州散官㝷以陛下聖體不安大臣憂恐權留安道等診候御脉今巳百有餘日陛下聖體終未平復安道等方術無驗較然可知而其人皆得罪於先帝臣謂陛下不冝赦其罪戾留在京師並乞發遣令赴貶所僧志縁本不曉醫但以妖妄惑人於江淮之間稱是診人六脉能知災福今亦出入禁庭叨忝章服察其療疾實無所益伏乞奪去紫衣放歸本州凡用醫之道在謹擇其人而專任之然後良工得盡其術而功効可見今聞診御脉者常以十數工拙相雜是非混殽發言進藥更相倚仗前䟦後疐左瞻右顧雖有俞扁之術將安所施於是彊者自專弱者附㑹雷同比周共爲誣罔不顧聖體但爲身謀俱云脉氣平知藏府無疾然而旁側衆人竊觀形證豈得爲安寧復舊如醫官所言哉日月益深根柢益固四海憂畏焦心墜膽臣愚伏望陛下思一身之安危繫群生之禍福深自重惜不可因循愽訪京邑四方通醫術者精擇一人使之專診御脉聽用其言服食其藥若旬日之間全無應効則斥去不用别更擇人如此必遇良醫痊復有日臣不勝區區伏望聖慈少加采察天下幸甚取進止西路旱劄子, WYG: 嘉祐八年}
