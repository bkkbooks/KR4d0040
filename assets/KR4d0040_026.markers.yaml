  - {type: variant, offset: 5140, length: 0, content: '', WYG: 八欽定四庫全書傳家集巻二十九宋司馬光撰章奏十二言醫官劄子嘉祐八年九月一日上臣伏見舊醫官宋安道等四人昨以侍先帝醫藥無狀降授諸州散官尋以陛下聖體不安大臣憂恐權留安道等診候御脉今已百有餘日陛下聖體終未平復安道等方術無驗較然可知而其人皆得罪於先帝臣謂陛下不宜赦其罪戾留在亰師並乞發遣令赴貶所僧志縁本不曉醫但以妖妄惑人於江浙别本作淮之間稱是診人}
