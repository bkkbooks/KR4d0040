  - {type: variant, offset: 1017, length: 316, content: 祔廟議禮天子七廟三昭三穆與太祖之廟而七太祖之廟萬丗不毀其餘昭穆盡則毀之示有終也自漢以來天子或起於布衣以受命之𥘉太祖尚在三昭三穆之次故或祀四丗或祀六丗其太祖以上之主雖屬尊於太祖親盡則遷故漢元帝之丗太上廟主瘞於寢園魏明帝之丗處士廟主遷於園邑晉武帝祔廟遷征西府君惠帝祔廟又遷豫章府君自是以下大扺過六丗則遷其神主蓋以太祖未正東嚮之位則止祀三昭三穆若太祖巳正東嚮之位則并三昭三穆為七丗矣唐髙祖𥘉立祀四丗太宗増祀六丗及太宗祔廟則遷洪農府君神主於夾室髙宗祔廟又遷宣皇神主於夾室皆祀六丗此前代之成法也惟明皇立九室祀八丗事不經見難可依據今若以太祖太宗爲一丗則大行皇帝祔廟之日僖祖親盡當遷於西夾室祀三昭三穆於先王典禮及近丗之制無不符合太廟更不須添展一室, WYG: ''}
