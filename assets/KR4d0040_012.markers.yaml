  - {type: line-break, offset: 0, content: '', id: KR4d0040_SBCK_012-1a01}
  - {type: variant, offset: 0, length: 1803, content: 温國文正公文集卷第十二律詩七遊瀍上劉氏園題致仕李太傅園亭早行送羅郎中登管句玉局觀酬終南閻諌議詢字議道見寄寄成都呉龍圗同年花庵獨坐秋夜花庵二首和楊卿中秋月樂和邵堯夫秋霽登石閣和河陽王宣徽拱辰字君貺九日平嵩閣宴集和任開叔觀福嚴院舊題名柏梯寺平日遊園常䇿笻杖秋來發篋復出貂褥二物皆景仁所貺賭物思人斐然成詩雲閑來贈邵尭夫花庵多牽牛清晨始開日出巳瘁花雖甚美而不堪留賞送劉仲通赴京師送稻醴與子才重過華下和李君錫惠書及詩勉以早歸和君錫雪後招探春送祖擇之和宋子才致仕後歳旦見贈上元書懷喜才元過洛小詩招飲仲庻同年兄自成都移良安以詩寄賀西臺詩二十四韻和邵尭夫年老逢春和范㬌仁謝寄西遊行記又獨歩至洛濵又送酒與范尭夫再和尭夫年老逢春又和來韻邵尭夫許來石閣乆待不至石閣春望和邵尭夫安樂􅌪中職事吟聞蟬鎮和光宿憇鶴寺鎮和光遊噴玉潭其日大風光鎮和鎮光遊山呈景仁景仁六十三致仕光壽安鎮和光噴玉潭光和鎮疊石溪二首光和鎮疊石溪鎮和光應天院朝拜同呈景仁光明日相陪送客水北始次元韻奉呈君實鎮鎮卜居許下雖未有涯先作五十六言奉寄子華相公持國端明玉汝待制和景仁卜居許下景仁頃見許居洛今而倍之故詩中頗致其怨光喜兩三首呈景仁侍郎兼獻大尹宣徽和鎮亨𣏌下第作詩示之景仁思歸雨未克行以詩留之送景仁至丁正臣園寄主人和君貺老君廟姚黄牡丹又和董氏東園檜屏石牀遊瀍上劉氏園日暖孤臺逈露濃幽徑微茅齋舉白飲沙溆踏青歸照水清滿眼穿林香濕衣莫言春尚淺巳有杏花飛題致仕李太傳園亭漢家飛將種氣槩耿清秋解去金貂貴來從洛社遊清啇擁髙宴華館帶長流可笑班超老﨑嶇萬里侯早行寒犬吠柴門荒雞鳴逺村河聲空自急月影不曽渾木末星猶白榛中露巳繁客心獨惆悵四顧與誰言送羅郎中登管勾玉局觀官名爲玉局巳與俗塵踈鍾岀寒松逈香凝古殿虗郷閭非甚逺俸禄豈無餘誰道神仙樂神仙恐不如酬終南閻諫議詢字議道見寄閑官飬不才弊廬容嘯傲清洛伴歸來故友猶相念寒光生死灰疑闕寄成都吴龍圗同年照席燭花煖隨車劒騎寒江山資秀句風月助清歡政簡坤維靜仁深井絡安行歌與獨酌豈得並閑官花庵獨坐荒園才一畝意足巳爲多雖不居丘壑常如隠薜蘿忘機林鳥下極目塞鴻過爲問市朝客紅塵深幾何秋夜浮雲一消散星斗粲長天浩露灑翠柏清香生白蓮體凉猶衣葛耳靜巳無蟬坐乆群動息秋空唯寂然平日遊園常䇿笻杖秋來發篋復出貂褥二物皆景仁所貺睹物思人斐然成詩笻枝攜巳乆貂褥展猶新漸染岷山雪拂除京國塵危扶醉歸路穩稱病來身頼此齋中物時如見故人雲晴空碧於水那得片雲飛映日成丹凰隨風變白衣去來皆絶迹隠顯兩忘機天理誰能測終然何所歸閑來閑來觀萬物在處可逍遥魚爲貪鈎得蛾因赴火焦碧梧飢鸑鷟白粒飽鷦鷯帶索誰家子行歌復采樵贈邵堯夫家雖在城闕蕭瑟似荒郊遠去名利窟自稱安樂巢雲歸白石洞鶴立碧松梢得喪非吾事何湏更解嘲花庵多牽牛清晨始開日出巳瘁花雖甚羙而不堪留賞望逺雲凝岫粧餘黛散鈿縹囊承曉露翠蓋拂秋煙嚮慕非葵比彫零在槿先才供少頃玩空廢日髙眠送劉仲通赴京師聖朝方考牧畨育寄才能屢別良可嘆閑遊不復曽行塵遵洛汭朝騎對觚稜瀍上秋臺逈歸來正好登送稻醴與子才昔賢尊道誼置醴待嘉賔今我樂閑放提壷餉故人螘浮盃同白味撇甕頭醇何以助髙興籬邊菊蘂新花庵二首誰謂花庵小纔容三兩人君看賔席上經月有凝塵誰謂花庵陋徒爲見者嗤此中勝廣厦人自不能知和楊卿中秋月秋氣平分夜沈隂乍散天窺林𥘉淡薄照席怱孤圎冷入詩毫徤光浮醉弁偏韋賔勿輕去桂影正姢姢樂吾心自有樂丗俗豈能知不及老萊子多於榮啓期緼袍寛稱體脫粟飽隨冝乗興輙獨往携笻任所之和邵尭夫秋霽登石閣飛􅉉危檻出林端王屋嵩丘咫尺間獨愛髙明遊佛閣豈知憂喜滿塵寰目窮莾蒼纎毫盡身得逍遥萬象閑暇日登臨無厭數悲風殘葉巳珊珊先生冬夏俱不出和河陽王宣徽拱辰字君貺九日平嵩閣宴集九日英僚集千秋勝賞同飛橋貫河渚危閣壓霜風金散黄花泛雷驚疊皷通百常髙鳥外萬里寸眸中檻底臨丹葉盃中倒碧嵩來雲仾拂座去鴈逺沈空吹帽陪遊阻揺旌結想叢風流免堙滅鄒湛倚羊公和任開叔觀福嚴院舊題名墨蹤塵淡鬢華新猶喜重來值故人二十二年如轉目洛陽不改舊時春柏梯寺鑿石開蹊峻登崖置閣危笑談空谷應歩武白雲隨衆壑如翻浪鄰州若布棊何當遂棲隠身丗兩相遺重過華下昔辭蓮幕去三十四炎涼舊物三峯雪新悲一鑷霜雲低秦野闊木落渭川長欲問當時事無人獨歎傷和李君錫惠書及詩勉以早歸書意勤渠詩意新清如白雪煖如春西遊不盡谿山樂䇿馬歸來就故人和君錫雪後招探春莫嫌微雪壓梅牙巳有歸鴻泊浦沙天上詔來難乆駐直須早㸔洛陽花繁霙回夜色凌亂落春雲虚幌寒相襲華堂靜不聞玉巵深可敵銀燭近微分誰念牛衣客窮經白髮紛送, WYG: ''}
