body:
  text: 章奏二十五論召陜西邉臣劄子體要疏論召陜西邉臣劄子熙寧二年六月臣嚮任御史中丞日聞國家招納夏國降民曽上言方今百職未舉庶政未修百姓未安倉庫未實將師未選軍法未立士卒未練器械未精八事不完不可興兵智慮迃疏不合聖心俄而种諤等起綏州之役楊定為夏虜所殺陜西騷然困于餽戍朝廷悔前之失故謪降种諤等以謝夏虜再三招撫方䏻得其稱臣奉表遵舊約朝廷特遣使者以誓詒冊命及金帛雜物賜之尚未返命今竊聞陛下復召种諤等詣闕引對不知陛下𣣔何所興為中外聞者無所寒心夫布衣不守信義猶見輕于鄉黨况王者臨御四夷當叛則威之服則懷之使信義之眀皎如日月若戎狄幸而臣服無故擾之及其背誕則從而嫗煦之得其臣服又從而擾之其于信義威懷如何哉國家以信義臣畜戎狄百有餘年前日种諤等舉而棄之興兵掩其不備以邀一時之功僅䏻得不食之地百餘里飢虜萬餘人耳今地則歸之虜庭民則逃散略盡朝廷有所何得而發兵守衛轉粟饋餉公私之費以巨萬計其為失策豈不昭然今瘡痍未復憂患未弭臣前所言八事一無所修虜疑忌中國警備巳嚴怨毒之心蓄而未發諤等乃欲復為前日所為臣見其無復綏州之㓛而必有大敗覆沒之事兵連禍結不可救解公私困竭盜賊將生此乃社稷之憂非獨邉鄙之患也孔子曰過而不改是謂過矣伏望陛下留神深念至于再至于三當先修內政未可輕議用兵實天下幸甚取進止體要疏熙寧二年八月五日上月日具位臣司馬光謹昧死再拜上疏皇帝陛下臣准御史臺牒伏奉四月二十日詔勑傳曰近臣盡規以其榮耻休戚與上同也今在此位者視朕過失與朝廷政事之闕默而不言乃或私議竊歎若以為其責不在已夫豈皆習見成俗以為當然其亦有含章懷寶待唱而發者也今百度隳弛風俗偷惰薄惡烖異譴告不一此誠忠賢助朕憂惕以創制改法救幣除患之時冝令侍從官自今視朕過失與朝廷政事之闕無有臣細各具章奏極言無隱噫言善而不用朕有厥導之而不言爾為不恭朕將用此考察在位所以事君之實眀黜陟焉臣以駑下之材自仁宗皇帝時蒙擢在侍從服事三朝恩隆德厚隕身喪元不足為報雖訪問所不及猶將披肝瀝膽以效其區區之忠况聖意采納之勤督責之嚴諄諄如此臣敢營私避怨匿情愛已不為陛下别白當今之切務庶幾少𥙷萬分之一邪臣聞為政有體治事有要自古聖帝明王垂拱無為而天下大治者凡用此道也何謂為政有體君為元首臣為股肱上下相維內外相制若網之有綱絲之有紀故詩云勉勉我王綱紀四方又云豈弟君子四方之綱故古之王者設三公九卿二十七大夫八十一元士以綱紀其內設方伯州牧卒正連帥屬長以綱紀其外尊卑有叙若身之使臂臂之使指莫不率從此為政之體也何謂治事有要夫人智有分而力有涯以一人之智力兼天下之衆務𣣔物物而知之日亦不給矣是故尊者治衆卑者治寡治衆者事不得不約治寡者事不得不詳約則舉其大詳則盡其細此自然之勢也益稷曰元首眀哉股肱良哉庶事康哉言君明則䏻擇臣臣良則能治事也又曰元首叢脞哉股肱惰哉萬事惰哉言君親細務則民不盡力而事廢壞也立政曰文王罔攸兼于庶言庶獄庶慎惟有司之牧夫是訓用違庶獄庶慎文王罔敢知于兹言文王擇有司而任之其餘皆不足知也康誥曰庸庸秪秪威威顯民言文王用其可用祇其可祇刑其可刑專眀此道以示民也是故王者之職在于量材任人賞功罰罪而已苟能謹擇公卿牧伯而屬任之則其餘不待擇而精矣謹察公卿牧伯之賢愚善惡而進退誅賞之則其餘不待進退誅賞而治矣然則王者所擇之人不為多所察之事不為煩此治事之要也臣竊見陛下日見視朝繼以經席將及日中乃還宫禁入宫之後竊聞亦不自閒省閲天下奏事羣臣章疏逮至昏夜又御燈火研味經史博觀群書雖中宗高宗之不敢荒寧文王之日昊不食臣以為不能及也然自踐祚以來孜孜求治於今三年而㓛業未著者殆未得其體要故也祖宗創業垂統為後世法內則設中書樞密院御史臺三司審官審刑等在京諸司外則設轉運使知州知縣等衆官以相統御上下有敘此所謂綱紀者也今陛下好使大臣奪小臣之事小臣侵大臣之職是以大臣解體不肯竭忠小臣諉上不肯盡力此百官所以弛廢而萬事所以墮頽者也而陛下方用為致治之夲此臣之所大惑也臣微賤不得盡知朝廷之事且以耳目所接近日數事臣所知者言之其餘陛下可以類求也昔漢文帝問陳􅊭天下一歲决獄及錢穀出入幾何􅊭曰陛下即問决獄責廷尉問錢榖責治粟內史必也使卿大夫各得任其職此乃宰相事也若􅊭者可謂能知治體矣今之兩府皆古宰相之任也中書主文樞密主武若乃百官之長非其人刑賞大政失其宜此兩府之責也至于錢穀之不充條例之不當此三司之事也陛下苟䏻精選曉知錢穀憂公忘私之人以為三司使副判官諸路轉運使各使久于其任以盡其䏻有功則進無功則退名不䏻亂實僞不䏻掩真安民勿擾使之自富處之有道用之有莭何患財利之不豐哉今乃使兩府大臣悉取三司條例别置一局聚文士數人與之謀議改更制置三司皆不與聞臣恐所改更者未必勝于其舊而徒紛亂祖宗成法考古則不合適今則非冝吏緣為姦農商失業數年之後府庫耗竭於上百姓愁困于下衆心離駭將不復振矣且兩府於天下之事無所不緦若百官之職皆使兩府治之則在上者不勝其勞而在下者為無所用矣又監牧使主養馬四園苑主課利今乃使監牧使不屬群牧司四園苑不屬三司提舉司則在下者各得專權自恣而在上者為無所用矣陛下方欲納天下於大治而使百官在上者不委其下在下者不禀其上能為治乎若此之類臣竊恐以未得其體也凡天下之事在一縣者當委之知縣在一州者當委之知州在一路者當委之轉運使在邊鄙者當委之將帥然後事乃可集何則久任其位識其人情知其物冝賞罰之權足以休戚所部之人使之信服故也今朝廷每有一事不委之將帥監司守宰使之自為不略責以成效而施其刑賞常好别遣使者銜命奔走旁午於道所至徒有煩擾之弊而於事未必有益不若勿遣之為愈也夫事之利害吏之能否皆非使者所能素知臨時詢采於人所詢者㦯遇公明忠信之人猶僅能得其一二或遇私暗姦險之人則是非為之倒置矣此二者交集於前而使者不能猝辨也是以往往害事而少能為益非將帥監司守宰皆賢而使者皆愚也纍歲之講求與一朝之議論積久之采察與目前之毀譽精粗詳略其勢不同故也其有居官纍歲而不知利害臨人積久而不知能否或雖知利害而不能變更雖知能否而不能黜陟此乃愚昧私曲之人朝廷當察而去之更擇賢者以代其位不當數遣使者擾亂其間使不得行其職業也又庸人之情苟䇿非己出則􅎱嫉沮壞惟恐其成官吏若是者十常五六借使使者所規畫曲盡其冝在彼之日其當職之人巳怏怏不恱不肯同心以助其謀協力以成其事曰朝廷自遣專使治之我何敢與知及返命之日彼必敗之於後曰使者既謀而授我我今竭力而成之功悉歸於首謀之人我何有哉此所以為不若毋遣使者而屬任當職之人為愈也夫使者所以通逺邇之情固不可無然今之轉運使即古使者之任苟得人而委之賢於暫遣使者逺矣若監司自為姦隱貪縱或有所隱蔽欺罔或為部內之人所訟或所謀畫之事未得其冝朝廷欲察其罪惡審其虛實判其曲直決其是非然後别遣使者案之若案得其實監司有罪則當刑不才則當廢豈有伹已者也今每有一事朝廷輒自京師遣使者往治之是在外之官皆無所用也使者既代之治事而當職之人亦無所刑無所廢是只使之拱手旁觀偷安竊祿者矣若此之類臣竊恐似宋得其體也今朝廷之士左右之臣皆曰陛下聰明剛斷威福在己太平之功可指日而致臣愚竊獨以為未也臣聞古之聖帝明王聞人之言則能識其是非故謂之聰觀人之行則能察其邪正故謂之明是非既辨邪正既分姦不能惑佞不能移故謂之剛取是而捨非誅邪而用正確然無所疑故謂之斷誅一不善而天下不善者皆懼故謂之威賞一有功而天下有功者皆喜故謂之福今陛下聰明剛斷則誠體之矣欲收威福之柄則誠有其志矣然於所以為之之道尚或有所未盡故臣以為太平之功未可期也夫帝王之道當務其逺者大者而略其近者小者國之大事當與公卿議之而不當使小臣參之四方之事當委牧伯察之而不當使左右覘之儻公卿牧伯尚不能擇賢者而任之小臣左右獨能得賢者而使之乎若苟為不賢則險詖私謁無不為巳今陛下好於禁中出手詔指揮外事非公卿所薦舉牧伯所糾劾或非次遷官或無故廢罷外人疑駭不知所從此豈非朝廷之士左右之臣所謂聰明剛斷威福在已者耶陛下聞其言而信之臣竊以為過矣夫公卿所薦舉牧伯所糾劾或謂之賢者而不賢謂之有罪而無罪皆有迹可見責有所歸故不敢大為欺罔若姦臣密白陛下令陛下自為聖意以行之則威福集於私門而怨謗歸於陛下矣安得謂之威福在陛下邪且陛下嚮時中詔所指揮者率非大事至於兩禁美官邊藩將帥省府職任諸路監司此皆衆人之所希求治亂之所繫屬當除授之際竊恐未必一一出聖志也若乃姦邪貪猥之人陛下所明知而黜去者或更改官而升資或不久復進用然則威福之柄果不在陛下而陛下偶未思也以此觀之靣譽陛下聰明剛斷威福在己太平可立致者非愚則諛不可不察也陛下必欲威福在己曷若謹擇公卿大臣明正忠信者留之愚昧阿私者去之在位者既皆得其人矣然後凡舉一事則與之公議於朝使各言其志陛下清心平慮擇其是者而行之非者不能復奪也凡除一官亦與之公議於朝使各舉所知陛下清心平慮擇其賢者而用之不肖者不能復爭也如此則謀者舉者雖在公卿大臣而行之用之皆在陛下安得謂之威福不在己邪陛下此之不為而顧彼之久行臣竊恐似未得其要也夫三人群居無所統一不散則亂是故立君以司牧之群臣百姓勢均力敵不能相治故從人君決之人君者固所以决是非行刑貴也若人君復不肯决當使從誰决之乎夫人心不同如其靣焉國家凡舉一事朝野之人必或以為是或以為非凡用一人必或以為賢或以為不肖此固人情之常自古而然不足怪也要在人主審其是非而取捨之取是而捨非則安榮取非而捨是則危辱此乃安危榮辱之所以分也是以聖王重之故傳謀群臣下及庶人然而終决之者要在人君也古人有言曰謀之在多斷之在獨謀之多故可以觀利害之極致斷之獨故可以定天下之是非若知謀而不知斷則群下人人各欲逞其私志斯衰亂之政也詩云謀夫孔多是用不集發言盈庭誰敢執其咎如匪行邁謀是用不得于道哀哉為猷匪先民是程匪大猷是經維邇言是聽維邇言是爭如彼築室于道謀是用不潰于成此言周室之衰人臣不知先王之大道務爭近小之事人君不能定其可否而事終無成也漢丗國家有大典禮大政令大刑獄大征伐必下公卿大夫博士議郎議其議者固不能一必有叄差不齊者矣於是天子稱制決之曰丞相議是或曰廷尉當是而群下厭然無有不服者矣今陛下聽群臣各盡其情以議事此誠善矣然終不肯以聖志裁決遂使群臣有尚勝者以巧文相攻辨口相擠至于再至于三互相反覆無有限極臣愚深恐虧朝廷之政體損陛下之明德流聞四方取輕夷狄非嘉事也夫天下之事有難決者以先王之道揆之若權衡之於輕重規矩之於方圎錙銖毫忽不可欺矣是以人君務明先王之道而不習律令知夲根既殖則枝葉必茂故也近者登州婦人阿云謀殺其夫重傷垂死情無可愍在理甚明巳傷不首於法無疑中材之吏皆能立斷事巳經審刑院大理寺刑部斷為死罪而前知登州許遵文過飾非妄為巧說朝廷命兩制定奪者再命兩府定奪者再勑出而復收者一收而復出者一爭論縱橫至今未定夫以田舍一婦人有罪在於四海之廣萬機之衆其事之細何啻秋毫之末朝廷欲斷其獄委一法吏足矣今乃紛紜至此設更有可疑之事大於此者將何以決之夫執條據例者有司之職也原情制義者君相之事也分爭辨訟非禮不㳏禮之所去刑之所取也阿云之事陛下試以禮觀之豈難決之獄哉彼謀殺為一事為二事謀為所因不為所因此苛察繳繞之論乃文法俗吏之所事豈明君賢相所當留意邪今議論嵗餘而後成法終於棄百代之常典悖三綱之大義使良善無告姦凶得志豈非徇其枝葉而忘其夲根之所致邪若此之類臣竊恐似未得其要也此皆衆人之所私議竊歎而莫敢明言者臣以獨受恩深重不顧斧鉞為陛下言之惟聖明裁察臣光昧死再拜以聞皇帝陛下溫國文正公文集卷第四十
